 MOD_DESCRIPTION_EMPTY: "Введите краткое описание."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_ENABLED: "Моды в этом наборе автоматически упорядочиваются в соответствии с их зависимостями."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_DISABLED: "Порядок загрузки модов в этом наборе задаётся вручную и не будет изменяться автоматически."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_BUTTON: "Автоматический порядок загрузки"
