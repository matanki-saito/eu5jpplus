l_german:
 MOD_BACKEND_NOT_AVAILABLE_STEAM: "Steam Workshop ist nicht verfügbar. Mods können nicht hochgeladen oder aktualisiert werden. Bitte stellen Sie sicher, dass der Steam-Client läuft und Sie über eine Internetverbindung verfügen, und starten Sie dann das Spiel neu."
 MOD_NAME_INVALID_SIZE: "Der Name muss zwischen 3 und 60 Zeichen lang sein."
 MOD_PATH_EMPTY: "Bitte geben Sie den Pfad ein, unter dem Ihr Mod-Stub erstellt wird oder von dem aus Ihr Mod hochgeladen wird."
 MOD_PATH_INVALID: "Der Mod-Pfad enthält ungültige Zeichen."
 MOD_DESCRIPTION_EMPTY: "Bitte geben Sie eine kurze Beschreibung ein."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_ENABLED: "Mods in diesem Playset werden automatisch anhand ihrer Abhängigkeiten neu angeordnet."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_DISABLED: "Die Ladereihenfolge der Mods in diesem Playset wird manuell verwaltet und nicht automatisch neu angeordnet."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_BUTTON: "Automatische Ladereihenfolge"
