l_french:
 MOD_BACKEND_NOT_AVAILABLE_STEAM: "Le Steam Workshop n'est pas disponible. Les mods ne peuvent être ni téléchargés ni mis à jour. Veuillez vous assurer que le client Steam est en cours d'exécution et que vous disposez d'un accès à internet, puis redémarrez le jeu."
 MOD_NAME_INVALID_SIZE: "Le nom doit comporter entre 3 et 60 caractères."
 MOD_PATH_EMPTY: "Veuillez indiquer le chemin où l'ébauche de votre mod sera créée, ou depuis lequel votre mod sera téléversé."
 MOD_PATH_INVALID: "Le chemin du mod contient des caractères non autorisés."
 MOD_DESCRIPTION_EMPTY: "Veuillez saisir une courte description."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_ENABLED: "Les mods de cette liste de jeu sont réorganisés automatiquement en fonction de leurs dépendances."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_DISABLED: "L'ordre de chargement des mods de cette liste de jeu est géré manuellement et ne sera pas réorganisé automatiquement."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_BUTTON: "Ordre de chargement automatique"
