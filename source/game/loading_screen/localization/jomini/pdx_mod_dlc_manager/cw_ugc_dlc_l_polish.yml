l_polish:
 MOD_BACKEND_NOT_AVAILABLE_STEAM: "Steam Workshop jest niedostępny. Nie można przesyłać ani aktualizować modów. Upewnij się, że klient Steam jest uruchomiony i masz dostęp do internetu, a następnie uruchom grę ponownie."
