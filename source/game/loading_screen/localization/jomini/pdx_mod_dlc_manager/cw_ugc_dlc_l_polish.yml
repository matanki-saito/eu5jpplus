 MOD_DESCRIPTION_EMPTY: "Podaj krótki opis."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_ENABLED: "Mody w tym zestawie są automatycznie porządkowane na podstawie zależności między nimi."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_DISABLED: "Kolejność wczytywania modów w tym zestawie jest zarządzana ręcznie i nie będzie automatycznie zmieniana."
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_BUTTON: "Automatyczna kolejność wczytywania"
