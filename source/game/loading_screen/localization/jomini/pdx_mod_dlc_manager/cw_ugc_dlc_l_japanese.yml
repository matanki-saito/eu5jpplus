l_japanese:
 MOD_BACKEND_NOT_AVAILABLE_STEAM: "Steam Workshopが利用できません。MODのアップロードや更新ができません。Steamクライアントが起動していること、インターネットに接続されていることを確認してから、ゲームを再起動してください。"
 MOD_NAME_INVALID_SIZE: "名前は3～60文字で入力してください。"
 MOD_PATH_EMPTY: "MODのスタブを作成する、またはMODをアップロードする元となるパスを入力してください。"
 MOD_PATH_INVALID: "MODのパスに使用できない文字が含まれています。"
 MOD_DESCRIPTION_EMPTY: "簡単な説明を入力してください。"
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_ENABLED: "このプレイセット内のMODは、MOD間の依存関係に基づいて自動的に並べ替えられます。"
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_DISABLED: "このプレイセット内のMODの読み込み順は手動で管理されており、自動的に並べ替えられることはありません。"
 MOD_PLAYSET_IS_AUTOMATICALLY_SORTED_BUTTON: "自動読み込み順"
