 western_ocean_voyage_events.charted_kept_tt: "The waters the fleet charted remain on our maps"
 western_ocean_voyage_mythical_cities_tt: "Charting more of the coasts of the Americas will make the [expeditions|e] to search for its legendary lost cities available"

 western_ocean_voyage_events.1.title: "We Sail West"
 western_ocean_voyage_events.1.desc: "The ships sit low in the harbor, provisioned for a voyage no chart has prepared us for. [target_leader.GetName] has spent months at [ROOT.GetCountry.GetGovernment.GetCourtTitle] arguing [target_leader.GetHisHer] case, that the ocean to the west is narrower than the scholars claim, and that the Indies lie within reach of a determined fleet.\n\nThe learned men remain unconvinced. The sailors are uneasy. But the wind is fair, the tide is turning, and there is nothing left to do but cast off the lines."
 western_ocean_voyage_events.1.a: "Fit out a fourth ship for the unknown ahead."
 western_ocean_voyage_events.1.b: "Sail on, whatever the ocean holds. We shall find it first."
 western_ocean_voyage_events.1.c: "Let the winds be our chart."
 western_ocean_voyage_events.1.columbus: "It is three thousand miles. No more."
 western_ocean_voyage_events.1.historical_info: "The idea of reaching Asia by sailing west had been debated by European scholars for decades before the first such voyage was attempted. The chief obstacle was not the shape of the earth, which educated people understood to be spherical, but its size. Most scholars correctly estimated the ocean to be far too wide to cross. The expeditions that proved them wrong did so not by disproving the estimate, but by finding something unexpected in the way."

 western_ocean_voyage_events.2.title: "The Edge of the Mapped World"
 western_ocean_voyage_events.2.desc: "The Fortunate Islands, so the ancients named them, sit at the very edge of every chart we carry in [ShowLocationName('northern_fuerteventura_coast')]. Beyond it the ocean has no names, no depths recorded, no coastline drawn. The local fishermen say they sometimes see birds flying from the west before a storm, which [target_leader.GetName] takes as a sign of land beyond the horizon. The crew takes it as a sign of storms.\n\nWe take on fresh water, salt meat, and hard biscuit. At sunset the men watch the sea turn gold, then dark."
 western_ocean_voyage_events.2.a: "Buy fresh stores and sail within the week."
 western_ocean_voyage_events.2.b: "Draw on the stores of our own island garrison."
 western_ocean_voyage_events.2.c: "Send boats ashore for water and goats."
 western_ocean_voyage_events.2.c.calm_tt: "The landing party returns without trouble"
 western_ocean_voyage_events.2.c.clash_tt: "The landing party clashes with the islanders"
 western_ocean_voyage_events.2.d: "Buy a caravel from the island shipwrights."
 western_ocean_voyage_events.2.e: "Water the ships and sail on with what we carry."
 western_ocean_voyage_events.2.f: "The men are not ready. We turn back."
 western_ocean_voyage_events.2.historical_info: "The Canary Islands served as the standard departure point for Atlantic voyages into the unknown, owing to their position at the edge of charted Atlantic waters and the reliable trade winds that blow southwest from there toward the Caribbean. Their strategic importance was so well understood that control of the islands was itself contested between Portugal and Castile through much of the fifteenth century."

 western_ocean_voyage_events.3.title: "We Have Come Far Enough"
 western_ocean_voyage_events.3.desc: "The bread is going moldy. The water casks smell. Three men have taken a fever. This morning a delegation comes to [target_leader.GetName] with a simple message: they have sailed west long enough, seen nothing but open sea, and intend to sail east again whether [target_leader.GetNameWithNoTooltip] agrees or not.\n\nThere is no land in any direction. There is nothing at all, only the wind from behind, which has carried them this far and would carry them no further back."
 western_ocean_voyage_events.3.a: "Promise three more days and a share of whatever we find."
 western_ocean_voyage_events.3.b: "The men are right. We turn back."
 western_ocean_voyage_events.3.columbus: "Show the crew a doctored log."
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] calms the crew with a falsified log, so Crew Morale does not fall"
 western_ocean_voyage_events.3.historical_info: "Accounts of the 1492 voyage record a genuine crisis of morale approximately a month into the Atlantic crossing, when the crew threatened mutiny and demanded Columbus alter course for home. The resolution of the crisis, variously attributed to a promise of land within three days, the sighting of floating vegetation, or simply Columbus's force of personality, remains contested. Land was sighted the following morning."

 western_ocean_voyage_events.4.title: "Land!"
 western_ocean_voyage_events.4.desc: "Just before dawn a cry comes from the crow's nest. Then another, louder. Then every man on deck is shouting.\n\nA shape on the horizon. Low at first, barely more than a darkening of the sky, but as the light grows it becomes unmistakable: trees, a shoreline, green hills rising from still water. The sea around the ships has turned from deep blue to green to pale turquoise. Strange birds circle overhead. Branches with unfamiliar leaves drift past the hull.\n\n[target_leader.GetName] stands at the bow and says nothing for a long time.\n\nWhen the boats reach the shore, the islanders have already gathered to watch, and some visibly wear small ornaments of gold through their noses. Asked, by gesture more than by word, where the gold comes from, they point inland, and some point south, toward hills none of the crew can see from here."
 western_ocean_voyage_events.4.a: "Plant the flag. Whatever this place is, it belongs to us."
 western_ocean_voyage_events.4.b: "This matches no account of the Indies. Claim nothing yet."
 western_ocean_voyage_events.4.columbus: "Plant the banner. These are the Indies!"
 western_ocean_voyage_events.4.historical_info: "The first contact between Europeans and the peoples of the Americas occurred in the Caribbean in 1492. The Taíno inhabitants of the Bahamas, who called their island #italic Guanahani#!, greeted the arriving ships from the shore. Within a generation, epidemic disease, to which the Taíno had no prior exposure, had killed the majority of the population of the Caribbean islands. The long-term consequences of the crossing reshaped the ecology, economy, and population of every continent on earth."

 western_ocean_voyage_events.5.title: "The Isle of the Seven Cities"
 western_ocean_voyage_events.5.desc: "Somewhere past the midpoint of the crossing, with the wind steady and the ships making good way, the pilots bring an old chart to [target_leader.GetName]. Drawn by men who never sailed this ocean, it marks a great island far west of the [ShowAreaName('azores_area')]: Antillia, walled and studded with seven cities, said to have been founded by bishops who fled [ShowRegionName('iberia_region')] when the Umayyad armies overran it.\n\nNo one aboard has seen this island, and no one aboard expects to. But the chart is old, the men who drew it were no fools, and out here, with nothing on any horizon, an old story is worth more than it would be in port."
 western_ocean_voyage_events.5.a: "Chart our course by it, in case the old charts are right."
 western_ocean_voyage_events.5.b: "Sailors' charts are full of islands that were never there."
 western_ocean_voyage_events.5.historical_info: "Antillia, the Isle of the Seven Cities, appeared on Portuguese and Genoese charts as early as 1424, marking a large island west of the Azores. The legend behind it held that seven Visigothic bishops had fled Iberia in 714, during the Umayyad conquest, and founded seven cities on an island in the western ocean. The legend outlived the age of exploration that supposedly disproved it: when Francisco Vázquez de Coronado set out decades later to find seven golden cities in the American Southwest, he named his goal after this older, purely European tale."

 western_ocean_voyage_events.6.title: "Where the Gold Comes From"
 western_ocean_voyage_events.6.desc: "Word for word, the interpreters do not agree. One insists the islanders are naming a place. Another, that they are naming a people. A third, that the gesture south and the gesture inland are two different answers to two different questions nobody translates correctly.\n\nWhat is certain is the direction: inland, and beyond that, south, toward mountains and rivers none of the crew have seen. [target_leader.GetName] has the pilots mark it on the chart anyway, half rumor and half guess, in case anyone ever needs to know where to look."
 western_ocean_voyage_events.6.a: "Note it as it stands, contradictions included."
 western_ocean_voyage_events.6.b: "Keep only what everyone agrees on, inland and gold."
 western_ocean_voyage_events.6.historical_info: "Early accounts of contact in the Caribbean describe the Taíno wearing small ornaments of gold, worked rather than mined locally in any quantity the newcomers could see. Asked through gesture where it came from, islanders repeatedly indicated the interior and, in some accounts, lands further south and west. These secondhand, mistranslated directions, more than any confirmed find, shaped where subsequent generations of explorers went looking for gold in the Americas."

 western_ocean_voyage_events.7.title: "We Read the Reports at [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 western_ocean_voyage_events.7.desc: "The ships make harbor at last, salt-crusted and battered, and within days we read [target_leader.GetName]'s account aloud at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. The islands, the crossing, the strange birds and stranger fruit, the gold worn by people who had never heard of us until the moment we arrived.\n\nSome doubt most of what is said, yet we write all of it down regardless. Charts begin to change, cautiously, in the western margins where nothing used to be drawn."
 western_ocean_voyage_events.7.desc.later: "The ships make harbor at last, salt-crusted and battered, and within days we read [target_leader.GetName]'s account aloud at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Another crown's sailors reached these islands before ours, and their reports have long since made the rounds of every court.\n\nYet our fleet has crossed the same ocean and come home, and that is no small thing. Our pilots now know the western winds for themselves, and no foreign chart can teach them that."
 western_ocean_voyage_events.7.a: "Let the account stand as written."
 western_ocean_voyage_events.7.historical_info: "Written and oral reports from the returning expeditions were read at royal courts across Western Europe within months of each landfall, and translated versions circulated widely thereafter. These accounts, garbled by translation and by the ambitions of their tellers, described interior wealth that no European had yet seen firsthand. It was this secondhand testimony, more than any confirmed discovery, that sent subsequent generations of explorers searching further inland and further south for the sources of what the first arrivals had only glimpsed."

 western_ocean_voyage_events.8.title: "Mutiny on the Open Sea"
 western_ocean_voyage_events.8.desc: "It begins with muttering at the change of watch and ends with knives drawn on the main deck. The crew of one of our ships has locked its officers below and sends word across the water: they will steer for home at first light, and they will board any ship that tries to stop them.\n\n[target_leader.GetName] stands at the rail and weighs the distance between the two hulls. Behind [target_leader.GetHerHim], the loyal crews watch to see what [target_leader.GetSheHe] will do."
 western_ocean_voyage_events.8.a: "Let the mutineers take their ship and go home."
 western_ocean_voyage_events.8.b: "Board them. A ship at sea is no council."
 western_ocean_voyage_events.8.fight_win_tt: "The officers prevail and restore order"
 western_ocean_voyage_events.8.fight_lose_tt: "The fighting is bloody, and the fleet pays for it"
 western_ocean_voyage_events.8.c: "Speak to them of the Indies, and the gold waiting there."
 western_ocean_voyage_events.8.rouse_tt: "[target_leader.GetNameWithNoTooltip]'s words rekindle the crew's resolve"

 western_ocean_voyage_events.9.title: "Fever Below Decks"
 western_ocean_voyage_events.9.desc: "The water in the casks has gone green and the salt meat crawls. First a few men take to their hammocks with fever, then a dozen, then so many that the officers can barely man the watches. The surgeon has bled them and purged them and can do no more.\n\nThe healthy look at the sick and then at the empty horizon, and do not say aloud what they are all thinking."
 western_ocean_voyage_events.9.a: "Shorten sail and tend the sick until the fever breaks."
 western_ocean_voyage_events.9.b: "We cannot spare the days. Bury the dead and sail on."
 western_ocean_voyage_events.9.historical_info: "Long ocean passages in the fifteenth century were limited less by navigation than by what a ship could carry. Water stored in wooden casks fouled within weeks, salted provisions spoiled in the heat, and crews packed into small hulls passed fevers and dysentery between them. Captains bound for the open Atlantic took on fresh stores at the last port they could, often the Canaries or the Cape Verde islands, because once they left it there was nowhere to take on more."

 western_ocean_voyage_events.10.title: "Home Before the Edge"
 western_ocean_voyage_events.10.desc: "The fleet comes back into harbor long before anyone expected it, its holds still half full and its crews whole. They found no land, only open water and a wind that would not let them forget how far they were from home.\n\nAt court, people speak of the voyage quietly, when they speak of it at all. Still, the pilots kept their logs, and our charts of the western waters now reach a little further than they did before."
 western_ocean_voyage_events.10.a: "The ocean will still be there next time."

 western_ocean_voyage_events.11.title: "Never Heard From Again"
 western_ocean_voyage_events.11.desc: "Months pass with no word from the fleet that sailed west. Then a year. The merchants who invested in the voyage write off their shares, and the families of the crews stop waiting at the harbor wall.\n\nWhether the ships foundered in a storm, ran out of water in the open ocean, or simply sailed on until there was nothing left, no one will ever know. All we have left is the last report the fleet sent home before it sailed beyond the charted world."
 western_ocean_voyage_events.11.a: "The sea has taken them. Pray for their souls."
 western_ocean_voyage_events.11.historical_info: "Atlantic voyages into the unknown often ended without a trace. The Genoese brothers Ugolino and Vadino Vivaldi sailed west through the Strait of Gibraltar in 1291, seeking a sea route to India, and were never heard from again. Two centuries later, the Portuguese brothers Gaspar and Miguel Corte-Real vanished on separate voyages to the northwestern Atlantic in 1501 and 1502."

 western_ocean_voyage_events.13.title: "A Sea of Weed"
 western_ocean_voyage_events.13.desc: "For days now the ships have sailed through floating meadows of yellow-green weed, so thick in places that it seems to hold the hulls back. The older hands swear it means shallows ahead, and that the fleet will run aground on some sunken shore before anyone sees it.\n\n[target_leader.GetName] orders the lead line made ready. The men watch the water, and wait to hear what it will tell them."
 western_ocean_voyage_events.13.a: "Heave to and sound the depths."
 western_ocean_voyage_events.13.b: "Weed is no reef. Hold our course and sail through."
 western_ocean_voyage_events.13.c: "Our pilot reads the weed as current, not shallows."
 western_ocean_voyage_events.13.historical_info: "The Sargasso Sea, a region of the North Atlantic covered by floating mats of sargassum seaweed, lies across the route from the Canaries to the Caribbean. Columbus's fleet entered it in September 1492. His crews feared the weed marked hidden shallows or would trap the ships, but soundings found no bottom, and the fleet passed through unharmed."

 western_ocean_voyage_events.14.title: "Signs of Land"
 western_ocean_voyage_events.14.desc: "A lookout spots a carved stick drifting past the bow, then a green branch still bearing leaves and berries. Flocks of birds pass overhead at dusk, all flying the same way, toward the southwest.\n\nNo one says the word aloud yet. But the men who threatened to turn back a few days ago now crowd the rails at every change of watch, staring at the horizon."
 western_ocean_voyage_events.14.a: "Follow the birds. Land cannot be far."
 western_ocean_voyage_events.14.b: "Mark it in the log and keep our heading."
 western_ocean_voyage_events.14.historical_info: "In the days before landfall in October 1492, Columbus's log records a carved stick, a branch with berries, reeds, and great flocks of birds flying southwest. On 7 October he altered course to follow the birds, a change that brought the fleet to the Bahamas five days later."

 western_ocean_voyage_events.15.c: "Our pilot knows these skies. Steer for the calm quarter."
 western_ocean_voyage_events.16.c: "Our pilot knows where the wind returns. Go and find it."
