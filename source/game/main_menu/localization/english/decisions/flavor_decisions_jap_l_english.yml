l_english:
 jap_adopt_japan_identity_decision.title: "Take the Name of $JAP$"
 jap_adopt_japan_identity_decision.desc: "The clans have fought themselves to a standstill, and one house has risen above the rest. Yet the world still knows us by the name of that house rather than by the land we now rule.\n\nLet us take the name of $JAP$, so that every court and every province knows the realm is one, and that it is ours."
 jap_adopt_japan_identity_decision.a: "We are $JAP$."
 jap_adopt_japan_identity_decision.color_tt: "We adopt #Y Red#! as our country color"
 jap_adopt_japan_identity_decision.historical_info: "By 1603 Tokugawa Ieyasu had ended more than a century of civil war and taken the title of shōgun, ruling a unified Japan from Edo. Before him, Oda Nobunaga and Toyotomi Hideyoshi had broken the power of the rival warlords. European traders and envoys of the period generally regarded the shōgun as the ruler of all Japan."
