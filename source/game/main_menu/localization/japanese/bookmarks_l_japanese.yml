 bookmark_1337_desc: "ヨーロッパは王朝間の対立により分裂し、黒死病の影が地平線に忍び寄っている。金帳汗国の草原から勃興するイタリアの諸共和国に至るまで、あらゆる国家が岐路に立たされている。"
 bookmark_1658_name: "大国時代（テスト）"
 bookmark_1658_desc: "インクルードおよびオーバーライドの仕様を検証するためのテスト用ブックマーク。ほとんどのセットアップファイルはインクルードを通じて1337年のデータを再利用しており、SWE（スウェーデン）のみ1658年当時の国境（スコーネ、ハッランド、エストニア、リヴォニア）に上書きされている。agent_docs/bookmark_overrides.mdに記載の通り、既に所有済みの地域についてログにERRORLOGが出力されることが想定される。"
