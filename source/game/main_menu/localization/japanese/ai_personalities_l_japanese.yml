l_japanese:
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_aggressive: "攻撃的"
 ai_expansionist: "拡張主義"
 ai_defensive: "防衛的"
 ai_cautious: "慎重"
 ai_opportunistic: "機会主義"
 ai_isolationist: "孤立主義"
 ai_friendly: "友好的"
 # AI Personality descriptions (key + "_desc")
 ai_aggressive_desc: "この国家は武力によって国力を高めようとする。戦争を仕掛けることにためらいが少なく、講和では厳しい条件を突きつける。周辺勢力は協調すべき相手ではなく、打ち倒すべき障害とみなす。"
 ai_expansionist_desc: "この国家は国境と影響力の拡大を目指す。領土の拡張を重視し、請求権を積極的に行使する。また、機会があれば、直接併合するよりも相手を服属させる傾向がある。"
 ai_defensive_desc: "この国家はすでに手にしているものを守ることを第一に考える。不要な争いを避け、国内の基盤を固め、自ら脅威を生み出すのではなく、迫る脅威に対応することを重んじる。"
 ai_cautious_desc: "この国家は危険を避け、忍耐強く行動する。まず外交による解決を探り、決定的な勝利を見込めない戦争は避ける。また、冒険的な行動よりも安定を重んじる。"
 ai_opportunistic_desc: "この国家は打算的で、実利を重んじる。他国の弱みを見極め、有利な機会があれば逃さず利用するが、勝敗の見通せない争いには深入りしない。"
 ai_isolationist_desc: "この国家は内政に重きを置き、国内の発展を優先し、対外関係への深入りを避けようとする。中立を重んじ、外交上の義務には疑いの目を向ける。"
 ai_friendly_desc: "の国家は同盟、友好関係、公正な交渉を重んじる。外交を積極的に展開し、妥当な和平条件を受け入れながら、時間をかけて信頼できる協力相手を増やしていく。"
 # Diplomacy filter category header
 CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "国家の性格"
 # Tooltip section header
 AI_PERSONALITY_MODIFIERS: "挙動補正"
 # AI disposition labels (how this country sees the player)
 AI_DISPOSITION_ALARMED: "脅威視"
 AI_DISPOSITION_WARY: "警戒"
 AI_DISPOSITION_PLANNING_WAR: "開戦準備中"
 AI_DISPOSITION_COVETS: "領土への野心"
 AI_DISPOSITION_RIVALS: "ライバル"
 AI_DISPOSITION_INDIFFERENT: "無関心"
 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "この[country_disposition|e]では、その国はわが国を存亡に関わる脅威とみなし、防衛同盟を求めるか、わが国に対して先手を打つ可能性が高い。"
 AI_DISPOSITION_WARY_DESC: "この[country_disposition|e]では、その国はわが国を警戒し、譲歩したり警戒を緩めたりすることに消極的となる。"
 AI_DISPOSITION_PLANNING_WAR_DESC: "この[country_disposition|e]では、その国は有効な請求権または争いの種を抱え、それを武力で押し通す準備を進めようとする。"
 AI_DISPOSITION_COVETS_DESC: "この[country_disposition|e]では、その国はわが国の領土を狙いやすい標的とみなし、機会があれば征服または服属を試みる可能性がある。"
 AI_DISPOSITION_RIVALS_DESC: "この[country_disposition|e]では、その国はわが国を競争相手とみなし、可能なかぎりわが国の利益を妨げようとする。また、わが国の敵対勢力を支援することもある。"
 AI_DISPOSITION_INDIFFERENT_DESC: "この[country_disposition|e]では、その国は現時点で、わが国に対して特に強い関心も敵意も抱いていない。"
 # Country tooltip row labels
