l_japanese:
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_balanced: "平衡的"
 ai_aggressive: "攻撃的"
 ai_expansionist: "拡張主義"
 ai_defensive: "防衛的"
 ai_cautious: "慎重"
 ai_opportunistic: "機会主義"
 ai_isolationist: "孤立主義"
 ai_friendly: "友好的"
 # AI Personality descriptions (key + "_desc")
 ai_balanced_desc: "特別な傾向を持たない国家。その行動は主に統治者の気質、社会的価値観、そして置かれている状況によって決まる。"
 ai_aggressive_desc: "この国家は武力によって国力を高めようとする。戦争を仕掛けることにためらいが少なく、講和では厳しい条件を突きつける。周辺勢力は協調すべき相手ではなく、打ち倒すべき障害とみなす。"
 ai_expansionist_desc: "この国家は国境と影響力の拡大を目指す。領土の拡張を重視し、請求権を積極的に行使する。また、機会があれば、直接併合するよりも相手を服属させる傾向がある。"
 ai_defensive_desc: "この国家はすでに手にしているものを守ることを第一に考える。不要な争いを避け、国内の基盤を固め、自ら脅威を生み出すのではなく、迫る脅威に対応することを重んじる。"
 ai_cautious_desc: "この国家は危険を避け、忍耐強く行動する。まず外交による解決を探り、決定的な勝利を見込めない戦争は避ける。また、冒険的な行動よりも安定を重んじる。"
 ai_opportunistic_desc: "この国家は打算的で、実利を重んじる。他国の弱みを見極め、有利な機会があれば逃さず利用するが、勝敗の見通せない争いには深入りしない。"
 ai_isolationist_desc: "この国家は内政に重きを置き、国内の発展を優先し、対外関係への深入りを避けようとする。中立を重んじ、外交上の義務には疑いの目を向ける。"
 ai_friendly_desc: "の国家は同盟、友好関係、公正な交渉を重んじる。外交を積極的に展開し、妥当な和平条件を受け入れながら、時間をかけて信頼できる協力相手を増やしていく。"
 # Diplomacy filter category header
 CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "国家の性格"
