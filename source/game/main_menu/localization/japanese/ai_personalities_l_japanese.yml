 AI_DISPOSITION_COVETS: "領土への野心"
 AI_DISPOSITION_DOMINEERING: "支配的"
 AI_DISPOSITION_RIVALS: "ライバル"
 AI_DISPOSITION_INDIFFERENT: "無関心"
 AI_DISPOSITION_FRIENDLY: "友好的"
 AI_DISPOSITION_SELF: "自国"
 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "この[country_disposition|e]では、その国はわが国を存亡に関わる脅威とみなし、防衛同盟を求めるか、わが国に対して先手を打つ可能性が高い。"
 AI_DISPOSITION_WARY_DESC: "この[country_disposition|e]では、その国はわが国を警戒し、譲歩したり警戒を緩めたりすることに消極的となる。"
 AI_DISPOSITION_PLANNING_WAR_DESC: "この[country_disposition|e]では、その国は有効な請求権または争いの種を抱え、それを武力で押し通す準備を進めようとする。"
 AI_DISPOSITION_COVETS_DESC: "この[country_disposition|e]では、その国はわが国の領土を狙いやすい標的とみなし、機会があれば征服または服属を試みる可能性がある。"
 AI_DISPOSITION_DOMINEERING_DESC: "わが国よりはるかに強大で、特定の州を欲しているわけではないが、従属国化や属国化を通じてわが国を支配しようとする。"
 AI_DISPOSITION_RIVALS_DESC: "この[country_disposition|e]では、その国はわが国を競争相手とみなし、可能なかぎりわが国の利益を妨げようとする。また、わが国の敵対勢力を支援することもある。"
 AI_DISPOSITION_INDIFFERENT_DESC: "この[country_disposition|e]では、その国は現時点で、わが国に対して特に強い関心も敵意も抱いていない。"
 AI_DISPOSITION_FRIENDLY_DESC: "長期的な同盟や良好な関係によってわが国を友好国とみなしており、協力的な姿勢を見せている。"
