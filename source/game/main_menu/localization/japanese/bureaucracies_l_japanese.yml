 # Generic 1600-1836 bureaucracies
 # ADM
 board_of_revenue_bureaucracy: "歳入委員会"
 board_of_revenue_bureaucracy_desc: "国家歳入の徴収、査定、管理を担う中央機関。イングランドの大蔵卿委員会やフランスのコントロール・ジェネラル・デ・フィナンス（財務総監府）といった機関は、十分な資金を投入された歳入委員会がいかにして王室の収入を劇的に増加させられるかを示した。しかしきちんと管理しなければ、閑職と汚職が蔓延し、保護するために設立されたはずの歳入そのものを浪費する存在となる。"
 privy_council_bureaucracy: "枢密院"
 privy_council_bureaucracy_desc: "王政の主要な執行機関として機能する、信頼された顧問たちからなる中枢評議会。イングランドの枢密院やスペインのコンセホ・レアル（国王評議会）のような機関は、国家の主要な役職を単一の調整機関のもとに統合することで、君主による効果的な統治を可能にした。しかし、十分な支援がなければ、枢密院は派閥間の内紛の場と化し、王室が協力を必要とする諸階級そのものを遠ざけることになる。"
 audit_bureau_bureaucracy: "監査局"
 audit_bureau_bureaucracy_desc: "公会計を精査し、役人や徴税請負人の不正行為を摘発することが使命である専門機関。フランスのクール・デ・コント（会計院）やオランダのレーケンカメル（会計検査院）を手本とした制度は、失われた歳入を回収し、行政官に説明責任を負わせるための強力な手段を王室に与えた。しかし、資金不足に陥ると、監査局はその独立性を失い、既得権益がその空白を埋め、租税機構は本来取り締まるべき対象そのものに乗っ取られることになる。"
 colonial_office_bureaucracy: "植民地局"
 colonial_office_bureaucracy_desc: "海外領土に対する政策の指針策定、植民地人事の管理、および帝国の法的枠組みの監督を担う省。イングランドの植民地省は、組織化された本国による監督が、遠隔地の植民地開拓をいかに加速させられるかを示している。しかし、適切な資源が確保されなければ、植民地への移住を推進しても、帝国内で人々によりよい選択肢を提供することはできず、わが国からの流出を促す結果となる。"
 # DIP
 admiralty_board_bureaucracy: "海軍委員会"
 admiralty_board_bureaucracy_desc: "海軍の運営、補給、および戦略的指揮を担う合議組織。イギリスの海軍本部や、スペインのコンセホ・デ・ゲラ（軍事評議会）の海軍部門は、専門的な海軍行政が艦船そのものと同様に決定的な要素であることを実証した。適切に運営された海軍委員会は、大規模で経験豊富な水兵の層を育成できる。しかし、資金供給が滞れば、徴募だけが続いて訓練がおこなわれなくなり、艦隊が拡大しても海軍の伝統は衰退していく。"
 foreign_ministry_bureaucracy: "外務省"
 foreign_ministry_bureaucracy_desc: "国家の対外関係の処理、駐在大使団の維持、国外からの情報の統括を専門におこなう常設の機関。フランスのミニステール・デ・ザフェール・ゼトランジェール（外務省）は、他国が後に模倣することになる専門的な外交組織の先駆となった。十分な予算が確保された外務省は、交渉の成功を通じて威信を高めるが、資金不足の省は不名誉をもたらす。使節は生活費を賄えず、外交公文書への返答は滞り、国家の評判は失墜していくのである。"
 trade_commission_bureaucracy: "通商委員会"
 trade_commission_bureaucracy_desc: "商人の免許付与、商事紛争の裁定、関税の設定、密輸の取り締まりを担う規制機関。英国の商務庁や、オランダのフェレーニフデ・オースト＝インディシェ・コンパニ（オランダ東インド会社）の監督評議会といった機関は、国家による組織的な商業への関与が、いかに国家の繁栄を一変しうるかを示した。しかし執行力がなければ、通商委員会は形骸化する。専売権は無視され、関税収入は流出し、広範な貿易経済は以前よりも悪化することになる。"
 # MIL
 war_council_bureaucracy: "軍事評議会"
 war_council_bureaucracy_desc: "陸軍の計画、調整、監督を担う最高軍事委員会。ハプスブルク家のホーフクリークスラート（宮廷軍事局）や英国の戦争省は、単独の指揮官だけでは統制しきれないほど肥大した軍隊を相手に、いかにして戦略的指揮を執るかという、同じ問題に対する異なる回答を示している。資金が潤沢な軍事評議会は、有能な将校を絶え間なく輩出する。しかし、予算が削減されると、人材を見出し登用する制度的仕組みが崩壊し、軍の伝統は衰退してしまう。"
 ordnance_board_bureaucracy: "兵器局"
 ordnance_board_bureaucracy_desc: "火砲、弾薬の製造、保管、補給、および野戦工務を担う専門部局。イングランドの兵器局とフランスのコール・ロワイヤル・ド・ラルティレリー（王立砲兵隊）は、包囲戦の専門化には、その場しのぎの請負業者ではなく、恒久的な官僚機構が必要であることを実証した。十分な資金が確保された兵器局は包囲能力を大幅に向上させるが、資源が枯渇すると国を内側から蝕むことになる。鋳造所は整備されず、弾薬庫の点検は省かれ、兵器局が維持すべき要塞は崩壊しはじめる。"
 commissariat_bureaucracy: "軍需局"
 commissariat_bureaucracy_desc: "野戦中の軍隊に食糧、飼料、衣類、装備を供給する役目を担う、軍組織の兵站部門。ルイ14世の軍隊のためにルーヴォワのもとで考案され、後にアンタンダンス（地方監察局）へと洗練されたこの制度は、組織化された補給基地から補給を受ける軍隊が、現地調達に頼る軍勢には不可能な規模と期間の遠征を維持できると証明した。十分な資金が確保された軍需局は、作戦に投入可能な実効兵力を増大させる。一方、資金不足の軍需局は、破滅的な民間契約によってそれを補うことを軍隊に強いることになり、兵力増強による利益をはるかに上回る維持費の増大を招く。"
 # Chinese bureaucracies
 central_secretariat_bureaucracy: "中書省"
 central_secretariat_bureaucracy_desc: "$zhongshu_sheng$は、元朝の最高行政機関であり、首都から帝国全土の統治を指揮していた。十分な資金を供給された中書省は、断固とした協調的な統治を通じて王朝の権威を正当化するが、その運営が疎かになると、その結果生じる行政の混乱により、王室が下すべきあらゆる政治的決定の代価が増大する。"
 imperial_censorate_bureaucracy: "御史台"
 imperial_censorate_bureaucracy_desc: "元朝の御史台（後の明朝で「都察院」へと改組される）は、官僚の腐敗を根絶し、首都から地方に至るまで法が遵守されるようにする任務を負った監察機関であった。十分な資金が投入されれば、その監察官たちは、役人の不正によって失われるはずだった税収を回収する。しかし、資源が与えられなければ、彼らは活動ができなくなり、地主たちは監視の空白に乗じてすぐさま利益を貪るようになる。"
 six_boards_bureaucracy: "六部"
 six_boards_bureaucracy_desc: "六部とは、明朝の6つの部（吏部、戸部、礼部、兵部、刑部、工部）のことであり、共同で国家機構全体を運営していた。これらは世界でも最も包括的な官僚構造で、十分な資金があれば税収を著しく増加させるが、放置されれば、六部は玉座の利益よりも私利私欲を優先する派閥官僚たちの強固な権力基盤と化す。"
 six_boards_deactivate_disables_oversight_law_tt: "この[bureaucracy|e]を廃止すると、法律「[ShowLawName('six_ministries_overseer_law')]」が採用できなくなる"
 grand_secretariat_bureaucracy: "内閣"
 grand_secretariat_bureaucracy_desc: "内閣は、明朝を事実上統治していた宮廷内の諮問評議会であり、詔勅の起草、皇帝と外部の官僚機構の仲立ち、そして$six_boards_bureaucracy$全体にわたる政策の調整を担っていた。十分な資源を備えた内閣は、断固とした一元的な統治を通じて帝国の威信を高めるが、資金不足に陥れば皇帝の信任を失い、本来維持すべき統治の正統性も揺らぎはじめる。"
