l_japanese:
 circumnavigation_expedition_events.1.title: "大事業"
 circumnavigation_expedition_events.1.desc: "5隻の船。270人の船員。1年分の食糧。そしてどんな水先案内人も航海したことがない航路。[target_leader.GetName]は、クローブが豊富に実る島々と、西回りで香料諸島へ至る航路について淡々と語っている。港長は[target_leader.GetHimHer]の話を信じていないし、水先案内人たちも半信半疑だ。それでも船には食糧が積み込まれており、風もよく、委任状には王印が押されている。\n\nこの先には、どんな海図にも載っていないものばかりが待ち受けているのだ。"
 circumnavigation_expedition_events.1.magellan: "カナリア諸島へ針路を取れ。神が許せば、「西の海」を見つけられるだろう。"
 circumnavigation_expedition_events.1.a: "カナリア諸島に向かうぞ。その先に何があるのか、我々が突き止めるのだ。"
 circumnavigation_expedition_events.1.historical_info: "1519年9月、フェルディナンド・マゼランは香料諸島への西回り航路を発見するため、スペイン王室との契約のもと、サンルーカル・デ・バラメダを出航した。遠征船団はトリニダード号、サン・アントニオ号、コンセプシオン号、ヴィクトリア号、サンティアゴ号の5隻で構成されていた。マゼランはポルトガル人航海士で、ポルトガルに仕えてインドとモルッカ諸島へ航海した経験があったが、ポルトガル王マヌエル1世に俸給の増額を拒否されたのち、スペイン王室に忠誠を移した。この航海は史上初の世界周航となるが、マゼラン自身はその完遂を見ることなく没した。"
 circumnavigation_expedition_events.2.title: "最後の既知の海岸"
 circumnavigation_expedition_events.2.desc: "海の向こうから、平らな褐色の層が重なったような見た目の[current_location.GetProvince.GetName]が姿を現した。岩でできた要塞のようだが、その向こうにはまだ[departure_port.GetName]と同じ空が広がっている。水先案内人たちが、最後の水深測定をおこなった。船員たちは鉄製の樽から真水を飲み、大西洋のうねりでほつれた索具を補修した。最後の岬を越えた先の海図はない。\n\n祈りを捧げる者もいた。送る術のない手紙を書く者もいた。[target_leader.GetName]は、計れない何かを計ろうとしているかのように甲板を歩いていた。何しろいま積み込まれている物資だけで、大海ひとつとさらにその先の水域を横断しなければならないのだ。"
 circumnavigation_expedition_events.2.a: "物資は積めるだけ積め。こんな機会はもうないかもしれない。"
 circumnavigation_expedition_events.2.b: "出発するぞ。船員たちの士気が下がらないうちにな。"
 circumnavigation_expedition_events.2.c: "この航路はわからないことが多すぎる。港に戻るぞ。"
 circumnavigation_expedition_events.2.historical_info: "カナリア諸島は当時カスティーリャの支配下にあり、大航海時代を通じ、イベリアによる大西洋遠征の補給拠点として一般的に利用されていた。マゼラン艦隊も、南米沿岸へ向けた長い大西洋横断に出る前にテネリフェ島へ寄港し、新鮮な食糧や水などを補給している。15世紀初頭、カスティーリャによって植民地化されたカナリア諸島は、補給拠点であると同時に、未知の海域へ向かう航海の出発点でもあった。この先には途方もなく広大な、何もない海域が待ち受けており、カナリア諸島で艦隊にどれだけしっかりと食糧や水を積み込めるかによって、船員たちが生き延びられるかどうかが左右されたのである。"
 circumnavigation_expedition_events.3.title: "新大陸の端"
 circumnavigation_expedition_events.3.desc: "広大な[ShowContinentName('atlantic_ocean_continent')]を何週間も航海した末、細い緑の線が西の水平線上に現れた。新大陸の沿岸だ。森ではオウムがけたたましく鳴き、無数の川から真水が流れ込んでいる。海岸から出てきたカヌーを漕ぐ人々は、こちらに恐怖ではなく興味を抱いている様子で、木材や水、そして不思議な果実の提供を申し出ている。どれも疲れ切った艦隊に必要なものだが、季節が変わりつつあり、南に抜ける航路はまだ見つかっていない。\n\n[target_leader.GetName]は、この海岸の快適さとまだまだ長い先の道のりを天秤にかけている。"
 circumnavigation_expedition_events.3.a: "上陸してあの者たちと取引し、木材と水と果物を手に入れるぞ。"
 circumnavigation_expedition_events.3.b: "この海岸はまたの機会に寄ればいい。季節が変わらないうちに南下しよう。"
 circumnavigation_expedition_events.3.historical_info: "マゼラン艦隊は1519年末にブラジル沿岸へ到達し、カボ・デ・サント・アゴスティーニョ付近に上陸したのち南下した。ブラジルはトルデシリャス条約における「ポルトガルに属する世界の半分」に該当していたため、スペインに仕えるマゼラン艦隊は当地の沿岸に公然と長居することはできなかったものの、沿岸部に住むトゥピ族は積極的に交易に応じ、この土地の恵みは大西洋横断後の艦隊を大いに癒やした。"
 circumnavigation_expedition_events.4.title: "巨大な湾"
 circumnavigation_expedition_events.4.desc: "艦隊は実に広大で穏やかな湾に入った。天からの恵みのように思えるその湾は、周囲を植物が茂った山々に囲まれ、海面は魚たちの群れで銀色に輝いていた。大勢で現れた沿岸に住む人々に釣り針やナイフと渡すと、飼っているらしい鳥や果物が対価として差し出され、船倉があふれんばかりになった。長い時間をかけて大西洋を渡った我々にとって、ここはまさに楽園だ。ここに残るとなったら船員たちは大喜びするだろう。\n\nとはいえ、楽園にうつつを抜かしていては航海に支障が出る。[target_leader.GetName]は、どれほど艦隊がここに留まるか決断を下さなくてはならない。"
 circumnavigation_expedition_events.4.a: "船員たちを休ませ、限界まで食糧を補給しろ。こんな機会は二度とない。"
 circumnavigation_expedition_events.4.b: "交易で可能なかぎり食糧を手に入れ、1週間以内に出発するぞ。"
 circumnavigation_expedition_events.4.c: "楽しむための旅ではない。取引はせずに出航する。"
 circumnavigation_expedition_events.4.historical_info: "のちにリオデジャネイロを擁することになるこの巨大な湾は、マゼラン艦隊の航海において最も豊かな補給地点であった。湾内は穏やかで魚が豊富で、沿岸部に住んでいるトゥピ族は、装飾品や鉄製品と引き換えに素晴らしい品質の食糧を提供してくれた。ここで食糧を最大限補給できたことで、寒冷な高緯度海域や海峡の探索に向けて覚悟を決めることができたのだ。"
 circumnavigation_expedition_events.5.title: "銀の川の河口"
 circumnavigation_expedition_events.5.desc: "水先案内人たちは、どこかから通り抜けられるはずだと考えていた。どこまでも続く大陸などありはしないのだ。しかし、そこは河口にしてはあまりにも広く、マストに登っても対岸が見えなかった。そして水は汽水であるものの、沖合までの40リーグまでが泥で茶色くなっていた。そこでボートを送り出し、2週間にわたって河口から遡らせてみた。\n\nボートが戻り、ナマズがいるということと、水深は浅いということ、そして別の大洋に通じる水路はないということがわかった。さらに南に、本当の水路が待っているはずだ。もし、存在するとしたらだが。"
 circumnavigation_expedition_events.5.a: "河口をしっかりと調査せよ。確認する価値があるかもしれん。"
 circumnavigation_expedition_events.5.b: "どこにも通じていない川にかける時間はない。南に急ごう。"
 circumnavigation_expedition_events.5.press_tt: "この先のどこかにあるはずの水路を求め、艦隊が予定通りに南下する"
 circumnavigation_expedition_events.5.c: "これ以上進むのは無謀だ。帰国しよう。"
 circumnavigation_expedition_events.5.historical_info: "スペイン人航海者フアン・ディアス・デ・ソリスは、1516年に「銀の川」という意味の名を持つラプラタ川を探検したが、彼は上陸後まもなく先住民に殺害された。マゼラン艦隊はラプラタ川の河口を西に抜ける水路と誤認し、1520年の1月に調査をおこなった。この誤りによって彼らは数週間を「浪費」することになったが、結果としてスペイン初のラプラタ川流域の詳細な測量が実現した。「銀の川」という名前は、現地のチャルーア族やグアラニー族の銀取引が由来になっているが、内陸部に銀の山があるという噂の真相はいまもはっきりしていない。"
 circumnavigation_expedition_events.6.title: "世界の果ての水路"
 circumnavigation_expedition_events.6.desc: "その水路は冷たく、狭く、命の危険すらあった。切り立った黒い岩壁が両側にそびえ立ち、水路の蛇行ぶりは水先案内人さえ西がどちらかわからなくなるほどだった。何よりも厄介だったのは風だ。雪原から吹き下す風は狭い水路に集中し、なんの前触れもなく向きを変える。雪混じりの突風は索具にあたって唸るだけでなく、船を押し戻し、岩壁に押し付け、何日も身動きを取れなくさせるのだ。\n\n岩壁に挟まれた水路が近づくなか、[target_leader.GetName]は旗艦の船首に立ち、黙って前方を見つめている。水先案内人たちはこの水路を通り抜けられると言っているが、ほかの船員たちは彼らの正気を疑っている。海図を信じるなら、水路の向こうにはいまだ名付けられていない広大な海が存在するのだ。"
 circumnavigation_expedition_events.6.a: "艦隊前進。ここまで来て、風ごときで諦められるものか。"
 circumnavigation_expedition_events.6.b: "ここで越冬する。船員たちを休ませれば、多少は通り抜けやすくなるだろう。"
 circumnavigation_expedition_events.6.c: "これほどの危険を冒す価値はない。艦隊を反転させろ。"
 circumnavigation_expedition_events.6.historical_info: "マゼラン海峡の通過は1520年11月に成し遂げられた。南アメリカの南端を貫くこの海峡は全長570キロメートルに及び、片側にはティエラ・デル・フエゴ、すなわち「火の土地」が存在する。この名は同地域の住民がおこした警戒の火が由来になっている。なお通過には38日を要した。マゼランは海峡への道中、サン・フリアン港で発生した反乱を鎮圧し、船長1名を処刑し、もう1名を置き去りにした。また3隻目のサン・アントニオ号は任務を放棄し、スペインに帰還した。トリニダード号、コンセプシオン号、ヴィクトリア号の残った3隻は、1520年11月28日、マゼランが「マル・パシフィコ」と名付けた海への進出を果たした。この名は「平穏な海」、すなわち太平洋を意味し、恐怖に満ちた海峡のあとでは平穏に見えたことにちなんでいる。"
 circumnavigation_expedition_events.7.title: "太平洋と呼ばれた海"
 circumnavigation_expedition_events.7.desc: "マゼラン海峡最後の黒い岬を過ぎると、艦隊の前に果てしない大海原が広がった。[target_leader.GetName]が「平和な海」と命名した理由となった平穏さが、やがて呪いとなった。数週間が経っても一切島が見当たらず、樽の水は腐って黄色くなり、ビスケットは粉と化してゾウムシが湧いた。船員たちは船べりに垂らして海水で柔らかくした牛皮をかじり、ネズミ1匹に半ダカットを払うようになった。\n\n誰も渡ったことがないため、この海がどれほど広いのか水先案内人たちにもわからなかった。[target_leader.GetName]がどんな決断を下そうと、対岸を見ることなく命を落とす者が出ることになる。"
 circumnavigation_expedition_events.7.a: "残っている食糧は配給制にしろ。進路はそのまま、着実に進むのだ。"
 circumnavigation_expedition_events.7.endured_tt: "船員たちが太平洋横断を耐え抜き、艦隊は戦闘をおこなえる状態で対岸に到達する"
 circumnavigation_expedition_events.7.scurvy_tt: "壊血病と飢えでおびただしい数の死者が出る。艦隊は人員が激減した状態で這うように先に進む"
 circumnavigation_expedition_events.7.b: "すべての帆を広げろ。早く陸を見つけるほど生き残りが増える。"
 circumnavigation_expedition_events.7.fast_tt: "先を急いだ甲斐があり、最悪の事態になる前に陸地が見つかる"
 circumnavigation_expedition_events.7.lost_tt: "この海は誰も想像していなかったほど広かった。食糧が尽き、遠征隊が全滅する"
 circumnavigation_expedition_events.7.c: "噂に聞いた島々を目指して北に進め。真水があることを祈るばかりだ。"
 circumnavigation_expedition_events.7.islands_tt: "点在する島々で水と新鮮な食糧が手に入る。ほぼ全員が生きて横断を果たす"
 circumnavigation_expedition_events.7.empty_sea_tt: "北の海域も同じぐらい何もなかった。この探索のせいで貴重な時間とさらなる船員を失う"
 circumnavigation_expedition_events.7.historical_info: "マゼランによる太平洋横断は99日間に及び、そのあいだ一度も物資を補給することができなかった。一行は不運にも地球で最も何もない海域に入り込み、ほとんど陸地を見つけられずに通過することになったのだ。約19人が壊血病で命を落とし、生存者はおがくずさえ口にしたほか、保護材として使われていた革を海水に浸して食べ、ネズミが食糧として船員たちのあいだで高値で取引されていた。太平洋横断における初の陸地は、1521年3月に上陸したマリアナ諸島のグアムだった。島に住むチャモロ人に艦隊のボートのひとつを盗まれ、報復攻撃をおこなって以来、スペインはこの島々をラドロネス諸島（盗賊諸島）と呼んでいた。太平洋を東に横断して帰国する航路は船乗りたちを阻みつづけたが、1565年にアンドレス・デ・ウルダネータが「トルナビアヘ」と呼ばれる北方を通る航路を開拓すると、数世紀に及ぶマニラ・ガレオン貿易の端緒が開かれた。"
 circumnavigation_expedition_events.8.title: "2ヵ月間で初めての陸地"
 circumnavigation_expedition_events.8.desc: "大海原しか見えない状況が60日以上も続いた末、マストの上から叫び声が上がった。陸だ！ 船員のあいだに希望が燎原の火のごとく広がったが、それはボートが近づくまでの話だった。「陸」はヤシの木とサンゴ礁からなる海抜の低い環礁で、波が打ち寄せ、錨を利かせる海底がなく、真水など見つかりそうにもない。鳥たちが頭上を旋回していたが、木々には飢えた人間が食べられるものは一切なかった。\n\nこの島は期待外れに見えるが、[target_leader.GetName]は残って捜索するか先に進むか決断しなければならない。"
 circumnavigation_expedition_events.8.a: "ボートを降ろせ。環礁に水か食糧がないか調べるのだ。"
 circumnavigation_expedition_events.8.barren_tt: "陸とは名ばかりでここには何もない。数日が無駄になる"
 circumnavigation_expedition_events.8.relief_tt: "若干の雨水と数羽の鳥が手に入る。少ないが、飢えた状況ではありがたい"
 circumnavigation_expedition_events.8.b: "ここには何もないし、錨も利かない。先に進むぞ。"
 circumnavigation_expedition_events.8.historical_info: "1521年1月24日、艦隊は太平洋に入ってから初めての陸地を発見した。一行がサン・パブロと命名した無人の小さな環礁は、現代の地図でいうトゥアモトゥ諸島のプカプカ島だった可能性が高い。ピガフェッタの記録によれば、太平洋横断中に発見した2つの島は「どれだけ降ろしても錨が海底に届かず」、「鳥と木しかない」場所だった。上陸できなかったため一行は何も得られず、マゼランはこの島々を「インフォルトゥナダス諸島」、すなわち不幸諸島と名付けた。"
 circumnavigation_expedition_events.9.title: "サメの島"
 circumnavigation_expedition_events.9.desc: "海に2つ目の島が現れた。低木とサンゴ礁で構成され、周囲から波が打ち寄せるうえに錨を降ろす場所がない、1つ目と同じく不毛な場所だ。海にはサメたちの姿しか見えず、影が船の下を泳ぎ回る光景に船員たちは思わず十字を切った。上陸できる場所も、水も、食糧もなく、あるのはひたすら続く何もない海という状況に、船員たちは日を追うごとに希望を失っている。\n\nこの絶望的な状況にどう耐えるか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.9.a: "もう一度ボートを降ろし、波を超えて海岸にたどり着けるか試すぞ。"
 circumnavigation_expedition_events.9.a.tt: "ボートが成果なく戻ってくるが、乗組員たちが挑戦の様子を見ていたため、士気の低下は少しだけで済んだ（乗組員の士気#R -3#! ）"
 circumnavigation_expedition_events.9.b: "ここをサメの島と名付け、黙って先に進もう。"
 circumnavigation_expedition_events.9.historical_info: "不幸諸島の2つ目の島は1521年2月21日に発見され、ピガフェッタが海中に多数のサメがいたと記録したことから「ティブロネス島」（サメの島）と命名された。この島は、現代の地図でいうキャロライン島かフリント島だった可能性が高い。2つ目の島も錨を降ろせる場所がなく、艦隊にとってなんの助けにもならなかった。2つの島々のあいだを航海した数週間は、太平洋横断において最悪の時期だった。壊血病で命を失う者は後を絶たず、船員たちは革やおがくず、ネズミを食べて飢えをしのいだ。一行はサメを捕ることはしなかった。海岸までたどり着くことすらできない状態だったのだ。"
 circumnavigation_expedition_events.10.title: "泥棒諸島"
 circumnavigation_expedition_events.10.desc: "いよいよ耐えるのも限界というとき、見張りが緑の山々を発見した。水や果物、魚が手に入る本物の陸地だ。だがアウトリガー式カヌーの群れが艦隊に向かってきたかと思うと、それに乗っていた者たちが不敵にも機敏に船に乗り込み、固定されていない物を手当たり次第に持ち去った。連中にとって、守られていない物は自由に持っていってよい物だったのだ。だが飢えた船員たちにとって、それは盗みにほかならなかった。\n\nこの島々は遠征隊にとっての光明になりうる。[target_leader.GetName]が連中から食糧を奪い取れればの話だが。"
 circumnavigation_expedition_events.10.a: "公正な交易で、運べるだけの食糧と水を手に入れろ。"
 circumnavigation_expedition_events.10.b: "武装した船員たちを上陸させてボートを取り返し、必要な物を奪い取れ。"
 circumnavigation_expedition_events.10.c: "カヌーから奪えるだけ奪い、すぐさま沖に出るぞ。"
 circumnavigation_expedition_events.10.historical_info: "1521年3月6日、艦隊はマリアナ諸島のグアムに到達した。これは海峡を抜けて以来初めての上陸だった。マゼランがここを「ラドロネス諸島」（泥棒諸島）と名付けたのは、私有財産の概念を持たないチャモロ人に船のボートを盗まれたからである。報復として、マゼランは約40名の武装した船員を上陸させ、家々を焼き、島民数名を殺害したうえでボートを取り戻した。ここでの停泊はまさに救済だった。手段がどうであれ、死にかけていた船員たちは3ヵ月以上ぶりに新鮮な食糧と水にありつけたのだ。"
 circumnavigation_expedition_events.11.title: "セブ島の血と信仰"
 circumnavigation_expedition_events.11.desc: "この島々のおかげで遠征隊は救われた。過酷な太平洋横断を終えた[target_leader.GetName]一行は、水や果物、新鮮な肉を補給し、セブではラジャ（現地の統治者）に宴でもてなされた。血の契約が交わされ、ラジャの民は[ROOT.GetCountry.GetReligion.GetName]を受け入れ、引き換えに遠征隊はその武力をもってラジャに協力することとなった。こうして南国の太陽のもと、1日で数百人が改宗した。\n\nだが同盟には代償が伴う。狭い海峡を隔てたマクタン島を支配する反抗的な首長は、[ROOT.GetCountry.GetReligion.GetGodName]への改宗と新たな支配者の両方を拒んでいる。そして同盟者たるラジャは我々に対し、彼に身の程を思い知らせてほしがっている。この島々で味方を得れば、その敵も共有することになるのだ。"
 circumnavigation_expedition_events.11.a: "同盟者に加勢する。マクタン島の連中に我々の力を見せつけるのだ。"
 circumnavigation_expedition_events.11.mactan_triumph_tt: "我々が誇示した武力の前に島々が屈服し、同盟者の敵は身の程を思い知る"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "浅瀬での攻撃は失敗し、優秀な船員たちが命を落としたため艦隊が弱体化する"
 circumnavigation_expedition_events.11.b: "島々から手に入れるだけ手に入れたら出航しよう。我々の戦いではない。"
 circumnavigation_expedition_events.11.c: "王家の旗を立てよ。この発見はわが国の王家が為したと記録するのだ。"
 circumnavigation_expedition_events.11.historical_info: "マゼランは1521年3月にフィリピン諸島に到達し、サン・ラサロ諸島と命名した。フィリピンでは、西大西洋の人々と初めて持続的な関係を構築し、飢えに苦しんでいた艦隊にとって恵みとなる食糧を手に入れることができた。マゼランはセブ島のラジャ・フマボンと血の契約を交わし、彼とその臣下数千人をキリスト教に改宗させたが、この同盟が命取りになった。1521年4月27日、マゼランは新たな同盟者に代わって首長ラプラプを討とうと、マクタンの戦いにおいて岩礁を越える無謀な攻撃を仕掛け、戦死したのだ。指揮権は最終的にフアン・セバスティアン・エルカーノが引き継ぎ、生存者たちはボホールにおいてコンセプシオン号を焼き捨てた。もはや、3隻の船を運用できるだけの船員が残っていなかったのである。"
 circumnavigation_expedition_events.12.title: "香料諸島"
 circumnavigation_expedition_events.12.desc: "モルッカ諸島。どの海図にも載っている場所だが、イベリアの船が西からここに到達したことはない。目視するよりも前に、香りが船に届いた。2つの大洋の彼方から艦隊を運んできたのと同じ風が、芳醇で深みのあるクローブの香りを届けていた。\n\n水先案内人が水深を読み上げるなか、[target_leader.GetName]は甲板に立ち、ひたすら黙っていた。船倉はほとんど空で、船員たちは見る影もない。それでも自分たちはここまで来たのだ。そしてスルタンのボートが、すでに出迎えのためにこちらに向かってきている。"
 circumnavigation_expedition_events.12.a: "船倉を[ShowGoodsNameWithNoTooltip('cloves')]で満たせ。我々はこのために世界を横断してきたのだ。"
 circumnavigation_expedition_events.12.cloves_loaded_tt: "残っている船の船倉に[ShowGoodsName('cloves')]が満載される。[ShowGoodsNameWithNoTooltip('cloves')]は艦隊の帰還時、[ROOT.GetCountry.GetCapital.GetMarket.GetName]で売却される。太平洋を無事横断できた船員が多いほど、より多くの積荷を持ち帰る"
 circumnavigation_expedition_events.12.b: "スルタンと条約を結ぶぞ。同盟は積荷よりも価値がある。"
 circumnavigation_expedition_events.12.treaty_cargo_tt: "スルタンと条約を結び、ある程度の量の[ShowGoodsName('cloves')]を積み込む。積荷は減るが、長い目で見れば香料諸島における友好関係の方が重要である"
 circumnavigation_expedition_events.12.historical_info: "本来の「香料諸島」であるモルッカ諸島は、東方交易の価値を大いに高めたクローブ、ナツメグ、メースの産地だった。エルカーノの艦隊がティドレに到達したのは1521年11月で、同地のスルタンは当時、ポルトガルの勢力圏に含まれていたテルナテと対立していた。一行はヴィクトリア号とトリニダード号にクローブを積み込んだが、トリニダード号はのちに太平洋を東に横断して戻ろうとした際に風に阻まれて失敗し、ポルトガルに拿捕されてしまった。こうしてエルカーノ率いるヴィクトリア号は、単独で西へ進みつづけることとなったのである。そして1522年9月、ヴィクトリア号は18人の生存者と船倉いっぱいのクローブをのせ、ついにサンルーカル・デ・バラメダへの帰還を果たした。この1隻分の香辛料は3年にわたる遠征にかかった費用をすべてまかない、さらには利益までもたらした。"
 circumnavigation_expedition_events.13.title: "喜望峰の通過"
 circumnavigation_expedition_events.13.desc: "喜望峰は、船乗りの言い伝え通りの恐ろしい場所だった。壁のように立ちはだかる灰色の海と暴風が、船を木の葉のように翻弄した。残っていた船員たちは、それでも文句を言わなかった。通り抜けられるはずがない海峡、名もなき大洋、そして危うく艦隊が壊滅しかけた諸島を切り抜けてきたいまとなっては、喜望峰などありふれた障害に過ぎない。\n\nヴィクトリア号が岬を回りきり、風が弱まると、[target_leader.GetName]はまず東を見やり、それから西を眺めた。自分たちはついに、世界に存在するすべての大洋を経験したのだ。"
 circumnavigation_expedition_events.13.a: "感謝を捧げよう。この先何が起ころうと、我々は歴史に残る。"
 circumnavigation_expedition_events.13.b: "感傷は不要だ。北に向かえ。まだ帰還できたわけではない。"
 circumnavigation_expedition_events.13.historical_info: "ヴィクトリア号はエルカーノの指揮のもと、1522年5月に喜望峰を回り、スペイン帰還にあたり残っていた最後の大きな地理的難所を突破した。ただし、喜望峰航路とその補給港はポルトガルの支配下にあった。スペインとポルトガルはトルデシリャス条約におけるモルッカ諸島の主権をめぐって争っており、遠征隊の法的立場も曖昧だったため、エルカーノはそういった補給港を避けた。ヴィクトリア号の状態は劣悪で、浸水が起こっていたほか、当初270人いた乗組員が18人にまで減り、ほとんど限界に達していた。一行がサンルーカル・デ・バラメダへに帰還し、3年弱をかけて史上初の地球一周を成し遂げたのはを1522年9月6日のことだった。"
 circumnavigation_expedition_events.14.title: "友好的な海岸"
 circumnavigation_expedition_events.14.desc: "前方の島々には、[ROOT.GetCountry.GetName]の旗が翻っていた。どの海図にも載っていない海域を何年も航海しつづけた末、艦隊はついに友好的な土地へたどり着いた。ここには恐れる必要も、騙される心配もなく、浸水を止め、樽を満たし、やせ細った船員たちが食事をとれる港がある。当地の総督の配下の者たちは、埠頭までやって来ると、世界を一周してきたと主張する、痩せこけてぼろぼろの男たちを呆然と見つめた。\n\n母国の海は近い。[target_leader.GetName]が決めるべきは、ここでどれぐらい休息を取るかだけだ。"
 circumnavigation_expedition_events.14.a: "船を整備しろ。継ぎ目を塞ぎ、船員たちに食事をとらせてやれ。"
 circumnavigation_expedition_events.14.b: "少し立ち寄るだけだ。しっかりと休むのは帰還してからだ。"
 circumnavigation_expedition_events.14.historical_info: "マゼランの時代のカーボベルデ諸島はポルトガル領で、スペイン船が公然と補給をおこなえる場所ではなかった。だが大西洋の島々を領有する国からすれば、帰国前の最後の貴重な中継地点であった。この安全な場所では、史上最長の旅路でボロボロになった船を傾けて修理し、水や食糧を補給することができただろう。"
 circumnavigation_expedition_events.15.title: "認識"
 circumnavigation_expedition_events.15.desc: "最後の船はあらゆる継ぎ目から浸水し、船員たちは飢えていたが、たどり着ける範囲の唯一の港は敵対国の旗を掲げていた。[target_leader.GetName]は素性を偽り、スペイン船が立ち入るべきではない東方からではなく、アメリカ大陸から帰還する最中の船として入港するよう命じた。だが上陸して日付を尋ねると、認識と1日ずれていた。世界を一周する過程のどこかで、艦隊は1日を失っていたのだ。この矛盾のせいで、すべてが露見しかねない。\n\n食糧は目と鼻の先にあるが、手に入れるにはうまく騙し通す必要がある。"
 circumnavigation_expedition_events.15.a: "話を変えるな。詮索される前に、手早く食糧を買い込むんだ。"
 circumnavigation_expedition_events.15.ruse_ok_tt: "作り話が通じる。食糧を買い、追及が厳しくなる前に船はこっそりと出航する"
 circumnavigation_expedition_events.15.ruse_failed_tt: "1日のずれから嘘が露見し、上陸した者たちの一部が出航前に捕まる"
 circumnavigation_expedition_events.15.b: "敵対国の港に入る危険は冒せない。飢えは厳しいが、このまま帰国を目指すぞ。"
 circumnavigation_expedition_events.15.historical_info: "1522年7月、ヴィクトリア号はカーボベルデ諸島のポルトガル領サンティアゴ島に入港。ポルトガルが主権を主張している東方の海域を通ってきたのだが、その事実を隠すため、アメリカ大陸から帰還中の船だと偽り寄港した。しかしこの計略は、航海日誌の日付が1日ずれているせいで疑いを持たれ、見破られてしまう。これは、地球を一周することで日付がずれることが証明された世界初の事例である。ポルトガルに船員13名が捕らえられると、残りの者たちは索を切って逃走し、船員わずか18名でスペインを目指した。"
 circumnavigation_expedition_events.16.title: "不毛の停泊地"
 circumnavigation_expedition_events.16.desc: "その島々は無人で乾燥しており、風食を受けた多くの岩と低木ばかりだったが、それでも陸は陸で、風や波を避けられる地形や、岩に囲まれた湧き水もあった。さらにありがたいことに、以前ここを訪れた船が残したであろうヤギが野生化し、斜面を走り回っていた。腐ったりゾウムシが沸いた食料しか口にできない時期が長かった水兵たちは、新鮮な肉のことを考えただけで涎があふれてきた。\n\nここに停泊しても失うのは時間だけで、帰路についている船は時間に余裕がある。[target_leader.GetName]は、命令を下さなくてはならない。"
 circumnavigation_expedition_events.16.a: "ハンターを上陸させてヤギを狩り、泉で水を補給せよ。"
 circumnavigation_expedition_events.16.b: "水だけ補給して先に進むぞ。母国はもうすぐ近くだ。"
 circumnavigation_expedition_events.16.historical_info: "通りすがりの船が大西洋の無人島にヤギやブタを放ち、それらが繁殖して野生の群れを形成し、あとから来た船員たちの思いがけない非常食になるというのはよくあることだった。無人でも水を得られる島が帰国途中にあれば、数日の遅れと引き換えに、疲れきった遠征隊は新鮮な肉と清浄な水を手に入れることができた。帰国まであとわずかというところで得られる、ささやかながらも確かな恵みだ。"
 circumnavigation_expedition_events.17.title: "船は戻らず"
 circumnavigation_expedition_events.17.desc: "いくつ季節がめぐっても艦隊からの報せは来ず、[capital_location.GetName]の者たちは希望を失っていた。遠征隊が帰ってくることはないだろう。未知の世界のどこかで広大すぎる海に呑み込まれたか、航海を続けられないほど船や人手が減ったかで、艦隊は失われてしまったのだ。世界一周を目指して出発した艦隊から戻ってきたのは、沈黙と死者の名前だけだった。\n\n夢を追い求めた者たちが命を落としても、夢は生きつづける。違う王の時代、違う船員たちが、この艦隊の始めたことを成し遂げるかもしれない。"
 circumnavigation_expedition_events.17.a: "彼らのことを忘れはしない。"
 circumnavigation_expedition_events.17.end_tt: "遠征隊は行方不明となり、その航海がここで終わりを迎える"
 circumnavigation_expedition_events.17.historical_info: "1525年、ガルシア・ホフレ・デ・ロアイサ率いる7隻の船が、マゼランの航路をたどるために出航した。そのうちモルッカ諸島にたどり着けたのは、ボロボロになった1隻とわずかな船員たちのみで、東の航路を使って帰還した者は1人もいなかった。当時、全滅は現実的な危険だった。世界一周を成し遂げるには、補給の見込みがない状態で何年も航行しつづける必要があり、太平洋に呑み込まれた艦隊は消息が一切わからないままになることもあった。"
 circumnavigation_expedition_events.18.title: "反乱"
 circumnavigation_expedition_events.18.desc: "それはよくある兆候で始まった。夜の見張り中につぶやかれる一言、士官が通りがかると黙り込む船員たち、[target_leader.GetName]と目を合わせなくなった船長。食料が不足し、船員たちは寒さと恐怖にさらされている。彼らはインディアスへの航海だと聞いたから契約したのであって、世界の果てに行くとは思っていなかった。そしていま、不満は明確な形で噴出し、船長の一人が船員たちの支持のもと公然と命令を無視し、艦隊を反転させて帰還するよう求めている。\n\nあと1日もすれば、この「腐敗」がほかの船にも広がるだろう。[target_leader.GetNameWithNoTooltip]は、いますぐ然るべき決断を下さなければならない。"
 circumnavigation_expedition_events.18.a: "不満がある者は引き返せばいい。連中なしで先に進むぞ。"
 circumnavigation_expedition_events.18.b: "反乱を鎮圧せよ。首謀者には責任を取らせる。"
 circumnavigation_expedition_events.18.fight_win_tt: "反乱は鎮圧され、首謀者たちは見せしめにされる。秩序は戻るが、処罰に時間がかかってしまう"
 circumnavigation_expedition_events.18.fight_lose_tt: "本格的な戦闘になり、鎮圧に手間取ってしまう。秩序を回復するまでの混乱のなかで艦隊は船を1隻失い、航海にも遅れが生じる"
 circumnavigation_expedition_events.18.c: "水平線の彼方に何が待っているか、思い出させてやろう。"
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName]は甲板を歩いて船員たちに語りかけ、非凡な指揮官ぶりを発揮する。反乱の気運は消え去り、船員の士気が以前よりも高まる"
 circumnavigation_expedition_events.19.title: "同胞のいる海岸"
 circumnavigation_expedition_events.19.desc: "広大な[ShowContinentName('atlantic_ocean_continent')]を何週間も航海した末、細い緑の線が西の水平線上に現れた。そこには小さな港町があり、わが国の旗が翻っている。はるか遠方の海岸に築かれた[ROOT.GetCountry.GetName]の植民地は、同じ旗を掲げる艦隊に倉庫を開放してくれた。真水や果物、塩漬け肉、そして修復用の木材まで、同胞ならすべて自由に持っていって構わないそうだ。\n\n[target_leader.GetName]は船に積めるだけの物を積んだうえで、未知の南方に向かうことができる。"
 circumnavigation_expedition_events.19.a: "休息を取り、限界まで食料を補給せよ。友好的な土地は貴重だ。"
 circumnavigation_expedition_events.19.b: "感謝しつつ少しだけ休んだら南下するぞ。季節は待ってくれない。"
 circumnavigation_expedition_events.19.historical_info: "ブラジル北東部にあるペルナンブーコ、パライバ、リオ・グランデは、新大陸において特に早くイベリアの入植が進んだ豊かな地域だった。沿岸部にはブラジルボクという種の木が生え、やがて砂糖の生産もおこなわれるようになった。こういった港を所有する国であれば、自国の艦隊が南方への長い航海に出る前に水や食料を補給できただろう。だが敵対国に支配された海域を慎重に進んでいたマゼランは、その恩恵にあずかることはできなかった。"
 circumnavigation_expedition_events.20.title: "敵対国が支配する沿岸部"
 circumnavigation_expedition_events.20.desc: "広大な[ShowContinentName('atlantic_ocean_continent')]を何週間も航海した末、細い緑の線が西の水平線上に現れた。そこには港があったが、掲げているのは[rival_crown.GetName]の旗だった。この沿岸部は連中の植民地に支配されており、わが国の艦隊には波止場を合法的に利用する権利がない。しかしながら、倉庫には物資がぎっしりと入っており、商館員は十分な金さえ払えば取引に応じる。そして我々の船員たちは飢え、ゾウムシまみれのビスケット以外の物を喉から手が出るほど欲しがっている。\n\n敵対国の砲台がにらみを利かせるなかで入港するか、あるいは進路を維持して南に向かうか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.20.a: "[rival_crown.GetNameWithNoTooltip]の植民地と慎重に取引し、食料を手に入れるぞ。"
 circumnavigation_expedition_events.20.b: "敵対国の港は避けろ。南に向かうのだ。"
 circumnavigation_expedition_events.20.historical_info: "ブラジルの沿岸部はトルデシリャス条約における「ポルトガルに属する世界の半分」に該当したため、カスティーリャに仕える艦隊はこの地域の港を利用する権利を持たなかった。実際には、飢えた船員たちが、商売に前向きな植民地の商館員と密かに食料を取引することも可能だったが、敵対国の港に入れば捕まったり、強請られたり、入港権を証明できない船を没収されたりする危険はつねに付きまとった。"
 circumnavigation_expedition_events.21.title: "壊血病の発生"
 circumnavigation_expedition_events.21.desc: "長期間の航海に付き物な、あの病がついに発生した。歯茎が黒ずんで出血し、古い傷痕が勝手に開き、歯はぐらつき、1ヵ月前まで壮健だった船員たちが甲板から起き上がれなくなっている。船医にできることは休息する時間と新鮮な食料を与えることだけだが、どちらも希少だ。\n\n瀕死の船員たちにどれだけ無理をさせるか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.21.a: "新鮮な食料を配給し、最悪の状態から脱するまで安静にさせろ。"
 circumnavigation_expedition_events.21.b: "時間がない。このまま進め。体力がある者は耐えられる。"
 circumnavigation_expedition_events.21.b.tt: "病人たちの運命を天に任せ、苦しい航海は続く。多くの病人が対岸にたどり着くことなく命を落とし、生き残りの数があまりにも少なくなり、すべての船を帰還させることはできなくなる"
 circumnavigation_expedition_events.22.title: "大嵐"
 circumnavigation_expedition_events.22.desc: "空が痣のような色に変わり、海は灰色の山のように盛り上がった。風は索具に爪を突き立てるような勢いで、船は塔を呑み込めるほどの波の谷間をどうにか進んでいた。甲板には大量の海水が押し寄せ、水先案内人たちは最早ほかの船を見失っていた。\n\n嵐に正面から立ち向かうか、あるいは嵐に背を向けて脱出し、艦隊が離れ離れにならないことを祈るか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.22.a: "停船して帆を畳め。嵐を耐え抜くぞ。"
 circumnavigation_expedition_events.22.b: "この風を追い風として使い、全速力で離脱する。"
 circumnavigation_expedition_events.22.b.win_tt: "艦隊は嵐の最悪な部分を通り抜ける。散り散りになり、動揺はしているものの、艦隊そのものは無事だ"
 circumnavigation_expedition_events.22.b.lose_tt: "賭けは失敗する。艦隊は暗闇のなかで散り散りになり、翌朝に行方がわからない船が出るかもしれない"
 circumnavigation_expedition_events.23.title: "船体を蝕む虫"
 circumnavigation_expedition_events.23.desc: "この温暖な海域では、フナクイムシが船大工の対処が間に合わないほどの速さで船板を食い進み、まるでハチの巣のような有様にしてしまう。手動のポンプを昼夜を問わず動かしつづけても、船底の浸水は酷くなる一方だ。ここまで傷んだ船体では、船を傾けて本格的な修理をしなければ到底大洋を渡ることはできない。船を浜に乗り上げさせ、船底のフナクイムシどもを焼き、船板の継ぎ目に防水処理を施す必要がある。\n\nどうやって艦隊を航行させつづけるか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.23.a: "できるかぎり人けのない浜を見つけ、船を傾けて修理せよ。"
 circumnavigation_expedition_events.23.a.tt: "艦隊は誰もいない海岸で船を傾け、可能な範囲で対処する。作業は大変で時間もかかるが、船体はしばらく持ちこたえられるようになる"
 circumnavigation_expedition_events.23.b: "一番状態の悪い船を放棄し、乗組員を残りの船へ詰め込め。"
 circumnavigation_expedition_events.23.c: "近くにある友好的な港に向かい、そこで船を修理しよう。"
 circumnavigation_expedition_events.23.c.tt: "艦隊は近くの友好的な港に入港し、安全に修理をおこなう。人けのない浜での応急処置よりはるかにしっかりと修理できるうえに、船員も待望の休息を取れる"
 circumnavigation_expedition_events.24.title: "凪"
 circumnavigation_expedition_events.24.desc: "風が完全に止んだ。帆はマストにだらりと垂れ下がり、白く霞んだ苛烈な空の下、海は波一つなく鏡のようだ。船は何日たってもその場から動けず、樽の水は悪くなり、食料は減っていくばかりだ。船員たちはまず不機嫌になり、次に怯えはじめ、自分たちは風が届かない世界の果てまで来てしまい、もう二度と風は吹かないのだと呟いている。\n\nただ待つか、あるいはボートをオールで漕がせるか、[target_leader.GetName]は決断を下さなければならない。"
 circumnavigation_expedition_events.24.a: "どれだけ長くかかろうと、風が吹くのを待とう。"
 circumnavigation_expedition_events.24.b: "ボートを出せ。船を引き、力ずくで動かすのだ。"
 circumnavigation_expedition_events.25.title: "人手不足"
 circumnavigation_expedition_events.25.desc: "死者や身動きも取れない状態の船員があまりにも多く、すべての船に十分な人員を配置して動かすことが不可能になった。もはや、ほかに選択肢はない。1隻から使えるものをすべて外し、その船に残っているごく少数の健康な生存者たちは別の船に乗せ、空になった船は海に廃棄する。艦隊の規模は小さくなるが、少なくとも残った船には必要な数の人員を配置できる。"
 circumnavigation_expedition_events.25.a: "ほかに選択肢はない。廃棄する船の船員を、残りの船に振り分けろ。"
 circumnavigation_expedition_events.26.title: "船の沈没"
 circumnavigation_expedition_events.26.desc: "嵐がようやく収まり艦隊が再び集結すると、1隻が姿を消していた。風下の岸へ打ち上げられたのか、船板の継ぎ目が耐えられず暗闇のなかで沈んだのか、それとも単に水平線の彼方まで流されてはぐれたのか、誰にもわからない。結局その船が戻ることはなかった。海が船を、そして乗っていた者全員を呑み込んだのだ。"
 circumnavigation_expedition_events.26.a: "死者に祈りを捧げ、先に進もう。"
 circumnavigation_expedition_events.27.title: "人けのない海岸"
 circumnavigation_expedition_events.27.desc: "船倉の物資は底を突きかけているが、船の横には背の低い植物に覆われた海岸が広がっている。見張りが確認できた範囲では人は住んでおらず、調理の煙が上がっていたり、カヌーが出てきたりということはない。岩場では勢いよく流れる真水がいくつもの筋を作っており、浅瀬には野鳥が群れ、森では果物や木材、狩りの獲物を期待できる。いずれも上陸さえすれば手に入れられるだろう。\n\n十分な量を集めるには数日を費やすことになるが、艦隊に時間の余裕はほとんどない。かと言って飢餓の代償はそれ以上に大きい。[target_leader.GetName]は、命令を下さなくてはならない。"
 circumnavigation_expedition_events.27.a: "上陸せよ。樽に水を補給し、木材や果物、肉を集めるのだ。"
 circumnavigation_expedition_events.27.b: "物資を集めている時間はない。腹が減っていようが前進あるのみだ。"
 circumnavigation_expedition_events.28.title: "海岸の居住地との取引"
 circumnavigation_expedition_events.28.desc.christian: "船倉の物資は底を突きかけているが、付近の海岸にキリスト教の[trade_shore.GetRank.GetName]があった。海の向こうから教会の鐘の音がかすかに聞こえてくるほか、港を見下ろすように十字架が1つ掲げられている。住人たちがボートに乗って出てきて、見知らぬ者たちの様子を伺っている。警戒してはいるが、取引に応じる気はあるようだ。そして信仰が共通していれば、取引のための言葉も見つけやすい。通貨や交易品を出せば、穀物、塩漬け肉、果物、そして真水のすべてが手に入るだろう。\n\n数日ここに停泊すれば、再び艦隊の倉庫をいっぱいにできる。航海の遅れと底を突きかけている物資のどちらを優先すべきか、[target_leader.GetName]は考えている。"
 circumnavigation_expedition_events.28.desc.muslim: "船倉の物資は底を突きかけているが、付近の海岸にイスラム教徒の[trade_shore.GetRank.GetName]があった。海の向こうから祈りの呼びかけが聞こえてくるほか、海岸沿いにダウ船が並んでいる。世界中の海で商売をしていただけあり、商人たちが抜け目なく、そして物怖じせず艦隊を出迎えてくる。十分な貨幣と適切な交易品さえあれば、米、ナツメヤシ、塩漬けの魚、そして真水のすべてが手に入るだろう。\n\n数日ここに停泊すれば、再び艦隊の倉庫をいっぱいにできる。航海の遅れと底を突きかけている物資のどちらを優先すべきか、[target_leader.GetName]は考えている。"
 circumnavigation_expedition_events.28.desc.pagan: "船倉の物資は底を突きかけているが、付近の海岸に[trade_shore.GetRank.GetName]があった。住民たちは艦隊付き聖職者が名前を聞いたことがない神々を信仰している。カヌーに乗って慎重に出てきた彼らは、根菜や果物、魚、そして真水を入れたヒョウタンを差し出し、代わりに見知らぬ者たち（我々のことだ）が見せた鉄や布、装飾品に興味を示した。互いに言葉はわからないが、空腹と物々交換の意図は言葉がなくとも通じる。\n\nここで数日かけて取引すれば、再び艦隊の倉庫をいっぱいにできる。航海の遅れと底を突きかけている物資のどちらを優先すべきか、[target_leader.GetName]は考えている。"
 circumnavigation_expedition_events.28.a: "入港して取引し、艦隊が持っていける限界まであらゆる食料を確保しよう。"
 circumnavigation_expedition_events.28.b: "物々交換をしている時間はない。腹が減っていようが前進あるのみだ。"
