l_japanese:
 pilgrimage_expedition_events.1.title: "聖都、[current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.1.desc: "長く疲労の募る旅を幾月も続け、[target_ruler.GetName]がついに[current_location.GetName]の城壁にたどり着いた。ここは磔刑の地、復活の地、そしてキリスト教世界で最も神聖な地である。千人もの巡礼者により巻き上げられた埃が空中に漂い、百もの礼拝堂から流れてくる香の煙と混じり合っている。\n\nその中心にそびえるのは、ゴルゴダの丘の岩そのものを覆うように建てられた聖墳墓教会だ。[target_ruler.GetSheHe|U]はこの瞬間のために遠路はるばる旅をしてきた。長い道のり、水ぶくれのできた足、眠れぬ夜。大扉が開き、聖油と古い石の香りが[target_ruler.GetHimHer]を迎えるように流れ出した瞬間、そのすべてが消え去っていく。"
 pilgrimage_expedition_events.1.a: "聖墳墓教会の前にひれ伏す。"
 pilgrimage_expedition_events.1.b: "[ROOT.GetCountry.GetNameWithNoTooltip]の名を冠した礼拝堂の建設を命じよ。"
 pilgrimage_expedition_events.1.historical_info: "エルサレムは、コンスタンティヌス帝がキリストの埋葬と復活の地に聖墳墓教会の建立を命じた4世紀以来、キリスト教徒の巡礼者を引きつけてきた。十字軍の時代、この都市は幾度も支配者を変えた。1099年には第1回十字軍に占領され、1187年にはサラディンに奪われ、1229年にはフリードリヒ2世のもとで条約によって一時奪還されたものの、最終的にマムルーク朝の支配下に入った。キリスト教徒の支配が失われたあとも、外交上の取り決めによって巡礼者は聖地を訪れつづけることができたため、エルサレムは中世世界におけるカトリック信徒の最高の巡礼地となった。"
 pilgrimage_expedition_events.2.title: "永遠の都"
 pilgrimage_expedition_events.2.desc: "[target_ruler.GetName]の一行がテベレ川に架かる最後の橋を渡るころ、[current_location.GetName]の街並みがゆっくりと平原の向こうに姿を現す。午後の陽日を浴びて丸屋根や塔が輝いている。[current_location.GetRank.GetName]は広大で古く、その街路にはキリスト教世界の隅々から集まった巡礼者があふれ、誰もが同じ目に見えぬ流れに導かれている。\n\nバチカンの丘の頂には、サン・ピエトロ大聖堂が空を背景にそびえている。こここそキリストの代理者の座、地上における教会の生きた権威の所在地だ。[target_ruler.GetNameWithNoTooltip]は、[ShowReligionAdjective('catholic')]信仰の中心にいることに畏敬の念を抱いている。"
 pilgrimage_expedition_events.2.a: "神聖な権威を謙虚に認める。"
 pilgrimage_expedition_events.2.b: "我らが[ROOT.GetCountry.GetGovernment.GetRulerTitle]にふさわしい寄進をおこなう。"
 pilgrimage_expedition_events.2.c: "敬意は十分に示した。わが民が我々の帰国を待っている。"
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "ローマは、教会初期の時代からキリスト教の権威の座となった。その理由は使徒ペトロの殉教にあり、彼の墓はその名を冠した大聖堂の地下に眠っている。教皇権は精神的な権威に留まらず、世俗的な権力へと発展し、赦免や正統性、ペテロの後継者による祝福を求めるヨーロッパ各地の君主や巡礼者を引き寄せた。教皇ボニファティウス8世のもと1300年に始まった聖年は、数十万人もの巡礼者を引きつけ、ローマはカトリック巡礼の第一の目的地としての地位を確固たるものにした。"
 pilgrimage_expedition_events.3.title: "巡礼路の終着点"
 pilgrimage_expedition_events.3.desc: "サンティアゴ・デ・コンポステーラの巡礼路の終盤は、最も混雑する区間である。あらゆる道、あらゆる谷から巡礼者の列が合流し、[current_location.GetName]の大聖堂へと向かう。彼らの杖は使い古されて滑らかになり、マントは500リーグ（約2,400キロメートル）の旅路の塵にまみれている。涙を流す者もいれば、100マイルもの距離を裸足で歩いてきた者もいる。\n\n[target_ruler.GetName]は一行の先頭に立って馬を進めるが、大聖堂の塔が見えてくると馬から降りた。最後の区間は歩いて進むのがふさわしいように思えたのだ。巡礼者たちの賛歌が大きなうねりとなって風に乗る。「ウルトレイヤ！ ウルトレイヤ！」——道の石までもが、その歌に共鳴しているかのようだ。"
 pilgrimage_expedition_events.3.a: "聖ヤコブの墓前で感謝を捧げよ。"
 pilgrimage_expedition_events.3.b: "我らの統治に対する神の恩寵の証として、これを宣言する。"
 pilgrimage_expedition_events.3.c: "心に深く刻まれる1日であった。だが、我々にはまだ統治すべき[ROOT.GetCountry.GetFlavorRank]がある。"
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "使徒聖ヤコブへの信仰は9世紀にサンティアゴ・デ・コンポステーラで興った。ガリシア地方で聖ヤコブのものとされる聖遺物が発見され、アストゥリアス王アルフォンソ2世によって祀られたことに端を発する。こうして生まれた巡礼の道である「サンティアゴ・デ・コンポステーラの巡礼路」は、ローマやエルサレムと並ぶ、中世キリスト教世界の3大巡礼路のひとつとなった。12世紀までに、道沿いには病院、修道院、教会が立ち並ぶようになり、ヨーロッパ各国からの巡礼者がこの道を歩いた。サンティアゴに到達した巡礼者には、コンポステーラ巡礼証明書と全免償が授与された。"
 pilgrimage_expedition_events.4.title: "三賢者の聖棺"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName]は、いたるところに起重機と足場が立ち並ぶ[current_location.GetRank.GetName]である。この大聖堂は、すでに2世紀近くにわたって建設が続いており、未完成の塔は年ごとに高く伸びているが、完成した姿は、まだ生まれてもいない世代の人々が見ることとなるだろう。だが、未完成とはいえ、その建物は測り知れないほど巨大で、人々は世界最大であると言う。\n\n南翼廊の奥、金箔と蝋燭の光に包まれた祭壇の背後には、三賢者の聖棺がある。星に導かれてベツレヘムへと向かった、東方の三賢者の遺骨を収めた黄金の聖遺物箱だ。[target_ruler.GetName]は幼いころからその話を聞いてきた。しかし、どれほど心構えをしていようと、実際に目にする感動は予想を優に超えるものだった。"
 pilgrimage_expedition_events.4.a: "ひざまずき、三賢者の聖棺を崇敬する。"
 pilgrimage_expedition_events.4.b: "大聖堂の建設に惜しみなく寄進する。"
 pilgrimage_expedition_events.4.c: "祈りを捧げ、それから旅を続ける。"
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "ケルンの三賢者の聖棺は西洋世界最大の聖遺物箱であり、聖書に登場する東方の三賢者の遺骨が安置されていると伝えられている。これらの聖遺物は、1164年のミラノ征服後に神聖ローマ皇帝フリードリヒ・バルバロッサの手に渡り、ケルン大司教ライナルト・フォン・ダセルへと寄贈された。聖遺物の到来によってケルンは北ヨーロッパ有数の巡礼地へと変貌を遂げ、1248年には壮大なゴシック様式の大聖堂の建設が開始した。この計画は1880年になってようやく完成することとなる。三賢者への信仰は、王権や公現祭と結びついていることから、神の承認を求める世俗の統治者たちにとってとりわけ大きな意味をもっていた。"
 pilgrimage_expedition_events.5.title: "[current_location.GetNameWithNoTooltip]の聖母"
 pilgrimage_expedition_events.5.desc: "[current_location.GetName]のステンドグラスは、言葉で表現できるものではなく、ただ目で見るしかないといわれている。身廊に立つ[target_ruler.GetName]は、その理由を悟った。大聖堂は青い光に満ちている。その光は幾千もの色ガラスを通り抜け、地上のものとは思えないものへ変容したのだ。その光は、石の床に揺らめく水たまりのように広がり、ひざまずく巡礼者たちの顔を照らし、主祭壇の背後に置かれた黄金の箱に収められた古代の聖遺物を照らす。\n\n受胎告知の際に聖母マリアが身に着けていたとされるヴェール——サンクタ・カミサは、カール大帝の時代から信徒たちをここに引きつけてきた。[target_ruler.GetNameWithNoTooltip]は微動だにせず立ち尽くし、思いがけず心を動かされている。"
 pilgrimage_expedition_events.5.a: "サンクタ・カミサを崇敬し、聖母に祈りを捧げる。"
 pilgrimage_expedition_events.5.b: "この場所の美しさは、じっくりと味わうに値する。"
 pilgrimage_expedition_events.5.c: "美しい大聖堂だ。しかし民が我々の帰国を待っている。"
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "シャルトル大聖堂はフランス・ゴシック建築の最高傑作のひとつであり、中世初期から巡礼地として知られている。その主要な聖遺物であるサンクタ・カミサは、受胎告知の際に聖母マリアが身につけていたとされる衣の一片で、カール大帝によって大聖堂に寄贈された。1194年、この旧ロマネスク様式建造物の大半が大火災により焼け落ちたが、サンクタ・カミサは被害を免れた。大聖堂はこの聖遺物を中心に驚異的な速さで再建され、1220年ごろに制作された西側のバラ窓とランセット窓は、世界でも特に名高い中世ステンドグラスのひとつとなっている。サンクタ・カミサの存在が、シャルトルをヨーロッパ有数の聖母マリア巡礼地にしたのである。"
 pilgrimage_expedition_events.6.title: "殉教者の聖堂"
 pilgrimage_expedition_events.6.desc: "[current_location.GetName]は緑豊かな[ShowCultureName('english')]の田園地帯にある浅い谷間に位置しており、旅人が到着する何マイルも前からその大聖堂の塔が見える。[current_location.GetRank.GetName]には巡礼者があふれ、宿舎は納屋や中庭にまであふれ出し、道という道には十数もの言語を話す人々がひしめき、全員が同じ場所を目指して進んでいる。\n\n聖トマス・ベケットの聖廟は、主祭壇の背後にある三位一体礼拝堂に置かれている。かつてここは、[ShowScriptedGeographyName('england_geography')]で最も豪華に飾られた聖堂で、宝石、金、あらゆる種類の奉納品で満たされていた。[target_ruler.GetName]はその前に立ち止まる。ここで、ある男が王に逆らったために命を落とした。そしてここで、その同じ反逆が聖性へと昇華した。どのように考えるにせよ、そこには何か教訓となるものがある。"
 pilgrimage_expedition_events.6.a: "蝋燭に火を灯し、ベケットの聖廟で祈りを捧げる。"
 pilgrimage_expedition_events.6.b: "信徒たちの魂のためにミサを依頼する。"
 pilgrimage_expedition_events.6.c: "聖人はすでに十分な数の統治者から敬意を払われてきた。我々は帰路につく。"
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "カンタベリー大司教トマス・ベケットは、1170年12月29日、イングランド王ヘンリー2世の暗黙の意向を受けた騎士たちによって、自らの聖堂内で暗殺された。彼の死はキリスト教世界に衝撃を与え、わずか3年後の1173年に列聖された。ヘンリー2世はベケットの墓前で公の懺悔を強いられ、その聖廟は瞬く間にイングランドで最も多くの巡礼者を集める場所となり、ジェフリー・チョーサーの『カンタベリー物語』によってその名は永遠に語り継がれることとなった。この聖堂は、2世紀以上にわたって寄贈された類まれな宝石や金で豪華に飾られ、フランス王ルイ7世から贈られた巨大なルビーである「フランスのレガール」も含まれていたが、1538年、ヘンリー8世は聖堂の破壊と宝物の没収を命じた。"
 pilgrimage_expedition_events.7.title: "聖パトリックの司教座"
 pilgrimage_expedition_events.7.desc: "[current_location.GetName]は[ShowRegionName('ireland_region')]北部の低い丘の上に位置しており、周囲の農地からはその2つの聖堂が見える。[ShowLocationName('rome')]や[ShowLocationName('jerusalem')]のような大都市ではないが、その古きよき歴史を、静かな威厳をもって纏っている。ここは[ShowRegionNameWithNoTooltip('ireland_region')]で最も古い[ShowReligionGroupAdjective('christian')]の共同体であり、聖パトリック自身がこの島に布教に訪れた際に設立した司教座である。\n\n[target_ruler.GetName]が到着したのは、まだ丘の上に朝霧が立ち込める早朝のことだった。大聖堂の参事会員が門で[target_ruler.GetHimHer]を出迎え、パトリックが祈りを捧げたとされる場所へと案内する。その場所の慎ましさは意外であったが、どこかふさわしくも感じられる。"
 pilgrimage_expedition_events.7.a: "聖パトリック大聖堂でミサに参列する。"
 pilgrimage_expedition_events.7.b: "聖パトリックの聖廟に奉納品を捧げる。"
 pilgrimage_expedition_events.7.c: "敬虔な訪問となった。帰還の時だ。"
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "アーマーは伝統的にアイルランドの宗教的首都とみなされており、その地位は、445年ごろにここへ主要な教会を建てたとされる聖パトリックとの結びつきに由来するものである。アーマーの司教座はアイルランド教会の首位司教座となり、その地位をめぐって、市内のふたつの丘に現在もそびえるカトリックとプロテスタントの大聖堂が争いつづけてきた。宗教改革が近づくにつれ、アーマーはその政治的権力だけではなく、アイルランドを改宗させた使徒の教会という象徴的な重みにおいても重要視されるようになった。そうしてここは、敬虔さを示したり、アイルランド教会との連帯を表明したりしようとする統治者たちにとって、重要な巡礼地となったのである。"
 pilgrimage_expedition_events.8.title: "巡礼路沿いの聖廟"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName]が、信仰の長い道のりにおけるもうひとつの中継地、[current_location.GetName]に到着した。かつてなんらかの聖遺物や聖人の記憶が巡礼者をここへ引き寄せたのだろう。そして、ここを通り過ぎる人々のほとんどがその詳細を忘れ去って久しい現在でもなお、世代を超えて巡礼者たちが訪れつづけている。\n\n[target_ruler.GetSheHe|U]は、自身の一行と同様に疲れ果て、埃にまみれた旅人たちのなかで足を止め、ここまで無事に旅を続けられたことに感謝する。"
 pilgrimage_expedition_events.8.a: "無事にここまで来られたことに感謝する。"
 pilgrimage_expedition_events.8.b: "後に続く巡礼者たちのために奉納品を残す。"
 pilgrimage_expedition_events.8.c: "この聖地を後にする時が来た。帰路につく。"
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.9.title: "悲しみのうちに終わる巡礼"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName]が旅の途中で命を落とし、巡礼は未完のまま終わることになった。この訃報は、最期まで[target_leader.GetHerHis]の傍らに寄り添っていた従者たちによって故郷へと伝えられ、ゆっくりと[ROOT.GetCountry.GetName]へと届くだろう。"
 pilgrimage_expedition_events.9.a: "この喪失を悼もう。"
 pilgrimage_expedition_events.17.title: "断念された巡礼"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName]は誓いを果たすことなく、巡礼の目的地にたどり着く前にその旅を断念し、帰路についた。誓いを破ったという報せは、[target_leader.GetHimHer]自身よりも先に[ROOT.GetCountry.GetName]へ届き、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]が忘れた後も、長くそのことを記憶にとどめるだろう。"
 pilgrimage_expedition_events.17.a: "我々は恥辱のうちに帰還する。神への誓いは果たされぬままだ。"
 pilgrimage_expedition_events.10.title: "アッシジの貧者"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName]が[current_location.GetName]へと続く最後の坂を登りきると、壮大な聖堂が姿を現す。淡い色の石で築かれた二層構造の聖堂は丘の中腹に建てられており、そこに祀られた男——何も所有しなかった乞食でありながら、いまやイタリア屈指の壮麗な教会のひとつを支配している男の死後、驚くべき速さで建設された。\n\n下層教会のなか、生きた岩盤を削り出して作られた地下聖堂には、アッシジのフランチェスコ自身が眠っている。[target_ruler.GetSheHe|U]は、絹や金を捨てて縄の帯と裸足を選び、鳥たちに説教をし、狼を手なずけたとも伝えられる男の墓の前にひざまずく。聖人の貧しさと、その記憶を称えて築かれた壮麗さとの矛盾は、[target_ruler.GetHimHer]にとって見過ごせないものである。"
 pilgrimage_expedition_events.10.a: "フランチェスコ自身がそうしたように、謙虚にひざまずく。"
 pilgrimage_expedition_events.10.b: "聖人の精神にならい、外の貧しい人々に施しを与える。"
 pilgrimage_expedition_events.10.c: "敬意は示した。故郷へ引き返す時だ。"
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "アッシジのフランチェスコ（1181/2～1226）は家族の富を捨て、貧しい生活を送り、謙虚さ、巡回説教、そして貧しい人々や病人の奉仕という原則に基づき、フランチェスコ会を設立した。彼は死からわずか2年後の1228年、教皇グレゴリウス9世により列聖されたが、これは中世史上でも特段早い列聖であった。同年にはサン・フランチェスコ大聖堂の建設が開始され、1253年までに概ね完成した。その下層教会と上層教会は、後にチマブーエやジョットによるものとされるフレスコ画で飾られた。聖人自身が物質的な富を拒んでいたにもかかわらず、アッシジはカトリック圏ヨーロッパにおける主要巡礼地のひとつとなり、統治者から一般の巡礼者まで多くの人々を引きつけた。"
 pilgrimage_expedition_events.11.title: "船乗りの守護聖人"
 pilgrimage_expedition_events.11.desc: "[target_ruler.GetName]がその城壁にたどり着くずっと前から、[current_location.GetName]には潮の香りが漂っている。この港湾の[current_location.GetRank.GetName]は、ひとつの偉大な宝物を中心に築かれたもので、大聖堂のロマネスク様式のアーチの下には、ミラのニコラオスの墓がある。100年以上前、地元の船乗りたちが、もはや自らを守る力を失った東方キリスト教世界の崩れかけた教会から、彼の遺骸を運び出してここへ移したのだ。\n\n年に一度、墓が開かれ、聖人の骨の周囲から澄んだ液体が汲みだされる。信徒たちはこれをマンナと呼び、[ShowReligionAdjective('catholic')]と[ShowReligionAdjective('orthodox')]の双方が、病を癒やす力を宿していると信じている。[target_ruler.GetName]はその小瓶を見せられ、今回の巡礼地のなかで、キリスト教会世界の双方がこれほどまでに等しく崇敬している聖地はほかにないという思いに打たれるのだった。"
 pilgrimage_expedition_events.11.a: "墓を崇敬し、マンナの小瓶を受け取る。"
 pilgrimage_expedition_events.11.b: "聖人を故郷へ連れ帰った船乗りたちのためにミサを依頼する。"
 pilgrimage_expedition_events.11.c: "聖人の祝福を受けた。さあ、故郷へ帰ろう。"
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "1087年、バーリの62人の船乗りが、当時セルジューク朝の征服の脅威にさらされていたリュキア地方のミラへと船で向かい、聖ニコラオスの遺骨が失われたり破壊されたりすることのないよう、それを運び出した。聖遺物は1087年5月9日にバーリへ到着し、この日はいまも聖遺物移送の祝日として祝われている。聖遺物を安置するためにサン・ニコラ聖堂が建設され、その地下聖堂は1089年、教皇ウルバヌス2世の臨席のもとで聖別された。聖遺物の到着以来、信徒たちがマンナと呼ぶ澄んだ液体が遺骨の周囲に生成されつづけ、毎年バーリ大司教によって汲み取られている。船乗り、商人、子供の守護聖人であり、カトリックと正教の双方で等しく熱心に崇敬される数少ない聖人のひとりでもあるニコラオスのおかげで、バーリはイタリアでも類を見ない巡礼地となった。"
 pilgrimage_expedition_events.12.title: "天使による聖別"
 pilgrimage_expedition_events.12.desc: "[current_location.GetName]のベネディクト会修道院は、[ShowCultureGroupName('swiss_group')]高地に広がる暗い森の端に位置しており、黒衣をまとった修道士たちは、何世代も前にこの地で盗賊によって殺害されたひとりの隠者を始祖としている。[target_ruler.GetName]は幼いころからこの物語を聞いてきた。ここの礼拝堂は司教によって聖別されたのではなく、献堂の前夜、キリスト自身が天使と聖人たちの聖歌隊を伴って降臨し、聖別したというのだ。\n\n聖母礼拝堂には、最初の、そして議論の的となった聖別の対象が安置されている。何世紀もの蝋燭の煙によって深い黒色へと変色した小さな聖母像だ。その御前にひざまずくドイツ語圏各地からの巡礼者たちは、[target_ruler.GetNameWithNoTooltip]が容易に想像できないほどはるか昔から、途切れることのない列をなしている。"
 pilgrimage_expedition_events.12.a: "黒い聖母像の前にひざまずき、静かに祈りを捧げる。"
 pilgrimage_expedition_events.12.b: "修道院の名高い図書館と写字室に寄進する。"
 pilgrimage_expedition_events.12.c: "この暗い森は十分見た。先へ進もう。"
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "アインジーデルンの起源は、この森に定住し、861年に盗賊に殺された隠者マインラートにさかのぼる。934年、修道士エーベルハルトのもとでこの地に正式な修道院が創設され、古くから伝わる伝説によれば、948年9月14日の夜、礼拝堂はキリスト自身によって奇跡的に聖別されたとされており、その主張は後に教皇レオ8世によって認められた。この修道院の黒い聖母像は何世紀にもわたって巡礼者の崇敬を集め、アインジーデルンはドイツ語圏で特に多くの人々が訪れる聖母巡礼地のひとつとなった。"
 pilgrimage_expedition_events.13.title: "輝く丘"
 pilgrimage_expedition_events.13.desc: "ヤスナ・グラ——すなわち輝く丘は、[target_ruler.GetName]が修道院の門にたどり着くはるか前から平原の上にそびえて立ち、その白い壁は、これを建設したパウロ会修道士たちが意図したに通りに光を受けて輝いている。内部では、奉納された銀製品と燃えつづける蝋燭の壁の奥に、顔の黒い聖母像のイコンが掲げられている。この質素な[ShowCultureGroupName('polish_group')]の[current_location.GetRank.GetName]を、北方各地から巡礼者が訪れる地へと変えた像だ。\n\n[target_ruler.GetName]がじっと見つめる聖母の顔には、2本の傷跡がある。右頬を横切る平行な傷で、どのような修復を施しても完全には消えなかった古い傷である。はるか昔、略奪者の剣が聖母像を傷つけた。その後、修復を試みた修道士たちは、新たな塗料を塗っても傷が何度も浮かび上がることに気づき、ついにはその傷を隠すことを諦めたのだ。"
 pilgrimage_expedition_events.13.a: "聖母像と、その消えることのない傷を崇敬する。"
 pilgrimage_expedition_events.13.b: "要塞化のために金を寄進し、再び略奪されることがないようにする。"
 pilgrimage_expedition_events.13.c: "輝く丘を目にした。さあ帰郷しよう。"
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "ヤスナ・グラのパウロ会修道院は、1382年にオポーレ公ヴワディスワフによって創設された。彼はビザンツ様式の聖母像のイコンを持ち込んだが、これはすでに奇跡を起こすものとして崇敬されていた。そして1430年の復活祭において、ボヘミア、モラヴィア、シレジアから来たフス派の略奪者たちが修道院を襲撃。イコンを粉々に砕き、サーベルで聖母の顔を二度切りつけた。クラクフのヴワディスワフ2世ヤギェウォの宮廷の修復師たちがその板絵を修復したが、塗り直すたびに傷跡が再び浮かび上がったため、最終的には像の恒久的な特徴として意図的に残された。こうしてチェンストホヴァの聖母はポーランドを代表する聖母巡礼地となり、傷跡のある顔はその後何世紀にもわたり、この地域一帯のイコンに写し取られつづけた。"
 pilgrimage_expedition_events.14.title: "聖イシュトヴァーンの司教座"
 pilgrimage_expedition_events.14.desc: "[current_location.GetName]はドナウ川が湾曲する地点に位置し、その大聖堂の丘は、かつてキリスト教世界の辺境をなしていた川を見下ろしている。ここにある幾度も再建された古い礼拝堂で、ハンガリーのイシュトヴァーンは生まれ、洗礼を受け、千年紀の変わり目の冬の日、ハンガリーの民にとって最初のキリスト教徒の王として戴冠した。\n\n[target_ruler.GetName]が、[current_location.GetNameWithNoTooltip]の大司教、すなわちハンガリーの首座大司教であり、イシュトヴァーン自身が創設した司教座を継承する人物に迎え入れられる。大司教は、古き神々ではなく洗礼を選び、宮殿を建てるより先にこの教会を築き、死後数十年のうちに列聖された若き王について語る。キリスト教徒の王冠はキリスト教会を礎としなければならぬということを、彼は理解していたのだ。"
 pilgrimage_expedition_events.14.a: "静かな祈りのなかで、聖イシュトヴァーンの偉業に敬意を表する。"
 pilgrimage_expedition_events.14.b: "ハンガリーの首座大司教と長時間にわたって協議する。"
 pilgrimage_expedition_events.14.c: "キリスト教徒の統治者にふさわしい訪問だった。出発の時だ。"
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "ハンガリーのイシュトヴァーン1世は975年ごろにエステルゴムで生まれ、1000年のクリスマスが近づくころ、同地で戴冠した。この出来事はキリスト教王国ハンガリーの正式な誕生を示すものとなった。1001年にイシュトヴァーンが国内最古となるエステルゴム大司教座を創設すると、以来その大司教たちは、ハンガリー首座大司教の地位を保持してきた。エステルゴムは13世紀半ばまで王国の政治的・宗教的中心地としての役割を果たし、1083年にイシュトヴァーン自身が列聖されると、ハンガリーのキリスト教信仰の精神的中心地としての地位を確固たるものにした。"
 pilgrimage_expedition_events.15.title: "クロアチアのナザレ"
 pilgrimage_expedition_events.15.desc: "[current_location.GetName]の湾を見下ろす丘には、フランシスコ会の質素な教会が建っている。ここを訪れる巡礼者たちは、教会が取り囲む空き地にはかつて非凡なものがあったと主張しており、彼らの話では、聖家族の家がこの地に3年間建っていたという。聖地が危険にさらされて守りきれなくなった際、天使たちが家を丸ごとナザレからこの地へ運び、やがてその家はイタリアのロレートへと奇跡的な旅を続けたのだそうだ。\n\n[target_ruler.GetName]の眼前にあるのは、その家の旅立ちに際し、教皇が[current_location.GetRank.GetName]を慰めるために贈った絵画である。それは聖母が幼子キリストに乳を与える姿を描いたもので、聖ルカ自身の作品と伝えられている。家が去った後も何世代にもわたり、この丘は巡礼者を引き寄せてきた。ここは、もう失われているにもかかわらず、なぜかいまなお、そこにありつづけるものを称える聖地なのだ。"
 pilgrimage_expedition_events.15.a: "トルサットの聖母の絵画を崇敬する。"
 pilgrimage_expedition_events.15.b: "海とともに生きる[current_location.GetRank.GetNameWithNoTooltip]で、安全な旅路を祈願するミサを依頼する。"
 pilgrimage_expedition_events.15.c: "聖なる家はロレートへと旅立った。我々も帰路につこう。"
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "伝承によれば、聖母マリアの住まいであったナザレの聖なる家は、1291年5月10日、天使たちによってリエカを見下ろすトルサットの丘へ運ばれ、3年間そこに留まった後、1294年12月10日にイタリアのロレートへ移された。フランコパン家のニコラ1世は、その家が建っていた場所を記念して、その地に最初の教会を建てた。そして1367年、教皇ウルバヌス5世は、家が去ったことへの慰めとして、聖ルカの作と伝えられる聖母子の絵画をこの聖地へ贈った。翌世紀以降はフランシスコ会修道士たちがこの聖地を守りつづけている。この伝説により、この町にはクロアチアのナザレという不朽の異名を得た。"
 pilgrimage_expedition_events.16.title: "殉教王"
 pilgrimage_expedition_events.16.desc: "[current_location.GetName]の大聖堂は、北の空を背景に、無骨な灰色の姿を見せている。この聖堂は、ある王の墓が死後1年余り経って開かれた砂州の上に建てられたもので、その際、立ち会った者全員は驚愕した。王の遺体が腐敗していなかったのだ。伝承によれば、暗い土のなかで彼の髪と爪は伸びつづけ、死の悪臭が漂うはずの棺からは、甘い香りが立ち上っていたという。\n\n[target_ruler.GetName]がオーラヴ・ハラルドソンの聖廟の前に立った。かつてはヴァイキングの首領であり、キリスト教を望まない王国にそれを強要しようとして戦死したが、死後1年も経たないうちに、遠く離れた教皇の承認を必要とすることなく、ただ人々の称賛によって聖人と宣言された。[target_ruler.GetNameWithNoTooltip]はこれを、奇妙な聖人認定だと考える。彼の聖性は、穏やかな敬虔さによってではなく、剣を振るい、後世になって初めて正義とみなされる大義のために命を落としたことで勝ち取られたのだ。"
 pilgrimage_expedition_events.16.a: "聖廟で、腐敗を知らない王を崇敬する。"
 pilgrimage_expedition_events.16.b: "オーラヴの教訓——剣による信仰もまた、信仰に変わりはない。"
 pilgrimage_expedition_events.16.c: "冷たく、神聖な場所だ。帰郷しよう。"
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "ノルウェー王オーラヴ・ハラルドソンは1030年7月29日のスティクレスタッドの戦いで、王位を取り戻し、武力によって王国のキリスト教化を完遂しようと戦って命を落とした。1年と5日後の1031年8月3日、墓が開かれた際、司教グリムケルが確認すると、見るかぎりでは遺体は腐敗しておらず、司祭はその発見のみを根拠にオーラヴを聖人と宣言した。そしてこの地での列聖は1164年、教皇アレクサンデル3世によって承認された。彼の聖廟の上にはニーダロス大聖堂が建てられ、北方を代表する巡礼地となり、スカンジナビア全域やさらに遠方から信者を引き寄せるようになった。彼らがたどった道筋は「聖オーラヴの道」と呼ばれ、今日も歩まれつづけている。"
 pilgrimage_expedition_events.18.title: "山越えの道"
 pilgrimage_expedition_events.18.desc: "街道は風に削られた荒涼とした土地へと登り、山腹に沿う小道へと狭まっていく。道が分岐する地点で[target_ruler.GetName]が立ち止まった。急登を避けて迂回する長い道と、地元の羊飼いたちが「準備不足の者は必ずしも生きては帰れない」と語る最短の道だ。\n\n[target_ruler.GetSheHe|U]は山越えの難しさと日程を天秤にかける。容易な道を探すために費やされる1日は、一行が旅の終着点に一歩も近づかない日となるのだ。"
 pilgrimage_expedition_events.18.a: "安全な足場を知り尽くした地元の案内人を雇う。"
 pilgrimage_expedition_events.18.b: "案内人を雇わず、信仰と足場に運命を委ねて先に進む。"
 pilgrimage_expedition_events.18.c: "引き返し、山脈を迂回する長い道を選ぶ。"
 pilgrimage_expedition_events.18.d: "落伍者たちだけで山を下らせる。"
 pilgrimage_expedition_events.19.title: "海上の嵐"
 pilgrimage_expedition_events.19.desc: "船の上空が前触れもなく暗くなり、1時間も経たないうちに、乗組員たちは舷側を越えて勢いよく打ち寄せる大波と格闘することになる。[target_ruler.GetName]は手すりを掴む前にマストに叩きつけられ、足元の甲板は生き物のように揺れ動いている。\n\n甲板の下では、巡礼者たちが固定されたものに必死にしがみつき、十数もの方言で一斉に祈りを捧げている。海が彼らへの試練を終えたと判断するまで、ほかにできることはほとんどない。"
 pilgrimage_expedition_events.19.a: "甲板下で嵐に耐え、船が持ちこたえることを願う。"
 pilgrimage_expedition_events.19.b: "一行を甲板に集め、嵐のなかで祈りを捧げる。"
 pilgrimage_expedition_events.19.c: "従者の一部を小舟に乗せ、船を軽くする。"
 pilgrimage_expedition_events.19.afloat_tt: "乗組員たちがなんとか船を浮かせつづける"
 pilgrimage_expedition_events.19.off_course_tt: "嵐によって船が大きく針路を外れる"
 pilgrimage_expedition_events.19.faith_protects_tt: "我らの信仰が嵐から守ってくれる"
 pilgrimage_expedition_events.19.piety_lacking_tt: "我々の信仰心は嵐に立ち向かうには足りない"
 pilgrimage_expedition_events.20.title: "川の渡渉"
 pilgrimage_expedition_events.20.desc: "街道が直近の雨で増水し茶色く濁った川の前で突然途切れる。本来なら浅瀬があるはずだが、馬でさえ足をすくわれかねないほど強い流れの下に沈んでいるのだ。対岸では渡し守がこちらを見ている。確かな硬貨の色を見るまでは、急いで渡る気などないようだ。\n\n[target_ruler.GetName]は川と渡し守を交互に見つめる。今日はいずれも、特別に信用できるようには見えない。"
 pilgrimage_expedition_events.20.a: "渡し守に金を払い、安全に渡る。"
 pilgrimage_expedition_events.20.b: "川を直接渡り、渡し賃を節約する。"
 pilgrimage_expedition_events.20.c: "従者の一部を別の渡河手段を探しに行かせる。"
 pilgrimage_expedition_events.21.title: "沼地の熱病"
 pilgrimage_expedition_events.21.desc: "街道は何マイルにもわたって低地の淀んだ水のなかに沈み、辺りには腐敗臭が立ち込め、皮膚を刺す虫の群れが飛び交っている。数日のうちに従者たちの咳は熱病へと変わり、歩けずに担がれて運ばれる旅人が何人も出ている。\n\n[target_ruler.GetName]は、この土地を進むごとに一行が痩せ細り、口数も少なくなっていく様子を見つめながら、このうちの一体何人が、疫病にかかるとは思いもせず、ただ巡礼のために加わったのだろうかと思いをめぐらせる。"
 pilgrimage_expedition_events.21.a: "先を急ぎ、沼地を後にする。"
 pilgrimage_expedition_events.21.b: "立ち止まり、病人が回復するのを待ってから先に進む。"
 pilgrimage_expedition_events.22.title: "街道を閉ざす冬"
 pilgrimage_expedition_events.22.desc: "前方の峠は人の背丈よりも高く積もった雪に閉ざされ、地元の村人たちは春になるまで誰もこの街道を越えられないと明言している。[target_ruler.GetName]は悪天候によって季節を棒に振ることを想定していなかったが、山が旅の計画に配慮してくれるわけなどない。\n\n懐が出費に耐えられるのであれば、近くの町には一行を受け入れられるだけの宿がある。あるいは、金さえ払えば、いまでも通り抜けられる道を教えると言う案内人たちもいる。"
 pilgrimage_expedition_events.22.a: "近くの町で冬が過ぎ去るのを待つ。"
 pilgrimage_expedition_events.22.b: "案内人と荷車を手配し、強行突破する。"
 pilgrimage_expedition_events.23.title: "領主のもてなし"
 pilgrimage_expedition_events.23.desc: "巡礼団が近づいているという報せは、一行が移動するよりも速く伝わり、地元の領主は自ら馬を走らせて[target_ruler.GetName]を出迎え、旅を続ける前に自らの食卓で休息するよう招待してきた。もてなしは手厚く、誰の目にも触れ、記憶に残ることを明らかに意図している。\n\n[target_ruler.GetSheHe|U]はその申し出の真意を見抜いている。適切な礼儀をもって受け入れれば、敬虔さと威信の両方を得られるのだ。"
 pilgrimage_expedition_events.23.a: "もてなしを丁重に受け入れる。"
 pilgrimage_expedition_events.23.a.host_opinion_tt: "[host_lord.GetName]は我々への[opinion|E]が+20される"
 pilgrimage_expedition_events.23.b: "足止めを断り、代わりにひそかに祈りを捧げる。"
 pilgrimage_expedition_events.24.title: "敵対する領主の通行料"
 pilgrimage_expedition_events.24.desc: "この先の街道は[ROOT.GetCountry.GetName]を敵とみなす領主の土地を通っており、その配下たちが国境の検問所で待ち構え、通行料を要求している。[target_ruler.GetName]は目立たずに通り抜けることを望んでいたが、その希望は街道を塞ぐ槍の列を見た瞬間に打ち砕かれた。\n\n徴収人は提案というより侮辱に近い金額を提示し、[target_ruler.GetHerHis]の誇りにどれほどの価値があるのかを見極めようと、返事を待っている。"
 pilgrimage_expedition_events.24.a: "要求された通行料を支払う。"
 pilgrimage_expedition_events.24.b: "手勢を率いて、力ずくで通り抜ける。"
 pilgrimage_expedition_events.24.c: "道を外れ、領地を迂回する遠回りの道を探す。"
 pilgrimage_expedition_events.25.title: "異教の地にて"
 pilgrimage_expedition_events.25.desc: "街道の途中には、[current_location.GetDominantReligion.GetAdjective]の信徒たちにとって神聖な聖堂があるが、そのイコンも儀式も馴染みのないものである。[target_ruler.GetName]は、礼拝に勤しむ現地の信者たちを観察する。見知らぬ一行に向ける彼らの眼差しには、好奇心とわずかな警戒心が入り混じっていた。\n\n巡礼者たちのあいだには、耳を傾けてくれる相手なら誰とでも信仰について議論するという古い習慣がある。[target_ruler.GetSheHe|U]は、今日がその議論に興じる日かどうかを思案する。"
 pilgrimage_expedition_events.25.a: "地元の者たちと真の信仰の優位性について議論する。"
 pilgrimage_expedition_events.25.b: "波風を立てず、静かに通り過ぎる。"
 pilgrimage_expedition_events.26.title: "道中の山賊"
 pilgrimage_expedition_events.26.desc: "荒野が道を一区間飲み込み、安全を守る領主の令状もない。一行が反応する間もなく、木々のあいだから男たちが現れる。武装し、身なりはぼろぼろで、どう見ても旅人を襲うことに慣れている。[target_ruler.GetName]はすばやくその数を数える。厄介なほどの人数ではあるが、軍隊と呼ぶほどではない。\n\n彼らの首領が前へ進み出て、安全な通行の代償を提示する。その口調からは、拒めばどうなるかが伝わってくる。"
 pilgrimage_expedition_events.26.a: "金を払って、手早く済ませよ。"
 pilgrimage_expedition_events.26.b: "巡礼の栄誉のために立ち向かい、戦え。"
 pilgrimage_expedition_events.26.c: "従者の一部を山賊に差し出し、安全な通行を買う。"
 pilgrimage_expedition_events.27.title: "一行に加わる巡礼者たち"
 pilgrimage_expedition_events.27.desc: "王の巡礼団が街道を進んでいるという報せは先へ先へと広まり、[target_ruler.GetName]が次の十字路に到着するころには、身なりの貧しい一般の巡礼者が集まっていた。統治者の従者による庇護のもと、残りの道を進みたいと望んでいるのだ。\n\nそのなかには家族連れや、1人ではもう長く歩けそうにない徒歩の老人たちもいる。[target_ruler.GetSheHe|U]は一行全員をいつまでも養うことはできないが、ここで彼らを追い払うことは、自力で生きていくよう突き放すことを意味する。"
 pilgrimage_expedition_events.27.a: "彼らを一行に迎え入れよ。"
 pilgrimage_expedition_events.27.b: "旅の速度を保つため、彼らを追い払え。"
 pilgrimage_expedition_events.29.title: "沿岸の私掠船"
 pilgrimage_expedition_events.29.desc: "低く暗い船体が水平線を横切り、陽光にオールをきらめかせながら、まっとうな商船が航行する以上の速さで巡礼船に迫ってくる。[target_ruler.GetName]は見張りが叫ぶよりもはるか前に私掠船の輪郭を認識するが、近くには港も海岸もなく、助けてくれる者もいない。\n\n[target_ruler.GetSheHe|U]は随行員のなかから、戦える者をできるかぎり甲板に集め、敵を撃退できるだけの戦力があるのか、あるいは船の物資に戦いの代償よりも価値があるかを天秤にかける。"
 pilgrimage_expedition_events.29.a: "武器を取り、奴らを撃退せよ。"
 pilgrimage_expedition_events.29.b: "船の物資を明け渡し、奴らが満足することを祈ろう。"
 pilgrimage_expedition_events.29.c: "従者の一部を代償に、船の安全を買う。"
 pilgrimage_expedition_events.30.title: "身代金目的の拘束"
 pilgrimage_expedition_events.30.desc: "旅の途中で随行員の数が減ったことで[target_ruler.GetName]は格好の標的となり、道中の誰かがそれに気づいた。護衛を整える間もなく武装した男たちが一行を取り囲み、彼らの首領は商人がパンの値段でも告げるかのように、平然と統治者の自由に対する代価を提示した。\n\n[target_ruler.GetSheHe|U]が頼れる者はほとんど残っておらず、有効な選択肢はさらに少ない。"
 pilgrimage_expedition_events.30.a: "要求された身代金を支払う。"
 pilgrimage_expedition_events.30.b: "闇に紛れて逃走を試みる。"
 pilgrimage_expedition_events.28.title: "空の食料貯蔵庫"
 pilgrimage_expedition_events.28.desc: "まともな町を最後に過ぎたあたりで一行の食料は底をつき、従者たちの腹はかつてパンが入っていた袋と同じくらい空っぽである。[target_ruler.GetName]はこれまで軍を率いた経験がなく、その未熟さが露呈している。これから進む道がどれほど神聖であろうと、飢えは容赦してくれない。\n\n幸い、この土地にはまだ頼れるものがある。手近な場所に畑や果樹園、そして村の市場があるのだ。ただし、一行がそれらを活用するために必要な時間や金、あるいは誇りを犠牲にする覚悟があるならば、の話だが。"
 pilgrimage_expedition_events.28.a: "従者たちを派遣し、田園地帯で食料を調達させよ。"
 pilgrimage_expedition_events.28.b: "見つかるかぎりの食料を買い求めよ。値段は問わない。"
 pilgrimage_expedition_events.28.c: "打つ手がない。引き返そう。"
 pilgrimage_resupply_light: "地元の者たちに金を払い、新しい乗用馬、食料、雇い人を確保せよ。"
 pilgrimage_resupply_heavy: "補給と従者の増強に惜しみなく費用を投じよ。"
