l_japanese:
 treasure_fleet_events.1.title: "宝船船団の時代"
 treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$"
 treasure_fleet_events.1.desc: "この数十年の繁栄により、わが国は外交に充てられる潤沢な資金と資源を蓄えることができた。これらを活かし、世界における[GetInternationalOrganization('middle_kingdom').GetName]の地位をさらに強固なものとすべきである。そのために、[ROOT.GetCountry.GetName]が用意できるかぎりの豪華な贈り物を積んだ船団を各地へ送り出し、より多くの国々をわが国の[ShowSubjectTypeName('tributary')]として迎え入れよう。"
 treasure_fleet_events.1.a: "いざ、出航だ！"
 treasure_fleet_events.1.zheng_he_owned_tt: "鄭和が現在わが国に仕えていなければならない"
 chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName]は、[action|e]「[ShowGenericActionName('start_a_treasure_voyage')]」を使用し、[gold|e]を消費することで、より多くの国を[ShowSubjectTypeName('tributary')]制度に組み込むことができる。これは[GetInternationalOrganizationType('middle_kingdom').GetName]の[international_organization_leader_short|e]である場合のみ可能。"
 treasure_fleet_events.2.title: "時代の終わり"
 treasure_fleet_events.2.desc: "[ROOT.GetCountry.GetName]は宝船船団の成果を振り返り、わずかな威信を得るために資源をいたずらに浪費しただけだったとみなしている。こうした事績は、歴史の記録から省かれるのが望ましい。"
 treasure_fleet_events.2.a: "現実を受け入れよう。"
 chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName]は[ShowGenericActionName('start_a_treasure_voyage')]を使用できなくなる。"
 treasure_fleet_events.3.title: "遠征の開始"
 treasure_fleet_events.3.desc: "数週間にわたる準備を経て、わが大艦隊がついに[target_area.GetName]へ向け出航する時を迎えた。$expedition_leader_name$と乗組員たちが道中でどのような冒険や災難に遭遇するかはわからない。だが、[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]がこれほどの大任を託した者たちである以上、期待を裏切ることはないだろう。\n\n計画どおり、船団は夜明けとともに[start_location.GetName]の港を出航する。再びわが国へ戻るまで、何年もの歳月を要するかもしれない。ついに別れを告げる時がやって来た！"
 treasure_fleet_events.3.a: "幸運を祈る！"
 chinese_treasure_expeditions_send_tooltip: "$expedition_name_treasure_voyage$は[character_expedition_leader_target.GetName]の指揮のもと、[ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName]へ向けて出航する\n船団は、訪問先の[countries|e]への贈り物として#g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#![gold|e]相当の積荷を運ぶ"
 treasure_fleet_events.4.title: "$expedition_name_treasure_voyage$からの報せ"
 treasure_fleet_events.4.desc: "南方の港のひとつに、1隻のジャンク船が$expedition_name_treasure_voyage$からの報せを携えて入港した。$expedition_leader_name$率いる船団は[port_country.GetName]の[port_location.GetName]の港に到着し、[port_country.GetGovernment.GetCourtTitle]から正式な儀礼をもって迎えられたという。わが使節たちは交易品を取り交わし、[port_country.Custom('GetRulerOrRegentTitle')]に慣例どおりの贈答品を献上した。船団に同行する年代記作者によれば、風向きも季節も次の航海には好都合だという。船長の報告では、少なくとも当面、[ROOT.GetCountry.GetGovernment.GetCourtTitle]が悪い報せを案じる必要はないとのことだ。"
 treasure_fleet_events.4.a: "この先も順風が続くことを願おう。"
 treasure_fleet_events.5.title: "[expedition_initiator.GetAdjectiveWithNoTooltip]$expedition_name_treasure_voyage$の到来"
 treasure_fleet_events.5.desc: "夜明けとともに、[target_stop.GetName]の[target_stop.GetRank.GetName]の住人たちが、恐ろしくも壮観な光景を目の当たりにした。[coastal_sea_tile.GetName]の水平線を埋め尽くしていたのは、ほかならぬ[GetInternationalOrganization('middle_kingdom').GetName]、[expedition_initiator.GetLongName]の船団だった。船団を率いる$expedition_leader_name$はすぐさま我々の港に上陸し、[target_stop.GetNameWithNoTooltip]での補給許可を得た。そのあとの展開は実に奇妙なものだった。[expedition_initiator.GetAdjectiveWithNoTooltip]の船員たちは地元の執行官たちに惜しみなく贈り物を渡し、[ROOT.GetCountry.GetGovernment.GetRulerTitle]への謁見を求めたのである。"
 treasure_fleet_events.5.a: "彼らを[ROOT.GetCountry.GetGovernment.GetCourtTitle]に歓迎しよう！"
 treasure_fleet_events.5.a.entry: "彼らを宮廷に歓迎しよう！"
 treasure_fleet_events.6.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]との謁見"
 treasure_fleet_events.6.desc: "$expedition_leader_name$とその随行員たちが、ついに我らが慈悲深き[ROOT.GetCountry.GetGovernment.GetRulerTitle]との謁見を果たした。彼らの大船団と惜しみない贈り物には、誰もが大いに感銘を受けた。ところが、そのあとに持ち出されたのは、[expedition_initiator.GetAdjective]の支配下で[ShowSubjectTypeName('tributary')]となるも同然の提案だった。これには誰もが愕然としたが、もしかすると、これほど強大な国家に従属することで、思いのほか大きな利を得られるのかもしれない。"
 treasure_fleet_events.6.a: "友好には代償がある。"
 treasure_fleet_events.6.b: "そんな話は断る！"
 chinese_expedition_resolution_tt: "今後数ヵ月間、中国の$expedition_name_treasure_voyage$が[target_stop.GetName]の港に滞在する。船団の者たちと交流する[events|e]が発生し、結果に応じてわが国に対する評価が変化する。滞在終了時の評価によって、結果は次のように変化する：\n\n従順（#y 67#!～#y 100#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\n好意的（#y 33#!～#y 66#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\n無関心（#y -32#! - #y 32#!）：\n$NOTHING_HAPPENS_EFFECT$\n無礼（#y -66#!～#y -33#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\n傲慢（#y -100#!～#y -67#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]"
 treasure_fleet_events.7.title: "ふさわしい贈り物"
 treasure_fleet_events.7.desc_shared: "[ROOT.GetCountry.GetName]での任務を終えた[expedition_initiator.GetName]の宝船船団が、数ヵ月以内の出航に備えて物資を補給している。感謝の印として、わが[ROOT.GetCountry.GetFlavorRank]が用意できる最高の品々を贈るのが礼儀だろう。"
 treasure_fleet_events.7.desc: "$treasure_fleet_events.7.desc_shared$また、この贈り物には、我々が[ShowSubjectTypeName('tributary')]であることを改めて確認する意味もある。"
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$これは、今回の訪問への返礼でもある。"
 treasure_fleet_events.7.a: "我らの寛大さを示そう。"
 treasure_fleet_events.7.gift: "わが国の名産品を贈ろう。"
 treasure_fleet_events.7.b: "そんな余裕はない……"
 treasure_fleet_events.8.title: "遠征隊の出航"
 treasure_fleet_events.8.desc: "ついに[expedition_initiator.GetAdjective]の宝船船団が[target_stop.GetName]を出発した。我々は彼らに十分な歓待を尽くした。この先の旅路が順調であることを願おう。"
 treasure_fleet_events.8.a: "さらばだ！"
 chi_fleet_will_depart: "[expedition_initiator.GetAdjective]の遠征隊が[ROOT.GetCountry.GetName]から出発する。"
 chinese_expedition_opinion: "宝船船団の信頼度"
 based_on_expedition_opinion: "$chinese_expedition_opinion$に基づき（現在：[ROOT.GetVariable('chinese_expedition_opinion').GetValue]）、以下が発生する："
 treasure_fleet_events.9.title: "$expedition_name_treasure_voyage$の帰還"
 treasure_fleet_events.9.desc: "何年も前に[ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName]へと送り出したわが国の船団が、長い航海を終え、各地で受け取った数々の贈り物と多くの使節を乗せ、ついに帰還した。$expedition_leader_name$はいま、その財宝と使節たちを伴い、首都へと向かっている。"
 treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.9.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.10.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]との謁見"
 treasure_fleet_events.10.desc: "$expedition_leader_name$がついに[ROOT.GetCountry.GetCapital.GetName]へ帰還し、盛大な歓声とともに迎えられた。代表団には、これまで訪れた国々から多くの使節も加わっており、[ROOT.GetCountry.GetGovernment.GetRulerTitle]に忠誠を誓うために参じている。彼らがこうしてわが国を訪れたことは、実に喜ばしい。"
 treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.10.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.11.title: "遠征の終了"
 treasure_fleet_events.11.desc: "$expedition_name_treasure_voyage$の旅がついに終わりを迎えた。多額の費用を要する遠征だけに、今回投じた費用に見合う成果が得られたのかを振り返り、今後も船団を送り出すべきか検討しよう。"
 treasure_fleet_events.11.a: "こうした遠征をもっとおこなうべきだ。"
 chi_we_will_gift_cloves: "褒美として、[expedition_initiator.GetName]に[ShowGoodsName('cloves')]を与えよう。"
 chi_we_will_gift_giraffe: "[expedition_initiator.GetName]にキリンを与えよう。"
 chi_we_will_gift_persian_blue: "褒美として、[expedition_initiator.GetName]にわが国の[ShowGoodsName('dyes')]を与えよう。"
 treasure_fleet_events.12.title: "異国の珍獣"
 treasure_fleet_events.12.desc: "$expedition_name_treasure_voyage$が、実に珍しく見事な獣を[ROOT.GetCountry.GetGovernment.GetRulerTitle]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]へ連れ帰ってきた！ 長い首をもち、全身を黒っぽい斑点に覆われた巨大な獣で、異国では「ジラフ」と呼ばれているという。ところが廷臣たちは、この獣こそ、名君の治世に太平の世の到来を告げるという伝説上の瑞獣「麒麟」だと考えている。この説を受け入れれば、わが国の威信は高まるだろう。だが同時に、今後の統治にはこれまで以上の期待が寄せられることになる。"
 treasure_fleet_events.12.a: "これぞ伝説の瑞獣、麒麟だ！"
 treasure_fleet_events.12.b: "素晴らしい生き物なのは確かだ。"
 treasure_fleet_events.13.title: "驚異の青"
 treasure_fleet_events.13.desc: "大遠征に出ていた船団が、[ShowSubContinentName('middle_east')]から染料を持ち帰った。ひときわ鮮やかな青色をしたこの[ShowGoodsName('dyes')]は、わが国が誇る[ShowGoodsName('pottery')]の生産に最適な素材であることがわかった。しかも、生産に使うには十分な量が持ち帰られている。"
 treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.13.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.14.title: "忘れられぬ味"
 treasure_fleet_events.14.desc: "[ShowRegionName('indonesia_region')]は香辛料で名高いが、$expedition_name_treasure_voyage$はなかでも上質な[ShowGoodsName('cloves')]が盛んに栽培されている[ShowAreaName('moluccas_area')]を訪れた。船団は現地の人々から手厚い歓迎を受け、貢物としてこの素晴らしい香辛料を大量に受け取った。[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[ROOT.GetCountry.GetGovernment.GetRulerTitle]をはじめ、今後数ヵ月間にわたってその風味を堪能できるだろう。"
 treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.14.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.15.title: "発見された卑怯者"
 treasure_fleet_events.15.desc: "$expedition_name_treasure_voyage$の途上、$expedition_leader_name$とその忠実な水兵たちが、名の知れた反逆者である[extradited_character.GetName]を追跡のすえに発見した。[extradited_character.GetShortNameWithNoTooltip]は随分前に、正当な裁きを逃れて[ROOT.GetCountry.GetName]から逃亡していた。だが船団は、[asylum_country.GetName]で[extradited_character.GetShortNameWithNoTooltip]を庇護していた者たちからその身柄を奪い取り、裁きを受けさせるため$china$へ連れ帰った。"
 treasure_fleet_events.15.a: "この小悪党は絞首刑だ！"
 treasure_fleet_events.15.b: "[extradited_character.GetHerHim]を斬首せよ。"
 treasure_fleet_events.15.b.entry: "彼を斬首せよ。"
 treasure_fleet_events.15.c: "凌遅刑に処せ。ゆっくりと切り刻んでやれ。"
 treasure_fleet_events.15.d: "恩赦を与えよ。その才は役に立つかもしれない。"
 treasure_fleet_events.15.d.entry: "恩赦を与えよ。その才は役に立つかもしれない。"
 treasure_fleet_events.16.title: "[executed_character.GetNameWithNoTooltip]の処刑"
 treasure_fleet_events.16.desc: "[executed_character.GetName]は、[ShowPolicyName('haijin_policy')]の施行後に一族が海賊となり、[executed_character.GetBirthLocation.GetArea.GetName]から逃亡した者である。その後、[executed_character.GetShortNameWithNoTooltip]は[loser_country.GetName]で海賊の頭領となり、[loser_country.GetFlavorRank]の沖合で$expedition_leader_name$と戦いを繰り広げた。いまこそ[executed_character.GetNameWithNoTooltip]を見せしめとし、このような輩がどのような末路を迎えるか思い知らせる時だ。"
 treasure_fleet_events.16.a: "裁きは下された。"
 treasure_fleet_events.17.title: "反抗的な統治者"
 treasure_fleet_events.17.desc: "遠征の最中、$expedition_leader_name$率いる$expedition_name_treasure_voyage$が、[loser_country.GetLongName]の元[loser_country.GetGovernment.GetRulerTitle]である[loser_character.GetName]を捕えた。[loser_country.GetNameWithNoTooltip]は反逆と不敬に及んだものの、ほどなく敗北し、$expedition_name_treasure_voyage$は捕虜となった。"
 treasure_fleet_events.17.a: "見せしめにせよ。"
 treasure_fleet_events.17.a.entry: "見せしめにせよ。"
 treasure_fleet_events.17.b: "慈悲を垂れてやろう。"
 treasure_fleet_events.18.title: "[loser_country.GetNameWithNoTooltip]の運命"
 treasure_fleet_events.18.desc: "[loser_country.GetName]の愚かな統治者が、$expedition_leader_name$の君臨する[GetInternationalOrganization('middle_kingdom').GetName]に楯突こうとした。熾烈な戦いの末、[loser_country.GetLongNameWithNoTooltip]は敗北し、今後の処遇が決まるまで、[loser_country.GetGovernment.GetRulerTitle]の座には暫定的な代行者が据えられている。"
 treasure_fleet_events.18.a: "[target_character_for_viceroyalty.GetNameWithNoTooltip]を総督として送り込み、統治させよ。"
 treasure_fleet_events.18.a.entry: "彼を総督として送り込み、統治させよ。"
 treasure_fleet_events.18.b: "そのまま傀儡の統治者を据えておけ。"
 treasure_fleet_events.19.title: "[expedition_initiator.GetNameWithNoTooltip]より派遣された総督"
 treasure_fleet_events.19.desc: "[GetInternationalOrganization('middle_kingdom').GetName]から報せが届いた。わが国は、彼らが派遣する総督[target_character_for_viceroyalty.GetName]の統治下に置かれることになり、今後しばらく、我々は[ShowSubjectTypeName('tributary')]としてこの総督に従うことになる。戦に敗れた以上、勝者である敵の支配に服するほかない。"
 treasure_fleet_events.19.a: "いずれこのくびきを逃れてやる。"
 treasure_fleet_events.20.title: "遠方からの贈り物"
 treasure_fleet_events.20.desc: "遠征の途上、水兵たちは各地でさまざまな土地の品を贈られ、それらを$china$へ持ち帰った。金銭的価値こそさほどないが、[GetInternationalOrganization('middle_kingdom').GetName]の威光を示す品々であり、今後長きにわたってわが国の威信を高めることだろう。"
 treasure_fleet_events.20.a: "期待どおりだ。"
 treasure_fleet_events.21.title: "[target.GetNameWithNoTooltip]の死"
 treasure_fleet_events.21.desc: "$expedition_name_treasure_voyage$を率いていた$expedition_leader_name$が、道半ばにして命を落としたとの報せが入った。副官の[new_leader.GetName]が指揮を引き継ぎ、船団を率いて遠征を続けることになる。"
 treasure_fleet_events.21.a: "これが不吉な前触れでなければよいが。"
 chi_new_expedition_leader: "今後は[new_leader.GetName]が$expedition_name_treasure_voyage$を率いる。"
 treasure_fleet_events.22.title: "資金不足"
 treasure_fleet_events.22.desc: "$expedition_name_treasure_voyage$において、外交に用いる贈り物が不足しているとの報せが入った。ふさわしい贈り物を用意できないため、船団は今後、外国の港への表敬訪問を見送ることになる。次回の遠征には、もっと資金を割くべきかもしれない。"
 treasure_fleet_events.22.a: "恥ずべきことだ。"
 chi_expedition_is_returning_to_china: "$expedition_name_treasure_voyage$は贈り物が尽きたため、残りの航海では外国の港に寄港しない"
 show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]"
 change_amount_of_treasure_voyage_tt: "$expedition_name_treasure_voyage$の積荷が$VALUE|+$増加する"
 change_amount_of_treasure_voyage_tt_neg: "$expedition_name_treasure_voyage$の積荷が$VALUE|-$減少する"
 change_opinion_of_expedition: "$chinese_expedition_opinion$が$VALUE|0Y$上昇した。（現在：$show_current_chinese_expedition_amount$）"
 change_opinion_of_expedition_neg: "$chinese_expedition_opinion$が$VALUE|0Y$上昇した。（現在：$show_current_chinese_expedition_amount$）"
 give_gold_to_expedition: "$expedition_name_treasure_voyage$が受け取る贈り物：$VALUE|2Y$"
 chi_gift_received_count: "[ROOT.GetVariable('gifts_received').GetValue|2+=][gold|e]を受け取った。換算すると以下のとおり："
 treasure_fleet_events.23.title: "宝船船団が嵐に遭遇"
 treasure_fleet_events.23.desc: "航海の途上、わが国の大船団は思わぬ難敵に遭遇した。経験豊かな船員たちさえ不意をつかれるほどの大嵐である。この災厄により多くの船が失われ、積んでいた数々の贈り物や物資も海の藻屑となった。"
 treasure_fleet_events.23.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$"
 treasure_fleet_events.24.title: "海賊船団との決戦"
 treasure_fleet_events.24.desc: "$expedition_leader_name$率いる我らが$expedition_name_treasure_voyage$が、[target_location.GetName]の[target_location.GetTopography.GetName]を航行中、荒くれ者の海賊船団と遭遇した。無論、勇敢な水兵たちはひるむことなく、海賊どもを完膚なきまでに打ち破って、その頭領たちを捕らえた。しかしながら、この戦いでは人員や船の損失は避けられず、同時に多くの物資も失われた。"
 treasure_fleet_events.24.a: "これで少しは感謝されるだろう。"
 treasure_fleet_events.25.title: "遠方の帆影"
 treasure_fleet_events.25.desc: "見張りが水平線に帆影を見つけた。同じ海域を航行する、豊かな積荷を載せた商船団である。$expedition_leader_name$は船長たちに友好的に接するよう命じ、ほどなく活発な交易が始まった。[ShowGoodsName('silk')]の織物や上質な[ShowGoodsName('porcelain')]が、香辛料や宝石、南海の珍品と交換されていく。\n\n交易を終えた$expedition_name_treasure_voyage$の船倉は、以前よりも多くの積荷で満たされている。"
 treasure_fleet_events.25.a: "風もよし、取引もよし。"
 treasure_fleet_events.30.title: "宮廷での宴"
 treasure_fleet_events.30.desc: "$expedition_name_treasure_voyage$が[target_stop.GetName]沖に停泊しているあいだ、現地の宮廷では船団を歓迎する盛大な宴が催された。楽師や踊り手が宴を彩り、百種にも及ぶ料理が$expedition_leader_name$と船長たちの前に並べられた。彼らも慣例に従って贈り物を献上し、[GetInternationalOrganization('middle_kingdom').GetName]の威光を語った。\n\n異国の地で見せた船団の立派な振る舞いは、やがて本国にも伝わることだろう。"
 treasure_fleet_events.30.a: "我らの威光を見せつけよう。"
 treasure_fleet_events.31.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]への珍品"
 treasure_fleet_events.31.desc: "[target_stop.GetName]の市場には、わが国では見たこともない珍品があふれている。目を疑うほど鮮やかな色の鳥が籠に入れられ、見慣れぬ獣や香木、異国風に細工された宝石が所狭しと並んでいる。$expedition_name_treasure_voyage$の商人たちなら、[ROOT.GetCountry.GetGovernment.GetRulerTitle]を喜ばせるに足る珍品で船倉を満たすこともできるだろう。ただし、そのためには贈答用に取り分けてある金の一部を使わなければならない。\n\nその金に手をつけるべきだろうか？"
 treasure_fleet_events.31.a: "市場で最上の品を買え。"
 treasure_fleet_events.31.b: "金は贈答のために取っておけ。"
 treasure_fleet_events.26.title: "試される指揮力"
 treasure_fleet_events.26.desc: "$expedition_name_treasure_voyage$が外洋を進むなか、頼りない海図を前に士官たちの意見が割れている。ある者は$expedition_leader_name$に安全な航路を取るよう進言し、またある者は、所要時間は短いが危険な航路を選ぶよう主張している。誰もが提督の判断を待っている。ここでの采配は、後々まで語り継がれることだろう。"
 treasure_fleet_events.26.a: "安全を第一に進め。"
 treasure_fleet_events.26.b: "危険を冒してでも速やかな航路を進め。"
 treasure_fleet_events.27.title: "海の驚異"
 treasure_fleet_events.27.desc: "一昼夜ものあいだ、途方もなく巨大な生き物が船団の傍らを泳ぎつづけた。その背は、まるで動く島のように波を割っていた。$expedition_name_treasure_voyage$に同行する年代記作者たちは、その壮大な光景を巻物に書き留め、船員たちはこれをこの上ない吉兆と受け止めた。船団が帰還した暁には、この驚くべき出来事が各地の茶館で語られることだろう。"
 treasure_fleet_events.27.a: "これには宮廷もさぞ驚くだろう。"
 treasure_fleet_events.28.title: "天の兆し"
 treasure_fleet_events.28.desc: "船団の天文学者たちが、夜空を横切る奇妙な光を観測し、その意味を読み解こうと星図を丹念に調べた。その正体が何であれ、船員たちはこれを天意の表れと受け止め、$expedition_name_treasure_voyage$の甲板は厳粛な静けさに包まれた。"
 treasure_fleet_events.28.a: "天の示す兆しを心に留めよう。"
 treasure_fleet_events.29.title: "凪"
 treasure_fleet_events.29.desc: "風が完全に止み、$expedition_name_treasure_voyage$の大船団は鏡のように凪いだ海の上で身動きが取れなくなった。来る日も来る日も帆は風をはらまず垂れ下がり、$expedition_leader_name$と士官たちにできるのは、わずかな風を待ちながら水平線を見つめることだけである。このままでは航海は長引くことになるだろう。"
 treasure_fleet_events.29.a: "風が吹くのを待とう。"
 treasure_fleet_events.32.title: "港の火災"
 treasure_fleet_events.32.desc: "[target_stop.GetName]の倉庫が立ち並ぶ一角で火災が発生した。そこには船団の積荷の一部も保管されていた。$expedition_name_treasure_voyage$の乗員たちも消火に加わったものの、火の手はすでに贈答用に取り分けてあった[ShowGoodsName('silk')]や[ShowGoodsName('porcelain')]を収めた木箱にまで及んでいた。"
 treasure_fleet_events.32.a: "高くついた一夜だった。"
 treasure_fleet_events.33.title: "現地の水先案内人"
 treasure_fleet_events.33.desc: "この海域の暗礁や潮流に通じた[target_stop.GetName]の老練な船乗りが、この先$expedition_name_treasure_voyage$を案内すると申し出てきた。$expedition_leader_name$は異国の船乗りに船団の進路を委ねるべきか思案している。"
 treasure_fleet_events.33.a: "知恵を借りよう。"
 treasure_fleet_events.33.b: "わが船団の航海士だけで十分だ。"
 treasure_fleet_events.34.title: "提督への贈り物"
 treasure_fleet_events.34.desc: "$expedition_name_treasure_voyage$が[target_stop.GetName]からの出航を控えるなか、現地の宮廷から$expedition_leader_name$に、ひときわ貴重な餞別が贈られた。[GetInternationalOrganization('middle_kingdom').GetName]への敬意を示すための、[ROOT.GetCountry.GetGovernment.GetRulerTitle]への献上品だという。"
 treasure_fleet_events.34.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]へのよい贈り物になる。"
 treasure_fleet_events.35.title: "通訳者を求めて"
 treasure_fleet_events.35.desc: "故郷を遠く離れた$expedition_name_chinese_expedition$隊の使節たちが、我々との意思疎通に苦労している。それでも彼らはさらに先へ航海し、これまで接したことのない文化の人々と交流しようとしている。この先の航海に備え、現地の通訳を1人同行させてほしいと我々に求めてきた。"
 treasure_fleet_events.35.a: "すぐに通訳を手配しよう！"
 treasure_fleet_events.35.b: "それはあの連中の問題だ。我々には関係ない。"
 treasure_fleet_events.36.title: "地図の共有"
 treasure_fleet_events.36.desc: "$expedition_name_treasure_voyage$が、この周辺の水路を記した地図を提供してほしいと求めてきた。我々に応じる義務はないが、要望を受け入れれば友好のしるしとなる。$expedition_location_name$に滞在している$expedition_leader_name$や、ほかの[ShowCultureGroupName('chinese_group')]の有力者たちからも大いに感謝されるだろう。"
 treasure_fleet_events.36.a: "手持ちの地図を渡そう。"
 treasure_fleet_events.36.b: "渡せるような地図はない。"
 treasure_fleet_events.37.title: "法外な値段"
 treasure_fleet_events.37.desc: "土地に不慣れな$expedition_name_treasure_voyage$の乗員たちに向けて、地元の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が$expedition_location_name$の停泊地周辺に市場を開いた。市場には現地の品々が並んでいるが、その値段は決して良心的とは言えない。強欲な商人のなかには、水兵たちの窮状につけ込んで法外な値をつける者までいる。そのため、場所によっては武器を交えた乱闘まで起こり、[fleet_loc.GetRank.GetName]に混乱が広がっている。"
 treasure_fleet_events.37.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]を罰せよ！"
 treasure_fleet_events.37.a.entry: "$burghers_estate$を罰せよ！"
 treasure_fleet_events.37.b: "騒ぎを起こした乗員に責任を取らせろ。"
 treasure_fleet_events.38.title: "屈辱と映る厚遇"
 treasure_fleet_events.38.desc: "わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちは、我々が$expedition_name_treasure_voyage$を厚遇していることに強い不満を抱いている。彼らは[ShowCultureGroupName('chinese_group')]を傲慢な侵略者とみなしており、滞在中に与えられた歓待や特権を受けるには値しないと考えている。そのため[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]たちは、一部の特権を取り消し、ここが彼らの土地ではないことを思い知らせるよう要求している。"
 treasure_fleet_events.38.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の要求に従おう。"
 treasure_fleet_events.38.a.entry: "$nobles_estate$の要求に従おう。"
 treasure_fleet_events.38.b: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]の機嫌を損ねるわけにはいかない。"
 treasure_fleet_events.39.title: "宗教上の失態"
 treasure_fleet_events.39.desc: "$expedition_name_chinese_expedition$隊の船員たちは、わが国の[ROOT.GetCountry.GetReligion.GetAdjective]の慣習に疎く、我らの信仰を冒涜する行為に及んだ。この一件を受け、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は激怒しており、船団を率いる$expedition_leader_name$に対し自らこの非礼を詫びるよう求めている。"
 treasure_fleet_events.39.a: "$expedition_leader_name_tooltipless$に謝罪を要求せよ。"
 treasure_fleet_events.39.b: "今回は不問に付そう。"
 treasure_fleet_events.40.title: "身柄引き渡しの要求"
 treasure_fleet_events.40.desc: "$expedition_name_treasure_voyage$の調べで、わが国の廷臣である[target_escapee.GetName]が、[expedition_initiator.GetName]から逃亡した離反者であることが判明した。$expedition_leader_name$を筆頭とする[ShowCultureGroupName('chinese_group')]船団の有力者たちは、[target_escapee.GetShortNameWithNoTooltip]を[GetInternationalOrganization('middle_kingdom').GetName]へ連れ戻して裁きを受けさせるため、その身柄を引き渡すよう要求している。"
 treasure_fleet_events.40.a: "要求を受け入れよう。"
 treasure_fleet_events.40.b: "言語道断の要求だ！"
 treasure_fleet_events.41.title: "合同軍事演習"
 treasure_fleet_events.41.desc: "わが国に長期滞在している$expedition_name_chinese_expedition$隊の指揮官、$expedition_leader_name$から、両国による合同軍事演習の申し出があった。このような訓練は双方にとって有益であり、互いの深い信頼を示すことにもなるだろう。とはいえ、異国の兵と演習をおこなう以上、ある程度の危険も伴うため、慎重に進める必要がある。[ShowCultureGroupNameWithNoTooltip('chinese_group')]との合同演習に参加するとすれば、$expedition_location_name$の最も近くに駐留する[target_unit.GetName]だ。"
 treasure_fleet_events.41.a: "提案を受け入れよう。"
 treasure_fleet_events.41.b: "無理に応じる必要はない。"
 treasure_fleet_events.42.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]からの加勢の申し出"
 treasure_fleet_events.42.desc: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]の$expedition_name_treasure_voyage$が$expedition_location_name$に到着した。彼らは[ROOT.GetCountry.GetLongName]が戦争のさなかにあるとは予想していなかったようだが、[expedition_initiator.GetLongName]はわが国の敵を快く思っておらず、こちらに加勢する用意があるという。"
 treasure_fleet_events.42.a: "どんな助けでもありがたい。"
 treasure_fleet_events.42.b: "これは我々の戦いだ。手出しは無用だ。"
 treasure_fleet_events.43.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]の宝船船団が[from.GetNameWithNoTooltip]に加勢"
 treasure_fleet_events.43.desc: "諜報員から、$expedition_leader_name$率いる[expedition_initiator.GetLongName]の大規模な$expedition_name_treasure_voyage$について報告が入った。敵国の$expedition_location_name$の港に到着した船団は、あろうことか戦いに介入し、我々の敵である[from.GetName]に加勢することを決めたという！"
 treasure_fleet_events.43.a: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]を決して許しはしない！"
 treasure_fleet_events.44.title: "モスク建設の要請"
 treasure_fleet_events.44.desc: "$expedition_name_chinese_expedition$を率いる$expedition_leader_name$は、[target_religion.GetName]の敬虔な信徒でもある。船団にも同じ信仰を奉じる者が多く、彼らは現地の[target_religion.GetAdjectiveWithNoTooltip]共同体を支えるため、モスクの建設許可を求めてきた。"
 treasure_fleet_events.44.a: "建設を許可しよう。"
 treasure_fleet_events.44.b: "そのような越権は慎むよう警告せよ。"
 treasure_fleet_events.45.title: "$expedition_location_name_tooltipless$の[ShowCultureGroupNameWithNoTooltip('chinese_group')]人共同体"
 treasure_fleet_events.45.desc: "$expedition_location_name$には、数十年にわたって[ShowCultureGroupName('chinese_group')]人の共同体が根づき、いまではかなりの規模になっている。もともとは交易のためこの地を訪れた[ShowCultureGroupNameWithNoTooltip('chinese_group')]商人たちが、現地の女性を妻に迎えて定住したのが始まりである。彼らは新たな環境に適応し、わが国の社会に欠かせない役割を担うようになった。そしてこのたび、[expedition_initiator.GetName]の$expedition_name_treasure_voyage$が到着し、船団を率いる$expedition_leader_name$は、この共同体を支援することにした。"
 treasure_fleet_events.45.a: "この支援を後押ししよう。"
 treasure_fleet_events.45.b: "やめさせろ！"
 treasure_fleet_events.46.title: "兵士たちの定住"
 treasure_fleet_events.46.desc: "$expedition_name_chinese_expedition$の兵士のうち数名が除隊し、$expedition_location_name$への定住を許された。彼らは現地の女性を妻に迎えており、こうして築かれた縁は、長い目で見ればわが国の利益につながるかもしれない。"
 treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 treasure_fleet_events.46.a.entry: "$common_string_alright$"
 treasure_fleet_events.47.title: "$expedition_name_treasure_voyage$の介入"
 treasure_fleet_events.47.desc: "$expedition_location_name$に到着した$expedition_name_chinese_expedition$隊は、我らが[ROOT.GetCountry.GetFlavorRank]が血で血を洗う内戦のさなかにあることを目の当たりにした。こうした状況では多くの者が関わりを避けるものだが、$expedition_leader_name$率いる$expedition_name_treasure_voyage$は[ROOT.GetCountry.GetAdjective]の大義に共感し、[GetInternationalOrganization('middle_kingdom').GetName]の名のもとに軍事支援を申し出てきた。"
 treasure_fleet_events.47.a: "どんな助けでもありがたい。"
 treasure_fleet_events.47.b: "連中の助けなど必要ない。"
 treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$"
 treasure_fleet_events.48.desc: "卑劣な$expedition_name_chinese_expedition$隊が、わが国が戦う[target_war.GetName]に介入してきた。賢明な$expedition_leader_name$に率いられているというのに、よりによって[ROOT.GetCountry.GetName]ではなく[country_at_war_with.GetName]に加勢するという誤った選択をしたのだ。戦場で叩き潰してやろうではないか。"
 treasure_fleet_events.48.a: "このことは決して忘れんぞ！"
 treasure_fleet_events.49.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]の侮蔑"
 treasure_fleet_events.49.desc: "[ROOT.GetCountry.GetName]と、訪問中の$expedition_name_treasure_voyage$との関係が、かつてないほど悪化している。ここ数日、わが国の守備隊と異国の水兵とのあいだでは幾度となく衝突が起きている。それでも関係を断つには至らず、表向きにはなおも交流が続いている。しかし最近の出来事によって事態はさらに悪化し、$expedition_leader_name$は[ROOT.GetCountry.GetLongNameWithNoTooltip]とその価値観を公然と非難した。$expedition_name_chinese_expedition$隊は、緊張がこれ以上高まる前に$expedition_location_name$を離れるべく、出発の準備を進めている。"
 treasure_fleet_events.49.a: "関係を修復しなくてはならない。"
 treasure_fleet_events.49.b: "厄介払いができてせいせいする！"
 chinese_interregnum: "[THIS.GetCountry.GetName]は空位となり、[ShowCultureGroupName('chinese_group')]による臨時統治下に置かれる。"
 treasure_fleet_events.50.title: "軍事介入の要請"
 treasure_fleet_events.50.desc: "$expedition_name_treasure_voyage$を率いる$expedition_leader_name$が、わが国に対し[target_country.GetName]への軍事介入を強く求めてきた。何らかの理由で、[target_country.GetAdjectiveWithNoTooltip][target_country.GetFlavorRank]は[ShowCultureGroupName('chinese_group')]から敵視されているらしい。船団の指導者たちは、不遜な[target_country.GetGovernment.GetRulerTitle]に天罰を下すよう我々に求めている。"
 treasure_fleet_events.50.a: "要求に従おう。"
 treasure_fleet_events.50.b: "そんな要求には応じられない。"
 treasure_fleet_events.51.title: "期待外れの貢物"
 treasure_fleet_events.51.desc: "公には口にしていないものの、$expedition_name_treasure_voyage$の有力者たちは、わが国が贈った貢物の質に満足していないようだ。[ROOT.GetCountry.GetGovernment.GetRulerTitle]との謁見の際からその不満は感じ取れていたが、彼らの会話を盗み聞きした諜報員からの報告によって、疑いは確認に変わった。"
 treasure_fleet_events.51.a: "埋め合わせの品を贈ろう。"
 treasure_fleet_events.51.b: "向こうが不満を申し立ててこないかぎり、こちらから動く必要はない。"
 treasure_fleet_events.52.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の醜聞"
 treasure_fleet_events.52.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]との謁見の席で、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の廷臣のひとりが[ShowCultureGroupName('chinese_group')]からの来訪者たちについてひどく侮辱的な発言をし、彼らの怒りを買った。何らかの対処をしなければ、$expedition_name_treasure_voyage$がこの件を[expedition_initiator.GetGovernment.GetRulerTitle]に報告するかもしれない。"
 treasure_fleet_events.52.a: "正式に謝罪しよう。"
 treasure_fleet_events.52.b: "詫びの品を贈ろう。"
 treasure_fleet_events.52.c: "身内を罰することなどできようか？"
 treasure_fleet_events.53.title: "厚遇"
 treasure_fleet_events.53.desc: "$expedition_name_treasure_voyage$を率いる有力者たちが、わが国の歓待やさまざまな特権を大いに楽しんでいる。貢物のやり取りだけでなく、船の修理を許可し、必要な支援もおこなってきた。彼らは表立って喜びを示してはいないが、こうした待遇に満足していることは見て取れる。"
 treasure_fleet_events.53.a: "もてなしが肝心だ！"
 treasure_fleet_events.53.b: "妙な期待を持たせてはならない。"
 treasure_fleet_events.54.title: "わが使節への侮辱"
 treasure_fleet_events.54.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に報せが届いた。[insulting_court.GetName]の宮廷を訪れた$expedition_name_treasure_voyage$の使節たちは、[GetInternationalOrganization('middle_kingdom').GetName]の使臣にふさわしい礼をもって迎えられるどころか、あからさまな侮蔑を受けたという。しかも、[insulting_court.GetGovernment.GetRulerTitle]はそれを咎めることなく黙認した。\n\n$expedition_leader_name$は我々の指示を待っている。この侮辱には然るべき報いを与えるべきか、それとも、取り合うまでもないと捨て置くべきか？"
 treasure_fleet_events.54.a: "このような侮蔑は許しておけん。"
 treasure_fleet_events.54.b: "取り合うにも値しない。"
 treasure_fleet_events.54.a.tt: "今後、$expedition_name_treasure_voyage$が訪れる近隣諸国は、わが国の支援を受けて[insulting_court.GetName]に宣戦布告することができる"
 treasure_fleet_events.55.title: "異国への深入り"
 treasure_fleet_events.55.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]から思いがけない報せが届いた。故国から遠く離れた地で、$expedition_leader_name$が$expedition_name_treasure_voyage$の兵力と財力を投じ、継承戦争に揺れる[country_at_war_with.GetName]の統治者を支援しているという。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[GetInternationalOrganization('middle_kingdom').GetName]の威光が遠方にまで及んでいることに目を見張る者もいる。一方で、遠国の争いなど、わが国が関与すべきことではないと不満を漏らす者もいる。"
 treasure_fleet_events.55.a: "我らの威光がいかに遠くまで及ぶか、世に示そう。"
 treasure_fleet_events.55.b: "遠国の戦など、わが国の関知するところではない。"
 treasure_fleet_events.56.title: "異国で抜かれた剣"
 treasure_fleet_events.56.desc: "$expedition_name_treasure_voyage$から報せが届いた。滞在先の宮廷が関わる戦争に、$expedition_leader_name$がわが国の兵を援軍として送り込んだという。[target_country.GetName]は戦場でわが国の兵と敵対することになり、いまや[GetInternationalOrganization('middle_kingdom').GetName]を敵とみなしている。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]では意見が割れている。これを、わが国の威光がはるか遠方にまで及んでいる証と見る者もいれば、もとよりわが国とは無関係だった戦争に介入し、無用な敵を増やしただけだと見る者もいる。"
 treasure_fleet_events.56.a: "我らの力がどこまで及ぶか、思い知らせてやろう。"
 treasure_fleet_events.56.b: "遠い地で敵を増やすのは得策ではない。"
 treasure_fleet_events.57.title: "侮蔑の仕打ち"
 treasure_fleet_events.57.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に重大な報せが届いた。[contemptuous_court.GetName]の宮廷において、$expedition_name_treasure_voyage$の使節たちが然るべき礼をもって迎えられるどころか、あからさまな侮蔑を受けたという。そのため、$expedition_leader_name$は錨を上げ、船団を率いてその海域を去った。\n\n船団の年代記作者は、[contemptuous_court.GetNameWithNoTooltip]を[GetInternationalOrganization('middle_kingdom').GetName]に非礼を働いた相手として記録に加えた。この侮辱を忘れぬべきか、それとも赦すべきか？"
 treasure_fleet_events.57.a: "この侮辱は忘れぬ。"
 treasure_fleet_events.57.b: "恨みなど捨て置け。"
 treasure_fleet_events.57.a.tt: "今後、$expedition_name_treasure_voyage$が訪れる近隣の宮廷に、[contemptuous_court.GetName]への宣戦布告を求めることができる"
 treasure_fleet_events.58.title: "侮辱の報い"
 treasure_fleet_events.58.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に朗報が届いた。$expedition_name_treasure_voyage$の来訪を受け、[avenging_court.GetName]の宮廷が、かつてわが使節を侮蔑した[target_country.GetName]に対して兵を挙げたという。\n\nどうやら、わが国の軍勢が動かずとも天罰は下るらしい。[GetInternationalOrganization('middle_kingdom').GetName]の威光は、遠国の王たちの戦にさえ及ぶのだ。"
 treasure_fleet_events.58.a: "我らを侮る者どもへの見せしめとしよう。"
 treasure_fleet_events.59.title: "海の彼方の同胞"
 treasure_fleet_events.59.desc: "遠く離れた[diaspora_port.GetName]で多くの同胞が根を下ろし、豊かな暮らしを築いているとの報せが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた。何世代も前、この地へ渡った商人や船乗りたちが現地の女性と家庭を築いたのが始まりだ。そして今回、$expedition_leader_name$率いる$expedition_name_treasure_voyage$は、彼らに支援の手を差し伸べた。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、南海各地の港に[GetInternationalOrganization('middle_kingdom').GetName]の民が根付いていることを誇る者もいる。一方で、祖先の墓から遠く離れた異郷に住み着く臣民を快く思わない者もいる。"
 treasure_fleet_events.59.a: "異郷の同胞には、誇りをもって我らの名を掲げてもらおう。"
 treasure_fleet_events.59.b: "祖先の眠る故郷にいるべきだ。"
 treasure_fleet_events.60.title: "使節の失態"
 treasure_fleet_events.60.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に、[offended_court.GetName]の宮廷で起きた不祥事の報せが届いた。異国の信仰のしきたりに疎い$expedition_leader_name$が非礼を働き、[offended_court.GetGovernment.GetRulerTitle]はいま、わが使節に償いを求めている。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]では意見が割れている。[GetInternationalOrganization('middle_kingdom').GetName]の使節が異国の信仰にまで敬意を示す必要はないという者もいる。一方で、今回の軽率な振る舞いが、今後の訪問先でわが国の評判を損なうと懸念する者もいる。"
 treasure_fleet_events.60.a: "異国の信仰に従う必要などない。"
 treasure_fleet_events.60.b: "提督には償いをさせよう。"
