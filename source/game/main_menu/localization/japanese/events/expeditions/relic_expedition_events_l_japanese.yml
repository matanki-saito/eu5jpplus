 relic_expedition_events.relic_recovered_titulus_crucis_tt: "Recovers $relic_titulus_crucis_found_1$ and starts the journey home"
 relic_expedition_announce_true_cross_tt: "すべてのカトリックの統治者に、$relic_true_cross_found$が発見されたことが伝わる"
 relic_expedition_announce_holy_lance_tt: "すべてのカトリックの統治者に、$relic_holy_lance_found$が発見されたことが伝わる"
 relic_expedition_announce_holy_shroud_tt: "すべてのカトリックの統治者に、$relic_holy_shroud_found$が発見されたことが伝わる"
 relic_expedition_events.12.title: "宝を追う者たち"
 relic_expedition_events.12.desc: "金払いのいい客が二組も現れ、酒場の主人が上機嫌で[target_leader.GetName]に報せをもたらした。対抗勢力が送り込んだ者たちも同じ宿に陣取り、同じ港の人足たちに酒を奢り、我々をここまで導いた噂について聞き回っているという。連中は我々より1週間早く上陸し、それ以来、惜しげもなく金をばらまいている。この町では口止めにも協力にも金が物を言う。先にその代価を払った側が、手がかりを握ることになるのだ。"
 relic_expedition_events.12.a: "相手より高く出ろ。王室にはいくらでも出す用意がある。"
 relic_expedition_events.12.b: "今回は追わせておけ。春までには別の機会が来る。"
 relic_expedition_events.12.c: "狭い海峡で待ち伏せし、そこで片をつけろ。"
 relic_expedition_events.13.title: "贋作者の工房"
 relic_expedition_events.13.desc: "ある職人が、疑うことを知らない巡礼者に聖人の指の骨を売りつけていたところを捕らえられた。それはその日の朝に羊肉から削り出し、茶で染めた代物だったのだ。ほかに誰を騙したのか問い詰めると、本物の在り処を知っていると言い出した。工房のために古材や古鉄を集めていた際、偶然見つけたのだそうだ。地区までは明かすが、通りの名は金を見せるまで口にしないという。贋作者の言葉にどれほどの値打ちがあるかは、言うまでもない。"
 relic_expedition_events.13.a: "話の代価は払ってやれ。ただし一度きりだ。"
 relic_expedition_events.13.b: "随行員たちに締め上げさせろ。銀より恐怖のほうが安くつく。"
 relic_expedition_events.13.forger_honest_tt: "今度ばかりは金を払った甲斐があり、贋作者の話は本当だった"
 relic_expedition_events.13.forger_cheated_tt: "伝えられた地区にあったのは噂話だけだった。贋作者は同じ嘘で二度も金をせしめたのだ"
 relic_expedition_events.13.threats_work_tt: "銀では開かなかった口も、恐怖には屈した。贋作者はついに本当の手がかりを吐いた"
 relic_expedition_events.13.threats_fail_tt: "贋作者は声を張り上げて言い訳を重ねるばかりだった。随行員たちの脅しで得られたのは、殴って腫れた拳だけだった"
 relic_expedition_events.14.title: "道中の砂嵐"
 relic_expedition_events.14.desc: "正午ごろ、黄土色の砂塵が地平線を覆いはじめ、1時間もしないうちに道は見えなくなった。ラクダは脚を折って座り込み、立とうとしない。細かな砂は衣服のひだや水袋の隙間にまで入り込み、案内人も道標の石塚を見分けられなくなったと認めた。[target_leader.GetName]は、視界の利かぬまま進むか、嵐が過ぎるまで待って数日を失うか、決断を迫られている。"
 relic_expedition_events.14.a: "このまま進め。道はそれほど長くないはずだ。"
 relic_expedition_events.14.b: "天幕を重しで押さえて野営しろ。嵐が収まるのを待つ。"
 relic_expedition_events.15.title: "熱病の蔓延"
 relic_expedition_events.15.desc_land: "熱病は水運びの者たちとともに持ち込まれ、ほとんど前触れもなく2人、3人ずつと次々に倒れていった。夜明けには頭痛を訴え、正午には震えが始まり、翌々日の朝には浅い墓に葬られる。遠征隊の2人の医師では、助けを求める者すべてに対応しきれない。健康な者たちも、病人から距離を置いて眠るようになった。[target_leader.GetName]は、病の拡大を食い止めるために、どれほどの資金を割くか決めなければならない。"
 relic_expedition_events.15.desc_sea: "熱病は、港で最後に補給した水とともに船内へ持ち込まれ、ほとんど前触れもなく2人、3人ずつと次々に倒れていった。夜明けには頭痛を訴え、正午には震えが始まり、翌々日の朝には海へ葬られる。遠征隊の2人の医師では、狭い船倉で助けを求める者すべてに対応しきれない。健康な者たちも、甲板の上でできるだけ病人から離れて眠るようになった。[target_leader.GetName]は、病の拡大を食い止めるために、どれほどの資金を割くか決めなければならない。"
 relic_expedition_events.15.a: "病人の治療と隔離には金を惜しむな。"
 relic_expedition_events.15.b: "放っておけ。熱病などじきに収まる。"
 relic_expedition_events.16.title: "砂漠の盗賊が通行料を要求"
 relic_expedition_events.16.desc: "2つの尾根のあいだへ下る道を、武装した男たちが塞いでいる。その数は多く、隊列も整っており、寄せ集めの略奪者とは思えない。首領は馬を進めて一団の前に出ると、通行料として要求する額を告げた。拒めば戦いになることも、その代償がどれほどかも、すでに見積もっているらしい。"
 relic_expedition_events.16.a: "向こうが気を変える前に、通行料を払って先を急げ。"
 relic_expedition_events.16.b: "蹴散らして進め。ここまで来て金を巻き上げられてたまるか。"
 relic_expedition_events.16.c: "数に物を言わせろ。これだけいれば、逆らう者もあるまい。"
 relic_expedition_events.17.title: "巡礼者の噂"
 relic_expedition_events.17.desc: "巡礼者の一行が、一夜を過ごすため同じ宿場に立ち寄った。焚き火を囲むうち、話はいつものように聖遺物へと及び、遠い内陸から来た羊毛商人の息子が、20年前に亡くなった叔父から聞いたという話を、うろ覚えながら語りはじめた。燃える家から包みを運び出す修道士たち。海沿いの道で過ごした一夜。そして、誰にも知られぬはずだった埋葬。家のことは思い出せないという。だが、その道筋だけは妙にはっきり覚えている。"
 relic_expedition_events.17.a: "もう1杯奢ってやれ。覚えていることを残らず聞き出すのだ。"
 relic_expedition_events.17.b: "数ある噂話のひとつに過ぎん。夜明けとともに出発する。"
 relic_expedition_events.17.tale_confirmed_tt: "金を渡すと口が軽くなり、言うべきではなかったことまでつい口を滑らせた"
 relic_expedition_events.17.tale_fades_tt: "もう1杯奢っても無駄だった。話を繰り返すたび、細部はますます曖昧になっていった"
 relic_expedition_events.18.title: "資金不足"
 relic_expedition_events.18.desc: "両替相場の悪化に加え、外国人への貸し付けを急に渋るようになった金貸したちのせいで、遠征隊の資金は想定以上に減っている。随行員たちへの賃金はすでに2週間も滞り、ラバ引きたちは我々の貨幣ではなく、自分たちが信用する貨幣での支払いを求めている。しかもこの地の町々では、我々が情報を集めるより先に、賃金を滞らせている一行の噂が知れ渡っていく。"
 relic_expedition_events.18.a: "急げ、不足分は国庫で補え。"
 relic_expedition_events.18.b: "賃金はもうしばらく待たせろ。どうせほかに行くあてもない。"
 relic_expedition_events.19.title: "地元当局の目"
 relic_expedition_events.19.desc_muslim: "地元のカーディーが、外国人たちがフランク人の財宝について詳しく聞き回っていると耳にしたらしい。さらには、諸王国が滅びた際、どの家が何を手元に残したのかまで探っているという。その書記が、茶と賛辞を携えて[target_leader.GetName]を訪ねてきた。丁重な言葉の裏にある意図は明白だ。調査を円滑に進めたければ、主人の了承を得て、モスクの維持に相応の寄進をするべきだと。"
 relic_expedition_events.19.desc_christian: "地元の[relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')]が、教会の領分である聖遺物について随分と深入りしている外国人の一行の存在に気づいた。助祭長は[target_leader.GetName]を丁重にもてなし、強欲の罪について長々と説いた。今後も好意的な処遇を受けたければ、祭壇に相応の献金を捧げる必要があることだけは十分に伝わってきた。"
 relic_expedition_events.19.desc_fallback: "遠征隊があれこれ聞き回っているという話が、関わらないほうがよい筋にまで伝わったらしい。日が暮れてから、誰も素性を明かそうとしない男が宿に現れ、招かれもしないまま席についた。そして、このような町で外国人の一行がどれほど簡単に厄介事へ巻き込まれるかを、ゆっくりと言い聞かせた。終始穏やかで丁重な物言いだったが、その警告に曖昧なところはなかった。"
 relic_expedition_events.19.a: "しかるべき相手には、きちんと礼を通しておけ。"
 relic_expedition_events.19.b: "警告は無視して探索を続けろ。ただでさえ時間がない。"
 relic_expedition_events.20.title: "真の十字架の回収"
 relic_expedition_events.20.desc: "[relic_finder.GetName]が、ヒッティーンの惨禍以来行方知れずとなっていた$relic_true_cross_found$を回収し、自らの宝物庫に収めたとの報せが、キリスト教諸国の宮廷に届いた。各地の大聖堂参事会は、発見の経緯についてそれぞれ詳しい説明を求めるだろう。だが、その真正性をめぐって見解が一致することはほとんどない。"
 relic_expedition_events.20.a: "キリスト教世界ではすぐに報せが広まるものだ。"
 relic_expedition_events.21.title: "聖槍の再発見"
 relic_expedition_events.21.desc: "[relic_finder.GetName]が、第1回十字軍が[ShowLocationName('antioch')]を去って以来行方知れずとなっていた$relic_holy_lance_found$を回収したとの報せが、信徒たちのあいだに広まっている。この報せを受け、巡礼の旅程を改める者も少なくないだろう。"
 relic_expedition_events.21.a: "またひとつ、聖遺物があるべき場所へ戻った。"
 relic_expedition_events.22.title: "聖骸布の発見"
 relic_expedition_events.22.desc: "ある報せがカトリック世界に広まっている。[relic_finder.GetName]が、長らく存在だけが語られてきた$relic_holy_shroud_found$を手に入れたのだという。懐疑的な者たちは、これまでどおり疑いつづけるだろう。それでも、信徒たちは巡礼へと向かう。"
 relic_expedition_events.22.a: "巡礼者たち自身に判断させよう。"
