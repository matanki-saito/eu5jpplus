l_japanese:
 relic_expedition_events.1.title: "遺物の探求"
 relic_expedition_events.1.desc: "司教たちからの依頼に、[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]が応じた。レバントから帰国したある商人が、こんな話を伝えている。ダマスカスの商人が父親から聞いた話によれば、十字軍の諸王国が滅亡した際、フランク人が教会に保管していた品々の多くは焼き払われず、持ち去られて埋められたという。埋められたものなら掘り起こすことができる。また、適切な時期に適切な家を尋ね、周囲に聞かれるような場所で値切り交渉をしなければ、買い取ることも可能だ。\n\nどの聖遺物がどこにあるのか、誰も口にしようとしない。この海岸沿いの港では、こうした話などいくらでも安く手に入る。だが、この話は然るべき者たちの耳に届いたのだ。"
 relic_expedition_events.1.a: "十分な装備を整えよ。贈り物、通訳、修道士、そして財布を用意するのだ。"
 relic_expedition_events.1.b: "諜報員を1人、そして目立たぬ財布を用意しろ。目撃者が少なければ、危険も減る。"
 relic_expedition_events.1.historical_info: "真の十字架は1187年7月、ヒッティーンの戦場に持ち出され、サラディンの軍に奪われた。獅子心王リチャード、ビザンツ皇帝、そしてグルジア女王は皆、その身代金を支払って取り戻そうとしたが、いずれも失敗に終わった。信頼に足る最後の報告では、それはダマスカスにあったとされるが、その後の記録からは完全に姿を消している。1098年にアンティオキアで発見された聖槍も、第1回十字軍がこの地を去ると、同じように忽然と姿を消した。いずれも失われた経緯は明らかになっておらず、それこそが探索者たちが探しつづけてきた理由である。"
 relic_expedition_events.2.title: "到着"
 relic_expedition_events.2.desc_jerusalem_first: "遠征隊が[ShowLocationName('jerusalem')]に到着し、聖墳墓教会の前に立った。[location_scope.GetOwner.GetAdjective]の守備隊は一行を一瞥しただけで関心を失った。ここには季節を問わず、同じ墓と同じ物語を求めて外国人たちがやってくるからだ。それらの物語の裏側のどこかに、追うべき手がかりが隠されている。それを見つけるには時間と費用がかかり、そして何よりも、誰を信じるかを見極めなければならない。"
 relic_expedition_events.2.desc_jerusalem_repeat: "再び[ShowLocationNameWithNoTooltip('jerusalem')]に戻った。聖墳墓教会の聖職者たちは、いまでは[target_leader.GetName]を見知っており、守備隊はもはや顔を上げようとさえしない。"
 relic_expedition_events.2.desc_acre_first: "遠征隊が[ShowLocationName('acre')]に到着した。ここは1291年にマムルーク朝に占領されるまで、十字軍王国の首都であった。大聖堂は屋根のあった場所に空が広がるという有様ではあるが、かろうじて現存している。略奪以来、街の複数の区画は一度も再建されていない。まだ誰も、その瓦礫をかき分ける理由など持たないのだ。"
 relic_expedition_events.2.desc_acre_repeat: "再び[ShowLocationNameWithNoTooltip('acre')]へ。[target_leader.GetName]は、どの路地に二度歩く価値があるかを知っている。"
 relic_expedition_events.2.desc_antioch_first: "遠征隊が[ShowLocationName('antioch')]に到着した。ここは消滅した十字軍国家の首都であり、1098年の絶望的な夏に教会の床から$relic_holy_lance_found$が掘り出された都市である。軍隊が南の[ShowLocationNameWithNoTooltip('jerusalem')]へと進軍した後、聖槍がどこへ行ったのか、西方で解明できた者は誰一人としていない。そしてこの都市が行方を見失ったのは、それだけではないのだ。"
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName]は再び[ShowLocationNameWithNoTooltip('antioch')]に戻り、失われた聖槍の行方を尋ねつづけているが、相変わらずひとつの質問に対して3つの答えが返ってくるだけだ。"
 relic_expedition_events.2.desc_damascus_first: "遠征隊が[ShowLocationName('damascus')]に到着した。ここは[ShowProvinceDefinitionName('shaam_province')]の偉大なる[location_scope.GetOwner.GetAdjective]の首都だ。ヒッティーンの戦い以降に$relic_true_cross_found$の所在が信頼できる形で報告された最後の場所でもあるが、あの聖遺物がいまもここにあるかどうかは別の問題である。この規模の都市には数世紀にわたって数多くの宝物が流れ込んできたが、持ち出されたものはごくわずかである。"
 relic_expedition_events.2.desc_damascus_repeat: "再び[ShowLocationNameWithNoTooltip('damascus')]に戻った。[target_leader.GetName]は、この[location_scope.GetRank.GetNameWithNoTooltip]で誰が口の軽い者か、そしてその口を開かせるにはいくらかかるのかを学んだ。"
 relic_expedition_events.2.desc_tripoli_first: "遠征隊が[ShowLocationName('tripoli_syria')]に到着した。ここは1289年に陥落するまで、十字軍の伯領であった。港の交易は相変わらず活気があるが、古い城塞の礼拝堂は誰の記憶にもないほど長いあいだ聖別されないまま放置されており、誰が物を運び出そうとした形跡もない。"
 relic_expedition_events.2.desc_tripoli_repeat: "再び[ShowLocationNameWithNoTooltip('tripoli_syria')]に戻った。いまや港の商人たちは[target_leader.GetName]の顔を覚えている。"
 relic_expedition_events.2.desc_tyre_first: "遠征隊が[ShowLocationName('sur')]に到着した。ここは福音書にキリストがその地を通過したことが記されるほど古い[location_scope.GetRank.GetName]であり、1291年以前に十字軍が保持した本土最後の拠点のひとつである。そしてその大司教区は、2世紀にわたって記録を保管していた。現存する記録は十数軒の民家に散在しており、何を所蔵しているかについて、持ち主たちの言うことは誰一人として一致しない。"
 relic_expedition_events.2.desc_tyre_repeat: "再び[ShowLocationNameWithNoTooltip('sur')]に戻った。[target_leader.GetName]は、かつての大司教区が残した記録のほとんどを読み解いている。"
 relic_expedition_events.2.desc_jaffa_first: "遠征隊が[ShowLocationName('jaffa')]に到着した。巡礼者たちが船で大挙して上陸した港であり、使徒ペトロが未亡人タビタを死から蘇らせたと伝えられる場所でもある。2世紀にわたり、この港には行ったり来たりする巡礼者の流れが絶えなかった。しかし、そのすべてがこの地を去ったわけではない。"
 relic_expedition_events.2.desc_jaffa_repeat: "再び[ShowLocationNameWithNoTooltip('jaffa')]に戻った。埠頭周辺の一帯は、[target_leader.GetName]の質問に慣れっこになっている。"
 relic_expedition_events.2.desc_hebron_first: "遠征隊が[ShowLocationName('hebron')]とマクペラの洞穴に到着した。ここにはアブラハム、イサク、ヤコブの全員が埋葬されているとされ、[ShowReligionGroupAdjective('israelite_group')]、[ShowReligionGroupAdjective('christian')]、[ShowReligionGroupAdjective('muslim')]の信徒たちにとって等しく神聖な場所である。3つの信仰が数世紀にわたってこの聖地を豊かにし、またそこから何かを奪っていった。間違った時代にしまわれてしまった小さな何かが、永遠に気づかれることなくここに眠っているかもしれない。"
 relic_expedition_events.2.desc_hebron_repeat: "再び[ShowLocationNameWithNoTooltip('hebron')]に戻った。[target_leader.GetName]は以前にもこの聖地の境内を歩いたことがあり、どこを歩けば目立つかも心得ている。"
 relic_expedition_events.2.desc_sidon_first: "遠征隊が[ShowLocationName('sidon')]に到着した。ここは福音書にキリストが訪れたと記されているもうひとつの町であり、王国が滅亡するまでは十字軍の領主領であった。古いフランク人地区には、その後二度にわたって新たな住民が移り住んでいる。現在の住民は自らの地下室に何があるのかさえ知らない。"
 relic_expedition_events.2.desc_sidon_repeat: "再び[ShowLocationNameWithNoTooltip('sidon')]に戻った。[target_leader.GetName]は再訪する価値のあるフランク人の家を一覧にまとめている。"
 relic_expedition_events.2.desc_karak_first: "遠征隊が[ShowLocationName('karak')]に到着した。ウルトレジョルダンの領主としてルノー・ド・シャティヨンが支配していた砂漠の城である。ルノーは長年にわたり巡礼者の集団を襲撃し、サラディンが仕掛けてくるであろう包囲戦に備えて、その戦利品をここに保管していたとされる。城下の町では、どの家族もその物語を異なる形で語っている。"
 relic_expedition_events.2.desc_karak_repeat: "再び[ShowLocationNameWithNoTooltip('karak')]に戻った。[target_leader.GetName]はすでに城の伝説を一度は耳にしており、おしゃべりな者からは二度も聞かされている。"
 relic_expedition_events.2.desc_gaza_first: "遠征隊が[ShowLocationName('gaza')]に到着した。ここはかつてテンプル騎士団の守備隊が置かれていた古都であり、[ShowRegionName('egypt_region')]へと南下する砂漠の街道に位置している。騎士団が弾圧され、その修道士たちがキリスト教世界の各地へ散ってから、すでに何世代も経っている。だが、彼らがここに保管していたもののすべてが、彼らとともに去ったわけではない。"
 relic_expedition_events.2.desc_gaza_repeat: "再び[ShowLocationNameWithNoTooltip('gaza')]に戻った。[target_leader.GetName]は、かつてテンプル騎士団が暮らしていた場所に住む家族の大半と話をした。"
 relic_expedition_events.2.desc_famagusta_first: "遠征隊が[ShowLocationName('famagusta')]に到着した。ここは[ShowProvinceDefinitionName('cyprus_province')]における[location_scope.GetOwner.GetAdjective]の[location_scope.GetOwner.GetFlavorRank]の大港である。1291年に[ShowLocationNameWithNoTooltip('acre')]が陥落すると、多くのラテン系諸家がここへ逃れてきたが、その多くが自らの称号以上のものを本土から持ち出していた。"
 relic_expedition_events.2.desc_famagusta_repeat: "再び[ShowLocationNameWithNoTooltip('famagusta')]に戻った。いまでは聖ニコラオス大聖堂でも[target_leader.GetName]の顔が知られている。"
 relic_expedition_events.2.desc_nicosia_first: "遠征隊が[ShowLocationName('nicosia_cyp')]に到着した。ここは[ShowProvinceDefinitionName('cyprus_province')]の権力の中心地である。[location_scope.GetOwner.GetAdjective]の[location_scope.GetOwner.GetGovernment.GetCourtTitle]は、追放された本土の貴族たちが持ち込んだ品々の膨大な記録を保管しており、彼らが後に質に入れた品々の記録はさらに長い。"
 relic_expedition_events.2.desc_nicosia_repeat: "再び[ShowLocationNameWithNoTooltip('nicosia_cyp')]に戻った。[location_scope.GetOwner.GetAdjective]の文書保管係たちは、なぜ[target_leader.GetName]が何度も戻ってくるのかと問うのをやめた。"
 relic_expedition_events.2.desc_rhodes_first: "遠征隊が[ShowLocationName('rodos')]に到着した。ここは[location_scope.GetOwner.GetAdjective]の領土である。当地の騎士団は[ShowLocationNameWithNoTooltip('acre')]の陥落を自らの歴史として記憶しており、本土で放棄されたすべての騎士団管区の一覧を保管していた。ここいらの海域において、カトリックの探索隊にこれほどの記録を見せてくれる都市はほかにないだろう。"
 relic_expedition_events.2.desc_rhodes_repeat: "再び[ShowLocationNameWithNoTooltip('rodos')]に戻った。[location_scope.GetOwner.GetAdjective]の文書保管係たちは、[target_leader.GetName]を馴染みの厄介者として出迎える。"
 relic_expedition_events.2.desc_fallback: "またひとつ立ち寄り、また一通りの紹介を済ませる。[target_leader.GetName]は再び行動を開始し、追う価値のある何かが見つかるのを待つ。"
 relic_expedition_events.2.a: "聞き込みをせよ。[ShowGoodsNameWithNoTooltip('wine')]を振る舞えば、巡礼者や兵士は口を開く。"
 relic_expedition_events.2.b: "ついに聖遺物の手がかりを掴んだ。"
 relic_expedition_events.2.c: "ここでさらに随行員を雇え。優秀な護衛は安くはない。"
 relic_expedition_events.2.d: "地元の公文書館にあるものを手に入れるため、宮廷の役人に賄賂を贈れ。"
 relic_expedition_events.2.e: "学者を探し出せ。訓練を積んだ知性なら、噂の真偽を見抜ける。"
 relic_expedition_events.2.f: "有望な手がかりをたどり、[relic_hunt_new_lead.GetNameWithNoTooltip]へ向かえ。"
 relic_expedition_events.2.g: "探索を打ち切り、引き返せ。"
 relic_expedition_events.3.title: "探索は続く"
 relic_expedition_events.3.desc_jerusalem: "巡礼者の集団に先んじて、[target_leader.GetName]が夜明け前に聖墳墓教会へ戻った。蝋燭の明かりで照らされる別の地下墓室があり、書き写すべき古びた碑文がまたひとつ、そして相応の対価さえ払えば話してくれる別の聖職者がいる。"
 relic_expedition_events.3.desc_acre: "中空の壁を叩いて音を確かめ、何世代にもわたって誰も手をつけていなかった崩れた石積みをひっくり返した。[ShowLocationNameWithNoTooltip('acre')]は広大な[relic_hunt_loc.GetRank.GetName]だが、そこに残っている人はごくわずかであり、一行だけで調べられる範囲にはかぎりがある。"
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName]が消えた城壁の跡をたどり、いまも残る構造物を、聖槍が現れた場所に関する巡礼者の証言と照らし合わせた。証言は食い違い、そのどれもが実際の状況と一致しない。"
 relic_expedition_events.3.desc_damascus: "スークからスークへと、[target_leader.GetName]が商人や金貸しとの関係を築いていく。これほど大きな都市では、ゆっくりとではあるが確実に噂が広まる。そして噂には、最初から値段が設定されているのだ。"
 relic_expedition_events.3.desc_tripoli: "城塞の礼拝堂は床石が1枚ずつ剥がされ、壁の音が不自然だと感じられる箇所からは漆喰が剥がされていく。礼拝堂だけでも調査には数週間を要する。"
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName]は[ShowLocationNameWithNoTooltip('sur')]の大司教区の記録のうち現存するものを丹念に調べ、水浸しになった台帳を半ば判読不能な特許状の脇に置き、ほかの記録と食い違う記載を探し求めた。"
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName]は日々を[ShowLocationNameWithNoTooltip('jaffa')]の港で過ごし、波止場の労働者や船乗りに酒を奢り、フランク人が去る前にどの倉庫が巡礼者の荷物を扱っていたかを尋ねた。"
 relic_expedition_events.3.desc_hebron: "聖堂が一隅ごとにゆっくりと、そしてここを守る3つの信仰のいずれにも無礼にならないよう細心の注意を払って調べられた。[target_leader.GetName]は封印されたすべての通路を記録するが、それらについて口に出して尋ねることはしない。"
 relic_expedition_events.3.desc_sidon: "かつてのフランク人地区にて、[target_leader.GetName]は再定住した家々を一軒ずつ訪ね歩き、扉を叩いては、最後のキリスト教徒の入居者が逃げ出して以来、誰も開けていない地下室や屋根裏部屋について尋ねた。"
 relic_expedition_events.3.desc_karak: "ランタンを手に、[target_leader.GetName]が[ShowLocationNameWithNoTooltip('karak')]の地下室や貯水槽を歩き回り、語り部たちが描写するルノー・ド・シャティヨンの財宝の話と、実際に壁のなかに収められる量とを照らし合わせていく。"
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName]は[ShowLocationNameWithNoTooltip('gaza')]に残された、弾圧された騎士団の所有物を追いつづけ、テンプル騎士団がどの倉庫を施錠していたのか、そしてその後誰が鍵を持ち去ったのかについて、近隣住民をしつこく問いただした。"
 relic_expedition_events.3.desc_famagusta: "[ShowLocationNameWithNoTooltip('famagusta')]では、本土から逃れてきた一族の家財箱がひとつずつ調べられ、[ShowLocationNameWithNoTooltip('acre')]から持ち出された品々と、それ以来ひっそりと忘れ去られてきた品々が記録されていく。"
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName]が[ShowLocationNameWithNoTooltip('nicosia_cyp')]にある[relic_hunt_loc.GetOwner.GetAdjective]の[relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle]の公文書を精査し、誰も尋ねようとしなかった聖遺物について、目録と相続記録を突き合わせる。"
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName]が[ShowLocationNameWithNoTooltip('rodos')]の[relic_hunt_loc.GetOwner.GetAdjective]の文書保管係に対し、まだ見せていない文書を出すよう迫り、その一覧を、古参の修道士たちが[ShowLocationNameWithNoTooltip('acre')]から持ち出されたと語る内容と照らし合わせる。"
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName]は調査を続け、些細な手掛かりをひとつずつ丹念に検証してから次に進む。"
 relic_expedition_events.3.a: "聞き込みを続ける。ここには、口にしている以上のことを知る者がいるはずだ。"
 relic_expedition_events.3.b: "やっと手がかりそのものを掴んだ。ついに我々は見つけたのだ。"
 relic_expedition_events.3.c: "ここにいるあいだに、さらに随行員を雇え。"
 relic_expedition_events.3.d: "別の役人に賄賂を贈れ。この町の記録は、もっと詳しい。"
 relic_expedition_events.3.e: "先へ進む前に、地元の学者に相談せよ。"
 relic_expedition_events.3.f: "新しい手がかりが別の場所を指し示している。[relic_hunt_new_lead.GetNameWithNoTooltip]へ向かい、それを追え。"
 relic_expedition_events.3.g: "探索を打ち切り、引き返せ。"
 relic_expedition_events.4.title: "途絶えた手がかり"
 relic_expedition_events.4.desc: "[target_leader.GetName]が追ってきた手がかりは、すべて不発に終わった。通訳たちは聞き込みのできる酒場を回り尽くし、賄賂を受け取った役人たちも、もはや売れる情報を持っていない。一行が異国で手持ち無沙汰に過ごす週が増えるたび、財布は軽くなっていく。王冠への報告はこうだ——さらなる探索の費用を支払うか、それとも探索を打ち切るか。"
 relic_expedition_events.4.a: "必要な資金を送れ。"
 relic_expedition_events.4.b: "もう十分だ。遠征隊を呼び戻せ。"
 relic_expedition_events.5.title: "失われた護衛"
 relic_expedition_events.5.desc: "[target_leader.GetName]の護衛は1人もいなくなった。山賊に襲われた者、熱病に倒れた者、そして終わりの見えない探索に支払われる報酬が少なすぎるため、ひっそりと離反した者たちが、2人、3人ずつと失われていった。背後に武装した男たちが控えていない以上、聖遺物を手放す気のない領主や修道院長に、引き渡しを迫ることなどできない。\n\n探索はここで終わりだ。"
 relic_expedition_events.5.a: "護衛なしで任務を継続することはできない。"
 relic_expedition_events.6.title: "乗り気な売り手"
 relic_expedition_events.6.desc_true_cross: "町の商人が、誰も聞き耳を立てていないことを確かめてから、$relic_true_cross_found$の断片——ヒッティーンで失われた木片を所持していると語った。複数の人の手から手へと渡り、流れ着いたものだという。関わった人物の名を明かすことは拒んでいるが、値段なら教えてくれるそうだ。"
 relic_expedition_events.6.desc_holy_lance: "戦死した兵士の家族が、曾祖父の従軍以来、ある槍の穂先を保管しており、それこそが1098年に発見された$relic_holy_lance_found$であると主張している。そして彼らは、金に換えることを望んでいる。"
 relic_expedition_events.6.desc_holy_shroud: "ある商人が、磔刑に処された男の跡がうっすらと見えるリネンの布を広げた。この布が何世紀ものあいだどこにあったかを説明できないにもかかわらず、法外な金額を要求している。"
 relic_expedition_events.6.desc_holy_nail: "ある鍛冶屋の未亡人が、長い年月を経て黒ずんだ鉄の釘を取り出した。彼女の夫の家族は、これが磔刑に使われた釘のひとつであると代々主張してきた。彼女はこれを売るつもりだ。"
 relic_expedition_events.6.desc_true_cross_fragment: "貧しく、半ば忘れ去られた修道院には、質素な聖遺物箱に収められた木の破片が保管されており、そこには$relic_true_cross_found$の一部とだけ記されている。その売却代金で屋根の修理ができるのであれば、修道院長はそれを静かに手放すつもりだ。"
 relic_expedition_events.6.desc_saint_bones: "教区の聖職者が、色あせたラテン語で聖人の名が記された小さな骨箱を差し出した。彼は教会への寄進という名目で対価を求めている。"
 relic_expedition_events.6.desc_baptist_head: "この地区の教会のひとつは、洗礼者ヨハネの頭部であると主張する遺物を崇めている。その主張は教区の外にはほとんど知られておらず、聖職者たちは譲渡についての話し合いに応じる姿勢を見せている。"
 relic_expedition_events.6.desc_virgin_milk: "ある小さな聖堂には、密封された小瓶が保管されている。なかには白いチョークのような残留物が入っており、それは何世代にもわたって聖母マリアの乳として崇められてきた。管理人は銀製の聖遺物箱ごとそれを売却するつもりだ。"
 relic_expedition_events.6.desc_holy_thorn: "ある小貴族の一族が、控えめな聖遺物箱に入った1本の棘を所有している。彼らの話によれば、これは先祖に授けられた茨の冠の一部だという。彼らは目立たぬ形で売却することを望んでいる。"
 relic_expedition_events.6.desc_holy_chalice: "ある商人が、信じてもらえないだろうと前置きしてから、質素な石の杯を差し出した。ほかの場所でもっと大げさな主張をする者たちが何を言おうと、これこそが最後の晩餐で使われた真の聖杯なのだと語る。その価格は決して安くない。"
 relic_expedition_events.6.desc_titulus_crucis: "地元の伝説によれば、十字架の木片が西へ運ばれた際、その上に掲げられていた罪状書きの板はここに残され、隠されたという。この地のある一族は、まさにその板を代々受け継いできたと主張しており、売却するつもりでいる。"
 relic_expedition_events.6.a: "値切れ。要求された金額は高いが、交渉の余地はある。"
 relic_expedition_events.6.b: "言い値を支払え。それだけの価値があるものもある。"
 relic_expedition_events.6.c: "代わりに、従者の数に物を言わせよ。"
 relic_expedition_events.7.title: "取引成立"
 relic_expedition_events.7.desc: "条件が合意され、聖遺物箱は布に包まれた。残るは、[target_leader.GetName]が売り手の話をどこまで信じるかを決めるだけだ。"
 relic_expedition_events.7.a: "金を支払い、聖遺物を持ち帰れ。"
 relic_expedition_events.7.b: "どうにも腑に落ちない。その場を立ち去る。"
 relic_expedition_events.8.title: "乗り気な共犯者"
 relic_expedition_events.8.desc_true_cross: "地元の有力者の屋敷に仕える使用人が、理由は明かさないものの主人に不満を抱いている様子で、主人が$relic_true_cross_found$と呼ぶ黒ずんだ木片を布に包み、ほかの宝物に紛れさせて保管していると漏らした。報酬さえ払えば、その使用人はそれを持ち出す手助けをしてくれるという。"
 relic_expedition_events.8.desc_holy_lance: "1年分の未払い給与を抱えた守備隊の兵士が口を滑らせた。武器庫には、生きている人間が記憶するかぎり誰も目録に記載したことのない古い槍の穂先が保管されているという。年配の者たちはいまでもそれを「$relic_holy_lance_found$」と呼んでいる。我々がなかに入れるよう、彼が手引きするそうだ。"
 relic_expedition_events.8.desc_holy_shroud: "最近、修道院長と激しい対立にある修道院の門番は、共同体が図柄の描かれた折り畳まれた布を保管しており、それは上級修道士以外には開けられない場所に隠されていると語った。彼は扉のひとつを施錠せずにおくという。"
 relic_expedition_events.8.desc_holy_nail: "借金に苦しむ宝物庫の書記が、磔刑に使われた釘の1本として崇敬されている古い鉄釘が、目録にも記されず脇の保管庫に置かれていると打ち明けた。その鍵を持っているのは彼だけだ。"
 relic_expedition_events.8.desc_true_cross_fragment: "自身の天職に不満をもつ見習い修道士が、$relic_true_cross_found$の木片を保管する礼拝堂へ通じる鎧戸を開けておくと申し出た。"
 relic_expedition_events.8.desc_saint_bones: "生涯の労働に見合わないほど低賃金で働かされてきた墓掘り人は、教区が聖人の遺骨を収めた骨箱をどこに保管しているか、そして聖具係が午後何時に昼寝をするかを知っている。"
 relic_expedition_events.8.desc_baptist_head: "昇進を何度も見送られた下級聖職者が、上級聖職者たちが洗礼者ヨハネの頭部として崇敬している聖遺物箱のもとへ我々を案内すると申し出た。"
 relic_expedition_events.8.desc_virgin_milk: "聖堂の管理人が、何十年にもわたる低賃金にひそかな怒りを募らせている。彼は自分の指定した夜に、聖遺物箱の鍵を開けたままにしておくつもりだという。"
 relic_expedition_events.8.desc_holy_thorn: "一度解雇された後、寛大な措置で再雇用された管理人は、一族が茨の冠から取られた棘を1本収めている聖遺物箱の場所を正確に知っている。"
 relic_expedition_events.8.desc_holy_chalice: "大聖堂の聖具室係は、長年仕えてきた聖職者会について何ひとつよいことを言わない。内輪では最後の晩餐の真の聖杯と呼ぶ質素な石の杯があり、持ち出す手助けをすると彼は申し出た。"
 relic_expedition_events.8.desc_titulus_crucis: "古くから半信半疑で語り継がれてきた伝説を守りつづけてきた一族が、まったく別の提案を持ちかけた。彼らが十字架の罪状書きだと主張するものを、売り渡そうとしない親族から取り戻すのを手伝ってほしいというのだ。"
 relic_expedition_events.8.a: "口止めにはそれ相応の金が必要だ。"
 relic_expedition_events.8.d: "金は必要ない。[target_leader.GetHerHis|U]自身の魅力で彼らの協力を得られるだろう。"
 relic_expedition_events.8.b: "協力者なしで行け。金で雇う者が少なければ、口を割る者も減る。"
 relic_expedition_events.8.c: "共犯者は不要だ。我々の従者だけで持ち出せるだろう。"
 relic_expedition_events.9.title: "窃盗"
 relic_expedition_events.9.desc: "これまでのところ計画は順調だ。見張りをしているはずの者は眠っているか、別の場所にいるか、あるいは見て見ぬふりをするよう金を受け取っているらしく、共犯者が約束した扉は鍵がかかっていない。[target_leader.GetName]は暗闇のなかで、状況が変わったことを告げる叫び声が上がらないか、息を潜めて待っている。"
 relic_expedition_events.9.a: "遺物は手に入れた。まだ誰にも気づかれていない。"
 relic_expedition_events.9.b: "誰か起きたぞ。叫び声だ……足音もする。撤退だ！"
 relic_expedition_events.10.title: "学者の手引き"
 relic_expedition_events.10.desc_true_cross: "ヒッティーンについて記されたあらゆる年代記を読み漁った旅の学者が、奇しくも内容の一致する三つの記録から、敗走する騎士たちがサラディンの手に渡るのを避けるため$relic_true_cross_found$の一片を埋めたとされる場所を割り出した。学者は書きつけと使い古された地図を差し出し、同行を申し出ている。"
 relic_expedition_events.10.desc_holy_lance: "第1回十字軍に通じた学者が、[GetCharacter('koj_petrus_bartholomaeus').GetName]自身の記録を手がかりに、1098年に$relic_holy_lance_found$が発見された地下室を突き止めたという。学者によれば、その傍らにあった品々はすべて回収されたわけではないらしい。当時、この説を荒唐無稽だと退けた聖職者たちもいたが、その誤りを証明した者はいなかった。"
 relic_expedition_events.10.desc_holy_shroud: "年老いた好古家が、出典の定かでないとある噂を半ば信じている。どの年代記にも記されていない襲撃から逃れた修道士たちが、人の像が浮かぶ聖骸布を地下墓所の壁中に封じたというのだ。老人はほとんど目が見えず、生涯最後の発見を成し遂げたいと願っている。そして、その場所まで自ら我々を案内するという。"
 relic_expedition_events.10.desc_holy_nail: "聖遺物に詳しい学者が、半壊した礼拝堂を指し示した。土地の言い伝えによれば、兵がこの地を通過する前に、追われていた司祭がキリストの磔刑に使われた釘をそこへ埋めたという。"
 relic_expedition_events.10.desc_true_cross_fragment: "修道院の三代にわたる帳簿を隅々まで読み通した学者が、慌ただしく打ち捨てられた庵にたどり着いた。言い伝えによれば、最後の隠修士は命からがら逃げ出す前に、$relic_true_cross_found$の一片を礼拝堂の床下に隠したという。"
 relic_expedition_events.10.desc_saint_bones: "朽ちかけた教区記録を調べていた地元の聖人伝記作者が、古い墓地の外れにある墓標のない墓に目をつけた。敵軍の手に渡るのを避けるため、遺骨が密かに隠された、さほど名の知られていない聖人の墓だという。"
 relic_expedition_events.10.desc_baptist_head: "ある学者が、修道院の文書庫で見つかった断片的な年代記をもとに、洗礼者ヨハネの首を納めたものとして崇敬されていた聖遺物箱はかつての包囲戦のさなかに礼拝堂の床下へ隠されたと主張している。その後、礼拝堂は崩れ落ち、聖遺物箱は瓦礫の下に埋もれたという。"
 relic_expedition_events.10.desc_virgin_milk: "ほかの誰も読もうとしなかった巡礼者の日記をもとに、ある学者が、打ち捨てられた聖堂の封じられた壁龕を指し示した。言い伝えによれば、聖堂を守っていた者たちは、略奪者の手に渡るのを避けるため、そこに聖母の乳を収めた小瓶を隠したという。"
 relic_expedition_events.10.desc_holy_thorn: "ある学者が、すでに絶えた一族の書簡を丹念に読み進め、キリストの茨の冠から取られた一本の棘が、一族の地下墓所に納められていることを突き止めた。その地下墓所は一族が疫病で絶えて以来、封じられている。"
 relic_expedition_events.10.desc_holy_chalice: "この地には、[ShowLocationName('genoa')]や[ShowLocationName('valencia')]で知られる聖杯伝承とは別系統の伝承が残されている。その伝承をたどる学者が、昔あった包囲戦で破壊された礼拝堂の地下に、飾り気のない石の杯が眠っていると考えている。礼拝堂の信徒たちは、ここを掘り返そうと誰かが考えるよりはるか以前に離散していた。"
 relic_expedition_events.10.desc_titulus_crucis: "土地の言い伝えでは、十字架の罪状書きは西方へ運ばれることなく、この地に残されたという。その伝承を信じる学者が、十字軍が最後に退いた際、礼拝堂の壁のなかに封じられたのだと考えており、その場所を探す手助けを申し出ている。"
 relic_expedition_events.10.a: "地元の人足を雇おう。人手が多いほど成功の見込みも増す。"
 relic_expedition_events.10.b: "遠征隊の者だけで掘らせよう。余計な詮索をされずに済む。"
 relic_expedition_events.10.c: "よそ者に金を払う必要はない。随行員たちに掘らせればいい。"
 relic_expedition_events.11.title: "発掘"
 relic_expedition_events.11.desc: "地面は固く、掘る手はなかなか進まない。いまの[target_leader.GetName]にできるのは、ただ待ち、あの学者が本当に地図を読めるのか見届けることだけだ。"
 relic_expedition_events.11.a: "何かに当たったぞ。まさに学者の言った場所だ。"
 relic_expedition_events.11.b: "土と瓦礫しかない。もう何も残っていない。"
