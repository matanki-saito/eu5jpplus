l_japanese:
 relic_expedition_events.1.title: "遺物の探求"
 relic_expedition_events.1.desc: "司教たちからの依頼を受け、[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]がそれに応じた。レバントから帰国したある商人が、こんな話を伝えている。ダマスカスの商人が父親から聞いた話によれば、十字軍の諸王国が滅亡した際、フランク人が教会に保管していた品々の多くは焼き払われるのではなく、持ち去られて埋められたという。埋められたものなら掘り起こすことができる。また、適切な時期に適切な家を尋ね、周囲に聞かれるような場所で値切り交渉をしなければ、買い取ることも可能だ。\n\nどの聖遺物がどこにあるのか、誰も口にしようとしない。この海岸沿いの港では、こうした話などいくらでも安く手に入る。だが、この話は然るべき者たちの耳に届いたのだ。"
 relic_expedition_events.1.a: "十分な装備を整えよ。贈り物、通訳、修道士、そして財布を用意するのだ。"
 relic_expedition_events.1.b: "一人の諜報員と、目立たぬ財布を用意しろ。目撃者が少なければ、危険も減る。"
 relic_expedition_events.1.historical_info: "真の十字架は1187年7月にヒッティーンの戦場に持ち出され、サラディンの軍に奪われた。獅子心王リチャード、ビザンツ皇帝、そしてジョージア女王は皆、その身代金を支払って取り戻そうとしたが、いずれも失敗に終わった。信頼に足る最後の報告では、それはダマスカスにあったとされるが、その後の記録からは完全に姿を消している。1098年にアンティオキアで発見された聖槍も、第1回十字軍が先へ進むと、同じように忽然と姿を消した。いずれも失われた経緯は明らかになっておらず、それこそが探索者たちが探しつづけてきた理由である。"
 relic_expedition_events.2.title: "到着"
 relic_expedition_events.2.desc_jerusalem_first: "遠征隊が[ShowLocationName('jerusalem')]に到着し、聖墳墓教会の前に立った。[location_scope.GetOwner.GetAdjective]の守備隊は一行を一瞥しただけで関心を失った。季節を問わず、同じ墓と、同じ物語を求めて、ここには外国人たちがやってくるからだ。それらの物語の裏側のどこかに追うべき手がかりが隠されている。それを見つけるには時間と費用がかかり、そして何よりも誰を信じるかを見極めなければならない。"
 relic_expedition_events.2.desc_jerusalem_repeat: "再び[ShowLocationNameWithNoTooltip('jerusalem')]に戻った。聖墳墓教会の聖職者たちは、いまでは[target_leader.GetName]を見知っているため、守備隊はもはや顔を上げようとさえしない。"
 relic_expedition_events.2.desc_acre_first: "遠征隊が[ShowLocationName('acre')]に到着した。ここは1291年にマムルーク朝に占領されるまで、十字軍王国の首都であった。大聖堂は屋根のあった場所に空が広がるという有様ではあるが、かろうじて現存している。略奪以来、街の複数の区画は一度も再建されていない。まだ誰も、その瓦礫をかき分ける理由など持たないのだ。"
 relic_expedition_events.2.desc_acre_repeat: "再び[ShowLocationNameWithNoTooltip('acre')]へ。[target_leader.GetName]は、どの路地に二度歩く価値があるかを知っている。"
 relic_expedition_events.2.desc_antioch_first: "遠征隊が[ShowLocationName('antioch')]に到着した。ここは消滅した十字軍国家の首都であり、1098年の絶望的な夏に教会の床から$relic_holy_lance_found$が掘り出された都市である。軍隊が南の[ShowLocationNameWithNoTooltip('jerusalem')]へと進軍した後、聖槍がどこへ行ったのか、西方で解明できた者は誰一人としていない。この都市が行方を見失ったのは、それだけではないのだ。"
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName]は再び[ShowLocationNameWithNoTooltip('antioch')]に戻り、失われた聖槍の行方を尋ねつづけているが、相変わらずひとつの質問に対して3つの答えが返ってくるだけだ。"
 relic_expedition_events.2.desc_damascus_first: "遠征隊が[ShowLocationName('damascus')]に到着した。ここは[ShowProvinceDefinitionName('shaam_province')]の偉大なる[location_scope.GetOwner.GetAdjective]の首都であり、ヒッティーンの戦い以降に$relic_true_cross_found$の所在が信頼できる形で報告された最後の場所でもある。その特定の聖遺物がいまもここにあるかどうかは別の問題である。この規模の都市には数世紀にわたって数多くの宝物が流れ込んできたが、再び外へ出ていったものはごくわずかである。"
 relic_expedition_events.2.desc_damascus_repeat: "再び[ShowLocationNameWithNoTooltip('damascus')]に戻った。[target_leader.GetName]は、この[location_scope.GetRank.GetNameWithNoTooltip]で誰が口の軽い者か、そしてその口を開かせるにはいくらかかるのかを学んだ。"
 relic_expedition_events.2.desc_tripoli_first: "遠征隊が[ShowLocationName('tripoli_syria')]に到着した。ここは1289年の陥落まで十字軍の伯領であった。港の交易は相変わらず活気があるが、古い城塞の礼拝堂は誰の記憶にもないほど長いあいだ聖別されないまま放置されており、誰もそこから物を運び出そうとはしていない。"
 relic_expedition_events.2.desc_tripoli_repeat: "再び[ShowLocationNameWithNoTooltip('tripoli_syria')]に戻った。港の商人たちは、いまでは[target_leader.GetName]の顔を見慣れている。"
 relic_expedition_events.2.desc_tyre_first: "遠征隊が[ShowLocationName('sur')]に到着した。ここは福音書にキリストがその地を通過したことが記されるほど古い[location_scope.GetRank.GetName]であり、1291年以前に十字軍が保持した本土最後の拠点のひとつである。その大司教区は2世紀にわたって記録を保管していた。現存する記録は十数軒の民家に散在しており、何を所蔵しているかについて、持ち主たちの言い分は誰一人として一致しない。"
 relic_expedition_events.2.desc_tyre_repeat: "再び[ShowLocationNameWithNoTooltip('sur')]に戻った。[target_leader.GetName]は、かつての大司教区が残した記録のほとんどを読み解いている。"
 relic_expedition_events.2.desc_jaffa_first: "遠征隊が[ShowLocationName('jaffa')]に到着した。巡礼者たちが船で大挙して上陸した港であり、使徒ペトロが未亡人タビタを死者のなかから蘇らせたと伝えられる場所でもある。2世紀にわたり、この港には行ったり来たりする巡礼者の流れが絶えなかった。しかし、そのすべてが再びこの地を去ったわけではない。"
 relic_expedition_events.2.desc_jaffa_repeat: "再び[ShowLocationNameWithNoTooltip('jaffa')]に戻った。埠頭周辺の一帯は、[target_leader.GetName]の質問に慣れっこになっている。"
 relic_expedition_events.2.desc_hebron_first: "遠征隊が[ShowLocationName('hebron')]とマクペラの洞穴に到着した。ここにはアブラハム、イサク、ヤコブの全員が埋葬されているとされ、[ShowReligionGroupAdjective('israelite_group')]、[ShowReligionGroupAdjective('christian')]、[ShowReligionGroupAdjective('muslim')]の信徒たちにとって等しく神聖な場所である。3つの信仰が数世紀にわたってこの聖地を豊かにし、またそこから何か奪っていった。間違った時代にしまわれてしまった小さな何かが、永遠に気づかれることなくここに眠っているかもしれない。"
 relic_expedition_events.2.desc_hebron_repeat: "再び[ShowLocationNameWithNoTooltip('hebron')]に戻った。[target_leader.GetName]は以前にもこの聖地の境内を歩いたことがあり、どこを歩けば目立つかも心得ている。"
 relic_expedition_events.2.desc_sidon_first: "遠征隊が[ShowLocationName('sidon')]に到着した。ここは福音書にキリストが訪れたと記されているもうひとつの町であり、王国が滅亡するまで十字軍の領主領であった。古いフランク人地区には、その後二度にわたって新たな住民が移り住んでいる。現在の住民は自らの地下室に何があるのかさえ知らない。"
 relic_expedition_events.2.desc_sidon_repeat: "再び[ShowLocationNameWithNoTooltip('sidon')]に戻った。[target_leader.GetName]は再訪する価値のあるフランク人の家を一覧にまとめている。"
 relic_expedition_events.2.desc_karak_first: "遠征隊が[ShowLocationName('karak')]に到着した。ウルトレジュルダンの領主としてルノー・ド・シャティヨンが支配していた砂漠の城である。ルノーは長年にわたり巡礼の一団を襲撃し、サラディンが仕掛けてくるであろう包囲戦に備えて、その戦利品をここに保管していたとされる。城下の町では、どの家族もその物語を異なる形で語っている。"
 relic_expedition_events.2.desc_karak_repeat: "再び[ShowLocationNameWithNoTooltip('karak')]に戻った。[target_leader.GetName]はすでに城の伝説を一度は耳にしており、おしゃべりな者からは二度も聞かされている。"
 relic_expedition_events.2.desc_gaza_first: "遠征隊が[ShowLocationName('gaza')]に到着した。ここはかつてテンプル騎士団の守備隊が置かれていた古都であり、[ShowRegionName('egypt_region')]へと南下する砂漠の街道に位置している。騎士団は弾圧され、その修道士たちがキリスト教世界各地へ散らされてから、すでに何世代も経っている。だが、彼らがここに保管していたもののすべてが、彼らとともに去ったわけではない。"
 relic_expedition_events.2.desc_gaza_repeat: "再び[ShowLocationNameWithNoTooltip('gaza')]に戻った。[target_leader.GetName]は、かつてテンプル騎士団が暮らしていた場所に住む家族の大半と話をした。"
 relic_expedition_events.2.desc_famagusta_first: "遠征隊が[ShowLocationName('famagusta')]に到着した。ここは[ShowProvinceDefinitionName('cyprus_province')]における[location_scope.GetOwner.GetAdjective]の[location_scope.GetOwner.GetFlavorRank]の大港である。1291年に[ShowLocationNameWithNoTooltip('acre')]が陥落すると、多くのラテン系家族がここへ逃れてきたが、その多くが身分に見合う称号以上のものを本土から持ち出していた。"
 relic_expedition_events.2.desc_famagusta_repeat: "再び[ShowLocationNameWithNoTooltip('famagusta')]に戻った。いまでは聖ニコラオス大聖堂でも[target_leader.GetName]の顔は知られている。"
 relic_expedition_events.2.desc_nicosia_first: "遠征隊が[ShowLocationName('nicosia_cyp')]に到着した。ここは[ShowProvinceDefinitionName('cyprus_province')]の権力の中心地である。[location_scope.GetOwner.GetAdjective]の[location_scope.GetOwner.GetGovernment.GetCourtTitle]は、追放された本土の貴族たちが持ち込んだ品々の膨大な記録を保管しており、彼らが後に質に入れた品々の記録はさらに長い。"
 relic_expedition_events.2.desc_nicosia_repeat: "再び[ShowLocationNameWithNoTooltip('nicosia_cyp')]に戻った。[location_scope.GetOwner.GetAdjective]の文書保管係たちは、なぜ[target_leader.GetName]が何度も戻ってくるのかと問うのをやめた。"
 relic_expedition_events.2.desc_rhodes_first: "遠征隊が[ShowLocationName('rodos')]に到着した。ここは[location_scope.GetOwner.GetAdjective]の領土である。当地も騎士団は[ShowLocationNameWithNoTooltip('acre')]の陥落を自らの歴史として記憶しており、本土で放棄されたすべての騎士団管区の一覧を保管していた。これらの海域のほかのどの都市も、カトリックの探索隊にこれほどの記録を見せてはくれないだろう。"
 relic_expedition_events.2.desc_rhodes_repeat: "再び[ShowLocationNameWithNoTooltip('rodos')]に戻った。[location_scope.GetOwner.GetAdjective]の文書保管係たちは、[target_leader.GetName]を馴染みの厄介者として出迎える。"
 relic_expedition_events.2.desc_fallback: "また一つ立ち寄り、また一通りの紹介を済ませる。[target_leader.GetName]は再び行動を開始し、追う価値のある何かが見つかるのを待つ。"
 relic_expedition_events.2.a: "聞き込みをせよ。[ShowGoodsNameWithNoTooltip('wine')]を振る舞えば、巡礼者や兵士たちは口を開く。"
 relic_expedition_events.2.b: "ついに聖遺物の手がかりを掴んだ。"
 relic_expedition_events.2.c: "ここでさらに従者を雇え。優秀な護衛は安くはない。"
 relic_expedition_events.2.d: "地元の公文書館にあるものを手に入れるため、宮廷の役人に賄賂を贈れ。"
 relic_expedition_events.2.e: "学者を探し出せ。訓練を積んだ知性なら、噂の真偽を見抜ける。"
 relic_expedition_events.2.f: "有望な手がかりを辿り、[relic_hunt_new_lead.GetNameWithNoTooltip]へ向かえ。"
 relic_expedition_events.2.g: "捜索を打ち切り、引き返せ。"
 relic_expedition_events.3.title: "The Search Continues"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] goes back to the Holy Sepulchre before dawn, ahead of the pilgrim crowds. There is another crypt to see by candlelight, another worn inscription to copy down, another canon willing to talk for the right consideration."
 relic_expedition_events.3.desc_acre: "Hollow walls sounded out, collapsed masonry turned over where nobody has disturbed it in generations. [ShowLocationNameWithNoTooltip('acre')] is a large [relic_hunt_loc.GetRank.GetName] with very few people left in it, and one party can cover only so much of it."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] traces the line of the vanished walls, setting what still stands against pilgrim accounts of where the Lance came up. The accounts do not agree with each other, and none of them agree with the ground."
 relic_expedition_events.3.desc_damascus: "Souk by souk, [target_leader.GetName] cultivates merchants and moneylenders. Rumors move slowly through a city this large, but they do move, and they arrive with a price already attached."
 relic_expedition_events.3.desc_tripoli: "The citadel chapel comes apart flagstone by flagstone, plaster prised off wherever the wall sounds wrong. The chapel alone is weeks of work."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] works through what survives of [ShowLocationNameWithNoTooltip('sur')]'s archbishopric records, laying water-stained ledgers beside half-legible charters and hunting for the entry that does not match the others."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] spends the days at [ShowLocationNameWithNoTooltip('jaffa')]'s harbor, buying drink for dockhands and boatmen and asking which warehouses handled pilgrim cargo before the Franks left."
 relic_expedition_events.3.desc_hebron: "The shrine is examined alcove by alcove, slowly, and with great care to give no offense to any of the three faiths that keep it. [target_leader.GetName] notes every sealed passage and asks about none of them aloud."
 relic_expedition_events.3.desc_sidon: "House by resettled house through the old Frankish quarter, [target_leader.GetName] knocks and asks after cellars and lofts that nobody has opened since the last Christian tenants fled."
 relic_expedition_events.3.desc_karak: "Lantern in hand, [target_leader.GetName] walks [ShowLocationNameWithNoTooltip('karak')]'s vaults and cisterns, measuring Reynald de Châtillon's hoard as the storytellers describe it against what the walls will actually admit to."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] keeps after the suppressed order's holdings in [ShowLocationNameWithNoTooltip('gaza')], pressing the neighbors on which storerooms the Templars kept locked, and who took the keys afterward."
 relic_expedition_events.3.desc_famagusta: "Trunk by trunk through the exiled mainland families' household chests in [ShowLocationNameWithNoTooltip('famagusta')], cataloging what came out of [ShowLocationNameWithNoTooltip('acre')] and what has been quietly forgotten since."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] reads through the [relic_hunt_loc.GetOwner.GetAdjective] [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle]'s archive in [ShowLocationNameWithNoTooltip('nicosia_cyp')], cross-checking inventories against inheritance rolls for a relic nobody has thought to ask about."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] presses the [relic_hunt_loc.GetOwner.GetAdjective] archivists on [ShowLocationNameWithNoTooltip('rodos')] for the volumes they have not offered, and sets their lists against what the older brothers say was carried out of [ShowLocationNameWithNoTooltip('acre')]."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] keeps at it, turning each small lead over in turn before letting it go."
 relic_expedition_events.3.a: "Keep asking. Someone here knows more than they say."
 relic_expedition_events.3.b: "At last, the trail itself. We have found it."
 relic_expedition_events.3.c: "Hire more retinue while we are here."
 relic_expedition_events.3.d: "Bribe another official. This town keeps better records."
 relic_expedition_events.3.e: "Consult a local scholar before moving on."
 relic_expedition_events.3.f: "A fresh clue points elsewhere. Follow it toward [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "捜索を打ち切り、引き返せ。"
 relic_expedition_events.4.title: "The Trail Has Gone Cold"
 relic_expedition_events.4.desc: "Every lead [target_leader.GetName] has chased has come to nothing. The interpreters have run out of taverns, the bribed officials have nothing further to sell, and the purse grows lighter every week the party sits idle in a foreign country. Word goes home to the crown: pay for more searching, or end it."
 relic_expedition_events.4.a: "必要な資金を送れ。"
 relic_expedition_events.4.b: "Enough. Recall the expedition."
 relic_expedition_events.5.title: "The Escort Is Lost"
 relic_expedition_events.5.desc: "[target_leader.GetName]'s escort is gone, lost in twos and threes to bandits, to fever, and to the quiet desertion of men paid too little for a search with no end in sight. Nobody presses a lord or an abbot for a relic they have no wish to surrender without armed men standing behind the request.\n\nThe hunt ends here."
 relic_expedition_events.5.a: "The mission cannot continue without them."
 relic_expedition_events.6.title: "A Willing Seller"
 relic_expedition_events.6.desc_true_cross: "A merchant in the town, careful about who is within earshot, says he holds a fragment of $relic_true_cross_found$ itself, the wood lost at Hattin, come down through hands he declines to name. He will name a price, though."
 relic_expedition_events.6.desc_holy_lance: "The family of a dead soldier has kept a spearhead since their great-grandfather's service and insists it is $relic_holy_lance_found$, the one uncovered in 1098. They would rather have the money."
 relic_expedition_events.6.desc_holy_shroud: "A merchant unfolds a linen sheet marked with the faint image of a crucified man. He cannot account for where it has been these many centuries, and he wants a very great sum for it regardless."
 relic_expedition_events.6.desc_holy_nail: "鍛冶屋の未亡人が、年月を経て黒ずんだ鉄の釘を持ち出してくる。亡き夫の家系では、代々これを磔刑の釘の一本だと言い伝えてきたという。彼女はそれを売るつもりだ。"
 relic_expedition_events.6.desc_true_cross_fragment: "貧しく、半ば忘れ去られたある修道院が、質素な聖遺物箱に木片を納めている。ラベルには「$relic_true_cross_found$ の一片」とのみ記されている。屋根の修理代さえ賄えるなら、院長は静かにそれを手放すだろう。"
 relic_expedition_events.6.desc_saint_bones: "教区の司祭が、色褪せたラテン語で聖人の名が記された小さな骨箱を差し出す。彼はその代金を教会への寄進と呼ぶつもりだ。"
 relic_expedition_events.6.desc_baptist_head: "この地区の教会は、洗礼者ヨハネの頭部だと称するものを崇敬している。その言い伝えが教区の外に広まったことはないが、聖職者たちは譲渡について話し合う用意がある。"
 relic_expedition_events.6.desc_virgin_milk: "小さな聖堂が、白く粉っぽい残滓の入った封印された小瓶を保管している。何世代にもわたり、聖母マリアの乳として崇められてきたものだ。管理者はそれを、銀の聖遺物箱ごと売るつもりでいる。"
 relic_expedition_events.6.desc_holy_thorn: "さる小貴族の家が、質素な聖遺物箱に納められた一本の棘を所有している。言い伝えによれば、先祖が茨の冠から授かったものだという。彼らは、売却の件がなるべく人目につかぬよう望んでいる。"
 relic_expedition_events.6.desc_holy_chalice: "ある商人は、自分の言うことなど信じてもらえまいと最初から口にしつつ、質素な石の杯を差し出す。彼は、他所でより壮麗なものを名乗る者たちが何と言おうと、これこそ最後の晩餐の真の聖杯だと言い張る。その言い値は、決して控えめではない。"
 relic_expedition_events.6.desc_titulus_crucis: "土地の言い伝えによれば、十字架の木が西方へ渡った際、その上に掲げられていた罪状書きの板だけは残され、隠されたという。この地のある家が、まさにその板を代々受け継いできたと主張しており、売却に応じるつもりだ。"
 relic_expedition_events.6.a: "値切り交渉をする。言い値は高いが、まだ交渉の余地はある。"
 relic_expedition_events.6.b: "言い値のまま支払う。中には、その値段に見合うものもある。"
 relic_expedition_events.6.c: "交渉は我らが随行の威容に語らせることにする。"
 relic_expedition_events.7.title: "取引成立"
 relic_expedition_events.7.desc: "条件は合意され、聖遺物箱は布に包まれた。あとは [target_leader.GetName] が、売り手の話をどこまで信じるかを決めるだけだ。"
 relic_expedition_events.7.a: "代金を支払い、聖遺物を持ち帰る。"
 relic_expedition_events.7.b: "何かが引っかかる。取引から手を引く。"
 relic_expedition_events.8.title: "喜んで手を貸す共犯者"
 relic_expedition_events.8.desc_true_cross: "ある地元名士の屋敷に仕える召使が、何か言いたくない事情で機嫌を損ねているらしく、主人が他の財宝に紛れて「$relic_true_cross_found$」と呼んでいる黒ずんだ木片を布に包んで保管していると漏らした。相応の対価を払えば、それを持ち出す手助けをしてくれるという。"
 relic_expedition_events.8.desc_holy_lance: "一年分の未払いの給金を抱えた守備隊の兵士が、誰の記憶にも記録のない古い槍の穂先が武器庫にあると口を滑らせた。古参の者たちは今も、それを「$relic_holy_lance_found$」と呼んでいるという。彼が中へ手引きしてくれる。"
 relic_expedition_events.8.desc_holy_shroud: "修道院の門番が、近頃院長と激しく対立しているらしく、修道会が上級修道士以外には見せない、人の姿が写ったとされる折り畳まれた布を保管していると話した。彼が扉の閂を外しておいてくれるという。"
 relic_expedition_events.8.desc_holy_nail: "借財にまみれた会計係の書記が、磔刑に使われた釘の一本とされる古い鉄釘が、目録にも載らぬまま脇の金庫に眠っていると白状した。その鍵を持つのは彼ただ一人である。"
 relic_expedition_events.8.desc_true_cross_fragment: "修道誓願に不満を抱く見習い修道士が、自分たちの修道院が $relic_true_cross_found$ の木片を安置している礼拝堂の鎧戸を、開けたままにしておくと申し出た。"
 relic_expedition_events.8.desc_saint_bones: "生涯の労苦に見合わぬ安い報酬しか得てこなかった墓掘り人は、教区が聖人の骨を納めた柩をどこに保管しているか、そして聖具係が午後に昼寝をする時刻まで知っている。"
 relic_expedition_events.8.desc_baptist_head: "昇進の機会を幾度となく見送られてきた若い聖堂参事会員が、上級聖職者たちが洗礼者ヨハネの頭部として崇める聖遺物箱まで案内すると申し出た。"
 relic_expedition_events.8.desc_virgin_milk: "長年の薄給に静かな怒りを募らせてきた聖堂の管理人自身が、自分の選んだ夜に聖遺物箱の錠を開けたままにしておくという。"
 relic_expedition_events.8.desc_holy_thorn: "一度は解雇され、かろうじて復職を許された執事が、一族が荊冠のただ一本の棘を納めた聖遺物箱をどこに保管しているか、正確に知っている。"
 relic_expedition_events.8.desc_holy_chalice: "長年仕えてきた聖堂参事会に対し不満しか持たぬ大聖堂の聖具係が、彼らが内々に「最後の晩餐の真の聖杯」と呼ぶ、何の変哲もない石の杯を持ち出す手助けをすると申し出た。"
 relic_expedition_events.8.desc_titulus_crucis: "半ば信じられぬ古い伝承を代々守ってきた一族が、全く別の頼みを持ちかけてきた――彼らが真の十字架の罪状書きだと確信する品を、売る気のない親族から奪い返す手伝いをしてほしいというのだ。"
 relic_expedition_events.8.a: "口を閉ざさせるには金がかかる。"
 relic_expedition_events.8.d: "金など要らぬ。[target_leader.GetHerHis|U] の魅力だけで、彼らの助力は確保できよう。"
 relic_expedition_events.8.b: "仲介者なしで乗り込め。買収する者が少なければ、それだけ口も軽くなるまい。"
 relic_expedition_events.8.c: "共犯者など要らぬ。我らの従者だけで十分に奪い取れる。"
 relic_expedition_events.9.title: "盗難"
 relic_expedition_events.9.desc: "今のところ計画は順調だ。見張りをしているはずの者は眠っているか、持ち場を離れているか、見て見ぬふりをするよう金を渡されているのだろう。内通者が約束した扉には鍵がかかっていない。[target_leader.GetName] は暗闇の中、異変を知らせる叫び声が上がらぬことを祈りながら待っている。"
 relic_expedition_events.9.a: "遺物は手に入れた。まだ誰にも気づかれていない。"
 relic_expedition_events.9.b: "誰か起きたぞ。叫び声だ……足音もする。撤退だ！"
 relic_expedition_events.10.title: "学者の手引き"
 relic_expedition_events.10.desc_true_cross: "ヒッティーンについて記されたあらゆる年代記を読み漁った旅の学者が、奇しくも内容の一致する三つの記録から、敗走する騎士たちがサラディンの手に渡るのを避けるため$relic_true_cross_found$の一片を埋めたとされる場所を割り出した。学者は書きつけと使い古された地図を差し出し、同行を申し出ている。"
 relic_expedition_events.10.desc_holy_lance: "第1回十字軍に通じた学者が、[GetCharacter('koj_petrus_bartholomaeus').GetName]自身の記録を手がかりに、1098年に$relic_holy_lance_found$が発見された地下室を突き止めたという。学者によれば、その傍らにあった品々はすべて回収されたわけではないらしい。当時、この説を荒唐無稽だと退けた聖職者たちもいたが、その誤りを証明した者はいなかった。"
 relic_expedition_events.10.desc_holy_shroud: "年老いた好古家が、出典の定かでないとある噂を半ば信じている。どの年代記にも記されていない襲撃から逃れた修道士たちが、人の像が浮かぶ聖骸布を地下墓所の壁中に封じたというのだ。老人はほとんど目が見えず、生涯最後の発見を成し遂げたいと願っている。そして、その場所まで自ら我々を案内するという。"
 relic_expedition_events.10.desc_holy_nail: "聖遺物に詳しい学者が、半壊した礼拝堂を指し示した。土地の言い伝えによれば、兵がこの地を通過する前に、追われていた司祭がキリストの磔刑に使われた釘をそこへ埋めたという。"
 relic_expedition_events.10.desc_true_cross_fragment: "修道院の三代にわたる帳簿を隅々まで読み通した学者が、慌ただしく打ち捨てられた庵にたどり着いた。言い伝えによれば、最後の隠修士は命からがら逃げ出す前に、$relic_true_cross_found$の一片を礼拝堂の床下に隠したという。"
 relic_expedition_events.10.desc_saint_bones: "朽ちかけた教区記録を調べていた地元の聖人伝記作者が、古い墓地の外れにある墓標のない墓に目をつけた。敵軍の手に渡るのを避けるため、遺骨が密かに隠された、さほど名の知られていない聖人の墓だという。"
 relic_expedition_events.10.desc_baptist_head: "ある学者が、修道院の文書庫で見つかった断片的な年代記をもとに、洗礼者ヨハネの首を納めたものとして崇敬されていた聖遺物箱はかつての包囲戦のさなかに礼拝堂の床下へ隠されたと主張している。その後、礼拝堂は崩れ落ち、聖遺物箱は瓦礫の下に埋もれたという。"
 relic_expedition_events.10.desc_virgin_milk: "ほかの誰も読もうとしなかった巡礼者の日記をもとに、ある学者が、打ち捨てられた聖堂の封じられた壁龕を指し示した。言い伝えによれば、聖堂を守っていた者たちは、略奪者の手に渡るのを避けるため、そこに聖母の乳を収めた小瓶を隠したという。"
 relic_expedition_events.10.desc_holy_thorn: "ある学者が、すでに絶えた一族の書簡を丹念に読み進め、キリストの茨の冠から取られた一本の棘が、一族の地下墓所に納められていることを突き止めた。その地下墓所は一族が疫病で絶えて以来、封じられている。"
 relic_expedition_events.10.desc_holy_chalice: "この地には、[ShowLocationName('genoa')]や[ShowLocationName('valencia')]で知られる聖杯伝承とは別系統の伝承が残されている。その伝承をたどる学者が、昔あった包囲戦で破壊された礼拝堂の地下に、飾り気のない石の杯が眠っていると考えている。礼拝堂の信徒たちは、ここを掘り返そうと誰かが考えるよりはるか以前に離散していた。"
 relic_expedition_events.10.desc_titulus_crucis: "土地の言い伝えでは、十字架の罪状書きは西方へ運ばれることなく、この地に残されたという。その伝承を信じる学者が、十字軍が最後に退いた際、礼拝堂の壁の中に封じられたのだと考えており、その場所を探す手助けを申し出ている。"
 relic_expedition_events.10.a: "地元の人足を雇おう。人手が多いほど成功の見込みも増す。"
 relic_expedition_events.10.b: "遠征隊の者だけで掘らせよう。余計な詮索をされずに済む。"
 relic_expedition_events.10.c: "よそ者に金を払う必要はない。随行員たちに掘らせればいい。"
 relic_expedition_events.11.title: "発掘"
 relic_expedition_events.11.desc: "地面は固く、掘る手はなかなか進まない。いまの[target_leader.GetName]にできるのは、ただ待ち、あの学者が本当に地図を読めるのか見届けることだけだ。"
 relic_expedition_events.11.a: "何かに当たったぞ。まさに学者の言った場所だ。"
 relic_expedition_events.11.b: "土と瓦礫しかない。もう何も残っていない。"
