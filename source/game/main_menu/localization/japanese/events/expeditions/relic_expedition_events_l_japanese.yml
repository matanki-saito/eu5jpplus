 relic_expedition_events.relic_recovered_virgin_milk_tt: " $relic_virgin_milk_found_1$ を回収し、帰路につく"
 relic_expedition_events.relic_recovered_holy_thorn_tt: "$relic_holy_thorn_found_1$ を回収し、帰路につく"
