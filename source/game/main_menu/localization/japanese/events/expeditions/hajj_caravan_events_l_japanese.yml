l_japanese:
 hajj_caravan_events.1.title: "[ShowLocationNameWithNoTooltip('mecca')]への道"
 hajj_caravan_events.1.desc: "旅行隊が編成され、祈りが捧げられると、[ShowAreaName('hedjaz_area')]への長い旅が始まった。通りには我々を見送るために大勢の人々が集まっており、この一族がいまなお信仰上の義務を果たしていることを物語っていた。[ShowLocationName('mecca')]までは数ヵ月かかり、道中には、準備を怠った者を容赦なく苦しめる砂漠や大海原が待ち受けている。"
 hajj_caravan_events.1.a: "我らが[ROOT.GetCountry.GetGovernment.GetRulerTitle]は、君主として、そして[ROOT.GetCountry.GetReligion.GetGodName]の僕として巡礼に赴く。"
 hajj_caravan_events.1.b: "旅行隊に物資を補給し、旅の護衛隊を編成する。"
 hajj_caravan_events.1.c: "旅行隊に物資を積み込み、護衛を用意し、マフマル（輿の一種）を先頭に掲げて進む。"
 hajj_caravan_events.1.historical_info: "アッバース朝のカリフ、ハールーン・アッ＝ラシードは、786～809年の在位期間中に、バグダードから9回ハッジに赴いた。信仰心の表れとして道程の一部を徒歩で進むことさえあり、その篤い信仰は以後数世紀にわたって、敬虔な統治者たちが見習おうと努める模範となった。"
 hajj_caravan_events.display_wealth: "我らが[ROOT.GetCountry.GetFlavorRank]の富を皆に見せつけるため、マフマルを守る手立てを講じず堂々と運ばせる。"
 hajj_caravan_events.guards_up_tt: "旅行隊の護衛が増える（護衛#G +25#!）"
 hajj_caravan_events.guards_down_15_tt: "旅行隊の護衛が減る（護衛#R -15#!）"
 hajj_caravan_events.guards_down_20_tt: "旅行隊の護衛が減る（護衛#R -20#!）"
 hajj_caravan_events.splendor_up_15_tt: "旅行隊の威容が増す（威容#G +15#!）"
 hajj_caravan_events.splendor_up_20_tt: "旅行隊の威容が増す（威容#G +20#!）"
 hajj_caravan_events.splendor_up_30_tt: "旅行隊の威容が増す（威容#G +30#!）"
 hajj_caravan_events.splendor_down_10_tt: "旅行隊の威容が損なわれる（威容#R -10#!）"
 hajj_caravan_events.splendor_down_15_tt: "旅行隊の威容が損なわれる（威容#R -15#!）"
 hajj_caravan_events.splendor_down_20_tt: "旅行隊の威容が損なわれる（威容#R -20#!）"
 hajj_caravan_events.splendor_down_25_tt: "旅行隊の威容が損なわれる（威容#R -25#!）"
 hajj_caravan_events.weakened_tt: "休息を取らずに進んだせいで、旅行隊はこの先の試練に対処する活力を失う"
 hajj_caravan_events.recovered_tt: "休息を取り水を補給したおかげで、旅行隊は疲労から回復する"
 hajj_caravan_events.mahmal_lost_tt: "嵐でマフマルを失う"
 hajj_caravan_events.mahmal_gained_tt: "旅行隊はマフマルを運ぶようになり、道中で訪れる他国に富を誇示できる。ただし、襲撃や嵐によってマフマルを失うおそれもある"
 hajj_caravan_events.2.title: "[ShowLocationNameWithNoTooltip('mecca')]の玄関口"
 hajj_caravan_events.2.desc: "古くから港として栄えてきた[ShowLocationName('jeddah')]には、海や[ShowGoodsName('incense')]、そして我々より先に海路で到着した1万人もの巡礼者の汗の匂いが漂っている。商人たちは値段を通常の倍に吊り上げて食料を売り、学者たちは儀礼の正しい手順について議論を交わしている。[ShowLocationName('mecca')]まではあと少しで、陸路で3日もかからないが、旅行隊は疲弊して食料も残り少ない。このまま一気に進むこともできるが、ここで1日休息し、物資を補給してから出発することもできる。"
 hajj_caravan_events.2.a: "ここで休息を取り、万全の状態で聖地に入ろう。"
 hajj_caravan_events.2.b: "ここまで来て止まるわけにはいかない。[ShowLocationNameWithNoTooltip('mecca')]に進もう。"
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "646年、第3代正統カリフのウスマーン・イブン・アッファーンは、海路で到着する巡礼者の公式な入港地としてジェッダを指定した。それ以来、ジェッダはハッジ（メッカへの巡礼）のために海路で訪れる巡礼者の玄関口としての役割を担いつづけている。"
 hajj_caravan_events.3.title: "カーバ"
 hajj_caravan_events.3.desc: "目の前にグランド・モスクが広がり、その中心には、黒い布に覆われた太古の神殿カーバがそびえ立っている。カーバの歴史は人々の記憶が及ばないほど古く、白い礼服をまとった何千もの信徒たちが、忍耐強くその周囲を回っている。彼らはアザーン（礼拝への呼びかけ）が響き渡るあらゆる土地から集まってきた人々だ。ここでは、スルタンも羊飼いも同じ衣を身にまとう。旅はついに終わったわけだが、問題は我々がどのような巡礼者となるかだ。ここで何を捧げたかは、今後数十年にわたってイスラム世界の市場やモスク、宮廷で語り継がれることになる。"
 hajj_caravan_events.3.a: "惜しみなく金を捧げ、ここにいる巡礼者が1人たりとも飢えないようにする。"
 hajj_caravan_events.3.b: "聖地を支えるモスクや学者に寄進する。"
 hajj_caravan_events.3.c: "慎ましく儀礼を執りおこなう。これは我々と[ROOT.GetCountry.GetReligion.GetGodName]の問題だ。"
 hajj_caravan_events.3.d: "必要な物は、すべて[ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')]によって用意されている。"
 hajj_caravan_events.3.e: "金に糸目をつけず、旅行隊を金と絹で飾り立てろ。"
 hajj_caravan_events.3.historical_info: "歴史上最も名高い君主によるハッジは、1324年におこなわれたマリ帝国のマンサ・ムーサ1世のメッカ巡礼である。6万人もの随行員を引き連れ、大量の金を携えて立ち寄る先々で惜しみなく施しをした結果、北アフリカから中東にかけて金の価格が10年間にわたって暴落した。エジプトのスルタンの宮廷を訪れた際の様子は、アラブ人の年代記作者たちによって詳しく記録されており、そのとてつもない気前のよさと、それが引き起こした経済的混乱の両方が伝わっている。"
 hajj_caravan_events.4.title: "千のミナレットの街"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')]は広大で歴史ある都市だ。北門をくぐった途端、旅行隊は騒音、そして香辛料、なめし革、焼ける肉が入り混じったにおいに飲み込まれた。諸々の建物の屋根の向こうには、アル・アズハルのモスクがそびえ立っているのが見える。[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]世界でも屈指の学識を誇る学者たちが集まる場所だ。我らが統治者は、ここにしばらく滞在して彼らのもとで学ぶこともできるし、物資の補充のみをおこなって[ShowLocationName('mecca')]への旅を続けることもできる。"
 hajj_caravan_events.4.a: "この機会を逃さず、アル・アズハルの学者たちに師事する。"
 hajj_caravan_events.4.b: "我々の目的地は[ShowLocationNameWithNoTooltip('cairo')]ではなく[ShowLocationNameWithNoTooltip('mecca')]だ。物資を補充して出発する。"
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "歴史家にして学者だったイブン・ハルドゥーンは、1382年にカイロに移り住み、アル・アズハルで教鞭を執るとともに、この都市におけるマーリク学派の首席裁判官を務めた。その名声に惹かれてイスラム世界各地から統治者や学者たちが訪れ、彼の講義を受けたり、助言を求めたりした。"
 hajj_caravan_events.5.title: "歴史ある首都"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')]はかつて世界最大の都市で、[ShowContinentName('atlantic_ocean_continent')]から[ShowSubContinentName('central_asia')]までを支配したカリフ国の首都だった。しかし、モンゴル軍による徹底的な破壊を経て往時の賑わいを失い、市場は小さくなり、学者たちの熱気も薄れている。それでも、ここに眠る聖人たちの霊廟には、いまなお東方の各地から巡礼者が訪れている。我らが統治者も、[ShowAreaName('hedjaz_area')]を目指して南下する前に、ここで聖人たちに敬意を表することができる。"
 hajj_caravan_events.5.a: "聖廟を訪れ、学者たちを訪ねる。"
 hajj_caravan_events.5.b: "敬意を評したら先に進もう。"
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "アッバース朝のカリフ、ハールーン・アッ＝ラシードの妻ズバイダ・ビント・ジャッファルは、巡礼路の過酷さを目の当たりにしたのち、井戸や貯水槽、中間拠点を備えた巡礼路「ダルブ・ズバイダ」の建設に資金を提供した。この巡礼路はバグダード近郊からメッカまで続いていた。"
 hajj_caravan_events.6.title: "ダマスカスへの立ち寄り"
 hajj_caravan_events.6.desc: "果樹園を抜けると、[ShowLocationName('damascus')]の城壁が姿を現した。[ShowLocationName('damascus')]の歴史の長さは現存する都市のなかでも指折りで、その大モスクはイスラム世界全体に名を知られている。モスクのドームの下で祈りを捧げ、中庭に集う法学者たちに学ぶには数日かかるが、我々にはそんな余裕はないかもしれない。一方で旅行隊の水と物資を補給するだけなら、翌朝には出発できる。"
 hajj_caravan_events.6.a: "しばらく滞在し、モスクと法学者たちを訪ねる。"
 hajj_caravan_events.6.b: "動物たちに水を飲ませ、夜明けまでに出発する。"
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "1550年代、オスマン帝国のスルタンであるスレイマン大帝は、モスク、宿泊施設、そして無料食堂からなる複合施設「タキーヤ・アッ＝スライマーニーヤ」をダマスカスに建設させた。これはメッカへ向かうハッジの旅行隊が出発する前に、毎年ダマスカスに集まる何千人もの巡礼者に宿泊場所や食料を提供するためだけに建設された施設だった。"
 hajj_caravan_events.7.title: "ハーッジ"
 hajj_caravan_events.7.desc: "少なくなった物資と、以前とは違う人間になった巡礼者たちとともに、旅行隊は故郷へ帰還した。帰還の報せはラクダよりも一足早く届いていた。カーバの前に立ち、生還を果たした統治者を迎えようと人々が集まっている。この日より、我らが統治者は「ハーッジ」という称号を名乗ることになる。誰かに授けられたわけではなく、自らのおこないによって得た生涯の称号だ。"
 hajj_caravan_events.7.a: "知らしめよ。[ROOT.GetCountry.GetReligion.GetGodName]の恩寵により、我は[ShowLocationNameWithNoTooltip('mecca')]への巡礼を果たして帰還した。"
 hajj_caravan_events.7.historical_info: "1496年から1497年にかけ、ソンガイ帝国のアスキア・ムハンマド・トゥレは、数百人の随行員と、道中で施しとして配るための大量の金を携え、ハッジをおこなった。カイロでは、カリフ位を主張するアッバース朝の人物から「スーダンのカリフ」の称号を授けられた。巡礼を通じ、西アフリカのイスラム世界における権威を確立した彼は、「アル＝ハッジ」として故国に帰還した。"
 hajj_caravan_events.8.title: "[ShowLocationNameWithNoTooltip('mecca')]への道中での死去"
 hajj_caravan_events.8.desc: "我らが統治者が巡礼の道中で亡くなったとの報せが旅行隊に届いた。故郷から遠く離れているが、カーバまではまだかなり距離がある場所でのことだったそうだ。一行を率いていた君主を失った旅行隊は、もはやこれまでどおりに旅を続けることができない。一行は瓦解し、引き返す巡礼者もいれば、巡礼をやり切るために単独で旅を続ける者もいた。"
 hajj_caravan_events.8.a: "あの御方に[ROOT.GetCountry.GetReligion.GetGodName]の慈悲のあらんことを。"
 hajj_caravan_events.hire_escorts: "護衛を増やして先に進む。"
 hajj_caravan_events.adorn: "旅行隊を旗と絹で飾ったうえで待つ。"
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.9.title: "道中の襲撃者"
 hajj_caravan_events.9.desc: "陽炎の向こうから槍を掲げた砂漠の騎兵たちが姿を現し、旅行隊の周囲を駆け回りはじめた。我々が砂漠を横断する様子を監視し、この隊は襲う価値があると判断したのだ。護衛たちは密集隊形を取っているが、遮るもののない砂漠での戦いで勝てるとは限らない。"
 hajj_caravan_events.9.a: "金を払って済ませよう。銀は血より安い。"
 hajj_caravan_events.9.b: "護衛隊に払った分働いてもらおう。"
 hajj_caravan_events.9.b.chance_tt: "護衛隊は襲撃者を撃退できない可能性がある。その場合、[prestige|e]の代わりに護衛と威容が減少する"
 hajj_caravan_events.9.c: "我々は[ROOT.GetCountry.GetReligion.GetGodName]の加護のもと[ShowLocationNameWithNoTooltip('mecca')]に向かっている巡礼者だ。"
 hajj_caravan_events.9.c.chance_tt: "訴えでは襲撃者を諦めさせられない可能性がある。その場合、[prestige|e]と[legitimacy|e]の代わりに護衛と威容が減少する"
 hajj_caravan_events.10.title: "枯れた井戸"
 hajj_caravan_events.10.desc: "当てにしていた井戸は干上がっていた。数日前に通りかかった別の旅行隊が、最後の一滴まで汲み尽くしてしまったらしく、底にはひび割れた泥が残るばかりだ。ラクダの両脇に吊るした水袋はすでに軽くなっており、彼らは鳴き声をあげて喉の渇きを訴えている。空高く昇りつつある太陽は容赦なく照りつけ、案内人たちは次に水を十分に確保できる場所までの距離について、不安をつぶやきはじめた。"
 hajj_caravan_events.10.a: "死ぬよりは遅れる方がましだ。遠くの井戸に向かおう。"
 hajj_caravan_events.10.b: "次の補給地点で間に合う。前進するぞ。"
 hajj_caravan_events.11.title: "シムーン"
 hajj_caravan_events.11.desc: "地平線は錆びたような色になり、風は勢いを増して叫び声のような音を立てている。砂の壁が隊列に押し寄せ、道も空も、前を行く騎手の姿さえもあっという間に見えなくなった。残ったのは、肌を刺すような暗闇だけだ。"
 hajj_caravan_events.11.a: "荷物を下ろしてベールで顔を覆え。砂嵐が過ぎるのを待つ。"
 hajj_caravan_events.11.b: "隊列を縄で繋ぎ、先に進むぞ。"
 hajj_caravan_events.12.title: "旅行隊を襲う熱病"
 hajj_caravan_events.12.desc: "最初はほんの数人だったが、翌朝にはすべての天幕に病が広がっていた。屈強な者でさえ、たった数日で衰弱させる熱病だ。密集して旅をする巡礼者たちには、感染の拡大を避ける術がなかった。"
 hajj_caravan_events.12.a: "ここで止まれ。誰一人として巡礼者を見捨てるものか。"
 hajj_caravan_events.12.b: "病人のために巡礼を遅らせるわけにはいかない。"
 hajj_caravan_events.13.title: "[toll_owner.GetGovernment.GetRulerTitle]の要求"
 hajj_caravan_events.13.desc: "この先の道は地元の領主の土地を通っており、配下の騎兵たちが道を塞ぐように馬を並べ、槍を地面につけたまま悠然としている。笑みを浮かべて進み出た領主の使者が、水や道の使用だけでなく、足元の砂を踏むのにも金がかかると言ってきた。金を払うまで、一歩たりとも進ませるつもりはないそうだ。後ろでは巡礼者たちが暑さに耐えながら待ちつづけており、自分たちの君主の器を見定めようとしている。"
 hajj_caravan_events.13.a: "金を払って終わりにしよう。"
 hajj_caravan_events.13.b: "金を払う理由はない。奴の井戸は迂回するぞ。"
 hajj_caravan_events.13.c: "[toll_owner.GetGovernment.GetRulerTitle]に隊商を見せ、金の件を考え直させる。"
 hajj_caravan_events.14.title: "オアシスへの立ち寄り"
 hajj_caravan_events.14.desc: "前方の砂漠にヤシがそびえ、その下に泉が湧いている。泉の周りには人々が住んでおり、ナツメヤシの実と冷たい水を携えて巡礼者たちを出迎えてくれた。聖地を目指す者たちに休息の場を提供することは信仰への献身の一種で、見返りを求められることはない。"
 hajj_caravan_events.14.a: "隊を休ませ、限界まで水を補給してから出発しよう。"
 hajj_caravan_events.14.b: "オアシスの貧しき者たちに、我々の食料を施すのだ。"
 hajj_caravan_events.14.c: "礼を伝えたら、そのまま旅を続けるぞ。"
 hajj_caravan_events.15.title: "旅の学者たち"
 hajj_caravan_events.15.desc: "同じ聖地を目指す旅の学者の一団が旅行団に加わった。彼らの鞍袋には書物が詰まっている。夜になると学者たちは焚き火を囲み、イスラム法や聖典について遅くまで熱弁を振るった。"
 hajj_caravan_events.15.a: "彼らに混ざって座り、耳を傾ける。"
 hajj_caravan_events.15.b: "主張には主張で応じる。"
 hajj_caravan_events.16.title: "過ぎ去った巡礼の期間"
 hajj_caravan_events.16.desc: "到着が遅すぎた。今年の巡礼期間が終わり、アラファトでの立礼の機会も去ってしまった。立礼は、その年の巡礼者たちが「慈悲の山」の麓に広がる平原に集い、正午から日没まで祈りを捧げ、赦しを請う儀式である。預言者によれば、ハッジはこの日の午後におこなう儀式にほかならず、これを逃せば、後からどのような儀式をおこなっても巡礼を完遂できない。隊は解散して故郷へ帰るほかなく、翌年、最初から巡礼の旅をやり直さなければならない。"
 hajj_caravan_events.16.a: "時間をかけすぎた。巡礼をやり直さなくては。"
 hajj_caravan_events.17.title: "暴風"
 hajj_caravan_events.17.desc: "空が暗くなり、海はうねり灰色の山のように波立つ。船は激しく揺れ、索具が悲鳴を上げるように軋んでいる。まずい形で波を受ければ、船体に大穴が開くか、乗っている者全員を道連れに船が海中に引きずり込まれるかもしれない。"
 hajj_caravan_events.17.a: "耐え抜くのだ。この船は頑丈に作ってある。"
 hajj_caravan_events.17.b: "風を使って嵐から抜け出せ。"
 hajj_caravan_events.18.title: "凪"
 hajj_caravan_events.18.desc: "風が完全に止んだ。帆は力なく垂れ下がり、海面は打ち延ばされた金属のように平らだ。容赦なく照りつける太陽のもとで、船は身動きひとつ取れない。無風の日が続くほど水の蓄えは減り、皆の苛立ちは募っていく。"
 hajj_caravan_events.18.a: "待とう。風はいつか戻ってくる。"
 hajj_caravan_events.18.b: "ボートを出せ。座して死を待つつもりはない。"
 hajj_caravan_events.19.title: "船内に蔓延する熱病"
 hajj_caravan_events.19.desc: "甲板の下のよどんだ空気と悪臭を通じ、病がじわじわと広がりはじめた。数日のうちに病人が健康な者よりも多くなった。それでも船を動かしつづけなければならないが、日を追うごとに働ける者は減っている。"
 hajj_caravan_events.19.a: "海岸に向かえ。船員たちには清潔な水が必要だ。"
 hajj_caravan_events.19.b: "船員たちが持ちこたえると信じ、進路を維持せよ。"
 hajj_caravan_events.20.title: "海賊船"
 hajj_caravan_events.20.desc: "船体が低く高速な1隻のガレー船が、後ろにもう2隻を従え、船団目がけて突き進んできた。太陽に照らされ、オールがきらめいている。旗を掲げておらず、呼びかけもない。ただ舷側に刃を輝かせ、次第に早まるドラムの音とともに近づいてくる。海賊船だ。我々巡礼者を獲物と見定めたらしい。見張りたちが大声で警戒を呼びかけるなか、甲板の下では信徒たちが荷物を抱きしめて、必死に祈っている。"
 hajj_caravan_events.20.a: "金を渡し、この場を離れよう。"
 hajj_caravan_events.20.b: "甲板を片付けろ。奴らを突破するぞ。"
 hajj_caravan_events.20.b.chance_tt: "護衛隊は海賊を防げない可能性がある。その場合、[prestige|e]の代わりに護衛と威容が減少する"
 hajj_caravan_events.21.title: "暗礁"
 hajj_caravan_events.21.desc: "船全体に何かが擦れるような振動が走り、甲板が下から突き上げられた。海図に載っていない暗礁だ。水面下でサンゴの牙が船材を引き裂いている。海水はすでに音を立てて船倉に流れ込みはじめており、船員たちがポンプへ飛びついた。船に穴が開き、沈みかけてはいるが、まだ失われたわけではない。そして最も近い陸地は、地平線の彼方にかすかな緑の影として見えている。"
 hajj_caravan_events.21.a: "船団を海岸に乗り上げさせ、きちんと修理しろ。"
 hajj_caravan_events.21.b: "船の修理に1隊だけ割り当て、残りの船は航海を続けるぞ。"
 hajj_caravan_events.22.title: "海上の商人"
 hajj_caravan_events.22.desc: "海上で商船が呼びかけてきた。甲板には遠方の港から運ばれてきた絹織物や上質な布地が山積みにされている。向こうの船長は商人らしい値段で取引に応じると言っているが、その前に、商人らしくじっくりと値段交渉をするつもりだ。"
 hajj_caravan_events.22.a: "彼らが持っている最高の布地を買う。"
 hajj_caravan_events.22.b: "交渉している時間はない。手を振って先に行かせよう。"
