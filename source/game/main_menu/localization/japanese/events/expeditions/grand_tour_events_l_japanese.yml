 grand_tour_events.seek_castle_audience: "城での[court_host.GetNameWithNoTooltip]との謁見を求める。"
 grand_tour_events.attend_university_lectures: "大学で講義を受ける。"
 grand_tour_events.prodigy_knowledge: "[target_leader.GetNameWithNoTooltip]を学問の天才として売り込む。"
 grand_tour_events.prodigy_connections: "[target_leader.GetNameWithNoTooltip]を人脈作りの天才として売り込む。"
 grand_tour_events.prodigy_experience: "[target_leader.GetNameWithNoTooltip]を経験の天才として売り込む。"
 grand_tour_events.1.title: "グランドツアー"
 grand_tour_events.1.desc: "南方へ向かうため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の者たちが集められ、荷物がまとめられ、護衛も編成された。目指すは[ShowRegionName('italy_region')]。古代遺跡、[ShowInstitutionName('renaissance')]を経た知識、そして北方の国々が若輩に見えるほどの政治術を有する宮廷が待っている。何であれ、我らの[ROOT.GetCountry.GetGovernment.GetHeirTitle]がそこで何を学ぶにせよ、それがこの国の次世代を形作ることになる。唯一の問題は、[target_leader.GetHerHim]にどんな教育を受けさせるかだ。"
 grand_tour_events.1.a: "かの地の宮廷では、書物では学べないことが身に付けられる。"
 grand_tour_events.1.party: "出立前の最後の夜は、盛大な宴を開こう。"
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName]は、地理的不利をものともせず、泥の上に計画的に建てられた[target_location.GetRank.GetName]である。[target_location.GetName]は交易を基盤とし、[ShowContinentName('europe')]のどの王朝よりも長い歴史を持つ、商人の諸家で構成された評議会によって統治されている。"
 grand_tour_events.2.desc.ducal_palace: "一方、豪華絢爛なるドゥカーレ宮殿は、誰の目にも明らかな優雅さと贅沢さを見せつけるように、干潟の上で桃色にきらめいている。"
 grand_tour_events.2.desc.heir_arrival: "我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、[ShowContinentNameWithNoTooltip('europe')]屈指の国際都市である[target_location.GetRank.GetNameWithNoTooltip]に到着した。ここの市場では地中海のあらゆる言語が飛び交い、しかるべき金額さえ払えばどんな種類の情報でも手に入れられる。"
 grand_tour_events.2.title: "セレニッシマ（晴朗きわまる所）たる[target_location.GetNameWithNoTooltip]"
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$東地区にある広大な[ShowBuildingTypeName('venetian_arsenal')]は、軍艦の竜骨を据えてから完成した船を進水させるまでの作業を、わずか1日で済ますことができる。$grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$東地区に立ち並ぶ一般的な造船所では、[ShowContinentNameWithNoTooltip('europe')]の港の例に漏れず、ゆっくりと商船や軍用ガレー船を建造している。$grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.knowledge: "[ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]で海軍の造船技術を学ぶ。"
 grand_tour_events.2.experience: "[target_location.GetNameWithNoTooltip]の軍用ガレー船が建造されている造船所を視察する。"
 grand_tour_events.2.connections: "[court_host.GetNameWithNoTooltip]が主催する歓迎会に出席する。"
 grand_tour_events.2.party: "台帳のことは忘れ、運河の酔っ払いたちに混ざって一夜を過ごす。"
 grand_tour_events.2.historical_info: "1645年の昇天祭週間中、イングランドの紳士ジョン・エヴリンは、フランスとイタリアをめぐる長期旅行の途中でヴェネツィアの大衆向け劇場の1つを訪れ、オペラ『リディアのヘラクレス』を観劇した。彼は日記のなかで、舞台の背景が13回も切り替わったことに驚嘆し、ソプラノ歌手アンナ・レンツィを特に高く評価したが、その一方でとあるカストラート歌手をアンナ・レンツィよりもさらに優れていると評し、ジェノヴァ出身のバス歌手についても「比類なき存在」と表現した。遠近法を駆使した舞台装置や宙を飛ぶ仕掛けにより、この壮観な舞台は「午前2時まで我々の目と耳を楽しませつづけた」と書かれている。イヴリンは翌春にヴェネツィアを発ったが、そのトランクには書物や版画、そしてこの街の名物であるテリアカが1瓶分詰め込まれていた。"
 grand_tour_events.3.title: "[ShowInstitutionNameWithNoTooltip('renaissance')]の[target_location.GetRank.GetNameWithNoTooltip]、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.3.desc: "[target_location.GetName]は、その名声から想像していたより小さく、そして奇妙な場所だった。この[target_location.GetRank.GetName]には新しい思想が満ちている。この状況は哲学者たちいわく「古代の再生」、商人たちいわく「よい商売」、そして画家たちいわく「漆喰を照らす光さながらだ」だそうだ。我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]が到着すると、現地の宮廷から、[target_leader.GetSheHe]の旅の疲れがひどくなければ今晩にも国外からの客人を歓迎したいとの申し出があった。\n\nまたそれとは別に、西方キリスト教世界でも屈指の見事な[ShowCultureName('greek_culture')]写本の数々を所蔵する修道院図書館からも招待が届いている。"
 grand_tour_events.3.knowledge: "修道院の学者たちへの紹介を頼む。"
 grand_tour_events.3.experience: "[ShowGoodsNameWithNoTooltip('wool')]工房と、ポンテ・ヴェッキオの金細工師たちを視察する。"
 grand_tour_events.3.connections: "[court_host.GetNameWithNoTooltip]の宮廷で、パトロンとなるうえでの心得を学ぶ。"
 grand_tour_events.3.party: "写本のことは忘れ、[target_location.GetNameWithNoTooltip]で賭け事に興じる。"
 grand_tour_events.3.historical_info: "1764年の秋、病を抱えるスコットランドの小説家トバイアス・スモレットはウフィツィ美術館を訪れ、『メディチ家のヴィーナス』の前に立ち、ほかのグランドツーリストが例外なく褒め称えていたこの作品を、「このヴィーナスの顔立ちに美があるとは到底思えない。姿勢もぎこちなく、ヴィーナスらしくない」と評した。この辛辣な批評は、のちにローレンス・スターンによって後世まで伝わる形で取り上げられた。彼は自身の作品にヨリックという架空の人物を登場させ、ローマのパンテオン前での「スメルファンガス」なる人物との対決のなかで、「かの女神に難癖をつけ、彼女にはなんの非もないにもかかわらず、ありふれた娼婦よりもひどい扱いをした」と非難させたのだ。大理石のヴィーナスをめぐるこの論争は、2人がこの世を去ってもなお語り継がれた。"
 grand_tour_events.4.title: "永遠の都市、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.4.desc: "[target_location.GetName]は2つの時代に同時に存在している。フォルムは冬草に覆われ、柱は家畜の放牧地のただなかに奇妙な角度で立っている。また資材である大理石はここ1000年のあいだに、それが必要になったさまざまな建築業者によって持ち去られていた。そしてこのすべてを見下ろすように、現在の[target_location.GetRank.GetName]の中心にそびえ立っているのが、全キリスト教世界の中心となるあの教会である。\n\n[target_leader.GetName]は遺跡のなかで過ごすことも、いまを生きることもできる。教皇庁は古く、儀礼を重んじ、[ShowContinentName('europe')]のあらゆる[ShowReligionAdjective('catholic')]国家の君主とつながりを持っている。"
 grand_tour_events.4.knowledge: "バチカン図書館の写本を調べ、人文主義者たちの意見を求める。"
 grand_tour_events.4.experience: "古代遺跡を散策し、建物の大きさを測る。"
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.party: "遺跡を離れ、[target_location.GetNameWithNoTooltip]の酒場で一晩過ごす。"
 grand_tour_events.4.historical_info: "1764年10月15日、イタリアでのグランドツアーを終えようとしていたイングランドの紳士エドワード・ギボンは、カンピドリオの丘の遺跡で物思いにふけっていた。その傍らでは、裸足の修道士たちが、彼が古代のユピテル神殿だと考えていた場所で夕の祈りを唱えていた。ギボンはのちに、崩れた柱と次第に消えていく夕の聖歌に包まれたその場所で「この都市の衰退と滅亡について書こうと初めて思いついた」と、回想録に記している。ローマでの一夜で得た着想は、その後イングランドに戻って20年にわたり研究を重ねるなかで、『ローマ帝国衰亡史』へと結実した。"
 grand_tour_events.5.title: "[target_country.GetLongNameWithNoTooltip]の[target_location.GetNameWithNoTooltip]"
 grand_tour_events.5.desc: "[target_location.GetName]はこの旅の最南端にある巡遊地で、偉大なる[ShowCultureGroupName('italian_group')]の諸国家のなかで最も古い歴史を持っている。ウェスウィウス山（俗に言うヴェスヴィオ山）の影に広がる[target_location.GetRank.GetName]には100万人もの人々が暮らしている。この土地は[ShowCultureName('greek_culture')]、[ShowCultureName('roman_culture')]、 [ShowCultureName('norman')]、そしてさらに後代の勢力といった具合に、幾度も支配者が変わってきた。このため、どこを見るべきか知っていれば、それぞれの征服の痕跡を建築様式のなかに見出すことができる。[target_country.GetGovernment.GetAdjective]の[target_country.GetGovernment.GetCourtTitle]は、北[ShowContinentName('europe')]の宮廷のそれが間に合わせに思えるほどの式典で来訪者を歓迎する。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は[ShowLocationName('venice')]、[ShowLocationName('florence')]、そして[ShowLocationName('rome')]を見てきたが、ここが最後の学びの場だ。"
 grand_tour_events.5.knowledge: "最後の数週間を図書館と遺跡で過ごす。"
 grand_tour_events.5.experience: "ヘルクラネウムを発掘している人々に加わる。"
 grand_tour_events.5.connections: "最後の数週間を[court_host.GetNameWithNoTooltip]の宮廷で過ごす。"
 grand_tour_events.5.party: "学びは切り上げ、[target_location.GetNameWithNoTooltip]の酒場で最後の夜を過ごす。"
 grand_tour_events.5.historical_info: "1786年1月、ヘスター・ピオッツィは「ウェスウィウスのキュクロプス」と呼ばれた案内人バルトロメオと自身をロープで結び、ウェスウィウス山を登り、途中にある隠者の庵で休憩を取った。その隠者はフランス人で、突然彼女のことを思い出してこう言った。「以前どこかでお会いしませんでしたかな、マダム？ ああ、間違いなく会ったことがある。ロンドンで私が理髪師をしていたころに、あなたの髪を整えたこともある」一行のなかにいた4歳の少年がすでに火口の縁まで到達していたことを知ると、ピオッツィは引き返すのが恥ずかしくなり、そのまま登りつづけた。そして自分の目で煙を吐く火口を確かめ、この一連の出来事を、のちに出版された旅行書簡に記した。"
 grand_tour_events.6.title: "古代のアレーナ（円形闘技場）の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.6.desc: "[target_location.GetName]は川がうねる場所にあり、その[target_location.GetRank.GetName]には、[ShowRegionName('italy_region')]のどの宮廷よりも歴史の長い円形闘技場がそびえ立っている。この古代ローマのアレーナはいまなおほぼ完全な姿で残っており、石造りの観客席は周囲の屋根より高い位置にある。ここでは市場が開かれるほか、特別な祝祭日には、本来の用途に似た競技性のある催しもおこなわれている。\n\nこの[target_location.GetRank.GetName]には遺跡だけでなく講堂や、訪れた[ROOT.GetCountry.GetGovernment.GetHeirTitle]をぜひ迎えたがっている宮廷もある。"
 grand_tour_events.6.knowledge: "古代ローマの遺跡と、アレーナの古代の工学技術について学ぶ。"
 grand_tour_events.6.experience: "[ShowGoodsNameWithNoTooltip('marble')]の採石場とアディジェ川沿いの河川交易を視察する。"
 grand_tour_events.6.connections: "[court_host.GetNameWithNoTooltip]と、[target_location.GetRank.GetNameWithNoTooltip]の有力諸家を訪問する。"
 grand_tour_events.6.party: "円形闘技場には行かず、その下の酒場で一晩過ごす。"
 grand_tour_events.6.historical_info: "1785年4月、ヴェローナに到着したヘスター・ピオッツィは、ローマ時代の円形闘技場が実に良好な状態で残っているのを目にした。そこで胸が「はっきりと高鳴る」のを感じた彼女は、のちにこの街を「これまで暮らしたなかで最も華やかな街」と評した。フィルハーモニック・アカデミーの遺物を案内したガイドは、ピオッツィの母国であるイングランドが誇るアランデルの大理石美術コレクションは、石炭の煙によってとうの昔に汚されてしまっていると断言した。しかし彼女はのちに、その言葉が「ヴェローナ・イラストラータ」というガイドブックの一節の受け売りであることに気付き、出版した旅行記のなかでこの嘘を「不誠実で、実にばかげた偏見」だと断じた。"
 grand_tour_events.7.title: "理想都市、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.7.desc: "[target_location.GetName]の街並みは偶然こうなったようには見えず、実際偶然の産物ではない。幅広でまっすぐな大通りに貫かれているという、中世の街が決して偶然形作ることのないこの構造は、住むことだけでなく景観まで意識して作られたのだ。公爵の劇場、印刷所、そして宮廷に集う詩人たちは皆、この小さな[target_location.GetRank.GetName]を未来都市にするという野望の協力者である。\n\nまた、宮廷に赴けば、国政と同じぐらい詩にも熱心であることがわかる。"
 grand_tour_events.7.knowledge: "公爵図書館に所蔵されている騎士道物語を読む。"
 grand_tour_events.7.experience: "公爵の武器庫と、[target_location.GetRank.GetNameWithNoTooltip]の運河の水門を視察する。"
 grand_tour_events.7.connections: "[court_host.GetNameWithNoTooltip]の宮廷でおこなわれる詩文の催しに参加する。"
 grand_tour_events.7.party: "公爵家の詩のことは忘れ、もっと賑やかな夜を楽しむ。"
 grand_tour_events.7.historical_info: "1817年4月、イタリアを巡るグランドツアーに出ていたバイロン卿は、フェラーラの聖アンナ病院を訪れ、狭い独房を見学した。1580年代、精神に異常をきたした詩人トルクァート・タッソが、エステ家のアルフォンソ2世によって幽閉されていたと伝えられる場所である。バイロンは近くにあるアリオストのモニュメントより、この史跡の方に強く心を動かされ、翌日には詩人の絶望を詠う劇的独白詩『タッソーの嘆き』を書き上げた。この訪問により、ここはロマン主義時代のグランドツアーを代表する“巡礼地”の1つとなり、旅行者たちの脳裏に、フェラーラにおけるエステ家宮廷の在りし日の姿を刻み込むことになった。"
 grand_tour_events.8.title: "学問都市、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.8.desc: "[target_location.GetName]における法学と論争術の教育の歴史は、キリスト教世界有数の長さを誇っており、[target_location.GetRank.GetName]の至る所で学問の伝統を垣間見ることができる。たとえば、ポルチコ（屋根付きの歩道）には各国から集まった学生が列をなしており、講堂は周囲の大半の教会よりも古い。法学者たちが書き残した著作は、ここを訪れた[ROOT.GetCountry.GetGovernment.GetHeirTitle]が一生かけても読みつくせないだろう。\n\nまた、法学より政治に関心があるのなら必見の宮廷もある。"
 grand_tour_events.8.knowledge: "大学で民法の講義を受ける。"
 grand_tour_events.8.experience: "Tour the silk mills that made [target_location.GetNameWithNoTooltip]'s thread famous."
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.party: "講堂には行かず、学生たちに混ざってワインを味わう。"
 grand_tour_events.8.historical_info: "1739年、グランドツアーでイタリアをめぐっていたフランスの司法官シャルル・ド・ブロスは、ボローニャにあるラウラ・バッシの邸宅で一夜を過ごした。当時のバッシはすでにヨーロッパ初の女性大学教授になっており、彼女の邸宅には地元の学者たちが集まり、当時は新たな研究分野だった電気について議論を交わしていた。ド・ブロスはのちに、集まった人々を前に磁気や「帯電した物体が持つ風変わりな引力」について論じるため、学生時代に習ったラテン語を久しぶりに使わなければならなかった、と振り返っている。彼はこの夜の出来事を『レットル・ファミリエール・エクリット・ディタリ』に記し、バッシのサロンはその後、ボローニャを訪れるグランドツーリストたちが特によく足を運ぶ場所のひとつとなった。"
 grand_tour_events.9.title: "パーリオの街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.9.desc: "3つの尾根にまたがる[target_location.GetName]の中心には、貝殻のような形をした広場があり、そこへ向かって上るどの通りからも、縞模様のドゥオーモ（教会堂）を望むことができる。この[target_location.GetRank.GetName]は、[ShowGoodsName('wool')]と銀行業によって豊かになったが、やがて[ShowLocationName('florence')]に追い越された。このことは遺恨となっており、両者の対抗意識は、宮廷で交わされるあらゆる会話にいまも影響を与えている。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、旗があちこちに掲げられ、人が広場を埋め尽くす、年に二度の競馬の催しを目にできる時期に到着した。"
 grand_tour_events.9.knowledge: "大学で教会法の講義を受ける。"
 grand_tour_events.9.experience: "フレスコ画と、[target_location.GetRank.GetNameWithNoTooltip]の有名な銀行帳簿について学ぶ。"
 grand_tour_events.9.connections: "[court_host.GetNameWithNoTooltip]のロッジア（屋根のある半屋外空間）から競馬を見る。"
 grand_tour_events.9.party: "フレスコ画のことは忘れ、カンポ広場の賭け台へ行く。"
 grand_tour_events.9.historical_info: "1764年の秋、小説家トバイアス・スモレットはフィレンツェからローマへ向かう途中、シエナで一夜を過ごした。彼はこの時のことを、のちに出版した『フランス・イタリア紀行』のなかで「便所のような悪臭がする、随分と酷い家に泊まらされた」「夕食も散々だった」と不平を漏らしている。また街については「大きく、よく整備されている」と認め、シエナの人々は「自分たちの礼儀正しさと訛りの少なさを誇りに思っている」と記した。後者については、外国人旅行者が正しいイタリア語の発音を学ぶためだけにシエナに滞在するほどだった。スモレットのこの記述は、グランドツアーでのトスカーナのもてなしに関し英語で記された不満のなかでも、特に有名な1つとなった。"
 grand_tour_events.10.title: "斜塔の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.10.desc: "[target_location.GetName]は、まっすぐ立つことのできない鐘楼を建ててしまったが、取り壊さずに建設を続け、その傾きを恥ではなくむしろ誇りとしている。この[target_location.GetRank.GetName]はかつて[ShowLocationName('genoa')]や[ShowLocationName('venice')]と肩を並べる一大海洋勢力だった。いまやガレー船は姿を消したが、それでも大学と聖堂広場は残っている。\n\n[target_location.GetNameWithNoTooltip]を訪問中の我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、ここについて学ぶことも、かつて重要だった港を散策することもできる。"
 grand_tour_events.10.knowledge: "聖堂広場にある大学で講義を受ける。"
 grand_tour_events.10.experience: "アルノ川沿いにある古い造船所と革職人たちを訪れる。"
 grand_tour_events.10.connections: "[court_host.GetNameWithNoTooltip]に謁見する。"
 grand_tour_events.10.party: "講義を欠席し、港の酒場で一夜を過ごす。"
 grand_tour_events.10.historical_info: "1821年末、パーシー・シェリーとメアリー・シェリーはピサに移り住んだ。2人はバイロン卿にも転居を勧め、彼はルンガルノのランフランキ邸に住むことになった。またエドワード・ウィリアムズとジェーン・ウィリアムズ、さらにあとにはエドワード・トレローニーもピサに移住し、のちに「ピサ・サークル」と呼ばれるグループを形成した。バイロンは馬や犬、猿まで引き連れて到着し、サークルはその冬、文芸誌『ザ・リベラル』の構想を練って過ごした。翌年の夏になってようやくリー・ハントがイタリアに到着したが、そのわずか数日後の7月、パーシー・シェリーはトスカーナ沖で溺死した。シェリー夫妻がピサに築いたサークルは数ヵ月のうちに散り散りとなったが、それでもこの街はロマン主義において、特に多くの逸話に彩られた旅の中継地点となった。"
 grand_tour_events.11.title: "聖フランチェスコの街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.11.desc: "[target_location.GetName]は緑の丘の斜面に広がり、その中心には、この地に生まれた男の遺骨を納めるために建てられた大聖堂がある。清貧を貫いたこの修道士の活動により、この[target_location.GetRank.GetName]は西方世界有数の巡礼地となった。大聖堂内の壁を飾るフレスコ画は、巡礼者だけでなく、同じぐらいの数の画家たちも引き寄せている。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、フレスコ画を見て過ごすことも、かの聖人の修道会の戒律をいまなお守る修道士たちと過ごすこともできる。"
 grand_tour_events.11.knowledge: "フレスコ画と、かの聖人の人生を学ぶ。"
 grand_tour_events.11.experience: "信仰に関する記念品や記章を作っている工房を視察する。"
 grand_tour_events.11.connections: "[court_host.GetNameWithNoTooltip]や街の役人たちと面会する。"
 grand_tour_events.11.party: "修道士たちのことは忘れ、街に繰り出しもっと賑やかな夜を楽しむ。"
 grand_tour_events.11.historical_info: "1786年10月26日の夕方、ヨハン・ヴォルフガング・フォン・ゲーテはアッシジに到着した。彼が『イタリア紀行』に記したところによれば、聖フランチェスコの遺骸を納める「バベルの塔のように幾重にも積み重なった巨大な教会群」にあからさまな嫌悪を示し、この巡礼地には向かわなかったという。代わりに訪れたのが旧市街の広場にあるローマ時代のミネルヴァ神殿で、それを「それまで目にしたなかで初めての、完璧な古代の記念物」と評した。アッシジで最も有名な聖地は拒絶し、異教の神殿を好んだゲーテのこの態度は、今日まで伝わっているグランドツアー時代の個人的評価のなかでも、特に驚きをもって受け止められている。"
 grand_tour_events.12.title: "かつてのエトルリアの都市、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.12.desc: "[target_location.GetName]は丘の高台にあり、ローマが勢力を得るはるか前にエトルリア人が築いた城壁に囲まれており、この[target_location.GetRank.GetName]の人々はいまも、城壁の門を特に気にもせず毎日通り抜けている。近頃は、この地の画家たちが[ShowRegionName('italy_region')]各地で名を知られるようになり、大学の講堂が大勢の学生で賑わっている。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、気の向くままに古い城壁を調べることも、新しい絵画を学ぶこともできる。"
 grand_tour_events.12.knowledge: "大学で学び、古いエトルリアの城壁を散策する。"
 grand_tour_events.12.experience: "マヨリカ焼きで有名な陶工の工房を訪れる。"
 grand_tour_events.12.connections: "[court_host.GetNameWithNoTooltip]の宮廷で人脈を広げる。"
 grand_tour_events.12.party: "古い壁のことは忘れ、学生たちに混ざって酒場で一夜を過ごす。"
 grand_tour_events.12.historical_info: "1765年初頭、小説家トバイアス・スモレットはローマからフィレンツェへ戻る道中、ペルージャに続く急な坂を馬車で登っていた。すると疲れ切った馬たちが馬車の重みに耐えきれず、後ろ向きに、馬車ごと崖の縁へと引きずられはじめた。だがそこへ通りかかった人物が、間一髪で車輪の1つの後ろに大きな石をかませ、滑落を止めた。スモレット自身の言葉を借りれば、一行は「地面に叩きつけられ、粉々になってしまう」ところを救われたのである。その日は替え馬の都合がつかなかったため、スモレットと彼の家族はやむなくペルージャで一夜を過ごすことになった。彼らはこの街の教会をめぐり、地元出身の画家ピエトロ・ペルジーノの絵画を見て回ったのち、再びフィレンツェに向かった。"
 grand_tour_events.13.title: "ドナウ河畔の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.13.desc: "[target_location.GetName]は、[ShowRegionName('italy_region')]、[ShowRegionName('balkan_region')]、そして[ShowLanguageName('german_language')]圏からの道が合流する渡河地点を押さえており、この[target_location.GetRank.GetName]はその通行税で大いに潤ってきた。中心部にはホーフブルク宮殿がそびえ、その宮廷の者たちは、自分たちをただの地方貴族以上の存在とみなしている。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、ついにアルプス山脈を越えた。この先の道は比較的穏やかだ。"
 grand_tour_events.13.knowledge: "大聖堂付属の学校と街の学者たちを訪ねる。"
 grand_tour_events.13.experience: "ドナウ川沿いの工廠と船頭たちの埠頭を視察する。"
 grand_tour_events.13.connections: "ホーフブルク宮殿で[court_host.GetNameWithNoTooltip]に謁見する。"
 grand_tour_events.13.party: "大聖堂付属の学校で学ぶのはやめ、ドナウ川沿いで一夜を過ごす。"
 grand_tour_events.13.historical_info: "1775年、医師のジョン・ムーアは若きハミルトン公爵のグランドツアーに同行してウィーンを訪れた。2人はまず皇帝ヨーゼフ2世との内謁を許され、続いてシェーンブルン宮殿で皇后マリア・テレジアとの拝謁を果たした。ムーアによると、ウィーン宮廷はその厳格さで有名だったが、宰相であるカウニッツ侯がそれを打ち消す気遣いを見せた。ムーアの14歳の息子が同行していることに気づいたカウニッツ侯は、皇帝と皇后にその子にも謁見を許すよう進言したのだ。ムーアはまた、その8年前にハプスブルク家を襲った天然痘の流行について宮廷に伝わる古い逸話も記している。皇后の娘の1人は、自分が天然痘にかかったと知るや、すぐさま鏡を持ってくるよう命じ、まもなく損なわれることになる自分の美貌に、陽気に別れを告げたという。"
 grand_tour_events.14.title: "黄金の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.14.desc: "[target_location.GetName]はヴルタヴァ川の両岸に広がり、石橋が旧市街と城のある丘を結んでいる場所で、この[target_location.GetRank.GetName]にはまるで一角の帝国の首都のような雰囲気が漂っている。丘の上の大学には、[ShowLanguageName('german_language')]圏全体や、さらにはその外からも学生たちが集まってくる。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]の目の前に広がっているのは、月や年ではなく、世紀という単位でその重要性を計るべき[target_location.GetRank.GetNameWithNoTooltip]だ。"
 grand_tour_events.14.knowledge: "丘の大学で講義を受ける。"
 grand_tour_events.14.experience: "ガラス工房と、黄金の小路の金細工職人たちを視察する。"
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.party: "大学から出て、川の酒場で一夜を過ごす。"
 grand_tour_events.14.historical_info: "1775年、若きハミルトン公爵のグランドツアーに同行してボヘミアを訪れていた医師のジョン・ムーアは、公爵とともにプラハの通りに立っていた。すると、プラハの神学校に所属する通りがかりの司祭が、2人の会話を耳にし、実は自分もアイルランド人なのだと声をかけてきた。どうしてそれほど簡単に自分たちの国籍を見抜けたのか尋ねると、司祭は、英語を話しているのを聞いた瞬間にわかったのだと答えた。司祭はその後の滞在中、2人のガイドを務め、そのなかで1618年に2人の貴族とその秘書官が投げ落とされた官庁の窓も案内してくれた。ムーアは皮肉を込め、世界中の政治家が倣うべき前例だと評した。"
 grand_tour_events.15.title: "修道士の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.15.desc: "[target_location.GetName]という名前は、諸侯が市場と造幣所を建設する以前、この地に修道士たちが住んでいたことに由来する。この[target_location.GetRank.GetName]はそれ以来、大きな発展を遂げた。ヴィッテルスバッハ家の宮廷により、[target_location.GetRank.GetNameWithNoTooltip]の秩序はほとんどの場所よりも良好に保たれ、地元の醸造家たちのおかげで酒には事欠かない。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]はここで学者たちに会い、しっかりと舵取りされている宮廷を見ることができる、"
 grand_tour_events.15.knowledge: "大聖堂付属の学校と街の年代記作者たちを訪ねる。"
 grand_tour_events.15.experience: "公爵の武器庫と、[ShowGoodsNameWithNoTooltip('salt')]交易の倉庫を視察する。"
 grand_tour_events.15.connections: "[court_host.GetNameWithNoTooltip]の宮廷に参上する。"
 grand_tour_events.15.party: "年代記のことは忘れ、醸造家たちに混ざって一夜を過ごす。"
 grand_tour_events.15.historical_info: "1786年、作家のヘスター・リンチ・ピオッツィは、ヨーロッパ大陸をめぐる長い新婚旅行の途中、夫とともにミュンヘンに立ち寄った。インスブルックを出発してアルプス山脈を夜に越え、夜明けにミュンヘンに到着した夫妻は、しばらくそこに滞在し、選帝侯の画廊や俗に「驚異の部屋」と呼ばれる珍品の陳列室を見学した。現地の収集家が彼女に見せた品々のなかには、クモの巣を紡いだような素材で聖母子を描いた、精巧な作品があった。その精巧さは、肉眼では人物の姿を見分けられず、顕微鏡を通して初めてその姿を把握できるほどだった。ピオッツィはこれほど繊細で実用性のない工芸品に、途方もない手間が費やされていることに我が目を疑い、驚嘆とともにこの展示品を記録した。"
 grand_tour_events.16.title: "セーヌ河畔の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.16.desc: "[target_location.GetName]は大聖堂がそびえる島を中心に、川の両岸に広がっている。この[target_location.GetRank.GetName]の規模は、我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]が今回のグランドツアーで訪れたほとんどの都市を上回るほどだ。左岸の大学街では神学と法学が教えられており、学生数は大半の都市の人口を超える。\n\n宮廷を訪れた客人は、その気位の高さを見せつけるような格式ばった作法で迎えられる。"
 grand_tour_events.16.knowledge: "左岸の大学で討論に参加する。"
 grand_tour_events.16.experience: "大学の近くにある製本工房や印刷所を訪ねる。"
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.party: "討論には参加せず、左岸の酒場に入る。"
 grand_tour_events.16.historical_info: "1763年10月、パリに滞在していた小説家のトバイアス・スモレットは、ショワジーへ向かう途中、1台の貸馬車が停まり、5、6人の武装した男たちがぞろぞろと降り、別々の木の後ろに隠れるのを目撃した。追い剥ぎか、犯罪者を追っている役人だと思いつつ、スモレットは使用人に何者なのかと尋ねたが、実のところ彼らは日帰りでウサギ狩りを楽しむために街からやって来た紳士たちだった。木陰に隠れたのは、通りがかった獲物を撃つためだったのだ。スモレットはその光景をまったく異様なものだと感じ、少なくとも野原から野ウサギを一掃するには効果的な方法だろうと、皮肉交じりに記している。"
 grand_tour_events.17.title: "大市の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.17.desc: "[target_location.GetName]は2本の川が合流する場所に位置し、地の利から莫大な富を生んできた[target_location.GetRank.GetName]だ。国王に認められた大市が開かれると、[ShowRegionName('italy_region')]や[ShowCultureGroupName('german_group')]、さらにはフランドルから商人たちが集まり、通りは倉庫に収まりきらないほどの[ShowGoodsName('silk')]や[ShowGoodsName('dyes')]であふれかえる。また、この街の印刷業は、繊維産業に負けず劣らずの活況を呈している。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]が到着して目にしたのは、儀礼よりも商業によって動く都市だった。"
 grand_tour_events.17.knowledge: "印刷所に集う人文主義の詩人たちを訪ねる。"
 grand_tour_events.17.experience: "印刷所を訪れ、商人たちの帳簿を見せてもらう。"
 grand_tour_events.17.connections: "[court_host.GetNameWithNoTooltip]と、[target_location.GetRank.GetNameWithNoTooltip]の有力商人たちを訪問する。"
 grand_tour_events.17.party: "台帳のことは忘れ、酔っ払いたちに混ざって一夜を過ごす。"
 grand_tour_events.17.historical_info: "1763年10月、小説家トバイアス・スモレットはイタリアへ向かって南下する途中でリヨンを訪問し、その様子を、後に『フランス・イタリア紀行』として出版される書簡に記した。紹介された下宿屋は満室だったため、別の宿屋に案内されたのだが、そこでは3室のみすぼらしい部屋代として1日12リーヴル、さらに食事代として32リーヴルを要求された。法外な料金に憤慨したスモレットは、何も言わずにその場を立ち去り、馬車で別の宿屋へ向かった。リヨンの宿屋の法外な料金に関するスモレットの記述は、イタリアへ向かうイギリス人旅行者たちの定番の不満として、『フランス・イタリア紀行』のなかでも特によく引用される一節となった。"
 grand_tour_events.18.title: "街道の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.18.desc: "[target_location.GetName]の名は、この地で交差する街道に由来している。いまも名前の通り街道の要衝としての役割を果たしているこの[target_location.GetRank.GetName]は、[ShowLanguageName('french_language')]圏と[ShowLanguageName('german_language')]圏を隔てる川の両岸に広がっている。大聖堂の尖塔は、我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]が今回のグランドツアーで目にしたどの建造物よりも高くそびえ立っている。塔は対になるもう1本が建てられるはずだったが、結局建設されず、1本だけとなっていた。\n\nこの自由都市は自治権を持ち、近年では印刷業者たちも商人たちに匹敵するほどの重要性を持つようになっている。"
 grand_tour_events.18.knowledge: "ヨハネス・シュトゥルムので授業を受ける。"
 grand_tour_events.18.experience: "大聖堂の塔に登り、印刷工房を訪ねる。"
 grand_tour_events.18.connections: "[court_host.GetNameWithNoTooltip]や街の評議会に面会する。"
 grand_tour_events.18.party: "印刷所のことは忘れ、尖塔の下で一晩を過ごす。"
 grand_tour_events.18.historical_info: "1770年代初頭、スコットランド人の医師ジョン・ムーアは、ハミルトン公爵のグランドツアーに付き添ってのヨーロッパ旅行中に、高さが約142メートルあるストラスブール大聖堂の尖塔に登った。彼はこの訪問について、著書『フランス、スイス、ドイツの社会と風習に関する概論』に記している。ムーアによると、彼は群衆とともに、ルイ15世の庶子がミサに参列するのを待っていた。しかし、庶子が到着する前に正午の鐘が鳴ると、群衆はミサを聞くことなく散っていった。その後ムーアは、人間の情念がいかに暴君足りえるかに関する熱のこもった説教を耳にした。ムーアはまた、大聖堂にある大きな角笛についても記している。この角笛は、400年前に起こった虐殺の原因だと案内人たちがいまなお語る陰謀にちなみ、毎晩吹き鳴らされていた。"
 grand_tour_events.19.title: "地中海の玄関口、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.19.desc: "[target_location.GetName]はローマが誕生する以前から港であった。[ShowCultureName('greek_culture')]の船乗りたちはここを港として見出し、そのまま住み着いたのだ。そしていまもこの[target_location.GetRank.GetName]の至るところに潮とタールの匂いが漂っている。港は地中海の半分からやって来たガレー船で賑わい、市場には[GetCountry('FRA').GetName]の内陸部ではお目にかかれない品々が並んでいる。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]の目には、海洋交易の恩恵を大いに受ける[target_location.GetRank.GetNameWithNoTooltip]の姿が映っている。"
 grand_tour_events.19.knowledge: "[target_location.GetRank.GetNameWithNoTooltip]を築いた[ShowCultureNameWithNoTooltip('greek_culture')]人たちの歴史を伝える碑文を調べる。"
 grand_tour_events.19.experience: "港を訪れ、地中海の水兵たちと話す。"
 grand_tour_events.19.connections: "[court_host.GetNameWithNoTooltip]を訪問する。"
 grand_tour_events.19.party: "波止場の近くにある酒場で一晩を過ごし、噂話を交わす。"
 grand_tour_events.19.historical_info: "1765年5月、小説家トバイアス・スモレットは、プロヴァンスを経由する帰路の途中でマルセイユを訪れ、後に『フランス・イタリア紀行』として出版される書簡のなかで、この港町の様子を描写した。港の埠頭を散策していたスモレットは、王室から交易用に貸し出され、小さな露店で働いているガレー船の囚人たちを目にした。彼らは片足を鎖につながれながらも、靴職人や銀細工職人、書籍商として働いており、スモレットの言葉によれば、暮らしぶりはよさそうで陽気だったという。スモレットはマルセイユを壮麗で繁栄した都市と評価したが、一方で、宿屋が食事のたびに1人当たり4リーヴルを請求することには不満を漏らしていた。"
 grand_tour_events.20.title: "アウグストゥスの街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.20.desc: "[target_location.GetName]は、この[target_location.GetRank.GetName]を築いた皇帝の名を冠しており、それ以来発展を続けている。この街の銀行商会は、一部の王国の国庫がささやかに見えるほど巨額の資金を動かしている。また、ここでは帝国議会が頻繁に開催されるため、諸侯を迎えることもすっかり日常茶飯事となっている。\n\n我らの[ROOT.GetCountry.GetGovernment.GetHeirTitle]が訪れたこの[target_location.GetRank.GetNameWithNoTooltip]は、家柄と同じくらい、財産についても公然と語られる場所だ。"
 grand_tour_events.20.knowledge: "街に残る古代の遺物や、人文主義者たちの写本を調査する。"
 grand_tour_events.20.experience: "大手の銀行商会の台帳を見て学びを得る。"
 grand_tour_events.20.connections: "[court_host.GetNameWithNoTooltip]が催す歓迎の宴に参加する。"
 grand_tour_events.20.party: "台帳のことは忘れ、賭け事に興じる。"
 grand_tour_events.20.historical_info: "1772年7月15日の朝、イングランドの音楽史家チャールズ・バーニーは、夜通しの旅を経てアウクスブルクに到着すると、そのまま大聖堂へ向かった。そこでは祝祭の開催に合わせてドイツ語で説教がおこなわれ、2組の聖歌隊によるミサ曲が歌われていた。バーニーは聖歌隊を称賛したものの、オルガン奏者の奏でるハーモニーについては、あまりに粗野かつ強引で、耳を楽しませるどころか苦痛を与えるものだったと評した。また、聖体奉挙の際にドラムとトランペットが荒々しく鳴り響いたことにも驚いており、このような習慣を耳にしたのは、アントウェルペン以外では初めてだったという。紹介状を渡すつもりだったカントル（キリスト教音楽の指導者）が街を離れていることを知ると、音楽史の執筆に向けて資料を集めていたバーニーは、長居することなく街をあとにした。"
 grand_tour_events.21.title: "大聖堂の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.21.desc: "[target_location.GetName]では、いま生きている誰もが思い出せないほど昔から大聖堂の建設が続いている。この[target_location.GetRank.GetName]には建設途中の塔がそびえ立ち、その頂上には石工たちが残した起重機がいまも据えられている。またライン川を通じてこの[target_location.GetRank.GetNameWithNoTooltip]を行き交う交易品の量は、[ShowLanguageName('german_language')]圏でも有数の規模を誇っており、大司教は諸侯にも劣らぬ権力でこの場所を統治している。\n\n我らの[ROOT.GetCountry.GetGovernment.GetHeirTitle]が目にしているのは、世紀単位の計画を我慢強く続けている都市だ。"
 grand_tour_events.21.knowledge: "大聖堂の建設現場を視察し、大学の学者たちを訪れる。"
 grand_tour_events.21.experience: "ラインラントの教会で使われる鐘を鋳造する工房を見学する。"
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.party: "大聖堂の建設作業は見に行かず、ライン川沿いで一夜を過ごす。"
 grand_tour_events.21.historical_info: "1794年9月、小説家アン・ラドクリフは夫とラインラントを旅行中にケルンを訪れた。この旅の様子は、のちに出版された旅行記『1794年の夏の旅』に記されている。街はリエージュとマーストリヒトに向けて進むフランス軍から逃れてきた難民たちであふれかえり、通りには負傷者や瀕死の人々を運ぶ病院の馬車がひしめいていた。宿屋はどこも満室で、部屋を確保できなかった旅行者たちは、馬車のなかやビリヤード台の上、長椅子などで眠るしかなかった。ラドクリフはのちに、このときの光景はそれまでに読んだどんな戦闘の記述よりも雄弁に、戦争で真に犠牲になるものを現していたと記している。"
 grand_tour_events.22.title: "バルキノと呼ばれた街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.22.desc: "[target_location.GetName]の防壁の歴史は、最初にこの地に築かれたローマの植民地にまでさかのぼる。[target_location.GetRank.GetName]はその後、この海岸沿いで最も賑わう港へと発展し、いまでは西地中海各地で[ShowGoodsName('wool')]や香辛料、[ShowGoodsName('dyes')]を取引するガレー船がひしめき合っている。また、この[target_location.GetRank.GetNameWithNoTooltip]には独自の海事法典が存在し、一度も足を踏み入れたことのない船長たちにも参考にされている。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]の長い帰路は、まもなく終わりを迎えようとしている。"
 grand_tour_events.22.knowledge: "コルツ・カタルーニャ（カタルーニャ議会）の法制度に関する講義を受ける。"
 grand_tour_events.22.experience: "商人の取引所に保管されている海事法典を調べる。"
 grand_tour_events.22.connections: "[court_host.GetNameWithNoTooltip]の宮廷に参上する。"
 grand_tour_events.22.party: "海事法典のことは忘れ、埠頭の酒場を訪れる。"
 grand_tour_events.22.historical_info: "1775年10月下旬、イングランドの古物研究家ヘンリー・スウィンバーンは、夜の閉門直前にバルセロナに到着した。彼はここでの出来事を著書『1775年と1776年のスペイン紀行』に記している。彼は総督への表敬訪問を済ませると、劇場に足を運んだ。当初は実に退屈な舞台だと不満を漏らしていたが、数日後には、遠い昔のスペインの衣装をまとって生き生きと演じられる『エル・シッド・カンペアドール』に魅了されていた。また彼は城塞の調査もおこない、低地で湿気が多く、蚊が大量に発生する場所が選ばれたのは、人々の健康より眼下の都市を威圧することを優先したからだろうと記している。"
 grand_tour_events.23.title: "王たちの都、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.23.desc: "[target_location.GetName]の丘の頂には、歴代の王が戴冠し、死後に埋葬される城がそびえており、この[target_location.GetRank.GetName]では戴冠式も葬儀も同じ厳粛さで執りおこなわれる。この地にある大学は[ShowLanguageName('german_language')]圏の大半の大学よりも歴史があり、各地から集まる学生たちに天文学や法学を教えている。また、[ShowGoodsName('amber')]と[ShowGoodsName('salt')]の交易によって、市場は1年を通じてにぎわっている。\n\n我らの[ROOT.GetCountry.GetGovernment.GetHeirTitle]が立ち寄る大都市はこれが最後だ。次はいよいよ帰郷である。"
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.experience: "商人たちが商品を売買する織物会館を視察する。"
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.party: "講堂には行かず、城の近くで一夜を過ごす。"
 grand_tour_events.23.historical_info: "1778年7月25日、若きハーバート卿の北欧・東欧をめぐる長期のグランドツアーに教師として同行していたウィリアム・コックスは、ヴィスワ川を渡ってクラクフに到着した。かつてのポーランドの首都は、近年の包囲戦での大砲やぶどう弾の傷跡が残り、壮麗な邸宅の数々は廃墟と化していた。カジミェシュ大王が創設した大学を視察した際、司書はトルコ語で書かれた1冊の書物を見せた。それ自体に大した価値はなかったが、ホティンの戦いにおける戦利品の1つで、ポーランドを救い、ヤン・ソビェスキが王位を獲得するきっかけとなった勝利を記念して、ソビエスキ王自らが大学に寄贈したものであるという点に高い価値がある品である。"
 grand_tour_events.24.title: "次はどこへ？"
 grand_tour_events.24.desc: "[target_location.GetName]の先には、いくつもの街道がある。[ShowRegionName('italy_region')]のさらに奥地へ進むか、あるいは故郷へ向かうか、[target_leader.GetName]は今後のツアーの進路を決めなければならない。"
 grand_tour_events.24.a: "[ShowLocationNameWithNoTooltip('verona')]に寄り道する。"
 grand_tour_events.24.b: "代わりに[ShowLocationNameWithNoTooltip('ferrara')]に向かう。"
 grand_tour_events.24.c: "[ShowLocationNameWithNoTooltip('bologna')]に寄る。"
 grand_tour_events.24.d: "[ShowLocationNameWithNoTooltip('florence')]に進む。"
 grand_tour_events.24.e: "[ShowLocationNameWithNoTooltip('siena')]で足を休める。"
 grand_tour_events.24.f: "まずは[ShowLocationNameWithNoTooltip('pisa')]に立ち寄る。"
 grand_tour_events.24.g: "[ShowLocationNameWithNoTooltip('assisi')]に向かう。"
 grand_tour_events.24.h: "代わりに[ShowLocationNameWithNoTooltip('perugia')]に向かう。"
 grand_tour_events.24.i: "[ShowLocationNameWithNoTooltip('rome')]に進む。"
 grand_tour_events.24.j: "[ShowLocationNameWithNoTooltip('naples')]に足を延ばす。"
 grand_tour_events.24.k: "十分に視察できた。故郷に戻ろう。"
 grand_tour_events.25.title: "帰路"
 grand_tour_events.25.desc: "いよいよ帰路につくときが来た。[target_leader.GetName]は南下に使った往路をそのままたどるのではなく、最後の行程に進む前に立ち寄る場所を決めなくてはならない。そこで馬を休ませ、場合によっては新たな宮廷で謁見することになる。"
 grand_tour_events.25.desc.second: "あと1ヵ所で帰るのは物足りない。[target_leader.GetName]は[ROOT.GetCountry.GetCapital.GetName]への帰路につく前に、もう1ヵ所の都市に寄ることにした。最後の宮廷、最後の珍しい風景や品を見たら、今度こそ本当にグランドツアーを終えることにしよう。"
 grand_tour_events.25.a: "[ShowLocationNameWithNoTooltip('vienna')]で足を休める。"
 grand_tour_events.25.b: "[ShowLocationNameWithNoTooltip('prague')]で馬を休める。"
 grand_tour_events.25.c: "[ShowLocationNameWithNoTooltip('munich')]を経由して帰路につく。"
 grand_tour_events.25.d: "最後の行程に進む前に、[ShowLocationNameWithNoTooltip('paris')]に立ち寄る。"
 grand_tour_events.25.e: "帰路の途中で[ShowLocationNameWithNoTooltip('lyon')]を通る。"
 grand_tour_events.25.f: "内陸部に進む前に、[ShowLocationNameWithNoTooltip('london')]を訪れる。"
 grand_tour_events.25.g: "まずは[ShowLocationNameWithNoTooltip('strasbourg')]で休む。"
 grand_tour_events.25.h: "[ShowLocationNameWithNoTooltip('marseille')]を経由して旅を続ける。"
 grand_tour_events.25.i: "最後の行程に進む前に、[ShowLocationNameWithNoTooltip('augsburg')]に向かう。"
 grand_tour_events.25.k: "[ShowLocationNameWithNoTooltip('cologne')]でしばらく休む。"
 grand_tour_events.25.l: "[ShowLocationNameWithNoTooltip('barcelona')]を経由して船で帰郷する。"
 grand_tour_events.25.n: "[ShowLocationNameWithNoTooltip('orleans')]で足を休める。"
 grand_tour_events.25.o: "故郷への最後の行程に入る前に、[ShowLocationNameWithNoTooltip('krakow')]を通る。"
 grand_tour_events.25.p: "これ以上遅れるのはごめんだ。まっすぐに帰郷しよう。"
 grand_tour_events.26.title: "テムズ河畔の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.26.desc: "川沿いに広がる[target_location.GetName]は、ローマ人が初めて築いた城壁の内側だけでなく、外側にも大きく発展してきた。川に架かる橋の上には、家屋や商店がひしめき合っている。[ShowGoodsName('wool')]交易によって倉庫は商品で満たされ、議会も頻繁に開かれるため、[target_location.GetRank.GetName]は王国の政務が執りおこなわれる場となることにもすっかり慣れている。\n\n我らの[ROOT.GetCountry.GetGovernment.GetHeirTitle]が目にしたのは、大陸のどの宮廷にも劣らぬ野心を抱く宮廷だ。"
 grand_tour_events.26.knowledge: "法曹院でコモン・ローに関する朗読会に参加する。"
 grand_tour_events.26.experience: "[ShowGoodsNameWithNoTooltip('wool')]商人と街のギルド会館を訪ねる。"
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.party: "ギルド会館のことは忘れ、[target_location.GetNameWithNoTooltip]の酒場で一夜を過ごす。"
 grand_tour_events.26.historical_info: "1765年、フランスの司法官で文筆家でもあったピエール＝ジャン・グロレーは、後に『ロンドン紀行』という題名で英訳される著書の資料を集めるため、ロンドンにほぼ1年間滞在した。彼は滞在中に見かけた光景のひとつとして、ある国務大臣がギャンブル台に座り、24時間ぶっ通しで賭け事に興じる姿を目撃したと記している。そのあいだ大臣が口にしたのは、冷たい牛肉をトーストした2枚のパンで挟んだものだけだった。グロレーの記述によると「この新しい料理は、私がロンドンに滞在している間に大流行した」そうで、この料理はその後、考案者の名前で呼ばれるようになった。この逸話は、脚色されているかどうかはともかく、彼の『ロンドン紀行』のなかでも最も多く引用される一節となった。"
 grand_tour_events.27.title: "ロワール河畔の街、[target_location.GetNameWithNoTooltip]"
 grand_tour_events.27.desc: "[target_location.GetName]は、ロワール川が北へ大きく曲がった後、再び海へ向かう場所に位置している。この川を行き交う人や物のおかげで、この[target_location.GetRank.GetName]は古くから繁栄してきた。この地の大学では、[ShowLocationName('bologna')]大学にも劣らない厳格さで法学を教えており、街を囲む防壁は、ほかの都市なら陥落していたであろう包囲攻撃にも耐えてきた。\n\n我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、この街でさまざまな逸話を持つ学者や兵士たちに出会うことができる。"
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.experience: "ワインセラーとロワールの船頭ギルドを視察する。"
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.party: "法学の授業を受けず、川の近くにある酒場に行く。"
 grand_tour_events.27.historical_info: "1644年4月、若き日記作家ジョン・イーヴリンは、記録に残る最初期のグランドツアーのひとつとなった旅でロワール川沿いを下っていたが、その途中でオルレアンに立ち寄った。彼が訪れた歴史ある大学では、学生たちがなおもフランス、ノルマンディー、ピカルディ、高地ドイツの4つの歴史的な「ネーション」に分かれ、それぞれ独自の幹部を置いていた。また彼は、市内にある2つの公共図書館も利用しており、学者であれば署名を残すだけで本を借り、宿に持っていける寛容な制度に驚嘆している。イーヴリンはほかにサント・クロワ教会も訪れた。かつては壮麗だったこの共同教会には、近年の内戦による傷跡がまだはっきりと残っていた。"
 grand_tour_events.28.title: "学びを得る機会"
 grand_tour_events.28.desc.university: "随行団に、[target_leader.GetName]が[target_location.GetName]の大学に学生として受け入れてもらえるかもしれないという報せが届いた。うまくいけば、講義や討論会、そしてこのツアーが忘れ去られたあとも末長く名を残すであろう学者たちとの交流が実現する。"
 grand_tour_events.28.desc.scholar: "随行団に、[target_location.GetName]のとある学者の情報が届いた。その学者はヨーロッパ各地から学生が集まるほどの名声を持ち、相応の報酬を支払い、教え子にふさわしいと認められれば、[target_leader.GetName]をしばらくのあいだ弟子として受け入れてくれるかもしれないという。"
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.29.title: "学びの終わり"
 grand_tour_events.29.desc: "数ヵ月にわたる学びの日々が終わりを迎えようとしている。[target_leader.GetName]は、[target_location.GetName]で本当に学んだものは何なのか、$grand_tour_events.worth_the_delay$"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.30.title: "戦場で学ぶ機会"
 grand_tour_events.30.desc: "我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、[target_country.GetLongName]が戦争中であり、然るべき人物の紹介があれば、同国の将校たちが訪問者を受け入れていることを知った。[target_leader.GetName]が実際に部隊を指揮することはなく、兵士たちに何が起こっても責任を負う必要はない。しかし、経験豊富な将校たちと馬を並べて行軍できるほか、実際の軍事作戦の模様を目の当たりにすれば、どんな戦略書でも伝えきれないことを学べるだろう。"
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.31.title: "従軍体験の終わり"
 grand_tour_events.31.desc: "従軍体験が終わりを迎えようとしている。[target_leader.GetName]は、[target_location.GetName]の将校たちから本当に学んだものは何なのか、$grand_tour_events.worth_the_delay$"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.32.title: "人脈を築く機会"
 grand_tour_events.32.desc: "[target_leader.GetName]のもとに、[target_country.GetLongName]の宮廷に客人として一季のあいだ滞在しないかという招待が届いた。宮殿に部屋が用意され、あらゆる歓迎会に自由に出席できるうえ、人脈を築く価値のある宮廷人や訪問中の外交官を1人残らず紹介してもらえるそうだ。"
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName]のもとに、[target_location.GetName]の有力な一族の屋敷に客人としてしばらく滞在しないかという招待が届いた。人脈を築く価値のある名士を1人残らず紹介してもらえるうえに、彼らとの会食にも自由に参加できるそうだ。"
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.33.title: "宮廷での日々の終わり"
 grand_tour_events.33.desc: "宮廷での日々が終わりを迎えようとしている。[target_leader.GetName]は、[target_location.GetName]で築いた人脈から本当に得たものは何なのか、$grand_tour_events.worth_the_delay$"
 grand_tour_events.33.a: "成果を振り返り、旅を続ける。"
 grand_tour_events.34.title: "剣術を学ぶ機会"
 grand_tour_events.34.desc: "我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は、[target_location.GetName]に名高い剣術師範がおり、見込みのある弟子を一季のあいだ受け入れていることを知った。[target_leader.GetName]が重大な結果を招くような決闘に臨んだり、実際の揉め事に決着をつけたりすることはない。しかし、足さばきや間の取り方、そしてどんな剣術指南書でも十分には伝えられない、剣を交える際の度胸を身につけられるだろう。"
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.35.title: "稽古の終わり"
 grand_tour_events.35.desc: "稽古に明け暮れる日々が終わりを迎えようとしている。[target_leader.GetName]は、[target_location.GetName]での立ち合いから本当に学んだものは何なのか、$grand_tour_events.worth_the_delay$"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.36.title: "故郷からの手紙"
 grand_tour_events.36.desc: "[ROOT.GetCountry.GetName]からの手紙がようやくツアーに追いついた。手紙には[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の温かい言葉がつづられており、宮廷での[target_leader.GetName]の評判が上々であることや、[target_leader.GetHerHim]が異国での日々について記している旅行記も、すでに故郷の会食で幾度となく話題に上っていることが書かれている。"
 grand_tour_events.36.a: "ささやかに祝おう。"
 grand_tour_events.36.b: "故郷の宮廷に構っている時間はない。"
 grand_tour_events.37.title: "地元の讃美者"
 grand_tour_events.37.desc: "[gt_admirer.GetName]という地元の若い貴族が、[target_leader.GetName]の名声や教養に魅了され、わざわざ会いに来た。[target_location.GetName]に滞在している間、ぜひ力になりたいと言っている。"
 grand_tour_events.37.a: "然るべき人々に紹介してもらう。"
 grand_tour_events.37.b: "贈り物として持参してきた、グランドツアーに相応しい上等な衣服を受け取る。"
 grand_tour_events.37.c: "[gt_admirer.GetHerHis]の屋敷への招待を受け入れ、滞在中はそこに寝泊りする。"
 grand_tour_events.38.title: "有益な口添え"
 grand_tour_events.38.desc: "ある晩餐会で、[target_leader.GetName]は[gt_secretary.GetName]という若い男性の隣に座ることになった。控え目な人物で自分のことはほとんど話さなかったが、何気ない発言から、枢機卿である[target_cardinal.GetName]の秘書を務めていることがわかった。また、今夜の席でよい印象を与えれば、枢機卿との面会を取り計らえるともこぼした。"
 grand_tour_events.38.a: "無様だと思われる危険を冒してでも、紹介を強く求める。"
 grand_tour_events.38.b: "恥をかこうが構わない。強引に紹介を求める。"
 grand_tour_events.38.c: "ただ晩餐会を楽しむ。それ以上は望まない。"
 grand_tour_events.39.title: "ひらめきの瞬間"
 grand_tour_events.39.desc: "[target_location.GetName]での討論の最中、[target_leader.GetName]の主張が突如として、天才的なひらめきだと受け取られた。居合わせた学者たちは黙り込み、次に頷きをもって同意を示した。"
 grand_tour_events.39.a: "議論を進める。実は間違っており、笑いものになる可能性もある。"
 grand_tour_events.39.b: "徹底的に議論を進める。笑いものになろうと知ったことか。"
 grand_tour_events.39.c: "今日はまずまずの成果をあげられた。このあたりで切り上げよう。"
 grand_tour_events.40.title: "腕前の披露"
 grand_tour_events.40.desc: "[target_location.GetName]の剣術学校での立ち合い中、[target_leader.GetName]はどの師範にも教わったことがない好機を見出した。その瞬間、[target_leader.GetSheHe]がこの好機をどう活かすのか見ようと、部屋にいる全員の視線が集まった。"
 grand_tour_events.40.a: "無様に転倒するかもしれないが、攻め込む。"
 grand_tour_events.40.b: "怪我など気にせず、強引に攻めに転じる。"
 grand_tour_events.40.c: "好機は逃さないが、無理はしない。"
 grand_tour_events.40.injury_tt: "[target_leader.GetName]は無様に転倒し、体と自尊心に怪我を負って寝込むことになる"
 grand_tour_events.41.title: "一時の病"
 grand_tour_events.41.desc: "[target_leader.GetName]が酷い下痢に見舞われた。医師たちは現地の水が原因ではないかと疑っている。命に別状はないそうだが、症状は数日間寝込まなければならないほど辛く、しかも医師たちの治療費は安くない。"
 grand_tour_events.41.a: "医師を呼ぶ。"
 grand_tour_events.41.b: "呼べるなかで最高の腕を持つ医師を呼ぶ。"
 grand_tour_events.41.c: "放っておく。"
 grand_tour_events.42.title: "郷愁"
 grand_tour_events.42.desc: "当初の目新しさは薄れ、[target_leader.GetName]は故郷のこと、特に[target_parent.GetName]のことが頭から離れなくなった。こうなってしまっては集中することなどできない。"
 grand_tour_events.42.a: "ちょっとした贈り物を添え、親に手紙を送る。"
 grand_tour_events.42.b: "親に送るための肖像画を描かせる。"
 grand_tour_events.42.c: "グランドツアーを中断し、親がいる故郷に帰る。"
 grand_tour_events.43.title: "高くつく失態"
 grand_tour_events.43.desc: "昨夜の歓迎会で、[target_leader.GetName]が地元の司法官に挨拶する順番を間違えていたことが、後になって発覚した。随行団以外の出席者にとっては、誰の目にも明らかな、序列を無視した振る舞いだったのだ。主催者は何らかの形で謝罪の意思を示さないかぎり、この一件を忘れてくれそうにない。とはいえ下手な謝罪では、かえって事態を悪化させかねない。"
 grand_tour_events.43.a: "通じないかもしれないが、謝罪の意味を込めてちょっとした贈り物を渡す。"
 grand_tour_events.43.b: "大げさなぐらいに謝罪の意を示す。"
 grand_tour_events.43.c: "何もしないでおく。"
 grand_tour_events.44.title: "堕落した警備隊"
 grand_tour_events.44.desc: "日が暮れてから帰路についた[target_leader.GetName]は、路地裏で都市警備隊の制服を着た男たちに襲われた。守ることを誓った法より、よそ者の財布の方に興味があったらしい。"
 grand_tour_events.44.a: "朝になったら警備隊員たちを司法官に告発する。"
 grand_tour_events.44.b: "路地裏で警備隊員たちに決闘を挑む。"
 grand_tour_events.44.c: "通りに逃げ、大声で助けを求める。"
 grand_tour_events.44.d: "財布を差し出して立ち去る。"
 grand_tour_events.45.title: "同郷の旅人"
 grand_tour_events.45.desc: "人でごった返す宿屋のなか、我らが[ROOT.GetCountry.GetGovernment.GetHeirTitle]は[gt_friend.GetName]という若い貴族と話す機会を得た。[gt_friend.GetName]も同じ国の出身で、ほぼ同じ目的で、ほぼ同じような旅路をたどっているという。2人はすぐに意気投合し、故国や旅先での思い出を語り合ったが、やがて旅路は2人を引き離し、それぞれを別の都市へと向かわせる。"
 grand_tour_events.45.a: "素晴らしい友情が芽生えそうだ。"
 grand_tour_events.45.b: "彼の幸運を祈り、我々は我々の旅を行く。"
 grand_tour_events.friendship_up_1_tt: "[gt_friend.GetName]との友情が深まる（友情#G +1#!）"
 grand_tour_events.friendship_up_2_tt: "[gt_friend.GetName]との友情が大いに深まる（友情#G +2#!）"
 grand_tour_events.friendship_down_1_tt: "[gt_friend.GetName]との友情に傷が入る（友情#R -1#!）"
 grand_tour_events.friend_joins_court_tt: "我らの後継者が旅の途中で親しくなった[gt_friend.GetName]が、後継者とともに帰国し、わが国の宮廷に加わることを望む"
 grand_tour_events.friend_reunion_intro: "偶然にも、[gt_friend.GetName]も[target_location.GetName]を訪れていた。しばらく離れ離れになっていた友人たちは再びめぐり合い、まるで昨日ぶりであるかのようにすぐに話に花を咲かせた。"
 grand_tour_events.46.title: "困っている友人"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis|U] purse, [gt_friend.GetSheHe] admits, has been emptied by a run of bad luck at the card tables, and [gt_friend.GetSheHe] asks, plainly embarrassed, whether there is any way we could help before the debt becomes a scandal."
 grand_tour_events.46.a: "自分の財布から金を出し、内密に借金を肩代わりしてやる。"
 grand_tour_events.46.b: "知人たちに手紙を書き、[gt_friend.GetName]に融資してもらう。"
 grand_tour_events.46.c: "幸運を祈り、[gt_friend.GetHerHim]に自力で何とかさせる。"
 grand_tour_events.47.title: "学びの共有"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$別れてから学んだことを伝え合うなかで、[gt_friend.GetNameWithNoTooltip]は、ある講義の内容が理解できないのだと打ち明けてきた。講義で扱われている資料が、我々にとってはこれまでの学びを通じて理解できている内容だったため、解説してほしいそうだ。"
 grand_tour_events.47.a: "腰を据え、これまでの学びを活かして解説する。"
 grand_tour_events.47.b: "家庭教師を雇い、[gt_friend.GetHerHim]に内容を一から説明させる。"
 grand_tour_events.47.c: "簡単なことだと伝え、あとは自分で考えさせる。"
 grand_tour_events.48.title: "然るべき人物への口添え"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$[gt_friend.GetNameWithNoTooltip]は、[target_location.GetNameWithNoTooltip]に私的なサロンがあり、[target_location.GetRank.GetName]の名家が集まっているという話を聞いたが、紹介の伝手がないそうだ。グランドツアーを通じて人脈を築いてきた[target_leader.GetName]なら、話はまったく別だ。"
 grand_tour_events.48.a: "知人に連絡を取り、[gt_friend.GetHerHim]の身元を保証する。"
 grand_tour_events.48.b: "代わりに、それよりも格の低いサロンへの参加費を肩代わりする。"
 grand_tour_events.48.c: "自分で何とかするよう伝える。"
 grand_tour_events.49.title: "暴力による脅し"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$再会の喜びも束の間、事態は急速に悪化した。[gt_friend.GetNameWithNoTooltip]は地元の金貸しと揉めており、その男が雇われの用心棒を2人連れて、宿屋の卓の脇に現れた。今夜中に借金を返さなければ、家具を壊すだけでは済まないと脅している。"
 grand_tour_events.49.a: "介入する。こういう連中の扱い方は心得ている。"
 grand_tour_events.49.b: "借金を肩代わりしてやり、それで終わらせる。"
 grand_tour_events.49.c: "自業自得だ。[gt_friend.GetHerHim]を見捨てる。"
 grand_tour_events.50.title: "ちょっとした病"
 grand_tour_events.50.desc: "[target_leader.GetName]に報せが届いた。[gt_friend.GetName]も[target_location.GetName]に来ているが、道中で熱と悪寒を伴う病にかかり、現地の宿で寝込んでいるそうだ。宿屋の主人に話を聞いたところ、部屋代を払うときに[gt_friend.GetName]の懐具合が心もとなさそうだったことと、診療費を節約するために、すでに2度も地元の医師の診察を断っていることを不満そうな声で教えてくれた。"
 grand_tour_events.50.a: "[gt_friend.GetHerHis]の反対を押し切り、診察代を払ってやる。"
 grand_tour_events.50.b: "道中での経験を活かし、自分たちで[gt_friend.GetHerHim]を看病する。"
 grand_tour_events.50.c: "[gt_friend.GetHerHim]を見舞い、幸運を祈る。"
 grand_tour_events.50.d: "近づかない方がよさそうだ。"
