 pacific_crossing_cargo_loaded_effect: "[ShowGoodsName('silk')]、[ShowGoodsName('porcelain')]、および香辛料が積み込まれ、艦隊が帰港した際に売却される。"
 pacific_crossing_events.1.title: "復航路"
 pacific_crossing_events.1.desc: "任務は単に[ShowContinentName('asia')]に到達することではない——船はすでにそこへ到達している。まるで小川に流される葉のように、貿易風に乗り西へと運ばれてきたのだ。行って、帰還することが任務であり、この海の彼方の岸に植民地があったところで、たどり着いた艦隊が二度と戻ってこられないようであれば、なんの価値もない。この事業全体の成否は、信頼できる復航路を見つけられるかにかかっている。それは、船が年々[ShowGoodsName('silver')]を運び出し、[ShowGoodsName('silk')]を持ち帰ることができるような航路である。\n\n往路の風向きは知られており、安定している。その先に何があるのか、そして海が艦隊に帰路を与えてくれるかどうかは、この港のどの海図も教えてはくれない。水先案内人たちが確信しているのは、往路と帰路は同じではないということだけだ。"
 pacific_crossing_events.1.a: "より大規模な艦隊を編成し、前方の探索用に船を1隻追加せよ。"
 pacific_crossing_events.1.a.tt: "追加の船の装備が整えられ、艦隊に加わる（船#G +1#!隻）"
 pacific_crossing_events.1.b: "航海のための物資を整え、残りは運命に委ねよ。"
 pacific_crossing_events.1.c: "我々が遭遇するあらゆる風と海流を、[target_leader.GetNameWithNoTooltip]が記す。"
 pacific_crossing_events.1.historical_info: "東に戻るための復航路「トルナビアヘ」は、太平洋航海時代の初期において、答えの見つからない大きな問題だった。ヌエバ・エスパーニャからやってきたアルバロ・デ・サアベドラは、貿易風によって二度（1528年と1529年）船が押し戻され、突破口を見つけられないままこの世を去っており、またルイ・ロペス・デ・ビリャロボスも1542年にアジアに到達したものの、故郷に戻る道をついぞ見つけることができなかった。1565年になってようやく安定した復航路が発見されたが、それまでは艦隊がアジアにたどり着けても、積み荷を持ち帰ることは決してなかったのである。"
 pacific_crossing_events.2.title: "盗賊諸島"
 pacific_crossing_events.2.desc: "どこを見ても海と空しかない数週間が続いた後、見張りが陸地を発見したと叫んだ。白い波に囲まれた、低い緑の島だ。艦隊が錨を下ろす前に、カヌーがそれを迎えるため競い合うように出てきた。三角帆を掲げた細長いアウトリガー船は、波から波へと滑るように進んでいくため、水夫たちが立ち上がって見入るほどであった。島民たちは笑いながら恐れもせず船腹によじ登り、固定されていないものを何でも持ち去っていく。彼らにとっては、誰にも所有されていないものを取ることは盗みではない。一方で、海上でひと月も飢えに苦しんできた者たちにとって、この行為は挑発にほかならなかった。\n\nしかし、ここには真水も、果実も、魚もあり、手段を問わなければ手に入れることができる。"
 pacific_crossing_events.2.a: "交易用のビーズ、[ShowGoodsNameWithNoTooltip('cloth')]、[ShowGoodsNameWithNoTooltip('iron')]を、水と果実と交換する。"
 pacific_crossing_events.2.b: "船に必要なものを力ずくで奪い取れ。一刻の猶予もない。"
 pacific_crossing_events.2.fight_win_tt: "島民たちは船の武器の前に散り散りになり、乗組員たちは意のままに水と果実を積み込む"
 pacific_crossing_events.2.fight_lose_tt: "島民たちは予想以上に激しく抵抗し、乗組員たちは手ぶらで船へ追い返される"
 pacific_crossing_events.2.c: "水のことは忘れろ。彼らの俊敏な船体と帆を観察するのだ。"
 pacific_crossing_events.2.historical_info: "1521年3月6日、3ヵ月以上にわたって陸地を見ない航海を続けた後、フェルディナンド・マゼランの艦隊の生存者たちはグアムに到達した。チャモロ人は高速のアウトリガー式プロア船に乗って接近し、年代記編纂者アントニオ・ピガフェッタは、スペイン人が乗ったどの船よりも速いと称賛した。島民たちが船の小舟を1隻を持ち去った後、マゼランはこの諸島をラドロネス諸島（盗賊諸島）と名づけ、フィリピンへ向けて出航する前に物資を確保するため、兵を率いて上陸した。"
 pacific_crossing_events.3.title: "40日間の無"
 pacific_crossing_events.3.desc: "陸地も、鳥も、海面に漂う海藻の一片すらもない。乗組員は何週間も海上におり、水先案内人の自信は日ごとに薄れていく。船員の歯茎からは血が流れ、歯がぐらついている。ある者は、何年も前に治った古傷がまた開いたと言う。水樽は底を突き、ビスケットはもはやゾウムシの塊と言ったほうがいいほどだ。風は穏やかで、安定して涼しいが、それは彼らを果てしなく続く大海原の奥深くへと運んでいく。\n\n船長は顔色を変えず、落ち着いた声で海図の日付を数え、自分が確信していないことは決して口にしない。"
 pacific_crossing_events.3.a: "配給を減らせ。我々は耐えねばならないのだ。"
 pacific_crossing_events.3.b: "針路は正しい。前方に陸地がある。このまま進め。"
 pacific_crossing_events.3.c: "乗員の規律を正せ。船長の命令は絶対だ！"
 pacific_crossing_events.4.title: "西の海を越えた陸地"
 pacific_crossing_events.4.desc: "盗賊諸島を離れて久しいころ、見張りが朝霧の向こうに緑の丘を発見した。艦隊が大きな湾に入っていくと、ここが無人の岸ではないことが明らかになった。白く塗られた壁とヤシの葉で葺かれた屋根の集落が、水辺から丘の上へと広がっている。色鮮やかな布をまとった男たちが乗るアウトリガー式カヌーが、警戒の色も見せずに船へ向かってくる。\n\nそのなかで一番大柄な男は、首元に金を身につけており、水先案内人の誰も理解できない[location.GetDominantCulture.GetLanguage.GetName]を話し、見知らぬ者と頻繁に交易している人間のような気軽さで岸を指し示す。これらの島々には独自の世界があり、そこではすでに遠く離れた中国の[ShowGoodsName('silk')]と[ShowGoodsName('porcelain')]が流通している。"
 pacific_crossing_events.4.desc.owned: "盗賊諸島を離れて久しいころ、見張りが朝霧の向こうに緑の丘を発見した。そして、丘の斜面に広がる集落の上に、見間違えようのない我々の旗が翻っている。艦隊は未知の岸へ迷い込んだのではなく、わが国の港である[pacific_colony.GetName]、すなわち我らが王の領地へと入港したのだ。その埠頭や倉庫は、すでに活況を呈している。\n\n同胞を乗せた小舟が船を迎えに出てきた。何もない東方の海から艦隊が現れたのを見て、彼らは驚きの表情を浮かべている。ここで乗組員たちは安全に水と食糧を補給し、中国の商人たちが我々の埠頭へ運んでくる[ShowGoodsName('silk')]と[ShowGoodsName('porcelain')]を積み込むことができる。"
 pacific_crossing_events.4.desc.hostile: "盗賊諸島を離れて久しいころ、見張りが朝霧の向こうに緑の丘を発見した。水際の砦の上には、我々のものではない旗が翻っている。別の勢力が我々より先にこの島々へ到達していたのだ。艦隊が湾内に入ると、[pacific_rival_shore.GetName]の城壁沿いに並べられた大砲が目に入り、武装した小舟が我々の船に向かって出てくると、用件を問いただしてきた。\n\nここはいまや[pacific_rival.GetName]の地であり、その出迎えは、よくても警戒心を抱いたものになるだろう。中国の絹と磁器は依然としてこの諸島を通って流れているが、それは我々ではなく敵の手を通じてであり、自由に手に入れられるものではない。"
 pacific_crossing_events.4.a: "通過する[ShowGoodsNameFlat('silk')]と[ShowGoodsNameFlat('porcelain')]を求めて交易を開け。"
 pacific_crossing_events.4.b: "集落を襲撃し、力ずくで水と食糧を奪え。"
 pacific_crossing_events.4.b.raid_win_tt: "村人たちが内陸へと逃げ込み、乗組員たちは集落から食糧と水を奪い尽くす"
 pacific_crossing_events.4.b.raid_lose_tt: "村人たちが故郷のために戦い、襲撃者を船へ追い返す。乗組員は血を流し、何も得られずに戻る"
 pacific_crossing_events.4.d: "我々の倉庫から今季の物資を積み込め。"
 pacific_crossing_events.4.e: "我々の港で乗組員たちを休ませ、船を修理せよ。"
 pacific_crossing_events.4.f: "敵の大砲のもとで、彼らの商館員たちと慎重に交渉せよ。"
 pacific_crossing_events.4.g: "停泊地に強行突入し、必要なものを武力で奪い取れ。"
 pacific_crossing_events.4.h: "彼らの大砲から十分な距離を取り、針路を維持せよ。"
 pacific_crossing_events.4.raid_win_tt: "前哨基地を襲撃して、その物資を持ち去る。乗組員たちは意気揚々としている"
 pacific_crossing_events.4.raid_lose_tt: "強襲隊は撃退され、損害を被る。航行不能となった船は放棄しなければならない"
 pacific_crossing_events.4.historical_info: "1542年にヌエバ・エスパーニャからやって来たルイ・ロペス・デ・ビリャロボスは、当時のスペイン王位継承者（後のフェリペ2世）にちなんで、この諸島をラス・イスラス・フィリピナス（フィリピン諸島）と名づけた。スペインによる恒久的な支配が始まったのは、1565年にミゲル・ロペス・デ・レガスピがセブに最初の入植地を設立してからである。1571年、彼はラジャ・スレイマンからマニラを奪い、スペイン領東インドの首都およびガレオン貿易の西端とした。"
 pacific_crossing_events.5.title: "クローブの島"
 pacific_crossing_events.5.desc: "島が視界に入るより先に、その香りが艦隊に届いた。風に乗って漂う、甘く濃厚で刺激的な香りが。雲を引く単一の火山峰がそびえ立ち、水際まで緑に覆われている。港はマレーやジャワのプロア船がひしめき合い、[target_owner.GetName]の[target_owner.Custom('GetRulerOrRegentTitle')]の宮殿が停泊地からはっきりと見える場所に建っている。\n\n[ShowLocationName('lisbon')]や[ShowLocationName('sevilla')]の商人たちは皆、その出所を知ることさえなく、この香りに莫大な金を支払っている。この艦隊の誰一人として、その産地であるこの場所にこれほど近づいたことはない。湾を見下ろす斜面には、まだ熟していない[ShowGoodsName('cloves')]をたわわに実らせた木々があり、たった1隻分の積荷だけで、今回の航海全体にかかった費用を上回る価値がある。ここなら船倉を満たすことができる。あとは、それを故郷へ運ぶだけだ。"
 pacific_crossing_events.5.desc_known: "島が視界に入るより先に、その香りが艦隊に届いた。風に乗って漂う、甘く濃厚で刺激的な香りが。雲を引く単一の火山峰がそびえ立ち、水際までは緑に覆われている。港はマレーやジャワのプロア船がひしめき合い、[target_owner.GetName]の[target_owner.Custom('GetRulerOrRegentTitle')]の宮殿が停泊地からはっきりと見える場所に建っている。\n\n[ShowLocationName('lisbon')]や[ShowLocationName('sevilla')]の商人たちは皆、人づてにこの香りを知り、莫大な金を支払っている。この艦隊の誰一人として、その産地であるこの場所にこれほど近づいたことはない。湾を見下ろす斜面には、まだ熟していない[ShowGoodsName('cloves')]をたわわに実らせた木々があり、たった1隻分の積荷だけで、今回の航海全体にかかった費用を上回る価値がある。ここなら船倉を満たすことができる。あとは、それを故郷へ運ぶだけだ。"
 pacific_crossing_events.5.desc.no_owner: "島が見える前に、その香りが艦隊に届く。風に乗った甘さは、重く鋭く、そして香辛料のように刺激的だ。一つの火山の頂が雲をたなびかせ、水際まで緑に覆われている。港にはマレーやジャワのプロア船が行き交っているが、この岸辺を誰が治めているのかを示す旗も宮殿も見当たらない。\n\n[ShowLocationName('lisbon')] や [ShowLocationName('sevilla')] の商人たちは皆、この香りのために大金を払うが、その産地がどこなのかを知る者はいない。この艦隊の誰も、これほど産地に近づいたことはなかった。湾を見下ろす斜面には、まだ熟していない [ShowGoodsName('cloves')] の実をたわわに実らせた木々が立ち並び、たった一隻分の積荷だけでも、この航海にかかった費用全てを上回る価値がある。船倉はここで満たせる。あとはそれを故郷まで運び帰るだけだ。"
 pacific_crossing_events.5.desc.driven_back: "再び船首の向こうに香料諸島が現れる——同じ緑の山、同じ混雑した停泊地。そしてそれとともに、艦隊が出発点まで押し戻されてしまい、帰路が依然として見つかっていないという苦い現実が突きつけられた。貿易風のせいで、船はこの海岸へ引き返すしか選択肢がなかったのだ。\n\nいまや、この停泊地には陰鬱な日課が定着している。島々は再び水と食糧を与えてくれるだろう。病人を上陸させ、乗組員を休ませ、船倉には船がまだ積めるかぎりの物資が補充される。しかし、乗船しているすべての者は、待ち受ける現実を悟っている。艦隊は再び態勢を整え、海へ出て帰還の航路に挑まねばならないが、残された挑戦の回数はもう多くはない。"
 pacific_crossing_events.5.a: "船倉を[ShowGoodsNameWithNoTooltip('cloves')]で満たせ。樽をひとつ残らず積み込むのだ。"
 pacific_crossing_events.5.b: "長い帰還の航海に備えて船へ食糧を積み込め。"
 pacific_crossing_events.5.c: "乗組員たちを陸で休息させ、回復させよ。"
 pacific_crossing_events.5.d: "探索を断念せよ。喜望峰を回る長い航路で帰還する。"
 pacific_crossing_events.5.historical_info: "ポルトガルの航海者たちは1512年、モルッカ諸島に到達し、そこでフランシスコ・セラーンがテルナテのスルタンの顧問となった。マゼラン艦隊の生き残った船は1521年に、対立するティドレのスルタン国でクローブを積み込んでいる。これらの諸島をめぐるスペインとポルトガルの争いは、1529年のサラゴサ条約によって決着した。この条約で、資金難に陥っていた皇帝カール5世は、スペインのモルッカ諸島に対する権利を35万ダカットでポルトガルに売却した。"
 pacific_crossing_events.6.title: "帰路"
 pacific_crossing_events.6.desc: "船倉は満杯になり、航海の楽なほうの半分はすでに過ぎ去った。いまや艦隊は、船上のどの海図にも示されていない課題に立ち向かわなければならない。それは、いままさに横断したばかりの海を越えての帰路を見つけることである。船を穏やかに西へと運んでくれた風が、帰路では真っ向から立ちはだかる。そして、卓を囲むすべての水先案内人はそれが何を意味するかを知っている。\n\n艦隊の士官たちは夜遅くまで海図を囲み、珍しく水先案内人たちの意見が一致しない。それぞれが推す航路を主張し、ほかの案を恐れる理由を抱えている。未知の海の果てでは、その先がどこへ続くか、誰も保証できない。そこにあるのは憶測と、それに賭ける度胸だけだ。決断を下すのは船長ただ1人であり、船上のすべての者の生死は、彼が定める航路にかかっている。"
 pacific_crossing_events.6.desc.driven_back: "艦隊の士官たちは再び集まったが、卓の空気は冷え切っている。ひとつの航路が選ばれたが、海はそれを拒んだ。艦隊はここに至るまで苦闘したが、得たのはその教訓だけだった。残された航路は依然として議論の域を出ず、以前と変わらず実証されていないうえ、いまやそれらに賭けることのできる船も乗組員も少なくなっている。\n\n水先案内人たちは声を荒げるのをやめた。海図を囲むすべての男は、この海に何度も挑めば代償を払うことになると知っている。再びこの海域から抜け出す航路を定めねばならないが、選択の機会はそう多く残されていない。"
 pacific_crossing_events.6.a: "北方の航路——アジア沿岸に沿って進み、その後東へと進む。"
 pacific_crossing_events.6.a.tt: "[ShowRegionName('japan_region')]の海岸沿いを北上し、さらにその先へ進んだ後、高緯度の偏西風に乗って[ShowContinentName('america')]まで一気に渡り、帰還する"
 pacific_crossing_events.6.b: "中間の航路——貿易風に逆らって東へ進む。"
 pacific_crossing_events.6.b.tt: "古い島々を経由し、貿易風の真っ只中を真東へ突き進む。この航路に挑んだ艦隊はすべて風に押し戻された。香料諸島まで押し戻される可能性がある"
 pacific_crossing_events.6.c: "はるか南方の航路——広大な弧を描く、長いが開けた海路。"
 pacific_crossing_events.6.c.tt: "島々が点在する南方の海を通り、大きく南東へ進む。その先に航路がある可能性は十分にある。だが、途方もなく長く、艦隊の食糧が最後まで持たないかもしれない"
 pacific_crossing_events.6.historical_info: "アジアから熱帯沿いに東へ航海しようとする試みは、すべて失敗に終わっていた。1522年にヌエバ・エスパーニャへ帰還を試みたゴンサロ・ゴメス・デ・エスピノサのトリニダード号は押し戻され、ポルトガル人に拿捕された。アルバロ・デ・サアベドラも1528年と1529年の二度にわたり失敗した。アウグスチノ会修道士アンドレス・デ・ウルダネータは1565年、はるか北方、およそ北緯40度まで航行して黒潮と偏西風を捉え、それらに乗って北太平洋を横断し、カリフォルニアを経てアカプルコへと南下することで成功を収めた。この航路はその後2世紀半にわたってマニラ・ガレオン船の航路として利用された。"
 pacific_crossing_events.7.title: "マル・パシフィコ"
 pacific_crossing_events.7.desc: "風が止んだ。帆はたるみ、海はどの水平線まで見渡しても鏡のごとく平らで、船は白く焼けつく空の下で微動だにせずに浮かんでいる。この海がマル・パシフィコ（平穏な海）——太平洋と名づけられたのは、このような凪のためであった。そして、その穏やかさはこれまでにも乗組員を飢えに追い込んできた。\n\n樽のなかの水は温まり、腐っていく。風のない日は、距離を稼ぐことなく食糧が消費される日であり、乗員たちはそれを重々理解していた。彼らは動かない索具と水平線を見つめ、すでに二度、何もない空へ溶けていく雲の塊を陸地と見間違えて叫んでいる。凪いだ船の暇な手が、いつまでも暇なままでいることはほとんどない。"
 pacific_crossing_events.7.a: "辛抱しろ。水と食料を少しでも節約するのだ。風は戻ってくる。"
 pacific_crossing_events.7.b: "小艇を出せ。風が戻るまで船を曳航せよ。"
 pacific_crossing_events.7.c: "うねりは南東へ向かっている。それに乗って風のほうへ漂流せよ。"
 pacific_crossing_events.8.title: "ガレオン船の帰還"
 pacific_crossing_events.8.desc: "傭船したガレオン船が帰還した。長い北回りの航路をとり、数ヵ月を海上で過ごした船は、積荷の重みで喫水を深くして停泊地に入港した。[ShowContinentName('asia')]の富は、大洋を横断して無事陸に運ばれたのだ。錨を下ろす前から、埠頭は代理店や買い手たちで埋め尽くされていた。航路は安定し、事業は利益を生んでいる。来年も、その翌年も、また別のガレオン船がやってくるだろう。"
 pacific_crossing_events.8.a: "富は無事に陸揚げされた。"
 pacific_crossing_events.8.historical_info: "マニラ・ガレオン船は1565年から1815年にかけての大半の年において、アカプルコ・マニラ間を航行し、歴史上特に長く続いた海運路線のひとつとなった。アメリカ産の銀を西へ、中国産の絹、磁器、香辛料を東へ運び、たった1隻のガレオン船の積荷だけで出資者に莫大な富をもたらすこともあった。この交易はアメリカ大陸の銀を中国の市場へと結びつけ、太平洋を世界規模の商業航路へと変えた。"
 pacific_crossing_events.9.title: "既知の海岸"
 pacific_crossing_events.9.desc: "冷たい灰色の海を北へと長く進み、そこから何もない海を東へ延々と大きく弧を描いて進んだ先で、ついに見張りがそれを目にする。霧の帯の下、南へと連なる岬と、森に覆われた高い海岸線だ。ここは[ShowContinentName('asia')]の一部でも、どこかの島でもない。[ShowContinentName('america')]の西岸なのだ。艦隊は[ShowContinentName('pacific_ocean_continent')]から抜け出し、海図にすでに記されている海岸沿いを南下するだけで、友好的な港にたどり着くことができる。\n\n帰路は発見された。残るは最後の航海を果たすだけである。"
 pacific_crossing_events.9.a: "知っている海岸沿いを南下し、故郷へ向かう。"
 pacific_crossing_events.9.b: "まずは水と休息のために寄港しよう。乗組員たちはそれに値する働きをした。"
 pacific_crossing_events.9.historical_info: "1565年、帰路についていたアンドレス・デ・ウルダネータの船は、北太平洋を4ヵ月航行した後、カリフォルニア沿岸のメンドシーノ岬付近でアメリカ大陸への初上陸を果たした。そこからサン・ペドロ号は南下し、1565年10月8日にアカプルコに到着して、この航路の有効性を証明した。そうして、この大きな弧を描く北方の航路は、マニラ・ガレオン船の標準的な帰還航路となった。"
 pacific_crossing_events.10.title: "荒れ狂う海"
 pacific_crossing_events.10.desc: "空はあざのような色に染まり、風が壁のように押し寄せる。1時間もしないうちに、艦隊は生死をかけた戦いを強いられる。主帆桁よりも高く立ち上がる波、船体中央部を打ち破ってあふれ出る緑色の水、銃声のような破裂音を立てて裂ける帆。船々は激しく揺れ、暗闇のなかで1隻また1隻と互いの姿を見失っていく。水先案内人たちにできることは、ただしがみついて時間を数えることだけだ。\n\n選択肢はあるが、それを熟考する時間はない。帆を畳んで現在の位置で嵐をやり過ごすか、それとも嵐に向かって進み、暗闇へ突っ込んで船体が持ちこたえることに賭けるかだ。"
 pacific_crossing_events.10.a: "船を停船させ、帆をすべて畳んで嵐をやり過ごせ。"
 pacific_crossing_events.10.b: "風に向かって進め。船体が持ちこたえることを祈るのだ。"
 pacific_crossing_events.10.weathered_tt: "損傷しつつも艦隊は嵐を切り抜ける"
 pacific_crossing_events.10.foundered_tt: "1隻の船が押し流され、乗組員全員とともに失われる"
 pacific_crossing_events.11.title: "生木"
 pacific_crossing_events.11.desc: "我々の船は、アメリカ太平洋沿岸の新しい造船所で、乾燥させる時間さえなかった木材を使い、こうした大洋向けの船を建造した経験のない造船工たちによって、急いで起工された。そしていま、海がそのツケを取り立てている。船体中央部の継ぎ目から板が剥がれはじめ、詰め物が緩み、甲板下では水が増えつづけ、ポンプが昼夜を問わず鳴り響いているのに水位は下がらない。船大工の顔がすべてを物語っている。\n\nこのままでは持ちこたえられない。しかし、最も近い陸地は海の向こうの遥か遠くにある。"
 pacific_crossing_events.11.a: "最も傷んだ船を傾け、適切な修理を施せ。"
 pacific_crossing_events.11.b: "交代でポンプを動かし、構わず前進しつづけよ。"
 pacific_crossing_events.11.c: "沈みかけた船を放棄し、乗組員を残りの船へ詰め込め。"
 pacific_crossing_events.12.title: "海からの贈り物"
 pacific_crossing_events.12.desc: "それはイルカの群れから始まった。大群のイルカが何かを船へと追い立てている。すると、海面が沸き立ったかのように荒ぶりはじめた。巨大な魚の群れが海面へ押し上げられ、船体の周囲では広大な銀色の光がきらめき、煮え立つようにうごめいている。旋回するイルカたちに囲まれた魚の密集ぶりに、水面がほとんど見えなくなるほどであった。\n\n乗組員に命令を下す必要はない。小艇が舷側から降ろされ、綱と網がそれに続き、男たちは手すりから身を乗り出して両腕いっぱいの魚を甲板に引き上げる。甲板はたちまちで魚で山積みになり、ぬるぬると滑りやすくなった。何週間もビスケットと塩漬け肉だけで過ごした後では、これはご馳走であり、思わぬ幸運であり、慈悲そのものであった。"
 pacific_crossing_events.12.a: "すべての小艇と綱を下ろせ。引き上げられるだけ引き上げろ。"
 pacific_crossing_events.12.b: "手早く漁を済ませ、すぐに帆走に戻れ。"
 pacific_crossing_events.13.title: "腐った食糧"
 pacific_crossing_events.13.desc: "船の食糧係が帽子を手にして船長のもとへやって来た。船倉に行くと、何段もの樽の蓋が確認のために開けられており、その中身が台無しになっていることが判明した。塩漬け肉は適切に塩蔵されておらず、ビスケットは湿った状態で詰められ、水は十分に乾燥させていない樽のなかで腐っている。出発港で慌ただしく積み込まれ、湿ったまま封印された食糧は、熱帯の暑さのなかで腐敗し、数週間分の乗組員の糧となるはずだったものは、悪臭を放ち、ウジ虫がわいたゴミと化していたのだ。\n\n海の上に市場などなく、やり直す機会もない。あるのは傷んだ蓄えと空腹の男たちだけである。"
 pacific_crossing_events.13.a: "腐った食糧を海に投げ捨て、損失を受け入れよ。"
 pacific_crossing_events.13.b: "構わず配給に回せ。あるものを食べるのだ。"
 pacific_crossing_events.17.title: "海に消えた者たち"
 pacific_crossing_events.17.desc: "名前、日付、最後に確認された針路——ようやく届いた報告は、断片的なものばかりだった。帰路を探すために出航した艦隊は、ついにそれを見つけることができなかった。嵐に吞み込まれたのか、名もなき暗礁に乗り上げたのか、あるいは単に漂流しつづけ、水が尽きて乗組員も命を落としたのか、確かなことは誰にもわからない。\n\n海が彼らを呑み込んだのだ。帰還路はいまだ見つかっていない。どこか遠い海の上では、いまも風が逆向きに吹いている。"
 pacific_crossing_events.17.a: "あの海が奪う命は、彼らが最後ではないだろう。"
 pacific_crossing_events.17.end_tt: "遠征隊は行方不明となり、その航海がここで終わりを迎える"
 pacific_crossing_events.17.historical_info: "東方の海は、挑んだ多くの者たちの命を奪ってきた。遠征隊長ガルシア・ホフレ・デ・ロアイサと世界一周航海者フアン・セバスティアン・エルカーノは、ともに1526年の太平洋横断中に海上で命を落とし、アルバロ・デ・サアベドラは1529年に帰還を試みる途中で外洋にて没し、フェルディナンド・マゼランは1521年にマクタン島で殺害された。マゼランとともにスペインを出発した約270人のうち、ヴィクトリア号に乗って帰還できたのはわずか18人だった。"
 pacific_crossing_events.18.title: "乗組員の反乱"
 pacific_crossing_events.18.desc: "男たちはもう限界だった。乏しい配給、果てしなく続く大海原、そして水先案内人以外には誰も保証できない針路——これらは乗組員をすり減らし、命令に従う気力さえ奪っていた。船尾には不満を募らせ、武装した水夫たちが集まり、要求を突きつける。艦隊を引き返させろ。さもなければ、自分たちの手で引き返す、と。士官たちの数は多勢に無勢で、マスケット銃をもつ者が一方にだけいるわけでもない。\n\nどのような決断を下すにせよ、艦隊は容易に補うことのできないものを失うことになるだろう。"
 pacific_crossing_events.18.desc.last_ship: "男たちはもう限界だった。艦隊に残された船は1隻のみであり、混み合い悪臭の漂う甲板には、士官が身を隠せる場所などない。首謀者たちは一斉に船尾へやって来た。彼らは要求するのではなく、船長に置かれた状況を恐ろしいほど簡潔に突きつける。逃げ込める別の船も、呼び集められる海兵隊もいない。そして船縁の向こうには、広大な海が広がっている。いますぐ帰路につけ。さもなければ海に放り投げる、と。\n\n水先案内人たちは押し黙っている。船長は背後に海を感じながら、舷側にひとり立ち、答えを出さなければならない。"
 pacific_crossing_events.18.a: "屈服する。首謀者らに船を明け渡し、引き返そう。"
 pacific_crossing_events.18.b: "武力で鎮圧せよ。首謀者たちを絞首刑に処し、航海を続けろ。"
 pacific_crossing_events.18.c: "故郷で待つものと、誰が彼らをそこへ導くのかを思い出させろ。"
 pacific_crossing_events.18.fight_win_tt: "反乱は鎮圧され、秩序が取り戻される（乗組員の士気#G +5#!）"
 pacific_crossing_events.18.fight_lose_tt: "戦闘は血なまぐさいものとなり、混乱のなかで船が1隻失われる"
 pacific_crossing_events.18.overboard_tt: "反乱者たちが士官たちを圧倒し、[target_leader.GetName]を海へ投げ込む。航海はここで終わる"
 pacific_crossing_events.19.title: "再び盗賊諸島へ"
 pacific_crossing_events.19.desc: "風に逆らって東へと進むものの、艦隊は押し戻される以上の距離を稼ぐことができず、ついに[ShowLocationName('guahan')]の低く緑豊かな島々が船首の向こうに姿を現した。横断のすえに後にした、あの海岸だ。以前と同様に、プロア船が水面を滑るように近づいてきた。その乗員たちは、警戒と好奇心を抱きながら、なんの成果もなく果てしない海から戻ってきた見知らぬ者たちを見つめている。最初にここで何が起こったにせよ、島民たちはそれを覚えているのだ。"
 pacific_crossing_events.19.desc.friendly: "風に逆らって東へと進むものの、艦隊は押し戻される以上の距離を稼ぐことができず、ついに[ShowLocationName('guahan')]の低く緑豊かな島々が船首の向こうに姿を現した。今度はプロア船が恐れることなく出てくる。島民たちは以前の公正な取引を覚えており、そのなかには見覚えのある顔がいくつか見受けられる。交易品が掲げられ、身振りが交わされ、水と新鮮な食糧の提供を約束していることは明らかだ。\n\n艦隊は、その両方を切実に必要としていた。この海では、古くからの友好関係こそが、どんな海図よりも価値があるようだ。"
 pacific_crossing_events.19.desc.hostile: "風に逆らって東へと進むものの、艦隊は押し戻される以上の距離を稼ぐことができず、ついに[ShowLocationName('guahan')]の低く緑豊かな島々が船首の向こうに姿を現した。しかし、今回出てきたプロア船は数が多く、笑い声はない。島民たちはあの襲撃を忘れておらず、待ち構えていたのだ。海岸には槍が林立し、かつては惜しみなく水を供給してくれた停泊地も、いまやそう簡単には水を与えてはくれないだろう。\n\nそれでも艦隊には水と食糧が必要であり、乗員たちは待ち構える人々からそれを力ずくで奪う必要があることを理解している。"
 pacific_crossing_events.19.a: "我々を好意的に覚えている人々と、再び交易しよう。"
 pacific_crossing_events.19.b: "やつらが大挙して集まる前に、力ずくで必要なものを奪え。"
 pacific_crossing_events.19.b.win_tt: "島民たちが態勢を整える前に、上陸部隊が食糧と水を確保する"
 pacific_crossing_events.19.b.lose_tt: "島民たちは今度は備えを整えており、襲撃者たちが損害を受けて撃退される"
 pacific_crossing_events.19.c: "争いを避けて可能なかぎり水を補給し、そのまま出航する。"
 pacific_crossing_events.19.historical_info: "マリアナ諸島は太平洋を横断する船がよく立ち寄る給水地点となり、ガレオン船航路が通っていた数世紀にわたり、チャモロ人との関係は慎重な交易と公然たる暴力のあいだで揺れ動きつづけた。島民を丁重に扱った艦隊は食糧を期待できたが、そうでない艦隊は、しばしばその海岸を閉ざされ、水樽ひとつを得るために戦わなければならないこともあった。"
 pacific_crossing_events.20.title: "荒々しい海岸"
 pacific_crossing_events.20.desc: "果てしなく広がる南の海から、またひとつ島が姿を現した。険しく、緑豊かで、環礁に囲まれた島だ。ここには人が住んでいる。木々のあいだから煙が立ち上り、カヌーがすでに砂浜から出てくる。カヌーには、身体に彩色を施し、槍を携えた者たちがぎっしりと乗り込み、海に響き渡る大声を上げているが、それが歓迎なのか警告なのかは、船上の誰にもわからない。\n\n水先案内人たちはこの場所を海図に記したことがなく、ここを支配する人々の名も知らない。しかし水樽は底を突きかけており、乗員たちは空腹だ。島に人が住んでいるということは、食べ物が手に入るということである。この海岸が艦隊に恵みをもたらすか、それとも牙をむくかは、次の1時間をどう切り抜けるかにかかっている。"
 pacific_crossing_events.20.a: "島には近づくな。この海で戦いは避けたい。"
 pacific_crossing_events.20.b: "接近して交易をおこなえ。[ShowGoodsNameWithNoTooltip('iron')]と[ShowGoodsNameWithNoTooltip('cloth')]を掲げ、うまくいくことを願おう。"
 pacific_crossing_events.20.trade_ok_tt: "島民たちが槍を下ろし、気前よく物々交換に応じる。小艇は食糧と水を満載して戻ってくる"
 pacific_crossing_events.20.trade_ambush_tt: "交渉は罠だった。カヌーの群れが小艇を取り囲み、艦隊は血を流しつつ辛うじて脱出する"
 pacific_crossing_events.20.c: "武器を手に上陸し、島にあるものを奪い取れ。"
 pacific_crossing_events.20.raid_win_tt: "上陸部隊が島民たちを内陸へ追い詰め、その蓄えを持ち去る"
 pacific_crossing_events.20.raid_lose_tt: "島民たちが故郷のために猛烈に戦い、乗組員は多数の負傷者を出して船へと追い返される"
 pacific_crossing_events.21.title: "再び押し戻されて"
 pacific_crossing_events.21.desc: "何週間も、艦隊は東へ進もうと必死にもがく。だが何週間経っても、海は我々が稼いだ距離をすべて奪い去っていく。貿易風は決して弱まることも、方向を変えることもない。まるで壁のように船首へ真正面から吹きつけ、その下を流れる海流も同じ向きに流れ、船が昼間に東へ進む距離よりも、夜のうちに西へ流される距離のほうが長い。水先案内人たちは観測をおこない、それらを比較し、そして沈黙する。海図上の航跡は前進をやめ、後退しはじめているのだ。\n\nこれに逆らっても意味はない。これは航路ではなく、ただの足踏みであり、費やす日々は水と命を無駄に奪うだけだ。残された唯一の道は、苦渋の決断だ。回頭し、自分たちを打ち負かした風に身を任せ、艦隊を香料諸島へと引き返し、再考するしかない。"
 pacific_crossing_events.21.a: "この海を無理に進むことはできない。"
 pacific_crossing_events.22.title: "乗組員の請願"
 pacific_crossing_events.22.desc: "船はほとんど進まないのに、食料は毎日どんどん減っていく。水は乏しいうえに次々と腐り、ビスケットは粉々に砕け、病人の名簿は毎朝長くなるばかりだ。古参の水兵たちが代表団を組み、船尾へやって来る。まだ反乱を起こしたわけではない。ただ、樽の数を数えられる男たちが、確信をもって進言しに来たのだ。彼らは航海に必要な物資を計算したが、その結果は自分たちにとって好ましいものではなかった。まだ見知った岸へたどり着けるだけの物資が船倉に残っているうちに引き返せと、彼らは言う。このまま進めば、艦隊をこの海に葬ることになるだろう。\n\n彼らの言葉は耳に痛いが、筋は通っている。"
 pacific_crossing_events.22.a: "彼らの意見を聞き入れ、香料諸島へ引き返そう。"
 pacific_crossing_events.22.b: "拒否せよ。ここまで来た以上、いまさら引き返すわけにはいかない。"
 pacific_crossing_events.23.title: "甲板に流れる血"
 pacific_crossing_events.23.desc: "請願が拒否されたその日から始まった論争は、完全に収まることはなく、今日ついに殴り合いへと発展した。航海の続行を支持する甲板長と、引き返すことを拒まれ、いまも不満を抱える一団が罵り合い、罵り合いは小突き合いになり、さらには甲板全体へと急速に広がる乱闘へと発展し、すでに何人かが刃物を抜いている。\n\n[target_leader.GetName]が現場に駆けつけたとき、見張りたちはすでに殴り合いを始めていた。この諍いの真の原因は、甲板長ではなかった。"
 pacific_crossing_events.23.a: "割って入り、乱闘を収めろ。"
 pacific_crossing_events.23.b: "首謀者を海に放り投げ、これを終わりにしろ。"
 pacific_crossing_events.23.c: "彼らの意見を聞き入れ、香料諸島へ引き返そう。"
 pacific_crossing_events.23.break_up_win_tt: "本格的な流血沙汰になる前に乱闘が収まる"
 pacific_crossing_events.23.break_up_lose_tt: "秩序が取り戻される前に、乱闘が流血沙汰へと発展する"
 pacific_crossing_events.23.overboard_tt: "首謀者が捕らえられ、容赦なく海に放り込まれる。乗組員たちは冷ややかな沈黙のなかでそれを見守る"
 pacific_crossing_events.24.title: "海上の火災"
 pacific_crossing_events.24.desc: "船尾から叫び声が上がる。艦隊の別の船が炎に包まれているのだ。帰還航路をめぐる新たな乱闘のさなか、ランタンが倒れ、炎はバケツで水を汲むよりも速く索具を駆け上がっている。火の粉が風に乗り、艦隊の残りの船へ飛んでいく。\n\n距離を詰めて消火を助けるか、それとも距離を保ち、炎上する船の運命を天に任せるか、[target_leader.GetName]は迅速に決断しなければならない。"
 pacific_crossing_events.24.a: "船を横付けし、消火の助けに入れ。"
 pacific_crossing_events.24.b: "距離を保ち、自力で消火させよ。"
 pacific_crossing_events.24.saved_tt: "人手が増えたおかげで、炎が広がる前に鎮火に成功する"
 pacific_crossing_events.24.caught_fire_tt: "火の粉が船と船のあいだを飛び越え、自分の船にも火がつく"
 pacific_crossing_events.24.distance_tt: "艦隊が安全な距離から見守るなか、もう一隻の船は水線まで燃え尽きる"
 pacific_crossing_events.25.title: "船上の反乱"
 pacific_crossing_events.25.desc: "ほかの船からの信号が届き、[target_leader.GetName]に報告が入る。船の乗組員が士官たちに反旗を翻し、引き返すかどうかをめぐる同じ議論が、ついに公然たる反乱へと発展したという。忠実な乗組員たちは船倉下部に立てこもっている一方、反乱者たちは今後の行動について議論を交わしている。介入すべきかどうかを決める時間はほとんどない。\n\nいま小艇を下ろせば、あの船の形勢を逆転させられるかもしれないが、単に反乱者たちに第二の戦利品を差し出すことにもなりかねない。"
 pacific_crossing_events.25.a: "船に乗り込み、忠誠を守る乗組員を支援せよ。"
 pacific_crossing_events.25.b: "距離を保ち、彼ら自身で決着をつけさせよ。"
 pacific_crossing_events.25.c: "彼らの意見を聞き入れ、香料諸島へ引き返そう。"
 pacific_crossing_events.25.loyal_win_tt: "忠誠派が優勢となり、船内の秩序が回復する"
 pacific_crossing_events.25.loyal_lose_tt: "反乱者たちが乗船部隊を制圧し、船を乗っ取る"
 pacific_crossing_events.25.distance_tt: "何も手を打てないうちに、反乱者たちが船を乗っ取って逃走する"
 pacific_crossing_events.26.title: "再びの請願"
 pacific_crossing_events.26.desc: "代表団が戻ってきた。今回はいくらか控えめな態度だが、決意は変わっていない。脅しもせず、声を荒らげることもない。前回拒否されてから日数が経った分だけ少し陰惨さを増したものの、以前と同じ計算を淡々と並べるだけである。いくつか小さな譲歩をすれば、甲板下の不満をいくらか和らげられるかもしれない。[target_leader.GetName]にその意思があるのなら、だが。\n\nあるいは、前回と同じ回答を返し、なんの成果もないまま請願を再び下へ送り返すこともできる。"
 pacific_crossing_events.26.a: "彼らの話を聞き、ささやかな譲歩を認めよう。"
 pacific_crossing_events.26.b: "再び退けろ。航海を続ける。"
 pacific_crossing_events.27.title: "夜の妨害工作"
 pacific_crossing_events.27.desc: "夜のうちに、誰かが物資に手を出していた。水樽が壊され、索具の巻き綱が半分ほど切られている。些細なことだが、明確な意図をもっておこなわれたことだ。この航海を中止させたいと願う者が誰であれ、もはや言葉だけでは不十分だと判断したのだ。[target_leader.GetName]は犯人を捜すために本格的な捜索を命じることも、単に見張りを倍増させ、捜索をおこなわずに先を急ぐこともできる。\n\nいずれにせよ、伝えられた意図は明らかだ。"
 pacific_crossing_events.27.a: "調査をおこない、犯人を突き止める。"
 pacific_crossing_events.27.b: "見張りを倍増させ、真相がわからないまま航海を続ける。"
 pacific_crossing_events.27.culprit_found_tt: "犯人が見つかり、全乗組員の面前で見せしめにされる"
 pacific_crossing_events.27.culprit_free_tt: "捜索では何も見つからず、捜索が打ち切られる前に破壊工作員が再び犯行に及ぶ"
 pacific_crossing_events.27.no_investigation_tt: "見張りが倍増されるが、物資への被害はなかったことにはならない"
