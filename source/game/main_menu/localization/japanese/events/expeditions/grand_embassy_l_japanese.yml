l_japanese:
 grand_embassy.1.title: "使節団の準備"
 grand_embassy.1.desc: "使節団を送り出す前に、どのような体制にするかを決めなければならない。祝宴と警備付きの宿所を往復するだけの統治者は、受け入れ側が見せたいものしか見ることができない。「尊い客人」に、工房や乾ドック、練兵場を見せることはないのだ。そのため、使節団の代表者は[figurehead.GetName]に務めさせ、[target_ruler.GetName]は随行員の1人としてこっそりと同行させることになるが、これが露見しないようどの程度の対策を取るべきだろうか？"
 grand_embassy.1.a: "いつもと同じように使節団の準備をせよ。"
 grand_embassy.1.a.tt: "通常の準備で、通常と同じ程度に隠す（隠密度：55）"
 grand_embassy.1.b: "秘密を守るため、いつも以上に入念に準備せよ。"
 grand_embassy.1.b.tt: "いつも以上に注意し、正体を徹底的に隠す（隠密度：75）"
 grand_embassy.1.c: "囮の使節団をいくつも派遣せよ。"
 grand_embassy.1.c.tt: "囮を使い、露見しにくくする（隠密度：95）"
 grand_embassy.2.title: "[embassy_country.GetCapital.GetNameWithNoTooltip]での使節団の振る舞い方"
 grand_embassy.2.desc.port: "使節団は[embassy_country.GetCapital.GetName]に到着した。[embassy_country.GetName]の艦隊は、この国が海での優位を保つうえで重要な役割を果たしている。そして我々がここに来たのは、彼らが艦隊を築くために使っている乾ドックや海軍工廠を視察するためだ。[embassy_country.GetGovernment.GetCourtTitle]でどのように振る舞うかで、我々の視察できる範囲が決まることになる。"
 grand_embassy.2.desc.inland: "使節団は[embassy_country.GetCapital.GetName]に到着した。[embassy_country.GetName]の職人と訓練教官は、この国の交易や軍隊に大きな変革をもたらしている。そして我々がここに来たのは、彼らが活躍している工房や練兵場を視察するためだ。[embassy_country.GetGovernment.GetCourtTitle]でどのように振る舞うかで、我々の視察できる範囲が決まることになる。"
 grand_embassy.2.a: "[figurehead.GetShortNameWithNoTooltip]に話をさせ、[target_ruler.GetShortNameWithNoTooltip]は随行員の1人として振る舞う。"
 grand_embassy.2.a_no_figurehead: "[target_ruler.GetShortNameWithNoTooltip]は随行員に紛れ込んだままにする。"
 grand_embassy.2.b: "[target_ruler.GetShortNameWithNoTooltip]の素性を隠さず、本来の身分を知らしめる。"
 grand_embassy.2.c: "[embassy_country.GetGovernment.GetCourtTitle]を避ける。人目に触れるためにここに来たわけではない。"
 grand_embassy.3.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]での大使節団"
 grand_embassy.3.desc.unaware: "[from.GetName]の使節団が[ROOT.GetCountry.GetGovernment.GetCourtTitle]に到着した。彼らは何の変哲もない使節たちだと主張し、[ROOT.GetCountry.GetName]のやり方を視察したがっている。わが国の工房や施設を見せていいのだろうか？ あるいは追い返すべきだろうか？"
 grand_embassy.3.desc.aware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、この使節団に同行している人物の正体を密かに突き止めている。[target_ruler.GetName]がいることをあからさまに指摘すれば、関係者全員に恥をかかせることになるが、身分を偽ってまで[ROOT.GetCountry.GetName]の素晴らしさに学ぼうとする一国の統治者を受け入れれば、わが国にとって大いに名誉なこととなる。どうやら、秘し隠さねばならないのはお互い様のようだ。"
 grand_embassy.3.a: "彼らに視察させてやれ。"
 grand_embassy.3.b: "わが国の素晴らしさは、誰が見ても構わない。"
 grand_embassy.3.c: "他国の者に秘密を漏らすわけにはいかない。"
 grand_embassy.3.d: "彼らにさりげなく視察させてやれ。"
 grand_embassy.3.e: "これほど重要な客人になら、わが国の素晴らしさを存分に見せてよい。"
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip]がいることはわかっている。あなたを歓迎することはできない。"
 grand_embassy.4.title: "寛大な滞在の申し出"
 grand_embassy.4.desc: "使節団に同行している人物の正体が明らかになると、[embassy_country.GetName]の[embassy_country.GetGovernment.GetCourtTitle]から申し出が届いた。滞在期間を延ばし、より多くを視察してはどうかと提案してきている。"
 grand_embassy.4.a: "感謝とともに申し出に同意する。"
 grand_embassy.4.b: "さらに長い滞在を懇願する。"
 grand_embassy.6.title: "報われた長期滞在"
 grand_embassy.6.desc: "[embassy_country.GetCapital.GetName]に、使節団に同行している者の正体が伝わった。[embassy_country.GetGovernment.GetCourtTitle]は偽装に付き合うつもりはなく、[target_ruler.GetName]に対し、招待を辞退できる客人としてではなく、統治者として姿を現すよう要求してきた。もはや取り繕う余地はない。宮廷に出向くか、いますぐ母国に帰るかだ。"
 grand_embassy.6.a: "わが国の政府機関は進歩するだろう！"
 grand_embassy.6.b: "わが国の陸軍は進歩するだろう！"
 grand_embassy.7.title: "大使節団の成功"
 grand_embassy.7.desc: "使節団は[embassy_country.GetName]での視察を一通り終えた。別の宮廷に向かうか、帰国して学んだ知識を活かすかを選ばなくてはならない。"
 grand_embassy.7.a: "帰国しよう。"
 grand_embassy.7.b: "[target_1.GetNameWithNoTooltip]に向かおう。"
 grand_embassy.7.c: "代わりに[target_2.GetNameWithNoTooltip]に向かうぞ。"
 grand_embassy.7.d: "[target_3.GetNameWithNoTooltip]を目指そう。"
 grand_embassy.7.e: "まだ[target_4.GetNameWithNoTooltip]が訪問先として残っている。"
 grand_embassy.7.f: "使節団を[target_5.GetNameWithNoTooltip]に向かわせよ。"
 grand_embassy.5.title: "滞在の要望の却下"
 grand_embassy.5.desc: "[ROOT.GetCountry.GetName]を近代化する取り組みにおいて、[ShowSubContinentName('western_europe')]の技術的進歩の研究は有益である。残念ながら、研究のために[embassy_country.GetCapital.GetName]での滞在を延長する要望は拒否された。"
 grand_embassy.5.a: "帰国しよう。"
 grand_embassy.5.b: "[target_1.GetNameWithNoTooltip]でなるべく多くの成果を挙げよう。"
 grand_embassy.5.c: "[target_2.GetNameWithNoTooltip]に温かい歓迎を期待しよう。"
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip]はもっと寛容かもしれない。"
 grand_embassy.5.e: "代わりに[target_4.GetNameWithNoTooltip]へ向かおう。"
 grand_embassy.5.f: "まだ[target_5.GetNameWithNoTooltip]が訪問先として残っている。"
 grand_embassy.discretion_down_4_tt: "見覚えがあるような一瞬の表情（#R -4#! 慎重さ）"
 grand_embassy.discretion_down_5_tt: "身を隠す場所が減る（隠密度#R -5#!）"
 grand_embassy.discretion_down_10_tt: "宮廷が疑念を抱く（隠密度#R -10#!）"
 grand_embassy.discretion_down_20_tt: "厚遇を受けすぎて注目を集める（隠密度#R -20#!）"
 grand_embassy.discretion_down_30_tt: "正体が露見する（隠密度#R -30#!）"
 grand_embassy.discretion_up_10_tt: "目立たなかった（隠密度#G +10#!）"
 grand_embassy.discretion_set_0_tt: "偽装が終了（隠密度：0）"
 grand_embassy.modernization_up_0to10_tt: "注目を集めていないことで学びやすい（近代化#G +0から+10#!）"
 grand_embassy.opportunities_set_1_tt: "他国の人間が視察できるものは少ない（機会：1）"
 grand_embassy.opportunities_set_2_tt: "他国の人間でもある程度は視察できる（機会：2）"
 grand_embassy.opportunities_set_3_tt: "あらゆる場所を視察できる（機会：3）"
 grand_embassy.opportunities_set_4_tt: "一切の情報が隠されない（機会：4）"
 grand_embassy.opportunities_up_1_tt: "申し出により視察しやすくなる（機会#G +1#!）"
 grand_embassy.opportunities_up_2_tt: "体裁は悪いが、粘り強さにより機会が2つ増える（機会#G +2#!）"
 grand_embassy.opportunities_down_1_tt: "1日が終わる（機会#R -1#!）"
 received_grand_embassy: "大使節団を受け入れた"
 rejected_grand_embassy: "大使節団を拒否した"
 humiliated_grand_embassy: "大使節団に恥をかかせた"
 grand_embassy.8.title: "本国での問題"
 grand_embassy.8.desc: "使節団のもとに、本国で問題が発生しているとの報せが届いた。[target_ruler.GetName]がまだ国外にいるなか、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]がなぜ自分たちの[ROOT.GetCountry.GetGovernment.GetRulerTitle]が姿を見せないのか説明を求めているのだという。ここで訪問を切り上げれば、成果なく帰国することになる。かといってこのまま国外に留まれば、統治者不在の状態がさらに長引くことになる。"
 grand_embassy.8.a: "すぐに本国に戻らなければならない。"
 grand_embassy.8.b: "まだ学べることがある。残る価値がある知識だ。"
 grand_embassy.modernization_up_5_tt: "しっかりと学びを得る（近代化#G +5#!）"
 grand_embassy.modernization_up_15_tt: "このうえなく学びを得る（近代化#G +15#!）"
 grand_embassy.discretion_up_20_tt: "金を積めば、大抵のことは忘れてもらえる（隠密度#G +20#!）"
 grand_embassy.9.title: "会計所"
 grand_embassy.9.desc: "[embassy_country.GetName]では、国庫を支える帳簿や徴税台帳を会計係が見せながら説明してくれた。インクの染みた指が各列をたどる動きに迷いはなく、どの合計額にも間違いはなさそうだった。会計係は、あらゆる金額を「未払い」と「支払い済み」の2項目に記録することで、一切見落としがないようにしていた。また各週が終わる前に、帳簿上の記録を港の積荷目録と照らし合わせることもしていた。この会計係に対価を払う意思と、会計手法を最後まで教わる忍耐力があるなら、さらに多くを学ぶことができる。"
 grand_embassy.9.a: "手法を記録しておく。"
 grand_embassy.9.b: "金を払い、記録から徹底的に学ぶ。"
 grand_embassy.9.c: "金を払ってあらゆる帳簿に目を通し、完全に理解できるまで留まる。"
 grand_embassy.10.title: "年鑑の編者たち"
 grand_embassy.10.desc: "[embassy_country.GetCapital.GetName]では、書記たちの集団が出生数から収穫量、港の船、さらには週ごとのパンの値動きに至るまで、あらゆるものを数えていた。彼らの帳簿の数はいくつもの棚を埋め尽くすほどで、列ごとに日付が記載され、前のものと比較できるようになっている。これほど膨大かつ精細に数字が記録されていると、いかなる年代史家でも語れない物語が浮かび上がってくる。書記たちによれば、彼らの年鑑はどんな年代記よりも正確に国家の状況を反映しており、彼らにしか気付けない傾向から飢饉や豊作を予測することもできるそうだ。金を払う意思と、計算の内容をじっと聞いていられる忍耐力さえあれば、彼らの手法を説明してもらうことができる。"
 grand_embassy.10.a: "手法を記録しておく。"
 grand_embassy.10.b: "金を払い、手法について詳しく聞く。"
 grand_embassy.10.c: "金を払って徹底的に記録を調べ、完全に理解できるまで留まる。"
 grand_embassy.11.title: "宮廷の流儀"
 grand_embassy.11.desc: "コートの仕立て、かつらの髪型、お辞儀の正しい角度。[embassy_country.GetName]の廷臣たちは、こういった物事を条約と同じぐらい熱心に研究している。裾の高さを間違えただけで、挽回に数年かかるほど評判に傷がつくことさえあるほどだ。折り目や羽根の1つひとつに、門外漢にはわからない意味があり、間違った装いの使節団は下に見られることになる。何をなぜ着るのか、最初にお辞儀をすべき相手は誰か、どんな角度で頭を下げるべきなのか。ある廷臣がその説明を控え目に申し出た。"
 grand_embassy.11.a: "観察して覚える。"
 grand_embassy.11.b: "その廷臣に金を払い、ある程度の説明を受ける。"
 grand_embassy.11.c: "金を払って徹底的に説明を受け、完全に理解できるまで留まる。"
 grand_embassy.12.title: "思想のサロン"
 grand_embassy.12.desc: "宮殿近くのとあるタウンハウスには、商人に学者、そして有閑貴族らがほとんど毎晩のように集まり、コーヒーを飲みつつ、かつては口にされることがはばかられた話題について語り合っている。税制、信仰、そして王権の適切な制限といった内容に関する議論は夜更けまで続き、ろうそくが短くなるにつれて熱を帯びていく。また、議論をする相手は一家言あるなら誰だろうと構わないという姿勢が共通しているようだ。上等なコーヒーを用意でき、大胆な意見を持っていれば、たとえよそ者でもこの集まりに招待される可能性はある。"
 grand_embassy.12.a: "黙って座り、耳を傾ける。"
 grand_embassy.12.b: "金を払って集まりに参加する。"
 grand_embassy.12.c: "金を払って全面的に参加し、話題を完全に理解できるまで留まる。"
 grand_embassy.13.title: "鋳造所の作業場"
 grand_embassy.13.desc: "[embassy_country.GetName]の鋳造所では、わが国の銃工たちが大金を払ってでも知りたがるような手法で大砲を鋳造している。合金の配合、鋳型の形状、そして冷却をいつおこなうのか、そのすべてが重要だ。炉の口から立ちのぼる熱気が揺らめき、作業員たちは溶けた金属の周囲を動き回っている。その立ち居振る舞いは落ち着いており、単なる技量でなく長年の経験を感じさせる。汗にまみれ、見るからに仕事に誇りを持っている様子の鋳造所の親方は、対価を払えば喜んで詳しく説明してくれるそうだ。この場所の価値を理解できる人間が見学に来たことが、嬉しくてたまらないらしい。"
 grand_embassy.13.a: "鋳造の様子を視察する。"
 grand_embassy.13.b: "鋳造所の親方に金を払い、手法について説明してもらう。"
 grand_embassy.13.c: "鋳造所の親方にたっぷりと金を払い、手法を完全に理解できるまで留まる。"
 grand_embassy.14.title: "練兵場"
 grand_embassy.14.desc: "[embassy_country.GetCapital.GetName]の外にある練兵場では、複数の部隊が調子を合わせて方向転換し、再装填をおこなっている。その動きは、わが国の召集兵とは比べものにならないほどすばやく、踏み固められた地面の上を進む軍靴の音は一定のリズムを保ち、乱れることがない。士官たちが号令を飛ばすと、言い終えるより先に兵士たちが反応し、100名の個人ではなく、1つの集団として隊形全体が向きを変える。我々の注目ぶりに気をよくした教練軍曹が、最初の号令から最後の一斉射撃まで、一連の訓練を順番に説明することを申し出てくれた。"
 grand_embassy.14.a: "練兵の様子を視察する。"
 grand_embassy.14.b: "軍曹に金を支払い、もっとしっかりと視察する。"
 grand_embassy.14.c: "軍曹にたっぷりと金を払い、手法を完全に理解できるまで留まる。"
 grand_embassy.15.title: "それとない助言"
 grand_embassy.15.desc: "我々の謁見を取り仕切る侍従が、それとなく伝えてきた。然るべき相手に贈り物を渡せば、多くの場所への視察が叶い、金のやり取りで名簿に載っている特定の名前が記憶から消えることもあるそうだ。まるで天気の話でもするかのように、余談であるかのような調子でそう話した彼は、我々が“含み”を理解できるかじっと様子を伺っている。大したことではない。どの宮廷でもよくある話だが、求める内容によっては代償が高くつく。"
 grand_embassy.15.a: "通常の贈り物を渡す。"
 grand_embassy.15.b: "豪華な贈り物を渡す。"
 grand_embassy.16.title: "慎重な仲介人"
 grand_embassy.16.desc: "国外からの訪問者の面倒事を解決することで生計を立てている仲介人が、自分を雇わないかと申し出てきた。その男曰く、ここから国境までのあいだに存在するあらゆる衛兵所や税関に顔が利くらしい。彼に借りがある人物がいるとのことだが、慎重に言葉を濁し、実際に誰なのか明言するのは避けている。彼に金を払えば、使節団が行き先やその理由を問いただされる回数が減り、追求された場合も、曖昧な返答で許されるよう手配するそうだ。"
 grand_embassy.16.a: "この仲介人を雇う。"
 grand_embassy.16.b: "この仲介人を雇い、さらに口止め料も払う。"
 grand_embassy.17.title: "おしゃべり"
 grand_embassy.17.desc: "随行員の1人が酒場で泥酔し、異邦人たちに自慢しようと使節団の本当の指導者の話をしてしまった。本人は翌朝には忘れていたが、酒場の主人や、隣の机で飲んでいた連中は全員が覚えている。すでに使用人たちのあいだで噂が広まっており、こんな面白い秘密を黙っていられるかとばかりに喜々として言いふらされている。"
 grand_embassy.17.a: "もはやどうすることもできない。"
 grand_embassy.17.b: "金を払って噂をもみ消す。"
 grand_embassy.18.title: "通りでの発覚"
 grand_embassy.18.desc: "かつて状況がもっとよかったころに[ROOT.GetCountry.GetName]で商売をしていた商人が、通りで使節団とすれ違った。足早に歩いていた彼はふと立ち止まり、[target_ruler.GetName]の顔を随分と長く見つめたのち、声をかけることなく足早に去った。その顔にはなんとなくの好奇心ではなく、予想外の人物に気付いた驚きが浮かんでいた。彼は見かけた人物が誰なのか間違いなく認識しているが、事実を胸の内にしまっておいてくれるよう願うこと以外に、我々にできることがあるだろうか。"
 grand_embassy.18.a: "黙っていてくれることを願うばかりだ。"
 grand_embassy.18.b: "あの者を見つけ出し、口止め料を渡せ。"
 grand_embassy.19.title: "詮索好きな宿の主人"
 grand_embassy.19.desc: "使節団が泊まっている宿の主人からの詮索がずいぶんと多い。どの詮索にも、何かあるのではと気になっている者からにじみ出る、わざとらしいさりげなさを感じる。「ご立派な使節団なのに、ずいぶん質素な旅でいらっしゃる」や、「いつも金額を確かめもせず払っていただけるとは、景気がいいようで」、「旅の目的をたずねると、皆さん目をそらされますな」といった具合だ。まだ疑いと言えるほどではない。硬貨が削られていないかひっくり返して確かめるように、ささいな違和感を覚えた点を確認している状態だ。だが、この状況もそう長くは続かないかもしれない。"
 grand_embassy.19.a: "なるべく答えないようにする。"
 grand_embassy.19.b: "金を渡し、詮索をやめさせる。"
 grand_embassy.20.title: "消えた書簡"
 grand_embassy.20.desc: "本国宛ての書簡が、配達人が船に届けるまでのあいだに紛失してしまった。書簡には[target_ruler.GetName]の名が明記されているほか、不注意にも使節団の本当の目的まで詳細に書かれている。だが脅迫や告発といった、書簡の行方が関係していそうな動きは一切なく、何かしらの反応があった場合よりもむしろ不安な状況だ。書簡がどこに行き、誰がそれを読み、知った情報をどうするつもりなのか、我々には見当もつかない。"
 grand_embassy.20.a: "取り戻すことは不可能だ。"
 grand_embassy.20.b: "いくらかかってもいい。書簡を見つけて焼き捨てろ。"
 grand_embassy.21.title: "我々を歓迎しての祝宴"
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle]が使節団を歓迎する祝宴を手配した。丸1日かけて乾杯、賛辞、演説に付き合うことになり、料理は厨房内で競い合っているかのように、皿が進むほどに一層手の込んだものが出てくる。これらの料理は1つひとつを褒め称えなければならず、乾杯には乾杯で返し、高官の長ったらしい話は、どれだけ中身がなくとも最後まで聞かなくてはならない。辞退すれば侮辱したことになるが、参加すれば、儀礼と美食で丸1日が潰れることになる。"
 grand_embassy.21.a: "最後まで付き合う。"
 grand_embassy.21.b: "こっそり抜け出し、もっと役に立つものを見に行く。"
 grand_embassy.22.title: "付き添い役の登場"
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle]が使節団に、あらゆる視察先を案内する役人を付けた。彼は感じがよく、疲れ知らずで、何より我々に庭園とギャラリー以外見せまいという決意に満ちていた。どれほど丁寧にそれ以外も見たいと伝えても、彼の意思は変えられなかった。どんな質問にも即答で、会話が途切れればすぐに別の話題を持ち出し、少しでも実用性のある話題に近づくと、噴水やフレスコ画に関する内容に戻されてしまう。手を変え品を変え頼んでみたが、まったく工房に近寄れない。"
 grand_embassy.22.a: "案内されるままについていく。"
 grand_embassy.22.b: "賓客として、別の場所を視察したいと強く求める。"
 grand_embassy.23.title: "冗長な面会"
 grand_embassy.23.desc: "とある下級役人との面会が何時間も続いている。お互いや贈り物を褒めあうばかりで、重要な話題は一切出てこない。多少順番が変わるぐらいで、変わり映えのしない社交辞令が何度も繰り返され、しまいには何も感じなくなった。彼はまったく急ぐ様子がなく、会話の中身より、国外からの客人の意識が自分に向いていることのほうが大切なようだ。面会がようやく終わったころには、もっと重要なことに使える時間はとっくになくなっていた。"
 grand_embassy.23.a: "耐えるのが礼儀というものだ。"
 grand_embassy.23.b: "今後は面会を途中で打ち切る。役人だろうと知ったことか。"
 grand_embassy.24.title: "思いやりのある執事"
 grand_embassy.24.desc: "王室の日々の記録をつけている執事が、これが初めてではないことが伺える慎重な口ぶりでそれとなく伝えてきた。しかるべき“お心遣い”があれば、記録に名前が残らないこともあるらしい。彼は露骨に要求するわけではなく、我々が行間を読んで察するのを、手慣れた様子で待っている。"
 grand_embassy.24.a: "執事に金を払い、記録を減らしてもらおう。"
 grand_embassy.24.b: "執事に金を払い、完全に記録を消してもらう。"
 grand_embassy.25.title: "囮としての噂"
 grand_embassy.25.desc: "我々とほとんど同じ時期に、競合国の使節団もやってきた。彼らの規模は我々より小さいが、騒々しく粗野で実に話題性に富み、はるかに多くの噂の的になっている。しかるべき使用人たちに多少金を掴ませれば、この状態を維持し、噂話に興じる暇な者たちの関心を、我々ではなく連中の出入りに向けることができる。"
 grand_embassy.25.a: "少しばかり金をばらまけ。"
 grand_embassy.25.b: "盛大に金をばらまけ。"
 grand_embassy.26.title: "密やかな護送"
 grand_embassy.26.desc: "現地の案内人が、使節団が秘密裡に出入りできるよう道案内をすると申し出てきた。詮索好きな連中に見つからずに使える通りと出入口や、見張りが手薄くなる時間帯を熟知していると主張している。彼はなぜ我々がそのような協力者を必要としているかについては一切尋ねず、いくら出せるかだけを聞いてきた。"
 grand_embassy.26.a: "この案内人を雇う。"
 grand_embassy.26.b: "この案内人を雇い、念のため多めに金を渡しておく。"
