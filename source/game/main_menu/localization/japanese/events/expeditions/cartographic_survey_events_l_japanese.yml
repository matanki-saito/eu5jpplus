l_japanese:
 cartographic_survey_events.1.title: "測量のための手配"
 cartographic_survey_events.1.desc: "命令は下された。地図製作者や機器の管理者、そして選ばれし船長を乗せた2、3隻規模の小船団を送り出し、我々の海岸線を端から端まで航行させて今後100年にわたって使える海図を持ち帰らせるのだ。現状、わが国の沿岸部に関する情報の大半は、現地の水先案内人や商人の噂をもとにしている。この遠征が成功すれば、[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]の統治下にある港、航海者にとっての難所、そして密輸業者が使う入り江まで、すべてが確固たる情報として海図に記されることになる。問題は、この遠征のためにどの程度の機材や人員を手配するかだ。"
 cartographic_survey_events.1.a: "一流の真鍮製機器と地図製作者を手配せよ。"
 cartographic_survey_events.1.b: "標準的な地図製作者で事足りる。無駄な出費は不要だ。"
 cartographic_survey_events.1.historical_info: "組織的な海岸調査が本格的に始まったのは、海上貿易の頻度が高まり、正確な海図が国家的な関心事となった16世紀からである。セビリアの通商院とポルトガルの「アルマゼム・ダ・ギネ・エ・インディア」（ギニアおよびインド倉庫）では、いずれも海図の作成と更新を担う公認の地図製作者を常駐させており、17世紀に入ってからは、オランダの海軍本部もそのあとに続いた。"
 # GOOD events: material-specific
 cartographic_survey_events.10.title: "漁場の海図作成"
 cartographic_survey_events.10.desc: "測量船は[target_location.GetName]とその周辺で、現地の漁師と協力しつつ3週間にわたって調査をおこなった。広大な漁場全体で水深を測り、季節ごとの回遊経路や、天候が変わる前にボートで帰港するために使われている海流を記録した。海図作成者たちが作成した実用的な海図には、水深、海底の地質、そして習慣上の漁期が記されている。この海図は現地の水先案内人をして、「ずっとこのあたりで暮らしているが、これほどわかりやすい海図は見たことがない」と言わしめた。"
 cartographic_survey_events.10.a: "交易を活発化させるため、漁村に海図を配布せよ。"
 cartographic_survey_events.10.historical_info: "近代以前の漁業は、漁師の家系やギルドに口伝で受け継がれる知識に頼っていた。漁場や等深線、季節ごとの回遊パターンなどを記した海図の作成は中々進まなかったが、17世紀から18世紀にかけて国家主導の水路測量が興隆したことで、詳細な海図の作成が加速した。"
 cartographic_survey_events.11.title: "沿岸の用材林"
 cartographic_survey_events.11.desc: "測量隊は、林業従事者や腕利きの船大工とともに馬に乗って[target_location.GetName]沿岸の森林を踏査し、船のマストに最適な松林と造船用のオーク林を記録しつつ、丸太を積み出し用の浜まで流送できる河川を地図に印し、木材をもっとも切り出しやすい季節を書き留めた。さらに、造船所から呼ばれた造船技師が最も有望な区画を精査し、一級品の竜骨材や肋材として使えると断言した。"
 cartographic_survey_events.11.a: "最高級の用材林を、[ROOT.GetCountry.GetGovernment.GetAdjective]の海軍用に確保せよ。"
 cartographic_survey_events.11.historical_info: "海軍が使う木材、特に戦列艦の肋材として必要なオークと、マストに必要な背の高い松は、帆船時代においては戦略物資だった。イングランド、フランス、オランダの各王家はいずれも沿岸部の森林を調査したうえで、良質な区画を王領として確保し、厳密な規制を敷いて伐採、乾燥、輸送を管理していた。"
 cartographic_survey_events.12.title: "塩田の目録作成"
 cartographic_survey_events.12.desc: "測量船は[target_location.GetName]の海岸線沿いに存在するあらゆる[ShowGoodsName('salt')]田、塩水泉、浅瀬を記録した。塩釜の数を数え、例年の稼働時期を書き留め、現地の[ShowGoodsNameWithNoTooltip('salt')]商人には価格や需要、内陸への運搬経路の聞き取り調査をおこなった。こうして出来上がった海図から、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]がそれまでほとんど把握できていなかった沿岸経済の実態が明らかになった。ここにも[ShowGoodsNameWithNoTooltip('salt')]税を適用すれば、税収が大幅に向上するだろう。"
 cartographic_survey_events.12.a: "[ShowGoodsNameWithNoTooltip('salt')]税を正しく取り立てられるよう、この海図を税務官に送れ。"
 cartographic_survey_events.12.historical_info: "天日製塩は、古代から地中海周辺や、フランス、ポルトガル、イベリアの大西洋沿岸部でおこなわれてきた。ブルニューフ湾、レ島、セトゥーバル半島は近代以前のヨーロッパにおける一大製塩地帯で、北大西洋のタラ漁業や、ヨーロッパ全域の塩漬け肉交易で使われる塩の供給源となっていた。"
 cartographic_survey_events.13.title: "真珠貝の漁場の特定"
 cartographic_survey_events.13.desc: "先祖代々[target_location.GetName]で潜水漁を営んでいる家系と協力し、測量隊はこの海域における[ShowGoodsName('pearls')]貝の漁場の位置を把握して海図に印した。この海図には、ほかにも水深や収穫時期、競業する潜水漁の共同体同士の慣習的な境界、そして真珠を都市部の加工業者のもとへ運ぶ際の経路が記載されている。当期にとれた真珠の見本を精査するために呼ばれた細工師は、並外れた光沢だと断言した。"
 cartographic_survey_events.13.a: "これほどの品質の[ShowGoodsNameWithNoTooltip('pearls')]は、[ROOT.GetCountry.GetGovernment.GetAdjective]の管理下に置かなくてはならない。"
 cartographic_survey_events.13.historical_info: "ヨーロッパの真珠漁は、ペルシア湾やスリランカの大規模漁場と比べれば小規模ではあったが、ヘブリディーズ諸島やヴィスワの水域、そしてブルターニュやウェールズの沿岸でも、商品価値のある淡水真珠や海水真珠がとれた。スコットランドでは中世以降、一部の水系における真珠採取を王室が独占し、ヴェネツィア元老院もアドリア海での採取を規制していた。"
 cartographic_survey_events.14.title: "沿岸ブドウ園の測量"
 cartographic_survey_events.14.desc: "測量隊はワイン醸造家とともに[target_location.GetName]の沿岸丘陵地をめぐり、ブドウ栽培に最適な斜面や、ブドウの成熟を促したり、あるいは腐敗を招くこともある卓越風を記録し、輸出用の樽を船へと積み込める浜を海図に記した。[ShowGoodsName('wine')]商人たちは普段は秘密主義だが、海図を改良すれば輸出する時期を見極めやすくなることを理解すると、意外なほど協力的になった。"
 cartographic_survey_events.14.a: "時期を見極めやすくなるよう、この海図を[ShowGoodsNameWithNoTooltip('wine')]の輸出商に送ってやれ。"
 cartographic_survey_events.14.historical_info: "ガロンヌ渓谷、ドウロ、エーゲ海の島々、そしてダルマチア海岸といった地域では、ワインの海洋交易が経済の屋台骨だった。そして各年のワインをよい状態で市場に届けられるかどうかは、収穫の時期、出荷期間、港の質次第だった。そのため、ワイン産地である沿岸部の海図作成は商業上きわめて重要で、ボルドーやポルトで活動する大手のワイン輸出商は、何世紀にもわたって独自の海図コレクションを保有していた。"
 cartographic_survey_events.15.title: "染料海岸の測量"
 cartographic_survey_events.15.desc: "測量隊は、[target_location.GetName]沿岸における染料の産地を海図に印した。この海図にはたとえば、ティリアンパープルの原料であるアクキガイの漁場、崖上にあるケルメスガシの生育地、内陸の平地の藍畑のほか、[ShowGoodsName('cloth')]商人たちが金を出す染料になる植物や貝の産出地が印されている。また、それぞれの収穫期、例年の採取場所、そして[ShowGoodsName('dyes')]を繊維産業の町に運ぶ際の経路も記録されている。"
 cartographic_survey_events.15.a: "[ShowGoodsNameWithNoTooltip('cloth')]を扱う商人と村々に海図を送ってやれ。"
 cartographic_survey_events.15.historical_info: "合成染料が登場する以前の中世から近世にかけて、染料は重要な戦略物資だった。アクキガイの殻からとれるティリアンパープル、カシにつくカイガラムシから採れるケルメスレッド、コマツナギ属の植物からとれるインディゴ、そしてホソバタイセイの葉からとれるウォードは、それぞれ特定の地域で生産されていた。そのため繊維産業にとって、産地から織物が盛んな町に染料を安定して送り届けられるかどうかは非常に重要だった。"
 cartographic_survey_events.16.title: "[ShowGoodsNameWithNoTooltip('amber')]海岸の測量"
 cartographic_survey_events.16.desc: "測量隊は、嵐のあとに[ShowGoodsName('amber')]が打ち上げられる[target_location.GetName]の海岸の海図を作成した。またこの際、採取すべき海岸や琥珀が打ち上げられる季節、そして地元の民が慣習的におこなっている琥珀の分配方法についても把握した。[ShowGoodsNameWithNoTooltip('amber')]を加工している都市部の商人たちは、透明度の高い琥珀をいつも高値で買い取る。どの海岸でどの等級の琥珀が採れるかわかれば、さらにいい条件で取引できるだろう。"
 cartographic_survey_events.16.a: "最高級の琥珀がとれる海岸を[ROOT.GetCountry.GetGovernment.GetAdjective]の管理地とせよ。"
 cartographic_survey_events.16.historical_info: "バルト海の琥珀海岸はサンビア半島から東部ポメラニアの沿岸にかけて広がり、古代からヨーロッパの工芸品に用いられる琥珀の主要な供給地だった。チュートン騎士団が採取を厳格に独占し、無許可での採取には厳罰を科していたことは有名である。バルト海の海岸とボヘミア、イタリア、コンスタンティノープルの工房を結ぶ「琥珀の道」は、1000年以上にわたって存続した。"
 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "安全な入り江"
 cartographic_survey_events.20.desc: "測量船は外海から守られた海域に錨を下ろした。[target_location.GetName]にある海抜の低い岬を回り込んだところにあるこの海域は、地元の漁師たちが何世代にもわたって利用してきたものの、既存の海図にはまったく記載されていない。砂地の海底までの深さは7メートルほどで安定しており、卓越風は外側の岩礁に弱められて害を及ぼすことはない。現地の水先案内人によれば、まともな喫水の船であれば、どんな天候でもここに停泊できるという。きちんと水深を測って進入経路を決めれば、この避難場所は大型船でも使えるようになる。"
 cartographic_survey_events.20.a: "進入経路を定め、この避難場所を海図に正しく載せるように。"
 cartographic_survey_events.20.historical_info: "各地の漁師は、公式の海図には載っていない、風や波を避けられる停泊地を知っていることが多かった。この知識は文書ではなく、水先案内の実践的な知識として何世代にもわたって受け継がれていた。国家による水路測量では、必ずこうした水先案内人から聞き取りをおこなうことになっており、それまで海図に印されていなかった避難場所が公式の水路案内書に新たに加えられることは、近代以前の沿岸測量では珍しくない成果だった。"
 cartographic_survey_events.21.title: "岩礁を通るための水路"
 cartographic_survey_events.21.desc: "[target_location.GetName]沖には、これまで通航不能と考えられていた岩礁がある。測鉛線を使い2週間かけてその水深を調べた地図製作者たちは、実際は通航可能であることを突き止めた。水路の幅は一番狭い部分で約9メートル、水深は干潮時でも約7メートルあり、背後の岬に適切な導標を設置すれば、どんな天候でも通航できる。実のところ、現地の水先案内人のひとりが30年前からこの水路の存在を知っていた。いままで誰にも教えていなかったが、今回は少額を払うことで目印を聞き出すことができたのだ。"
 cartographic_survey_events.21.a: "目印を記録せよ。この水路を海図に載せるのだ。"
 cartographic_survey_events.21.historical_info: "「沖合の岩礁に隠れた水路があり、実は通航可能である」という状況は、近代以前の沿岸航行ではよくあることだった。こうした水路の位置を把握するため、一般的に使われていたのが目印を使ったやり方で、岸にある目立つ何かを2つ目印とし、この2つが重なって見えるように進んでいけば水路に入ることができる。こうした通過方法に関する知識は、各地域の水先案内業者間だけの秘密として、固く守られていることが多かった。"
 cartographic_survey_events.22.title: "長く使われてきた入り江"
 cartographic_survey_events.22.desc: "測量隊は[target_location.GetName]で、最寄りの正式な港から数リーグ離れた場所にある、風や波を避けられる入り江を発見した。海底には最近錨を下ろした跡があり、浜の上の岩には樽を転がした古い痕跡が残っている。現地の漁師の子どもたちに話を聞いてみると、後ろめたそうな表情を浮かべた。この入り江は長い間、密輸取引のために使われてきたのだ。そしていま、その存在が公式に記録された。今後はまっとうなこと使われることになるか、少なくとも税収をもたらす形で管理されることになる。"
 cartographic_survey_events.22.a: "入り江を記録し、小規模な税関を建てろ。"
 cartographic_survey_events.22.historical_info: "密輸に使われる入り江は、古代から産業時代の初期に至るまで、ヨーロッパの沿岸部ではありふれた存在だった。沿岸警備隊の登場や税務当局の巡視船の導入、そして密輸品の荷揚げに使われる場所が組織的に海図に記録されるようになったことで、非合法な交易は次第により小さく、より辺ぴな入り江でおこなわれるようになっていった。だがのちに鉄道や電信、そして蒸気機関を搭載した巡視船の登場すると、海での密輸は規模を問わず困難となった。"
 # BAD events
 cartographic_survey_events.30.title: "嵐で台無しになった調査"
 cartographic_survey_events.30.desc: "調査開始から3日目に、南西から嵐がやってきた。測量船は風下の海岸に打ち上げられ、冷たい荒波に2晩さらされることになった。測量地点の地図製作者たちを迎えにいくために送り出したボートは散り散りになってしまった。風が収まり船を海に戻すまでのあいだに、この期間の成果は失われ、器具は水浸しになり、2名の甲板長を浜辺の上の砂丘に埋葬することとなった。[target_location.GetName]沿岸部の海図は、依然として空白のままである。"
 cartographic_survey_events.30.a: "諦めよう。今季はもう、やり直す時間がない。"
 cartographic_survey_events.30.historical_info: "小型船を使った沿岸部の測量において、突然の嵐の危険はつねについて回った。ビューフォート風力階級や規格化された嵐の警報、体系的な天気予報が登場したのは19世紀になってからだった。それ以前の時代では、風が強まりつつあるなかで風下に岸がある状況に追い込まれた調査船は、測鉛線や錨、そして航海長の度胸に頼って嵐を切り抜けるしかなかったのだ。"
 cartographic_survey_events.31.title: "未知の浅瀬での座礁"
 cartographic_survey_events.31.desc: "測量船は[target_location.GetName]において、既存の海図に記載されていない浅瀬に乗り上げた。深さを測るために使う測鉛線が約7メートルを示したのとほぼ同時に、船底の下の海底が急激に浅くなったのだ。隔壁より前方の部分で穴が開いたため、船を浜辺で傾け、船大工が鉛板と囲い板を使って修理にあたっている。地図製作者は砂浜に器具を設置して数日間作業をおこなっているが、この区域の沿岸でこれ以上測量を進めるのは無理だ。"
 cartographic_survey_events.31.a: "船を修理せよ。少なくとも、あの浅瀬を海図に印すことはできた。"
 cartographic_survey_events.31.historical_info: "未知の浅瀬での座礁は、近代以前の測量作業においてよくある事故だった。そして皮肉なことに、座礁した船のほうが、同じ沿岸を無事通過できた船よりも正確な水路の情報を得るということがしばしばあった。多くの水路案内書が、発見するきっかけになった座礁船に言及する形で浅瀬を記載していたほか、新たに発見された岩礁が「何年に何という名前の船がここで座礁した」と簡単な注意書き付きで海図に追加されることもしばしばあった。"
 cartographic_survey_events.32.title: "敵対的な船"
 cartographic_survey_events.32.desc: "我々の測量船が[target_location.GetName]に錨を下ろして停泊していると、旗を掲げず、大三角帆を張って明らかに武装している船が霧のなかから突然姿を現し、こちらに向かってきた。器具を持って浜に上陸していた船員たちは、測量を中止してボートに乗り込み、書きかけの冊子を抱えて測量船に戻らなければならなかった。正体不明の船は半日ほどこちらを追跡したのち進路を変え、こちらに友好的ではない母港があると思われる方角へと離れていった。結果としてこのあたりの沿岸の測量は台無しになった。先ほどの場所に戻ると言っても、地図製作者たちは納得しないだろう。"
 cartographic_survey_events.32.a: "先に進もう。敵に見張られている沿岸での測量は無理だ。"
 cartographic_survey_events.32.historical_info: "沿岸の測量は、政治的に繊細な事業である。なぜなら海軍を使って他国に海上作戦を仕掛けるには、その国の沿岸部の正確な海図が不可欠だからだ。領有権が争われている海域で活動する測量船は、現地勢力の武装船に尾行されることが日常茶飯事で、時には拘束され、時には単に測量を断念させられた。17世紀から18世紀にかけてイングランド海軍本部がスペイン沿岸やエーゲ海沿岸でおこなった水路測量も、こうした圧力によってたびたび妨害された。また測量要員たちは、臨検されそうな気配を少しでも感じたら、機密性の高い記録は海へ投げ捨てるよう訓練されていた。"
 cartographic_survey_events.33.title: "霧による測量の行き詰まり"
 cartographic_survey_events.33.desc: "2日目の朝に立ち込めた霧は、その後3週間にわたって晴れなかった。陸にある複数の目印を使い、交差方位法で現在地を把握しようにも、霧に阻まれて沿岸を目視できない地図製作者たちは、サイコロで賭けに興じたり、寒さに文句を言って暇を潰していた。糧食が残り少なくなると、[target_leader.GetName]はこれ以上待つのは食料の無駄だと判断し、海図は書きかけ、水深も未確認なまま[target_location.GetName]の沿岸部の測量を打ち切った。そして案の定、出航した翌日に霧は晴れた。"
 cartographic_survey_events.33.a: "今季の失敗を受け入れ、前に進もう。"
 cartographic_survey_events.33.historical_info: "沿岸部に発生する霧は、近代以前の測量にいつもつきまとう大敵だった。当時の標準的な水路測量では、沖合の測量地点から、位置が変わらない陸の目印をはっきりと見通す必要があり、霧が晴れなければ測量そのものをおこなえなくなった。ニューファンドランドや北海、太平洋北西部のような霧の多い海域での測量においては、実際の測量に費やす時間よりも、晴天を待つ時間のほうが長くなることも珍しくなかった。"
