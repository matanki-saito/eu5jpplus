 western_ocean_voyage_events.ship_gained_tt: "艦隊に船が一隻加わる（#G +1#! 隻）"
 western_ocean_voyage_events.ship_lost_tt: "艦隊が船を一隻失う（#R -1#! 隻）"
 western_ocean_voyage_events.charted_kept_tt: "艦隊が測量した海域は、我々の地図に残り続ける"
 western_ocean_voyage_mythical_cities_tt: "アメリカ大陸の沿岸を海図に記すと、伝説に語られる失われた都市を探す[expeditions|e]が利用可能になる"
 western_ocean_voyage_events.1.title: "西へ出航"
 western_ocean_voyage_events.1.desc: "港には、航海に備えて物資を積み込んだ船々が重たげに浮かんでいる。この先の航路には、頼りになる海図はない。[target_leader.GetName]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]で、西の海は学者たちが言うほど広くはなく、意を決して進めばインド諸島までたどり着けると、何ヵ月にもわたり訴えつづけてきた。\n\n学者たちはいまだ納得していない。船乗りたちも不安を抱いている。だが風向きはよく、潮も頃合いだ。あとは、もやいを解いて出航するだけである。"
 western_ocean_voyage_events.1.a: "海の彼方に何があろうと進め。我らが最初に見つけ出すのだ。"
 western_ocean_voyage_events.1.b: "大洋が何を秘めていようとも、進み続けよ。我らが先に見つけ出すのだ。"
 western_ocean_voyage_events.1.c: "風こそ我らの海図とせよ。"
 western_ocean_voyage_events.1.columbus: "[target_leader.GetNameWithNoTooltip]の計算では、距離は3000マイルを超えない。"
 western_ocean_voyage_events.1.historical_info: "西へ航海してアジアに到達するという発想は、そのような航海が初めて試みられる何十年も前から、ヨーロッパの学者たちのあいだで議論されていた。最大の障害は地球の形ではなく、その大きさだった。教養ある人々は地球が球体であると理解していたのだ。大半の学者は、大洋は横断するにはあまりに広いと正しく見積もっていた。のちにその見方を覆すことになった遠征も、海の広さについての見積もりが誤っていたと証明したわけではない。予想外の陸地が、その航路の途中にあったのである。"
 western_ocean_voyage_events.2.title: "海図の果て"
 western_ocean_voyage_events.2.desc: "古代の人々が「至福者の島」と呼んだ島々は、いま[ShowLocationName('northern_fuerteventura_coast')]にいる我々が携えているどの海図でも、その西の果てに描かれている。その先の海には地名もなく、水深の記録もなく、海岸線も描かれていない。現地の漁師たちは、嵐の前には西から飛んでくる鳥を見かけることがあるという。[target_leader.GetName]は水平線の彼方に陸地がある証だと考えているが、船員たちはただの嵐の前触れだと受け止めている。\n\n我々は真水と塩漬け肉、堅パンを積み込む。日が沈むころ、船員たちは海が黄金色に染まり、やがて暗くなっていくのを見つめている。"
 western_ocean_voyage_events.2.a: "補給を済ませ、1週間以内に出航しよう。"
 western_ocean_voyage_events.2.b: "まだ出航できる状態ではない。引き返そう。"
 western_ocean_voyage_events.2.c: "水と山羊を求め、小舟を岸へ送れ。"
 western_ocean_voyage_events.2.c.calm_tt: "上陸部隊は何事もなく戻ってくる"
 western_ocean_voyage_events.2.c.clash_tt: "上陸部隊は島民と衝突する"
 western_ocean_voyage_events.2.d: "島の造船職人からキャラベル船を買う。"
 western_ocean_voyage_events.2.e: "船に水を積み、手持ちの物資で航海を続ける。"
 western_ocean_voyage_events.2.f: "乗組員の準備が整っていない。引き返そう。"
 western_ocean_voyage_events.2.historical_info: "カナリア諸島は、未知の海域へ向かう大西洋航海の出発地として広く利用されていた。当時知られていた大西洋海域の西端に位置し、そこからカリブ海方面へ吹く安定した貿易風を利用できたためである。その戦略的重要性は広く認識されており、15世紀の大半にわたって、ポルトガルとカスティーリャのあいだで諸島の支配権が争われた。"
 western_ocean_voyage_events.3.title: "航海の限界"
 western_ocean_voyage_events.3.desc: "パンにはカビが生えはじめ、水樽からは嫌な臭いがする。3人の船員が熱を出している。今朝、船員たちの代表が[target_leader.GetName]のもとを訪れ、こう告げた。もう十分に西へ進んだ。見えるのはどこまでも海ばかりだ。[target_leader.GetNameWithNoTooltip]が何と言おうと、東へ引き返すという。\n\nどの方角にも陸地は見えない。あるのは、背後から吹きつづける風だけだ。その追い風がここまで船を運んできたが、帰路では逆風となる。"
 western_ocean_voyage_events.3.a: "あと3日だけだ。見つけたものは皆で分けよう。"
 western_ocean_voyage_events.3.b: "船員たちの言うとおりだ。引き返そう。"
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip]は改ざんした航海日誌を根拠に、あと3日だけ航海を続けると船員たちに約束する。"
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] は偽の航海日誌で乗組員を落ち着かせ、士気の低下を防ぐ"
 western_ocean_voyage_events.3.historical_info: "1492年の航海記録によれば、大西洋横断に乗り出しておよそ1ヵ月後、船員たちの士気は大きく揺らいだ。船員たちは反乱も辞さない構えを見せ、コロンブスに帰路につくよう迫ったという。この危機がどのように収まったのかについては諸説あり、あと3日で陸地が見つかると約束したためとも、海上を漂う植物を目にしたためとも、あるいはコロンブス自身の強い統率力によるものともされている。陸地が発見されたのは、その翌朝のことであった。"
 western_ocean_voyage_events.4.title: "陸地だ！"
 western_ocean_voyage_events.4.desc: "夜明け前、見張り台から叫び声が上がった。続いて、さらに大きな声が上がる。やがて甲板のあちこちからも声が上がりはじめた。\n\n水平線に何かが見える。はじめはかすかな黒い影にしか見えなかった。だが、あたりが明るくなるにつれて、その姿がはっきりしてくる。木々、海岸線、そして凪いだ海に浮かぶ緑の丘。船のまわりの海は、濃い青から緑へ、さらに淡い青緑へと色を変えている。見慣れぬ鳥が頭上を舞い、見たことのない葉をつけた枝が船腹のそばを流れていく。\n\n[target_leader.GetName]は船首に立ち、長いあいだ何も言わなかった。\n\n小舟が岸に着くころには、島の住民たちがすでに集まり、こちらを見つめていた。なかには鼻に小さな金の飾りをつけた者もいる。言葉よりも身振りで、その金がどこから来たのか尋ねると、彼らは内陸を指した。さらに南を指す者もいた。その先には、ここからは見えない丘があるようだ。"
 western_ocean_voyage_events.4.a: "旗を立てろ。ここがどこであれ、我らのものだ。"
 western_ocean_voyage_events.4.b: "インド諸島のどの記録とも一致しない。まだ領有を宣言するな。"
 western_ocean_voyage_events.4.columbus: "旗を立てろ。[target_leader.GetShortNameWithNoTooltip]は、ここがインド諸島だと確信している。"
 western_ocean_voyage_events.4.historical_info: "ヨーロッパ人とアメリカ大陸の先住民が初めて接触したのは、1492年のカリブ海だった。バハマ諸島に暮らしていたタイノ人は、自らの島を「グアナハニ」と呼び、岸辺に集まって到着した船々を迎えた。その後わずか1世代のうちに、タイノ人に免疫のない疫病が猛威を振るい、カリブ海諸島の民の大半が命を落とした。この航海がもたらした長期的な影響は、世界各地の生態系、経済、人口構成を大きく変えた。"
 western_ocean_voyage_events.5.title: "七都市の島"
 western_ocean_voyage_events.5.desc: "航海も半ばを過ぎたころ、船団は安定した風を受けて順調に西へ進んでいた。そんななか、航海士たちが[target_leader.GetName]のもとへ古い海図を持ってきた。この海図を描いた者たちは、この海を一度も航海したことがないが、[ShowAreaName('azores_area')]のはるか西に大きな島が描かれている。アンティリア——城壁に囲まれ、7つの都市が点在する島である。ウマイヤ朝軍が[ShowRegionName('iberia_region')]へ侵攻した際、難を逃れた司教たちが築いたと伝えられている。\n\n船上の誰もこの島を見たことはなく、実際に見つかるとも思っていない。だが、その海図は古く、描いた者たちは決して見識のない者たちではなかった。港にいるときならさほど気に留めない古い伝説も、何もない大海原ではにわかに重みを帯びてくる。"
 western_ocean_voyage_events.5.a: "古い海図が正しいかもしれない。これを頼りに進もう。"
 western_ocean_voyage_events.5.b: "海図には、実在しない島などいくらでも描かれている。"
 western_ocean_voyage_events.5.historical_info: "七都市の島アンティリアは、1424年にはすでにポルトガルやジェノヴァの海図に登場し、アゾレス諸島の西にある大きな島として描かれていた。伝説によれば、714年、ウマイヤ朝による征服が進むなか、7人の西ゴート人司教がイベリアを逃れ、西方の海に浮かぶ島に7つの都市を築いたという。大航海時代の航海によって実在しないと考えられるようになったあとも、この伝説は語り継がれた。数十年後、フランシスコ・バスケス・デ・コロナドがアメリカ南西部にあるという7つの黄金都市を求めて遠征した際、彼はこの古いヨーロッパの伝説にちなんでその目的地を名付けた。"
 western_ocean_voyage_events.6.title: "黄金のありか"
 western_ocean_voyage_events.6.desc: "通訳たちの意見はまるで一致しない。ある者は、島の住民が口にしたのは地名だと言い、別の者は民族の名前だと言う。さらに別の者は、南と内陸を指した身振りはそれぞれ別の問いへの答えであり、こちらの問いそのものが正しく伝わっていないのだと主張する。\n\n確かなのは方角だけだ。内陸へ、そしてさらに南へ。その先には、船員たちの誰も見たことのない山や川がある。[target_leader.GetName]は、いつか誰かが探すときの手がかりになるよう、噂と推測をもとにその方角を海図へ書き込ませた。"
 western_ocean_voyage_events.6.a: "食い違いも含め、そのまま記録しておけ。"
 western_ocean_voyage_events.6.b: "皆の意見が一致している点だけ記録しろ。内陸と金だ。"
 western_ocean_voyage_events.6.historical_info: "ヨーロッパ人がカリブ海に到来した当時の記録によれば、タイノ人は小さな金の装飾品を身につけていた。しかし、そうした金の品はすでに加工されたもので、現地で大量に採掘されている形跡はなかった。金がどこから来たのか身振りで尋ねると、島の住民たちは繰り返し内陸を指した。さらに南や西の土地を示したとする記録もある。その後、探検家たちがアメリカ大陸で金を探す場所を大きく左右したのは、確かな発見よりも、こうした伝聞や誤訳だった。"
 western_ocean_voyage_events.7.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた航海報告"
 western_ocean_voyage_events.7.desc: "船団がついに港へ帰還した。船体は塩にまみれ、ひどく傷んでいる。帰還から数日後、[ROOT.GetCountry.GetGovernment.GetCourtTitle]で[target_leader.GetName]の航海報告が読み上げられた。そこには、訪れた島々や大洋横断の航海、見慣れぬ鳥や奇妙な果実について記されており、我々の存在すら知らなかった人々が身につけていた金の装飾品についても触れられていた。\n\n報告の大半を疑う声もあったが、その内容はすべて記録に残された。これまで空白だった海図の西端にも、新たな情報が慎重に書き加えられはじめた。"
 western_ocean_voyage_events.7.desc.later: "船団はついに入港を果たした。塩にまみれ、傷だらけになりながらも。そして数日のうちに、我々は[ROOT.GetCountry.GetGovernment.GetCourtTitle]で[target_leader.GetName]の記録を読み上げる。この島々には、我らより先に別の王の船乗りたちが到達しており、その報告はとうに諸宮廷を巡っていた。\n\nとはいえ、我が船団も同じ大洋を渡り、無事に帰り着いた。これは決して小さな成果ではない。我が水先案内人たちは今や西の風を自らの知識として掴んでおり、それはいかなる外国の海図も教えてくれぬものだ。"
 western_ocean_voyage_events.7.a: "報告はそのまま記録に残そう。"
 western_ocean_voyage_events.7.historical_info: "遠征隊が帰還すると、上陸から数ヵ月のうちに、その報告書や証言は西ヨーロッパ各地の王宮で読み上げられ、その内容は各地の言語に訳され、広く伝わっていった。こうした報告には翻訳の過程や語り手の思惑によって誇張や誤りも混じっていたが、ヨーロッパ人がまだ実際に目にしていない内陸の富が語られていた。後の世代の探検家たちをさらに内陸へ、さらに南へと駆り立てたのは、確かな発見ではなく、こうした伝聞であった。彼らが追い求めたのは、最初の到来者たちがわずかに垣間見た富の源だったのだ。"
 western_ocean_voyage_events.8.title: "大洋上の反乱"
 western_ocean_voyage_events.8.desc: "それは交代の見張り時に漏れた不満の呟きから始まり、主甲板で刃を抜く騒動へと至った。我らの船団の一隻で、乗組員が士官たちを船倉に閉じ込め、海を越えて言葉を寄越してきた。夜明けとともに故郷へ舵を切る、それを阻もうとする船には乗り込んで戦う、と。\n\n [target_leader.GetName] は手すりに立ち、二つの船体の間の距離を見定める。 [target_leader.GetHerHim] の背後では、忠実な乗組員たちが [target_leader.GetSheHe] がどう動くかを見守っている。"
 western_ocean_voyage_events.8.a: "反乱者たちに船を渡し、故郷へ帰らせよう。"
 western_ocean_voyage_events.8.b: "乗り込め。大洋の船上に評議会などない。"
 western_ocean_voyage_events.8.fight_win_tt: "士官たちが勝利し、秩序を取り戻す"
 western_ocean_voyage_events.8.fight_lose_tt: "凄惨な戦いが繰り広げられ、船団は代償を払う"
 western_ocean_voyage_events.8.c: "彼らにインディアスのこと、そこに待つ黄金のことを語ろう。"
 western_ocean_voyage_events.8.rouse_tt: "[target_leader.GetNameWithNoTooltip] の言葉で船員たちの士気が再び高まる"
 western_ocean_voyage_events.9.title: "船倉の熱病"
 western_ocean_voyage_events.9.desc: "樽の水は緑色に変わり、塩漬け肉には虫が這っている。まず数人の兵が熱に倒れて寝台に伏し、次には十数人、そしてついには士官たちが当直を組むのもままならぬほどになった。外科医は瀉血を施し、浄化を試みたが、もはや打つ手がない。\n\n健康な者たちは病人を見やり、そして何もない水平線を見つめる。皆が思っていることを、誰も口には出さない。"
 western_ocean_voyage_events.9.a: "帆を縮め、熱が引くまで病人の世話をする。"
 western_ocean_voyage_events.9.b: "一日たりとも無駄にはできぬ。死者を弔い、航海を続けよ。"
 western_ocean_voyage_events.9.historical_info: "十五世紀における長距離の航海を制限していたのは、航海術そのものよりも船が積載できる量であった。木樽に蓄えられた水は数週間で腐り、塩漬けの食料も暑さで傷み、狭い船倉に詰め込まれた乗組員の間では熱病や赤痢が蔓延した。大西洋の外洋へ向かう船長たちは、行ける最後の港――多くはカナリア諸島やカーボベルデ諸島――で新鮮な物資を積み込んだ。一度そこを離れれば、補給の術はもはやどこにもなかったからである。"
 western_ocean_voyage_events.10.title: "世界の果て手前の帰還"
 western_ocean_voyage_events.10.desc: "誰もが予期していたよりもはるかに早く、船団は港へと帰ってきた。船倉にはまだ半分の荷が残り、乗組員も無事であった。彼らは陸を見つけることはできず、ただ果てしない海と、故郷からの遠さを忘れさせてくれない風があるばかりだった。\n\n宮廷では、この航海について語る者がいたとしても、声を潜めて話すのみである。それでも水先案内人たちは航海日誌をつけ続け、我らの西方海域の海図は、以前よりわずかに先まで伸びることとなった。"
 western_ocean_voyage_events.10.a: "海は次の機会まで、そこにあり続けるだろう。"
 western_ocean_voyage_events.11.title: "消息を絶ったまま"
 western_ocean_voyage_events.11.desc: "西へ向かった船団から何の便りもないまま、数か月が過ぎた。やがて一年が過ぎた。航海に出資した商人たちは自らの持ち分を損失として処理し、乗組員の家族たちも港の壁で待つのをやめてしまった。\n\n船が嵐で難破したのか、外洋で水が尽きたのか、あるいはただ何もなくなるまで進み続けたのか――それを知る者は誰もいないだろう。我らの手元に残されたのは、船団が既知の世界の果てを越える前に故郷へ送った、最後の報告だけである。"
 western_ocean_voyage_events.11.a: "海が彼らを連れ去ったのだ。魂の安らぎを祈ろう。"
 western_ocean_voyage_events.11.historical_info: "未知の海域への大西洋航海は、しばしば痕跡すら残さずに終わった。ジェノヴァ出身のヴィヴァルディ兄弟、ウゴリーノとヴァディーノは、1291年にジブラルタル海峡を通って西へ向かい、インドへの海路を求めたが、二度と消息を絶った。二世紀後、ポルトガルのコルテ＝レアル兄弟、ガスパールとミゲルもまた、1501年と1502年にそれぞれ北西大西洋への航海で行方知れずとなった。"
 western_ocean_voyage_events.13.title: "海草の海"
 western_ocean_voyage_events.13.desc: "幾日もの間、船団は黄緑色の海草が浮かぶ草原のような海域を航行してきた。場所によってはあまりに密生しており、船体の進みを阻んでいるようにすら見える。古参の船乗りたちは、これは浅瀬が近い兆しであり、誰かが気づく前に船団がどこかの沈んだ岸に乗り上げるだろうと言い張る。\n\n[target_leader.GetName] は測鉛索の準備を命じた。男たちは水面を見つめ、それが何を告げるかを待っている。"
 western_ocean_voyage_events.13.a: "船を止め、水深を測れ。"
 western_ocean_voyage_events.13.b: "海草は暗礁ではない。針路を保ち、突き進め。"
 western_ocean_voyage_events.13.c: "我らの水先案内人は、これを浅瀬ではなく海流と読んでいる。"
 western_ocean_voyage_events.13.historical_info: "サルガッソ海は、浮遊するホンダワラ(サルガッスム)の藻に覆われた北大西洋の海域で、カナリア諸島からカリブ海へと至る航路を横切っている。コロンブスの船団は1492年9月にこの海域へ入った。乗組員たちは、この藻が浅瀬の存在を示すものだとか、船を絡め取ってしまうのではないかと恐れたが、測鉛を下ろしても底は見つからず、船団は無事に通り抜けた。"
 western_ocean_voyage_events.14.title: "陸地の兆し"
 western_ocean_voyage_events.14.desc: "見張りが、船首を漂い過ぎる彫り削られた棒切れを見つけ、続いて葉と木の実をつけたままの緑の枝が流れてくる。夕暮れには鳥の群れが頭上を通り過ぎていく、どれも同じ方向、南西へと向かって。\n\nまだ誰もその言葉を口にはしない。だが数日前に引き返せと騒いでいた者たちが、今では見張りの交代のたびに手すりに群がり、水平線を見つめている。"
 western_ocean_voyage_events.14.a: "鳥を追え。陸地はそう遠くないはずだ。"
 western_ocean_voyage_events.14.b: "航海日誌に記し、針路はそのまま維持せよ。"
 western_ocean_voyage_events.14.historical_info: "1492年10月、陸地到達の数日前、コロンブスの航海日誌には、彫り削られた棒切れ、木の実のついた枝、葦、そして南西へ飛ぶ大群の鳥についての記録が残されている。10月7日、彼は鳥の群れを追って針路を変更し、この変更が五日後に船団をバハマ諸島へと導いた。"
 western_ocean_voyage_events.15.c: "我らの水先案内人はこの空を知っている。凪いだ方角へ舵を取れ。"
 western_ocean_voyage_events.16.c: "我らの水先案内人は風の戻る場所を知っている。行って見つけ出せ。"
