 cape_route_to_india_events.ship_lost_tt: "船1隻が失われ、遠征隊の規模が縮小する（船#R -1#!隻）"
 cape_route_to_india_events.cargo_loaded_tt: "船倉には多くの[ShowGoodsName('pepper')]が積まれている。航海の生存者が富を増すほど、持ち帰られる積荷も多くなる"
 cape_route_to_india_events.cargo_spent_tt: "船倉が軽くなる。この好意を買うために費やされた積荷は、航海終了後に売却されない（積荷#R -20#!）"
 cape_route_to_india_events.pilot_gained_tt: "経験豊富な水先案内人が艦隊を導いており、カリカットの統治者と交渉する際に、より懸命な助言をもたらす"
 cape_route_to_india_events.19.title: "海の病"
 cape_route_to_india_events.19.desc: "それはいつものように、歯肉から始まる。歯肉が柔らかくなり、出血し、やがて歯がぐらつき出す。何年も前に癒えたはずの古傷が、切られたばかりのように再び裂ける。男たちは活気を失い、息切れを起こし、やがてハンモックから起き上がれなくなる。治療法はなく、船医も匙を投げる。艦隊のはるか長旅を支えてきた魚の塩漬けもコクゾウムシの湧いた乾パンも、この病を癒やすことはできない。毎朝の点呼のたびに、答える声が減っていく。遺体はその主のハンモックに包まれて船べりから投げられる。艦隊を歓迎してくれる海岸は、無慈悲なほどに先にある。"
 cape_route_to_india_events.19.a: "最後の果実を配給し、陸へ急ごう。"
 cape_route_to_india_events.19.b: "できることはない。遺体を海葬し、生きている者たちのために祈ろう。"
 cape_route_to_india_events.19.b.tt: "乗組員の多くは生き残らない。航海から得られる利益が減少する"
 cape_route_to_india_events.19.historical_info: "ビタミンCの欠乏によって引き起こされる壊血病は、遠洋航海時代における船員の最大の死因だった。ヴァスコ・ダ・ガマの$india$への初の航海では、148人中推定93人が死亡した。その大半は、新鮮な食料から遠く離れた外洋の長い区間で、壊血病によって命を落としたものだった。壊血病の原因が正確に解明されるのは2世紀半後のことで、船員や医師たちは新鮮な糧食、特に柑橘類がなぜか病を食い止めるという事実だけは理解していた。だがこの知識は、何度となく学ばれては忘れられることになる。"
 cape_route_to_india_events.20.title: "南からの強風"
 cape_route_to_india_events.20.desc: "気圧計は警告を発していたが、それを読み取れる者がいなかった。雲ひとつない空のもと、南西から長く重いうねりが押し寄せていた。すると、空から晴れ間が消えた。風は激しさを増し、波頭を切り裂いては水面に泡を吹き散らした。誰一人として言葉にできないほどの高い波が押し寄せる。灰緑色の波の壁には泡の筋が走り、流れる雲に向かって船体を船尾から突き上げ、波間へと突き落とし、そこでわずか一瞬、風が不気味に止む。暗闇のどこかで、ほかの船が位置を知らせるために砲撃を放つも、その響きはほとんど一瞬で轟音にのみ込まれる。もはや針路を取ることはかなわず、海に任せるしかない。"
 cape_route_to_india_events.20.a: "帆を畳んで船を停めよ。あとは、船を信じるのみだ。"
 cape_route_to_india_events.20.b: "ぎりぎりまで帆を畳んで風下に進むぞ。船尾から大波が襲ってこないことを祈るばかりだ。"
 cape_route_to_india_events.20.b.win_tt: "賭けは上手くいき、船団は嵐の最も激しい部分から逃げ切る"
 cape_route_to_india_events.20.b.lose_tt: "船団は海に翻弄される"
 cape_route_to_india_events.20.historical_info: "南アフリカの海域は、温かいアガラス海流と南極海から北上してくる大西洋のうねりがぶつかる場所で、その過酷さは世界屈指であり、現在に至るまで、大型船すら耐えられない可能性のある一発大波が記録されている。大航海時代の小型船、つまりはキャラックやキャラベルといった数百トン級の船にとって南大西洋の強風は致命的な脅威で、喜望峰周辺の航路が当初「嵐の岬」と呼ばれていたのは、決して大げさではなかった。"
 cape_route_to_india_events.21.title: "凪いだ海"
 cape_route_to_india_events.21.desc: "昼に凪いだ風は、戻ってこなかった。帆は力なくマストに垂れ下がり、波のうねりで船が揺れるたびに無意味にばたつくばかりだった。翌日、海面はさながらガラスのようになった。熱気に揺らめく水平線まで、眩い巨大な鏡が広がっているようだ。甲板の継ぎ目でタールが溶けている。樽の水はぬるくなり、緑色になって悪臭を放っている始末だ。できるのは待つことだけ。ただ太陽を眺め、船の木材が軋む音を聞き、立ち往生した男たちによって消費されていく食糧の残り具合を数えないようにしつつ待つことしかできない。水兵たちが、声をひそめて幽霊船の話をしている。目と鼻の先で吹いている風を捉えられず、何年も経ってから屍だけを乗せて漂流しているところを発見された船の話だ。"
 cape_route_to_india_events.21.a: "風を待とう。ほかにできることは何もない。"
 cape_route_to_india_events.21.b: "ボートを出して船を曳航させろ。凪に身を任せるよりはマシだ。"
 cape_route_to_india_events.21.historical_info: "ドルドラムズ、あるいは熱帯収束帯と呼ばれる赤道付近の無風帯は、南半球を行き来する際に通る大西洋の難所として悪名高かった。帆船はそこで数日、時には数週間も凪に捕まり、まったく前進できないまま食糧と水を浪費する羽目に陥ることがあったのだ。まさにこの無風帯と逆風こそ、ポルトガルの航海者たちが「ヴォルタ・ド・マール」を発展させた理由にほかならない。これは大西洋を大きく西進してブラジルのあたりまで進み、そこで南下に使える風を捉えてから喜望峰に向かって東向きに戻る航法である。"
 cape_route_to_india_events.22.title: "船体を蝕む虫"
 cape_route_to_india_events.22.desc: "それに気づいたのは、いつものように船底を点検している船大工だった。錐から伝わってくる感触が柔らかく、水面下の板材を調べてみると、鉄のように硬いはずのそれに苦もなく工具をめり込ませられる状態だった。フナクイムシだ。暖かい熱帯の海にはこいつらが大量に生息しており、艦隊が赤道を越えて以来ずっと船体に穴を掘りつづけていた。フナクイムシは何千もの白っぽい食痕で木材の内側を穴だらけにし、板材が耐えられなくなるか、排水が追いつかなくなるまで存在がはっきりと露見することはない。そして放置して食い荒らされた船は、いずれ継ぎ目から裂け、そのまま船員もろとも沈没することになる。[target_leader.GetName]は、船大工が口を開くより前に、その表情ですべてを察した。"
 cape_route_to_india_events.22.a: "船を傾けて修理し、木材に巣食うフナクイムシを焼くのだ。"
 cape_route_to_india_events.22.a.tt: "修理には時間と費用がかかるが、船団は救われる"
 cape_route_to_india_events.22.b: "最も状態が悪い船を解体して積荷と木材を回収し、その船は放棄しろ。"
 cape_route_to_india_events.22.c: "友好的な港に向かい、そこで船をきちんと修理しよう。"
 cape_route_to_india_events.22.c.tt: "安全な港できちんと修理し、船団の士気が回復する"
 cape_route_to_india_events.22.historical_info: "フナクイムシ（学名#italic Teredo navalis#!）は名前の通りの昆虫ではなく、海に生息する二枚貝の一種である。この貝は温暖な海域を航行する木造船の悩みの種で、無防備な船であればほんの1シーズンで破壊してしまう。船体を鉛で覆ったり、ピッチや獣脂を塗ったり、あるいは外層は食べられる前提で船板を二重にしたりというように、食害を防ごうと数世紀にわたってさまざまな対策が講じられた。$india$航路での被害は特に深刻で、ポルトガルは最終的にインド洋の複数拠点に修理施設を造った。これらは航海の合間に船を入れて傾け、船体を削って修理するためだけに使われた専用の施設だった。"
 cape_route_to_india_events.24.title: "反乱"
 cape_route_to_india_events.24.desc: "士官が近づくと止まる密やかな会話、命令に従う際の不満気な緩慢さ、そして顔つき。兆候は数週間前からあったが、ついに表面化した。船首楼に船員たちが集まり、そのうちの1人は縄作業に使う先のとがった道具を握りしめている。彼らの向こうには、どちらに付くかまだ決めかねているほかの船員たちがいる。反乱者たちはこのままでは命を捨てることになると怯えており、引き返して[ROOT.GetCountry.GetReligion.GetAdjective]の港に向かうよう要求している。大勢の海の男たちを呑み込んできた海域に進むのはごめんだというわけだ。[target_leader.GetName]は独りで後甲板の境目に立っている。次の1分の[target_leader.GetSheHe]の対応で、この航海が続くかどうかが決まる。"
 cape_route_to_india_events.24.a: "首謀者たちを陸に降ろし、弱気になっている者にも下船を認めよう。"
 cape_route_to_india_events.24.b: "連中を鎮圧しろ。船の行き先は多数決で決めるものではない。"
 cape_route_to_india_events.24.fight_win_tt: "士官たちが勝利し、秩序が回復する"
 cape_route_to_india_events.24.fight_lose_tt: "凄惨な戦いが繰り広げられ、船団は代償を払う"
 cape_route_to_india_events.24.c: "富と名誉が手に入る$india$のことを話そう。"
 cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip]の言葉で船員たちの士気が再び高まる"
 cape_route_to_india_events.25.title: "人けのない海岸"
 cape_route_to_india_events.25.desc: "風下のもやのなかから、丈の低い植物が生えた海岸が姿を現した。煙も帆も、人の手が入った形跡もなく、ただ波打ち際まで森が広がっている。森の向こうまで行けば真水と、土着の動物にありつけそうだ。この土地は海図に載っていない。手付かずかつ未知の場所には、何が待ち受けているかわからない。飲める泉や容易に狩れるものが見つかるかもしれないし、あるいは熱病や、木陰に隠れてこちらを見張る敵対的な連中に遭遇するかもしれない。とは言え樽に残っている水はわずかで、憔悴した船員たちの目は落ちくぼんいる。そしてなんにせよ、陸地であることに変わりはないのだ。"
 cape_route_to_india_events.25.a: "ボートを海岸に送れ。水と、陸で手に入る物資を調達するんだ。"
 cape_route_to_india_events.25.b: "この海岸に上陸するのは危険すぎる。記録だけして航海を続けよう。"
 cape_route_to_india_events.26.title: "交易をしたがる沿岸部の人々"
 cape_route_to_india_events.26.desc: "この沿岸部には人が住んでいて、敵意はなさそうだ。船団が近づくと、海岸から数隻のカヌーが出てきた。彼らは最初は警戒していた様子だったがやがて大胆になり、魚や果物を掲げ、急ごしらえの市場らしきものが出来上がりつつある浜辺の方を身振りで示してきた。何者であれ、この沿岸部の支配者は素性の知れない連中と争うつもりはなく、船団が[ShowGoodsName('iron')]と[ShowGoodsName('cloth')]を積んでいるのを見て交易をしたくなったようだ。このあたりは物資の補給が難しい海域が延々と続くため、まさに渡りに船だ。樽を水で満たし、新鮮な食べ物を買い、船員たちを悪意のない人々がいる陸に上がらせてやることができる。"
 cape_route_to_india_events.26.a: "[ShowGoodsNameWithNoTooltip('iron')]と[ShowGoodsNameWithNoTooltip('cloth')]を、積める分だけ新鮮な食糧と交換せよ。"
 cape_route_to_india_events.26.b: "日程に余裕がない。水だけ補給して先を急ぐぞ。"
 cape_route_to_india_events.27.title: "船も人も失われて"
 cape_route_to_india_events.27.desc: "最後の船も失われた。海に呑まれたのか、船員たちが病や絶望に倒れたのか、それとも海岸で襲われて命を落としたのか、いずれにせよ、いかなる末路をたどったのか故郷の者たちが知ることはない。唯一確かなのは、盛大な式典で送り出した船団はもう二度と戻らないということだ。[ShowGoodsName('pepper')]でいっぱいの船倉も、輝かしい帰還も、$india$航路の海図も目にすることはない。アフリカの沿岸と東方の富を結ぶ、巨大な孤を描く航路のどこかで、遠征隊はただ壊滅した。そして、彼らは初めから存在しなかったかのように海がすべてを呑み込んだ。リスボンでは家族たちが待ちつづけるだろう。数ヵ月、そして数年と待ちつづけたすえに、彼らは理解するのだ。"
 cape_route_to_india_events.27.a: "彼らを[ROOT.GetCountry.GetReligion.GetGodName]の御手に委ねん。当分のあいだ、挑戦は控えよう。"
 cape_route_to_india_events.27.historical_info: "$india$への航路は、おびただしい数の犠牲を出して切り開かれた。成功したとされる航海であっても、乗員の半分や一部の船を失うのが当たり前で、失敗した航海ともなれば、船団が丸ごと壊滅し、「船団が帰還しなかった」という記録以外何も残らなかった。その後の1世紀でインド航路に挑んだ船のうち、かなりの割合が戻ってはこなかった。アフリカ沿岸で難破した船もあれば、南方の海の暴風に沈没した船や、ただ消息を絶った船もあった。リスボンに莫大な富が流れ込んだのは事実かもしれないが、その代償として少なからぬ人々が海に呑まれ、あるいは熱病で命を落としたことは忘れるべきではない。"
 cape_route_to_india_events.28.title: "[ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]への上陸"
 cape_route_to_india_events.28.desc.empty: "特筆することもない海に、黒い火山岩でできた10個の島々が突き出ている。どの島にも住民はおらず、煙も帆も旗も見当たらない。海鳥がいるほかは、風や灰にまみれた汽水の泉がいくつかあるだけだ。古い海図に載っている島々だが、どの国も入植したことはない。我々の航路で必ず通ることになる海域に位置しており、[target_leader.GetName]はその価値を熟知している。[ShowProvinceDefinitionName('cape_verde_province')]を支配する者は、[ShowContinentName('atlantic_ocean_continent')]への玄関口を支配することになる。そしていま、ここは誰にも支配されていない。"
 cape_route_to_india_events.28.desc.foreign: "[rival_owner.GetAdjective]の旗が[ShowLocationName('santiago')]の停泊地ではためいている。[rival_owner.GetName]が我々より先にこの島々へ到達し、すでに拠点を築いていたのだ。守備隊が駐留し、砲台が設置されており、港長がボートを漕ぎ、用件を確認するために訪ねてきた。口調こそ丁寧だが、我々を歓迎していないことが伝わってくる。この島々は我々の航路で必ず通ることになる海域に位置しており、そこを[rival_owner.GetAdjectiveWithNoTooltip]に掌握されたというのは、南方へ向かうすべての船が、喉元にナイフを突きつけられた状態で航海することになるも同然だ。[target_leader.GetName]は船縁から連中の要塞を観察し、何も言わずに考え込んでいる。"
 cape_route_to_india_events.28.a: "島々の領有を宣言しよう。わが国の旗を掲げる[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]を建設するのだ。"
 cape_route_to_india_events.28.b: "上陸し、島々で水と物資を集めろ。"
 cape_route_to_india_events.28.c: "この島々を勝手に使うわけにはいかない。南に進もう。"
 cape_route_to_india_events.28.d: "祖国に帰るぞ。"
 cape_route_to_india_events.28.historical_info: "カーボベルデ諸島は1456年にポルトガルの航海者によって発見された。1462年から入植が始まったのだが、それ以前はまったく人が住んでいなかった。大西洋のなかほどに位置しており、北東の貿易風を捉えられることから、アフリカを回ったり、アメリカ大陸へ向かう航海に不可欠な中継地点となった。カーボベルデを支配した勢力は、南方を通るあらゆる航路の要衝を支配することになる。ポルトガルが海洋国家としての野心を膨らませるなか、この島々に入植して要塞化したのは決して偶然ではなかった。"
 cape_route_to_india_events.29.title: "石柱"
 cape_route_to_india_events.29.desc.rafael: "船団は広大で濁った川の河口に停泊した。水先案内人はすでに[ShowLocationNameWithNoTooltip('quelimane')]を「吉兆の川」と呼びはじめている。なぜなら船員たちは世界の半分を越え、ついに見たかったものを目にしたからだ。[ShowCultureGroupName('arabian_group')]系の艤装をした現地の船や、$india$を指す言葉を知っており、口にしながら東を指し示す商人たち。インド到達は目前ということだ。船倉には、まさにこのために本国から運んできた加工済みの石灰岩の柱がある。上端部に十字架と王家の紋章を備えたこの柱を1本陸に持っていくか、船大工が尋ねてきた。設置すれば確固たる形で権利を主張できるうえに、石工たちが作業している間に真水と木材を積み込める。ただし、それには数日を要する。船団にそんな時間の余裕はないかもしれない。"
 cape_route_to_india_events.29.desc.maria: "このあたりの沖には海抜の低い小島がいくつか存在し、植物が生えているほか、水も豊富で、潮のうねりからも守られている。疲弊した船団にとって黄金以上に価値がある土地だ。$india$まであと少しで、船で数日南下すればマラバール海岸にたどり着ける。船倉には、まだ石灰岩の柱がある。柱は航海に出る前に加工され、文字も刻んであるため、わが国の船が最初にこの海域に到達したことを宣言する準備は整っている。設置すれば、船にいる誰よりも長く残る記念碑となるだろうが、そうなると式典に加え、船を傾けての整備や水の補給もおこなわなくてはならない。季節が移り変わろうとしているなかで、船団が足止めされることになってしまう。"
 cape_route_to_india_events.29.desc: "この海岸には記念碑を置く価値がある。そして船倉には本国から持ってきた、加工済みの石灰岩の柱が入っている。柱の上端部には十字架と王家の紋章があしらわれており、岬に建てることでわが国の船が最初にこの地に到達したことを宣言できる。設置は厳粛な行事で時間もかかるため、石工たちが柱を建てている間、船団は停泊して待たなければならない。"
 cape_route_to_india_events.29.a: "パドランを設置せよ。石柱と十字架で、我々がここを通ったことを示すのだ。"
 cape_route_to_india_events.29.b: "式典をおこなっている時間はない。水と物資を積み込んだら出発するぞ。"
 cape_route_to_india_events.29.historical_info: "パドランは、上端部に十字架とポルトガルの紋章があしらわれた石柱である。加工済みの状態で船に載せ、新たに到達した沿岸部に建てることで発見と主権を主張するために使われていた。人文主義者のダミアン・デ・ゴイスによると、ヴァスコ・ダ・ガマの船団は$india$までの道のりで5本のパドランを建て、「吉兆の川」のものはサン・ラファエル、モザンビークのものはサン・ジョルジェ、マリンディのものはエスピリトサント、小島のものはサンタ・マリア、そしてカリカットのものはサン・ガブリエルと呼ばれていた。この石柱は以前の遠征で使われていた腐食しやすい木製の十字架に代わり、耐久性を重視して導入されたもので、実際、数世紀にわたって朽ちなかった。"
 cape_route_to_india_events.30.title: "航海の放棄"
 cape_route_to_india_events.30.desc: "命令が下されると、異議を唱える者は船におらず、ただ安堵か失望の表情を浮かべただけだった。船首の向きが変わると、背後にある未知の海岸が遠ざっていく。前方に待ち受けるのは、通ったことのある長い帰路だ。$india$の海図を作れず、[ShowGoodsName('pepper')]も持ち帰れず、東方への航路の第一発見者として歴史に名を残すこともできない。だが船は無事で、船員たちも生きている。そして母国の港への帰還は願望ではなく確かなものとなった。\n\n[target_leader.GetName]は船尾の向こうの水平線を長いこと眺めたあと、これからすべきことの数々に意識を切り替えた。[target_leader.GetHerHis]の航海は、まだ終わっていないのだ。"
 cape_route_to_india_events.30.a: "仕方ない。多少でもわかった情報を持ち帰ろう。"
 cape_route_to_india_events.30.historical_info: "アフリカ沿岸を南下したポルトガルの遠征隊がすべて、最終目標としていた場所まで進んだわけではない。船長たちはたびたび、リスクを取って未知の海域を渡るべきか、あるいは集めた船と乗組員を温存すべきかの判断を迫られていた。そして実際のところ、新たに発見した海岸線の部分的な情報を持ち帰るほうが賢明だと判断されることが多かった。$india$に到達できなかったとはいえ、このような航海により徐々に海図が充実していき、そして一世代に及ぶ未完の航海で集まった知識が最終的に、ヴァスコ・ダ・ガマによるインド航路開拓成功へとつながったのである。"
 cape_route_to_india_events.31.title: "ポルトガル人による[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]の建設"
 cape_route_to_india_events.31.desc: "彼らの船長は射撃手ではなく贈り物を携えて上陸し、3日間の話し合いを経て条件がまとまった。[ShowBuildingTypeName('por_feitoria')]を建てられるよう彼らに海辺の区画を貸し与える代わりに、我々の国庫に賃料を収めること。双方の人員のあいだで揉め事が起こった場合は、我々の裁判所が裁くこと。そして彼らの船団が、この港を我々の敵対勢力から守ること。条件が決まると、彼らは寸法に合わせて切ってある木材を船倉から持ち出し、ほんの数日で拠点を作り上げた。\n\n[ShowBuildingTypeName('por_feitoria')]ではわが国のものと一緒に[por_feitoria_builder.GetName]の紋章も掲げられ、眼下の停泊地はここ数十年で初めての賑わいを見せている。今後、孫世代に恨まれることになるかもしれないが、いまのところは上々な取引に思える。我々は火薬に布、そして大砲を持った友を得て、彼らは倉庫と波止場を得たのだ。"
 cape_route_to_india_events.31.a: "契約は契約だ。わが国の宮廷は、他国の軍隊に苦い顔をするだろうがな。"
 cape_route_to_india_events.31.b: "書面にせよ。両国で賃料と権利を明確にするのだ。"
 cape_route_to_india_events.31.historical_info: "すべてのフェイトリアが、砲撃をちらつかせて建てられたわけではない。モンバサと長年対立していたマリンディのスルタンは、ヴァスコ・ダ・ガマの艦隊を有用な味方とみなし、カリカットまで渡るための水先案内人を提供した。マリンディはその後数十年にわたってスワヒリ海岸におけるポルトガルの同盟国でありつづけ、まずポルトガルの商館を、のちには要塞を受け入れた。早い段階で条件を取り決めた統治者たちは、ポルトガルの商品を入手できたほか、同国の海軍による保護を受けてそれぞれの敵に対抗できた。統治者のなかには、この協定を利用して積年の恨みを晴らした者もいた。こういった取引はほとんどが不平等だったが、合意のもとに成立した場合は、武力によって押し付けられた場合よりはるかに長続きする傾向があった。"
