l_japanese:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "艦隊の出航"
 cape_route_to_india_events.1.desc: "わが国の海でこれほどの艦隊を見たのは一世代ぶりである。[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]から$india$への海路を発見せよとの命を帯び、数年分の[ShowGoodsName('salt')]、[ShowGoodsName('fish')]、乾パンを積んだ船4隻、そして乗組員170名。司祭たちが船体を祝福し、群衆が水際へと押し寄せる。涙を流す者もいる。\n\n[target_leader.GetName]が船首に立つなか、船団が砂州を抜け、広い[ShowContinentName('atlantic_ocean_continent')]へ出る。その背後で港が小さくなり、緑の丘に浮かぶ白い染みのようになる。その眼前には、境界のない海がどこまでも広がる。[target_leader.GetNameWithNoTooltip]は何度も計算した。この航海に何が必要か理解している。だがそれが十分かどうかは、いつものように[ROOT.GetCountry.GetReligion.GetGodName]のみぞ知る。"
 cape_route_to_india_events.1.a: "[ROOT.GetCountry.GetReligion.GetGodName|U]の加護があれば、我々は香辛料を満載して帰還するだろう。"
 cape_route_to_india_events.1.b: "祈りを捧げ、全速力で進もう。"
 cape_route_to_india_events.1.historical_info: "$india$海路発見を目指したポルトガルの遠征は、1世紀近くにわたってアフリカ沿岸を段階的に南下した探検の集大成だった。1488年にはバルトロメウ・ディアスが喜望峰を回り、実現可能な海路であることを証明していた。そしてヴァスコ・ダ・ガマが1497～99年の航海で使命を果たし、遠征費の60倍に相当するコショウと香辛料を持ち帰った。この航海は世界の香辛料交易を根本から変え、陸上交易路におけるヴェネツィアとオスマンの独占を打ち破った。"
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "[ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]諸島"
 cape_route_to_india_events.2.desc: "何もない平坦な海にそびえ立つ10の火山島、[ShowProvinceDefinitionName('cape_verde_province')]諸島。艦隊はこの島々があることを知っていたが、それでも数週間にわたる外洋航海を経て目にした大地は安らぎだった。[ShowLocationName('santiago')]には質素な漆喰の石造りの総督邸が建ち、港には塩や干し魚の匂いが漂い、岩から削られたオルキル染料の苔もかすかに香る。\n\n[target_leader.GetName]は選択肢を吟味する。[ROOT.GetCountry.GetName]はこの島々を数十年にわたって保持してきたが、「保持」とは言葉ばかりである。実情は小規模の守備隊、わずかな入植者、そして年に一度の補給船に過ぎない。この航路が[ROOT.GetCountry.GetNameWithNoTooltip]の未来に重要なのであれば、ただの寄港地として存続させることはできない。"
 cape_route_to_india_events.2.a: "この諸島に投資し、南進航路を守る拠点にする。"
 cape_route_to_india_events.2.b: "新鮮な水などを補給したら出航する。"
 cape_route_to_india_events.2.c: "先へ進もう。留まるには早すぎる。"
 cape_route_to_india_events.2.d: "帰還する。"
 cape_route_to_india_events.2.historical_info: "カーボベルデ諸島は1456年ごろにポルトガルの航海士たちによって発見され、1462年から本格的な入植が始まった。北東貿易風を捉える大西洋上の位置のため、南アメリカやアフリカ周回に向かう航海の重要な中継拠点となった。ヴァスコ・ダ・ガマの航海によってインド海路が証明されると、その戦略的重要性は大幅に高まる。16世紀には、同諸島は大西洋奴隷貿易の主要な拠点だった。"
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "[ShowLocationNameWithNoTooltip('sao_tome')]島"
 cape_route_to_india_events.3.desc_common: "海岸線が見えるよりも先に暑さがやってきた。艦隊が赤道を越えるや否や湿気た息苦しい空気が甲板に立ち込め、一服の涼もなく男たちを喘がせる。すると朝靄のなか、深緑の王冠のように[ShowLocationName('sao_tome')]が姿を現す。2つの峰が雲を引き、地表に光が届かないほど鬱蒼とした森を滝が縫うように流れ落ちている。"
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\n西側の海岸には小さな集落がへばりついている。入植者たちによれば、ここの土壌は驚くほど肥沃で、植えたものは何でも育つという。この島で砂糖を作って一財産を築くこともできるだろう、労働力さえ確保できれば。"
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\n海岸から上がる煙は見当たらず、入り江に浮く船もない。島には人ひとりおらず、この浜に最初に足を着けるのは艦隊の者たちだ。それでいて、ジャングルを切り開いた先にある土壌は黒々と深く、どこまでも肥沃である。この島で砂糖を作って一財産を築くこともできるだろう、労働力さえ確保できれば、そして赤道の熱病に先に命を奪われなければ、だが。"
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\n西側の海岸には、わが国ではない旗のもとに、すでに開拓地がへばりついている。波止場、礼拝堂、そして開墾されたばかりのサトウキビ畑が広がる。すべて[ROOT.GetCountry.GetName]よりも先にこの肥沃な島にたどり着いた[rival_owner.GetAdjective]の入植者たちのものだ。土壌は噂に違わず極めて肥沃だが、先客がいる。わが国が[ShowLocationNameWithNoTooltip('sao_tome')]から何を望むにせよ、[rival_owner.GetNameWithNoTooltip]から奪い取るか、交渉で手に入れるしかない。"
 cape_route_to_india_events.3.a: "交易拠点を築こう。その島にはそれだけの可能性がある。"
 cape_route_to_india_events.3.a.owned: "島への投資を増やそう。[ShowLocationNameWithNoTooltip('sao_tome')]はもはや我々のものだ。"
 cape_route_to_india_events.3.b: "パドランを建て、島をわが王室のものにせよ。"
 cape_route_to_india_events.3.c: "新鮮な水を補給したら南下する。"
 cape_route_to_india_events.3.d: "帰還する。"
 cape_route_to_india_events.3.historical_info: "1470年ごろにポルトガルの航海士が到達した時点で、サントメは無人島だった。赤道直下の気候はヨーロッパの入植者にとって致命的で、病気による死亡率は高いものの、砂糖栽培に非常に適していることが判明する。1520年代までにサントメは世界最大のサトウキビ生産地となり、その労働のほぼすべてをアフリカからの奴隷労働が担った。その後2世紀以上にわたって、この島は大西洋奴隷貿易の主要な中継地だった。"
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "大河の河口"
 cape_route_to_india_events.4.desc: "ここでは海が茶色に変わる。艦隊は丸一日、その光景を見守っていた。南からの水で海が紅茶ように変色し、沈泥で濁っていく。そして、その原因が判明。乗組員の誰も見たことがないような、[ROOT.GetCountry.GetName]のどの川よりも広い川が茶色の激流となって[ShowContinentName('atlantic_ocean_continent')]へと注ぎ込み、数キロにわたり海を放射状に染め上げている。\n\nマングローブの縁から、カヌーが現れる。一本の丸太をくり抜いた舟は約9メートルと非常に大きく、十数名の男たちが完璧に息を合わせ漕いでいる。船首に立つ男たちは武装していない。これまで異国人を恐れる機会のなかった人々が、冷静な好奇心をもって艦隊を眺めている。"
 cape_route_to_india_events.4.a: "この地の[target_owner.Custom('GetRulerOrRegentTitle')]との謁見を求める。"
 cape_route_to_india_events.4.b: "[ShowGoodsNameWithNoTooltip('ivory')]でも[ShowGoodsNameWithNoTooltip('copper')]でもなんでも、彼らが提供する品と取引する。"
 cape_route_to_india_events.4.c: "河口を海図に記録して南へ進もう。時間を無駄にはできない。"
 cape_route_to_india_events.4.d: "帰還する。"
 cape_route_to_india_events.4.historical_info: "コンゴ王国はサブサハラアフリカで最も洗練された政治主体の一つで、現在のコンゴ、アンゴラ、ガボンにまたがる広大な領域を支配していた。マニコンゴ（国王）は階層化された官僚制を通じて統治し、高度な州統治制度を敷いていた。1480年代にポルトガルの宣教師が王国と接触し、双方にとって変革的でありながら、最終的には破滅的となる関係が始まった。王国は1490年代にキリスト教へ改宗し、マニコンゴはジョアン1世の名を戴いた。"
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "[ShowLocationNameWithNoTooltip('luanda')]湾"
 cape_route_to_india_events.5.desc: "遠征隊のすべての士官が、見た瞬間にその価値を理解した。アフリカ沿岸に、これほどの港はほかにない。長い弓状の湾で、自然の砂州が南西からの風雨を遮り、急深な海岸地形、背後には全方向を見渡せる低い岬。現地の漁民はそこをロアンダ——平らな場所——と呼ぶ。\n\n午後の陽光が砂州を照らし、片側には湾が広がり、もう片側には[ShowContinentName('atlantic_ocean_continent')]が開ける。[target_leader.GetName]は砂州の端から端まで歩きながら、すでに城壁について考えている。淡水について。ここに守備隊を駐屯させれば、どれだけの船を守れるか、あるいは拿捕できるか。ここに町を築けば、南大西洋交易そのものを支配できるかもしれない。"
 cape_route_to_india_events.5.desc.owned: "艦隊が入っていくのは、説明不要の価値を持つ湾だ。[ShowLocationName('luanda')]にはすでに[ROOT.GetCountry.GetName]の旗が翻り、その長く伸びた砂州はわが王国に従う船群を庇護している。\n\n午後の陽光が砂州を照らし、片側には湾が広がり、もう片側には[ShowContinentName('atlantic_ocean_continent')]が開ける。[target_leader.GetName]は砂州の端から端まで歩きながらここから、制したこの地からどれほどの利益を引き出せるかを考える。ここをさらに強化して町を築けば、南大西洋交易そのものを支配できるかもしれない。"
 cape_route_to_india_events.5.a: "ほかとは比べものにならないほど大きな[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]を築こう。"
 cape_route_to_india_events.5.a.owned: "[ShowLocationNameWithNoTooltip('luanda')]の拠点を、この沿岸最大のものへと拡張する。"
 cape_route_to_india_events.5.b: "小規模の交易・補給拠点を築こう。"
 cape_route_to_india_events.5.b.owned: "すでに所有する交易・補給拠点を拡張する。"
 cape_route_to_india_events.5.c: "海図にここの位置を記し、南へ進もう。"
 cape_route_to_india_events.5.d: "帰還する。"
 cape_route_to_india_events.5.historical_info: "ロアンダは1575年、パウロ・ディアス・デ・ノヴァイスのもとでポルトガル植民地として正式に入植が始まり、サブサハラアフリカで最も古い欧州人の入植地のひとつとなった。天然の良港で、4世紀以上にわたってポルトガル領アンゴラの中心的な港だった。16世紀以降、ロアンダは南部アフリカにおける大西洋奴隷貿易の主要な積み出し港となり、数百万人が奴隷としてブラジルやカリブ海地域へと送られた。"
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "砂漠海岸"
 cape_route_to_india_events.6.desc: "ここは砂漠が海まで続く地で、波が打ち寄せる赤い砂丘の頂から砂が舞い上がっている。木はない。淡水も見当たらない。北方の海岸には打ち上げられた鯨の死骸が白骨化し、乗組員たちは早くもここを[ShowLocationName('skeleton_coast')]と呼んでいる。数百キロ先を見渡しても、人の気配すらない。\n\nそれでも湾内は穏やかだ。荒波から守られたこの場所は、損傷した帆柱を修理し、砂丘の汽水の泉から水を補給する機会を与えてくれる。高台の上で、航海士が計器で太陽の高度を測定し、記録している。南へ１週間も航海すれば喜望峰に着くという。何人かは胸の前で十字を切った。"
 cape_route_to_india_events.6.a: "兵を鼓舞せよ！喜望峰まであと少しだ。前進！"
 cape_route_to_india_events.6.b: "潮流と風を読んでみる。"
 cape_route_to_india_events.6.c: "皆を休ませよう。先の嵐のために力を残す必要がある。"
 cape_route_to_india_events.6.d: "帰還する。この荒廃した海岸では、先に進むのは危険すぎる。"
 cape_route_to_india_events.6.historical_info: "ナミビア海岸は、強力な南西風により風下の海岸にクジラやアザラシの骨、そして難破船が多く打ち上げられたことから、ポルトガルの船乗りたちに「コスタ・ドス・エスケレトス」（スケルトンコースト）として知られていた。オランダが「ウォルビシュバイ」（クジラ湾）と名づけたウォルビス湾は、過酷な沿岸部において数少ない穏やかな錨地の一つであった。1488年にバルトロメウ・ディアスが、南下の途中でここに立ち寄った。"
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "嵐の岬"
 cape_route_to_india_events.7.desc: "3ヵ月に及ぶ航海を経験したが、この事態は予測しなかった。高さ十数メートルもの波を先駆けに、嵐がなんの兆候もなく南西から押し寄せる。先頭の船が波間に消え、姿を現すまで30秒かかった。動索が吹き飛ばされ、乗組員が索具から叩き落とされる。[target_leader.GetName]は船尾の欄干を両手で握りしめ、周りの混沌を見つめる。そして暴風と砕ける波の喧騒のなか、あることに気づく。彼らは切り抜けたのだ。壮大なアフリカ大陸の南端で、既知の世界の終端でもある喜望峰が、船尾の向こうにある。\n\n$india$への道が開かれたのだ。"
 cape_route_to_india_events.7.a: "喜望峰と名づけ、遅滞なく東へ進め！"
 cape_route_to_india_events.7.b: "嵐が過ぎ去るまで、岬の風下に避難せよ。"
 cape_route_to_india_events.7.d: "喜望峰を回った。これで十分だ。帰還しよう。"
 cape_route_to_india_events.7.historical_info: "バルトロメウ・ディアスが1488年に初めてここを回航し、「カボ・ダス・トルメンタス」（嵐の岬）と名づけた。ポルトガルの史料によるとジョアン2世が将来の探検を後押しするために「カボ・ダ・ボア・エスペランサ」（喜望峰）と改名したとされるが、偽書である可能性がある。この地はアフリカ最南端ではなく、その称号は東に約200キロ離れたアガラス岬のものである。だが喜望峰は大西洋とインド洋が交わる地点で、東洋への扉となっている。"
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "牛飼いの湾"
 cape_route_to_india_events.8.desc: "湾は静かで美しい。南西は低い岬で守られている。沿岸のミルクウッドの木々が心地よい木陰を作る。そして海岸の上の丘陵には、牛が膨大な群れをなす。健康に肥えた牛が草を食み、それをオーカーの顔料やガラスのビーズを身にまとった、背の高い人々が見守る。彼らは艦隊が投錨したときから、安全な距離から観察していた。\n\n乗組員の一部は新鮮な肉を目にし、涙を浮かべそうになる。彼らは何週間も魚の塩漬けと乾パンで過ごしてきたのだ。やがて牛飼いの一人が波打ち際まで下り、観察を続ける。艦隊長が小舟に乗り込み、その牛飼いまで漕ぎ寄せる。そして[ShowGoodsName('copper')]の指輪、干し魚、そして身振り手振りでの粘り強い取引を経て、日暮れまでに牛3頭が船倉に入った。その鳴き声は艦隊の全員にとって、人生最高の音色だった。"
 cape_route_to_india_events.8.a: "[ShowGoodsNameWithNoTooltip('copper')]と[ShowGoodsNameWithNoTooltip('cloth')]を牛に替え、「パドラン」を建てる。"
 cape_route_to_india_events.8.a.morale_tt: "乗組員の士気が大きく上昇（乗組員の士気#G +15#!）"
 cape_route_to_india_events.8.b: "「パドラン」を建て、この地を[ROOT.GetCountry.GetNameWithNoTooltip]のものとする。"
 cape_route_to_india_events.8.b.morale_tt: "乗組員の士気がわずかに上昇（乗組員の士気#G +8#!）"
 cape_route_to_india_events.8.c: "北へ進む前に、皆を休ませて回復させる。"
 cape_route_to_india_events.8.c.morale_tt: "乗組員の士気が目に見えて上昇（乗組員の士気#G +10#!）"
 cape_route_to_india_events.8.d: "帰還する。"
 cape_route_to_india_events.8.historical_info: "モッセル湾は、ポルトガルの船乗りたちから「バヒア・ドス・ヴァケイロス」（牛飼いの湾）、後には「アグアダ・デ・サン・ブラス」（聖ブラスの給水場）と呼ばれていた。バルトロメウ・ディアスは1488年にここに石造りの「パドラン」を建設し、その伝統は1497年にヴァスコ・ダ・ガマによって引き継がれた。先住民のコイコイ人は当初、どちらの遠征隊とも進んで交易をおこなったが、後に敵対的になる。ヴァスコ・ダ・ガマの隊員たちは十分な対価を支払わずに淡水を得ようとし、石を投げつけられた。"
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "[ShowLocationNameWithNoTooltip('sofala')]の金の港"
 cape_route_to_india_events.9.desc: "[ShowLocationName('sofala')]の港にダウ船がひしめき合う。艦隊が南部沿岸で見慣れた小型の漁船ではなく、[ShowRegionName('arabia_region')]や[ShowRegionName('persia_region')]の遠洋航海船で、[ShowGoodsName('ivory')]や黒檀、[ShowGoodsName('cloth')]を大量に積み込んで水面深く沈んでいる。水揚げ場では商人が[ShowLanguageName('arabic_language')]や艦隊の通訳が理解できない[location.GetDominantCulture.GetLanguage.GetName]で取引をおこなっている。ひとつまみの金粉がインド産の綿の反物と交換される。\n\n何世紀にもわたってこの港を支配してきたアラブ人商人は、倉庫の日よけの下から[ROOT.GetCountry.GetAdjective]艦隊の到着を見つめている。その表情は読み取れないが、身振り手振りは明らかである。鉄の艦砲を備え、帆に十字を描いた異邦人の艦隊の登場は、歓迎すべき事態ではない。艦隊長は最も大きな倉庫、ダウ船の係留位置、湾口の水深を記録する。"
 cape_route_to_india_events.9.a: "大規模な[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]を建設する。この金が[ROOT.GetCountry.GetNameWithNoTooltip]を豊かにしてくれる。"
 cape_route_to_india_events.9.a.owned: "わが国の投資を[ShowLocationNameWithNoTooltip('sofala')]の拠点に注ぎ込もう。この金が[ROOT.GetCountry.GetNameWithNoTooltip]を豊かにしてくれる。"
 cape_route_to_india_events.9.b: "交易で金粉を手に入れ、内陸に何があるか調べる。"
 cape_route_to_india_events.9.c: "情報を収集したら先へ進もう。時間は貴重だ。"
 cape_route_to_india_events.9.d: "帰還する。"
 cape_route_to_india_events.9.historical_info: "ソファラはスワヒリ交易網において最南端に位置する重要な港で、金を産出する西の高原の「ムタパ王国」（グレート・ジンバブエ）へとつながる交易路を支配する要衝だった。アラブ人商人は少なくとも10世紀ごろからこの地で活動していた。ポルトガルは1505年にソファラを占領し、アラブ人の交易網を破壊。自国の経路へ金を流そうとしたが、交易の多くが彼らの手の届かない内陸部へと移動したため、文句なしの成功とはいかなかった。"
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "[ShowLocationNameWithNoTooltip('mozambique')]島"
 cape_route_to_india_events.10.desc: "端から端までせいぜい3キロの小さな島で、大陸とは狭いながらも外洋船が通れる深さの水路で隔てられている。島には緑の旗を掲げた石造りの交易所がそびえ、港には[ShowContinentName('indian_ocean_continent')]各地から集まったダウ船がひしめき合う。内陸からは[ShowGoodsName('ivory')]や黒檀が流れ込み、大陸からは奴隷にされた男女が連行され、南からは[ShowGoodsName('copper')]が運ばれ、$india$や$china$からは[ShowGoodsName('cloth')]や[ShowGoodsName('porcelain')]が到着する。その交易網は6世紀にわたり機能してきた。\n\n裕福で疑り深い[target_ruler_country.Custom('GetRulerOrRegentTitle')]は、警戒している。艦隊より先に到着した[ShowCultureGroupName('arabian_group')]の商人たちは、この異邦人が[ROOT.GetCountry.GetReligion.GetAdjective]の海賊で、強奪・破壊の限りを尽くすだろうと警告した。[target_ruler.GetHeShe|U]は武装した衛兵に囲まれながら、周到な礼儀正しさで艦隊の使節を迎え、軍備について多くの質問を投げかける。港の中心で大砲に囲まれた[target_ruler.GetHerHis|U]の立場は、[ROOT.GetCountry.GetAdjective]から見ても居心地の良いものではないだろう。"
 cape_route_to_india_events.10.a: "[target_ruler_country.Custom('GetRulerOrRegentTitle')]を交易品の賄賂を渡し、建設権を手に入れる。"
 cape_route_to_india_events.10.b: "外交と贈り物で交易権を交渉する。"
 cape_route_to_india_events.10.c: "[ShowCultureGroupNameWithNoTooltip('arabian_group')]人商人たちに競り勝ち、[target_ruler_country.Custom('GetRulerOrRegentTitle')]を説得せよ。"
 cape_route_to_india_events.10.d: "[target_ruler_country.Custom('GetRulerOrRegentTitle')]の主張を受け入れて、いまは北へ進め。"
 cape_route_to_india_events.10.f: "サン・ジョルジェのパドランを建てよ。"
 cape_route_to_india_events.10.e: "帰還する。"
 cape_route_to_india_events.10.historical_info: "1507年、ポルトガルはモザンビーク島に拠点を正式に築き、東アフリカにおける同国の最重要拠点となった。16世紀に建てられたサン・セバスティアン要塞は、サブサハラアフリカに現存するなかでも特に古いヨーロッパの要塞である。この島は2世紀以上にわたってポルトガル領東アフリカの行政上の首都で、$india$航路の中継地だった。島の占領により、アラブ人によるスワヒリ海岸北部の交易路の支配は実質的に崩壊した。"
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "[ShowLocationNameWithNoTooltip('mombasa')]の罠"
 cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]の進入水路の幅はせいぜい約370メートルと狭く、両岸は断崖になっている。艦隊が通過するなか、乗組員たちは違和感を覚える。水揚げ場では、不自然なほどのさり気なさで男たちが佇んでいる。武器を隠して丸腰に見せるよう命じられた、重武装の男たちの装い方だ。水路の出口を塞ぐように、不自然な位置に停泊したダウ船。そして旗艦に乗り込むなり大仰な儀式を披露し、贈り物を渡してきた[target_ruler_country.Custom('GetRulerOrRegentTitle')]の使節も、艦隊の戦闘員の数についてしつこく質問していた。\n\nその夜、艦隊の通訳が船長室にこっそりと入る。[target_ruler_country.Custom('GetRulerOrRegentTitle')]の使節は陸に戻る際に同行者と[location.GetDominantCulture.GetLanguage.GetName]で会話したが、通訳が理解できる方言だったのだ。聞き取った内容は間違いようがなかった。「艦隊を[ShowLocationNameWithNoTooltip('mombasa')]から出してはならない」と。"
 cape_route_to_india_events.11.a: "夜明け前に出航するぞ。歓待の裏に何かがある。"
 cape_route_to_india_events.11.b: "明らかに緊迫しているが、残って取引してみよう。"
 cape_route_to_india_events.11.c: "奴らが裏切るなら、先手を打とう。総員に準備をさせろ。"
 cape_route_to_india_events.11.d: "帰還しよう。艦隊を危険にさらす必要もない。"
 cape_route_to_india_events.11.historical_info: "1498年4月、ヴァスコ・ダ・ガマはモンバサで危うく奇襲を受ける事態に遭う。ポルトガルの記録によれば、スルタンが提供した地元の水先案内人に、艦隊を砂州に座礁させられそうになったが、ダ・ガマはその前に撤退したという。ポルトガルはその後の数十年にわたり、モンバサを何度も砲撃・略奪する。1593年、ポルトガルはジーザス要塞を建設し、港の支配をようやく確立。その後、長期にわたる包囲戦の末、1698年にオマーン帝国が都市を制圧する。"
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "友好的な[target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "[ShowLocationName('malindi')]のすべてが、以前とは変わってしまった。白と緑の絹服を身にまとった[target_ruler_country.Custom('GetRulerOrRegentTitle')]の[target_ruler.GetName]が港へと下りてくる。[ROOT.GetCountry.GetAdjective]の誰もが聞いたことのない音楽を奏でる楽師たちを引き連れている。[target_ruler.GetNameWithNoTooltip]は南部の使者から艦隊について知らせを受けており、到着を待ち望んでいたようだ。\n\n[target_ruler.GetNameWithNoTooltip]は、象牙を凌ぐ価値の贈り物を用意していた。その召し抱えには、カリカットへ12度も航海した男がいるという。ここからマラバール沿岸までのあらゆる海流、礁、風向きの変化を知り尽くす男だ。南西モンスーンが艦隊を3週間で[ShowContinentName('indian_ocean_continent')]の向こうへと運ぶか、はたまた24時間以内に沈めてしまうか、見極められるそうだ。[target_ruler.GetNameWithNoTooltip]が説明するには、その水先案内人の名をヨーロッパの言語で表現するのは難しいらしい。しかし、その知識を伝えることは可能で、その知識の対価として友情を求めてきた。"
 cape_route_to_india_events.12.a: "[target_ruler.GetNameWithNoTooltip]の水先案内人と友情を喜んで受け入れよう。"
 cape_route_to_india_events.12.b: "[target_ruler_country.Custom('GetRulerOrRegentTitle')]贈り物、駐在、そして庇護を与えよう。"
 cape_route_to_india_events.12.c: "横断に臨む前に祈ろう。[ROOT.GetCountry.GetReligion.GetGodName|U]が我々をここまで導いてくださった。"
 cape_route_to_india_events.12.e: "偉大なる横断に臨む前に、サン・ジョルジェのパドランを建てよう。"
 cape_route_to_india_events.12.d: "帰還しよう。カリカットは遠く、横断は危険すぎる。"
 cape_route_to_india_events.12.historical_info: "マリンディのスルタンはモンバサと長年にわたる対立関係にあり、この敵国への牽制となりうるポルトガルを歓迎した。スルタンがヴァスコ・ダ・ガマに提供したインド洋の水先案内人は、ポルトガルの史料には「マレモ・カナカ」と記載されているが、数世紀にわたり学者たちの議論の的となってきた。一部の歴史家は、この水先案内人を15世紀最大のアラブ人航海士で、インド洋航海に関する著作をいくつも残したアフマド・イブン・マージドと同一人物と考えている。一方で、案内人はグジャラートの商人だったと主張する者もいる。その正体はいまだ定かではない。"
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "香辛料への玄関口、カリカット"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')]は[ROOT.GetCountry.GetCapital.GetName]よりも大きい。港には数え切れないほどの船が停泊し、それらは[ShowRegionName('arabia_region')]、[ShowRegionName('persia_region')]、[ShowAreaName('gujarat_area')]、[ShowRegionName('bengal_region')]、$china$、[ShowLocationName('malacca')]、[ShowAreaName('java_area')]からやって来ている。交易網でつながる世界各地が[ShowGoodsName('pepper')]、シナモン、カルダモン、[ShowGoodsName('cloves')]の魅力に引き寄せられ、そのすべてがこの港を経由して流れていく。艦隊がダウ船で混雑する停泊地に錨を下ろす様子を、水揚げ場の[ShowCultureGroupName('arabian_group')]人商人たちが凝視している。\n\n商人たちは、2ヵ月にわたり壮麗な儀礼用の仕切りの奥にいるカリカットの統治者[target_ruler_country.Custom('GetRulerOrRegentTitle')]に、この新参者たちは商人ではなく荒涼の北の地から来た海賊だと訴えてきた。[target_ruler_country.Custom('GetRulerOrRegentTitle')|U]は艦隊長と謁見することに同意したが、[target_ruler_country.GetGovernment.GetCourtTitle|l]は警戒し、商人たちは神経を尖らせている。空気は黒[ShowGoodsNameWithNoTooltip('pepper')]と、千年の交易を見届けてきた海の塩の香りが漂う。ここまでの航海のすべてが、次の1時間に交わされる言葉にかかっている。"
 cape_route_to_india_events.13.a: "わが国の交易品を[target_ruler_country.Custom('GetRulerOrRegentTitle')]の前に広げ、交易拠点を要求しよう。"
 cape_route_to_india_events.13.b: "条約を提案しよう。関税率の固定、安全な錨地、そして安全の確保を取り決めるのだ。"
 cape_route_to_india_events.13.c: "[ShowCultureGroupNameWithNoTooltip('arabian_group')]人商人たちが嘘をついていると断じ、[target_ruler_country.Custom('GetRulerOrRegentTitle')]に決定させよう。"
 cape_route_to_india_events.13.d: "我々の水先案内人が[target_ruler_country.GetGovernment.GetCourtTitle|l]を知っている。その助言によって回答を決めよう。"
 cape_route_to_india_events.13.e: "誰の目にも留まるサン・ガブリエルのパドランを建てよう。"
 cape_route_to_india_events.13.historical_info: "ヨーロッパではカリカットとして知られたコーリコードは、インド洋で最も重要な香辛料の交易港だった。その統治者は「サームーティリ」（ザモリン、「海の主」）と呼ばれ、交易を牛耳るアラビア人商人、競合関係にあるインドの諸政体、そして後に到来したヨーロッパ人とのあいだで慎重に均衡を保っていた。1498年当初のヴァスコ・ダ・ガマの歓待は芳しいものではなかった。彼の贈り物は不適当とみなされ、アラビア人商人たちが宮廷との関係を悪化させることに成功していた。ダ・ガマは不十分な少量の積荷をもって去ることになる。本格的な交易協定が得られるまで、大砲を積んだポルトガル艦隊が何度か訪れる必要があった。"
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "黄金海岸"
 cape_route_to_india_events.14.desc: "海岸線から1日ほど歩くと森が始まるが、海岸と森を結ぶ道はよく踏み固められている。週に2、3度、隊商が海岸に到着する。荷運びたちが担ぐ革袋には、砂金が入っている。ワンガラ商人たちが4世紀前から続く交易網を通じて取引する金は、内陸部で川の砂利からすり潰され、[ShowCultureName('akan')]の王たちが管理してきた洗い場で洗浄され、余剰分が流通する。\n\n[ROOT.GetCountry.GetAdjective]はこの地について耳にしている。この沿岸部で交易をおこなったことのある[ShowCultureGroupName('arabian_group')]人船長たちは、ギニア沿岸部で交易が最も活発なのは黄金海岸の市場と口をそろえる。ここの人々は外国の船を見慣れていて、恐れるどころか新参者を値踏みしてくるのだ。"
 cape_route_to_india_events.14.a: "サン・ジョルジェ・ダ・ミナを建設しよう。[ShowCultureNameWithNoTooltip('akan')]はその所有者と取引するだろう。"
 cape_route_to_india_events.14.a.owned: "サン・ジョルジェ・ダ・ミナを強化する。[ShowCultureNameWithNoTooltip('akan')]はすでに我々を通じて交易している。"
 cape_route_to_india_events.14.b: "[ShowCultureNameWithNoTooltip('akan')]が戦時の貢納として取る捕虜をめぐって交渉する。"
 cape_route_to_india_events.14.c: "ワンガラ商人たちが去る前に集落を急襲する。"
 cape_route_to_india_events.14.d: "交易量を記録し、南へ進もう。油を売っている暇はない。"
 cape_route_to_india_events.14.e: "本国へ帰還する。金が得られただけで、ここまで来た価値があった。"
 cape_route_to_india_events.14.historical_info: "1482年、ポルトガルは黄金海岸でサン・ジョルジェ・ダ・ミナ（エルミナ城）を建設した。石は近くの岬から切り出し、木材はあらかじめポルトガルで切り出して、この目的のために船に積み込んだ。この要塞は地元の首長であるカラマンサとの交渉、一部は不意打ちでわずか数週間のうちに築かれた。本来の目的は森林地帯のアカン諸王国との金取引を統制することであった。数十年のうちに大西洋奴隷貿易の主要な拠点となり、内陸部の戦争による捕虜を受け入れ、西方のサントメ島や後のブラジルのサトウキビ農園へと送り出した。歴史家のウォルター・ロドニーは、金に代わって奴隷貿易が主要な商品となる前、黄金海岸での取引はポルトガルにとって年間数十万クルザード金貨の価値があったと推定している。"
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "フェルナン・ド・ポーの島"
 cape_route_to_india_events.15.desc: "ギニア湾に浮かぶ島で、火山の頂から雲が棚引き、海岸沿いまで密林に覆われている。ここに暮らす[ShowCultureName('bubi_culture')]族は、ヨーロッパ人を見たことがない。彼らは木々の切れ目から、艦隊が天然の湾に錨を下ろし、小舟を降ろす様子を見つめる。\n\nこの島の名づけ元である探検家は、一世代前にこの島を通り、海図に大まかに記した。艦隊の水先案内人が、その海図を携えている。ただそこには、この島に立ち寄る価値があるかどうかは記されていない。"
 cape_route_to_india_events.15.desc.owned: "ギニア湾に浮かぶ島は、以前と変わりない。火山の頂からは雲が棚引き、海岸沿いまで密林に覆われている。だが、眼下の錨地にはすでにわが国の旗が翻っており、艦隊を迎えに漕ぎ出す小舟もわが国のものだ。\n\n[target_leader.GetName]は、この島に立ち寄る価値があるか悩むことはない。いまは、[ROOT.GetCountry.GetNameWithNoTooltip]が[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]交易の要衝として確立したこの足がかりを、どのように活かしていくかが問題だ。"
 cape_route_to_india_events.15.a: "拠点を確立せよ。[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]交易を制する島だ。"
 cape_route_to_india_events.15.a.owned: "この拠点を強化せよ。この島はわが国の[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]交易の要衝だ。"
 cape_route_to_india_events.15.b: "パドランを建て、島を海図に記録し、わが国のものにせよ。"
 cape_route_to_india_events.15.c: "船体を整備し、水樽を満たし、島で食糧を調達せよ。"
 cape_route_to_india_events.15.c.tt: "船体が削られてピッチで密閉され、この航海でフナクイムシが艦隊を悩ませることはない"
 cape_route_to_india_events.15.d: "本国へ帰還する。[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]の存在だけで、引き返すには十分だ。"
 cape_route_to_india_events.15.historical_info: "フェルナンド・ポー島（現在のビオコ島）は、1472年ごろにポルトガルの探検家フェルナン・ド・ポーがヨーロッパ人として初めて目にする。大陸から渡ってきた先住民のブビ族は、この島で何世紀も孤立して暮らしていた。ポルトガルはこの島を中継地として利用したが、熱帯の病気やブビ族の接触拒否もあって、恒久的な入植地の確立には苦戦した。島はその後数世紀にわたり何度も所有権が移り変わった。1778年のエル・パルド条約でポルトガルとスペインが南アメリカの領有権を調整する引き換えに、島はスペインに割譲され、最終的には現在の赤道ギニアの一部となる。"
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "海のスルタンの街"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')]は想像以上に大きかった。港は[ShowGoodsName('cloth')]、[ShowGoodsName('copper')]、[ShowGoodsName('porcelain')]を満載した[ShowRegionName('arabia_region')]や$india$のダウ船でひしめき合いう。[ShowLocationNameWithNoTooltip('mogadishu')]は[target_owner.GetName]の[target_owner.Custom('GetRulerOrRegentTitle')]が統治し、[ShowCultureName('somali_culture')]内陸部と広い海洋交易を支配している。水揚げ場の商人たちは、値踏みするような目で我々の船を見ている。見慣れぬ帆を張り、見慣れぬ交易品を携えてやってくる異邦人は我々が最初ではないが、我々ほど西から人がやってくることはないかもしれない。"
 cape_route_to_india_events.16.a: "[ShowCultureNameWithNoTooltip('somali_culture')]の商人と取引する。人脈は一人たりともおろそかにはできない。"
 cape_route_to_india_events.16.b: "観察し、記録したら北へ向かおう。我々が求めるのは$india$で、ここではない。"
 cape_route_to_india_events.16.c: "引き返そう。航路は未開で、食糧が持たない。"
 cape_route_to_india_events.16.historical_info: "モガディシュは東アフリカ沿岸で最も古く、最も裕福な都市の一つであり、ポルトガルが到来する数百年前から途切れることなく交易を続けてきた。アラビアの地理学者たちは、早くも9世紀にはここを主要な港として記録していた。ダ・ガマの航海の時代には、モガディシュはスルタン国によって統治され、アフリカ内陸部とアラビア、ペルシア、インド亜大陸を結ぶスワヒリ海岸交易網の一角を成していた。ポルトガルは交易を独占しようとこれらのスワヒリ都市国家を迂回または威圧し、高度に機能していた商業体制と真っ向から衝突することになる。"
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "イバードの港"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')]は赤い断崖からそびえ立ち、ここでは海の匂いが異なる。より乾いて、より鋭く、塵と[ShowGoodsName('salt')]が混ざった味もする。大型船が停泊できる深さがあり、南西モンスーンから守られた港は、[ShowProvinceDefinitionName('arabian_sea_province')]最高峰である。[ShowCultureName('omani_culture')]の商人たちは千年ものあいだ、$india$へ航海を続けてきた。水揚げ場の男たちは航路、風向き、そして時機を熟知している。いつ出航すべきか、いつ待つべきかを知っている。彼らは我々を見つめ、我々の狙いを推し量っている。"
 cape_route_to_india_events.17.a: "[ShowCultureNameWithNoTooltip('omani_culture')]当局を見つけ出して、我々の着港を告げる。"
 cape_route_to_india_events.17.b: "[ShowCultureGroupNameWithNoTooltip('arabian_group')]人航海士から$india$への海図を買い取ろう。"
 cape_route_to_india_events.17.c: "補給したら出港する。[ShowCultureNameWithNoTooltip('omani_culture')]の船乗りたちは友好的ではない。"
 cape_route_to_india_events.17.d: "帰還する。$india$は我々の手の届かない場所にあるようだ。"
 cape_route_to_india_events.17.historical_info: "マスカットは、西インド洋の海上勢力のひとつ、オマーンのイバード派イマーム制の主要港であった。オマーンの船乗りたちは世界でも特に熟練した航海者のひとつに数えられ、アラビアとインド亜大陸のあいだの渡航の時期を左右するモンスーンを熟知していた。ポルトガルの到来は、香辛料交易を仲介するオマーンの地位を脅かし、ポルトガルとオマーンの関係は16世紀の大半を通じて敵対的だった。ペルシャ湾や東アフリカの港の支配をめぐる戦争が相次ぎ、17世紀に入ると、オマーンは最終的に東アフリカ交易網の多くからポルトガルを追放した。"
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "ポルトガルが[ShowBuildingTypeNameWithNoTooltip('por_feitoria')]を建設"
 cape_route_to_india_events.18.desc: "艦隊は予告なしに到着し、外港に投錨すると、砲口を港に向けた。要請は形式こそ礼儀正しかったが、その内容は有無を言わさないものだった。彼らは交易拠点の建設を望んでいる。少額の賃料を支払い、現地の法を尊重するとのことだった。彼らが口にしなかったこと——口にするまでもなかったこと——は、拒否した場合の結果である。彼らの船には、すでに伐採された建材が積み込まれていた。交易拠点は数日のうちに建てられた。我々の旗が掲げられていた場所には、いま[por_feitoria_builder.GetAdjective]の十字旗がたなびいている。"
 cape_route_to_india_events.18.a: "我々に選択肢はない。あの大砲の前では、抗議も虚しいだけだ。"
 cape_route_to_india_events.18.b: "抗議し、我々の主権を尊重するよう要求する。"
 cape_route_to_india_events.18.historical_info: "ポルトガルのフェイトリア制度は、ヨーロッパがアジアやアフリカで展開した商業帝国主義の最初期における事例のひとつであった。ポルトガルは既存の港湾に要塞化された交易拠点を建設することで、本格的な領土征服の費用をかけることなく、既存の交易網に参入していった。現地の統治者がこの取り決めに同意すれば、ポルトガルの交易品を取引する権利と、敵国からの海洋での保護が約束され、拒否した場合には砲撃にさらされた。比較的開放されていたインド洋での商業はこの制度により、ポルトガルの海軍力による支配とインド商務院による交易の独占を中心としたものへと変えられていった。"
