l_japanese:
 mining_survey_events.1.title: "探鉱の委任"
 mining_survey_events.1.desc: "中庭では探鉱者たちが出発の準備を整えている。荷運び用のラバには、つるはしやドリル、そして鉱石の分析に使うるつぼ、天秤、酸を収めた、油を塗った木箱が積まれている。彼らは1年をかけてわが国の高地を進み、川床の砂金を探し、槌で石英の鉱脈を調べ、どの谷で砂金が採れるのかを羊飼いたちに尋ねて回ることになる。この山々からはかつて資源が採れた。だがその恩恵を受けていた者の多くは、我々が完全に忘れてしまった人々である。山々にもう何も残っていないと考える理由はない。"
 mining_survey_events.1.a: "金に糸目は付けるな。熟練の鉱石分析師を送り、試料の購入費を持たせろ。"
 mining_survey_events.1.b: "報酬は少なくていい。名士たちに案内人と寝起きする場所を提供させろ。"
 mining_survey_events.1.historical_info: "組織的な探鉱調査は、中世および近代前期のヨーロッパで盛んにおこなわれた。なかでも最も有名なのが、ザクセンとボヘミアにまたがるエルツ山地で実施されたもので、12世紀に銀の鉱脈が見つかったことをきっかけとして、フライベルク、ヤーヒモフ、シュネーベルクなどの新興都市が誕生した。また探査棒の使い方、小さな坩堝を使った鉱石標本の評価方法、鉱区の申請に関する法的慣行などを詳細に説明したゲオルク・アグリーコラの『デ・レ・メタリカ』（1556年出版）は探鉱の標準的な教本となった。"
 mining_survey_events.10.title: "[ShowGoodsNameWithNoTooltip('iron')]の層"
 mining_survey_events.10.desc: "探鉱者たちは、山の奥深くまで延びる高品位の[ShowGoodsName('iron')]鉱脈を掘り当てた。つるはしで岩肌を削り取った場所には、黒と赤の筋が走っている。最寄りの村の長によれば、村から登ったところにある山の斜面には古い採掘場があると、彼の祖父が話していたそうだ。新たに掘られた坑道は、忘れられていた鉱山を再び開いただけなのかもしれない。発見した鉱脈で採掘を続けられるなら、川下の鍛冶場と鋳造所は、今後数十年にわたって原料に事欠かないだろう。"
 mining_survey_events.10.a: "告知を出せ。[ROOT.GetCountry.GetFlavorRank]全体にこの発見を知らしめるのだ。"
 mining_survey_events.10.b: "内密に開発を進めろ。まだ競合する鋳造所に知らせる必要はない。"
 mining_survey_events.10.historical_info: "近代以前のヨーロッパでは、地表に露出した鉱床をたどって掘られた小規模な露天採掘場や浅い立坑で鉄を採掘し、その近くに設置した塊鉄炉を使って鉄鉱石から錬鉄を生産するのが一般的だった。中世後期に高炉が導入されると、鋳鉄をはるかに大量に生産できるようになり、スウェーデン、シュタイアーマルク、バスクといった主要な鉄の生産地は、この新たな技術を基盤として近代前期の繁栄を築いた。"
 mining_survey_events.11.title: "[ShowGoodsNameWithNoTooltip('copper')]鉱脈"
 mining_survey_events.11.desc: "探鉱者たちは緑色に変色した岩の筋をたどって丘の斜面を登り、その源を発見した。崖の表面を、[ShowGoodsName('copper')]の鉱脈が走っている。風雨にさらされ露出している様は、採掘されるのを待っているかのようだ。鉱石分析師が携帯用の金床の上で試料を砕き、るつぼに入れて分析すると、金属の不純物が少なく、十分な量を含有していることがわかった。南方の町々からは、すでに製錬師たちが呼ばれはじめている。"
 mining_survey_events.11.a: "堂々と開発しろ。[ROOT.GetCountry.GetFlavorRank]全体に、わが国には[ShowGoodsNameWithNoTooltip('copper')]資源があることを知らしめるのだ。"
 mining_survey_events.11.b: "密かに開発せよ。噂が広まらなければ、真鍮の鋳造職人たちが高値で買うからな。"
 mining_survey_events.11.historical_info: "産業革命以前のヨーロッパでは、銅の採掘はスウェーデンのファルン、エルツ山地の斜面、ザクセン地方のマンスフェルト地域、ティロール・アルプスといった一部の有名な鉱山地帯に集中していた。銅は青銅製の大砲、船体の被覆材、真鍮製品の製造に欠かせない金属で、生産量の多い銅鉱山は、所有者である王室だけでなく、鉱山開発に資金を提供した商家にも莫大な富をもたらし得た。銀行業で名を馳せたフッガー家が有力な一族へと成長したのも、ティロールの銅を支配していたことが一因だった。"
 mining_survey_events.12.title: "丘の[ShowGoodsNameWithNoTooltip('tin')]鉱脈"
 mining_survey_events.12.desc: "探鉱者たちは川床に転がる黒っぽい錫の小石をたどって斜面を登り、鉱脈が露出している場所を発見した。石英の鉱脈に沿って、[ShowGoodsName('tin')]を含む分厚い鉱脈が走っている。鉱夫たちはすでに木造の立て坑を組み、丘の麓には鉱石を砕くための砕鉱場を設置しはじめている。青銅の鋳造職人も、白目職人も、金属板の製造職人も、今後数十年にわたって原料に事欠かないだろう。"
 mining_survey_events.12.a: "この発見を告知せよ。新たな[ShowGoodsNameWithNoTooltip('tin')]鉱脈は、国家の重大事だ。"
 mining_survey_events.12.b: "密かに進めよ。競争相手より先に青銅交易を独占するのだ。"
 mining_survey_events.12.historical_info: "近代以前において、スズは青銅製の大砲から家庭用の白目製品に至るまで、幅広い用途に欠かせない戦略的に重要な金属だった。そしてスズの供給源は、コーンウォール、エルツ山地、ボヘミアの一部といった少数の有名な産地に集中していた。コーンウォールのスズ鉱区は中世以来、独自の裁判所と議会を有する特別な法的地位を認められており、コーンウォールのスズ交易は、大西洋沿岸のヨーロッパ各地における真鍮や青銅の生産を支えていた。"
 mining_survey_events.13.title: "石灰岩に含まれる方鉛鉱"
 mining_survey_events.13.desc: "丘陵地帯で方鉛鉱の採掘が始まった。ここの方鉛鉱は、黒っぽい結晶に輝く銀が混じっており、製錬した際に価値の高い副産物を期待できる。この鉱脈から採れた[ShowGoodsName('lead')]は教会の屋根や配管に使えるほか、鋳造すれば銃弾にもなる。また含まれている[ShowGoodsName('silver')]は開発費用の足しになる。採掘現場の責任者によれば、採掘面の状態は良好で、新たに掘った立坑を通じて安定した通気も確保してあるそうだ。"
 mining_survey_events.13.a: "発見を公表せよ。[ShowGoodsNameWithNoTooltip('lead')]は民の暮らしに関わる。"
 mining_survey_events.13.b: "火薬工場や印刷業者と密かに供給契約を結べ。"
 mining_survey_events.13.historical_info: "近代以前のヨーロッパでは、鉛と銀はほぼつねに一緒に採掘されていた。古代に考案され、中世を通じて改良が重ねられた灰吹法によって、方鉛鉱から両方の金属が得られたのだ。イングランドのメンディップ丘陵、ザクセンのハルツ山地、スペインのシエラ・モレナはいずれも鉛と銀の重要な産地で、そこで産出された鉛は、大聖堂の屋根から印刷用の活字、都市の水道管に至るまで、さまざまな物に使われていた。"
 mining_survey_events.14.title: "岩に含まれる[ShowGoodsNameWithNoTooltip('silver')]"
 mining_survey_events.14.desc: "探鉱者たちは[ShowGoodsName('silver')]を掘り当てた。つるはしを振るえるほど幅があり、岩から採り出したまま磨けるほど純度も高い鉱脈だ。鉱石分析師が試験をおこなったるつぼには、まだ熱が残っている。立坑は木材で補強され、いまは最初の鉱石を積んだ荷車を、軋んだ音を立てる巻き上げ機によって地上へ引き上げているところだ。造幣所は今後数十年にわたって地金に事欠くことはなく、1年以内に[ShowContinentName('europe')]各地の宮廷にこの発見が知れ渡るだろう。"
 mining_survey_events.14.a: "[ROOT.GetCountry.GetFlavorRank]にこのことを告知せよ。[ShowGoodsNameWithNoTooltip('silver')]鉱山の発見は大きな成果だ。"
 mining_survey_events.14.b: "発見したことは伏せておけ。他国の目がわが国の[ShowGoodsNameWithNoTooltip('silver')]に集まると、厄介なことになる。"
 mining_survey_events.14.historical_info: "中世後期から近代前期にかけて、銀の採掘はヨーロッパの経済を大きく変えた。15世紀末にティロールのシュヴァーツとボヘミアのヤーヒモフで大規模な銀鉱脈が発見され、さらに1545年にはアンデス山脈のポトシでも銀鉱脈が掘り当てられた。これにより、大量の銀がヨーロッパに流入し、16世紀の大規模な物価上昇の一因となった。生産量の多い銀鉱山は、艦隊や要塞にも匹敵する戦略的資産だった。"
 mining_survey_events.15.title: "黄色の金属"
 mining_survey_events.15.desc: "探鉱者たちは[ShowGoodsName('goods_gold')]を掘り当てた。冬の落石で土が剥がれ、崖の岩肌に露出していた石英鉱脈には、粗い筋状の金が走り、ランプの光を受けて輝いている。岩石が形成されて以来、誰の手にも触れられていなかったものだ。村の長は、自らが公正だと考える取り分を条件に、採掘場を[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に貸し出すと申し出ている。鉱石分析師は、条件付きでこの申し出を受け入れることを勧めている。"
 mining_survey_events.15.a: "発見を告知せよ。わが国の敵にも知らしめるのだ。"
 mining_survey_events.15.b: "密かに開発せよ。[ShowGoodsNameWithNoTooltip('goods_gold')]は歓迎されざる連中を引き寄せるからな。"
 mining_survey_events.15.historical_info: "近代以前のヨーロッパでは、自然金の鉱床は希少で、早くから採掘し尽くされていた。中世にはスロバキアのクレムニツァや、ワラキアのヴランチャにも重要な金鉱山があったが、ヨーロッパで産出される金の大部分は、ライン川やタホ川などの河川で砂金を採るか、あるいは鉛・銀鉱石から回収された銀をさらに精製することで得ていた。自然金の発見はどんな量であってもこの上ない幸運であり、王室が必ず権利を主張するほどの出来事だった。"
 mining_survey_events.16.title: "熱く燃える黒い石"
 mining_survey_events.16.desc: "この丘陵地帯にはぶ厚い[ShowGoodsName('coal')]層が走っており、川の浸食によって地層が見えた2ヵ所で露出している。石炭層はたどることができ、[ShowGoodsNameWithNoTooltip('coal')]はきれいに燃える。地元の鍛冶職人たちは、すでに炉で使う薪を石炭に切り替えはじめている。この石炭層から鍛冶場、製塩所、ガラス工場のすべてに燃料を供給可能で、もはや国内の森林を伐採する必要はない。"
 mining_survey_events.16.a: "[ROOT.GetCountry.GetGovernment.GetAdjective]の認可を受けて開発を進めよ。[ROOT.GetCountry.GetFlavorRank]に知らせるのだ。"
 mining_survey_events.16.b: "採掘場を製鉄業者に貸し出し、安定した取り分を得よう。"
 mining_survey_events.16.historical_info: "中世以降、ヨーロッパでは主にウェールズ、ニューカッスル炭田、そしてリエージュの一部で小規模な石炭採掘がおこなわれていた。しかし、石炭採掘が本格的に拡大したのは、耕地を増やすための森林伐採により、近代前期に燃料不足が深刻化してからのことだった。17世紀には、ニューカッスル産の石炭が数千トン単位で船に積まれ、ロンドンへ運ばれていた。木炭が入手できなくなるなか、石炭がなければ鉄鋼業は存続できなかっただろう。"
 mining_survey_events.17.title: "加工しやすい[ShowGoodsNameWithNoTooltip('stone')]"
 mining_survey_events.17.desc: "丘陵地帯に新たな採石場が開かれた。ここで採れる[ShowGoodsName('stone')]は層理面に沿ってきれいに切り出すことができ、乾燥すると硬くなる。大聖堂の建設現場から呼び寄せられた石工の親方が見本の石材を調べ、切り石積みや精巧な彫刻、荷重を支える段の石積みのいずれにも適していると断言した。今後数十年にわたり、百マイル以内のあらゆる大聖堂と城壁がこの石材を利用するだろう。"
 mining_survey_events.17.a: "採石場を[ROOT.GetCountry.GetGovernment.GetAdjective]の管理下に置け。[ShowGoodsNameWithNoTooltip('stone')]は戦略物資だ。"
 mining_survey_events.17.b: "採石場を石工ギルドに貸し出し、安定した賃料を得よう。"
 mining_survey_events.17.historical_info: "産業革命以前のヨーロッパでは、建築用石材は輸送に時間がかかったものの、価値の高い商品だった。価格を決定する最大の要因が輸送費だったためである。主要都市や建設現場から1日で運搬できる距離にある生産量の多い採石場は、長期的な価値がある資産で、実際、ランス、ソールズベリー、そしてケルンでおこなわれていた中世の大聖堂建設事業では、建設に必要な石材を確保するため、何世代にもわたって専用の採石場が維持されていた。"
 mining_survey_events.18.title: "くぼ地の[ShowGoodsNameWithNoTooltip('marble')]"
 mining_survey_events.18.desc: "風雨を避けられるくぼ地で、筋模様が入った最高級の[ShowGoodsName('marble')]が発見された。石工の親方が切り出した見本の石材は、磨くと深みのある半透明の輝きを放つ。地元の彫刻家たちはすでに、産出される石材を優先的に購入する権利を求めている。遠くは首都に至るまで、各地の工房が今後数十年にわたってこの採石場の石材を使うことになるだろう。祭壇画の彫刻や墓碑を手がける職人たちにとっては、まさに天恵だ。"
 mining_survey_events.18.a: "告知せよ。優れた[ShowGoodsNameWithNoTooltip('marble')]の採石場は国の宝だ。"
 mining_survey_events.18.b: "[ROOT.GetCountry.GetGovernment.GetAdjective]のため、この場所の[ShowGoodsNameWithNoTooltip('marble')]を内密に確保せよ。"
 mining_survey_events.18.historical_info: "中世からルネサンス期のヨーロッパにおいて、精巧な彫刻や建築に使われる大理石は、トスカーナのカッラーラ、ギリシャのパロス島とペンテリカス山、ピレネー山脈のサンベアといった、一握りの有名な採石場から供給されており、彫像に適した品質の大理石を豊富に産出する新たな鉱層が発見されると、芸術家たちの注目を集めた。彼らは見本の石材を注文し、有望な採石場に自ら足を運んで調査することもあった。"
 mining_survey_events.19.title: "輝く宝石"
 mining_survey_events.19.desc: "探鉱者たちは川床で[ShowGoodsName('gems')]を含む砂礫を発見し、それをたどることで、丘を登った斜面にあるより豊富な鉱床を見つけ出した。採れるのは結晶が入り交じったペグマタイトで、首都から呼び寄せた宝石加工職人たちの代表は、原石の山を色と透明度によって選り分け、カットに適した石の割合が非常に高いと報告した。今後数十年にわたり、宮廷の宝飾職人たちが宝石不足に悩まされることはないだろう。"
 mining_survey_events.19.a: "発見を知らしめよ。[ShowGoodsNameWithNoTooltip('gems')]の採掘場には自慢するだけの価値がある。"
 mining_survey_events.19.b: "この地の[ShowGoodsNameWithNoTooltip('gems')]を、[ROOT.GetCountry.GetGovernment.GetAdjective]の財源として密かに保管せよ。"
 mining_survey_events.19.historical_info: "ヨーロッパの宝石採掘は、インドやビルマにある大規模な産地と比べると規模が小さかったが、ボヘミアの高地、スコットランドのケアンゴームズ、そしてピレネー山脈の一部では、ガーネット、ベリル、アメシスト、トパーズなどが採掘されていた。ラインラントのイダー＝オーバーシュタインにある宝石加工工房は、地元で採掘された宝石のカット加工の中心地となり、生産量の多い鉱床が発見されると、職人たちは何年にもわたって仕事に困らなかった。"
 mining_survey_events.20.title: "高地で採れる辰砂"
 mining_survey_events.20.desc: "A cinnabar deposit has been opened in the highlands, its bright red ore the unmistakable sign of [ShowGoodsName('mercury')] in the rock. The retort and the condenser are already being set up at a safe distance from the workings, since the fumes given off in the roasting are known to loosen teeth and addle the wits. Alchemists, assayers, and gilders will all draw on this mine for a generation to come, and a metal so scarce and so useful may command whatever price we care to name."
 mining_survey_events.20.a: "鉱山を堂々と開発せよ。[ShowGoodsNameWithNoTooltip('mercury')]は戦略物資だ。"
 mining_survey_events.20.b: "密かに開発せよ。[ShowGoodsNameWithNoTooltip('mercury')]の独占は大きな力になる。"
 mining_survey_events.20.historical_info: "水銀は常温で液体になる唯一の金属であり、16世紀のアメリカ大陸で主流の銀の精錬方法になったアマルガム法に欠かせないものだった。カスティーリャのアルマデン鉱山とカルニオラのイドリヤはヨーロッパにおける2大産地で、スペイン王室はアルマデンの採掘場を王室独占事業として厳格に管理しており、産出された水銀は、海軍の護衛を受けながらガレオン船でメキシコやペルーに輸送されていた。"
 mining_survey_events.21.title: "塩水泉"
 mining_survey_events.21.desc: "高地で新たな岩[ShowGoodsName('salt')]鉱床の採掘が始まり、地層が谷底を横切る場所から塩水泉が湧き出している。すでに製塩職人たちが作業を始めているほか、地元の農民たちは塩水が染み出す場所に牛を連れてきて、それを飲ませている。塩蔵肉の交易も食卓も、ともに豊かになるだろう。さらに、塩税を導入すれば、この発見による税収だけで[ROOT.GetCountry.GetGovernment.GetAdjective]の1年分の経費を賄えるはずだ。"
 mining_survey_events.21.a: "[ROOT.GetCountry.GetGovernment.GetAdjective]の認可のもと、この岩[ShowGoodsNameWithNoTooltip('salt')]鉱床の開発を進めろ。"
 mining_survey_events.21.b: "塩商人たちに事業を貸し出し、安定した取り分を得よう。"
 mining_survey_events.21.historical_info: "近代以前のヨーロッパにおいて、塩は戦略物資だった。食品の保存に欠かせないだけでなく、各種の塩税や専売制度を通じて国家に多額の収入をもたらしており、そのなかでも特に有名だったのが、ガベルと呼ばれたフランスの塩税だ。ポーランドのヴィエリチカ、オーストリアのハルシュタット、カタルーニャのカルドナにある大規模な塩鉱山は何世紀にもわたって操業され、所有者である一族や王室に莫大な富をもたらした。"
 mining_survey_events.22.title: "[ShowGoodsNameWithNoTooltip('alum')]を含む頁岩の発見"
 mining_survey_events.22.desc: "探鉱者たちは丘陵地で[ShowGoodsName('alum')]を含む頁岩を発見した。岩石は自然に風化し、染色業者がいくら払ってでも欲しがる塩類となる。試験用の蒸留器で最初の試料を処理したところ、純度の高い白色の[ShowGoodsNameWithNoTooltip('alum')]が得られた。織物商人の代表者たちがすでに長期契約について問い合わせてきている。織物業は長らく、教皇庁が独占するトルファの産地よりも近くにある、より身近な供給源を待ち望んでいたのだ。"
 mining_survey_events.22.a: "この発見を知らしめよ。この[ShowGoodsNameWithNoTooltip('alum')]は、[ROOT.GetCountry.GetFlavorRank]の技術力の輝かしい成果だ。"
 mining_survey_events.22.b: "密かに開発せよ。[ShowGoodsNameWithNoTooltip('alum')]を独占している教皇庁に知らせる必要はない。"
 mining_survey_events.22.historical_info: "ミョウバンは染料を布に定着させるために欠かせない媒染剤で、中世から近代前期にかけて、織物産業にとっての戦略物資だった。1462年に教皇領のトルファで大規模なミョウバン鉱床が発見されると、教皇庁による独占が始まり、この独占体制は、イングランド、スウェーデン、ネーデルラントで代わりとなる供給源が開発されるまで1世紀以上にわたって続いた。自国でミョウバンを供給できる国は、織物産業を他国への不本意な依存から解放できたのである。"
 mining_survey_events.23.title: "谷の[ShowGoodsNameWithNoTooltip('saltpeter')]"
 mining_survey_events.23.desc: "風を避けられる谷の土壌から[ShowGoodsName('saltpeter')]が採取された。春の雪解け後、岩肌に白い結晶が花のごとく広がっていたのだ。造兵廠から呼ばれた火薬製造の責任者が、未精製の硝石の標本を採取して品質を調べ、精製すれば最高品質の火薬を製造できると断言した。今後数十年にわたり、火薬製造所が硝石に事欠くことはない。[ROOT.GetCountry.GetFlavorRank]の砲兵隊をようやくその野望に見合う規模まで拡充できるだろう。"
 mining_survey_events.23.a: "[ROOT.GetCountry.GetGovernment.GetAdjective]の独占体制で開発を進めろ。[ShowGoodsNameWithNoTooltip('saltpeter')]は戦争に不可欠だ。"
 mining_survey_events.23.b: "火薬商人たちに開発させ、その見返りに産出物の優先権を与えよう。"
 mining_survey_events.23.historical_info: "近代以前のヨーロッパにおいて、火薬の主原料である硝石は、長年にわたって排泄物が浸透した風雨の影響を受けにくい土壌から採取するか、インドやレバントから多額の費用をかけて輸入されていた。硝石の生産を国家が管理することは戦略上の重要課題で、イングランドでは、家畜小屋やハト小屋の床下を掘る法的権限を持つ硝石採取人制度が運用されていたほか、フランスでは19世紀に入っても、王室の独占事業として「#italic Régie des Poudres#!（火薬硝石公社）」が存続していた。"
 # BAD events
 mining_survey_events.30.title: "試掘坑の崩落"
 mining_survey_events.30.desc: "[ShowGoodsName('iron')]の探鉱現場で事故が起こった。夜のあいだに試掘用の立坑が崩落したのだ。鉱層の上の不安定な頁岩が徐々に沈下し、立坑の木材が破断したことが原因だった。探鉱隊の2人が生き埋めになり、もう1人の鉱石分析師見習いは救出されたものの、脚を骨折し、二度と立坑には下りたくないと訴えている。採掘責任者によれば、[ShowGoodsNameWithNoTooltip('iron')]が存在することは確かだが、そこに到達するには、より硬い岩盤に新たな横坑を掘る必要があり、相当な費用がかかるそうだ。"
 mining_survey_events.30.a: "探鉱隊を引き上げさせろ。犠牲を出してまで掘る価値はない。"
 mining_survey_events.30.historical_info: "近代以前の鉱業では、坑道の天井や立坑が崩落する危険が鉱夫たちに付きまとった。採掘場を支える木材は湿った地中で腐るうえに、鉱層の上にある不安定な地層は前触れもなく崩れ落ちた。また柱を残しつつ掘進していく「柱房式」と呼ばれる採掘法が一般的だったが、この方式には、鉱石の採掘が進むと支えがない空間が広がるという欠点があった。こうした背景から、ヨーロッパのどの鉱山地帯にも鉱夫のための礼拝堂や葬儀ギルド、鉱夫の未亡人を支援する基金が常設されていた。"
 mining_survey_events.31.title: "採掘現場の有毒な煙"
 mining_survey_events.31.desc: "[ShowGoodsName('copper')]の鉱床は予想外の性質を持つ鉱石を産出している。製錬前に硫化物を除去するべく設置された最初の焙焼炉からは、鼻を刺すような黄色い煙が立ち上っており、そのせいで作業員たちは斜面から避難を余儀なくされ、風下約1キロメートル足らずにわたって草が枯れはじめている。これを受け、地元の農民たちが正式な苦情を申し立てた。冶金学者によれば、煙を封じ込めるための適切な焙焼炉を建造できるとのことだが、そのためには予定になかった金と時間が必要になる。"
 mining_survey_events.31.a: "鉱床を放棄せよ。大気汚染に関する地元住民の指摘はもっともだ。"
 mining_survey_events.31.historical_info: "硫化鉱から銅を製錬すると放出される大量の二酸化硫黄は、周辺の農村一帯で作物、家畜、肺に被害を及ぼした。スウェーデンのファールン大銅山地域はその煙で悪名高く、周囲の農地を数キロメートルにもわたって不毛にしたとされ、ハルツ山地下流域の大規模な銅製錬地帯も同様に壊滅的な被害をもたらした。中世以降、煙害を理由とする鉱山作業に対する民事訴訟は珍しくなかった。"
 mining_survey_events.32.title: "涸れゆく河床"
 mining_survey_events.32.desc: "[ShowGoodsName('tin')]の鉱床は当初有望であった。河床から漂砂錫石（キャシテライト）が見つかり、砂金採りの要領で荷車単位の量が採掘されたのだ。しかし、この砂鉱床の源流はいまだ見つかっておらず、川床の重鉱石は採り尽くされてしまっている。採掘場の上方に掘った丘陵坑も、ただの不毛な母岩に突き当たっただけだった。採掘隊は思いつくところをすべて掘っており、なんの根拠もないままさらに深い坑道を掘る費用を正当化するのは難しい。"
 mining_survey_events.32.a: "鉱床を放棄せよ。漂砂鉱床は一過性のものにすぎなかった。"
 mining_survey_events.32.historical_info: "河川や小川の河床にある錫を含む砂礫を採取する漂砂錫採取は、コーンウォールにおける錫採掘の原初的な手法であり、近代初期まで存続した。採りやすい砂礫を掘り尽くすと、鉱夫たちは周囲の丘陵を系統的に探鉱し、砂金鉱脈の源流へと遡らなければならなかったのだが、有望に見えた河川の多くは、地下採掘の費用に見合わない、薄く散在する鉱脈にすぎなかった。"
 mining_survey_events.33.title: "病に倒れる作業員"
 mining_survey_events.33.desc: "[ShowGoodsName('lead')]の鉱床は鉱石を産出しているが、作業員たちからは不満の声が上がっている。交代勤務を終えて戻ってくる男たちには、灰色がかった歯茎、腫れ上がった関節、そして重い倦怠感が見られる。現場の医師はこれを鉛鉱夫の疝痛と呼んでいる。2名が死亡し、さらに4名は病状が重く、坑道に降りることもできない。坑長によれば、代わりの者を雇い犠牲を受け入れれば採掘を続けられると言うが、地域の首長は次は誰になるのかと容赦なく問いただしている。"
 mining_survey_events.33.a: "閉鎖せよ。我々は[ROOT.GetCountry.GetFlavorRank]の自由民を葬るためにここに来たのではない。"
 mining_survey_events.33.historical_info: "古代人が「コリカ・プルンビカ」と呼んだ鉛中毒は、鉛鉱夫、製錬工、ガラス職人、陶工のあいだでよく知られた職業病であった。産業医学の基礎文献であるベルナルディーノ・ラマツィーニの『#italic De morbis artificum diatriba#!（職人たちの病気）』 （1700年）は、この疾患に長い章を割いている。瀉血、下剤、牛乳の摂取といった標準的な治療法は効果がなく、唯一の実効的な予防策は曝露を制限することであったが、鉱山所有者にはそれを実行する経済的動機がほとんどなかった。"
 mining_survey_events.34.title: "先細る鉱脈"
 mining_survey_events.34.desc: "[ShowGoodsName('silver')]の鉱脈は、探鉱者が最初に開削した場所では幅広く、数台分の鉱石は重さ約50キロあたり30マルク以上の[ShowGoodsNameWithNoTooltip('silver')]を含有していると分析された。しかし、鉱脈の傾斜に沿って10メートル弱下ったところで、鉱脈は急激に狭まり、鉱石の品位も低下した。現在、採掘面から採れる鉱石は、岩を地表まで運搬する費用をまかなうのがやっとの状態である。地質学用語では、これを先細りと呼ぶが、鉱夫たちの呼び方はお世辞にも上品とはいえない。断層の先にはさらに[ShowGoodsNameWithNoTooltip('silver')]が眠っている可能性はあるが、それを見つけ出すには、なんの根拠もないまま費用のかかる探鉱坑道を掘らなければならない。"
 mining_survey_events.34.a: "撤退せよ。細くなった鉱脈は閉ざされた扉に等しい。"
 mining_survey_events.34.historical_info: "銀鉱脈は、その全長にわたって著しく変動することで悪名高く、ある区間では厚さ数十センチから1メートルを超える鉱体に膨らむ一方で、別の区間では無鉱の細い鉱脈に狭まっていた。鉱脈形状の気まぐれさゆえに、銀採掘は経験に基づく賭けのような職業となり、ヤーヒモフ、シュヴァーツ、イグラウといった中世の鉱山町の興亡は、特定の鉱脈の発見と枯渇を恐ろしいほど正確にたどっていた。"
 mining_survey_events.35.title: "輝くものすべてが金にあらず"
 mining_survey_events.35.desc: "[ShowGoodsName('goods_gold')]の鉱床での失望。石英のなかを走る明るい金属片は[ShowGoodsNameWithNoTooltip('goods_gold')]ではなく、硫化鉄である黄鉄鉱であり、これは冶金術の黎明期から探鉱者たちを惑わせてきたものだ。試金師がおこなった最初の試験——るつぼ内での還元で得られたのは、[ShowGoodsNameWithNoTooltip('goods_gold')]の黄色い粒ではなく、薄い赤色の硫黄を含んだ滓と銑鉄の塊だったが、地元の首長はまったく驚いた様子を見せなかった。彼はこの愚者の黄金と呼ばれる黄鉄鉱についての昔話を祖父から聞いており、我らの学者たちがその違いを見分けられるかどうかを見極めようとしていたのだ。"
 mining_survey_events.35.a: "荷物をまとめて立ち去るぞ。愚者の黄金は、探鉱者たちの最古の手口だ。"
 mining_survey_events.35.historical_info: "岩石の中で真鍮のような黄色に輝く硫化鉄である黄鉄鉱は、ドイツの鉱山地帯では俗に「愚者の金」と呼ばれ、人類が本物の金を探し求めはじめたその時から、試掘者たちを欺きつづけてきた。識別試験には、槌による打撃時の可鍛性（金は平たく延びるが、黄鉄鉱は粉々に砕ける）、比重（金は水の19倍の密度だが、黄鉄鉱はわずか5倍）、火試金での反応（金は残るが、黄鉄鉱は硫黄と酸化鉄に燃え尽きる）の確認があり、熟練した試金師なら誰でもおこなう標準的な手法だった。"
 mining_survey_events.36.title: "炭層の引火性ガス"
 mining_survey_events.36.desc: "[ShowGoodsName('coal')]の炭層は厚く、純度も高いが、メタンを含む引火性の炭坑ガスも充満している。深い[ShowGoodsNameWithNoTooltip('coal')]坑内ならどこにでも溜まる沼気が、1人の採炭夫のランプから引火し、その結果生じた爆発によって3人が即死し、さらに6人が重度の火傷を負い、二度と働けなくなってしまった。坑長によれば、この炭層は採掘可能だが、通風立坑と炉による絶え間ない換気が不可欠であり、[ShowGoodsNameWithNoTooltip('coal')]が採掘できるようになるまでに多額の資金が必要となる。"
 mining_survey_events.36.a: "採掘を中止せよ。我々はまだ引火性ガスに対処する備えができていない。"
 mining_survey_events.36.historical_info: "坑気とは、炭坑内に蓄積し、あらゆる火炎からも爆発的に引火するメタンガスのことであり、産業革命以前の炭鉱において、鉱夫の命を長きにわたり奪いつづけた。標準的な対策は、2本の立坑による換気であり、上昇気流側の立坑の底に炉を設けて坑内に空気を引き込んだ。照明を確保しながら引火を防ぐデービー安全灯が発明されたのは、1815年になってからのことである。それまで、すべての深部炭層の採掘は、断続的に惨事が起こる環境でおこなわれていた。"
 mining_survey_events.37.title: "採石場の浸水"
 mining_survey_events.37.desc: "[ShowGoodsName('stone')]の品質は申し分ないが、この採石場は水が引く気配がない。層理面に沿って約3.6メートルの深さまで切り込まれた最初の坑は、採石作業員たちが予想していなかった湧水によって一晩で水浸しになり、[ShowGoodsNameWithNoTooltip('stone')]の最下層は現在、約1メートル弱の冷たい水の下に沈んでいる。石工の親方は、下の谷へと排水坑道を掘れば採石場は稼働できると言うが、その坑道の掘削だけでも丸1年分の石工作業に相当し、当然のことながら予算には含まれていない。"
 mining_survey_events.37.a: "採石場を放棄せよ。水没した採石場は閉鎖されたも同然だ。"
 mining_survey_events.37.historical_info: "産業革命以前の石材採掘では、採石場の排水は慢性的な技術的課題であり、採掘面がその地域の地下水位より下がると、生産性の高かった採石場でさえ多くが放棄された。標準的な解決策としては、低地へと水平に掘られた排水坑道（ドイツの鉱山伝統におけるいわゆる「シュトレン」）、水車でバケットチェーンポンプを動かす方法、そして17世紀以降に徐々に導入された蒸気駆動の排水機関などがあった。"
 mining_survey_events.38.title: "石塊の破砕"
 mining_survey_events.38.desc: "[ShowGoodsName('marble')]は当初、採掘面では健全に見えた。しかし2日後、巨大な石塊がようやく母岩から切り離され、木製のローラーの上に降ろされたとき、目に見えない亀裂に沿って真っ二つに割れ、自重に耐えきれず6つの価値のない破片へと砕け散ってしまった。石工の親方は売り物にならなくなった岩塊の周りを歩き、槌で叩きながら、一団がすでに知っている事実を告げた。この窪地の[ShowGoodsNameWithNoTooltip('marble')]は、採掘切羽を見ただけでは決してわからない無数の亀裂が内部を縦横に走っているのだ、と。"
 mining_survey_events.38.a: "閉鎖せよ。亀裂の入った[ShowGoodsNameWithNoTooltip('marble')]は街道の敷石以外に使い道がない。"
 mining_survey_events.38.historical_info: "彫像や精緻な建築に使う大理石の岩塊には内部の欠陥がないことが求められ、この仕事に携わる者はつねに、イタリアの石切工の俗語で「ペリ」と呼ばれるこの目に見えない亀裂が見つかりはしないかと恐れていた。彫刻の巨匠たちは、依頼を受ける前に自ら採石場を訪れて原石を検査し、大規模な彫像制作の依頼料には、納品後に欠陥が発見された岩塊の損失を見込んだ手厚い補償金が含まれていた。"
 mining_survey_events.39.title: "鉛ガラス"
 mining_survey_events.39.desc: "[ShowGoodsName('gems')]を産出する砂礫は豊かであった。異常なほどに、そして疑わしいほどに。首都から護衛付きで連れてこられた王室の宝石細工師は、強いランプの下で採取物を調べ、石をひとつずつ手のひらに乗せて重さを確かめ、コランダム（剛玉）の破片にこすりつけ、避けようのない結論を下した。発見されたもののほとんどは「ペースト」という鉛ガラスで、未加工の水晶に見えるよう巧妙にカットされ風化処理させたものだった。誰かが河床に鉱石を仕込んでいたのだ。坑長は今朝から現場に姿を見せていない。"
 mining_survey_events.39.a: "荷物をまとめろ。試掘地全体が詐欺だったのだ。"
 mining_survey_events.39.historical_info: "ソルティングとは、投資を誘引するために鉱区に本物の鉱石や加工済みの宝石原料を仕込む行為であり、鉱山開拓地では古くからおこなわれてきた職業的詐欺だった。自らの採掘場に鉱石をばら撒いた坑長、選ばれた河床に数個の隠し標本を散らばらせた地元の案内人、慎重に配置された発見物を手配した不在の開発業者は、ヨーロッパおよびアメリカの鉱山史の両方に繰り返し登場した。そして最後に、悪徳試金師が本物だと判定することで、この詐欺のお決まりの構図が完成するのである。"
 mining_survey_events.40.title: "[ShowGoodsNameWithNoTooltip('mercury')]の狂気"
 mining_survey_events.40.desc: "[ShowGoodsName('mercury')]の採掘場は金属を産出し、それと同時に狂人をも生み出している。蒸留器の作業員たちは制御不能な震えに襲われはじめ、凝縮した[ShowGoodsNameWithNoTooltip('mercury')]をかき混ぜる役目を担った見習いは歯を失い、右手の指2本も使えなくなった。そして、誰よりも危険を知っていた親方の冶金師は、現場の医師が「帽子屋の狂気」と呼び、不治の病と宣告するような、苛立ちを伴う精神錯乱に陥ってしまった。[ShowGoodsNameWithNoTooltip('mercury')]はそこにはある。だがそれを採り出す男たちはいない。"
 mining_survey_events.40.a: "採掘場を閉鎖せよ。これほどの代償を払う価値のある金属などない。"
 mining_survey_events.40.historical_info: "水銀中毒は、震え、歯の喪失、進行性の精神的退行として現れ、辰砂鉱夫、蒸留器作業員、そして銀アマルガム職人にとって、広く認知された職業病であった。ヨーロッパ最大の水銀供給源だったカスティーリャのアルマデン鉱山は、まさにこの理由から一部は囚人労働によって運営されていた。英語の「#italic mad as a hatter#!」（帽子屋のように狂っている）という表現は、かつてフェルト帽子の職人がその製作過程で使用した水銀によって中毒を起こしていた時代の記憶をとどめている。"
 mining_survey_events.41.title: "塩水源の枯渇"
 mining_survey_events.41.desc: "[ShowGoodsName('salt')]の鉱床探査は順調な滑り出しを見せた。塩水泉の水量は豊富で、釜では一級品の白い[ShowGoodsNameWithNoTooltip('salt')]が生産され、塩商人たちはすでに長期契約の交渉を進めていた。ところが、乾燥した夏と例年より寒い冬を経て、泉は細い流れへと弱まり、ついには涸れてしまった。調査のため派遣された地質学者の報告によると、地下の水源は再生する水流ではなく、閉じ込められた塩水の有限な貯留層であり、この鉱区は事実上枯渇したとのことだ。"
 mining_survey_events.41.a: "撤退せよ。塩水源が涸れたなら、[ShowGoodsNameWithNoTooltip('salt')]採掘事業は終わりだ。"
 mining_survey_events.41.historical_info: "塩水泉と岩塩鉱床は、地質学的特性も経済的な見込みも大きく異なっていた。ザクセンのハレやジュラ地方などの一部の塩水源は、何世紀にもわたって湧きつづけ、相当な規模の町を支えてきた。一方、ほかのものは言わば化石のように水が閉じ込められた貯留層であり、集中的な採掘の末、1世代のあいだに枯渇してしまった。ヴィエリチカやカルドナといった場所で採掘された岩塩は、より確かな資源ではあったものの、その分多額の資本を必要とした。"
 mining_survey_events.42.title: "不毛な頁岩"
 mining_survey_events.42.desc: "地表に露出する頁岩は有望に見え、岩石が風化して生成された塩は、分析にかけたところ、不純物のない真っ白な塩として検出された。しかし地中深くの頁岩は不毛であった。分厚く、暗く、試料が示唆していたような[ShowGoodsName('alum')]を含有する黄鉄鉱の脈が完全に欠如しているのだ。化学者は酸浸出、次に焙焼、そして捨て場での長期風化を試みるが、ほとんど何も得られない。多額の費用をかけて繊維産業の町から呼び寄せられた作業員たちは、技術者が次から次へと手法を試すあいだ、手持ち無沙汰に座っている。"
 mining_survey_events.42.a: "作業場を閉鎖せよ。この化学ではここで[ShowGoodsNameWithNoTooltip('alum')]を生産することはできない。"
 mining_survey_events.42.historical_info: "黄鉄鉱頁岩からのミョウバン製造には、厳密な鉱物化学的条件が必要だった。硫酸イオンを供給する鉄黄鉄鉱、アルミニウムを供給するアルミニウム質の頁岩、そして溶液中でその二者を結びつけるための長い風化過程である。露出部は自然の風化ですでに変化し終えている場所であるため、地表の試料は当てにならず、多くの場合、地下の岩石からは何も得られなかった。北海沿岸のヨークシャーにあるミョウバン工場は、最終的に生産につながらなかった頁岩に数十年の歳月と莫大な資本を費やした。"
 mining_survey_events.43.title: "不毛の土壌"
 mining_survey_events.43.desc: "この谷の土壌は[ShowGoodsName('saltpeter')]に富んでいるはずであった。地元の農民たちは、自分たちの祖父が毎春、岩肌から白い潮花を採取していたと語っていたのだ。これを受けて探鉱者たちは谷底の十数ヵ所から土を掘り出し、浸出させ、蒸発処理をおこなったが、価値のあるものはほとんど得られなかった。火薬師は、そのわずかな収穫量を見せられると、かつての[ShowGoodsNameWithNoTooltip('saltpeter')]の層は、祖父が話していたまさにその農民たちによって掘り尽くされてしまったのかもしれないと指摘した。この谷ではもはや、[ShowGoodsNameWithNoTooltip('saltpeter')]は得られないのだ。"
 mining_survey_events.43.a: "谷を放棄せよ。土壌は死んでおり、ここに[ShowGoodsNameWithNoTooltip('saltpeter')]はない。"
 mining_survey_events.43.historical_info: "硝石を含む土壌は無限ではなかった。湿った施肥土壌で硝石が自然に生成されるまでには何年もかかり、集中的な採取をおこなえば容易に枯渇してしまう。ドイツの硝石職人が人工硝石の生産施設を計画的に建設する伝統は、それゆえに生まれたのである。そこでは、堆肥、石灰、灰を積み重ね、長年にわたり管理することで、安定した硝石の収穫を実現していた。硝石の「採集」から「製造」への移行は、産業革命以前の火薬生産を合理化する上で大きな一歩となった。"
