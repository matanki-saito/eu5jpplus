l_japanese:
 crisis_of_faith.1.title: "分裂の勃発"
 crisis_of_faith.1.desc: "国教会への献身は衰退し、信徒はもはやその教えに耳を傾けない。分離派の説教師が信者を集める一方で、聖職者は改革派と強硬派に分裂している。我々は選択をしなければならない。改革派に歩み寄るか、この分裂を炎と剣で鎮圧するか。"
 crisis_of_faith.1.a: "改革派に応じる。"
 crisis_of_faith.1.b: "分離派を鎮圧せよ！"
 crisis_of_faith.1.tt: "最も混迷を極めた州が[ShowDisasterName('crisis_of_faith')]派を支持して蜂起する"
 crisis_of_faith.1.a.tt: "最も混迷を極めた州の一部で聖職者が[ShowDisasterName('crisis_of_faith')]派に参加する"
 crisis_of_faith.2.title: "異端の拡大"
 crisis_of_faith.2.desc: "信徒たちの集団が分離派の教義に改宗する事態が相次いで報告されている。伝染が広がる前に忠実な聖職者を派遣して異端者を根絶やしにするか、それともこのまま放置して熱狂が自然に冷めるのを待つべきか。"
 crisis_of_faith.2.a: "異端者を根絶やしにせよ。"
 crisis_of_faith.2.b: "このまま静観する。"
 crisis_of_faith.3.title: "信徒の結集"
 crisis_of_faith.3.desc: "分裂をものともせず、信徒の群衆が集い、正当な信仰への誓いを新たにしている。彼らの熱意が、国内に献身の炎を燃え上がらせるかもしれない。だが放置すれば、情熱が動乱に変じる可能性もある。"
 crisis_of_faith.3.a: "熱狂を受け入れる。"
 crisis_of_faith.3.b: "秩序を維持せよ。"
 crisis_of_faith.4.title: "聖職者による教義改革の要求"
 crisis_of_faith.4.desc: "穏健派の聖職者からなる使節団が、教会教義を改訂し、分裂が広がる前に修復するよう我々に請願した。この改革を受け入れれば、聖職者をなだめて分裂の進行を遅らせることができるが、神聖な教義を変えることは簡単ではない。拒絶すれば現状を維持できるが、聖職者の好意が代償になる。"
 crisis_of_faith.4.a: "改革を許可する。"
 crisis_of_faith.4.b: "教義の変更を拒否せよ。"
 crisis_of_faith.5.title: "異端審問の機会"
 crisis_of_faith.5.desc: "最も熱心な聖職者が、分裂派を異端審問にかけるよう乞うている。粛清を行えば信仰心が取り戻され、異端者は畏怖するが、恐怖が国内に広がるだろう。民にこれ以上の苦しみを与えないよう、自制を選ぶことも可能である。"
 crisis_of_faith.5.a: "異端審問を開始せよ。"
 crisis_of_faith.5.b: "自制する。"
 crisis_of_faith.12.title: "分裂の後援者"
 crisis_of_faith.12.desc: "分裂派の運動が資金源を得た。[crisis_of_faith_heresiarch_scope.GetName]が我々の貴族の館に迎え入れられ、その扉を開いた貴族は、我々が禁じた説教原稿の説教の写本の費用を支援している。その貴族の忠誠を買うために裏から手を回すか、あるいは領内すべてを取り締まることはできないと割り切るべきか。"
 crisis_of_faith.12.a: "その忠誠を買い戻そう。"
 crisis_of_faith.12.b: "すべてを取り締まることはできない。"
 crisis_of_faith.13.title: "公での説教"
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName]が説教の場を地下から市場の広場に移し、分裂の教義を声高に語るようになった。群衆が集まるなか、誰も止めようとはしなかった。説教を封じればわが教会の権威を示すことができるが、公衆の面前で説教者を説教壇から引きずり下ろせば醜聞をさらすことになる。"
 crisis_of_faith.13.a: "説教者を黙らせろ。"
 crisis_of_faith.13.b: "信徒たち自身に判断させよ。"
 crisis_of_faith.100.title: "異端の鎮圧"
 crisis_of_faith.100.desc: "分裂は修復された。分離派の説教者は散り散りに逃げ、信者の群れも囲いへと戻り、聖職者はひとつの教義のもとに再統合された。わが教会は刷新され、その権威と共に我々の信仰心が取り戻された。"
 crisis_of_faith.100.a: "この信仰は永続する。"
 crisis_of_faith.101.title: "分裂の教義が定着"
 crisis_of_faith.101.desc: "分裂は決定的になった。改革派の教義は我々の教会と宮廷に根を下ろし、旧来の教義は捨て去られる。今後1世代にわたって、わが国では信仰が分裂し、聖職者も王権に完全には従わないだろう。"
 crisis_of_faith.101.desc.heresiarch: "分離派が勝利を収め、その中心には一人の人物があった。改革派の教義を説きつづけた[crisis_of_faith_heresiarch_scope.GetName]の声を抑え込むことは難しくなっていた。しかし我々の権威を打ち砕いたのは、反乱した聖職者だった。戦場で勝利した聖職者は[crisis_of_faith_heresiarch_scope.GetNameWithNoTooltip]の即位を宣言し、わが教会に異議を唱えられる者は誰も残っていない。我々が守ってきた神聖なるものも、静かに脇へと追いやられた。"
 crisis_of_faith.101.a: "分裂派の勝利だ。"
 crisis_of_faith.101.b: "異端の首唱者に王座を譲ろう。"
 crisis_of_faith.102.title: "信仰の放棄"
 crisis_of_faith.102.desc: "我々はもはや教会として統治していない。分裂派が何を説こうとも、わが聖職者がそれに答えることはない。わが聖職者は、もはや国家を代弁していないのだ。我々が守護義務を放棄した教義を、信徒たちはまだ口に残している。そして古き正統を守りつづけた人々は、我々が置き去りにしたことを忘れないだろう。"
 crisis_of_faith.102.a: "教会はもう我々の統治下にない。"
 crisis_of_faith.10.title: "信仰の再生を説教"
 crisis_of_faith.10.desc: "わが国で最も敬虔な聖職者たちを民のもとへ派遣し、信仰の再生を説き、信徒を正しい教えへと呼び戻す。その説教は国中で信仰心を再び燃え上がらせ、分離派の支持を弱めるが、偉大な信仰復興による混乱が秩序を揺るがすだろう。"
 crisis_of_faith.10.a: "説教者を派遣せよ。"
 crisis_of_faith.10.a.tt: "現在[ShowDisasterName('crisis_of_faith')]派を支持するすべてのPOPが一定の満足度を得る"
 crisis_of_faith.11.title: "教会会議を召集"
 crisis_of_faith.11.desc: "対立する教義に決着をつけるため、聖職者を教会会議に召集する。集まった聖職者たちは正統な教えのもとに結束を固め、分裂派を孤立させて教会に一定の統一をもたらす。"
 crisis_of_faith.11.a: "会議を召集せよ。"
 crisis_of_faith.11.a.tt: "現在[ShowDisasterName('crisis_of_faith')]派を支持するすべてのPOPが一定の満足度を得る"
 crisis_of_faith.6.title: "分離の黒幕"
 crisis_of_faith.6.desc: "我々の諜報員に禁じられた説教の出どころを探らせたところ、書写者や伝令をさかのぼり、すべての手がかりが同じ場所にたどり着くことがわかった。[crisis_of_faith_heresiarch_scope.GetName]こそが分裂の教義の筆者であり、これまではわが教会からそれを説いていたのだ。"
 crisis_of_faith.6.a: "異端の首唱者の名を公表せよ。"
 crisis_of_faith.6.a.tt: "異端の首唱者が特定され、アクション「異端の首唱者を糾弾する」がアンロックされる"
 crisis_of_faith.7.title: "異端の首唱者を糾弾する"
 crisis_of_faith.7.desc.ready: "王室に権威が戻り、さっそくそれを行使するときが来た。信徒たちの前で[crisis_of_faith_heresiarch_scope.GetName]を名指しし、その過ちを余すところなく列挙し、分裂を可能にした地位を剥奪する。改革派の教義など、その提唱者がいなければただの噂にすぎない。"
 crisis_of_faith.7.desc.not_ready: "信徒たちの前で[crisis_of_faith_heresiarch_scope.GetName]の名指しし、分裂に終止符を打ちたいところだが、王室にはこの場を支配するだけの力がない。首唱者を庇護する聖職者は、断罪せんとする王座よりも強大であり、告発が失敗に終われば、王権が退けられたとして記憶されるだろう。"
 crisis_of_faith.7.a: "信徒の前で異端の首唱者を糾弾せよ。"
 crisis_of_faith.7.a.fail_tt: "王室には異端の首唱者に対して行動を起こすだけの権威がない"
 crisis_of_faith.8.title: "分離派に譲歩する"
 crisis_of_faith.8.desc: "分離は打ち破れないのなら、買収するしかない。改革派が求める教義と、それに伴うわが教会内での地位を与えよう。派閥は瓦解し、説教者たちは正当な権利として自分たちのものとなった会衆の元へ戻る。これにより我々の信仰心が回復することはなく、この譲歩を撤回することはできない。"
 crisis_of_faith.8.a: "彼らの教義を認めよう。"
