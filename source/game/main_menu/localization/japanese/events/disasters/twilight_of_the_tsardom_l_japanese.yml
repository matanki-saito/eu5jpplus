l_japanese:
 twilight_of_the_tsardom.1.title: "$rank_empire_bulgarian$の衰退"
 twilight_of_the_tsardom.1.desc: "かつては[ShowRegionName('balkan_region')]中に旗を掲げていた我々の力も、いまや年々衰えていくばかりだ。そうして我らの権威が形骸化していくなか、敵が全方位から迫っている。過去の戦と内紛の傷跡は癒える気配すらなく、何かしらの思い切った行動に出なければ[GetCountry('BUL').GetFlavorRank]は人々の記憶の隅に追いやられてしまうだろう。第一次[GetCountry('BUL').GetAdjective]帝国を襲った悲惨な崩壊を防ぐためにも、我々はあらゆる手を尽くさなくてはならない。"
 twilight_of_the_tsardom.1.a: "[GetCountry('BUL').GetFlavorRank]は滅びぬ！"
 twilight_of_the_tsardom.1.a.tt: "[ShowLocationName('constantinople')]を所有しないまま[disaster|e]「$twilight_of_the_tsardom$」を完了すると、以下の結果につながる："
 twilight_of_the_tsardom.1.a.tt2: "[ShowLocationName('constantinople')]を所有した状態で[disaster|e]「$twilight_of_the_tsardom$」を完了すると、以下の結果につながる："
 twilight_of_the_tsardom.1.a.tt3: "[ShowLocationName('constantinople')]を所有した状態で、なおかつ[great_power|e]である場合に、[disaster|e]「$twilight_of_the_tsardom$」を完了すると以下の結果につながる："
 twilight_of_the_tsardom.1.historical_info: "1241年のイヴァン・アセン2世の逝去を皮切りに、ブルガリアは長期にわたる統治体制の脆弱化、貴族の内紛、モンゴルからの襲撃などに悩まされることとなり、後に続いた統治者たちが外国の侵略に抵抗しれなかったことから、領土の大部分が失われてしまう。国内の不安定さはイヴァイロの台頭によって頂点に達し、その後何十年ものあいだ内戦や外国からの干渉が続くこととなる。14世紀初頭には一時的に回復したものの、1330年にヴェルブジュドで敗北を喫し再び外圧が強まったことで、ブルガリアは1337年まで衰退の一途をたどっていく。弱ったきり争いから立ち直れなかったブルガリアは、最終的にオスマン帝国の手に落ちることとなった。"
 twilight_of_the_tsardom.2.title: "$rank_empire_bulgarian$の存続"
 twilight_of_the_tsardom.2.desc: "状況は非常に厳しかったが、$rank_empire_bulgarian$は長年の混乱、陰謀、そして衰退を乗り越えた。爪痕はいまだ残り、往年の国力を取り戻せてはいないが、わが国は多くの者たちが絶望視していた国難を切り抜けたのだ。黄昏は過ぎ去ったが、わが国に新たな夜明けが訪れるかどうかはまだわからない。"
 twilight_of_the_tsardom.2.a: "失ったものを復興させよう。"
 twilight_of_the_tsardom_modifier_removal_tt: "「[ShowModifier('bul_powerful_local_elites')]」がすべての所有ロケーションから取り除かれる"
 twilight_of_the_tsardom.3.title: "[GetCountry('BUL').GetNameWithNoTooltip]の台頭"
 twilight_of_the_tsardom.3.desc: "危機の淵から甦った[GetCountry('BUL').GetName]は、かつての姿を取り戻したばかりか、さらに勢いを増しているとさえ言える。[ShowLocationName('constantinople')]の制圧など、混乱期にあったころの暗黒の日々からは想像できないほどの偉業だ。この$rank_empire_bulgarian$はいまや[ShowRegionName('balkan_region')]の覇者とも言える存在であり、かつて我々の力を疑った者たちはみな、我々が復活したという事実を直視せねばならない。"
 twilight_of_the_tsardom.3.a: "世界に我々の力を見せてつけてやろう！"
 twilight_of_the_tsardom.4.title: "新たな帝国の夜明け"
 twilight_of_the_tsardom.4.desc: "[GetCountry('BUL').GetAdjective]・$rank_empire_bulgarian$は、かつて崩壊の危機に直面したものの、現在では世界屈指の国としてその名を馳せている。生存をかけた戦いのなかで我々は力と希望を見出したが、それらはいま、新たな帝国の台頭とともに頂点に達した。[ShowLocationName('constantinople')]を手中に収めたことで、我々の名は確実に歴史に刻まれることとなる。これが後世において、第三次[GetCountry('BUL').GetAdjectiveWithNoTooltip]帝国の興りとして記憶されることを願おう！"
 twilight_of_the_tsardom.4.a: "黄金時代がここに幕を開ける！"
 twilight_of_the_tsardom.5.title: "我々の権威に疑問を呈する地方の上流階級"
 twilight_of_the_tsardom.5.desc: "[target_location.GetName]の地方の上流階級の者たちが、我々の布告を無視し、まるで自分たちこそが君主であるかのように、勝手な振る舞いをしはじめた。このままでは中央権力の弱体化が追い風となり、ほかの者たちまでもがすぐに彼らのあとに続いてもおかしくない。いま思い切った決断を下せなければ、さらなる規模の分断に発展するおそれがある。"
 twilight_of_the_tsardom.5.a: "わが国には、それよりも優先するべき懸念事項がある。"
 twilight_of_the_tsardom.5.b: "[target_location.GetNameWithNoTooltip]に対する支配権を取り戻すのだ。"
 twilight_of_the_tsardom.6.title: "反逆罪に問われた廷臣"
 twilight_of_the_tsardom.6.desc: "我々が信頼を置く顧問の一人である[target_character.GetName]に、重大な容疑がかけられた。なんでも[target_character.GetSheHe|U]は、我らが$rank_empire_bulgarian$の機密情報と引き換えに、外国勢力から金銭を受け取っていた疑いがあるのだという。現時点で確たる証拠は見つかっていないものの、こうした疑惑が持ち上がること自体が[ROOT.GetCountry.GetGovernment.GetCourtTitle]内に不安を生じさせる要因となる。この件を無視すれば、我々の内にいる裏切り者がなんの咎めも受けることなく活動を続けられることになってしまうが、かといって焦って行動すると、忠実なる僕を不当に罰することになってしまう可能性がある。"
 twilight_of_the_tsardom.6.a: "すぐに[target_character.GetName]を追放せよ！"
 twilight_of_the_tsardom.6.b: "きっとただの噂に違いない……"
 twilight_of_the_tsardom.7.title: "陸軍内の反逆者"
 twilight_of_the_tsardom.7.desc: "報酬がいまだ支払われないことで兵士たちは不満を露わにし、将校らが秩序を維持しようと奮闘するなか、陸軍の士気が低迷している。賃金の支払いは日を追うごとに遅れ、指揮系統も崩壊に近づくばかりで、このままではかつて国力を支える柱だった兵士たちが、国を脅かす存在になりかねない。"
 twilight_of_the_tsardom.7.a: "払うべきものを払ってやれ。"
 twilight_of_the_tsardom.7.b: "賃金を払ってやれる余裕はない。"
 twilight_of_the_tsardom.7.c: "勢いを増す前に反逆者どもを潰せ！"
 twilight_of_the_tsardom.8.title: "反抗的な従属国"
 twilight_of_the_tsardom.8.desc: "[subject_target.GetName]の上流階級たちがどんどん反抗的になってきており、密かに共謀して、国家への忠誠の限界を試しているとの噂が首都に届いた。現時点ではまだ公然と謀反を起こした者はいないが、信頼できる筋からの報告によると、彼らの[subject_target.GetGovernment.GetCourtTitle]では独立の話が絶えずささやかれているのだという。"
 twilight_of_the_tsardom.8.a: "妥協案を講じて彼らの機嫌を取れ。"
 twilight_of_the_tsardom.8.b: "現時点で我々にできることはほとんどない。"
 twilight_of_the_tsardom.9.title: "賃金未払いの守備隊"
 twilight_of_the_tsardom.9.desc: "地元の統治者が防衛をおろそかにし、守備隊にまともな賃金を支払わないと訴える[target_location.GetName]の防衛兵たちが、どんどん反抗的な態度を取るようになってきている。彼らは[target_area.GetName]全土を守る要衝の防衛を任されているが、自分たちを養うこともできない王に忠誠を誓いつづける理由を見失いつつある。"
 twilight_of_the_tsardom.9.a: "いますぐ彼らに賃金を支払うのだ！"
 twilight_of_the_tsardom.9.b: "地元の上流階級に支払いを命じろ。"
 twilight_of_the_tsardom.9.c: "我々に金を払う余裕などない。"
 twilight_of_the_tsardom.10.title: "2つの階級の争い"
 twilight_of_the_tsardom.10.desc: "近年における中央権力の弱体化が$rank_empire_bulgarian$の2つの階級を増長させてしまい、力が弱まった[GetEstateName('crown_estate')]に対する影響力を高めようと互いに争うようになった。一触即発の対立状態にあった両者が、ついに相手への敵意を公然と剥き出しにするようになったことで、我々も中立性を保つことがますます難しくなっている。両勢力を敵に回しかねない危険な状況だが、いまなら国内の分断を深める覚悟で、どちらか一方の忠誠を確保できる可能性がある。"
 twilight_of_the_tsardom.10.a: "[first_estate.GetNameWithNoTooltip]の味方につくとしよう。"
 twilight_of_the_tsardom.10.b: "[second_estate.GetNameWithNoTooltip]の利益を守ることにしよう。"
 twilight_of_the_tsardom.10.c: "この争いにおいて、どの立場の味方もしてはならない。"
 bul_restore_the_realms_unity: "帝国の再統一"
 bul_restore_the_realms_unity_desc: "かつて[GetCountry('BUL').GetFlavorRank]にとって不可分の領土であった地域も、いまや我々の支配から逃れ、王権の及ばぬ地となってしまった。この衰退期を乗り越えるには、それらの地を再び祖国へ再統合しなくてはならない。必要なら武力の行使も視野に入れなければ……"
 bul_reassert_our_authority: "権力の再確立"
 bul_reassert_our_authority_desc: "[GetCountry('BUL').GetName]が内部に抱える脆弱性は、[GetCountry('BUL').GetFlavorRank]の多くの上流階級を増長させることとなり、彼らはいまや我々の権威に逆らい、まるで主君など存在しない体で各々の土地を治めている。これ以上国が分断するのを防ぐためにも、彼らの領土に対する支配権を再び主張し、力ずくでも我々の前で膝を折ってもらわねばならない。"
 bul_push_for_diplomatic_reintegration: "外交による再統合の促進"
 bul_push_for_diplomatic_reintegration_desc: "内戦の勃発を防ぐため、我々は各領主が自らの名のもとに治めている一部の領土を彼らに譲り渡した。短期的には効果があるかもしれないが、外交を通じて$rank_empire_bulgarian$の再統合を目指すことこそが、我々にとっての最善の道となる。国が分断されたままで、この先に訪れる試練を乗り越えられるはずがない。"
 twilight_of_the_tsardom.11.title: "ハゲタカに囲まれて"
 twilight_of_the_tsardom.11.desc: "内乱による消耗が続いているわが国に目を付けた近隣諸国が、瀕死の獣の周りを旋回するハゲタカのように好機をうかがっている。我々が弱っていることを察知したあの連中は、わが$rank_empire_bulgarian$に残されたものを奪い取ろうと、我々の一挙手一投足を観察しながら、攻撃に出る瞬間を辛抱強く待っているのだ。そんななか、最近になって[target_country.GetName]が[border_claim_province.GetName]の領有権を主張していることが明らかとなった。機会があればこれを奪取しようと画策しているのだろう。"
 twilight_of_the_tsardom.11.a: "やれるものならやってみるがいい！"
 twilight_of_the_tsardom.11.b: "賄賂を払って主張を撤回してもらおう。"
