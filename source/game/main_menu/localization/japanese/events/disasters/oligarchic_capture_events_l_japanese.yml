l_japanese:
 oligarchic_capture.1.title: "寡頭派の台頭"
 oligarchic_capture.1.desc: "何年もの衰退が、わが国の共和制度を空洞化させた。弱体化を察知した支配階級が立法機関を手に入れようと動き出し、競合相手を締め出して法を意のままに曲げようとしている。寡頭派に屈して脆い平和を維持するか、公然たる反乱に発展する危険を冒してでも抵抗するか。我々はこの試練にどう立ち向かうか決めなければならない。"
 oligarchic_capture.1.a: "寡頭派の要求に屈するしかない。"
 oligarchic_capture.1.b: "いかなる代償を払おうとも抵抗せよ！"
 oligarchic_capture.1.tt: "特に不満を抱える州が蜂起し、[ShowDisasterName('oligarchic_capture')]の支持に回る"
 oligarchic_capture.2.title: "寡頭派が貢物を要求"
 oligarchic_capture.2.desc: "寡頭派の指導者たちは、公共の利益への寄付という名目で、実質的に金銭を要求している。支払えば彼らの扇動は一時的に収まるが、拒否すれば我々の反抗を自らの大義への支持拡大に利用するだろう。"
 oligarchic_capture.2.a: "金を払ってやれ。"
 oligarchic_capture.2.b: "我々は恐喝に屈しない。"
 oligarchic_capture.3.title: "改革を求める市民の結集"
 oligarchic_capture.3.desc: "群衆が広場に集まり、公正な政府の復活と寡頭派統治の終結を求めている。彼らの熱狂は共和制の精神を取り戻す機運となるが、その要求に応じることは無秩序を招く危険を孕んでいる。"
 oligarchic_capture.3.a: "彼らの大義を支持する。"
 oligarchic_capture.3.b: "街なかの秩序を守れ。"
 oligarchic_capture.4.title: "元老院議員の派閥の粛清"
 oligarchic_capture.4.desc: "寡頭派が不忠とみなした元老院議員の派閥を追放しようと動いた。粛清を許容すれば国内が短期的に安定するが、寡頭派の勝利を再び許すことになる。告発された者たちを擁護すればわが国の体制を守れるが、さらなる混乱がその代償となる。"
 oligarchic_capture.4.a: "粛清を開始する。"
 oligarchic_capture.4.b: "告発された者たちを守れ。"
 oligarchic_capture.5.title: "街なかの不穏"
 oligarchic_capture.5.desc: "寡頭派の支持者と反対派の小競り合いが市場や波止場にまで広がっている。我々は双方の怒りが自然に鎮まるのを待つことも、衛兵を派遣して断固たる態度で秩序を回復させることもできる。"
 oligarchic_capture.5.a: "怒りが鎮まるのを待とう。"
 oligarchic_capture.5.b: "厳しく取り締まれ。"
 oligarchic_capture.100.title: "共和制の復帰"
 oligarchic_capture.100.desc: "寡頭派の支配は打ち砕かれた。わが国の法廷、評議会、議会は、少数の大貴族ではなく、再び市民全体の意思に従う。共和国は嵐を乗り切り、その諸制度はこの試練に鍛え上げられたのだ。"
 oligarchic_capture.100.a: "わが国の制度は耐え抜いた。"
 oligarchic_capture.101.title: "寡頭派憲法の定着"
 oligarchic_capture.101.desc: "寡頭派は勝利した。寡頭派のために起草された新しい憲法は、その優位性を国家の基礎に根づかせた。一世代にわたってわが共和国の名は形骸化し、官職は限られた有力者層が独占しつづけるだろう。"
 oligarchic_capture.101.desc.ringleader: "寡頭派は勝利を収め、首謀者の[oligarchic_ringleader_scope.GetName]が元老院の裏舞台から歩み出て、堂々と王冠を戴く。一世代にわたってわが共和国の名は形骸化し、官職は限られた有力者層が独占しつづけるだろう。"
 oligarchic_capture.101.a: "寡頭派が勝った。"
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName]が王座に就いた。"
 oligarchic_capture.6.title: "首謀者の正体を暴く"
 oligarchic_capture.6.desc: "わが諜報員たちは、何週間もかけて派閥の序列を通じた金銭、便宜、秘密裏の指示などをたどってきた。そしてついに、その進路を真に操る者として、ただひとつの名が浮かび上がった。[oligarchic_ringleader_scope.GetName]である。"
 oligarchic_capture.6.a: "これで対処すべき相手がわかった。"
 oligarchic_capture.7.title: "首謀者と対峙"
 oligarchic_capture.7.desc.ready: "[oligarchic_ringleader_scope.GetName]を突き止めたからには、直接手を打つことができる。王権も十分に回復しており、寡頭派を速やかに瓦解させられるはずだ。"
 oligarchic_capture.7.desc.not_ready: "[oligarchic_ringleader_scope.GetName]を突き止めたからには、直接手を打つことができる。だが、王権は十分に回復していない。行動に移す時期が早すぎると、寡頭派を結束させてしまうかもしれない。"
 oligarchic_capture.7.a: "奴らに対して手を打とう。"
 oligarchic_capture.7.a.success_tt: "わが[crown_power|e]が30%以上に達したため、試みは成功する"
 oligarchic_capture.7.a.fail_tt: "わが[crown_power|e]が30%未満のため試みは失敗し、その反発によりわが国の安定度が大きく低下する"
 oligarchic_capture.8.title: "階級の特権を交渉"
 oligarchic_capture.8.desc: "寡頭派と真っ向から対峙するのではなく、秘密裏に交渉を持ち、金と少しばかりの特権を与えることで不満を和らげ、その成長を鈍らせる。"
 oligarchic_capture.8.a: "交渉を開始する。"
 oligarchic_capture.12.title: "首謀者が廷臣に取り入る"
 oligarchic_capture.12.desc: "寡頭派の首謀者がわが宮廷の者の支持を取り入ろうと、密かに恩恵や約束をちらつかせているとの報せが届いた。見て見ぬふりをするか、あるいはその廷臣の忠誠を固めるべく動くこともできる。"
 oligarchic_capture.12.a: "放っておけ。気にかけるに値しない。"
 oligarchic_capture.12.b: "廷臣の王室への忠誠を再確認せよ。"
 oligarchic_capture.13.title: "首謀者が王族階級を試す"
 oligarchic_capture.13.desc: "寡頭派の首謀者が王室身分の権威がなお及ぶ範囲を公然と試し、廷臣たちの前で弱みを探っている。この挑戦を黙認することも、断固とした対応を取ることもできる。"
 oligarchic_capture.13.a: "挑戦を見過ごす。"
 oligarchic_capture.13.b: "断固として対応せよ。"
 oligarchic_capture.10.title: "市民の結集"
 oligarchic_capture.10.desc: "使者が我々の呼びかけをすべての地区や市場へ広める。「共和国は大貴族のものではない、市民のものである」と。古い秩序を再び掲げようとする人々で広場が埋め尽くされたが、これだけの人が集まると混乱の危険も伴う。"
 oligarchic_capture.10.a: "広場へ！"
 oligarchic_capture.11.title: "寡頭派を粛清"
 oligarchic_capture.11.desc: "我々は寡頭派の指導者たちを直接叩くことを決断した。逮捕などにより組織を崩壊させ、彼らの各機関に対する支配は弱まった。この強硬手段に貴族たちは激怒し、国内に動揺が広がったが、寡頭派の勢力を削ぐことができた。"
 oligarchic_capture.11.a: "指導者たちを叩け。"
