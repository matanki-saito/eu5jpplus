l_japanese:
 #Loc macros
 bra_hre_hyperlink: "[GetUniqueInternationalOrganization('hre').GetName]"
 bra_hre_hyperlink_no_tt: "[GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]"
 bra_hre_emperor_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle]"
 bra_hre_emperor_country_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetName]"
 bra_wittelsbach_hyperlink: "[ShowDynastyName('wittelsbach_dynasty')]"
 bra_wittelsbach_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('wittelsbach_dynasty')]"
 bra_askanier_hyperlink: "[ShowDynastyName('askanier_dynasty')]"
 bra_askanier_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('askanier_dynasty')]"
 bra_variable_counter: "現在#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_investment_var').GetValue]#!"
 bra_neglect_variable_counter: "現在#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_neglect_var').GetValue]#!"
 bra_wittelsbacher_investment_var: "#Y ヴィッテルスバッハ家の投資#!"
 bra_wittelsbacher_neglect_var: "#Y ヴィッテルスバッハ家による放置#!"
 bra_change_investment_score_add: "$bra_wittelsbacher_investment_var$を$VALUE|G0$得る$bra_variable_counter$"
 bra_change_investment_score_subtract: "$bra_wittelsbacher_investment_var$を$VALUE|R0$失う$bra_variable_counter$"
 bra_change_neglect_score_add: "$bra_wittelsbacher_neglect_var$を$VALUE|G0$得る$bra_neglect_variable_counter$"
 bra_change_neglect_score_subtract: "$bra_wittelsbacher_neglect_var$を$VALUE|R0$失う$bra_neglect_variable_counter$"
 PRU_DEAL_WITH_ROBBER_BARONS_TOOLTIP_IN_PROGRESS: "進行度：$PROGRESS$%\n$DAYS$、$DATE$"
 #Events
 turmoil_in_brandenburg.1.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の[root_dynasty.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1.desc.start: "1320年、[ROOT.GetCountry.GetName]の$bra_askanier_hyperlink$の最後の一員である[GetCharacter('bra_heinrich_ii_askanier').GetName]が死亡したことにより、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の土地は、$bra_hre_hyperlink$の皇帝に選ばれた[GetCharacter('ubv_ludwig_iv_wittelsbach').GetName]の手に収まることとなった。北部の[ShowCultureGroupName('german_group')]領土の管理を維持するために、[GetCharacter('ubv_ludwig_iv_wittelsbach').GetShortNameWithNoTooltip]は[GetCharacter('bra_ludwig_v_wittelsbach').GetDaughterSon]の[GetCharacter('bra_ludwig_v_wittelsbach').GetName]を、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]辺境伯に任命した。"
 turmoil_in_brandenburg.1.desc: "$turmoil_in_brandenburg.1.desc.start$\n\nこれは[ROOT.GetCountry.GetNameWithNoTooltip]の$bra_wittelsbach_hyperlink$時代の始まりである。それは動乱の時代だった。[ROOT.GetCountry.GetGovernment.GetRulerTitle]が若くして統治者となったがために、[GetCharacter('hnb_berthold_iv_henneberg_schleusingen').GetName]の手に多くの行政が委ねられたためである。泥棒男爵、経済問題、そして[ROOT.GetCountry.GetGovernment.GetRulerTitle]に対する住民のさまざまな不満が、[GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip]の統治を苛んでいる。そして$bra_wittelsbach_hyperlink_no_tt$は、北部の領地をほとんど気にかけていない有様だ……"
 turmoil_in_brandenburg.1.desc.fallback: "$turmoil_in_brandenburg.1.desc.start$\n\nしかし、[GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip]の統治は短命に終わり、[root_ruler.GetName]が[ROOT.GetCountry.GetNameWithNoTooltip]を支配するようになった。それでもなお、経済問題や泥棒男爵が[ROOT.GetCountry.GetGovernment.GetRulerTitle]の権威を汚しているが、$bra_wittelsbach_hyperlink$は未開拓の国境地帯の現状を変えることにまったく関心を示していないようだ……"
 turmoil_in_brandenburg.1.a: "[ROOT.GetCountry.GetNameWithNoTooltip]は乗り越える！"
 turmoil_in_brandenburg.1.a.at: "わが国に対する[control|e]が低下する！"
 turmoil_in_brandenburg.1.a.bt: "この国難を乗り切るには、王朝の危機、そして泥棒男爵の跋扈により生じた混乱を解決する必要もある。"
 turmoil_in_brandenburg.2.title: "$bra_wittelsbach_hyperlink_no_tt$の時代の終わり"
 turmoil_in_brandenburg.2.desc: "$bra_wittelsbach_hyperlink$王朝の構成員が[ROOT.GetCountry.GetName]の君主の座から退き、経済停滞と怠惰の時代はついに終わりを告げた。国民の繁栄の時代は、いまや新たな統治者の手に委ねられたのだ。"
 turmoil_in_brandenburg.2.a: "これが黄金時代の幕開けとならんことを。"
 turmoil_in_brandenburg.2.a.tt: "$bra_wittelsbacher_investment_var$と$bra_wittelsbacher_neglect_var$が無効化される。"
 turmoil_in_brandenburg.3.title: "偽$name_waldemar$"
 turmoil_in_brandenburg.3.entry: "$turmoil_in_brandenburg.3.title$"
 turmoil_in_brandenburg.3.desc: "[target_character.GetHisHer]の話は当初、少し奇妙ではあるものの確かに説得力があった——いわく、統治者であった[target_character.GetHisHer]は、誰にも邪魔をされずに巡礼に赴くために、自らの葬儀を演出したのち、帰還したというのだ。しかし、王位継承のための新たな遊説が続くと、[target_character.GetHisHer]の“物語”にほころびが生じはじめた。1320年以前の[GetCharacter('bra_waldemar_askanier').GetName]を知る者たちもまた、[target_character.GetHisHer]の性格の説明のつかない変化を指摘した……\n\nそして、万人の衝撃とともに、ついに[target_character.GetHisHer]は名誉ある辺境伯を装った偽者、[target_character.GetName]だったことが明らかになったのだ！\n\nこうして、偽者が得ていたあらゆる支持は失われ、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の統治権は再び議論の余地のないものとなった。"
 turmoil_in_brandenburg.3.a: "まさか偽物が紛れ込むとは……誰が想像できただろうか？"
 turmoil_in_brandenburg.4.title: "泥棒男爵の暴政"
 turmoil_in_brandenburg.4.desc: "[ROOT.GetCountry.GetName]の泥棒男爵は、その封土の法的地位によって保護される[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の一員であり、地元住民に莫大な通行料と税金を課している。彼らも困窮しているのかもしれないが、それをこのまま許せば[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の発展を妨げるだろう……"
 turmoil_in_brandenburg.4.a: "泥棒男爵と戦おう。"
 turmoil_in_brandenburg.4.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 bra_peasants_revolt: "農民の反乱"
 turmoil_in_brandenburg.5.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の反乱"
 turmoil_in_brandenburg.5.desc: "[ROOT.GetCountry.GetName]の経済的低迷は、多くの[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]を苦しめ、激怒させた。彼らは、泥棒男爵が強いる苛烈な労働環境の改善を求め、それが受け入れられるまで働くことを拒んでいる……"
 turmoil_in_brandenburg.5.a: "彼らの状況を改善しよう。"
 turmoil_in_brandenburg.5.b: "彼らはただの農民だ。問題にはならない。"
 turmoil_in_brandenburg.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]の支配権掌握"
 turmoil_in_brandenburg.6.desc: "$bra_wittelsbach_hyperlink$の権威は書面上では存在するものの、民に対する実際的な権威は、民が従うことを決めた者たちの手にある。農村集落では、それは[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]である。我々がこれらの土地で権威を保ちたければ、聖職者の権力を剥奪しなければならない……"
 turmoil_in_brandenburg.6.a: "彼らの権力を剥奪せよ。"
 turmoil_in_brandenburg.6.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]に干渉すべきではない。"
 turmoil_in_brandenburg.7.title: "都市税の拒否"
 turmoil_in_brandenburg.7.desc: "[ROOT.GetCountry.GetName|U]は深刻な状況に陥っている。国土は人口がまばらで、開発も進んでいない。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の制度に加えられてきた改良の大半は、市街地に課される税金で賄われている。しかし[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]たちは、$bra_wittelsbach_hyperlink$を彼らの主権者として認める理由がほとんどないと考えており、それゆえに税の支払いも拒んでいる……"
 turmoil_in_brandenburg.7.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の手綱を握れ。"
 turmoil_in_brandenburg.7.b: "$common_string_leave_them_be$"
 turmoil_in_brandenburg.8.title: "[target_character.GetShortNameWithNoTooltip]の私領"
 turmoil_in_brandenburg.8.desc: "[target_location.GetName]からの報告によれば、[target_character.GetName]は自らの領地を、あたかもそれ自体がひとつの[ROOT.GetCountry.GetFlavorRank]であるかのように統治しているという。城壁はより高く、堀はより深くなり、兵たちは[target_character.GetHerHim]にのみ従っている。本来であれば[ROOT.GetCountry.GetGovernment.GetCourtTitle]で扱われるべき請願は、[target_character.GetHisHer]の館で裁定され、かつて[ROOT.GetCountry.GetGovernment.GetRulerTitle]に納められていた通行料や税は、いまや[target_character.GetHerHis]の金庫を満たしている。多くの者にとって、[ROOT.GetCountry.GetName]の領土と[target_character.GetShortNameWithNoTooltip]の私領との区別は、危険なほど曖昧になりつつある……"
 turmoil_in_brandenburg.8.a: "いまのところは黙認しよう。"
 turmoil_in_brandenburg.8.b: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]の上に立つ領主など存在してはならない。"
 tib_outcome_8_1_tt: "我々の諜報員が、[target_character.GetShortNameWithNoTooltip]がもはや我々を煩わせることのないよう手を打つ"
 tib_outcome_8_2_tt: "[target_location.GetName]の[ShowEstateTypeName('nobles_estate')]が、我々の介入に激しい憤りを募らせることになる"
 tib_outcome_8_3_tt: "この決定により、この領内全域の[ShowEstateTypeName('nobles_estate')]との関係が悪化する"
 turmoil_in_brandenburg.9.title: "[target_province.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]同盟"
 turmoil_in_brandenburg.9.desc: "[target_province.GetName]の農村部一帯で、いくつもの有力家門が正式な同盟を結んだ。彼らは相互防衛を誓い、共同で裁判を開き、今後は王家に仕える役人が自分たちの問題に介入することに抵抗するとして合意を交わしている。\n\n多くの地元民にとって、[target_province.GetNameWithNoTooltip]における実権は、もはや[ROOT.GetCountry.GetCapital.GetName]にいる[ROOT.GetCountry.GetGovernment.GetRulerTitle]ではなく、この[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の一団にあることは明白だった。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、このような連合を黙認すれば、中央権力の衰退を早めるだけだという囁きも聞かれる。"
 turmoil_in_brandenburg.9.a: "この同盟を承認し、彼らの支持を得よう。"
 turmoil_in_brandenburg.9.b: "この結社を打ち砕き、我らの権威を取り戻そう。"
 nobles_in_target_province_gain_pop_satisfaction_extreme_bonus_tt: "[target_province.GetName]において我々の統治下にある[ShowEstateTypeName('nobles_estate')]の[pops|e]が、同盟の承認を得て大いに鼓舞されることにより、[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 lower_class_pop_satisfaction_weak_penalty_tt: "[target_province.GetName]の[lower_class|e]が領主の専横に憤り、[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%]低下する"
 nobles_in_target_province_may_agitate_locals_to_rebel_tt: "服従を強いられた[target_province.GetName]の[ShowEstateTypeName('nobles_estate')]が、我々の強硬姿勢に対する報復として、領民の不安をかき立てようとする可能性がある"
 turmoil_in_brandenburg.10.title: "[target_location.GetNameWithNoTooltip]の違法な通行料"
 turmoil_in_brandenburg.10.desc: "商人たちの訴えによると、[target_location.GetName]周辺の街道や橋が、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の野心的な構成員により王権の認可もなく設置された、新たな関所で埋め尽くされているという。荷車は止められ、積荷は検分され、そして「地元の保護」などという名目で金銭が要求されるとのことだ。\n\nこうした賦課に応じるすべての荷車は、本来なら[ROOT.GetCountry.GetGovernment.GetRulerTitle]に納めるべき金銭を奪われているのであり、また、法律が[ROOT.GetCountry.GetGovernment.GetCourtTitle]からではなく、最寄りの城から発布されているような印象を強めている。"
 turmoil_in_brandenburg.10.a: "通行料については、見て見ぬふりをしよう。"
 turmoil_in_brandenburg.10.b: "関所を撤去し、我々の権利を主張しよう。"
 turmoil_in_brandenburg.11.title: "[target_dynasty_2.GetNameWithNoTooltip]家に対する[target_dynasty_1.GetNameWithNoTooltip]家の挑戦"
 turmoil_in_brandenburg.11.desc: "[target_dynasty_1.GetName]家と我らが[target_dynasty_2.GetName]家のあいだで緊張が高まっている。宴席や狩猟、さらには評議の場においても、相手方の有力後継者たちは[ROOT.GetCountry.GetGovernment.GetRulerTitle]の判断と血統に疑義を呈し、自らの血筋もまた[ROOT.GetCountry.GetName]を統治するに足るとほのめかしている。\n\nささやかな中傷として始まった事態は、いまや宮廷における威信や後援、影響力を巡る公然たる争いにまで発展した。ここで断固たる姿勢を示さなければ、小領主たちは、わが王朝を数ある貴族家門のひとつにすぎないと考えるようになるだろう。"
 turmoil_in_brandenburg.11.a: "我らが[ROOT.GetCountry.GetGovernment.GetRulerTitle]を断固として支持する。"
 turmoil_in_brandenburg.11.b: "対立の激化を避けるため、[target_dynasty_1.GetNameWithNoTooltip]家に譲歩する。"
 target_character_2_will_challenge_the_power_nobles_tt: "[target_character_2.GetName]が、権力の正当性を巡って[ShowEstateTypeName('nobles_estate')]と正面から対峙する"
 turmoil_in_brandenburg.12.title: "[target_location.GetNameWithNoTooltip]への投資"
 turmoil_in_brandenburg.12.desc: "顧問たちは、王室の資金を[target_location.GetName]および[target_province.GetName]の周辺地域に投入する計画を提示した。新たな街道や市場、官庁施設を敷設・設置すれば、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の存在感は地方の奥深くまで及び、交易と裁判を掌握してきた地元有力者の支配力を弱められるという。\n\nしかし、当地の[ShowEstateTypeName('nobles_estate')]は、このような整備は我々ではなく自分たちの手でおこわれるべきだと主張し、自らの領域に中央が介入すれば、抵抗を招くだけだと警告している。"
 turmoil_in_brandenburg.12.a: "王室の資源を投じ、支配を強める。"
 turmoil_in_brandenburg.12.b: "この件に我々が関与する必要はない。"
 turmoil_in_brandenburg.13.title: "[target_location.GetNameWithNoTooltip]の発展"
 turmoil_in_brandenburg.13.desc: "[target_location.GetName]の有力者たちが、投資を求めて[ROOT.GetCountry.GetGovernment.GetCourtTitle]に請願をおこなった。新たな街路やギルド会館、公共事業に資金を費やせば、[target_province.GetName]の各集落と[ROOT.GetCountry.GetName]の結びつきはさらに強まり、地元民の不満も和らぐという。\n\n一方で財務官たちは、そのような大盤振る舞いは国庫を圧迫し、順番を待っている他の州からは贔屓と受け取られかねないと警告している。"
 turmoil_in_brandenburg.13.a: "[target_province.GetNameWithNoTooltip]全域に分散投資する。"
 turmoil_in_brandenburg.13.b: "[target_location.GetNameWithNoTooltip]に集中投資する。"
 turmoil_in_brandenburg.13.c: "そのような厚遇をおこなう余裕はない。"
 every_location_in_target_province_gains_center_of_urbanization_modifier_tt: "[target_province.GetName]内のすべての[location|e]が、[modifier|e]「[GetModifier('center_of_urbanization_modifier').GetNameWithTooltip]」を獲得する"
 every_location_in_target_province_gains_flourishing_capital_modifier: "[target_province.GetName]内のすべての[location|e]が、[modifier|e]「[GetModifier('flourishing_capital_modifier').GetNameWithTooltip]」を獲得する"
 every_location_in_target_province_gains_development_mild_bonus: "[target_province.GetName]内のすべての[location|e]において、[development|e]が[ShowNamedValue('development_weak_bonus')|+=]上昇する"
 every_location_in_target_province_gains_prosperity_extreme_bonus: "[target_province.GetName]内のすべての[location|e]において、[prosperity|e]が[ShowNamedValue('prosperity_severe_bonus')|+=2%]上昇する"
 turmoil_in_brandenburg.100.title: "$bra_wittelsbach_hyperlink_no_tt$による[ROOT.GetCountry.GetNameWithNoTooltip]の活性化"
 turmoil_in_brandenburg.100.entry: "$turmoil_in_brandenburg.100.title$"
 turmoil_in_brandenburg.100.desc: "貧困と荒廃、自治領と泥棒男爵の横暴、多くの困難と僭称者たちの出現——これらと闘った長き年月を経て、ついに$bra_wittelsbach_hyperlink$家が勝利し、[ROOT.GetCountry.GetName][ROOT.GetCountry.GetFlavorRank]は[ShowRegionName('north_german_region')]の至宝となった。[target_character.GetName]の支配に栄光あれ！"
 turmoil_in_brandenburg.100.a: "[ROOT.GetCountry.GetNameWithNoTooltip]は$bra_wittelsbach_hyperlink_no_tt$の誇りとなるだろう。"
 turmoil_in_brandenburg.200.title: "[target_character.GetNameWithNoTooltip]の謎"
 turmoil_in_brandenburg.200.desc: "[target_character.GetHisHer|U]の死は突然で予期せぬものだったが、その“遺産”はいまだに[ROOT.GetCountry.GetName]を悩ませている。1320年まで我らが[ROOT.GetCountry.GetFlavorRank]を統治していた[target_character.GetName]は、$bra_askanier_hyperlink$の出身と思われていたが、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]史上最も欺瞞に満ちた詐欺師であり策略家であることが判明した！\n\n[target_character.GetHisHer]の葬儀において、以前から用意されていた[target_character.GetHeShe]の墓が改めて整備された。しかし、墓のなかから[GetCharacter('bra_waldemar_askanier').GetName]の遺骨——すなわち$name_waldemar$が発見されたことで、葬儀は中断された。\n\n後ろ盾のない個人が国全体を騙すことに成功したこの事件は、当然ながら[ROOT.GetCountry.GetNameWithNoTooltip]の大きな恥辱となった……"
 turmoil_in_brandenburg.200.a: "どうしてこうなった？ 我々は愚か者ではないはずだが……"
 turmoil_in_brandenburg.300.title: "長い闘争の終結"
 turmoil_in_brandenburg.300.entry: "$turmoil_in_brandenburg.300.title$"
 turmoil_in_brandenburg.300.desc: "数十年にも及んだ[ROOT.GetCountry.GetLongName]を鎮撫し従わせるための苦闘が、ようやく終わりを告げた。我らが王座を巡り争った対立王朝は打ち払われ、泥棒男爵らの最後の拠点も跡形もなく打ち壊された。我らの断固たる行動は、国家を己の利となるよう作り変える好機をもたらした。今後、あのような苦難にも容易く耐えうる行政機構を築き上げていけるだろう。"
 turmoil_in_brandenburg.300.a: "ようやく平和が訪れた。"
 turmoil_in_brandenburg.1000.title: "[target_character.GetNameWithNoTooltip]の帰還"
 turmoil_in_brandenburg.1000.entry: "The Return of Target Character"
 turmoil_in_brandenburg.1000.desc: "もはや$bra_hre_hyperlink$の皇帝は統治する$bra_wittelsbach_hyperlink$とのつながりをもたず、それゆえに[bra_ruler.GetName]の正当性が再び疑問視されている。[ROOT.GetCountry.GetName]の国民は、$bra_askanier_hyperlink$の統治を切望しているのだ。\n\nしかし、運命のいたずらか、死んだと思われていた[target_character.GetName]が再び姿を現した！ [target_character.GetShortNameWithNoTooltip]は自分の葬儀が、聖地への巡礼に赴くための演出だったと主張し、[bra_ruler.GetShortNameWithNoTooltip]から[ROOT.GetCountry.GetAdjective]の王位を手に入れるために戻ってきたのだという。"
 turmoil_in_brandenburg.1000.desc.emperor_supports: "$turmoil_in_brandenburg.1000.desc$\n\n幸い、[emperor_ruler.GetName]と[bra_ruler.GetShortNameWithNoTooltip]との関係は良好である。よって$bra_hre_emperor_hyperlink$は僭称者に対抗し、$bra_wittelsbach_hyperlink_no_tt$家の支持を表明している。"
 turmoil_in_brandenburg.1000.desc.emperor_rejects: "$turmoil_in_brandenburg.1000.desc$\n\n残念ながら、$bra_hre_emperor_hyperlink$は$bra_wittelsbach_hyperlink_no_tt$よりも$bra_askanier_hyperlink_no_tt$家を好んでいる。そのため、[emperor_ruler.GetName]は[bra_country.GetNameWithNoTooltip]の統治権を[target_character.GetShortNameWithNoTooltip]に与えたのだ。[target_character.GetShortNameWithNoTooltip]の脅威を解決できるのは、[emperor_ruler.GetNameWithNoTooltip]との取引だけである……"
 turmoil_in_brandenburg.1000.a: "$bra_hre_emperor_hyperlink$と連絡を取れ！"
 turmoil_in_brandenburg.1000.a.at: "$bra_wittelsbach_hyperlink$王朝の一員を統治者とするすべての国は、[ROOT.GetCountry.GetName]に対する[opinion|e]が[ShowBiasValue('opinion_support_our_dynasty_member')|+0]増加する"
 turmoil_in_brandenburg.1000.a.tt: "我々は[emperor_country.GetName]のもとを訪れ、僭称者に対抗するための支援を要請する。これは完了に#Y 2年#!を要するが、我々に対する彼らの[opinion|e]が#Y 100#!未満の場合、$bra_hre_emperor_hyperlink$の条件に従わなければならない"
 turmoil_in_brandenburg.1000.b: "我々の手で僭称者を処刑せよ！"
 turmoil_in_brandenburg.1000.b.tt: "[target_character.GetName]の処刑を試みる。成功した場合、[bra_ruler.GetName]の正統性は取り戻され、$bra_wittelsbacher_investment_var$ $bra_variable_counter$に#Y +5#!のボーナスを得る。\n失敗した場合、[civil_war|e]が勃発する"
 turmoil_in_brandenburg.1000.c: "[ROOT.GetCountry.GetNameWithNoTooltip]の真の統治者への譲位"
 turmoil_in_brandenburg.1000.c.at: "$bra_wittelsbach_hyperlink$王朝の一員を統治者とするすべての国は、[ROOT.GetCountry.GetName]に対する[opinion|e]が[ShowBiasValue('opinion_ousted_our_dynasty_member')|+0]増加する"
 turmoil_in_brandenburg.false_waldemar_rebel.tt: "所有するロケーションのうち、人口が上位のロケーション（最大#Y 4#!）に居住する[ShowPopTypeName('nobles')]が以下のエフェクトを得る：\n- [pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]減少\n- [false_waldemar_rebel.GetName]に加わる"
 turmoil_in_brandenburg.1001.title: "[bra_country.GetNameWithNoTooltip]での[target_character.GetShortNameWithNoTooltip]の台頭"
 turmoil_in_brandenburg.1001.desc.imposter_revealed: "[bra_country.GetName]からの使節が、[bra_ruler.GetName]の対立相手であり台頭する僭称者に対抗するための支援を求めて、わが国の宮廷にやってきた。この僭称者[target_character.GetName]は聖地巡礼から戻ったなどと主張し、[bra_country.GetAdjectiveWithNoTooltip]の王位を要求しているという。\n\nしかし、この「$name_waldemar$」はただの偽物であるという報せが我々のもとに届いた。"
 turmoil_in_brandenburg.1001.desc: "[bra_country.GetName]からの使節が、王朝の対立に対する支援を要請するため、我々の宮廷に到着した。使節の話によれば、[bra_country.GetNameWithNoTooltip]の元統治者である[target_character.GetName]が聖地への長い巡礼から戻り、[bra_country.GetAdjective]の王に復位しようとしているという。[bra_ruler.GetName]は臣民からの支持をほとんど得られていないらしく、僭称者に対抗して自分たちを支持するのであれば、見返りとして取引に応じる用意があるようだ。"
 turmoil_in_brandenburg.1001.help.tt: "[target_character.GetName]が[bra_country.GetName]から追放され、[modifier|e]「[ShowModifier('bra_waldemar_rallies_nobility')]」が取り除かれる"
 turmoil_in_brandenburg.1001.a: "金と引き換えに彼らの大義を支持しよう。"
 turmoil_in_brandenburg.1001.a.tt: "[bra_country.GetName]から#Y 1年間#!で[ROOT.GetVariable('bra_gold_tooltip_var').GetValue|+=2] [gold|e]を受け取る"
 turmoil_in_brandenburg.1001.b: "互いに利益のあることだ。彼らを助けよう！"
 turmoil_in_brandenburg.1001.b.tt: "[bra_country.GetName]が#Y 1年間#!、我々に投票する"
 turmoil_in_brandenburg.1001.c: "あちらからの政治的支持と引き換えに、$bra_wittelsbach_hyperlink_no_tt$を支援しよう。"
 turmoil_in_brandenburg.1001.c.tt: "我々は#Y 1年間#!、$bra_wittelsbach_hyperlink$[dynasty|e]が統治するすべての[countries|e]から、[opinion|e]を[ShowBiasValue('opinion_supported_the_wittelsbacher')|+=0]得る"
 turmoil_in_brandenburg.1001.d: "$bra_wittelsbach_hyperlink_no_tt$を支援しなくては。"
 turmoil_in_brandenburg.1001.d.tt: "我々は支援の見返りを求めない"
 turmoil_in_brandenburg.1001.e: "$bra_wittelsbach_hyperlink_no_tt$を支援しても何も得られない。"
 turmoil_in_brandenburg.1001.e.tt: "$bra_wittelsbach_hyperlink$への支援を拒否し、$bra_wittelsbach_hyperlink_no_tt$[dynasty|e]が統治するすべての[countries|e]からの[opinion|e]が[ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0]低下するが、$bra_askanier_hyperlink$王朝が統治するすべての国からの評価が、#Y 1年間#!で[ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0]上昇する"
 turmoil_in_brandenburg.1001.zzz: "[bra_ruler.GetShortNameWithNoTooltip]は適切な正義を行使するがいい。"
 turmoil_in_brandenburg.1001.zzz.tt: "[bra_country.GetName]が望みどおりに[target_character.GetName]を処理する権利を得る"
 turmoil_in_brandenburg.1002.title: "$bra_hre_emperor_hyperlink$からの支援"
 turmoil_in_brandenburg.1002.desc: "わが宮廷に素晴らしい報せが届いた！ $bra_hre_emperor_hyperlink$である[emperor_country.GetName][emperor_ruler.GetName]が、僭称者たる[target_character.GetName]との戦いにおいて、[bra_ruler.GetName]への惜しみない支援を表明したのだ！"
 turmoil_in_brandenburg.1002.desc.gold: "$turmoil_in_brandenburg.1002.desc$\n\n当然ながら、このような支援は無償とはいかない。[emperor_ruler.GetShortNameWithNoTooltip]はこの支援が国庫に課す財政的負担を明示し、その見返りとして、[ROOT.GetVariable('bra_owes_gold').GetValue|V2]ダカットを収めるよう我々に要求した。"
 turmoil_in_brandenburg.1002.desc.loyalty: "$turmoil_in_brandenburg.1002.desc$\n\n当然ながら、このような支援は無償とはいかない。[emperor_ruler.GetShortNameWithNoTooltip]は$bra_hre_hyperlink$における[emperor_ruler.GetHisHer]の後継者を案じており、皇位を維持するため、一族への我々の全面的な忠義を求めている。"
 turmoil_in_brandenburg.1002.desc.relations: "$turmoil_in_brandenburg.1002.desc$\n\n当然ながら、このような支援は無償とはいかない。[emperor_ruler.GetShortNameWithNoTooltip]は、我々に$bra_wittelsbach_hyperlink$内での彼らの先触れとしてふるまい、王朝のすべてのメンバーに[emperor_country.GetNameWithNoTooltip]の栄光を示すことを望んでいる。"
 turmoil_in_brandenburg.1002.desc.free: "$turmoil_in_brandenburg.1002.desc$\n\n驚いたことに、$bra_hre_emperor_hyperlink$はなんの見返りも求めなかった。彼らの支援は、何の条件も伴わない、まさに善意のみによるものだったのだ。"
 turmoil_in_brandenburg.1002.a: "ついにこの時が来た。$bra_wittelsbach_hyperlink_no_tt$の権威を取り戻すのだ！"
 turmoil_in_brandenburg.1002.a.tt: "$bra_wittelsbach_hyperlink$[dynasty|e]が統治するすべての[country|e]が、[emperor_country.GetName]からの[opinion|e]を[ShowBiasValue('opinion_supported_the_wittelsbacher')|0]得る"
 turmoil_in_brandenburg.1003.title: "帝国の支援拒否"
 turmoil_in_brandenburg.1003.desc.dead: "$bra_hre_emperor_hyperlink$からの報せが我々のもとに届いた。[emperor_ruler.GetName]は生前、我々の利益に対して敵対的な姿勢を取っていたが、その理由は[emperor_ruler.GetHerselfHimself]以外の誰にもわからない。ゆえに、[target_character.GetName]の立場が争われることはない……"
 turmoil_in_brandenburg.1003.desc.wittelsbach: "恐ろしい報せが宮廷に届いた！ [target_character.GetName]が引き起こした混乱が激しさを増すなか、$bra_hre_emperor_hyperlink$はついに[emperor_country.GetAdjective]の立場を明らかにした。血統のつながりがあるにもかかわらず、[emperor_ruler.GetName]は[bra_ruler.GetName]を支援することを拒否し、[emperor_ruler.GetHisHer]自身の王朝に公然と反対しようというのだ！"
 turmoil_in_brandenburg.1003.desc: "恐ろしい報せが宮廷に届いた！ [target_character.GetName]が引き起こした混乱が激しさを増すなか、$bra_hre_emperor_hyperlink$はついに[emperor_country.GetAdjective]の立場を明らかにした。[emperor_ruler.GetName]は[bra_ruler.GetName]を支援することを拒否し、$bra_wittelsbach_hyperlink_no_tt$に公然と反対しようというのだ！"
 turmoil_in_brandenburg.1003.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]に訪れる最悪の日だ……"
 turmoil_in_brandenburg.1003.a.tt: "$bra_wittelsbach_hyperlink$[dynasty|e]が統治するすべての[country|e]が、[emperor_country.GetName]からの[opinion|e]を[ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0]失う。また、$bra_askanier_hyperlink$王朝が統治するすべての国が、[emperor_country.GetName]からの評価を[ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0]得る"
 turmoil_in_brandenburg.1004.title: "$bra_hre_emperor_hyperlink$からの無条件の支援"
 turmoil_in_brandenburg.1004.desc: "$bra_hre_emperor_country_hyperlink$からの報せが宮廷に届いた。$bra_hre_emperor_hyperlink$は[target_character.GetName]の不名誉な行動に対し、適切な正義を行使し、[target_character.GetNameWithNoTooltip]を処理する無条件の権利を我々に与えた。"
 turmoil_in_brandenburg.1004.a: "[target_character.GetHimHer]を追放せよ。"
 turmoil_in_brandenburg.1004.b: "[target_character.GetHimHer]を処刑せよ。"
 turmoil_in_brandenburg.1004.c: "[target_character.GetHisHer|U]の能力は有用かもしれない……"
 turmoil_in_brandenburg.1004.c.tt: "[target_character.GetName]は新たな機会を与えられ、我々の内閣で雇用可能になる"
 turmoil_in_brandenburg.1005.title: "疑わしい信頼性"
 turmoil_in_brandenburg.1005.desc: "$bra_wittelsbach_hyperlink$の支配が終わり、栄えある$bra_askanier_hyperlink$がついに[bra_country.GetName]へ帰ってきた。しかし、新しく戴冠した[ROOT.GetCountry.GetGovernment.GetRulerTitle]に疑いの目が向けられている。[target_character.GetName]は演出でおこなったとされる自身の葬儀以前の功績を思い出せず、$bra_askanier_hyperlink_no_tt$の親族は愛する家族の容貌が不可解な変化を遂げていると指摘している。その統治手法すらも[target_character.GetHimHer]らしくないと言われはじめた[target_character.GetShortNameWithNoTooltip]は、これらの矛盾を聖地巡礼による変化だとしているが……"
 turmoil_in_brandenburg.1005.a: "[target_character.GetHisHer]の話を調査せよ。"
 turmoil_in_brandenburg.1005.a.tt: "[target_character.GetName]の話す内容の調査が開始され、[target_character.GetHisHer]の$bra_askanier_hyperlink$との真のつながりが明らかになる……"
 turmoil_in_brandenburg.1005.b: "ただの不確かな噂だ……"
 turmoil_in_brandenburg.1006.title: "[target_character.GetShortNameWithNoTooltip]に対する調査"
 turmoil_in_brandenburg.1006.desc: "2年間にわたる調査、研究、文書の比較の結果、現在の[target_character.GetName][ROOT.GetCountry.GetGovernment.GetRulerTitle]の真偽をめぐる事件は、ついに終止符が打たれた。"
 turmoil_in_brandenburg.1006.desc.true_askanier: "$turmoil_in_brandenburg.1006.desc$\n\n調査によると、[target_character.GetName]は確かに$bra_askanier_hyperlink$の一員ではあるものの、[GetCharacter('bra_waldemar_askanier').GetName]がなりすましている[GetCharacter('bra_waldemar_askanier').GetName]ではなかった。[target_character.GetHeShe]は我々の亡き辺境伯と同じ名だが、[target_character.GetHisHer]が誤って別の$name_waldemar$と混同されていたことが判明した。"
 turmoil_in_brandenburg.1006.desc.false_askanier: "$turmoil_in_brandenburg.1006.desc$\n\n懸命に偽装を試みた[target_character.GetHisHer]だったが、事実を突きつけられて偽りはついに破綻した。[target_character.GetShortNameWithNoTooltip]は[GetCharacter('bra_waldemar_askanier').GetName]がいまだ健在であるかのように、宮廷の全員と$bra_askanier_hyperlink$の親族すらも欺いていた偽者にすぎなかったのだ。これにより、[bra_country.GetAdjectiveWithNoTooltip]の宮廷では大きな騒ぎが巻き起こっており、行政府の多くの部門が解決を要求している。"
 turmoil_in_brandenburg.1006.a: "なんとよく似た偽物だったことか！"
 turmoil_in_brandenburg.1006.a.tt: "[target_character.GetName]とすべての子孫が、[dynasty|e]を$bra_askanier_hyperlink$に変更する"
 turmoil_in_brandenburg.1006.b: "少なくとも、[target_character.GetHeShe]は$bra_wittelsbach_hyperlink_no_tt$ではない……"
 turmoil_in_brandenburg.1006.b.tt: "[target_character.GetName]とすべての子孫が、[dynasty|e]を[target_dynasty.GetName]に変更する"
 turmoil_in_brandenburg.1006.c: "偽物を排除しろ！"
 turmoil_in_brandenburg.1007.title: "偽[target_character.GetNameWithNoTooltip]の処刑"
 turmoil_in_brandenburg.1007.desc.successful_execution: "[target_character.GetName]は[bra_ruler.GetName]に忠実な者たちに捕らえられ、投獄された。また、[emperor_ruler.GetName]も事後ではあるが我々の行動に同意し、より深刻な結果は免れることとなった。結局のところ、[target_character.GetShortNameWithNoTooltip]は$bra_askanier_hyperlink$ではなかった——我々の誉れ高い[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の一員ですらなかったのだ。[target_character.GetSheHe|U]は[bra_country.GetName]に対する偽装、反逆、安定に対する脅威として罪に問われることとなった……"
 turmoil_in_brandenburg.1007.desc.failed_execution: "真夜中に[target_character.GetName]が捕らえられ、[bra_country.GetCapital.GetName]に投獄された。[target_character.GetHisHer]は日の出とともに処刑される予定だったが、[target_character.GetShortNameWithNoTooltip]はずる賢くも我々の行動すべてを予想していた。投獄の直後、わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の大集団が宮殿の地下牢を襲撃し、僭称者を解放したのだ。\n\nいま、[bra_country.GetName]は予測不可能な内戦に直面している。この惨状にあってせめてもの救いは、我々が下した処刑の決定を、[emperor_ruler.GetName]が消極的ながらも支持すると決めたことである。"
 turmoil_in_brandenburg.1007.a: "ひとつの危機が回避された。"
 turmoil_in_brandenburg.1007.b: "武器を取れ！"
 bra_true_waldemar_identity_reveal_tt: "#italic [target_character.GetName]の正体が明らかとなる……#!"
 turmoil_in_brandenburg.false_waldemar_big_rebel.tt: "所有するロケーションのうち、人口が上位のロケーション（最大#Y 12#!）に居住する[ShowPopTypeName('nobles')]が以下のエフェクトを得る：\n- [pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]減少\n- [false_waldemar_rebel.GetName]に加わる"
 false_waldemar_rebel: "$name_waldemar$の支持者"
 turmoil_in_brandenburg.1100.title: "[root_country.GetNameWithNoTooltip]の放置"
 turmoil_in_brandenburg.1100.entry: "The Neglect of Root Country"
 turmoil_in_brandenburg.1100.desc: "[root_country.GetName]の土地は、どちらかといえばつねに未開拓の状態にあった。しかし、[root_country.GetNameWithNoTooltip]が$bra_wittelsbach_hyperlink$の支配下にある現在ほど、荒廃していたことはない。\n\nこのことが$bra_hre_emperor_hyperlink$の耳に入った。[root_ruler.GetName]と、この土地に対する[root_ruler.GetHisHer]の統治は危うい状況にある……"
 turmoil_in_brandenburg.1100.a: "$bra_hre_emperor_hyperlink$は我々の状況を理解してくれるだろう。"
 turmoil_in_brandenburg.1100.a.tt: "我々の運命は$bra_hre_emperor_hyperlink$が握っている。$bra_hre_emperor_hyperlink$は、ほかの王朝から新たな統治者を任命することもできる。"
 turmoil_in_brandenburg.1101.title: "$bra_wittelsbach_hyperlink_no_tt$、$bra_hre_hyperlink_no_tt$を失望させる"
 turmoil_in_brandenburg.1101.desc: "我々の選帝侯領のひとつである[root_country.GetName][root_country.GetFlavorRank]は、非常に厳しい状況に置かれていた。地元の泥棒男爵たちの跋扈、完全に崩壊した経済、[root_ruler.GetName][root_country.GetGovernment.GetRulerTitle]による放任がこの土地を苦しめ、$bra_hre_hyperlink$の目に余る状態となっているのだ。$bra_hre_hyperlink_no_tt$の$bra_hre_emperor_hyperlink$の責務として、このような重大な不始末が続くことを許してはならない。"
 turmoil_in_brandenburg.1101.a: "[root_country.GetFlavorRank]を直接統治しよう。"
 turmoil_in_brandenburg.1101.a.tt: "[root_country.GetName]の新たな[ruler|e]として[emperor_ruler.GetName]を任命し、ともに[union|e]を結成する"
 turmoil_in_brandenburg.1101.b: "[dynasty_character.GetNameWithNoTooltip]に[root_country.GetNameWithNoTooltip]を統治させよ。"
 turmoil_in_brandenburg.1101.b.tt: "[root_country.GetName]の新たな[ruler|e]として[dynasty_character.GetName]を任命する"
 turmoil_in_brandenburg.1101.c: "[cabinet_character.GetNameWithNoTooltip]が我々の名において当地を支配する。"
 turmoil_in_brandenburg.1101.c.tt: "[root_country.GetName]の新たな[ruler|e]として[cabinet_character.GetName]を任命し、当地を我々の[ShowSubjectTypeName('vassal')]とするが、[GetUniqueInternationalOrganization('hre').GetName]のすべてのメンバーからの[antagonism|e]が[ShowBiasValue('subjugated_elector_antagonism')|-=0]増加する"
 subjugated_elector_antagonism: "選帝侯を従属"
 turmoil_in_brandenburg.1101.d: "わが宮廷の相談役のひとりが、[root_country.GetAdjectiveWithNoTooltip]の状況を改善する。"
 turmoil_in_brandenburg.1101.d.tt: "[root_country.GetName]の新たな[ruler|e]としてわが宮廷の相談役を任命する"
 turmoil_in_brandenburg.1101.e: "$bra_wittelsbach_hyperlink_no_tt$に任せたままでも立ち直るだろう。"
 turmoil_in_brandenburg.1101.e.tt: "$bra_wittelsbach_hyperlink$を交代させず、[root_country.GetName]の統治を続けさせる"
 turmoil_in_brandenburg.1102.title: "$bra_hre_emperor_hyperlink$の返答"
 turmoil_in_brandenburg.1102.desc.wittelsbach: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、[emperor_ruler.GetName]を共通の統治者として、[root_country.GetName]の地と[emperor_country.GetNameWithNoTooltip]の地が統合されるべきだと宣言した。"
 turmoil_in_brandenburg.1102.desc: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、$bra_wittelsbach_hyperlink$が本日より権力を剥奪されると宣言した。[root_country.GetName]の地は[emperor_ruler.GetName]自らの手によって直接統治され、我々は[emperor_country.GetNameWithNoTooltip]との連合を強いられるというのだ。"
 turmoil_in_brandenburg.1102.a: "$bra_hre_emperor_hyperlink$万歳！"
 turmoil_in_brandenburg.1102.b: "今回こそは、[root_country.GetLongNameWithNoTooltip]が失敗しないことを願おう。"
 turmoil_in_brandenburg.1103.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1103.desc.wittelsbach: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、[root_country.GetName]の地が[dynasty_character.GetName]によって統治されると宣言した。"
 turmoil_in_brandenburg.1103.desc: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、$bra_wittelsbach_hyperlink$が本日より権力を剥奪されると宣言した。[root_country.GetName]の地は、[dynasty_character.GetName]の手によって直接統治されるという。"
 turmoil_in_brandenburg.1103.a: "[dynasty_character.GetShortNameWithNoTooltip]が力強く統治せんことを願う。"
 turmoil_in_brandenburg.1103.b: "[root_country.GetLongNameWithNoTooltip]に新たなチャンスが訪れたようだ。"
 turmoil_in_brandenburg.1104.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1104.desc.wittelsbach: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、この地が$bra_wittelsbach_hyperlink$王朝の信頼できる新たな一員によって統治されると宣言した。[root_country.GetName]は今後、[emperor_country.GetAdjectiveWithNoTooltip]の臣下のなかで最も忠実な[cabinet_character.GetName]の管理下に置かれる。"
 turmoil_in_brandenburg.1104.desc: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、$bra_wittelsbach_hyperlink$が本日より権力を剥奪されると宣言している。[root_country.GetName]の地は、[emperor_country.GetAdjectiveWithNoTooltip]の臣下のなかで最も忠実な[cabinet_character.GetName]によって直接統治されるという。"
 turmoil_in_brandenburg.1104.a: "少なくとも、その人物は$bra_wittelsbach_hyperlink_no_tt$ではない。"
 turmoil_in_brandenburg.1104.b: "おお……$bra_wittelsbach_hyperlink_no_tt$が戻って来た……"
 turmoil_in_brandenburg.1104.c: "[emperor_country.GetNameWithNoTooltip]に屈しはしない！"
 turmoil_in_brandenburg.1105.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1105.desc: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、$bra_wittelsbach_hyperlink$が本日より権力を剥奪されると宣言した。[root_country.GetName]の地は、$bra_wittelsbach_hyperlink_no_tt$の信頼する相談役である[hohenzollern_character.GetName]によって直接統治されるという。"
 turmoil_in_brandenburg.1105.a: "[hohenzollern_character.GetHeShe]が知恵をもって統治せんことを願う。"
 turmoil_in_brandenburg.1106.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1106.desc: "[emperor_country.GetName]からの使者がわが宮廷に到着した。使者は、$bra_wittelsbach_hyperlink$には帝国からの警告を伝えるものの、引き続き[root_country.GetFlavorRank]の統治に励むようにと宣言した。"
 turmoil_in_brandenburg.1106.a: "[root_country.GetNameWithNoTooltip]は$bra_wittelsbach_hyperlink_no_tt$の財産として永遠に残るだろう……"
 turmoil_in_brandenburg.1107.title: "[root_country.GetNameWithNoTooltip]の抵抗"
 turmoil_in_brandenburg.1107.desc: "[root_country.GetName]は強情にも、わが国に頭を垂れて服従することを拒んでいる。彼らの無能な指導者には未来の展望というものが欠けており、それこそが彼らを武力で臣従させる十分な理由である。"
 turmoil_in_brandenburg.1107.a: "裏切り者は許さん！"
 turmoil_in_brandenburg.1200.title: "The [bra_country.GetAdjectiveWithNoTooltip]の重荷"
 turmoil_in_brandenburg.1200.desc: "$bra_wittelsbach_hyperlink$による長年の管理不行き届きの果てに、[emperor_dynasty.GetName]の一族が[bra_country.GetName]の行政を引き継いだ。我々は[bra_country.GetFlavorRank]に誠意をもって取り組み、最善の利益となるように尽くす。$bra_wittelsbach_hyperlink_no_tt$の怠慢により生じた損害は明らかで、我々の努力では十分に修復できないことは確かである。\n\nわが宮廷の相談役のひとりである[hohenzollern_character.GetName]は、行政や外交において優れた能力を示している。[hohenzollern_character.GetHimHer]を[bra_country.GetNameWithNoTooltip]に赴任させ、必要な自治権を与えることが[bra_country.GetNameWithNoTooltip]の回復に役立つかもしれない。"
 turmoil_in_brandenburg.1200.a: "[hohenzollern_character.GetShortNameWithNoTooltip]に[bra_country.GetFlavorRank]を任せよう。"
 turmoil_in_brandenburg.1200.a.tt: "[bra_country.GetName]の[ruler|e]が[hohenzollern_character.GetName]に置き換えられる"
 turmoil_in_brandenburg.1200.b: "馬鹿な。引き続き、我々自身の手で[bra_country.GetNameWithNoTooltip]を治めるのだ。"
 turmoil_in_brandenburg.1201.title: "[bra_country.GetNameWithNoTooltip]の新たな統治者[hohenzollern_character.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1201.desc: "$bra_wittelsbach_hyperlink$の長年の管理不行き届きの果てに、[emperor_country.GetName]の領主が[bra_country.GetName]を引き継ぐこととなった。彼らは我々の利益を最大限に考慮してはいるものの、$bra_hre_hyperlink$に対する義務により、$bra_wittelsbach_hyperlink_no_tt$王朝の最も熱心な人員以上の統治は期待できない。\n\n幸いにも、[emperor_ruler.GetName]はこの状況を把握しており、[emperor_ruler.GetHisHer]の最も優れた相談役である[hohenzollern_character.GetName]を、[bra_country.GetNameWithNoTooltip]の自治管理のために派遣してきた。"
 turmoil_in_brandenburg.1201.a: "[hohenzollern_character.GetHeShe]が知恵と力をもって統治せんことを願う。"
 turmoil_in_brandenburg.1300.title: "泥棒男爵の跋扈"
 turmoil_in_brandenburg.1300.entry: "$turmoil_in_brandenburg.1300.title$"
 turmoil_in_brandenburg.1300.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]の支配力が弱く、無秩序状態だったために、無法を糧として犯罪に生きる、泥棒男爵と呼ばれる貴族が跋扈する事態となった。彼らは我々の支配力を弱め、[target_ruler.GetName]の権威を損なうだけの存在である。現在、彼らの勢力は[robber_baron_province.GetName]において最も強力なものとなっている。"
 turmoil_in_brandenburg.1300.a: "時が来れば対処しよう。"
