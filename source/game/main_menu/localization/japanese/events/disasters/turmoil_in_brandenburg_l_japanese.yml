 turmoil_in_brandenburg.1301.title: "[robber_baron_province.GetNameWithNoTooltip]の泥棒男爵"
 turmoil_in_brandenburg.1301.entry: "Robber Barons in Robber Baron Province"
 turmoil_in_brandenburg.1301.desc: "泥棒男爵という疫病が、[robber_baron_province.GetName]の地方にまで広がっている。犯罪行為に手を染め、傲慢にふるまうあの者たちは、我々の顔に唾を吐きかけていると言ってもいいだろう。国の中央権力を取り戻すため、彼らに教訓を与える時が来た。"
 turmoil_in_brandenburg.1301.a: "時が来れば対処しよう。"
 turmoil_in_brandenburg.1302.title: "フォン・クヴィッツォウ"
 turmoil_in_brandenburg.1302.entry: "$turmoil_in_brandenburg.1302.title$"
 turmoil_in_brandenburg.1302.desc: "泥棒男爵のなかでも、フォン・クヴィッツォウ家に匹敵する影響力をもつ者は少ない。彼らの拠点は[ShowProvinceDefinitionName('mittelmark_province')]地域全体に広がっており、広大な領地を所有している。だが、そのような財産を持ちながらも、彼らは犯罪に手を染めてしまったのだ。大混乱を引き起こされる前に、我々は彼らを踏み潰し、その土地を奪い取るつもりだ。"
 turmoil_in_brandenburg.1302.a: "彼らに対処しなくては！"
 turmoil_in_brandenburg.1302.b: "慎重なアプローチをとるべきだろう。"
 turmoil_in_brandenburg.1302.historical_info: "フォン・クヴィッツォウ家は、15世紀初頭のブランデンブルクで最も影響力のあった貴族。1411年から1415年にかけてのフリードリヒ1世・フォン・ホーエンツォレルンによるマルクの中央集権化の際、泥棒男爵として有名なハンスとディートリッヒの兄弟は新たな選帝侯に狙われ、城を制圧されたことで、ブランデンブルクにおけるフォン・クヴィッツォウ家の覇権時代は終焉を迎えた。"
 STATIC_MODIFIER_NAME_PRU_quitzow_modifier: "フォン・クヴィッツォウの影響力"
 STATIC_MODIFIER_NAME_PRU_quitzow_repressed_modifier: "フォン・クヴィッツォウの抑制"
 bra_quitzow_revolt: "クヴィッツォウの反乱"
 turmoil_in_brandenburg.1303.title: "泥棒男爵の支配の終焉"
 turmoil_in_brandenburg.1303.entry: "$turmoil_in_brandenburg.1303.title$"
 turmoil_in_brandenburg.1303.desc: "多くの年月と軍事作戦を要したものの、我々はついに傲慢な[ShowEstateTypeName('nobles_estate')]どもを抑え込むことに成功した。現在、この国のすべての交易路は泥棒貴族の手から救い出され、庶民は安心して通行できるようになった。さらに、大半の農民は今後、連中にみかじめ料を渡す必要もなくなる。"
 turmoil_in_brandenburg.1303.a: "[ROOT.GetCountry.GetFlavorRank]は元通りになった。"
 STATIC_MODIFIER_NAME_PRU_end_of_robber_barons: "泥棒男爵の時代の終わり"
 turmoil_in_brandenburg.1304.title: "泥棒男爵の処罰"
 turmoil_in_brandenburg.1304.entry: "$turmoil_in_brandenburg.1304.title$"
 turmoil_in_brandenburg.1304.desc: "反乱を起こした例の[ShowEstateTypeName('nobles_estate')]どもとの戦いには勝利したものの、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の多くの者は、単に彼らを打ち負かすだけでは意味がなく、[ROOT.GetCountry.GetGovernment.GetRulerTitle]自らこの裏切りに対する報いを与えるべきと考えている。この処罰を支持する者は多くいるが、すでに我々が支配を取り戻した以上、さらなる排斥は必要ないと考える者もいる。"
 turmoil_in_brandenburg.1304.a: "裏切りの代償を支払わせてやる！"
 turmoil_in_brandenburg.1304.b: "軽い罰を与えよう。"
 turmoil_in_brandenburg.1304.c: "これ以上の処罰は不要だ。"
