l_japanese:
 flavor_iberian_union.1.title: "イベリアの結婚"
 flavor_iberian_union.1.desc: "[iu_member_a.GetName]と[iu_member_b.GetName]の王位を結ぶこの婚姻は、両国の結びつきを深める好機である。政治上の必要から成立した婚姻ではあるが、[ROOT.GetCountry.GetGovernment.GetAdjective]の夫妻は結婚生活に満足しているようだ。2人は力を合わせ、連合の安定を図るとともに、[ShowContinentName('europe')]の列強の一角を占める強固な政治体制を築こうとしている。"
 flavor_iberian_union.1.historical_info: "イベリア半島における王朝連合のなかでも最も名高いのは、1469年に結ばれたカスティーリャ女王イサベル1世とアラゴン王フェルナンド2世、すなわちカトリック両王の婚姻である。この婚姻によって半島の2大王国は結びついたものの、両国はそれぞれ固有の法と制度を維持した。やがて孫のカルロスが両者をともに継承し、1つの君主権のもとに治めることになる。それから約1世紀後の1580年、スペイン王フェリペ2世は空位となったポルトガル王位への継承権を主張し、カスティーリャ、アラゴン、ポルトガルをスペイン・ハプスブルク家のもとに統合した。この連合は1640年のポルトガル王政復古まで続いた。"
 flavor_iberian_union.1.a: "この連合を、後世に残るものとしよう。"
 flavor_iberian_union.2.title: "イベリア連合"
 flavor_iberian_union.2.desc: "[ShowRegionName('iberia_region')]の諸王国は、ついに1人の君主を戴くこととなった。2つの王家を結ぶ婚姻から始まった関係は、いまや同君連合へと発展し、両国の王位は1人の君主に帰している。それぞれの王国は独自の法と宮廷、そして誇りを保つ一方、王権の正統性や王朝に関わる問題では一致した立場を取っている。ここにイベリア連合が誕生し、キリスト教世界のいかなる強国にも比肩しうる大国へと成長する礎も、ここに築かれたのである。"
 flavor_iberian_union.2.historical_info: "2つの王位が1人の継承者に帰しても、1つの王国が成立するわけではなかった。それぞれの領国は別個のまま、同じ君主のもとに置かれる複合君主制となったのである。スペイン君主国もこの形をとり、カスティーリャ、アラゴン、そしてのちに加わったポルトガルは、それぞれ独自のコルテス、法、行政機構を維持していた。こうした連合は、同じ王朝が続くかぎり保たれたが、後継者を欠けば、婚姻によって結ばれた国々が再び分かれることもあった。"
 flavor_iberian_union.2.a: "両国ともに栄えよう。"
 flavor_iberian_union.3.title: "イベリアの結婚"
 flavor_iberian_union.3.desc: "[initiator_candidate.GetName]が未婚であることから、[ROOT.GetCountry.GetName]では王位継承をめぐる不安が高まっている。これを受け、わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]は[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に縁談を進めるよう強く求めており、その相手として、[ShowRegionName('iberia_region')]にあるほかの[ShowReligionGroupAdjective('christian')]王家との縁組が提案されている。確かな後継者を得られなければ、わが[ROOT.GetCountry.GetFlavorRank]は混乱に陥り、王位をめぐる争いや、さらには外国勢力の干渉を招きかねない。"
 flavor_iberian_union.3.historical_info: "いわゆる「イベリアの結婚」は、カスティーリャ王エンリケ4世の死後に起こった王位継承争いを指す。エンリケ4世の死後、夫であるアラゴンのフェルナンドを後ろ盾とするカスティーリャ女王イサベルと、ポルトガルの支持を受けたイサベルの姪フアナが王位を争った。この争いはイサベルとフェルナンドの勝利に終わり、イサベルの統治体制が確立され、名高いカトリック両王の治世が幕を開けた。カスティーリャとアラゴンのこの連合は、やがてスペイン統一へとつながっていく。"
 flavor_iberian_union.3.a: "[iu_partner_a.GetNameWithNoTooltip]に縁談を申し込もう。"
 flavor_iberian_union.3.b: "代わりに[iu_partner_b.GetNameWithNoTooltip]へ話を持ちかけよう。"
 flavor_iberian_union.3.c: "ほかの道を探そう。"
 flavor_iberian_union.4.title: "イベリアの結婚"
 flavor_iberian_union.4.desc: "[iu_initiator.GetName]からの使節がわが[ROOT.GetCountry.GetGovernment.GetCourtTitle]を訪れた。使節は両国を結びつけるため、[initiator_candidate.GetName]とわが王家の[iu_chosen_candidate.GetName]との婚姻を提案している。この申し出は両国の繁栄と安定を約するものだが、わが国の相談役のなかには慎重な見方を示す者もいる。この婚姻は、共通の敵に対抗する同盟を確かなものとし、いずれは両国の王位が一人の君主に帰する可能性もある。その一方で、長期的にはわが国の独立を脅かしかねないとの懸念もある。"
 flavor_iberian_union.4.a: "失うものは何もない。"
 flavor_iberian_union.4.b: "この申し出は断るのが賢明だろう。"
 flavor_iberian_union.5.title: "王家の婚姻が成立"
 flavor_iberian_union.5.desc: "[initiator_candidate.GetName]と[iu_chosen_candidate.GetName]の婚姻によって両家が1つの[ROOT.GetCountry.GetGovernment.GetAdjective]王家に結ばれると、わが[ROOT.GetCountry.GetFlavorRank]と[iu_chosen.GetName]の双方に祝福の鐘が鳴り響いた。人々は通りを埋め、両国の宮廷ではこの縁組を祝して杯が交わされている。使節や聖職者たちの尽力によって実現した婚姻であった。冷徹な政略として始まった縁談は、誓いと祝宴のうちに結実した。\n\nしかし、この婚姻の意義は一時の祝祭だけにとどまらない。両王家はいまや血縁によって結ばれている。もし両国の王位を継ぐ子が生まれれば、いつの日か両国が1人の君主のもとに治められることになるかもしれない。これで王位継承は当面のあいだ以前よりも安定し、この華やかな婚礼によって、キリスト教世界の諸宮廷におけるわが国の威信も高まることとなる。"
 flavor_iberian_union.5.a: "実にめでたい！"
 flavor_iberian_union.6.title: "王家の婚姻が不成立"
 flavor_iberian_union.6.desc: "わが国の婚姻の申し出は[target_country.GetName]に拒まれた。この決定は今後長きにわたり、両国関係に禍根を残すことになるだろう。だが何より、王位継承問題が未解決のままとなっている。"
 flavor_iberian_union.6.a: "別の手立てを考えよう。"
 flavor_iberian_union.7.title: "見送られた縁談"
 flavor_iberian_union.7.desc: "[iu_initiator.GetName]は、わが国ではなく[iu_chosen.GetName]の王家との縁組を選んだ。わが王家も縁組相手としてなんら遜色なかったにもかかわらずである。この仕打ちは屈辱ではあるが、好機にもなりうる。これほどの侮辱なら、婚姻で手にするはずだったものを武力で奪い取るには十分な大義名分となる。"
 flavor_iberian_union.7.a: "この侮辱、ただでは済ませぬ。"
 iu_marriage_may_form_union_tt: "[union|e]が成立する可能性がある"
 iu_spurned_will_be_displeased_tt: "この縁談で選ばれなかった[iu_spurned.GetName]は不満を抱くかもしれない"
