l_japanese:
 religious_orders.1.title: "敬虔なる遺贈"
 religious_orders.1.desc: "裕福な後援者が亡くなり、その遺言によって[target_order.GetName]に相当な財産が遺贈された。修道士たちは早くも、その財産で会館の屋根を葺き替え、門前の貧者にパンを施そうと考えている。慣例では、こうした寄進は[target_order.GetName]に帰するものとされる。だが、これほどの大金ともなれば、[target_character.GetName]の目に留まらないわけがない。"
 religious_orders.1.a: "この財産は修道士たちに残そう。"
 religious_orders.1.b: "国庫に収めよう。"
 religious_orders.2.title: "[target_order.GetNameWithNoTooltip]の新たな拠点"
 religious_orders.2.desc: "[target_order.GetName]は既存の拠点では収まりきらないほどに成長し、修道士たちは新たな土地を求めている。彼らが新たな拠点として目を付けたのは[target_location.GetName]で、そこに会館を築き、周辺の農村から修練者を募るつもりだという。その土地を与えるも拒むも我々の判断次第であり、彼らはいま、その返答を待っている。"
 religious_orders.2.a: "その土地を与えよ。"
 religious_orders.2.b: "代わりに現地の[GetEstateNameWithNoTooltip('nobles_estate')]へ寄進しよう。"
 religious_orders.2.c: "この要求は退けよ。"
 locals_embrace_the_order_desc: "人々はすぐに修道士たちを受け入れ、新たな会館もほどなくして昔からそこにあったかのように土地に馴染んだ"
 order_works_to_bolster_local_wealth_desc: "修道士たちは農地の排水を進め、道を修繕し、その働きによって地域は次第に豊かになっていった"
 order_projects_central_authority_desc: "[target_order.GetName]が[target_location.GetName]に根を下ろしたことで、[target_character.GetName]の権威もこれまで以上に広く行き渡るようになった"
 order_appreciates_new_holding_desc: "修道士たちは感謝して土地を受け取り、[target_order.GetName]の各会館では、[target_character.GetName]の恩顧を称える声が広がった"
 religious_orders.3.title: "[target_order.GetNameWithNoTooltip]、信徒を奮い立たせる"
 religious_orders.3.desc: "[target_order.GetName]は国中の信仰心を大いに高め、修道士たちは自らが呼び起こした熱狂を誇りとしている。そのなかには、この勢いをいまだわが信仰が根づかぬ町々へ向け、教区司祭でさえ改宗に導けなかった者たちに教えを説くべきだという声もある。一方で、こうした熱狂がやがてギルドの富裕層への敵意に変わるのではないかと懸念する者もいる。"
 religious_orders.3.a: "この熱意を祝福しよう。"
 religious_orders.3.b: "[GetEstateNameWithNoTooltip('burghers_estate')]に拠出を求めよ。"
 religious_orders.3.c: "信仰の根づいていない地へ、修道士たちを説教に向かわせるのだ。"
 religious_orders.4.title: "修道院の醜聞"
 religious_orders.4.desc: "[target_order.GetName]の一部の修道士たちが、誓願に背く暮らしを送っているとの報せが届いた。噂はすでに修道院の外にも広まりつつあり、このままでは醜聞が大きな問題に発展しかねない。事態が悪化する前に、修道会はわが国の裁定を仰いでいる。"
 religious_orders.4.a: "罪を犯した者たちを追放せよ。"
 religious_orders.4.b: "内々に収めるのだ。"
 scandal_kept_quiet_desc: "事態は穏便に収められたものの、修道会の名にはわずかな汚点が残った"
 scandal_breaks_open_desc: "秘密は守られず、醜聞はついに表沙汰となった。修道士たちはその責任を[target_character.GetName]に問うている"
 religious_orders.5.title: "後援の途絶"
 religious_orders.5.desc: "[GetEstateName('nobles_estate')]の有力な一族は、長年にわたり[target_order.GetName]を後援してきたが、その支援がついに途絶えた。教団はたちまち資金難に陥り、活動を続けるための援助を求めて、[target_character.GetName]のもとを訪れている。"
 religious_orders.5.a: "不足分は国庫から補おう。"
 religious_orders.5.b: "いまある資金でやりくりさせよう。"
 religious_orders.5.c: "[GetEstateNameWithNoTooltip('nobles_estate')]に新たな後援者を探させるのだ。"
 new_patron_steps_forward_desc: "対立する一族が後援を引き継ぎ、教団の財政は再び潤った"
 no_patron_steps_forward_desc: "新たな後援者は現れず、教団員たちはわが国の干渉を快く思っていない"
 treasury_gift_entrenches_order_desc: "教団はその援助を役立て、わが国の領内でさらに確かな基盤を築いた"
 treasury_gift_earns_gratitude_desc: "教団員たちは資金を厚意の証と受け取り、[target_character.GetName]への信頼をいっそう深めた"
 religious_orders.6.title: "志願者なき修練院"
 religious_orders.6.desc_martial: "[target_order.GetName]に加わり、剣を取って信仰のために戦おうとする若者はほとんどいない。各地の拠点では人手が足りず、古参の教団員たちは、誰が自分たちの後を継いで国境を守るのかと案じている。"
 religious_orders.6.desc_monastic: "年を追うごとに、[target_order.GetName]の門を叩く修練志願者は減っている。暁課の聖歌隊席には空席が目立ち、年老いた修道士たちは、誰が自分たちの後を継いで日々の時課を守るのかと案じている。"
 religious_orders.6.a: "志ある者なら、誰でも受け入れよう。"
 religious_orders.6.b: "厳格な誓願は守り抜け。"
 religious_orders.6.c: "志願者を募るために資金を投じよ。"
 order_abandons_a_house_desc: "修練者が集まらず、修道会はひっそりと拠点のひとつを閉じた"
 order_withers_for_want_of_novices_desc: "修道会は厳格な規律を貫いたが、新たな修練者が入らず、その勢力も信仰の熱意も次第に衰えていった"
 religious_orders.101.title: "修道会の勇士"
 religious_orders.101.desc: "[target_order.GetName]には、国境の村々ですでにその武勇が歌にうたわれるほどの騎士がいる。自らの立場をよく心得た修道会の上層部は、必要とあらばいつでも[target_character.GetName]をわが軍に派遣すると申し出てきた。"
 religious_orders.101.a: "その武名にふさわしい指揮を任せよう。"
 religious_orders.101.b: "この者の持ち場は国境だ。"
 religious_orders.102.title: "国境を越えた剣"
 religious_orders.102.desc: "[target_order.GetName]の修道士たちが無断で[target_country.GetName]へ越境し、奪った牛を追い立てながら戻ってきた。だが、わが国は[target_country.GetName]と戦争状態にない。隣国の使節団はすでにこちらへ向かっている。祈りを捧げに来るわけではないだろう。"
 religious_orders.102.a: "奪ったものを返し、修道会を叱責するのだ。"
 religious_orders.102.b: "異教徒から奪ったものは、正当な戦利品だ。"
 religious_orders.103.title: "石を積み直すとき"
 religious_orders.103.desc: "[target_order.GetName]の守備を担う者たちから、一通の書状が届いた。いかにも兵士らしく、簡潔で飾り気のない文面である。[target_location.GetName]にある拠点の城壁は、彼らが守る国境よりも古い。いまのうちに修繕するほうが、あとで死者を弔うより安くつくという。求めるものは多くなく、その要求も実に率直だ。"
 religious_orders.103.a: "堅牢な石材で修繕させよう。"
 religious_orders.103.b: "城壁はあとでよい。代わりに哨戒範囲を広げさせよ。"
 religious_orders.104.title: "烽火は上がらず"
 religious_orders.104.desc_captives: "[target_location.GetName]で警報が上がったころには、襲撃者たちはすでに村人たちを連れて遠くへ逃げ去っていた。捕らえられた者たちは縄でつながれ、我々の目の届かぬ市場へ売られていく運命にある。[target_order.GetName]の見張り火は一晩中燃えていたというのに、警告の役目を果たすことはなかった。守備を担う者たちは、まさにこうした事態を防ぐために誓いを立てたはずである。"
 religious_orders.104.desc_herds: "[target_location.GetName]周辺の放牧地では、一夜にして家畜がすべて奪われ、この一帯には一頭も残っていない。その影響は、年を越すまでもなく穀倉の蓄えにも響くだろう。[target_order.GetName]の守備を担う者たちは、なぜ烽火が上がらなかったのかといまなお問いつづけている。"
 religious_orders.104.desc_plate: "襲撃者たちは夜陰に紛れて[target_order.GetName]の見張り火をかいくぐり、夜が明けるころには、[target_location.GetName]の教会に残されていたのはむき出しの石壁だけであった。銀器も聖遺物も袋に詰められ、鞍にくくりつけられて持ち去られた。修道士たちは、こちらと目を合わせることさえできない。"
 religious_orders.104.a: "損失を受け入れるしかない。"
 religious_orders.104.b: "修道士たちに襲撃者を追わせよ。"
 wardens_spoils_recovered_desc: "修道士たちは休むことなく追跡を続け、浅瀬で襲撃者たちに追いついた。奪われたものはすべて取り戻して帰ったが、詫びの言葉はなかった。その武勇談は早くも人々の口に上り、語られるたびに華々しさを増している"
 wardens_trail_cold_desc: "修道士たちは追跡に向かったが、見つかったのは蹄の跡と冷えた灰だけだった。失ったものは戻らず、不名誉だけが残った"
 religious_orders.105.title: "インクと羊皮紙"
 religious_orders.105.desc: "[target_order.GetName]の修道士たちは、わが国でもひときわ整然とした帳簿をつけており、その腕前を自負している。そして教団の上層部が、[ROOT.GetCountry.GetLiturgicalLanguage.GetName]を正確に使いこなし、勘定にも厳しい書記官たちを派遣すると申し出ている。求める見返りは、静かな一室とささやかな俸給だけである。"
 religious_orders.105.a: "徴税台帳を任せよう。"
 religious_orders.105.b: "政務文書を任せよう。"
 religious_orders.106.title: "破られた封印"
 religious_orders.106.desc: "わが国の印章で封じられた書状が、受取人によって開封される3日も前に、[target_order.GetName]の会館で読み上げられていた。法官府に仕える修道士たちは一度知ったことは決して忘れない。どうやら、知ったことを胸の内に留めておくこともないらしい。"
 religious_orders.106.a: "法官府への出入りを禁じよ。"
 religious_orders.106.b: "偽の帳簿をつかませるのだ。"
 religious_orders.106.c: "この件は黙って受け入れよう。"
 confidants_ruse_swallowed_desc: "偽の数字は狙いどおりに伝わり、その情報が誰の手を渡ったのかもすべて把握できた"
 confidants_ruse_discovered_desc: "勘の鋭い修道士が1週間も経たぬうちに偽りの数字を見抜いた。教団は欺かれたことを決して許しはしない"
 religious_orders.107.title: "海からの帰還"
 religious_orders.107.desc_crews: "[target_order.GetName]のガレー船が、沖合の浅瀬で難破した船の乗員を大勢救い上げ、港へ戻ってきた。救助された者たちは、雇われ船長なら決して船を出さないような荒天を、修道士たちはものともせず漕ぎ抜けたのだと口々に称えている。その話は早くも、波止場のどの酒場でも声高に語られている。"
 religious_orders.107.desc_charts: "[target_order.GetName]のガレー船が、長い護衛任務を終えて帰港した。船長は、自ら修正を加えた航海案内書を携えて下船した。そこには、わが国の水先人さえ知らなかった水深や泊地が、誰が読んでもわかるよう明瞭に記されている。"
 religious_orders.107.desc_relic: "[target_order.GetName]のガレー船が船じゅうに旗を掲げて入港する姿を見ようと、沿岸一帯から人々がこぞって集まっている。修道士たちは遠い港で手に入れた聖遺物を船から運び出し、波止場にはそれをひと目拝もうとする群衆が詰めかけている。"
 religious_orders.107.a: "礼を尽くして迎えよう。"
 religious_orders.107.b: "聖遺物は教団のものだ。"
 religious_orders.108.title: "船も人も失われて"
 religious_orders.108.desc: "[target_order.GetName]随一のガレー船が、冬の嵐に遭い、港口の砂州で砕け散った。港を目前にしながらも、救助の手は届かず、その船に乗っていた修道士たちは、長年かけて育てた水先人たちとともに海へ沈んだ。沿岸各地では教団の鐘が鳴り響いている。だが、葬る遺体はどこにもない。"
 religious_orders.108.a: "国費で船隊を再整備しよう。"
 religious_orders.108.b: "海は与え、海は奪うものだ。"
 religious_orders.109.title: "守られし時課"
 religious_orders.109.desc: "人々の記憶が及ばぬほど昔から、[target_order.GetName]の修道士たちは一夜も欠かさず時課を守りつづけてきた。凍てつく夜の暁課も、疫病のさなかの晩課も、一度として途絶えたことはない。そうして繰り返される祈りは、まるで城壁の石を一段ずつ積み上げていくかのようである。いまや人々は、修道士たちがひざまずいて祈るからこそ、[ROOT.GetCountry.GetFlavorRank]は立ちつづけていられるのだと口にするようになった。"
 religious_orders.109.a: "感謝を捧げる日を定めよう。"
 religious_orders.109.b: "修道院長に祝福を願おう。"
 religious_orders.110.title: "隠修室からの声"
 religious_orders.110.desc: "20年ものあいだ隠修室に身を閉ざしてきた[target_order.GetName]の隠修士が、火と疫病が抜き身の剣のように我々の頭上に迫っていると小窓から叫びはじめた。巡礼者たちはその言葉を教区から教区へと伝え、その伝播はどんな伝令の早馬よりも速い。しかも、その話は語られるたびに、少しずつ恐ろしいものへと変わっている。"
 religious_orders.110.a: "修道院長に命じて黙らせろ。"
 religious_orders.110.b: "そのまま叫ばせておけ。"
 doom_talk_fades_desc: "ひと季節のあいだ、国中が固唾をのんで成り行きを見守った。だが収穫は無事に終わり、空が落ちてくることもなかった。こうして予言は、何事もなかったかのように人々の記憶から消えていった"
 dread_takes_hold_desc: "恐怖は人々の心に深く根付いた。畑は耕作の途中で放棄され、罪を悔い改める者たちが街道を行き交い、教団の礼拝堂はかつてないほどの人であふれている"
 religious_orders.111.title: "闇より現れた写本"
 religious_orders.111.desc: "[target_location.GetName]にいる[target_order.GetName]の修道士たちが、虫食いの詩編書を製本し直していたところ、表紙板の下にさらに古い文書が隠されているのを発見した。それは数百年前に筆写された写本で、多くの学者が探し求めてきたが、長らく失われたと考えられていたものだった。司書は発見以来ほとんど眠っておらず、届いた書状を見るかぎり、当分眠るつもりもないらしい。"
 religious_orders.111.a: "わが国のためにも写しを作らせよう。"
 religious_orders.111.b: "その写本は彼らの書庫に収めておこう。"
 religious_orders.112.title: "写字室の火災"
 religious_orders.112.desc_chronicles: "燃えさしのろうそくと、ひと吹きの隙間風。それだけで、[target_location.GetName]にある[target_order.GetName]の写字室は暁課までには焼け落ちていた。修道士たちが代々書き継いできたわが国の年代記も、それを収めていた書棚とともに灰となった。わが国がこれまで何を成し遂げてきたにせよ、その証はいまやずいぶん乏しくなってしまった。"
 religious_orders.112.desc_psalters: "[target_location.GetName]にある[target_order.GetName]の写字室は、夜明け前には戸枠だけを残して焼け落ち、大判の聖歌書もともに灰となった。詩編書や交唱集は、何世代にもわたって彩飾を施され、修道会の誇りとなっていた。これからは記憶だけを頼りに歌うほかない。だが、いずれ記憶には綻びが生じる。"
 religious_orders.112.desc_charters: "夜のうちに、[target_location.GetName]にある[target_order.GetName]の写字室が火災に遭い、この地域の半分に及ぶ土地の権利証書や証文も焼失した。修道士たちが羊皮紙に記してきた境界はいまや確かな根拠を失い、当事者同士の言い分次第となっているが、土地をめぐる争いで控えめな主張をする者などまずいない。"
 religious_orders.112.a: "書棚も机も揃えて、写字室を建て直そう。"
 religious_orders.112.b: "この灰を戒めとしよう。"
 religious_orders.113.title: "荒れ地から生まれた農地"
 religious_orders.113.desc: "[target_order.GetName]の修道士たちは3年にわたり、[target_location.GetName]の農場の近くに広がる湿地の排水を進めてきた。そしてこの春、ついに水が引いた。かつてサギが巣を作っていた場所には、予想を上回る広さに黒々とした土が広がっている。土地が乾いたいま、誰がこの新たな農地を耕すのかという問題が持ち上がっている。"
 religious_orders.113.a: "修道会の農場をさらに広げさせよう。"
 religious_orders.113.b: "新たな農地に、わが国の民を入植させよう。"
 religious_orders.114.title: "牛舎の疫病"
 religious_orders.114.desc: "[target_location.GetName]近郊にある[target_order.GetName]の牛舎で、家畜の疫病が発生した。牛たちは頭を垂れ、身を震わせながら立っている。家畜の治療にあたる者たちが意見をぶつけ合うなか、修道士たちは病んだ牛を苦しみから解放するべきか、それとも連祷を捧げるべきかと、わが国の判断を仰いでいる。"
 religious_orders.114.a: "病んだ牛は屠って焼け。"
 religious_orders.114.b: "祈りを捧げ、寝藁を新しくせよ。"
 murrain_passes_over_desc: "疫病はひと月も経たぬうちに下火になった。初めからそうなると信じていた修道士たちも、自分たちの正しさを声高に誇るほど無粋ではなかった"
 murrain_spreads_desc: "疫病は修道会の牛舎にとどまらず、地域一帯の牛へと広がった。連祷はその拡大を少しも遅らせることはできなかった"
 religious_orders.115.title: "市場に響く雷鳴"
 religious_orders.115.desc: "[target_location.GetName]の市場では、金貸したちが商いを始めるころになると、[target_order.GetName]の修道士が説教を始めるようになった。誰の名も挙げてはいない。だが、その必要はない。説教を聞こうと貧しい人々が広場を埋め尽くすようになり、近ごろでは金貸したちが市場に出るのを遅らせ、早々に店じまいするようになっている。"
 religious_orders.115.a: "好きなだけ熱弁を振るわせよ。"
 religious_orders.115.b: "もう少し穏やかに説くよう勧めるのだ。"
 religious_orders.116.title: "説教の矛先"
 religious_orders.116.desc: "広場を人で埋めるほどの弁舌なら、人の評判を地に落とすのもたやすい。[target_order.GetName]の修道士が、[target_location.GetName]で説教の矛先をわが国へ向けている。わが国が課す税も、犯した罪も、説教壇から1つひとつ数え立て、群衆もそれに合わせて声を上げている。"
 religious_orders.116.a: "寛大に応じよう。"
 religious_orders.116.b: "説教壇から引きずり下ろせ。"
 friar_recants_desc: "拘束されると、修道士はたちまち気勢を失い、証人たちの前で自らの言葉を撤回した。結局、恥をかくことになったのは教団のほうだった"
 martyr_of_the_square_desc: "修道士は歌いながら牢へ入っていき、その姿を広場の人々は忘れなかった。仲間の修道士たちは早くも彼を殉教者と呼び、町の人々もそれに口をそろえている"
 religious_orders.117.title: "捨て子の回転窓"
 religious_orders.117.desc: "[target_order.GetName]の修道士たちは、[target_location.GetName]にある会館の壁に、名も告げずに乳児を預けられる回転窓を設けた。修道士たちは何ひとつ問わず、預けられた子を受け入れる。町の者は口にしたがらないが、その窓に預けられる乳児は後を絶たず、修道会の揺りかごはすでにいっぱいになっている。"
 religious_orders.117.a: "修道士たちの慈善を称えよう。"
 religious_orders.117.b: "子供たちは各教区に引き取らせよう。"
 religious_orders.118.title: "満員の施療院"
 religious_orders.118.desc: "街道の往来とともに熱病が持ち込まれ、[target_location.GetName]にある[target_order.GetName]の施療院は、戒律に従って病人を受け入れた。病人たちは1つの寝台に2人ずつ寝かされているが、それでも場所が足りず、回廊にまで横たわっている。町の医師たちは、そんな施療院を「蛾を誘う灯火」だと皮肉っている。"
 religious_orders.118.a: "施療院の門を閉ざせ。"
 religious_orders.118.b: "慈善にためらいは無用だ。"
 hospice_spared_desc: "熱病はまるで申し合わせたかのように、施療院の外へ広がることなく収まった。修道士たちはわずかな死者を葬り、戒律の正しさが証明されたと口にしている"
 hospice_fever_spreads_desc: "施療院に持ち込まれた熱病は、そこで収まらなかった。回復した者や死者を悼む者を通じて外へ広がり、やがて一帯では通りから通りへと病が蔓延していった"
 religious_orders.119.title: "辺境への赦し"
 religious_orders.119.desc: "戦争は終わった。だが、その代償はいまなお人々に重くのしかかっている。[target_order.GetName]の聴罪師たちは、戦禍の傷が最も深い地域を巡り、人々が隣人にも打ち明けられない胸の内に耳を傾け、忘れることのできない罪を赦したいと申し出ている。"
 religious_orders.119.a: "民のもとへ遣わそう。"
 religious_orders.119.b: "まず向かうべきは有力者たちだ。"
 religious_orders.120.title: "売買される赦免"
 religious_orders.120.desc_noble: "[target_order.GetName]の修道士のひとりが、[GetEstateName('nobles_estate')]の有力な一族に対し、いまだ犯しつづけている罪までひそかに赦している。そして赦しが与えられるたびに、贈り物が欠かさず届けられている。修道会の上層部は恥じ入っているが、当の一族は意に介する様子もない。"
 religious_orders.120.desc_merchant: "[target_order.GetName]の修道士のひとりが、商家を相手に赦罪を売りはじめた。赦しには帳簿上の値段が付けられ、ほかの商品と同じように売買されている。[GetEstateName('burghers_estate')]にしてみれば、正当な代価を支払う取引に罪などない。だが、それこそが問題なのだ。"
 religious_orders.120.desc_prelate: "[target_order.GetName]の聴罪師のなかに、相手の身分が高いほど、科す償いを露骨に軽くする者がいる。しかも、告解に訪れるのはいずれも聖職者で、教区中に知れ渡った罪まで赦されている。[GetEstateName('clergy_estate')]はこの件をあまり詳しく調べてほしくないようだ。"
 religious_orders.120.a: "教団にその者を引き渡させろ。"
 religious_orders.120.b: "告解は神の領分だ。"
 religious_orders.201.title: "カバルガータのあと"
 religious_orders.201.desc: "[target_order.GetName]の同志たちが、戦利品と捕虜を引き連れて襲撃から戻ってきた。だが、この戦果をどう受け止めるべきかをめぐり、拠点では意見が2つに分かれている。"
 religious_orders.201.a: "戦利品を誇示し、教団の士気をさらに高めるのだ。"
 religious_orders.201.b: "戦果は目立たぬよう国境防備に充てよ。"
 religious_orders.202.title: "異教徒の地に築く橋頭堡"
 religious_orders.202.desc: "我が兵は不信心者の手から [ro_conquest_location.GetName] を奪い取り、[ro_conquest_order.GetName] の修道士たちはそこに意図を見出しております。信仰がまだ根付いていない地に、彼らは管区を、祈りと剣の家を新たな辺境に打ち立てんと欲し、我らに許しを請うております。"
 religious_orders.202.a: "管区の建設を許そう。"
 religious_orders.202.b: "辺境は未だ彼らの出る幕ではない。"
