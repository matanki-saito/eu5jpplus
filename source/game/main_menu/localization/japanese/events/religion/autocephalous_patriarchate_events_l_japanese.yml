l_japanese:
 ap_falls_desc_key: "激しい包囲戦と駐屯部隊の果敢な防衛の結果、[target_location.GetName]は我々の軍隊に掌握された。ここには有力な宗教的権威が居住しているが、その理由は[target_location.GetRank.GetNameWithNoTooltip]がかつて[ShowReligionAdjective('orthodox')]の高官を迎えていた場所だからだ。こうした施設を廃止すべきか、それとも我々の保護下に置くべきか迷うところだ。"
 ap_diplomatic_desc_key: "With the incorporation of [target_location.GetName] into the [scope:winner.GetFlavorRank] of [scope:winner.GetName],"
 ap_falls_desc_key_2: "Within its walls resides a powerful religious authority, as the [target_location.GetRank.GetNameWithNoTooltip] once hosted dignitaries of the [ShowReligionAdjective('orthodox')] faith. The question remains yet, should we abolish this kindred institution or adopt it under our protection?"
 autocephalous_patriarchates.1.title: "独立総主教座を掌握！"
 autocephalous_patriarchates.1.desc: "$ap_falls_desc_key$"
 autocephalous_patriarchates.1.desc_diplomatic: "$ap_diplomatic_desc_key$ the seat of the [target_ap.GetName] now falls under our authority. It comes to us to decide what to do with this Patriarchal institution."
 autocephalous_patriarchates.1.a: "独立総主教区を廃止する。"
 autocephalous_patriarchates.1.b: "独立総主教区を維持する。"
 autocephalous_patriarchates.1.c: "これからはわが国が総主教に対処する存在となる。"
 every_member_of_scopeloser_ap_loses_opinion_of_scopewinner_tt: "[target_ap.GetName]の各メンバーのわが国に対する評価が[ShowBiasValue('destroyed_my_autocephalous_patriarchate')|+=0]低下する"
 every_member_of_winner_ap_gains_opinion_of_scopewinner_tt: "[target_winner_ap.GetName]の各メンバーのわが国に対する評価が[ShowBiasValue('destroyed_another_autocephalous_patriarchate')|+=0]上昇する"
 autocephalous_patriarchates.2.title: "独立総主教座を掌握！"
 autocephalous_patriarchates.2.desc: "$ap_falls_desc_key$"
 autocephalous_patriarchates.2.desc_diplomatic: "$ap_diplomatic_desc_key$ it comes to us to decide upon matters of its faith. $ap_falls_desc_key_2$"
 autocephalous_patriarchates.2.a: "独立総主教区を廃止する。"
 autocephalous_patriarchates.2.b: "独立総主教区を維持する。"
 autocephalous_patriarchates.3.title: "[target_location.GetNameWithNoTooltip]総主教区の復興"
 autocephalous_patriarchates.3.desc: "[recipient.GetName]が[target_location.GetName]へ移転したことにより、[target.GetType.GetName]の栄光が復活した。今後、総主教区はその崇高な地位にふさわしい威厳と敬虔さをもって、信仰の諸事を取り仕切ることになる。"
 autocephalous_patriarchates.3.a: "[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]のさらなる栄光のために！"
