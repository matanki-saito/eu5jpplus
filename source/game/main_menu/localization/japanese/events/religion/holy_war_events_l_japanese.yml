l_japanese:
 holy_war.1.title: "聖戦への呼びかけ"
 holy_war.1.desc: "説教師たちがわが宮廷を訪れた。熱意に声を枯らしながら、すべての敬虔な信徒に武器を取り、[preach_io.GetTarget.GetName]と戦うよう呼びかけている。いまや信徒たちの目はわが国に注がれている。この呼びかけに応じるべきだろうか？"
 holy_war.1.a: "大義のため、武器を取ろう！"
 holy_war.1.b: "いまはその時ではない。"
 holy_war.2.title: "聖戦への拠出"
 holy_war.2.desc: "[levy_io.GetName]を率いる[levy_leader.GetLongName]から使節が訪れ、切実な要請を伝えた。[levy_io.GetTarget.GetName]に対する聖戦で多くの血が流れ、戦費もまた莫大な額にのぼっている。同じ信仰に連なる者として、わが国にも戦費の拠出が求められている。この大義のため、国庫を開くべきだろうか？"
 holy_war.2.a: "少額を拠出しよう。"
 holy_war.2.b: "惜しみなく拠出しよう。"
 holy_war.2.c: "いっそ自ら聖戦に加わろう。"
 holy_war.2.d: "他国の戦のために金を出すつもりはない。"
 holy_war.2.d.tt: "[levy_io.GetName]の全メンバーがわが国に対し「#R 聖戦を忌避#!」の評価を下す"
 holy_war.3.title: "改宗を強いられた民"
 holy_war.3.desc: "敵に奪われた領地では、聖職者たちが村々をめぐり、わが民に父祖伝来の信仰を捨てるよう迫り、拒む者には迫害を加えている。改宗を強いられたとの報せが次々とわが宮廷に届いている。我々はこの暴挙を決して忘れはしない。"
 holy_war.3.a: "この報いは受けてもらおう。"
 holy_war.3.a.tt: "強制改宗に対して措置を講じない"
 holy_war.4.title: "信徒からの叱責"
 holy_war.4.desc: "聖戦の指導者は、わが国が神聖な務めを怠っていると非難し、信仰への献身を示さなければ重い代償を払うことになると警告している。これにどう応じるべきだろうか？"
 holy_war.4.a: "より一層の尽力を誓おう。"
 holy_war.4.a.tt: "聖戦の指導者がわが国に対し、献身を示すための猶予期間として#G 2年#!を与える。それまでに聖戦への貢献を増やせば、信徒たちは満足するだろう。できなければ、結局は彼らの叱責を受けることになる。"
 holy_war.4.b: "誰の指図も受けはしない。"
 holy_war.6.title: "信徒たちの好意"
 holy_war.6.desc: "聖戦に対してわが国が再び示した熱意は広く知れ渡り、いまや信徒たちの指導者もわが国を好意的に語っている。かつて向けられていた疑念は、いまや好意へと変わった。"
 holy_war.6.a: "デウス・ウルト（神がそれを望まれる）。"
 holy_war.6.a.muslim: "アッラーフ・アクバル（神は偉大なり）。"
 holy_war.20.title: "信徒たちの不興"
 holy_war.20.desc: "誓いを果たすために与えられた猶予は尽きたが、わが国は何一つ行動を起こさなかった。聖戦の指導者たちは、わが国の誓いも、それを果たさなかったことも忘れてはいない。そしていま、かねて警告されていた叱責がついに下される。"
 holy_war.20.a: "裁きを甘んじて受けよう。"
 holy_war.7.title: "呼びかけへの応え"
 holy_war.7.desc: "[preach_target.GetName]はわが国の呼びかけに応じ、剣と財をもって大義に加わることを誓い、聖戦に参じた。信仰のために新たな剣が加わり、聖戦の軍勢はさらにその数を増している。"
 holy_war.7.a: "信徒たちが集結する。"
 holy_war.8.title: "呼びかけの拒否"
 holy_war.8.desc: "[preach_target.GetName]はわが国の呼びかけに耳を貸さず、冷ややかな態度で門戸を閉ざし、聖戦への参加を拒んだ。信徒たちはこの侮辱を忘れないだろう。"
 holy_war.8.a: "勝手にするがいい。"
 holy_war.8.a.tt: "相手国はわが国の申し出を無視した"
 holy_war.9.title: "枢機卿座の申し出"
 holy_war.9.desc: "[cardinal_io.GetName]を率いる[cardinal_offerer.GetName]から、ある提案が持ちかけられた。わが国が十字軍に加わるなら、国内に枢機卿座を新設し、高位聖職者の1人をその座に据えるという。これを受ければ、わが国は聖なる大義への関与をさらに深めることになる。受け入れるべきだろうか？"
 holy_war.9.a: "この栄誉に応え、十字軍に加わろう。"
 holy_war.9.a.no_seat_tt: "わが国のすべての居住地にはすでに枢機卿座があるため、代わりにより多くの威信を得る"
 holy_war.9.b: "この申し出は断ろう。"
 holy_war.10.title: "承認の申し出"
 holy_war.10.desc: "[recognition_io.GetName]を率いる[recognition_offerer.GetName]から申し出があった。不信仰者との聖戦に加わるなら、信徒のあいだでわが国の地位を認め、宗教的権威と正統性を授けるという。受け入れるべきだろうか？"
 holy_war.10.a: "この申し出を受け入れ、ジハードに加わろう。"
 holy_war.10.b: "この申し出は断る。"
 holy_war.17.title: "奇跡的な回復"
 holy_war.17.desc: "軍医たちにも助かる見込みはないと見られていた一兵卒が、すっかり回復して病床から起き上がった。すでに多くの者が、この回復は天の御業に違いないと考えている。だが、その兵は熱にうなされるなか、奇妙で不穏な夢を見たという。本人はそれが未来を告げる幻だったと断言しており、兵士たちのあいだにも不安げな囁きが広がっている。この件をどう扱うべきだろうか？"
 holy_war.17.a: "この回復を奇跡と宣言し、全軍を鼓舞せよ！"
 holy_war.17.a.muslim: "$holy_war.17.a$"
 holy_war.17.a.tt: "聖戦の宗教的熱意が#G 5#!上がる"
 holy_war.17.b: "不安が広がる前に、この件もみ消そう。"
 holy_war.18.title: "薄れゆく聖戦の熱意"
 holy_war.18.desc: "長引く待機に、軍勢の疲労は日に日に深まっている。かつては熱意に満ちて響いていた祈りも、いまでは形ばかりのものとなった。些細なことで諍いが起こり、焚き火の周りでは毎晩、古い確執が再びくすぶりはじめる。信徒たちを聖戦へと駆り立てた情熱も、いまやすっかり冷めつつある。早急に士気を立て直さなければ、一戦も交えぬうちに軍勢が崩れかねない。どうすべきだろうか？"
 holy_war.18.a: "説教をおこない、盛大な宴を催して軍勢を奮い立たせよう。"
 holy_war.18.a.tt: "聖戦の宗教的熱意が#G 8#!上がる"
 holy_war.18.b: "信徒たちは自ら熱意を取り戻せばよい。"
 holy_war.18.b.tt: "聖戦の宗教的熱意が#R 5#!下がり、準備が#R 5#!後退する"
 holy_war.19.title: "熱狂的な説教師"
 holy_war.19.desc: "陣営の外れに、異様な目つきの説教師が現れた。長旅で法衣はすっかりくたびれ、幾日も休みなく説きつづけたため、声は枯れ果てている。その燃えるような言葉に引き寄せられ、貧しい者や敬虔な信徒、労働者や土地を持たぬ者が次々と集まり、いますぐ信仰のために出征しようと声を上げている。その熱狂ぶりは常軌を逸しており、まるで手がつけられない。しかも、いかなる領主の命にも従おうとしないのだ。この扇動者をどう扱うべきだろうか？"
 holy_war.19.a: "好きなように信徒を集めさせよう。"
 holy_war.19.a.tt: "聖戦の宗教的熱意が#G 5#!上がる"
 holy_war.19.b: "混乱を招く前に止めるのだ。"
 holy_war.21.title: "戦利品をめぐる争い"
 holy_war.21.desc: "町が陥落して間もないというのに、戦利品の分配をめぐって、わが兵と同盟軍の兵が衝突している。狭い街路では短剣が抜かれ、天幕は倒され、両軍のあいだにくすぶっていた古い確執まで噴き出して、乱闘へと発展している。この争いを早急に収めなければ、戦役そのものが危うくなり、敵がなお健在だというのに味方同士で刃を交えることになりかねない。どう決着をつけるべきだろうか？"
 holy_war.21.a: "わが兵には、手柄に見合う戦利品を取らせよう。"
 holy_war.21.a.tt: "聖戦の宗教的熱意が#R 5#!下がる"
 holy_war.21.b: "大義のため、兵を抑えるのだ。"
 holy_war.21.b.tt: "聖戦の宗教的熱意が#G 5#!上がる"
 holy_war.22.title: "陣中の疫病"
 holy_war.22.desc: "兵がひしめく包囲陣に衰弱を招く熱病が広がっており、薄暗い朝を迎えるたび、意識を失った兵が次々と天幕から運び出される。医師たちは瀉血を施し、下剤を使い、祈りまで捧げているが、病の勢いは一向に衰えない。死にゆく兵たちから漂う臭気が、陣営全体に重く立ちこめている。故国から遠く離れ、なお落ちぬ城壁を前に、軍勢は日に日に戦力を失っている。この疫病にどう対処すべきだろうか？"
 holy_war.22.a: "どれほど犠牲が出ようとも、攻勢を続ける。"
 holy_war.22.b: "病が収まるまで、軍を休ませよう。"
 holy_war.22.b.tt: "聖戦の宗教的熱意が#R 5#!下がる"
 holy_war.23.title: "勇士、倒れる"
 holy_war.23.desc: "[sieged_location.GetName]の包囲戦で数々の武勲を挙げた[fallen_champion.GetName]が、激戦のさなか城壁上で敵に討ち取られた。その武勇は、これから長く語り継がれることだろう。一兵卒から誇り高き領主まで、軍勢の誰もが慕った勇士の死を悼んでいる。だが悲しみのなかでも兵たちの血はたぎり、いまや多くの者が、その仇を討とうと次々に名乗りを上げている。この死をどう讃えるべきだろうか？"
 holy_war.23.a: "信仰の殉教者として讃えよ！"
 holy_war.23.a.tt: "聖戦の宗教的熱意が#G 10#!上がる"
 holy_war.23.b: "静かに、敬意をもって弔おう。"
 holy_war.23.b.tt: "聖戦の宗教的熱意が#G 3#!上がる"
 holy_war.24.title: "軍中の偽信徒"
 holy_war.24.desc: "異端者や偽信徒が軍勢に紛れ込んでいるとの不穏な噂が、陣営を駆けめぐっている。祈りは見せかけにすぎず、忠誠心も疑わしいという。とりわけ敬虔な者たちは、彼らが軍全体を蝕む前に一掃すべきだと訴えている。一方、冷静な者たちは、胸の内にどんな信仰を抱いていようと、戦場では同じ兵に変わりないと説いている。この告発にどう応じるべきだろうか？"
 holy_war.24.a: "偽信徒を軍勢から一掃せよ。"
 holy_war.24.a.tt: "聖戦の宗教的熱意が#G 8#!上がる"
 holy_war.24.b: "見て見ぬふりをせよ。1人でも多くの兵が必要なのだ。"
 holy_war.24.b.tt: "聖戦の宗教的熱意が#R 5#!下がる"
 holy_war.25.title: "敬虔なる遺贈"
 holy_war.25.desc: "わが国の富裕な大領主がこのほど世を去った。聖戦のために莫大な財産を遺贈するとの遺言を残しており、遺言執行人たちによって、貨幣の収められた箱がいくつも届けられた。その使い道は、聖戦のためであればわが国に任せるという。すでに聖職者や軍の指揮官、さらには貧しい者たちまで、それぞれが自分たちへの配分を求めている。この財産を何に充てるべきだろうか？"
 holy_war.25.a: "この財産は、わが国の戦費に充てる。"
 holy_war.25.b: "聖戦の軍資金として差し出そう。"
 holy_war.25.b.tt: "聖戦の宗教的熱意が#G 3#!上がる"
 holy_war.25.c: "信徒たちに施しとして分け与えよう。"
 holy_war.25.c.tt: "聖戦の宗教的熱意が#G 3#!上がる"
 holy_war.27.title: "金で買った離反"
 holy_war.27.desc: "わが国の銀貨が密かに功を奏した。賄賂を受け取った[desertion_member.GetName]が軍旗を降ろし、誰も信じない言い訳を残して静かに撤兵したのだ。その結果、敵の戦力は確実に削がれた。またしても、武力でも説教でも成し得なかったことを、金が成し遂げた。こうして厄介な敵がまた1つ、静かに盤上から消えた。忠誠にも値段があるということだろう。"
 holy_war.27.a: "剣が及ばぬところでは、欲が物を言う。"
 holy_war.27.a.tt: "[desertion_member.GetName]が賄賂を受け取り、[desertion_io.GetName]から離脱した"
 holy_war.28.title: "拒まれた銀貨"
 holy_war.28.desc: "[desertion_member.GetName]はわが国の密かな申し出を一蹴し、使節を宮廷から追い返した。わが国の金には惑わされず、ひるむことなく戦いつづけると誓ったのである。それよりもまずいのが、この買収工作が明るみに出るおそれまであるということだ。もし公になれば、わが国は賄賂と欺瞞に頼る国として名声を損なうことになるだろう。結局、この一件は何の成果も生まず、ただ新たな火種を残すだけに終わった。"
 holy_war.28.a: "仕方がない。"
 holy_war.28.a.tt: "[desertion_member.GetName]は賄賂を拒否した"
 holy_war.29.title: "教皇特使"
 holy_war.29.desc: "教皇聖下は、聖務にも戦の術にも通じた高位聖職者である[papal_legate.GetName]を、わが軍の先頭に立たせ、[holy_war.GetName]にローマの祝福をもたらすべく遣わした。この人物を迎えれば、わが軍はさらに精強になり、教皇庁との結びつきもいっそう深まるだろう。ただし、この人物が第一に忠誠を誓うのは教皇であり、わが国は二の次となる。それでも、この者をわが軍に迎えるべきだろうか？"
 holy_war.29.a: "教皇特使をわが軍に迎えよう。"
 holy_war.29.a.tt: "[crusade|e]の宗教的熱意が#G 5#!上がる"
 holy_war.29.b: "礼を述べて、ローマへ送り返せ。"
 holy_war.30.title: "陣中の免罪符売り"
 holy_war.30.desc: "免罪符売りの一団が、死肉に群がる禿鷹のように陣営へ押しかけてきた。兵士たちを相手に免罪符や聖具の類を売り歩き、着々と懐を潤している。商売が広がるにつれ、敬虔な者たちの反発も強まり、聖戦の大義を汚す行為だとの声が上がっている。とはいえ、聖戦には資金も必要であり、祈りだけで勝てるものではない。この者たちをどう扱うべきだろうか？"
 holy_war.30.a: "彼らの収益を聖戦の軍資金に充てよう。"
 holy_war.30.a.tt: "[crusade|e]の宗教的熱意が#R 3#!上がる"
 holy_war.30.b: "その金は、密かにわが国庫へ納めよう。"
 holy_war.30.b.tt: "[crusade|e]の宗教的熱意が#R 5#!上がる"
 holy_war.30.c: "免罪符売りを陣営から追放せよ。"
 holy_war.30.c.tt: "[crusade|e]の宗教的熱意が#G 5#!上がる"
 holy_war.31.title: "聖人の遺骨"
 holy_war.31.desc: "崇敬を集める聖人の遺骨がわが国にもたらされた。幾多の危険をくぐり抜けてこれを守り抜いた修道士たちが、わが宮廷へ届けたのである。このような聖遺物は、金では到底買えぬほどの宝である。ひとたび安置されれば、何千もの信徒が祈りを捧げ、これを一目拝もうと集まってくるだろう。この聖なる遺骨をどこに安置すべきだろうか？"
 holy_war.31.a: "首都に安置せよ。"
 holy_war.31.b: "軍勢の先頭に掲げ、戦場へ赴こう。"
 holy_war.31.b.tt: "[crusade|e]の宗教的熱意が#G 8#!上がる"
 holy_war.32.title: "十字軍の誓い"
 holy_war.32.desc: "宮廷の一同が見守るなか、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は祭壇の前にひざまずき、自ら十字軍に赴くことを固く誓った。信徒たちを率いて聖戦の最前線に立ち、一兵卒とともに戦役のあらゆる苦難と危険を分かち合うというのである。大胆な誓いではあるが、危険も大きい。いまや国中がこの誓いの行方を見守っている。果たして、この誓いを貫かせるべきだろうか？"
 holy_war.32.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]に軍勢を率いさせよ。"
 holy_war.32.a.tt: "[crusade|e]の宗教的熱意が#G 5#!上がる"
 holy_war.32.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]には玉座に留まってもらったほうがよいだろう。"
 holy_war.33.title: "十字架を掲げるキリスト教世界"
 holy_war.33.desc: "聖戦への熱気が国中に広がり、あらゆる身分の者たちが上衣に十字架を縫いつけ、信仰のために戦地へ赴こうと声を上げている。誇り高き騎士や領主たちは先陣の栄誉を競い合い、村々では民衆があり合わせの武器を手に次々と立ち上がっている。誰の熱意を戦力として活かすべきだろうか？"
 holy_war.33.a: "騎士と貴族を召集せよ。"
 holy_war.33.b: "民衆を募り、大軍を編成するのだ。"
 holy_war.34.title: "スーフィーのシャイフ"
 holy_war.34.desc: "敬虔さと学識でイスラム世界にその名を知られるスーフィーのシャイフ、[sufi_shaykh.GetName]が、熱心な弟子たちを従えて我らの陣営を訪れた。夕べの焚き火を囲んでおこなわれるその説教は、ガーズィーたちの心を燃え立たせている。昨日まで重い足取りで行軍していた兵たちは、いまや目を輝かせて殉教を口にしている。この敬虔なシャイフをどう迎えるべきだろうか？"
 holy_war.34.a: "シャイフをわが宮廷に迎えよう。"
 holy_war.34.a.tt: "[jihad|e]の宗教的熱意が#G 5#!上がる"
 holy_war.34.b: "このシャイフとは距離を置こう。"
 holy_war.34.b.tt: "[jihad|e]の宗教的熱意が#R 3#!下がる"
 holy_war.35.title: "分け前を求めるガーズィー"
 holy_war.35.desc: "聖戦の呼びかけに応じて集まった義勇兵たちが、約束された戦利品の分け前を求めて詰め寄っている。我らの天幕の前には大勢が押しかけ、声を荒げており、もはや待つ気はないようだ。彼らは、信仰のために戦ったのはもちろんだが、妻子を養うためでもあると訴えている。何の取り分も与えず帰せば、次の激戦に再び馳せ参じる者はいなくなるだろう。この要求にどう応えるべきだろうか？"
 holy_war.35.a: "ガーズィーたちに戦利品の分け前を与えよう。"
 holy_war.35.a.tt: "[jihad|e]の宗教的熱意が#G 5#!上がる"
 holy_war.35.b: "戦利品は私欲を満たすためのものではない。聖戦のために使うのだ。"
 holy_war.35.b.tt: "[jihad|e]の宗教的熱意が#R 3#!下がる"
 holy_war.36.title: "法学者のファトワー"
 holy_war.36.desc: "ウンマ（イスラム共同体）において重きをなす高名な法学者が、武器を持てるすべての信徒に対し、聖戦への参加を神聖な義務とするファトワーを発した。これが多くの者の手で書き写され、モスクからモスクへと伝えられれば、イスラーム世界全体をこの大義のもとに奮い立たせることができるだろう。このファトワーを各地に広めるべきだろうか？"
 holy_war.36.a: "このファトワーを各地に広めよう。"
 holy_war.36.a.tt: "[jihad|e]の宗教的熱意が#G 8#!上がる"
 holy_war.36.b: "ひっそりと感謝しつつ受け入れよう。"
 holy_war.36.b.tt: "[jihad|e]の宗教的熱意が#G 3#!上がる"
 holy_war.37.title: "ウンマ各地からの義勇兵"
 holy_war.37.desc: "聖戦の報せは国境を越えて広まり、いまやイスラム世界の各地からガーズィーの義勇兵たちが続々と集結地へ到着している。長旅で足を痛め、全身を埃まみれにしながらも、その意気は盛んである。彼らが望むのは、ただ戦列に加わり、敵と刃を交える機会だけだ。養う者が増えるのは確かだが、進んで戦う兵も増える。彼らを迎え入れるべきだろうか？"
 holy_war.37.a: "義勇兵たちをわが軍に迎え入れよう。"
 holy_war.37.a.tt: "[jihad|e]の宗教的熱意が#G 3#!上がる"
 holy_war.37.b: "流れ者の狂信者を1人残らず養う余裕などない。"
 holy_war.38.title: "聖なる軍旗"
 holy_war.38.desc: "信仰の黎明期に、最初の信徒たちが勝利を収めた戦場で掲げられていたという古の軍旗が、わが国に託された。旗はすでに色褪せ、布も擦り切れているが、その姿を目にするだけで信徒たちは熱狂し、いかなる危険を前にしてもひるまず、この旗のもとに進むと誓っている。この貴重な聖遺物をどう扱うべきだろうか？"
 holy_war.38.a: "軍勢の頭上高くに掲げよ。"
 holy_war.38.a.tt: "[jihad|e]の宗教的熱意が#G 5#!上がる"
 holy_war.38.b: "至宝として厳重に守るのだ。"
 sacred_war_banner: "聖なる軍旗"
 sacred_war_banner_desc: "最初の信徒たちが勝利を収めた戦場で掲げられていたという、色褪せて擦り切れた古の軍旗。いまではわが国の聖なる宝として大切に守られ、特別な祭日には信徒たちの前に掲げられ、その心を奮い立たせている。"
 holy_war.39.title: "枢機卿座の申し出を受諾"
 holy_war.39.desc: "[cardinal_candidate.GetName]がわが国からの枢機卿座の申し出を受け入れ、十字軍に加わり、[cardinal_io.GetName]の一員となった。こうして、新たな枢機卿が誕生した。"
 holy_war.39.a: "神に感謝を！"
 holy_war.40.title: "枢機卿座の申し出を拒否"
 holy_war.40.desc: "[cardinal_candidate.GetName]はわが国からの枢機卿座の申し出を退け、[cardinal_io.GetName]への参加を拒んだ。この栄誉は別の者に与えられる。"
 holy_war.40.a: "勝手にするがいい。"
 holy_war.41.title: "承認の申し出を受諾"
 holy_war.41.desc: "[recognition_candidate.GetName]はわが国からの承認の申し出を受け入れ、[recognition_io.GetName]に加わった。信徒たちと肩を並べ、不信仰者に剣を向けたのである。"
 holy_war.41.a: "神は偉大なり！"
 holy_war.42.title: "承認の申し出を拒否"
 holy_war.42.desc: "[recognition_candidate.GetName]はわが国からの承認の申し出を退け、[recognition_io.GetName]への参加を拒んだ。信徒たちは、この大義に背を向けた者を忘れないだろう。"
 holy_war.42.a: "勝手にするがいい。"
