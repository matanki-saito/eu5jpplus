l_japanese:
 flavor_mfa.1.title: "$BYZ_ADJ$の伝統"
 flavor_mfa.1.entry: "$BYZ_ADJ$の伝統"
 flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName]は岐路に立っている。わずか数十年前、誇り高き[target_character.GetDynasty.GetName]家の一員である[target_character2.GetName]が[ROOT.GetCountry.GetFlavorRank]の座に就いた。[target_character2.GetSheHe]は[ShowModifier('byz_born_in_the_purple_modifier')]でありながら、[ShowReligionName('catholic')]へと改宗し、[ShowCultureName('piedmontese')]文化を受け入れ、本来の[target_country.GetAdjective]の出自を捨て去ったのである。\n\nそして今日、[ROOT.GetCountry.GetNameWithNoTooltip]を治めるのは[target_character2.GetHerHis]の子孫である[target_character.GetName]だ。[target_character.GetSheHe]は、もし[target_character.GetLocation.GetName]に生まれず、[target_country.GetLongNameWithNoTooltip]で人生を歩んでいたならどのような未来があったのか、そんな思いを胸に秘めているのかもしれない。"
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip]は、適応という賢明な判断を下した。"
 flavor_mfa.1.a.entry: "統治者は、適応という賢明な判断を下した。"
 flavor_mfa.1.b: "我々は自らの起源を捨て去りなどしない！"
 mfa_extra_information_about_reform: "[target_government_reform.GetName]の[modifiers|e]は、[ShowCultureName('greek_culture')][culture|e]の割合と[ShowReligionAdjective('orthodox')][religion|e]の割合に応じて負から正へと変動する。[ROOT.GetCountry.GetName]が改宗を進めるにつれ、ペナルティは徐々にボーナスへと転じていく。補正の値は#N -1#!から#G +1#!の範囲で変動する。"
 mfa_opportunity_for_thessaloniki: "[target_government_reform.GetName]を採用し、[ShowCultureName('greek_culture')][culture|e]と[ShowReligionAdjective('orthodox')]の割合が#W 75.0%#!に達すると、[ShowLocationName('thessaloniki')]とその周辺において[target_country.GetName]に対し封土を要求できるようになる。"
 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
 flavor_mfa.2.entry: "ファチーノ・カーネ"
 flavor_mfa.2.desc: "我々の[ROOT.GetCountry.GetFlavorRank]には現在、名高い人物が身を寄せている。[target_character.GetName]という、[target_character.GetBirthLocation.GetName]出身の著名な傭兵隊長だ。他国に仕えてきた年月のなかで、[target_character.GetNameWithNoTooltip]は有能な指揮官として手腕を遺憾なく発揮してきた。その実績に鑑みれば、[target_character.GetSheHe]はわが国の軍にぴったりの人材だろう。この地域の列強との戦いにおいて、強力な戦力となってくれるはずだ。"
 flavor_mfa.2.a: "[target_character.GetHerHim]を雇う必要がある。"
 flavor_mfa.2.a.entry: "彼を雇う必要がある。"
 flavor_mfa.2.b: "雇用の見返りとして、[target_character.GetHerHim]にわが国の領地を提供しよう。"
 flavor_mfa.2.b.entry: "雇用の見返りとして、彼にわが国の領地を提供しよう。"
 flavor_mfa.2.c: "ふん！ 流れ者にはよそで職を探させておけ。"
 mfa_facino_condotierro: "ファチーノの傭兵団"
 flavor_mfa.3.title: "皇帝にふさわしい野望"
 flavor_mfa.3.entry: "$flavor_mfa.3.title$"
 flavor_mfa.3.desc: "[target_character.GetName]は [ShowModifier('byz_born_in_the_purple_modifier')]でもなければ皇帝の後継者でもない。だが、[target_character.GetDynasty.GetName]家の皇帝の血は確かに[target_character.GetHerHis]に受け継がれている。[target_character.GetSheHe|U]は[ShowAreaName('piemonte_area')]の小領主ごときに収まるつもりはない。[target_character.GetShortNameWithNoTooltip]は、単なる[ShowCountryRankName('rank_county')]などよりはるかに大きなものを統べるにふさわしい。"
 flavor_mfa.3.a: "[ShowAreaNameWithNoTooltip('piemonte_area')]には新たな覇者が必要だ。"
 flavor_mfa.3.b: "[target_character.GetHerHis|U]の野心は、周囲を敵に回すだけだ。"
 flavor_mfa.3.b.entry: "彼の野心は、周囲を敵に回すだけだ。"
 mfa_if_we_conquer_enough_in_20_years: "[ROOT.GetCountry.GetName]の[population_i|e][population|e]が#W 20#!年以内に#W [DisplayPopulationNumber('(CFixedPoint)500')]#!以上に達した場合、[SCOPE.ScriptValue('prestige_mild_bonus')|+=]の[prestige_i|e][prestige|e]に加え、#W 40#!年のあいだ[modifier|e]「[ShowModifier('mfa_elevation_modifier')]」を得る。また、まだ[ShowCountryRankName('rank_duchy')]になっていない場合は、[ShowCountryRankName('rank_duchy')]に昇格する可能性がある\n達成できなかった場合、[SCOPE.ScriptValue('prestige_extreme_penalty')|+=]の[prestige_i|e][prestige|e]と[SCOPE.ScriptValue('stability_weak_penalty')|+=]の[stability_i|e][stability|e]を失い、さらに隣接するすべての国が彼らに対して[casus_belli|e]「[ShowCasusBelliName('cb_cut_down_in_size')]」を得る"
 flavor_mfa.4.title: "[ShowRegionNameWithNoTooltip('italy_region')]の笑いもの"
 flavor_mfa.4.desc: "数十年前、[target_character.GetName]は[ShowAreaName('piemonte_area')]の覇者となることを誓った。だがいまや、その志の名残といえば[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の面々に向けられる辛辣な嘲笑だけである。[ROOT.GetCountry.GetLongName]の[target_character.GetDynasty.GetName]はただ失敗しただけでなく、その過程で多くの新たな敵まで作ってしまった。この惨状に、[ROOT.GetCountry.GetFlavorRank]の隣国が同情を寄せることなどあるのだろうか。"
 flavor_mfa.4.a: "できることはやった。"
 flavor_mfa.5.title: "熟れすぎた果実"
 flavor_mfa.5.desc: "ここ数年、[from_country.GetLongName]は隣国を敵に回すような振る舞いばかりしてきた。いまとなっては、その野心がもたらしたものといえば嘲笑と他国の怒りだけである。我々も、そして多くの国々も、この惨めな有様を軽蔑している。"
 flavor_mfa.5.a: "なんと惨めなことか。"
 flavor_mfa.6.title: "[ShowAreaNameWithNoTooltip('piemonte_area')]の公爵たち"
 flavor_mfa.6.desc: "かつて[target_character.GetName]は、自らの家門——すなわち[ROOT.GetCountry.GetAdjective]・[target_character.GetDynasty.GetName]家——が、いつの日か、その家名に見合う栄光を手にすると誓った。そして今日、ついにその努力は報われ、この[ShowAreaName('piemonte_area')]の至宝は[ShowCountryRankName('rank_duchy')]へと昇格を果たした。"
 flavor_mfa.6.a: "ひょっとすると、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配者たちも「紫衣の生まれ」と呼ばれるに値するのではないか。"
 flavor_mfa.6.b: "[ROOT.GetCountry.GetNameWithNoTooltip]は栄光に包まれるのだ！"
 mfa_purple_color: "国家カラーが#W 濃紫#!に変更される"
 flavor_mfa.7.title: "[ShowScriptedGeographyNameWithNoTooltip('claims_of_thessalonica_geography')]の領有権の主張"
 flavor_mfa.7.entry: "$flavor_mfa.7.title$"
 flavor_mfa.7.desc: "[target_character.GetName]は、[target_character2.GetName]を祖とする[target_character.GetDynasty.GetName]の血統に連なる者として、[target_country.GetLongName]に対して遠縁ではあるが生得の請求権を有している。さらに、あまり知られていないもう一つの請求権がある。これは[target_character3.GetName]および[target_character3.GetDynasty.GetName]家にまで遡る[ShowScriptedGeographyName('claims_of_thessalonica_geography')]への権利である。[target_country.GetCapital.GetName]の[target_character.GetDynasty.GetNameWithNoTooltip]家と密接に協力してきたことから、[target_character.GetName]は、我々がその働きへの報酬として[target_location.GetName]とその周辺を与えられるかもしれないと考えている。"
 flavor_mfa.7.a: "領有権を主張する。"
 flavor_mfa.7.b: "厚意に甘えることはしない。"
 MFA_request_thessalonica: "我々は[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、そして[ShowProvinceDefinitionName('central_macedonia_province')]の領地を、[ShowSubjectTypeName('fiefdom')]として[target_country.GetLongName]に求める。"
 flavor_mfa.8.title: "[from_country.GetNameWithNoTooltip]からの要請"
 flavor_mfa.8.desc: "[from_country.GetLongName]にいる我ら[target_character.GetDynasty.GetName]の同族は、[ShowRegionName('italy_region')]で真に[target_country.GetAdjective]たる国家を築き上げた。その民は[ROOT.GetCountry.GetReligion.GetAdjective]徒であり、[ROOT.GetCountry.GetCulture.GetName]の言葉を話し、紫衣をまとって我らと同じ文化を体現している。長きにわたる歴史的な結びつきと相互協力を踏まえ、その統治者[target_character.GetName]は、[ShowScriptedGeographyName('claims_of_thessalonica_geography')]に対する古い請求権に基づき、[target_location.GetName]とその周辺の封土を求めている。"
 flavor_mfa.8.a: "[target_character.GetSheHe|U]なら、[ShowLanguageNameWithNoTooltip('latin_language')]の時代の話を持ち出すべきではないとわかっているはずだ。"
 flavor_mfa.8.b: "彼らの請求権を尊重しよう。"
 mfa_make_thessaloniki_subject: "[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、そして[ShowProvinceDefinitionName('central_macedonia_province')]にある我々の[locations|e]が、[from_country.GetName]のもとで[ShowSubjectTypeName('fiefdom')]として分離される"
 flavor_mfa.1000.title: "$flavor_mfa.7.title$"
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
 flavor_mfa.1000.desc: "[target_character.GetName]は栄えある[target_character.GetDynasty.GetName]の血統に連なる者であるが、[target_character.GetSheHe]は[target_character3.GetName]にまで遡るもう1つの有力な請求権も保持している。その請求権とは、[ShowScriptedGeographyName('claims_of_thessalonica_geography')]に対するものである。この請求権はさほど強いものではないが、[ShowCultureGroupName('italian_group')]諸国の多くが[ShowDisasterName('byzantine_succession_crisis')]に苦しむ[target_country.GetLongName]から領土を削り取ろうと機会をうかがっているため、我々は他国から支援を受けられるだろう。"
 flavor_mfa.1000.a: "遠征の準備に取りかかろう。"
 flavor_mfa.1000.b: "その程度の請求権で戦争を始めるのは愚かだ。"
 recipient_agrees_to_join_war: "[recipient.GetName]が、数年以内に[actor.GetName]の[GetCountry('BYZ').GetLongName]に対する戦いに参戦することを約束する"
 MFA_gather_allies: "[ROOT.GetCountry.GetName]は、[country_interaction|e]「[ShowCountryInteractionName('mfa_join_against_byz')]」を用いて味方を集めようと試みる\n#W 3年#!後、集めた支援者の助けを借りて宣戦布告する[event|e]が発生する"
 flavor_mfa.1001.title: "[from_country.GetAdjectiveWithNoTooltip]の僭称者の懐柔"
 flavor_mfa.1001.desc: "卑劣な[from_country.GetAdjective][target_character.GetDynasty.GetName]家は、[target_character3.GetDynasty.GetName]家の血統を盾に[ShowScriptedGeographyName('claims_of_thessalonica_geography')]の請求権を主張している。密偵の報告によれば、彼らは[ShowCultureGroupName('italian_group')]諸国を糾合し、[ShowDisasterName('byzantine_succession_crisis')]で我らが弱っている隙に、あの地を奪い取ろうと画策しているという。"
 flavor_mfa.1001.a: "あの裏切り者どもに、領土を一片たりとも明け渡すことはない！"
 flavor_mfa.1001.b: "形ばかりの譲歩をしよう。"
 flavor_mfa.1001.c: "全部くれてやれ、知ったことではない！"
 mfa_offer_few_provinces: "[from_country.GetName]をなだめるため、[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、および[ShowProvinceDefinitionName('central_macedonia_province')]の[provinces|e]を差し出す"
 mfa_offer_entire_geography: "[ShowScriptedGeographyName('claims_of_thessalonica_geography')]に属する我々の土地すべてを[from_country.GetName]に差し出す"
 flavor_mfa.1002.title: "絶好の機会"
 flavor_mfa.1002.desc: "[target_country.GetLongName]への遠征に向けて同盟国を糾合しはじめてから、長い時が経った。内紛によって大きく弱体化した敵は依然として征服戦争の格好の標的であり、多くの盟友が我らの大義に加わったいまこそ、[target_dynasty.GetName]のどの家系が上かを証明する時なのかもしれない。"
 flavor_mfa.1002.a: "戦の狼煙を上げよ！"
 flavor_mfa.1002.b: "いまはその時ではない。"
 flavor_mfa.1002.c: "この計画は取りやめるべきだ。"
 flavor_mfa.1003.title: "協定の履行"
 flavor_mfa.1003.desc: "ついに[target_country.GetLongName]との戦が勃発し、我々はいま、[from_country.GetName]との約束を果たすよう求められている。[target_character.GetDynasty.GetName]家の内乱に助力すべきか、それとも[target_war.GetName]において[from_country.GetLongNameWithNoTooltip]を見捨てるべきか。"
 flavor_mfa.1003.a: "我らは同盟国を見捨てはしない。"
 flavor_mfa.1003.b: "傍観を決め込むことこそ、最善の道だ。"
 flavor_mfa.1005.title: "[target_country.GetNameWithNoTooltip]からの提案"
 flavor_mfa.1005.desc: "臆病な[target_country.GetLongName]もついに折れ、[ShowScriptedGeographyName('claims_of_thessalonica_geography')]の領地を我らに差し出してきた。この提案は慎重に検討すべきだ。そもそも今回の遠征そのものが大きな危険を伴っているのだから。"
 flavor_mfa.1005.a: "得られるものはすべて手にしておくべきだ。"
 flavor_mfa.1005.b: "あれで我らを止められると思っているのなら愚かなことだ！"
 mfa_make_thessaloniki_subject_out_of_provinces: "[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、そして[ShowProvinceDefinitionName('central_macedonia_province')]にある[target_country.GetAdjective]の[locations|e]が、[from_country.GetName]のもとで[ShowSubjectTypeName('fiefdom')]として分離される"
 mfa_make_thessaloniki_subject_out_of_geography: "[ShowScriptedGeographyName('claims_of_thessalonica_geography')]にある[target_country.GetAdjective]の[locations|e]が、[from_country.GetName]のもとで[ShowSubjectTypeName('fiefdom')]として分離される"
 flavor_mfa.1006.title: "[from_country.GetLongNameWithNoTooltip]からの返答"
 flavor_mfa.1006.desc.affirmative: "[target_character.GetDynasty.GetName]家の内乱は回避された！ どうやら卑劣な[from_country.GetAdjective]の一族がついに折れ、我らの提案した領地移譲を受け入れ、撤退したようだ。"
 flavor_mfa.1006.desc.negative: "[from_country.GetAdjective]の卑劣な裏切り者である[target_character.GetDynasty.GetName]家など信じられるものか！ 我らの慎ましい和平提案は退けられてしまった。まったく、あの[ShowLanguageName('latin_language')]の悪魔どもはまさにルシファーの手先そのものだ！"
 flavor_mfa.1006.affirmative: "これで平和が訪れた。"
 flavor_mfa.1006.negative: "身内の裏切りほど心を抉るものはない。"
