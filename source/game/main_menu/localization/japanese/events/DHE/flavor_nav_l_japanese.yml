l_japanese:
 flavor_nav.1.title: "[target_character.GetNameWithNoTooltip]と[target_character_2.GetNameWithNoTooltip]の共同統治"
 flavor_nav.1.entry: "フアナ2世とフィリップ・デヴルーの共同統治"
 flavor_nav.1.desc: "1329年に[ROOT.GetCountry.GetName]の王位に就いて以来、[target_character.GetName]と[target_character_2.GetName]は力を合わせて[ROOT.GetCountry.GetFlavorRank]を統治してきた。しかし共同統治者たちが好むのは、明らかに[ShowRegionName('france_region')]の[target_character_2.GetNameWithNoTooltip]の領土である。2人は[ShowCultureGroupNameWithNoTooltip('french_group')]領に滞在するため、頻繁に[ROOT.GetCountry.GetNameWithNoTooltip]を離れている。\n\n共同統治者の不在中、[ROOT.GetCountry.GetGovernment.GetCourtTitle]には[ROOT.GetCountry.GetFlavorRank]を治める有能な摂政を数多く立ててきたが、ここ数年は不安の声が高まっている。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]貴族の中には、強欲な諸外国から見て[ROOT.GetCountry.GetFlavorRank]が弱体化しているように映らぬよう、2人に[ROOT.GetCountry.GetCapital.GetName]に常駐することを望む者が少なくない。"
 flavor_nav.1.a: "[ShowRegionNameWithNoTooltip('france_region')]の領土が最も重要である。"
 flavor_nav.1.b: "両国を等しく統治する。"
 flavor_nav.1.c: "[ROOT.GetCountry.GetNameWithNoTooltip]の領土を最優先事項にする。"
 flavor_nav.2.title: "[target_character.GetNameWithNoTooltip]の即位"
 flavor_nav.2.entry: "カルロス2世の即位"
 flavor_nav.2.desc: "[GetCharacter('nav_jeanne_ii_capet').GetName]の死に伴い、野心家の[target_character.GetName]が王位に就いた。早くも型破りな統治者として異彩を放っており、[ROOT.GetCountry.GetGovernment.GetAdjective|U]の式典と戴冠式のために[ROOT.GetCountry.GetCapital.GetName]に到着するなり、[ShowDialectName('aragonese_dialect')]で誓いを立てることに意欲を示した。伝統の[ShowLanguageNameWithNoTooltip('latin_language')]で宣誓することを望む[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の一部は、不満の声が漏れている。"
 flavor_nav.2.a: "ロマンス語で誓いを立てる。"
 flavor_nav.2.b: "ばかばかしい。誓いは[ShowLanguageNameWithNoTooltip('latin_language')]で立てなければ。"
 flavor_nav.2.c: "代わりに宣誓を[ShowLanguageNameWithNoTooltip('basque_language')]で執りおこなわせよう。"
 flavor_nav.3.title: "[target_character.GetNameWithNoTooltip]の所領"
 flavor_nav.3.entry: "カルロス2世のフランス所領"
 flavor_nav.3.desc: "[GetCharacter('nav_philip_iii_evreux').GetName]と[GetCharacter('nav_jeanne_ii_capet').GetName]双方の所領を継承した[target_character.GetName]は、[ROOT.GetCountry.GetName]と[ShowRegionName('france_region')]の複数の領土を包括する広大な領域を治めている。[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip]と[GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip]は[ROOT.GetCountry.GetNameWithNoTooltip]を共同統治したが、[ShowRegionNameWithNoTooltip('france_region')]に居を構えることを好み、[ROOT.GetCountry.GetFlavorRank]には短期滞在するだけであった。\n\n[target_character.GetNameWithNoTooltip]の即位に伴い、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くの同盟者が[ROOT.GetCountry.GetNameWithNoTooltip]に腰を据えるよう促しているが、[ROOT.GetCountry.GetGovernment.GetRulerTitle]が争いの絶えない[ShowRegionNameWithNoTooltip('france_region')]の王座に対して大きな野望を抱いていると感じる者もいる。"
 flavor_nav.3.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の政務は[ShowRegionNameWithNoTooltip('france_region')]所領で執りおこなう。"
 flavor_nav.3.b: "主要な[ROOT.GetCountry.GetGovernment.GetCourtTitle]を[ROOT.GetCountry.GetNameWithNoTooltip]に構える。"
 flavor_nav.3.c: "[evr_country.GetNameWithNoTooltip]から統治する。"
 flavor_nav.3.c.entry: "エヴルーから統治する。"
 nav_will_be_able_to_rally_other_appanages_tt: "[GetCountry('FRA').GetName]のアパナージュとの関係が#G 150#!に達すると、[decision|e]「[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]」により[GetCountry('FRA').GetNameWithNoTooltip]との戦争で我々を支持する可能性が高まる"
 variable_tt_nav_enable_ambitions_of_charles_ii_ambition_events: "The $flavor_nav.2.entry$ [dynamic_historical_event|e] has occurred"
 flavor_nav.4.title: "[ShowDynastyNameWithNoTooltip('capet_dynasty')]家の王位請求"
 flavor_nav.4.entry: "カペー家の王位請求"
 flavor_nav.4.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]・[target_character.GetName]の野心に警戒を示す声は少なくなかったが、[fra_country.GetName]の王位を直接請求したいという意向を耳にするとは、多くの者が予想していなかった。[GetCharacter('nav_jeanne_ii_capet').GetShortName]を通じた[ShowDynastyName('capet_dynasty')]の血統により強固な請求権を持つが、[ROOT.GetCountry.GetName]継承条件の一つが、[fra_country.GetNameWithNoTooltip]への王位請求を放棄することだった。\n\nまた古来の[ShowHeirSelectionName('salic_law')]があるため、[fra_country.GetNameWithNoTooltip]の多くの領主が[target_character.GetNameWithNoTooltip]の請求権を承認する可能性は低いが、[target_character.GetNameWithNoTooltip]は[fra_country.GetNameWithNoTooltip]内での政治的影響力を利用して有力領主を説得すべきだと考える者もいる。"
 flavor_nav.4.a: "[target_character.GetNameWithNoTooltip]こそ[fra_country.GetNameWithNoTooltip]の正当な王位継承者だ！"
 flavor_nav.4.a.entry: "カルロスこそフランスの正当な王位継承者だ！"
 flavor_nav.4.b: "これらの請求権を利用し、[ShowCultureGroupNameWithNoTooltip('french_group')]臣民への正当性を高める。"
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip]はすでに請求権を放棄した。[ROOT.GetCountry.GetNameWithNoTooltip]の統治に専念しよう。"
 unlocks_enforce_the_capetian_claim_to_france_tt: "[decision|e]「$navarre_charles_ii_claim_to_france.title$」がアンロックされる"
 nav_appanage_support_for_french_throne_tt: "[ROOT.GetCountry.GetNameWithNoTooltip]がアパナージュの場合に[GetCountry('FRA').GetNameWithNoTooltip]のほかのアパナージュとの関係が#G +150#!に達すると、[decision|e]「[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]」により[GetCountry('FRA').GetNameWithNoTooltip]との戦争で我々を支持する可能性が高まる"
 flavor_nav.5.title: "[target_character_2.GetNameWithNoTooltip]との同盟"
 flavor_nav.5.entry: "エティエンヌ・マルセルとの同盟"
 flavor_nav.5.desc: "当初、[target_character.GetName]の支持集めの試みは概ね停滞していた。複数の[fra_country.GetAdjectiveWithNoTooltip]領主が[fra_ruler.GetName]への忠誠を示し、[target_character.GetNameWithNoTooltip]の請求を拒絶したのだ。だが[target_character.GetNameWithNoTooltip]は[fra_country.GetAdjectiveWithNoTooltip]の弱小領主の一部を説得できたものの、[target_character.GetShortNameWithNoTooltip]の側近の多くは、著名な[target_character_2.GetName]が[target_character.GetNameWithNoTooltip]を支持する意向だと耳にするとは予想していなかった。[fra_country.GetAdjectiveWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の一員であるものの、[target_character_2.GetNameWithNoTooltip]は長年にわたり[fra_ruler.GetNameWithNoTooltip]にとっての悩みの種であり、三部会で[fra_ruler.GetHerHis]の取り組みを何度も阻んだことがある。[target_character_2.GetNameWithNoTooltip]は非常に貴重な戦力となるが、その野心が[target_character.GetNameWithNoTooltip]の野心と食い違い、結果としてが足かせとなるのではないかと懸念する者もいる。\n\nさらに[target_character_2.GetNameWithNoTooltip]は、[nrm_country.GetName]の領主たちが[fra_ruler.GetNameWithNoTooltip]に不満を募らせ、[target_character.GetShortNameWithNoTooltip]を支持する可能性が高いという報せを届けた。"
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip]は代えがたい協力者となるだろう。"
 flavor_nav.5.a.entry: "エティエンヌ・マルセルは代えがたい協力者となるだろう。"
 flavor_nav.5.b: "[target_character_2.GetHerHim]に[fra_country.GetNameWithNoTooltip]からわが国の国庫へ収入を吸い上げさせる。"
 flavor_nav.5.b.entry: "彼にフランスからわが国の国庫へ収入を吸い上げさせる。"
 flavor_nav.5.c: "[target_character_2.GetHerHis]の支援を完全に拒否する。[target_character_2.GetHerHis]の策がなくても[fra_country.GetNameWithNoTooltip]を手に入れてみせる。"
 flavor_nav.5.c.entry: "彼の支援を完全に拒否する。彼の策がなくてもフランスを手に入れてみせる。"
 nav_decision_seizure_of_duchy_of_normandy_tt: "[decision|e]「$nav_coercing_of_normandy.title$」がアンロックされる"
 flavor_nav.6.title: "非業の最期"
 flavor_nav.6.entry: "カルロス2世の焼死"
 flavor_nav.6.desc: "近年[target_character.GetName]の健康状態は悪化していたが、それでも前の晩に自室の火災で死亡したという報せは[ROOT.GetCountry.GetGovernment.GetCourtTitle]に衝撃を与えた。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内に渦巻く噂によると、病気の治療の最中に蝋燭が[target_character.GetNameWithNoTooltip]のベッドに落ち、火が燃え広がったという。\n\n[scope_our_heir.GetName]は先代に劣る野心をもって王位に就くが、[ROOT.GetCountry.GetName]の書記官たちが[target_character.GetNameWithNoTooltip]の治世をどう記すのかと、思いを巡らせる者も多い。"
 flavor_nav.6.a: "野心的な暴君として記憶されるだろう。"
 flavor_nav.6.b: "[GetCountry('FRA').GetNameWithNoTooltip]の征服者として記憶されるだろう！"
 flavor_nav.6.c: "[ShowCultureGroupNameWithNoTooltip('french_group')]の血筋にかかわらず、[ROOT.GetCountry.GetNameWithNoTooltip]に傾倒したことで知られるだろう。"
 flavor_nav.6.d: "そうではなく、未来に目を向けよう。"
 flavor_nav.7.title: "係争中の国境地帯"
 flavor_nav.7.entry: "辺境地域での分裂"
 flavor_nav.7.desc: "[ROOT.GetCountry.GetName]と[cas_country.GetName]の関係は敵対的であったが、[cas_country.GetNameWithNoTooltip]の統治者たちが[ROOT.GetCountry.GetFlavorRank]の完全な征服を目指したことは一度もない。しかし、[ShowProvinceDefinitionName('biscay_province')]、[ShowProvinceDefinitionName('gipuzkoa_province')]、[ShowProvinceDefinitionName('alava_province')]の国境地帯では、曖昧な境界をめぐり地元の有力な諸家のあいだで緊張が高まっていた。\n\n[cas_country.GetNameWithNoTooltip]と[our_ruler.GetName]の代表者たちが国境紛争の解決に向けて尽力していたものの、[cas_country.GetNameWithNoTooltip]で[ShowDisasterNameWithNoTooltip('castilian_civil_war')]が勃発し、交渉の見通しが立たなくなり、地域の名家間の争いが激化している。\n\n[cas_country.GetNameWithNoTooltip]が泥沼の内紛に陥り、地元の諸家の代表者たちは、紛争地域に侵攻して領有するよう[our_ruler.GetNameWithNoTooltip]に請願した。"
 flavor_nav.7.a: "これらの領地紛争を解決しなければ、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の諸家の怒りは募っていくだろう。"
 flavor_nav.7.b: "外交交渉を停止せよ。この地域への請求権を確実にするのだ！"
 flavor_nav.8.title: "権力の空白が[ROOT.GetCountry.GetNameWithNoTooltip]に波及"
 flavor_nav.8.entry: "権力の空白がナバラに波及"
 flavor_nav.8.desc: "[ShowDisasterNameWithNoTooltip('castilian_civil_war')]は終結したが、その爪痕は[ShowRegionName('iberia_region')]全域にいまも残る。国境地帯の守備隊は大幅に減り、地元の諸家が抱える確執は公然たる戦争に発展。\n\n[cas_country.GetName]の勢力が低下しているため、この地域における紛争の激化は、[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]が単独で解決するには手に余る事態となる。"
 flavor_nav.8.a: "[ROOT.GetCountry.GetNameWithNoTooltip]は騒乱の時代を迎えるだろう。"
 nav_end_blood_feud_decision_enabled_tt: "[decision|e]「$nav_end_the_blood_feuds.title$」がアンロックされる"
 nav_sow_division_in_the_borderlands_enabled_tt: "[decision|e]「$nav_sow_division_in_the_borderlands.title$」がアンロックされる"
 flavor_nav.9.title: "[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]での爵位廃止"
 flavor_nav.9.entry: "ビスカヤでの爵位廃止"
 flavor_nav.9.desc: "[cas_country.GetName]と[ROOT.GetCountry.GetName]は、[ShowProvinceDefinitionName('biscay_province')]の支配権を長年にわたり争ってきた。この地域は多くの有力家の故郷であり、なかでもアロ家は、最も忠実で最も影響力のある臣下として仕えてきた。しかし、[cas_country.GetNameWithNoTooltip]はこの地域の爵位を直接廃止し、続いて[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]内の紛争地域を併合していった。\n\nこの[cas_country.GetNameWithNoTooltip]の行動に激怒したアロ家は、[cas_country.GetAdjectiveWithNoTooltip]による併合に加担した者を弾圧すするため、[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]の反乱軍に資金を供給するよう[ROOT.GetCountry.GetGovernment.GetCourtTitle]に促した。"
 flavor_nav.9.a: "アロ家の要求に従えば、[cas_country.GetAdjectiveWithNoTooltip]の怒りは避けられない。"
 flavor_nav.9.a.entry: "アロ家の要求に従えば、カスティーリャの怒りは避けられない。"
 flavor_nav.9.b: "地域に無秩序をもたらすアロ家を支援する。"
 variable_tt_nav_enable_blood_feud_faction_events: "$flavor_nav.8.entry$ という [dynamic_historical_event|e] が発生した"
 flavor_nav.10.title: "教会の声"
 flavor_nav.10.entry: "$flavor_nav.10.title$"
 flavor_nav.10.desc: "我らが[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の長女である[target_character.GetName]が、自らを[ShowLocationName('paris')]での新たな生活に導く随行団を待っている。\n\nこの世に生を受けたとき、彼女は両親の全財産を相続する者として星々の祝福を受けたかに見えたが、もはや状況が変わった。[GetCountry('ARA').GetGovernment.GetRuler.GetName]との結婚は破棄され、彼女はいまや妹である[target_sister.GetShortName]の障害にすぎない存在となってしまった。\n\nこうして[target_character.GetNameWithNoTooltip]は、[ShowLocationNameWithNoTooltip('paris')]で[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]に加わり、我らが救い主に奉仕することとなった。\n\nしかしながら、彼女が依然として国家にとっては有用であり、外交交渉において利用できる可能性を指摘する声もある。"
 flavor_nav.10.a: "彼女は修道女となるのだ。"
 flavor_nav.10.a.entry: "王権を活用してこれ以上の流血を防ぐ。"
 flavor_nav.10.b: "彼女にはまだ使い途がある。"
 flavor_nav.11.title: "[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]で[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支援を受けた諸家が優位に立つ"
 flavor_nav.11.entry: "国境地帯でナバラの支援を受けた諸家が優位に立つ"
 flavor_nav.11.desc: "[ShowScriptedGeographyName('nav_contested_basque_borderlands')]をめぐる親[ROOT.GetCountry.GetAdjective]派と親[GetCountry('CAS').GetAdjective]派の諸家の対立は、この地域に壊滅的な被害を与えた。しかし[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の諸家は、[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]における[ROOT.GetCountry.GetNameWithNoTooltip]の影響力をほぼ回復させるという不可能なことを成し遂げた。[GetCountry('CAS').GetNameWithNoTooltip]がなおも策を弄してこの地域の支配を取り戻そうとする可能性もあるが、[GetCountry('CAS').GetAdjectiveWithNoTooltip]の[GetCountry('CAS').GetGovernment.GetCourtTitle]は間違いなく大きな代償を払うことになる。"
 flavor_nav.11.a: "これをより強力な[ROOT.GetCountry.GetNameWithNoTooltip]への足がかりとしよう。"
 navarre_gains_castile_basque_lands_tt: "[GetCountry('CAS').GetName]が[ShowScriptedGeographyName('nav_contested_basque_borderlands')]で領有権を持つすべてのロケーションを維持するために大胆な対策を取らないかぎり、高い確率で領有権が[ROOT.GetCountry.GetName]に移る"
 flavor_nav.12.title: "エルマンダーの強化"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "[ROOT.GetCountry.GetName]のエルマンダーはこれまで有能な味方であることを示してきたが、何十年にもわたる[ROOT.GetCountry.GetAdjectiveWithNoTooltip]諸家の血で血を洗う抗争は限界に達している。\n\nそこで[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くが、[ROOT.GetCountry.GetGovernment.GetAdjective|U]のエルマンダーの支部を設立するために出資した。費用はかさむが、エルマンダーに権力を与えれば諸家に対して[our_ruler.GetName]の権威を誇示し、この争いに終止符を打てるようになるだろう。"
 flavor_nav.12.a: "エルマンダーが諸家の小競り合いに終止符を打つだろう。"
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip]と[scope_our_heir.GetNameWithNoTooltip]の指導"
 flavor_nav.13.entry: "ホアン・デ・ベアウモントと後継者の指導"
 flavor_nav.13.desc: "ベアウモント家は長らく[ROOT.GetCountry.GetName]内で影響力を保っていたが、[scope_our_heir.GetName]の家庭教師を買って出たことは驚きだ。[target_character.GetName]は名誉ある人物として知られているものの、今回の指導の申し出は、将来[ROOT.GetCountry.GetAdjectiveWithNoTooltip]を治める[scope_our_heir.GetNameWithNoTooltip]の機嫌を取るための策略ではないかと懸念する声もある。"
 flavor_nav.13.a: "[target_character.GetHeShe|U]は優れた教師となるだろう。"
 flavor_nav.13.a.entry: "彼は優れた教師となるだろう。"
 flavor_nav.13.b: "[target_character.GetHerHim]がわが[scope_our_heir.GetNameWithNoTooltip]に影響力を持つようになる危険は冒せない。"
 flavor_nav.13.b.entry: "彼がわが後継者に影響力を持つようになる危険は冒せない。"
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip]と[target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "配偶者とペドロ・デ・ペラルタの影響力"
 flavor_nav.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の有力家の一つであるアグラモンテ家は、[target_character.GetName]のもとで影響力をかなり強めており、[scope_our_consort.GetName]とも緊密な関係を築いている。彼らの貢献は[ROOT.GetCountry.GetName]に利益をもたらしているが、その策謀には不穏な目的が隠されているのではないかと危惧する者もいる。"
 flavor_nav.14.a: "アグラモンテ家はわが国によく仕えてきた。"
 flavor_nav.14.b: "[target_character.GetHerHis|U]の[scope_our_consort.GetNameWithNoTooltip]への影響力は憂慮すべきだ。両者を引き離したほうがいいだろう。"
 flavor_nav.14.b.entry: "彼の配偶者への影響力は憂慮すべきだ。両者を引き離したほうがいいだろう。"
 variable_tt_beaumont_backed_heir: "ボーモン家は宮廷内に影響力を持ち、後継者を支持している"
 variable_tt_agramonteses_backed_consort: "アグラモンテ家は宮廷内に影響力を持ち、配偶者の有力な盟友となっている"
 flavor_nav.15.title: "迫りくる[the_legal_heir.GetNameWithNoTooltip]の簒奪"
 flavor_nav.15.entry: "迫りくる後継者の簒奪"
 flavor_nav.15.desc: "[our_ruler.GetName]の統治は長く安定していたが、最近は病に伏し、寝たきりとなっている。[ROOT.GetCountry.GetGovernment.GetRulerTitle]の命が近く尽きることを恐れたアグラモンテ派は、忠誠を誓う[the_consort_usurper.GetName]を[ROOT.GetCountry.GetName]の新たな統治者として密かに戴冠させた。\n\nベアウモント家の一部は、[ROOT.GetCountry.GetGovernment.GetCourtTitle]を離れている[the_legal_heir.GetNameWithNoTooltip]にアグラモンテ派の裏切りを知らせようと、秘密裏に[the_legal_heir.GetHerHis]の従者に書状を送った。書状が間に合えば十分な支持を集めることができ、アグラモンテ派の陰謀が実を結ぶ前にこれを打ち砕くことができるかもしれない。"
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip]のほうが[ROOT.GetCountry.GetNameWithNoTooltip]を率いるにふさわしい。"
 flavor_nav.15.a.entry: "宮廷のほうがナバラを率いるにふさわしい。"
 flavor_nav.15.b: "[the_legal_heir.GetNameWithNoTooltip]こそ[ROOT.GetCountry.GetNameWithNoTooltip]の法的な統治者だ！"
 flavor_nav.15.b.entry: "わが後継者こそナバラの法的な統治者だ！"
 flavor_nav.15.historical_info: "共同統治者のブランカ1世とフアン2世は、息子のビアナ公カルロスがブランカ逝去と同時にナバラの王位を継承するよう定めた。しかしフアン2世はナバラの王位と統治をカルロスに譲らず、実質的に国王となって自らの息子を追い落としたのである。それぞれベアウモント派とアグラモンテ派の後押しを受け、父子は後にナバラ内戦で衝突することになり、フアン2世が最終的に勝利を収め、ナバラの王位を維持した。"
 flavor_nav.16.title: "[target_country.GetAdjectiveWithNoTooltip]の請求権"
 flavor_nav.16.desc: "[ShowRegionName('france_region')]全土で大きな支持を得た[target_character.GetName]は、[ShowRegionNameWithNoTooltip('france_region')]の王座を目指すと公然と宣言し、[ShowRegionNameWithNoTooltip('france_region')]各地に使者を送った。王座奪取の試みに[target_character.GetHerHim]とともに加わる最後の機会を提示するためである。[target_character.GetShortNameWithNoTooltip]はわが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に大いに取り入ってきたが、評議会には[target_character.GetSheHe]が成功した場合に[ShowRegionNameWithNoTooltip('france_region')]が大きく不安定化するのではないかと危惧する声もある。"
 flavor_nav.16.a: "[target_character.GetNameWithNoTooltip]の支持を表明する。"
 flavor_nav.16.b: "この紛争には関与しない。"
 flavor_nav.16.c: "[target_character.GetSheHe|U]を止めなければ。"
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName]が[target_character.GetName]の[ShowRegionName('france_region')]支配を懸けた戦争に参加する"
 flavor_nav.17.title: "[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]の窮状"
 flavor_nav.17.desc: "[GetCountry('NAV').GetName]と[ShowScriptedGeographyName('nav_contested_basque_borderlands')]におけるわが国の領土の多くが親[GetCountry('NAV').GetAdjectiveWithNoTooltip]派の手に落ち、[ROOT.GetCountry.GetName]に忠誠を誓う多くの[ShowCultureName('basque')]諸家が壊滅的な被害を受けた。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部にはこの地域がまだ失われてはいないと考える者もいるが、現地の人々の多くが[GetCountry('NAV').GetAdjectiveWithNoTooltip]の有力家の統治下にある現状では、支配権を取り戻すのは容易ではないだろう。"
 flavor_nav.17.a: "国境地帯が[GetCountry('NAV').GetNameWithNoTooltip]に分離するのを認めよ。"
 flavor_nav.17.b: "[ShowCultureNameWithNoTooltip('basque')]の民の反乱を忘れることはない。"
 flavor_nav.17.c: "犠牲は問わない。反乱を速やかに鎮圧せよ。"
 flavor_nav.20.title: "サン・フランチェスコ・デ・オリテ"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "敬虔な信者である[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は、[ShowLocationName('olite')]にあるサン・フランチェスコ修道院の建設が遅々として進まないことを容認できずにいる。\n\nこの修道院の建設は100年以上前に始まっていながら、いまだ完成には至っていないのだ。\n\n建設を急げばわが国の財政に打撃を与えるだろうが、完成すればこの地とわが国の威信に大きな恩恵をもたらしてくれるだろう。"
 flavor_nav.20.a: "神を讃えよ！"
 flavor_nav.20.b: "これまで待ってきたのだ。まだ待てる。"
 flavor_nav.20.historical_info: "オリテ修道院は、伝説ではアッシジのフランチェスコがサンティアゴ・デ・コンポステーラへの巡礼中（1213-1214年ごろ）に創設したことになっている。\n\nテオバルド2世によって設立されたオリテ修道院は、その後のナバラ王国の君主、特にジャンヌ2世とシャルル2世に財政的にも精神的にも支援され、修道会の成長と信仰を育んだ。\n\n時が経つにつれて修道院は変化を遂げ、スペインとアメリカに宣教師を養成・派遣するための「使徒学校」となったり、1795年のフランス革命戦争の際には病院としても使用された。"
 flavor_nav.21.title: "教会の呼び声"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "我らが[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の長女である[target_character.GetName]は、[ShowLocationName('paris')]での新たな生活に同行する随行団を待っている。\n\nこの世に生を受けたとき、彼女は両親の全財産を相続する立場にあり、星々も彼女に微笑んでいるかのようだった。だが、それも過去のことだ。[GetCountry('ARA').GetGovernment.GetRuler.GetName]との結婚は破談となり、彼女はいまや妹である[target_sister.GetShortName]の障害にすぎない存在となってしまった。\n\nこうして[target_character.GetNameWithNoTooltip]は、[ShowLocationNameWithNoTooltip('paris')]で[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]に加わり、我らが救い主に奉仕することとなった。\n\nしかしながら、彼女が依然として国家にとっては有用であり、外交交渉において利用できる可能性を指摘する声もある。"
 flavor_nav.21.a: "彼女は修道女となるのだ。"
 flavor_nav.21.b: "彼女にはまだ使い途がある。"
 flavor_nav.21.historical_info: "フアナはアラゴン王ペドロ4世と婚約していたものの、結婚は実現しなかった。歴史家たちは、フアナが配偶者として不適格とみなされるような状態や病気を抱えていたのではないか推察している。その後、妹のマリアが代わりにペドロ4世と結婚した。\n\n妹の結婚によりフアナは継承権を放棄せざるを得なくなり、パリ近郊のロンシャンのフランシスコ会修道院に入り、聖クララ会修道女として隠遁生活を送った。"
 flavor_nav.30.title: "トゥデラの灌漑事業"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "たとえ[ShowRegionName('france_region')]に所有する土地で多くの時間を過ごそうとも、我らが[ROOT.GetCountry.GetGovernment.GetRulerTitle]には依然として[ROOT.GetCountry.GetLongName]の新たな計画を推し進めるだけの時間がふんだんにある。\n\nわが[ROOT.GetCountry.GetFlavorRank]の南部に広がる[ShowLocationName('tudela')]周辺は肥沃なことで知られているが、同時に乾燥地帯でもあることが問題である。運河をいくつか設けて畑の灌漑を改善すれば、作物を丈夫に育てることができるかもしれない。"
 flavor_nav.30.a: "大地はさらに肥沃になるだろう。"
 flavor_nav.30.b: "このような支出の余裕はない。"
 flavor_nav.30.historical_info: "フアナ2世とフェリペ3世はその治世のあいだ、ナバラ王国南部の重要な都市トゥデラ周辺の灌漑設備拡張を含む、ナバラ王国全域にわたるいくつもの経済開発計画を推進した。"
 flavor_nav.40.title: "ナバラのフエロの複製"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]が日々の政務に関与することが一般的になったため、「#italic ナバラのフエロ#!」の写本が[ROOT.GetCountry.GetGovernment.GetRulerTitle]のために作られることとなった。\n\nこの写本には最高品質の革表紙が用いられ美しく装飾され、王国で最も熟練した写本師によって書き写される。文章は伝統に従い[spanish_language.GetName]で書かれ、随所に興味深い[basque_language.GetName]の語句が散りばめられる。\n\nしかしながら、我らが[ROOT.GetCountry.GetGovernment.GetRulerTitle]は[french_language.GetName]で話すため、ナバラ語のロマンス方言は話せないのが玉にきずだ。"
 flavor_nav.40.a: "[french_language.GetNameWithNoTooltip]への翻訳を追加せよ。"
 flavor_nav.40.a.entry: "[ShowLanguageNameWithNoTooltip('french_language')]への翻訳を追加せよ。"
 flavor_nav.40.b: "我らが統治者もこの土地の言葉を学ぶべきか。"
 flavor_nav.40.c: "バスク語が最も話されているのであれば、バスク語を公用語にすべきである。"
 flavor_nav.40.historical_info: "ナバラ王国の人口の大部分はバスク語（#italic Lingua Navarrorum#!）を母語としていたと思われるが、オック語の衰退に伴い、王国の公式文書のほとんどはナバラ・アラゴン語（#italic Ydiomate Navarre Terrae#!、#italic Ydiomate Navarre#!または#italic Lengoage de Navarra#!）で書かれた。\n\nさらに、1234年のシャンパーニュ家に始まる最初のフランス王朝による統治が始まって以来、フランス系の方言も広く用いられた。"
 flavor_nav.50.title: "アルヘシラス包囲戦"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "[target_country.GetAdjective]国境での戦争の報せが我々のもとに届いた。[GetCountry('CAS').GetName]は[target_country.GetNameWithNoTooltip]に対する十字軍を再開し、[target_character.GetName]は戦いへと参陣するために急ぎ[ROOT.GetCountry.GetName]へと戻ってきた。\n\nわが[ROOT.GetCountry.GetFlavorRank]にとって明白な利益はないにもかかわらず、我々はつねに、近隣諸国が[ShowRegionName('iberia_region')]から[ShowReligionGroupAdjective('muslim')]徒を追放するのを支援すべきであると感じてきたのだ。"
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip]がわが国の兵士を指揮する。"
 flavor_nav.50.a.entry: "この人物がわが国の兵士を指揮する。"
 flavor_nav.50.b: "わが国は十字軍に人員を送るが、[target_character.GetShortNameWithNoTooltip]は派遣すべきでない。"
 flavor_nav.50.b.entry: "わが国は十字軍に人員を送るが、彼は派遣すべきでない。"
 flavor_nav.50.c: "これは[ROOT.GetCountry.GetNameWithNoTooltip]の問題ではない。"
 flavor_nav.50.c.entry: "これは我々の問題ではない。"
 flavor_nav.50.historical_info: "1343年、ナバラ王フェリペ3世は、イベリア王国の統治者としての義務を強調し、グラナダに対する十字軍に参加する準備を整えた。ビスケー湾からの補給物資に支えられた彼のアルヘシラス包囲戦への参加は、少ない兵力にもかかわらず極めて重要な役割を果たした。不運にもフェリペ3世は病に倒れ、1343年9月に死去した。遺体はパンプローナに葬られ、心臓はパリに安置された。彼の死後、王妃のフアナ2世のもとにローマ教皇クレメンス6世から弔問がおこなわれた。最終的にアルヘシラスは陥落し、フアナ2世は1349年に亡くなるまで統治を続け、王位を息子のカルロス2世に譲った。"
 flavor_nav.60.title: "女王の遺言"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName]が逝去し、その遺言書が読まれた。遺言書のなかで、[target_character.GetHeSheFormal]は自らの後継者に、[ShowLocationName('olite')]にあるサンタ・マリア・ラ・レアル教会に礼拝堂を増築するよう求めている。\n\n廷臣たちのあいだで、この礼拝堂を聖母マリアの御宿りに捧げるという提案がなされた。我らが統治者である[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は、[target_character.GetShortNameWithNoTooltip]がどれほど献身的だったかを知っているため、この案に前向きな姿勢を示している。"
 flavor_nav.60.a: "母の遺言には従わねばならない。"
 flavor_nav.60.b: "もっといい金の使い途がある。"
 flavor_nav.60.historical_info: "女王フアナ2世が1349年に黒死病で亡くなったとき、彼女の遺言が読み上げられ、そのなかでサンタ・マリア・ラ・レアル・デ・オリテのゴシック様式の教会に礼拝堂を作る資金を提供するよう、息子のカルロス2世に依頼した。\n\nこの教会はエヴルー家によって宗教儀礼に用いられたほか、その建築様式はパリのノートルダム大聖堂の影響を受けている。"
 #Decisions
 navarre_charles_ii_claim_to_france.title: "[GetCountry('FRA').GetNameWithNoTooltip]王位への正当な請求権"
 navarre_charles_ii_claim_to_france.desc: "[GetCharacter('nav_jeanne_ii_capet').GetName]は[GetCountry('FRA').GetNameWithNoTooltip]王位の請求権を放棄したものの、[GetCharacter('nav_charles_ii_evreux').GetName]はなお先王[GetCharacter('fra_louis_x_capet').GetName]の直系である。[GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip]が[ShowHeirSelectionName('salic_law')]により不当に資格なしと定められたとしても、その請求権は現在の[GetCountry('FRA').GetNameWithNoTooltip]統治者の誰よりも強固である！"
 navarre_charles_ii_claim_to_france.a: "いまこそ[GetCountry('FRA').GetNameWithNoTooltip]王位への正当な請求を主張するのだ！"
 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.a: "いまこそ王座を手にするべく、内戦を仕掛けるぞ！"
 nav_appanage_willingness_to_join_tt: "[GetCountry('FRA').GetNameWithNoTooltip]のほかのアパナージュ従属国との関係が#G +150#!に達すると、[GetCountry('FRA').GetNameWithNoTooltip]王座を懸けた戦争でわが国を支持しやすくなる"
 nav_coercing_of_normandy.title: "[GetCountry('NRM').GetNameWithNoTooltip]への強制"
 nav_coercing_of_normandy.desc: "[ShowSituationNameWithNoTooltip('hundred_years_war')]の最前線に立ってきた[GetCountry('NRM').GetName]の領主たちの多くは、現在の[GetCountry('FRA').GetName]の統治者に不満を募らせている。[GetCharacter('nav_philip_iii_evreux').GetName]の領地を継承し、[GetCharacter('nav_charles_ii_evreux').GetName]は[GetCountry('NRM').GetFlavorRank]の人々と深いつながりを持つため、その一部は[GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip]を新たな主君として受け入れる可能性がある。"
 nav_coercing_of_normandy.a: "[GetCountry('NRM').GetNameWithNoTooltip]を掌握するぞ！"
 nav_end_the_blood_feuds.title: "血讐の終結"
 nav_end_the_blood_feuds.desc: "[ShowDisasterName('castilian_civil_war')]の終結以来、[GetCountry('CAS').GetAdjectiveWithNoTooltip]の影響力が弱った[GetCountry('NAV').GetName]の各地で、勢いづいた諸家同士が血で血を洗う抗争を長く続けてきた。[GetCountry('NAV').GetAdjectiveWithNoTooltip]の影響力が強まったいま、これを利用して抗争に終止符を打つことができる。"
 nav_end_the_blood_feuds.a: "権威が取り戻された！"
 nav_sow_division_in_the_borderlands.title: "国境地帯の分裂の画策"
 nav_sow_division_in_the_borderlands.desc: "[ShowScriptedGeographyName('nav_contested_basque_borderlands')]における[GetCountry('CAS').GetAdjective]の影響力が大きく低下したいま、[GetCountry('NAV').GetName]に忠誠を誓う諸家と[GetCountry('CAS').GetNameWithNoTooltip]に忠誠を誓う諸家の抗争が続いている。[GetCountry('CAS').GetNameWithNoTooltip]派との戦争で[GetCountry('NAV').GetNameWithNoTooltip]派を支援すれば、高くつくかもしれないが、[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]を再び[GetCountry('NAV').GetNameWithNoTooltip]に統合できる可能性がある。"
 nav_sow_division_in_the_borderlands.a: "敵対する諸家の領地の破壊を許可する。"
 nav_sow_division_in_the_borderlands.b: "国境地帯の外縁を焼き払え。"
 nav_sow_division_in_the_borderlands.c: "[GetCountry('CAS').GetAdjectiveWithNoTooltip]領内に不信の種をまく。"
 nav_sow_division_in_the_borderlands_a_tt: "[ShowScriptedGeographyName('nav_contested_basque_borderlands')]で[GetCountry('CAS').GetName]が[owned|e]するすべての[location|e]が、3年にわたって[ShowModifier('nav_feud_crossfire')]を得て、[prosperity|e]と[pop_satisfaction|e]を大幅に失う"
 nav_sow_division_in_the_borderlands_b_tt: "[ShowScriptedGeographyName('nav_contested_basque_borderlands')]で[GetCountry('CAS').GetName]が[owned|e]するすべての[location|e]が、3年にわたって[ShowModifier('nav_destructive_feuds')]を得て、[prosperity|e]、[pop_satisfaction|e]、[development|e]をわずかに失う"
 nav_sow_division_in_the_borderlands_c_tt: "[ShowScriptedGeographyName('nav_contested_basque_borderlands')]で[GetCountry('CAS').GetName]が[owned|e]するすべての[location|e]が、3年にわたって[ShowModifier('nav_widespread_distrust_caused_by_feuds')]を得て、[prosperity|e]、[pop_satisfaction|e]、[control|e]をわずかに失う"
