l_japanese:
 flavor_ham.1.title: "ベレンベルク銀行"
 flavor_ham.1.entry: "$flavor_ham.1.title$"
 flavor_ham.1.desc: "わが[ROOT.GetCountry.GetFlavorRank]の領内を流れる富に惹かれ、数多くの商人や金融業者が集まってきている。そのなかには、商業と金融に長けた[GetDynasty('berenberg_dynasty').GetName]一族も含まれており、彼らは[berenberg_bank_hq.GetName]に民間銀行を設立することを望んでいる。このような機関は、貿易信用を管理し、北海を越えた物資の交換を円滑化するうえで極めて貴重な存在となるかもしれない。"
 flavor_ham.1.historical_info: "1590年、スペインによるアントワープ再征服から逃れてきたフランドル人商人、ハンスとパウル・ベレンベルクによって設立されたベレンベルク銀行は、今日でも営業を続ける世界屈指の歴史を誇る豪商銀行である。ハンブルクを拠点とし、北ヨーロッパ全域の貿易に資金を供給する民間の家族経営銀行として繁栄し、商人への信用供与と投資の慎重な管理を通じて、私有のまま成長を遂げた。"
 flavor_ham.1.a: "有能な商人は全員歓迎する。"
 flavor_ham.1.b: "彼らが何を成し遂げられるか見届けるとしよう！"
 flavor_ham.2.title: "$flavor_ham.1.title$"
 flavor_ham.2.desc: "我々は[berenberg_bank_hq.GetName]の偉大なる[berenberg_bank_hq.GetRank.GetName]に銀行を設立した。北ヨーロッパ全域、そしてその域外の商人とのつながりを活かし、この地域の商業にとって不可欠な存在となる準備が整っている。"
 flavor_ham.2.a: "取引のたびに、我々の富は増大していく。"
 flavor_ham.3.title: "ハンブルガー銀行"
 flavor_ham.3.entry: "$flavor_ham.3.title$"
 flavor_ham.3.desc: "[hamburger_bank_hq.GetName]を通過する交易の量が絶えず増加していることから、通貨の価値を保証し、大規模な商業取引を円滑に進めることが可能な、安定していて信頼性の高い公設為替銀行の必要性が明らかになった。同様の機関の成功例にならい、[hamburger_bank_hq.GetNameWithNoTooltip]の公立銀行は、わが国の財政的繁栄のための確固たる基盤を提供するだろう。"
 flavor_ham.3.historical_info: "ハンブルガー銀行は、1619年に自由都市ハンブルクに設立され、その10年前に設立されたアムステルダム銀行を手本としていた。同銀行は公設の為替銀行として機能し、預金を受け入れ、信頼性の高い銀行通貨を用いて国際決済を処理した。1875年にドイツの中央発券銀行であるライヒスバンクに吸収されるまで、2世紀以上にわたり北ヨーロッパ屈指の金融機関であった。"
 flavor_ham.3.a: "この銀行は我々の役に立ってくれるだろう。"
 flavor_ham.3.b: "金の海で泳ごうではないか！"
 flavor_ham.4.title: "$flavor_ham.3.title$"
 flavor_ham.4.desc: "我々は、後援者やその取引相手の財務管理を任された。北の海の繁栄を管理するのは我々であり、この好機を無駄にすることはない。"
 flavor_ham.4.a: "$flavor_ham.3.b$"
