l_japanese:
 flavor_cro.1000.title: "[ShowAreaNameWithNoTooltip('croatia_area')]と[ShowAreaNameWithNoTooltip('slavonia_area')]の統合"
 flavor_cro.1000.entry: "クロアチアとスラヴォニアの統合 - クロアチア"
 flavor_cro.1000.desc: "[GetCountry('TUR').GetName]のとどまることのない勢力拡大は、わが[ROOT.GetCountry.GetFlavorRank]にとって重大な脅威となっている。また、[GetCountry('HUN').GetAdjectiveWithNoTooltip]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の統治下にある諸地域が分裂状態にあることは、敵につけ込まれかねない弱点となる。こうした状況から、わが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[GetCountry('HUN').GetNameWithNoTooltip]に対し[ShowAreaName('croatia_area')]と[ShowAreaName('slavonia_area')]をひとつの統治のもとへまとめるよう提案すべきだとの意見が出ている。そうすれば、防衛力を大きく高め、統治の負担も軽くできるという。"
 flavor_cro.1000.a: "その提案を進めよ。"
 flavor_cro.1001.a.tt: "$SVN$の[core|e]である、または[ShowAreaName('slavonia_area')]内にあるすべての所有[location|e]が[GetCountry('CRO').GetName]に移譲される"
 flavor_cro.1000.b: "我々にとって重い負担となる。"
 flavor_cro.1000.historical_info: "歴史的には、スラヴォニアはクロアチアとは行政上分けられており、ハンガリー王権に従う独自のバンによって統治されていた。だが、オスマン帝国の進出はこの地域の政治状況を一変させ、戦乱による荒廃は人々を北方へと追いやった。1476年、マーチャーシュ1世は、クロアチア・ダルマチアのバンとスラヴォニアのバンの職を統合し、オスマン帝国の侵攻に対する防衛の連携をより効果的に図ろうとした。この統合は、1558年にクロアチアとスラヴォニアの議会が政治的に統合されたことで、実質的に完了した。"
 flavor_cro.1001.title: "$flavor_cro.1000.title$"
 flavor_cro.1001.desc: "わが国の従属下にある[GetCountry('CRO').GetName]からの使者が[ROOT.GetCountry.GetGovernment.GetCourtTitle]に到着し、[ShowAreaName('croatia_area')]と[ShowAreaName('slavonia_area')]のバンの職を統合すべきだと進言した。[GetCountry('TUR').GetAdjective]の脅威に直面するなか、指揮系統を一本化することで防備を固め、統治の負担も軽くできると主張している。"
 flavor_cro.1001.a: "国境地帯を一つにまとめれば、防備はいっそう強固になる。"
 flavor_cro.1001.b: "[ShowAreaNameWithNoTooltip('slavonia_area')]は、[GetCountry('HUN').GetAdjectiveWithNoTooltip]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]のものだ。"
 flavor_cro.1001.b.entry: "[ShowAreaNameWithNoTooltip('slavonia_area')]は、$HUN_ADJ$の$crown_estate$のものだ。"
 flavor_cro.1100.title: "[target_character.GetNameWithNoTooltip]の勢力"
 flavor_cro.1100.entry: "イヴァン・ネリピッチの勢力"
 flavor_cro.1100.desc: "[target_character.GetName]という有力者が、[ROOT.GetCountry.GetName]の政務にますます大きな影響力を持つようになっている。その本拠地で[target_character.GetNameWithNoTooltip]は多くの敵対者を排除し、地域政務に対する[GetCountry('HUN').GetAdjective]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の支配も弱めていた。これを有益なものとして受け入れる者も多いが、[GetCountry('HUN').GetNameWithNoTooltip]がいつ再びその権威を取り戻そうとするかわからないと恐れる者もいる。この状況を収めるため、[target_character.GetNameWithNoTooltip]が[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の権威を認めるのなら、その見返りとして[GetCountry('HUN').GetNameWithNoTooltip]もまた、[ROOT.GetCountry.GetNameWithNoTooltip]における彼の統治を認めるべきだという意見が出ている。"
 flavor_cro.1100.a: "[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]には干渉するな。"
 flavor_cro.1100.a.entry: "$crown_estate$には干渉するな。"
 flavor_cro.1100.b: "提案を送ろう。"
 flavor_cro.1100.historical_info: "イワン・ネリピチはクロアチアの貴族であり、先のバンであったムラデン2世シュビッチを追い落としたのち、1322年にクロアチアの大半を実質的に掌握した。彼の統治下ではクロアチアのバン職は空位のままとなり、クロアチアはほぼ完全にハンガリーの支配から離れた。ハンガリーの王やスラヴォニアのバンは、ネリピチを追い落とそうと何度も試みたが、結局はいずれも失敗に終わった。ハンガリーがクロアチアに対する王権を再び確立できたのは、イワン・ネリピチの死後、1345年のことであった。"
 flavor_cro.1101.title: "妥協を求める[GetCountry('CRO').GetNameWithNoTooltip]"
 flavor_cro.1101.desc: "1322年のブリスカの戦いで[ShowCultureNameWithNoTooltip('dalmatian')|U]の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が勝利して以来、[GetCountry('CRO').GetName]では有力者の[target_character.GetName]が実権を握り、この地における[GetCountry('HUN').GetAdjective]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の権威を着実に切り崩してきた。ところが意外なことに、[target_character.GetLastNameWithNoTooltip]は使者をわが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]へ送り、妥協案を提示してきた。[target_character.GetLastNameWithNoTooltip]は、[GetCountry('HUN').GetAdjective]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の権威を正式に認め、王座への忠誠を誓う用意があるという。そしてその見返りとして、[target_character.GetHerHim]を[GetCountry('CRO').GetNameWithNoTooltip]の正統な統治者として認めるよう求めている。"
 flavor_cro.1101.a: "両地域の統合は維持する。"
 flavor_cro.1101.b: "[target_character.GetHerHim]を正統な統治者として認めよう。"
 flavor_cro.1101.b.entry: "彼を正統な統治者として認めよ。"
 flavor_cro.1102.title: "[GetCountry('HUN').GetNameWithNoTooltip]、わが国の要求を退ける"
 flavor_cro.1102.desc: "使者が気がかりな報せを持ち帰った。[GetCountry('HUN').GetAdjective]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]は、[target_character.GetName]を[GetCountry('CRO').GetName]の統治者として認めるよう求めた我らの提案を退け、わが[ROOT.GetCountry.GetFlavorRank]は連合に欠かせない一部であると主張した。廷臣たちの多くは、この件についてはもはや打てる手がないと見ているが、なかには過激な策を唱える者もいる。わが国の王座を[GetCountry('HUN').GetNameWithNoTooltip]に結びつけているパクタ・コンヴェンタを破棄し、[target_character.GetLastNameWithNoTooltip]を二世紀以上ぶりの[GetCountry('CRO').GetNameWithNoTooltip]出身の王として戴冠させるべきだというのだ。"
 flavor_cro.1102.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_cro.1102.a.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_cro.1102.b: "パクタ・コンヴェンタを破棄し、[target_character.GetLastNameWithNoTooltip]を戴冠させよ！"
 flavor_cro.1102.b.entry: "パクタ・コンヴェンタを破棄し、彼を戴冠させよ！"
 flavor_cro.1103.title: "[GetCountry('CRO').GetNameWithNoTooltip]がパクタ・コンヴェンタを破棄"
 flavor_cro.1103.desc: "[target_character.GetName]の権威は認めないという我々の回答を受け、[GetCountry('CRO').GetName]は予想をはるかに超える強硬策に出た。彼らは、自らを我らが[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]に結びつけてきたパクタ・コンヴェンタは無効であるとし、[target_character.GetLastNameWithNoTooltip]を新たな[GetCountry('CRO').GetGovernment.GetRulerTitle]とした。"
 flavor_cro.1103.a: "反乱を許すわけにはいかない！"
 flavor_cro.1103.b: "干渉するつもりはない。"
