l_japanese:
 flavor_tre.1.title: "[target_location.GetNameWithNoTooltip]の城塞"
 flavor_tre.1.entry: "The Citadel of Trebizond"
 flavor_tre.1.desc: "何世紀にもわたり誇らしくそびえ立つ[target_location.GetName]の[target_location.GetRank.GetName]は、[ShowRegionName('anatolia_region')]の中心地における王権の象徴だ。我らが文化の標としての役割を果たすこの偉大な首都は、その壮大な港湾と地理的な立地の恩恵を受けて大きく繁栄してきた。\n\n商人街、市場、水道橋といった都市施設が数多く整備されており、我らの権威の象徴であり、誇りであり、至宝となっている。最近の人口の増加に伴って、頑丈な防壁の内側に多くの家屋を収容するため、[target_location.GetRank.GetNameWithNoTooltip]を拡大することが求められている。"
 flavor_tre.1.historical_info: "紀元前756年に築かれたトレビゾンドは、キリスト教とギリシャ文化の城塞として長い歴史を有している。ローマ時代には、この都市はポントゥス・ポレモニアクスにおける重要な軍団拠点として機能した。後世のユスティニアヌスの治世下では、いくつものアルメニア遠征軍がトレビゾンドを合流・出発点として用いた。\n\nこの都市は8世紀には大司教区に、10世紀初期には府主教区となった。1204年にアレクシオス1世コムネノスとダヴィド・コムネノスによりトレビゾンド帝国が創設された。この帝国はポントス山脈に守られた要塞都市として、そして戦略的な婚姻同盟によって1461年まで存続した。1438年にはその人口はわずか4､000人ほどだったが、守りは強固であり、アヤソフィア修道院やパナギア・フリソケファロス大聖堂のような重要な施設が存在していた。トレビゾンドはビザンツ帝国最後の前哨拠点として、オスマン帝国に陥落させられる1461年までその文化的、歴史的重要性を保ちつづけた。"
 flavor_tre.1.a: "拡張に出資しよう！"
 flavor_tre.1.b: "壁の外で飢えさせておけばいい……"
 flavor_tre.2.title: "スコラリオイの不服従"
 flavor_tre.2.entry: "$flavor_tre.2.title$"
 flavor_tre.2.desc: "中央権力の衰退と、尽きることのない欲望に突き動かされた多くの地方貴族の民兵が、[target_location.GetName]の政治の大部分を掌握するに至っている。多くの[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]はこれまでも新たな官職や特権、価値ある領地を喜んで受け取ってきたが、これはもはや一線を超えている…… もし我々が断固たる措置を講じなければ、この腐敗は国全体を内戦へと引きずり込むかもしれない！"
 flavor_tre.2.a: "この狂犬たちを鎖でつなげ！"
 flavor_tre.2.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_tre.2.b.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_tre.2.historical_info: "スコラリオイはトレビゾンドの有力な#italic άρχοντες#!（貴族）一族のひとつ。当初は都市の防衛を担う王家の民兵部隊として創設されたが、やがて腐敗し、1340年には女帝エイレーネーの権威に公然と異議と唱えた。その大胆さと支配への欲求は、エイレーネーの即位そのものの拒絶にまでつながり、国全体を内戦へと突入させるきっかけとなった。同時期にトレビゾンドが南部の国境でトルクメン人の襲撃を受けた結果、襲撃者たちは都市を制圧し、火を放ち、腐敗した人や馬の遺体から放たれる悪臭と疫病がこの地を襲うこととなった。"
 flavor_tre.3.title: "[target_character1.GetNameWithNoTooltip]の毒殺"
 flavor_tre.3.entry: "Poisoning of Basil Megas Komnenos"
 flavor_tre.3.desc: "憎悪と嫉妬に駆られたすえに、[target_character2.GetName]は[target_character1.GetShortName]に毒を盛り、その運命に終止符を打った。これは[target_character1.GetShortNameWithNoTooltip]が[target_character2.GetHerHim]に示した冷淡な態度と、多くの愛人の存在が事態を悪化させ結果である……"
 flavor_tre.3.a: "愛と戦争に禁じ手なし。"
 flavor_tre.3.b: "こんなことは許されん！"
 flavor_tre.3.historical_info: "エイレーネーとバシレイオスの結婚は、ただコムネノス王朝がビザンツ帝国と同盟を結ぶための政略にすぎないものだった。エイレーネーは皇帝アンドロニコス3世パライオロゴスの庶子だったためだ。ふたりのあいだに愛情はなく、エイレーネーは子供をもうけることもなく、バシレイオスは宮廷の愛人の胸に安らぎを求めた。王家の夫婦に生じた憎しみは、やがてバシレイオスの暗殺という結末を迎え、エイレーネーの治世とトレビゾンドの激動の時代が始まることとなる。"
 flavor_tre.4.title: "[target_character_2.GetNameWithNoTooltip]の遺産"
 flavor_tre.4.entry: "The Reign of Alexios II"
 flavor_tre.4.desc: "[target_character_1.GetName]の治世は、我らが[ROOT.GetCountry.GetFlavorRank]にとって素晴らしい時代の継続を意味するものである。[target_character_2.GetName]から王位を継承した新たな[ROOT.GetCountry.GetGovernment.GetRulerTitle]は、王朝の伝統、地方貴族、そして[ShowAreaName('black_sea_area')]沿岸における他国の利害によって形作られた政治情勢のなか、統治をおこなわねばならない。\n\nこの治世がいかに記憶されるかは、これから成し遂げられる功績だけでなく、[target_character_1.GetHerHis]の先人たちの遺産がどれほど確固として守られるか、あるいはどのように再構築されるかにもかかっている。"
 flavor_TRE_4_historical_info: "アレクシオス2世メガス・コムネノスは、トレビゾンド帝国において在位期間が特に長かった皇帝のひとりであり、帝国が領土拡張よりも外交と交易、そして王朝の継続をはるかに重視していた時代の統治者である。彼の死はひとつの転換点だったが、その移ろいのなかでも王家の権威は維持された。一方、宮廷の諸派閥と外国商人のあいだの力関係は、依然として危うい均衡状態にあった。"
 flavor_tre.4.a: "安らかに眠れ、偉大なる[ROOT.GetCountry.GetGovernment.GetRulerTitle]よ……"
 flavor_tre.4.a.entry: "Rest now, great ruler..."
 flavor_tre.5.title: "サクランボの祖国"
 flavor_tre.5.entry: "$flavor_tre.5.title$"
 flavor_tre.5.desc: "[ShowLocationName('giresun')]の[target_location.GetRank.GetName]は、長きにわたり[ShowAreaName('black_sea_area')]南岸に位置する控えめながらも重要な港として機能してきた。ここの港湾は、[ROOT.GetCountry.GetAdjective]の山地の内陸路と海上交易を結びつけており、適切に振興すれば成長の機会をもたらすだろう。\n\n直接的な投資によるにせよ、辛抱強い統治によるにせよ、[target_location.GetNameWithNoTooltip]の将来は地域の繁栄のみならず、[ROOT.GetCountry.GetNameWithNoTooltip]のより広い商業的地位にも影響を及ぼすことだろう。"
 flavor_TRE_5_historical_info: "ケラスス（現代のギレスン）は、ポントス地方に存在した集落であり、沿岸港として戦略的価値を有していた。トレビゾンド帝国にとって、このような町は黒海交易へのアクセスを提供するとともに、山地の経済と国際的な交易網を結ぶ仲介地として機能していた。「ケラスス」の名は、やがて当地の甘い果実、サクランボを指す言葉として用いられるようになったとも言われている。"
 flavor_tre.5.a: "投資をおこなうのが賢明だ。"
 flavor_tre.5.b: "自然と繁栄するのを見守ろうではないか。"
 flavor_tre.6.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')]商人の影響力の拡大"
 flavor_tre.6.entry: "Tax the Venetians and Genoese"
 flavor_tre.6.desc: "[GetCountry('VEN').GetName]や[GetCountry('GEN').GetName]から来た[ShowCultureGroupName('italian_group')]商人は、長きにわたり我らの港で広範な特権を享受してきた。その特権とは、条約と相互の必要性によって確保された免除措置である。彼らの船は富と物資をもたらすが、その自治的な振る舞いに対し、地元の[ShowEstateTypeName('burghers_estate')]や役人からの批判の声が高まりつつある。\n\n新たな税を課せば、わが国の主権を主張すると同時に、国庫を潤すこともできるだろう。だがそれは、[ShowAreaName('black_sea_area')]のはるか外まで影響力を及ぼす強力な海洋共和国との外交的軋轢を招き、すでに結ばれている数十年来の交易協定を侵害することにもなりかねない。"
 flavor_tre.6.a: "新たな税を課す。"
 flavor_tre.6.b: "彼らを敵に回すのはまずい。"
 flavor_tre.7.title: "アスプロン"
 flavor_tre.7.entry: "$flavor_tre.7.title$"
 flavor_tre.7.desc: "[ShowLocationName('gumushane')]周辺の土地から採掘される[ShowGoodsName('silver')]は、単なる物質的な富以上の意味を持つ。事実、それは貨幣への信頼を支えると同時に、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の権威を裏づけてもいる。[target_location.GetRank.GetName]における採掘と鋳造の規模を拡大すれば、[ROOT.GetCountry.GetFlavorRank]は通貨制度を強化し、地域の発展を促すことができるだろう。\n\nしかし、そのような取り組みには確固たる統治と即時の出費が必要となるうえ、採掘を過度に進めれば、土地と人々の双方に悪影響を及ぼしかねない。"
 flavor_tre.7.a: "採掘規模の拡大に注力せよ！"
 flavor_tre.7.b: "強欲に走るのは賢明ではないだろう。"
