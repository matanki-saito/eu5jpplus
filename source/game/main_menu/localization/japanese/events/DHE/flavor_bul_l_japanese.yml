l_japanese:
 flavor_bul.1.title: "[GetCountry('KVN').GetLongNameWithNoTooltip]"
 flavor_bul.1.entry: "ドブロジャ公国"
 flavor_bul.1.desc: "近年、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の中央権力が弱まったことで、わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の影響力が大きく増している。こうした傾向が最もよく表れているのが、[ShowProvinceDefinitionName('north_dobruja_province')]と[ShowProvinceDefinitionName('south_dobruja_province')]である。そこでは[target_character.GetName]が現地の要塞、艦隊、交易を掌握し、ほとんど独立した領主のように統治している。これを正式にわが国の属国として認め、離反を防ぐために自治権を与えるべきだと考える者もいる。一方で、この地に対する失われつつある権威を取り戻すべきだと主張する者もいる。"
 flavor_bul.1.a: "彼らの自治を認めよう。"
 dobrujan_revolt: "ドブロジャの反乱"
 flavor_bul.1.b: "あの地はわが国には欠かせない。"
 flavor_bul.1.b.tt: "$KVN$の中核地をもつ所有ロケーションに居住する全[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下し、反乱に加わる"
 flavor_bul.1.c: "[GetCountry('KVN').GetNameWithNoTooltip]の跡を継ぐ。"
 flavor_bul.1.c.entry: "$KVN$の跡を継ぐ。"
 flavor_bul.1.historical_info: "14世紀、ブルガリアの中央権力が次第に崩れるなかで、カルヴナ専制公国が現れた。おそらく当初は半ば独立した属国として機能していたが、やがて独自に貨幣を鋳造し、タルノヴォとは別に外交をおこない、戦争にも乗り出すようになり、事実上独立するに至った。"
 flavor_bul.2.title: "不穏な継承"
 flavor_bul.2.entry: "$flavor_bul.2.title$"
 flavor_bul.2.desc: "[target_ruler.GetName]は年を重ねるにつれ、自らの死後に[ROOT.GetCountry.GetName]がどうなるかを、ますます案じるようになっている。[ROOT.GetCountry.GetGovernment.GetRulerTitle]は、自らが世を去ったあと、息子たちの争いが[ROOT.GetCountry.GetFlavorRank]を内乱に陥れるのではないかと深く憂えており、これを防ぐため、[ShowLocationName('vidin')]周辺の北西部を[targer_brother.GetName]に委ねる一方、[target_heir.GetName]を[ROOT.GetCountry.GetCapital.GetName]の[ROOT.GetCountry.GetGovernment.GetHeirTitle]として認める案が出された。"
 flavor_bul.2.a: "息子たちには、それぞれ争わずに治めさせよう。"
 flavor_bul.2.b: "玉座はただ一つだ。"
 flavor_bul.2.c: "[ShowLocationNameWithNoTooltip('vidin')]を拠点に統治しよう。"
 flavor_bul.2.historical_info: "イヴァン・アレクサンダーの治世においてブルガリアが分裂した主な原因は、その息子であり、共同皇帝にして後継者でもあったミハイル・アセン4世が、オスマンとの戦いで予期せず戦死したことである。イヴァン・アレクサンダーは、自らの死後に内乱が起こることを恐れたのか、息子イヴァン・スラツィミルにツァールの称号を与え、ヴィディンの統治を委ねることにした。一方、もう一人の息子イヴァン・シシュマンにはタルノヴォの玉座を継がせた。"
 flavor_bul.3.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の第二の黄金時代"
 flavor_bul.3.entry: "$flavor_bul.3.title$"
 flavor_bul.3.desc: "[target_ruler.GetName]は、[ROOT.GetCountry.GetName]が学芸と文化の中心であった、シメオン大帝の栄光の日々を取り戻そうとしている。[target_ruler.GetSheHe|U]はわが国の精神的・芸術的遺産の復興を進め、修道院の再建に資金を投じ、修道共同体にも手厚い支援を与えようとしている。この構想には莫大な費用がかかると危ぶむ者も多いが、[ROOT.GetCountry.GetGovernment.GetRulerTitle]は、長い目で見れば[ROOT.GetCountry.GetFlavorRank]に大きな益をもたらすと考えている。"
 flavor_bul.3.a: "その案を承認しよう。"
 flavor_bul.3.b: "それでは国庫が空になる。"
 flavor_bul.3.historical_info: "イヴァン・アレクサンダーの治世の後半が分裂と衰退の時代であったのに対し、その前半にはブルガリア文化の著しい復興が見られ、ときに「ブルガリアの第二の黄金時代」とさえ呼ばれる。イヴァン・アレクサンダーは修道院の建設と修復を支援し、宗教問題にも関心を寄せ、ブルガリア正教会の強化に努めた。また、ブルガリアでは文学活動も活発化し、その結果、数多くの写本や年代記が作られた。"
 flavor_bul.4.title: "イヴァン・アレクサンダー帝の福音書"
 flavor_bul.4.entry: "$flavor_bul.4.title$"
 flavor_bul.4.desc: "我らの[ROOT.GetCountry.GetGovernment.GetRulerTitle]が[ROOT.GetCountry.GetName]の文化復興を支援するという決断は、すでに実を結んでいる。[ShowLocationName('tarnovo')]で、[bul_ivan.GetName]に捧げられた彩飾福音書が、[ROOT.GetCountry.GetGovernment.GetAdjective]の直命を受けた[target_artist.GetShortName]という修道士によって作られたのだ。これこそ、我らは厳しい状況にあっても[ShowLocationName('constantinople')]に比肩しうる芸術を生み出せるということを示す、明白な証である。"
 flavor_bul.4.a: "素晴らしい！"
 flavor_bul.4.historical_info: "『イヴァン・アレクサンダー帝の福音書』は、第二ブルガリア帝国の時代から残る作品のうち、おそらく最も重要なものであり、いわゆる「第二の黄金時代」を代表する傑作の一つである。この写本には福音書の全文が収められており、精緻な細密画366点が添えられている。"
 flavor_bul.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]・[GetCountry('TUR').GetAdjectiveWithNoTooltip]戦争"
 flavor_bul.5.entry: "ブルガリア・オスマン戦争"
 flavor_bul.5.desc_common: "わが軍は[target_location.GetName]において、史上初めて[GetCountry('TUR').GetAdjective]軍と激突した。"
 flavor_bul.5.desc_victory: "$flavor_bul.5.desc_common$この戦いは我らの勝利に終わったものの、これで争いが終わると見る指揮官はほとんどいない。相手は、各地での軍事的勝利によって勢いづいた、手強い敵である。今日の戦いは、これから続く多くの戦いの端緒にすぎないのかもしれない。"
 flavor_bul.5.desc_defeat: "$flavor_bul.5.desc_common$この戦いの痛ましい結末は、敵が規律と強い意志を備えた相手であることを示した。我らが[ROOT.GetCountry.GetFlavorRank]を守るには、なおも野心を広げるこの敵との、長く苦しい戦いに備えねばならない。"
 flavor_bul.5.a: "来たる嵐に備えよ。"
 flavor_bul.5.b: "主導権は、我らが握らねばならない。"
 flavor_bul.5.historical_info: "ブルガリア・オスマン戦争は、ブルガリア史の転換点となった。14世紀にオスマンがバルカンへ勢力を広げるなか、すでに内部分裂と弱体化が進んでいたブルガリアは、台頭する大国の脅威を真っ先に受けることになった。1396年のヴィディン陥落によって、ブルガリア独立の最後の名残も失われ、以後およそ五世紀続いたブルガリアの地に対するオスマンの支配が始まったのである。"
 flavor_bul.6.title: "[ROOT.GetCountry.GetGovernment.GetAdjective|U]の離婚"
 flavor_bul.6.entry: "$flavor_bul.6.title$"
 flavor_bul.6.desc: "[target_ruler.GetName]が妻[target_oldwife.GetName]と離婚し、代わって身分の低い家の出である[ShowCultureGroupName('jewish_group')]の改宗者[target_newwife.GetShortName]を娶ると表明したことで、[ROOT.GetCountry.GetGovernment.GetCourtTitle]は揺れている。この決断は[ROOT.GetCountry.GetFlavorRank]をいっそう不安定にするだけでなく、やがて[ROOT.GetCountry.GetFlavorRank]の諸公のあいだに不和をもたらし、継承の問題をさらに複雑にしかねないと危ぶむ者も多い。それでも、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の意志に異を唱える者はほとんどいない。"
 flavor_bul.6.a: "婚姻を進めよ。"
 flavor_bul.6.b: "何より優先すべきは、[ROOT.GetCountry.GetFlavorRank]の利益だ。"
 flavor_bul.6.b.entry: "何より優先すべきは、わが国の利益だ。"
 flavor_bul.6.historical_info: "イヴァン・アレクサンダーと新たな妃サラ＝テオドラのあいだには六人の子が生まれ、そのなかには父のあとを継いでタルノヴォの統治者となったイヴァン・シシュマンもいた。サラ＝テオドラは、息子に帝国の中心たる王位を継がせるよう強く働きかけたと考えられており、その結果、イヴァンの前妻ワラキアのテオドラが産んだ息子のうち、ただ一人生き残っていた長子のイヴァン・スラツィミルは事実上、継承権を失った。この婚姻は、ブルガリアがタルノヴォとヴィディンに分かれる大きな要因となった。"
 flavor_bul.7.title: "名ばかりの帝国"
 flavor_bul.7.entry: "$flavor_bul.7.title$"
 flavor_bul.7.desc: "我らの統治者は誇りをもって「皇帝」を名乗っている。しかし他国から見れば、我らは皇帝などではなく、借り物の威光をまとった一介の王にすぎない。この称号は[GetCountry('BYZ').GetName]の皇帝と[GetUniqueInternationalOrganization('hre').GetName]の皇帝だけに許されるものなのだ、と彼らは主張している。内と外での認識の隔たりは王座を揺るがしかねず、我々は正統性を確立するため最善を尽くさねばならない。"
 flavor_bul.7.a: "我らを認めさせてみせる！"
 flavor_bul.7.a.tt: "我々は帝国として始まるものの、政府ランクによる恩恵は王国相当まで抑えられている。\n[ROOT.GetCountry.GetName]から[modifier|e]「[ShowModifier('bul_unrecognized_imperial_title')]」を取り除き、正統な帝国として認められるには、いくつかの方法がある：\n- [ShowLocationName('constantinople')]を所有している、あるいは[great_power|e]となった状態で[disaster|e]「[ShowDisasterName('twilight_of_the_tsardom')]」を解決する\n- [disaster|e]「[ShowDisasterName('twilight_of_the_tsardom')]」の解決後に[ShowLocationName('constantinople')]を征服する\n- [disaster|e]「[ShowDisasterName('twilight_of_the_tsardom')]」の解決後に列強[great_power|e]となる"
 flavor_bul.7.historical_info: "1204年、ブルガリアの統治者カロヤンは、教皇インノケンティウス3世が派遣した使節によって戴冠されたが、その場で与えられた称号は皇帝ではなく、王であったため、緊張が走った。教会の教義では、皇帝の称号は神聖ローマ帝国の君主だけに許されるとされていたからである。カロヤンはこの制限を退け、自らは皇帝として戴冠されたのだと主張した。こうしてブルガリア国内では皇帝号が認められたものの、その正統性は国外では疑問視されていた。"
 flavor_bul.8.title: "崩れゆく帝国"
 flavor_bul.8.entry: "$flavor_bul.8.title$"
 flavor_bul.8.desc: "$twilight_of_the_tsardom.1.title$が終息し、[ROOT.GetCountry.GetName]は長年の内紛から立ち直った。しかし[GetCountry('BYZ').GetName]はそうではなく、いまや分裂し脆弱な状態にある。いま起こっている事態は、帝国が傷を癒やし立ち直る前に一撃を加え、我らの優位を確かなものとする絶好の機会となっている。"
 flavor_bul.8.a: "いまこそ攻め入る時だ！"
 flavor_bul.8.b: "我々はまだ準備が整っていない。"
 flavor_bul.9.title: "列強としての地位"
 flavor_bul.9.entry: "$flavor_bul.9.title$"
 flavor_bul.9.desc: "[ROOT.GetCountry.GetAdjective]$rank_empire_bulgarian$は、ついに世界の列強の一角として認められるまでになった。その姿は、かつての第一次[ROOT.GetCountry.GetAdjectiveWithNoTooltip]帝国の栄光を思わせるどころか、それすらも凌ぐものかもしれない。もはや我々は自らの主張を弁明したり、正統性を疑う声に抗う必要はない。我らの力そのものが証となり、世界はついにそれを認めたのだ。"
 flavor_bul.9.a: "$rank_empire_bulgarian$に栄光あれ！"
 flavor_bul.1000.title: "[ShowLocationNameWithNoTooltip('constantinople')]の陥落"
 flavor_bul.1000.entry: "$flavor_bul.1000.title$"
 flavor_bul.1000.desc: "ついに、[ShowLocationName('constantinople')]の城壁が[ROOT.GetCountry.GetName]の力の前に陥落した。かつて強大であったこの都は、いまや新たな時代を迎えようとしている。それは、[ShowReligionAdjective('orthodox')]世界に衰退と屈辱、そして無力しかもたらさなかったそれまでの数世紀とはまったく異なる時代である。不死鳥は灰燼に帰し、この日より[target_ruler.GetName]は$STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople$として記憶されるだろう。もはや我らの帝位の正統性が疑われることは決してない！"
 flavor_bul.1000.a: "新たな帝国の誕生を告げよ！"
 flavor_bul.1000.a.tt: "わが国と[alliance|e]を結んでおらず、またわが国の[subject|e]でもないすべての近隣諸国、および[rivals|e]のわが国に対する[opinion|e]が[ShowBiasValue('opinion_bul_proclaimed_an_empire')|+=]上昇する。"
 flavor_bul.1000.b: "我らの勝利に、たいそうな称号は不要だ。"
 flavor_bul.1001.title: "皇帝たちの都"
 flavor_bul.1001.desc: "[ROOT.GetCountry.GetName]は帝国の地位に就き、世界における位置づけを大きく変えた。新たな名声を得たことに伴い、[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[ROOT.GetCountry.GetCapital.GetName]が[ROOT.GetCountry.GetLongNameWithNoTooltip]の栄光と権威にふさわしい都であるかどうか疑問視する声が上がりはじめており、数世紀にわたり[ShowReligionAdjective('orthodox')]世界の政治と信仰の中心であった[ShowLocationName('constantinople')]へ都を移すべきだと唱える者が出てきている。"
 flavor_bul.1001.a: "帝国にふさわしい都が必要だ！"
 flavor_bul.1001.b: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]を捨てるつもりはない。"
 flavor_bul.1001.b.entry: "首都を捨てるつもりはない。"
 flavor_bul.1001.historical_info: "歴史上、コンスタンティノープルを狙った勢力は数多く、ブルガリアも例外ではなかった。幾世紀にもわたり、幾人ものブルガリア君主がこの大都市を支配下に収めようとしたが、成功した者はいなかった。なかでも最も注目すべき試みは、シメオン大帝の治世におこなわれたものである。都市そのものはついに陥ちなかったものの、この戦争はビザンツに深い屈辱を与える結果となった。帝国はシメオンの皇帝号を認めざるを得ず、彼をツァーリとして承認した。これにより、ブルガリアは事実上、バルカンにおける大国となった。"
