l_japanese:
 flavor_ach.1.title: "[target_country.GetAdjectiveWithNoTooltip]の[target_country.GetGovernment.GetRulerTitle]の逃亡"
 flavor_ach.1.entry: "エピロス後継者の逃亡"
 flavor_ach.1.desc: "[target_country2.GetAdjective]による[target_country.GetName]侵攻ののち、[target_character.GetFather.GetName]の正統な後継者である[target_character.GetShortName]は、[GetCharacter('byz_andronikos_iii_palaiologos').GetName]によって地位を追われ、後任には現[target_country2.GetAdjectiveWithNoTooltip]総督[GetCharacter('epi_theodoros_synadenos').GetName]が据えられた。幸いにも、[target_character.GetShortNameWithNoTooltip]は反[target_country2.GetAdjectiveWithNoTooltip]派の手によって密かに国外へ逃がされ、[target_character2.GetName]のもとへ送られた。"
 flavor_ach.1.a: "[target_country.GetAdjectiveWithNoTooltip]の地は、[target_character.GetNameWithNoTooltip]のものだ！"
 flavor_ach.1.a.entry: "領土は彼のものだ！"
 flavor_ach.1.b: "[target_country.GetNameWithNoTooltip]に未来はない。"
 flavor_ach.1.b.entry: "彼らに未来はない。"
 flavor_ach.2.title: "[target_country.GetAdjectiveWithNoTooltip]の王位請求者を支援"
 flavor_ach.2.desc: "[target_country.GetName]最後のラテン人君主である若き[target_character.GetName]は密かに国外へ逃がされ、[target_country3.GetName]へ送られた。そこで[target_country3.GetGovernment.GetRulerTitle]は[target_character.GetHerHis]の側に引き入れられたようである。もはや疑う余地はない。[target_country3.GetLongName]は、地位を追われた後継者の復位を図るだろう。\n\nいかなる侵攻にも備えねばならない。[target_character2.GetName]が、我らの隙を突いて攻め込んでくるおそれがある。"
 flavor_ach.2.a: "目に物を見せてくれる！"
 flavor_ach.3.title: "ラテン勢力の衰え"
 flavor_ach.3.desc: "表向きはラテン系の[target_character.GetDynasty.GetName]家の支配下にあるが、この王朝の影響力は長年にわたって衰えつづけている。[ROOT.GetCountry.GetCulture.GetName]の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は[ShowCultureName('greek_culture')]の平民の苦境を顧みず、その声にも耳を貸さないものと見られることが多い。そのため、さまざまな階層の民衆は、[ROOT.GetCountry.GetName]をフランク人の支配から解放してくれるギリシア人の王位請求者[target_character2.GetName]を支持するようになっている。"
 flavor_ach.3.a: "[target_character.GetDynasty.GetNameWithNoTooltip]を叩き潰せ！"
 flavor_ach.3.a.entry: "王朝を叩き潰せ！"
 flavor_ach.3.b: "この動きを鎮圧せよ！"
 flavor_ach.4.title: "[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]におけるラテンの女帝の影響力"
 flavor_ach.4.entry: "$flavor_ach.4.title$"
 flavor_ach.4.desc: "1261年に[ShowFormableCountryName('LAT_f')]は滅んだが、現女帝[target_character.GetName]に至るまで皇帝の称号は受け継がれており、その遺産は絶えてはいない。その位は名ばかりとはいえ、[target_character.GetDynasty.GetName]家はラテン諸国でいまもなお大きな敬意を集め、帝国の残存勢力のなかでも特に力のある[ROOT.GetCountry.GetLongName]を治めている。"
 flavor_ach.4.a: "[ShowFormableCountryNameWithNoTooltip('LAT_f')]は蘇る！"
 flavor_ach.5.title: "名目上の[GetCountry('LAT').GetFlavorRank]"
 flavor_ach.5.entry: "名目上の帝国"
 flavor_ach.5.desc: "[GetCountry('LAT').GetLongName]の[GetCountry('LAT').GetAdjectiveWithNoTooltip][GetCountry('LAT').GetGovernment.GetRulerTitle]という称号を名目上とはいえ保ってきたことで、[scope_ruler.GetName]は[ShowScriptedGeographyName('greece_geography')]に残る[GetCountry('LAT').GetAdjectiveWithNoTooltip]人有力者たちのあいだでなお大きな影響力をもち、[naples_country.GetName]にも人脈を維持している。[scope_philip_latin_emperor.GetName]は帝国奪還に足る軍勢を集めるべく、さまざまな策謀と駆け引きを重ねていたが、その計画は彼の死後、放棄された。\n\n[scope_alb_king.GetName]との合意により、[albania_country.GetName]に対する権利は[scope_alb_king.GetShortNameWithNoTooltip]へ売り渡され、[ROOT.GetCountry.GetName]の地は[ach_heir.GetName]に授けられた。ただし、その地はいまも[scope_ruler.GetShortNameWithNoTooltip]が正式な立場で統治にあたっている。\n\n[ath_country.GetName]には[ShowCultureName('catalan')]大軍団が駐留しており、さらに[byz_country.GetName]の[byz_country.GetGovernment.GetCourtTitle]内部では不穏な噂が流れている。[scope_ruler.GetNameWithNoTooltip]に近い顧問たちは、[scope_philip_latin_emperor.GetShortNameWithNoTooltip]が思い描いたように、[GetCountry('LAT').GetLongNameWithNoTooltip]を復興する好機が、やがて訪れるかもしれないと進言している。"
 flavor_ach.5.a: "現地有力者の支持固めに注力すべきだ。"
 flavor_ach.5.b: "[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]全域で外交的支持を取りつけよう。"
 flavor_ach.5.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]は復興への布石を打つべきだ。"
 flavor_ach.5.c.entry: "宮廷は復興への布石を打つべきだ。"
 flavor_ach.6.title: "[naples_country.GetNameWithNoTooltip]の[naples_country.GetGovernment.GetCourtTitle]との結びつき"
 flavor_ach.6.entry: "ナポリ宮廷との結びつき"
 flavor_ach.6.desc: "[scope_ruler.GetName]は[ROOT.GetCountry.GetName]の統治を担うことになったが、[naples_country.GetNameWithNoTooltip]の[naples_country.GetGovernment.GetCourtTitle]内ではなお大きな影響力を保ち、[nap_ruler.GetName]とも親密な関係にある。[ShowScriptedGeographyName('greece_geography')]における[scope_ruler.GetDynasty.GetName]家の支配をさらに強めるため、一部の顧問たちは、[scope_ruler.GetShortNameWithNoTooltip]がその影響力を用いて、裕福な[naples_country.GetAdjectiveWithNoTooltip]人有力者たちから支持を取りつけるべきだと進言している。"
 flavor_ach.6.a: "[scope_ruler.GetShortNameWithNoTooltip]は[naples_country.GetAdjectiveWithNoTooltip][naples_country.GetGovernment.GetCourtTitle]に取り入るべきだ。"
 flavor_ach.6.a.entry: "統治者は$NAP_ADJ$宮廷に取り入るべきだ。"
 flavor_ach.6.b: "[scope_ruler.GetShortNameWithNoTooltip]の影響力を用いて、資金援助を取りつけよう。"
 flavor_ach.6.b.entry: "彼の影響力を用いて、資金援助を取りつけよう。"
 flavor_ach.6.c: "[scope_ruler.GetShortNameWithNoTooltip]の名声は、[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]の権威を高めるために用いるべきだ。"
 flavor_ach.6.c.entry: "彼の名声は、わが国の宮廷の権威を高めるために用いるべきだ。"
 flavor_ach.7.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip]と[epirus_country.GetLongNameWithNoTooltip]"
 flavor_ach.7.entry: "エピロスの分離独立"
 flavor_ach.7.desc: "[nikephoros_ii_orsini.GetName]は亡命以来、しばらく[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に留まっており、[byz_country.GetAdjective]人有力者たちに対抗するうえで、[scope_ruler.GetName]にとって有用な政治的切り札となってきた。だがいま、[nikephoros_ii_orsini.GetLastNameWithNoTooltip]の支配を回復する機が訪れつつあるとの知らせが[ROOT.GetCountry.GetGovernment.GetCourtTitle]にもたらされた。複数の[epirus_country.GetAdjective][epirus_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]が、[byz_country.GetAdjectiveWithNoTooltip]人総督に対して蜂起に踏み切るだけの支持を集めたという。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]内では、これを[byz_country.GetNameWithNoTooltip]内部にさらなる分裂を生む好機と見て、[scope_ruler.GetNameWithNoTooltip]に対し、この機を逃さず[nikephoros_ii_orsini.GetLastNameWithNoTooltip]の[epirus_country.GetNameWithNoTooltip]帰還を認めるよう促す声が多い。"
 flavor_ach.7.a: "わが国の支援のもと、[nikephoros_ii_orsini.GetLastNameWithNoTooltip]を[epirus_country.GetNameWithNoTooltip]へ帰還させよう。"
 flavor_ach.7.a.entry: "わが国の支援のもと、$Orsini$を$EPI$へ帰還させよう。"
 flavor_ach.7.b: "代わりに、[nikephoros_ii_orsini.GetShortNameWithNoTooltip]の[epirus_country.GetNameWithNoTooltip]に対する請求権を後押しすると申し出よう。"
 flavor_ach.7.b.entry: "代わりに、$name_nikephoros.greek_language$の$EPI$に対する請求権を後押しすると申し出よう。"
 flavor_ach.7.c: "いまは危険すぎる。"
 nikephoros_ii_orsini_revolt: "オルシーニの反乱"
 flavor_ach.8.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip]、[epirus_country.GetNameWithNoTooltip]を奪還！"
 flavor_ach.8.entry: "$name_nikephoros.greek_language$・$Orsini$が$EPI$を奪還！"
 flavor_ach.8.desc: "[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]に知らせが届いた。[nikephoros_ii_orsini.GetLastNameWithNoTooltip]の支持者たちは、[epirus_country.GetName]で彼の支配を回復し、この機に乗じて[epirus_country.GetNameWithNoTooltip]を[byz_country.GetName]から切り離すことに成功したという。これは、[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]の弱体化を目指す[scope_ruler.GetName]にとって、まぎれもない勝利である。だが、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内には、[nikephoros_ii_orsini.GetShortNameWithNoTooltip]が権力基盤を固める前に、[scope_ruler.GetShortNameWithNoTooltip]が[epirus_country.GetNameWithNoTooltip]を掌握すべきだと求める声もある。"
 flavor_ach.8.a: "代わりに、[epirus_country.GetNameWithNoTooltip]と正式な同盟を結ぼう。"
 flavor_ach.8.a.entry: "代わりに、$EPI$と正式な同盟を結ぼう。"
 flavor_ach.8.b: "親密な関係を築くのは、[nikephoros_ii_orsini.GetLastNameWithNoTooltip]だけにしよう。"
 flavor_ach.8.b.entry: "親密な関係を築くのは、$Orsini$だけにしよう。"
 flavor_ach.8.c: "攻め込むならいまだ！"
 flavor_ach.9.title: "[epirus_country.GetNameWithNoTooltip]で反乱勃発"
 flavor_ach.9.desc: "凶報！ [ach_scope_ruler.GetName]の後ろ盾を得た[epirus_country.GetAdjective][epirus_country.GetGovernment.GetEstateName('nobles_estate')]が、[nikephoros_ii_orsini.GetName]のために[epirus_country.GetName]を奪取しようと反乱を起こした。[epi_scope_ruler.GetName]は[ROOT.GetCountry.GetName]に対し、ただちに介入してこれを鎮圧するよう求めている。"
 flavor_ach.9.a: "[epirus_country.GetAdjectiveWithNoTooltip]の総督を支援せよ！"
 flavor_ach.9.a.entry: "$EPI_ADJ$の総督を支援せよ！"
 flavor_ach.9.b: "わが国の関知するところではない。"
 flavor_ach_9_tt: "[nikephoros_ii_orsini.GetName]が勝利した場合、[epirus_country.GetName]は独立する"
 flavor_ach.10.title: "ペロポネソス半島の再征服"
 flavor_ach.10.entry: "$flavor_ach.10.title$"
 flavor_ach.10.desc: "1204年の第4次十字軍が成功を収め、[byz_country.GetName]が崩壊したのち、[ShowAreaName('morea_area')]は十字軍勢力の征服地のひとつとなった。しかしここ数十年で、[byz_country.GetAdjectiveWithNoTooltip]人有力者たちはこの地域の一部を奪回している。とはいえ、その大半はいまなお[ROOT.GetCountry.GetAdjective]の支配下にある。\n\n[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]に不穏な噂が広がるなか、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の顧問は、失われた領土を取り戻し、[ShowAreaNameWithNoTooltip('morea_area')]から[byz_country.GetAdjectiveWithNoTooltip]の影響力を完全に排除する遠征を起こすなら、いまこそ好機だと考えている"
 flavor_ach.10.a: "いまこそ[byz_country.GetLongNameWithNoTooltip]を退ける時だ！"
 flavor_ach.10.a.entry: "いまこそ$BYZ$を退ける時だ！"
 flavor_ach.10.b: "[byz_country.GetAdjectiveWithNoTooltip]の情勢不安の噂が確かなものとなるか、しばらく見極めよう。"
 flavor_ach.10.b.entry: "$BYZ_ADJ$の情勢不安の噂が確かなものとなるか、しばらく見極めよう。"
 flavor_ach.11.title: "[byz_country.GetNameWithNoTooltip]内に広がる情勢不安"
 flavor_ach.11.entry: "ビザンツ内戦に乗じて"
 flavor_ach.11.desc: "[byz_country.GetName]の[byz_country.GetGovernment.GetCourtTitle]に潜む[ROOT.GetCountry.GetAdjective]の諜報員たちは、以前から政情不安の噂を持ち帰っていた。最近の報告では、[byz_country.GetAdjectiveWithNoTooltip]の[byz_country.GetGovernment.GetEstateName('nobles_estate')]が支配王朝である[byz_ruler.GetDynasty.GetName]家に怒りを募らせ、いまや政変を企てていると見られている。\n\nこれを[byz_country.GetNameWithNoTooltip]で起こりうる内戦の前触れと見た者たちは、この情勢に乗じるための備えを進めるべきだと、[scope_ruler.GetName]に進言している。"
 flavor_ach.11.a: "いこそ不死鳥を討ち砕く時だ！"
 flavor_ach.11.b: "[byz_country.GetAdjectiveWithNoTooltip]の内政に関わるべきではない。"
 flavor_ach.11.b.entry: "$BYZ_ADJ$の内政に関わるべきではない。"
 flavor_ach.12.title: "[ShowCultureNameWithNoTooltip('greek_culture')]系有力者の懐柔"
 flavor_ach.12.entry: "アカイアのギリシャ系住民"
 flavor_ach.12.desc: "[ShowScriptedGeographyName('greece_geography')]における[GetCountry('LAT').GetAdjective]の支配は、かつての[ShowCultureName('greek_culture')]系有力者層の衰退を招いた。だが、[ROOT.GetCountry.GetName]の一部地域では、旧来の[ShowCultureNameWithNoTooltip('greek_culture')]系名家が、[ROOT.GetCountry.GetCulture.GetName]系の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と妥協を重ねることで、なお権勢を保っている。しかし、[GetCountry('LAT').GetLongNameWithNoTooltip]の滅亡以降、[ShowCultureNameWithNoTooltip('greek_culture')]系住民のあいだでは、[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]系支配への反発が強まっている。\n\n支配の安定を図る[scope_ruler.GetNameWithNoTooltip]は、[ROOT.GetCountry.GetNameWithNoTooltip]に残る[ShowCultureNameWithNoTooltip('greek_culture')]系名家の者たちを[ROOT.GetCountry.GetGovernment.GetCourtTitle]に招き、妥協点を探ろうとしている。しかし一部の[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]は、むしろ[ShowCultureNameWithNoTooltip('greek_culture')]系住民に対する自らの諸権利をさらに拡大すべきだと主張している。[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]系有力者層により大きな力を与えれば、[ShowCultureNameWithNoTooltip('greek_culture')]系住民の不穏な動きを抑え込めるというのである。"
 flavor_ach.12.a: "現状を維持しよう。"
 flavor_ach.12.b: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の側につく。"
 flavor_ach.12.b.entry: "わが国の$nobles_estate$の側につく。"
 flavor_ach.12.c: "[ShowCultureNameWithNoTooltip('greek_culture')]系諸家との妥協を図る。"
 flavor_ach.13.title: "[athens_country.GetNameWithNoTooltip]の脅威"
 flavor_ach.13.entry: "カタルーニャによるアテネ支配"
 flavor_ach.13.desc: "[ShowScriptedGeographyName('greece_geography')]の[GetCountry('LAT').GetAdjective]系諸侯の多くは、[scope_ruler.GetName]による[GetCountry('LAT').GetLongNameWithNoTooltip]への請求権を支持している。だが近年、[athens_country.GetLongName]は[ShowCultureName('catalan')]大軍団の後ろ盾を得て、次第に敵対的な姿勢を強めている。一方で、[athens_country.GetAdjectiveWithNoTooltip]の[athens_country.GetGovernment.GetEstateName('nobles_estate')]の中には、この状況に不満を抱き、[ROOT.GetCountry.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に接触してきた者たちがいる。彼らは[athens_country.GetNameWithNoTooltip]から[ShowCultureNameWithNoTooltip('catalan')]大軍団を追放するための支援を取りつけようとしており、その見返りとして[ROOT.GetCountry.GetNameWithNoTooltip]への臣従を誓う意向である。"
 flavor_ach.13.a: "むしろ、[athens_country.GetNameWithNoTooltip]の[ShowCultureNameWithNoTooltip('catalan')]系[athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]と友好関係を築くべきだ。"
 flavor_ach.13.a.entry: "むしろ、$ATH$の[ShowCultureNameWithNoTooltip('catalan')]系$nobles_estate$と友好関係を築くべきだ。"
 flavor_ach.13.b: "彼らの要請を受け入れ、[athens_country.GetNameWithNoTooltip]から[ShowCultureNameWithNoTooltip('catalan')]大軍団を追放すべきだ。"
 flavor_ach.13.b.entry: "彼らの要請を受け入れ、$ATH$から[ShowCultureNameWithNoTooltip('catalan')]大軍団を追放すべきだ。"
 flavor_ach.13.c: "この機に乗じ、むしろ[athens_country.GetFlavorRank]を征服せよ。"
 flavor_ach.13.c.entry: "この機に乗じ、むしろこの国を征服せよ。"
 ach_vassalize_athens_for_reward: "[athens_country.GetName]を従わせることに成功すれば、[ROOT.GetCountry.GetName]に友好的な新たな統治者を据えることができる。"
 flavor_ach.14.title: "[ShowCultureNameWithNoTooltip('catalan')]大軍団、[athens_country.GetNameWithNoTooltip]より追放される"
 flavor_ach.14.entry: "フランスによるアテネ支配"
 flavor_ach.14.desc: "[ShowCultureName('catalan')]大軍団を打ち破り、[athens_country.GetName]から追放したことで、[athens_country.GetAdjectiveWithNoTooltip]の有力者層の多くは[scope_ruler.GetName]に全面的な臣従を誓った。[athens_country.GetFlavorRank]の前統治者が亡命を余儀なくされたいま、[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[ShowCultureNameWithNoTooltip('french')]系の一族を支配の座に戻し、[athens_country.GetNameWithNoTooltip]を治めさせる案が出ている。一方で、この機会に[ShowCultureNameWithNoTooltip('greek_culture')]系住民との関係を深め、地元の[athens_country.GetGovernment.GetEstateName('nobles_estate')]から一人を擁立すべきだという声もある。"
 flavor_ach.14.a: "[ShowCultureNameWithNoTooltip('french')]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の一員を新たな[athens_country.GetGovernment.GetRulerTitle]に据えよう。"
 flavor_ach.14.a.entry: "[ShowCultureNameWithNoTooltip('french')]系$nobles_estate$の一員を新たな統治者に据えよう。"
 flavor_ach.14.b: "[ShowCultureNameWithNoTooltip('french')]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の一員を任じよう。ただし、[athens_country.GetNameWithNoTooltip]の[ShowCultureNameWithNoTooltip('greek_culture')]系住民の特権は守らせる。"
 flavor_ach.14.b.entry: "[ShowCultureNameWithNoTooltip('french')]系$nobles_estate$の一員を任じよう。ただし、$ATH$の[ShowCultureNameWithNoTooltip('greek_culture')]系住民の特権は守らせる。"
 flavor_ach.14.c: "[ShowCultureNameWithNoTooltip('greek_culture')]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の者たちに、[athens_country.GetNameWithNoTooltip]の統治を委ねよう。"
 flavor_ach.14.c.entry: "[ShowCultureNameWithNoTooltip('greek_culture')]系$nobles_estate$の者たちに、$ATH$の統治を委ねよう。"
 flavor_ach.15.title: "[scope_ruler.GetNameWithNoTooltip]の即位"
 flavor_ach.15.entry: "ラテン皇帝位の継承"
 flavor_ach.15.desc: "[latin_empress_catherine_valois.GetName]の逝去により、[scope_ruler.GetName]は[GetCountry('LAT').GetLongNameWithNoTooltip]に対する名目上の請求権を継承し、これを記念する式典を[ROOT.GetCountry.GetCapital.GetName]で執りおこなう手はずを整えた。[latin_empress_catherine_valois.GetShortNameWithNoTooltip]と[scope_philip_latin_emperor.GetName]は、この称号の正統性を固めるために尽力してきたが、[ShowScriptedGeographyName('greece_geography')]各地の[GetCountry('LAT').GetAdjectiveWithNoTooltip]諸侯の多くは、[GetCountry('LAT').GetLongNameWithNoTooltip]に対する[scope_ruler.GetDynasty.GetName]家の請求権を認めていない。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部からは、[scope_ruler.GetNameWithNoTooltip]に対し、父母の遺業をさらに推し進めるよう促す声が上がっている。彼らは、この式典を足がかりとして、帝国再興に向けた取り組みを再び進めるべきだと主張している。"
 flavor_ach.15.a: "戴冠式は、あくまで儀礼にとどめよう。"
 flavor_ach.15.b: "この式典を足がかりとして、帝国再興に向けた動きを後押ししよう。"
 flavor_ach.15.c: "戴冠式を利用し、忠実な諸侯の支持を固めよう。"
 flavor_ach.16.title: "[the_pope.GetNameWithNoTooltip]、[GetCountry('LAT').GetLongNameWithNoTooltip]再興を支持"
 flavor_ach.16.entry: "教皇、ラテン帝国再興に関心を寄せる"
 flavor_ach.16.desc: "[ShowScriptedGeographyName('greece_geography')]におけるわが国の遠征に関心を寄せた[the_pope.GetName]は、[scope_papal_states.GetName]から使節を遣わし、支援の提案を伝えてきた。\n\n[the_pope.GetShortNameWithNoTooltip]は、わが国が[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]を掲げる正統性を認めたうえで、[ShowReligionAdjective('catholic')]教会と[ShowReligionAdjective('orthodox')]教会の関係修復に向けた[scope_papal_states.GetGovernment.GetRulerTitle]の取り組みに協力するなら、[scope_papal_states.GetNameWithNoTooltip]の財政的・政治的支援を与えると申し出ている。\n\nさらに[the_pope.GetNameWithNoTooltip]は、たとえ[constantinople_location.GetName]を奪還することがあっても、第4次十字軍が[constantinople_location.GetRank.GetName]にもたらした悲劇を繰り返してはならないと訴えている。"
 flavor_ach.16.a: "[scope_papal_states.GetAdjectiveWithNoTooltip]の使節の要求を受け入れ、その支援を得よう。"
 flavor_ach.16.a.entry: "$PAP_ADJ$の使節の要求を受け入れ、その支援を得よう。"
 flavor_ach.16.b: "[constantinople_location.GetNameWithNoTooltip]を奪還するのに、[the_pope.GetShortNameWithNoTooltip]の助けは不要だ。"
 flavor_ach.16.b.entry: "[ShowLocationNameWithNoTooltip('constantinople')]を奪還するのに、彼の助けは不要だ。"
 lat_aggressive_conversion_policies_tt: "[GetCountry('LAT').GetLongName]を樹立した場合、[the_pope.GetName]の支持を得る見返りとして、強硬な改宗政策の採用を求められる可能性がある"
 flavor_ach.17.title: "[constantinople_location.GetNameWithNoTooltip]奪還！"
 flavor_ach.17.entry: "コンスタンティノープル奪還！"
 flavor_ach.17.desc: "かつて不可能と思われていた大業が、ついに成し遂げられた。[constantinople_location.GetName]は奪還されたのである！ [constantinople_location.GetRank.GetName]の大部分はいまだ復興途上にあるが、[scope_ruler.GetName]は[ROOT.GetCountry.GetAdjective]兵に対し、[constantinople_location.GetNameWithNoTooltip]を取り戻すにあたり、住民の動揺をさらに広げぬよう慎重に行動することを求めている。\n\n[constantinople_location.GetNameWithNoTooltip]の大部分を掌握し、ブラケルナエ宮殿も放棄されたいま、[scope_ruler.GetNameWithNoTooltip]は[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の有力者層に対し、速やかに[GetCountry('LAT').GetLongName]の再興を宣言するよう求めている。一方、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の慎重派は、まず足場を固めるべきだと進言している。"
 flavor_ach.17.a: "いまこそ、[constantinople_location.GetNameWithNoTooltip]にわが国の支配を再び打ち立てる時だ。"
 flavor_ach.17.a.entry: "いまこそ、[ShowLocationNameWithNoTooltip('constantinople')]にわが国の支配を再び打ち立てる時だ。"
 flavor_ach.17.b: "正式に帝国を再興する前に、まず足場を固めるべきだ。"
 flavor_ach.17.c: "[constantinople_location.GetNameWithNoTooltip]に残る富をすべて略奪せよ！"
 flavor_ach.17.c.entry: "[ShowLocationNameWithNoTooltip('constantinople')]に残る富をすべて略奪せよ！"
