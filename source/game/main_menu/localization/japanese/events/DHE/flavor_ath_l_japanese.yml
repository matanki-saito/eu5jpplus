l_japanese:
 flavor_ath.1.title: "近年の[target_country.GetAdjectiveWithNoTooltip]の襲撃"
 flavor_ath.1.entry: "近年のアイドゥン侯国の襲撃"
 flavor_ath.1.desc: "[ShowAreaName('aegean_sea_area')]沿岸のわが国の領土は近年、[target_country.GetAdjective]のトルコ人による激しい襲撃をたびたび受けてきた。これらの襲撃を率いていたのは[target_character.GetName]であったため、その死によってひとまず脅威は去るものと思われた。だが、その後継者がこのたび[ShowAreaName('thrace_area')]を襲撃したことにより、その狙いはもはや明白である。[target_character2.GetName]は再び[ShowScriptedGeographyName('greece_geography')]に現れ、略奪に及ぶだろう。この脅威が諸都市にさらなる惨禍をもたらす前に、手を打たねばならない。報復としてこちらも襲撃をおこなうか、あるいは[GetInternationalOrganizationType('crusade').GetName]を送り込むべきであろう。"
 flavor_ath.1.a: "同じ目に遭わせてやれ！"
 flavor_ath.2.title: "[scope_ruler.GetShortNameWithNoTooltip]の急死"
 flavor_ath.2.entry: "ギリェム2世公の急死"
 flavor_ath.2.desc: "悲劇だ！ 急病に倒れた[scope_ruler.GetName]は、[regent_of_athens.GetName]によって死亡が宣告された。後継問題が解決されるまでのあいだ、[regent_of_athens.GetShortNameWithNoTooltip]は暫定的な摂政体制を敷くこととなった。[scope_ruler.GetShortNameWithNoTooltip]は[scope_heir.GetName]を後継者として指名していたが、[scope_heir.GetHeShe]は現在[sic_country.GetName]に滞在しており、到着までにはなお時間を要する見込みである。\n\n[ROOT.GetCountry.GetName]に権力の空白が迫るなか、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内で[ShowCultureName('catalan')]大軍団に不満を抱く者たちは、この状況を[arg_ruler.GetDynasty.GetName]家による支配を[ROOT.GetCountry.GetNameWithNoTooltip]に復活させる好機とみなし、[regent_of_athens.GetShortNameWithNoTooltip]に対し、[arg_ruler.GetName]を[ROOT.GetCountry.GetNameWithNoTooltip]の統治者として招くよう嘆願している。しかし、そのような行為は[sic_country.GetNameWithNoTooltip]に対する反逆とみなされ、[sic_country.GetNameWithNoTooltip]が[ROOT.GetCountry.GetFlavorRank]の自治権を強く制限する事態を招きかねない。また、[arg_ruler.GetHeShe]がこの申し出を受け入れる場合でも、[ShowCultureNameWithNoTooltip('catalan')]大軍団に[arg_ruler.GetShortNameWithNoTooltip]の政権掌握を認めさせる必要がある。"
 flavor_ath.2.a: "[scope_heir.GetNameWithNoTooltip]に[scope_ruler.GetShortNameWithNoTooltip]の後継を許可する。"
 flavor_ath.2.a.entry: "後継者に跡を継がせよ。"
 flavor_ath.2.b: "[arg_ruler.GetShortNameWithNoTooltip]に[ROOT.GetCountry.GetFlavorRank]を差し出そう。"
 flavor_ath.2.b.entry: "この国を彼に委ねよう。"
 ath_sicily_may_declare_war: "[arg_ruler.GetName]が[ROOT.GetCountry.GetNameWithNoTooltip]の新しい統治者になった場合、[sic_country.GetName]は[ROOT.GetCountry.GetName]に対して[casus_belli|e]「[ShowCasusBelliName('cb_subject_broke_free')]」を獲得する"
 flavor_ath.3.title: "[scope_athens.GetAdjectiveWithNoTooltip]の[scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]が[scope_athens.GetLongNameWithNoTooltip]を提案"
 flavor_ath.3.desc: "[scope_athens.GetName]からの外交官が、有望ではあるが危険も伴う提案を携えて[ROOT.GetCountry.GetGovernment.GetCourtTitle]に到着した。[scope_athens.GetNameWithNoTooltip]の[scope_ath_william.GetName]が短い闘病のすえに急逝し、その死によって[ROOT.GetCountry.GetFlavorRank]は統治者不在の状態に陥ったという。[scope_athens.GetNameWithNoTooltip]の多くの[scope_athens.GetGovernment.GetEstateName('nobles_estate')]が[scope_ath_william.GetShortNameWithNoTooltip]の後継者を待つなか、摂政を務める[regent_of_athens.GetShortName]は、依然として[arg_ruler.GetDynasty.GetName]に忠誠を保つほかの[scope_athens.GetAdjectiveWithNoTooltip]の[scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]と合意を取り付けてきた。その望みは、[arg_ruler.GetName]を新しい統治者として即位させることである。\n\n[regent_of_athens.GetShortNameWithNoTooltip]によれば、[ShowCultureName('catalan')]大軍団も[scope_ath_william.GetDynasty.GetName]に不満を抱いているという。[arg_ruler.GetShortNameWithNoTooltip]と大軍団との関係は、[scope_slained_brienne.GetName]の打倒により良好とは言えないものの、十分な工作をおこなえば、その指導部を説得し、[scope_athens.GetFlavorRank]における[arg_ruler.GetDynasty.GetNameWithNoTooltip]の復位を支持させることも可能と思われる。彼らの支持を得ることができれば、[scope_sic_country.GetAdjective]の[scope_sic_country.GetGovernment.GetCourtTitle]は、争うことなく[scope_athens.GetNameWithNoTooltip]を手放す可能性もある。"
 flavor_ath.3.a: "[scope_athens.GetAdjectiveWithNoTooltip]の提案を受け入れよう。"
 flavor_ath.3.a.entry: "$ATH_ADJ$の申し出を受ける。"
 flavor_ath.3.b: "あまりにも危うい。申し出は拒否する。"
 flavor_ath.3_become_athens: "[ROOT.GetCountry.GetName]は[scope_athens.GetLongName]へと統合される。これによってすべての[scope_athens.GetAdjectiveWithNoTooltip]の[core|e][locations|e]で[cores|e]を獲得する。"
 ath_arg_sicily_may_declare_war: "[scope_athens.GetName]は独立するが、[scope_sic_country.GetName]が[scope_athens.GetNameWithNoTooltip]に対して[casus_belli|e]「[ShowCasusBelliName('cb_subject_broke_free')]」を獲得する"
 flavor_ath.4.title: "[arg_ruler.GetNameWithNoTooltip]が承諾！"
 flavor_ath.4.desc: "[regent_of_athens.GetShortName]が[arg_country_scope.GetName]へと密使を派遣したのち、[arg_ruler.GetNameWithNoTooltip]は我々の提案を受け入れ、[ROOT.GetCountry.GetLongName]の統治権を引き継ぐこととなった。[scope_ath_william.GetName]の訃報が広がるにつれ、[sic_country_scope.GetAdjective][sic_country_scope.GetGovernment.GetCourtTitle]も、まもなく[regent_of_athens.GetNameWithNoTooltip]によるクーデターに気づくだろう。\n\n[ShowCultureName('catalan')]大軍団は1311年に[scope_slained_brienne.GetName]から[ROOT.GetCountry.GetFlavorRank]を奪取したが、彼らは[sic_country_scope.GetAdjectiveWithNoTooltip][sic_country_scope.GetGovernment.GetCourtTitle]に対して不満を募らせており、妥協点が見出せれば、[arg_ruler.GetShortNameWithNoTooltip]による[ROOT.GetCountry.GetFlavorRank]の統治を受け入れる構えを見せている。"
 flavor_ath.4.a: "[ShowCultureNameWithNoTooltip('catalan')]大軍団との交渉が必要になる。"
 flavor_ath.5.title: "[ShowCultureNameWithNoTooltip('catalan')]大軍団の懐柔"
 flavor_ath.5.desc: "1312年以来、[scope_ath_william.GetDynasty.GetName]家が[ROOT.GetCountry.GetName]の公爵位を保持しつづけてきた一方で、[ROOT.GetCountry.GetFlavorRank]全域における[sic_country_scope.GetAdjectiveWithNoTooltip]の権威の行使を支えていたのは、[ShowCultureName('catalan')]大軍団の力であった。しかし、[regent_of_athens.GetName]による卑劣な策謀を経て、[ROOT.GetCountry.GetNameWithNoTooltip]の多くの[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]は、[scope_ruler.GetDynasty.GetName]による[ROOT.GetCountry.GetNameWithNoTooltip]の継承権を支持するようになっている。\n\n[ShowCultureNameWithNoTooltip('catalan')]大軍団の一部は[sic_country_scope.GetAdjectiveWithNoTooltip][sic_country_scope.GetGovernment.GetCourtTitle]に対する不満を募らせており、適切な報酬が支払われれば、[sic_country_scope.GetNameWithNoTooltip]への臣従の誓いを裏切る用意があると申し出ている。"
 flavor_ath.5.a: "[ROOT.GetCountry.GetFlavorRank]の収入の一部を大軍団に割り当てる。"
 flavor_ath.5.a.entry: "領土の収入の一部を大軍団に割り当てる。"
 flavor_ath.5.b: "追加の特権と土地使用権を大軍団に与える。"
 flavor_ath.5.c: "大軍団を[ROOT.GetCountry.GetFlavorRank]から強制的に追放する。"
 flavor_ath.5.c.entry: "大軍団を国内から強制的に追放する。"
 flavor_ath.6.title: "[scope_athens.GetNameWithNoTooltip]が[ShowDynastyNameWithNoTooltip('barcelona_dynasty')]家の支配を打倒"
 flavor_ath.6.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に悲報が届いた！ [scope_ath_william.GetName]が突然の病で死去し、それによって生じた権力の空白のなかで[scope_athens.GetAdjective]のエリート層は[scope_athens.GetFlavorRank]を[arg_ruler.GetName]に与えた。この者は[scope_ruler.GetName]に対する臣下としての義務を放棄したのである。"
 flavor_ath.6.a: "[scope_athens.GetNameWithNoTooltip]を奪還しなければ！"
 flavor_ath.6.a.entry: "$ATH$を奪還しなければ！"
 flavor_ath.7.title: "[arg_ruler.GetNameWithNoTooltip]が拒絶！"
 flavor_ath.7.entry: "アルゴス公が拒絶"
 flavor_ath.7.desc: "[arg_country.GetName]への密使は、残念な知らせを携えて戻ってきた。[arg_ruler.GetName]は[arg_ruler.GetHimHer]を[ROOT.GetCountry.GetName]の統治者に復位させるという我々の提案を拒否したのだ。事態の収拾を急ぎ、[regent_of_athens.GetName]はこの陰謀に関与した[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の多くを投獄したが、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のほかの者たちは、[scope_heir.GetName]が[ROOT.GetCountry.GetNameWithNoTooltip]に到着する前に、[regent_of_athens.GetHeShe]自身も彼らとともに投獄されるべきだと主張している。"
 flavor_ath.7.a: "ひとまず、[regent_of_athens.GetShortNameWithNoTooltip]のことは見逃してやろう。"
 flavor_ath.7.a.entry: "いまは見逃しておけ。"
 flavor_ath.7.b: "[regent_of_athens.GetShortNameWithNoTooltip]を投獄せよ！"
 flavor_ath.7.b.entry: "投獄せよ！"
 flavor_ath.8.title: "[ShowCultureNameWithNoTooltip('catalan')]大軍団の支配"
 flavor_ath.8.entry: "カタルーニャ大軍団の支配"
 flavor_ath.8.desc: "1311年に[ShowCultureName('catalan')]大軍団が[ROOT.GetCountry.GetLongName]を征服し、その後[sic_country.GetLongName]に臣従して以来、[scope_ruler.GetDynasty.GetName]家が[ROOT.GetCountry.GetLongNameWithNoTooltip]を統治してきた。現在は[ROOT.GetCountry.GetGovernment.GetRulerTitle]が[scope_ruler.GetName]の座にあるが、[ROOT.GetCountry.GetNameWithNoTooltip]における実権の大半は[ShowCultureNameWithNoTooltip('catalan')]大軍団が握っており、その軍事力を背景に、請求者である[arg_ruler.GetName]が[ROOT.GetCountry.GetFlavorRank]を奪還するのを阻んでいる。\n\n[ShowCultureNameWithNoTooltip('catalan')]大軍団は依然として[sic_country.GetAdjectiveWithNoTooltip][sic_country.GetGovernment.GetCourtTitle]に忠誠を保っているが、地元の[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]のなかには、大軍団の構成員が現支配者である[scope_ruler.GetDynasty.GetNameWithNoTooltip]家に対して次第に不満を募らせているのではないかと疑う者もいる。"
 flavor_ath.8.a: "引き続き[ShowCultureNameWithNoTooltip('catalan')]大軍団を信頼し、[ROOT.GetCountry.GetNameWithNoTooltip]の守護を託す。"
 flavor_ath.8.a.entry: "引き続き[ShowCultureNameWithNoTooltip('catalan')]大軍団を信頼し、国土の守護を託す。"
 flavor_ath.8.b: "[ShowCultureNameWithNoTooltip('catalan')]大軍団の不忠に関する噂を引き続き警戒する。"
 flavor_ath.9.title: "[byz_country.GetAdjectiveWithNoTooltip]の内紛"
 flavor_ath.9.entry: "ビザンツの内紛"
 flavor_ath.9.desc: "[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]に、[byz_country.GetName]が[ROOT.GetCountry.GetNameWithNoTooltip]との国境地帯における統制を大幅に失い、配置する守備隊の規模を縮小させたとの報せが届いた。[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は、[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]が王朝の内部抗争によって混乱し、さらに[ShowRegionName('anatolia_region')]の[ShowCultureName('turkish_culture')]諸君侯国への対応にも追われているいまこそ、[byz_country.GetLongNameWithNoTooltip]を攻撃し、[ShowProvinceDefinitionName('thessaly_province')]での勢力拡大を図るべきだと考えている。\n\n一方で、[ShowCultureNameWithNoTooltip('catalan')]大軍団のなかには、[byz_country.GetAdjectiveWithNoTooltip]領の[ShowAreaName('northern_greece_area')]に略奪を仕掛け、[ROOT.GetCountry.GetFlavorRank]の国庫を潤すことを提案する者もいる。"
 flavor_ath.9.a: "いまこそ[ShowProvinceDefinitionNameWithNoTooltip('thessaly_province')]の深部へと攻め入る時だ！"
 flavor_ath.9.b: "[ShowCultureNameWithNoTooltip('catalan')]大軍団を派遣し、 [ShowAreaNameWithNoTooltip('northern_greece_area')]で略奪をおこなえ。"
 flavor_ath.9.c: "好機が訪れるまで待とう。"
 flavor_ath.10.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の[ShowCultureNameWithNoTooltip('greek_culture')]人"
 flavor_ath.10.entry: "ギリシャにおける統治"
 flavor_ath.10.desc: "[GetCountry('LAT').GetAdjective]による[ShowScriptedGeographyName('greece_geography')]統治の時代から、多くの[ShowCultureName('greek_culture')]系エリート層から称号が剥奪され、[GetCountry('LAT').GetAdjectiveWithNoTooltip]十字軍のエリート層の構成員に与えられてきた。1261年の帝国の崩壊により、[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]における十字軍の優位は崩れたものの、その遺産はいまなお[ROOT.GetCountry.GetLongName]全域に色濃く残っている。\n\nさらなる土地使用権を求め、[ROOT.GetCountry.GetCulture.GetName]の多くの[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]に請願し、[ROOT.GetCountry.GetNameWithNoTooltip]の[ShowCultureNameWithNoTooltip('greek_culture')]人の土地をさらに獲得しようとしているが、一方でこれが[ShowCultureNameWithNoTooltip('greek_culture')]系住民の支持を勝ち取る好機になると考える者もいる。"
 flavor_ath.10.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の土地使用権の拡張を支持する。"
 flavor_ath.10.a.entry: "$nobles_estate$の土地使用権の拡張を支持する。"
 flavor_ath.10.b: "[ShowCultureNameWithNoTooltip('greek_culture')]系住民をなだめよう。"
 flavor_ath.10.c: "土地使用権の一部を[ShowCultureNameWithNoTooltip('catalan')]大軍団に譲渡する。"
 flavor_ath.10.d: "現状を維持する。"
 ath_greek_pops_lose_mild_satisfaction: "すべての[ShowCultureName('greek_culture')]系[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 ath_greek_pops_gain_severe_satisfaction: "すべての[ShowCultureName('greek_culture')]系[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('estate_satisfaction_severe_bonus')|+=2%]上昇する"
 ath_greek_pops_lose_severe_satisfaction: "すべての[ShowCultureName('greek_culture')]系[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('estate_satisfaction_severe_penalty')|+=2%]低下する"
 flavor_ath.11.title: "[ShowCultureNameWithNoTooltip('catalan')]大軍団と[target_conflict_location.GetNameWithNoTooltip]の[ShowCultureNameWithNoTooltip('greek_culture')]系住民の対立"
 flavor_ath.11.entry: "カタルーニャ大軍団とギリシャ系住民の対立"
 flavor_ath.11.desc: "[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]から付与された特権を享受してきた[ShowCultureName('catalan')]大軍団は、彼らが不法に土地を奪取していると訴える[target_conflict_location.GetName]の[ShowCultureName('greek_culture')]系住民たちとのあいだで大きな騒動を引き起こしている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、以前から[target_conflict_location.GetNameWithNoTooltip]における[ShowCultureNameWithNoTooltip('catalan')]人たちの目論見を把握していた者もいるが、一方でこの事件が近隣諸州に波及し、[ShowCultureNameWithNoTooltip('greek_culture')]系住民の大規模な蜂起を誘発することを危惧し、[scope_ruler.GetName]に問題への介入を求める者もいる。"
 flavor_ath.11.a: "土地の接収を支持する。"
 flavor_ath.11.b: "[ShowCultureNameWithNoTooltip('catalan')]大軍団を戒めよ。"
 flavor_ath.11.c: "これを機に[ShowCultureNameWithNoTooltip('catalan')]大軍団を[ROOT.GetCountry.GetNameWithNoTooltip]から追放せよ！"
 flavor_ath.11.c.entry: "これを機に[ShowCultureNameWithNoTooltip('catalan')]大軍団を国内から追放せよ！"
 flavor_ath.12.title: "[thebes_location.GetNameWithNoTooltip]と[athens_location.GetNameWithNoTooltip]の遷都"
 flavor_ath.12.entry: "遷都"
 flavor_ath.12.desc: "[athens_location.GetName]の[athens_location.GetRank.GetName]は長いあいだ[ROOT.GetCountry.GetFlavorRank]において極めて重要な拠点であったが、歴代の政権は、旧来の[GetCountry('LAT').GetAdjective]後継政権から近年の[ShowCultureNameWithNoTooltip('catalan')]大軍団に至るまで、いずれもより戦略的な位置にある[thebes_location.GetName]に統治の拠点を置いてきた。[thebes_location.GetNameWithNoTooltip]の台頭にもかかわらず、[athens_location.GetNameWithNoTooltip]は依然として有力な[athens_location.GetRank.GetNameWithNoTooltip]でありつづけ、[ROOT.GetCountry.GetFlavorRank]の官僚機構の多くも引き続きそこに置かれている。\n\nどちらの都市も重要であるが、この問題について最終的な合意を形成するため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]は[scope_ruler.GetName]に対し、どちらを[ROOT.GetCountry.GetName]の正式な首都とするかを決定するよう求めている。"
 flavor_ath.12.a: "どちらも都市も重要だ。現在の体制を維持せよ。"
 flavor_ath.12.b: "我々は[athens_location.GetNameWithNoTooltip]へと戻り、再びそこを首都とすべきだ。"
 flavor_ath.12.b.entry: "我々は[ShowLocationNameWithNoTooltip('athens')]へと戻り、再びそこを首都とすべきだ。"
 flavor_ath.12.c: "[thebes_location.GetNameWithNoTooltip]を[ROOT.GetCountry.GetFlavorRank]の正式な首都だと宣言しよう。"
 flavor_ath.12.c.entry: "[ShowLocationNameWithNoTooltip('thebes')]を国家の正式な首都と宣言しよう。"
 flavor_ath.13.title: "[scope_epi_ruler.GetNameWithNoTooltip]が[epi_country.GetNameWithNoTooltip]の権力を掌握"
 flavor_ath.13.entry: "エピロスの分離独立"
 flavor_ath.13.desc: "1337年に[scope_epi_governor.GetName]の統治下に入ったことで、[epi_country.GetName]は再び[byz_country.GetName]の傘下に戻っていた。しかしその後、[scope_epi_ruler.GetName]の支持者たちが[byz_country.GetAdjectiveWithNoTooltip]の総督に対する反乱を成功させ、政権を打倒して[scope_epi_ruler.GetLastNameWithNoTooltip]を[epi_country.GetFlavorRank]の座に復帰させた。[byz_country.GetNameWithNoTooltip]はまだ動きを見せていないが、[ROOT.GetCountry.GetLongName]のなかには、権力の空白が続いているこの機を活かして、[epi_country.GetNameWithNoTooltip]を奪取すべきだという者もいる。"
 flavor_ath.13.a: "[epi_country.GetLongNameWithNoTooltip]の領有権を主張しよう。"
 flavor_ath.13.a.entry: "$EPI$の領有権を主張しよう。"
 flavor_ath.13.b: "我々はむしろ、[scope_epi_ruler.GetNameWithNoTooltip]への支援を模索すべきだ。"
 flavor_ath.13.b.entry: "我々はむしろ、彼を支援すべきだ。"
 flavor_ath.13.c: "[epi_country.GetAdjectiveWithNoTooltip]の問題は、我々が関わるべきことではない。"
 flavor_ath.13.c.entry: "$EPI_ADJ$の問題は、我々が関わるべきことではない。"
 flavor_ath.14.title: "[scope_ach_country.GetNameWithNoTooltip]の名目上の[GetCountry('LAT').GetAdjectiveWithNoTooltip]統治者たち"
 flavor_ath.14.entry: "アカイアの名目上の皇帝"
 flavor_ath.14.desc: "しばらくのあいだ[scope_nap_country.GetName]からの保護を享受してきた[scope_ach_country.GetLongNameWithNoTooltip]であったが、彼らは[ShowScriptedGeographyName('greece_geography')]における多くの[GetCountry('LAT').GetAdjective]諸国のあいだでさらに影響力を強め、[scope_ach_ruler.GetName]は[GetCountry('LAT').GetLongNameWithNoTooltip]の統治者としての正当性を巧みに利用して活動している。この称号は1261年の[GetCountry('LAT').GetLongNameWithNoTooltip]崩壊とともに大半の権力を失っているが、[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]全域の多くの[GetCountry('LAT').GetAdjectiveWithNoTooltip]諸君主は引き続き[scope_ach_ruler.GetShortNameWithNoTooltip]への支持を表明してきた。\n\n残った[GetCountry('LAT').GetAdjectiveWithNoTooltip]諸国のあいだで[ROOT.GetCountry.GetName]の権力基盤が強まるなか、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は、いまこそ[scope_ach_country.GetNameWithNoTooltip]を攻撃し、[GetCountry('LAT').GetLongNameWithNoTooltip]に対する彼らの主張に終止符を打つべきだと感じている。"
 flavor_ath.14.a: "我々は[scope_ach_country.GetNameWithNoTooltip]へ侵攻し、彼らの請求権をさらに弱体化させるべきだ。"
 flavor_ath.14.a.entry: "我々は$ACH$へ侵攻し、彼らの請求権をさらに弱体化させるべきだ。"
 flavor_ath.14.b: "我々はむしろ、[scope_ach_ruler.GetShortNameWithNoTooltip]との関係改善に努めるべきだ。"
 flavor_ath.14.b.entry: "我々はむしろ、彼との関係改善に努めるべきだ。"
 flavor_ath.14.c: "[scope_ach_ruler.GetShortNameWithNoTooltip]の問題は[ROOT.GetCountry.GetNameWithNoTooltip]には関係ない。"
 flavor_ath.14.c.entry: "統治者の問題など、わが国には関係ない。"
 flavor_ath.15.title: "[GetCountry('LAT').GetLongNameWithNoTooltip]の復興に向けて[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支持を求める[the_pope.GetNameWithNoTooltip]"
 flavor_ath.15.entry: "教皇がラテン帝国の再興を提案"
 flavor_ath.15.desc: "[scope_papal_states.GetLongName]からの外交官が、野心的な提案を携えて[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に到着した。[the_pope.GetNameWithNoTooltip]は[scope_byz.GetName]の影響力の衰退と[ROOT.GetCountry.GetNameWithNoTooltip]の台頭を注視しており、いまや我々を[constantinople_location.GetName]で[GetCountry('LAT').GetLongName]を復興しうる有力な候補とみなしている。\n\nもしその要求の一部に同意し、[GetCountry('LAT').GetLongNameWithNoTooltip]が復興されれば、[the_pope.GetShortNameWithNoTooltip]は[scope_papal_states.GetLongNameWithNoTooltip]の全面的な支援を提供し、[scope_ruler.GetName]を[constantinople_location.GetNameWithNoTooltip]の正統な支配者として認めるだろう。"
 flavor_ath.15.a: "[the_pope.GetShortNameWithNoTooltip]の要求を受け入れ、[GetCountry('LAT').GetLongNameWithNoTooltip]を復興させる。"
 flavor_ath.15.a.entry: "要請を受け入れ、$LAT$を再興せよ。"
 flavor_ath.15.b: "我々は[the_pope.GetShortNameWithNoTooltip]の野望に従うつもりはない。"
 flavor_ath.15.b.entry: "我々は教皇の野望に従うつもりはない。"
 flavor_ath.16.title: "[GetCountry('THE').GetLongNameWithNoTooltip]の請求権"
 flavor_ath.16.entry: "テッサロニキの土地の奪還"
 flavor_ath.16.desc: "[GetCountry('THE').GetName]は短命の[GetCountry('THE').GetFlavorRank]であり、かつての[GetCountry('LAT').GetLongName]の属国であったものの、その統治者は1224年に[scope_theodoros_doukas.GetName]によって滅ぼされるまで、[GetCountry('LAT').GetLongNameWithNoTooltip]内で強い政治的影響力を行使していた。\n\nその称号に対する形式的な請求権は[achaea_country.GetLongName]のもとでも存続しているが、最近[ROOT.GetCountry.GetName]が旧[GetCountry('THE').GetFlavorRank]の領土を征服したことで、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、この称号を我々自身が主張し、[GetCountry('LAT').GetLongNameWithNoTooltip]の後継者としての正統性をさらに強化すべきだと考える者もいる。"
 flavor_ath.16.a: "[GetCountry('THE').GetLongNameWithNoTooltip]の請求権を主張せよ！"
 flavor_ath.16.a.entry: "$THE$の領有を主張せよ！"
 flavor_ath.16.b: "それに代わって新しい[GetCountry('THE').GetFlavorRank]を宣言する。"
 flavor_ath.16.b.entry: "それに代わって新しい国家を宣言する。"
 flavor_ath.16.c: "我々は過去に争われた称号に対して請求権を主張すべきではない。"
 may_form_thessalonica: "[GetCountry('THE').GetLongNameWithNoTooltip]の形成に必要となる[ShowScriptedGeographyName('claims_of_thessalonica_geography')]内の[locations|e]の数を#L 30.00%#!削減する。"
 flavor_ath.17.title: "[constantinople_location.GetNameWithNoTooltip]の再征服"
 flavor_ath.17.entry: "コンスタンティノープルの征服！"
 flavor_ath.17.desc: "[ROOT.GetCountry.GetName]の兵士たちは不可能を成し遂げ、[constantinople_location.GetName]を征服した！ [scope_ruler.GetName]は過去の教訓を踏まえ、第四回十字軍が招いた悲劇を繰り返さぬよう、[constantinople_location.GetRank.GetName]での略奪を一時停止するよう命じた。かつての[ShowCultureNameWithNoTooltip('greek_culture')]系エリート層の多くが再び追放されるなか、[scope_ruler.GetShortNameWithNoTooltip]は[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]に対し、[GetCountry('LAT').GetLongName]の再建を提案した。しかし、かつての[GetCountry('LAT').GetFlavorRank]が犯した過ちを避け、まずは[ShowScriptedGeographyName('greece_geography')]全域への支配を再確立すべきだと考える者も少なくはない。"
 flavor_ath.17.a: "[GetCountry('LAT').GetLongNameWithNoTooltip]の復興を宣言せよ！"
 flavor_ath.17.a.entry: "$LAT$の復興を宣言せよ！"
 flavor_ath.17.b: "まずは[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]における我々の立場を安定させよう。"
 flavor_ath.17.c: "我々は[ROOT.GetCountry.GetLongNameWithNoTooltip]として統治を続ける。"
 flavor_ath.17.c.entry: "我らは、我ら自身として統治を続ける。"
 latin_empire_reformation_conditions_unchanged_tt: "[GetCountry('LAT').GetLongNameWithNoTooltip]の形成に必要となる[ShowScriptedGeographyName('frankokratia_geography')]内の[locations|e]の数を#L 33.00%#!に削減する。"
