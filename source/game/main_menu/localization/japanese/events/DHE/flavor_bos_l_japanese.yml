l_japanese:
 flavor_bos.1.title: "独立への望み"
 flavor_bos.1.entry: "$flavor_bos.1.title$"
 flavor_bos.1.desc: "[hun_robert.GetName]の死は、これまでにない好機をもたらした。[GetCountry('HUN').GetName]が弱体化し、他事に気を取られているなか、[target_ruler.GetName]は[GetCountry('HUN').GetAdjectiveWithNoTooltip]の支配を脱した[ROOT.GetCountry.GetName]を思い描くようになった。公然と反乱を起こすのではなく、まずはひそかにその支配を切り崩し、独立のために力となりうる敵対勢力と外交をおこなうべきだとの案が出ている。"
 flavor_bos.1.a: "この好機を逃す手はない。"
 flavor_bos.1.b: "我らは今後も、[GetCountry('HUN').GetAdjectiveWithNoTooltip]の[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]に忠誠を誓う。"
 flavor_bos.1.b.entry: "We shall remain loyal to the $HUN_ADJ$ $crown_estate$."
 flavor_bos.1.a.tt: "ライバルとの関係改善や忠誠心の低下などによって[GetCountry('HUN').GetAdjectiveWithNoTooltip]の権威を損ないつづけると、[GetCountry('HUN').GetNameWithNoTooltip]がわが国の従属国としての地位を見直す可能性がある。"
 flavor_bos.1.historical_info: "スティエパン2世の治世においては、ハンガリーとその敵対勢力の対立を利用して、ボスニアをハンガリーの支配から引き離そうとする動きが強まった。チャールズ・ロベルト王やスラヴォニアのミカツといったハンガリー側の有力者が死去すると、スティエパンは賄賂を使い、忠誠を示さず、ときには軍の配置まで漏らして、ハンガリーとヴェネツィアの戦争につけ込むようになった。こうした行動により、ステファンは「悪魔の弟子」と呼ばれるようになり、新たに即位したハンガリー王の不信を買った。しかし王家は疲弊しきっており、彼を排除するだけの力も意志もなかった。彼の治世の終わりには、ボスニアに対するハンガリーの支配は名ばかりのものとなっていた。"
 flavor_bos.2.title: "[GetCountry('SER').GetNameWithNoTooltip]の衰退"
 flavor_bos.2.entry: "The Decline of Serbia"
 flavor_bos.2.desc: "[ser_dusan.GetName]の死後、[GetCountry('SER').GetName]では長年にわたり内紛が続いている。王権の衰えによって、各地の領主たちは権力を争うようになったが、そのいずれも王位を主張するだけの正統性も権威も備えてはいない。わが国の統治者は[ser_dusan.GetDynasty.GetName]家と縁戚関係にあるため、その王位に正当な請求をおこなえる。"
 flavor_bos.2.a: "分裂に乗じて、わが国の影響力を広げよう。"
 flavor_bos.2.b: "いまは内政に専念しよう。"
 flavor_bos.2.historical_info: "ネマニッチ朝が断絶すると、セルビア王位は事実上の空位となり、旧帝国の各地は分立した諸家によって治められるようになった。トヴルトコ1世はこの権力の空白を利用し、父方の祖母を通じてネマニッチ家の血を引いていることを根拠にセルビア王位を請求し、ボスニアの勢力を東方へ広げようとした。"
 flavor_bos.3.title: "[ROOT.GetCountry.GetNameWithNoTooltip]初代国王"
 flavor_bos.3.entry: "$flavor_bos.3.title$"
 flavor_bos.3.desc: "我らの遠征は成功し、旧[GetCountry('SER').GetAdjective]領の広大な地を手にした。この勝利を受けて[target_ruler.GetName]は大胆な提案を打ち出した。[target_ruler.GetSheHe|U]は、正式に[GetCountry('SER').GetNameWithNoTooltip]王を称するだけでなく、[ROOT.GetCountry.GetName]を王国とし、わが国で初めての王となることを望んでいる。"
 flavor_bos.3.a: "わが国には王が必要だ。"
 flavor_bos.3.b: "王冠は力よりも厄介の種だ。"
 flavor_bos.3.historical_info: "1370年代初頭、かつてのセルビア帝国は崩壊し、ボスニアのトヴルトコを含む多くの在地領主によって分割統治されていた。だが、トヴルトコの立場は大きく異なっていた。彼はすでに、セルビア帝国の重要な領地を含む独立国を治めていたのである。さらに、彼はネマニッチ家の血を引くと主張。それによって他のセルビア領主にはない正統性を備えていた。こうした権利をもとに、彼の宮廷はその戴冠を正当化し、二つの王位を兼ねる権利を主張した。その結果トヴルトコは1377年秋、セルビア人の王、そしてボスニアの王として戴冠した。"
 flavor_bos.4.title: "ストロイニツィ評議会の招集"
 flavor_bos.4.entry: "$flavor_bos.4.title$"
 flavor_bos.4.desc: "[ROOT.GetCountry.GetAdjective]教会の長老たるストロイニツィが集まり、我らの信仰の今後を協議している。長年の対立や教義をめぐる問題、その他多くの懸案が、この評議会の前に持ち出されている。"
 flavor_bos.4.a: "教会に必要なのは、何よりも安定だ。"
 flavor_bos.4.b: "教えをより明確にすべきだ。"
 flavor_bos.4.c: "まずは内部の争いを収めることに努めよう。"
 flavor_bos.4.d: "教会の財産に目を向けよう。"
 flavor_bos.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]教会の行く末"
 flavor_bos.5.entry: "$flavor_bos.5.title$"
 flavor_bos.5.desc: "[GetUniqueInternationalOrganization('catholic_church').GetName]からわが[ROOT.GetCountry.GetFlavorRank]にかかる圧力は日に日に強まっており、わが国に危険な異端があるとして、[target_pope.GetName]が再び[ROOT.GetCountry.GetName]に対する十字軍の派遣を検討しているとの報せが届いている。我らは代々、この地の教会を守ってきたが、降伏し、[ShowReligionAdjective('catholic')]世界の諸国のなかで地位を固めるべき時がついに来たのかもしれない。"
 flavor_bos.5.a: "我らの教会は生きつづける！"
 flavor_bos.5.b: "[ShowReligionAdjectiveWithNoTooltip('catholic')]世界の一員となろう。"
 flavor_bos.5.c: "ならば、[ShowLocationNameWithNoTooltip('constantinople')]を頼ろう。"
 flavor_bos.5_catholic_unhappy: "すべての[ShowReligionAdjective('catholic')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 flavor_bos.5_krstjani_unhappy: "[ShowReligionAdjective('bosnian_church')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 flavor_bos.5_orthodox_unhappy: "すべての[ShowReligionAdjective('orthodox')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 flavor_bos.5.historical_info: "ボスニア教会は度々異端の疑いをかけられ、教皇庁から繰り返し批判と介入を受けた。1203年、教会の代表者たちはビリノ・ポリェの異端誓絶文に署名し、異端とされた慣行を捨てて、カトリックの教義に従うことを誓った。だが、その後も多くの者がひそかに旧来の慣行を守りつづけた。1337年には、教皇ベネディクトゥス12世が再び十字軍の派遣を呼びかけたが、その試みも結局は失敗に終わった。こうしてボスニア教会は、この地がオスマン帝国に征服されるまで存続した。"
