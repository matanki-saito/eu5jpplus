l_japanese:
 flavor_sie.1.title: "モンテ・デイ・パスキ銀行"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "「モンテ・ディ・ピエタ」が近年、わが国および周辺地域でますます一般的になりつつある。寄付者から集めた資金を用い、恵まれない人々に低利の融資を提供する慈善金融機関だ。[monte_paschi_bank_hq.GetName]にあるこうした組織のひとつに資金を提供すれば、わが[ROOT.GetCountry.GetFlavorRank]の富を増やし、広く繁栄をもたらすとともに、我々の国立銀行としても機能するだろう。"
 flavor_sie.1.a: "経済が回るな。"
 flavor_sie.1.b: "実に立派な組織だ！"
 flavor_sie.1.historical_info: "「シエナのモンテ・デイ・パスキ銀行」は、1472年にシエナ共和国で誕生し、現在も継続して営業している世界最古の銀行とされている。当初はモンテ・ディ・ピエタとして設立され、トスカーナ大公国のもとで現在の形へと発展した。イタリア統一後には、その活動範囲を半島全域へと広げていった。"
 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "モンテ・ディ・ピエタは、恵まれない人々への支援を目的とした慈善組織である。だが、そのような理念に基づく出自を持つからといって、こうした事業やその他の運営から利益を得て、自らの富を増やしてはならないというわけではない。"
 flavor_sie.2.a: "金は我らのものだ！"
