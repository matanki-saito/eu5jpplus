l_japanese:
 unlocked_advance_marble_tradition_tt: "[dynamic_historical_event|e]「$flavor_sie.1.title$」が完了している"
 flavor_sie.1.title: "モンテ・デイ・パスキ銀行"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "「モンテ・ディ・ピエタ」が近年、わが国および周辺地域でますます一般的になりつつある。寄付者から集めた資金を用い、恵まれない人々に低利の融資を提供する慈善金融機関だ。[monte_paschi_bank_hq.GetName]にあるこうした組織のひとつに資金を提供すれば、わが[ROOT.GetCountry.GetFlavorRank]の富を増やし、広く繁栄をもたらすとともに、我々の国立銀行としても機能するだろう。"
 flavor_sie.1.a: "経済が回るな。"
 flavor_sie.1.b: "実に立派な組織だ！"
 flavor_sie.1.historical_info: "「シエナのモンテ・デイ・パスキ銀行」は、1472年にシエナ共和国で誕生し、現在も継続して営業している世界最古の銀行とされている。当初はモンテ・ディ・ピエタとして設立され、トスカーナ大公国のもとで現在の形へと発展した。イタリア統一後には、その活動範囲を半島全域へと広げていった。"
 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "モンテ・ディ・ピエタは、恵まれない人々への支援を目的とした慈善組織である。だが、そのような理念に基づく出自を持つからといって、こうした事業やその他の運営から利益を得て、自らの富を増やしてはならないというわけではない。"
 flavor_sie.2.a: "金は我らのものだ！"
 flavor_sie.3.entry: "$flavor_sie.3.title$"
 flavor_sie.3.title: "[ShowLocationNameWithNoTooltip('siena')]の黄金時代"
 flavor_sie.3.desc: "[ROOT.GetCountry.GetAdjective]の国境拡大は、長年にわたる平和と繁栄をもたらし、[target_location.GetName][target_location.GetRank.GetName]を黄金時代へと導いた。通りは労働と祝祭で活気に満ち、富と豊かさが絶え間なく流れ込んでいる。この繁栄に終わりが来るとは誰も想像できない。むしろ多くの者は、この黄金時代が[target_location.GetRank.GetNameWithNoTooltip]の人々に永遠の祝福をもたらすのではないかと考えている。"
 flavor_sie.3.a: "この黄金時代は永遠に続くのだ！"
 sie_gain_modifier_until_the_black_death: "[situation|e]「[ShowSituationNameWithNoTooltip('black_death')]」が開始するまで、[ShowLocationName('siena')]が[location_modifier|e]「[ShowModifier('sie_golden_age_of_siena')]」を獲得する"
 flavor_sie.4.entry: "$flavor_sie.4.title$"
 flavor_sie.4.title: "[ShowSituationNameWithNoTooltip('black_death')]からの復興"
 flavor_sie.4.desc: "[ShowRegionName('italy_region')]および[ShowContinentName('europe')]全土を襲った疫病は、[target_location.GetName]に深い爪痕を残した。かつて活気に満ちていた通りは、死は誰をも差別しないという厳しい現実を物語っている。死の騎士の前では、罪人も聖人も平等に裁かれるのだ。しかし、我々はこの荒廃を前に手をこまねくのではなく、[target_location.GetNameWithNoTooltip]の人々を支援するべきではないだろうか。"
 flavor_sie.4.a: "国庫を用いて、この[target_location.GetRank.GetNameWithNoTooltip]の再建を試みる。"
 flavor_sie.4.a.entry: "国庫を用いて、この地の再建を試みる。"
 sie_all_pops_lose_satisfaction: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]低下する"
 flavor_sie.4.b: "生と死の循環は永遠であり、逃れることはできない。"
 flavor_sie.5.entry: "$flavor_sie.5.title$"
 flavor_sie.5.title: "[ShowLocationNameWithNoTooltip('grosseto')]の港の建設"
 flavor_sie.5.desc: "[ShowRegionName('italy_region')]の沿岸におけるわが国の海上勢力はいまだ初期段階にある。にもかかわらず、わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くは[ROOT.GetCountry.GetName]に対し、海軍の大幅な拡張を求めている。彼らがこの事業のために選んだ最初の拠点のひとつが、近年獲得した[target_location.GetName][target_location.GetRank.GetName]である。\n\n新たに[target_location.GetNameWithNoTooltip]の住民となった者たちの多くは、我々の[ROOT.GetCountry.GetFlavorRank]がこの地の持つ影響力の大きさに気づき、適切な港の建設に尽力することを願って、居を構えたのである。"
 flavor_sie.5.a: "わが国の海上交易を保護しよう。"
 flavor_sie.5.b: "代わりに陸上の国境に注力すべきだ。"
 flavor_sie.6.entry: "$flavor_sie.6.title$"
 flavor_sie.6.title: "[ShowLocationNameWithNoTooltip('pitigliano')]における海上の影響力"
 flavor_sie.6.desc: "わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は、[ShowRegionName('italy_region')]において真に競争力のある海上交易者となるための資源が長らく不足していた。彼らは[target_location.GetMarket.GetName]において独自の港湾網を欠いているが、打つ手がまったくないわけではない。\n\n[target_location.GetName][target_location.GetRank.GetName]は、わが国の多くの[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の注目を集めており、彼らは[ROOT.GetCountry.GetGovernment.GetCourtTitle]に対し、その港を拡張し、すべての商人が利用できる交易拠点へと変えるための投資をおこなうべきだと主張している。"
 flavor_sie.6.a: "この港を拡張しよう。"
 flavor_sie.6.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の要求を満たすために、国庫のすべてを注ぎ込むわけにはいかない。"
 flavor_sie.6.b.entry: "富裕層の要求を満たすために、国庫のすべてを注ぎ込むわけにはいかない。"
 flavor_sie.7.entry: "$flavor_sie.7.title$"
 flavor_sie.7.title: "[ShowLocationNameWithNoTooltip('piombino')]の港"
 flavor_sie.7.desc: "商人、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]、そして[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]がこぞって[target_location.GetName]へと移住しており、この[target_location.GetRank.GetName]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]の注目を大いに集めている。\n\nその港を拡張することはわが国の海上交易路を強化することになるため、多くの[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]が[target_character.GetName]に対し、国庫の資金を投入してこの[target_location.GetRank.GetNameWithNoTooltip]を[ShowRegionName('italy_region')]全土でも有数の主要拠点へと発展させるよう提案している。"
 flavor_sie.7.a: "交易を強化するため、この港を築き上げよう。"
 flavor_sie.7.b: "そのような港はこれ以上必要ない。"
 flavor_sie.8.entry: "$flavor_sie.8.title$"
 flavor_sie.8.title: "追放者の帰還"
 flavor_sie.8.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]のなかには、[ROOT.GetCountry.GetAdjective]の政界に影響力を持つ者が多く存在するが、[GetDynasty('petrucci').GetName]家の権力に匹敵する者は誰もいなかった。少なくとも、クーデター未遂の噂によって彼らが追放されるまでは。\n\nそれにもかかわらず、[GetDynasty('petrucci').GetNameWithNoTooltip]家のひとりが、先祖の故郷であり、歴史ある[target_capital.GetName][target_capital.GetRank.GetName]へと帰還した。多くの民衆はこの[target_character.GetWomanMan]を歓迎し、その名を称え、現在の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の腐敗から自分たちを救い出してくれることを期待している。しかしその一方で、過去の野心の再燃を恐れ、[GetDynasty('petrucci').GetNameWithNoTooltip]家が再びクーデターを企てる前にこの[target_character.GetWomanMan]を追放するよう、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に要求する者たちもいる。"
 flavor_sie.8.a: "たったひとりの人間の影響力など恐るるに足りない。"
 flavor_sie.8.b: "身の程をわきまえさせる方法はいくらでもある……"
 flavor_sie.8.c: "この一族が追放されたのには、相応の理由がある。"
 sie_triumphant_return_means_possibility_of_coup: "[ROOT.GetCountry.GetName]に帰還した[target_character.GetName]は、わが国の[ruler|e]になれば確実に権力の掌握を試みる"
 flavor_sie.9.entry: "$flavor_sie.9.title$"
 flavor_sie.9.title: "権力の掌握"
 flavor_sie.9.desc: "数年前、[ROOT.GetCountry.GetLongName]は分断され、さまざまな一族が異なる要職を占めていた。このため、わが国の指導部はほぼすべての問題において分裂状態にあった。しかし、[target_character.GetName]が台頭して以来、これらの地位の多くは忠誠派、つまりは[target_character.GetHerHis]の手先か、この権力均衡の転換を全面的に支持する一族の者たちが占めるようになった。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]との会議において、誰も[target_character.GetHerHim]に異を唱えようという者はいなかった。いかなる政敵をも沈黙させられるであろう[target_character.GetSheHe]の影響力を恐れたためである。\n\nこの[ROOT.GetCountry.GetFlavorRank]に対する支配により、いまや[ROOT.GetCountry.GetNameWithNoTooltip]においては、[target_character.GetDynasty.GetName]家が優位に立つこととなった。"
 flavor_sie.9.a: "ひとつの家系が、すべてを統べるのだ。"
 flavor_sie.10.entry: "$flavor_sie.10.title$"
 flavor_sie.10.title: "[ShowLocationNameWithNoTooltip('siena')]の芸術様式"
 flavor_sie.10.desc: "[ShowInstitutionName('renaissance')]は[ShowRegionName('italy_region')]全域の芸術様式を大きく変化させた。とりわけ注目すべき発展は、表現の神秘的および宗教的側面に焦点を当てた[ROOT.GetCountry.GetAdjective]様式である。これは、[ShowLocationName('florence')]のより人間主義的で表現主義的な伝統に真っ向から対立するものである。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の構成員の多くはこれを、わが国の文化を[ShowContinentName('europe')]全土に広め、すべての者にわが国の威信を示す好機と捉えている。"
 flavor_sie.10.a: "[ShowLocationNameWithNoTooltip('siena')]を最も威信ある場所にしてみせよう！"
 flavor_sie.10.b: "そのような野心のための資金はない。"
 flavor_sie.11.entry: "$flavor_sie.11.title$"
 flavor_sie.11.title: "[ShowLocationNameWithNoTooltip('siena')]派の拡大"
 flavor_sie.11.desc: "[ShowInstitutionName('renaissance')]の全盛期は、[ShowRegionName('italy_region')]の文化的アイデンティティを根本から変え、多くの都市が独自の象徴的な芸術様式を生み出すきっかけとなった。[ROOT.GetCountry.GetAdjective]の伝統にとっては幸運なことに、わが国の様式で作品を制作することに熱意を燃やす新しい芸術家たちの波が到来している。\n\nそのひとりが[target_character.GetName]であり、[ShowLocationName('siena')]において、より宗教的な影響を受けた美的理念を確立したいと考えている。"
 flavor_sie.11.a: "[target_character.GetHerHim]のような新しい芸術家を受け入れよう。"
 flavor_sie.11.a.entry: "新しい芸術家を受け入れよう。"
 flavor_sie.11.b: "現在の様式に固執するよりも、ほかの様式に新たな着想を求めるべきかもしれない。"
 flavor_sie.12.entry: "$flavor_sie.12.title$"
 flavor_sie.12.title: "[ShowLocationNameWithNoTooltip('siena')]の聖人"
 flavor_sie.12.desc: "[target_character.GetReligion.GetGodName]のみに身を捧げる[target_character.GetName]は、[ShowLocationName('siena')]の多くの市民から、教皇に次いで[ShowRegionName('italy_region')]で最も敬虔な人物とみなされている。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、[target_character.GetHerHis]の熱意と神学的な著作への注力に注目している。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]はこれを、[ROOT.GetCountry.GetReligion.GetAdjective]世界に対してわが国の献身を示す好機と捉えている一方、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]は[target_character.GetHerHim]が生ける聖人で、自分たちに繁栄をもたらしてくれるのだと考えている。"
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_sie.12.a.entry: "素晴らしい！"
