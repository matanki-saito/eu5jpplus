l_japanese:
 flavor_lat.1.title: "新たな[latin_country.GetAdjectiveWithNoTooltip]官僚機構の構築"
 flavor_lat.1.entry: "新たなラテン官僚機構"
 flavor_lat.1.desc: "[constantinople_location.GetName]への支配を取り戻したいま、[latin_country.GetAdjective]の有力者たちの多くは、衰えた[GetCountry('BYZ').GetAdjectiveWithNoTooltip]の制度に代わる新たな官僚機構の基礎を築きつつある。かつての[ROOT.GetCountry.GetLongNameWithNoTooltip]の弱点のひとつは、当時の各地における利害と圧力に阻まれ、[ROOT.GetCountry.GetFlavorRank]がまとまりある統治機構を築けなかったことにあった。\n\nだが[scope_ruler.GetName]の指導のもと、[ROOT.GetCountry.GetFlavorRank]は別の道を選び、統一された[ROOT.GetCountry.GetCulture.GetName]官僚機構を築くことができるだろう。"
 flavor_lat.1.a: "新たに独自の[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]官僚機構を築こう。"
 flavor_lat.1.a.entry: "新たに独自の官僚機構を築こう。"
 flavor_lat.1.b: "新たな官僚機構は、かつての十字軍国家を手本にせよ。"
 flavor_lat.1.c: "[GetCountry('BYZ').GetAdjectiveWithNoTooltip]官僚機構の要素を取り入れよ。"
 flavor_lat.1.c.entry: "$BYZ_ADJ$官僚機構の要素を取り入れよ。"
 flavor_lat.1.d: "[ShowCultureNameWithNoTooltip('catalan')]式の官僚機構を導入せよ。"
 flavor_lat.1.e: "[ShowCultureNameWithNoTooltip('neapolitan')]式の官僚機構を導入せよ。"
 flavor_lat.2.title: "[ShowRegionNameWithNoTooltip('anatolia_region')]で高まる[ShowCultureNameWithNoTooltip('turkish_culture')]の脅威"
 flavor_lat.2.entry: "アナトリアで高まるトルコの脅威"
 flavor_lat.2.desc: "[constantinople_location.GetName]を奪還する以前から、[ShowRegionName('anatolia_region')]の[GetCountry('BYZ').GetAdjectiveWithNoTooltip]領は、同地の[ShowCultureName('turkish_culture')]勢力による大きな脅威に直面していた。そうした[ShowCultureNameWithNoTooltip('turkish_culture')]軍閥のなかでも、[rising_turkish_country_ruler.GetName]は[ShowRegionNameWithNoTooltip('anatolia_region')]の諸領をまとめ上げる力を示しており、[ROOT.GetCountry.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[constantinople_location.GetNameWithNoTooltip]奪還に乗じて[ShowScriptedGeographyName('greece_geography')]への侵攻に踏み切るのではないかと恐れる者も多い。一方、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内には、むしろわが方の優勢を生かし、[ShowRegionNameWithNoTooltip('anatolia_region')]へ攻め込んで[ShowCultureNameWithNoTooltip('turkish_culture')]の[rising_turkish_country.GetFlavorRank]を弱体化させるべきだと、[scope_ruler.GetName]に進言する者たちもいる。"
 flavor_lat.2.a: "[rising_turkish_country.GetFlavorRank]を押し返せ！"
 flavor_lat.2.a.entry: "かの国を押し返せ！"
 flavor_lat.2.b: "慎重を期し、より守りを固めるべきだ。"
 flavor_lat.5.title: "[ShowRegionNameWithNoTooltip('anatolia_region')]の支配の再確立"
 flavor_lat.5.entry: "アナトリアの支配の再確立"
 flavor_lat.5.desc: "再興された[ROOT.GetCountry.GetLongName]にとって当初は難事と見られていたが、わが軍は[ShowRegionName('anatolia_region')]における支配の確立に向け、大きな前進を遂げた。[ShowRegionNameWithNoTooltip('anatolia_region')]にはいまなおいくつかの[ShowCultureName('turkish_culture')]国家が残っているものの、もはや[ROOT.GetCountry.GetNameWithNoTooltip]にとって大きな脅威とはならないだろう。"
 flavor_lat.5.a: "[ROOT.GetCountry.GetLongNameWithNoTooltip]に栄光あれ！"
 flavor_lat.5.a.entry: "我々に栄光あれ！"
 flavor_lat_anatolia_secured: "[ShowRegionName('anatolia_region')]にある、[ROOT.GetCountry.GetName]またはわが国の[subjects|e]が所有するすべての[location|e]が[modifier|e]「[ShowModifier('lat_improved_location_integration')]」を#Y 15#!年間得る"
 flavor_lat.6.title: "[target_country.GetNameWithNoTooltip]遠征の成功"
 flavor_lat.6.entry: "ブルガリアを撃破"
 flavor_lat.6.desc: "かつて[ROOT.GetCountry.GetLongName]にとって大きな脅威であった[target_country.GetLongName]は、いまや著しく弱体化し、旧領の多くも[ROOT.GetCountry.GetAdjective]の支配下に入った。[target_country.GetAdjectiveWithNoTooltip]の有力者層が再び勢力を立て直し、[ROOT.GetCountry.GetFlavorRank]への脅威となることは考えにくい。"
 flavor_lat.6.a: "旧[target_country.GetAdjectiveWithNoTooltip]領の統合を進めるべきだ。"
 flavor_lat.6.a.entry: "旧領の統合を進めるべきだ。"
 flavor_lat_balkan_rival_lands_secured: "[ShowRegionName('balkan_region')]にある、[target_country.GetName]の[core|e]であり、[ROOT.GetCountry.GetName]またはわが国の[subjects|e]が所有するすべての[location|e]が[modifier|e]「[ShowModifier('lat_improved_location_integration')]」を#Y 15#!年間得る"
 flavor_lat.7.title: "[target_country.GetAdjectiveWithNoTooltip]の野望を粉砕"
 flavor_lat.7.entry: "セルビアの野望を粉砕"
 flavor_lat.7.desc: "かねてより勢力を伸ばしていたが、[target_country.GetAdjective]の野望は[ROOT.GetCountry.GetAdjective]の兵によって打ち砕かれ、[target_country.GetNameWithNoTooltip]への遠征により、その力は削がれている。[ShowRegionName('balkan_region')]における[target_country.GetAdjectiveWithNoTooltip]の地位が一小勢力にまで落ちた以上、その野望をもはや憂慮する必要はない。"
 flavor_lat.7.a: "[target_country.GetNameWithNoTooltip]から奪還した諸州を速やかに安定させよ。"
 flavor_lat.7.a.entry: "奪還した諸州を速やかに安定させよ。"
 flavor_lat.8.title: "旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]有力者層"
 flavor_lat.8.entry: "旧ビザンツ有力者層"
 flavor_lat.8.desc: "[constantinople_location.GetName]が再び奪還されたことで、[ROOT.GetCountry.GetLongName]の再興が可能となっただけでなく、旧[GetCountry('BYZ').GetLongName]が再び興隆する望みも絶たれた。旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]有力者層の多くは、いまや不本意ながら[ROOT.GetCountry.GetNameWithNoTooltip]に臣従を誓っている。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]内では、[GetCountry('BYZ').GetLongNameWithNoTooltip]の時代はついに終わったと見る者も多い。そしていまこそ、[ROOT.GetCountry.GetLongNameWithNoTooltip]が世界の表舞台に立ち、独自の国家として歩み出す時だという声が強まっている。"
 flavor_lat.8.a: "旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]文化に幕を下ろす時だ。"
 flavor_lat.8.a.entry: "旧$BYZ_ADJ$文化に幕を下ろす時だ。"
 flavor_lat.8.b: "新たな[ROOT.GetCountry.GetFlavorRank]に[GetCountry('BYZ').GetAdjectiveWithNoTooltip]の遺産を受け継がせるべきだ。"
 flavor_lat.8.b.entry: "新たな国家に$BYZ_ADJ$の遺産を受け継がせるべきだ。"
 flavor_lat.9.title: "[pap_country.GetAdjectiveWithNoTooltip]からの[ShowReligionAdjectiveWithNoTooltip('orthodox')]諸領改宗要請"
 flavor_lat.9.entry: "教皇庁からのビザンツ諸領改宗要請"
 flavor_lat.9.desc: "[ROOT.GetCountry.GetLongName]の再興にあたって[pap_country.GetAdjective]の支援を受けた見返りとして、[pap_country.GetGovernment.GetRulerTitle]は、[constantinople_location.GetName]を奪還した暁には、新たな[ROOT.GetCountry.GetAdjectiveWithNoTooltip]有力者層が[ShowReligionAdjective('orthodox')]の影響力を弱め、[ShowReligionAdjective('catholic')]の立場を強める政策を講じるよう要請した。いまや[constantinople_location.GetNameWithNoTooltip]は再びわが国の手に戻り、[ROOT.GetCountry.GetLongNameWithNoTooltip]も再興された。[scope_pope_ruler.GetName]は、合意を履行し、これらの政策に着手するよう促している。"
 flavor_lat.9.a: "[scope_pope_ruler.GetShortNameWithNoTooltip]との合意を果たそう"
 flavor_lat.9.a.entry: "彼との合意を果たそう。"
 flavor_lat.9.b: "政策は実施するが、厳格な執行は避ける。"
 flavor_lat.9.c: "合意を破り、[ShowReligionAdjectiveWithNoTooltip('orthodox')]の信徒への寛容政策を取ろう。"
 lat_accepted_pope_latin_empire_proposal_tt: "ラテン帝国の復興の教皇の提案を受け入れた"
