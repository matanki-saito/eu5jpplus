l_japanese:
 flavor_luc.1.entry: "$flavor_luc.1.title$"
 flavor_luc.1.title: "[ShowLocationNameWithNoTooltip('lucca')]における[ShowGoodsNameWithNoTooltip('silk')]の生産"
 flavor_luc.1.desc: "[ShowGoodsName('silk')]は[ShowContinentName('europe')]でも特に希少な資源のひとつと考えられており、多くの[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]からは衣服に使う最高級の素材とみなされている。[ShowLocationName('lucca')]にはすでに蚕と、まだ発展途上ながら[ShowGoodsNameWithNoTooltip('silk')]産業が存在しているものの、その生産量はまだ十分に伸びていない。[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]はどちらも、これらへの投資によって[ShowGoodsName('fine_cloth')]生産を拡大でき、[ShowRegionName('italy_region')]で競おうとする者たちを上回れると見ている。"
 flavor_luc.1.a: "わが国は蚕に投資する。"
 flavor_luc.1.b: "利益が欲しいなら、自分たちで追えばいい。"
 flavor_luc.2.entry: "$flavor_luc.2.title$"
 flavor_luc.2.title: "[ShowLocationNameWithNoTooltip('lucca')]の [ShowGoodsNameWithNoTooltip('fine_cloth')]取引"
 flavor_luc.2.desc: "[ShowLocationName('lucca')]には、名高い[ShowGoodsName('fine_cloth')]産業がある。[ShowRegionName('italy_region')]には生産量でわが国をはるかに上回る都市も多いが、長年この産業に携わってきた優秀な[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が織り上げるわが国の布に並ぶ品質を誇る都市はない。極めて裕福な者たちでさえ、[ROOT.GetCountry.GetAdjective]様式の衣服を贅沢品とみなしており、その需要の高まりが生産拡大につながっている。"
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_luc.2.a.entry: "素晴らしい！"
 luc_fine_cloth_demand: "高級生地の需要"
 flavor_luc.3.entry: "$flavor_luc.3.title$"
 flavor_luc.3.title: "[ShowLocationNameWithNoTooltip('london')]への道"
 flavor_luc.3.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]のなかでも特に抜け目のない者たちが、[target_market.GetName]での事業拡大を思いついたようだ。具体的には、多くの者がすでに[ShowLocationName('london')]へ移り住む計画を立てている。あそこは[target_country.GetName]領であり、彼らはわが国に友好的でもある。\n\nこの提案は[ROOT.GetCountry.GetGovernment.GetCourtTitle]に持ち込まれ、一部の者は交易網の拡大に意欲を示している。しかしその一方では、[target_country.GetNameWithNoTooltip]の不信を招きかねないこと、外国の商人は歓迎されない可能性があること、そして競争よりも協力を追求するほうがわが国にとって有益だという指摘も上がっている。"
 flavor_luc.3.a: "わが国の交易網を拡大しよう。"
 flavor_luc.3.b: "競うのではなく、協力すべきだ。"
 flavor_luc.4.entry: "$flavor_luc.4.title$"
 flavor_luc.4.title: "リベルタス！"
 flavor_luc.4.desc: "[ROOT.GetCountry.GetName]の歴史を通じて、わが国の民は幾度となく敗北や屈辱を味わってきた。それでもなお、わが国は揺るがない。\n\n敗北を受け入れて倒れ伏すなど、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の民がすることではない。危機が訪れようと、戦場で軍が敗れようと、我らはいつでも[ShowLocationName('lucca')]を守る覚悟がある。"
 flavor_luc.4.a: "どんな状況でも恐れを見せはしない！"
 flavor_luc.4.b: "攻撃こそ最大の防御だ。"
 flavor_luc.5.entry: "$flavor_luc.5.title$"
 flavor_luc.5.title: "[ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
 flavor_luc.5.desc: "戦争や飢饉がつねに[ShowLocationName('lucca')]を襲うわけではない。だが、ひとたびそれが訪れれば、すべての市民が苦しむことになる。城壁の見張りたちは、敗北すれば故郷が危険にさらされることを知っており、昼夜を問わず敵の気配に目を光らせている。こうした状況を受け、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは防壁を拡張し、可能なかぎり壮大なものとすることで市民の安心と安全を確保すべきだと提案している。"
 flavor_luc.5.a: "防壁を拡張しよう。"
 flavor_luc.5.b: "軍が決して敗れることのないよう備えよう。"
 flavor_luc.1000.entry: "$flavor_luc.1000.title$"
 flavor_luc.1000.title: "[GetCountry('LUC').GetNameWithNoTooltip]の買収"
 flavor_luc.1000.desc: "[target_country.GetName]がいま戦っている戦争は、わが国が宗主国を変える好機となっている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは、軍事的手段によってそれを成し遂げるのではなく、金銭的利益と誠意の証を兼ねてわが国を[GetCountry('PIS').GetName]に売却するという案を提示している。"
 flavor_luc.1000.a: "この案を[target_country.GetNameWithNoTooltip]に提示しよう。"
 flavor_luc.1000.a.entry: "この案を宗主国に提示しよう。"
 flavor_luc.1000.b: "独立を望むなら、戦うしかない。"
 flavor_luc.1001.title: "$flavor_luc.1000.title$"
 flavor_luc.1001.desc: "[enemy_country.GetName]との戦争が激しさを増すなか、[GetCountry('LUC').GetName]の外交官が到着した。彼らは戦況について語り、さらに[GetCountry('PIS').GetName]がわが国への軍事介入に向けて戦闘態勢を整えていることを伝えてきた。これを食い止めるため、彼らは和平の見返りとして——そして自分たちの懐を潤すために——[GetCountry('LUC').GetNameWithNoTooltip]そのものを差し出すと申し出てきた。"
 flavor_luc.1001.a: "わが国は[ShowRegionNameWithNoTooltip('italy_region')]で新たな敵を作るべきではない。"
 flavor_luc.1001.b: "わが国の従属国を売るつもりはない。"
 flavor_luc.1002.title: "$flavor_luc.1000.title$"
 flavor_luc.1002.desc: "[target_country.GetName]が、わが国にある話を持ちかけてきた。従属国である[GetCountry('LUC').GetName]を、わが国に売り渡したいというのだ。その見返りとして、停戦協定を結び、さらに現在進行中の[enemy_country.GetName]との戦争に介入しないことを求めている。"
 flavor_luc.1002.a: "悪くない取引だ。"
 flavor_luc.1002.b: "軍事力で奪えるものを、金で買う必要があるだろうか。"
 flavor_luc.1100.entry: "$flavor_luc.1100.title$"
 flavor_luc.1100.title: "互恵的な同盟"
 flavor_luc.1100.desc: "わが国の[ShowRegionName('italy_region')]での立場は安定しているものの、注意を怠れば外部からの脅威にさらされる可能性がある。そのため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは、[GetCountry('GEN').GetName]と同盟を結ぶべきだと進言している。この同盟は双方に利益をもたらし、この地域を狙う者に対してより大きく結束した勢力として立ちはだかることになるだろう。"
 flavor_luc.1100.a: "そのような同盟なら理想的だ。"
 flavor_luc.1100.b: "むしろ領土を広げて国境を固めるべきだ。"
 flavor_luc.1101.title: "$flavor_luc.1100.title$"
 flavor_luc.1101.desc: "[ShowRegionName('italy_region')]では緊張が高まり、多くの国々が敵に対して単独で対処せざるを得ない状況にある。だが、だからといって孤立したままでいるべきだということはない。まさにその理由から、[from_country.GetName]の外交官が同盟の可能性についてわが国に接触してきた。この同盟が結ばれれば、[target_character.GetName]と[target_character2.GetName]は主権を守りつつ、地域外からの脅威に対して互いに協力して立ち向かうこともできるだろう。"
 flavor_luc.1101.a: "たしかに双方にとって悪くない話だ。"
 flavor_luc.1101.b: "助ける価値などない。むしろ征服を視野に入れるべきだ……"
