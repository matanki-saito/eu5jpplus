l_japanese:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "けっこうだ。"
 flavor_tun.1.b: "そのような無為な出費などしない！"
 tun_have_more_gp_score_than_us: "[THIS.GetCountry.GetName]より[great_power_score|e]の多い[ShowReligionAdjective('sunni')][country|e]がない"
 flavor_tun.2.caliphal_backstory: "[GetCountry('ALM').GetAdjective]カリフ朝の崩壊に伴って、わが国は形成された。当時、[ShowDynastyName('hafsid_dynasty')]朝の創始者である尊きアブー・ザカリヤーは「アミール・アル＝ムーミニーン」の称号を主張して$rank_empire_muslim_ruler_male$の役割を引き受け、事実上の独立を宣言した。この主張は[ShowCountryNameIfActive('GRA')]の[ShowDynastyName('nasrid_dynasty')]や、ほかの[ShowCultureName('andalusi')]の街の指導者たちによって即座に承認された。[ShowCountryNameIfActive('TLE')]や[ShowCountryNameIfActive('MOR')]の国家が成立した際にも、その国々は速やかに我々の主張を認めた。我々の権威は聖地[ShowLocationName('mecca')]に至るまで尊重され、アッバース朝が最近モンゴル勢の手で滅亡したことを受けて、シャーリフが1259年に我々のカリフ国としての主張を承認した。"
 flavor_tun.2.title: "カリフ国の失墜"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nだがその栄光も過去のもので、わが国の内政問題により[ROOT.GetCountry.GetGovernment.GetRulerTitle]の権威は大きく失墜し、もはや$rank_empire_muslim_ruler_male$も名ばかりに過ぎない。我々は[ROOT.GetCountry.GetLongName]にカリフの権威を取り戻さねばならない！"
 flavor_tun.2.a: "我々への敬意を払わせるのだ！"
 flavor_tun.2.b: "称号を捨て去ろう。"
 tun_caliphate_decision_enabled: "[decision|e]「[ShowDecisionName('hafsid_caliphate_decision')]」が有効になる"
 flavor_tun.3.title: "カリフの権威の回復"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nその後の1世紀で権威は衰えたものの、我々は[ROOT.GetCountry.GetLongName]を喪失の瀬戸際から救い出した。[ROOT.GetCountry.GetFlavorRank]は、再び[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]世界の主要国家のひとつになったのである。"
 flavor_tun.3.a: "ウンマを正しく導いていこう！"
 hafsid_caliphate_name_tt: "わが国の名に#Y カリフ国#!の称号が加わる"
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.desc.entry: "我々は[GetCountry('ALM').GetAdjective]カリフ国の正統な後継としての地位を確立できなかった。このような不面目は看過できない！[ShowReligionAdjective('sunni')]共同体の指導者としての地位を取り戻さねば！"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
 flavor_tun.4.title: "[aging_monarch.GetNameWithNoTooltip]の継承"
 flavor_tun.4.entry: "[GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]の継承"
 flavor_tun.4.desc: "[aging_monarch.GetName]は老齢の君主として、陰鬱ながら何よりも重要な決断、つまり後継者の指名で日増しに頭を悩ませている。敬愛するわが[ROOT.GetCountry.GetGovernment.GetRulerTitle]の寵子[preferred_heir.GetName]がいるため、その指名に疑いはないはずだった。問題は、[ROOT.GetCountry.GetCapital.GetName]で政府を支援する[future_usurper.GetName]や、僭称者になりえる[target_country2.GetName]の[third_way.GetName]と、ほかの子供たちにある。\n\nこの決断は[aging_monarch.GetShortNameWithNoTooltip]の死後長きにわたり、[ROOT.GetCountry.GetLongName]の安定に重大な影響を与えることになる。"
 flavor_tun.4.a: "[target_country.GetNameWithNoTooltip]の[preferred_heir.GetNameWithNoTooltip]に後を継がせよ。"
 flavor_tun.4.a.entry: "$GFS$の[GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip]に後を継がせよ。"
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip]が無難だろう。"
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip]が無難だろう。"
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip]は領土の統一に貢献してくれるだろう。"
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip]は領土の統一に貢献してくれるだろう。"
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName]が[ROOT.GetCountry.GetName]の[heir|e]に指名される"
 TUN_unite_two_realms_tt: "[THIS.GetCharacter.GetName]は[THIS.GetCharacter.GetCourtCountry.GetName]の[ShowSubjectTypeName('familial_governor')]の[ruler|e]であるため、王位を継承した際に両国家が統合される"
 TUN_civil_war_from_preferred_heir_tt: "[preferred_heir.GetName]は本命の後継者であるため、[ShowEstateTypeName('tribes_estate')]を後ろ盾にすぐさま[war|e]を起こし、[ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')]にあるわが[locations|e]が離反することになる"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName]が[THIS.GetCharacter.GetName]の王位を簒奪するかもしれない"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]が[from_country.GetName]の王位を継承し、簒奪が起こらなければ[from_country.GetAdjectiveWithNoTooltip]の旗のもとに両国家が統合される"
 flavor_tun.5.title: "[from_country.GetNameWithNoTooltip]での指名"
 flavor_tun.5.desc_positive: "素晴らしい報せだ！ [from_country.GetLongName]の[aging_monarch.GetName]が、[preferred_heir.GetName]を[from_country.GetFlavorRank]の後継者に指名した。[preferred_heir.GetShortNameWithNoTooltip]は長らく後継者と目されていたため、驚きではない。このような指導者を戴く[ShowScriptedGeographyName('ifriqiya_geography')]の未来は明るいだろう。"
 flavor_tun.5.desc_negative: "なんということだ！ 前代未聞の事態で、[from_country.GetName]の[aging_monarch.GetName]が後継者に[appointed_heir.GetName]を指名した。[ShowScriptedGeographyName('ifriqiya_geography')]では[preferred_heir.GetName]が最も人気で、順当な後継者だと知られていたため、[appointed_heir.GetNameWithNoTooltip]が継承者に選ばれた裏には不正があったに違いない。"
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip]はこれを黙って受け入れはしない！"
 flavor_tun.5.c: "受け入れるしかない。"
 flavor_tun.6.title: "予想どおりの反応"
 flavor_tun.6.desc: "予想どおり、[appointed_heir.GetName]の指名は[preferred_heir.GetName]にとって承服しがたく、ただちに抗議の声を上げた。[ShowEstateTypeName('tribes_estate')]の後押しを受けた[target_country.GetName]は、[ROOT.GetCountry.GetName]の王位をめぐって宣戦布告し、[preferred_heir.GetShortNameWithNoTooltip]の軍勢が[ROOT.GetCountry.GetCapital.GetName]へ向かっている。"
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "この状況で[target_country.GetName]が[war|e]を選んだ場合："
 flavor_tun.7.title: "継承の簒奪！"
 flavor_tun.7.desc: "[target_character2.GetName]を[from_country.GetLongName]の継承者に指名したにもかかわらず、反抗的なきょうだいの[target_character.GetName]は首都における現在の立場を利用して[from_country.GetFlavorRank]の権力を掌握しようとしている。[target_country.GetName]の[target_character2.GetShortNameWithNoTooltip]が激怒し、[target_character2.GetSisterBrother]に対して武器を取ることは間違いないだろう。"
 flavor_tun.7.a: "早い者勝ちだ。"
 flavor_tun.7.b: "言語道断だ！不公平だ！"
 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "[from_country.GetLongName]における[target_character2.GetName]の継承権が、[target_character.GetSisterBrother]の[target_character.GetName]に簒奪された。[target_character.GetShortNameWithNoTooltip]は素早く[from_country.GetFlavorRank]の権力を掌握し、[from_country.GetGovernment.GetCourtTitle]を服従させた。\n\n[target_character2.GetShortNameWithNoTooltip]には耐えがたい屈辱である。我々は[target_character.GetShortNameWithNoTooltip]を罰しなければならない。"
 flavor_tun.8.a: "戦争だ！"
 flavor_tun.8.b: "戦う余裕はない。"
 flavor_tun.10.title: "首長制"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')]は無法と堕落の巣窟である。1世紀近くにわたり[ROOT.GetCountry.GetLongName]と[ShowDynastyName('hafsid_dynasty')]傘下の勢力は都市の外に支配を及ぼせず、農村部の州では広範囲にわたる動乱と犯罪を招いている。しかし[ShowCultureName('andalusi')]の名士や[ShowEstateTypeName('nobles_estate')]の有力なシェイクたちのあいだに、希望の光が広がっている。ひとりの地域の首長が[ShowAreaName('tunis_area')]全体を治めて再び繁栄へと導く未来を掲げる、首長制の理念である。"
 flavor_tun.10.a: "[ROOT.GetCountry.GetReligion.GetGodName]よ、光を示したまえ。"
 flavor_tun.10.a.entry: "$muslim_god_name$よ、光を示したまえ。"
 tun_info_about_tunis_decentralization: "我々は速やかに[government_reform|e]「[ShowGovernmentReformName('tun_strong_familial_governors')]」を撤廃する。"
 tun_additional_benefits_for_farfanes_tt: "我々の[ShowUnitDefinitionName('a_farfanes')]数に応じて、[ShowGovernmentReformName('catalan_merchant_privileges')]が我々の[ShowModifierTypeName]に恩恵をもたらす"
 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')]の再統一"
 flavor_tun.11.desc: "[ROOT.GetCountry.GetLongName]の分権化の課題が抜本的に解決された。[ShowGovernmentReformName('tun_strong_familial_governors')]の時代は終わり、[ShowScriptedGeographyName('ifriqiya_geography')]の全土が[ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]の旗のもとに再び統一された。これで[ROOT.GetCountry.GetAdjectiveWithNoTooltip]農村部が犯罪に脅かされることはなく、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の首長たちが[ShowEstateTypeName('nobles_estate')]に脅迫されることもなく、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]国家が諸外国の支援に依存することもない。\n\n旧秩序が清算の時を迎え、我々が新時代を切り拓く絶好の機会だ。"
 flavor_tun.11.a: "新時代の夜明けだ。"
 flavor_tun.11.b: "新たなアイデンティティの誕生だ。"
 IFRIQIYA_NAME: "イフリーキヤ"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.desc.entry: "[ShowScriptedGeographyName('ifriqiya_geography')]はあまりにも長きにわたりさまざまな国家に分かれ、その多くが[ShowDynastyName('hafsid_dynasty')]家の分家に支配されてきた。我々はこの分権化に終止符を打たなければならない。"
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
 flavor_tun.12.title: "[ShowLocationNameWithNoTooltip('bejaia')]での海賊行為の拡大"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "近年、[target_location.GetName]では、きわめて異例ながら生産性の高い産業、海賊行為が[ShowScriptedGeographyName('mediterranean_sea_geography')]で拡大を見せている。地元のシェイクたちはこの何十年、[ShowBuildingTypeName('pirate_haven')]や、交易関係のある[ShowReligionGroupAdjective('christian')]の村々への露骨な襲撃を広く支援してきた。このような襲撃は潜在的な交易相手との関係を著しく害するが、[ShowPolicyName('state_piracy_policy')]から得る利益は計り知れない。"
 flavor_tun.12.a: "奴らは[ROOT.GetCountry.GetReligion.GetGodName]の敵だ！"
 flavor_tun.12.a.entry: "奴らは$muslim_god_name$の敵だ！"
 flavor_tun.12.b: "どうでもいい。"
 flavor_tun.12.c: "海賊行為は我々のためにはならない。"
 flavor_tun.13.title: "経済的な締め付け"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "[ROOT.GetCountry.GetName]の[ShowReligionGroupAdjective('christian')]商人は、すでに広範な[ShowGovernmentReformName('catalan_merchant_privileges')]を享受している。わが国が居住区を惜しみなく与え、自治権や宗教の自由を認めたにもかかわらず、[target_country.GetAdjective]の[target_country.GetGovernment.GetEstateName('burghers_estate')]は、さらなる要求を突きつけてきている。応じなければ、相手国はわが国との取引を停止する恐れがある。"
 flavor_tun.13.a: "傭兵たちはあまりに重要だ。"
 flavor_tun.13.b: "ふん！ 連中の助けなど必要ない。"
 tun_economic_stranglehold_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')]の[ShowModifierTypeName('global_merchant_power')]が#R -10.0%#!低下する"
 flavor_tun.14.title: "親族の要求"
 flavor_tun.14.desc: "[ShowDynastyName('hafsid_dynasty')]家の王子のひとり[target_character.GetName]が勢力を強め、[ShowSubjectTypeName('familial_governor')]の役職を要求してきた。これを聞き入れて[target_character.GetNameWithNoTooltip]に[target_location.GetName]を与えなければ、[ROOT.GetCountry.GetLongName]で波乱が生じることは避けられない。"
 flavor_tun.14.a: "[target_character.GetHerHim]にくれてやれ！"
 flavor_tun.14.b: "いまはその時ではない。"
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName]は[ShowSubjectTypeName('familial_governor')]になることを望んでおり、[ShowCharacterInteractionName('assign_familial_governor')]によってその役職を与えられるまで、この[event|e]が発生しつづける可能性がある"
 flavor_tun.15.title: "継承問題"
 flavor_tun.15.desc: "老齢の[old_ruler.GetName]の死去により、[ROOT.GetCountry.GetCapital.GetName]に権力の空白が生じた。名目上は[new_ruler.GetName]が[ROOT.GetCountry.GetName]の総督の職を引き継ぐが、継承が保証されているとは言い難い。[target_character2.GetName]を後継にしたい民衆が、正体不明の支援者の後押しを受けて反乱し、現在首都を行進している。正統な後継者を支持すべきか、[ShowEstateTypeName('burghers_estate')]の意思を受け入れるべきか？"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip]が正統な後継者だ！"
 flavor_tun.15.b: "反乱者たちの声に耳を傾けねばならない。"
 flavor_tun.16.title: "[target.GetNameWithNoTooltip]の継承"
 flavor_tun.16.desc: "[new_ruler.GetName]の即位に伴い、[target.GetLongName]と[ROOT.GetCountry.GetName]の両国家は再び[ShowDynastyName('hafsid_dynasty')]家の統治者のもとに統一された。[ShowScriptedGeographyName('ifriqiya_geography')]も近く再統一され、深刻な[ShowSocietyDirectionName('decentralization')]に苦しむことがなくなることを望もう。"
 flavor_tun.16.a: "統一へとさらに一歩近づいた。"
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName]が[ROOT.GetCountry.GetName]に[annexed|e]された"
 flavor_tun.17.title: "[from_country.GetNameWithNoTooltip]の継承問題"
 flavor_tun.17.desc: "[from_country.GetCapital.GetName]の[from_country.GetGovernment.GetEstateName('burghers_estate')]の十分な支持を得た[target_character2.GetShortNameWithNoTooltip]が国家の名目上の統治者となり、事実上[new_ruler.GetNameWithNoTooltip]から正統な継承権を、そしてその指導力を我々から奪った。"
 flavor_tun.17.a: "こんなことは許されん！"
 flavor_tun.17.b: "懸念はもっとほかにある。"
 flavor_tun.18.title: "[ShowCultureNameWithNoTooltip('andalusi')]の名士"
 flavor_tun.18.desc: "[target_character.GetBirthLocation.GetArea.GetName]で生まれ育った地元[ShowCultureName('andalusi')]の[target_character.GetWomanMan]が最近昇進を果たし、[ROOT.GetCountry.GetCapital.GetName]の[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]に入った。[target_character.GetName]はいずれ、わが[ROOT.GetCountry.GetFlavorRank]の[ShowEstatePrivilegeName('andalusi_elite')]の一員になるだろう。"
 flavor_tun.18.a: "見事だ！"
 flavor_tun.19.title: "新たな後継者か？"
 flavor_tun.19.desc: "[ROOT.GetCountry.GetCapital.GetName]で最近、ある噂話が広まっている。[ROOT.GetCountry.GetCapital.GetRank.GetName]が[target_character2.GetName]の統治を検討しており、さらにその後継者に最適な人物は誰か、というものだ。[ShowEstateTypeName('burghers_estate')]は[ROOT.GetCountry.GetName]の王座の正統な後継者として目される[target_character.GetName]を選出した。もっぱら[ShowEstateTypeNameWithNoTooltip('burghers_estate')]は、特権や追加の権利を与えるという[target_character.GetNameWithNoTooltip]の寛大な約束に心を動かされたという話だ。"
 flavor_tun.19.a: "いいだろう、[target_character.GetNameWithNoTooltip]を任命せよ。"
 flavor_tun.19.b: "これを信じるとは、愚か者どもめ。"
