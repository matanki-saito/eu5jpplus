l_japanese:
 flavor_byz_ser.1.title: "強力な専制君主"
 flavor_byz_ser.1.entry: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.1.desc: "[ROOT.GetCountry.GetAdjective]の[ShowProvinceDefinitionName('vardar_province')]を支配しているのは、名高い有力者[target_character.GetName]だ。[target_character.GetSheHe]は大きな影響力をもち、独立同然の立場にある。いまのところ[ROOT.GetCountry.GetFlavorRank]に忠誠を示してはいるが、これほどの富と権勢をもつ者が宗主に長く従いつづけることはほとんどない。\n\n噂では、[target_character.GetNameWithNoTooltip]は宗主への臣従を捨て、[target_country2.GetLongName]あるいは[target_country3.GetLongName]で新たな地位を求めているという。"
 flavor_byz_ser.1.a: "このような離反があるからこそ、[ROOT.GetCountry.GetGovernment.GetRulerTitle]にもっと権力が必要なのだ。"
 flavor_byz_ser.1.a.entry: "Such dissidence is why we need more power in the hands of the ruler."
 flavor_byz_ser.1.b: "[target_character.GetHerHis]の忠誠をつなぎとめねばならない。"
 flavor_byz_ser.1.b.entry: "We must secure his loyalty."
 flavor_byz_ser.2.title: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.2.entry: "$flavor_byz_ser.2.title$"
 flavor_byz_ser.2.desc: "[ShowProvinceDefinitionName('vardar_province')]地方は、かつて強大なる[ROOT.GetCountry.GetLongName]に属していたが、久しく蛮族の手に落ちている。だがいま、長い歳月を経て、思いがけぬ味方の力を借りて、これを再び我らのものとする機会がめぐってきたのかもしれない。\n\n[origin_country.GetName]を治める[target_country.GetAdjective]の有力者[target_character.GetName]は、何を優先すべきかをよく心得ているように見える。表向きは[target_country.GetLongNameWithNoTooltip]に忠誠を示しているものの、諜報員の報告によれば、その忠誠は移ろいやすく、多少の裏工作によって我らの側へ引き入れることができそうである。"
 flavor_byz_ser.2.a: "金を惜しみなく与えよ！"
 flavor_byz_ser.2.a.entry: "Shower him with gold!"
 flavor_byz_ser.3.title: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.3.entry: "$flavor_byz_ser.3.title$"
 flavor_byz_ser.3.desc: "かつて[target_country2.GetAdjective]の血なまぐさい内戦で名を上げた[target_character.GetName]は、いまや[ROOT.GetCountry.GetAdjective]の[ShowProvinceDefinitionName('vardar_province')]で大きな権勢をふるっている。[target_country.GetName]の[ShowSubjectTypeName('vassal')]ではあるが、[target_country.GetNameWithNoTooltip]の[ShowSocietyDirectionName('decentralization')]のため、ほとんど独立状態にあり、この地の行く先を左右する存在となりつつある。"
 flavor_byz_ser.3.a: "権力は人を堕落させる。専制の権力なら、なおさらだ。"
 SER_threat_of_secession: "#W 1341年#!初頭に[origin_country.GetName]の[subject_loyalty|e]が#Y 50.0%#!未満の場合、[origin_country.GetName]は[target_country2.GetName]に忠誠を誓い、その[ShowSubjectTypeName('vassal')]となる"
 SMC_player: "[origin_country.GetName]は人間のプレイヤーが操作しているため、最終的な決定はそれぞれの[event|e]での選択次第となる"
 BYZ_threat_of_secession: "#W 1341年#!初頭に[origin_country.GetName]の[subject_loyalty|e]が#Y 50.0%#!未満の場合、[origin_country.GetName]は[ROOT.GetCountry.GetName]に忠誠を誓い、その[ShowSubjectTypeName('vassal')]となる"
 SMC_threat_of_secession: "#W 1341年#!になると、[target_country2.GetName]の[ShowSubjectTypeName('vassal')]となることを選択できる。[subject_loyalty|e]によっては、どちらを選ぶかに応じて[stability|e]を失う場合がある"
 flavor_byz_ser.4.title: "決断の時"
 flavor_byz_ser.4.entry: "$flavor_byz_ser.4.title$"
 flavor_byz_ser.4.desc: "歳月が流れ、そのあいだ[ROOT.GetCountry.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]には[target_country2.GetAdjective]の使節がたびたび訪れてきた。彼らの狙いは、我々を[target_country.GetName]から引き離し、南方の[target_country2.GetFlavorRank]へ引き寄せることにある。だが、我らはその干渉の意図を見抜いており、甘言にたやすく動かされはしない。最終的に決めるのは我ら自身であり、いずれの国に与するにせよ、その選択はこの先数十年にわたって[ShowRegionName('balkan_region')]に影響を及ぼすことになる。"
 flavor_byz_ser.4.a: "我らの忠誠は揺るがない。"
 flavor_byz_ser.4.b: "変わるべき時だ。"
 flavor_byz_ser.5.title: "[origin_country.GetLongNameWithNoTooltip]の運命"
 flavor_byz_ser.5.desc: "[origin_country.GetAdjective]の離反をめぐる噂は絶えなかったが、実のところ、有力者たちと[target_country.GetAdjective]を結ぶ[ShowCultureName('serbian_culture')]の絆は、彼らの欲よりも深かった。[target_country2.GetAdjective]の干渉があっても、[origin_country.GetNameWithNoTooltip]の[origin_country.GetGovernment.GetRulerTitle]は揺れ動かず、[origin_country.GetNameWithNoTooltip]は今後も[target_country.GetLongNameWithNoTooltip]の一部にとどまる。"
 flavor_byz_ser.5.byz: "いつの日か、再び我らの手に……"
 flavor_byz_ser.5.ser: "予想どおりだ。"
 flavor_byz_ser.6.title: "$flavor_byz_ser.5.title$"
 flavor_byz_ser.6.desc: "[target_country.GetName]と[target_country2.GetLongName]のあいだで外交上の対立が発生し、極めて異例の事態が起こった。[origin_country.GetName]の領主たちが[target_country2.GetNameWithNoTooltip]に味方し、かつての主君の敵に忠誠を誓ったのである。有力者が宗主を裏切るほどの大胆さを見せることは、そうあるものではない。\n\n[origin_country.GetNameWithNoTooltip]の[origin_country.GetGovernment.GetRulerTitle]は、[ShowProvinceDefinitionName('vardar_province')]の行く末を決した。もはや[origin_country.GetNameWithNoTooltip]が[target_country.GetNameWithNoTooltip]に従うことはない。その未来は[target_country2.GetNameWithNoTooltip]とともにある。"
 flavor_byz_ser.6.byz: "賢明な選択だ。"
 flavor_byz_ser.6.ser: "この代償は高くつくぞ！"
 SMC_remains_vassal_of_serbia: "[origin_country.GetName]は[target_country.GetName]の[ShowSubjectTypeName('vassal')]でありつづける"
