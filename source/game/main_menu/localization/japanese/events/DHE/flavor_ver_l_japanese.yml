l_japanese:
 VER_benefits_from_winning_the_war: "[target_war.GetName]において、[peace_offer|e]「[ShowPeaceTreatyTypeName('scaligeri_victory')]」が選択可能になる"
 ver_remove_antagonism: "[peace_treaty|e]の要求から発生した、すべての[countries|e]に対する[THIS.GetCountry.GetName]の[antagonism|e]が解消される"
 ver_add_integration_in_every_location: "[ShowScriptedGeographyName('scaligeri_conquests_geography')]のすべての[owned|e][location|e]の[integration|e]が#G 100.0%#!増加する"
 SCALIGER_WAR_NAME: "スカラ家戦争"
 ver_demands_start: "我々は[target_war.GetName]における和平協定の一環として、"
 ver_demands_end: "を要求する。"
 ver_demands_FLO_pescia_demand: "$ver_demands_start$[ShowLocationName('pescia')]$ver_demands_end$"
 ver_demands_FLO_lucca_demand: "$ver_demands_start$[ShowProvinceDefinitionName('lucca_province')]$ver_demands_end$"
 ver_demands_VEN_mestre_demand: "$ver_demands_start$[ShowLocationName('mestre')]$ver_demands_end$"
 ver_demands_VEN_treviso_demand: "$ver_demands_start$[ShowProvinceDefinitionName('venice_province')]$ver_demands_end$"
 ver_demands_MLO_brescia_demand: "$ver_demands_start$[ShowProvinceDefinitionName('brescia_province')]$ver_demands_end$"
 ver_demands_MLO_parma_demand: "$ver_demands_start$[ShowProvinceDefinitionName('parma_province')]$ver_demands_end$"
 ver_effect_depends_on_scope: "この[peace_treaty|e]の効果は、[event|e]での選択によって決まる"
 VER_benefits_for_coalition_members: "[target_war.GetName]の攻撃側には、さまざまな国境地帯にて権利を主張するための[events|e]が発生する。これ以外の手段で領土を奪うことはできない。"
 VER_cannot_take_territory_besides_scripted_peace_deal: "領土を奪うには特別な和平条約を結ぶ必要がある。条約はスカラ家戦争の進行中に[events|e]を通じ締結できる。"
 scaligeri_war_historical_info: "スカラ家戦争は、スカラ家とヴェネツィア間で摩擦が生じた結果、1336年の半ばごろに勃発した。事の発端は、ヴェローナが通行料の徴収を目的として鎖を設置し、それによってヴェネツィアの商業が直接的に脅かされたことだった。問題を平和的に解決するための交渉がおこなわれたものの、ヴェネツィア議会側が態度を硬化させ、塩の輸出を止めたため、スカラ家領パドヴァは独自の製塩所を作るに至った。争いは最終的に、フィレンツェとヴェネツィアのあいだで協定が結ばれ、前者が戦争費用の2/3を負担するとの内容で合意した6月22日に開始された。"
 flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.1.desc: "我らが[target_character.GetName]の流した血と汗の結晶たる[target_dynasty.GetName]領が、近年になって[ShowRegionName('italy_region')]北部の弱小国からなる大連合の標的となった。初めは[GetCountry('VEN').GetLongName]と[GetCountry('FLO').GetLongName]が手を組んでいただけだったが、平和を築こうとした我々の直近の努力は、我々の敵側につくとの判断をくだした調停者たちによって裏切られてしまった。だが、そんな些末なことはどうでもいい。奴らにも犯した罪に見合った厳しい罰を受けてもらうとしよう。"
 flavor_ver.1.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.1.a: "力なき者たちは間引かれるまでだ。"
 flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.2.desc: "好戦的な[target_dynasty.GetName]家が、[anti_scaligeri_leader.GetLongName]率いる大連合の最初の標的となった。我々なら[target_war.GetName]の形勢を変えられるはずだが、それを実現するには新たにできた同盟各国の協力が必要となる。[mlo_participant.GetAdjective]の[mlo_army.GetName]が[target_ver.GetName]との国境沿いに結集しつつあり、[flo_participant.GetLongName]が戦費をまかなっている。そしてわが国からも[target_character.GetName]率いる軍隊が出撃する。[target_ver.GetAdjectiveWithNoTooltip]の敵はすぐに退けられ、[ShowRegionName('italy_region')]に再び平和が訪れるだろう。"
 flavor_ver.2.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.2.a: "悪魔のスカラ家を粛清するのだ！"
 ver_owner_is_an_defender: "[THIS.GetLocation.GetName]の[owner|e]は[target_war.GetName]における[defender|e]の国家である"
 ver_controller_is_an_attacker: "[THIS.GetLocation.GetName]の[controller|e]は[target_war.GetName]における[attacker|e]の国家である"
 flavor_ver.3.title: "[target_province.GetNameWithNoTooltip]の領有権の主張"
 flavor_ver.3.desc: "[target_dynasty.GetName]を相手取った[target_country.GetName]での[target_war.GetName]は順調に進んでいる。わが軍はつい先日、[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName]の勢力圏内にあった[target_province.GetName]の制圧に成功した。我々が[target_dynasty.GetNameWithNoTooltip]領を欲していることが[war_leader.GetName]にいる同盟各国に伝わるよう、領有権の主張をしておくべきかもしれない。"
 flavor_ver.3.entry: "スカラ家戦争における$MLO_ADJ$の要求"
 flavor_ver.3.a: "領有権を主張する。"
 flavor_ver.3.b: "それより[ShowProvinceDefinitionNameWithNoTooltip('parma_province')]はどうだ？"
 flavor_ver.4.title: "[target_location.GetNameWithNoTooltip]の領有権の主張"
 flavor_ver.4.desc: "我々はいま、我々自身と同盟各国の尽力によって、北[ShowRegionName('italy_region')]における[target_dynasty.GetName]の覇権が終わる様を目撃している。戦での勝利に伴い、1336年に戦費の2/3を負担することを約束した[ROOT.GetCountry.GetLongName]は、この度の戦いにおける要求を提示してくるだろう。我々の要求はただ一つ、長らく[ShowLocationName('florence')]の宗主権を否定しつづけてきたスカラ領[target_country.GetName]以外にない。"
 flavor_ver.4.entry: "スカラ家戦争における$FLO_ADJ$の要求"
 flavor_ver.4.a: "[ShowLocationNameWithNoTooltip('pescia')]の所有権を主張する。"
 flavor_ver.4.b: "[target_country.GetCapital.GetRank.GetNameWithNoTooltip]のすべてが我々のものだ！"
 flavor_ver.4.b.entry: "この街のすべてが我々のものだ！"
 flavor_ver.5.title: "[target_province.GetNameWithNoTooltip]の領有権の主張"
 flavor_ver.5.desc: "戦争とは果たして、その対価に見合った行為なのだろうか……\n\n多くの血を流し、数々の苦労を乗り越えてきたものの、明確に我々の利益になりそうな希望がいまになってようやく少しだけ見えてきた。この戦の目的は、公には[target_dynasty.GetName]の国を解体することにあったはずだが、その過程で我々は、彼ら自身が同じように血生臭い戦いを経た果てに手に入れた領土を手中に収めようとしている。我々の領土を拡張する潜在的候補として挙げられるのは、文化的に[ROOT.GetCountry.GetFlavorRank]の一部である[target_location.GetName]や[target_province.GetName]だ。"
 flavor_ver.5.entry: "スカラ家戦争における$VEN_ADJ$の要求"
 flavor_ver.5.a: "[target_location.GetNameWithNoTooltip]は我々のものだ！"
 flavor_ver.5.a.entry: "メストレは我々のものだ！"
 flavor_ver.5.b: "[target_province.GetNameWithNoTooltip]をテッラフェルマにおける拠点とする。"
 flavor_ver.5.b.entry: "ヴェネト州のヴェローナをテッラフェルマにおける拠点とする。"
 flavor_ver.6.title: "[from_country.GetNameWithNoTooltip]の主張"
 flavor_ver.6.desc: "[from_country.GetLongName]からの使者が我々のもとにやって来て、[target_dynasty.GetName]に対する[war_enemy.GetName]の要求を知らせてきた。我々は[target_war.GetName]の講和条件と並行して、[target_peace_treaty.GetName]についても検討するべきだ。さもなければ、[from_country.GetAdjectiveWithNoTooltip]の使者たちに約束を反故にしたと受け取られかねない。"
 flavor_ver.6.a: "彼らの要求に適宜応じていくとしよう。"
 ver_peace_treaty_has_become_available: "[target_war.GetName]において、[target_peace_treaty.GetName]を結べるようになった"
 flavor_ver.7.title: "我々の勝利"
 flavor_ver.7.desc: "何年にもわたる血生臭い争いのすえ、$SCALIGER_WAR_NAME$がようやく終わりを迎えた。今日、[ROOT.GetCountry.GetAdjective]軍は[target_location.GetName]にて勝利を収め、我々の敵は敗北したのだ。この度の戦争は、単に[ShowRegionName('italy_region')]北部の覇権をかけた戦いだっただけでなく、現在[ROOT.GetCountry.GetLongName]の名で知られる国の創設者たる[target_character.GetName]の名誉を守るための戦いでもあった。今回我々が守ったのは、[target_character.GetHerHis]が今日まで引き継いだ遺産なのである。"
 flavor_ver.7.a: "[target_dynasty.GetNameWithNoTooltip]に栄光あれ！"
 flavor_ver.8.title: "同盟の勝利"
 flavor_ver.8.desc: "[target_dynasty.GetName]の侵略者たちの運命がついに決した。悪魔のスカラ家が敗北を喫し、[target_character.GetName]の領土も壊滅状態だ。[ShowRegionName('italy_region')]北部はもはや、一人の暴君が支配する地域ではなくなった。今日という日は、[ROOT.GetCountry.GetName]の歴史における極めて重要な瞬間の一つとして記憶されることになるだろう！"
 flavor_ver.8.a: "厄介払いができた！"
 flavor_ver.1000.title: "[target_character2.GetNameWithNoTooltip]の親族"
 flavor_ver.1000.desc: "失脚した[target_country.GetName]の支配者にして、[target_character2.GetName]の親族である[target_character.GetName]は、いまなお[target_country.GetCapital.GetRankAndName]で司教代理として権力の座についたままだ。表向きは[target_dynasty.GetName]に忠誠を誓っているものの、[target_character.GetShortNameWithNoTooltip]はいまも旧領地での人気を維持しており、[target_character.GetDynasty.GetName]に対してスカラ家が犯した背徳行為を苦々しく思っているのは間違いない。また[target_character.GetHerHis]は、我々が雇用しているコンドッティエーリ（傭兵）の[target_character2.GetShortNameWithNoTooltip]に対して甘いところがある。[target_country.GetCapital.GetRank.GetName]を包囲すれば、[target_character.GetSheHe]は必ずや離反するだろう。"
 flavor_ver.1000.a: "愉快なまでの極悪さだ……"
 ver_padua_incident_rules: "[ShowLocationName('padova')]が#W 1339年1月1日#!より前に占領された場合、[target_war.GetName]で[target_country.GetName]が寝返り、独立国となる"
 flavor_ver.1001.title: "裏切りの可能性"
 flavor_ver.1001.desc: "[target_location.GetName]にいる密偵たちから、我々のすぐ近くで敵との交渉の場が持たれている可能性があるとの報告が上がってきた。どうやら[target_country.GetLongName]にいる何者かが、[target_war.GetName]における我々の敵と文を交わしているらしい。こうなると長い目で見たとき、[target_country.GetAdjective]の忠誠心を全面的に信用するのは難しくなる。裏切り者を見つけ出すべく間者を送り込んだが、手遅れになる前に探し出せるか否かについては、現時点ではなんとも言えない。"
 flavor_ver.1001.desc_pad: "首都にいる密偵たちから、我々のすぐ近くで敵との交渉の場が持たれている可能性があるとの報告が上がってきた。どうやら何者かが、[target_war.GetName]における我々の敵と文を交わしているらしい。手を打たなければ、[target_location.GetName]は内部からの攻撃に晒されるかもしれない！ 裏切り者を見つけ出すべく間者を送り込んだが、手遅れになる前に探し出せるか否かについては、現時点ではなんとも言えない。"
 flavor_ver.1001.a: "腐敗は根元から絶たねばならない！"
 flavor_ver.1002.title: "陰謀者の特定"
 flavor_ver.1002.entry: "$flavor_ver.1002.title$"
 flavor_ver.1002.desc: "[target_dynasty.GetName]の敵勢力と共謀していたとの嫌疑で、[target_character.GetName]が[target_character2.GetName]の前に引きずり出された。どうやら[target_character.GetShortNameWithNoTooltip]は、何ヵ月にもわたり、[target_war.GetName]における我々の敵対者と文を交わしていたようだ。すべては10年前に権力の座から追放されたことに対する恨みゆえのことだという。"
 flavor_ver.1002.a: "死刑だ！"
 flavor_ver.1003.title: "開門！"
 flavor_ver.1003.desc: "包囲攻撃の終盤にて、[target_location.GetName]における我々の味方である[target_character.GetName]が、一つの門で陽動部隊を撃退するよう守備隊に命じつつ、もう一方の門において我々が[target_location.GetRank.GetName]に侵入できるよう取り計らってくれた。無事制圧された[target_country.GetName]で、[target_character.GetNameWithNoTooltip]は地元の[target_estate.GetName]たちの盛大な歓声のなか統治者に任命された。これは[target_war.GetName]の大きな転機となる。[target_dynasty.GetName]はたったいま、貴重な領土の一部を失ったのだ。"
 flavor_ver.1003.a: "今後もこうした勝利を重ねていこう！"
 flavor_ver.1004.title: "味方の断末魔"
 flavor_ver.1004.desc: "大変な悲報が舞い込んできた！ [target_country.GetName]における我々の味方にして、同国のかつての統治者であった[target_character.GetName]は我々と密かに結託していたのだが、その事実が[target_dynasty.GetName]の知るところとなった。[target_character.GetShortNameWithNoTooltip]は[target_country2.GetAdjective]の兵によって乱暴に拘束され、[target_character2.GetName]の前に連れていかれると、死刑を宣告された。"
 flavor_ver.1004.a: "重要な味方を失ってしまった。"
 flavor_ver.1005.title: "[ShowLocationNameWithNoTooltip('padova')]の陥落"
 flavor_ver.1005.desc: "[target_country.GetName]に潜んでいた共謀者はなんと、初めから[target_character.GetName]だった！ このろくでなしは、[target_character2.GetName]が10年ほど前に追放した人物で、いまも司教代理の座にあるにも関わらず、[target_dynasty.GetName]に対して長らく恨みを抱きつづけていたのだ。[target_character.GetSheHe]は[target_location.GetRank.GetName]を我々の敵に明け渡し、[target_country.GetNameWithNoTooltip]を支配下に置くことで、ついに復讐を果たした。"
 flavor_ver.1005.a: "[target_country.GetNameWithNoTooltip]がどちらにつこうと、勝利するのは我々だ。"
 ver_will_join_target_war: "[THIS.GetCountry.GetName]は攻撃側として[target_war.GetName]に参加する"
