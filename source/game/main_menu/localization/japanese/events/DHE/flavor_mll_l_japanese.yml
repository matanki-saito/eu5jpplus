l_japanese:
 flavor_mll.1.title: "[target_country.GetNameWithNoTooltip]との関係悪化"
 flavor_mll.1.entry: "アラゴンとの関係悪化"
 flavor_mll.1.desc: "[ROOT.GetCountry.GetLongName]と[target_country.GetLongName]は、[GetCharacter('ara_jacme_i_arago').GetName]の死以来、[ROOT.GetCountry.GetNameWithNoTooltip]が[target_country.GetAdjectiveWithNoTooltip]の宗主権を認めてきたこともあり、緊密な関係を維持してきた。しかし、最近[our_ruler.GetName]が即位したことにより、[target_country.GetCapital.GetName]との関係が悪化している。[our_ruler.GetNameWithNoTooltip]は自身の[ROOT.GetCountry.GetGovernment.GetRulerTitle]としての地位を[ara_ruler.GetName]と同等とみなし、[ROOT.GetCountry.GetGovernment.GetRulerTitle]が別の[ROOT.GetCountry.GetGovernment.GetRulerTitle]の臣下となることはできないと布告した。\n\n[target_country.GetNameWithNoTooltip]は[target_country.GetNameWithNoTooltip]に対して敵対的行動を取ってはいないものの、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは、[our_ruler.GetNameWithNoTooltip]の軽率な行動が将来的に[target_country.GetAdjectiveWithNoTooltip]の[target_country.GetGovernment.GetCourtTitle]が[ROOT.GetCountry.GetNameWithNoTooltip]を奪取する口実となるのではないかと懸念を示している。"
 flavor_mll.1.a: "今後は慎重に行動しなければならない。"
 repair_or_damage_relations_with_aragon_tt: "今後数年のうちに、[target_country.GetName]の[ROOT.GetCountry.GetName]に対する評価が#G +190#!に達すると、[target_country.GetAdjectiveWithNoTooltip]の[target_country.GetGovernment.GetCourtTitle]との関係は修復される。一方で、[target_country.GetNameWithNoTooltip]から完全に独立するための準備を進めることもできる"
 variable_tt_mll_authority_of_james_iii: "$flavor_mll.1.entry$という[dynamic_historical_event|e]が発生した"
 flavor_mll.2.title: "[target_country_1.GetAdjectiveWithNoTooltip]との紛争からの復興"
 flavor_mll.2.entry: "ジェノヴァとの過去の紛争からの復興"
 flavor_mll.2.desc: "[target_country.GetName]と[target_country_1.GetName]のあいだで最近発生した紛争は、[ROOT.GetCountry.GetLongName]に深刻な影響を及ぼした。[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くの船舶が、[target_country.GetName]によって[ShowAreaName('sardinia_area')]への侵攻のために徴用されたためである。紛争は終結したものの、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の交易路は大きく混乱しており、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の多くは復興を支援するよう[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に嘆願している。一方、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、多数の船舶を失ったことで[ROOT.GetCountry.GetNameWithNoTooltip]が[ShowRegionName('maghreb_region')]からの襲撃に対して脆弱になったため、新たな税を課す必要があると考える者もいる。"
 flavor_mll.2.a: "新たな税を課し、[ROOT.GetCountry.GetFlavorRank]の国庫を補填しなければならない。"
 flavor_mll.2.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の資産を転用し、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の復興を支援する。"
 flavor_mll.3.title: "[our_ruler.GetNameWithNoTooltip]の宮廷法"
 flavor_mll.3.entry: "ジャウメ3世の宮廷法"
 flavor_mll.3.desc: "[target_country.GetName]の独立した統治者としての地位をさらに強化するため、[our_ruler.GetName]は新たな[ShowLawNameWithNoTooltip('legal_code_law')]、すなわち[ShowPolicyName('mll_leges_palatinae')]の基盤を築いた。この[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]のもとで、[ROOT.GetCountry.GetNameWithNoTooltip]の独立した地位は強化され、[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]の統治力も強化される。"
 flavor_mll.3.a: "この新たな[ShowLawNameWithNoTooltip('legal_code_law')]を制定し、我々の地位を強化せよ！"
 flavor_mll.3.b: "新たな[ShowLawNameWithNoTooltip('legal_code_law')]の枠組みを維持するが、公布はひとまず延期する。"
 flavor_mll.3.c: "既存の[ShowLawNameWithNoTooltip('legal_code_law')]に変更を加える必要はない。"
 variable_tt_mll_created_palatine_laws_of_mallorca: "$flavor_mll.3.entry$という[dynamic_historical_event|e]が発生した"
 flavor_mll.4.title: "『[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]』の彩飾写本"
 flavor_mll.4.entry: "『レゲス・パラティナエ』の彩飾写本"
 flavor_mll.4.desc: "新たな[ShowLawName('legal_code_law')]の枠組みを整えた後、[our_ruler.GetName]は[ShowCultureGroupName('italian_group')]の芸術家数名に依頼し、[our_ruler.GetHisHer]の威信をさらに高めるための彩飾写本を制作させた。その作品が完成したいま、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部からは、[ShowWorkOfArtNameWithNoTooltip('illuminated_manuscrpt_of_the_legas_palatinae')]を外交的な切り札として利用すべきだとの提案が出ている。というのも、この[ShowWorkOfArtTypeNameWithNoTooltip('treatise')]は非常に質が高く、格別な献上品となりうるからである。"
 flavor_mll.4.a: "当面は[ROOT.GetCountry.GetGovernment.GetCourtTitle]の所蔵品として保持しよう。"
 flavor_mll.4.b: "これは[target_country_1.GetNameWithNoTooltip]の[fra_ruler.GetShortNameWithNoTooltip]への素晴らしい贈り物となるだろう。"
 flavor_mll.4.b.entry: "これはフランスの統治者への素晴らしい贈り物となるだろう。"
 flavor_mll.4.c: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の威信の象徴として、その写本を[target_country.GetCapital.GetNameWithNoTooltip]へ送れ。"
 flavor_mll.4.c.entry: "マヨルカの威信の象徴として、その写本をアラゴンへ送れ。"
 flavor_mll.5.title: "[target_location.GetNameWithNoTooltip]とのつながり"
 flavor_mll.5.entry: "モンペリエとのつながり"
 flavor_mll.5.desc: "[GetCharacter('ara_jacme_i_arago').GetName]の死後、[GetCharacter('ara_jacme_i_arago').GetHisHer]の領地の分割によって[ROOT.GetCountry.GetName]は[ShowContinentName('europe')]内にいくつかの大陸領を得た。その領地のなかでも、[target_location.GetName]の[target_location.GetRank.GetName]は、[ROOT.GetCountry.GetNameWithNoTooltip]の統治者たちにとって重要な拠点であり、[target_country_1.GetAdjective]の[target_country_1.GetGovernment.GetCourtTitle]とのつながりも有している。\n\n[target_country.GetName]と[ROOT.GetCountry.GetNameWithNoTooltip]の関係がやや緊張していることから、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は[our_ruler.GetName]に対し、[target_location.GetNameWithNoTooltip]の[ShowCultureName('languedocien')]系[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]へ支援を要請するよう進言している。一方で、ほかの者たちは[target_location.GetNameWithNoTooltip]の重要性を利用し、[target_country_1.GetNameWithNoTooltip]の[target_country_1.GetGovernment.GetCourtTitle]からの支持を得るべきだと提案している。"
 flavor_mll.5.a: "[target_location.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]とのつながりを利用して、支援を取り付けよ。"
 flavor_mll.5.a.entry: "モンペリエの貴族とのつながりを利用して、支援を取り付けよ。"
 flavor_mll.5.b: "それよりも[ROOT.GetCountry.GetNameWithNoTooltip]の内政に目を向けるべきだ。"
 flavor_mll.5.c: "[target_location.GetNameWithNoTooltip]との交換を[target_country_1.GetNameWithNoTooltip]と取り決めよう。"
 flavor_mll.5.c.entry: "モンペリエとの交換をフランスと取り決めよう。"
 mll_unlock_sale_of_montpellier_decision_tt: "[decision|e]「$mll_exchange_of_montpellier.title$」がアンロックされ、[target_country_1.GetName]に対する外交的影響力を得る機会が提供される"
 flavor_mll.6.title: "[ShowAreaNameWithNoTooltip('balearics_area')]の防衛"
 flavor_mll.6.entry: "[ShowAreaNameWithNoTooltip('balearics_area')]の防衛"
 flavor_mll.6.desc: "[target_country.GetAdjective]の巡視隊は過去に[ShowAreaName('balearics_area')]への[ShowCultureGroupName('maghrebi_group')]の襲撃を阻止してきたものの、近年その襲撃は[ROOT.GetCountry.GetLongName]にとってより大きな妨げとなっている。\n\n[target_country.GetNameWithNoTooltip]との関係がやや緊張しているため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は、[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]の襲撃者を撃退すると同時に、将来的に起こりうる[target_country.GetAdjectiveWithNoTooltip]による侵攻を困難にするという二重の目的を持つ沿岸要塞の建設計画を起草している。"
 flavor_mll.6.a: "[ShowAreaNameWithNoTooltip('balearics_area')]を難攻不落にするため、必要な資金を拠出しよう。"
 flavor_mll.6.b: "この高額な事業を賄う余裕はない。"
 mll_area_gains_naval_defensives_tt: "[ShowAreaName('balearics_area')]のすべての[locations|e]が、60年にわたって「[ShowModifier('mll_expansion_of_coastal_fortifications')]」を得る"
 flavor_mll.7.title: "国外での支援獲得"
 flavor_mll.7.entry: "$flavor_mll.7.title$"
 flavor_mll.7.desc: "[ROOT.GetCountry.GetName]と[target_country.GetLongName]の関係がこれまで以上に悪化するなか、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の相談役の多くは[our_ruler.GetName]に対し、[target_country.GetNameWithNoTooltip]のかつてのライバルたちに接触して[target_country.GetCapital.GetName]から真の自由を勝ち取るための支持を得るよう進言している。"
 flavor_mll.7.a: "[target_country_2.GetAdjectiveWithNoTooltip]の支援を求めよ。"
 flavor_mll.7.a.entry: "カスティーリャの支援を求めよ。"
 flavor_mll.7.b: "[target_country_3.GetLongNameWithNoTooltip]の支援を求めよ。"
 flavor_mll.7.b.entry: "ナポリ王国の支援を求めよ。"
 flavor_mll.7.c: "[target_country_4.GetNameWithNoTooltip]にいる我々のかつてのライバルに目を向けよ。"
 flavor_mll.7.c.entry: "ジェノヴァにいる我々のかつてのライバルに目を向けよ。"
 flavor_mll.7.d: "それよりも、わが国の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]に頼るべきだ。"
 mll_conditions_for_castile_support_tt: "[ROOT.GetCountry.GetName]が今後数年で[target_country_2.GetName]との関係を#G +150#!まで改善した場合、我々が起こす独立運動の受容度が#G +50#!される"
 mll_conditions_for_naples_support_tt: "[ROOT.GetCountry.GetName]が今後数年で[target_country_3.GetName]との関係を#G +120#!まで改善した場合、我々が起こす独立運動の受容度が#G +50#!される"
 mll_conditions_for_genoa_support_tt: "[ROOT.GetCountry.GetName]が今後数年で[target_country_4.GetName]との関係を#G +100#!まで改善した場合、我々が起こす独立運動の受容度が#G +50#!される"
 MLL_PLEDGED_SUPPORT: "支持の確約"
 flavor_mll.8.title: "忠誠の拒否"
 flavor_mll.8.entry: "アラゴンへの忠誠の拒否"
 flavor_mll.8.desc: "[ROOT.GetCountry.GetName]と[target_country.GetName]の外交努力はすべて失敗に終わり、[target_country.GetAdjectiveWithNoTooltip]の外交官たちは、もはや[our_ruler.GetName]と妥協点を探ることに関心を示していない。[target_country.GetLongNameWithNoTooltip]は恐らく、[ROOT.GetCountry.GetNameWithNoTooltip]を直接奪取するための口実をでっち上げるだろう。"
 flavor_mll.8.a: "我々の忍耐も限界だ！"
 mll_ara_will_likely_pursue_subjugation_tt: "[target_country.GetName]の[target_country.GetGovernment.GetCourtTitle]が、[ROOT.GetCountry.GetName]を[target_country.GetAdjectiveWithNoTooltip]王権のもとに置くために直接奪取を試みる"
 flavor_mll.9.title: "関係修復"
 flavor_mll.9.entry: "アラゴンとの関係修復"
 flavor_mll.9.desc: "かつては破局が不可避だと思われた関係は、[target_country.GetAdjective]と[ROOT.GetCountry.GetAdjective]の外交官による慎重な交渉によって概ね修復された。[target_country.GetNameWithNoTooltip]は我々の独立した統治権の主張を認めることには消極的であるものの、かつて[target_country.GetNameWithNoTooltip]に対して負っていた債務の多くは免除された。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部はこれを[our_ruler.GetNameWithNoTooltip]の勝利とみなしているが、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の側近のなかには、[our_ruler.GetHeShe]に対し[target_country.GetNameWithNoTooltip]からの真の独立への道を追求するよう求める者もいる。"
 flavor_mll.9.a: "ひとまず危機は避けられた。"
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName]は今後、[ROOT.GetCountry.GetName]を奪取するための強硬手段を取らなくなる。なお、[ROOT.GetCountry.GetNameWithNoTooltip]は今後も独立への道を自由に追求できる"
 flavor_mll.10.title: "副王領への昇格"
 flavor_mll.10.entry: "[ROOT.GetCountry.GetNameWithNoTooltip]副王領"
 flavor_mll.10.desc: "[target_country.GetName]と[ROOT.GetCountry.GetName]の関係がほぼ以前の状態に戻ったことで、[target_country.GetLongNameWithNoTooltip]は再び[ShowAreaName('balearics_area')]に関心を寄せるようになった。この地域の経済は、過去に受けた[ShowCultureGroupName('maghrebi_group')]による襲撃や[target_country_1.GetName]との紛争の影響によって、いまだ大きく損なわれている。[target_country.GetAdjectiveWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、[ROOT.GetCountry.GetLongNameWithNoTooltip]に副王領としての地位を与えることを提案した。これにより、[target_country.GetAdjectiveWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]からより大きな支持を得られるようになる。"
 flavor_mll.10.a: "副王領としての新たな地位を利用して、[ROOT.GetCountry.GetNameWithNoTooltip]を強化する。"
 flavor_mll.10.b: "[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]における[target_country.GetAdjectiveWithNoTooltip]と[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の利益を守るため尽力する。"
 flavor_mll.10.b.entry: "地中海におけるアラゴンとマヨルカの利益を守るため尽力する。"
 flavor_mll.10.c: "[target_country.GetNameWithNoTooltip]からの副王領化の提案を拒否する。"
 flavor_mll.10.c.entry: "アラゴンからの副王領化の提案を拒否する。"
 flavor_mll.11.title: "[source_of_piracy.GetNameWithNoTooltip]の海賊の脅威"
 flavor_mll.11.entry: "[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]の海賊の脅威"
 flavor_mll.11.desc: "[ROOT.GetCountry.GetLongName]は[ShowRegionName('maghreb_region')]の海賊による度重なる襲撃に苦しめられてきたが、近年では[source_of_piracy.GetName]を拠点とする海賊が[ROOT.GetCountry.GetGovernment.GetCourtTitle]に最も大きな経済的被害をもたらしている。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の怒りが高まるなか、多くの者が[our_ruler.GetNameWithNoTooltip]に対し[source_of_piracy.GetNameWithNoTooltip]へ侵攻して海賊を壊滅させるよう嘆願している。"
 flavor_mll.11.a: "[source_of_piracy.GetNameWithNoTooltip]の海賊には必ず対処しなければ。"
 flavor_mll.11.a.entry: "海賊には必ず対処しなければ。"
 flavor_mll.11.b: "やつらを速やかに鎮圧するには、[source_of_piracy.GetAdjectiveWithNoTooltip]の拠点を直接奪取するしかない。"
 flavor_mll.11.b.entry: "やつらを速やかに鎮圧するには、連中の拠点を直接奪取するしかない。"
 flavor_mll.12.title: "アルクーディアの城壁"
 flavor_mll.12.entry: "$flavor_mll.12.title$"
 flavor_mll.12.desc: "[target_location.GetName]の外れに位置するアルクーディアは、この100年間、[ShowRegionName('maghreb_region')]からの襲撃を受けつづけている。こうした危険に備えるため、[GetCharacter('mll_jacme_ii_mallorca').GetName]はかつて、将来の襲撃から集落を守るべく新たな城壁の建設を命じた。城壁はまだ完成していないものの、既存の城壁はすでに非常に効果的であることが証明されており、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]が同様の設計を用い、[target_location.GetNameWithNoTooltip]の主要な[target_location.GetRank.GetName]そのものを強化する新たな事業に着手すべきだと考える者もいる。"
 flavor_mll.12.a: "[target_location.GetNameWithNoTooltip]全域を防備するため、新たな要塞の建設に資金を提供する。"
 flavor_mll.12.a.entry: "マナコル全域を防備するため、新たな要塞の建設に資金を提供する。"
 flavor_mll.12.b: "アルクーディアの城壁を完成させるために資金を提供する。"
 flavor_mll.12.c: "アルクーディアでの今後の建設計画を中止する。"
 flavor_mll.13.title: "[target_country.GetNameWithNoTooltip]からの自由"
 flavor_mll.13.entry: "独立の再確立"
 flavor_mll.13.desc: "[our_ruler.GetName]と[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]の尽力により、[ROOT.GetCountry.GetNameWithNoTooltip]はついに[target_country.GetLongName]から真の独立を勝ち取った。[target_country.GetNameWithNoTooltip]が[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の離脱を認めざるを得なくなったことで、[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]はもはや[target_country.GetCapital.GetName]の気まぐれに縛られることなく[ShowScriptedGeographyName('mediterranean_sea_geography')]へと目を向けることができるようになった。"
 flavor_mll.13.a: "[ROOT.GetCountry.GetNameWithNoTooltip]は自らの手で自らの未来を切り開く。"
 flavor_mll.14.title: "[target_location.GetNameWithNoTooltip]の[ShowBuildingTypeNameWithNoTooltip('university')]による[our_ruler.GetNameWithNoTooltip]の統治支持"
 flavor_mll.14.entry: "モンペリエの学者たちが我々の統治を支持"
 flavor_mll.14.desc: "[target_location.GetName]は[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]の大陸領として存続してきたものの、[target_location.GetNameWithNoTooltip]の[ShowBuildingTypeName('university')]の学者たちは[our_ruler.GetNameWithNoTooltip]の揺るぎない支持者でありつづけてきた。新たな[ShowLawNameWithNoTooltip('legal_code_law')]である[ShowPolicyName('mll_leges_palatinae')]の制定から、[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]の強化に至るまで、[target_location.GetNameWithNoTooltip]の学者たちは[our_ruler.GetName]の統治に大きな政治的影響力をもたらしている。"
 flavor_mll.14.a: "彼らの支持を歓迎する！"
 flavor_mll.14.b: "彼らの称賛を利用して、[our_ruler.GetShortNameWithNoTooltip]の政治的立場をさらに強化する。"
 flavor_mll.14.b.entry: "彼らの称賛を利用して、我らが統治者の政治的立場をさらに強化する。"
 flavor_mll.15.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の交易影響力の再建"
 flavor_mll.15.entry: "マヨルカの交易影響力の再建"
 flavor_mll.15.desc: "[ROOT.GetCountry.GetLongName]がもはや[target_country.GetName]の意向に縛られなくなったことで、多くの商人たちは、かつて[ROOT.GetCountry.GetName]が[ShowScriptedGeographyName('mediterranean_sea_geography')]で持っていた交易影響力を取り戻すべく、独自の交易をおこなおうとしている。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の影響力の衰退は、主に[target_country_1.GetName]と[target_country.GetNameWithNoTooltip]の過去の衝突によってもたらされたものだが、新たに得た[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetFlavorRank]の独立は、[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]全域の商人たちに、この地域における我々の存在感を再評価させることになるだろう。\n\n当該地域での存在感を再び確立するため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]に追加の特権を与え、さらに[target_country.GetAdjectiveWithNoTooltip]の支配下で課されていた旧来の制限を一部撤廃するべきだと提案している。しかし、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]を強化することで、[ROOT.GetCountry.GetNameWithNoTooltip]が[ShowRegionName('italy_region')]の[ShowGovernmentTypeName('republic')]に近い体制になるのではないかと懸念する声もある。"
 flavor_mll.15.a: "支援への見返りとして、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]に広範な特権を与える。"
 flavor_mll.15.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]はこの事業を単独で担う。"
 flavor_mll.15.c: "内政にもっと注力するべきだ。"
 # Decisions
 mll_a_hub_of_mediterranean_trade.title: "[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]交易の拠点"
 mll_a_hub_of_mediterranean_trade.desc: "古い[GetCountry('MLL').GetAdjective]の交易路の多くは、過去の[GetCountry('ARA').GetAdjective]と[GetCountry('GEN').GetAdjective]の争いによって失われてしまったが、[GetCountry('MLL').GetLongNameWithNoTooltip]が新たに独立したことで、かつて利益を生んでいたこれらの交易路を復活させる好機が訪れている。さらに、[ShowAreaNameWithNoTooltip('balearics_area')]の絶好の立地をもってすれば、[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]交易で有力な競争者となれる可能性は十分にある。"
 mll_a_hub_of_mediterranean_trade.a: "[GetCountry('MLL').GetNameWithNoTooltip]はいまや[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]を支配する準備が整っている。"
 mll_exchange_of_montpellier.title: "[ShowLocationNameWithNoTooltip('montpellier')]の取引"
 mll_exchange_of_montpellier.desc: "[GetCharacter('ara_jacme_i_arago').GetName]の遺言により[GetCharacter('mll_jacme_ii_mallorca').GetName]へ譲られた[ShowLocationNameWithNoTooltip('montpellier')]は、それ以降[GetCountry('MLL').GetLongNameWithNoTooltip]にとって重要な本土領でありつづけてきた。しかし、[GetCountry('MLL').GetNameWithNoTooltip]と[GetCountry('MLL').GetNameWithNoTooltip]の敵対関係が深まるなか、[ShowLocationNameWithNoTooltip('montpellier')]は[GetCountry('FRA').GetLongNameWithNoTooltip]との交渉において強力な切り札となりうる。"
 mll_exchange_of_montpellier.a: "[ShowLocationNameWithNoTooltip('montpellier')]の売却を[GetCountry('FRA').GetNameWithNoTooltip]に提案する。"
 mll_exchange_of_montpellier.b: "[ShowLocationNameWithNoTooltip('montpellier')]と引き換えに、[GetCountry('FRA').GetAdjectiveWithNoTooltip]からの独立保障を求める。"
 mll_exchange_of_montpellier.c: "[ShowLocationNameWithNoTooltip('montpellier')]は[GetCountry('MLL').GetAdjectiveWithNoTooltip]領でありつづけなければならない！"
 mll_french_support_for_montpellier_tt: "50年のあいだ、我々が起こす独立運動に対する[GetCountry('FRA').GetName]の受容度が#G +100#!される"
