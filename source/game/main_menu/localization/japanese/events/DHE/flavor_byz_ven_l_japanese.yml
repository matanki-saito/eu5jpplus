l_japanese:
 flavor_byz_ven.1.title: "窮地"
 flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$"
 flavor_byz_ven.1.desc: "[ShowDisasterName('byzantine_succession_crisis')]が激化するなかで国庫の蓄えは減りつづけており、争いが長引くにつれ、わが国の立場はますます苦しくなっている。国内の混乱がこのまま続けば、[origin_country.GetLongName]の存続すら危うくなる。\n\nこのような窮状のなか、これまで考えられもしなかった案が話に上っている。[target_woa.GetName]を担保にして、商人共和国のいずれかから金を借りるというものだ。"
 flavor_byz_ven.1.a: "背に腹は代えられない。"
 flavor_byz_ven.1.b: "論外だ。"
 BYZ_crown_jewels_tt: "[THIS.GetCountry.GetName]が承諾した場合、わが国は[SCOPE.GetLocalVariable('loan_size').GetValue|+=][gold_i|e]を借り受けるが、[target_woa.GetName]の[work_of_art|e]が返還されるまで「[ShowModifier('BYZ_lacking_jewels')]」の影響を受ける"
 flavor_byz_ven.2.title: "[origin_country.GetAdjectiveWithNoTooltip]の至宝を担保に"
 flavor_byz_ven.2.entry: "$BYZ_ADJ$の至宝を担保に"
 flavor_byz_ven.2.desc: "[origin_country.GetLongName]は、まさに窮地にある。[ShowDisasterName('byzantine_succession_crisis')]に苦しめられ、軍資金を急速に使い果たし、追加の資金を切実に必要としている。実のところ、その苦境はあまりに深刻で、彼らは我々に思いがけない申し出をしてきた。[target_woa.GetName]を担保に、融資を求めてきたのである。これを信頼の証と見る者もいれば、窮余の策と見る者もいる。"
 flavor_byz_ven.2.a: "わが国のコレクションをより華やかにしてくれるだろう。"
 flavor_byz_ven.2.b: "悪しき[origin_country.GetFlavorRank]など滅びるがいい。"
 flavor_byz_ven.2.b.entry: "悪しき国など滅びるがいい。"
 pawning_of_crown_jewels: "至宝を担保に"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
 LOAN_TOOLTIP_pawning_of_crown_jewels: "貸し手が$byzantine_crown_jewels$を預かることを条件に、借り手に融資をおこなうという合意が成立した。貸付金が返済されれば、担保として差し出された至宝は返還されることになっている。が、それはあくまで建前の上での話である。"
 LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
 flavor_byz_ven.3.title: "借金返済"
 flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$"
 flavor_byz_ven.3.desc: "[origin_country.GetLongName]は、我々が貸し付けた金を返済し、[target_woa.GetName]の返還を求めてきた。合意に従うのであれば、我々はこれに応じねばならない。だが、そうすれば彼らに対する切り札を失うことになる。\n\nどうせ、至宝を返さなかったところで、大したことにはなるまい……"
 flavor_byz_ven.3.a: "そのような汚点を残すわけにはいかない。"
 flavor_byz_ven.3.b: "どうせ、構うまい。このまま手元に置いておこう。"
 flavor_byz_ven.4.title: "至宝の返還"
 flavor_byz_ven.4.desc: "合意に従い、我々は[target_country.GetLongName]からの借金を返済し、それに伴って[target_woa.GetName]も返還され、[target_location.GetName]で再び[origin_country.GetAdjective]の手に戻った。\n\n数ある[ShowGovernmentReformName('merchant_republic')]のなかでも随一の国と取引できたことは、実に喜ばしいことであった。"
 flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.4.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.5.title: "合意破棄"
 flavor_byz_ven.5.desc: "合意に従って借金を返済したにも関わらず、[target_country.GetAdjective]側は[target_woa.GetName]の返還要求を無視している。これは公然たる強奪にほかならない。\n\nやつらに[origin_country.GetLongName]の怒りを思い知らせてやろう……"
 flavor_byz_ven.5.a: "悪魔と取引すべきではなかった。"
 flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$"
 flavor_byz_ven.6.desc: "[target_army.GetName]はついに[target_woa.GetName]を取り戻した。我らの至宝は[target.GetName]へ運ばれ、そこで[ROOT.GetCountry.GetGovernment.GetCourtTitle]に喜びをもって迎えられた。これでもう、敵が至宝を盾に我らに圧力をかけることはできない。"
 flavor_byz_ven.6.desc_recovered: " [target_woa.GetName]は再び我らの手の内にあり、[target.GetName]とともに回収された。我らの至宝は本来あるべき場所へと運ばれ、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に喜びをもって迎えられた。これでもう、敵が至宝を盾に我らに圧力をかけることはできない！"
 flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.6.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]"
 flavor_byz_ven.7.desc: "[location.GetName]のこのたびの占領は、[ROOT.GetCountry.GetName]にとって大きな成果であった。我々の軍勢[target_army.GetName]は当地をくまなく「調査」し、その過程で同盟国[origin_country.GetName]にとって重要な品である[target_woa.GetName]を手に入れた。これを彼らに返すこともできるが、我らにもまた、戦利品の分け前があってもよいのではないか？"
 flavor_byz_ven.7.a: "同盟国に返そう。"
 flavor_byz_ven.7.b: "黙っておけば、わかるものか！"
 flavor_byz_ven.8.title: "至宝が盗まれた！"
 flavor_byz_ven.8.desc: "貸し手のあきれ果てる不手際が伝わってきた。由緒ある[target_woa.GetName]を担保に金を貸し付けておきながら、それをみすみす盗まれてしまったのだ。彼らが我々の至宝を取り返してくれることを心から願う。でなければ、我々自ら[target.GetName]から奪い返さねならないだろう……"
 flavor_byz_ven.8.a: "やつらは金をため込むことしか能がないのか。"
 byz_woa_was_moved: "[target_woa.GetName]が[target.GetName]へ移された"
 flavor_byz_ven.9.title: "取引が成立"
 flavor_byz_ven.9.entry: "$flavor_byz_ven.9.title$"
 flavor_byz_ven.9.desc: "我々の使節が、これ以上ない吉報を携えて[target_country.GetName]から帰還した。[target_country.GetAdjective]の商人たちは、我らの提案を受け入れることに同意したのである。[target_woa.GetName]と引き換えに融資がおこなわれ、窮迫していた国庫にもようやく余裕が生まれた。この猶予を最大限に活かさねばならない。"
 flavor_byz_ven.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.9.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.10.title: "セレニッシマによって拒否された"
 flavor_byz_ven.10.entry: "$flavor_byz_ven.10.title$"
 flavor_byz_ven.10.desc: "我々の使節は成果を得られぬまま帰還した。[target_country.GetLongName]は我らの提案を拒絶し、[target_woa.GetName]を担保として差し出しても、融資に応じようとしなかった。この侮辱は、財政への打撃にも劣らぬ痛手である。我らはこの危機を乗り切るため、他の手段を探さねばならない。"
 flavor_byz_ven.10.a: "仕方がない。"
