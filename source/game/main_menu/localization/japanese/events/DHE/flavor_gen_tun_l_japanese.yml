l_japanese:
 flavor_gen_tun.1.title: "手に入れる絶好の機会"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "[ShowLocationName('cape_tajura')]に、[target_location.GetName]の古く美しい[target_location.GetRank.GetName]がそびえ立っている。[ShowScriptedGeographyName('mediterranean_sea_geography')]経済における重要な存在だが、掌握しつづけるのは[target_country.GetLongName]だ。この脆弱な国家が、わが国の侵略に自力で抵抗などできない。[ShowProvinceDefinitionName('tripolitania_province')]に上陸して沿岸部を略奪し、占領地を近隣諸国に売却することも、我々がそのまま保有することもできる。"
 flavor_gen_tun.1.a: "素晴らしい案だ！"
 flavor_gen_tun.1.b: "そのような機会は戦争屋のためのものだ。"
 flavor_gen_tun.2.title: "$tripoli$の売却"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "[target_location.GetName]を攻略し掠奪したことで、わが[ROOT.GetCountry.GetFlavorRank]は[target_location.GetArea.GetName]の地域にかなりの規模の植民地を手にした。この地は[ROOT.GetCountry.GetCapital.GetName]にあるわが本土とは文化も宗教も大きく異なる。この地の所有権を、隣接するいずれかの部族に譲渡するべきかもしれない。"
 flavor_gen_tun.2.a: "隣のバヌ・サービトに売却せよ。"
 flavor_gen_tun.2.b: "バヌ・マッキが、自分たちの領地の買い戻しに関心を示すかもしれない。"
 flavor_gen_tun.2.c: "[tunis_location.GetOwner.GetLongNameWithNoTooltip]は確実に興味を示すだろう。"
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip]は我々の土地だ！"
 flavor_gen_tun.2.d.entry: "$tripoli$は我々の土地だ！"
 sale_of_tripoli_tt: "[target_location.GetName]の植民地を[SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+][gold_i|e][gold|e]で売却し、隣接する計#Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#!の[locations|e]をすべて譲渡する"
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "[from_country.GetName]からの使節が[ROOT.GetCountry.GetCapital.GetName]に到着し、[target_location.GetName]の領土を相当な価格で我々に売却することを申し出た。[target_location.GetRank.GetName]の価値を過小評価してはならない。[ROOT.GetCountry.GetFlavorRank]にとってよい買い物になるだろう。"
 flavor_gen_tun.3.desc_banu_makki: "[from_country.GetLongName]の不遜さは、[ROOT.GetCountry.GetReligion.GetGodName]の天罰に値する！我らの美しい[target_location.GetRankAndName]を征服しておきながら、それを買い戻す「機会」を我々に与えるというのだ。何より腹立たしいのは、我々が実際にこの申し出を受け入れるかもしれないということだ……"
 flavor_gen_tun.3.a: "いいだろう、同意する。"
 flavor_gen_tun.3.b: "征服すれば取り返せるものに、なぜ金を払わねばならないのか？"
 flavor_gen_tun.3.c: "失礼ながら、興味がない。"
