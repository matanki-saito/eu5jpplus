l_japanese:
 banu_al_wad: "アブド・アル＝ワード族"
 FATE_OF_TLEMCEN: "[ShowLocationNameWithNoTooltip('tlemcen')]の運命"
 flavor_tle.1.title: "[capital_scope.GetNameWithNoTooltip]の陥落"
 flavor_tle.1.desc: "我らが愛する[ROOT.GetCountry.GetFlavorRank]の首都、[capital_scope.GetName]が邪悪な敵の手に落ちた。さらに悲劇が続き、敬愛する統治者[ruler_scope.GetName]とその息子たちが襲撃のさなかに命を落としてしまった。\n\nこの悲劇は[ROOT.GetCountry.GetFlavorRank]じゅうに絶望を与え、敵との戦いを続けることすら困難にしている。"
 flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 tle_morrocan_tlemcen_war: "[target_war.GetName]で[target_location.GetName]が[mor_scope.GetLongName]に占領されると、[mor_scope.GetName]が強制的に[tle_scope.GetName]を[ShowSubjectTypeName('fiefdom')]にできる"
 tle_additional_warning: "[target_siege.GetName]をすぐにでも解かなければ！"
 flavor_tle.2.title: "[target.GetNameWithNoTooltip]の陥落"
 flavor_tle.2.desc: "[target.GetArea.GetName]の真珠、[target.GetName]がついに強大なわが軍の包囲に屈し、降伏した。門が開くと、わが軍勢が中央の城塞を押さえ、戦利品や虜囚を確保するべく[target.GetRank.GetName]になだれ込んだ。城塞内には[target_country.GetGovernment.GetAdjective]家の者が大勢おり、わが兵士たちがすぐさま捕らえて[from_country.GetAdjective]の将軍たちのもとへと連行した。これで[target_war.GetName]は終わるのだろうか？"
 flavor_tle.2.a: "[target_dynasty.GetNameWithNoTooltip]が障害にならないようにせよ。"
 flavor_tle.2.b: "[ShowLocationNameWithNoTooltip('oran')]へ進め！"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "[target_country.GetName]との[truce|e]が終了すると、彼らが[decision|e]「[ShowDecisionName('zayyanid_pretenders_decision')]」を使用できるようになり、特別な[war|e]「[ShowCasusBelliName('cb_independence_war')]」を宣言できるようになる"
 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "愛するわが[ROOT.GetCountry.GetFlavorRank]の首都[target.GetName]が、極悪非道な[from_country.GetLongName]の手に落ちた。追い打ちをかけるように、愛する[target_dynasty.GetName]家の多くの者が、襲撃で命を落とした。\n\nこの惨事により[ROOT.GetCountry.GetLongName]全土に絶望が広がり、戦争を継続することは不可能である。殺戮だけで国家が麻痺状態に陥ることはないが、統治者への信頼失墜がとどめとなった。同盟部族に見捨てられ、わが方の士気は過去最低にまで落ち込んでおり、組織的な抵抗もないいま、これは[target_war.GetName]の終わりを告げている。"
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 TLE_as_per_the_warning: "我々は警告に耳を傾けず、愛する[target.GetName]の占領を許してしまった。[target_dynasty.GetName]家は虐殺され、わが国はいまや[from_country.GetName]の[ShowSubjectTypeName('fiefdom')]である"
 zayyanid_pretenders_decision.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]家の王子を即位させる"
 zayyanid_pretenders_decision.desc: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName]の統治は平たくいえば暴政であり、どれほど着飾っても[ROOT.GetCountry.GetLongName]に都合が悪い。再び[ShowDynastyName('zayyanid_dynasty')]家の王子を我々の統治者として招き入れ、共通の敵に対抗すべくすべての[ShowEstateTypeName('tribes_estate')]を団結させよう。"
 zayyanid_pretenders_decision.desc.entry: "わが宗主国の統治はまさに暴政で、$banu_al_wad$の優位性が根幹から揺らぐほどだ。再び[ShowDynastyName('zayyanid_dynasty')]家の王子を我々の統治者として招き入れ、共通の敵に対抗すべくすべての[ShowEstateTypeName('tribes_estate')]を団結させよう。"
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_prince_takes_over: "[ShowDynastyName('zayyanid_dynasty')]家の王子が権力を握る"
 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "[from_country.GetName]の情勢は、日に日に持続不可能なものとなっている。影を潜めていた[target_dynasty.GetName]の僭称者の多くが、地域の[ShowCultureName('zenati')]族の支持を精力的に集めている。地域の諸階級をなだめることに失敗すれば[target_location.GetName]が民衆反乱の温床になり、[ShowRegionName('maghreb_region')]における我らの覇権が終焉を迎えかねない。[target_country.GetName]はこの嵐を乗り切ることができるのだろうか？"
 flavor_tle.4.a: "警告に耳を貸さねばならない。"
 tle_rules_for_zayyanid_pretenders: "[target_country.GetName]が以後#Y 20#!年のうちのいずれかの時点で、[from_country.GetLongName]の[subject_loyalty|e]を#Y 30#!以上に維持できない場合、[from_country.GetName]が[decision|e]「[ShowDecisionName('zayyanid_pretenders_decision')]」により[war|e]「[ShowCasusBelliName('cb_independence_war')]」を宣言できるようになる"
 tle_rules_part_two: "この場合、[from_country.GetName]の軍事力が大きなボーナスを獲得し、[target_country.GetName]が以下を受け取る："
 flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]家が[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]に帰還！"
 flavor_tle.5.desc: "[from_country.GetAdjective]王位継承の僭称者[target_character.GetName]が[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]および[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]の代表者からの歓声を背に、[ROOT.GetCountry.GetCapital.GetName]入りを果たした。これは、あまりに長きにわたり[ROOT.GetCountry.GetCapital.GetName]を支配してきた[target_country.GetLongName]に対する[from_country.GetName]の公然たる宣戦布告である。[target_character.GetShortNameWithNoTooltip]は[from_country.GetNameWithNoTooltip]で広範な支持を得ているが、最も重要なのは[ShowModifier('tle_zayyanid_tribe_support')]を獲得したことである。つまり[ROOT.GetCountry.GetFlavorRank]最大かつ最強の[ShowCultureName('zenati')]族で、[target_dynasty.GetName]出身の部族の支持を取り付けたのだ。\n\n[target_war.GetName]に勝つのは誰か、[target_country.GetAdjectiveWithNoTooltip]の屑どもに見せつけてやろう。"
 flavor_tle.5.a: "[ROOT.GetCountry.GetReligion.GetGodName]に栄光あれ！"
 zayyanid_pretender_effect: "わが[overlord|e]に対し[ShowCasusBelliName('cb_independence_war')]を宣言し、以下のイベントから追加の恩恵を受ける："
 flavor_tle.6.title: "[from_country.GetLongNameWithNoTooltip]で反乱勃発！"
 flavor_tle.6.desc: "特権の授与、外交使節の派遣、豪華な贈り物、役職の付与といったわが国の熱心な努力も、すべて水泡に帰した。[from_country.GetName]の諸部族は、それでも慈悲深き[target_country.GetAdjective]の統治ではなく[target_dynasty.GetName]の暴君[target_character.GetName]を支持したのだ。\n\nいいだろう。奴らにわが軍の猛威を思い知らせてやる！[ROOT.GetCountry.GetReligion.GetGodName]に代わって天罰を下し、[target_war.GetName]で勝利をつかみ取るのだ！"
 flavor_tle.6.a: "[ShowRegionNameWithNoTooltip('maghreb_region')]でのわが覇権は覆らない！"
 flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip]の僭称者"
 flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]家の僭称者"
 flavor_tle.7.desc: "ここ数年、身を潜めていた[target_dynasty.GetName]家の生き残りの多くが、[target_location.GetName]と[from_country.GetAdjective]の王座を手に入れようと姿を現している。彼らは民衆や[target_country.GetGovernment.GetEstateName('tribes_estate')]からそれなりの支持を得て、民心は徐々に傾きつつある。[target_country.GetLongName]の宗主国が[target_location.GetProvince.GetName]での危機をさらに悪化させるようなことがあれば、[target_dynasty.GetNameWithNoTooltip]が再び権力を握ることになりかねない。"
 flavor_tle.7.a: "この流れはわが国に利するかもしれない。"
 flavor_tle.11.title: "忠誠の確保"
 flavor_tle.11.desc: "[target_country.GetAdjective]が[from_country.GetName]を征服して数十年が経過し、[ShowDynastyName('zayyanid_dynasty')]家復権の噂も下火となった。我々はようやく[ShowCultureName('zenati')]の[from_country.GetGovernment.GetEstateName('tribes_estate')]、そして最も有力な$banu_al_wad$を完全に従属させることに成功したようだ。彼らの領土を統合し次第、[ShowRegionName('maghreb_region')]に新たな繁栄の時代を切り開こう。"
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName]は[ShowDecisionName('zayyanid_pretenders_decision')]を通じて反乱できなくなる"
 flavor_tle.13.title: "[ShowLocationNameWithNoTooltip('oran')]の成長"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "[target_location2.GetName]が[ShowScriptedGeographyName('sahara_desert_geography')]での交易の門戸であるならば、[target_location.GetName]は[ShowContinentName('europe')]への商業の窓である。[target_location.GetNameWithNoTooltip]はわが国と[ShowScriptedGeographyName('mediterranean_sea_geography')]の海上国を結ぶ主要な交易地で、これほど重要な港はない。地元の[target_estate.GetName]の権限を強化するために[target_location.GetRank.GetName]にさらなる特権を与えるべきかもしれない。"
 flavor_tle.13.a: "素晴らしい考えだ！"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip]は特別扱いに値しない。"
