l_japanese:
 flavor_pis.1.entry: "$flavor_pis.1.title$"
 flavor_pis.1.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の衰退"
 flavor_pis.1.desc: "かつて栄華を誇った[ROOT.GetCountry.GetLongName]は、いまや[ShowRegionName('italy_region')]において大国とは言い難い存在となってしまった。その威勢は[ShowRegionName('iberia_region')]から[ShowRegionName('crescent_region')]にまで及んでいたが、[GetCountry('GEN').GetAdjective]艦隊が[ShowLocationName('pisa')]の重要な[ShowBuildingTypeName('porto_pisano')]を数年にわたり封鎖し、さらには[GetCountry('ARA').GetAdjective]軍が[ShowAreaName('sardinia_area')]を奪い去ったことで、衰退の一途をたどることとなった。\n\n[ROOT.GetCountry.GetFlavorRank]はすっかり弱体化してしまった。我らが艦隊のかつての威容はいまでは見る影もなく、ほかの[ShowCultureGroupName('italian_group')]諸国が海上で我々を凌ぎ、交易での影響力に関しても、より信頼される競争相手に取って代わられつつあり、政治の腐敗も深まっている。\n\nしかし、歴史の流れにただ身を任せるわけにはいかない。この苦境をもたらした者たちにしかるべき報いを与えるべく、いまこそ再建に力を注ぎ、可能なかぎりの力を蓄えるべきだ。"
 flavor_pis.1.a: "[target_character.GetNameWithNoTooltip]が統べるかぎり、我らは決して揺るがない！"
 flavor_pis.1.a.entry: "我らは決して揺るがない！"
 flavor_pis.2.title: "[target.GetNameWithNoTooltip]の没落"
 flavor_pis.2.desc: "[ROOT.GetCountry.GetName]の軍勢は再び勝利を収め、[target.GetName]の[target.GetRank.GetName]を捕らえた。[ShowLocationName('pisa')]での被害を心に刻んだ兵たちとその指揮官は、この[target.GetRank.GetNameWithNoTooltip]を徹底的に破壊し、得られた富を都へ持ち帰る準備を進めている。"
 flavor_pis.2.a: "目には目を！"
 flavor_pis.2.b: "あの地を滅ぼす必要はない。"
 pis_allow_upgrade_of_porto_pisano: "[ShowLocationName('pisa')]の[ShowBuildingTypeName('porto_pisano')]はさらにもう1段階の強化が可能"
 flavor_pis.3.entry: "$flavor_pis.3.title$"
 flavor_pis.3.title: "[ShowAreaNameWithNoTooltip('sardinia_area')]の奪還"
 flavor_pis.3.desc: "わが軍はついに[ShowAreaName('sardinia_area')]を奪還した！\n\n多くの兵士や[ROOT.GetCountry.GetGovernment.GetCourtTitle]の構成員、そして[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]たちが今回の勝利を祝い、この地で再び影響力を確立しようと意気込んでいる。彼らは国内各地に散っていたものの、すでに多くが[target_location.GetName]へと移り住み、この場所を地域の中心としはじめている。\n\nこうした動きを受け、[ShowBuildingTypeName('porto_pisano')]を再び豊かにしようという入植者たちが確実に成功を収められるよう、[target_location.GetRank.GetName]を整備すべきだと多くの者が提案している。しかし、影響を一つの場所に偏らせるのではなく、島全体を立て直すべきだと考える者もいる。"
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip]は[ShowAreaNameWithNoTooltip('sardinia_area')]の宝となるだろう。"
 flavor_pis.3.a.entry: "この場所は[ShowAreaNameWithNoTooltip('sardinia_area')]の宝となるだろう。"
 flavor_pis.3.b: "島全体の繁栄を確かなものとしよう。"
 pis_all_of_sardinia_gains_development_and_prosperity: "[ShowAreaName('sardinia_area')]内で我々が所有するすべての[location|e]において、[development|e]が[ShowNamedValue('development_mild_bonus')|+=2%]、 [prosperity|e]が[ShowNamedValue('prosperity_mild_bonus')|+=2%]上昇する"
 flavor_pis.4.entry: "$flavor_pis.4.title$"
 flavor_pis.4.title: "[ShowWorkOfArtNameWithNoTooltip('leaning_tower_of_pisa')]の拡張"
 flavor_pis.4.desc: "[ShowWorkOfArtName('leaning_tower_of_pisa')]は完成した。しかし、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、その内部をさらに拡張したいと望む者たちが少なくない。\n\n[target_character.GetName]は鐘楼にゴシックの要素を取り入れ、既存のロマネスク様式と調和させたいと考えている。この計画が無料で済まないことは[ROOT.GetCountry.GetFlavorRank]もよく承知しているが、実現すれば[ShowRegionName('italy_region')]で我々の威信を一層高める助けとなるだろう。"
 flavor_pis.4.a: "この塔を拡張しよう。"
 flavor_pis.4.b: "すでに完成しているのだから、これ以上は不要だ。"
 flavor_pis.5.entry: "$flavor_pis.5.title$"
 flavor_pis.5.title: "方針転換の時"
 flavor_pis.5.desc: "地中海でかつての栄光を取り戻そうという野心は次第に薄れつつある。だがその試みは、[ShowRegionName('italy_region')]での我々の支配をいかにして回復するかについて、新たな発想をもたらした。商人や船乗りに頼るのではなく、我々の富を軍事行動に投じて多くのコンドッティエーリを雇い入れ、周辺都市を征服させるべきだというものだ。\n\nこうした考えは老練な者たちには不評で、彼らはむしろ[ShowBuildingTypeName('porto_pisano')]の再建を望んでいる。しかし、積極派の者たちは、競合の都市国家を凌駕するまで拡張政策を進めるべきだと主張している。"
 flavor_pis.5.a: "征服に乗り出すのだ！"
 flavor_pis.5.b: "戦争では何も得られない。力をもたらすのは交易だ。"
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "わが国が[casus_belli|e]をまだ有していない場合、隣接するすべての[country|e]の[capital|e][province|e]に対して[casus_belli|e]「[ShowCasusBelliName('cb_conquer_province')]」を得る"
 flavor_pis.6.title: "ジョーコ・デル・ポンテ"
 flavor_pis.6.desc.a: "[ShowLocationName('pisa')]で最近行われたジョーコ・デル・ポンテ祭において、有望な[target_character.GetWomanMan]が頭角を現した。この日の橋取り合戦で、[target_character.GetName]が見事な統率力を発揮し、ポンテ・ディ・メッツォ橋上で荷車を押し進める兵たちを巧みに導いたのである。この活躍により[target_character.GetHerHim]は人々から大いに敬意を集め、[target_character.GetSheHe]には真の指導者となる素質があるのではないかと囁かれている。"
 flavor_pis.6.desc.b: "[ShowLocationName('pisa')]では最近ジョーコ・デル・ポンテが催され、地元民はその祭りを大いに楽しんだ。アルノ川沿いの行列には身分を問わず多くの市民が参加し、有力者たちもこの祭りでは日頃の対立を忘れ、[ROOT.GetCountry.GetName]の人々のあいだに団結の気運が生まれた。"
 flavor_pis.6.desc.c: "[ShowLocationName('pisa')]には、ジョーコ・デル・ポンテを目当てに[ShowContinentName('europe')]各地から多くの人々が集まった。アルノ川沿いの行列は観衆を大いに魅了し、武に秀でた者たちは橋取り合戦に加わり、自らの陣営に勝利をもたらそうと奮闘した。祭りを眺めるだけの者もいたが、彼らはこの年中行事での喜びに満ちた体験を母国へ持ち帰り、[ROOT.GetCountry.GetName]が毎年催すこの祭りの評判を広めた。"
 flavor_pis.6.a: "たとえ束の間でも、この安定を味わおう。"
 flavor_pis.6.b: "この祭りの噂は、あらゆる地へと届くことになる。"
 flavor_pis.6.c: "[target_character.GetNameWithNoTooltip]を昇格させよう。"
 flavor_pis.6.c.entry: "このキャラクターを昇格させよう。"
 flavor_pis.6.d: "身元も定かでない者を[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に仕えさせるつもりはない。"
 flavor_pis.6.d.entry: "身元も定かでない者を国に仕えさせるつもりはない。"
 flavor_pis.1000.entry: "$flavor_pis.1000.title$"
 flavor_pis.1000.title: "新しい指導者"
 flavor_pis.1000.desc: "[ROOT.GetCountry.GetName]は深刻な危機に陥っている。\n\n膨れ上がる負債、経済の衰退、不安定な情勢により、[target_character.GetName]の脆弱な政権は外国からの支援を切実に必要としており、多くの者がその権威を疑うようになったのだ。このまま崩壊を見過ごすわけにはいかないと、富裕層や有力者たちは[ROOT.GetCountry.GetFlavorRank]を治める新たな候補を選ぶべく集まった。[target_country.GetName]の[target_country.GetGovernment.GetRuler.GetDynasty.GetName]家を推す者は、彼らが経済的な後ろ盾となると考えている。一方、[target_country2.GetName]の[target_country2.GetGovernment.GetRuler.GetDynasty.GetName]家を支持する声もあり、さらには[target_country3.GetName]の[target_country3.GetGovernment.GetRuler.GetDynasty.GetName]家こそ最良の選択であり、迎えないのは愚かだとまで唱える者もいる。"
 flavor_pis.1000.a: "[target_country.GetNameWithNoTooltip]に書簡を送ろう。"
 flavor_pis.1000.a.entry: "彼らに書簡を送ろう。"
 pis_offer_rulership_to_country1: "[target_country.GetName]に統治権の譲渡を提案する。相手が承諾した場合、以下が発生する："
 pis_a_member_of_target_country_dynasty_becomes_ruler: "[target_country.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]の一員が、我らの[ruler|e]となる"
 flavor_pis.1000.b: "[target_country2.GetNameWithNoTooltip]を選ぶのが最善だ。"
 flavor_pis.1000.b.entry: "ほかの国を選ぶのが最善だ。"
 pis_offer_rulership_to_country2: "[target_country2.GetName]に統治権の譲渡を提案する。相手が承諾した場合、以下が発生する："
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "[target_country2.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]の一員が、我らの[ruler|e]となる"
 flavor_pis.1000.c: "[target_country3.GetNameWithNoTooltip]の統治者こそが最もふさわしい。"
 flavor_pis.1000.c.entry: "この案の統治者こそが最もふさわしい。"
 pis_offer_rulership_to_country3: "[target_country3.GetName]に統治権の譲渡を提案する。相手が承諾した場合、以下が発生する："
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "[target_country3.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]の一員が、我らの[ruler|e]となる"
 flavor_pis.1000.d: "我らの[ROOT.GetCountry.GetFlavorRank]を宿敵に売り渡すつもりはない。"
 flavor_pis.1001.title: "$flavor_pis.1000.title$"
 flavor_pis.1001.desc: "[from_country.GetName]における政治危機は頂点に達しつつあり、同国の有力者を代表する使者が救援を求め、我らが[ROOT.GetCountry.GetGovernment.GetCourtTitle]を訪れている。彼らは[ROOT.GetCountry.GetGovernment.GetRuler.GetName]に対し、[target_character.GetName]を[from_country.GetFlavorRank]の新たな統治者として擁立するよう求め、さらに[target_character.GetName]への財政的支援も願い出ている。"
 flavor_pis.1001.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]家の影響力を拡大する絶好の機会だ。"
 flavor_pis.1001.a.entry: "影響力を拡大する絶好の機会だ。"
 flavor_pis.1001.b: "そんな繋がりは我らを貶めるだけだ。"
 flavor_pis.1100.entry: "$flavor_pis.1100.title$"
 flavor_pis.1100.title: "至高の威厳において"
 flavor_pis.1100.desc: "[ShowLocationName('pisa')]の学者たちは[ShowRegionName('italy_region')]全域においてその名を知られているが、[ROOT.GetCountry.GetName]には正式に認められた学術機関が存在しない。この状況を受け、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]たちは[target_character.GetName]に対し、[ShowLocationNameWithNoTooltip('pisa')]を正式なストゥディウム・ゲネラーレとして認可するよう[target_character2.GetName]に嘆願してはどうかと提案した。認可されれば、自立した学術機関が発展できるようになるだろう。"
 flavor_pis.1100.a: "[GetCountry('PAP').GetCapital.GetNameWithNoTooltip]に使節団を派遣しよう。"
 flavor_pis.1100.a.entry: "$PAP$に使節団を派遣しよう。"
 flavor_pis.1100.b: "我らが[GetCountry('PAP').GetAdjectiveWithNoTooltip]の政争に関わる必要はない。"
 flavor_pis.1100.b.entry: "我らが$PAP_ADJ$の政争に関わる必要はない。"
 flavor_pis.1101.title: "$flavor_pis.1100.title$"
 flavor_pis.1101.desc: "[from_country.GetName]の[target_character.GetName]が、わが国に使節団を送ってきた。[target_character.GetHerHis|U]の使節たちは[ShowLocationName('pisa')]における学問の隆盛を称え、[from_country.GetFlavorRank]には学者を志す者が多いと語った。こうした事情から、彼らは[ROOT.GetCountry.GetName]から正式な認可の印章を授与し、[from_country.GetFlavorRank]内に公的な学術機関を設立する許可を与えてほしいと要請している。"
 flavor_pis.1101.a: "承認しよう。"
 flavor_pis.1101.b: "[ShowRegionNameWithNoTooltip('italy_region')]には学ぶ場がいくらでもある。"
