l_japanese:
 flavor_gra.1.title: "ムーア人難民"
 flavor_gra.1.desc: "慈悲あまねく慈愛深きアッラーの御名において——グラナダが異教徒の手に落ちた！ アル＝アンダルスの最後の至宝にして学問の灯台だったグラナダは、いまやカスティーリャの手に落ちた。この喪失にイスラム世界が動揺するなか、ムーア人難民が北アフリカや中東のイスラム都市や宮廷に押し寄せ、アブー・アル＝ワリード・イブン・ルシュド、アブー・アル＝カースィム・アッ＝ザフラウィー、アブー・バクル・イブン・トファイルのような卓越した学者たちの作品や知識をもたらした。これらの難民を受け入れれば、[ROOT.GetCountry.GetName]の科学と文化の発展に大きな弾みがつくかもしれない。"
 flavor_gra.1.a: "ぜひ彼らを[ROOT.GetCountry.GetNameWithNoTooltip]に受け入れよう！"
 flavor_gra.1.a.entry: "ぜひ彼らをわが国に受け入れよう！"
 flavor_gra.1.b: "彼らは不要だ。"
 flavor_gra.2.title: "シチリア首長国"
 flavor_gra.2.entry: "$flavor_gra.2.title$"
 flavor_gra.2.desc: "1087年に十字軍がこの島を征服するまで、シチリア首長国は我々の信仰の強固な砦だった。\n\nそしていま、我々はこの切望してきた地をこの手に収めた。二度とこの支配を失うことはしない！"
 flavor_gra.2.a: "絶対的な支配には、絶対的な権威が必要だ。"
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "行政投資"
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "シチリアは直接支配したほうが、我々にとってより有用だ。この島を繁栄に導くために、より多くの資源を投入しよう。"
 flavor_gra.3.title: "[GetCountry('TUR').GetNameWithNoTooltip]からの支援"
 flavor_gra.3.entry: "オスマンへの支援要請"
 flavor_gra.3.desc: "わが国と[GetCountry('CAS').GetName]のこの戦争は、絶望的な状況だ。ゆえに、信仰の同胞に助けを求めなければならない。助けを請うという屈辱に耐えさえすれば、[GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName]が助力に応じるかもしれない！"
 flavor_gra.3.a: "彼らは唯一の希望だ！"
 flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip|U]が[GetCountry('CAS').GetNameWithNoTooltip]から守ってくれるかもしれない。"
 flavor_gra.3.b: "我々は独力で立ち向かわなければ。"
 flavor_gra.3.historical_info: "グラナダのナスル朝の統治者はオスマン帝国と$mamluks$に使者を送り、カスティーリャと戦うための援助を求めた。グラナダは西地中海での存在感を増していたオスマン帝国を支援するため、20万のオスマン帝国軍をバレンシアに上陸させる計画を積極的に推し進めた。"
 flavor_gra.4.title: "失望の返答"
 flavor_gra.4.entry: "$flavor_gra.4.title$"
 flavor_gra.4.desc: "[GetCountry('TUR').GetName]から、我々の支援を「拒否する」という報せを受け取った。彼らには差し迫ったほかの問題があり、不本意の返答であるという。その代わりに書簡には、アル＝アンダルスの栄光を雄弁に讃える言葉が記されていた。その栄光がとうに失われていることに、彼らは気づいていない。"
 flavor_gra.4.a: "我々は戦いつづけなければ！"
 flavor_gra.4.historical_info: "グラナダの統治者たちはオスマン帝国と$mamluk$の支援を切に望んでいたが、この二国間で戦争が起こったため、直接的な援助はほとんどされなかった。オスマン帝国はケマル・レイス率いる艦隊を派遣し、西地中海のカスティーリャ領を急襲したが、この艦隊はのちに多くの難民が海を渡る助けとなった。"
 ibn_khaldun_patronage: "並外れた知性と名声をもつ1人の人物が、わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]にやってきた。有名な歴史家であり哲学者であるこの[target_character.GetName]は、研究と執筆を続けるための後援を求めているようだ。統治、経済、帝国の興亡に関するその洞察は広く知られており、[target_character.GetHerHis]の存在はわが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の威信を高めると同時に、貴重な助言者ともなってくれるだろう。[target_character.GetHerHim]に望む地位を与えてもよいものだろうか？"
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip]が後援を求む"
 flavor_gra.5.entry: "イブン・ハルドゥーンが後援を求む"
 flavor_gra.5.desc: "$ibn_khaldun_patronage$"
 flavor_gra.5.a: "いいだろう。"
 flavor_gra.5.b: "そのような無為な出費などしない！"
 flavor_gra.6.title: "海峡の真珠"
 flavor_gra.6.entry: "$flavor_gra.6.title$"
 flavor_gra.6.desc: "[target_location.GetName]のワーリーからの使節が到着した。城壁は持ちこたえ、港は活気づき、今月の国庫への送金は、わが[ROOT.GetCountry.GetFlavorRank]のなかで今年最大の額となった。アルカサバと、そこを見下ろすようにそびえるヒブラファロ城からは、晴れた朝には海峡の反対側まで見渡すことができる。それこそが、[ROOT.GetCountry.GetGovernment.GetCourtTitle]が把握すべき情報の大部分を占めているのだ。\n\n[ROOT.GetCountry.GetCapital.GetName]は我々に王座をもたらすが、[target_location.GetNameWithNoTooltip]はそれ以外のほぼすべてをもたらしてくれる。その埠頭はわが国の関税収入の大部分を処理している。[GetCountry('GEN').GetAdjective]の代理商は当然のごとくそこで冬を越し、その内陸部で圧搾された甘口の酒精強化ワインは[GetCountry('FLA').GetName]でも販売されている。ここは我々が支配する都市のなかで、最も失うことが許されないと地と言えるだろう。\n\nそれこそが、他国がこの都市に関心を寄せる理由である。[GetCountry('CAS').GetName]は2世代にわたってこの港を目を付けている。わが一族の多くも同様である。のちに王となった男たちのうち、その城壁から初めて旗揚げした者は1人ではない。のちにその王が鎮圧した反乱軍の何者かも同じである。"
 flavor_gra.6.a: "マラガを王冠そのもののように守ってみせる。"
 flavor_gra.6.historical_info: "マラガはグラナダ王国の第2の都市であり、中世イスラム世界において特に重要な地中海港のひとつであった。1239年にナスル朝がハンマード朝時代の最後のタイファを併合した後、マラガにはスルタンから直接任命されたワーリーが置かれた。最初に務めたのはムハンマド1世の兄弟イスマーイールで、その後もワーリーは王室の近親者によるほぼ恒久的な世襲職として維持された。\n\n都市の防衛は、港を見下ろす丘に建つ宮殿要塞のアルカサバと、そこにコラチャと呼ばれる屋根付きの壁で結ばれたさらに高所のヒブラファロ城を中心としていた。その高台からは、ジブラルタル海峡を回航する船を、入港する数日前から監視することができた。そして眼下では、ジェノヴァ、カタルーニャ、マグリブの商人が「フンドゥク」に宿泊する。マラガの関税収入は、ナスル朝最大の収入源になっていた。\n\nその輸出先は遠くフランドルやエジプトにまで及んだ。アンダルスの絹、ラスター彩陶器、アクサルキア地方の干しイチジクやレーズン、そしてヨーロッパの市場でこの都市に不朽の名声をもたらすことになる甘口の酒精強化ワインが、すべてここの港から輸出された。また、グアダルメディナ川沿いの造船所では、同盟関係にあったマリーン朝とともに海峡を警備したナスル朝のガレー船が製造された。\n\nマラガの統治権は名誉であったが、危険も伴うものであった。その職は王位への踏み台であると同時に、王朝が分裂するたびに反乱の拠点となった。「赤いスルタン」ことムハンマド6世は1359年にこの都市で旗揚げした。1487年にはカトリック両王によってマラガが陥落し、半島におけるアンダルス支配が終焉を迎える。そしてその5年後、グラナダも陥落することとなる。"
 flavor_gra.9.entry: "$flavor_gra.9.title$"
 flavor_gra.9.title: "セファルディ系ユダヤ人"
 flavor_gra.9.desc: "[ShowRegionName('iberia_region')]は長年にわたり[ShowReligionName('judaism')]徒にとって主要な地でありつづけ、繁栄する諸都市は彼らの共同体を受け入れてきた。こうした歴史から、多くのユダヤ人が[target_location.GetName]の[target_location.GetRank.GetName]を、迫害や差別なく暮らしを送ることができる安息の地にしようと決めたのだった。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]はすでにこの動きに気づいている。支持する者もいるが、信仰への考え方が極端な者もおり、彼らはこれを[ROOT.GetCountry.GetFlavorRank]の神聖なるものに対する汚点とみなし、[target_location.GetNameWithNoTooltip]を汚させてはならないと主張している！"
 flavor_gra.9.a: "ユダヤの人々の権利を守ろう。"
 flavor_gra.9.b: "[ROOT.GetCountry.GetReligion.GetGodName]は、不信心者たちが平穏に暮らすことを決して許さないだろう！"
 gra_jewish_people_in_target_location_become_unhappy: "[target_location.GetName]に居住するすべてのユダヤ人[pop|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]を失う"
 flavor_gra.10.entry: "統治者の暗殺"
 flavor_gra.10.title: "[target_character.GetNameWithNoTooltip]の暗殺"
 flavor_gra.10.desc: "悲劇が[ROOT.GetCountry.GetName]を襲った！\n\n[target_location.GetName]での祈りのあと、殺意を抱いた狂人が[target_character.GetName]を襲撃し、重傷を負わせたようである。いかに優れた医師たちも無数の傷を癒やすことはできず、数時間後に[target_character.GetNameWithNoTooltip]の死亡が宣言された。\n\nこれにより[ROOT.GetCountry.GetGovernment.GetCourtTitle]は悲しみに包まれているが、一部の者は暗殺が仕組まれたものだと固く信じている。[target_character.GetNameWithNoTooltip]の統治に反対する者たちが殺人犯に好機を与えるため、意図的に護衛たちの注意を逸らさせたという主張だ。だが、真実を知る者は誰一人としておらず、棺の蓋を閉じるのが賢明であろう。"
 flavor_gra.10.a: "[ROOT.GetCountry.GetNameWithNoTooltip]はどうなってしまうのか？"
 leader_is_scarred: "#Y [target_character.GetName]が生き延びるが、傷を負う#!"
 leader_dies: "#Y [target_character.GetName]が死亡する#!"
 flavor_gra.11.entry: "$flavor_gra.11.title$"
 flavor_gra.11.title: "[ShowLocationNameWithNoTooltip('granada')]の[ShowGoodsNameWithNoTooltip('silk')]"
 flavor_gra.11.desc: "[ROOT.GetCountry.GetName]で生産される[ShowGoodsName('silk')]はおそらく[ShowContinentName('europe')]全土で最も名高いものだ。[ShowLocationName('genoa')]と[ShowLocationName('venice')]だけでなく、[ShowLocationName('prague')]の商人までもが、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の需要を満たすためにこの贅沢品を買い求める。我々にとっては非常に利益の大きい取引である。\n\nわが国の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は、[ShowGoodsNameWithNoTooltip('silk')]の輸出から金銭的な利益を得るだけではなく、それを普及させて世界中が求めるものにし、その交易を独占してわが国の威信を高めることを望んでいる。"
 flavor_gra.11.a: "[ShowLocationNameWithNoTooltip('granada')]の[ShowGoodsNameWithNoTooltip('silk')]は世界中で人気を博するだろう！"
 unlock_expand_iberian_silk_decision: "[decision|e]「$gra_expand_seda_de_granada.title$」がアンロックされるが、そのためには[ShowLocationName('murcia')]を征服する必要がある"
 flavor_gra.12.entry: "$flavor_gra.12.title$"
 flavor_gra.12.title: "商業的機会の掌握"
 flavor_gra.12.desc: "我々の[ShowGoodsName('silk')]は[ShowContinentName('europe')]全土で最も名高い。[ROOT.GetCountry.GetName]中の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が、利益を得るためだけでなく、世界にその比類なき品質を示すためにこの特産品を販売しようとしている。だが彼らだけでは成し遂げられないため、交易を継続させるために交易路を確立するよう我々に要請してきた。これは[ShowGoodsNameWithNoTooltip('silk')]の交易に関して、わが国の評判と威信を維持する役にも立つだろう。"
 flavor_gra.12.a: "交易を外交的に拡大していこう。"
 flavor_gra.13.entry: "$flavor_gra.13.title$"
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
 flavor_gra.13.desc: "[ROOT.GetCountry.GetName]の存続のため、多くの志願兵がわが軍に参加した。\n\n主に[ShowCultureGroupName('amazigh_group')]系である志願兵は、有能だが気まぐれな[target_character2.GetName]の指揮下にある。[ShowSituationName('battle_for_the_strait')]におけるわが国の独立のために、我々は可能なかぎり多くの不確定要素を制御下に置かなければならず、志願兵はキングメーカーとして極めて重要な役割を担っている。彼らを外国勢力の支配下に置くのではなく、彼らの組織に[target_character.GetDynasty.GetName]の指導力を浸透させ、裏切りの可能性を排除するべきだ。"
 flavor_gra.13.a: "彼ら全員に仕えてもらおう。"
 flavor_gra.13.b: "わが国に完全な忠誠を誓わない者は排除する。"
 gra_mercenary_company_will_be_weaker_and_more_expensive: "[mercenary|e]部隊の規模が#Y 半減#!し、より費用がかかるようになる"
 flavor_gra.14.entry: "$flavor_gra.14.title$"
 flavor_gra.14.title: "カスル・アル＝リヤド・アス＝サイード"
 flavor_gra.14.desc: "[ShowRegionName('iberia_region')]の[ROOT.GetCountry.GetRank.GetName]としての我らの威信は、主に[ShowLocationName('granada')]の[ShowBuildingTypeName('alhambra')]によってもたらされている。しかし、飽くことを知らない[target_character.GetName]にとっては、それだけでは不十分なのだ。[target_character.GetDynasty.GetName]の栄光を[ShowReligionGroupAdjective('muslim')]世界に広く示すことを望む[target_character.GetNameWithNoTooltip]は、[ShowBuildingTypeNameWithNoTooltip('alhambra')]の中心部に獅子の彫像やムカルナス様式の丸天井で満たされた宮殿を建設しようと、最高の建築家たちを雇うつもりでいる。"
 flavor_gra.14.a: "この計画を後援しよう。"
 flavor_gra.14.b: "[target_character.GetDynasty.GetNameWithNoTooltip]の栄光を世界に知らしめるのだ！"
 flavor_gra.14.b.entry: "わが王朝の栄光を世界に知らしめるのだ！"
 gra_construct_alhambra_increment_tt: "[ShowBuildingTypeName('alhambra')]の最大レベルが#G +1#!増加する"
 flavor_gra.14.c: "飽くことを知らぬ者を満足させようとしてはならない。"
 flavor_gra.15.entry: "$flavor_gra.15.title$"
 flavor_gra.15.title: "闘争に見出す好機"
 flavor_gra.15.desc: "わが国の外交官や諜報員の報告によると、[target_country.GetName]内で不和が生じているという。[target_character2.GetName]が内政に注力せざるを得なくなるほどの激しい内紛であり、彼らによって課された重圧のもと、わが国が一息つく絶好の機会が訪れた。[target_character.GetName]は、対[target_country.GetNameWithNoTooltip]の前線に集中する必要がなくなったので、これを期に[ShowSituationName('battle_for_the_strait')]で優位に立てるのではないかとさえ主張する。"
 flavor_gra.15.a: "やつらの苦難が続くことを祈ろう。"
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "[GetCountry('CAS').GetName]または[GetCountry('MOR').GetName]で[disaster|e]が発生しているあいだ、わが国は[granadan_sovereignty|e]を毎月#G 0.1#!獲得する"
 flavor_gra.16.entry: "$flavor_gra.16.title$"
 flavor_gra.16.title: "[ShowProvinceDefinitionNameWithNoTooltip('malaga_province')]での不和"
 flavor_gra.16.desc: "わが国が[ShowRegionName('iberia_region')]における主権を維持しているにもかかわらず、[GetCountry('MOR').GetName]の統治者たちは、本来わが[ROOT.GetCountry.GetRank.GetName]のものである[ShowProvinceDefinitionName('malaga_province')]の領地に根を下ろしている。\n\n[target_character2.GetName]は、[GetCountry('MOR').GetNameWithNoTooltip]が以前我々に提供したあらゆる支援を考慮すれば、そういった領地はそのままにするべきだと主張する。しかし[ROOT.GetCountry.GetName]の諸階級は、この状況をわが国の独立に対する脅威と捉えており、かつてのわが国の土地を奪還するよう望んでいる。"
 flavor_gra.16.a: "征服に乗り出そう。"
 flavor_gra.16.b: "そんなことをして隣国を怒らせるべきではない。"
 flavor_gra.18.entry: "$flavor_gra.18.title$"
 flavor_gra.18.title: "[GetCountry('CAS').GetNameWithNoTooltip]への反逆"
 flavor_gra.18.desc: "我々は$ADU$の末裔であることに大きな誇りを持っているが、[GetCountry('CAS').GetName]への貢納を余儀なくされており、わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]は屈辱を味わっている。この貢納はわが国の経済の足かせとなる一方で、[ShowRegionName('iberia_region')]の覇権争いにおける我々の宿敵を利する。多くの軍人たちは、この状況を甘受しつづけるのではなく、いまこそくびきを脱し、外国の重荷から逃れる時だと考えている。"
 flavor_gra.18.a: "たとえ今回は失敗したとしても、我々はいつの日かこの鎖を断ち切ってみせる。"
 flavor_gra.18.b: "いまは黙って従おう。いずれまた機会が訪れるだろう。"
 flavor_gra.19.title: "重いくびき"
 flavor_gra.19.desc: "わが国が[from_country.GetName]と築いた関係は崩れ去った。[target_character.GetName]は繁栄を平和に享受するどころか、我々の国境の弱点を見つけ出し、貢納の支払いを停止したのだ。この事態は[ROOT.GetCountry.GetGovernment.GetCourtTitle]でも看過できぬ問題となっており、[from_country.GetNameWithNoTooltip]にその義務を思い出させるよう強く主張している。義務である貢納を拒みつづけるようであれば、[from_country.GetNameWithNoTooltip]を併合する口実にできるかもしれない。"
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip]を手に入れろ！"
 flavor_gra.19.a.entry: "この代償は高くつくぞ！"
 flavor_gra.20.entry: "$flavor_gra.20.title$"
 flavor_gra.20.title: "[ShowLocationNameWithNoTooltip('granada')]の市場の繁栄"
 flavor_gra.20.desc: "わが国の[ShowGoodsName('silk')]の生産と、我らの[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]による[ShowContinentName('europe')]全域での熱心な交易が、[ShowLocationName('granada')]における新たな市場の創出につながった。これを受け、多くの[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]がこの交易を拡大しようと意欲を燃やし、持つかぎりの影響力とダカットを用いて計画を後押ししている。\n\n「[ShowBuildingTypeName('al_qaysariyya_market')]」という壮大な[ShowBuildingTypeName('marketplace')]が建設される予定で、[ShowRegionName('iberia_region')]最大の交易中心地として機能し、外国の商人を呼び込み、わが国の商人に世界の隅々まで交易をおこなうよう促すものとなる。"
 flavor_gra.20.a: "[ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')]を建設しよう。"
 flavor_gra.20.b: "今回は[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の期待を裏切らざるを得ない。"
 flavor_gra.1000.entry: "$flavor_gra.1000.title$"
 flavor_gra.1000.title: "目立つ人物"
 flavor_gra.1000.desc: "近隣諸国との血みどろの紛争が続いた近年、[ShowDynastyName('nasrid_dynasty')]朝の一員が[ROOT.GetCountry.GetName]全土にその名を知らしめた。[target_character.GetName]という名のこの[target_character.GetWomanMan]は、数千もの兵士を鼓舞することができる優れた軍事指導者であることを証明したのだ。[target_character2.GetName]はこの者に注目し、[target_character.GetHerHim]を[ROOT.GetCountry.GetGovernment.GetCourtTitle]に近づけたいと望むようになった。しかし[target_character.GetNameWithNoTooltip]は底知れぬ野心を示しており、[target_character2.GetNameWithNoTooltip]の側近たちの多くが懸念を抱いている。"
 flavor_gra.1000.a: "偉大な国には偉大な人物こそふさわしい。"
 gra_yusuf_will_most_likely_rebel: "[target_character.GetName]を[ROOT.GetCountry.GetName]に招聘すると、ほぼ確実にいずれ[target_character2.GetName]の打倒を試みる"
 flavor_gra.1000.b: "そのような危険を冒すべきではない。"
 gra_banishing_yusuf_prevents_the_rebellion: "[target_character.GetName]を追放すれば、[target_character.GetSheHe]が反乱を起こす可能性はなくなる"
 flavor_gra.1000.c: "我々の情報網によれば、この計画は裏目に出るだろう。"
 flavor_gra.1001.title: "[target_character.GetNameWithNoTooltip]の反乱"
 flavor_gra.1001.desc: "[target_character.GetName]は自身の人気を利用して多くの支持者を集め、いまでは[target_character2.GetName]に比肩する権力と影響力を有している。そしてその支持者たちが、わが国の指導者に対して最後通牒を突きつけてきた。退位して[target_character.GetNameWithNoTooltip]にその地位を譲らなければ、[ROOT.GetCountry.GetName]は破滅的な戦争に突入することになると。"
 flavor_gra.1001.a: "僭称者に統治権を譲ることはない！"
 flavor_gra.1001.b: "今夜、血が無意味に流れることはない。[target_character2.GetNameWithNoTooltip]は退位する。"
 flavor_gra.1001.b.entry: "今夜、血が無意味に流れることはない。王座を譲ろう。"
 flavor_gra.1100.entry: "$flavor_gra.1100.title$"
 flavor_gra.1100.title: "新星あらわる"
 flavor_gra.1100.desc: "最前線の兵士たちのあいだでは、階級を着実に上げ、すでに将軍にまで上り詰めた若く有能な[target_character.GetWomanMan]の噂が広まっていた。この[target_character.GetName]という人物はタカのように戦場全体を見渡し、激戦の最中でも戦略的な決断を的確に下すことができるという。また剣の腕も比類なく、対峙したすべての敵を打ち負かしてきたとも。これらの話が真実であるかどうかは、時が経てば明らかになるだろう……"
 flavor_gra.1100.a: "その者の今後を注意深く見守ろう。"
 flavor_gra.1100.b: "そのような者は問題しか起こさないものだ。"
 flavor_gra.1101.title: "群れのなかの一羽"
 flavor_gra.1101.desc: "どうやら、我々の兵士たちのとんでもない主張は少なくとも部分的には本当らしい。その[target_character.GetWomanMan]は、自身の連隊のみで側面からの騎兵突撃を押し返すという、奇跡的な偉業を成し遂げたのだ。わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の家臣たちは、[target_character.GetSheHe]に偉大な称号を与えるべきだと考えているようであり、勇敢な行為に報いるのは賢明に思える。[target_character.GetSheHe|U]は数多いる者の一人にすぎないかもしれないが、ハーリド・イブン・アル＝ワリードの再来であるという可能性もある。"
 flavor_gra.1101.a: "このような者はいくらいてもいい。"
 flavor_gra.1102.title: "支持者に囲まれ"
 flavor_gra.1102.desc: "我々が[target_character.GetName]に貴族の称号を授けて以来、その側近たちは[target_character.GetHerHis]の家臣のように振る舞いはじめ、身の回りの世話を焼き、不在のときには代理として話すようになった。[target_character.GetNameWithNoTooltip]が[ROOT.GetCountry.GetCapital.GetName]で授かった邸宅では往来が増えており、群衆がその顔を一目見ようと押しかけている。その偉業を宗教的熱狂の域に達するほど大げさに語る者もいて、まるで崇拝しているかのようだ。"
 flavor_gra.1102.a: "異彩を放っているな……"
 flavor_gra.1103.title: "僭称者の台頭"
 flavor_gra.1103.desc: "[target_character.GetName]の従者が過剰な行動を取る理由がついに判明した。彼らは、この将軍こそがかつて[ShowRegionName('iberia_region')]を黄金期へと導いた伝説的な[ShowDynastyName('umayyad_dynasty')]朝の分家の末裔だという噂を広めているのだ。この主張を否定することも、裏付けることもできないが、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の一部はこの僭称者に便乗して地位を高める好機だと考えている。その支持層はすでに師団規模にまで成長しており、軍に対する我々の権威を脅かすおそれがある。"
 flavor_gra.1103.a: "何も起こらないことを願おう。"
 flavor_gra.1104.title: "決断の日"
 flavor_gra.1104.desc: "くそっ！ あの男が王座に牙をむいた！ [ShowDynastyName('umayyad_dynasty')]朝の血統を根拠に、忠実な従者を召集し、わが国の大都市に進軍するよう命じたのだ。各都市で大規模な動乱を引き起こし、我らの王座に対する権利を喧伝している。[ShowDynastyNameWithNoTooltip('umayyad_dynasty')]朝による[ShowLocationName('cordoba')]の統治が我々の先祖に大いなる繁栄をもたらしたことは否定しようがないが、この[target_character.GetWomanMan]が[ShowDynastyNameWithNoTooltip('umayyad_dynasty')]家の末裔という主張は胡散臭いとしか言いようがない。しかし、戦場における伝説的な武勇の数々を聞いた民衆は意に介さない。身分を問わず数多の人々がその大義を支持しており、すでに[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]の退陣を叫んでいる。"
 flavor_gra.1104.a: "僭称者を叩き潰せ！"
 flavor_gra.1104.b: "我々では太刀打ちできない。"
 flavor_gra.1200.entry: "$flavor_gra.1200.title$"
 flavor_gra.1200.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]からの支援"
 flavor_gra.1200.desc: "[ShowSituationName('battle_for_the_strait')]の激化に伴い、わが国の存続は何よりも、他国による介入にかかっている。[GetCountry('CAS').GetName]と[GetCountry('MOR').GetName]の両国が我々を制圧しようと競い合っている以上、外部勢力に助けを求めるのは当然のことだ。[ShowRegionName('maghreb_region')]諸国はこの問題に関してそれぞれ異なる見解を持つ同胞であり、とりわけ[strongest_maghreb_country.GetName]はそのなかで群を抜いている。[target_character2.GetName]に支援を求めれば、この戦いにおいて軍事的な優位性を得ることができるかもしれない。"
 flavor_gra.1200.a: "我々は切実に支援を必要としている。"
 flavor_gra.1200.b: "わが国の守護を外国に頼ることはしない。"
 flavor_gra.1201.title: "$flavor_gra.1200.title$"
 flavor_gra.1201.desc: "[from_country.GetName]が[ShowRegionName('iberia_region')]の情勢についてわが国に接触してきた。彼らは窮地に立たされており、主権への脅威に対抗するためにあらゆる手段で支援してほしいと求めている。ダカットであれ兵士であれ、母国の防衛に資するのであればどちらでもいいとのことだ。"
 flavor_gra.1201.a: "ダカットを提供しよう。"
 flavor_gra.1201.b: "わが国の兵士を提供しよう。"
 flavor_gra.1201.c: "ダカットと兵士、両方を提供しよう。"
 flavor_gra.1201.d: "なぜ我々がこの紛争に介入する必要がある？"
 flavor_gra.1300.entry: "$flavor_gra.1300.title$"
 flavor_gra.1300.title: "東方からの支援"
 flavor_gra.1300.desc: "[target_country.GetName]が[ShowLocationName('constantinople')]を陥落させ、イスラム世界は[ShowContinentName('europe')]の[ShowReligionGroupAdjective('christian')]諸王国に大きな打撃を与えた。[target_character2.GetName]は意気揚々とした様子で、勢力圏を既知の世界へと広げていくことに意欲を示している。この機会を利用して[target_country.GetCapital.GetName]に使節団を送れば、彼らから経験豊富な将軍や兵士を獲得できるかもしれない。"
 flavor_gra.1300.a: "使節団を派遣しよう。"
 flavor_gra.1300.b: "我々が生き残るためにやつらの助けなど必要ない。"
 gra_demand_a_mercenary_company: "[target_country.GetName]に対して、[gold|e]か、[characters|e]の1人が率いる[mercenary|e]団を提供するよう要求する"
 flavor_gra.1301.title: "$flavor_gra.1300.title$"
 flavor_gra.1301.desc: "[from_country.GetName]の[target_character.GetName]が[ROOT.GetCountry.GetCapital.GetName]に使節団を派遣し、[ShowLocationName('constantinople')]の征服を祝うとともに、わが軍の功績にこの上ない賛辞を述べた。我々が[ShowReligionGroupName('christian')]徒に大打撃を与えたいま、[from_country.GetNameWithNoTooltip]は[ShowReligionGroupName('muslim')]の灯火を消し去ろうと画策する[ShowRegionName('iberia_region')]のハイエナどもから自らを守るため、わが国に軍事援助を求めている。特に[mercenary_general.GetName]という名の[mercenary_general.GetWomanMan]がこの遠征を率いることに意欲を燃やしており、個人的な栄光だけでなく、[target_character2.GetName]に仕え、[ROOT.GetCountry.GetFlavorRank]の影響力をヘラクレスの柱にまで広げたいと願っている。"
 flavor_gra.1301.a: "わが同胞の征服を阻むことなどできようか？"
 flavor_gra.1301.b: "将軍や兵士を出すことはできないが、ダカットなら提供しよう。"
 flavor_gra.1301.c: "消えかけた炎をなぜ再燃させる必要があるのか？"
