l_japanese:
 parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip]が[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の議席を要求"
 parliaments.1.desc: "[target_city.GetName]の[target_city.GetRank.GetName]は豊かに繁栄してきたが、住民は今期の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で議席を獲得できなかったことに落胆している。[target_city.GetNameWithNoTooltip]の代表者たちは、補償と、将来の利益を確保するための保証を我々に要求してきた。もし要求が受け入れられなければ、彼らは国を去ると脅しているのだ。"
 parliaments.1.a: "要求を受け入れよ！"
 parliaments.1.b: "そんなことは受け入れられない！"
 parliaments.2.title: "選挙区の腐敗"
 parliaments.2.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]におけるその重要な地位により、[target_location.GetName]はわが国の政治に大きな影響力を誇っている。しかし、[envious.GetName]の市民たちは[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で自分たちの意見が十分に反映されていないと感じている。そして現在、[envious.GetNameWithNoTooltip]市民が[ShowBuildingTypeName('urban_parliament_seat')]と、それに伴うすべての権利を求めてきた。彼らの要求自体は妥当に思えるが、それは同時に[target_location.GetNameWithNoTooltip]の議席を剥奪することにもつながる。これはわが国の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]には重大な侮辱と受け取られるだろう。"
 parliaments.2.a: "不公平であろうとなかろうと、議席は[target_location.GetNameWithNoTooltip]の権利だ！"
 parliaments.2.b: "議席を別の地域へ割り当てろ。"
 parliaments.3.desc_generic: "[target_location.GetName]は[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の力ある議会員であるだけでなく、当地には海外貿易に利害関係をもつ有力事業者の拠点がいくつも存在している。"
 parliaments.3.title: "[target_location.GetNameWithNoTooltip]の経済力"
 parliaments.3.desc: "$parliaments.3.desc_generic$これらの事業者の多くは、賛否両論だった議案が実現しても大きな利益を得られないと判断し、提案を弱めるように[target_location.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員に圧力をかけている。"
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.3.b: "金がほしいのならくれてやれ。"
 parliaments.4.title: "汚職による対立"
 parliaments.4.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にて我々の挙げた議案に対し、[target_location.GetName]の汚職にまみれた[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員らが反対の姿勢を示した。その地域を支配する地主が、この議案が自身の利益にそぐわないと説得されたようだ。"
 parliaments.4.a: "実に運が悪い！"
 parliaments.4.b: "では、我々が地主に賄賂を送ろう。"
 parliaments.5.title: "[target_location.GetNameWithNoTooltip]が議論に勝利"
 parliaments.5.desc: "影響力のある[target_location.GetName][ShowBuildingTypeName('university')]は、[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]を説得し、[ShowBuildingTypeNameWithNoTooltip('university')]資金増額に賛成させることに成功した。"
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.5.b: "研究だけに集中すべきだ。"
 parliaments.6.desc: "$parliaments.3.desc_generic$これらの事業者の多くは、賛否両論だった議案が実現すれば大きな利益を得られると判断し、この議案を成立させるように[target_location.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員に圧力をかけている。"
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.title: "[target_location.GetNameWithNoTooltip]での軍事支援"
 parliaments.7.desc: "陸軍は[target_location.GetName]において多大な影響力を有しており、陸軍出身でいまなお古巣に忠誠を誓う[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちは、現在の議案に賛成票を投じる気でいる。"
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.b: "彼らの支援だけで十分だ。"
 parliaments.8.title: "[target_location.GetNameWithNoTooltip]の影響力"
 parliaments.8.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で現在おこなわれている国内生産の保護に関する討論は、[target_location.GetName]市民の注目の的だ。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の[target_location.GetNameWithNoTooltip]代表者は、提案された政策が地域に大きな利益を及ぼすと期待し、我々の立場を支持している。"
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.8.b: "わが国は結果にかかわらず[target_location.GetNameWithNoTooltip]に投資すべきだ。"
 parliaments.9.title: "[target_location.GetNameWithNoTooltip]の力"
 parliaments.9.desc: "首都の代表者として、[target_location.GetName]は現在提案されている議案が通れば大きく得をするだろう。幸運にも都民はこれに気づき、代表は賛成に立場を変えた。"
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.10.title: "[target_location.GetNameWithNoTooltip]が議論で立場を変えた！"
 parliaments.10.desc: "[target_location.GetName]を代表する[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員がついに、現在討論されている議案が成立した場合の有益さに気づいてくれたようだ。彼らの支持を歓迎する。"
 parliaments.10.desc_b: "[target_location.GetName]を代表する[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員が、現在討論されている議案が成立した場合の有害さを理解したようだ。我々の反対に対する彼らの支援には、大きな価値がある。"
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.11.desc: "現在議論されている議案に関して、ごく最近まで我々と同じ立場だった[target_location.GetName]の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちが突然、意見を正反対に変えてしまった。その理由は定かではないが、もはや彼らの賛成票には期待できない。"
 parliaments.11.a: "彼らは欲に負けたのだろう……"
 parliaments.12.title: "孤立無援の農民"
 parliaments.12.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]にわが国の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]への請願を許可したのは確かだが、この権利はほかの階級が[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にもつ影響力と同等のものではない。そんななか、[ROOT.GetCountry.GetName]の庶民が有力な上流階級ほどの特権を享受していないことが最近の議論で判明した。そしてこの上流階級こそが、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の提案に反対している主勢力である。"
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.12.b: "恐るべき不公平だ！"
 parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]が議論を支配"
 parliaments.13.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]たちによる粘り強い運動が、現在の議論で[ROOT.GetCountry.GetGovernment.GetParliament.GetName]を味方につけるに至った。社会的地位の低さにもかかわらず、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]たちの声は国の議論において平等に受け入れられたのだ。"
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.13.b: "国民の要求は聞き入れられるだろう。"
 parliaments.14.desc_common: "[target_location.GetName]の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちは、わが国の経済の中心地のひとつを代表していることから、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]でも影響力ある地位を占めている。"
 parliaments.14.title: "[target_location.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]"
 parliaments.14.desc: "$parliaments.14.desc_common$彼らの富は[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に大きな影響力をもつが、議論されている議案は成立すれば彼らに利益をもたらすため、その資金は幸いにも議論の妨害ではなく支持を買うことに用いられている。"
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.15.title: "[target_location.GetNameWithNoTooltip]の重荷"
 parliaments.15.desc: "[target_location.GetName]の住民は、海上インフラへの投資増額案を快く思っていないようだ。軍事費に多額の支援をしてきた彼らは、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]がより一層の資金を要求するのではなく、むしろ自らの地域の裁量で使える予算を増やしてくれることを期待していた。"
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.15.a.tt: "[target_location.GetName]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%]減少する"
 parliaments.16.title: "[target_location.GetNameWithNoTooltip]での海洋支配"
 parliaments.16.desc: "[target_location.GetName]では海軍が優位に立っているため、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]での陸軍への支出増額案は冷ややかに受け止められている。当初は、この議案を受け入れていた当該選挙区の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員らは、民意に背かないよう否定的な立場を余儀なくされている。"
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.17.desc_common: "[target_location.GetName]の住民は我々とは異なる宗教を信じる者が多く、[target_location.GetNameWithNoTooltip]を代表する[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちは、国の信仰よりも彼らの利益を代表していると非難されている。"
 parliaments.17.title: "[target_location.GetNameWithNoTooltip]の信仰"
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$しかしこのような非難は、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]のほかの議員から失笑を買うだけである。わが国においては、異なる信仰をもつ者であってもその価値を認められることは珍しくないからだ。"
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$これらの過激な非難は[target_location.GetNameWithNoTooltip]の評判を傷つけ、現在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で議論されている議案への支持にも悪影響を及ぼしている。"
 parliaments.17.a: "これは[ROOT.GetCountry.GetReligion.GetGodName]のご意志だ。"
 parliaments.18.title: "[target_location.GetNameWithNoTooltip]の期待"
 parliaments.18.desc: "現在議論されている議案において、[target_location.GetName]を代表する[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちは、予想外にも我々の意見に理解を示している。これはおそらく、議案が可決した際に必要になる計数や測定に[target_location.GetNameWithNoTooltip]大学が関与できると確信しているからだろう。大学の学者たちは国家全体に関する、生きたデータの収集に参加できる機会を決して逃したくないのだ。"
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 parliaments.19.title: "無能な[target_character.GetNameWithNoTooltip]"
 parliaments.19.desc: "現在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で討論されているわが国の[ROOT.GetCountry.GetGovernment.GetCabinetTitle]構成に関する議論のなかで、[target_character.GetName]の深刻な無能ぶりが明らかとなった。その任期中、[target_character.GetHerHis]の能力は急速に低下しているように思われ、完全に交代させることを検討すべきかもしれない。"
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.20.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]での生活"
 parliaments.20.desc: "[ROOT.GetCountry.GetCapital.GetName]から遠く離れた地域に暮らす[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちの多くは、慣れ親しんだ生活と首都での生活とが大きく異なることに不満を抱いている。彼らは[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]が窮屈で不潔だと主張しており、帰郷を心待ちにしている様子だ。\n\n今年は特に、繊細で好き嫌いの多い[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちにとって耐えがたい一年となったようである。夏は非常に暑く、雨季の洪水量は異常で、冬は例年よりも冷え込んだ。いまや相当数の議員が我慢の限界に達し、滞在をより快適なものにするよう我々に要求している。"
 parliaments.20.a: "可能なかぎり改善しよう。"
 parliaments.20.b: "議員だけ特別扱いはできない。"
 parliaments.21.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員の醜聞"
 parliaments.21.desc: "現在の議論中、[ROOT.GetCountry.GetCapital.GetName]で些細な醜聞が発生した。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の議員数人が、議論に出席するのではなく、公共の秩序を乱し同胞を困らせていたという報道があった。これに対するほかの議員や市民からの憤りは大きく、この出来事は今後数年間の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に大いに影を落とすことになるだろう。"
 parliaments.21.a: "$common_string_let_it_slide$"
 parliaments.21.b: "この[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員を捕らえる。"
 parliaments.22.title: "欠席議員"
 parliaments.22.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]が国の政治に多大な影響をもたらすことを考慮すれば、選出されたすべての議員が熱意をもって議会に出席し、国民から委ねられた権力を最大限に活用すると期待されるだろう。残念なことに、実際にそれほど熱心な議員以外にも、地方の豪邸で快適な生活を満喫する者や、首都で豪遊する者などがいるため、どの[ROOT.GetCountry.GetGovernment.GetParliament.GetName]でも欠席者が後を絶たない。この問題は、最近になってより一層深刻化しており、他国に嘲笑されている可能性を懸念するばかりだ。出席率を上げるために欠席者に罰金を科すこともできるが、もちろん[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の議員たちはそれを快く思わないだろう。"
 parliaments.22.a: "最も酷い連中に罰金を科せ。"
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 parliaments.23.title: "国会設立の要求"
 parliaments.23.desc: "[ROOT.GetCountry.GetName]の各都市で、国家に対して否定的な出版物が出回るようになった。その著者たちは匿名だが非常に批判的で、わが国は独裁的であり、全[ROOT.GetCountry.GetAdjectiveWithNoTooltip]国民の状況を正しく考慮していないなどの的はずれな主張をおこなっている。さらには、憲法を定めて書き記すことと、国のさまざまな社会集団が代表される国会を設立することも要求している。"
 parliaments.23.a: "これらの出版物を発禁にしろ。"
 parliaments.23.b: "改革を曖昧に約束する。"
 parliaments.24.title: "財政支援"
 parliaments.24.desc: "現在の財政難と、あらゆる資金源を必死に探し求める我々の試みが公になってしまったようだ。これは[ROOT.GetCountry.GetName]内外でのわが国の評判を害するだろうが、いくらかの恩恵もあった。[target_location.GetName]を代表する[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員の幾人かが、支援を申し出たのだ。しかしその代償として、彼らは政府全体における代表性の向上と、国が正式に彼らに支援を求める制度の導入を求めている。"
 parliaments.24.a: "求められた代表権を与える。"
 parliaments.24.b: "条件つきなら支援は不要だ。"
 parliaments.24.c: "彼らの条件を考慮すると約束する。"
 parliaments.25.desc: "$parliaments.14.desc_common$彼らの富は[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に対する大きな影響力があり、残念なことにその富は我々の取り組みに反対するための陳情活動に用いられている。"
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.27.title: "議員の伝統"
 parliaments.27.desc: "議員にとって最も困難なのは[ROOT.GetCountry.GetCapital.GetName]で討議することではなく、選出してくれた地元の人々に対し、討議の内容と妥協点について説明し受け入れさせることだ。それでも、代表性の低い制度で中央政府から派遣された徴税官よりは、地元に選ばれた[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員のほうが増税への理解を得られやすいだろう。\n\nわが国の議員全般、特に[target_location.GetName]選出の議員たちは政策を擁護することに長けており、結果として中央政府全体への支持が高まっていることは確かだ。"
 parliaments.27.a: "民衆はいずれ理解してくれる！"
 parliaments.26.title: "協調的な[ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.26.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]議員たちは、最近非常に協調的な姿勢を示している。この傾向を利用すれば、我々に有利なように彼らを動かすことも、彼らの地元からさらなる資源を引き出すことも可能だろう。"
 parliaments.26.a: "この忠誠心を活用することが最も重要だ。"
 parliaments.26.b: "我々には富が必要だ！"
 parliaments.28.title: "権威の粉砕"
 parliaments.28.desc: "[ROOT.GetCountry.GetCapital.GetName]で予想外かつ珍しい出来事が起こった。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]、そして中流・下層階級の人々が、独自の臨時[ROOT.GetCountry.GetGovernment.GetParliament.GetName]を開いたのだ。不満を共有する彼らは団結し、「[target_debate.GetName]」に関する議論を推し進め、[target_character.GetName]の意志に真っ向から挑むような変革を求めた。支配階級への苛立ちに突き動かされた彼らの多くは、もはや現状に耐えかねており、[target_character.GetShortNameWithNoTooltip]の強い反対にも負けずに声を上げつづけている。"
 parliaments.28.a: "鞭の効き目が薄れてきたようだ！"
 parliaments.29.title: "すべての切り札をもつ[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]"
 parliaments.29.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に正式な苦情を申し立てたが、その不満には同意せざるを得ない。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が権力の大部分を握っており、[ROOT.GetCountry.GetName]の富の大部分を生み出す商人たちが締め出されている。この不均衡を放置すれば、怒りが噴出するだろう。最も古い同盟者への忠誠が、国庫を満たしてくれる人々を遠ざけるほどの価値があるかどうか。我々は決断しなければならない。"
 parliaments.29.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は我々によく仕えてくれた。"
 parliaments.29.b: "商人たちは公正な聴聞を受ける権利がある。"
 parliaments.30.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]における信仰への疑問"
 parliaments.30.desc: "街道や税金について議論するのは大いに結構だが、真の信仰が[ROOT.GetCountry.GetName]全域に行き届いていないと、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]が繰り返し説いてくる。多くの魂がいまだに光の灯らない場所を彷徨っているというのに、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]がどうしてそれよりも些末な事柄に構っていられようか。彼らの主張は説得力があり、居心地の悪さを覚えるほどだ。私たちは、この会期を宗教的な熱意に突き動かされるままにするか、あるいは聖職者の野心を抑制するかを決めなければならない。"
 parliaments.30.a: "信仰のために全力を尽くさねばならない。"
 parliaments.30.b: "宗教的な問題は後回しだ。"
 parliaments.31.title: "虐げられし者たちの声"
 parliaments.31.desc: "分厚い請願書の山が[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に届いた。その一枚一枚に、[ROOT.GetCountry.GetName]で虐げられている者たちの不満が綴られている。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]が持つ権力は極めて小さいが、彼らの不満は危険なほどに大きくなっている。もしこれらの叫びを退ければ、くすぶる怨嗟をはるかに醜いものへと変えてしまう危険がある。もし耳を傾ければ、農民を政治的な武器として利用しようとする者たちをつけあがらせる可能性がある。"
 parliaments.31.a: "彼らの苦難に耳を傾けなければ。"
 parliaments.31.b: "秩序を守らなければならない。"
 parliaments.32.title: "修道院の市場"
 parliaments.32.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が激怒している。修道院の作業場や教会経営の交易所がことあるごとに価格を不当なほど引き下げるのだという。それも、誠実な商人たちが支払わねばならない税金を免除されるという、かなりの優位を享受しながらだ。当然のことながら、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]はこの取り決めにいかなる不正も認めていない。両陣営とも聴聞会を要求しているが、双方の望みを叶えることは不可能である。とは言え、放っておいてもこの小競り合いが解決することはない。"
 parliaments.32.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の言い分には一理ある。"
 parliaments.32.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]はより崇高な目的に従事しているのだ。"
 parliaments.32.c: "どちらにも肩入れは一切しない。"
 parliaments.33.title: "資金はどこへ？"
 parliaments.33.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で声をそろえ、我々としては避けたい質問をしてきた。なぜ負債がこれだけ膨れ上がってしまったのか、と。私たちの支出は確かに莫大であり、債権者たちはしびれを切らしつつある。毅然と反論してこの嵐を乗り切るか、あるいは果たすのが困難な約束をするか。いずれの答えも心地よいものではない。"
 parliaments.33.a: "この支出は[ROOT.GetCountry.GetName]の栄光のためである。"
 parliaments.33.b: "財政を緊縮せねば。"
 parliaments.34.title: "代理権"
 parliaments.34.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]のすべての議員がつねに出席できるわけではない。戦争、病気、そして[ROOT.GetCountry.GetName]の領地間のかなりの距離など、欠席の理由はさまざまだ。そこで[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、議員が欠席する際、代理人に議決権を委任し、派遣することを認めるよう求めてきた。彼らからすると賢明な取り決めだが、王室はかなり異なる見方をしている。代理人だらけの議会では、本来の議員たちのように追い詰めたり説得したりはできない、とのことだ。我々は[ROOT.GetCountry.GetGovernment.GetParliament.GetName]をどのような機関にしたいのかを決めなければならない。"
 parliaments.34.a: "欠席する領主は代理人を送ってよい。"
 parliaments.34.b: "すべての票は本人が投じなければならない。"
 parliaments.35.title: "異例の一致"
 parliaments.35.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で異例の事態が起こった。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が合意できる大義を見出し、声をそろえて持ちかけてきたのだ。こんなことは滅多にないのだから、無駄にするわけにはいかない。受け入れるのが賢明だろうが、それぞれが見返りに何を期待しているのかはつねに疑う必要がある。"
 parliaments.35.a: "結束は[ROOT.GetCountry.GetName]の利になる。"
 parliaments.35.b: "この結束は不穏である。"
 parliaments.36.title: "この戦争の代償"
 parliaments.36.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]は疲弊している。兵士の家族から、破産した商人から、多くの墓を祝福するよう求められた聖職者から寄せられた請願書の山が、勝利の数よりも早く積み上がっている。宣戦布告したときに特に大声で歓声を上げていた者たちでさえ、いまや勘定書が届くと青ざめている。最後には勝つと約束して彼らを再び鼓舞することも、この戦争がもたらした犠牲を認めることもできる。いずれにせよ、議場内に漂うこの空気長く無視しつづけることはできない。"
 parliaments.36.a: "どのような犠牲も、勝てばすべて報われる。"
 parliaments.36.b: "民の悲鳴を無視できない。"
 parliaments.37.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]が戦争に突入"
 parliaments.37.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]がその立場を明確にした。敵は待ってくれず、[ROOT.GetCountry.GetName]の軍も同様である。彼らは[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に対し、緊急召集軍を即座に承認することを要求している。その切迫感に同意するかどうかは別として、戦場では悠長にしていられないというのは間違いない。この参戦要請をどこまで拡大し、誰の息子たちに応じさせるべきかを決めなければならない。"
 parliaments.37.a: "緊急召集軍を承認せよ。"
 parliaments.37.b: "徴兵は強制しない。"
 parliaments.38.title: "帰還した者たち"
 parliaments.38.desc: "彼らはわが国の旗の下で戦い、国境を守るために血を流したが、帰郷したいま、その大部分が忘れ去られている。先の戦役から復員した者たちが土地、金銭、統治者からの謝意など、なんらか形で彼らの軍功に報いることを求め、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に請願してきた。彼らを称えるのに費用はそれほどかからないが、無視をする対価はかなり高くつくかもしれない。"
 parliaments.38.a: "土地を与えよ。"
 parliaments.38.b: "しかるべき報いを兵士たちに与えよ。"
 parliaments.38.c: "軍に仕えるという栄誉が十分な報酬である。"
 parliaments.39.title: "国境沿いの狼の群れ"
 parliaments.39.desc: "隣国たちはその意図を隠そうともしていない。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、国境沿いでの挑発行為に関する情報を[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に持ち込んできた。外交的対話の不履行、部隊の移動など、お決まりの揺さぶり行為が見られるが、不穏な出来事の前触れとなりかねない。時間の猶予があるうちに防衛資金を調達することもできるが、剣が鞘から抜かれる前に、外交的な解決策を模索することもできる。"
 parliaments.39.a: "国境を要塞化せよ。"
 parliaments.39.b: "まず外交官を派遣せよ。"
 parliaments.40.title: "飢えは議会の遅れを待たない"
 parliaments.40.desc: "請願書は平易な言葉で綴られている。同じ内容を書きつづけ、もはや飾る余裕のなくなった言葉である。穀倉は空。子供たちは飢えている。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]がこれを[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に持ち込んできたのは、言葉の力を信じているからではない。ほかに当てがないのだ。私たちはこれを議論の彼方に葬り去ることはできない。何かしらの措置を、迅速に講じなければ。"
 parliaments.40.a: "穀物をただちに買い増せ。"
 parliaments.40.b: "外国の穀物に対しわが国の市場を開放せよ。"
 parliaments.40.c: "市場の自己調整に任せよ。"
 parliaments.41.title: "毎月下がっていく貨幣の価値"
 parliaments.41.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は危機感を募らせており、今回ばかりは大げさに騒いでいるわけではない。価格は合理的な説明がつかないほどの勢いで上昇しており、国庫に流れ込む富の価値は日ごとに目減りしている。このまま放置すれば、[ROOT.GetCountry.GetName]の支払能力を支えている商業階級が破滅しかねない。私たちは断固たる行動をとる必要があるが、その行動がいかなる形をとろうとも、一部の者は喜び、ほかの者は激怒することになるだろう。"
 parliaments.41.a: "緊縮財政政策を導入せよ。"
 parliaments.41.b: "しかるべき者に責任を負わせよ。"
 parliaments.41.c: "最優先で負債を返済せよ。"
 parliaments.42.title: "ふたつの都市にひとつの市場"
 parliaments.42.desc: "両都市ともに[ROOT.GetCountry.GetGovernment.GetParliament.GetName]へ代表者を派遣しており、双方が見事な説得力とかなりの熱量をもって主張を繰り広げている。[ROOT.GetCountry.GetName]における支配的な交易勅許状をどちらが保持すべきかという問題は、自然に解決などしないだろう。我々は一方の都市に独占的な優位性を認めることもできるし、市場を開放し、議会がめったに成し遂げられないこと、すなわち問題の解決を競争に委ねることもできる。"
 parliaments.42.a: "勅許状はひとつ。抜きんでる市場もひとつだけだ。"
 parliaments.42.b: "自由に競争させよ。"
 parliaments.43.title: "[ROOT.GetCountry.GetName]の負債の重み"
 parliaments.43.desc: "台帳の監査は、決して楽しい作業ではない。わが国は認めたくないほどの借金を抱えており、債権者たちは気の長い性分ではない。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]はこれに対処するべく緊急会期を招集した。もっとも、現在議場で叫ばれている3つの矛盾する提案に対し、「対処」という言葉を使うのは寛大すぎるが。我々はどれか1つを選び、その結果を受け入れなければならない。"
 parliaments.43.a: "負債を再編せよ。"
 parliaments.43.b: "返済のために増税せよ。"
 parliaments.43.c: "売れるものはなんでも売れ。"
 parliaments.44.title: "稀な朗報"
 parliaments.44.desc: "今回は珍しく、喜ばしいことを話し合うために[ROOT.GetCountry.GetGovernment.GetParliament.GetName]が招集された。王国は安定しており、国庫は悲鳴を上げておらず、民もここ最近は破滅的なことを企てていない。この稀な幸運をどう活用するのが最善かについて、提案がいくつかなされており、これまた珍しく、議論は礼儀正しく進んでいる。この好機を無駄にはできない。"
 parliaments.44.a: "未来のために布石を打て。"
 parliaments.44.b: "富を民と分け合え。"
 parliaments.44.c: "いずれ来る戦争に備えよ。"
 parliaments.45.title: "権力の中枢に広がる異端"
 parliaments.45.desc: "[ShowContinentName('europe')]を席巻している新しい宗教思想がわが国の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にまで到達し、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は心の平静を失っている。改革派の冊子が回覧され、怒号が飛び交い、先週の会期では殴り合いの喧嘩が辛うじて回避された。これが神学的な論争から、もっと危険な展開へと進んでしまう前に、私たちは立場を明確にしなければならない。"
 parliaments.45.a: "議会は真の信仰とともにある。"
 parliaments.45.b: "議会はすべての声を平等に聞く。"
 parliaments.46.title: "どちらの功績を認めるか"
 parliaments.46.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の双方が、この時代における[ROOT.GetCountry.GetName]芸術の偉大なパトロンとして歴史に残ることを強く願い、互いの貢献度を競い合っている。自分たちのほうが上だと争う様を見ているのは、正直なところなかなか面白いが、過去2期にわたって[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の通常の業務が完全に滞っていることを考えると、そろそろ勝者を決めなければならない。"
 parliaments.46.a: "わが国の文化のルネサンスを導いたのは[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]である。"
 parliaments.46.b: "真のパトロンは[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]である。"
 parliaments.46.c: "どちらも等しく称賛に値する。"
 parliaments.47.title: "危うい時代における危うい言葉"
 parliaments.47.desc: "活版印刷機が[ROOT.GetCountry.GetName]に定着して以来、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は冊子について不満を言いつづけており、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]はそれを配布しつづけている。どの陣営の主張を自由に流通させるべきかについて、どちらも非常に強い意見を携えて[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にやってきた。一方はそれを啓蒙と呼び、もう一方はそれを扇動と呼ぶ。どちらの言葉を好むか、我々は選ばなければならない。"
 parliaments.47.a: "危険な出版物を規制せよ。"
 parliaments.47.b: "冊子を自由に印刷させよ。"
 parliaments.48.title: "神の土地と農民の鍬"
 parliaments.48.desc: "わが国の農村で何世代にもわたってくすぶっている紛争があり、その見苦しく複雑な問題がついに[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に持ち込まれた。修道院の土地が農民の畑を圧迫しており、誰が何を耕作してよいかという問題は、地域的な不満から原則論へと発展している。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は神聖な権利を引き合いに出し、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]は伝統を引き合いに出している。どちらの主張にも一定の理があり、そのことがこの問題を非常に難しくしている。"
 parliaments.48.a: "修道院の権利は神聖である。"
 parliaments.48.b: "係争地を農民に返せ。"
 parliaments.49.title: "新たな領土からの声"
 parliaments.49.desc: "最近獲得した領土の代表者たちが、参政権などを[ROOT.GetCountry.GetGovernment.GetParliament.GetName]に請願するためにやってきた。彼らの声に傲慢さはなく、その秘めたる決意は注目に値する。彼らを[ROOT.GetCountry.GetAdjectiveWithNoTooltip]行政の仕組みに組み入れるか、その要求を退けるか。この決断は、新たな従属国の統治者に対する見方を今後何十年にもわたって決定づけることになるだろう。"
 parliaments.49.a: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]への参政権を与えよ。"
 parliaments.49.b: "従属国に参政権はない。"
 parliaments.50.title: "王国のなかの王国"
 parliaments.50.desc: "地方領地の有力な領主たちが、いつもの要求を新しい言葉に包んで[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にやってきた。「地方統治」などと呼んでいるが、つまりは首都から干渉を受けることなく自分たちの領地を運営したいということである。それは我々に自国の統治を控えろと、礼儀正しく求めているに等しい。魅力的な提案ではある。それが最終的に何をもたらすかを深く考えなければ、だが。"
 parliaments.50.a: "地方の司法権を認めよ。"
 parliaments.50.b: "[ROOT.GetCountry.GetName]全土を王室が統べる。"
 parliaments.51.title: "地方の混乱"
 parliaments.51.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の前に、目を覆いたくなるような報告が提出された。[ROOT.GetCountry.GetName]の一部地域では、国の法律が規則ではなく、単なる提案のような扱いになってしまっているという。地方の役人たちは不在か、無能か、あるいは数が足りていないかのいずれかだ。最も声高に不満を訴えているのが[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]であるということを考えると、報告は嘘ではないのだろう。この事態を放置するわけにはいかない。"
 parliaments.51.a: "行政官を派遣して秩序を回復させよ。"
 parliaments.51.b: "代わりに兵士を派遣せよ。"
 parliaments.52.title: "ふたつの民にひとつの[ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.52.desc: "新たな領土の編入により、新しい民が[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配下に置かれ、[ROOT.GetCountry.GetGovernment.GetParliament.GetName]場へと入ってきた。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は同化に機会を見出しており、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は共存のなかに交易関係の可能性を見出している。どちらも無私無欲ではないが、両者ともに筋は通っている。我々はどんな[ROOT.GetCountry.GetName]を築きたいのかを選ばなければならない。"
 parliaments.52.a: "[ROOT.GetCountry.GetNameWithNoTooltip]はひとつ。文化もひとつであるべきだ。"
 parliaments.52.b: "多様さが我々を強くする。"
 parliaments.53.title: "[target_character.GetNameWithNoTooltip]の問題"
 parliaments.53.desc: "大抵、結果だけで[ROOT.GetCountry.GetGovernment.GetParliament.GetName]を満足させることはできない。[target_character.GetName]は結果を出した。報告書には目に見える成果があり、改善は本物であり、議会もそれに気づいている。しかし、実のところそれが問題なのだ。大臣が突出して有能であると、その手法について疑義が生じる。密かに誰かの願いを袖にしたのではないか？ 裏で誰かに便宜をはかったのではないか？ [ROOT.GetCountry.GetGovernment.GetParliament.GetName]は十分な説明を要求しており、[target_character.GetName]をどこまで追及にさらすか、我々は決めなければならない。"
 parliaments.53.a: "結果がすべてである。"
 parliaments.53.b: "議会の精査に委ねる。"
 parliaments.54.title: "ふたりの大臣、それぞれの意図"
 parliaments.54.desc: "内閣は戦場と化しており、状況は[ROOT.GetCountry.GetGovernment.GetParliament.GetName]にも伝わっている。[target_character.GetName]と[rival_character.GetName]はこの会期中、ずっと互いの足を引っ張り合い、どちらも失敗の非を認めず、相手になすりつけようとしている。二人の対立を楽しんでいるのは、当人らと、どちらが勝つかで賭けをしている者だけであろう。この事態を解決しなければ。"
 parliaments.54.a: "[target_character.GetName]を支持する。"
 parliaments.54.b: "[rival_character.GetName]を支持する。"
 parliaments.54.c: "二人とも罷免せよ。"
 parliaments.55.title: "清廉な議会の汚れた手"
 parliaments.55.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]のなかに、[target_character.GetName]を汚職で告発した者がいる。その告発には、簡単には退けられないだけの詳細が含まれている。その罪状が事実であるか、政治的武器であるかは、誰に尋ねるかによって大きく異なる。そしてそれを尋ねる人物は、出てくる答えに対して多大な影響力を持っている。この問題を追及するか、あるいは威厳ある不承認をもって葬り去るかを決定しなければならない。"
 parliaments.55.a: "告発を調査せよ。"
 parliaments.55.b: "政治的な思惑があって騒いでいるだけだろう。"
 parliaments.56.title: "歴史的な退屈さを伴う、手続き上の不一致"
 parliaments.56.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]が停止した。投票を発声でおこなうべきか点呼でおこなうべきか。代理人は棄権してよいか。発言者の順序の決め方は適切だったか。統治に関わる議題に費やされるべき丸3回の会期が、手続きをめぐる不毛な論争に浪費された。どの問題にも正解があるだろうが、それを提供するのが自分たちでなければ、と願うばかりである。"
 parliaments.56.a: "王権をもって裁定せよ。"
 parliaments.56.b: "議会の混乱は議会に解決させよ。"
 parliaments.57.title: "不満にあふれ、空席の目立つ議会"
 parliaments.57.desc: "わが国でも特に力のある階級が、我慢の限界に達した。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]の方向性に対する彼らの満足度は、好意的に言っても極めて低く、何かが変わらないかぎり今後の出席は保証できないと知らせてきたのだ。この脅しが本当であるか、交渉戦術であるかを判断するのは難しい。確実に言えるのは、有力者が欠席するなかで議会が下す決定は、いささか説得力に欠けるということだ。"
 parliaments.57.a: "彼らが来なくなる前に譲歩する。"
 parliaments.57.b: "言わせておけ。"
 parliaments.58.title: "要求を推し進める[ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.58.desc: "制憲議会は、ふんぞり返って座っているだけの集まりではない。わが国の議会は、いまを要求を強める好機と見た。これまでは明文化されず暗黙の了解であった権利を列挙し、覆せないような先例を確立しようとしているのだ。そのような文書が[ROOT.GetCountry.GetName]の統治を明確にするという、彼らの主張は間違っていない。それが王権を永続的に制限することになるという主張もまた、間違っていない。王権への制限をどこまで明文化するか、我々の覚悟が試される。書面をもって手放した権力は、そう簡単には戻ってこないのだ。"
 parliaments.58.a: "憲章を発行せよ。"
 parliaments.58.b: "王権は明文化の対象ではない。"
