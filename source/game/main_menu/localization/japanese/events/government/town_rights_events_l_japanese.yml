l_japanese:
 town_rights_events.1.title: "[target_location.GetNameWithNoTooltip]の指定商港"
 town_rights_events.1.desc: "我々が[target_location.GetName]の発展に注力してきた結果、[target_location.GetRank.GetName]には収益性の高い商機がやって来るようになった。[target_province.GetName]の行政官たちは、この新たに得られた富をどのように活用すべきかの指針を求めて、我々のもとを訪れている。"
 town_rights_events.1.a: "州全体に恩恵を届けよ！"
 town_rights_events.1.b: "この港をさらに発展させよう。"
 town_rights_events.1.c: "この地全体に富を行き渡らせよ！"
 every_location_in_province_dev_and_prosperity_tt: "[target_province.GetName]内のすべての[location|e]において、[development|e]が[ShowNamedValue('development_weak_bonus')|+]、 [prosperity|e]が[ShowNamedValue('prosperity_mild_bonus')|+=2%]上昇する"
 town_rights_events.2.title: "[target_location.GetNameWithNoTooltip]における商業の停滞"
 town_rights_events.2.desc: "我々は[target_location.GetName][target_location.GetRank.GetName]の発展に全力を注いできたが、海運商人たちはここでの取引を避けているようであり、落胆を禁じ得ない。この停滞が一時的なものに過ぎず、負の連鎖の兆候でないことを願うばかりだ。"
 town_rights_events.2.a: "これは[target_character.GetShortNameWithNoTooltip]にとって問題ではない！"
 town_rights_events.2.b: "ああ、それこそが採算の取れない商売というものだ。"
 town_rights_events.2.c: "この件に我々が関与する必要はない。"
 administrative_expertise_of_ruler_mitigates_situation_tt: "[target_character.GetName]の行政[abilities|e]なら、この程度の事態は容易に収拾できる"
 town_rights_events.3.title: "[target_location.GetNameWithNoTooltip]の豊かな穀倉"
 town_rights_events.3.desc: "[target_province.GetName]に住む農民や労働者たちは、[target_location.GetName]の[target_location.GetRank.GetName]で食料品の生産量と品質が向上し、備蓄も増えていると報告している。この好ましい状況は直ちに利用すべきである。"
 town_rights_events.3.a: "[target_province.GetNameWithNoTooltip]の州全体に恩恵を届けよ！"
 town_rights_events.3.b: "腐る前に売りさばこう。"
 town_rights_events.3.c: "[target_location.GetNameWithNoTooltip]の民に分配せよ。"
 every_location_gains_mild_prosperity: "[target_province.GetName]内のすべての[location|e]において、 [prosperity|e]が[ShowNamedValue('prosperity_mild_bonus')|+=2%]上昇する"
 every_pop_in_target_location_mild_satisfaction_tt: "[target_location.GetName]に居住する[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 income_gained_depends_on_crown_estate_power_tt: "獲得できる[gold|e]は、我々の[crown_power|e]に大きく依存する"
 town_rights_events.4.title: "[target_location.GetNameWithNoTooltip]の穀倉が枯渇寸前"
 town_rights_events.4.desc: "[target_location.GetName][target_location.GetRank.GetName]の穀倉地帯から悪い知らせが届いた。腐敗や管理の不備、あるいは季節の過酷な変化により、最も必要とされる時に備蓄が減少してしまったのだ。[target_province.GetName]の人々は、飢えが地方一帯に広がるのを防ぐため、我々に救済を求めている。"
 town_rights_events.4.a: "国庫を開放し、民を救おう。"
 town_rights_events.4.b: "民にはこの飢えに耐えてもらうしかない。"
 town_rights_events.4.c: "これが飢饉へと発展する前に、もっと策を講じなければ。"
 every_pop_in_target_location_mild_satisfaction_malus_tt: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 relief_effort_tt: "救済策により深刻な飢饉が緩和される"
 town_rights_events.5.title: "[target_location.GetNameWithNoTooltip]における新たな工具製作方法"
 town_rights_events.5.desc: "[target_location.GetName]の工房は、実験と技術改良の中心地となっており、多くの職人たちは、方法の改善と道具の向上によって、生産量と品質の両方が向上していると報告している。我々がいま問うべきは、これらの成果を革新のために用いるべきか、地域の繁栄のために用いるべきか、それともより広い市場に向けるべきかである。"
 town_rights_events.5.a: "新しい手法を奨励せよ。"
 town_rights_events.5.b: "[target_location.GetNameWithNoTooltip]そのものに、この成果を享受させよう。"
 town_rights_events.5.c: "新たな道具で市場を一杯にせよ。"
 town_rights_events.6.title: "[target_location.GetNameWithNoTooltip]製の粗悪な道具"
 town_rights_events.6.desc: "[target_location.GetName]の道具製作権のもとで生産された製品への苦情が相次いでいる。柄は割れ、刃はすぐに鈍り、金具は力に負けて破損する。この品質の低下が拙速な作業によるものか、あるいは強欲によるものかは定かではないが、地元産品への信頼は明らかに損なわれており、地域からの苦情は[target_location.GetRank.GetName]の名声を蝕みはじめている。"
 town_rights_events.6.a: "我々が仲裁し、工房を守ろう。"
 town_rights_events.6.b: "この怠惰の責任はこの地に取ってもらわねば。"
 town_rights_events.6.c: "この不名誉は[ROOT.GetCountry.GetFlavorRank]の威信に関わる。"
 our_innovative_nature_finds_compromise_tt: "我々の先進的な姿勢は、それが[ShowSocietyDirectionName('innovative')]の[societal_values|e]への強い傾倒によるものであれ、[target_character.GetName]の関連する[trait|e]によるものであれ、今回我々が実現可能な妥協点を見出す助けとなっている"
 town_rights_events.7.title: "技を極める[target_location.GetNameWithNoTooltip]の宝飾職人たち"
 town_rights_events.7.desc: "[target_location.GetName]にて[ROOT.GetCountry.GetGovernment.GetAdjective|U]の特権のもとで働く宝飾職人たちは、さらに技を磨き上げた。さまざまな新手法によって彼らの装飾品はかつてないほど輝きを増し、地元の人々だけでなく行き交う商人たちからも賞賛を集めている。この成果は、我らがさらなる高みへと昇るための大きな一歩である。"
 town_rights_events.7.a: "これらの技術によって、州全体を向上させよ。"
 town_rights_events.7.b: "[target_location.GetNameWithNoTooltip]の職人技を天下に知らしめよう。"
 town_rights_events.7.c: "見事な出来栄えは[ROOT.GetCountry.GetFlavorRank]の威信にふさわしい。"
 nobles_appreciate_jewellery_displays: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は壮麗な出来栄えに感嘆している"
 jewellery_display_reinforces_authority: "この収集品を我らの統治強化に役立てる"
 town_rights_events.8.title: "[target_location.GetNameWithNoTooltip]の大火"
 town_rights_events.8.desc: "[target_location.GetName]に災禍が襲いかかった。炎が家から家へと燃え移り、宝飾職人の区画はいまや黒煙と混乱に包まれている。火の手を食い止め、迅速に救援を組織しなければ、その被害は[target_location.GetRank.GetName]を越えて拡大しかねない。"
 town_rights_events.8.a: "[target_character.GetShortNameWithNoTooltip]自らが直接被害者への補償を取り仕切る。"
 town_rights_events.8.b: "炎がすべてを焼き尽くす！"
 town_rights_events.8.c: "救援を送り、最悪の事態を防げ。"
 nature_of_target_character_assists_the_locals: "[target_character.GetName]の人柄が住民を安心させ、彼らを支援する助けとなる"
 chance_the_fire_spreads_neighboring_locations_tt: "火災の影響は周辺の[locations|e]に広がる可能性が高い"
 relief_effort_prevents_spread_of_fire_tt: "救援活動により延焼が食い止められる"
 town_rights_events.9.title: "[target_location.GetNameWithNoTooltip]での造船の急増"
 town_rights_events.9.desc: "[target_location.GetName]の海軍特権によって優遇されている造船所と木材置場は、かつてないほどの活気に沸いている。労働者が働くタール沼は昼夜を問わず稼働し、商人や船乗りは誰もが拡張の話をしている。事業は上向きだ！ この突然の景気は、[target_location.GetRank.GetName]はもちろん、[ROOT.GetCountry.GetFlavorRank]としての我々の広域的な優先事項にも影響を与えるかもしれない。"
 town_rights_events.9.a: "この勢いに乗り、わが海軍の野望を拡大しよう。"
 town_rights_events.9.b: "[target_location.GetNameWithNoTooltip]の海洋交易を強化せよ。"
 town_rights_events.9.c: "我らの未来は、水の上にこそあるのだ。"
 town_rights_events.10.title: "[target_location.GetNameWithNoTooltip]における物資不足と不穏な動き"
 town_rights_events.10.desc: "[target_location.GetName]周辺での造船需要により、近隣の森林は伐り尽くされ、それに依存していた人々を不安に陥れている。地元では不満がくすぶり、かつては活況を呈していた産業に対する抗議と反感が強まりつつある。この束の間の繁栄は、いまや[target_location.GetRank.GetName]全体の秩序を揺るがす危険を孕んでいる。"
 town_rights_events.10.a: "権利を剥奪し、人々を鎮める。"
 town_rights_events.10.b: "損失を補償し、生産を継続させる。"
 town_rights_events.10.c: "地元民がその負担を負うべきだ。"
 cooldown_10_years: "この[town_rights|e]は今後#v 10年間#!、強制的に撤回することはできない"
 laborers_and_peasants_happy_tt: "[target_location.GetName]に居住する[Laborers|E]と[peasants|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%]増加する"
 town_rights_events.11.title: "[target_location.GetNameWithNoTooltip]の流行"
 town_rights_events.11.desc: "[target_location.GetName]の仕立屋、染色職人、織物商人たちは、衣服における新たな水準を打ち立てた！ 多くの住民たちの見事に仕立てられた装いは、いまや最も熱い話の種だ！ 新作コレクションはそのたびに[ROOT.GetCountry.GetFlavorRank]全土のスタイルとファッションの定番となっている。実際、その生地や仕立ては[target_province.GetName]の外でも模倣されるようになり、[target_location.GetRank.GetName]の名は上流社会でますます称賛を込めて語られるようになっている。どうせ誰かに見られるのなら、見惚れられるほどの逸品を！"
 town_rights_events.11.a: "[target_character.GetShortNameWithNoTooltip]の装いは、まさに目の保養だ！"
 town_rights_events.11.b: "その名声は我々に威信をもたらすだろう。"
 town_rights_events.11.c: "その気品ある装いは、[ROOT.GetCountry.GetGovernment.GetAdjective]の座に品格を与えるだろう。"
 town_rights_events.12.title: "[target_location.GetNameWithNoTooltip]での織物の独占体制が強化"
 town_rights_events.12.desc: "[target_location.GetName]に与えられた特権により、少数の有力な業者が地元の生地生産を支配するようになった。小規模な生産者は排除に不満を訴える一方、価格操作が横行し、取引から締め出された者たちのあいだでは不満が高まっている。富は依然として存在するが、それはますます少数の手に集中しつつある……"
 town_rights_events.12.a: "[target_character.GetShortNameWithNoTooltip]とは織物産業そのものなのだ！"
 town_rights_events.12.b: "独占には独占の利点がある。"
 town_rights_events.12.c: "地元の業者同士で争わせておけ。"
 ruler_regent_finds_good_middle_ground_tt: "[target_character.GetName]はその強い権力を使って、利益を得る者と不満を持つ者のあいだに立ち、両者が納得できる妥協点を見出した"
 local_textile_barons_are_unhappy_tt: "織物産業に関わる[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、この不安定さに不満を抱く可能性がある"
 destabilization_spreads_across_the_country: "この争いはさらに泥沼化し、不安定な情勢が[ROOT.GetCountry.GetFlavorRank]全土に広がっていく"
 town_rights_events.13.title: "[target_location.GetNameWithNoTooltip]の優れた武器"
 town_rights_events.13.desc: "[target_location.GetName]で[ROOT.GetCountry.GetGovernment.GetAdjective|U]の特権により鍛造された[ShowGoodsName('weaponry')]は、地元の隊長たちから賞賛されている。その重量配分、耐久性、そして細工の妙は通常の水準を凌ぐと噂され、兵士たちはいまや並々ならぬ熱意をもってこれらを求めるようになっている。"
 town_rights_events.13.a: "これをわが陸軍に制式採用する。"
 town_rights_events.13.b: "これを州内での徴兵の強化に役立てよう。"
 town_rights_events.13.c: "わが士官たちに、この品質から学ばせよう。"
 town_rights_events.14.title: " from [target_location.GetNameWithNoTooltip]製の[ShowGoodsNameWithNoTooltip('weaponry')]が引き起こす混乱"
 town_rights_events.14.desc: "[target_location.GetName]とその周辺での武器の急増は、好ましくない副作用をもたらしている。より多くの[ShowGoodsName('weaponry')]が無謀な者たちの手に渡り、犯罪者を増長させ、地域の緊張を高めている。本来は[ROOT.GetCountry.GetFlavorRank]を強化するための特権が、いまや国を揺るがす脅威となっているのだ。ああ、なんと危機的かつ嘆かわしい光景なのだろうか！"
 town_rights_events.14.a: "[target_character.GetShortNameWithNoTooltip]が秩序を回復させるだろう。"
 town_rights_events.14.b: "混乱の本拠地を鎮圧せよ。"
 town_rights_events.14.c: "ちょっと腕力を振るってやれば、なんだって解決する。"
 kind_martial_nature_of_ruler_helps_tt: "[target_character.GetName]の軍人としての規律と人格が、この混乱の抑え込みに役立つ"
 town_rights_events.15.title: "[target_location.GetNameWithNoTooltip]における学問の篝火"
 town_rights_events.15.desc: "学者や書籍商たちの双方によって、[target_location.GetName]は知識の集積地へと姿を変えた。書物は[target_location.GetRank.GetName]の工房からより遠く、より速く行き渡るようになり、思想の交流は単なる交易を超えて州全体を豊かにしはじめている。この啓蒙をどういった方向に導くかはさておき、そこには明らかに機会がある。"
 town_rights_events.15.a: "知識によって我々の進歩を加速させよう。"
 town_rights_events.15.b: "ここを真の学びの中心地にしよう。"
 town_rights_events.15.c: "これらの書物によって[target_character.GetShortNameWithNoTooltip]が恩恵を受けられるよう取りはからえ。"
 town_rights_events.16.title: "物議を醸す[target_location.GetNameWithNoTooltip]からの書物"
 town_rights_events.16.desc: "すべての書物が、波風を立てることなく知恵を広めるわけではない。[target_location.GetName]で流通しているとある書物は、学者や一般の読者のあいだに議論を巻き起こしている。その大胆さを称賛する者もいれば、それが危険で不穏だと非難する者もいる。利益のために出版されたものが、やがて我々の権威を問う存在となるかもしれない！"
 town_rights_events.16.a: "わが[ROOT.GetCountry.GetFlavorRank]はそのような些末な批判を超越している。"
 town_rights_events.16.b: "そのような著作は、あらゆる読み手の心を惑わせるだろう。"
 town_rights_events.16.c: "これを弾圧し、その代償を受け入れる。"
 pops_in_target_province_mild_penalty_according_to_literacy_tt: "[target_province.GetName]に居住する[pops|e]の[pop_satisfaction|e]が、その[literacy|e]に比例して低下する"
 town_rights_events.17.title: "[target_location.GetNameWithNoTooltip]の名高い職人技"
 town_rights_events.17.desc: "[target_location.GetName]の職人たちの技術力の高さは、州の外にまで轟いている。彼らの製品は単に実用的なものとしてではなく、賞賛に値する工芸品として称えられている。この名声をさらに高めていけば、[ROOT.GetCountry.GetFlavorRank]全体の評価も上がるだろう。"
 town_rights_events.17.a: "彼らの優れた技術を[ROOT.GetCountry.GetGovernment.GetAdjective]の政策の柱とする。"
 town_rights_events.17.b: "この水準を現地で維持させよう。"
 town_rights_events.17.c: "彼らの名声は、我らの誉れである。"
 town_rights_events.18.title: "老いてゆく[target_location.GetNameWithNoTooltip]の匠たち"
 town_rights_events.18.desc: "[target_location.GetName]で指折りの職人たちの多くが、道具を置きつつある。技を継ぐ見習いはほとんどおらず、その名声に並ぶ者はさらに少ない。新たな人材を呼び込むか、あるいは損失を受け入れないかぎり、[target_location.GetRank.GetName]はまもなく、熟練の技が失われたことを実感することになるだろう。"
 town_rights_events.18.a: "移住者を引き付けるのに必要な支出は惜しむな。"
 town_rights_events.18.b: "わが国の国庫は、当面はこの負担に耐えられる。"
 town_rights_events.18.c: "この州は衰退に耐えねばならない。"
 town_rights_events.19.title: "[target_location.GetNameWithNoTooltip]での醸造基準の確立"
 town_rights_events.19.desc: "[target_location.GetName]の醸造業者たちは、酒の製造、保存、販売の慣行をより厳格化することで合意した。酒場は品質の安定を称賛し、商人はその信頼性を歓迎し、そして[target_location.GetRank.GetName]の評判は高まっている。ささやかな手仕事であっても、繁栄と秩序をもたらす有用な手段となりうるのである。"
 town_rights_events.19.a: "これらの基準を、[ROOT.GetCountry.GetFlavorRank]全土の醸造の指針とする。"
 town_rights_events.19.b: "[target_location.GetNameWithNoTooltip]の繁栄を促進せよ。"
 town_rights_events.19.c: "わが[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]はこの成功を喜ぶだろう。"
 town_rights_events.20.title: "[target_location.GetNameWithNoTooltip]で穀物を醸造に転用"
 town_rights_events.20.desc: "杯を満たすものは穀倉を満たさない。[target_location.GetName]では、醸造に回される穀物があまりにも多く、公共の必需品が個人の利益のために犠牲にされているとの懸念が広がっている。これは単なる交易の問題ではなく、優先順位の問題である。地元の人々は空になった備蓄庫に不満を抱き、地元の醸造所が一般の農民を犠牲にして儲けようとしていると訴えている。"
 town_rights_events.20.a: "事態が悪化する前に不足を補填せよ。"
 town_rights_events.20.b: "民衆から不満は出るだろうが、交易は継続させよ。"
 town_rights_events.20.c: "この失策は[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]とわが[ROOT.GetCountry.GetFlavorRank]に泥を塗るものだ。"
 town_rights_events.21.title: "[target_location.GetNameWithNoTooltip]における[ShowGoodsNameWithNoTooltip('masonry')]の新技法"
 town_rights_events.21.desc: "[target_location.GetName]の建築家や石工たちは、質の高い[ShowGoodsName('masonry')]を可能にする改良された技法を導入した。その取り組みは、より頑丈な建造物と工期の短縮を約束し、[target_province.GetName]周辺地域の景観を一変させる。[target_location.GetNameWithNoTooltip]が主導するこうした進歩は、わが[ROOT.GetCountry.GetFlavorRank]全土に優れた建築の新時代の到来を告げるものになるかもしれない。"
 town_rights_events.21.a: "これらの手法を[ROOT.GetCountry.GetFlavorRank]全体に広めよ。"
 town_rights_events.21.b: "[target_province.GetNameWithNoTooltip]を建築の中心地にしよう。"
 town_rights_events.21.c: "[target_location.GetRank.GetName]自体に直接投資をしよう。"
 town_rights_events.22.title: "[target_location.GetNameWithNoTooltip]の採石の負担"
 town_rights_events.22.desc: "城壁や市場を築く[ShowGoodsName('stone')]、それは過酷な労働によってのみもたらされる。[target_location.GetName]周辺では採石の負担は日増しに重くなっており、その苦役に駆り出された者たちは疲弊し、怒りを募らせている。生産性は維持されているものの、その人的犠牲はもはや無視できるものではなく、地域全体の事業を停滞させかねない状況だ！"
 town_rights_events.22.a: "救済と監督によって彼らの負担を軽減せよ。"
 town_rights_events.22.b: "地元の不満は無視して、そのまま続けさせよ。"
 town_rights_events.22.c: "この負担を州全体が感じるようになるだろう。"
 relief_effort_reduces_strain_on_the_workforce_tt: "[gold|e]を提供すればそれが救済策となり、労働者にかかる負担が一時的に和らぐ"
