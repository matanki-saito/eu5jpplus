l_japanese:
 italian_wars.1.title: "$italian_group$戦争"
 italian_wars.1.desc.a: "裏切り者の暗躍や、[ShowRegionName('italy_region')]周辺の大国による数々の陰謀によって、前例のない外交的危機が発生している。その結果、半島に対する我々の支配力や影響力が疑問視されている。厳しい状況だが怯むわけにはいかない。[ShowRegionNameWithNoTooltip('italy_region')]における勝利は、我々の大国としての地位を揺るぎないものにするだろう！"
 italian_wars.1.desc.b: "[ShowRegionName('italy_region')]が戦争に呑み込まれた。外国の征服者たちが、莫大な富を求め我々の半島に群がっている。半島が勢力争いに巻き込まれるのはこれが初めてであり、飢えたハゲタカのような列強がわが国を狙っている。いまこそ、民は剣と盾を手に取り、自由を守るため立ち上がらねばならない。さもなければ、外国勢力の領土拡張策の犠牲になるだけだ……"
 italian_wars.1.a: "賽は投げられた。"
 italian_wars.1.b: "[GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetNameWithNoTooltip]と足並みをそろえよ！"
 italian_wars_explanation_tooltip1: "この期間中、[ShowRegionNameWithNoTooltip('italy_region')]諸国は、自己防衛のため$italian_group$連盟に加盟できる\n"
 italian_wars_explanation_tooltip2: "他国は、この地域における影響力を高めるため、独自の#italic 外国連盟#!を結成する可能性がある\n"
 italian_wars_explanation_tooltip3: "外国連盟のリーダーの[rivals|e]や[enemies|e]は、参戦や資金・兵士の提供により$italian_group$連盟を支援する可能性がある\n"
 italian_wars_explanation_tooltip4: "各連盟のリーダーが[peace_treaty|e]「[ShowPeaceTreatyTypeName('dissolve_league_peace_deal')]」を使用できるようになる"
 iw_italian_league_merc_efficiency_tt: "$italian_group$連盟のメンバーとして、わが国の[ShowModifierTypeName('mercenary_maintenance_efficiency')]は、我々の連盟が[ShowRegionNameWithNoTooltip('italy_region')]をどれだけ支配しているかに応じて変動する。支配範囲が上限（#Y 301#!ヵ所のロケーション）に達した場合、最大で#G +33%#!の[ShowModifierTypeNameWithNoTooltip('mercenary_maintenance_efficiency')]が付与される"
 italian_wars.1.historical_info: "$italian_group$戦争（1494～1559年）は、イタリアの支配権をめぐって繰り広げられた複数の激しい紛争。主に争ったのはフランスとスペインだが、ヨーロッパの大部分がこの勢力争いに巻き込まれた。この戦争は1494年にフランス王シャルル8世がイタリアに侵攻し、ナポリを占領したことから始まったが、このときはハプスブルク家のマクシミリアン1世とスペインのカトリック両王であるイサベルとフェルナンドが教皇の支援に駆けつけ、シャルル8世を追い出した。その後シャルル8世は1499年にミラノ、ジェノヴァ、ナポリを再び掌握したが、1503年にはスペインがナポリからフランス軍を駆逐し、南イタリアはスペインの支配下に置かれた。また、教皇ユリウス2世はフランスを北イタリアから追い出すための同盟を結成した。数年後、フランス王フランソワ1世が1515年にミラノを再び掌握し、ミラノに対するフランスの領有権を復活させたが、1525年にはパヴィアの戦いで神聖ローマ皇帝カール5世（スペイン王カルロス1世）に敗れ、捕らわれの身となった。フランソワ1世はイタリアにおけるフランスの領有権を正式に放棄し、釈放された。フランソワ1世はその後、イングランド、教皇、ヴェネツィア、フィレンツェと同盟を結び、その結果1527年にカール5世のドイツ人傭兵隊によるローマ劫掠が起こった。その後ローマ教皇との和平が成立し、1529年にボローニャでカール5世が皇帝として戴冠された。イタリア戦争は1559年のカトー＝カンブレジ条約でようやく終結し、スペインのハプスブルク家が150年にわたりイタリアの支配者として君臨することとなった。"
 #Periodic flavor events (20-29)
 italian_wars.20.title: "コンドッティエーリの対価" #The Condottiere's Price
 italian_wars.20.desc.a: "[target_merc.GetName]の隊長、[target_character.GetName]は進軍を停止し、契約条件の再交渉を要求する通告を送ってきた。この軍事作戦は当初の合意を遥かに超えて長期化しており、[target_character.GetShortNameWithNoTooltip]は追加の報酬がなければ、これ以上一歩も進軍しない構えである。\n\n要求を受け入れて[target_merc.GetNameWithNoTooltip]を引き続き従軍させるか、これを拒否し、戦いが決着する前に[target_character.GetShortNameWithNoTooltip]が傭兵団を連れて他国へ行ってしまう危険を負うかの選択を迫られている。"
 italian_wars.20.desc.b: "[target_merc.GetName]は不満を募らせており、その代表者たちが当初の契約条件の再交渉を求めて陣所にやってきた。交渉相手となる単一の隊長はおらず、そのためこの要求は傭兵団全体からのものであり、作戦の決着がついていない現状では彼らの交渉力は極めて大きい。\n\n[target_merc.GetNameWithNoTooltip]が完全に忍耐を切らす前に、我々は対応を決定しなければならない。"
 italian_wars.20.desc.c: "[target_merc.GetName]から契約の再交渉を求める報せが届いた。軍事作戦は彼らの予想を遥かに超えて長期化しており、さらなる報酬がなければ、わが国の大義に対する彼らの忠誠は不確かなものとなる。\n\n彼らの要求を満たす費用と、その奉仕を失う危険を天秤にかけなければならない。"
 italian_wars.20.a: "彼らの要求を受け入れよう。"
 italian_wars.20.b: "拒否する。契約はまだ有効だ。"
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]が自らこの交渉にあたる。"
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "傭兵団が新たな条件を受け入れ、何事もなく契約を再開する"
 mercs_extract_coin_and_supplies_from_the_land_tt: "傭兵たちが周辺地域から金貨や物資を奪い、我々の評価を落とす"
 target_province_loses_prosperity_extreme_penalty_tt: "[target_province.GetName]内のすべての[location|e]において、 [prosperity|e]が[ShowNamedValue('prosperity_extreme_penalty')|+=2%]低下する"
 italian_wars.21.title: "戦歴豊富な熟練兵" #Battle-Hardened Veterans
 italian_wars.21.desc: "$italian_group$紛争の過酷な戦役を経て鍛え上げられた[target_army.GetName]の熟練兵たちが、激戦の傷跡を携え、[target_location.GetName]近くの陣所に帰還した。将校たちは、戦火によって変貌を遂げ、その直感と規律が訓練だけでは到底成し得ないほどに研ぎ澄まされた兵士たちについて語っている。\n\n彼らの経験をどのように称えるかによって、今後数年間にわたるわが軍のあり方が決まることになる。"
 italian_wars.21.a: "団結させたままにしておこう。彼らの絆こそが強さだ。"
 italian_wars.21.b: "彼らの武勇はわが国の魂を形作った。"
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]がこれら熟練兵の訓練を監督する。"
 italian_wars.22.title: "脱走兵問題" #The Deserters' Problem
 italian_wars.22.desc: "長期化した[ShowRegionName('italy_region')]での戦いは、その重荷を背負う者たちに多大な負担を強いている。わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた報告によると、疲弊し、自分が戦わされる大義へ疑念を抱くようになった兵士たちが、次々と陣地を離脱しているのだという。諸階級のあいだでも不満の声が公然と上がりはじめており、わが領内の雰囲気は反抗に極めて近い危険なものへと変化しつつある。\n\nこの動揺がさらに根を張る前に、これに対処する方法を決定しなければならない。脱走兵を糾弾し、迷いを示した者を厳罰に処すれば、退却は許されないということをすべての従軍者に思い知らせることができる。あるいは、意志の力でただひたすらに戦線を維持し、継続的な関与に伴う代償を受け入れ、周囲の者たちにも同様の覚悟を求めることもできる。"
 italian_wars.22.a: "どいつもこいつも、腰抜けで裏切り者だ。"
 italian_wars.22.b: "一歩も退くな。踏みとどまるのだ。"
 italian_wars.23.title: "寝返り将軍" #The Turncoat General
 italian_wars.23.desc: "[target_army.GetName]の指揮官である[target_character2.GetName]が、外国勢力に対して不穏な接触をしている。[target_character2.GetShortNameWithNoTooltip]は敵の約束に心を動かされている可能性があるという情報が我々の耳に入っており、軍事行動中における[target_character2.GetHerHis]の振る舞いも、我々の疑念を払拭するものではなかった。\n\nこの裏切りが公然たる亡命に発展する前に、[target_character1.GetName]は手を打たなければならない。"
 italian_wars.23.a: "厄介払いができたよ、裏切り者め！"
 italian_wars.23.b: "[target_character2.GetHerHis]の忠誠には代償が伴う。我々はそれを支払おう。"
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]が、[target_character2.GetShortNameWithNoTooltip]に身の程をわきまえさせるだろう。"
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip]が#Y 10#!年間、逃亡を企てない"
 italian_wars.24.title: "同盟国間の不和" #Relations Deteriorate
 italian_wars.24.desc: "[target_io.GetNameWithNoTooltip]の内部において、我々の[ROOT.GetCountry.GetGovernment.GetCourtTitle]と[target_country.GetName]とのあいだの緊張が頂点に達した。些細な意見の相違から始まったものが公然たる不和へと悪化し、[target_country.GetName]はいまや、同盟全体の目標に対するわが国の献身に公然と疑問を呈している。\n\n同盟が分裂すれば、我々の一挙手一投足を監視している外国勢力を利するだけだ。慎重な外交によってこの亀裂を修復するか、あるいは毅然とした態度を崩さずに結果を甘んじて受け入れるか。いずれにせよ、この不和が[target_io.GetNameWithNoTooltip]でさらに広がる前に手を打たなければならない。"
 italian_wars.24.a: "和解の手を差し伸べよう。"
 italian_wars.24.b: "あちらの不満など、わが国には関係のないことだ。"
 ruler_or_regent_skillful_diplomacy_saves_the_day: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName]の巧みな外交手腕が状況を緩和する"
 italian_wars.25.title: "戦友としての絆" #Relations Flourish
 italian_wars.25.desc: "[target_io.GetName]を呑み込む紛争のなかで、我々の[ROOT.GetCountry.GetGovernment.GetCourtTitle]と[target_country.GetName]は予期せぬ共通点を見出した。共有された苦難と共通の敵は、長年の外交だけでは成し得なかったことを成し遂げ、単なる同盟を超えた形で両国民を結びつけた。\n\nこの深まりつつある親密な関係は戦時においては稀なものであり、無駄にすべきではない。我々はこの理解を正式なものにして宮廷間の絆を強化することも、沈黙を保ってより差し迫った問題に対処することもできる。この選択が、今後数年間にわたり[target_country.GetNameWithNoTooltip]がわが国をどう見るかを決定づけるだろう。"
 italian_wars.25.a: "この絆を強化しよう。"
 italian_wars.25.b: "わが国にはより差し迫った懸念事項がある。"
 good_relations_will_help_keep_em_in_league_tt: "わが国が相手国と良好な関係にあると、彼らをわが同盟に引き留める助けとなる場合がある"
 italian_wars.26.title: "不問に付された侮辱" #Diplomatic Incident
 italian_wars.26.desc: "[target_country.GetName]の[target_character.GetName]は、両同盟の代表者が集まる前で、極めて無礼な振る舞いを見せた。彼らの言葉は[our_io.GetName]におけるわが国の指導力と[ShowRegionNameWithNoTooltip('italy_region')]の諸国間におけるわが国の地位に疑問を投げかけるものであり、このような非難を容易に見過ごすことはできない。\n\nこれを不問に付したままにすれば、[target_character.GetShortNameWithNoTooltip]を増長させ、他所からのさらなる無礼を招くだけだ。我々は本件を追及し、報いを求めることもできるが、そうすればどちらの同盟も想定していない事態の拡大を招く恐れがある。もうひとつの選択肢は、いまは侮辱を耐え忍び、時機を待つことだ。"
 italian_wars.26.a: "この侮辱を容認するわけにはいかない。"
 italian_wars.26.b: "報復の時は必ず訪れる。だが今日ではない。"
 italian_wars.27.title: "戦争の教訓" #Military Advancements
 italian_wars.27.desc: "[ShowRegionName('italy_region')]全土に及ぶ容赦ない軍事行動は、血と破滅以上のものをもたらした。わが国の将校と学者たちは、激戦の試練のなかで鍛えられ、敵の戦術から苦難のに学び取った知識を携えて帰還した。新たな思想がわが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に根づいたいま、問題はそれらをどのように役立てるのが最善かということだ。\n\n戦争がもたらした教訓の継続的な研究に専念し、技術と教義の洗練に投資することもできる。あるいは、この知識を即座に実戦で活かし、わが軍と領土に具体的な成果をもたらすことができる場所に振り向けることもできる。"
 italian_wars.27.a: "学んだ知見をさらに深めよう。"
 italian_wars.27.b: "わが軍に必要なのは理論ではなく成果だ。"
 italian_wars.28.title: "[target_location.GetNameWithNoTooltip]出身の技師"
 italian_wars.28.desc: "多大なる名声を誇る技師が、紹介状と新しい攻城兵器の緻密な設計図を携えて、わが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]へとやって来た。[new_character.GetName]は[target_location.GetName]出身であり、戦争によって軍事工学が新たな限界へと押し上げられている$italian_group$の戦域に惹きつけられた、傑出した頭脳のひとりである。[new_character.GetHerHis]の知識を応用すれば、敵の城壁を突破するうえでわが軍に決定的な優位をもたらすことができるだろう。\n\n[new_character.GetHerHis]の奉仕は決して安価ではなく、[new_character.GetSheHe]もそれを隠そうとはしていない。それでも、長く続く戦いのなかで、このような好機がめぐってくることは稀である。"
 italian_wars.28.a: "[new_character.GetHerHis]の報酬を支払う。優れた技師には、その額に見合う価値がある。"
 italian_wars.28.b: "いまはそんな余裕はない。[new_character.GetHerHim]を追い返せ。"
 iw28_no_engineer_for_years_tt: "この技師を追い返したという噂が界隈に広まり、[new_character.GetHerHis]と同等の力量を持つ人物が再びわが国を訪れるまでにしばらく時間を要する場合がある"
 engineer_boosts_short_term_research_tt: "この技師の手法がわが国の学者たちに研究の新たな道を開き、わが国の研究に即座の進歩をもたらす"
 engineer_boosts_literacy_efforts_tt: "この技師の技術文書や図面に触れることで、わが国の知識層全体で学問への幅広い関心が高まる"
 italian_wars.4.title: "連盟への招待"
 italian_wars.4.desc: "我々の地域で緊張が高まり、戦争の現実が民衆を暗く脅かしている。外国の侵略者による容赦のない猛攻に対抗するため、[actor.GetName]が[target_io.GetName]の設立を決めた。そして、我々のもとにも加盟の誘いが届いた。これは外交上、極めて重要な問題である……"
 italian_wars.4.a: "受諾しよう！"
 italian_wars.4.b: "中立の立場を崩すわけにはいかない。"
 italian_wars.4.c: "我々は[target_country.GetNameWithNoTooltip]への忠誠を守る！"
 italian_wars.9.title: "[actor.GetNameWithNoTooltip]からの支援"
 italian_wars.9.desc: "[actor.GetName]の使者が宮廷を訪れ、現在起こっているわが国の防衛戦争を支援する意向を我々に伝えた。勢力均衡が崩れることへの懸念から、わが国の支援に前向きなようだ。"
 italian_wars.9.a: "当面は、共通の敵と戦うため団結しよう……"
 italian_wars.10.title: "勢力均衡の維持"
 italian_wars.10.desc: "[target.GetName]への侵略戦争によって、[ShowRegionName('italy_region')]の勢力均衡が脅かされている。ほかの連盟がこの地域に拠点を築き、わが国が損害を被るのを許すわけにはいかない。そのため我々は、[target.GetLongNameWithNoTooltip]に支援を送り、敵国から領土を守るための戦いを後押しすることにした。"
 italian_wars.10.a: "兵士を派遣する。"
 italian_wars.10.b: "資金を援助する。"
 italian_wars.11.title: "引き返せない局面"
 italian_wars.11.desc: "[ShowRegionName('italy_region')]を覆う緊張状態は限界点に達した。対立する連盟同士を隔てていた最後の休戦協定は、一時の激情のなかで破棄され、無効となった。[target_character.GetName]とライバル連盟のリーダーたちは、うわべだけの平和を完全に放棄した。こうして、すべてを飲み込む全面戦争の舞台は整った。"
 italian_wars.11.a: "妥協も、降伏も認めん。"
 all_leaders_of_leagues_annul_all_truces_tt: "すべての連盟の[international_organization_leader|e]が[ShowRegionName('italy_region')]の国々、およびお互いとの休戦協定を破棄した"
 as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "[situation_tension|e]が#Y 90#!以上であるかぎり、外国連盟のリーダーは、[ShowRegionName('italy_region')]内の[country|e]に対する侵略戦争に加わるよう、[members|e]に要請することができる"
 italian_wars.100.title: "$italian_group$戦争の終結"
 italian_wars.100.desc: "我々の地域を守るための数十年にわたる長き戦いは、我々の強大な連盟の力によって終結した。侵略国の影が国境から消え、わが国の民は未来に向けて繁栄の道を切り拓いている！"
 italian_wars.100.a: "忠誠が我々を強くする！"
 italian_wars.100.b: "わが国の主権は揺るぎない！"
 demand_vassalization_from_members_tt: "勝利した連盟のリーダーとして、わが国が連盟メンバーに対し属国化を要求する"
 league_locations_owned_desc: "我々の連盟が所有するロケーション"
 iw_send_aid_tt: "わが国は選択した[country|e]を[manpower|e]または[gold|e]で支援することを選ぶ"
 italian_wars.200.desc: "待ち望まれていた$italian_group$戦争の終結が、ついに現実のものとなった。我々の領土を征服しようとした外国連盟がすべて解体し、半島に平和と繁栄が戻った。我々が真の[ShowRegionName('italy_region')]統治者となるための道が切り拓かれたのだ。"
 italian_wars.200.a: "[target_country.GetNameWithNoTooltip]の時代がいま始まった！"
 italian_wars.200.desc_foreign: "わが軍が[ShowRegionName('italy_region')]の深くまで進軍したにもかかわらず、$italian_group$連盟は堅固に持ちこたえ、我々の軍勢を撃退した。半島におけるわが国の野望は実現せず、我々はこの苦い敗北を受け入れざるを得ない。"
 italian_wars.200.b: "この屈辱は絶対に忘れはしない。"
 italian_wars.300.title: "[ShowRegionNameWithNoTooltip('italy_region')]における[target_io.GetNameWithNoTooltip]の勝利"
 italian_wars.300.desc: "数十年にわたる激しい抵抗も虚しく、[ShowRegionName('italy_region')]はいまや、ほぼ完全に我々の手中にある。我々の計画の妨害を試みた者たちは、我々の強力な軍隊を恐れ、高い壁の後ろに身を潜めている。今日、この地域は新たな時代を迎えた。我々の領有権に異論を唱える者はもはや誰もいない！"
 italian_wars.300.a: "[target_character.GetNameWithNoTooltip]、万歳！"
 italian_wars.301.desc: "$italian_group$戦争は苦い結末を迎えた。外国勢力が[ShowRegionName('italy_region')]への支配を確立したのだ。わが国の努力にもかかわらず、この結果を防ぐことはできなかった。我々はいまや、半島の新たな秩序に適応しなければならない。"
 italian_wars.301.a: "この敗北を受け入れるしかない。"
 italian_wars.400.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')]の膠着状態"
 italian_wars.400.desc: "[ShowSituationName('italian_wars')]の状況を変えようと最善を尽くしてきたが、地域の諸国も侵略を試みる外国も、地域を統一することはおろか、実質的な影響力を行使することすらできていない。"
 italian_wars.400.a: "なんのために戦争をする？"
 end_the_italian_wars_stalemate_tt: "[ShowSituationNameWithNoTooltip('italian_wars')]が膠着状態のまま終了する……"
 non_princes_become_princes_tt: "[ShowSpecialStatusName('hre_foreign_league_member')]に所属する、[GetUniqueInternationalOrganization('hre').GetMemberTitle]ではない[countries|e]が、[GetUniqueInternationalOrganization('hre').GetName]の[members|e]となる"
