l_japanese:
 culture_greek.1.title: "[target_character.GetNameWithNoTooltip]との対立"
 culture_greek.1.desc: "わが国が誇り高き[ROOT.GetCountry.GetReligion.GetAdjective]国家であることは近隣に広く知られている。だが、我らが総主教座の内には、なお問題があるようだ。\n\n[target_character.GetName]は、[target_character2.GetName]が宗教上の務めを怠っていると指摘している。その根拠として、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]への冷遇、宗教儀式での不始末、そしてわが国の[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]文化全体に対する敬意の欠如を挙げている。\n\nこうした訴えは大げさだと見る者も多いが、民衆は[target_character2.GetNameWithNoTooltip]の怠慢と、[target_character2.GetSheHe]があらゆる教会権威よりも自らを上に置いていることをよく知っている。そのため、わが国の[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]信徒のなかには、[target_character2.GetNameWithNoTooltip]を正統性を欠く者とみなし、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の称号にふさわしくないと考える者も出てきた。"
 culture_greek.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]は何もわかっていない！"
 culture_greek.1.b: "[target_character2.GetNameWithNoTooltip]を、もう少し抑えるべきかもしれない。"
 culture_greek.1.c: "[target_character2.GetNameWithNoTooltip]の正統性を疑うことは許さぬ！"
 culture_greek.1.d: "演説をすれば、連中の疑念も和らぐだろう。"
 culture_greek.2.title: "総主教、[target_character2.GetNameWithNoTooltip]を祝福"
 culture_greek.2.desc: "[ROOT.GetCountry.GetName]の気品と秩序は、[target_character.GetName]に[target_character2.GetName]の治め方への関心を抱かせた。初めて[target_capital.GetName]を訪れたとき、[target_character.GetNameWithNoTooltip]は、[ROOT.GetCountry.GetReligion.GetName]を支えるものを守るため、細やかな心配りが行き届いていることに感銘を受けた。修道院はよく手入れされ、[ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName]が集めうるかぎりの富で飾られている。市民たちは道沿いに並ぶ大理石の小祠を眺め、亡くなった者のことや、危機の折に命をつないだ奇跡のことを思い起こす。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、多くの者が聖書の言葉を唱え、救世主の聖像の前で祈っている。[target_character2.GetNameWithNoTooltip]が政を論じる部屋へ近づくと、[target_character.GetNameWithNoTooltip]は香の匂いに包まれた。"
 culture_greek.2.a: "総主教の祝福は約束されたも同然だ。"
 culture_greek.2.b: "祝福だけでは足りない。[target_capital.GetNameWithNoTooltip]にもっと力を注ぐべきだ。"
 culture_greek.3.title: "[target_country.GetNameWithNoTooltip]の宗教改革"
 culture_greek.3.desc: "[ShowContinentName('europe')]に宗教改革の波が広がるなか、[target_character.GetName]のような者たちは、教皇庁に抗う[target_country.GetName]などの改革派と外交関係を結ぶことに関心を示している。\n\n話し合いを重ねた結果、我々には共通の敵がいることが明らかになった。彼らもまた、[papal_capital.GetName]の腐敗したあり方から脱却し、[target_country.GetGovernment.GetEstateName('crown_estate')]の自立を取り戻そうとしている。しかしながら、わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]にとっては受け入れがたい点がある。彼らの地に、いまだ[ShowReligionName('catholic')]の痕跡が残っていることだ。"
 culture_greek.3.a: "敵の敵は味方だ。"
 culture_greek.3.b: "異端者の助けなど必要ない。"
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip]のせいで、我らは笑いものだ！"
 culture_greek.4.title: "[ShowCultureNameWithNoTooltip('greek_culture')]の問題"
 culture_greek.4.desc: "絶対主義の台頭と、国家および国民という概念は、今日の人々の考え方を形づくりつつある。かつては、このような問題が公に論じられることはなかった。文化を形づくっていたのは、何よりも宗教だったからである。だがいまや、庶民のあいだからも優れた思想家が現れるようになり、学問の場ではひとつの問いが繰り返し問われている。[ShowCultureNameWithNoTooltip('greek_culture')]とは何か、という問いだ。\n\n一部の者は、[ROOT.GetCountry.GetName]の言語に見られる二重性が原因で、社会の分断がいまも続いているのだと主張している。官僚や[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、作法も話す言葉も[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]とはまったく異なるため、ほとんどあらゆる面でかけ離れているのだ。\n\nこの状況のもとで、多くの者が次第に急進的な考えに傾き、この分断を埋めて国家を真に一つにまとめるための変革を求めるようになった。"
 culture_greek.4.a: "ゆっくりと、だが確実に、民を一つにしていこう。"
 culture_greek.4.b: "そのような変革は、いまの権力構造を不安定にしかねない。"
 culture_greek.4.c: "文化に違いなどない。同じ文化の異なる形があるだけだ。"
 greek_culture_greek_peasants_will_gain_satisfaction: "[rural_locations|e]以外の地域にいる[ShowCultureGroupName('greek_group')]系[culture|e]の[ShowPopTypeName('peasants')]および[ShowPopTypeName('laborers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 culture_greek.5.title: "[target_character.GetNameWithNoTooltip]の台頭"
 culture_greek.5.desc: "[victory_location1.GetName]や[victory_location2.GetName]などで多くの勝利を収めたことにより、民は[target_character.GetName]を優れたストラテゴスとして敬うようになった。すなわち、主と[target_character2.GetName]の名のもとに剣を振るい、[ROOT.GetCountry.GetName]の敵を討ち果たす者としてである。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]の有力者たちと話してみると、彼らもまた[target_character.GetShortNameWithNoTooltip]に敬意を抱いており、[target_character.GetHerHis]が語る[victory_location3.GetName]の戦いの話は、いまや誰もが口にする話題となっている。[target_character2.GetNameWithNoTooltip]は、[ROOT.GetCountry.GetGovernment.GetCourtTitle]での影響力がこのストラテゴスへ移りつつあると見て、この名声にいくらか脅威を感じている。だが、この令名を利用すれば、[ROOT.GetCountry.GetNameWithNoTooltip]に対する[target_character2.GetDynasty.GetName]家の支配をさらに強めることができるかもしれない。"
 culture_greek.5.a: "英雄は称えねばならない。"
 culture_greek.5.b: "[target_character.GetShortNameWithNoTooltip]の影響力を抑えるべきだ。"
 culture_greek.5.c: "手元には置いておくが、政からはできるだけ遠ざけておこう。"
 greek_culture_strategos_will_never_be_able_to_influence_politics: "[target_character.GetName]が[courtiers|e]に影響を及ぼせないようにし、将来クーデターを起こすのを防ぐ"
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName]は[courtiers|e]に影響を及ぼす機会を失い、以後クーデターを起こせなくなる"
 culture_greek.6.title: "国民のストラテゴス"
 culture_greek.6.desc: "名高きストラテゴス、[target_character.GetName]が近衛を従えて[target_capital.GetName]の通りを進むと、この軍略に長けた人物をひと目見ようと群衆が集まる。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の別なく、人々は声をそろえて「[target_character.GetShortNameWithNoTooltip]！」と[target_character.GetHerHis]の名を叫ぶ。群衆のなかには、[target_character.GetShortNameWithNoTooltip]のほうがより清廉な統治者となり、民の声にも耳を傾けるだろうと、ひそかにささやく者たちもいる。こうした噂はすでに[ROOT.GetCountry.GetGovernment.GetCourtTitle]にも届いており、それだけ[target_character.GetShortNameWithNoTooltip]の存在感が増していることがうかがえる。"
 culture_greek.6.a: "ストラテゴスには、敵対する者でさえ敬意を払うべきだ。"
 culture_greek.6.b: "誰かが妙な考えを起こす前に、群衆を静めよう。"
 greek_culture_all_capital_pops_gain_pop_satisfaction: "[target_capital.GetName]のすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 greek_culture_prevent_coup_for_two_year: "[target_character.GetName]がクーデターを企てていた場合、その計画が#y 2#!年間足止めされる"
 culture_greek.7.title: "[target_character.GetNameWithNoTooltip]のクーデター"
 culture_greek.7.desc: "数ヵ月にわたり策をめぐらし、支持を集め、対抗勢力の影響力を削ぎ、兵を集めてきた[target_character.GetName]は、いまや[target_character2.GetName]を打ち倒すだけの力を備えている。\n\n自らこそが[ROOT.GetCountry.GetName]の正統な統治者であり、[target_character2.GetShortNameWithNoTooltip]よりはるかに慈悲深く、国を治める器もあると考える[target_character.GetShortName]は、[ROOT.GetCountry.GetCapital.GetName]の外に陣取り、[target_character2.GetShortName]に[ROOT.GetCountry.GetNameWithNoTooltip]の王位を退くよう求めている。"
 culture_greek.7.a: "この退廃を断つには、新たな指導者が必要だ。"
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip]がそう簡単に退くはずがない！"
 culture_greek.7.c: "[target_character.GetShortNameWithNoTooltip]に正統性などわかるものか！"
 culture_greek.7.d: "我々を倒そうとした罪で、[target_character.GetShortNameWithNoTooltip]を追放せよ。"
 greek_culture_weaker_due_to_righteous_trait: "[rebels|e]が大幅に弱体化する。"
 culture_greek.8.title: "[target_location.GetNameWithNoTooltip]の諜報員"
 culture_greek.8.desc: "先日、[target_location.GetName]の衛兵たちが、[ROOT.GetCountry.GetName]の重要な秘密を探ろうとしていた諜報員の一団を見つけ出した。ギリシャの火をはじめ、彼らの国が欲している我らのさまざまな技術を狙っていたようだ。\n\n彼らは誰に仕えているかを明かしてはいない。だが、数ヵ月前にこの地へ送り込まれ、宿から宿へ、教会から教会へと渡り歩きながら、わが国の秘密を探り当てる手がかりを求めていたことは認めている。この諜報員たちは、地下牢に閉じ込めたまま朽ちさせておくより、もっといい利用方法があるかもしれない。我らのために働かせるというのもひとつの手だ。"
 culture_greek.8.a: "あの諜報員たちは、我らが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の役に立つ。"
 culture_greek.8.b: "連中は朽ちるに任せ、[target_location.GetNameWithNoTooltip]に潜り込んだ他の諜報網も暴き出せ！"
 culture_greek.8.c: "連中を利用すれば、わが[target_location.GetRank.GetNameWithNoTooltip]に潜む他の諜報網も暴けるかもしれない。"
 every_country_with_spy_network_on_us_will_lose_25_network: "わが[target_location.GetRank.GetNameWithNoTooltip]で[spy_network|e]が#Y 15#!以上ある、すべての既知の[country|e]の[spy_network|e]が#R 25#!減少する"
 culture_greek.9.title: "[target_location.GetNameWithNoTooltip]の金印勅書"
 culture_greek.9.desc: "[target_location.GetName]の[target_location.GetRank.GetName]における[ShowCultureGroupName('italian_group')]人の影響力が地域の交易を支配しつつある。人々が取引したがるのは、[ShowRegionName('italy_region')]に拠点を置く商人ばかりで、そのため多くの富が我々の手を離れている。とはいえ、こうした取引にも利点はある。なかでも大きいのは、理想的な価格ではないにせよ、国がその富を売りに出せることである。だが、それは[target_character.GetName]の権威を弱め、ひいてはこれら[ShowCultureGroupNameWithNoTooltip('italian_group')]商人への依存を深めるおそれもある。"
 culture_greek.9.a: "連中にさらなる特権を与えても構わない。我々に富をもたらすかぎりは。"
 culture_greek.9.b: "連中が[target_location.GetRank.GetNameWithNoTooltip]の富を持ち去りたいのなら、余分に払わせるのだ。"
 culture_greek.9.c: "連中には、名ばかりの特権を与えておこう。"
 culture_greek.9.d: "連中を守る法を作るなら、手早く進めるべきだ。"
 all_italian_pops_become_happier: "すべての[ShowCultureGroupName('italian_group')]人[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する。"
 all_italian_pops_become_angrier: "すべての[ShowCultureGroupName('italian_group')]人[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 culture_greek.10.title: "[target_location.GetNameWithNoTooltip]の新世代"
 culture_greek.10.desc: "既存の官僚制度が行き詰まり、それを担う者たちのあいだで腐敗が広がるなか、有望な若者たちが頭角を現している。彼らは、守旧派の時代遅れのやり方をより進歩的なものに置き換えることで、この腐敗を一掃しようとしている。そのひとりである[target_character.GetName]は、[target_estate.GetName]の一員であり、[target_location2.GetName]の質素な家に生まれたが、長年にわたり急進的な手法によって我々の官僚制度を改善する能力を示してきた。こうした新しい方法は、硬直した現在の官僚制度を、国家とその民のためになるものへと変えていくはずだ。\n\nこれはたしかに行政の効率を高めるだろうが、すでに地位を築いている者たちの多くは、いまの立場から追われることを恐れている。彼らはこの新しい世代に反発し、その声を封じ、さらには一部の者に賄賂まで渡して黙らせようとしている。"
 culture_greek.10.a: "若者たちこそ未来だ。"
 culture_greek.10.b: "この件では、守旧派の側に立つ。"
 culture_greek.11.title: "異国の言葉"
 culture_greek.11.desc: "東方の[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、ローマの言葉の影響が次第に薄れつつある。とはいえ、わが国はなお、誇り高き[ShowCultureGroupName('greek_group')]の民としての自負を保とうとしてきた。それでも、一部の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、[ShowLanguageName('latin_language')]の言い回しをそらんじるだけの素養があるようだ。\n\n「プロ・ボノ」と、[target_character.GetName]は廷臣たちに向かって言う。一同はその意味を解しかねて戸惑うが、やがて[target_character.GetSheHe]がその語の由来と意味を説明する。なかには極めて保守的な者もおり、そのような奇妙な言葉を使う[target_character.GetShortNameWithNoTooltip]を嘲るが、他方で、[ShowLanguageNameWithNoTooltip('latin_language')]に興味をひかれ、さらに学びたいと望む者もいる。[ROOT.GetCountry.GetGovernment.GetCourtTitle]にそのような者たちがいることから、このような言葉遣いを取り入れ、それを政務の場にも用いるべきではないかという声がささやかれるようになった。それは、[ROOT.GetCountry.GetNameWithNoTooltip]のなかでローマの流儀を生かそうと試みる、いわば古きローマの伝統への回帰である。"
 culture_greek.11.a: "わが国の[ShowCultureNameWithNoTooltip('greek_culture')]としての気風を捨てる理由はない。"
 culture_greek.11.b: "[ShowLanguageName('latin_language')]の言葉は奨励すべきだ。"
 culture_greek.11.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、あらゆる言語を尊重すべきだ。"
 culture_greek.12.title: "腐敗の兆し"
 culture_greek.12.desc: "[ROOT.GetCountry.GetName]の要職の多くは有能な者によって占められているものの、統治機構のなかには、うまく機能していない歯車もあるようだ。\n\nこのたび行政の監察がおこなわれたところ、ひとつ興味深い事実が浮かび上がった。[target_character.GetName]が、縁者や友人はおろか、自分の懐を潤してくれる者にも職を回しているというのである。この報せが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に、そして何より[target_character2.GetName]のもとに届いたとき、これを監察官たちと[target_character.GetNameWithNoTooltip]とのいがみ合いにすぎないとして、すぐに取り合わない者もいた。\n\nわが国の行政を私腹を肥やす手立てと考える者たちに、どんなおこないにも相応の報いが伴うことを示すには、より直接的な介入が必要かもしれない。"
 culture_greek.12.a: "腐敗した者をすべて粛清すれば、誰も残らない。"
 culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip]は自ら選んだのだ。その報いは受けてもらう。"
 culture_greek.12.c: "腐敗は一切許さない！"
 culture_greek.12.d: "ふむ……うまく取り計らえるかもしれない。"
 culture_greek.13.title: "衰えるケファレ"
 culture_greek.13.desc: "[target_area.GetName]のケファレはその設置以来、衰退が続いている。[target_location.GetName]を拠点とする総督は期待に応えられていないが、その不手際はわが国の官僚たちのあいだで長く見過ごされてきた。そのため、現地では税を逃れる者が出る一方で、一部の貴族は土地を乗っ取り、農民を食い物にして、その地の富をむさぼっている。これらの報せが[target_character.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届くと、腐肉に群がる禿鷹のように、多くの者が総督の更迭を唱え、自分か縁者をその後任に推した。自分たちのほうがこの地方をよりよく治め、安定を保てるというのである。こうしたやり方はいささか過激にも見えるが、現地の統治体制を改めるのも悪くないかもしれない。あるいは、現地の指導層をなおざりにしてきた我々のほうにこそ落ち度があり、手に負えない[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]を抑え、気位の高い平民を従わせるため、より多くの資源を送るべきなのかもしれない。"
 culture_greek.13.a: "総督は別の者に替えよう。"
 culture_greek.13.b: "[target_area.GetNameWithNoTooltip]が立ち行かなくなったのは、こちらの怠慢だ。支援を送ろう。"
 culture_greek.13.c: "この傷は時が癒やすほかない。統治を改める必要はないだろう。"
 all_pops_in_kephale_area_lose_satisfaction: "[target_area.GetName]のすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 gain_extra_control_in_the_area: "わが国が[target_area.GetName]に所有するすべての[location|e]で、#Y 10#!年間にわたり[control|e]が[ShowNamedValue('control_mild_bonus')|+=2%]増加し、[modifier|e]「[ShowModifier('increased_kephale_support')]」を獲得する"
 lose_extra_control_in_the_area: "わが国が[target_area.GetName]に所有するすべての[location|e]で、[control|e]が[ShowNamedValue('control_mild_penalty')|+=2%]減少する"
 culture_greek.14.title: "紫衣の生まれならず"
 culture_greek.14.desc: "[target_character.GetName]は[ROOT.GetCountry.GetName]の玉座を手にしたとはいえ、いまだ威信に欠けている。[target_character.GetNameWithNoTooltip]は紫衣の生まれではないため、その声望の乏しさが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の立場を弱めていると見る者は多い。この[target_character.GetWomanMan]には威厳がなく、統治者というより征服者のようだという噂はすでに広まっており、[target_character.GetNameWithNoTooltip]に近い者たちの多くが贅沢だと考えるような形で、行政機構を作り替えようと目論む者すら出てきている。"
 culture_greek.14.a: "[target_character.GetNameWithNoTooltip]の威信を高めるため、金を使うべきだ。"
 culture_greek.14.b: "威信だけで国が保てるものか。"
 culture_greek.14.c: "威厳を知りたいのなら、いずれ思い知ることになる。"
 culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$同士の衝突"
 culture_greek.15.desc: "[target_character.GetDynasty.GetName]家は、[ROOT.GetCountry.GetName]を治めるという点ではこれまで結束してきたが、その治め方については意見の食い違いがあり、[target_character.GetName]と[target_character2.GetName]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]を一門とどのような関係に置くべきかで対立している。[target_character.GetShortNameWithNoTooltip]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]とより緊密な関係を築き、あらゆる臣下をもっと容易に管理できるようにすべきだと考えている。これに対し[target_character2.GetShortNameWithNoTooltip]は、むしろ臣下に自治を認めたほうが、広い土地の随所に小さい影響圏を保持しつつ、国を拡大できると主張している。"
 culture_greek.15.a: "[target_character.GetShortNameWithNoTooltip]の考えを支持すべきだ。"
 culture_greek.15.b: "[target_character2.GetShortNameWithNoTooltip]の案も魅力的ではある……"
 culture_greek.15.c: "誰が[ROOT.GetCountry.GetNameWithNoTooltip]を治めているか、思い出させてやれ。"
 culture_greek.15.d: "両者とも[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]から学ぶべきだ。"
 culture_greek.16.title: "[target_character.GetNameWithNoTooltip]、[ROOT.GetCountry.GetGovernment.GetCourtTitle]で語る"
 culture_greek.16.desc: "[target_character.GetName]の活躍は、[ROOT.GetCountry.GetName]の各地から首都[ROOT.GetCountry.GetCapital.GetName]に至るまで広く知れ渡っている。わが国の歴史に名を刻んだこの人物をひと目見たいと望む廷臣は多く、[target_character.GetHerHim]のもとへ使いを送り、[ROOT.GetCountry.GetGovernment.GetCourtTitle]へ招いて、他の有力者たちと顔を合わせる機会を与えようとしている。\n\nもっとも、[target_character.GetShortNameWithNoTooltip]を敵視する者のなかには、この話を面白く思わない者もおり、その一部はこの度の謁見で[target_character.GetHerHim]が妙な気を起こし、その果てに[target_character2.GetName]の地位を奪い、[ROOT.GetCountry.GetNameWithNoTooltip]を自らのものとしようとするのではないかと危ぶんでいる。"
 culture_greek.16.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]で[target_character.GetWomanMan]が語るのを拒む理由はない。"
 culture_greek.16.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に入る機会など、許すわけにはいかない。"
 culture_greek.17.title: "[target_location.GetNameWithNoTooltip]における交易の拡大"
 culture_greek.17.desc: "わが国の海運の力によって、[ROOT.GetCountry.GetName]では新たな港や交易路の整備が進んでいる。その新たな交易拠点のひとつが[target_location.GetName]である。この[target_location.GetRank.GetName]には、地歩をいっそう固めるための特権を与えられた[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が数多く集まっている。\n\n現地の者たちが築いた新たな基盤によって、[ROOT.GetCountry.GetNameWithNoTooltip]各地からさらに多くの人々が集まるようになり、市場や船、住まいはいっそう求められるようになった。こうした声は[target_character.GetName]の耳にも入り、この事態をどう収めるべきかを決めるため、宮廷が招集された。"
 culture_greek.17.a: "[target_location.GetNameWithNoTooltip]での交易を奨励しよう。"
 culture_greek.17.b: "こちらに恩義を負うというなら、力を貸そう。"
 culture_greek.17.c: "費用は分担すべきだ。"
 culture_greek.18.title: "[target_location.GetNameWithNoTooltip]における$a_akritai$の怠慢"
 culture_greek.18.desc: "[target_location.GetName]の辺境[target_location.GetRank.GetName]を率いる者たちは、日々の訓練を怠り、前線の守り手としての務めをおろそかにしてきた。そのため、敵の襲撃や侵攻を受けやすい状態になっている。\n\nこのたびの監察によって、この状況の仔細が明らかになった。彼らの指揮官は、実力ではなく家の縁でその地位に就いた者らしい。兵たちもまた、[ROOT.GetCountry.GetName]から与えられた資金で酒を飲み、実力に見合わない手柄話を吹聴している。[target_area.GetName]の国境が破られる危険を冒してまで、この状況を放置するわけにはいかない。これらの$a_akritai$に規律を取り戻させる必要がある。この件では、[target_character.GetName]がもっと積極的に動くべきだろう。"
 culture_greek.18.a: "この件に回せるだけの資金はない。"
 culture_greek.18.b: "国境を守るのは彼らの務めだ。そのことを思い出させねばならない。"
 all_pop_in_location_lose_satisfaction: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 culture_greek.19.title: "[target_location.GetNameWithNoTooltip]の$a_akritai$の物語"
 culture_greek.19.desc: "$a_akritai$にまつわる話の多くは、[ROOT.GetCountry.GetName]の威信を広く示すために誇張されている。だが、[target_area.GetName]の国境を守る[target_location.GetName]の者たちの物語は、そうした脚色がなされずに伝えられている。彼らが怠りなく務めを果たしてきたおかげで、敵の侵入は防がれ、この地では[target_character.GetName]の名にも敬意が払われている。これらの$a_akritai$の正統性に疑いを抱く者もいるが、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、彼らをさらに支援し、その名声をいっそう高めたいと望む者もいる。たとえそれが、[ROOT.GetCountry.GetNameWithNoTooltip]の益を見込んでのことにすぎないとしても。[target_character.GetNameWithNoTooltip]もまた、いくらか力を貸し、[target_location.GetNameWithNoTooltip]の人々のあいだに新たな語り草を生み出してもよいのかもしれない。"
 culture_greek.19.a: "それで$a_akritai$の働きが知れ渡るというのなら、その物語を広めよう。"
 culture_greek.19.b: "ただ務めを果たせばよい。それだけで後の世の語り草になる。"
 culture_greek.20.title: "支援を求める[target_location.GetNameWithNoTooltip]の$a_akritai$"
 culture_greek.20.desc: "[ROOT.GetCountry.GetName]ほどの広大な[ROOT.GetCountry.GetFlavorRank]ともなれば、どうしても行き届かないところが出る。多くは故意ではないにせよ、現地の人々の不満を招いている。こうした手落ちのため、国境の守りが十分ではないと感じる[target_area.GetName]の人々は不安を抱くようになっていた。彼らは[target_location.GetName]の守備隊に、いっそうの尽力と警戒を求めてきたが、襲撃や侵攻に十分備えるには、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の支援もまた必要である。\n\n彼らの使者が[target_capital.GetName]に到着し、[target_character.GetName]への面会を求めている。[target_location.GetNameWithNoTooltip]の防備を広げるための資金に加え、守備にあたる兵や、日々の訓練を指導する者をさらに送ってほしいのだという。"
 culture_greek.20.a: "隅々にまで守りを行き渡らせよう。"
 culture_greek.20.b: "どこにでも回せるだけの余力はない。"
 culture_greek.21.title: "[target_location.GetNameWithNoTooltip]における地中海貿易の衰退"
 culture_greek.21.desc: "新大陸の発見によって、新たな交易路が生まれた。その多くによって、わが国がこれまで頼みとしてきた地中海交易の重要性は薄れつつある。この海で商いを続けてきた多くの[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は頑なで、いまの海上交易でのつながりを手放そうとしない。彼らは、自分たちに必要なのはこれまでのやり方を改めることではなく、[ROOT.GetCountry.GetGovernment.GetCourtTitle]からの資金援助と、自分たちが重んじる交易拠点への継続的な支援だと考えている。\n\nこうした支援を求めている拠点のひとつが、[target_location.GetName]の[target_location.GetRank.GetName]である。この地は世界規模で進む交易路の変化によって苦境に立たされており、商人たちが新たな品を仕入れられるようにするための資金を求めている。そうすれば商いはいっそう活発になり、[target_location.GetNameWithNoTooltip]もかつてのにぎわいを取り戻せるのだという。"
 culture_greek.21.a: "資金を与えよう。"
 culture_greek.21.b: "商人として成功したいのなら、まずはいまあるものをもっとうまく回すべきだ。"
 culture_greek.21.c: "才覚があれば、どうにでもなる。"
 burghers_in_location_lose_satisfaction: "[target_location.GetName]に居住するすべての[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]低下する"
 burghers_in_location_gains_satisfaction: "[target_location.GetName]に居住するすべての[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]上昇する"
 culture_greek.22.title: "[target_location.GetNameWithNoTooltip]の生神女祭"
 culture_greek.22.desc: "イエスの降誕は、敬虔な[ShowReligionAdjective('orthodox')]の信徒にとって、極めて重大な出来事とされている。そのため、多くの者がしばしば神の母と呼ばれる聖母マリアの名のもとに祭を催す。\n\nこうした祝祭において、[target_location.GetName]の人々ほど熱心な者はいない。彼らは[target_location.GetRank.GetName]とその周辺で祭を催し、丸一日ゆっくり休みながら、参加を希望するすべての者と喜びを分かち合おうとしている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の面々のなかにはすでにその催しを見物しようと現地へ向かっている者もいるのだが、そのなかでも特に信心深い者たちは、この聖なる日を人々にとっていっそう意義深いものにしたいとも考えている。"
 culture_greek.22.a: "まことに大きな祝祭だ。"
 culture_greek.22.b: "我々も祝いに加わろう。"
 culture_greek.22.c: "信仰は違っても、せめてそれを尊ぶことはできる。"
 culture_greek.22.d: "[target_location.GetNameWithNoTooltip]に[ShowReligionAdjectiveWithNoTooltip('orthodox')]の習わしを広めさせはしない。"
 all_pops_in_location_gain_satisfaction: "すべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]上昇する"
 all_orthodox_pops_in_location_lose_satisfaction: "すべての[ShowReligionAdjective('orthodox')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]低下する"
 culture_greek.23.title: "[target_location.GetNameWithNoTooltip]の影響力"
 culture_greek.23.desc: "[ROOT.GetCountry.GetName]において[target_location.GetName]がもつ影響力は、いまや誰の目にも明らかになりつつあり、[target_area.GetName]のこの[target_location.GetRank.GetName]がなぜこれほど存在感を増したのかは、[target_capital.GetName]に住む役人たちの大きな関心事となっている。その主な理由は、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の後押しと、さまざまな[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]による引き立てにある。下級の官吏も、富裕な[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]も、この[target_location.GetRank.GetNameWithNoTooltip]がもたらす機会にあずかっており、現地の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]はぜいたくな暮らしを送っている。\n\nこうした状況を喜ぶ者もいる一方で、この地方の影響力はますます強まり、それが[target_capital.GetName]やその他の地にいる者たちの力を弱め、ひいては国全体の力の均衡を崩している。"
 culture_greek.23.a: "新たな人と富を引き寄せている土地を、なぜ罰せねばならないのか。"
 culture_greek.23.b: "他の都市の懸念はもっともだ。[target_location.GetNameWithNoTooltip]の発展は、いくらか抑えるべきかもしれない。"
 all_pops_with_influential_polis_modifier_lose_satisfaction: "[modifier|e]「[ShowModifier('greek_culture_influential_polis')]」をもつ[locations|e]のすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]低下する"
 all_pops_in_location_lose_satisfaction: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]低下する"
 culture_greek.24.title: "ローマ人の権利主張"
 culture_greek.24.desc: "[ROOT.GetCountry.GetName]の地には、いまなおローマ帝国の影響が残っている。わが国が$BYZ$の称号を名乗ることはできないにせよ、人々はなおも自らを旧帝国と結びつけて考えており、[target_character.GetName]は旧領の一部を求めて、より強硬に動くべきだと唱えている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部の民衆派は、それだけでは足りず、かつて伝説の皇帝たちがそうしたように、わが国もまたその装いを改めるべきだと考えている。[target_capital.GetName]もまた、それにふさわしい姿を備えるべきであり、旧領に対するわが国の主張をより強いものとするため、必要な正統性と威信を感じさせる意匠を取り入れるべきだという。"
 culture_greek.24.a: "「ローマ人」どもには、そんな夢想は捨ててもらおう。"
 culture_greek.24.b: "そのような策も悪くないかもしれない。取り入れてみよう。"
 culture_greek.25.title: "[ShowLocationNameWithNoTooltip('mystras')]の学風"
 culture_greek.25.desc: "名高い[ShowLocationName('mystras')]の哲学は、[ShowRegionName('balkan_region')]、[ShowAreaName('west_anatolia_area')]、そして[ShowRegionName('italy_region')]へと広まりつつある。\n\n貧しい地にも豊かな地にも、多くの学者が足を運んでいる。そのひとつが[target_area.GetName]にある[target_location.GetName]である。外の世界を見て回ろうと旅に出た若い学者たちもこの地に立ち寄り、人々に哲学や文化、弁論についての考えを伝えている。現地の人々の多くもこうした考えに関心を寄せており、とりわけ学のある者たちは、自らの見識を広げたいと望んでいる。こうした教えは、[ROOT.GetCountry.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]の関心も集めているが、この件については[ROOT.GetCountry.GetGovernment.GetCourtTitle]内にも穏やかでない意見がある。危うい思想や教えは抑圧するべきだと考える者もおり、とりわけ[ROOT.GetCountry.GetNameWithNoTooltip]のあり方を損なうおそれのあるものを警戒している。その一方で、身分の低い者たちのなかには、わが国の民にとって大きな学びの機会になるとして、こうした考えが広まるのを歓迎する者もいる。"
 culture_greek.25.a: "その教えは危ういものではない。広まるに任せよう。"
 culture_greek.25.b: "[target_location.GetNameWithNoTooltip]に過激な考えが広まる危険を、なぜ冒さねばならない？"
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "この[event|e]は[ShowScriptedGeographyName('mystras_scholarship_geography')]内の[locations|e]でのみ発生する"
 culture_greek.26.title: "新たな[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の論調"
 culture_greek.26.desc: "ローマの時代には数え切れないほどの著作が生み出され、そのすべては[ShowLanguageName('latin_language')]で書かれていた。だが[ROOT.GetCountry.GetName]には、この言語を学ぼうとしない者もいる。そこで、学識ある学者たちは、それらを人々が日々用いる共通言語である[ROOT.GetCountry.GetCommonLanguage.GetName]に訳すようになった。\n\nこの動きに上層階級は危機感を抱いた。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が長年にわたって学び、修めてきたのと同じ書物に、下々の者までもが触れられるようになると考えたからである。そこで彼らはこの件を[ROOT.GetCountry.GetGovernment.GetCourtTitle]で論じ、上層階級の体面と威信を保つため、このような翻訳書を[ROOT.GetCountry.GetFlavorRank]全土で禁じるよう求めた。"
 culture_greek.26.a: "庶民にも学ぶ権利はある。"
 culture_greek.26.b: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の上層階級の優位を守れるなら、どんなことでもしよう。"
 culture_greek.27.title: "[target_character.GetNameWithNoTooltip]、凱旋式を要求"
 culture_greek.27.desc: "[target_character.GetName]はまたしても見事な勝利を収めて帰還し、群衆は歓声を上げるなか、[target_capital.GetName]の街路を進んだ。その身に危害が及ばぬよう、最も忠実な兵たちからなる護衛の一団が[target_character.GetHerHim]を取り囲んでいた。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]に着くと、[target_character.GetShortNameWithNoTooltip]は謁見を求め、それは渋々ながら許された。[target_character.GetSheHe]は他の廷臣には目もくれず、ただ[target_character2.GetName]をまっすぐ見据え、自らを称える古式の凱旋式を執りおこなうよう求めた。[target_character.GetShortNameWithNoTooltip]は、自らの功績を誰もが知ることこそ士気を高め、[ROOT.GetCountry.GetName]に武力で刃向かおうとする者たちに恐れを抱かせるのだと主張している。"
 culture_greek.27.a: "凱旋式など、騒々しいだけだ。認めることはできない。"
 culture_greek.27.b: "それが[ROOT.GetCountry.GetNameWithNoTooltip]の栄光となるのなら、喜んで凱旋式を執りおこなおう。"
 greek_culture_strategos_will_not_use_triumph_for_popularity: "[target_character.GetName]のために凱旋式をおこなわない場合、[target_character.GetSheHe]が企てるいかなるクーデター計画も進展しない"
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "[target_character.GetName]のために凱旋式をおこなえば、[target_character.GetSheHe]はその人気を利用して、あらゆるクーデター計画の進行を早められる"
 culture_greek.28.title: "学者たちの流出"
 culture_greek.28.desc_common: "[ROOT.GetCountry.GetName]の不安定な情勢のため、多くの学識ある者たちが、よりよい暮らしを求めて混乱に揺れる[ROOT.GetCountry.GetFlavorRank]を離れようと考えている。"
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n彼らが望むのは、哲学や法、宗教について考えを深められ、戦や飢饉、死によってたちまちそれを失うこともない、より安定した暮らしである。だからこそ、多くの者が憧れをもって[target_country.GetName]のことを語る。そこは、より名高く安定した[target_country.GetFlavorRank]であり、彼らが切に求める安らぎを与えてくれるのだ。すでに多くの者が[target_destination.GetName]への移住を始めており、この事実は我らが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の見識ある者たちを不安にさせている。このような移住は[ROOT.GetCountry.GetNameWithNoTooltip]の威信を損なうものだと彼らは考えている。いまの危機を乗り切れなくとも、社会にとって価値ある者たちを、わが国が守れないことを示しているからだ。"
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n格好の逃避先など存在するわけでもないのに、人々は書物で読んだ遠国の繁栄を語っている。[scholar_country.1.GetName]ではこの地とは違って庶民まで豊かな暮らしを送り、[scholar_country2.GetName]の統治者たちは民を虐げることなく、人としての権利を尊び、[scholar_country3.GetName]では伝統ではなく革新が国を動かしているという。\n\n当初は害のないものにすぎなかったこうした声も、やがてわが[ROOT.GetCountry.GetFlavorRank]の隅々にまで広がり、騒ぎを招くようになった。このことを我らが[ROOT.GetCountry.GetGovernment.GetCourtTitle]は深く憂えている。"
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_greek.28.b: "これ以上去ろうとする者が出る前に食い止めよ。"
 culture_greek.28.c: "やつらの言葉が、事態をさらに不安定にしている。"
 culture_greek.28.d: "さらなる騒ぎを防ぐため、その対策に資金を回そう。"
 greek_culture_migration_largely_prevented: "[migration|e]の大半が抑制される"
 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')]の支援要請"
 culture_greek.29.desc: "[target_location.GetName]の人々は[ROOT.GetCountry.GetReligion.GetName]を深く信仰し、日々[ROOT.GetCountry.GetReligion.GetGodName]に祈りを捧げている。だが、[ROOT.GetCountry.GetName]もその政府も十分な支援を与えてこなかったため、[target_location.GetRank.GetName]にある[ShowBuildingTypeName('orthodox_monastery')]は、その内外を神聖な場にふさわしく整えるため、新たな装飾を切実に必要としている。このため、当地の司祭たちはわが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]へ使いを送り、資金を送るよう[target_character.GetName]に求めてきた。この願いを聞き入れれば、この[ROOT.GetCountry.GetFlavorRank]における[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]の信仰に、我々がどれだけ力を尽くしているかを広く示すことになるだろう。"
 culture_greek.29.a: "装飾のための資金を出そう。"
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip]がありとあらゆる聖地に金を出す必要はない。"
 culture_greek.29.c: "[ShowReligionNameWithNoTooltip('orthodox')]の名のもとに、資金を惜しまず出そう。"
 all_orthodox_pops_gain_satisfaction_in_location: "すべての[ShowReligionAdjective('orthodox')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]上昇する"
 culture_greek.30.title: "帝国の遺産"
 culture_greek.30.desc: "東ローマ帝国の灯は消えた。それでも、わが国の民の多くはなお自らをローマ人と呼んでおり、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部にも、旧帝国のしきたりが残っているようである。そのことにより、我らはかつての帝国の正統な後継者を名乗り、その旧領の一部を取り戻すだけの大義名分を得ている。[ROOT.GetCountry.GetCapital.GetName]では、多くの者が[target_province.GetName]に接する国境に目を向け、ローマの後継者を名乗る資格もない[target_country.GetName]から、その地を奪い返すべきだと唱えている。軍もまたこの考えに同調しており、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]とともに、民を戦へと駆り立て、[ROOT.GetCountry.GetName]が本来持つべきものを取り戻すよう呼びかけている。"
 culture_greek.30.a: "ローマの国境は、必ず取り戻す！"
 culture_greek.30.b: "戦争をする必要はない。"
