l_japanese:
 # Estate related
 maghrebi_culture_masters_of_sahara_country_bonus: "[decision|e]「$maghreb_masters_of_the_sahara.title$」から\n以下のボーナスを獲得可能："
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "[decision|e]「$maghreb_masters_of_the_sahara.title$から\n以下のボーナスを獲得でき、[locations|e]「[ShowVegetationName('desert')]」に影響を与える："
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "[decision|e]「$maghreb_masters_of_the_sahara.title$から\n以下のボーナスを獲得でき、[locations|e]「[ShowClimateName('arid')]」に影響を与える："
 # Estate end
 maghrebi_culture.1.title: "[target_location.GetNameWithNoTooltip]の[ShowReligionAdjectiveWithNoTooltip('judaism')]共同体"
 maghrebi_culture.1.desc: "[ShowRegionName('maghreb_region')]の[ShowCultureName('mustaarabi')]の人々の多くは、ムワッヒド朝の統治下で追放されたが、[target_location.GetName]は再び多くの[ShowCultureNameWithNoTooltip('mustaarabi')]が避難してくる中心地となった。[ROOT.GetCountry.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]は[ShowReligionAdjective('judaism')]に対してより寛容な政策を取っているが、より急進的な[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の一部は、かつて捨て去られたムワッヒド朝の教義を再び採用することに関心を示している。"
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip]は今後も[ShowCultureNameWithNoTooltip('mustaarabi')]の人々の避難先であり続ける。"
 maghrebi_culture.1.b: "急進派の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]に働きかけ、彼らに[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]を採用するよう強制する。"
 maghrebi_culture.2.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]における[ShowReligionAdjectiveWithNoTooltip('ibadi')]領"
 maghrebi_culture.2.desc: "強大な[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家が[ShowRegionName('maghreb_region')]全域に影響力を及ぼしていた時代は遠い昔のこととなったが、[our_ruler.GetName]は、今なお[ShowReligionAdjective('ibadi')]の教えを守る国々を統合するため、着実に歩みを進めてきた。[ROOT.GetCountry.GetName]の領土は、[ShowRegionNameWithNoTooltip('maghreb_region')]の中でも発展した国々に比べると豊かではないものの、[our_ruler.GetShortNameWithNoTooltip]の成功は、新たな[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家の誕生につながるかもしれない。"
 maghrebi_culture.2.a: "[ShowRegionNameWithNoTooltip('maghreb_region')]に強大な[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家を築く道を切り開く！"
 maghrebi_culture.2.b: "それよりも、わが国独自の道を切り開くことに注力すべきだ。"
 maghrebi_culture.3.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]における[ShowReligionAdjectiveWithNoTooltip('ibadi')]勢力の復活"
 maghrebi_culture.3.desc: "[our_ruler.GetName]は不可能を可能にし、[ShowRegionName('maghreb_region')]に新たな[ShowReligionAdjective('ibadi')]国家を築き上げた。[ROOT.GetCountry.GetName]が[ShowRegionNameWithNoTooltip('maghreb_region')]の主要国の一つとなったいま、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部から、[ShowReligionGroupName('muslim')]の他宗派に対する政策を見直すよう[our_ruler.GetNameWithNoTooltip]に求める声が上がっている。新たな[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家に新たな信徒が集まる一方、[ShowRegionNameWithNoTooltip('maghreb_region')]ではいまなお多くの人々が[ShowReligionAdjective('sunni')]を信仰している。"
 maghrebi_culture.3.a: "[ShowReligionGroupNameWithNoTooltip('muslim')]のすべての宗派に寛容な政策を採用する。"
 maghrebi_culture.3.b: "他宗派の信徒は[ShowReligionNameWithNoTooltip('ibadi')]を受け入れなければならない。"
 maghrebi_culture.4.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]における新興[ShowReligionAdjectiveWithNoTooltip('ibadi')]国家群"
 maghrebi_culture.4.desc: "かつて[ShowRegionName('maghreb_region')]で大きな影響力を持つ[ShowReligionAdjective('ibadi')]スルタン国が存在したが、ルスタム朝の崩壊後、数世紀のあいだに、多くの敬虔な[ShowReligionAdjectiveWithNoTooltip('ibadi')]信徒が[ShowAreaName('desert_area')]へ移住した。[ROOT.GetCountry.GetName]の領土がいまやこれらの地域にまで広がっていることから、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、残存する国々の中でも比較的弱い[target_country.GetName]に、[our_ruler.GetName]が遠征を行うべきだとの声が上がっている。"
 maghrebi_culture.4.a: "[target_country.GetNameWithNoTooltip]の弱みにつけ込め！"
 maghrebi_culture.4.b: "あの国々はあまりにも分裂しているうえ遠方にあるため、脅威にはなり得ない。"
 maghrebi_culture.5.title: "Subjugation of the [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] [ShowReligionAdjectiveWithNoTooltip('ibadi')] Populace"
 maghrebi_culture.5.desc: "[ShowAreaName('desert_area')]には以前からかなりの数の[ShowReligionAdjectiveWithNoTooltip('ibadi')]住民が暮らしていたが、その大半は[ROOT.GetCountry.GetName]の支配下に入った。いまや[ROOT.GetCountry.GetNameWithNoTooltip]には相当数の[ShowReligionNameWithNoTooltip('ibadi')]信徒が暮らしていることから、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは、宗教的な混乱を避けるため、[our_ruler.GetName]に[ShowReligionAdjectiveWithNoTooltip('ibadi')]信徒への寛容政策を採用するよう求めている。"
 maghrebi_culture.5.a: "彼らは[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]に改宗しなければならない。"
 maghrebi_culture.5.b: "代わりに、[ShowReligionAdjectiveWithNoTooltip('ibadi')]住民を平和的に統合することを目指す。"
 maghrebi_culture.6.title: "拡大する[ROOT.GetCountry.GetNameWithNoTooltip]の影響力"
 maghrebi_culture.6.desc: "ムワッヒド朝の崩壊後数十年にわたり、[target_country_1.GetName]と[target_country.GetName]は[ShowRegionName('maghreb_region')]で大きな影響力を持ってきたが、[our_ruler.GetName]の指揮のもと、[target_country.GetNameWithNoTooltip]は[ShowRegionNameWithNoTooltip('maghreb_region')]内に強大な領土を築き上げることに成功した。[target_country_1.GetNameWithNoTooltip]と[target_country.GetNameWithNoTooltip]の有力者たちは[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の影響力を警戒しているものの、多くの[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]の人々は、わが国の支配をより好意的に受け入れている。"
 maghrebi_culture.6.a: "[ShowRegionNameWithNoTooltip('maghreb_region')]を[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配下に置け！"
 maghrebi_culture.7.title: "[target_location.GetNameWithNoTooltip]のヤシ灌漑"
 maghrebi_culture.7.desc: "[ShowRegionName('maghreb_region')]の多くの土地は肥沃な土壌に恵まれている一方、[ShowAreaName('desert_area')]に近いため、地形が険しい地域もある。\n\n[target_location.GetName]は、入植地の厳しい環境を少しでも和らげるため、[target_location.GetRank.GetName]内に新たな[ShowBuildingTypeName('maghreb_palm_irrigation')]を整備するための資源を要請している。"
 maghrebi_culture.7.a: "地元の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]に資源を提供し、灌漑網を整備する。"
 maghrebi_culture.7.b: "資源に余裕がない。"
 maghrebi_culture.8.title: "[target_location.GetNameWithNoTooltip]の洗練された建築"
 maghrebi_culture.8.desc: "[target_location.GetName]の人々は、[ShowVegetationName('desert')]の過酷な地形に適応した建築様式で古くから知られてきたが、わが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]から派遣された建築家たちは、この地域で目にしたものに感銘を受けて帰還した。[ROOT.GetCountry.GetCapital.GetName]の地形は[target_location.GetNameWithNoTooltip]のものとは異なるものの、建築家たちは、[our_ruler.GetName]の支援があれば[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]でも同様の工夫を取り入れられると考えている。"
 maghrebi_culture.8.a: "[target_location.GetNameWithNoTooltip]の建築様式を取り入れる。"
 maghrebi_culture.8.b: "それよりも、[target_location.GetNameWithNoTooltip]に追加の資源を提供すべきだ。"
 maghrebi_culture.9.title: "[ShowCultureGroupNameWithNoTooltip('amazigh_group')]の民の伝統"
 maghrebi_culture.9.desc: "11世紀、ファーティマ朝の支援を受けて多くの[ShowCultureName('bedouin_culture')]部族が[ShowRegionName('maghreb_region')]へ移住して以来、土着の[ShowCultureGroupName('amazigh_group')]の人々の多くは、勢力を増す[ShowCultureGroupName('arabic_group')]の有力者を認めることを余儀なくされてきた。[ROOT.GetCountry.GetName]の支配下では、多くの[ShowCultureGroupNameWithNoTooltip('amazigh_group')]の人々が自治を維持してきたものの、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部からは、わが国の支配を正当化するため、[ShowCultureGroupNameWithNoTooltip('arabic_group')]の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の一部を[ROOT.GetCountry.GetNameWithNoTooltip]に迎え入れるべきだとの意見が出ている。しかし、そのような招待は[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]の反感を買う可能性が高い。"
 maghrebi_culture.9.a: "[ShowCultureGroupNameWithNoTooltip('arabic_group')]の有力者たちと協力するよう努めるべきだ。"
 maghrebi_culture.9.b: "それよりも、[ShowCultureGroupNameWithNoTooltip('amazigh_group')]の伝統を守ることを目指すべきだ。"
 maghrebi_culture.10.title: "サハラ交易における[target_location.GetNameWithNoTooltip]の重要性の高まり"
 maghrebi_culture.10.desc: "[ShowAreaName('desert_area')]にある数多くの交易路のひとつに位置する[target_location.GetName]は、古くから[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の商人たちにとって重要な中継地だった。しかし近年、[ROOT.GetCountry.GetName]の保護もとで、[target_location.GetRank.GetName]の重要性が増している。[ROOT.GetCountry.GetAdjective]の領土内は安全に通行できるため、多くの商人が立ち寄るようになったのだ。これにより[target_location.GetNameWithNoTooltip]はサハラ全域で広く知られるようになった一方、[target_location.GetRank.GetNameWithNoTooltip]には大きな負担がかかっている。\n\n交易において影響力のある拠点であり続けられるよう、[target_location.GetRank.GetNameWithNoTooltip]が増え続ける商人を受け入れられるよう、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くは、[target_location.GetRank.GetNameWithNoTooltip]に適切な資源を提供するよう[our_ruler.GetName]に求めている。"
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip]はサハラ交易における重要性を維持しなければならない！"
 maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]は[target_location.GetNameWithNoTooltip]に回せる資源を有していない。"
 maghrebi_culture.11.title: "[target_location.GetNameWithNoTooltip]の農業の繁栄"
 maghrebi_culture.11.desc: "[ShowRegionName('maghreb_region')]の中でも厳しい環境にある[target_location.GetName]が、近年、[ShowBuildingTypeName('maghreb_palm_irrigation')]が拡充されたことで、人々の暮らしは安定している。この拡充は、[target_location.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]にとって、大きな恩恵となっている。"
 maghrebi_culture.11.a: "$common_string_good$"
 maghrebi_culture.12.title: "[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]の統治下で"
 maghrebi_culture.12.desc: "ムワッヒド朝の滅亡以来、[ShowCultureName('tunisian')]の[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]は[ShowRegionName('maghreb_region')]東部で大きな影響力を維持してきた。[ROOT.GetCountry.GetName]は[target_country.GetName]からある程度の独立を保ってきたものの、[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]の支配者たちは、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の領土を守るうえで、有能な宗主として領土を守ってきた。しかし、ムワッヒド朝の支配が遠い過去の記憶となりつつある今、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]朝の支配者たちの正統性を疑問視する声が上がっている。[ROOT.GetCountry.GetNameWithNoTooltip]が[ShowCultureNameWithNoTooltip('tunisian')]の支配から解放されるべき時が来たというのだ。"
 maghrebi_culture.12.a: "[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]は[ROOT.GetCountry.GetNameWithNoTooltip]を手厚く保護してきた。"
 maghrebi_culture.12.b: "[ShowDynastyNameWithNoTooltip('hafsid_dynasty')]の支配という束縛を断ち切る時が来た。"
 maghrebi_culture.13.title: "[ShowCultureNameWithNoTooltip('tunisian')]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]による内政干渉"
 maghrebi_culture.13.desc: "[ROOT.GetCountry.GetLongName]は以前から[ShowCultureName('tunisian')]の宗主権を認めてきたものの、[ROOT.GetCountry.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]はこれまで大部分の自治を保ってきた。しかし、近頃、[target_character.GetName]が従来から[ROOT.GetCountry.GetCulture.GetName]の勢力圏だった地域にたびたび立ち入ったことで、[ROOT.GetCountry.GetNameWithNoTooltip]全土に不安定な状況が広がっている。[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]の多くは、[target_character.GetNameWithNoTooltip]を[ROOT.GetCountry.GetNameWithNoTooltip]から追放するよう求めているが、追放を実行すれば[target_country.GetName]の怒りを買う可能性が高い。"
 maghrebi_culture.13.a: "[target_character.GetNameWithNoTooltip]を[ROOT.GetCountry.GetNameWithNoTooltip]から追放しろ！"
 maghrebi_culture.13.b: "[target_character.GetHerHim]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]に留まることを許す。"
 maghrebi_culture.14.title: "[target_location.GetNameWithNoTooltip]への[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]の襲撃"
 maghrebi_culture.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]に忠誠を誓う兵士たちが[target_location.GetName]で隊商を襲撃したとの報告を受け、混乱に陥っている。サハラ交易に欠かせない交易路沿いに位置する[target_location.GetNameWithNoTooltip]は、多くの商人にとって重要な中継地となっている。問題を起こした兵士たちがもたらした損害の埋め合わせを求め、被害を受けた[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くが、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]にその費用を負担するよう求めている。"
 maghrebi_culture.14.a: "襲撃による損害の費用を[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]に負担させる。"
 maghrebi_culture.14.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]を叱責するが、損害の補填は国が行う。"
 maghrebi_culture.14.c: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]の側につき、襲撃の継続を認める。"
 maghrebi_culture.15.title: "Rising Support Amongst the [target_culture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.15.desc: "[ShowRegionName('maghreb_region')]における[ROOT.GetCountry.GetAdjective]の支配が拡大するにつれ、現地の複数の集団が[ROOT.GetCountry.GetNameWithNoTooltip]に忠誠を誓うようになった。なかでも、[target_culture.GetName]の[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]は[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配を最も好意的に受け入れており、[target_culture.GetNameWithNoTooltip]の指導者の多くが、自らの部族による全面的な支持を表明している。[target_culture.GetNameWithNoTooltip]からこれほどの支持が寄せられたことに驚いた[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、[our_ruler.GetName]が国家として全面的な支援を約束し、[ShowRegionNameWithNoTooltip('maghreb_region')]全域で[target_culture.GetNameWithNoTooltip]の利益を推進すべきだという意見が出ている。一方で、この熱烈な支持を別の形で活用すべきだという意見もある。"
 maghrebi_culture.15.a: "彼らの支持を歓迎する！"
 maghrebi_culture.15.b: "彼らの支援を利用し、[ShowRegionNameWithNoTooltip('maghreb_region')]全域で我々の影響力を強化する。"
 maghrebi_culture.16.title: "名高い[target_culture.GetNameWithNoTooltip]の将軍"
 maghrebi_culture.16.desc: "[target_culture.GetName]の人々と[ROOT.GetCountry.GetCulture.GetName]の有力者との関係が深まるにつれ、 [ShowRegionName('maghreb_region')]における[ROOT.GetCountry.GetAdjective]の支配は安定してきた。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]への忠誠をさらに示そうと、[target_culture.GetNameWithNoTooltip]の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] は、優れた資質を持つ指導者のひとりを[ROOT.GetCountry.GetNameWithNoTooltip]に仕えさせることを申し出た。しかし、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の一部は、[target_culture.GetNameWithNoTooltip]の [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]に自治を認めれば、最終的には[ShowRegionNameWithNoTooltip('maghreb_region')]における我々の支配に悪影響を及ぼしかねないとして、[our_ruler.GetName]に申し出を拒否するよう進言している。"
 maghrebi_culture.16.a: "[target_character.GetShortNameWithNoTooltip]を[ROOT.GetCountry.GetGovernment.GetCourtTitle]に歓迎しよう！"
 maghrebi_culture.16.b: "[target_character.GetHimHer]を将軍として雇用することは拒否する。"
 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]による有望な将軍の推薦"
 maghrebi_culture.17.desc: "Although the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] of [ROOT.GetCountry.GetName] have proven to be a strain on the [ROOT.GetCountry.GetGovernment.GetCourtTitle], in recent years the once-unruly [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have begun acknowledging [ROOT.GetCountry.GetAdjectiveWithNoTooltip] authority throughout the [ShowRegionName('maghreb_region')]. Seeking to demonstrate these newfound loyalties to the [ROOT.GetCountry.GetGovernment.GetCourtTitle], the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have offered [target_character.GetName] to serve [ROOT.GetCountry.GetNameWithNoTooltip], who is said to have great talents. Some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] fear this may be a ploy by the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] to curry influence from [our_ruler.GetName], however."
 maghrebi_culture.17.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]からの申し出を受ける。"
 maghrebi_culture.17.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]の影響力がこれ以上強まるような事態は避けなければならない。"
 maghrebi_culture.18.title: "[our_ruler.GetDynasty.GetNameWithNoTooltip]の台頭"
 maghrebi_culture.18.desc: "ムワッヒド朝の滅亡後、[ShowDynastyName('marinid_dynasty')]と[ShowDynastyName('hafsid_dynasty')]はいずれも[ShowRegionName('maghreb_region')]で大きな勢力を築いた。しかし、近年の[our_ruler.GetDynasty.GetName]による軍事作戦によって、[ShowRegionNameWithNoTooltip('maghreb_region')]に新たな勢力が台頭する道が開かれた。[our_ruler.GetDynasty.GetNameWithNoTooltip]による[ShowRegionNameWithNoTooltip('maghreb_region')]の支配は、現地の[ShowCultureGroupNameWithNoTooltip('amazigh_group')]の人々から支持を得ているものの、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、[ShowRegionNameWithNoTooltip('maghreb_region')]の他の有力勢力を凌ぐには、国外にも目を向けるべきだという意見が出ている。"
 maghrebi_culture.18.a: "同盟国を求め、我々の立場を強化する。"
 maghrebi_culture.18.b: "それよりも、内政に目を向ける。"
 maghrebi_culture.19.title: "[target_culture.GetNameWithNoTooltip]の人々との連帯"
 maghrebi_culture.19.desc: "11世紀に[ShowCultureName('bedouin_culture')]が[ShowRegionName('maghreb_region')]へ移住したことで、この地域の政治構造は大きく変化した。しかし、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配下にある[ROOT.GetCountry.GetCulture.GetName]と[target_culture.GetName]の人々の間では、新たな一体感が生まれている。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]による、彼らの故郷である[ShowRegionNameWithNoTooltip('maghreb_region')]の支配は、両者の間にあったそれまでの部族間対立をおおむね解消し、共通の一体感を育むことにつながった。"
 maghrebi_culture.19.a: "強い結束があれば、我々が征服されることはない！"
 maghrebi_culture.19.b: "[target_culture.GetNameWithNoTooltip]との強い結束を活かし、[ShowRegionNameWithNoTooltip('maghreb_region')]における我々の影響力を強化する。"
 maghrebi_culture.19.c: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]と[target_culture.GetNameWithNoTooltip]の文化的な結びつきは決して揺るがない。"
 maghrebi_culture.20.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]における[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の支配"
 maghrebi_culture.20.desc: "[ROOT.GetCountry.GetCulture.GetName]の有力者の多くは、[ShowCultureGroupName('arabic_group')]の慣習や伝統を徐々に取り入れてきたが、それが伝統を重んじる[ShowRegionName('maghreb_region')]の人々との対立を招くこともあった。[ROOT.GetCountry.GetGovernment.GetCourtTitle]では、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の不満の矛先が[target_culture.GetName]の人々に向けられており、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の有力者の多くは、[target_culture.GetNameWithNoTooltip]の人々との取引を拒んでいる。\n\n[ROOT.GetCountry.GetName]全域に及ぶ影響力を活用しようと、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]は[our_ruler.GetName]に対し、[target_culture.GetNameWithNoTooltip]に対する同化政策をより強硬に進めるよう求めた。しかし、結果として生じる情勢不安を懸念し、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部は[our_ruler.GetShortNameWithNoTooltip]に彼らの要求を拒否するよう進言している。"
 maghrebi_culture.20.a: "彼らを[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]社会に同化させることを目指す。"
 maghrebi_culture.20.b: "それよりも、[target_culture.GetNameWithNoTooltip]の人々を統合すべきだ。"
 maghrebi_culture.21.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]の窮状"
 maghrebi_culture.21.desc: "[ShowRegionName('iberia_region')]における最後の[ShowReligionGroupAdjective('muslim')]国家が滅亡したことで、[ShowRegionName('maghreb_region')]全域に再び動揺が広がっている。[ShowRegionNameWithNoTooltip('iberia_region')]の[ShowReligionGroupAdjectiveWithNoTooltip('christian')]国家がまもなく[ShowRegionNameWithNoTooltip('maghreb_region')]に目を向けるのではないかと、多くの人々が恐れているのだ。すでに多くの[ShowCultureName('andalusi')]が、[ShowCultureGroupName('iberian_group')]の人々の怒りから逃れようと、[ROOT.GetCountry.GetNameWithNoTooltip]に庇護を求めている。"
 maghrebi_culture.21.a: "我々は[ShowCultureGroupNameWithNoTooltip('iberian_group')]の侵略者に屈しない！"
 maghrebi_culture.21.b: "侵略の可能性に引き続き警戒すべきだ。"
 maghrebi_culture.22.title: "[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]で普及："
 maghrebi_culture.22.desc: "Although the people of [ROOT.GetCountry.GetName] have remained more accustomed to the Saharan trade, the campaigns of [our_ruler.GetName] have helped [ROOT.GetCountry.GetNameWithNoTooltip] to establish a sizable coastal presence, gaining access to the [ShowScriptedGeographyName('mediterranean_sea_geography')]. Seeing new opportunity for commerce, many [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to fund the expansion of a new fleet, although some fear this could disrupt the traditional Saharan trade that has long benefited [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.a: "We must move quickly to establish a maritime presence."
 maghrebi_culture.22.b: "We cannot neglect our Saharan trade routes."
 maghrebi_culture.23.title: "Reckoning of the Arabized Elite"
 maghrebi_culture.23.desc: "The [target_culture.GetName] have held considerable power in the [ShowRegionName('maghreb_region')] for a long time. They have also been a point of contention with many [ShowCultureGroupName('amazigh_group')] people, as they advocate for aggressive assimilation policies and urge them to adopt [ShowCultureGroupName('arabic_group')] customs. With the rise of [ROOT.GetCountry.GetName], a [ROOT.GetCountry.GetFlavorRank] where the [ROOT.GetCountry.GetCulture.GetName] maintain power as the ruling elite, some of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have asked [our_ruler.GetName] to curb the power of the [target_culture.GetNameWithNoTooltip]. Others in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], however, see the [target_culture.GetNameWithNoTooltip] elite as invaluable allies in strengthening our growing rule over the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.23.a: "Strive for a compromise between the [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] and [target_culture.GetNameWithNoTooltip] elites."
 maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip] influence over the [ShowRegionNameWithNoTooltip('maghreb_region')] has come to an end."
 maghrebi_culture.24.title: "New [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] Kilims"
 maghrebi_culture.24.desc: "[ROOT.GetCountry.GetCulture.GetName] tapestries have long been a commodity across the [ShowRegionName('maghreb_region')] as well as a key good for many [ROOT.GetCountry.GetAdjective] traders. In recent years, however, acquiring a more reliable source of [ShowGoodsNameWithNoTooltip('dyes')] has led to a new generation of [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] Kilims, along with a growing interest both in the [ShowRegionName('maghreb_region')] and abroad for the tapestries."
 maghrebi_culture.24.a: "Reap the benefits of the new tapestries."
 maghrebi_culture.24.b: "We must continue to invest in the new tapestries!"
 maghrebi_culture.25.title: "Consolidation of [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Lands"
 maghrebi_culture.25.desc: "Although the strength of the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] has been instrumental in ensuring [ROOT.GetCountry.GetName] could fend off hreats in the past, the expanding bureaucracy of the [ROOT.GetCountry.GetFlavorRank] has led to numerous discussions in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] about their effectiveness. While the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have helped protect [ROOT.GetCountry.GetNameWithNoTooltip] in the past, they have also been a source of trouble when disagreeing with [ROOT.GetCountry.GetGovernment.GetCourtTitle] policies.\n\nThis has now led to conversations in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that the state has grown strong enough, and no longer needs to rely on the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] for protection. Moreover, the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] now must be reined in for good in order to strengthen the growing [ROOT.GetCountry.GetAdjectiveWithNoTooltip] state."
 maghrebi_culture.25.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] be reminded of their place in this world."
 maghrebi_culture.25.b: "Maintain [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] autonomy to avoid internal strife."
 maghrebi_culture.26.title: "Dominance Over the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.26.desc: "Though the collapse of the Almohads saw the [ShowRegionName('maghreb_region')] enter a period of instability, as well as weakening influence over [ShowRegionName('iberia_region')], [ROOT.GetCountry.GetName] under [our_ruler.GetName] has emerged as the de facto power in the region. While other portions of the [ShowRegionNameWithNoTooltip('maghreb_region')] still remain outside [ROOT.GetCountry.GetAdjectiveWithNoTooltip] influence, the [ShowCultureGroupName('iberian_group')] Kingdoms are more likely to acknowledge [ROOT.GetCountry.GetNameWithNoTooltip] as a regional rival that cannot be underestimated should they desire to conquer the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.a: "We shall stand as the protectors of the Maghreb!"
 maghrebi_culture.27.title: "The [our_ruler.GetDynasty.GetNameWithNoTooltip] Golden Age of the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.27.desc: "With much of the [ShowRegionName('maghreb_region')] now under [ROOT.GetCountry.GetAdjective] rule, the [our_ruler.GetDynasty.GetName] have taken steps towards re-innovating much of the important cultural architecture in the [ShowRegionNameWithNoTooltip('maghreb_region')], as well as sponsoring the construction of various new centers of learning. Though the region was once on the cusp of being dominated by outside powers, under [our_ruler.GetDynasty.GetNameWithNoTooltip] rule, it has instead sharpened itself into a major power revered across the entire [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.a: "May the [our_ruler.GetDynasty.GetNameWithNoTooltip] rule continue to bring prosperity"
 maghrebi_culture.28.title: "Influence Over the Corsairs"
 maghrebi_culture.28.desc: "While the privateers of the [ShowRegionName('maghreb_region')] have earned a reputation across [ShowContinentName('europe')] for being a major raiding force on the [ShowScriptedGeographyName('mediterranean_sea_geography')], their sponsorship until now has varied from state from state.\n\nHowever, with the growing expansion of [ROOT.GetCountry.GetAdjective] influence over the coast, many privateers have turned towards [ROOT.GetCountry.GetNameWithNoTooltip] in hopes of garnering our support to increase the intensity of raids across the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], however, feel that this also creates an opportunity to weaken the privateers in hopes of rebuilding relations with the European powers who have earned their ire over the centuries."
 maghrebi_culture.28.a: "Offer the full backing of the state."
 maghrebi_culture.28.b: "Allow the Corsairs to continue their operations."
 maghrebi_culture.28.c: "Clamp down on the Corsair raids"
 # Decisions
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Centralize the Majlis 'Ammi Sa'īd"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Since the fall of the Rustamids, many [ShowReligionAdjective('ibadi')] people in the [ShowRegionName('maghreb_region')] were forced to flee into the Mzab Valley. While many of these [ShowReligionAdjectiveWithNoTooltip('ibadi')] states chose to participate in the Majlis 'Ammi Sa'īd with the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] at the helm, others have decided to retain their independence.\n\nWith many of the more populated [ShowReligionAdjectiveWithNoTooltip('ibadi')] lands now under [ROOT.GetCountry.GetName], [our_ruler.GetName] has sought to centralize the Majlis 'Ammi Sa'īd in [ROOT.GetCountry.GetCapital.GetName] in hopes of further creating a strong and influential [ShowReligionAdjectiveWithNoTooltip('ibadi')] state in the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "A council scattered across proudly independent [ShowReligionAdjective('ibadi')] states can advise, but it cannot rule. Now that the most populous of those lands answer to us, the Majlis 'Ammi Sa'īd can be gathered under a single roof and a single authority. What began as a refuge in the Mzab Valley would then become a realm in its own right across the [ShowRegionName('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "The loyalty of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] will help strengthen our rule!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "The loyalty of the $crown_estate$ will help strengthen our rule!"
 maghreb_masters_of_the_sahara.title: "Masters of the Sahara"
 maghreb_masters_of_the_sahara.desc: "For generations the peoples of the [ShowRegionName('maghreb_region')] have participated in the Saharan trade, crossing the harsh deserts in order to transport valuable trade commodities. While it may prove a daunting task, should we manage to establish considerable influence over the [ShowAreaName('desert_area')] while also expanding the infrastructure of core caravan stops, our peoples may yet tame these unforgiving sands."
 maghreb_masters_of_the_sahara.a: "We have achieved the impossible!"
 empower_the_desert_power_privilege_tt: "The [ShowEstatePrivilegeName('desert_power')] will become greatly enhanced, gaining additional benefits that counter the penalties suffered by [ShowVegetationName('desert')] and [ShowClimateName('arid')] [locations|e]"
 empower_the_desert_power_privilege_tt_default_bonus: "The [ShowEstatePrivilegeName('desert_power')] will also gain #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] and #G +2.50%#! [ShowModifierTypeName('global_max_control')]"
