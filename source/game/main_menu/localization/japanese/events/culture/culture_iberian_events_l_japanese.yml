l_japanese:
 iberian_culture.1.title: "レコンキスタの歌"
 iberian_culture.1.desc: "異教徒との戦いを題材に、吟遊詩人から庶民までが[ShowReligionGroupAdjective('christian')|U]の大義の勝利のために戦う兵士たちの勇敢さをたたえる歌を詠むようになった。こうした歌が[ROOT.GetCountry.GetFlavorRank]全土に広まれば、戦場で兵士たちを鼓舞し、さらには兵士に志願する者を増やすための有効な手段となるかもしれない。"
 iberian_culture.1.a: "戦場に歌を響かせよ！"
 iberian_culture.1.b: "兵士の募集にも弾みがつくだろう！"
 iberian_culture.2.title: "レコンキスタの英雄"
 iberian_culture.2.desc: "[GetCountry('GRA').GetName]との戦いに参加した数多くの勇敢な者たちの中でも、[new_general.GetName]は戦場での勇気と技量によってひときわ名を上げた。[new_general.GetHerHis|U]の名声は今や[ROOT.GetCountry.GetFlavorRank]全土に知れ渡り、その功績にふさわしい指揮権を与えるべきだと主張する者も多い。"
 iberian_culture.2.a: "[new_general.GetSheHe|U]にわが軍を指揮させる。"
 iberian_culture.2.b: "[new_general.GetHerHis]の能力は別の方面で活用する。"
 iberian_culture.3.title: "南方への入植"
 iberian_culture.3.desc: "[ShowAreaName('granada_area')]がついに[ShowReligionGroupAdjective('muslim')]の支配から解放され、多くの家族が新たな機会を求めてこの地に目を向けはじめた。最近では、[target_province.GetName]で放棄された土地を手に入れ、新たな暮らしを築けるという話に引かれ、[origin_province.GetName]から人々が移り住んでいるとの報告が届いている。"
 iberian_culture.3.a: "彼らの移住を認める。"
 iberian_culture.3.b: "入植者の数を制限するよう努める。"
 iberian_culture.4.title: "聖母マリアの奇跡"
 iberian_culture.4.desc: "[target_location.GetName]で奇跡が起きたという噂が広まっている。地元の人々の話によれば、集落を見下ろす丘の斜面に聖母マリアが姿を現したという。奇跡を疑う者もいるが、それでも遠近各地から巡礼者が訪れるようになった。今や通りは旅人であふれ、地元の人々は彼らからさかんに利益を得ている。多くの献金が地元の財庫に集まり、この新たな富をどう使うべきか、激しい議論が交わされている。"
 iberian_culture.4.a: "地元に再投資する。"
 iberian_culture.4.b: "献金を[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]に納める。"
 iberian_culture.4.c: "貧しい人々に施しをする。"
 iberian_culture.4.d: "これらの寄進は[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]が監督する。"
 iberian_culture.5.title: "北の海からの帰還"
 iberian_culture.5.desc: "[ShowCultureName('basque')]の捕鯨船団が、遠い北の海への遠征から再び帰還した。危険な嵐や、船乗りたちにさえ知られていない海域を乗り越え、貴重な積荷と実践的な知識を数多く持ち帰った。[ROOT.GetCountry.GetGovernment.GetCourtTitle]では今、こうした経験をどのように生かすべきか、議論が交わされている。"
 iberian_culture.5.a: "航海のたびに、前回の経験から学ぶべきだ。"
 iberian_culture.5.b: "海には無限の可能性がある。"
 iberian_culture.6.title: "熟練のムデハル芸術家"
 iberian_culture.6.desc: "[target_character.GetName]という優れた[ShowReligionGroupAdjective('muslim')]の芸術家が、[ROOT.GetCountry.GetFlavorRank]全土で名声を高めているとの報告が届いた。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の者たちは、[target_character.GetHimHer]をわが国に招いて仕えさせることを提案しているが、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の中には、ムデハルにそのような栄誉を与えることに反対する者も多い。"
 iberian_culture.6.a: "才能は信仰によって決まるものではない。"
 iberian_culture.6.b: "そのような栄誉は[ShowReligionGroupAdjective('christian')|U]の民にこそ与えられるべきだ。"
 iberian_culture.7.title: "市場での争い"
 iberian_culture.7.desc: "[target_location.GetName]で緊張が高まっている。[ShowReligionAdjective('sunni')]の商人と[ShowReligionAdjective('catholic')]の商人が、地元の役人やギルドから不公平な扱いを受けているとして、互いに非難し合っているのだ。[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に、この争いの仲裁に入るよう要請が寄せられている。"
 iberian_culture.7.a: "正義は貫かれなければならない。"
 iberian_culture.7.a.tt1: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('sunni')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 iberian_culture.7.a.tt2: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('catholic')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 iberian_culture.7.b: "我々の仲間を守らなければならない。"
 iberian_culture.7.b.tt1: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('sunni')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 iberian_culture.7.b.tt2: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('catholic')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 iberian_culture.7.c: "彼らが自分たちで解決すべきだ。"
 iberian_culture.8.title: "ムデハルの伝統を守る争い"
 iberian_culture.8.desc: "[target_location.GetName]では、地元の[ShowReligionAdjective('sunni')]の人々が、何世代にもわたって受け継がれてきた伝統的な祭りを再び祝っている。こうした祭りは日常生活の一部にすぎず、何ら害はないと考える者も多い。しかし、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の代表者たちは、こうした祝祭を禁止するよう我々に圧力をかけている。このような祭りを公然と行うことは、[ROOT.GetCountry.GetFlavorRank]の[ShowReligionAdjective('catholic')]のあり方を損なうというのだ。"
 iberian_culture.8.a: "祭りを続けさせる。"
 iberian_culture.8.a.tt: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('sunni')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 iberian_culture.8.b: "祭りを終わらせる。"
 iberian_culture.8.b.tt: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('sunni')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.9.title: "繁栄するムデハル地区"
 iberian_culture.9.desc: "[target_location.GetName]のムデハル地区は繁栄を続けており、多くの職人や商人を引きつけている。彼らの活動によって、この町は新たな繁栄を手にしている。地域経済にとって、この地区の富が増すことは利益となる一方で、地元の有力者の中には、この共同体の影響力が増し、いつか自分たちに匹敵するようになるのではないかと懸念する者も現れはじめている。"
 iberian_culture.9.a: "繁栄は皆に恩恵をもたらす。"
 iberian_culture.9.b: "彼らの影響力を抑えるため、富の一部を取り上げる。"
 iberian_culture.9.b.tt: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('sunni')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.10.title: "著名なムデハルの医師"
 iberian_culture.10.desc: "最近、ムデハル人の医師たちは[ROOT.GetCountry.GetFlavorRank]全土で広く称賛されるようになっており、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の多くは、彼らの専門知識を頼りにすることが増えている。一部の顧問は、彼らを正式に[ROOT.GetCountry.GetGovernment.GetCourtTitle]付きの医師に任命すべきだと提案している。しかし、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の有力者たちは、この提案に強く反対している。"
 iberian_culture.10.a: "信仰よりも技量が重要だ。"
 iberian_culture.10.b: "代わりに[ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]の医師を任命する。"
 iberian_culture.11.title: "コンベルソへの疑念"
 iberian_culture.11.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に、[ShowReligionName('judaism')]から改宗した家系の出身である[target_character.GetName]が、かつての信仰の儀式を密かに続けているとして告発されたとの報せが届いた。報告によれば、禁じられた祈りが唱えられ、秘密の集会が開かれていたという。一方で、この告発は嫉妬や借金をめぐる争いから生じたものだと主張する者もいる。"
 iberian_culture.11.a: "こうした異端行為は宗教裁判所で調査しなければならない。"
 iberian_culture.11.b: "悪意に満ちた中傷だ！"
 iberian_culture.12.title: "[ShowCultureNameWithNoTooltip('sephardi')]の商人の告発"
 iberian_culture.12.desc: "[target_location.GetName]の有力な[ShowCultureName('sephardi')]の商人たち数名が、税制の抜け穴の悪用、高利貸し、自らの利益のための価格操作など、不正な手段で富を蓄えているとして告発された。告発したのは彼らの商売敵たちであり、その内容が事実かどうかは定かではない。しかし、争いがこれ以上激化する前に、対処しなければならない。"
 iberian_culture.12.a: "彼らの財産を没収する。"
 iberian_culture.12.a.tt: "[target_location.GetName]に居住するすべての[ShowCultureName('sephardi')]の[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.12.b: "証拠がなくては動けない。"
 iberian_culture.12.b.tt: "[target_location.GetName]に居住するすべての非[ShowCultureName('sephardi')]の[ShowPopTypeName('burghers')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.13.title: "暑さと疫病との戦い"
 iberian_culture.13.desc: "[ROOT.GetCountry.GetFlavorRank]南部の地域では、強い日差しの下でも家の中を涼しく保つため、消石灰で家屋を白く塗る習慣が根付いている。また、疫病の蔓延を防ぐ効果もあると考えられている。[target_location.GetName]の民は最近、消石灰の不足に悩まされており、家屋を守るための支援を求めて[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に陳情した。"
 iberian_culture.13.a: "彼らが十分な消石灰を確保できるようにする。"
 iberian_culture.13.a.tt: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 iberian_culture.13.b: "金を出す余裕などない。"
 iberian_culture.13.b.tt: "[target_location.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.14.title: "カニャーダス・レアレスをめぐる争い"
 iberian_culture.14.desc: "季節が移り変わると、何百万頭もの羊が、わが国の各地に広がる歴史ある王立移牧道であるカニャーダス・レアレスを通って移動する。しかし、[target_location.GetName]の住民たちは、羊の群れに畑を踏み荒らされることを恐れ、牧羊者たちが集落を通過するのを拒んでいる。"
 iberian_culture.14.a: "牧羊者たちが古くから有する通行権を守る。"
 iberian_culture.14.a.tt: "[target_location.GetName]に居住するすべての[ShowPopTypeName('peasants')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.14.b: "地元住民に有利な形で争いを決着させる。"
 iberian_culture.15.title: "水裁判所での争い"
 iberian_culture.15.desc: "伝統的な水裁判所は、[target_location_1.GetName]と[target_location_2.GetName]の間で起きた争いを扱っている。夏の焼けつくような日差しの下、この地域では両方の集落の畑を十分に潤すだけの水が不足しており、住民たちは水の配分をめぐって争っている。"
 iberian_culture.15.a: "[target_location_1.GetNameWithNoTooltip]を優先すべきだ。"
 iberian_culture.15.b: "[target_location_2.GetNameWithNoTooltip]の畑のほうが重要だ。"
 iberian_culture.15.c: "水は均等に配分すべきだ。"
 iberian_culture.16.title: "フエロの保護"
 iberian_culture.16.desc: "[target_location.GetName]に派遣した徴税官は、地元の行政官たちに町への立ち入りを拒まれた。地域の有力者たちは、古くから認められてきた特権法であるフエロを盾にしている。これは、自らの議会が明示的に承認しない限り、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]による課税を全面的に免れる法的特権である。"
 iberian_culture.16.a: "特権を尊重する。"
 iberian_culture.16.b: "国家の必要は何よりも優先される！"
 iberian_culture.17.title: "シエラの盗賊団"
 iberian_culture.17.desc: "武装した無法者たちが[target_location.GetName]を取り囲む険しい山道を支配下に置いたとの知らせが、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた。彼らは隊商や輸送隊を繰り返し襲撃し、地域全体の交易を著しく妨げている。このまま放置すれば、盗賊行為に加わる者がさらに増えるおそれがある。"
 iberian_culture.17.a: "兵を割く余裕はない。"
 iberian_culture.17.b: "討伐隊を編成して盗賊どもを一掃する。"
 iberian_culture.18.title: "ムデハルの芸術"
 iberian_culture.18.desc: "何世紀にもわたり、[ShowRegionName('iberia_region')]の人々は、アル＝アンダルスの時代に広まった[ShowReligionGroupAdjective('muslim')]の建築様式に魅了されてきた。幾何学模様の装飾や装飾漆喰細工といったムデハル芸術のさまざまな技法を、多くの建築家がロマネスク様式やゴシック様式の建物に取り入れるようになった。最近では、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に仕える[target_artist.GetName]が、王室から依頼される建築にこの様式を取り入れる許可を王に求めている。"
 iberian_culture.18.a: "彼らの仕事を認める。"
 iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]の芸術を王権と結びつけるべきではない。"
 iberian_culture.19.title: "スペインのゴシック建築"
 iberian_culture.19.desc: "[ROOT.GetCountry.GetFlavorRank]各地の建築家たちが、キリスト教世界のほかのどの様式とも異なる建築様式を生み出しはじめている。西方諸国の壮大な大聖堂と、わが国に伝わる堅牢な建築の伝統に着想を得て、彼らは神の栄光と[ROOT.GetCountry.GetName]の偉大さを同時に示す建造物を生み出した。スペインのゴシック建築として知られるようになったこの様式は、わが国が後援すれば、何世紀にもわたって景観にその足跡を残すことになるだろう。"
 iberian_culture.19.a: "石にわが国の栄光を刻め！"
 iberian_culture.19.b: "わが国の資源はほかのことに使うほうがよい。"
 iberian_culture.20.title: "プロト・ルネサンス"
 iberian_culture.20.desc: "[ShowInstitutionNameWithNoTooltip('renaissance')]として知られる新たな芸術思想が、[ShowRegionName('italy_region')]からわが[ROOT.GetCountry.GetFlavorRank]に伝わりはじめている。わが国でも多くの建築家や画家が、この新たな芸術思想を自国の伝統と融合させるようになった。今では、この新たな様式の影響を受けた作品を依頼する者も多い。後押しすれば、この新たな芸術運動が繁栄と革新の時代を切り開くかもしれない。"
 iberian_culture.20.a: "この新たな伝統を受け入れる。"
 iberian_culture.20.b: "古き伝統を守る。"
 iberian_culture.21.title: "新キリスト教徒の改宗"
 iberian_culture.21.desc: "[target_location.GetName]の[ShowReligionAdjective('judaism')]人口のかなりの部分が、自ら進んで[ShowReligionName('catholic')]の洗礼を受けることを決めた。多くの人々は、これらの改宗者を教会の成功の証しとして歓迎しているが、彼らの信仰が本物なのか疑う者もいる。こうした人々は、代々この信仰を奉じてきた家系の者たちと区別するため、改宗者を「新キリスト教徒」と呼んでいる。"
 iberian_culture.21.a: "彼らを信仰の仲間として迎え入れる。"
 iberian_culture.21.b: "さらに多くの者に改宗を強制する。"
 iberian_culture.21.b.tt: "[target_location.GetName]に居住するすべての[ShowReligionAdjective('judaism')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 iberian_culture.22.title: "牛追い祭り"
 iberian_culture.22.desc: "[ShowRegionName('iberia_region')]で最も古い牛追い祭りが行われているとされる[ShowLocationName('cuellar')]の民は、毎年の祭りの資金繰りに苦労している。彼らは[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に資金援助を求め、補助金を出してもらえれば、例年祭りで祀っている守護聖人ロザリオの聖母ではなく[target_ruler.GetName]に祭りを捧げると約束した。"
 iberian_culture.22.a: "手を差し伸べなければ！"
 iberian_culture.22.b: "こんな野蛮な祭りは支援できない！"
 iberian_culture.22.b.tt: "[ShowLocationName('cuellar')]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.23.title: "アルンブラドス派の教団"
 iberian_culture.23.desc: "[ROOT.GetCountry.GetFlavorRank]各地でひそかに信徒を増やしている奇妙な神秘主義者の集団について、不穏な報告が[ROOT.GetCountry.GetGovernment.GetCourtTitle]と教会の上層部に届き始めている。自らを「光に照らされた者達」と称する彼らは、真に信仰深い者は聖霊から直接、神の啓示を受けられると主張し、そのためには司祭も秘跡も巡礼も、さらにミサさえも必要ないという。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の代表者たちは、彼らの教えがプロテスタントの異端説に似ていることを懸念し、調査の開始を求めている。"
 iberian_culture.23.a: "「光に照らされた者達」を弾圧する。"
 iberian_culture.23.b: "噂のすべてに異端が関係しているわけではない。"
 iberian_culture.23.b.tt: "放置すれば、この教団の影響力がさらに広がるおそれがある"
 iberian_culture.24.title: "剝がれる仮面"
 iberian_culture.24.desc: "「光に照らされた者達」をめぐる噂を調べようとしなかったのは、間違いだったようだ。この教団は[target_province.GetName]で大きく勢力を伸ばし、[ShowReligionAdjective('lutheran')]の異端的な教えを信奉していることを公然と認めた。今や[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は、警告を無視し調査の要請にも応じなかったとして、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]を非難している。教会側は、断固たる措置を講じていれば、今回の異端の広がりは防げたはずだと主張している。"
 iberian_culture.24.a: "異論を唱える者すべてを迫害するわけにはいかない。"
 iberian_culture.24.a.tt: "[target_province.GetName]に居住する[ShowReligionAdjective('catholic')][pops|e]の15%が[ShowReligionName('lutheran')]に改宗する"
 iberian_culture.24.a.tt2: "[target_province.GetName]に居住するすべての[ShowReligionAdjective('catholic')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]低下する"
 iberian_culture.24.b: "彼らの言うとおりだった。慎重に行動しなければならない。"
 iberian_culture.24.b.tt: "[target_province.GetName]に居住する[ShowReligionAdjective('catholic')][pops|e]の5%が[ShowReligionName('lutheran')]に改宗する"
 iberian_culture.24.b.tt2: "[target_province.GetName]に居住するすべての[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 iberian_culture.25.title: "[ShowBuildingTypeNameWithNoTooltip('irrigation_systems')]の保全"
 iberian_culture.25.desc: "[ShowReligionGroupAdjective('muslim')]勢力が[ShowAreaName('granada_area')]を支配していた時代には、シエラ・ネバダ山脈から肥沃な渓谷の畑や果樹園へ貴重な水を運ぶ、複雑な[ShowBuildingTypeName('irrigation_systems')]が整備された。この地域をめぐる戦闘によって、地元の人々が生計を立てるうえで長年頼りにしてきたこれらの設備は大きな損害を受けている。"
 iberian_culture.25.a: "再建を支援する。"
 iberian_culture.25.b: "この投資を行う余裕はない。"
 iberian_culture.26.title: "サンティアゴへの道"
 iberian_culture.26.desc: "毎年、何千人もの巡礼者が[ShowLocationName('santiago_compostela')]を目指す長い旅に出る。彼らの往来は数え切れないほどの集落に繁栄をもたらしてきたが、道中の多くの道路や橋が老朽化しており、旅は依然として困難を伴う。[target_location.GetName]の住民たちは、コンポステーラへと続く道路を整備するよう[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]に請願している。道路を整備することで、信仰心を深めるとともに、[ROOT.GetCountry.GetFlavorRank]全土の商業も活性化すると主張している。"
 iberian_culture.26.a: "巡礼者のためなら予算を惜しまない。"
 iberian_culture.26.b: "今はもっとほかに優先すべきことがある。"
 iberian_culture.27.title: "消えゆく伝統"
 iberian_culture.27.desc: "[ShowAreaName('galicia_area')]の吟遊詩人たちは、何世代にもわたり[ShowDialectName('galician_dialect')]という格式ある文学言語で、伝統的なカンティーガを歌い継いできた。その影響は[ShowAreaNameWithNoTooltip('galicia_area')]の境界をはるかに越えて広がっていた。しかし、この言語は[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]で用いられる言語ではないため、この伝統は徐々に廃れつつある。"
 iberian_culture.27.a: "この伝統の保護を支援する。"
 iberian_culture.27.b: "わが国の言語の使用を促進する。"
 iberian_culture.28.title: "漁業組合"
 iberian_culture.28.desc: "[target_location.GetName]の漁師たちは、ギルドを結成して「漁業組合」と名付けた。その目的は、漁業の規制、海に関する知識の継承、そして荒波に挑む者たちの利益を守ることだとされている。また、困難な時期には組合員やその家族を援助し、地域社会の支えとして、人々が苦境を乗り越えられるようにしている。"
 iberian_culture.28.a: "ギルドを強化する。"
 iberian_culture.28.b: "海軍には彼らの専門知識が必要だ。"
 iberian_culture.29.title: "繁栄するヴァレンシアの[ShowGoodsNameWithNoTooltip('silk')]"
 iberian_culture.29.desc: "[ShowLocationName('valencia')]の織工たちは、上質な[ShowGoodsName('silk')]織物で名声を得ており、その製品は[ShowContinentName('europe')]各地で高く評価されている。この盛んな産業が生み出す富は、商人たちと[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の双方を潤しているが、その富をどのように使うべきかについては、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の意見が分かれている。"
 iberian_culture.29.a: "地元の産業に投資する。"
 iberian_culture.29.b: "これらの富は[ROOT.GetCountry.GetFlavorRank]のために使われるべきだ。"
 iberian_culture.30.title: "リオハのブドウ畑"
 iberian_culture.30.desc: "エブロ川沿いの肥沃な渓谷では、何世代にもわたってリオハのブドウ畑が栄えてきた。この地では非常に高品質なワインが生産されており、それがわが国の[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の関心を引いている。彼らはいまや、[ROOT.GetCountry.GetFlavorRank]全土にブドウ畑を拡大し、一大産業を築く好機と捉えている。しかし、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]は、これによって何世紀にもわたってワイン造りを支えてきた地域の慣習が損なわれるおそれがあるとして反対している。"
 iberian_culture.30.a: "ブドウ畑を広げる。"
 iberian_culture.30.b: "ワイン造りの伝統を守る。"
