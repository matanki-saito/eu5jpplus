l_japanese:
 italian_renaissance_culture.1.title: "$FLO_ADJ$の[ShowGoodsNameWithNoTooltip('wool')]への挑戦"
 italian_renaissance_culture.1.desc: "[ShowLocationName('florence')]の交易ギルドは、長らく[ShowRegionName('italy_region')]における[ShowGoodsName('wool')]交易の主導権を握ってきたが、近年の[ROOT.GetCountry.GetAdjective]の[ShowGoodsNameWithNoTooltip('wool')]生産の拡大により、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]のあいだでは、[ROOT.GetCountry.GetNameWithNoTooltip]なら、市場を独占する$FLO_ADJ$の商人たちに対抗できるのではないかという自信が高まっている。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]が十分な資金支援をおこなうのであれば、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の一部は、拡大を続ける[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の[ShowGoodsNameWithNoTooltip('wool')]産業を強化するため、新たな交易ギルドを設立すると申し出ている。しかし、宮廷内のほかの者たちは、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]が[ShowGoodsNameWithNoTooltip('wool')]生産の自治権を維持することを支持している。"
 italian_renaissance_culture.1.a: "[ShowGoodsNameWithNoTooltip('wool')]ギルドの設立を[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]に委ねる。"
 italian_renaissance_culture.1.b: "[ShowGoodsNameWithNoTooltip('wool')]生産における[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の自治権を維持する。"
 ita_culture_rival_wool_guild_locations.tt: "わが国が[ShowRegionName('italy_region')]に所有するすべての[ShowGoodsNameWithNoTooltip('wool')]産地の[locations|e]は、「[ShowModifier('italian_culture_rival_wool_trade')]」を60年間獲得し、まだ最大レベルでない場合は#G +1.00#!拡張される"
 italian_renaissance_culture.2.title: "地方の人口減少"
 italian_renaissance_culture.2.desc: "[ShowSituationName('black_death')]がわが国を襲って以来、[ROOT.GetCountry.GetName]の多くの農村部は過疎化に見舞われている。[target_location.GetName]も[ShowSituationNameWithNoTooltip('black_death')]による甚大な影響を受けたが、生き残ったわが国の民の多くは、疫病のせいで手に入らなくなった重要な資源を再び手に入れられるのではと期待し、その地への移住を望んでいる。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者は、これを[target_location.GetNameWithNoTooltip]のさらなる都市化と再建の好機と見ているが、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]が[ROOT.GetCountry.GetNameWithNoTooltip]全土の主要な農村部を放棄することを許せば、深刻な事態を招く可能性がある。"
 italian_renaissance_culture.2.a: "[target_location.GetNameWithNoTooltip]への移住をさらに奨励する。"
 italian_renaissance_culture.2.b: "移住を遅らせるため、地方へ援助を分散させる。"
 italian_renaissance_culture.3.title: "古代[ShowCultureNameWithNoTooltip('greek_culture')]思想の再発見"
 italian_renaissance_culture.3.desc: "[ShowAgeName('age_2_renaissance')]の理想が[ShowRegionName('italy_region')]全域に伝播して以来、[ShowCultureGroupName('italian_group')]の学者のあいだでは、古代[ShowCultureName('greek_culture')]文学の収集や翻訳への関心が高まっている。を[ShowRegionNameWithNoTooltip('italy_region')]における[ROOT.GetCountry.GetNameWithNoTooltip]の地位を押し上げるすべく、宮廷の多くの顧問たちは[target_character.GetName]に対し、これら古代の著作の復興を支援するよう促している。"
 italian_renaissance_culture.3.a: "これらの芸術の再発見を奨励せよ！"
 italian_renaissance_culture.3.b: "国家による全面的な後援を申し出よ。"
 italian_renaissance_culture.3.c: "わが国の伝統を堅持せよ。"
 encourage_humanist_thought_for_rewards_tt: "[ShowSocietyDirectionName('humanist')]への転換を促すことで、[ROOT.GetCountry.GetCapital.GetName]が[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想の中心地となる機会がさらに開かれる"
 italian_renaissance_culture.4.title: "人文主義の中心地、[target_location.GetNameWithNoTooltip]"
 italian_renaissance_culture.4.desc: "[ShowAgeName('age_2_renaissance')]の理想が[ShowRegionName('italy_region')]全域を席巻して以来、$BYZ_ADJ$の記録から得られたさまざまな写本をもとに翻訳された古代[ShowCultureName('greek_culture')]文学が再発見されてきた。これら古代文献の再発見は[ShowRegionNameWithNoTooltip('italy_region')]全域の多くの哲学者に劇的な転換をもたらし、その結果[ShowSocietyDirectionName('humanist')]の新たな切り口が生まれることとなった。これらの取り組みが[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]によって大いに支援されたことで、[target_location.GetName]は[ShowRegionNameWithNoTooltip('italy_region')]全域における[ShowSocietyDirectionName('humanist')]研究の中心地のひとつへと変貌を遂げ、多くの学者がその[target_location.GetRank.GetName]に居を構えるようになった。[ShowAgeName('age_2_renaissance')]の理想が伝播しつづけるなか、[target_location.GetNameWithNoTooltip]がその推進力として極めて重要な存在でありつづけることは間違いない。"
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip]は[ShowRegionNameWithNoTooltip('italy_region')]における[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想の灯台となるだろう。"
 italian_renaissance_culture.4.b: "[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想の急速な拡大を抑制せよ。"
 italian_renaissance_culture.5.title: "新進気鋭の芸術家が[ROOT.GetCountry.GetGovernment.GetCourtTitle]を魅了"
 italian_renaissance_culture.5.desc: "[ShowAgeName('age_2_renaissance')]の到来により、[ShowRegionName('italy_region')]全域で傑出した新進芸術家が輩出されるなか、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者が、[ROOT.GetCountry.GetCapital.GetName]で大きな注目を集めている[target_artist.GetName]に目をつけた。[target_character.GetName]の側近顧問たちは、いずれ[target_artist.GetHeShe]が[ShowRegionNameWithNoTooltip('italy_region')]全域でも屈指の力量のある芸術家に成長する可能性があるとして、[target_artist.GetNameWithNoTooltip]を後援するよう促している。"
 italian_renaissance_culture.5.a: "[target_artist.GetHimHer]を[ROOT.GetCountry.GetGovernment.GetCourtTitle]に雇い入れよう！"
 italian_renaissance_culture.5.b: "[target_artist.GetHisHer]の力を借りる必要はない。"
 italian_renaissance_culture.6.title: "[target_location.GetNameWithNoTooltip]からの[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想の広まり"
 italian_renaissance_culture.6.desc: "[target_location.GetNameWithNoTooltip]の高名な学者たちが、[ShowSocietyDirectionName('humanist')]思想を掲げ、新訳された古代[ShowCultureName('greek_culture')]文学を地元住民に広めるため[ROOT.GetCountry.GetCapital.GetName]に定住した。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者はその翻訳された文献に関心を示しているが、ほかの者たちは不安定化を招く危険性があるとして、[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想を封じ込めるよう促している。"
 italian_renaissance_culture.6.a: "学者たちが翻訳された文学を広めることを許可する。"
 italian_renaissance_culture.6.b: "翻訳された文学の流通を制限する。"
 italian_renaissance_culture.7.title: "新しい芸術への後援"
 italian_renaissance_culture.7.desc: "[ShowSituationName('black_death')]の流行後、多くの[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]にとって交易を取り巻く環境は厳しくなっていた。長距離の物資輸送が困難になったうえに、必需品の需要も増加したのだ。しかし、[ShowAgeName('age_2_renaissance')]の伝播により、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]の多くの者が交易だけに専念するのではなく、新たな芸術を後援するようになった。\n\n芸術への後援が[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]にとって有益な投資であることがわかったため、一部からは、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に対しこれらの新しい芸術の発展をさらに支援するよう求める声が上がっている。"
 italian_renaissance_culture.7.a: "新しい芸術の発展を後援する。"
 italian_renaissance_culture.7.b: "代わりに、その収入を国庫に割り当てる。"
 italian_renaissance_culture.8.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]の著名なコンドッティエーリ"
 italian_renaissance_culture.8.desc: "高名なコンドッティエーリである[target_character_2.GetNameWithNoTooltip]が[ROOT.GetCountry.GetCapital.GetName]に到着したとの報せが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた。軍で数々の勝利を収めてきた[target_character_2.GetNameWithNoTooltip]の到着を受け、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内では[target_character_2.GetHeShe]が[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]に滞在しているあいだに雇い入れるべきではないかと議論が交わされている。というのも、[ROOT.GetCountry.GetName]に紛争が及んだ場合、[target_character_2.GetHisHer]の戦闘技術が極めて重要な役割を果たす可能性があるためである。"
 italian_renaissance_culture.8.a: "[ROOT.GetCountry.GetNameWithNoTooltip]の安全を確保するため、[target_character_2.GetNameWithNoTooltip]を雇用せよ。"
 italian_renaissance_culture.8.b: "わが国に[target_character_2.GetHisHer]の軍事知識は必要ない。"
 italian_renaissance_culture.9.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の影響力拡大がコンドッティエーリを誘引"
 italian_renaissance_culture.9.desc: "[ShowRegionName('italy_region')]における[ROOT.GetCountry.GetAdjective]の影響力の拡大に伴い、多くのコンドッティエーリが雇用を期待して[ROOT.GetCountry.GetGovernment.GetCourtTitle]に接触してきている。[ROOT.GetCountry.GetNameWithNoTooltip]の勢力拡大によって軍の編成費用が跳ね上がっていることから、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者は彼らの雇用に賛成しているが、ほかの者たちは、これらのコンドッティエーリが利己心だけで行動しており、自らの兵力へ過度に依存させ、国にとってなくてはならない存在に収まろうとしているのではないかと懸念している。"
 italian_renaissance_culture.9.a: "これらコンドッティエーリの傭兵たちに取り入り、雇い入れよう。"
 italian_renaissance_culture.9.b: "これらの傭兵団に借りを作る危険は冒せない。"
 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip]が給金の増額を要求"
 italian_renaissance_culture.10.desc: "有力なコンドッティエーリである[condottieri_company.GetName]は、国家が彼らの才能に対して十分な報酬を与えていないとの考えから、[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]に対し、報酬の増額を正式に要求してきた。\n\n[condottieri_company.GetNameWithNoTooltip]が[ROOT.GetCountry.GetNameWithNoTooltip]との契約をいきなり破る可能性は低いものの、彼らの要求を拒否すれば、あの傭兵団を戦力として信頼できなくなるかもしれない。"
 italian_renaissance_culture.10.a: "[condottieri_company.GetNameWithNoTooltip]の要求を受け入れる。"
 italian_renaissance_culture.10.b: "[condottieri_company.GetNameWithNoTooltip]への追加の支払いを拒否する。"
 italian_renaissance_culture.11.title: "$FLO_ADJ$文化の広まり"
 italian_renaissance_culture.11.desc: "[ROOT.GetCountry.GetCapital.GetName]は影響力のある[ROOT.GetCountry.GetCapital.GetRank.GetName]であるが、[ShowRegionNameWithNoTooltip('italy_region')]において群を抜く[ShowLocationRankName('city')]へと成長し、その名を轟かせる[ShowLocationName('florence')]の足元にも及ばないのは周知の事実である。\n\n[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]の威信を高めるため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部の者は、[ShowLocationNameWithNoTooltip('florence')]における新しい文化の要素を取り入れることを提案している。"
 italian_renaissance_culture.11.a: "$FLO_ADJ$文化の要素を取り入れる。"
 italian_renaissance_culture.11.b: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]独自の文化を堅持する。"
 italian_renaissance_culture.12.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の救済"
 italian_renaissance_culture.12.desc: "[ROOT.GetCountry.GetName]内のすべての社会階級が[ShowSituationName('black_death')]の影響を受けたが、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]ほど壊滅的な打撃を受けた階級はなかった。その後数年のあいだに、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くの者が[ShowAgeName('age_2_renaissance')]芸術への投資に乗り出し、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の上流階級たちの文化的再生をもたらしたが、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の多くは[ShowSituationNameWithNoTooltip('black_death')]の影響から依然として立ち直れずにいる。\n\n深刻な影響を受けた[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]を支援するため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の同情的な声は、芸術への後援を大幅に削減し、復興支援に資金を振り向けることを提案している。"
 italian_renaissance_culture.12.a: "わが国の芸術への後援は滞りなく継続される。"
 italian_renaissance_culture.12.b: "弱体化した[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]を援助するために資金を振り向ける。"
 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip]が古代[ShowCultureNameWithNoTooltip('greek_culture')]の写本を翻訳"
 italian_renaissance_culture.13.desc: "[target_artist.GetName]による古代[ShowCultureName('greek_culture')]の写本の翻訳が完成し、[ROOT.GetCountry.GetName]全土の学者の注目を集めており、多くの者がその翻訳された著作を手に入れようと熱望している。そうしたなか、これを[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の威信を高める好機と捉え、[target_character.GetName]に対し、翻訳された写本を[ShowContinentName('europe')]全土に広めるよう働きかける者が出てきた。"
 italian_renaissance_culture.13.a: "翻訳に取り組んだ[target_artist.GetNameWithNoTooltip]の功績を称えよう！"
 italian_renaissance_culture.13.b: "[target_artist.GetHisHer]の作品を広く知らしめよ！"
 italian_renaissance_culture.13.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の外には出さないでおこう。"
 italian_renaissance_culture.14.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]に感銘を与えた[target_artist.GetNameWithNoTooltip]の才能"
 italian_renaissance_culture.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の後援を得て以来、[target_artist.GetName]は[target_character.GetName]にとって貴重な存在であることを証明しており、[target_artist.GetHisHer]の才能は上層部から称賛を集めている。高位の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]から、影響力のある[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]に至るまで、[target_artist.GetNameWithNoTooltip]は広く認められており、[target_character.GetNameWithNoTooltip]の影響力にとって大きな追い風となっている。"
 italian_renaissance_culture.14.a: "[target_artist.GetHisHer|U]の作品は[ROOT.GetCountry.GetGovernment.GetCourtTitle]を大いに豊かにした！"
 italian_renaissance_culture.15.title: "名声高まる[ShowArtistTypeName('architect')]"
 italian_renaissance_culture.15.desc: "[ROOT.GetCountry.GetCapital.GetName]ですでにいくつかの建築事業を完了させた[target_artist.GetName]は、[ROOT.GetCountry.GetName]全土でその名声を高めており、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くの有力一族からすでに後援を集めている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者は、[target_artist.GetHeShe]を起用すべきであるとの見解を示している。古典建築技法を活用する[target_artist.GetHeShe]が、[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]の建築的再生を推し進める重要な起爆剤になりうると考えられているからだ。"
 italian_renaissance_culture.15.a: "[target_artist.GetHimHer]に国家からの後援を申し出よう。"
 italian_renaissance_culture.15.b: "建築事業の推進に興味はない。"
 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]へ追加支援を要請"
 italian_renaissance_culture.16.desc: "古典芸術に着想を得た作品の制作の途中、[target_artist.GetName]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]に対し、追加支援の提供を要請した。この作品が予想以上に大規模になっていることを述べた上で、[target_artist.GetHeShe]は、自らの事業への追加資金は費用以上の価値があるのだと語り、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に必ずや文化的名声をもたらすと約束している。"
 italian_renaissance_culture.16.a: "[target_artist.GetHeShe]が必要とする追加支援を提供せよ。"
 italian_renaissance_culture.16.b: "そんな余裕はない。"
 italian_renaissance_culture.17.title: "[target_rival.GetNameWithNoTooltip]で不満を抱く[target_rival_artist.GetArtistType.GetNameWithNoTooltip]"
 italian_renaissance_culture.17.desc: "[target_rival_artist.GetName]はわが国の対立国である[target_rival.GetName]に雇われているが、[target_rival_artist.GetHisHer]の作品は[ShowRegionName('italy_region')]全域で名声を得ている。しかし最近、[target_rival_artist.GetHeShe]が[target_rival.GetNameWithNoTooltip]の後援に不満を抱いているという噂が広まっている。\n\n[target_rival.GetNameWithNoTooltip]の影響力を弱めると同時に、名高い[target_rival_artist.GetArtistType.GetName]の協力を確保する好機と見て、[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一部の者は、[target_rival_artist.GetNameWithNoTooltip]と秘密裏に合意を取りつけ、[target_rival_artist.GetHeShe]をわが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]に引き込むよう促している。"
 italian_renaissance_culture.17.a: "速やかに[target_rival_artist.GetNameWithNoTooltip]を雇用せよ！"
 italian_renaissance_culture.17.b: "[target_rival.GetNameWithNoTooltip]とつながりのある芸術家を雇うことなどできない。"
 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip]と油絵の技法"
 italian_renaissance_culture.18.desc: "$FLA_ADJ$の芸術家たちは独自の油絵を生み出してきたが、この技法に関する知識は長らく低地諸国に限定されていた。しかし、[target_artist.GetName]は近年、[ShowCultureGroupName('italian_group')]独自の油絵の伝統を築くことを目指して、低地諸国から[ROOT.GetCountry.GetCapital.GetName]へと帰還した。\n\n[ShowRegionName('italy_region')]でこの伝統を築こうとする[target_artist.GetHimHer]を支援することに関心をもった[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]内の多くの者が、[target_character.GetName]に[target_artist.GetHimHer]への後援を強く求めている。"
 italian_renaissance_culture.18.a: "[target_artist.GetHisHer|U]独自の芸術様式は後援に値する！"
 italian_renaissance_culture.18.b: "[target_artist.GetHisHer]の絵画様式には興味がない。"
 italian_renaissance_culture.19.title: "[ShowLocationNameWithNoTooltip('florence')]の[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.19.desc: "自身の作品で[ShowLocationName('florence')]にて地域的な評価を得た[target_artist.GetName]が[ROOT.GetCountry.GetCapital.GetName]に到着し、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の者たちからの依頼をいくつか引き受けている。しかし、[target_artist.GetHisHer]の[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]滞在は、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の注目を集めた。彼らは[target_artist.GetHisHer]の作品に強い関心を示し、[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]での滞在を延長させるため、[target_artist.GetHimHer]に作品制作を依頼するよう[ROOT.GetCountry.GetGovernment.GetCourtTitle]に求めている。\n\nとはいえ、[ShowLocationNameWithNoTooltip('florence')]出身の著名な[ShowArtistTypeName('philosopher')]である[target_artist.GetNameWithNoTooltip]は、[ROOT.GetCountry.GetGovernment.GetCourtTitle]が通常提供する以上の支援を期待するだろう。"
 italian_renaissance_culture.19.a: "高くつくが、[target_artist.GetHisHer]の経験は歓迎されるだろう。"
 italian_renaissance_culture.19.b: "[target_artist.GetShortNameWithNoTooltip]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]にとって金がかかりすぎる。"
 italian_renaissance_culture.20.title: "[target_country.GetLongNameWithNoTooltip]からの[target_artist.GetNameWithNoTooltip]への要請"
 italian_renaissance_culture.20.desc: "[target_artist.GetName]の名声が[ShowRegionName('italy_region')]を越えて広まるなか、[target_country.GetLongName]の[target_country.GetGovernment.GetCourtTitle]は、[target_artist.GetNameWithNoTooltip]の協力を確保するべく[ROOT.GetCountry.GetName]に接触した。[target_artist.GetNameWithNoTooltip]の作品の評判に感銘を受けた[target_country.GetAdjectiveWithNoTooltip][target_country.GetGovernment.GetCourtTitle]は、[ROOT.GetCountry.GetNameWithNoTooltip]が[target_artist.GetNameWithNoTooltip]の[target_country.GetNameWithNoTooltip]への居住を許可するならば、多額の報酬を支払う用意がある。"
 italian_renaissance_culture.20.a: "[target_artist.GetShortNameWithNoTooltip]と引き換えに、[target_country.GetAdjectiveWithNoTooltip]の金を受け入れる。"
 italian_renaissance_culture.20.b: "わが国は[target_artist.GetShortNameWithNoTooltip]の唯一の後援者でありつづける。"
 italian_renaissance_culture.21.title: "[ShowAgeNameWithNoTooltip('age_2_renaissance')]芸術への巨額な後援費用"
 italian_renaissance_culture.21.desc: "[ROOT.GetCountry.GetName]は[ShowAgeName('age_2_renaissance')]の新芸術に対して多大な支援を提供してきたが、時が経ち、この後援は国家に有害であることが判明した。対策を講じないかぎり、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の国庫は財政危機に陥るおそれがあるのだ。しかし依然として[ROOT.GetCountry.GetGovernment.GetCourtTitle]内には、後援を継続すれば長期的には報われると信じている者がいる。"
 italian_renaissance_culture.21.a: "国庫を維持するため、芸術への後援を削減せよ。"
 italian_renaissance_culture.21.b: "芸術への後援は継続しなければならない！"
 italian_renaissance_culture.22.title: "[ShowAgeNameWithNoTooltip('age_2_renaissance')]の芸術と文化の中心地、[target_location.GetNameWithNoTooltip]"
 italian_renaissance_culture.22.desc: "[ROOT.GetCountry.GetLongName]にとって多大な財政的負担となっていることは事実だが、[target_location.GetName]は[ShowRegionName('italy_region')]、ひいては[ShowContinentName('europe')]全土における[ShowAgeName('age_2_renaissance')]芸術の中心地のひとつへと成長した。[ShowContinentNameWithNoTooltip('europe')]全土の著名な芸術家や学者たちは、この[target_location.GetRank.GetName]を訪れることを熱望しており、[target_location.GetNameWithNoTooltip]がこの時代に遂げた変貌の様を多くの者が語り広めている。"
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip]は今後数世紀にわたり、芸術と文化の中心地として輝きつづけるだろう！"
 italian_renaissance_culture.22.b: "[target_location.GetNameWithNoTooltip]の新たな名声を活かし、わが国の威信を高めよう。"
 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
 italian_renaissance_culture.23.desc: "[ShowAgeName('age_2_renaissance')]を代表する人物のひとりである[target_artist.GetName]が、またしても見事な作品を完成させた。『[ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]』と題されたその作品は、聖書や古典時代の多くの著名人だけでなく、過去1世紀の主要な人物たちも数多く取り上げている。実に見事な伝記集であり、もし[ROOT.GetCountry.GetGovernment.GetCourtTitle]がこれを手放すことを望めば、[target_artist.GetLastNameWithNoTooltip]の作品はおそらく莫大な金額で取引されるだろう。"
 italian_renaissance_culture.23.a: "歴史的人物の見事な伝記集だ。"
 italian_renaissance_culture.23.b: "[target_artist.GetHisHer]の作品を高値で[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]に売り込もう。"
 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
 italian_renaissance_culture.24.desc: "[ShowSituationName('black_death')]の惨状を目の当たりにした[target_artist.GetName]は触発されて『[ShowWorkOfArtName('boccaccio_the_decameron')]』を完成させ、[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]から大きな関心を集めている。[ShowLocationName('florence')]を舞台にしたこの物語は、疫病から逃れるために田舎へと避難する$FLO_ADJ$の男女10人を描いている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、[target_artist.GetLastNameWithNoTooltip]の作品を広く世に普及させる努力をすべきだと考えている者もいる。"
 italian_renaissance_culture.24.a: "魅力的な物語の数々！ [target_artist.GetHisHer]の作品を普及させるべきだ。"
 italian_renaissance_culture.24.b: "この作品の所有権を[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]に提供しよう。"
 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
 italian_renaissance_culture.25.desc: "[target_artist.GetName]は、過去の著作である『[ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]』と同様に、歴史上の著名な人物を題材にした新たな著作を発表した。ただし今回は高名な女性に焦点を当てている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の多くの者は、[target_artist.GetLastNameWithNoTooltip]がこうした人物に関心を示したことに驚いているが、[target_artist.GetHisHer]の過去の多くの作品と同じく、『[ShowWorkOfArtName('boccaccio_concerning_famous_women')]』もわが国の財政が逼迫した場合には間違いなく貴重な資産となるだろう。"
 italian_renaissance_culture.25.a: "貴重な作品として[ROOT.GetCountry.GetGovernment.GetCourtTitle]内に留めておく。"
 italian_renaissance_culture.25.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]で競売を開催し、この[ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]を売却する。"
 italian_renaissance_culture.26.title: "[target_character_2.GetNameWithNoTooltip]の台頭"
 italian_renaissance_culture.26.desc: "長きにわたり[ShowLocationName('florence')]で重きをなしてきた[target_character_2.GetName]は、有能な人物であると同時に、[ShowAgeName('age_2_renaissance')]の[ShowSocietyDirectionName('humanist')]思想の普及者でもあることが明らかとなった。[target_character_2.GetNameWithNoTooltip]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]の構成員から称賛と高い評価を集めるなか、一部からは[target_character.GetName]に対し、[target_character_2.GetNameWithNoTooltip]に[ROOT.GetCountry.GetGovernment.GetCabinetTitle]での特別な地位を与えるよう提案する声も上がっている。"
 italian_renaissance_culture.26.a: "[target_character_2.GetHimHer]に[ROOT.GetCountry.GetGovernment.GetCourtTitle]での役割を与えよう。"
 italian_renaissance_culture.26.b: "[target_character_2.GetHeShe]は[ROOT.GetCountry.GetGovernment.GetCabinetTitle]の優秀な[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]になるだろう。"
 italian_renaissance_culture.26.c: "[target_character_2.GetHimHer]にはいかなる特権も与えるな。"
 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.27.desc: "[target_artist.GetHeShe]はここ数年にわたり[ShowRegionName('italy_region')]全域で高い評価を得てきたが、最近になって[target_artist.GetName]が[ROOT.GetCountry.GetCapital.GetName]に居むようになったことは、[ROOT.GetCountry.GetCapital.GetRank.GetName]全域で称賛を集めており、富裕層の多くが[target_artist.GetHisHer]独自の世俗的教育方針を受け入れている。一部の[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]が[target_artist.GetHisHer]の教育手法に不快感を示している一方で、ほかの者たちは[target_character.GetName]に対し、[target_artist.GetNameWithNoTooltip]に[ROOT.GetCountry.GetName]での完全な居住権を与えるよう強く求めている。"
 italian_renaissance_culture.27.a: "[target_artist.GetHimHer]を雇おう！"
 italian_renaissance_culture.27.b: "[target_artist.GetHisHer|U]の思想は過激すぎる。"
 italian_renaissance_culture.28.title: "カーサ・ジョイオーザの設立"
 italian_renaissance_culture.28.desc: "[ROOT.GetCountry.GetName]での完全な居住権を認められて以来、[target_artist.GetName]は[target_location.GetName]内の多くの人々に自らの教えを広めてきた。[target_location.GetNameWithNoTooltip]において名声と影響力を得た[target_artist.GetNameWithNoTooltip]は現在、新しい学校であるカーサ・ジョイオーザを設立するため、[ROOT.GetCountry.GetGovernment.GetCourtTitle]に財政的支援を求めている。\n\n多額の費用がかかる事業ではあるものの、[target_location.GetNameWithNoTooltip]に新たな[ShowBuildingTypeNameWithNoTooltip('art_school')]が設立されれば、[ShowRegionName('italy_region')]全土で[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の威信が高まるだろう。"
 italian_renaissance_culture.28.a: "[ShowBuildingTypeNameWithNoTooltip('art_school')]の設立を命じる！"
 italian_renaissance_culture.28.b: "代わりに、カーサ・ジョイオーザを新しい[ShowBuildingTypeNameWithNoTooltip('university')]として設立するよう提言する。"
 italian_renaissance_culture.28.c: "この事業のための資金はない。"
 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.29.desc: "[target_artist_2.GetName]の高名な弟子である[target_artist.GetName]は、[ShowRegionName('italy_region')]屈指の学者のひとりとして名声を確立しており、特に古代[ShowCultureName('greek_culture')]の写本の翻訳に長けている。その[target_artist.GetNameWithNoTooltip]が[ROOT.GetCountry.GetCapital.GetName]に到着し、[target_artist.GetSheHe]は近年発見された[ShowCultureNameWithNoTooltip('greek_culture')]の写本に関する研究を継続するため、[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]からの援助の獲得に強い関心を示している。"
 italian_renaissance_culture.29.a: "[target_artist.GetHimHer]を雇おう！"
 italian_renaissance_culture.29.b: "[target_artist.GetHisHer]の研究を後援するつもりはない！"
 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.30.desc: "[ShowRegionName('italy_region')]における油絵の普及はいまだ初期段階にあるものの、[ShowArtistTypeName('painter')]である[target_artist.GetName]はとりわけ熟達した実践者のひとりであることが証明されており、[target_artist.GetHisHer]の絵画の多くはすでにさまざまな[ShowCultureGroupName('italian_group')]の宮廷で珍重されている。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]や[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]の多くは、[target_artist.GetHisHer]の独特な絵画で[ROOT.GetCountry.GetGovernment.GetCourtTitle]を飾るために後援を提供するよう、[target_character.GetName]に強く働きかけている。"
 italian_renaissance_culture.30.a: "[target_artist.GetHisHer]の絵画は[ROOT.GetCountry.GetGovernment.GetCourtTitle]の威信を高めるだろう。"
 italian_renaissance_culture.30.b: "[target_artist.GetHimHer]を後援する余裕はない。"
