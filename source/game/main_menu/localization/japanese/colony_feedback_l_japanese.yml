l_japanese:
 ####################################################
 # M1 Forecast Row
 ####################################################
 COLONY_FORECAST_ETA_LINE: "#T 入植待ち#! 次の入植まで約$MONTHS|v0$ヵ月。\nこの予測は、現在のこの植民地への[migration|e]者の流入状況に基づく。移住者の流入が増減すると、予測も変化する。"
 COLONY_FORECAST_ETA_LINE_SHORT: "～$MONTHS|v0$ヵ月"
 COLONY_FORECAST_ETA_UNKNOWN: "#T 入植待ち#!\nこの植民地には、まだ[migration|e]者の流入元がない。入植者が到着しはじめると、予測が表示される。"
 COLONY_FORECAST_ETA_UNKNOWN_SHORT: "入植待ち"
 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants! 入植者の供給源が枯渇"
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T 鈍化：入植者の供給源が枯渇#!\n入植者の供給源が尽きた。この植民地に[ShowPopTypeName('peasants')]を送り出していたロケーションで、移住に回せる余剰人口が尽きてしまったため、新たな供給源が見つかるまで、[migration|e]は低調な状態が続く"
 BOTTLENECK_GOODS: "@warning_icon! @goods! 物資不足"
 BOTTLENECK_GOODS_TT: "#T 鈍化：物資不足#!\n植民地では必要な物資が不足している。[goods|e]の供給量が必要量の75%を下回っているため、受け入れ可能な新たな入植者の数が減少する。"
 BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence! 海洋プレゼンス不足"
 BOTTLENECK_MARITIME_TT: "#T 鈍化：海洋プレゼンス不足#!\n入植者がこの植民地へ到達するには海を渡る必要があるが、この地域におけるわが国の[maritime_presence|e]が不足しているため、十分な速さで輸送できない"
 BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration! 移住の低迷"
 BOTTLENECK_LOW_MIGRATION_TT: "#T 鈍化：移住の低迷#!\n植民地へ移ろうとする者がわずかで、[migration|e]者をわずかしか確保できないため、入植者の流入が滞っている"
 ####################################################
 # M2 Milestone Messages
 ####################################################
 COLONIAL_CHARTER_FIRST_FLIP_SETUP: "植民地州で、わが国の入植者が初めてロケーションに入植したとき。"
 COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_TITLE: "$LOCATION$での最初の入植"
 COLONIAL_CHARTER_FIRST_FLIP_DESC: "$PROVINCE$にいるわが国の入植者たちは、$LOCATION$に新たな足がかりを築いた。これにより、[colonial_charter|e]「$CHARTER$」の領域が初めてわが国の支配下に入った。"
 COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "ここを足がかりに、残る地へも入植を広げねば。"
 COLONIAL_CHARTER_FIRST_FLIP_LOG: "$CHARTER$の最初の入植：$LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_BTN1: "進め！"
 COLONIAL_CHARTER_FIRST_FLIP_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_MAP: ""
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "他国の植民地州で、初めてロケーションに入植がおこわれたとき。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "$LOCATION$での最初の入植"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "$COUNTRY$は、$PROVINCE$の$LOCATION$に新たな足がかりを築いた。これにより、[colonial_charter|e]「$CHARTER$」の領域が初めて同国の支配下に入った。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "ここを足がかりに、残る地へも入植を広げねば。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "$COUNTRY$による$CHARTER$の最初の入植：$LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "なるほど。"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""
 COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "認可植民地で入植者の供給源となる農民が尽き、新たな供給源が選ばれたとき。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "$CHARTER$への入植者の供給源が枯渇"
 COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "$PROVINCE$の[colonial_charter|e]「$CHARTER$」へ入植者を送り出していた供給源では、入植者として送り出せる[ShowPopTypeName('peasants')]が尽きてしまった。新たな供給源が選ばれたが、しばらくは入植の進みが遅くなる可能性がある。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "どれほど深い井戸も、いつかは枯れる。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "$CHARTER$への入植者の供給源が枯渇"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "残念だ。"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "OK"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""
 COLONIAL_CHARTER_HALFWAY_SETUP: "認可植民地の進行度が50%を超えたとき。"
 COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_TITLE: "$PROVINCE$の植民地化が半ばまで進展"
 COLONIAL_CHARTER_HALFWAY_DESC: "[colonial_charter|e]「$CHARTER$」のもとで進めている$PROVINCE$の植民地化は半ばまで進んだ。"
 COLONIAL_CHARTER_HALFWAY_FLAVOR: "ここから先はこれまで以上に厳しい。だがここまで来た以上、もう引き返すわけにはいかない。"
 COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$が半ばまで進展"
 COLONIAL_CHARTER_HALFWAY_BTN1: "このまま進もう。"
 COLONIAL_CHARTER_HALFWAY_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_MAP: ""
 COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "他国の認可植民地の進行度が50%を超えたとき。"
 COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "$PROVINCE$の植民地化が半ばまで進展"
 COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "[colonial_charter|e]「$CHARTER$」のもとで進めている、$COUNTRY$による$PROVINCE$の植民地化は半ばまで進んだ。"
 COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "この先は、これまで以上に厳しい。"
 COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$が半ばまで進展（$COUNTRY$）"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "なるほど。"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""
 ####################################################
 # M3 Self-Sustaining Pill
 ####################################################
 COLONY_PILL_SELF_SUSTAINING: "#G 自立運営#!"
 COLONY_PILL_OPERATING_AT_LOSS: "#R 赤字運営#!"
 COLONY_SELF_SUSTAINING_HEADER: "自立運営"
 COLONY_OPERATING_AT_LOSS_HEADER: "赤字運営"
 COLONY_SELF_SUSTAINING_INCOME: "月間収入：$VAL|+=$@gold!"
 COLONY_SELF_SUSTAINING_EXPENSE: "月間支出：#R -$VAL|2$@gold!#!"
 COLONY_SELF_SUSTAINING_RESULT: "この植民地は、月間収支（$BALANCE|+=2$@gold!）が基準額（#TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!）以上であるため、自立運営の状態にある。"
 COLONY_OPERATING_AT_LOSS_RESULT: "この植民地は、月間収支（$BALANCE|+=2$@gold!）が基準額（#TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!）を下回っているため、赤字運営の状態にある。"
 COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "月間支出 × 余裕係数：$EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
 ####################################################
 # M4/M5/M6 Helpful Actions Hints
 ####################################################
 COLONY_HELPFUL_ACTIONS_TITLE: "有用な[cabinet_actions|e]"
 COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "認可植民地の進行度を早める[cabinet_actions|e]は、主に次の3つです：\n - 移住の奨励\n - 人々を認可植民地に送る\n - 開拓地に入植\n\n#weak クリックすると、これらのアクションへ直接移動できます。#!"
 COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "新たに植民したロケーションの発展を促す[cabinet_actions|e]は、主に次の3つです：\n - 支配を強化\n - 州の開発\n - 移住の奨励\n\n#weak クリックすると、これらのアクションへ直接移動できます。#!"
 COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "植民地国家の成長を促す[cabinet_actions|e]は、主に次の2つです：\n - 人々を植民地に送る\n - 州の開発\n\n#weak クリックすると、これらのアクションへ直接移動できます。#!"
