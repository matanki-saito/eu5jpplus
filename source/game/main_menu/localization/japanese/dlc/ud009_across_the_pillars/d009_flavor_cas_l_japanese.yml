l_japanese:
 flavor_cas.152.title: "王国全土に課す一つの税"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "ムーア人との戦争は国庫に重い負担をかけ、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]は戦費を捻出するため新たな財源を求めざるを得なくなった。王国の諸都市は我らに売上税の課税を認めることに同意したが、この申し出を受けて、多くの顧問たちは、これを一時的な措置とするだけでなく、制度化された永続的な財源とすべきではないかと提案している。"
 flavor_cas.152.a: "一時的な献金に頼ることはできぬ。"
 flavor_cas.152.b: "彼らの厚意に付け込むまい。"
 flavor_cas.152.historical_info: "アルフォンソ11世の治世下、カスティーリャはグラナダへの遠征により財政難に見舞われた。アルヘシラス包囲と征服の資金を得るため、カスティーリャの諸都市は国王に対し、#italic アルカバラ #! という商取引に課される売上税を認めた。当初はコルテスを通じて諸都市が承認する戦時の臨時貢納として意図されていたが、この税はほどなくカスティーリャにおける王室収入の最も重要な財源の一つとなった。後の君主たちはこの税を拡大・制度化し、数世紀にわたり王室収入の大きな部分を担う永続的な課税へと変えていった。"
