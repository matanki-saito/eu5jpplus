l_japanese:
 dar_al_tiraz_bureaucracy: "ダール・アル＝ティラーズ"
 dar_al_tiraz_bureaucracy_desc: "ペルシアに由来する豪奢な刺繍衣は、イスラーム世界において古くより、君主が寵愛する者へ授ける栄誉の衣として用いられてきた。潤沢な資金を持つ王室の #italic $dar_al_tiraz_bureaucracy$ #! 工房が絹・錦・刺繍を織り上げれば、宮廷は華やかに彩られ、珍重される織物は各地の市場へと送られるであろう。"
 diwan_al_mustakhlas_bureaucracy: "ディーワーン・アル＝ムスタハラス"
 diwan_al_mustakhlas_bureaucracy_desc: "#italic$diwan_al_mustakhlas_bureaucracy$#!は、国庫とは別に宮廷と$alhambra$を支えるため、荘園・製粉所・収益を管理するスルタン私領の運営を司る。勤勉な管理は王家を富ませ、その所領における独立を保つが、監督が緩めば、それを管理する官吏自らが富を私腹に流すことになろう。"
 diwan_al_qawafil_bureaucracy: "ディーワーン・アル＝カワーフィル"
 diwan_al_qawafil_bureaucracy_desc: "#italic$diwan_al_qawafil_bureaucracy$#!は、サハラ縦断交易の大隊商――スィジルマーサを通り、金と奴隷を北へ、塩と布を南へ運ぶ道――を統括する。この役所がよく治まれば、商人とその家畜は守られ、砂漠を渡る富は増大するが、さもなくば隊商は盗賊の餌食となり、砂の民は道を守らぬ権力に敵意を抱くようになろう。"
 ghuzat_mujahidin_bureaucracy: "アル＝グザート・アル＝ムジャーヒディーン"
 ghuzat_mujahidin_bureaucracy_desc: "#italic$ghuzat_mujahidin_bureaucracy$#!とは信仰の義勇兵であり、己の$rank_county_arabic_ruler_male$の下で海峡を渡り、辺境で聖戦を戦う北アフリカの騎兵たちである。この熱烈な戦士たちは信心より生まれる熱情をもって戦い、その敬虔さは我らが民をも同じ熱意へと駆り立てるであろう。"
 makhzan_bureaucracy: "アル＝マフザン"
 makhzan_bureaucracy_desc: "#italic$makhzan_bureaucracy$#!はスルタンの権威を支える中枢機構であり、その徴税吏と地方総督が玉座の意志を遠方にまで及ぼす。強力な#italicマフザン#!は遠隔の部族や町への王権の掌握を強めるが、その統治が揺らげば、国は真に#italicビラード・アッ＝スィーバ#!――反抗の地――と化し、辺境の諸州は反乱と自治へと傾いていくであろう。"
 marinid_madaris_bureaucracy: "リアーヤト・アル＝マダーリス"
 marinid_madaris_bureaucracy_desc: "#italic$marinid_madaris_bureaucracy$#!は、国家が頼みとする法学者・書記・官吏を育成する学院、マドラサへの王家の庇護である。手厚く保護されたマドラサは、学識高く忠実な臣下で内閣を満たし、諸学派の正式な法学を根付かせるであろう。"
 qadi_al_jamaa_bureaucracy: "カーディー・アル＝ジャマーア"
 qadi_al_jamaa_bureaucracy_desc: "#italic$qadi_al_jamaa_bureaucracy$#!は共同体の首席裁判官であり、$maliki_school$法廷を主宰し、国中の多くの地方カーディーを任命する。人々に敬われる司法制度は万人が認める法によって争いを収め、玉座に正義の正統性を与え、人々の間に正式な法学への帰属意識を深めていくであろう。"
 wulat_al_thughur_bureaucracy: "ウラート・アッ＝スグール"
 wulat_al_thughur_bureaucracy_desc: "#italic$wulat_al_thughur_bureaucracy$#!は辺境の防人たちである。彼らは国境の城砦に駐屯し、山道を見張り、大きなキリスト教諸国を退けておくための休戦と貢納を取り仕切る。しっかりとした辺境は守備兵で満ち、慎重な外交によって国に時を稼がせるが、辺境を疎かにすれば隣国を増長させ、弱みを嗅ぎつけた彼らが要求を強めてくるであろう。"
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "ディーワーン・アル＝ガルブ"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#!――西方庁――は、アラビア語と同じほど流暢にアラブ化ロマンス語が話され、いまだ教区教会がモスクの数を上回るアンダルスの諸州を統治するために我らが設ける行政機関である。その書記たちはスルタンの歳入を徴収し、混成法廷にカーディーを任命し、征服を属州へと変える同化政策を推し進める。よく運営された庁はこれら西方の地を我らの法に結びつけるが、放置された庁は辺境をどの氏族であれ実力で押さえた者の手に委ねてしまう。"
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "アッザーバ評議会"
 mozabite_azzaba_bureaucracy_desc: "#italicアッザーバ#!は、イバード派学者による秘密の評議会であり、ムザブ渓谷のモザブ人共同体を実際に支える統治の骨格をなす。宗教法を審議し、紛争を裁定し、幾世紀にもわたる外圧の中でイバード派の独自性を守り続けてきた厳格な道徳律を執行する。我らはこの評議会を共同体生活における最高の裁定者として維持し、その学者たちに資金を与え、その裁定を神の法の顕現として尊重する。よく支えられたアッザーバは信徒の帰依を集め、イバード派法学の及ぶ範囲をあらゆる家庭にまで広げる。資源を絶たれれば、その権威は分裂し、異端の潮流がその沈黙の生む空隙を満たすことになる。"
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "ナバラ県議会"
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$は、コルテスの会期の合間にナバラの憲政上の営みを取り仕切り、#italicドナティーボ#!の徴収を監督し、ナバラの自治を定める#italicフエロ#!の厳格な遵守を確保する。その構成員は王国の三身分から選ばれ、貴族、聖職者、そして都市に、自らの領域の統治における恒常的な制度的発言力を与えている。潤沢な資金を持つ議会はフエロ遵守の保証人となるが、資源が乏しければ、大国の君主が小領邦に対して常に加えてくる中央集権化の圧力に抗する力を欠くことになる。"
 por_desembargo_do_paco_bureaucracy: "デゼンバルゴ・ド・パソ"
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ は、ポルトガルの最高王立評議会であり、法令の審査、恩赦の発布、そして王権を王国の隅々にまで及ぼす司法任命の監督を委ねられている。通常の裁判所を担う大学出の法律家とは異なり、デゼンバルゴには法的専門知識と王の信任を兼ね備えた者たちが登用され、専門的な法学と君主への直接奉仕とを結び付けている。よく維持されたデゼンバルゴは行政の循環を速め、王の決定が法的な精確さをもって実行されることを保証する。"
 por_mesa_da_consciencia_e_ordens_bureaucracy: "メサ・ダ・コンシエンシア・エ・オルデンス"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$は、ポルトガルの軍事修道会――キリスト騎士団、サンティアゴ騎士団、アヴィス騎士団――を統制するために設立された。これらの土地、歳入、そして宗教的権威は、王が大団長としてこれを管轄する。この法廷は宗教上の特免の請願を審査し、司令区の王の縁故者への配分を管理し、教会法と王の恩顧との境界を裁定する。その設立により、軍事修道会は自律的な教会組織から王権政策の道具へと変貌し、王の宗教政策に強く結びつけられた。"
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "アラゴン評議会"
 spa_council_of_aragon_bureaucracy_desc: "[ShowScriptedGeographyName('aragon_geography')]の[ShowRegionName('iberia_region')]東部の領土は、#italic$spa_council_of_aragon_bureaucracy$#!によって統治される。この官庁は主に地中海交易との結びつきと現地フエロの要請を維持する任を負う。"
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "#italic$spa_council_of_castile_bureaucracy$#!は[ShowScriptedGeographyName('castile_geography')]の土地を担当し、我らに代わってこの広大な領域とその民を統治する。"
 spa_council_of_flanders_bureaucracy: "フランデレン評議会"
 spa_council_of_flanders_bureaucracy_desc: "我々の伝統的な領土から遠く離れた地を統治するにあたり、#italic$spa_council_of_flanders_bureaucracy$#!は[ShowScriptedGeographyName('spanish_netherlands_geography')]における秩序と生産性を維持するため、強力な統制を保たねばならない。"
 spa_council_of_italy_bureaucracy: "イタリア評議会"
 spa_council_of_italy_bureaucracy_desc: "[ShowRegionName('italy_region')]における我らの存在感が増す中、新たな征服地を統治するための専門機関を設立すべきである。これらの土地の統治は、[ShowRegionName('iberia_region')]における我らの領土とは異なる種類の課題となるであろう。"
 spa_council_of_portugal_bureaucracy: "ポルトガル評議会"
 spa_council_of_portugal_bureaucracy_desc: "領土の獲得が進む中、[ShowScriptedGeographyName('portugal_geography')]における我らの所領のために専任の顧問会議を設立すべきである。この機関は主に我らの大西洋貿易と海軍事項を管掌する。"
 spa_viceroy_bureaucracy: "副王庁"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "十字軍評議会"
 spa_council_of_crusade_bureaucracy_desc: "[GetUniqueInternationalOrganization('catholic_church').GetName] および [pope] の意向に従い設立された #italic $spa_council_of_crusade_bureaucracy$ #! は、我らの拡張と、[ShowReligionAdjective('catholic')] 信仰の光を世界の全ての隅々にもたらす努力を導くものである。"
 spa_council_of_finance_bureaucracy: "財務評議会"
 spa_council_of_finance_bureaucracy_desc: "従来の会計局および上級会計局という二つの機関に代わり、#italic$spa_council_of_finance_bureaucracy$#!は両局間の摩擦を解消し、国家財政を扱う統一された機関を創設するものである。"
 spa_council_of_indies_bureaucracy: "インディアス顧問会議"
 spa_council_of_indies_bureaucracy_desc: "海の彼方に広がるすべての地は #italic $spa_council_of_indies_bureaucracy$ #! の管轄下に置かれる。この機関は植民地から本国へ流れ込む貿易、および異郷の地に住む我らの臣民に関する全てを管掌し、国庫への富の絶えざる流入を確保する。新たに獲得した臣民の生活と規制、そして植民地開発のための土地分配もまた、この顧問会議によって統治される。"
 spa_council_of_inquisition_bureaucracy: "スペイン宗教裁判最高評議会"
 spa_council_of_inquisition_bureaucracy_desc: "複数の使徒的審問官により構成され、大審問官によって率いられる#italic$spa_council_of_inquisition_bureaucracy$#!は、我が国の宗教的正統性と裁判手続きを監督する。彼らは教会と世俗の両事案において、最高の上訴裁判所として機能する。"
 spa_council_of_military_orders_bureaucracy: "軍事修道会顧問会議"
 spa_council_of_military_orders_bureaucracy_desc: "旧領の統治を任務とする#italic「$spa_council_of_military_orders_bureaucracy$」#!は、軍事目的のための土地授与において重要な役割を果たし、我が軍の徴募基盤を拡大するとともに、有能な士官の育成と登用を確実なものとするであろう。"
 spa_council_of_state_bureaucracy: "Consejo de Estado"
 spa_council_of_state_bureaucracy_desc: "#italic「$spa_council_of_state_bureaucracy$」#! は我が君主自らが率い、外部の干渉を受けることなく君主の外交を補佐する。この評議会には外交と国際関係に通じた貴族や聖職者の有能な人材が配され、海外の大使館を管理するとともに、困難な国際情勢を乗り切るための助言を我らに与えるであろう。"
 dawa_bureaucracy: "ディーワーン・アル＝ダアワ"
 dawa_bureaucracy_desc: "#italic$dawa_bureaucracy$#!は、海の彼方まで信仰を統治するための機関であり、支配がモスクの及ばぬところまで広がった遠方の属州へカーディーと説教師を派遣する。その#italicドゥアート#!はイスラームの呼びかけをかの地の人々にもたらし、書記たちは新たな植民地をウンマの法へと結びつける。よく維持されれば、遠き征服は定住の属州へと変わり、王冠の下に信徒を増やす。放置されれば、遠方の群れは君主の手の届かぬところへ漂い去り、呼びかけを担う者なき地でその声は絶える。"
