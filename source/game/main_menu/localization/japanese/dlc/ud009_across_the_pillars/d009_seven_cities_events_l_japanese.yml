l_japanese:
 seven_cities.10.title: "彼方に輝く都市"
 seven_cities.10.desc: "The local guides, when the wine is poured and the trade goods are laid out for inspection, are willing to talk. Yes, they have heard of the country the [target_leader.GetName] is asking after. Yes, there is a city there, beyond the next sierra, perhaps two weeks further. One man swears he saw the sun rising over its walls from a distance, gold-coloured. Another says his uncle traded there for a season and came back rich. A third says it is a fairy-tale and the first two will say anything for a measure of brandy. The chronicler writes it all down."
 seven_cities.10.a: "最も優れた話をした者たちにブランデーを。"
 seven_cities.10.b: "彼らに別れを告げ、進軍する。"
 seven_cities.10.b.tt: "#italic 我々は語り部たちに別れを告げ、出発する。またも大げさな作り話を聞くよりも、この道を信じることにした #!"
 seven_cities.10.historical_info: "Early Spanish, French, and English entradas in the Americas relied almost entirely on native informants for geographic intelligence. The information was often shaped by what the natives believed their interrogators wanted to hear, by what the natives wanted the interrogators to do (frequently, to leave), and by the conjectural picture the interrogators arrived with. The result was a chronic feedback loop in which European legends of golden cities were validated by native testimony that had itself been calibrated to European expectations."
 natives_provide_crudely_drawn_map_tt: "#Y 現地の者たちが、周辺地域の粗末な地図を提供する #!"
 expedition_learns_of_potential_dangers: "#Y[expedition|e]は、この地に潜む危険について知ることになる#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y 酒と語らいを共に愛する心が、兄弟のような絆を生む #!"
 improve_root_culture_view_of_location_dominant_culture_tt: "[target_location.GetDominantCulture.GetName]に対する我々の[cultural_opinion|e]が改善する"
 expedition_observes_local_innovations: "#Y Local innovations are observed and catalogued#!"
 expedition_receives_artifacts_as_gifts: "#Y[ROOT.GetCountry.GetCapital.GetName]への帰還に際し、文化的遺物が贈り物として献上されるだろう#!"
 should_calamity_occur_chance_to_avoid_tt: "現地の敵対勢力や野生動物の脅威が和らぐ"
 may_bring_us_closer_to_uncovering_goal_tt: "これにより、我々が求めるものの解明に近づくかもしれない"
 expedition_brought_back_riches_tt: "[expedition|e] が持ち帰った財宝："
 expedition_brought_back_exotic_goods_tt: "[expedition|e]の人足と荷が持ち帰った異国の品々："
 expedition_brought_back_artifacts_tt: "[expedition|e]は贈り物や工芸品を持ち帰った:"
 expedition_healer_joins_court_tt: "[expedition|e]が帰還すると、現地の治療師が我が宮廷に加わる"
 porters_guides_prevent_stalling: "[expedition|e]に同行する人夫や案内人のおかげで、停滞を免れる"
 warned_expedition_avoids_calamity_tt: "現地の危険をあらかじめ知らされていた [expedition|e] は、災難を免れる"
 seven_cities.11.title: "歓迎の宴"
 seven_cities.11.desc: "The town turns out to meet us before we have even pitched camp: drums, a swept plaza, and mats laid with more food than the men have seen in a month of marching. Their headman greets [target_leader.GetName] with the grave courtesy of an equal, and the feasting is well under way before anyone thinks to ask a question. Our interpreters murmur that a welcome this warm is never truly free, and that what is pressed upon a guest in one breath tends to be counted against him in the next. Still, an open host and a laden table have loosened more tongues than any threat we might have made."
 seven_cities.11.a: "開かれた手と開かれた財布をもって、彼らの歓迎に応えよ。"
 seven_cities.11.b: "我々は座して食すために大洋を渡ったのではない。"
 seven_cities.11.b.tt: "#italic我々は食事だけをいただき、財布は開かぬまま、歓迎が義務となる前に進軍を続ける#!"
 seven_cities.11.historical_info: "儀礼的なもてなしは、アメリカ大陸の広範な地域における外交の中核をなすものであり、到来したヨーロッパ人はしばしば、いかなる交渉に入る前にも、宴と贈り物、そして正式な歓迎をもって迎えられた。コロナドの一行はリオ・グランデ沿いのプエブロの町々に宿と食を与えられ、デ・ソトの一行は南東部のミシシッピ文化の首長国にもてなされたが、いずれの場合も、それは服従の証というより、危険な余所者を制御するための手段であった。ヨーロッパ人はガラス玉、鷹の鈴、布地、ナイフなどを、まさにこうした交わりを開くために携えていた。贈り物は好意と情報を買い取ったが、その根底にある取引の意味は、双方でほとんど常にまったく異なる理解をされていた。"
 expedition_receives_guides_and_porters: "#Y案内人と人夫が旅に加わる#!"
 expedition_less_likely_to_stall_tt: "[expedition|e]が停滞する可能性は低くなる"
 expedition_receives_exotic_goods: "#Y[expedition|e]は持ち帰るための異国の物産を取引する#!"
 seven_cities.12.title: "熱心な案内人"
 seven_cities.12.desc: "彼が我々を見つけたのだ、我々が彼を見つけたのではない。痩せた、気安く笑うその男は、街道を旅する間にあらゆる言葉を少しずつ身につけたようで、胸に手を当てて誓う――自分はこの目で黄金都市の門の前に立ったことがあるのだと。彼が望むのは案内人としての賃金と、栄光のささやかな分け前だけで、我々をそこへ導いてくれるという。[target_leader.GetName] は、以前にも別の谷で、別の口から、まさに同じ約束を聞いたことがある者の用心深さで、その話に耳を傾ける。だが部下たちはすでに心を決めており、その目は彼のそれと同じくらい輝いている。"
 seven_cities.12.a: "富と栄光を！"
 seven_cities.12.b: "物乞いは去れ！"
 seven_cities.12.b.tt: "#italic 笑顔の案内人を追い払い、我々自身で読み解ける道を進む #!"
 seven_cities.12.historical_info: "The most notorious guide of the North American entradas was the Plains captive the Spanish called El Turco, who told Coronado's expedition of Quivira, a kingdom to the northeast supposedly rich in gold. He led the column for weeks out onto the Great Plains and later admitted, under interrogation, that he had been steering it into the grass in the hope that the men and their horses would die there. Quivira, when finally reached, proved to be a cluster of Wichita grass-lodge villages with no gold at all, and El Turco was executed. The episode was typical: guides had their own reasons for where they led armed strangers, and those reasons rarely matched the expedition's."
 expedition_uncovers_riches_in_new_waypoint: "#Y 案内人の道は真実であり、本物の財宝を見つけ出した#!"
 expedition_led_to_deathly_trap: "#Y案内人は我々を待ち伏せへと導き、[expedition|e]は失われた#!"
 guide_lied_waste_of_time: "#Y 案内人は我々を堂々巡りさせただけで、彼の語った黄金都市は偽りであった #!"
 target_character_flogged_tt: "嘘をついた案内人は、その欺きの罰として鞭打たれる"
 seven_cities.13.title: "馴染みの言葉"
 seven_cities.13.desc: "行軍のどこかで、 [target_leader.GetName] は変わってしまった。かつて [target_leader.GetSheHe] が語るのは行く手の都市のことばかりだったが、今では [target_leader.GetSheHe] はここに住む人々のことを語る――[target_leader.GetSheHe] が半ば覚えた彼らの言葉、差し出された屋根、 [target_leader.GetSheHe] が放浪をやめさえすれば待っている落ち着いた暮らしについて。今朝 [target_leader.GetSheHe|U] ははっきりと告げた。遠征隊は先へ進んでもよいが、 [target_leader.GetSheHe] は行かない、と。荒野に呑まれる者もいれば、荒野に囚われる者もいるようだ。"
 seven_cities.13.a: "ならば [target_leader.GetHerHim] を残し、夢はここで終わらせよう。"
 seven_cities.13.historical_info: "難破あるいは捕らわれ、何年も先住民の間で暮らした欧州人は、後の遠征隊にとって通訳として重宝された。エルナンド・デ・ソトは、先のナルバエス遠征の生存者フアン・オルティスが、フロリダのウジタ族のもとで約十一年を過ごしていたのを見つけ、オルティスは行軍中に死ぬまで彼の通訳を務めた。1511年にユカタン半島の海岸で難破したゴンサロ・ゲレーロは、まったく逆の道を歩んだ。マヤの共同体に嫁ぎ入り、救出を拒み、伝えられるところではスペイン軍との戦いで命を落としたという。こうした者たちは二つの世界を結ぶ生きた架け橋であり、その忠誠はどちら側にも傾き得るものだった。"
 seven_cities.14.title: "若返りの泉？"
 seven_cities.14.desc: "その話は又聞きの又聞きで我々の耳に届き、語られるたびに大きくなっていく――この先の丘のどこかに、古い傷を癒し、曲がった背筋を伸ばし、行軍が奪った歳月を取り戻させる泉があるという。原住民たちは聖なる場所に対して抱くような、慎重な畏敬の念をもってそれを語る。それは何かの証しかもしれぬし、何の証しでもないかもしれぬ。我らが外科医は目を回し、沼の熱病だとぶつぶつ言っている。すでに野営地の半分は水筒を満たしにかかっている。"
 seven_cities.14.a: "泉を探索する。"
 seven_cities.14.b: "水浴びをしている暇などない！"
 seven_cities.14.b.tt: "#italic我々は噂の泉を素通りし、その水は信じやすい者たちに任せる#!"
 seven_cities.14.historical_info: "若返りの泉は、欧州人がアメリカ大陸に持ち込んだ地理的伝承の一つとして実在し、1513年のフアン・ポンセ・デ・レオンによるフロリダ探検と結び付けられるようになった。彼が若返りの水を求めて航海したという説は、主に後の脚色であり、最初に広めたのは彼の政敵たちだったが、それは治癒や延命の効能を持つ泉という広く信じられていた旧世界の古い伝説を下敷きにしていた。カリブ海一帯や南東部の先住民の情報提供者たちは、実際に欧州人を聖なる水や薬効のある水へと導いており、それらは彼ら自身の儀礼的な世界観の中に確かに存在するものであった。語られたものと求められたものとの隔たりは、ここでもまた、非常に大きかった。"
 spend_some_time_recovering: "#Y 兵たちはしばらく休息し、その水を口にする #!"
 retrieve_some_rejuvenating_water: "#Y 伝説の若返りの水が、いくつもの水筒に汲み取られていく #!"
 just_water_hole: "#Yそれはただの水たまりだと判明する……#!"
 seven_cities.15.title: "川底のきらめき"
 seven_cities.15.desc: "夕暮れ、一人の男が川床にかがみ込み、古参から教わった通りに砂利を鍋で洗っていたが、突然、罵り笑いながら跳ね上がった。泥の中に光る一粒の [target_material.GetName] を見つけたのだ。ならば上流にはもっとあるはずだ。これが大陸を越えて追い求めてきた本物の宝なのか、それとも欲深い者を欺くだけの、価値のないきらめきの筋なのか、今夜のところは誰にも分からず、あえて問おうとする者もいない。"
 seven_cities.15.a: "全員、鍋を持って川へ向かえ。"
 seven_cities.15.b: "ふん！どうせ黄鉄鉱の王様だろうよ！"
 seven_cities.15.historical_info: "The Sierra de la Plata, the mountain of silver, was a rumor that drew Spanish and Portuguese expeditions deep into the basin of the Rio de la Plata from the 1520s, and it gave both the river and eventually the country their names. The rumor was not baseless: it pointed, however dimly, toward the real silver wealth of the Andes, above all the mountain of Potosi, whose discovery in 1545 would reshape the world economy. But the men who followed the early reports upriver mostly found hardship and hostile country rather than silver, and the fabled sierra receded ahead of them for a generation. A little metal panned from a streambed was often the only tangible sign that the story was not pure invention."
 expedition_brings_back_valuable_materials: "#Y貴重な鉱石が掘り出され、[ROOT.GetCountry.GetCapital.GetName]の市場へと運ばれる#!"
 study_their_technique: "#Y我々は新たな採掘技術を修得し、鉱山拡張の費用を軽減し、最良の鉱床をより豊かなものにする#!"
 men_are_met_by_hunger_and_false_legends: "#Y 川床がもたらすのは飢えと空しい望みばかりだ #!"
 expedition_outcome_severely_hindered_tt: "苦労して得た手がかりの一つを失う"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "We abandon the search for metal and march on"
 seven_cities.16.title: "首長のもてなし"
 seven_cities.16.desc: "The village is large and well kept, and its chief receives us with a wary courtesy that plainly costs him something. His storehouses are full and his young men know every trail inland. He also has every reason to want us gone by morning. Our officers look at those storehouses and those idle strong backs and see porters and guides for the taking. [target_leader.GetName] must decide whether this is a place to strike a bargain or a place to seize what we need and leave the reckoning to whoever follows us."
 seven_cities.16.a: "首長を捕らえ、槍を突きつけて民を行軍させる。"
 seven_cities.16.b: "自発的な人足を交渉で得て、円満に別れる。"
 seven_cities.16.c: "誰にも手を出さない。野営を畳み、進軍を続ける。"
 the_captive_chief_yields_guides: "#Y 捕らえた首長が、内陸への道を知る案内人を差し出す#!"
 the_chiefs_hall_is_plundered: "#Y進軍の前に、首長の館から装飾品が根こそぎ奪われる#!"
 the_village_empties_before_us: "#Y The village melts into the forest overnight, guides and all#!"
 coerced_locals_resent_us_tt: "[target_location.GetDominantCulture.GetName]に対する我らの[cultural_opinion|e]は悪化するだろう"
 seven_cities.16.historical_info: "Hernando de Soto's usual method for crossing the southeast was to seize the local cacique, or paramount chief, on arrival and hold him hostage to guarantee food, porters, and guides for the next stage of the march. The captive lord would be released or exchanged at the edge of his territory for the neighboring chief, and the process repeated. The tactic worked in the short term and left a trail of broken chiefdoms, shattered alliances, and lasting hatred behind the column. It also depended on the Mississippian structure of powerful individual chiefs, and it failed badly wherever authority was more diffuse."
 seven_cities.17.title: "岸辺からの知らせ"
 seven_cities.17.desc: "錨が海底に触れるより早く、岸辺の人々が舟を漕ぎ出して我らを出迎える。そして午後には、魚や新鮮な果物を売り買いし、それ以上の勢いで話を交わしている。彼らは明らかにこうしたことに慣れている。ナイフ一本、布切れ一反で、木立の向こうに何があるかを教えてくれる。しかも身を乗り出さんばかりに、しきりと内陸を、その先を指し示しながら語るのだ。彼らが示すのが真実なのか、それとも単に隣の村なのかは、この浜辺からでは判じようもない。"
 seven_cities.17.a: "取引をして、内陸の様子を聞き出す。"
 seven_cities.17.b: "錨地を記録し、行軍に戻る。"
 seven_cities.17.b.tt: "#italic 噂話に取引をせず、錨地を海図に記して行軍に戻る #!"
 the_shore_folk_point_the_way: "#Y 岸辺の人々が、我らの求めるものへの確かな道を示してくれる #!"
 the_shore_market_yields_goods: "#Y 砂浜での活発な取引により、船倉が現地の品々で満たされる #!"
 the_shore_folk_send_us_at_their_rivals: "#Y 彼らの指し示す方角は、我らを敵対する村の周りでぐるぐる回らせるだけだった #!"
 seven_cities.17.historical_info: "沿岸に住む人々は、たいてい遠征隊が最初に接触するアメリカ人であり、内陸のあらゆる事柄についての最初の情報源となった。ヴェラッツァーノやカルティエによる北大西洋沿岸での接触、最初のスペイン航海によるカリブ海への上陸、そしてポルトガル人によるブラジル沿岸での遭遇――これらはいずれも同じ型をたどった。警戒を伴う交易、互いの探り合い、そして沿岸から内陸へと流れる地理的な噂である。沿岸の共同体はしばしば、余所者たちをさらに内陸へと進ませようと仕向けた。厄介者を遠ざけるためでもあり、彼らの要求を競争相手に向けさせるためでもあった。従って、沿岸が内陸について語ったことは、ヨーロッパ人の耳に届くはるか以前から、沿岸自身の利害によって既に濾過されていたのである。"
 seven_cities.18.title: "避難の港"
 seven_cities.18.desc: "この港は、疲弊した遠征隊が祈り求めるすべてを備えていた。深く、よく守られており、真水が流れ下る先には、船体を傾けて腐敗を削ぎ落とせるだけの広い浜がある。船体の材木が手入れを必要とするのと同じくらい、乗員たちも休息を必要としていた。だが浜に引き上げられた船団はどこへも進めぬ船団であり、見知らぬ土地で暇を持て余す者たちは、厄介事を見つけ出す才に恵まれている。 [target_leader.GetName] は、まともな修理にかかる日数と、船の状態、そして乗員たちの気性とを比べ天秤にかけていた。"
 seven_cities.18.a: "船体を傾けて手入れし、物資を十分に補給する。"
 seven_cities.18.b: "一晩だけ休み、出航する。"
 seven_cities.18.b.tt: "#italic 乗員に上陸しての一晩の休息を与え、船が根を張ってしまう前に再び海へ出る #!"
 the_refit_goes_smoothly: "#Y修理は滞りなく進み、船はいっそう調子良く応えるようになった#!"
 a_wreck_yields_salvage: "#Y 乗員たちは浅瀬に朽ちる難破船から使えるものを剥ぎ取った #!"
 the_crew_falls_to_brawling: "#Y 上陸して暇を持て余した乗員たちは喧嘩を始め、秩序を取り戻すのに幾日も失われた #!"
 seven_cities.18.historical_info: "海路を含む遠征には、避難港が不可欠であった。そこで船体を傾けて修理し、水と薪を補給し、航海に疲れた乗員を休ませることができたのである。マゼランの船団はパタゴニア沿岸のサン・フリアン港で五ヶ月にわたり越冬したが、この強制的な停泊は彼が凄惨な弾圧で鎮めた反乱をも生んだ。探検家たちはしばしば、帆走している時間よりもこうした停泊地での整備に長い時間を費やしており、友好的あるいは無関心な現地住民のいる良港の有無が、遠征の存続か崩壊かを分けることもあった。どこで立ち止まるかという選択は、どこへ向かうかという選択と同じくらい重大な意味を持っていたのである。"
 seven_cities.20.title: "この土地は我々を養えぬ"
 seven_cities.20.desc: "我々が横断しているこの土地は、事前の報告よりも乾燥し、荒れ果てている。荷役の動物たちは倒れ始めている。兵たちはもう十日も半分の配給で過ごしている。近隣の村々は蓄えを隠すか、焼き払ってしまった。通過する六つの谷のうち、清水があるのはわずか二つだけだ。 [target_leader.GetName] は棘の木の陰に将校たちを集め、補給なしでどこまで進み続けられるのかを問う。"
 seven_cities.20.a: "どんな値をつけても物資を買う。"
 seven_cities.20.b: "行軍を止め、兵を休ませる。"
 seven_cities.20.historical_info: "Supply was the chronic constraint on inland exploration in the Americas. Cortes's army was fed largely by the political collapse of Aztec authority that allowed the Tlaxcalans and other allies to provision him. Coronado's column into the southwest had no equivalent support and starved by degrees as it pushed north. The pattern recurred from Florida to Patagonia: an entrada that could not buy or seize food from the country it was crossing would melt away on the trail, regardless of what gold lay beyond."
 seven_cities.21.title: "峡谷での待ち伏せ"
 seven_cities.21.desc: "隊は二つの石灰岩の壁に挟まれた狭い隘路へ進み入ったが、原住民たちは背後の道を閉ざしてしまった。上方からは矢が降り、峡谷の底では石斧を持つ戦士たちが迫り、荷役の列は散り散りになっている。兵たちはこの状況で人々が常にしてきたことをする——円陣を組み、岩に背を預けるのだ。[target_leader.GetName] は軍曹たちと協議している。選択は、犠牲を払って峡谷を突破するか、来た道を退いて別の道を探すかである。"
 seven_cities.21.a: "鋼と銃弾で峡谷を強行突破する。"
 seven_cities.21.b: "撤退し、別の道を探す。"
 seven_cities.21.historical_info: "Native ambush warfare in defensible terrain, narrow canyons, mountain passes, forest trails, was the most effective form of resistance to early colonial entradas. Spanish armour, firearms, and horses gave decisive advantage on open ground but were systematically negated in close country. Roughly half of Coronado's marches in the southwest were forced detours around territory his column could not safely cross, and the same pattern produced the long string of failed French and English forays into the interior of North America before the eighteenth century."
 seven_cities.22.title: "古の遺跡"
 seven_cities.22.desc: "道は尾根を越え、かつて都市であった場所を見下ろす。壁は石造りだが、屋根はほとんど崩れ落ち、通りは一世紀分の木々に埋もれている。人の姿はない。しばらく誰もここに住んでいないようだ。斥候たちは礎から一定の距離を保って周囲を巡り、記録係は写生に取り組んでいる。神父は死んだ都市を汚した者に病がもたらされると伝えられていることから、中へ入るべきかどうか自問している。[target_leader.GetName]は写生係に一時間の猶予を与える。"
 seven_cities.22.a: "Catalogue the ruin before we march on."
 seven_cities.22.historical_info: "Pre-Columbian America was crowded with abandoned settlements: Mississippian mound centres in the southeast, Pueblo great-houses in the southwest, Chaco itself, the Tiwanaku basin in the Andes, the Maya cities of the southern Yucatan. Sixteenth-century European explorers walking these landscapes routinely came on stonework, agricultural terraces, and ceremonial centres that had been abandoned a century or more earlier. The persistent European theory that these ruins must be the work of a vanished European or Mediterranean population, Welsh, Phoenician, Lost Tribes of Israel, was already in circulation by the 1540s and would survive in some quarters into the twentieth century."
 seven_cities.30.title: "手掛かりが途絶える"
 seven_cities.30.desc: "隊列は、案内人たちが我々の目指す国への入口だと語っていた合流地点に到達した。だが、そこに入口などなかった。案内人たちは嘘をついていたか、あるいは自らの言葉を信じ込んでいたのだろう。周辺の丘陵を調べても、都市はおろか、煙も、道も、人の気配を示すものすら見当たらない。[target_leader.GetName] は指示を仰ごうと国王への書簡をしたためるが、結局それを握りつぶしてしまう。書簡が港に届く頃には、隊列は自ら結論を下しているだろうからだ。選択肢は二つ。もう一つ先の谷に都市があるかもしれぬという望みにかけ、なおも国の奥へ進むか。それとも、今得たものだけを持って隊列を引き返させ、故郷へ向かうか。"
 seven_cities.30.a: "構わず都市を目指して進軍を続ける。"
 seven_cities.30.b: "引き返し、ありのままを報告する。"
 seven_cities.30.historical_info: "The standard pattern for failed entradas was not the dramatic massacre but the slow petering-out: a column running short of supplies, losing scouts to disease and desertion, finding that each promised landmark was either a misunderstanding or a lie, until the surviving officers turned the men around and walked home through territory they now knew was empty. The Coronado expedition, the Cabrillo expedition, the De Soto expedition, the Aguirre expedition down the Amazon, all followed this curve to one degree or another. Successful entradas of equivalent ambition were rare enough to be remembered for centuries."
 may_bring_us_closer_and_fill_our_holds_tt: "これにより、求めるものの手がかりに近づき、船倉を現地の品々で満たせるかもしれない"
 seven_cities.16.c.tt: "#italic我々は首長を平穏なままにし、人質も人足も取らずに行軍を続ける#!"
