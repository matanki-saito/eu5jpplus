l_japanese:
 catholic_monarchs_law: "カトリック両王"
 catholic_monarchs_law_desc: "我らの王冠を結ぶ婚姻こそ、これより続くすべての礎である。両君主が対等に治めるか、あるいは一方の家を上位に置くか、その選び方が幾世代にもわたり連合の姿を決めるであろう。"
 iu_establish_iberian_wedding_succession_tt: "両王冠の間に [ShowRelationTypeName('iberian_wedding_pact')] を結び、その [heir_selection|e] を [ShowHeirSelectionName('iberian_union_succession')] に定め、両家の継承を結びつけることで、共有される後継者が両国を統一しうるようにする"
 composite_monarchy_law: "Composite Monarchy"
 composite_monarchy_law_desc: "Our realms are joined under one sovereign, yet each keeps its own laws and liberties. We must decide whether to honor the #italic fueros#! of every kingdom or to gather their governance into a single hand."
 asientos_law: "アシエント"
 asientos_law_desc: "The crown grants #italic asientos#!, exclusive contracts to supply and provision our overseas dominions, and whoever holds them reaps the wealth of empire. The union must decide whether the crown awards these contracts to itself, or shares them among the merchants of all its realms."
 religious_authority_law: "Religious Authority"
 religious_authority_law_desc: "我らの統合された王冠は、信仰の権威をいかに用いるかを決めねばならない。王権は #italic パトロナート・レアル #! を通じて我らの諸国内で教会を導くこともできれば、その熱意をキリスト教世界の剣と盾として外に向けることもできる。"
 legislative_authority_law: "立法権"
 legislative_authority_law_desc: "諸国は誰の意志によって治められるべきか。法は王の手から拘束力を持つ #italic pragmáticas #! として流れ出ることもできれば、各王国それぞれの #italic コルテス #! の同意に基づくこともできる。"
 crown_settlement_law: "王冠の帰結"
 crown_settlement_law_desc: "連合の最終的な形は定められねばならない。一つの法と一つの貨幣が多くの王国を単一の統一君主国へと鍛え上げることもできれば、王冠たちが対等な結びつきとして永く存続することもできる。"
 union_of_arms_law: "武器同盟"
 union_of_arms_law_desc: "連合の防衛は、その内にあるすべての国の務めである。義務的な分担によるか、自発的な貢献によるかを問わず、諸王国はともに武の重荷を担うこととなる。"
 iu_tanto_monta_policy: "タント・モンタ"
 iu_tanto_monta_policy_desc: "#italic タント・モンタ、モンタ・タント #! ——両君主は対等に治め、いずれも他に優ることはない。等しい尊厳による連合は、相互の敬意と共通の王朝的結束のもとに両国を結びつける。"
 iu_dynastic_primacy_policy: "王朝の首位"
 iu_dynastic_primacy_policy_desc: "一つの王冠が同君連合の筆頭と認められ、その王朝は諸領邦の中で最も卓越した地位を占める。宗家は最大の威信を得る一方、全構成国は自信に満ちた君主国たる誉れを分かち合う。"
 iu_dynastic_primacy_senior_only_tt: "我らが [senior_partner|e] である場合："
 iu_respect_fueros_policy: "フエロの尊重"
 iu_respect_fueros_policy_desc: "各王国の古来の自由が確認され、保護される。小国は平和のうちに自治を行い、宗主たる王冠は諸領邦の伝統に忠実な君主としての敬意を得る。"
 iu_centralized_administration_policy: "中央集権的統治"
 iu_centralized_administration_policy_desc: "諸領邦の統治は単一の行政のもとに統合される。宗主たる王冠はその支配を拡大し、小国は統一国家の秩序から正統性を得る。"
 iu_crown_asientos_policy: "王室アシエント"
 iu_crown_asientos_policy_desc: "王室自らが供給契約を授与し、交易とその地金を宗主国に集中させる。小国は諸領地への物資供給によって利益を得、その需要により産業が活性化する。"
 iu_shared_asientos_policy: "共有アシエント"
 iu_shared_asientos_policy_desc: "契約は全領邦の商人たちに分配される。小国は実入りの良い供給交易への直接的な参入を得、宗主たる王冠は共有網を通じて流れる安価な物資の恩恵を受ける。"
 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "#italicパトロナート・レアル#!により、王室は我らが諸領邦にわたって教会を統率し、聖職者を任命し、その収入を利用する。玉座によって治められる信仰は、玉座に結びついた信仰である。"
 iu_catholic_champion_policy: "信仰の擁護者"
 iu_catholic_champion_policy_desc: "Our united crowns take up the banner of Christendom, championing the faith against unbeliever and heretic alike. Let our realms be known as the sword and shield of the Church."
 iu_pragmaticas_policy: "プラグマティカ王令"
 iu_pragmaticas_policy_desc: "法は王の意志より発する。勅令たる #italic プラグマティカ #! によって、君主はいかなる議会の承認を待たずして、すべての領国に一挙に立法を行う。"
 iu_regional_cortes_policy: "地方コルテス"
 iu_regional_cortes_policy_desc: "各領国は、自らの #italic コルテス #! の同意によって統治される。旧来の議会による統治は、それぞれの王冠に正統性を与え、連合を自発的な忠誠のもとに結びつける。"
 iu_una_ley_una_moneda_policy: "統一法・統一貨幣"
 iu_una_ley_una_moneda_policy_desc: "One law and one coin for all our realms. Unifying the crowns this way dilutes the old borders, strengthening the ties of the many kingdoms into a single, unified monarchy."
 iu_perpetual_crown_policy: "永続的連合王冠"
 iu_perpetual_crown_policy_desc: "連合は諸王冠の永続的な盟約として封じられる。確固たる永続的な結びつきは、すべての領国に正統性と安定をもたらし、構成国間の結束を連合内で最も強固なものとする。"
 iu_proportional_levy_policy: "比例徴兵"
 iu_proportional_levy_policy_desc: "各領国は連合軍の一部として、それぞれの分担を供出する。連合はより大きく、より優れた軍を編成し、宗主国の王冠がその下に集結する徴募軍を指揮する。"
 iu_negotiated_contribution_policy: "協議による供出"
 iu_negotiated_contribution_policy_desc: "各領国は強制ではなく、相互の合意によって共同防衛に寄与する。自発的に負う重荷は軽く感じられ、それを担うことは戦場における規律と、構成国間の和を育む。"
 proclaim_spanish_monarchy: "スペイン王国の宣言"
 proclaim_spanish_monarchy_desc: "我らが連合を成す数多の王冠を、一つの統一された君主国と宣言し、スペインの名と威光を戴く。"
 proclaim_spanish_monarchy_integration_tt: "我らの連合は統合度5以上に達している必要がある"
 diplomatic_status_iberian_wedding_pact_name: "イベリア婚姻協定"
 iberian_wedding_pact_relation: "$diplomatic_status_iberian_wedding_pact_name$"
 iberian_wedding_pact_effect_text: "[SCOPE.sCountry('actor').GetName] は [SCOPE.sCountry('recipient').GetName] とイベリア婚姻協定を結び、両国の王位継承を結びつけた。"
 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] は [SCOPE.sCountry('recipient').GetName] とイベリア婚姻協定を結び、両国の王位継承を結びつけた。"
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nThese crowns share an Iberian Wedding Pact. If either ruler dies without an heir of their own, the other inherits the throne of the former, forming a [union|e] between the two countries."
 iberian_wedding_pact_list_who_tt: "$LIST$は$WHO$とともに[ShowRelationTypeName('iberian_wedding_pact')]に属している"
 iberian_wedding_pact_relation_desc: "この両[countries|e]は$diplomatic_status_iberian_wedding_pact_name$によって結ばれており、いずれ両国の王冠を[union|e]へと導くかもしれない継承関係を共有している。"
 offer_iberian_wedding_pact: "$diplomatic_status_iberian_wedding_pact_name$への合意"
 offer_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 offer_iberian_wedding_pact_cta: "[SCOPE.sCountry('recipient').GetName] に $diplomatic_status_iberian_wedding_pact_name$ を提案する"
 offer_iberian_wedding_pact_desc: "これにより、我らが両家の王位継承が結びつけられる。"
 offer_iberian_wedding_pact_cta_to_unknown: "[country|e]に$diplomatic_status_iberian_wedding_pact_name$を提案する"
 offer_iberian_wedding_pact_desc_to_unknown: "$offer_iberian_wedding_pact_desc$"
 offer_iberian_wedding_pact_happened_title: "$diplomatic_status_iberian_wedding_pact_name$が成立"
 offer_iberian_wedding_pact_happened_desc: "[SCOPE.sCountry('recipient').GetName]は今や$diplomatic_status_iberian_wedding_pact_name$によって我らと結ばれている。もし我らの君主のいずれかが後継者を残さずに没した場合、もう一方が両国の王位を継承し、両国の王冠の間に[union|e]が成立するだろう。"
 offer_iberian_wedding_pact_proposal_question: "Propose the $diplomatic_status_iberian_wedding_pact_name$ with [COUNTRY.GetName]?\n$INFO$"
 cancel_iberian_wedding_pact: "$diplomatic_status_iberian_wedding_pact_name$を打破する"
 cancel_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 cancel_iberian_wedding_pact_cta: "[SCOPE.sCountry('recipient').GetName]との$diplomatic_status_iberian_wedding_pact_name$を終わらせる"
 cancel_iberian_wedding_pact_desc: "我らが両家の王位継承の結びつきは失われ、[union|e]は成立しなくなるかもしれない。"
 cancel_iberian_wedding_pact_cta_to_unknown: "[country|e]との$diplomatic_status_iberian_wedding_pact_name$を終わらせる"
 cancel_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc$"
 cancel_iberian_wedding_pact_happened_title: "$diplomatic_status_iberian_wedding_pact_name$を打破する"
 cancel_iberian_wedding_pact_happened_desc: "[SCOPE.sCountry('recipient').GetName]との$diplomatic_status_iberian_wedding_pact_name$を破棄した。我らが両家の王位継承の結びつきは失われる。"
 cancel_iberian_wedding_pact_proposal_question: "[COUNTRY.GetName]との$diplomatic_status_iberian_wedding_pact_name$を破棄しますか？\n$INFO$"
 break_iberian_wedding_pact: "$cancel_iberian_wedding_pact$"
 break_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 break_iberian_wedding_pact_cta: "$cancel_iberian_wedding_pact_cta$"
 break_iberian_wedding_pact_desc: "$cancel_iberian_wedding_pact_desc$"
 break_iberian_wedding_pact_cta_to_unknown: "$cancel_iberian_wedding_pact_cta_to_unknown$"
 break_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc_to_unknown$"
 break_iberian_wedding_pact_happened_title: "$diplomatic_status_iberian_wedding_pact_name$を打破する"
 break_iberian_wedding_pact_happened_desc: "[SCOPE.sCountry('recipient').GetName]との$diplomatic_status_iberian_wedding_pact_name$は破棄された。両国の王冠はもはや継承を共有しない。"
 break_iberian_wedding_pact_proposal_question: "We will break the $diplomatic_status_iberian_wedding_pact_name$ with [TARGET_COUNTRY.GetName] との関係を破棄する。"
 giving_iberian_wedding_pact_trigger: "この国とイベリア婚姻協定を結んでいる"
 diplomatic_status_giving_iberian_wedding_pact_name: "協定締結国"
 diplomatic_status_giving_iberian_wedding_pact_tooltip: "この国は以下の国々と $diplomatic_status_iberian_wedding_pact_name$ を結んでいる。"
 diplomatic_status_receiving_iberian_wedding_pact_name: "協定締結国"
 diplomatic_status_receiving_iberian_wedding_pact_tooltip: "$diplomatic_status_giving_iberian_wedding_pact_tooltip$"
 giving_iberian_wedding_pact_list_who_tt: "$LIST$は$WHO$とともに[ShowRelationTypeName('iberian_wedding_pact')]に属している"
 receiving_iberian_wedding_pact_list_who_tt: "$LIST$は$WHO$とともに[ShowRelationTypeName('iberian_wedding_pact')]に属している"
 iberian_union_succession: "イベリア同君連合継承"
 iberian_union_succession_desc: "[ShowRelationTypeName('iberian_wedding_pact')]によって結ばれた[ShowRegionName('iberia_region')]のキリスト教君主国が用いる[heir_selection|e]の一種。いずれかの君主が正統な後継者を残さずに没した場合、もう一方の君主がその王位を継承し、両国の王冠は[union|e]として結び付けられる。"
 iberian_union_succession_tt: "後継者が先代の君主の相続人でない場合に備えて [union|e] を形成する"
 iu_dynastic_primacy_seniority_tt: "この[union|e]が結成される際、最も高い[economical_base|e]を有する構成国が[ShowSpecialStatusName('senior_partner')]に指定され、連合全体に[ShowPolicyName('union_establish_seniority_policy')]と[ShowPolicyName('union_senior_succession_law')]を制定する"
 iu_tanto_monta_no_seniority_tt: "この方式では[ShowSpecialStatusName('senior_partner')]は指定されず、[union|e]に対して[ShowPolicyName('union_establish_seniority_policy')]および[ShowPolicyName('union_senior_succession_law')]は施行されない"
