l_japanese:
 proclaim_pase_foral: "パセ・フォラルを宣言"
 proclaim_pase_foral_desc: "我々はバスクの「パセ・フォラル」の権利を行使する。これはバスクの領主たちが、自分たちのフエロに反するとみなした勅令を審査し執行を停止できるという古代からの特権である。この宣言は#Y 貴族の期待#!を満たして#Y 安定度#!を高めるが、#Y 王権の及ぶ範囲を一時的に制限#!することになる。"
 summon_santa_hermandad: "サンタ・エルマンダーを召集"
 summon_santa_hermandad_desc: "我々はサンタ・エルマンダーを動員する。これはカスティーリャが国内での盗賊行為の抑制と王室による秩序の確立のために配備した、王室後援の地方巡査隊および民兵部隊である。この組織の動員により#Y 予備兵力#!が増加し、#Y 反乱軍の勢力#!が削がれ、安定度の維持にかかる#Y コストが軽減#!される。"
 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "パセ・フォラルを宣言"
 proclaim_pase_foral_action_progress: "$proclaim_pase_foral$有効"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "サンタ・エルマンダーを召集中"
 summon_santa_hermandad_action_progress: "$summon_santa_hermandad$有効"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "$summon_santa_hermandad_action_progress$"
