l_japanese:
 a_legionaries_1: "初期軍団兵"
 a_legionaries_1_desc: "$a_legionaries_1$は、教練と規律という最古の伝統を保持している。槍、大盾、そして強固な結束力により、戦況が目まぐるしく変化してもその場に踏みとどまり戦うことができる。"
 a_legionaries_2: "軍団兵"
 a_legionaries_2_desc: "投槍と短剣を携え、洗練された近接戦闘技術の訓練を積んだ軍団兵。彼らの強みは、堅固な陣形と絶え間ない訓練という軍事文化にある。"
 a_legionaries_3: "改装軍団兵"
 a_legionaries_3_desc: "$a_legionaries_3$は、最高の鎧と武器を装備した鍛え抜かれた歩兵であり、わが軍の中核を成す存在である。"
 a_legionaries_4: "重装軍団兵"
 a_legionaries_4_desc: "$a_legionaries_4$​は、最上の武具を装備した精鋭歩兵である。古代ローマの重装軍団のように、敵を打ち砕く鉄槌となるだろう。"
 a_legionaries_5: "近衛軍団兵"
 a_legionaries_5_desc: "​$a_legionaries_5$は、軍団内における最高水準の兵士の基準を体現している。最も優れた部隊から選抜された彼らは、重要な任務や国家最高機関の防衛を任されている。"
 a_legionaries_6: "帝国軍団兵"
 a_legionaries_6_desc: "$a_legionaries_6$は、数世紀にわたる軍事的進化の頂点に立つ。装備と戦術の両面を極めた彼らは親衛隊として仕え、その存在だけで揺らぐ戦列を立て直すことができる。"
 a_byzantine_cataphracts_2: "中世後期カタフラクト"
 a_byzantine_cataphracts_2_desc: "$a_byzantine_cataphracts_2$は、馬ともども鎖帷子に身を包み、長槍と重厚な盾を掲げて戦場に轟音を響かせる。彼らの突撃と鉄の規律は、敵にとって恐怖の光景となる。"
 a_byzantine_cataphracts_3: "改装カタフラクト"
 a_byzantine_cataphracts_3_desc: "$a_byzantine_cataphracts_3$は、帝国古来の教練に新戦術を融合させ、槍に加えて弓や副武器を使いこなす。彼らは柔軟な重騎兵部隊として戦い、遠距離から敵を牽制し、近接戦闘で仕留めることができる。"
 a_byzantine_cataphracts_4: "重装カタフラクト"
 a_byzantine_cataphracts_4_desc: "$a_byzantine_cataphracts_4$が纏う層状の装甲は、大半の投射物や刃を跳ね返す。精鋭から成る楔形陣形を組み、繰り返しの突撃で敵の戦列を突破する。この突撃に耐えられる陣形はそうない。"
 a_byzantine_cataphracts_5: "近衛カタフラクト"
 a_byzantine_cataphracts_5_desc: "極めて優れた槍騎兵から選抜された$a_byzantine_cataphracts_5$は、玉座と首都を守る騎馬近衛兵として仕える。あらゆる戦場において、彼らの存在は武器であると同時に象徴でもあり、わが軍を鼓舞し、敵を震え上がらせる。"
 a_byzantine_cataphracts_6: "帝国カタフラクト"
 a_byzantine_cataphracts_6_desc: "$a_byzantine_cataphracts_6$は、数世紀に及ぶ騎兵伝統の集大成である。重装甲の熟練兵士たちは、駿馬を与えられ、完璧に訓練されている。皇帝直属の親衛隊である彼らは、時宜を得た一度の突撃で戦局を左右することができる。"
 n_greek_fire_galley_renaissance: "シフォネス"
 n_greek_fire_galley_renaissance_desc: "ギリシャの火を放つための特殊な筒を装備したこれらの艦船は、敵艦に地獄の業火を放ち、瞬く間に灰へと変える。至近距離において、彼らがもたらすのは破壊のみである。"
 n_greek_fire_galley_discovery: "改良型シフォネス"
 n_greek_fire_galley_discovery_desc: "ギリシャの火の放射機構を新型艦船に適応させたことで、敵の船を灰へと変える能力は維持され、わが海軍全体の象徴として君臨している。"
 a_greek_fire_renaissance_infantry: "ケイロシフォネス"
 a_greek_fire_renaissance_infantry_desc: "ギリシャの火の恩恵を受けるのは船舶だけではない。陸軍部隊も、火炎を放射する手持ち式の装置を装備できる。炎と破壊が敵の陣形を切り裂き、我々の進軍の道を開くのだ。"
 a_greek_fire_discovery_infantry: "改良型ケイロシフォネス"
 a_greek_fire_discovery_infantry_desc: "軍や兵装は時代とともに変化するが、敵を炎で包み焼き尽くす戦法は依然として有効である。そのため、ギリシャの火はわが軍のなかでその存在感を保ちつづけ、敵対者たちから恐れられつづけている。"
