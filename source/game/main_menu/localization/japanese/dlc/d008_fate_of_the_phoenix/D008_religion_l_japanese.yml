l_japanese:
 # Hellenism
 #Religious Aspects
 civic_religion_aspect: "市民宗教"
 civic_religion_aspect_desc: "神々を敬うことは、国家の安寧を保つことと同義である。ゆえに、宗教上の慣行と祭儀は、我らのポリスの繁栄のため守りつづけねばならない市民の務めである。"
 hero_cult_aspect: "英雄崇拝"
 hero_cult_aspect_desc: "我々の歴史は、我らの社会と国柄を形づくった偉大な人物たちに満ちている。彼らは神々の定命の子であり、並外れた力を備え、しばしば悲劇的な運命をたどった。そして祖先を守り導き、今日のこの偉大な国の礎を築いたのだ。彼らを崇め、その教訓を学ぶことは我らの務めである。"
 dionysian_mysteries_aspect: "ディオニュソスの密儀"
 dionysian_mysteries_aspect_desc: "ディオニュソスの密儀にまつわる祭儀、舞踊、音楽は、身分の別なく、信徒たちに解放と高揚をもたらす。神の死と再生は、大地に芽吹き、葡萄酒となり、最後にはディオニュソスを称える信徒たちに飲まれる葡萄の循環になぞらえられている。"
 eleusinian_mysteries_aspect: "エレウシスの密儀"
 eleusinian_mysteries_aspect_desc: "エレウシスの密儀の信徒たちは、ペルセポネが冥界の王ハデスによって母デメテルのもとから奪い去られ、そののちに解放され、欺かれるという神話を拠り所とする。密儀に加わった者たちにとって、この神話は、あらゆる植物の成長と再生の循環、そして世代から世代へと受け継がれてゆく生命の永続を表している。"
 samothracian_mysteries_aspect: "サモトラケの密儀"
 samothracian_mysteries_aspect_desc: "サモトラケ島では、ヘレニズムの最盛期にひとつの密儀宗教が隆盛を極めた。この宗教は、望めば誰でも身分を問わず受け入れたことでよく知られており、ヘラクレス、イアソン、オルペウスをはじめ、多くの神話上の英雄たちもサモトラケ島で入信の儀式を受けたと伝えられている。我々は遺構や廃墟に残る手がかりからこの密儀宗教を復元し、この信仰をかつての栄光へと甦らせることができる。"
 olympiad_aspect: "オリンピア祭典競技"
 olympiad_aspect_desc: "オリンピア祭典競技は、神々を称える祭典であるとともに、わが国の力と結束を示すものである。この競技会への参加は市民の務めであり、競技者たちに名誉がもたらされる。"
 mithraic_mysteries_aspect: "ミトラスの密儀"
 mithraic_mysteries_aspect_desc: "ミトラスの密儀宗教に加わり、自らをシンデクシオイと称する者たちは、帝国の最盛期にはローマと西ローマ帝国で大いに人気を集めた。彼らの祭儀や集会、饗宴は地下の密かな神殿でおこなわれていたが、我々はそれを再び白日のもとに戻し、民のためにその伝統を甦らせることができる。"
 imperial_cult_aspect: "皇帝崇拝"
 imperial_cult_aspect_desc: "かつて古代ローマの皇帝たちが民衆と元老院から神として仰がれていたように、我らの統治者とその王朝もまた、そのようにみなされるべきである。その偉大さ、威厳、権威は、彼らが単に神意にかなう存在であるだけでなく、神そのものであることを明らかに示している。"
 dii_familiares_aspect: "家の神々"
 dii_familiares_aspect_desc: "家や身近な場を司る神々は、わが国の人々にとって極めて重要な存在である。これらの神々は、人の領分で起こるあらゆることを守り、またそれに影響を及ぼす。その領分は大抵、家を指すが、道や近隣、さらには都市全体にまで及ぶこともある。"
 mos_maiorum_aspect: "祖先の習わし"
 mos_maiorum_aspect_desc: "古代から帝国の最盛期に至るまで、ローマ人の生活を律してきた不文の規範。この伝統と慣行の体系は、ローマ人たることの意味と、家のなかと公の場での振る舞い方を定めてきた。"
 monism_aspect: "一元論"
 monism_aspect_desc: "わが国の復興を支える哲学者たちは、あらゆる存在は「一者」より流れ出ると説く。「一者」とは、すべての神々と万物の源である、唯一にして超越的な原理である。古来の神々の体系は寓意として解釈され、個々の神は「一者」の一側面とみなされる。吉兆や凶兆はそれぞれの意味を失っていくが、「一者」への信仰は統治のあらゆる営みに行き渡っていく。"
 #Omens
 #Zeus
 the_thunderer_omen: "雷神"
 the_thunderer_omen_desc: "空は稲妻と雷鳴をもって怒り、我らに逆らう者はみな恐れおののく。"
 supreme_of_gods_omen: "最高神"
 supreme_of_gods_omen_desc: "燃え立つ太陽は、我らが最も強大なる神の加護を受けていることを示している。もはや誰も、我らの栄光を疑うことはできまい！"
 monarch_of_the_sky_omen: "天空の王"
 monarch_of_the_sky_omen_desc: "鳥の群れが飛び立ち、[ShowGodName('zeus_god')]に応えてその意志を運ぶ。"
 omnipotence_of_heaven_omen: "天の全能"
 omnipotence_of_heaven_omen_desc: "我らは[ShowGodName('zeus_god')]の御前にあり、その万事をなしうる力を感じる。"
 the_liberator_omen: "解放者"
 the_liberator_omen_desc: "ペルシアの圧政に抗した祖先を助けた[ShowGodName('zeus_god')]の力は、いま一度我らをこの枷から解き放つであろう。"
 the_bountiful_one_omen: "恵み深き者"
 the_bountiful_one_omen_desc: "[ShowGodName('zeus_god')]を仰ぐ者はみな、その力にあずかり、またその豊かさから恵みを受ける。"
 the_holy_omen: "聖王"
 the_holy_omen_desc: "至高の神の御前にあり、その加護を受けることほど神聖なことはない。"
 king_of_all_omen: "すべてを統べる王"
 king_of_all_omen_desc: "統治者が民の上に立つように、[ShowGodName('zeus_god')]は神々のなかにあって最高の権威である。"
 immortal_omen: "不死"
 immortal_omen_desc: "神がどうして殺されようか。[ShowGodName('zeus_god')]の加護があるかぎり、我らの軍勢がどうして敗れようか。"
 splendor_omen: "威光"
 splendor_omen_desc: "晴れ渡る空は、[ShowGodName('zeus_god')]の栄光が疑うべくもないことを示している。その加護は、世界の隅々にまで明らかとなるであろう。"
 #Aphrodite
 mother_of_love_omen: "愛の母"
 mother_of_love_omen_desc: "[ShowGodName('aphrodite_god')]から愛はあふれ出し、我らの民もまたその愛に包まれるであろう。"
 the_foam_born_omen: "泡より生まれし者"
 the_foam_born_omen_desc: "[ShowGodName('aphrodite_god')]が生まれ出た海の泡はわが国の海岸を洗い、その波間をゆく我らの船を、女神はつねに慈しみ深く運んでくれる。"
 the_seductress_omen: "誘惑の女神"
 the_seductress_omen_desc: "愛と誘惑は[ShowGodName('aphrodite_god')]の領分であり、その術と加護は多くの者を我らのもとへ引き寄せる。"
 giver_of_joy_omen: "歓びを授ける者"
 giver_of_joy_omen_desc: "美の女神の御前にあり、その加護を受けることほど至福なことはない。"
 nurturer_of_children_omen: "子らを育む者"
 nurturer_of_children_omen_desc: "女神の愛が最もよく表れるのは子供への愛であり、その母なる慈しみは我らすべてに及ぶ。"
 the_beautiful_omen: "美しき者"
 the_beautiful_omen_desc: "最も美しき女神たる[ShowGodName('aphrodite_god')]には、多くの者が心を寄せる。その加護があれば、我らもまた多くの者を惹きつけるであろう。"
 the_secretive_omen: "秘めたる者"
 the_secretive_omen_desc: "愛はすべて公になるものではない。慎みと秘密もまた、女神の力である。"
 the_harmonizer_omen: "和をもたらす者"
 the_harmonizer_omen_desc: "[ShowGodName('aphrodite_god')]の愛は、すべての者に等しく注がれる。我らが民に向ける愛もまた、かくあるべきである。"
 the_lover_of_laughter_omen: "微笑みを愛する者"
 the_lover_of_laughter_omen_desc: "[ShowGodName('aphrodite_god')]の面差しにはつねに微笑みがある。我らもまた、かくあるべきである。"
 the_desired_omen: "慕われし者"
 the_desired_omen_desc: "最も美しき女神たる[ShowGodName('aphrodite_god')]は、すべての者の心に慕情をかき立てる。ゆえにその加護を得れば、他者を惹きつけられるであろう。"
 #Poseidon
 tempest_omen: "暴風"
 tempest_omen_desc: "神の怒りが海を騒がせ、最も勇敢な船乗りすら脅かす嵐を呼び起こす。"
 lord_of_the_sea_omen: "海の王"
 lord_of_the_sea_omen_desc: "海を制することは、世界を制することにほかならない。"
 protector_of_horses_omen: "馬の守護者"
 protector_of_horses_omen_desc: "あらゆる馬の父なる神の加護のもと、我らの馬もまたよく育ち、たくましくなるだろう。"
 wielder_of_the_trident_omen: "三叉矛を振るう者"
 wielder_of_the_trident_omen_desc: "海神の矛ほどよく知られた武器はなく、その分かれた穂先の一撃こそ最善であることを示している。"
 earth_shaker_omen: "大地を震わす者"
 earth_shaker_omen_desc: "かの者が泉を湧かせるために大地を打ったように、わが国土を踏む敵もまた打ち倒されるであろう。"
 leader_of_the_nymphs_omen: "ニンフたちの長"
 leader_of_the_nymphs_omen_desc: "[ShowGodName('poseidon_god')]の加護は、そのニンフたちの加護をもたらし、あらゆる水辺と泉に祝福を授ける。"
 the_watcher_omen: "見張る者"
 the_watcher_omen_desc: "[ShowGodName('poseidon_god')]の眼はあらゆる海と水の上に注がれており、その眼差しを逃れるものは何一つない。"
 the_graceful_omen: "優美なる者"
 the_graceful_omen_desc: "海と波には美があり、それらを静かに見つめれば、心にもまた美が備わる。"
 master_of_the_waves_omen: "波を統べる者"
 master_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')]の許しなくしては、何人たりとも海を渡ることはかなわない。"
 dark_blue_haired_omen: "紺青の髪をもつ者"
 dark_blue_haired_omen_desc: "波は神自身の青き髪であり、その加護のもと、我らが船は速やかに進むであろう。"
 #Hermes
 messenger_omen: "報せを運ぶ者"
 messenger_omen_desc: "翼あるかかとは、あらゆる報せを速やかに、そして無事に届ける。"
 golden_wand_omen: "黄金の杖を持つ者"
 golden_wand_omen_desc: "カドゥケウスは二匹の蛇を引き離すために用いられた。だが、分かつものはまた結ぶものでもある。"
 god_of_travelers_omen: "旅人の神"
 god_of_travelers_omen_desc: "すべての旅人と行商人は、安全と守りを求めて[ShowGodName('hermes_god')]に祈る。"
 protector_of_merchants_omen: "商人の守護者"
 protector_of_merchants_omen_desc: "[ShowGodName('hermes_god')]の見守りのもと、商人たちは我らが地を安全に行き来し、多くの利を得るだろう。"
 wing_footed_omen: "翼脚の者"
 wing_footed_omen_desc: "[ShowGodName('hermes_god')]の加護により、わが軍は神のように速やかに進むであろう。"
 trickster_omen: "たばかる者"
 trickster_omen_desc: "風の移ろいは、[ShowGodName('hermes_god')]でさえ気まぐれであること、そしてあらゆるものが変化と欺きのもとにあることを示している。"
 patron_of_thieves_omen: "盗みの後援者"
 patron_of_thieves_omen_desc: "素早さは善行にも悪行にも使える。いずれにせよ、備えていて損のない資質である。"
 president_of_games_omen: "競技を司る者"
 president_of_games_omen_desc: "[ShowGodName('hermes_god')]の加護は競技に及び、それは我らに娯楽と健やかな鍛錬をもたらす。"
 guardian_of_the_gates_omen: "門を守る者"
 guardian_of_the_gates_omen_desc: "あらゆる道は門へと通じ、旅人はいずれそれをくぐることになる。門は通行を許すこともあれば、阻むこともある。"
 giver_of_wealth_omen: "富をもたらす者"
 giver_of_wealth_omen_desc: "[ShowGodName('hermes_god')]の加護のもと、交易は物品を動かすのみならず、富をもまた動かす。"
 #Ares
 throng_of_battle_omen: "戦場にある者"
 throng_of_battle_omen_desc: "あらゆる争いと戦いには[ShowGodName('ares_god')]が宿り、その結末を定めるのは彼の意志である。"
 insatiable_at_war_omen: "戦に飢える者"
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')]は戦に喜びを見出す。戦が長引き、多くの血が流れるほど、その加護は得やすくなる。"
 slayer_of_men_omen: "人を屠る者"
 slayer_of_men_omen_desc: "[ShowGodName('ares_god')]の怒りはわが兵とともにあり、その力は彼らの腕に宿るだろう。"
 plague_of_mankind_omen: "人の災厄"
 plague_of_mankind_omen_desc: "戦の神に立ち向かい、なお生き長らえられる者は、一人としていない。"
 warrior_omen: "戦士"
 warrior_omen_desc: "ただ殺すだけでは戦の神を満足させられない。必要なのは、栄光ある戦いである。"
 audacious_omen: "大胆なる者"
 audacious_omen_desc: "敵を打ち倒すべく戦いへ駆ける者は、必ずや[ShowGodName('ares_god')]の加護を得るであろう。"
 blood_soaked_omen: "血に染まる者"
 blood_soaked_omen_desc: "敵の血は流され、それを求める神に捧げられるだろう。" #Blood for the Blood God!
 malignant_omen: "邪悪なる者"
 malignant_omen_desc: "敵を滅ぼせるなら、卑劣にすぎる策などない。"
 indestructible_omen: "破れざる者"
 indestructible_omen_desc: "[ShowGodName('ares_god')]は、敵を討つための槍のみならず、自らを守るための盾も持っている。"
 fickle_lord_of_war_omen: "気まぐれなる戦の神"
 fickle_lord_of_war_omen_desc: "戦の形勢がいつ変わるかはわからない。だが、[ShowGodName('ares_god')]の加護があれば、それは必ず我らに有利なほうへ向かう。"
 #Athena
 unseen_hand_omen: "見えざる手"
 unseen_hand_omen_desc: "いかなる策も、ただ偶然によって破れるわけではない。天は侵攻軍を誤った判断へと導く。哨戒隊は待ち伏せに誘いこまれ、補給線は断たれ、部隊長たちは深く惑わされる。"
 unwavering_omen: "揺るがぬ者"
 unwavering_omen_desc: "[ShowGodName('athena_god')]が誇り高く不動であるように、我らもまた、いかなる疲れにも動じない。"
 she_who_fights_in_front_omen: "先陣に立つ者"
 she_who_fights_in_front_omen_desc: "敵の居場所へいち早く向かい、正面から戦うことこそ、敵を最も早く退ける道である。"
 the_industrious_omen: "勤勉なる者"
 the_industrious_omen_desc: "勤勉に励み、仕事に精を出すことこそ、利益と成果を得る最善の道である。"
 the_judge_omen: "裁く者"
 the_judge_omen_desc: "[ShowGodName('athena_god')]の行き届いた眼差しと叡智のもとでは、いかなる罪も見逃されず、罪なき者が不当に傷つけられることもない。"
 the_chieftain_of_war_omen: "戦を率いる者"
 the_chieftain_of_war_omen_desc: "蟻がたどる道を失えばあてもなく彷徨うように、軍勢もまた、正しい指揮と導きがなければ散り散りとなる。"
 teacher_of_the_waves_omen: "波の師"
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')]が波を統べるとしても、[ShowGodName('athena_god')]は船をもってそれを制した。"
 protector_of_the_anchorage_omen: "停泊地の守り手"
 protector_of_the_anchorage_omen_desc: "造船に長けた[ShowGodName('athena_god')]の加護のもと、我らが船は必ず守られる。"
 the_bright_eyed_omen: "慧眼の者"
 the_bright_eyed_omen_desc: "梟をしるしとする我らは、[ShowGodName('athena_god')]の加護と知恵を授かっている。"
 the_armed_one_omen: "武装せし者"
 the_armed_one_omen_desc: "生まれながらに武装した[ShowGodName('athena_god')]は、つねに戦いに備えることが最善の策だと示している。"
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip]は我らに微笑む"
 hellenism_religion.1.desc: "この平穏な日々にあっても、神々はいまだ我々に目を向けている。そのしるしは、不思議なめぐり合わせに、思いがけず訪れる幸運に、そして[ROOT.GetCountry.GetGovernment.GetCourtTitle]に広がる日々の暮らしに現れている。\n\n祭司たちは、[target_god.GetName]がわが[ROOT.GetCountry.GetFlavorRank]と敬愛する[target_character.GetNameWithNoTooltip]に微笑みかけていると告げている。実際、我らの運は好転しつつあり、これまで捧げてきた供犠も、ようやく我らの運命を動かしはじめたようだ！"
 hellenism_religion.1.a: "この祝福を受け入れよう。"
 fertile_ruler_and_family_tt: "[target_character.GetName]とその[consort|e]の[fertility|e]が上昇する"
 hellenism_religion.2.title: "[target_character.GetNameWithNoTooltip]の鷲"
 hellenism_religion.2.desc: "わが[ROOT.GetCountry.GetFlavorRank]の父祖が重んじてきた軍の伝統を、[target_character.GetName]ほど鮮やかに体現する者がほかにあろうか。知略、忍耐、そして勇気において、オデュッセウスやイアソン、アイアスに並ぶ者はほとんどいない。\n\nだが、[target_character.GetShortNameWithNoTooltip]こそ、我らが[ShowReligionAdjective('hellenism_religion')]の伝統を重んじてきたことの誇るべき証であり、まさしく戦場の鷲である！"
 hellenism_religion.2.a: "神々の加護がなくとも、同じことが言えるか？"
 hellenism_religion.2.b: "士官学校で教鞭を執らせよ！"
 hellenism_religion.3.title: "[target_location.GetNameWithNoTooltip]の哲学部門"
 hellenism_religion.3.desc: "人の魂はどこから来るのか。死の後には何が待つのか。羽根のない二足動物として生きるほうが幸福なのか。こうした切実な問いが、[target_location.GetName]の[ShowBuildingTypeName('university')]に集う知識人や哲学者たちの心を捉えている。\n\n最近、この学部は地元の富裕な後援者の支援を受けるようになった。その人物はいま、この場が最先端の革新的な考えを広める助けになると主張し、さらなる資金を求めている。"
 hellenism_religion.3.a: "ディオゲネスのような者を育てないならよいが……"
 hellenism_religion.3.b: "金があるとでも想像しておけばいい。"
 hellenism_religion.4.title: "[target_character_2.GetNameWithNoTooltip]のためのお守り"
 hellenism_religion.4.desc: "敵は昼夜を問わず我らを滅ぼそうと謀っている。だが、[target_character_2.GetName]が生きているかぎり、後継に不安はない。わが[ROOT.GetCountry.GetFlavorRank]の未来は、そのか弱い手に委ねられている。\n\nオリュンポスの神々の輝きを受けた[target_character_2.GetShortNameWithNoTooltip]が、大いなる運命を背負うことは疑いない。わが国の廷臣の一人である神秘家[target_character_3.GetName]が、お守りを譲りたいと申し出た。それには神の精髄が一滴だけ込められており、幼い[target_character_2.GetShortNameWithNoTooltip]が成人するまで、あらゆる災いを退けてくれるのだという。"
 hellenism_religion.4.a: "[target_character_2.GetShortNameWithNoTooltip]に代わって、[target_character_3.GetShortNameWithNoTooltip]に礼を述べよう。"
 hellenism_religion.4.b: "そのような迷信などどうでもいい！"
 talisman_tt: "幼い[target_character_2.GetName]に贈られたお守りは、病にまつわる[events|e]や狩猟中の事故から[target_character_2.GetHerHim]を守ることがある"
 target_character_3_is_declined_tt: "[target_character_3.GetName]の申し出は丁重に断られる"
 hellenism_religion.5.title: "[target_god.GetNameWithNoTooltip]を称える[target_province.GetNameWithNoTooltip]"
 hellenism_religion.5.desc: "喜ばしい報せが[target_province.GetName]から届いた。人々は[target_god.GetName]を称えて通りへ繰り出している。これまでにないほど敬虔な思いから、土地の者たちは自ら祭りを催し、このたびの幸運に拝謝しようとしている。\n\nこの日ばかりは、統治の重荷も少し軽く感じられる。神々は称えられ、群衆は歓声を上げ、信仰はオリュンポス山のアンブロシアのように州内に広がっていく。"
 hellenism_religion.5.a: "祝祭を許そう。"
 every_pop_in_target_province_gains_10_satisfaction_tt: "[target_province.GetName]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 hellenism_religion.6.title: "輝ける日々"
 hellenism_religion.6.desc: "オリュンポスの神々の敬虔な導きのもと、[target_character.GetName]の治世はかつてない高みに達した。善政、富の分かち合い、そして安定と平和に満ちた日々は、神々が我らに授けた恵みの一部である。いまはまさに、人々が[target_character.GetShortNameWithNoTooltip]の名を唱え、ヘラクレスやペリクレスのごとき伝説的人物と並べて後世に伝える、黄金の時代と言えるだろう。"
 hellenism_religion.6.a: "この繁栄を政務に注げ！"
 hellenism_religion.6.b: "外交をもって世界を意のままにしよう。"
 hellenism_religion.6.c: "敵を粉砕せよ！"
 hellenism_religion.7.title: "[ShowGodNameWithNoTooltip('ares_god')]の化身"
 hellenism_religion.7.desc: "火と硫黄、そして血にまみれた叫びが、[target_character.GetName]の行く先につきまとう。この[target_character.GetWomanMan]は幼いころから武人として知られ、敵を倒す才を幾度となく示してきた。\n\nいまや兵からは[ShowGodName('ares_god')]の化身と呼ばれる[target_character.GetSheHe]は、わが[ROOT.GetCountry.GetFlavorRank]の名のもとに各地をめぐり、破壊をもたらす運命にある。"
 hellenism_religion.7.a: "勝者とはすべてを犠牲にする者なのだと、[target_character.GetSheHe|U]は心得ている。"
 hellenism_religion.7.b: "あのような破滅的な力を解き放つわけにはいかない……"
 hellenism_religion.8.title: "[ShowCultureNameWithNoTooltip('greek_culture')]史の叙事詩"
 hellenism_religion.8.desc: "ホメロスの叙事詩は長きにわたり、文化と学びの発展を導き、我々の伝統を伝える珠玉として受け継がれてきた。\n\nこの遺産に敬意を表し、[target_character.GetName]は『イリアス』と『オデュッセイア』に関する研究や著作の刊行を後援したいと申し出ており、伝説の書をひもとく許しを得られるなら、我らが栄光ある過去を称えたいと望んでいる。"
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"
 hellenism_religion.9.title: "豊穣なる[target_province.GetNameWithNoTooltip]"
 hellenism_religion.9.desc: "州全体に繁栄が広がっていることから見ても、[target_province.GetName]が神々の加護を受けているのは明らかである。先日、探鉱者や地元の事業者たちが、周辺の村々を顧みず、州内で生じた富を都市に集める案を持ってきた。これは都市化を促すであろうが、その地の民は富を享受できなくなる。"
 hellenism_religion.9.a: "この富は民のものだ！"
 hellenism_religion.9.b: "力を集中させよ。"
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "前述の[provinces|e]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%]上昇する"
 hellenism_religion.10.title: "[ROOT.GetCountry.Custom('GetDemeterMomName')]の祝福"
 hellenism_religion.10.desc: "[target_market.GetName]各地の穀物庫は、しばらく前から豊かに満たされている。これは、収穫の女神[ROOT.GetCountry.Custom('GetDemeterMomName')]が我らを見守っている証にほかならない。このたびの繁栄もまた、神の加護を示す新たなしるしである。土地の者たちは余った食糧を分け与えるよう願い出ており、司祭たちはさらなる奉納こそふさわしいと説いている。"
 hellenism_religion.10.a: "民に与えよ。"
 hellenism_religion.10.b: "神々に捧げるべきだ。"
 Demeter_latin_name: "セレス"
 Demeter_base_name: "デメテル"
 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip]の不興"
 hellenism_religion.11.desc: "どうやら、[target_god.GetName]は我らにひどく不興を抱いているようだ。夜更けに現れる不吉な兆し、消えずに残る影、そして日ごとに強まる破滅の予感が、民のあいだに広がっている。かくも強大な神の怒りを招いた理由は知る由もないが、その加護を取り戻す道はただ一つ。謹んで頭を垂れ、神々を敬うことのみである。"
 hellenism_religion.11.a: "人生とはそういうものだ。"
 hellenism_religion.11.b: "直ちに盛大な奉納をおこなえ。"
 hellenism_religion.12.title: "忌まわしきものの誕生"
 hellenism_religion.12.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]はひっそりと静まり返っている。[ROOT.GetCountry.GetGovernment.GetAdjective]の館の産室にて、[target_character_1.GetName]の子が、不安に満ちた祈りと眠れぬ夜のうちに生まれた。その子は、凶運そのものを伴ってこの世に現れたのである。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]はこれを凶兆と呼び、召使いたちは呪いと呼び、我々の敵は弱みと呼ぶであろう。だが、[target_character_2.GetShortName]はいまだ息をしており、この忌まわしき子の運命が、我らの家筋を左右するやもしれない……"
 hellenism_religion.12.a: "愚か者どもめ！ [target_character_2.GetShortNameWithNoTooltip]はただの子供にすぎない！"
 hellenism_religion.12.b: "神の怒りを招くわけにはいかない。"
 hellenism_religion.13.title: "腐敗した司祭"
 hellenism_religion.13.desc: "神々は永遠であろうとも、そのしもべは生身の人間にすぎない。[target_character.GetName]が聖職を私腹を肥やす手立てとし、本来は供物だけが捧げられるべき場で、付け届けや金銭を受け取っているとの報せが届いている。\n\nこれに介入すれば、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は侮辱された、恥をかかされたと騒ぎ立てるだろう。だがこれを見過ごせば、わが[ROOT.GetCountry.GetFlavorRank]にいる策士どもに、敬虔もまたひとつの商いにすぎないと思わせることになり、ひいては神々をも侮辱することになりかねない。"
 hellenism_religion.13.a: "かの者の強欲が、我らすべてを滅ぼす！"
 hellenism_religion.13.b: "見て見ぬふりをせよ。"
 hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip]における[target_god.GetNameWithNoTooltip]の軽視"
 hellenism_religion.14.desc: "[target_province.GetName]から気がかりな報せが届いている。[target_god.GetNameWithNoTooltip]の祭儀はおろそかにされ、供物は滞り、信徒たちは神殿の扉がもはや定めのとおりに開かれなくなったと不満を漏らしている。\n\nそれが怠慢によるものか、貧しさによるものか、それともひそかな反抗によるものかは、さほど問題ではない。神がないがしろにされていると言われれば、やがてあらゆる不幸が神の怒りのせいとされる。司祭たちは対処を求めており、[target_province.GetNameWithNoTooltip]は我らの判断を待っている。"
 hellenism_religion.14.a: "力ずくで信仰を示させよ。"
 hellenism_religion.14.b: "鞭で民を従わせはしない。"
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "[target_province.GetName]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]上昇する"
 riots_destroy_temple_desc: "群衆が暴れ出し、神殿が襲われる。夜明けには、焼け焦げた石だけが残っていた。"
 riots_cause_minimal_damage_desc: "通りには騒ぎと怒号が満ちるが、最悪の事態は避けられた。"
 hellenism_religion.15.title: "対立する予言"
 hellenism_religion.15.desc: "ああ、[ShowGodName('zeus_god')]よ！ 何たることだ！ 予言者たちは同じ兆しを読みながら、そこから導かれた警告はまるで異なっている。しかも、どちらも少しも疑わぬ口ぶりだ。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]は難しい判断を迫られている。わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]がこれほどはっきりと割れていては、人々はどう思うだろうか。我々は道を誤ったのか？ この兆しをどう解釈しようと、それがもたらす結果からは逃れられない……"
 hellenism_religion.15.a: "老人どもの小言には、もううんざりだ！"
 hellenism_religion.16.title: "神々の怒り"
 hellenism_religion.16.desc: "宮廷では争いが起こり、司祭たちは神々が我らを見ていると言い張っている。彼らは各地に散らばる領土と、遠方にまで行き届かぬ支配を見て、驕りは神の戒めを招くのだとつぶやいている。\n\nもし神々が我らの脆さを思い知らせようとしているのなら、丁重な書状など寄こしはしない。嵐と炎と恐怖をもって、最も痛むところを打つだろう。"
 hellenism_religion.16.a: "嵐が早く過ぎ去ることを願う。"
 hellenism_religion.17.title: "パンドラの箱"
 hellenism_religion.17.desc: "奇妙な品が[target_province.GetName]に持ち込まれ、人々は訳知り顔の笑みを浮かべながら、度胸試しの種としてその品を手から手へと渡している。害はないと言い切る者もいれば、不吉な品であり、不用心な者を誘い、驕る者を罰するのだと言い張る者もいる。\n\nそれが本当に呪われた品なのか、それともただ騒ぎの火種にすぎないのかはともかく、不幸は多くの者が信じれば現実のものとなりうる。現地の司祭のなかには、その箱には血のように赤く、苦痛にゆがんだ顔めいたものが浮かんでいると報告する者までいる。"
 hellenism_religion.17.a: "迷信など相手にはしない。"
 hellenism_religion.17.b: "金を払って封印させよ。"
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName]とその住民が神罰を免れる"
 hellenism_religion.18.title: "最も暗い夜に"
 hellenism_religion.18.desc: "夜がいつもより長く感じられる。わが[ROOT.GetCountry.GetFlavorRank]のいたるところで、人々は破滅や飢え、敗北について口にし、神々が我らを見放しつつあるのだと嘆いている。我々がいま、穏やかならぬ時期にあることは明らかだ。それが我ら自身の至らなさによるのか、あるいはオリュンポスの神々を怒らせたためなのかは定かでない。\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]もまた、こうしたささやきから逃れることはできない。国の土台が揺らげば、いかに強き冠といえども重く感じられるものである。"
 hellenism_religion.18.a: "我らはもはや絶望のなかにある。"
 hellenism_religion.18.b: "ならば、供物を捧げよう。神々が聞き入れてくれればよいが。"
 hellenism_religion.19.title: "恐怖と飢え"
 hellenism_religion.19.desc: "動揺は、どんな疫病よりも早く広がる。こちらで凶作があれば、あちらで思いがけぬ災いが起こり、たちまち誰もが不吉な話を語り出す。土地の者たちを鎮めようと力を尽くしてはいるが、不吉な兆しだと思われるものがいくつか重なるだけで、集落全体が取り乱してしまうらしい。\n\n恐怖は導いてやらねば、やがて反抗へ変わると司祭たちは言う。[target_province.GetName]の人々は我々に確かな答えを求めている。たとえそれが、代価を必要とするものだとしても。"
 hellenism_religion.19.a: "重荷は土地に負わせよ。"
 hellenism_religion.19.b: "なだめて、痛手を和らげよ。"
 sacrifice_to_the_gods: "神々をなだめる"
 hellenism_religion.20.title: "戦を好まぬ神々"
 hellenism_religion.20.desc: "すべての神が流血を喜ぶわけではない。[target_war.GetName]が長引くにつれ、司祭たちは、天が我らの大義から遠ざかりつつあると警告している。他の神々は[ShowGodName('ares_god')]とは違い、どのような大義名分があろうとも、あらゆる争いを許しはしない。\n\n兵たちは我らの旗のもとで気勢を上げているが、民は疲れ果て、いまやあらゆる苦難が神々の不興のせいとされている。こうしたときには、勝利でさえ罰のように思われる。しかもその行き着く先は遠く、定かではない……"
 hellenism_religion.20.a: "神々の不興は甘んじて受けよう。"
 hellenism_religion.21.title: "祭儀をおろそかにする[target_location.GetNameWithNoTooltip]"
 hellenism_religion.21.desc: "とりわけ世が穏やかで、暮らしが豊かなときには、人々が神々への務めを忘れてしまうのも無理はない。[target_location.GetName]では祭儀が次第に形ばかりのものとなり、行列は小さくなり、供物は減り、古くからの歌も心を込めずに歌われている。\n\n司祭たちは、誰かを見せしめにすべきだと求めている。もしこの都市が自ら進んで神々を敬わないのであれば、恐れによってそうさせるほかあるまい。いずれにせよ、我らの信仰を衰えさせるわけにはいかない。"
 hellenism_religion.21.a: "民草に思い知らせよ。"
 hellenism_religion.21.b: "支配層は安穏に過ぎる。"
 hellenism_religion.21.c: "放っておけ。危険は承知の上だ。"
 pops_go_unpunished_gods_angry_tt: "罰を下さねば、神々の怒りを招く。"
 hellenism_religion.22.title: "都における鳥占い"
 hellenism_religion.22.desc: "[target_character.GetName]はいまや都の噂の的である。風変わりな身なりをしているが、未来を読む非凡な力があると触れ回っている。鳥や骨を使い、吉凶を問わず神々の意志を読み取れると豪語しているのだ。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]ではこれを笑う者もいるが、ひそかに金を払う者もいる。たとえ愚かな予言であっても、何かの役には立つかもしれないと、この奇妙な占いに期待しているのである。"
 hellenism_religion.22.a: "[target_character.GetNameWithNoTooltip]よ、好きにわめいておけ！"
 hellenism_religion.22.b: "恥さらしめ。"
 birds_divinations_come_true_desc: "兆しは重なり、幸運がそれに続く。[ROOT.GetCountry.GetGovernment.GetCourtTitle]はこれを証と見ている。"
 the_divinations_lie_desc: "何も起こらない。鳥は鳥のままであり、[ROOT.GetCountry.GetGovernment.GetCourtTitle]はいら立ったままである。"
 hellenism_religion.23.title: "聖地の拡大"
 hellenism_religion.23.desc: "司祭たちは、聖地そのものを作り変えるような大がかりな提案を持ち出してきた。[target_location.GetName]の神殿をはじめ、各地の神殿を広げ、堂を増やし、中庭を飾り立てることで、信徒たちが再び神々の威厳を感じられるようにしようというのである。\n\nだが、石はひとりでに動かず、職人も祈りだけでは働かない。この拡張を金で賄うにせよ、民に負担を負わせるにせよ、そのしわ寄せは必ずどこかに及ぶだろう。そして神々もまた、我々がどのようにその代価を払ったかを、きっと見ておられる。"
 hellenism_religion.23.a: "拡張の費用は負担しよう。"
 hellenism_religion.23.b: "その負担は民に担わせよ。"
 hellenism_religion.24.title: "迷信"
 hellenism_religion.24.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]には不安が広がりつつあり、とりわけ[target_character.GetName]の心に深く影を落としている。小さな兆しも大きな前触れとされ、夢は警告と受け取られ、ただの偶然さえ天からのしるしと思われている。\n\nこのような恐れは、用心深さを生むうちは役に立つが、行動する意志をむしばむこともある。[target_character.GetShortNameWithNoTooltip]がこうした考えを振り払えないなら、わが国の統治はまもなく理ではなく迷信に左右されることになるだろう。"
 hellenism_religion.24.a: "軽率であるより、慎重であるほうがよい。"
 hellenism_religion.24.b: "迷信にとらわれず、物を考えねばならない。"
 hellenism_religion.25.title: "戦のための供犠"
 hellenism_religion.25.desc: "戦はあらゆるものを呑み込む。先行きが見えなくなれば、歴戦の兵でさえ天を仰ぐようになる。司祭たちは、[target_war.GetName]での戦いは武力だけで決まるものではなく、この先に待つ苦難を耐え抜くには、神々を敬わねばならないと説いている。\n\nそこで、大がかりな供犠が提案されている。神々の心を動かし、民の心を奮い立たせるためのものだ。これを断れば金は残る。だがその代わりに、兵のあいだに疑いがくすぶり、神々の目に黙する我々の姿だけが映ってしまうおそれがある。"
 hellenism_religion.25.a: "予算は出し惜しみしない。"
 hellenism_religion.25.b: "芝居じみたことをせずとも勝てる。"
 we_will_win_the_ongoing_conflict_without_gods_tt: "進行中の戦いに勝つため、神がかりの迷信には頼らない"
 hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip]よ、我らの願いを聞き届けたまえ"
 hellenism_religion.26.desc: "香は濃く立ちこめ、賛歌は高らかに響き、祭壇には供物が絶えることはない。司祭たちは、こうした務めによって我らの祈りがオリュンポスに届き、神々はいまや願いに応じるほど近くにいるのだと説いている。\n\nだが、神々の恵みは決して無条件ではない。いまここで祝福を願うのであれば、[target_god.GetName]が代価を求め、その答えがわが[ROOT.GetCountry.GetFlavorRank]の行く末を変えてしまうかもしれないということを受け入れねばならない。"
 hellenism_religion.26.a: "[target_god.GetNameWithNoTooltip]の答えを待とう。"
 hellenism_religion.26.b: "神々の裁きを招くわけにはいかない。"
 gods_reward_our_piety_tt: "[target_god.GetName]が我らの信心に報いて[gold|e]を授ける"
 gods_imbue_stability_tt: "[target_god.GetName]の加護により、[stability|e]が増加する"
 gods_sent_capable_character_tt: "[target_character_2.GetName]を通じて[target_god.GetName]が顕現する"
 hellenism_religion.27.title: "哲学者の逆説"
 hellenism_religion.27.desc: "[target_character.GetName]という辛辣な哲学者が、[ROOT.GetCountry.GetGovernment.GetCourtTitle]で持論を語るようになり、確かなことまで疑わしくしている。当たり前のことまで解きほぐされていくので、廷臣たちは面白がりながらも不安を覚えつつ、その話に耳を傾けている。\n\n知恵は恵みにもなるが、権威を顧みぬときには厄介でもある。もしこの思想家に好きに語らせれば、[ROOT.GetCountry.GetGovernment.GetCourtTitle]はより賢くなるかもしれない。だが、落ち着きを失うおそれもある。思想はいったん広まれば、その場のなかだけには留まらないからだ。"
 hellenism_religion.27.a: "議論は続けさせよう。"
 hellenism_religion.27.b: "たわ言はうんざりだ。その者を追い払え。"
 hellenism_religion.28.title: "[ShowGodNameWithNoTooltip('athena_god')]の知恵"
 hellenism_religion.28.desc: "平時には野心も静まり、思慮が重んじられ、司祭たちは[ShowGodName('athena_god')]のことを語るものだ。彼らは、知恵は単なる美徳ではなく、[ROOT.GetCountry.GetFlavorRank]が戦に気を取られていないときにこそ磨かれる武器でもあると説いている。\n\nいま我らの前には、費用はかかるが理にかなった提案が差し出されている。それは無駄を正し、疑いを晴らすものだという。これを退ければ金は残るが、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は、我らが女神の教えに背を向けたことを忘れないだろう。"
 hellenism_religion.28.a: "知恵の対価を払おう。"
 hellenism_religion.28.b: "考えることまで女神に頼るつもりはない。"
 because_athena_omen_active_desc: "現在有効な[ShowGodName('athena_god')]の[omen|e]により、[religious_unity|e]に応じて変動する"
 if_athena_omen_was_active_tt: "現在[ShowGodName('athena_god')]の[omen|e]が有効であれば、この[event_option|e]のボーナスはさらに大きくなる"
 our_denial_angers_the_clergy_tt: "提案を退ければ、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の怒りを買うことは避けられない"
 hellenism_religion.29.title: "供犠を求める[target_god.GetNameWithNoTooltip]"
 hellenism_religion.29.desc: "司祭たちは深刻な面持ちで現れ、我らが[ROOT.GetCountry.GetFlavorRank]は神の不興を買っているのだと、声を強めて訴えている。兆しはすでに明らかであり、災いが大きくなる前に神の加護を取り戻したければ、[target_god.GetName]へ供犠を捧げるしかないのだという。\n\n金は最も手軽な供物であり、ためらわずに差し出すこともできる。だが、オリュンポスが金だけで満足することはめったにない。より大きな供犠を選べば、いっそう大きな加護を得られるかもしれない。だがその代わりに、この地には傷が残り、誰がそれを命じたのかを民は忘れないだろう。"
 hellenism_religion.29.a: "祭壇に黄金を供えよう。"
 hellenism_religion.29.b: "その負担は土地に負わせよう。"
 hellenism_religion.29.c: "要求を拒否する。"
 hellenism_religion.30.title: "傭兵崇拝"
 hellenism_religion.30.desc: "[target_province.GetName]で、土地の者たちが奇妙な噂を不安げに言い交わしている。旅人が運んできたその噂によれば、ある教団がひそかに勢力を広げているという。それは傭兵の流儀を崇め、何よりも力を尊び、秘密の儀式と庇護の約束によって信徒を集めている。その有力者の一人である[target_character.GetName]は、かつて傭兵であった者として彼らの代弁者となり、わが[ROOT.GetCountry.GetFlavorRank]の政の場に加わって、その信仰をわが国の利に変えられると主張している。\n\nだが、闇でささやかれる噂は、この教団が支配をもくろみ、尽きることのない権力欲を抱いていることを示している。これを迎え入れれば、信仰の薄いところで影響力を得られるかもしれない。だがその一方で、隠れた腐敗をわが[ROOT.GetCountry.GetGovernment.GetCourtTitle]の中枢へ招き入れることにもなりかねない。"
 hellenism_religion.30.a: "迎え入れよう。だが、目は離すな。"
 hellenism_religion.30.b: "やつらを闇へ追いやれ。"
 cult_operates_shadows_tt: "教団が今後も闇のなかで活動を続ける……"
 hellenism_religion.empty: ""
 # Neoplatonism Events
 hellenism_religion.32.title: "万有の源泉"
 hellenism_religion.32.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の哲学者が、類まれな野心に満ちた著作を完成させた。その書は、冷静かつ徹底した筆致でこう論じている。第一原理——すべての神々と万物が、尽きることなき太陽から放たれる光のように流れ出る源——は、神々のうちの一柱ではなく、神性そのものの根底である、と。古来の神々の体系はなお実在する。しかし、個々の神は、言葉では尽くせぬその唯一の源の一側面であり、そこから流れ出たものである。秩序は知性へ、知性は魂へ、魂は物質へと流れ下る。\n\nその論考は、すでに[ROOT.GetCountry.GetGovernment.GetCourtTitle]内で書き写されている。この思想はすでに人々のあいだで息づいており、わが国が関与しようとしまいと広まっていくだろう。"
 hellenism_religion.32.a: "写本を作らせ、各地へ配布せよ。"
 hellenism_religion.32.b: "その思想の価値は、おのずと示されよう。"
 hellenism_religion.33.title: "キリスト教をめぐる問い"
 hellenism_religion.33.desc: "ひとりの博学な司教が[ROOT.GetCountry.GetGovernment.GetCourtTitle]を訪れた。剣を帯びず、不服を訴えに来たのでもない。その目的は、ただ問いを投げかけることにある。プラトン哲学に生涯を捧げてきた[target_character.GetName]は、キリスト教徒の神と哲学者たちの第一原理は同一であると、静かな確信をもって説く。三位一体とは、「一者」「知性」「魂」という三つの原理を別の言葉で表したものにすぎないと主張する。\n\nその論には確かな説得力があり、[target_character.GetShortNameWithNoTooltip]は、あらゆる反論をすでに聞き尽くした者のように、慎重かつ落ち着いた口調で語る。わが国が議論に応じるにせよ、拒むにせよ、この訪問は[ROOT.GetCountry.GetCapitalName]の内外で見過ごされることはないだろう。"
 hellenism_religion.33.a: "対話を歓迎する。思想は病ではない。"
 hellenism_religion.33.b: "その考えを退けよ。第一原理は彼らの神ではない。"
 hellenism_religion.34.title: "世界霊魂"
 hellenism_religion.34.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]の哲学者たちは「世界霊魂」について語っている。それは第一原理から流れ出し、生けるものすべての内を巡り、野と川、身体と息吹に命を与えるものである。哲学者たちは、偉大なる二柱の神々を、海と空の支配者としてではなく、この霊魂の対をなす側面として理解すべきだと説く。すなわち、万物を動かし、つねにその源へと還っていく力である。\n\n季節に恵まれた[target_province.GetName]では、人々もこの説を肌で感じているようだ。豊かに実るこの土地は、哲学者たちによれば、目に見える形となった摂理であり、「一者」と調和した世界霊魂の現れであるという。"
 hellenism_religion.34.a: "土地を守り育てよ。土地をいたわることは、霊魂をいたわることだ。"
 hellenism_religion.34.b: "神学宣言を出し、その教義を文書にせよ。"
 hellenism_religion_34_work_of_art: "宇宙霊魂"
 hellenism_religion_34_work_of_art_desc: "プラトン哲学をめぐる神学研究。世界霊魂はあらゆる生けるものに命を与える力であり、自然の内を流れ、源である「一者」へと還っていくと論じる。"
 hellenism_religion.35.title: "昇りゆく魂"
 hellenism_religion.35.desc: "一世代の思想を静かに導いてきた哲学者、[target_character.GetName]が死の床にあるとの報せが[ROOT.GetCountry.GetGovernment.GetCourtTitle]に届いた。この数週間、[target_character.GetSheHe]は休むことなく教えを説きつづけている。その教えは書物に基づくものではなく、自らの観想から生まれたものである。[target_character.GetSheHe]は慎重に言葉を選びながら、魂が昇る三つの段階を語っている。まず魂が物質から離れ、次に理性の働きが「知性」と合致し、最後にあらゆる思考を超え、あらゆる存在を超えて、「一者」そのものと合一する瞬間に至るという。\n\n統治者は、その場に立ち会うよう招かれている。[target_character.GetShortNameWithNoTooltip]が望んでいるのはただ、その教えが失われぬことだけである。"
 hellenism_religion.35.a: "[target_character.GetSheHe]の最期の言葉を書き記し、広く伝えよ。"
 hellenism_religion.35.b: "[target_character.GetSheHe]の名を冠した学びの場を設けよ。"
 target_character_ascends_to_the_one_tt: "[target_character.GetName]は語りうることをすべて語り終え、安らかに息を引き取った。"
 hellenism_religion.36.title: "オリンポス復古派"
 hellenism_religion.36.desc: "[ROOT.GetCountry.GetFlavorRank]の誰もが、新たな神学を受け入れたわけではない。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]のなかでは、[target_character.GetName]が表立って率いる一派が反対の声を強めている。彼らの主張は単純で、理性ではなく腹の底に訴えるものだ。民に必要なのは、ゼウス、アテナ、アレス、ポセイドンである。象徴ではない。何かの現れでもない。名を呼ぶことも、願いを届けることも、喜ばせることもできない、言葉に尽くせぬ原理の一側面でもない。必要なのは、顔をもち、神殿をもち、供犠を求める、オリンポスの神々なのである。\n\n[target_character.GetName]は、抽象的な「一者」に我らの声は届かず、古き神々はそれに応えてくれるのだと断言する。[target_character.GetSheHe]は、一元論の教義を廃し、伝統的な崇拝へ戻ることを公然と求めている。"
 hellenism_religion.36.a: "教義を守れ。その一派を黙らせよ。"
 hellenism_religion.36.b: "正式な討論を認めよう。双方に語らせるのだ。"
 hellenism_religion.36.c: "一元論の教義を廃し、オリンポスの信仰へ立ち返るのだ。"
