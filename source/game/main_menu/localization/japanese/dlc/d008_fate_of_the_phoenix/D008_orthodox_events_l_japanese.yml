l_japanese:
 d008_orthodox_events.1.title: "[actor.GetNameWithNoTooltip]からの提案"
 d008_orthodox_events.1.desc: "[actor.GetLongName]の使節団が、わが国の[ROOT.GetCountry.GetGovernment.GetCourtTitle]を訪れた。彼らは自国にある見事なイコンのひとつ、[target.GetName]を我らに貸し出したいと申し出ている。もちろん、これには相応の代価を要するが、両国の関係をいっそう深めることにもなるだろう。"
 d008_orthodox_events.1.a: "申し出を喜んで受けよう。"
 d008_orthodox_events.1.b: "すでにひとつあると伝えよ。"
 d008_orthodox_events.2.title: "提案の受諾"
 d008_orthodox_events.2.desc: "栄えある[target_country.GetLongName]は、[target.GetName]を貸し出すという我々の寛大な申し出を受け入れ、すでに代価を送ってきた。これは両国の関係をいっそう深めるだろう。あとは、時が来たときにイコンを返してくれることを願うばかりである。"
 d008_orthodox_events.2.a: "それまでのあいだ、丁重に扱ってくれたまえ。"
 d008_orthodox_events.3.title: "提案の拒否"
 d008_orthodox_events.3.desc: "不信心な[target_country.GetName]の愚か者どもは、[target.GetName]を貸し出そうという我らの申し出を拒んだ。我々は誠意をもってこの申し出をしたのだが、これを拒んだことで、彼らには信仰も善良さもないことが明らかとなった。[ROOT.GetCountry.GetReligion.GetName]そのものを拒絶する者でもなければ、[ShowWorkOfArtTypeName('icon')]を拒むような真似はできまい。"
 d008_orthodox_events.3.a: "地獄に落ちるがいい！"
 d008_orthodox_events.4.title: "[target_art.GetNameWithNoTooltip]の貸与期間終了"
 d008_orthodox_events.4.desc: "[origin_country.GetName]から借り受けていた[ShowWorkOfArtTypeName('icon')]の貸与期間が終了した。ゆえに[target_art.GetName]を元の所有者へ返還せねばならず、相手も当然そうするものと考えている。しかしながら、これを「なくした」ことにして、返還せずに済ませることもできる。"
 d008_orthodox_events.4.desc_no_country: "[target_art.GetName]は、しばらく前から我らの手元にある。もとは貸与されたものであったが、本来の所有者はもはや独立国として存在していない。そのため、いまとなってはこれを返還すべき相手もいない。"
 d008_orthodox_events.4.a: "定めどおりに返還する。"
 d008_orthodox_events.4.b: "これはもはや我らのものだ！"
 d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.5.desc: "[target_art.GetName]の[target_country.GetLongName]への貸与は、その期限を迎えた。彼らは然るべき儀礼をもってこれを我らに返還し、取り決めをきちんと守った。"
 d008_orthodox_events.5.a: "まともな[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]国ならそうして当然だ。"
 d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.6.desc: "[target_art.GetName]の[target_country.GetLongName]への貸与は、その期限を迎えた。だが、[target_country.GetName]の豚どもは返還を拒み、その理由として苦しい言い訳を並べている。"
 d008_orthodox_events.6.a: "この侮辱、必ず償わせてやる！"
 d008_orthodox_events.7.title: "[target_art.GetNameWithNoTooltip]の座"
 d008_orthodox_events.7.desc: "[ShowReligionGroupName('christian')]の中心たる五総主教座のひとつ、[target_pentarchy.GetName]はいまや我らの手にある。[target_patriarch.GetName]がその座に就き、我々は[ShowReligionAdjective('orthodox')]の栄光を世に示すであろう。"
 d008_orthodox_events.7.a: "五総主教座は我らのものだ！"
 d008_orthodox_events.8.title: "[target_pentarchy.GetNameWithNoTooltip]の喪失"
 d008_orthodox_events.8.desc: "[target_pentarchy.GetName]は我らの手から奪われ、それがもたらしていた力と威信もまた失われた。神は我らを見捨てたのか。この喪失は、[ROOT.GetCountry.GetName]の[ShowReligionAdjective('orthodox')]教会に大きな打撃を与えるだろう。"
 d008_orthodox_events.8.desc_all_pentarchy: "[target_pentarchy.GetName]を失ったことで、もはや我らは五総主教座のすべてを支配しておらず、その体制は崩れた。信仰の力を保つには、五つの座すべてを再び我らの旗のもとに収めねばならない。"
 d008_orthodox_events.8.a: "必ずや奪い返さなくては！"
 downgrade_pentarchy_modifier_tt: "支配下にある五総主教座からの効果の増加は得られなくなる"
 d008_orthodox_events.9.title: "五総主教座の復活"
 d008_orthodox_events.9.desc: "[target_pentarchy.GetName]を手にしたことで、五総主教座のすべての座が我らの支配下に入った。かつてはまとまりを欠いていた諸座も、いまや我らの権威のもとにひとつとなった。異教徒や異端者の手に落ちていた座ですら、我らの手で教会へと取り戻されたのだ。教会は再びひとつとなり、その歩みを導くのは我らの総主教たちだ。"
 d008_orthodox_events.9.a: "教会は再びひとつとなるのだ。"
 upgrade_pentarchy_modifier_tt: "支配下にある五総主教座の効果が増加する"
 pentarchy_unlocked_abilities_tt: "[actions|e]「[ShowGenericActionName('D008_mend_schism')]」および「[ShowGenericActionName('D008_restore_rome_primacy')]」を実行できるようになる"
 d008_orthodox_events.10.title: "分裂の修復"
 d008_orthodox_events.10.desc: "[ShowLocationName('rome')]と[ShowLocationName('constantinople')]の総主教が分かれて以来、[ShowReligionGroupName('christian')]の根幹を蝕む教会の分裂が何世紀にもわたってくすぶりつづけてきた。西方教会の分離は、キリストの言葉を歪めるばかりであり、それを喜んだのは悪魔だけであった。\n\nいまや五総主教座のすべてが我らの権威のもとにあり、東西の総主教たちは再び同じ教会に結ばれ、見解を同じくしている。なお、真の教会の正しさを認めようとしない異端者は多いが、すべての羊が真の羊飼いのもとへ帰るのも、もはや時間の問題だ。"
 d008_orthodox_events.10.a: "[ShowReligionGroupAdjectiveWithNoTooltip('christian')]教会はただひとつである。"
 d008_orthodox_events.11.title: "[ShowLocationNameWithNoTooltip('rome')]の首位権の回復"
 d008_orthodox_events.11.desc: "帝国の発祥の地にして、古代の文化と文明を照らす灯火たる永遠の都は、異端と野蛮によって久しく闇に覆われてきた。いま一度正当なる我らの手に戻ったことで、その栄光は取り戻され、世界の中心たる地位も再び打ち立てられるであろう。\n\nこの新たな[ROOT.GetCountry.GetGovernment.GetAdjective]の都より、わが[ROOT.GetCountry.GetFlavorRank]の力は遠く広く及び、世界の隅々に至るまで、人々は我らの存在を感じるであろう。[ShowLocationName('rome')]に栄光あれ！ [ROOT.GetCountry.GetLongName]に栄光あれ！"
 d008_orthodox_events.11.a: "永遠の都、ここに再興される！"
 patriarchate_will_relocate_to_rome_tt: "[ShowLocationName('rome')]の総主教が、これより我々の[GetInternationalOrganizationType('autocephalous_patriarchate').GetName]を率いる"
 d008_orthodox_events.12.title: "The Schism Is Claimed Mended"
 d008_orthodox_events.12.desc: "[scope:actor.GetName] claims to have healed the Great Schism, uniting Christendom under Constantinople."
 d008_orthodox_events.12.a: "Join the Orthodox faith."
 d008_orthodox_events.12.b: "Rome is our shepherd."
 d008_orthodox_events.13.title: "The Schism Is Claimed Mended"
 d008_orthodox_events.13.desc: "[scope:actor.GetName] presumes to declare the Schism healed on their own terms."
 d008_orthodox_events.13.a: "An outrage."
 d008_orthodox_events.14.title: "The Patriarch Moves to Rome"
 d008_orthodox_events.14.desc: "[scope:actor.GetName] has moved the Ecumenical Patriarch to Rome, making a direct claim on Our city."
 d008_orthodox_events.14.a: "We will never yield Rome."
