l_japanese:
 #Fate of the Phoenix DLC
 assign_despot: "$STATIC_MODIFIER_NAME_D008_despot_modifier$に任命する"
 assign_despot_concept: "[character|e]"
 assign_despot_act: "$assign_despot$"
 assign_despot_desc: "[character|e]を$STATIC_MODIFIER_NAME_D008_despot_modifier$に任命することで、以下のエフェクトが発生する：\n[ShowModifierEffect('D008_despot_modifier')]"
 assign_despot_desc_specific: "[character|e]を$STATIC_MODIFIER_NAME_D008_despot_modifier$に任命し、[modifier|e]「[ShowModifier('D008_despot_modifier')]」を与える。"
 assign_despot_past: "[SCOPE.sCharacter('recipient').GetName]が[ShowModifier('D008_despot_modifier')]に任命された"
 assign_despot_act_past: "[SCOPE.sCharacter('recipient').GetName]が[ShowModifier('D008_despot_modifier')]に任命された"
 compose_strategikon: "ストラテギコンを編纂"
 compose_strategikon_concept: "[character|e]"
 compose_strategikon_act: "$compose_strategikon$"
 compose_strategikon_desc: "わが国の[ruler|e]は、自ら選んだ兵法の一分野に力を注ぐ。その知見は我らの武威を高め、名高い軍事力をいっそう高めるであろう。"
 compose_strategikon_desc_specific: "わが国の[ruler|e]は、その著述の内容に応じた[character_modifier|e]を得る。"
 compose_strategikon_past: "ストラテギコンを編纂した"
 compose_strategikon_act_past: "[SCOPE.sCharacter('recipient').GetName]はストラテギコンを編纂し、その統治に強力な[modifier|e]を得る。"
 has_not_composed_strategikon_tt: "わが国の[ruler|e]は生涯において、まだストラテギコンを編纂していない。"
 actor_ruler_total_abilities: "[actor.GetGovernment.GetRulerOrRegent.GetName] [total_ability|e]"
 castrate_character: "Castrate"
 castrate_character_concept: "[character|e]"
 castrate_character_act: "$castrate_character$"
 castrate_character_desc: "Order the castration of a [character|e] at our court. This punishment marks the target permanently and removes their ability to sire children."
 castrate_character_desc_specific: "Order the castration of a [character|e], granting them the [ShowTraitName('castrated')] condition."
 castrate_character_past: "[SCOPE.sCharacter('recipient').GetName] has been castrated by imperial order"
 castrate_character_act_past: "[SCOPE.sCharacter('recipient').GetName] has been castrated by imperial order"
 blind_character: "Blind"
 blind_character_concept: "[character|e]"
 blind_character_act: "$blind_character$"
 blind_character_desc: "Order the blinding of a [character|e] at our court. This ancient punishment renders the target unable to lead armies and diminishes their political standing."
 blind_character_desc_specific: "Order the blinding of a [character|e], granting them the [ShowTraitName('blind')] condition."
 blind_character_past: "[SCOPE.sCharacter('recipient').GetName] has been blinded by imperial order"
 blind_character_act_past: "[SCOPE.sCharacter('recipient').GetName] has been blinded by imperial order"
