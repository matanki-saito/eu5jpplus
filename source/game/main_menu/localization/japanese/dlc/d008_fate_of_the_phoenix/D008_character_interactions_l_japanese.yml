l_japanese:
 #Fate of the Phoenix DLC
 assign_despot: "$STATIC_MODIFIER_NAME_despot_modifier$に任命する"
 assign_despot_concept: "[character|e]"
 assign_despot_act: "$assign_despot$"
 assign_despot_desc: "[character|e]を$STATIC_MODIFIER_NAME_despot_modifier$に任命することで、以下のエフェクトが発生する：\n[ShowModifierEffect('despot_modifier')]"
 assign_despot_desc_specific: "[character|e]を$STATIC_MODIFIER_NAME_despot_modifier$の地位に任命し、[modifier|e]「[ShowModifier('despot_modifier')]」を与える。"
 assign_despot_past: "[SCOPE.sCharacter('recipient').GetName]が[ShowModifier('despot_modifier')]に任命された"
 assign_despot_act_past: "[SCOPE.sCharacter('recipient').GetName]が[ShowModifier('despot_modifier')]に任命された"
 compose_strategikon: "ストラテギコンを編纂"
 compose_strategikon_concept: "[character|e]"
 compose_strategikon_act: "$compose_strategikon$"
 compose_strategikon_desc: "わが国の[ruler|e]は、自ら選んだ兵法の一分野に力を注ぐ。その知見は我らの武威を高め、名高い軍事力をいっそう高めるであろう。"
 compose_strategikon_desc_specific: "わが国の[ruler|e]は、その著述の内容に応じた[character_modifier|e]を得る。"
 compose_strategikon_past: "ストラテギコンを編纂した"
 compose_strategikon_act_past: "[SCOPE.sCharacter('recipient').GetName]はストラテギコンを編纂し、その統治に強力な[modifier|e]を得る。"
 has_not_composed_strategikon_tt: "わが国の[ruler|e]は生涯において、まだストラテギコンを編纂していない。"
 actor_ruler_total_abilities: "[actor.GetGovernment.GetRulerOrRegent.GetName]の[total_ability|e]"
 castrate_character: "去勢"
 castrate_character_concept: "[character|e]"
 castrate_character_act: "$castrate_character$"
 castrate_character_desc: "わが国の宮廷にて、[character|e]の去勢を命じる。この刑罰は対象者に恒久的な烙印を押し、子孫を残す能力を奪うものである。"
 castrate_character_desc_specific: "[character|e]の去勢を命じ、[ShowTraitName('castrated')]という状態を付与する。"
 castrate_character_past: "[SCOPE.sCharacter('recipient').GetName]は皇帝の命令により去勢された"
 castrate_character_act_past: "[SCOPE.sCharacter('recipient').GetName]は皇帝の命令により去勢された"
 blind_character: "盲目"
 blind_character_concept: "[character|e]"
 blind_character_act: "$blind_character$"
 blind_character_desc: "わが国の宮廷にて、[character|e]への盲目刑を命じる。この古来よりの刑罰により、対象は軍を率いることができなくなり、政治的地位も低下する。"
 blind_character_desc_specific: "[character|e]の目潰しを命じ、[ShowTraitName('blind')]という状態を付与する。"
 blind_character_past: "[SCOPE.sCharacter('recipient').GetName]は皇帝の命令により目を潰された"
 blind_character_act_past: "[SCOPE.sCharacter('recipient').GetName]は皇帝の命令により目を潰された"
