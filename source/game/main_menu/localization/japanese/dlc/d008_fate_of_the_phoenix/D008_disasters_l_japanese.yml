l_japanese:
 #Fate of the Phoenix
 fate_of_the_phoenix: "Fate of the Phoenix"
 fate_of_the_phoenix_desc: "ここ数世紀にわたり、我々が誇る[GetCountry('BYZ').GetFlavorRank]は徐々に衰退の一途をたどってきた。絶え間ない内紛、国内の不安定、そして[ShowSituationName('rise_of_the_ottomans')]は、わが国と民に破滅をもたらそうとしている。その一方で、[GetCountry('SER').GetName]および[GetCountry('BUL').GetName]は北部国境を浸食してきている。純然たる力と不屈の意志によって、手遅れとなる前に腐敗を根絶し、王の権威を回復しなければならない……"
 remember_no_turk_tt: "我々以外に、[capital|e]が[ShowRegionName('anatolia_region')]にあり、[subjects|e]を含め#Y 100#!以上の[locations|e]を保有し、かつ[ShowCultureName('turkish_culture')]または[ShowCultureName('turkoman_culture')]であるか、もしくは[ShowGovernmentReformName('anatolian_beylik')]の[government_reform|e]を有する[country|e]は存在しない"
 #Fate of the Phoenix Events (to be moved)
 fate_of_the_phoenix.1.title: "不死鳥の運命"
 fate_of_the_phoenix.1.desc_a: "かつて[ShowLocationName('constantinople')]の城壁は世界の中心を囲っていた。法律と信仰、そして帝国秩序がそこから流れ出し、その遺産はまさしく$ROM$そのものより受け継がれたものであった。いま、その継承は我々に重くのしかかっている。\n\n長年にわたる陰謀と空虚な勝利、そして権威の失墜により、[ROOT.GetCountry.GetFlavorRank]は名こそ保てど、その精神はすでに衰え果てている。国境の外では新たな勢力が忍耐と欲望をもって台頭し、国内では古き官職が放置され腐敗している。わが国の民は、よりよい道を歩み、栄光ある祖先と同じように華やかで豊かな暮らしを享受するに値するのだ！"
 fate_of_the_phoenix.1.desc_b: "[ShowLocationName('constantinople')]より報せが届いた。古の帝都は混乱に陥っており、不和と衰退の重圧のもとでその権威は崩れつつある。幾世代にもわたり、[target_location.GetRank.GetName]の運命は[ShowRegionName('balkan_region')]における[ShowReligionGroupAdjective('christian')]諸国の秩序を形作り、信仰を通じて我々の歴史を結びつけ、互いの剣を鞘に収めさせてきた。\n\nだがいま、その支配が弱まるにつれ、かつて我々の国境を統治していた均衡は危うくなっている。有力な一族のなかには慎重を期すべきと説く者もあり、その崩壊は同じ儀礼を共有するすべてのものを揺るがすと警告する。一方で、かつての保証は消えつつあり、伝統により定まっていたものがやがて武力によって決せられるであろうと率直に語る者もいる。この不穏な時代において、我々の選ぶ道は我らが[ROOT.GetCountry.GetFlavorRank]をはるかに越えて影響を及ぼすだろう。"
 fate_of_the_phoenix.1.desc_c: "帝国の凋落が自らの始まりを高らかに告げてくれることなどない。度重なる弱体の露呈、国境すら守れぬ無力さ、そして[GetCountry('BYZ').GetLongName]における威信の喪失は、彼らの栄光の時代が冷酷かつ唐突な終焉を迎えつつある兆候である。ゆえに西方の情勢はもはや敬意や慎重さを要さず、求められるのはただ計算のみである。その遺骸を喰らい、その地位を継ぐのは我々である。"
 fate_of_the_phoenix.1.a: "希望はまだ失われていない。"
 fate_of_the_phoenix.1.b: "変化とは残酷なものだ……"
 fop_parameters_a_tt: "この国難の結末が我々の運命を決定づける。この激動の時代では、[disaster|e]パネルを通じて固有の[actions|e]を使用できるようになる"
 fop_parameters_b_tt: "もし衰退を食い止め、[disaster|e]を終息させることができれば、歴史に波紋を広げ、わが国の民に第二の黄金時代の幕開けを告げることになるだろう"
 fop_paramenters_bul_tur_ser_tt: "[GetCountry('BYZ').GetLongName]が[disaster|e]「[ShowDisasterName('D008_fate_of_the_phoenix')]」に見舞われているあいだ、我々はその弱みにつけ込む機会を得る"
 fop_parameters_c_tt: "Lastly, if we emerge victorious before the [ShowInstitutionName('renaissance')|U] spawns, our [capital|e] will be eligible as its birthplace"
 fate_of_the_phoenix.2.title: "[target_location.GetName]の奪還！"
 fate_of_the_phoenix.2.desc: "[ROOT.GetCountry.GetFlavorRank]の旗が再び[target_location.GetName]に翻る。[ShowCultureName('turkish_culture')]の将軍、海賊、敵対勢力によって長らく争われてきたこの重要なエーゲ海の港は、いまや[ROOT.GetCountry.GetAdjective]の手に戻った。港湾と市場は荒廃しているが、未来への可能性に満ちている。この新たな領土をどう再建するかによって、東方海域での我々の地位が、今後何世代にもわたって決定づけられる。"
 fate_of_the_phoenix.2.a: "港を再建する。"
 fate_of_the_phoenix.2.b: "代わりに市場と倉庫を再建する。"
 building_set_to_max_level_tt: "この[building|e]は最大レベルに設定される"
 fate_of_the_phoenix.3.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.3.desc: "かつて皇帝の避難所であり、1204年の惨禍のあとも帝国の継続を支えた地である[target_location.GetName]が、再びわが国の支配下に戻った。ここの城壁のなかで、[ROOT.GetCountry.GetFlavorRank]は亡命に耐え、法を守り、普遍的支配への主張を守り抜いてきた。この地の奪還は単なる領土獲得にとどまらず、今後[ROOT.GetCountry.GetFlavorRank]が歩む道を問うものである。"
 fate_of_the_phoenix.3.a: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip]自らがこの計画を統括する！"
 fate_of_the_phoenix.3.b: "我らが帝国の威光復興の兆しである！"
 fate_of_the_phoenix.3.c: "いまこそ[ShowRegionNameWithNoTooltip('anatolia_region')]の統治を復活させる時だ！"
 fate_of_the_phoenix.4.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.4.desc: "以前は[GetCountry('TUR').GetAdjective]勢力の揺籃であった[target_location.GetName]が、帝国軍の手に落ちた。君侯国はかつて、この[target_location.GetRank.GetName]をその力と野心の源とし、貢納を得ていた。その陥落は[ShowRegionName('anatolia_region')]全土に明確な報せをもたらす。形勢は逆転し、[ROOT.GetCountry.GetFlavorRank]はもはや守勢に回ってはいないのだ。"
 fate_of_the_phoenix.4.a: "わが国こそ[ShowRegionNameWithNoTooltip('anatolia_region')]の支配者である！"
 unlocks_demand_beylik_tribute_disaster_action_tt: "この[disaster|e]の発生中、[action|e]「[ShowGenericActionName('demand_beylik_tribute')]」が利用可能になる"
 fate_of_the_phoenix.5.title: "[loser.GetNameWithNoTooltip]に対する勝利"
 fate_of_the_phoenix.5.desc: "君侯国同士の抗争によって生じた混乱は、[loser.GetLongName]の台頭へとつながった。彼らは軍事力と巧みな外交によって、我らが[ROOT.GetCountry.GetFlavorRank]の独立に対する恒常的な脅威となっていたが、彼らに対する近年の勝利は、我々こそが$ROM$の先駆者であり、この激動の時代にあってなお獅子のごとく戦う存在であることを示した。この瞬間を転機とし、過去の衰退を覆す新たな時代の幕開けとしよう！"
 fate_of_the_phoenix.5.a: "流れは変わりつつある！"
 high_legitimacy_grants_extra_benefits_tt: "#Y 30#!年にわたり#Y 50#!以上の[legitimacy|e]を維持することで、[locations|e]の[assimilation|e]と[integration|e]が大幅に促進される"
 fate_of_the_phoenix.6.title: "[target_province.GetNameWithNoTooltip]が我々の権威に抵抗"
 fate_of_the_phoenix.6.desc: "[target_province.GetName]はこの激動の時代において協力を拒んでいる。彼らの自治要求が聞き入れられなければ、公然たる反乱に発展する恐れがある。わが国の相談役たちは譲歩を勧めているが、いま屈すれば[ROOT.GetCountry.GetFlavorRank]の権威をさらに損なうことになる。"
 fate_of_the_phoenix.6.a: "不死鳥は些細な不満など意に介さぬ。"
 fate_of_the_phoenix.6.b: "[target_character.GetShortNameWithNoTooltip]なら対処できるだろうか？"
 fate_of_the_phoenix.6.c: "民の声に耳を傾けるべきだ！"
 target_character_goes_to_target_province_to_restore_order_tt: "[target_character.GetName]が[target_province.GetName]における秩序回復を指揮する。[target_character.GetSheHe|U]は#Y 2#!年間利用不可になる"
 fate_of_the_phoenix.7.title: "[target_country.GetNameWithNoTooltip]の弱体化"
 fate_of_the_phoenix.7.desc: "[target_country.GetName]には明らかな弱体化の兆候が見られる。近接する我々にとっては、またとない機会だ。要求を押し通したければ、[target_character.GetName]が秩序と力を回復する前に、早急に行動しなければならない。"
 fate_of_the_phoenix.7.a: "我々の時代が来た。"
 fate_of_the_phoenix.7.b: "力の均衡は維持されねばならない！"
 we_may_have_another_chance_soon_tt: "将来、再び請求権を得る機会が訪れるかもしれない……"
 fate_of_the_phoenix.8.title: "[actor.GetNameWithNoTooltip]の戦争"
 fate_of_the_phoenix.8.desc: "[actor.GetName]は現在、「真の信仰の敵」と称する者たちと戦っている。[GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip]の同胞として、彼らは我々に対しともに武器を取ることを要求しており、拒めば総主教区から追放すると牽制している。これは重大な宗教的侮辱であり、両国の関係にも長い影を落とすだろう。"
 fate_of_the_phoenix.8.a: "戦争だ！"
 fate_of_the_phoenix.8.b: "この件に関わる価値はない。"
 fate_of_the_phoenix.9.title: "[target_army.GetNameWithNoTooltip]における脱走兵"
 fate_of_the_phoenix.9.desc: "[target_army.GetName]からの報告は憂慮すべきものである。[target_character.GetName]の指揮下で士気は崩壊し、脱走兵が増加しているのだ。このような失態は我らが[ROOT.GetCountry.GetFlavorRank]の威信を損ない、敵を勢いづかせる。"
 fate_of_the_phoenix.9.a: "臆病者どもめ！"
 target_army_suffers_losses_tt: "[target_army.GetName]が[ROOT.GetVariable('visual_strength_loss_variable').GetValue|+2]%の[strength|e]ダメージを受けた"
 fate_of_the_phoenix.10.title: "忠実なストラテゴスの出現"
 fate_of_the_phoenix.10.desc: "数十年にわたり、[target_character.GetName]は[target_unit.GetName]の指揮官として卓越した功績を挙げてきた。忠誠心と度重なる勝利により、[target_character.GetSheHe]は兵士たちの象徴となり、不確かな時代における規律と決意の体現者となっている。"
 fate_of_the_phoenix.10.a: "[target_character.GetShortNameWithNoTooltip]が我々を勝利へ導くだろう！"
 major_victories_enhance_stats_tt: "[target_character.GetName]が大規模な[battles|e]に勝利した場合、[target_character.GetHerHis]の[abilities|e]が向上する可能性がある"
 fate_of_the_phoenix.11.title: "[target_character.GetNameWithNoTooltip]が大勝利"
 fate_of_the_phoenix.11.desc: "我々の[target_unit.GetName]が[target_location.GetName]にて、[target_losing_country.GetName]率いる軍を相手に大勝利を収めた。この勝報は瞬く間に広まり、不死鳥はいまだ健在であることを確信させた。[target_character.GetShortName]が伝説的存在になる日はそう遠くないだろう。"
 fate_of_the_phoenix.11.a: "[target_character.GetSheHe]が永遠に我らの軍を率いんことを！"
 fate_of_the_phoenix.12.title: "[target_character.GetNameWithNoTooltip]が敗北"
 fate_of_the_phoenix.12.desc: "不吉な前兆に満ちた暗黒の日だ！ [target_character.GetName]が[target_location.GetName]で[target_character_2.GetName]率いる軍隊に敗北を喫した。損失は甚大であり、敵対勢力はさらなる弱体の兆しを注視しているに違いない。流れが我々に不利に傾きはじめた兆しなのだろうか？ 進行中の戦争に勝利すべく奮闘しつつ、最善を祈るほかない。"
 fate_of_the_phoenix.12.a: "恥ずべき失態だ！"
 fate_of_the_phoenix.13.title: "[target_character.GetNameWithNoTooltip]の統治"
 fate_of_the_phoenix.13.desc: "この瞬間は[ROOT.GetCountry.GetFlavorRank]にとって決定的なものとなるかもしれない。我々は長いあいだ、衰退に耐えてきた。内紛、外国の侵略、そして権威の緩やかな失墜が、民衆の重荷となってきたのだ。新たな内閣の取り組みを通じて、ついに混乱に秩序をもたらし、制度に規律を、そしてこの国の統治に目的を取り戻すことができるだろう。\n\nこうした改革には決意と犠牲が求められる。衰退を招いた悪習は深く根づいており、抵抗は避けられない。しかし、我々が全力を尽くせば、これらの措置は[ROOT.GetCountry.GetFlavorRank]の長きにわたる後退を食い止め、再生の礎を築くことができるだろう。躊躇はさらなる分裂と没落を招くのみである。"
 fate_of_the_phoenix.13.a: "栄光の太陽が再び昇るには、犠牲が不可欠だ。"
 enable_unlock_spread_philhellenism_and_encourage_latin_militarism_tt: "[disaster|e]「[ShowDisasterName('D008_fate_of_the_phoenix')]」の発生中、[cabinet_actions|e]「[ShowCabinetActionName('spread_philhellenism')]」および「[ShowCabinetActionName('encourage_latin_militarism')]」がアンロックされる。\n\n勝利を収めてこの国難を終結させた場合、これらの内閣アクションは#Y 恒久的#!に利用可能になる"
 fate_of_the_phoenix.14.title: "不死鳥の復活"
 fate_of_the_phoenix.14.desc: "かつて失われた領土は奪還され、衰退の時代は終わりを告げようとしている。[ROOT.GetCountry.GetName]は[ROOT.GetCountry.GetFlavorRank]としての本来の姿を取り戻し、再び敵に立ち向かう備えが整った。さあ、[ShowLocationName('rome')]が我々を待っている。"
 fate_of_the_phoenix.14.a: "大理石の彫像のごとく無意味な[ROOT.GetCountry.GetGovernment.GetRulerTitle]など、我らには不要だ！"
 maintain_cabinet_actions_tt: "勝利を収めてこの[disaster|e]を乗り越え、再興を遂げたことで、[cabinet_actions|e]「[ShowCabinetActionName('spread_philhellenism')]」および「[ShowCabinetActionName('encourage_latin_militarism')]」が引き続き利用可能になった"
 because_we_made_military_reforms_tt: "[action|e]「[ShowGenericActionName('D008_reform_imperial_armies')]」を通じて1つ以上の軍制改革を実施したことにより："
 num_of_reforms_desc: "改革の数"
 unlock_allelengyon_bureaucracy_kephalai_bureaucracy_tt: "[bureaucracies|e]「$allelengyon_bureaucracy$」および「$kephalai_bureaucracy$」をアンロックする"
 unlock_kritai_katholikoi_reformed_extra_effect: "[government_reform|e]「[ShowGovernmentReformName('kritai_katholikoi_reformed')]」による[ShowModifierTypeName('country_cabinet_efficiency')]のエフェクトが恒久化される"
 fate_of_the_phoenix.15.title: "衰退の時代"
 fate_of_the_phoenix.15.desc: "努力も虚しく、近年失われた領土を奪還することは叶わなかった。近隣の君侯国が再興したことに加え、[ShowRegionName('balkan_region')]の国境を越えた先には敵対勢力が存在しており、事態の逆転は不可能となった。長い衰退は続き、[ROOT.GetCountry.GetFlavorRank]の未来は不透明である。"
 fate_of_the_phoenix.15.a: "我々の未来は影と不安に覆われている。"
 no_longer_access_to_the_cabinet_actions_tt: "[cabinet_actions|e]「[ShowCabinetActionName('spread_philhellenism')]」および「[ShowCabinetActionName('encourage_latin_militarism')]」が利用できなくなる"
 fate_of_the_phoenix.16.title: "[actor.GetNameWithNoTooltip]が寄付を要求"
 fate_of_the_phoenix.16.desc: "[actor.GetName]を覆う混乱の知らせが届いた。最後の手段として、彼らは金銭的支援を懇願するため使節を派遣してきた。見返りとして、自らの[actor.GetFlavorRank]において我々の規範や慣習を広めることを許すという。このような提案は前例がなく、[actor.GetCapital.GetName]の窮状を物語っている。"
 fate_of_the_phoenix.16.a: "形ばかりの支援を送るとしよう。"
 fate_of_the_phoenix.16.b: "[ShowRegionNameWithNoTooltip('anatolia_region')]の軍勢に対する盾を支えなければならない。"
 fate_of_the_phoenix.16.c: "異端者に施す貨幣などない！"
 no_money_for_byz_tt: "苦しむ[actor.GetName]に援助を送らない"
 fate_of_the_phoenix.17.title: "[actor.GetNameWithNoTooltip]からの貿易特権の提案"
 fate_of_the_phoenix.17.desc: "我々はすでに[ShowLocationName('constantinople')]で商売をしているが、今回[actor.GetName]から、艦隊建造用資材の供給と引き換えに、首都の市場全体で優遇特権を与えるという提案があった。"
 fate_of_the_phoenix.17.a: "[target_country.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]は商人であり、商いをする者である！"
 fate_of_the_phoenix.17.b: "取り合うまでもない。"
 selected_republic_may_donate_ships_to_our_cause_tt: "選択された$merchant_republic$が[ShowLocationName('constantinople')]における[merchant_power|e]と引き換えにガレー[ships|e]および[sailors|e]を提供する可能性がある"
 byzantines_left_fend_themselves_tt: "[actor.GetLongName]が自力で対処することとなる"
 latin_merchant_privileges_key: "$italian_group$商人の特権"
 fate_of_the_phoenix.18.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]に[target_character.GetNameWithNoTooltip]が到着"
 fate_of_the_phoenix.18.desc: "[target_country.GetName]の信頼すべき友人たちの勧めにより、[target_character.GetName]が[target_location.GetName]の [target_location.GetRank.GetName]から、[target_culture.GetName]の地が誇る技と学識を携え到着した。異国の宮廷で経験を積み、半島の流儀で鍛えられた[target_character.GetSheHe]は、我々の[ROOT.GetCountry.GetFlavorRank]にその奉仕を申し出ている。実に親切な申し出だ。\n\nこの来訪は実利を約束するのみならず、諸侯と皇帝の政務を形作りつづける[ShowCultureGroupName('italian_group')]の同胞との結びつきを一層深めるものである。"
 fate_of_the_phoenix.18.a: "[target_character.GetHerHis]の今後を注意深く見守ろう！"
 fate_of_the_phoenix.19.title: "[actor.GetNameWithNoTooltip]が貢納を要求"
 fate_of_the_phoenix.19.desc: "[ShowLocationName('bursa')]が[actor.GetName]の手に落ちたことで、[target_character_1.GetName]の権威は再び確立され、揺るぎないものとなった。そんななか、[target_location_1.GetName]から届いたのは挨拶ではなく、要求を携えた使節であった。彼らは我々のいわゆる異教の慣習を理由に貢納を求めており、その言葉の裏には武力行使の脅しが隠されている。金か、血か、反抗か。なんらかの回答が求められており、その結果は国境を遥かに越えて影響を及ぼすだろう。"
 fate_of_the_phoenix.19.a: "金を手放すほかに道はない。"
 fate_of_the_phoenix.19.b: "代わりに屈強な男たちを送れ。"
 fate_of_the_phoenix.19.c: "何一つくれてやるものか！"
 fate_of_the_phoenix.20.title: "[actor.GetAdjectiveWithNoTooltip]軍の改革"
 fate_of_the_phoenix.20.desc_a: "長年の放置と財政難により、[ROOT.GetCountry.GetFlavorRank]の軍は待ち受ける試練に対する備えを欠いている。[target_character.GetName]の権威のもと、新たな規則を制定すれば、規律を回復し、指揮系統を再編し、かつて[ROOT.GetCountry.GetCapital.GetName]の軍をはるか遠くの地でも恐れられる存在たらしめた伝統を復活させることができるだろう。費用はかかるが、この改革は軍事力の衰退を食い止められるかもしれない。"
 fate_of_the_phoenix.20.desc_b: "海は長きにわたり[ROOT.GetCountry.GetFlavorRank]の盾であり生命線であった。しかしいま、わが国の艦隊の慣習は時代遅れになり、専門知識は失われつつある。[target_character.GetName]の指導のもと、海軍指揮系統の刷新、訓練の改善、そして海洋力を支える制度の近代化に向けた取り組みを進められるだろう。成功すれば、[ROOT.GetCountry.GetAdjective]海軍は再びあらゆる敵から沿岸と交易を守り抜けるようになるかもしれない。"
 fate_of_the_phoenix.20.a: "衰退と戦うために必要な一歩だ。"
 fate_of_the_phoenix.20.b: "いまはまだその時ではない。"
 reformation_of_the_school_of_admirals_better_stats_tt: "この[modifier|e]が有効なあいだは、[action|e]「[ShowGenericActionName('train_admiral')]」を使用すると、全体的に優れた[abilities|e]をもつ[characters|e]が得られる"
 better_stats_because_reformation_of_the_school_of_admirals_modifier_tt: "この[admiral|e]の[abilities|e]は、[modifier|e]「[ShowModifier('reformation_of_the_school_of_admirals_modifier')]」により#G +10#!強化されている"
 because_we_reformed_our_navy_in_DHE_desc: "わが国が[event|e]「$flavor_byz.15.title$」において自らの[navy|e]を改革したことにより"
 target_character_total_abilities: "[target_character.GetName]の[abilities|e]"
 # Actions for Fate of the Phoenix Disaster
 selected_country_will_send_us_engineer_character_tt: "選択された[country|e]が自国内で特に優秀な[characters|e]をひとり派遣する"
 target_country_forced_to_give_tribute_tt: "選択された[country|e]を説得することで、[gold|e]または[manpower|e]を提供してもらえる可能性がある"
 at_war_with_heathens_or_heretics_tt: "わが国は現在、[actor.GetReligion.GetName]の教えに従わない[country|e]との[war|e]を主導している"
 selected_country_may_join_every_ongoing_war_against_heathen_and_heretics_tt: "選択された[country|e]が、[war_leaders|e]が[heathens|e]または[heretics|e]である進行中の[wars|e]に参戦する可能性がある"
 pops_in_capital_province_convert_catholic_tt: "[actor.GetCapital.GetProvince.GetName]において[actor.GetReligion.GetName]を信仰するわが国の[pops|e]の一部が、[ShowReligionName('catholic')]を受け入れる"
 fate_of_phoenix_actions_price: "「$D008_fate_of_the_phoenix$」のアクションコスト"
 request_papal_donation: "$PAP_ADJ$に寄付を要求"
 request_papal_donation_desc: "[actor.GetFlavorRank]は疲弊し、国庫も乏しいため、[ShowReligionGroupName('christian')]の名のもとに$PAP$へ援助を求める使節を送る。このような要請には代償が伴うが、その資金は窮地において時間を稼いでくれるかもしれない。"
 grant_latin_merchants_privileges: "[ShowCultureGroupNameWithNoTooltip('italian_group')]商人に特権を付与"
 grant_latin_merchants_privileges_desc: "[ShowCultureGroupName('italian_group')]の商人共和国に特権を与えることで、交易の再活性化と海軍支援の確保を図る。この譲歩は[actor.GetCapital.GetName]における商業を強化する一方、[actor.GetCapital.GetRank.GetName]内で他国の影響力が強まる危険もある。"
 accept_catholic_delegation: "[ShowReligionAdjectiveWithNoTooltip('catholic')]使節団を受け入れる"
 accept_catholic_delegation_desc: "団結の言葉を携え、妥協への静かな期待を抱いた[GetUniqueInternationalOrganization('catholic_church').GetName]の使節を[actor.GetCapital.GetName]へ招く。相談役の多くは、この代表団の受け入れは、[ShowReligionAdjective('catholic')]世界との関係改善に寄与するが、そのような行動は国内の緊張を招く恐れもあると考えている。"
 attract_italian_engineer: "[ShowCultureGroupNameWithNoTooltip('italian_group')]の技師を招致"
 attract_italian_engineer_desc: "わが国の要塞や軍事施設を改良するため、名高い [ShowCultureGroupName('italian_group')]の技師が求められている。彼らの専門知識があれば、古くからの問題を近代的な手法で解決できるだろうが、その代償として、我々が西洋の手法や影響力に縛られることになるかもしれない。"
 demand_beylik_tribute: "君侯国に貢納を要求"
 demand_beylik_tribute_desc: "[ShowRegionName('anatolia_region')]における権威を回復したいま、近隣の君侯国に対し再び[actor.GetAdjective]の覇権を認めさせることができる。いま貢納を引き出せば、将来の敵を弱体化させ、[actor.GetFlavorRank]の強さに対する信頼を回復できるだろう。"
 summon_patriarchate_member: "総主教座の成員を招集"
 summon_patriarchate_member_desc: "我々は[GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip]の指導者として、信仰の敵と戦うため、同胞の[ShowReligionAdjective('orthodox')]の指導者たち支援を呼びかけることができる。この要請は義務に基づくものではなく、共通の信仰に訴えるものだが、大義のために剣を掲げる者を集結させることができるだろう。"
 reform_imperial_armies: "[GetCountry('BYZ').GetAdjectiveWithNoTooltip]軍の改革"
 reform_imperial_armies_desc: "[actor.GetFlavorRank]の軍隊は長年の放置と場当たり的対応に苦しんできた。包括的な改革は規律と構造の刷新を約束するが、安定した基盤と銀、そして旧来の慣習を改める意志が必要となる。"
 patronize_orthodox_monastery: "$orthodox_monastery$への後援"
 patronize_orthodox_monastery_desc: "[ShowBuildingTypeName('orthodox_monastery')]を後援することで我々の献身を再確認し、地域の宗教活動を活性化する。こういった寛大な支援は地域の生活の質を向上させ、[actor.GetLongName]はいまなお真の信仰の守護者であると、信者たちに再認識させるだろう。"
 reform_armed_forces_tt: "わが国が[army|e]または[navy|e]を改革し、過去数世紀の衰退を覆すことができる"
 has_not_completed_all_six_reforms_tt: "わが国が利用可能な#Y 6#!つの改革すべてを完了していない"
 patronize_orth_monastery_tt: "選択された[location|e]に[modifier|e]「[ShowModifier('D008_patronize_orthodox_monastery_modifier')]」が付与され、多くの[ShowReligionAdjective('orthodox')][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]変化する"
