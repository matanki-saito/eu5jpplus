l_japanese:
 spread_philhellenism: "フィルヘレニズムの普及"
 spread_philhellenism_desc: "[ShowCultureGroupName('greek_group')]の学問、芸術、哲学を振興することで、我々は国内外におけるわが国の認識を形作ろうとしている。[ShowCultureName('greek_culture')]文化を敬愛する学者や芸術家、愛好者が我々のもとに引き寄せられ、武力ではなく称賛によって我々の威光と影響力が強まるのだ。"
 spread_philhellenism_action: "$spread_philhellenism$"
 spread_philhellenism_active: "フィルヘレニズム普及政策を実施中"
 spread_philhellenism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_wordier: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_tooltip: "[research_progress|e]：[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n[cultural_influence|e]：[SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 spread_philhellenism_action_progress_long_wordier: "@research_progress! [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n@cultural_influence! [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 encourage_latin_militarism: "[ShowLanguageNameWithNoTooltip('latin_language')]軍国主義の奨励"
 encourage_latin_militarism_desc: "わが国を[ShowLanguageName('latin_language')]諸国の理想とする「秩序ある戦争」——すなわち契約の執行、訓練の標準化、そして軍務の日常化へと結びつけなければならない。このような規律は、兵士を戦場に駐留させる費用を確実に削減し、職業軍人の伝統を育むことだろう。"
 encourage_latin_militarism_action: "ラテン的軍国主義の奨励"
 encourage_latin_militarism_active: "ラテン的軍国主義を奨励中"
 encourage_latin_militarism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_wordier: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_long_wordier: "@army_maintenance![SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]\n\n@army_tradition![SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 encourage_latin_militarism_action_progress_tooltip: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')] \n\n[army_tradition|e]：[SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_high_legitimacy: "$nomos_empsychos_bureaucracy$"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_low_legitimacy: "$nomos_empsychos_bureaucracy$"
 cb_restore_roman_borders: "Restore $ROM_ADJ$ Borders"
 cb_restore_roman_borders_desc: "The splendor of the old Empire calls to us. It is time for the phoenix to spread its wings, dooming all those who dare stand between us and our ambition to restore the [ShowScriptedGeographyName('roman_borders_geography')] of old."
 roman_borders_geography: "$ROM_ADJ$の国境"
 epic_hellenic_history: "ヘレニズム史の叙事詩"
 epic_hellenic_history_desc: "金箔の頁に綴られ、流麗な筆致で彩られた、古代ギリシャ世界の輝かしい歴史を語り継ぐ書。この芸術作品は我々の富と、幸運にも祖先として仰ぐ偉大な人物たちの証である。この編年史には、アキレスが最期を遂げたトロイアの滅亡、伝説のオデュッセウスの旅、イアソン率いるアルゴナウタイの航海など、多くの物語が収められている。"
 nomos_empsychos_bureaucracy: "ノモス・エンプシュコス"
 nomos_empsychos_bureaucracy_desc: "生ける法——「ノモス・エンプシュコス」の概念に由来する皇帝は、わが国の統治の根幹を成し、主権そのものを体現する存在である。ユスティニアヌス帝のもとで初めて体系化されたこの原則は、立法、司法、指揮権を皇帝個人に結びつけ、統治者をローマ国家の中心に据えるものである。"
 honorary_titles_bureaucracy: "名誉称号"
 honorary_titles_bureaucracy_desc: "パトリキオスやアンティパトスからマギストロス、クロパラテスに至るまで、わが国の宮廷は命令ではなく威厳によって野心を統御する。\n\nこの精緻な制度は、階級的栄誉や絹織物、特権の授与を軸とし、皇帝は忠誠を報い、対立を和らげ、威信そのものを統治の手段とすることで、将軍、元老院議員、地方の有力者たちを王座に結びつけることができる。"
 court_eunuchs_bureaucracy: "宮廷宦官"
 court_eunuchs_bureaucracy_desc: "教養があり、忠誠心が強く、王朝の野心とは無縁の宮廷宦官は、信頼の置ける行政幹部層を形成する。皇帝に近侍しながらも家門の力から隔絶されているため、宮廷統治、財政、帝国文書の管理を担うのに理想的な人材である。"
 ritualistic_court_bureaucracy: "儀礼的宮廷"
 ritualistic_court_bureaucracy_desc: "儀礼とは可視化された統治である。規定された儀礼や序列、壮観によって宮廷は権威を神聖な劇場へと変貌させる。国内の階層秩序を整えつつ、文明世界の中心とみなされる我らが偉大なる首都の威厳をもって、外国の使節たちを圧倒するのである。"
 sixty_books_of_the_basilika_bureaucracy: "バシリカ法典"
 HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Has the $sixty_books_of_the_basilika_bureaucracy$"
 THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Has the $sixty_books_of_the_basilika_bureaucracy$"
 FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "The $fate_of_the_phoenix$ [disaster|e] is active"
 THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "The $fate_of_the_phoenix$ [disaster|e] is active"
 sixty_books_basilika_satisfaction_scale_tt: "The Peasants [estate_satisfaction|e] penalty scales with the $sixty_books_of_the_basilika_bureaucracy$ maintenance slider. (#R -5%#! at full maintenance and #R -20%#! at no maintenance)"
 sixty_books_of_the_basilika_bureaucracy_desc: "ユスティニアヌス帝の「ローマ法大全」を基盤として、$sixty_books_of_the_basilika_bureaucracy$はローマ法を首尾一貫した[ShowLanguageName('greek_language')]の法典体系へと再編する。数世紀にわたる法解釈を明確化し、標準化し、調和させることで、皇帝の法を議論の余地のない、権威ある普遍的なものとする。"
 romanitas_bureaucracy: "ロマニタス"
 romanitas_bureaucracy_desc: "$romanitas_bureaucracy$は途切れることのないローマ国家の存続を確固たるものにする。皇帝は征服や民族によってではなく、千年に及ぶ権威、法、伝統の正当な継承者として統治する。この理念は帝国と信仰を結びつけ、ローマの支配を神意にかなう道徳的に至高のものであると提示する。"
 imperial_senate_bureaucracy: "帝国元老院"
 imperial_senate_bureaucracy_desc: "皇帝の権威によって任命された高位の貴族で構成される元老院は、承認と助言をおこなう機関として機能する。その承認は、統治、継承、および主要な行為に正当性を与えるものであり、皇帝が主権が確固として保持することを担保しつつ、ローマの連続性を維持する。"
 kephalai_bureaucracy: "ケファライ"
 kephalai_bureaucracy_desc: "「ケファライ」は帝国の統治を実践可能にするべく設計された行政および法の要覧である。カテパニキオンのような旧来の地域的取り決めに代わり、法、租税、および軍事的義務を標準化された指令へと集約し、諸州における統治の一貫性を確保している。"
 won_fate_of_the_phoenix_disaster_tt: "わが国が[disaster|e]「[ShowDisasterName('D008_fate_of_the_phoenix')]」を乗り越え、勝利を収めた"
 fop_renaissance_latin_merchants_tt: "We have granted privileges to [ShowCultureGroupName('latin_group')] merchants"
 magister_militum_bureaucracy: "ストラテガルキア"
 magister_militum_bureaucracy_desc: "ストラテガルキアは帝国軍の組織的な指揮系統を体現している。将軍の任命、異動、および統制は官僚機構によっておこなわれ、軍事力が個人の野心ではなく国家のために用いられることを保証する。こうして戦争は忠誠心ではなく階級によって統治される行政機能となり、同時に最も優れた者のみが頂点に立つことを確実にする。"
 has_unlocked_bureaucracy_via_flavor_byz_31_tt: "[event|e]「$flavor_byz.31.title$」を通じて、この[bureaucracy|e]がアンロックされた。この[event]は#Y 1400#!年以降に発生する可能性があり、以下の発生条件がある：\n\n[ShowTriggerConditions('flavor_byz.31',PlayerScope.Self)]"
 themata_bureaucracy: "テマ制"
 themata_bureaucracy_desc: "存亡の危機に応じる形で作られたテマ制は、帝国を地方の軍事・行政区画に分割する。各区画はストラテゴスによって統治され、ストラテゴスは民事と軍事の権限を統合することで、帝国の階層構造に形式上は従属しつつ、迅速な地域防衛を可能にしている。"
 allelengyon_bureaucracy: "アレレンギュオン"
 allelengyon_bureaucracy_desc: "皇帝バシレイオス2世（「ブルガリア人殺し」異名で知られる）のもとで構想され、[ShowLanguageName('greek_language')]のアリレングィ（連帯）に由来する$allelengyon_bureaucracy$は、財政負担を再分配するために設計された納税義務であった。小作農が納付義務を果たせない場合、法的責任は当該地区のより裕福な地主へと移転され、農民の土地の没落や吸収を防ぎつつ帝国の収入を確保する。このように、財政的連帯は安定と統制の手段となるのだ。"
 katepanata: "カテパナタ"
 katepanata_desc: "好戦的な隣国への対抗策は、断固たる軍事権威による新征服領土の統合である。頂点に立つ者という意味の言葉「カテパノ」に由来する$katepanata$は、通常のテマの上位に位置し、民政・軍政の両権を授けられた単一の指揮官のもとに諸州を統合する。10世紀から11世紀にかけて本格的に運用されるようになったこの広大な軍管区は、[ShowLocationName('bari')]を拠点とする[ShowRegionName('italy_region')]から、バシレイオス2世らの治世下において不安定であった[ShowAreaNameWithNoTooltip('armenia_area')]の辺境に至るまで、遠く離れた紛争地がの統治が分裂した状態に陥るのを防ぐ役割を果たした。これを我らの意志の砦として、王冠を狙うすべての者に対する旗印とするのだ！"
 has_completed_fate_of_the_phoenix_disaster: "わが国が[disaster|e]「[ShowDisasterName('D008_fate_of_the_phoenix')]」を勝利のうちに終結させた"
