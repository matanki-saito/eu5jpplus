l_japanese:
 latinization_vs_hellenization.1.title: "[ShowCultureGroupNameWithNoTooltip('greek_group')]の叡智の残響"
 latinization_vs_hellenization.1.desc: "In the monasteries and lecture halls of [target_location.GetName], collections of theological writings and the works of the Church Fathers circulate among the faithful and the learned alike. Sermons and commentaries draw on the deep wells of Orthodox learning, and copies of these texts begin to find their way into the hands of non-Greek notables, to the growing unease of those at court who see the future in closer ties with the Latin West."
 latinization_vs_hellenization.1.a: "彼らの識見をもって、わが国を豊かにしよう。"
 latinization_vs_hellenization.1.b: "古い巻物への傾倒も、もはや度を越している。"
 target_character_disappears_tt: "[target_character.GetName]が姿を消す"
 latinization_vs_hellenization.2.title: "[ShowLanguageNameWithNoTooltip('latin_language')]への傾倒の高まり"
 latinization_vs_hellenization.2.desc: "[ROOT.GetCountry.GetName]のサロンや荘園では、[ShowLanguageName('latin_language')]の慣習、法、儀礼への支持が少しずつではあるが強まりつつある。若い貴族たちは言葉の端々に異国の言い回しを交え、[ShowLanguageNameWithNoTooltip('latin_language')]の宮廷と文を交わし、わが[ROOT.GetCountry.GetFlavorRank]を西方の様式へいっそう近づける改革を唱えている。その一方で、古くからの拠り所があまりにも速く失われつつあることに、不安を募らせる者たちもいる。"
 latinization_vs_hellenization.2.a: "別に問題はないだろう。"
 latinization_vs_hellenization.2.b: "いますぐ方針を改めよ！"
 stability_scales_with_current_latinization_hellenization: "[stability|e]の変動量は、現在の[ShowSocietyDirectionName('latinization')]または[ShowSocietyDirectionName('hellenization')]の値に応じて決まる"
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "この[country_modifier|e]が有効であるあいだ、以後に発生する[ShowSocietyDirectionName('latinization')]を強める[events|e]の効果は大幅に弱まり、付与されるボーナスも減少する"
 bonus_weakened_because_of_suppressing_latinization_modifier: "[ShowModifier('suppressing_latinization_modifier')]により、この選択で得られる恩恵は減少する"
 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')]の興隆"
 latinization_vs_hellenization.3.desc: "Merchants, jurists, and scholars report that the recent turn toward [ShowLanguageName('latin_language')] forms is beginning to bear fruit. Contracts are drafted more clearly, foreign partners find our practices familiar, and the energy of reform seems to quicken the life of [ROOT.GetCountry.GetName], though some whisper that these gains rest on foundations that could yet be shaken."
 latinization_vs_hellenization.3.a: "いまこそ、我らが善政の成果を享受する時だ。"
 latinization_vs_hellenization.3.b: "賢き者ならば、過去の過ちを正す道を選ぶ！"
 latinization_vs_hellenization.4.title: "[target_unit.GetNameWithNoTooltip]に栄光あれ"
 latinization_vs_hellenization.4.desc: "近ごろの戦役において[target_unit.GetName]が示した模範的な規律と勇気については、[ROOT.GetCountry.GetGovernment.GetCourtTitle]にも報せが届いている。行軍においても訓練においても、その隊伍は強固に保たれており、その振る舞いに関する評判は、兵卒のあいだのみならず、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]のあいだにも広まりはじめている。彼らはこれを、[ROOT.GetCountry.GetName]の軍団の範とみなしている。"
 latinization_vs_hellenization.4.a: "彼らの働きは、まことに貴いものだ。"
 target_character_will_receive_a_nickname_tt: "[target_character.GetName]は、その模範的な功績を称えて、ふさわしい異名を授けられる"
 latinization_vs_hellenization.5.title: "[target_location.GetNameWithNoTooltip]における学課論争"
 latinization_vs_hellenization.5.desc: "At the [ShowBuildingTypeName('university')] of [target_location.GetName], scholars quarrel over the proper language of higher learning. Some insist that only [ShowLanguageName('latin_language')] can place our [ROOT.GetCountry.GetFlavorRank] among the great powers, while others insist that scholarship in the tradition of Constantinople and the Church must be preserved."
 latinization_vs_hellenization.5.a: "大学では[ShowLanguageNameWithNoTooltip('latin_language')]で教えるべきだ。"
 latinization_vs_hellenization.5.b: "The tradition of our Church and Empire shall not be surrendered."
 pops_in_target_province_mild_bonus_satisfaction: "[target_province.GetName]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 pops_in_target_province_mild_penalty_satisfaction: "[target_province.GetName]に居住するわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]低下する"
 latinization_vs_hellenization.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]からの警告"
 latinization_vs_hellenization.6.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の高名な一員である[target_character.GetName]が、深い憂慮を抱いて[ROOT.GetCountry.GetGovernment.GetCourtTitle]に参じた。教義と慣習における[ShowLanguageName('latin_language')]様式の流入が我らの信仰の土台を蝕みつつあり、やがては教会と王権の双方を危うくするであろうと警告している。"
 latinization_vs_hellenization.6.a: "[target_character.GetHerHis]の警告を聞き入れるのが賢明だろう。"
 latinization_vs_hellenization.6.b: "臆した者どもに、わが国の方針を決めさせはしない。"
 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]による異国風俗の取り入れ"
 latinization_vs_hellenization.7.desc: "[target_location.GetName]の宮廷から遠方の荘園に至るまで、わが国の[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]は[target_culture.GetName]の作法、装い、言葉遣いをこぞって真似ている。これを洗練の証と見る者もいれば、わが国の貴族たちは[ROOT.GetCountry.GetAdjective]人であることの意味を忘れつつあるのではないかと囁く者もいる。"
 latinization_vs_hellenization.7.a: "[target_culture.GetNameWithNoTooltip]の文化のうち、有益なものを取り入れさせよう。"
 latinization_vs_hellenization.7.b: "異国かぶれも、もはや度を越している。"
 destabilize_our_realm: "これらの風潮に対して慎重な構えを取ることは、わが[ROOT.GetCountry.GetFlavorRank]を不安定にする"
 perceived_as_weakness: "異国風俗の取り入れを禁止することは弱さの表れとみなされる"
 latinization_vs_hellenization.8.title: "州の再編"
 latinization_vs_hellenization.8.desc: "[ROOT.GetCountry.GetCapital.GetName]の役人たちは、[target_province.GetName]のような属州を全面的に再編し、管轄区分と行政を我らの文化的・政治的中枢にいっそう近づける案を提起した。この計画は統制の強化を確約する一方で、長らく保たれてきた地方の均衡を乱すおそれもある。"
 latinization_vs_hellenization.8.a: "いかなる代償を払おうとも、新たな秩序を押し通せ。"
 latinization_vs_hellenization.8.b: "地方の旧来の取り決めを尊重し、その不安を和らげよう。"
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "影響を受ける[provinces|e]にいるわが国の[pops|e]の満足度が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]増加する"
 latinization_vs_hellenization.9.title: "[target_character.GetShortNameWithNoTooltip]の教育"
 latinization_vs_hellenization.9.desc: "[target_character.GetName]が成年に近づくにつれ、その教育方針をめぐって教師や廷臣たちの対立が深まっている。どの言語を用い、どの書物を読ませ、誰を師とするか——いずれを選ぶにせよ、それは[ROOT.GetCountry.GetName]の将来のあり方をめぐる代理戦となりかねない。"
 latinization_vs_hellenization.9.a: "[target_character.GetShortNameWithNoTooltip]の教育は、明確な方針に基づき、熟慮のうえで進めねばならない。"
 latinization_vs_hellenization.9.b: "[target_character.GetShortNameWithNoTooltip]の養育を政争に利用してはならない。"
 refusal_to_politicize_tt: "[target_character.GetName]の教育にあからさまに介入することを控える我らの姿勢は、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部には弱さの表れと受け取られかねない"
 court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]は反応を示さない"
 latinization_vs_hellenization.10.title: "[ShowCultureNameWithNoTooltip('roman_culture')]の威光の回復"
 latinization_vs_hellenization.10.desc: "Architects familiar with the new methods flourishing in the cities of Italy propose reshaping [target_province.GetName] in the Renaissance manner: broad avenues, orderly grids, and public works that echo the grandeur of Rome as reimagined by the masters of the Latin West. Those who admire such lofty plans see a rebirth of dignity. Perhaps this is the kind of renewal only openness to the West can bring."
 latinization_vs_hellenization.10.a: "[target_province.GetNameWithNoTooltip]を新たに蘇らせよう。"
 latinization_vs_hellenization.10.b: "集落は自然の成り行きに委ねて繁栄させよう。"
 target_character_artist_skill: "[target_character.GetName]の[artistic_skill|e]"
 latinization_vs_hellenization.11.title: "Building in the Imperial Tradition for [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.11.desc: "Patrons of the arts and local guilds lobby for a renovation of [target_province.GetName] drawing on the great tradition of our imperial cities: the arcaded streets, open forums, and stonework that have distinguished Constantinople and the enduring cities of the Roman East. Many of our advisors believe that restoring such forms speaks powerfully to the dignity of our unbroken Roman inheritance."
 latinization_vs_hellenization.11.a: "雅やかさこそ、わが[ROOT.GetCountry.GetFlavorRank]にふさわしい。"
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"
 latinization_vs_hellenization.12.title: "新税制をめぐる論争"
 latinization_vs_hellenization.12.desc: "財政官たちは、査定と徴収をいっそう厳正なものとするべく、異国の制度を取り入れつつ、わが国の税制を全面的に改める案を提出した。この抜本的な提案は、統制の強化と歳入の増加をもたらすことが見込まれる一方で、[ROOT.GetCountry.GetFlavorRank]全土で既得権益を揺るがしかねない。"
 latinization_vs_hellenization.12.a: "新たな税制を導入せよ。"
 latinization_vs_hellenization.12.b: "ひとまず、これらの案は見送ろう。"
 proposed_taxation_upsets_estates_tt: "この税制案は複数の[estates|e]の既得特権を揺るがすことになる"
 new_tax_code_will_destabilize_the_realm: "改定された税制はわが[ROOT.GetCountry.GetFlavorRank]を不安定にする"
 latinization_vs_hellenization.13.title: "[target_location.GetNameWithNoTooltip]が独自の評議会を要求"
 latinization_vs_hellenization.13.desc: "The notables of [target_location.GetName] have stepped forth with a petition to the [ROOT.GetCountry.GetGovernment.GetCourtTitle] for an autonomous municipal council, citing the example of the self-governing communes of the Italian cities as proof that local rule brings prosperity. Granting their wish would weaken central control and nudge the [ROOT.GetCountry.GetFlavorRank] toward Latin models of governance, but refusing may embitter influential elites who look westward for inspiration."
 latinization_vs_hellenization.13.a: "彼らに独自の評議会を認めよう。"
 latinization_vs_hellenization.13.b: "引き続き、彼らを我々の監督下に置く。"
 upper_class_pops_in_these_cities_angry: "請願を退けたことに不満を募らせ、対象[locations|e]に居住するわが国の[upper_class|e][pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]低下する"
 latinization_vs_hellenization.14.title: "[target_province.GetNameWithNoTooltip]の大祭"
 latinization_vs_hellenization.14.desc: "[target_province.GetName]の有力者たちは、この地に受け継がれてきた習わしと、その豊かな恵みに感謝を捧げる盛大な祭りを催したいと望んでいる。こうした祝祭は緊張を和らげ、一体感を強める助けとなりうるが、そのためには属州と国庫の双方から資金を投じる必要があり、財政顧問たちは難色を示すだろう。"
 latinization_vs_hellenization.14.a: "[target_province.GetNameWithNoTooltip]だけのための祝祭としよう。"
 latinization_vs_hellenization.14.b: "近隣の州にも、この祝祭に参加させよう！"
 latinization_vs_hellenization.14.c: "怠けている暇があるなら、働かせればよい。"
 pops_are_happier_tt: "開催中の祭により、この[province|e]において[upper_class|e]に属さないわが国の[pops|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]上昇する"
 latinization_vs_hellenization.15.title: "A Manual of the Latin Method"
 latinization_vs_hellenization.15.desc: "A meticulous manual of drills and battlefield maneuvers, drawn from the methods of the mercenary captains and military orders of the Latin West, has begun to circulate among our officers. Its diagrams and commands promise to bring order and uniformity to our ranks, assuming we are willing to adopt it as official doctrine."
 latinization_vs_hellenization.15.a: "皆に配布せよ！"
 latinization_vs_hellenization.15.b: "そのようなものは、我らには無用だ。"
 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip]と[target_estate.GetNameWithNoTooltip]の衝突"
 latinization_vs_hellenization.16.desc: "遺憾ながら、[target_character.GetName]と[target_estate.GetName]の有力者たちが激しく対立し、双方とも相手が分を越えていると非難している。この対立は将校団と、わが[ROOT.GetCountry.GetFlavorRank]の有力諸勢力との関係を損なうおそれがある。"
 latinization_vs_hellenization.16.a: "[target_character.GetHerHim]を咎めるのは当然だ。"
 latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip]が軍事に口を出すことは許されない！"
 court_faction_increases_influence: "対立する[ROOT.GetCountry.GetGovernment.GetCourtTitle]内の一派が影響力を強める"
 our_authority_will_suffer_penalty: "我々の権威が損なわれる"
 latinization_vs_hellenization.17.title: "[target_character2.GetShortNameWithNoTooltip]、仕官を願い出る"
 latinization_vs_hellenization.17.desc: "Through our ties with [target_country.GetName], a seasoned warrior of [target_culture.GetName] stock has expressed a desire to serve under our banner, drawn by the growing bonds between our courts. [target_character.GetSheHe|U] brings with [target_character.GetHerHim] the military knowledge of the Latin West and offers [target_character.GetHerHis] expertise to our cause."
 latinization_vs_hellenization.17.a: "[target_culture.GetNameWithNoTooltip]の指揮官ならば、誰であれ歓迎だ！"
 latinization_vs_hellenization.18.title: "指導者たちの不和"
 latinization_vs_hellenization.18.desc: "わが国の軍の指揮官である[target_character_1.GetName]と[target_character_2.GetName]が、戦術と訓練をめぐって公然と対立している。この対立は将校団を二分し、遠征中の兵らを惑わせるおそれがある。この亀裂もまた、軍の分裂を示す新たな徴候なのだろうか。いずれにせよ、国防のためにも、この争いは早急に収めるのが得策である。"
 latinization_vs_hellenization.18.a: "[target_character_1.GetShortNameWithNoTooltip]の進言に従おう。"
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip]が正しい！"
 latinization_vs_hellenization.19.title: "[target_province_destination.GetNameWithNoTooltip]に向かう移住者たち"
 latinization_vs_hellenization.19.desc: "The splendor and good name of [target_province_destination.GetName] have led people from [target_province_origin.GetName] to embark on a journey to our lands. If they come from the Latin West, their settlement will deepen our connections there; if they are Orthodox neighbors, their arrival will strengthen the ancient character of the province."
 latinization_vs_hellenization.19.a: "彼らはわが国をより豊かなものとしてくれるだろう！"
 latinization_vs_hellenization.19.b: "彼らを迎え入れるつもりはない。"
 latinization_vs_hellenization.20.title: "[target_character.GetNameWithNoTooltip]の忠誠"
 latinization_vs_hellenization.20.desc: "[target_character.GetName]が、忠誠を他に向ける使者や間者と会っているとの噂が広まっている。それが悪意から生じたものであれ、誤解によるものであれ、こうした噂はわが国の指揮系統への信頼を蝕んでいる。密偵たちも不信の広がりを報告しており、ここは事態を慎重に見極めるのが賢明である。"
 latinization_vs_hellenization.20.a: "[target_character.GetName]にしばし暇を与えるとしよう……"
 latinization_vs_hellenization.20.b: "このような根も葉もない噂に惑わされるな！"
 target_character_spills_the_beans: "[target_character.GetShortName]が、わが国の[rivals|e]と[rival_enemies|e]に機密を漏らす"
 target_character_lips_shut: "[target_character.GetShortName]は決して口を開かない"
 latinization_vs_hellenization.21.title: "インフレ政策"
 latinization_vs_hellenization.21.desc: "質の劣る貨幣や偽造貨幣の流入により、[ROOT.GetCountry.GetName]全土で物価が乱れはじめている。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の相談役のなかには、直ちに介入すべきだと説く者もいれば、打つ手次第では現状に劣らぬ混乱を招きかねないと論ずる者もいる。"
 latinization_vs_hellenization.21.a: "貨幣の管理を厳しくせよ。"
 latinization_vs_hellenization.21.b: "市場に任せておけばいい。"
 inflation_creeping_in_tt: "放置すれば、将来[inflation|e]が重大な問題を招くおそれがある"
 burghers_pleased: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] are pleased with our restraint"
 burghers_upset: "何も手を打たないことで[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]は不満を募らせる"
 inflation_causes_instability: "深刻化する[inflation|e]がわが国の[stability|e]に悪影響を及ぼす"
 latinization_vs_hellenization.22.title: "[target_character_1.GetShortNameWithNoTooltip]の師友"
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName] has grown particularly close to [target_character_2.GetName], whose lessons now extend beyond simple letters and sums. Some say this friendship broadens [target_character_1.GetHerHis] horizons, while others fear undue influence over the future of our [ROOT.GetCountry.GetFlavorRank]."
 latinization_vs_hellenization.22.a: "幼き[target_character_1.GetShortNameWithNoTooltip]には、最上のものだけを与えねば！"
 latinization_vs_hellenization.22.b: "[target_character_1.GetShortNameWithNoTooltip]は人を率いるために生まれた！ 学問など二の次だ！"
 heir_will_receive_more_tutoring_tt: "我らが敬愛する[target_character_1.GetShortName]はさらなる教育を受け、その[abilities|e]が向上する。もし[target_character_1.GetSheHe]が王位に就けば、その施政にも影響を及ぼす可能性がある。"
 latinization_vs_hellenization.23.title: "文に通じた[target_character.GetWomanMan|U]"
 latinization_vs_hellenization.23.desc: "A wandering [target_culture.GetName] scholar, trained in the humanist traditions of the Italian cities, has arrived at our [ROOT.GetCountry.GetGovernment.GetCourtTitle], bearing Latin manuscripts, philosophical commentaries, and ideas drawn from the flourishing learning of the West. Such a figure could be a valuable conduit to the intellectual currents of the Latin world. However, we ought to be wary of the foreign sympathies [target_character.GetSheHe] may bring with [target_character.GetHerHim]."
 latinization_vs_hellenization.23.a: "旅人よ、しばしここに留まるとよい。"
 latinization_vs_hellenization.23.b: "流浪の乞食のたわ言など、聞くに値しない。"
 latinization_vs_hellenization.24.title: "博識の旅人"
 latinization_vs_hellenization.24.desc: "A learned [target_character.GetWomanMan] versed in the writings of the Church Fathers and the commentaries of the great Orthodox theologians has requested the right to reside at our [ROOT.GetCountry.GetGovernment.GetCourtTitle], offering to share manuscripts gathered from the monasteries of the East and a deep knowledge of imperial law and Orthodox doctrine. Whether this wisdom strengthens our traditions or merely adds another voice to a crowded court is up to us."
 latinization_vs_hellenization.24.a: "よかろう、留まることを許そう。"
 latinization_vs_hellenization.24.b: "別段どうということもない。[target_character.GetSheHe|U]もまた、大勢のなかの一人にすぎない。"
 latinization_vs_hellenization.25.title: "文化の退廃"
 latinization_vs_hellenization.25.desc: "年代記の編者たちは、[ROOT.GetCountry.GetName]の文化的活力が失われつつあることを嘆いている。文化への後援も細り、伝統は顧みられず、かつて民を鼓舞した作品も、いまでは図書庫や宝物庫で埃をかぶっている。偉大な文化の担い手を自任しながらも、我々は時代に取り残されてしまったのであろうか。"
 latinization_vs_hellenization.25.a: "我らの遺産が色褪せたことを認めるしかない。"
 latinization_vs_hellenization.25.b: "いや、間違っているのは他の者どもだ！"
 latinization_vs_hellenization.26.title: "Eastern Fashions at the [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 latinization_vs_hellenization.26.desc: "Silks, perfumes, and customs carried by merchants and envoys from the courts of the East have captured the imagination of our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Some regard this as natural for an empire that has long stood between East and West, while others argue that our future lies with the Latin powers and that an eastward-looking court will only drive our Western allies away."
 latinization_vs_hellenization.26.a: "The East has always been part of our world."
 latinization_vs_hellenization.26.b: "We must look to the West, not the East."
 latinization_vs_hellenization.27.title: "[ShowSocietyDirectionNameWithNoTooltip('hellenization')]政策の成果"
 latinization_vs_hellenization.27.desc: "我々が進めてきた文化政策は、ついに実を結びつつある。学者たちは新たに得られた明晰さを称え、提督たちは取り戻された自信を語り、民もまた、いかに異論があろうとも、我らの進む道が確かな目的へ通じていることを感じ取っている。"
 latinization_vs_hellenization.27.a: "胸を張れ、我らは祖先に誇ってもらえる。"
 strength_of_hellenization_desc: "[country_modifier|e]「[ShowModifierTypeName('monthly_towards_hellenization')]」の強さ"
 latinization_vs_hellenization.28.title: "時流に抗う[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 latinization_vs_hellenization.28.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の有力諸家は、[ROOT.GetCountry.GetFlavorRank]の文化政策があまりに性急で、行きすぎていると不満を漏らしている。彼らは自分たちの堅実な導きだけが、[ROOT.GetCountry.GetName]がその独自性を完全に失うのを阻止できるのだと言い張っている。"
 latinization_vs_hellenization.28.a: "彼らの要求を受け入れる。"
 latinization_vs_hellenization.28.b: "方針を変えるつもりはない。"
 latinization_vs_hellenization.29.title: "時流に抗う[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]"
 latinization_vs_hellenization.29.desc: "遺憾ながら、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]は近ごろ、我らの文化のあり方に不安の声を上げはじめている。こうした風潮を堕落を招くもの、あるいは危ういものと見る者もいるが、信仰をこのような悪しき流れから守らねばならないという点では、皆の意見が一致している。"
 latinization_vs_hellenization.29.a: "彼らの警告を聞き入れよう。"
 latinization_vs_hellenization.29.b: "教義に政策を左右させてはならない。"
 refusal_leads_instability: "要求を退けることで情勢が不安定になる"
 situation_dissipates: "苛烈な言い争いはそれ以上激化しない"
 latinization_vs_hellenization.30.title: "時流に抗う[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"
 latinization_vs_hellenization.30.desc: "[ROOT.GetCountry.GetName]の田畑や村々では、下々の民の多くが、遠くで交わされる威光やしきたりをめぐる議論など、自分たちには新たな負担と見慣れぬ役人をもたらすばかりだと不平をこぼしている。こうした静かな反発も、顧みられぬままであれば、やがて大きなものとなりかねない。"
 latinization_vs_hellenization.30.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]たちをなだめよ。"
 latinization_vs_hellenization.30.b: "時流に従わせろ。"
