l_japanese:
 contact_patriarch_of_constantinople: "コンスタンティノープルの総主教への接触"
 contact_patriarch_of_constantinople_desc: "わが国の信仰告白を携えたメランヒトンをコンスタンティノープルへ遣わし、[ShowReligionAdjective('orthodox')]総主教庁との対話の道を開く。"
 reformation.17.title: "コンスタンティノープルに宛てた[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]の書簡"
 reformation.17.desc: "[melanchthon.GetName]は、わが国随一の神学者として、大胆な策を提案している。すなわち、わが国の信仰告白を携えた使節をコンスタンティノープル総主教のもとへ遣わすというものである。[ShowReligionAdjective('orthodox')]と[ShowReligionAdjective('lutheran')]は多くの点で隔たりを残しているが、教皇の首位権を認めない点では一致している。同じくローマに抗する者からの働きかけであれば、総主教も受け入れるかもしれない。"
 reformation.17.a: "[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]に信仰告白を持たせ、遣わそう。"
 reformation.17.b: "いまは、そのような働きかけをする時ではない。"
 reformation.17.historical_info: "フィリップ・メランヒトン（1497年–1560年）は、ルターの最も重要な協力者であり、『アウクスブルク信仰告白』（1530年）の起草者であった。メランヒトンは、ローマに対抗するうえで東方教会を潜在的な同盟者とみなし、深い関心を寄せていた。ギリシア人学者たちとの書簡のやり取りは、のちのルター派によるコンスタンティノープルへの働きかけの土台となった。1573年、チュービンゲンの神学者たちは『アウクスブルク信仰告白』のギリシア語訳を総主教イェレミアス2世に送り、宗教改革期におけるルター派と正教会のあいだで、最も継続的な神学対話のひとつが始まった。"
 reformation.18.title: "ルター派改革者たちからの書簡"
 reformation.18.desc: "[lutheran_country.GetLongName]からの使節団が、彼らの信仰告白を記した神学文書を携えてコンスタンティノープルに到着した。[ShowReligionAdjective('lutheran')]の改革者たちは、ローマ司教に反対する立場を共有していることを理由に、わが総主教庁との対話を求めているようである。その意図が真摯なものか、それとも自らの利益を図るものかは、まだ見極める必要がある。"
 reformation.18.a: "この改革者たちと慎重に神学対話をおこなおう。"
 reformation.18.b: "異端者どもめ。追い返せ！"
 reformation.18.historical_info: "コンスタンティノープル総主教庁は、1453年のオスマン帝国による征服後も、正教徒に対する精神的権威を保ちつづけた。総主教イェレミアス2世（在位1572年–1595年）は神学に深く通じていたことで知られ、チュービンゲンの神学者たちから届いた書簡にも真摯に向き合い、1576年から1581年にかけて3通の詳細な返書を著した。イェレミアス2世は、義認、自由意志、フィリオクェをめぐるルター派の教義を退けたが、彼らの問いかけが真摯なものであることは認めており、その返書は単に拒絶するだけのものではなかった。"
 reformation.19.title: "総主教、関心を示して応じる"
 reformation.19.desc: "総主教は、わが国の使節の訪問に慎重ながらも関心を示して応じた。教義上の合意には至らなかったものの、このやり取りによって、コンスタンティノープルとわが国教会とのあいだに対話の道が開かれた。これは、[ShowReligionAdjective('lutheran')]と[ShowReligionAdjective('orthodox')]のキリスト教世界における相互理解へ向けた、小さいながらも意味ある一歩である。"
 reformation.19.a: "どれほど細いつながりでも、ないよりはいい。"
 reformation.19.historical_info: "チュービンゲン書簡は、初期の教会間対話における画期的な試みとみなされている。総主教イェレミアス2世の3通の返書（1576年、1579年、1581年）は、ルター派の中核的主張を退けながらも、その神学に真摯に向き合うものであった。イェレミアス2世は、信仰義認、自由意志、フィリオクェをめぐる論点に対し、教父たちの著作に基づく詳細な論証をもって応じた。一連の応答は、オスマン帝国支配下にあっても総主教庁が知的活力を保っていたことを示している。こうして交わされた書簡群は、双方によって大切に保存された。"
 reformation.20.title: "総主教、使節団を退ける"
 reformation.20.desc: "わが国の使節団はコンスタンティノープルで冷遇された。総主教は我々の信仰告白を異端の一種として退け、使節は礼も尽くされぬまま送り返された。これは、[ShowReligionName('lutheran')]がローマからもコンスタンティノープルからも隔たった存在であることを改めて示している。"
 reformation.20.a: "我々の信仰に、総主教庁の承認など不要だ。"
 reformation.20.historical_info: "チュービンゲン書簡は、最終的に教義上の合意には至らなかった。総主教イェレミアス2世の3通の返書（1576年、1579年、1581年）は、信仰義認、聖書のみ、フィリオクェをめぐるルター派の立場を退け、それらを正教会には受け入れられない新奇な教説であると主張した。ルター派はやがて、これ以上書簡を交わしても実りはないと結論づけ、1581年にこの対話を終えた。"
 reformation.21.title: "正教会の学者の来訪"
 reformation.21.desc: "コンスタンティノープルとの書簡のやり取りは思わぬ実を結んだ。わが国の使節が始めた神学論議を続けるため、[ShowReligionAdjective('orthodox')]の学者[orthodox_scholar.GetName]が宮廷を訪れた。この来訪には慎重な対応が求められる。あまりに手厚く迎えれば自国の聖職者たちを刺激しかねず、退ければコンスタンティノープルで得た好意を失いかねない。"
 reformation.21.a: "長期にわたる学術交流を手配しよう。"
 reformation.21.b: "丁重に礼を述べ、これ以上の交流は辞退せよ。"
 reformation.21.historical_info: "チュービンゲン書簡は教義上の一致には至らなかったが、双方に大きな学問的関心を呼び起こした。ギリシア正教の知識人はルター派神学への理解を深め、ルター派の学者たちは教父や東方キリスト教の伝統について、より深い知識を得た。この宗派を越えた交流は、古代ギリシアのキリスト教をローマとは別の知的な拠り所とみなす、より広いヨーロッパ人文主義の発展に寄与した。"
