l_japanese:
 d008_flavor_byz.1.title: "錬金術の約束"
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
 d008_flavor_byz.1.desc: "かつて、ギリシャの火は地中海全域、さらにはその遥か先まで知れ渡り、敵国のあらゆる海軍から恐れられ、伝説的な存在にまでなった。水の上であってもいかなる炎よりも激しく燃え上がり、通常の手法では消火不可能というその特性は、どんな艦船をも一瞬にして灰に変えてしまうことができた。その製法はわが国の厳重な機密であったが、時の流れとともにその知識も失われ、以前のように製造することは叶わなくなっている。\n\nそしていま、我らが誇る高名な錬金術師[target_artist.GetName]が、失われた製法を復元し、再現できると断言している。もしそれが事実なら、我々の艦隊に再びこの死の炎を装備させることができるだろう。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]も[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]もこの報せに沸き立っているが、開発のために[target_artist.GetNameWithNoTooltip]は実験資金を要求している。"
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U]が必要とするものはすべて与えよう！"
 d008_flavor_byz.1.b: "我らの海軍は過去の幻想にすがらなくとも十分に強力だ。"
 d008_flavor_byz.1.a.tt: "[target_artist.GetName]がギリシャの火の製法を求め、実験を開始する"
 d008_flavor_byz.2.title: "火を求めて"
 d008_flavor_byz.2.desc: "ギリシャの火の製法を求めて[target_artist.GetName]が自身の研究室に閉じこもるようになってから久しいが、これまでの成果といえば、数回にわたる夜間の爆発と、焼け焦げた眉毛だけだ。[target_artist.GetHerHis|U]の明らかな無能ぶりに、この試みが本当に成功するのか疑問を抱く者も増えているが、本人は成功間近だと主張し、あと少しの時間と資金があれば実現できると断言している。"
 d008_flavor_byz.2.a: "よかろう、[target_artist.GetHerHim]に追加の資金を提供してやろう。"
 d008_flavor_byz.2.b: "もうこのような幻想にはうんざりだ。"
 d008_flavor_byz.2.a.tt: "[target_artist.GetName]がギリシャの火の製法を研究しつづける"
 d008_flavor_byz.3.title: "ギリシャの火"
 d008_flavor_byz.3.desc: "[ROOT.GetCountry.GetCapital.GetName]の住民たちは、[target_artist.GetName]の実験による爆発のせいで、幾夜も安眠を妨げられてきた。自身も実験中に何度も火傷を負ったが、すべての苦難が実を結んだ。幾多の試行錯誤の末、[target_artist.GetSheHe]は歴史の記録にある通り、ギリシャの火を確実な精度で再現することに成功したのだ。いまや我々は生産を拡大し、艦船にこれを装備させることができる。正確な製法と製造工程は引き続き機密にしておくが、今度こそこの製法が忘れ去られないようにしなければならない。"
 d008_flavor_byz.3.a: "いま一度、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]海軍が海を炎で包むだろう！"
 unlocked_greek_fire_tt: "[unit_types|e]「[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]」「[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]」「[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]」「[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')]」が使用可能になる"
 d008_flavor_byz.5.title: "タグマタの改革"
 d008_flavor_byz.5.entry: "$d008_flavor_byz.5.title$"
 d008_flavor_byz.5.desc: "[ROOT.GetCountry.GetAdjective]を崩壊の危機に追いやった試練がようやく去った。なかでも特に重い負担を背負っていたのが、古より[ROOT.GetCountry.GetGovernment.GetRulerTitle]に直接忠誠を誓っている熟練兵の連隊であるタグマタだ。かつての栄光は衰えて久しいものの、我々が生き延びられたのは、徴兵からなる封建軍とは別に、常備軍として彼らが存続していたからにほかならない。\n\n安定を取り戻したいま、[target_character.GetName]は次になすべきこと、すなわちタグマタの大改革へと目を向けている。帝国の財源を復活させ、より厳格な規律を設け、新たな目的意識を確立することで、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の連隊を名実ともに一般徴兵軍とは一線を画す存在に引き上げるのだ。今回の危機がもたらした逆境のなかで築かれた財産を、今度は平和のなかで[ROOT.GetCountry.GetLongNameWithNoTooltip]にとって真に価値あるものに鍛えていかねば。"
 d008_flavor_byz.5.a: "タグマタを[ROOT.GetCountry.GetNameWithNoTooltip]の前衛部隊に作り変えよう。"
 d008_flavor_byz.5.a.entry: "タグマタをローマの前衛部隊に作り変えよう。"
 d008_flavor_byz.5.b: "かの連隊はすでに試練のなかで自らの力を示してみせた。"
 variable_won_fate_of_the_phoenix_disaster_variable_tt: "「[ShowDisasterName('fate_of_the_phoenix')]」を乗り越えた"
 d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip]による研究の終焉"
 d008_flavor_byz.4.desc: "[target.GetName]の早すぎる死により、ギリシャの火の製法探求は不運にも未完に終わってしまった。[target.GetHerHis]の弟子やほかの高名な錬金術師たちが、研究をなんとか継続できないかを確認するため[target.GetHerHis]の手記を調べたが、残念ながら実験は堂々めぐりだったようで、具体的な手がかりを掴むことはできなかった。こうしてギリシャの火は、歴史のなかに封印された謎のままとなり、永久に解き明かされることはなくなったのであった。"
 d008_flavor_byz.4.a: "そうか…… それは残念だ……"
 d008_flavor_byz.6.title: "不死鳥の再誕"
 d008_flavor_byz.6.entry: "$d008_flavor_byz.6.title$"
 d008_flavor_byz.6.desc: "黒海沿岸になんとか残っている脆弱な継承国だった[ROOT.GetCountry.GetName]が、以前は考えられなかったことを成し遂げた。[ShowLocationName('constantinople')]はわが国のものとなり、[ShowCultureGroupName('turkic_group')]の侵略者どもは[ShowRegionName('anatolia_region')]の広大な土地から放逐され、[ROOT.GetCountry.GetLongNameWithNoTooltip]が古代の栄光を取り戻したのだ。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の学者たちは、[ROOT.GetCountry.GetFlavorRank]の再興は灰から蘇る不死鳥のようだとささやいている。\n\n[target_character.GetName]はいまやローマ帝国の遺産の完全なる後継者となった。復興への道のりは、先祖が最も暗き時代に乗り越えた試練にも劣らぬほど過酷だった。だがわが国は征服と復活を成し遂げ、厳しい試練を突破した国家だけに許される制度、特権、そして野望をついに手中に納めたのだ。"
 d008_flavor_byz.6.a: "帝国は灰から再生する。"
 tre_restored_empire_unlocks_tt: "わが国が[bureaucracies|e]「[ShowBureaucracyTypeName('allelengyon_bureaucracy')]」と「[ShowBureaucracyTypeName('kephalai_bureaucracy')] 」、[building|e]「[ShowBuildingTypeName('hippodrome')]」を利用できるようになり、[government_reforms|e]「[ShowGovernmentReformName('katepanata')]」と「[ShowGovernmentReformName('kritai_katholikoi_reformed')]」のボーナスが無期限になる"
 tre_unlock_phoenix_cabinet_actions_tt: "[cabinet_actions|e]「[ShowCabinetActionName('spread_philhellenism')]」と「[ShowCabinetActionName('encourage_latin_militarism')]」が恒久的に利用可能になる"
