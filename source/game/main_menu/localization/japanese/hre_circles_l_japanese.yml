 INCOMING_OFFER_request_new_circle_titles: "[SCOPE.sCountry('actor').GetName]がクライスにおける自国の昇格を求めている。受け入れた場合、[SCOPE.sCountry('actor').GetNameWithNoTooltip]の貴族たちは満足し、同国はより名誉ある地位に就くことになる。\n\n$INFO$"
 INCOMING_OFFER_TITLE_request_new_circle_titles: "$request_new_circle_titles$"
 request_new_circle_titles_timeout_tt: "過去2年間、どの国家も[diplomatic_action|e]「$request_new_circle_titles$」を使用していない"
 hre_circle_levy_request: "クライス召集軍を要請"
 hre_circle_levy_request_desc: "帝国のために召集軍を動員するよう帝国クライスに要請する。協力したクライスのリーダーには報奨が与えられる。"
 hre_enforce_circle_landfriede: "クライスにラント平和令を強制"
 hre_enforce_circle_landfriede_desc: "クライスのリーダーに対し、その領内における帝国の平和を維持するための権限を与える。"
 HRE_CIRCLE_LEVY_CIRCLES_ACTIVE: "帝国クライスが活動中"
 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "帝国クライス"
 imperial_circles.1.title: "帝国クライスが確立"
 imperial_circles.1.desc: "形成期間が終了した。帝国クライスは確立され、クライスのリーダーが帝国の政務を担うことになる。神聖ローマ帝国の新たな時代が幕を開ける。"
 imperial_circles.1.a: "帝国に栄光あれ！"
 imperial_circles.2.title: "行き渡らない資金"
 imperial_circles.2.desc: "先日の帝国議会において帝国憲法の改正が提案され、我々のクライスはそれを支持した。そして支持したことで、クライスのリーダーである我々がメンバーに資金を分配するという共通認識が生まれた。期待が正当かどうかはさておき、我々はそれに応えておらず、クライスのメンバーのための資金を分け合うことなく権力を濫用しているとの苦情が出ている。こういった苦情に対応しなければ、将来的にリーダーとしての我々の立場を脅かす禍根となるかもしれない。"
 imperial_circles.2.a: "彼らは正しい。いますぐ資金を分配すべきだ。"
 imperial_circles.2.b: "彼らは間違っている。そのような不正は存在しない。"
 imperial_circles.2.c: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]内の味方に助力を求めよ。"
 imperial_circles.11.title: "クライス内の不満"
 imperial_circles.11.desc: "クライスのメンバーが不穏な動きを見せている。すぐに行動を起こさなければ、クライスのリーダーとしての権威に公然と挑戦してくるかもしれない。"
 imperial_circles.11.a: "緊急資金を分配して緊張を緩和せよ。"
 imperial_circles.11.b: "不満を言わせておけ。もっと大きな懸念がある。"
 imperial_circles.12.title: "諸侯が改革を要求"
 imperial_circles.12.desc: "クライス内の不満は限界に達しており、メンバーはわが国の指導力に公然と疑問を呈している。選挙が間近に迫っているかもしれない。"
 imperial_circles.12.a: "手遅れになる前に行動せねば。"
 imperial_circles.20.title: "買われた票"
 imperial_circles.20.desc: "帝国議会で審議中の提案を支持するよう、[SCOPE.sCountry('actor').GetName]が帝国クライスのリーダーである [SCOPE.sCountry('target').GetName]にダカットを渡していた。我々は取り分として[SCOPE.GetValue('received_bribe')|0V]@gold!を受け取っており、この決議が終了するまで皇帝の選択に従って[vote|e]する。"
 imperial_circles.20.a: "ダカットを拒むことはしない。"
 imperial_circles.50.title: "クライス指導権への挑戦"
 imperial_circles.50.desc: "我々は帝国クライスのリーダーの地位をめぐり、[recipient.GetName]に挑戦することを表明した。\n\n連中の弱さと怠慢はもはや耐え難く、我々の不満を支持してくれるメンバーは多いはずだ。より優れた強力なリーダーであることを明確に示せたなら、我々の要求が認められるだろう。だがもし失敗すれば、他国だけでなく自国民からの評価まで下がることは間違いない。"
 imperial_circles.50.a: "挑戦を推し進めよ。"
 imperial_circles.50.b: "挑戦を撤回せよ。"
 imperial_circles.53.title: "挑戦に失敗"
 imperial_circles.53.desc: "帝国クライスの指導権をめぐる[recipient.GetName]への挑戦は、失敗に終わった。わが国の威信は相手に及ばず、失敗によって我々の地位は損なわれた。再び挑むには、時機を待たねばならない。"
 imperial_circles.53.a: "時機を待とう。"
 imperial_circles.51.title: "クライスリーダーから失脚"
 imperial_circles.51.desc: "ライバルが我々の指導権に挑戦し、成功した。わが国はクライスのリーダーの称号を剥奪され、クライス内での地位を再構築しなければならない。"
 imperial_circles.51.a: "この屈辱は忘れまい。"
 imperial_circles.52.title: "クライスの指導権を維持"
 imperial_circles.52.desc: "挑戦者が我々の地位を奪おうとしたが、相手の威信は不十分だった。わが国のクライスのリーダーとしての地位は安泰である。"
 imperial_circles.52.a: "わが国の権威はそう簡単に崩れるものではない。"
 imperial_circles.70.title: "クライスリーダーに選出"
 imperial_circles.70.desc: "前任のリーダーがクライスからいなくなり、クライスはわが国をその後継として選んだため、わが国がクライスリーダーとなった。"
 imperial_circles.70.a: "卓越した手腕でクライスを率いてみせよう。"
 imperial_circles.71.title: "リーダー不在のクライス"
 imperial_circles.71.desc: "帝国クライスのうちひとつで、適任なリーダー候補が不在となった。クライスが統治されないまま放置されることは、皇帝の権威を揺るがす。"
 imperial_circles.71.a: "我々がリーダーを任命しなければ。"
 imperial_circles.80.title: "帝冠はすべてを変える"
 imperial_circles.80.desc: "我々はいまや帝冠を戴いている。皇帝とクライスリーダーの役割を同時に担うことはできない。どちらの職も、専念することが求められるのだ。他国がクライスのリーダーに名乗りを上げられるよう、我々はその座を放棄する。"
 imperial_circles.80.a: "帝国が最優先だ。"
