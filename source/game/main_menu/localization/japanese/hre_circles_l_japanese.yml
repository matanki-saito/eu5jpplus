 distribute_imperial_grant: "帝国下賜金を分配"
 distribute_imperial_grant_desc: "国庫からクライスのメンバーにダカットを分配し、関係とクライス満足度を向上させる。"
 distribute_imperial_grant_act: "クライスのメンバーにダカットを分配する。"
 distribute_imperial_grant_tt: "わが国の[economical_base|e]の20%にあたる[SCOPE.GetValue('total_grant')|2V]@gold!を消費し、[imperial_circle|e]のリーダー以外のメンバーに等分に分配する。2年のあいだ、受け取った各メンバーは「[ShowModifier('received_imperial_circle_grant')]」を獲得し、わが国に対する[opinion|e]が[ShowBiasValue('opinion_received_imperial_grant')|+=2]上昇する"
 distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName]が自らのクライスに帝国下賜金を分配する。"
