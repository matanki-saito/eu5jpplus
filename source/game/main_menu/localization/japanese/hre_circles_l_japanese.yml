 bribe_imperial_circle: "帝国クライスを買収する"
 bribe_imperial_circle_desc: "帝国議会で我々の提案に賛成票を投じるよう、帝国クライスのリーダーおよびすべてのメンバーに金銭を支払う。クライスリーダーには基本となる賄賂の全額を、それ以外のメンバーにはその額の25%を支払う。すべてのメンバーの投票は、決議が終了するまで、皇帝が選択したものに固定される。"
 bribe_imperial_circle_act: "議会への提案に賛成するよう[SCOPE.sCountry('target').GetName]を買収する。"
 bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName]が帝国議会での提案に賛成票を投じるよう[SCOPE.sCountry('target').GetName]のクライスを買収する。"
 bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName]は帝国議会での提案に賛成票を投じるよう[SCOPE.sCountry('target').GetName]を買収した。"
 bribe_imperial_circle_members_tt: "[SCOPE.sCountry('target').GetName]のクライスに加盟する全メンバーは[SCOPE.GetValue('bribe_member_share')|0V]@gold!を受け取り、帝国議会で審議中の提案における[vote|e]が皇帝の選択したものに固定される"
 BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "[imperial_circle|E]全体を買収する"
 approve_imperial_circle_proposal: "提案に賛成する"
 approve_imperial_circle_proposal_desc: "クライスリーダーとして、帝国議会で審議中の提案において、自国を含むすべてのクライスメンバーの投票を賛成に固定する。支払いは不要だが、投票の固定は決議が終了するまで維持される。"
 approve_imperial_circle_proposal_act: "提案に賛成票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかける。"
 approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName]が提案に賛成票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかける。"
 approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName]は提案に賛成票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかけた。"
 approve_imperial_circle_proposal_members_tt: "帝国議会で審議中の提案において、[SCOPE.sImperialCircle('target').GetName]の全メンバーの[vote|e]が提案されたポリシーに固定される"
 oppose_imperial_circle_proposal: "提案に反対する"
 oppose_imperial_circle_proposal_desc: "クライスリーダーとして、自国を含むすべてのクライスメンバーに対して、帝国議会で審議中の提案に反対票を投じるよう固定する。現在有効なポリシーがあればこれに固定され、なければクライスは棄権する。"
 oppose_imperial_circle_proposal_act: "提案に反対票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかける。"
 oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName]が提案に反対票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかける。"
 oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName]は提案に反対票を投じるよう[SCOPE.sImperialCircle('target').GetName]に拘束をかけた。"
 oppose_imperial_circle_proposal_members_tt: "帝国議会で審議中の提案において、[SCOPE.sImperialCircle('target').GetName]の全メンバーの[vote|e]が現在のポリシーに固定され、現在有効なポリシーがなければ棄権する"
 call_imperial_circle_to_war: "クライスに参戦を要請"
 call_imperial_circle_to_war_desc: "クライスのリーダーに対し、現在の戦争にクライスの軍事支援を提供するよう呼びかける。"
