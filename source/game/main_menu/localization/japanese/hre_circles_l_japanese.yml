 demand_circle_loyalty: "クライスの忠誠を要求"
 demand_circle_loyalty_desc: "クライスメンバーに対してわが国の権威を主張する。3年のあいだ、わが国の威信と外交的地位が上昇するが、メンバーはその押し付けに憤慨し、クライス満足度は低下する。"
 demand_circle_loyalty_act: "クライスメンバーに対して自国の権威を主張する。"
 demand_circle_loyalty_tt: "わが国は3年のあいだ「[ShowModifier('imposed_circle_authority')]」を獲得する。わが[imperial_circle|e]のリーダー以外の各メンバーは3年のあいだ「[ShowModifier('pressured_circle_loyalty')]」を獲得し、わが国に対する[opinion|e]が[ShowBiasValue('opinion_demanded_loyalty')|+=2]上昇する。クライスの満足度は5低下する"
 demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName]がクライスに対し自国への忠誠を要求する。"
 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName]はクライスに対し自国への忠誠を要求した。"
 reform_coinage_in_circle: "クライスの貨幣制度改革"
 reform_coinage_in_circle_desc: "帝国は我々に、この地域の貨幣に関する権限を委ねた。我々の貨幣とその利用法を改革すれば、クライスの全メンバーの経済活動が円滑になり、同時にクライス内での我々の影響力を高められる。ただし残念ながら、我々の造幣能力は低下してしまう。"
 reform_coinage_in_circle_act: "クライスの貨幣改革を実行する。"
 reform_coinage_in_circle_tt: "5年間、我々は「[ShowModifier('reformed_circle_coinage_leader')]」を、クライスの全メンバーは「[ShowModifier('reformed_circle_coinage_member')]」を得る。クライスの全メンバーの我々に対する[opinion|e]が[ShowBiasValue('opinion_reformed_circle_coinage')|+=2]上昇し、クライスの満足度も5高まる"
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName]がクライスの貨幣制度を改革する。"
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName]がクライスの貨幣制度を改革した。"
 reduction_of_circle_titles: "クライス称号の削減"
 reduction_of_circle_titles_desc: "我々のクライスは称号と管理職の複雑化により効率が低下し、互いの足を引っ張ることすらある状況になっている。称号を減らせば、クライスを効率化できるだけでなく、リーダーとしての我々の立場を固めることもできる。ただし、クライスのメンバーは称号の集約を歓迎せず、満足度が低下するだろう。"
 reduction_of_circle_titles_act: "クライス称号の削減を実行"
 reduction_of_circle_titles_tt: "我々は「[ShowModifier('reduction_of_circle_titles')]」を獲得し、クライスの全メンバーの我々に対する[opinion|e]が[ShowBiasValue('opinion_reduction_of_circle_titles')|+=2]上がる。クライスの満足度は5下がる"
 reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName]がクライスの称号の削減を実行する"
 reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName]がクライスの称号の削減を実行した"
 challenge_circle_leadership: "クライス指導権に挑戦する"
 challenge_circle_leadership_desc: "現在のクライスのリーダーは、その地位と責任に相応しくないことを露呈した。我々はこの機に彼らの力に疑問を投げかけ、その権威を揺るがす。これによりその支配力をさらに弱めたり、公然と反旗を翻すことも可能になるかもしれない。"
 challenge_circle_leadership_act: "現在のクライスリーダーの権威に挑戦する。"
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName]がクライス指導権に挑戦する。"
 challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName]はクライス指導権に挑戦した。"
 challenge_circle_leadership_tt: "以下のいずれかを達成すると、わが国は挑戦に勝利する\n  • わが国のクライスの満足度が15未満になる — 公然たる反乱\n  • わが国のクライスの満足度が30未満、かつわが国の威信が相手と同等以上\n  • わが国の威信が相手を25以上上回る\n\n敗北または撤退すると威信を失う。新しく就任したリーダーは2年間、挑戦を受けない"
 appeal_to_emperor: "皇帝に直訴"
 appeal_to_emperor_desc: "クライス指導権紛争に介入するよう皇帝に直訴する。"
 appeal_to_emperor_act: "クライス指導権紛争に介入するよう皇帝に直訴する。"
 appeal_to_emperor_effect_text: "[SCOPE.sCountry('actor').GetName]が皇帝に直訴する。"
 appeal_to_emperor_effect_text_past: "[SCOPE.sCountry('actor').GetName]は皇帝に直訴した。"
 appeal_to_emperor_reject_effect_text: "[SCOPE.sCountry('recipient').GetName]が[SCOPE.sCountry('actor').GetName]の直訴を退ける。"
 appeal_to_emperor_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName]は[SCOPE.sCountry('actor').GetName]の直訴を退けた。"
 INCOMING_OFFER_appeal_to_emperor: "[SCOPE.sCountry('actor').GetName]が帝国クライスの指導権紛争に介入するよう我々に直訴してきた。受け入れると、クライスの満足度が8低下し、クライスのリーダーの威信にペナルティが課され、わが国の威信と帝国の権威が増加する。\n\n$INFO$"
