l_japanese:
 # Scripted relation — display name and description
 inheritance_contract_relation: "相続契約"
 inheritance_contract_relation_desc: "別の国の統治者が世継ぎをつくらずにこの世を去った場合に、その国を受け継ぐ権利を確保するべく、ある国が金銭を支払う。"
 # Offer UI keys (never visible -- offer_visible = always = no -- but required by the engine)
 offer_inheritance_contract: "相続契約の提案"
 offer_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 offer_inheritance_contract_cta: "[TARGET_COUNTRY.GetName]に[inheritance_contract|e]を提案する"
 offer_inheritance_contract_desc: "わが国の統治者が後継者不在でこの世を去った場合、[TARGET_COUNTRY.GetName]に国を受け継ぐ権利を与える。"
 offer_inheritance_contract_cta_to_unknown: "他国に[inheritance_contract|e]を提案する"
 offer_inheritance_contract_desc_to_unknown: "我らの統治者が後継者不在でこの世を去った場合、他国にわが国を受け継ぐ権利を与える。"
 offer_inheritance_contract_happened_title: "相続契約の申し出"
 offer_inheritance_contract_happened_desc: "[COUNTRY.GetName]が[TARGET_COUNTRY.GetName]に[inheritance_contract|e]を提案し、彼らの統治者が後継者不在でこの世を去った場合に、国を受け継ぐ権利を譲るとの話を持ちかけた。"
 offer_inheritance_contract_proposal_question: "[TARGET_COUNTRY.GetName]に[inheritance_contract|e]を提案しますか？\n$INFO$"
 offer_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e] Offer"
 offer_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]がわが国に[inheritance_contract|e]を提案しています。彼らの統治者が後継者不在でこの世を去った場合、我々に国を受け継ぐ権利を譲るというものです。受け入れますか？"
 # Request UI keys (non-buy -- disabled since can_get_without_buying = no -- but required by the engine)
 request_inheritance_contract: "相続契約の要請"
 request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 request_inheritance_contract_cta: "[TARGET_COUNTRY.GetName]に[inheritance_contract|e]を要請する"
 request_inheritance_contract_desc: "[TARGET_COUNTRY.GetName]の統治者が後継者不在でこの世を去った場合、我々に国を受け継ぐ権利を譲るように求める。"
 request_inheritance_contract_cta_to_unknown: "他国に[inheritance_contract|e]を要請"
 request_inheritance_contract_desc_to_unknown: "どこかの[country|e]の統治者が後継者不在でこの世を去った場合、我々に国を受け継ぐ権利を譲るように求める。"
 request_inheritance_contract_happened_title: "相続契約の締結"
 request_inheritance_contract_happened_desc: "[COUNTRY.GetName]が[TARGET_COUNTRY.GetName]と[inheritance_contract|e]を結んだ。[TARGET_COUNTRY.GetNameWithNoTooltip]の統治者が後継者不在でこの世を去った場合、[COUNTRY.GetNameWithNoTooltip]が国を受け継ぐ。"
 request_inheritance_contract_proposal_question: "[TARGET_COUNTRY.GetName]に[inheritance_contract|e]を要請しますか？\n$INFO$"
 request_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e] Request"
 request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]がわが国との[inheritance_contract|e]の締結を望んでおり、そうなれば我らの統治者が後継者不在でこの世を去った場合、彼らがこの国を受け継ぐ権利を得ることになります。受け入れますか？"
 # Buy request UI keys
 buy_request_inheritance_contract: "金銭を介して相続契約を結ぶ"
 buy_request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 buy_request_inheritance_contract_cta: "金銭を支払って[TARGET_COUNTRY.GetName]と[inheritance_contract|e]を結ぶ"
 buy_request_inheritance_contract_desc: "[gold|e]を支払い、[TARGET_COUNTRY.GetName]の統治者が後継者不在でこの世を去った場合に国を受け継ぐ権利を確保する。"
 buy_request_inheritance_contract_cta_to_unknown: "金銭を支払って他国と[inheritance_contract|e]を結ぶ"
 buy_request_inheritance_contract_desc_to_unknown: "[gold|e]を支払い、後継者不在の国の統治者がこの世を去った場合にその国を受け継ぐ権利を確保する。"
 buy_request_inheritance_contract_happened_title: "相続契約の締結"
 buy_request_inheritance_contract_happened_desc: "[COUNTRY.GetName]が金銭を支払って[TARGET_COUNTRY.GetName]と[inheritance_contract|e]を結んだ。[TARGET_COUNTRY.GetNameWithNoTooltip]の統治者が後継者不在でこの世を去った場合、[COUNTRY.GetNameWithNoTooltip]が国を受け継ぐ。"
 buy_request_inheritance_contract_proposal_question: "$COST$を支払って[TARGET_COUNTRY.GetName]と[inheritance_contract|e]を結びますか？\n$INFO$"
 buy_request_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e]の提案"
 buy_request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]が$COST$でわが国と[inheritance_contract|e]を結ぶことを望んでいます。取引が成立すれば、我らの統治者が後継者不在でこの世を去った場合、彼らがこの国を受け継ぐ権利を得ることになります。受け入れますか？"
 inheritance_contract_effect_text: "[COUNTRY.GetName]が[TARGET_COUNTRY.GetName]との[inheritance_contract|e]を確保した。"
 inheritance_contract_effect_text_past: "[COUNTRY.GetName]が[TARGET_COUNTRY.GetName]との[inheritance_contract|e]を確保した。"
 giving_inheritance_contract_list_who_tt: "$WHO$が$LIST$に[inheritance_contract|e]権を与えた"
 receiving_inheritance_contract_list_who_tt: "$WHO$は$LIST$と[inheritance_contract|e]を結んでいる"
 # Cancel UI keys
 cancel_inheritance_contract: "相続契約を取り消す"
 cancel_inheritance_contract_cta: "[SCOPE.sCountry('recipient').GetName]との[inheritance_contract|e]を取り消す"
 cancel_inheritance_contract_desc: "契約を解除し、金銭を支払って手に入れた相続権を放棄する。"
 cancel_inheritance_contract_cta_to_unknown: "他国との[inheritance_contract|e]を取り消す"
 cancel_inheritance_contract_desc_to_unknown: "契約を解除し、金銭を支払って手に入れた相続権を放棄する。"
 cancel_inheritance_contract_happened_title: "相続契約の解除"
 cancel_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]との[inheritance_contract|e]を解除した。"
 cancel_inheritance_contract_proposal_question: "[TARGET_COUNTRY.GetName]との[inheritance_contract|e]を取り消しますか？\n$INFO$"
 # Break UI keys
 break_inheritance_contract: "相続契約の破棄"
 break_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 break_inheritance_contract_cta: "[SCOPE.sCountry('recipient').GetName]との[inheritance_contract|e]を破棄する"
 break_inheritance_contract_desc: "[inheritance_contract|e]を終了し、所有している相続権を放棄する。"
 break_inheritance_contract_cta_to_unknown: "他国との[inheritance_contract|e]を破棄する"
 break_inheritance_contract_desc_to_unknown: "[inheritance_contract|e]を終了し、所有している相続権を放棄する。"
 break_inheritance_contract_happened_title: "相続契約の破棄"
 break_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]との[inheritance_contract|e]を破棄し、自ら購入した相続権を放棄した。"
 break_inheritance_contract_proposal_question: "[TARGET_COUNTRY.GetName]との[inheritance_contract|e]を破棄しますか？\n$INFO$"
 # Diplomatic status panel keys
 diplomatic_status_giving_inheritance_contract_name: "相続契約の付与"
 diplomatic_status_giving_inheritance_contract_tooltip: "#T 相続契約権の付与#!\nこの国は[inheritance_contract|e]に基づき、以下の[countries|e]に相続権を与えた"
 diplomatic_status_receiving_inheritance_contract_name: "相続契約"
 diplomatic_status_receiving_inheritance_contract_tooltip: "#T 相続契約#!\nこの国は以下の[countries|e]と[inheritance_contract|e]を結んでおり、彼らの統治者が後継者不在でこの世を去った場合に、国を受け継ぐ権利を相手国に保証している"
 # AI wants_to_give reason descs
 inheritance_contract_same_culture_group: "共通の文化遺産によって、この取り決めの信頼性が強化される。"
 inheritance_contract_hre_members: "どちらの国も属する[holy_roman_empire|e]では、[inheritance_contracts|e]は確立された法的伝統である。"
 # Event strings
 inheritance_contract.1.title: "相続契約権の確保"
 inheritance_contract.1.desc: "[SCOPE.sCountry('contract_partner').GetGovernment.GetRuler.GetName]が世継ぎ不在でこの世を去った場合、国を受け継ぐ権利が我々のものとなるよう、[SCOPE.sCountry('contract_partner').GetName]に金銭を支払った。多額の投資となるが、相当な潜在的利益が見込まれる。"
 inheritance_contract.1.a: "価値ある投資だ。"
 inheritance_contract.3.title: "相続契約の履行"
 inheritance_contract.3.desc: "[SCOPE.sCountry('dead_ruler_country').GetName]の統治者が後継者不在でこの世を去ったため、我々と締結した[inheritance_contract|e]が発効し、かの国は我らが王のものとなった。"
 inheritance_contract.3.a: "根気強く待った甲斐があった。"
 inheritance_contract.4.title: "相続契約の失効"
 inheritance_contract.4.desc: "わが国の統治者がこの世を去ったことで、[SCOPE.sCountry('dead_paying_country').GetName]と結んでいた[inheritance_contract|e]も失効した。相続権を確保するための投資も無駄になってしまった。"
 inheritance_contract.4.a: "多大な損害を伴う不運だ。"
