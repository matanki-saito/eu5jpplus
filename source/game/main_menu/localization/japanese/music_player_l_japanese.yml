 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "名手たちの卓越した技巧によって奏でられる、中国伝統音楽を代表する名曲。紀元前202年、項羽が劉邦に敗れた垓下の戦いを描いた、勇壮な武曲である。"
