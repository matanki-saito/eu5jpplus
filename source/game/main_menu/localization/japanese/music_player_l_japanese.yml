 #### CONTRIBUTING COMPOSERS, PERFORMERS AND SOLOISTS ####
 Mattias_Henndlund: "マティアス・ヘンドルンド"
 Hakan_Glante: "ホーカン・グレンテ"
 Hakan_Glante_and_Bach: "ホーカン・グレンテ、J.S.バッハ"
 Norrkoping_Symphony_Orchestra: "ノーショーピング交響楽団"
 Yingying_Herrdahl: "インイン・ヘルダール（琵琶）"
 Yingying_Herrdahl_facts: "インイン・ヘルダールは、現在スウェーデンを拠点に活動する琵琶の名手。"
 Pipa_facts: "中国琵琶は、洋梨形の胴を持つ弦楽器で、爪で弦をはじいて演奏する。かつては撥も用いられた。およそ2000年の歴史を持ち、中国を代表する楽器のひとつとして広く親しまれている。"
 Martin_Ostergren: "マルティン・エステルグレン（オルガン）"
 Feras_Charestan: "フェラス・チャレスタン（カーヌーン）"
 Feras_Charestan_facts: "フェラス・チャレスタンはシリア北東部アル＝ハサカ出身で、ダマスカス高等音楽院でカーヌーンを学んだ。"
 Qanun_facts: "カーヌーンはツィター属の弦楽器で、その起源は定かではないが、古代メソポタミアにまで遡るともいわれている。"
 Ilona_Danho: "イロナ・ダンホ（ボーカル）"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$、$Ilona_Danho$"
 Dan_Cecil_Hill: "ダン・セシル・ヒル（フルート）"
 Dan_Cecil_Hill_facts: "ダン・セシル・ヒル（カユーガ族、サギ氏族）は、伝統的な銀細工とフルート製作を専門とするホデノショニ（イロコイ）の芸術家・音楽家。長年にわたり文化の担い手として活動し、ヨーロッパ人による植民地化以前にまで遡るホデノショニの歴史と文化を守り伝えることに尽力してきた。"
 Pierre_Harmon: "ピエール・アルモン"
 Pierre_Harmon_facts: "ピエール・アルモンは著名なフルート奏者で、先コロンブス期の音楽研究でも知られる専門家。とりわけアステカ音楽の研究で世界的に高く評価され、古代楽器の世界有数のコレクションも所蔵している。長年にわたり、それらの楽器の奏法を研究し、身につけてきた。"
 Laurent_Sauron: "ローラン・ソロン"
 Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$（フルート）、$Laurent_Sauron$（打楽器）"
 Nana_Osei_Twum_Barima_seperewa: "ナナ・オセイ・トゥム・バリマ（ボーカル、セプレワ）"
 Nana_Osei_Twum_Barima_aho: "ナナ・オセイ・トゥム・バリマ（ボーカル、アトゥンパン、ンタヘラ、ダウロ、フィリキワ、ントワム）"
 Nana_Osei_Twum_Barima_asanteman: "ナナ・オセイ・トゥム・バリマ（ボーカル、セプレワ、ペルペムスア、アトゥンパン、ダウロ、フィリキワ、ントワム）"
 Rohan_Pillai: "ローハン・ピライ（ヴィーナ）"
 Pancham_Upadhyay: "パンチャム・ウパディヤイ（ムリダンガム）"
 Rohan_Pillai_and_Pancham_Upadhay: "$Rohan_Pillai$、$Pancham_Upadhyay$"
 traditional: "伝統音楽"
 improvisational: "即興演奏"
 Jacob_Regnart: "ヤコプ・ルニャール（1540年代～1599年）"
 Jacob_Regnart_facts: "ルニャールはドゥエーに生まれたフランドルのルネサンス作曲家で、宗教曲から世俗曲まで幅広く手がけた。生涯を通じてオーストリアやボヘミア各地で活動し、1580年代にはインスブルックでフェルディナント大公に仕え、宮廷楽長を務めた。"
 Martin_Rinckart: "マルティン・リンカルト（1586～1649年）"
 Martin_Rinckart_facts: "リンカルトはルター派の聖職者・讃美歌作家。ザクセン北部のアイレンブルクに生まれ、同地で大助祭を務め、1649年に没した。"
 Joachim_Neander: "ヨアヒム・ネアンダー（1650～1680年）"
 Joachim_Neander_facts: "ネアンダーはブレーメン生まれの改革派（カルヴァン派）の讃美歌作家・神学者・教師。改革派を代表する讃美歌作家のひとりとされ、およそ60篇の讃美歌を残した。"
 Dietrich_Buxtehude: "ディートリヒ・ブクステフーデ（1637～1707年）"
 Dietrich_Buxtehude_facts: "ディートリヒ・ハンセン・ブクステフーデは1637年、スコーネ地方のヘルシンボリに生まれた。17世紀を代表する作曲家のひとりで、バッハやヘンデルをはじめ、後世の作曲家たちに大きな影響を与えた。"
 Gabriel_Asaad: "ガブリエル・アサド（1907～1997年）"
 Rohi_al_Khammash: "ロヒ・アル＝ハンマシュ（1923～1998年）"
