 #### TRACK NAMES AND FLAVOUR TEXT ####
 MusicPlayer_01_Overture_I_Genesis: "01 - Overture I Genesis"
 MusicPlayer_01_Overture_I_Genesis_flavour: "「世界は目覚める。陽光に照らされ、その姿がひとつ、またひとつと浮かびあがってゆく」"
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Overture II Odyssey"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "「物語の幕開け。その趣と主題が、ここに描き出される」"
 MusicPlayer_03_Royal_Court_Invitation: "03 - Royal Court Invitation"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "この曲を彩るチェンバロは、ルネサンスからバロックの時代に広く親しまれた鍵盤楽器である。鍵盤を押すと、羽軸で作られた爪が弦をはじき、その独特の響きを奏でる。"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - The Noble Art of Diplomacy"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "リュートの系譜は、遠い昔から世界各地に息づいてきた。ルネサンス期のヨーロッパでは、リュートの音色が世俗音楽を彩り、その時代を象徴する響きとなった。"
 MusicPlayer_21_Conquer_or_Fall: "21 - Conquer or Fall"
 MusicPlayer_21_Conquer_or_Fall_flavour: "ホルン、弦楽、合唱が織りなす壮大な一曲。『Europa Universalis V』を彩る主旋律のひとつが、新たな息吹を得て、力強く高揚感あふれる響きとなって鳴り渡る。"
 MusicPlayer_07_For_the_Lost_Ones: "07 - For the Lost Ones"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "哀しみをたたえた調べがゆるやかにうねり、『Europa Universalis V』を彩る旋律が静かに響き渡る。"
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Jester Speaks the Truth"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "初期ルネサンスの調べに着想を得た一曲。『Europa Universalis V』を彩る旋律が、さまざまに表情を変えながら軽やかに響いてゆく。"
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - The Rise of an Empire"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "『Europa Universalis V』を象徴する旋律が高らかに鳴り響き、本作ならではの高揚感を鮮やかに描き出す。"
 MusicPlayer_20_Thirty_Years: "20 - Thirty Years"
 MusicPlayer_20_Thirty_Years_flavour: "三十年戦争（1618～1648年）は、450万から800万もの命を奪い、ヨーロッパ史に深い傷痕を残した。16世紀の宗教改革に端を発する宗派対立に、諸国の思惑や積年の確執が絡み合い、戦火はさらに広がっていった。"
 MusicPlayer_24_The_Black_Death: "24 - The Black Death"
 MusicPlayer_24_The_Black_Death_flavour: "14世紀のヨーロッパを襲い、人口の半数近くを死に至らしめた黒死病は、人類史に残る未曾有のパンデミックのひとつである。"
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri"
 MusicPlayer_10_Gloria_Patri_flavour: "バッハの『無伴奏チェロ組曲第1番 ト長調 BWV 1007』第1曲「プレリュード」に声楽を重ねた一曲。"
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna"
 MusicPlayer_14_Lux_aeterna_flavour: "カトリック教会のレクイエムで用いられる祈りの言葉。神の恩寵と、亡き者を照らしつづける永遠の光をうたっている。"
 MusicPlayer_18_Falalalan: "18 - Falalalan"
 MusicPlayer_18_Falalalan_flavour: "音楽にはいつも歴史が息づいている。ときには、いくつもの形で。"
 MusicPlayer_22_A_Message_to_The_King: "22 - A Message to the King"
 MusicPlayer_22_A_Message_to_The_King_flavour: "熱を帯びた調べが、急を告げるかのように力強く駆け抜ける一曲。"
 MusicPlayer_08_No_Fear_No_Mercy: "08 - No Fear, No Mercy"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "戦の前の静けさや、戦いを前に高鳴る兵たちの鼓動を彷彿とさせる勇壮な一曲。"
 MusicPlayer_06_Pain_is_Salvation: "06 - Pain is Salvation"
 MusicPlayer_06_Pain_is_Salvation_flavour: "英語、古ドイツ語、ラテン語を織り交ぜた歌詞は、救いに至るまでの苦しみをうたっている。"
 MusicPlayer_04_In_Your_Honor: "04 - In Your Honor"
 MusicPlayer_04_In_Your_Honor_flavour: "どこまでも広がる緑の牧草地と、神や大自然への畏敬を呼び起こす雄大な一曲。"
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - A Bargain with Beelzebub"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "宗教と戦争、そして宗教をめぐる戦争。入り交じる敬虔さと流血への渇望。この時代は、鮮烈な対立の陰に幾重もの灰色を宿していた。"
 MusicPlayer_16_The_Path_to_Potsdam: "16 - The Path to Potsdam"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "三十年戦争の惨禍により、ポツダムは人口の半数近くを失った。"
 MusicPlayer_11_Maiden_Voyage: "11 - Maiden Voyage"
 MusicPlayer_11_Maiden_Voyage_flavour: "未知の海へ船出するときの波のうねりを思わせる、軽やかな舞曲調の一曲。"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - The Coronation of a Naked Emperor"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "弦楽とチェンバロが奏でる、世俗的なバロック様式の一曲。"
 MusicPlayer_13_Battle_of_Lutzen: "13 - Battle of Lützen"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "1632年11月16日、スウェーデン軍はザクセンとヘッセン＝カッセルの部隊とともに、リュッツェンで神聖ローマ皇帝軍と激突した。三十年戦争における主要な戦いのひとつであり、そのさなか、スウェーデン王グスタフ2世アドルフが命を落とした。そして王の死後、ハイルブロン同盟が結成された。"
 MusicPlayer_26_Peace_of_Westphalia: "26 - Peace of Westphalia"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "ヴェストファーレン条約は、1648年にオスナブリュックとミュンスターでそれぞれ結ばれた二つの講和条約の総称である。三十年戦争に終止符を打ち、神聖ローマ帝国に平和をもたらした。"
 MusicPlayer_23_The_Flagellant: "23 - The Flagellant"
 MusicPlayer_23_The_Flagellant_flavour: "鞭打ち苦行とは、罪を悔い改め、キリストの受難にあずかるため自らを鞭打つ行為であり、多くのキリスト教の伝統に見られる。14世紀の西方キリスト教世界では、戦争や飢饉、疫病が相次ぐなか、鞭打ち苦行運動が広がっていった。"
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "トマス・ルイス・デ・ビクトリア（1548～1611年）の『Missa O quam gloriosum』（ミサ曲「おお、なんと栄光に満ちたことか」）で用いられた典礼文をもとにした一曲。"
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "カトリック教会のレクイエムで用いられる『Pie Jesu（慈悲深きイエスよ）』および『Libera me（我を救いたまえ）』という祈りを織り交ぜた一曲。亡き者がイエスの憐れみによって安息を得て、最後の審判の日に救われることを願っている。"
 MusicPlayer_sol_ashanti_Aho: "アシャンティ - Aho"
 MusicPlayer_sol_ashanti_Aho_flavour: "ナナ・オセイ・トゥム・バリマは、セプレワをはじめ、伝統的な角笛や打楽器など、アシャンティの音楽や儀式に用いられるあらゆる楽器に通じた名手であり、アシャンティ王国を築いた皇帝の後継者でもある。曲名は「戦歌」を意味する。"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "アシャンティ - Asanteman Yenim Ko"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "「アシャンティは戦うことを知っている。だが、逃げることは知らない」という言葉で始まるこの歌は、アシャンティの戦士たちの武勇を高らかにうたい上げる。"
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "アシャンティ - Seperewa Akasa"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "曲名は「セプレワは語った」を意味する。セプレワは西アフリカに起源を持つハープ・リュート系の弦楽器で、箱形の共鳴胴に10～14本の弦を張り、それぞれを棹に直接巻きつけて固定する。アシャンティ王国の建国者オセイ・トゥトゥ王はこの楽器をこよなく愛し、王権の象徴として黄金のセプレワまで作らせたと伝えられている。"
 MusicPlayer_sol_aztec_Mictlan: "アステカ - Mictlan"
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$曲名は「冥界」を意味する。"
