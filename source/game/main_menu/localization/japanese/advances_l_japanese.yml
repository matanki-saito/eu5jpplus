 algiers_ojaq_janissaries_desc: "$a_algiers_ojaq_janissaries_desc$"
 andalusi_arquebusiers: "$a_andalusi_arquebusiers$"
 andalusi_arquebusiers_desc: "$a_andalusi_arquebusiers_desc$"
 black_guard: "$a_black_guard$"
