 hafsid_ghulam_desc: "$a_hafsid_ghulam_desc$"
 maghrebi_galiots: "$n_maghrebi_galiot$"
 maghrebi_galiots_desc: "$n_maghrebi_galiot_desc$"
 maghrebi_xebec: "$n_maghrebi_xebec$"
 maghrebi_xebec_desc: "$n_maghrebi_xebec_desc$"
