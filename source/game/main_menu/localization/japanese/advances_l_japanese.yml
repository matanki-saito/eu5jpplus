 unlock_wagon_train_desc: "$a_wagon_train_desc$"
 war_college_advance: "陸軍大学校"
 war_college_advance_desc: "$war_college_desc$"
 war_score_absolutism_advance: "積極的要求"
 war_score_absolutism_advance_desc: "国力は軍事力と直結している。結局のところ、人口が多い国ほど軍隊も強力になる。わが国の外交は、近隣諸国に対する優位をさらに高めるため、平和条約を守りつつも、できるかぎり多くの土地を併合するという積極的なアプローチが必要である。"
 #Scientific Revolution Institution
 coke_blast_furnace: "コークス高炉" #Age of Absolutism
 coke_blast_furnace_desc: "炭ではなくコークスと燃料として使える、新しいタイプの高炉。コークスは木炭よりも安価な上、大型の炉にも使用できるという利点があるが、木炭よりも不純物が多く含まれるという問題がある。この欠点はいまのところ解決されていない。"
 diplomatic_range_age_5: "外交使節団"
 diplomatic_range_age_5_desc: "現代政治の複雑さは、もはや使節ひとりの手に負えるものではなくなった。我々の影響力をさらに拡大し、遠く離れた場所での国益を守るため、各国へと専門の外交使節団を派遣しよう。"
 economical_policies_law_advance: "$economical_policies_law$"
 economical_policies_law_advance_desc: "$economical_policies_law_desc$"
 grand_marketplace_advance: "$grand_marketplace$"
 grand_marketplace_advance_desc: "$grand_marketplace_desc$"
 hollander_beater: "ホランダービーター"
 hollander_beater_desc: "製紙工場では何世紀にもわたり、機械式ハンマーを使って紙繊維の塊を叩き、砕いて、紙の原料となるパルプを作ってきた。商才のある職人たちが、地元の風車を動力源とする効率的な解決策を編み出した。彼らはそれを「ホランダービーター」と呼んでいる。これは風力で回転する、ブレードつきの水平ローラーを備えた槽である。これらのブレードは、ハンマーで何日もかかって砕いていた量の繊維を、わずか数時間で細断することができる。"
 improve_relation_impact_absolutism: "常設外務省"
 improve_relation_impact_absolutism_desc: "わが国の外交に関する人員は増えつづけている。そのため、多くの使節を管理し、その行動を調整するための常設の外務省を設立しなければならない。"
 integrate_area_advance: "改善された統合"
 integrate_area_advance_desc: "わが国の行政は改善しており、さらに広大な土地をひとつの国に統合するための人員を確保することができる。"
 jesuits_bark: "イエズス会の樹皮"
 jesuits_bark_desc: "南米の一部の先住民は、特定の樹皮を悪寒治療に用いることが確認されている。イエズス会の薬師による試みのおかげで、この樹皮がマラリア治療にも有効であることが証明され、早くも「イエズス会の樹皮」という呼称が広まっている。これを患う者へ配給すれば、病の悪影響は大幅に軽減されるだろう。"
 maritime_advance_age_5: "護衛船"
 maritime_advance_age_5_desc: "海上交易が拡大し、さらに遠方の土地から、より大量の商品が往来するようになった。これにより、流通を途絶えさせないことの重要性が高まっている。交易護衛船団を創設することで、交易船の航海を安定させることができるだろう。"
 measuring_the_world: "世界の計測"
 measuring_the_world_desc: "新世代の科学は、我々を取り巻く世界を記述し、測定するさまざまな方法を与えてくれた。これらの学識ある人々を世界中に、特にわが国に送り出そう。国中の土地で徹底的に鉱脈を調査し、あらゆる地形を把握し、すべての事業計画を査定するまで、我々がいかなる資源に恵まれたのかを真に理解することはできない。"
 medical_school_advance: "医療学校"
 medical_school_advance_desc: "訓練された医学者のための専門的な場所である医療学校は、人体や病、そしてその予防法や治療法について学ぶために学者が通う場所だ。"
 merchant_power_from_maritime_absolutism_advance: "商工会議所"
 merchant_power_from_maritime_absolutism_advance_desc: "商業や経済において新しい考え方が台頭するなか、地元企業が協力しあい、ビジネスネットワークを形成している。その目的は、自分たちの利益を促進し、政治機関や外国の影響から自分たちの権利を守ることである。"
 modern_road_advance: "$modern_road$"
 modern_road_advance_desc: "$modern_road_desc$"
 national_sovereignty: "国家主権"
 national_sovereignty_desc: "17世紀前半に多発した長期にわたる戦争により、国家の領土保全を基礎とする国際外交システムが生まれた。国際舞台では、個々の統治者や超国家的な集団ではなく国家が主体となり、いかなる国家も他国の内政に介入する権利を持たない。"
 naval_doctrines_advance: "海軍ドクトリン"
 naval_doctrines_advance_desc: "近年、海戦には多くの変化が見られる。艦船や艦隊が大型化し、より専門化した結果、各国は各々の長所や艦隊の運用方法に合わせた、独自の戦術やドクトリンを用いるようになってきている。"
 naval_professionalism: "海事の専門化"
 naval_professionalism_desc: "17世紀初頭でさえ常設海軍は極めて小規模で、有力な海洋国家であっても、差し迫った必要性を満たすために海軍力を維持する国が大半だった。しかし我々は、時が経つにつれてより大規模で専門的な海軍へと変化している。海軍の諸問題で対立国に追い抜かれたくなければ、わが国はより大規模な常設海軍を組織し、それをサポートする行政組織を構築し、海軍士官が永続的な職業として海軍のキャリアを積めるように努力しなければならない。"
 newspapers_advance: "新聞"
 newspapers_advance_desc: "書字板や貼り紙による告知は新しいものではない。しかし、$printing_press$が世界中に広まるにつれ、政治、軍事、経済などに関する情報を手軽に入手したいという要求も高まっている。新聞は、時事問題を扱う定期刊行物であり、こうしたニーズに応えることができるだろう。"
 opera_house_advance: "歌劇場"
 opera_house_advance_desc: "$opera_house_desc$"
 paper_manufactory_advance: "$paper_manufactory$"
 paper_manufactory_advance_desc: "$paper_manufactory_desc$"
 power_projection_advance_5: "絶対主義者の野心"
 power_projection_advance_5_desc: "国家権力の中央集権化が進むにつれ、世界中の多くの統治者は、統治するすべての領土の唯一の君主になろうと考えはじめる。自らを国土を照らす太陽になぞらえ、絶対的な権威を欲しているのだ。"
 printing_manufactory_advance: "$printing_manufactory$"
 printing_manufactory_advance_desc: "$printing_manufactory_desc$"
 putrefaction_works_advance: "硝石工場"
 putrefaction_works_advance_desc: "$putrefaction_works_desc$"
 relations_absolutism_advance: "対脅威政策"
 relations_absolutism_advance_desc: "我々を取り巻く世界が、真に世界的な舞台へと変化しつつある。そのような時代には、我々の外交努力もまた、外国の脅威に対する安全保障の必要性に対応しなければならない。"
 scientific_mapping_advance: "地図製作"
 scientific_mapping_advance_desc: "近年、地理学的知識、製図法、地図作成の分野や科学が進歩したことで、土地や自然の特徴の描写を、その相対的な大きさと正確な位置の両面において、より正確に記すことができるようになった。"
 scientific_revolution_advance: "科学革命"
 scientific_revolution_advance_desc: "数学、物理学、天文学、生物学、化学における近年の発展は、我々を取り巻く世界の見方に挑むだけでなく、それをすっかり変えてしまった。社会はかつてないほどの速度で進歩し、科学の発見も日ごとに増加している。"
 ship_building_techniques_absolutism: "係船ドック"
 ship_building_techniques_absolutism_desc: "係船ドックや浮きドックを開発することで、造船工たちは以前よりもずっと早く船を建造できるようになるだろう。"
 spy_construction_absolutism: "諜報網の拡大"
 spy_construction_absolutism_desc: "世界の帝国や組織が拡大を続けるなか、ライバルに遅れをとらないよう、諜報活動を維持しなければならない。"
 subject_loyalty_absolutism: "絶対的忠誠"
 subject_loyalty_absolutism_desc: "我々は国民のいかなる反乱も異議も容認しないのだから、従属国にそれを許すはずがないのだ。"
 the_constitution: "立憲主義"
 the_constitution_desc: "立憲主義という新たな哲学的概念が生まれた。これは、政府がその権力に法的制限を受け入れるというものである。ひとつの興味深い概念ではあるが、あまり普及するとは思えない。"
 #Choice ADM
 additional_colonists: "入植者の招請"
 additional_colonists_desc: "新大陸の意味はさまざまだが、とりわけ重要なのは手つかずであるという点だ。つまり、開拓を阻む重要人物などは存在しないのである。新大陸には限りないチャンスがあると広く周知させることで、より多くの人々が訪れ、定住するようになるだろう。"
 additional_diplomats: "外交官の招請"
 additional_diplomats_desc: "国土を拡大するということは、外交活動の範囲も広げなければならないということだ。これには外交部門に適切な人員を確保することが求められる。"
 bookkeeping: "簿記"
 bookkeeping_desc: "ときに資金が不足し、借り入れが必要になることもあるが、貸し手はいつでも返済されないことを怖れている。しかし、綿密な記録を欠かさないことで、誰もが確実に返済を期待できるようになり、金利の引き下げ交渉も可能になる。"
 centralized_government: "中央集権政府"
 centralized_government_desc: "国家を中央集権化すれば、権力中枢の考えや政策を、国内に浸透させやすくなるだろう。"
 civil_servants: "公務員"
 civil_servants_desc: "熱意ある若手官僚からなる公務員制度を確立することで、行政や統治における新たな進歩に、素早く適応できるようになるだろう。"
 economic_ideas: "従属的経済"
 economic_ideas_desc: "国の経済と富は国家に仕える存在であり、その逆であってはならない。国家は、国家の利益のために行動し、できる限りの資源を蓄えるべきである。そうすることでのみ、わが国は真に繁栄できるのだ。"
 formalized_officer_corps: "将校団の公式化"
 formalized_officer_corps_desc: "将校は伝統的に貴族出身者が務めるが、わが国は貴族があまり多くないため、将校が不足している。一方で、わが軍には下層階級の出身者が実に大勢いる。この一部を、正式に将校へと昇進させることを検討すべきだろう。"
 humanism: "人文主義"
 humanism_desc: "人類は我らが主の最高の創造物である。ゆえに、人類を創造の中心に置くことはごく自然なことだ。幸福から自由意志や世界を探求する能力に至るまで、すべての人間的性質は保護され、奨励されなければならない。"
 local_traditions: "地方の伝統"
 local_traditions_desc: "大国を治めるということは、それぞれ独自の習慣や伝統をもつ多様な民族を治めることを意味する。これらの伝統を公式の法典に取り入れることで、幸福かつ忠実な民衆を作り出そう。"
 religious_unification: "宗教的統一"
 religious_unification_desc: "真実の宗教はひとつしかない。だからこそ、神の唯一なる導きのもとにすべての信者を団結させることが我らの責務なのだ。"
 #Choice DIP
 agent_training: "諜報員の訓練"
 agent_training_desc: "我々は多くの極秘作戦を計画しているものの、必要な人材が不足している。諜報員の訓練法を確立することで、危険な任務に対応できる人員を増やせる。"
 dip_choice_subject_opinions: "従属国への使節団"
 dip_choice_subject_opinions_desc: "各従属国との継続的な対話は、双方の関係に良い影響を与え、わが国の中核地と、その旗のもとに忠誠を誓うすべての国々を強化するだろう。"
 diplomatic_corps: "外交団"
 diplomatic_corps_desc: "専門的な外交団を設立することで、熟練した外交官の学んできたことが、若い世代に確実に受け継がれるようにしよう。"
 formal_diplomacy: "正式な外交"
 formal_diplomacy_desc: "権力が有力な個人の手から中央政府へと移る時代には、隣国とのあいだに橋をかけ、対話の道を築くのが賢明だ。台頭する大国に対抗するため、いまや外交がかつてないほど重要になっている。"
 national_trade: "国家交易"
 national_trade_desc: "布や羊毛などの人気商品が世界中に広まっている。交易の手が、遠く離れた国々にまで届く時代になったのだ。わが国の商人が有利に活動できるようにしなければならない！"
 national_trade_policy: "国家的交易方針"
 national_trade_policy_desc: "国家的交易方針を採用することで、わが国の交易力を強化し、その効率性を高めることができる。"
 naval_fighting_instruction: "海軍戦闘訓令"
 naval_fighting_instruction_desc: "海軍の退役軍人が、[navy|e]による[blockades|e]の効率性を高める新たな手法を考案できるようにする。"
 sheltered_ports: "避難港"
 sheltered_ports_desc: "船が戦闘中に損傷しやすいのは不幸な事実だ。そして、海上での修復がほとんど見込めないこともまた事実である。この問題を緩和するため、船を修理できる避難港を海岸線に沿って作り上げよう。"
 state_propaganda: "国家プロバガンダ"
 state_propaganda_desc: "人間と同様、国家は評判がすべてだ。公式のプロパガンダを確立することで、わが国の優れた名声が、敵の嘘によって汚されないようにする。"
 vice_roys: "植民地総督"
 vice_roys_desc: "植民地総督の設置が可能になる。これにより植民地の行政が改善され、現地からの収入も増加する。"
 #Choice MIL
 absolutism_control_decline_advance: "絶対主義者の行政"
 absolutism_control_decline_advance_desc: "絶対主義の統治者は、宮廷内で権力を誇示するだけでなく、国中に広がる行政機構を通じてもその力を示そうとする。"
 discipline_drills: "規律ある訓練"
 discipline_drills_desc: "戦闘において重要なのは、火力、兵力、そしてそのふたつを結びつける規律だけである。軍事訓練や演習を定期的に実施することで、わが国の軍を新たな高みに引き上げることができるだろう。"
 escort_ships: "コルベット"
 escort_ships_desc: "コルベットは、友軍船の護衛と敵への妨害を目的として設計された小型の軍艦で、火力よりも速度と操縦性が重視されている。"
 grand_army: "大陸軍"
 grand_army_desc: "史上最大にして最強の陸軍を作り出すことが可能となる。"
 improved_foraging: "食糧調達の改善"
 improved_foraging_desc: "これまでは、食糧確保の難しい土地には小規模の軍隊しか送り込めなかった。しかし、[food|e]調達能力の向上によって、より大規模な軍隊を展開可能になった。"
 offensive_army: "攻撃的な軍勢"
 offensive_army_desc: "火薬と軍事革新の時代が到来した。こうした技術は戦争への新たな関心を引き起こし、戦争を活発化させている。さらなる栄光を勝ち取るには、攻撃部隊の水準を高く保つよう尽力する必要がある。"
 private_to_marshal: "兵卒から元帥へ"
 private_to_marshal_desc: "すべての兵卒は、その背中に将来の元帥杖を背負っている。これは言いすぎかもしれないが、とにかく戦場で功績を挙げた者には昇進と褒賞が与えられる。このことが兵士たちを鼓舞するのだ。"
 regimental_system: "連隊制度"
 regimental_system_desc: "[regiments|e]を地域別に編制することによって、より地域社会に密着した軍隊を作ることができる。これにより、[regiments|e]増員の際にも、より迅速な動員が可能になるだろう。"
 repair_at_sea: "沿岸での傾船修理" #Age of Absolutism
 repair_at_sea_desc: "継続的な技術革新によって、船舶の航行時間は次第に長くなっている。これは複雑な修理が必要になることを意味するが、いつでも港を利用できるとはかぎらない。活動拠点から遠く離れていても、潮の引いた沿岸部で傾船をおこなえるよう、わが国の水兵を訓練する必要がある。"
 superior_firepower: "火力優勢"
 superior_firepower_desc: "総攻撃をかける前に大火力で敵を動揺させる戦術は、わが軍の強みのひとつだ。これを指揮官たちによく認知させることとする。"
 #No Institution
 global_supply_limit_modifier_advance_6: "軍事作戦兵站計画"
 global_supply_limit_modifier_advance_6_desc: "戦争の兵站計画はますます複雑さを増している。計画の規模が大きくなったことで、数十万人の兵士を数年にわたって動員する長期的な軍事作戦に、複数の軍隊を投入することが可能になったからだ。"
 naval_base_advance: "海軍基地"
 naval_base_advance_desc: "$naval_base_desc$"
 unlock_bomb_ketch: "$n_bomb_ketch$"
 unlock_bomb_ketch_desc: "$n_bomb_ketch_desc$"
 unlock_eastindiaman_advance: "$n_eastindiaman$"
 unlock_eastindiaman_advance_desc: "$n_eastindiaman_desc$"
 unlock_heavy_frigate_advance: "$n_heavy_frigate$"
 unlock_heavy_frigate_advance_desc: "$n_heavy_frigate_desc$"
 unlock_ship_of_the_line_advance: "$n_ship_of_the_line$"
 unlock_ship_of_the_line_advance_desc: "$n_ship_of_the_line_desc$"
 unlock_threedecker_advance: "$n_threedecker$"
 unlock_threedecker_advance_desc: "$n_threedecker_desc$"
 #Enlightenment Institution
 artists_advance_revolutions: "啓蒙的芸術"
 artists_advance_revolutions_desc: "啓蒙的芸術の出現により、芸術は社会のあらゆる分野や階層で隆盛を極めている。音楽や文学の新しい出版物は、これらの芸術への幅広い関心をもたらしている。"
 coal_improvements_revolutions: "炭焼き窯の改良"
 coal_improvements_revolutions_desc: "鉄の精錬に不可欠なコークスを生産するには、大量の炭焼き窯が必要である。窯の構造を改良し、煉瓦を使用することで、より高品質なコークスの製造が可能となるだろう。"
 construction_speed_revolutions: "鋳鉄構造"
 construction_speed_revolutions_desc: "錬鉄と鋳鉄の冶金技術が高度に発展したことで、柱や円柱といった精巧な金属構造物が実現し、建造物の建設速度が格段に向上している。"
 crown_power_advance_revolutions: "国家"
 crown_power_advance_revolutions_desc: "君主の力のもとにすべての大国が統一されたことで、国中の臣民が帰属意識をもつようになった。我らが君主が支配する領土はどこであれ国家の一部であり、国民もまた同様である。"
 diplomatic_range_age_6: "世界の大使館"
 diplomatic_range_age_6_desc: "さまざまな国が勢力を広げようとする昨今、世界はかつてないほど相互に結ばれはじめた。この相互関係を維持する唯一の方法は、世界中に常設の大使館を設置することだ。"
 enlightened_court: "啓蒙の宮廷"
 enlightened_court_desc: "啓蒙主義の価値観は現代の宮廷につねに存在し、それに伴い、非常に知的かつ即戦力となる人材が揃っている。そのおかげで、現代でははるかに少ない労力でより多くの成果を達成できる。"
 enlightenment_advance: "啓蒙"
 enlightenment_advance_desc: "前世紀は、理性主義と経験論の人気が、当代の偉人たちのあいだで高まりつづけていた。理性の光が灯され、それが地球の隅々に行き渡るまで、多くの者が休むことはないだろう。"
 government_size_revolutions: "現代的代表制度"
 government_size_revolutions_desc: "さまざまな形の国民代表制度が確立されたことにより、政府はこれまで以上に多くの問題に適切に対処できるようになる。"
 modern_bureaucracy: "現代的官僚制度"
 modern_bureaucracy_desc: "支配している土地と国民を最大限に活用するためには、官僚機構を拡大し、再編し、専門化する必要がある。強固な組織があれば、国家の各部門を担当させ、場当たり的な解決策を排除することができる。各地の大学に、効率的な統治とその最善の方法を考察させ、貴族の子弟たちが剣ではなくペンを手に国家に奉仕するよう奨励しよう。"
 nation_state_advance: "国民国家"
 nation_state_advance_desc: "文化をひとつの旗のもとに統合するという概念は、非常に力強い。国民意識を育むことで、我々の大義に対する従属国や市民の忠誠を確保することができる。"
 power_projection_advance_6: "世界的野心"
 power_projection_advance_6_desc: "国々がより大きな国へと統合された結果、大陸の大部分を支配する大国が形成されるに至った。そしてその大国はいずれも、勢力をさらに拡大する野心を秘めている。"
 quinine: "キニーネ"
 quinine_desc: "「イエズス会の樹皮」は過去にマラリア治療で功を奏したが、樹皮を乾燥粉末として服用する方法には改善の余地が大いにある。樹皮から治癒成分を分離し抽出することで、治療効果を大幅に高めることができる。"
 rgo_size_advance_revolutions: "蒸気機関"
 rgo_size_advance_revolutions_desc: "機械の動力源としての蒸気の力は、古代から知られていた。だが、近代の物理学と数学の発展によって、より複雑な機械に動力を供給できる洗練された蒸気機関が生まれ、その可能性は完全な実現を見た。蒸気機関により、あらゆる分野での生産性が大幅に増大する。"
 rights_of_man: "人間の権利"
 rights_of_man_desc: "現在の革命的思想の最先端にあるのは、万人の平等という急進的な概念である。世界各地の哲学者が協力して『人間と市民の権利の宣言』と題された文書を作成し、これらの権利は普遍的なものであり、法律によって執行されるべきであると宣言したのだ。これはおそらく、自由と民主主義の概念の発展と普及に多大な影響を及ぼすと考えられ、わが国も遅れを取らないようにすべきである。"
 rotherham_plough: "ロザラムの鋤"
 rotherham_plough_desc: "ヨーロッパで使用されている基本的な鋤は、ローマ時代から姿を変えていない。とはいえ、現在では設計が改良され、同じ鋤でもはるかに軽量化している。これにより、牽引する動物の負担が軽減され、より多くの作業をこなせるようになった。"
 separation_of_powers: "権力の分離"
 separation_of_powers_desc: "政治理論に関する匿名の論文が発表され、それを差し止めようとする努力にもかかわらず、世界中に急速に広まっている。この論文は君主制、独裁制、民主主義などの政体の性質を扱っており、行政、立法、司法の厳格な分離を主張している。国民が保護され、君主の権力が制限されることになるこの論旨は、当然ながら国民に非常な人気を博している。君主の権力には不幸な影響を及ぼすかもしれないが、この考え方はわが国に多大な恩恵をもたらすかもしれない。"
 slave_trade_act_advance: "奴隷貿易法"
 slave_trade_act_advance_desc: "我々の植民地への労働力の流入・流出は、利益はあがるが繊細な問題でもある。だからこそ、我々はそれを整備するための立法の取り組みに投資しなくてはならない。"
 spy_construction_revolutions: "反対派との接触"
 spy_construction_revolutions_desc: "新たな思想や政治体制が世界に広がりつつある。我々は敵対する国々でこうした反体制派を支援し、貴重な情報を引き出すために予算を割り当てる必要があるだろう。"
 town_rights_rev_advance: "国家の心臓"
 town_rights_rev_advance_desc: "政府の源泉として、我らが首都は国家そのものの心臓である。この事実こそが首都を特別なものにし、他の地域よりも特権的な地位にあると言える。"
 vaccination_advance: "ワクチン"
 vaccination_advance_desc: "ワクチンの開発により、医師は致命的な病気に対する免疫を人々に与えられるようになった。これらのワクチンは病気の拡散を防ぎ、感染症の予防に役立つ。弱毒化した、あるいは死滅した細菌やウイルスを体内に少量注射することで、人体の免疫システムがその病気に再び遭遇したときに、それを認識・撃退できるようになるのだ。"
 war_score_revolutions_advance: "理性的な主張"
 war_score_revolutions_advance_desc: "戦争は双方に必ず苦しみをもたらす醜い行為だ。こうした事実を強調し、相手の論理と理性に訴えかけることは、避けられない国境変更の交渉時に、わが国は大きな利益を得られるだろう。"
 #Industrialization Institution
 brewery_mill_advance: "$brewery_mill$"
 brewery_mill_advance_desc: "$brewery_mill_desc$"
 clearing_house_advance: "手形交換所"
 clearing_house_advance_desc: "$clearing_house_desc$"
 commerce_center_advance: "$commerce_center$"
 commerce_center_advance_desc: "$commerce_center_desc$"
 cupola_smelting: "キューポラ製錬"
 cupola_smelting_desc: "円筒形の炉を使った手法。鉄を安価かつ効率的に、さらには継続的に製錬できるという独自の特徴がある。"
 distiller_mill_advance: "$distiller_mill$"
 distiller_mill_advance_desc: "$distiller_mill_desc$"
 dyes_mill_advance: "$dyes_mill$"
 dyes_mill_advance_desc: "$dyes_mill_desc$"
 fine_cloth_mill_advance: "高級生地製造所"
 fine_cloth_mill_advance_desc: "$fine_cloth_mill_desc$"
 firearms_factory_advance: "$firearms_factory$"
 firearms_factory_advance_desc: "$firearms_factory_desc$"
 furniture_mill_advance: "$furniture_mill$"
 furniture_mill_advance_desc: "$furniture_mill_desc$"
 glass_mill_advance: "$glass_mill$"
 glass_mill_advance_desc: "$glass_mill_desc$"
 gun_factory_advance: "銃工場"
 gun_factory_advance_desc: "$cannons_factory_desc$"
 hot_blast_furnace: "熱風炉" #Age of Revolutions
 hot_blast_furnace_desc: "鋳鉄に含まれる不純物が増えるというコークス高炉の問題点を解消するため、熱風炉が開発された。その結果、コークスの使用量を大幅に抑え、鉄の品質を向上できるようになったほか、燃料として未精製の石炭を使うことも可能になった。鉄冶金における大きな前進である。"
 industrialization_advance: "産業化"
 industrialization_advance_desc: "産業革命の勃興は、商業やビジネスだけでなく、社会構造そのものに国際的かつ永続的な変化をもたらした。機械動力式の織機や蒸気機関などの発明は、人類の能力をはるかな高みへと押し上げるだろう。"
 insurance_companies: "保険会社"
 insurance_companies_desc: "保険の発展に伴って、リスクはさらに軽減された。保険仲介人に少額の手数料を支払うことでリスクを相殺できるようになったことが、交易のさらなる拡大を可能にした。"
 iron_mill_advance: "$iron_mill$"
 iron_mill_advance_desc: "$iron_mill_desc$"
 joint_stock_companies: "合本会社"
 joint_stock_companies_desc: "交易が拡大するにつれて、リスクも増大していった。資本を蓄積し、リスクを管理する新たな方法の必要性から登場した合本会社では、事業のリスクは多くの株主間で共有された。"
 maritime_advance_age_6: "武装護衛船"
 maritime_advance_age_6_desc: "交易船団は海賊にとって格好の標的だ。商品と金を満載した船は、ならず者垂涎の戦利品の塊である。よって、交易船団に防衛用の装備を与えて身を守ることが重要となる。交易船団にフリゲート艦やその他の武装船を同行させ、安全を確保しよう。"
 merchant_power_from_maritime_revolutions_advance: "有限会社"
 merchant_power_from_maritime_revolutions_advance_desc: "勅許会社の失敗を教訓に、株主の債務が一定額に制限される、新しいタイプの会社が生まれた。このタイプの会社を利用した交易パートナーシップはリスクが低いため、魅力的である。"
 naval_supplies_mill_advance: "$naval_supplies_mill$"
 naval_supplies_mill_advance_desc: "$naval_supplies_mill_desc$"
 paper_guild_wood_pulp_maintenance_advance: "$paper_guild_wood_pulp_maintenance$"
 paper_guild_wood_pulp_maintenance_advance_desc: "入手しやすい針葉樹を使うことで、かつてないほど容易かつ安価に紙を生産できるようになる。"
 paper_mill_advance: "$paper_mill$"
 paper_mill_advance_desc: "$paper_mill_desc$"
 peasants_rights_laws_advance: "$peasants_rights_laws$"
 peasants_rights_laws_advance_desc: "$peasants_rights_laws_desc$"
 pop_promotion_speed_age_6: "資本主義者の社会流動性"
 pop_promotion_speed_age_6_desc: "資本主義の拡大は、社会流動性の新たな時代を生み出している。そこでは、資本家から聖職者、工場労働者に至るまで、社会的地位を高める手段として、富が伝統的なヒエラルキーに取って代わりはじめているのだ。"
 pottery_mill_advance: "$pottery_mill$"
 pottery_mill_advance_desc: "$pottery_mill_desc$"
 printing_mill_advance: "$printing_mill$"
 printing_mill_advance_desc: "$printing_mill_desc$"
 putrefaction_mill_advance: "$putrefaction_mill$"
 putrefaction_mill_advance_desc: "$putrefaction_mill_desc$"
 railroad_advance: "$railroad$"
 railroad_advance_desc: "$railroad_desc$"
 repair_at_sea_aorev: "水上での傾船修理" #Age of Revolutions
 repair_at_sea_aorev_desc: "この高度な傾船作業は、船の片側に重い貨物を積み込むことで船体を傾ける手法で、沿岸の深い水域でおこなわれる。船員は、通常の傾船修理のように沿岸で停泊して干潮を待つことなく、船の持ち上がった側の修理をおこなうことができる。"
 revolutions_agressive_advance: "紛争の正当化"
 revolutions_agressive_advance_desc: "国際外交の舞台は、国家間の力の均衡を保つ場である。そのため、侵略戦争は忌み嫌われるものであり、もし勝利することがあれば、勝者に対抗するための連合が形成される可能性がある。\nしかし、外交と解釈を巧みに活用することで、相手国が我々に対する侵略者であるかのように見せかけ、戦争とその利益を正当なものとして国民に見せることができる。"
 revolutions_subject_opinions_advance: "信頼できる君主"
 revolutions_subject_opinions_advance_desc: "革命の火種は、決して軽視できない脅威だ。国民の忠誠を確保するには、忠実な総督を任命し、不安を掻き立てる理由を取り除くことによって、蜂起の火種を早々に消すように努めねばならない。"
 road_advance_2: "基本的な街道"
 road_advance_2_desc: "わが国の街道網が未発達だったせいで、輸送システムの発展の必要性が生じている。街道を拡張することで、国内の物資の流通を拡大することができる。"
 steel_mill_advance: "製鋼所"
 steel_mill_advance_desc: "$steel_mill_desc$"
 subject_income_revolutions_advance: "有償の主権"
 subject_income_revolutions_advance_desc: "我々の周囲の世界が劇的な変化を遂げていくなか、我々はこれまで以上に、属国の存続を支える代わりに、彼らからの支払契約を活用することができるようになった。"
 superior_ship_design: "優れた船舶設計"
 superior_ship_design_desc: "たとえその速度上昇がごくわずかで軍事的に意味をなさないものであっても、敵の船よりわずかでも速い[ships|e]を建造することで、わが国の乗組員に勝利の自信を与え、互角の戦いになるという敵の自信を失わせることができる。"
 tannery_mill_advance: "$tannery_mill$"
 tannery_mill_advance_desc: "$tannery_mill_desc$"
 tax_assessor_advance: "税務署"
 tax_assessor_advance_desc: "$tax_assessor_desc$"
 textile_mill_advance: "織物製造所"
 textile_mill_advance_desc: "$textile_mill_desc$"
 the_gold_standard: "金本位制"
 the_gold_standard_desc: "ヨーロッパ・中国間で続いている貿易赤字により、ヨーロッパおよび世界中で銀地金が不足している。銀貨から金貨に切り替えることで、新たな貨幣が流通し、交易量がさらに増加するだろう。"
 urbanization: "都市化"
 urbanization_desc: "新興都市がわが国民に新たな機会と安全をもたらしている。これにより、さらに多くの人々が農村から出ていき、新しく近代的な工場が生み出す仕事に就くようになっている。"
 weapon_factory_advance: "武器工場"
 weapon_factory_advance_desc: "$weapon_factory_desc$"
 #Levee En Masse Institution
 advanced_anti_piracy_warfare: "私掠活動の放棄"
 advanced_anti_piracy_warfare_desc: "発見と人文主義的思想の時代において、もはや海賊が公海上で引き起こす強奪と暴力に居場所はない。より多くの国々が団結し、すべての人々の幸福と繁栄に対する共通の脅威へと立ち向かい、この災厄に終わりをもたらさなければならない。"
 army_movement_speed_revolutions: "補給契約"
 army_movement_speed_revolutions_desc: "軍隊が移動する際に必要な食糧や物資を、その地域から略奪するのではなく適正価格で購入することで、農民たちは自ら我々の集積所に商品を持ち込むため、その地域での移動が加速する。"
 artillery_vs_fort_age_6_revolutions: "高度な榴弾砲"
 artillery_vs_fort_age_6_revolutions_desc: "攻城砲の直接砲撃と、迫撃砲の高弾道による間接砲撃の中間に位置する、より優れた兵器の必要性から、わが軍は新たな榴弾砲を開発した。"
 assault_ability_revolutions: "砲火への進軍"
 assault_ability_revolutions_desc: "わが軍は、敵の要塞を陥落させて進路を切り開くため、喜んで砲火と土埃のなかへと進軍していく。大砲の進歩や新たな要塞化技術が登場しようとも、敵要塞の外壁を攻撃する我らの技術に並ぶものはない。"
 combined_arms_advance_revolutions: "高度な統合軍備"
 combined_arms_advance_revolutions_desc: "数世紀にわたって統合軍備が常用されてきた結果、この戦争様式は支配的な地位を占めるに至った。軽歩兵と軽騎兵は、敵部隊を弱体化させ混乱させると同時に、自軍の遮蔽と防護を担う。重歩兵と重騎兵は戦闘の主力として前線に立ち、果敢な突撃によって敵を潰走させることを目指す。一方、砲兵と補助部隊は後方から、距離を保ってこれを支援する。"
 conscription_advance: "$a_conscripts$"
 conscription_advance_desc: "$a_conscripts_desc$"
 conscription_center_advance: "徴兵所"
 conscription_center_advance_desc: "$conscription_center_desc$"
 corps_organisation: "団結心"
 corps_organisation_desc: "伝統的な軍隊は、秩序の維持に厳しい軍規を用いてきた。だが、兵士たちの誇りに訴えかけることで、より高い水準の規律を実現できる。"
 correct_box_advance_revolutions: "参謀"
 correct_box_advance_revolutions_desc: "軍隊の拡大と、より長期的な作戦が展開されるようになったことにより、計画と兵站任務、および戦場におけるさまざまな軍団を効果的に調整する将校の必要性が生じた。"
 fort_limit_6_advance: "軍用地図測量"
 fort_limit_6_advance_desc: "広範な測量と兵站の統合によって、すべての要塞が一体的な防衛体制に組み込まれる。それは官僚制、科学、国家権力が一体となって成し遂げた偉業である。"
 fortress_advance: "要塞"
 fortress_advance_desc: "$fortress_desc$"
 impulse_warfare: "インパルス戦術"
 impulse_warfare_desc: "軽歩兵部隊の導入により、戦争に変化がもたらされた。歩兵による主攻撃（通常は横列または縦列でおこなわれる）の前に、散兵が緩やかな隊列で前方に配置され、敵の注意をそらし、妨害した。"
 levee_en_masse_advance: "国民皆兵制度"
 levee_en_masse_advance_desc: "戦争とは世代を超えて刷新され、磨かれてきた、つねに進化しつづける概念である。領土拡大への欲求を満たし、野望の実現に向けた原動力とするために、未婚の若年男性のみの軍隊を編制するという国家規模の徴兵法が作られ、施行された。その取り組みのかつてない規模は、歴史の流れを形作るだろう。"
 long_rifle: "長距離ライフル狩猟"
 long_rifle_desc: "狩猟用に特別に製造された長距離ライフル銃は、猟師たちが獲物と毛皮を得るための信頼できる道具となる。"
 march_to_the_sound_of_the_guns_advance: "$march_to_sound_of_guns$"
 march_to_the_sound_of_the_guns_advance_desc: "わが軍が着実に拡大するなか、兵站の要件の緩和がかつてないほど重要になっている。戦闘開始とともに部隊を分散させ、戦場の戦力を強化するよう将軍に命じれば、戦局を有利に進めることができるだろう。"
 military_tactics_advance_6: "野戦砲"
 military_tactics_advance_6_desc: "砲兵が戦場で他部隊に随伴できるようになったことで、その影響力はもはや射程内に限定されるものではなくなった。砲兵将校が率いる半自立的な砲兵部隊を、最も必要とされる場所に配備することができるようになったのだ。"
 napoleonic_warfare: "ナポレオン戦争"
 napoleonic_warfare_desc: "包囲戦は、わが軍にとって費用と時間のかかる占領作戦である。進路上のすべての要塞を攻撃するのではなく、戦争を勝利に導く決定的な一撃に集中する必要がある。"
 public_punishments: "公開処刑"
 public_punishments_desc: "海上は危険に満ちており、そのため懲罰は厳しくなければならない。懲罰に十分な抑止効果がなければ、わが国はすぐに無法地帯と化すだろう。極めて公的な場所でおこなわれる懲罰は時代とともに進化してきたが、いまこそ制度化されるべきだ。これにより、海上での規律は強く正されるだろう。"
 recruitment_improvements_revolutions: "募兵の拡大"
 recruitment_improvements_revolutions_desc: "紛争の脅威がかつてないほど広範囲に及んでいる現在、それに応じた採用制度の拡大が求められる。志願して入隊する者に報奨を与え、犯罪者を徴兵することで、我々はあらゆる危険により迅速に対応できるようになる。"
 regiment_reinforcement_speed_revolutions: "大規模訓練"
 regiment_reinforcement_speed_revolutions_desc: "現代の常備軍は、過去のどんな軍隊よりも壮大なものとなっている。戦術は数万人単位で実行され、死傷者はかつてないほどの人数にのぼる。我々の新たな軍事訓練は、同時に何百人もの兵士を教練することにより、現代の戦争における膨大な死者数に対応する。"
 siege_ability_revolutions: "砲術将校"
 siege_ability_revolutions_desc: "砲兵の重要性は、砲の技術的要件とそれを最大限に活用するための近代的戦術の訓練を受けた専門将校が、現代の戦場においては欠かせないというところまで高まっている。"
 supply_depot_advance_age_6_revolutions: "作戦拠点"
 supply_depot_advance_age_6_revolutions_desc: "より長期の軍事作戦で複数の軍隊を運用することで、補給システムへの負荷が高まっている。そのため、より大規模勝つ迅速な拠点を作り、維持することがより重要となる。"
 unlock_cuirassiers_advance: "$a_cuirassiers$"
 unlock_cuirassiers_advance_desc: "$a_cuirassiers_desc$"
 unlock_flying_battery_advance: "$a_flying_battery$"
 unlock_flying_battery_advance_desc: "$a_flying_battery_desc$"
 unlock_fusiliers_advance: "$a_fusiliers$"
 unlock_fusiliers_advance_desc: "$a_fusiliers_desc$"
 unlock_grenadiers_advance: "$a_grenadiers$"
 unlock_grenadiers_advance_desc: "$a_grenadiers_desc$"
 unlock_light_dragoons_advance: "$a_light_dragoons$"
 unlock_light_dragoons_advance_desc: "$a_light_dragoons_desc$"
 unlock_logistics_corps: "$a_logistics_corps$"
 unlock_logistics_corps_desc: "$a_logistics_corps_desc$"
 unlock_sharpshooters_advance: "$a_sharpshooters$"
 unlock_sharpshooters_advance_desc: "$a_sharpshooters_desc$"
 #Choice ADM
 benevolence: "慈悲"
 benevolence_desc: "わが国は寛容と啓蒙の砦だ。他国にこのことを知らしめることで、外国とのより良い関係を築けるだろう。"
 formal_administration: "正式な管理"
 formal_administration_desc: "正しい手順と円滑に機能する行政組織があれば、国は繁栄する。適切な行政なくして、国家の取り組みは実を結ばない。制度を整え、画一化して、国家の意志が国の隅々にまで自然と行き渡るようにしよう。"
 fort_logistics: "要塞兵站"
 fort_logistics_desc: "建設面でも兵站面でも要塞化の制度を適切に整備することで、長期的にはその維持費を節約できるだろう。"
 improved_shipyards: "造船所の改良"
 improved_shipyards_desc: "世界中で我々の利益を守るためには、強力な[navy|e]が必要になる。我々が被る可能性のある損失を補うためにも、造船所がより迅速に船を生産できるようにしなくては。"
 indirect_rule: "間接統治"
 indirect_rule_desc: "人を動かす最良の方法は、彼らに自分の選択だと思い込ませることだ。このような間接的な統治機構は、新たに獲得した州での不穏度を低減するだろう。"
 legislative_efficiency_idea: "行政の効率化"
 legislative_efficiency_idea_desc: "政府にとって最も重要なことは、適切な助言を得ることである。そして助言者にとっての政府は、可能なかぎり開放的でなければならない。そうすれば、我々は提示される視点の数を最大限に増やすことができる。"
 nationalistic_enthusiasm: "愛国的熱意"
 nationalistic_enthusiasm_desc: "軍隊への支援は国防にとって極めて重要だ。わが国の優れた行政のおかげで、物資の大幅な割引が可能になる。"
 optimism: "楽観主義"
 optimism_desc: "勝利は戦場だけでなく、応接室でも勝ち取ることができる。理性の進歩によって、わが国民は一時的な敗北の影響をはねのけ、来たるべき勝利に備えることができるようになった。"
 regulation_bureau: "規制局"
 regulation_bureau_desc: "インフレ関連法の維持・推進と、わが国の地方行政を管轄する立法機関。"
 smithian_economics: "スミス経済学"
 smithian_economics_desc: "重商主義に反対し、経済問題に対する国家の影響力を制限することで、我々は自由市場を支え、全体的な生産効率を高めることができる。"
 #Choice DIP
 additional_loyalist_recruitment: "体制支持者の採用強化"
 additional_loyalist_recruitment_desc: "わが国の従属国には、神に与えられた我々の支配権を理解する者たちがいる。こうした賢明な人物を採用し、援助することで、属国に対する支配を強めることができるだろう。"
 buffer_states: "緩衝国"
 buffer_states_desc: "対立する国家と隣り合っていることほど嫌なことはない。国境に緊張が生じるのを避けたければ、我々と潜在的敵国とのあいだにある他国を緩衝国とすることで、我々にはいくらかの余裕が生まれるだろう。"
 flexible_negotiation: "柔軟な交渉"
 flexible_negotiation_desc: "和平交渉の場においては、何が得られるかはわからない。だからこそ、あらゆる選択肢を念頭に置いておくべきなのだ。"
 global_empire: "世界帝国"
 global_empire_desc: "植民地帝国を作り上げようとするわが国の献身は、植民地の行政に携わる者の態度も変えた。彼らの職位は、もはや強欲な無法者のためではなく、優秀で才能あふれる者のための地位となったのだ。これはわが国の税収にも反映されている。"
 merchant_marine: "商船隊"
 merchant_marine_desc: "すべての商船に、わが国の旗を誇らしく掲げさせよう。そして、必要があればわが海軍が必ず彼らを護ろう。"
 merchant_power_from_maritime_rev_dip_choice: "商船隊"
 merchant_power_from_maritime_rev_dip_choice_desc: "わが国の海域に商船が現れるのは、もはや当たり前の光景となった。商人たちは非常に多くの船を運用しており、事実上独自の船団を形成している。"
 morale_recovery_rev_dip_choice: "定期的な休息"
 morale_recovery_rev_dip_choice_desc: "どんな軍隊も、休みなく活動を続けることはできない。すべての兵士には休息と回復の時間が必要だ。兵士の集中が途切れない程度の休息時間を設けることで、部隊を最高の状態に保つことができる。"
 overseas_merchants: "海外商人"
 overseas_merchants_desc: "交易発展のためには、国外で暮らし、わが国の取引を支える、適切な階層に属する人々の市民権を拡大する必要がある。"
 postal_service: "郵便制"
 postal_service_desc: "外交派遣団がそうであるように、通信・郵便を適切なタイミングで先方に到着させるのは困難だ。郵便局や配達人の休憩所のネットワークを構築することで、我々の声が遠く離れた土地へも届きやすくなるだろう。"
 sea_hawks: "大海の覇者"
 sea_hawks_desc: "軍事的進歩に注力することで、海軍の伝統も向上する。"
 #Choice MIL
 bayonet_leaders: "銃剣指揮官"
 bayonet_leaders_desc: "優れた指揮があれば、部下はそれに続くものだ。将校たちに前線で指揮をさせるべきだろう。"
 improved_logistics: "兵站の改善"
 improved_logistics_desc: "この時代の近代的な戦争術は、戦術について語る素人官僚と、兵站を研究する職業軍人との隔たりを明確にする。"
 land_morale_movement_cost_rev_choice_mil: "容赦のない進軍"
 land_morale_movement_cost_rev_choice_mil_desc: "わが軍隊の行進は、まさに見る者を圧倒する光景である。長距離の行軍のあとでも、一糸乱れぬ動きで即座に戦闘態勢を整える練度と規律は、見事というほかない。"
 mass_army: "大規模な軍"
 mass_army_desc: "我々は軍に入隊させる者を選り好みしすぎていた。これまでは、非常に貧しく、自暴自棄で、誰にも顧みられない者だけを選んできたが、今後は恵まれないすべての者に、兵士となる機会を与えることとする。"
 massed_battery: "砲兵の集中運用"
 massed_battery_desc: "わが軍の砲兵を、ひとつの大規模な砲兵隊として集中させよう。その破壊力は、必ずや敵の戦列を貫く。"
 national_conscripts: "徴兵令"
 national_conscripts_desc: "男性に兵役を義務づけることで、軍隊の規模を拡大させる。"
 port_cost_distance_from_capital_choice_mil: "沿岸巡回"
 port_cost_distance_from_capital_choice_mil_desc: "すべての沿岸で適切な巡回をおこなうことで、いかに遠方の地域であっても我々の統治の存在感を強く示すことができる。"
 press_gangs: "強制徴募"
 press_gangs_desc: "海上での生活は辛く過酷なもので、海軍に入りたいと望む者はそう多くない。水夫としての能力をもつ男性の強制徴募を合法化することで、乗組員の確保が容易になり、船を就役させるまでのプロセスを早められる。"
 superior_seamanship: "優れた操船術"
 superior_seamanship_desc: "わが国の[navy|e]を、高品質の船と熟練した船長・水兵を擁する、最高の[navy|e]へと変貌させることができる。"
 the_young_can_serve: "若者の徴用"
 the_young_can_serve_desc: "少年はいくつになれば大人と呼べる？ いくつになれば国家のために命を捧げられる？ 一部の支配者は彼らの徴用に難色を示すが、我々は能力至上主義であり、躊躇しない。"
 #Government Types
 #Monarchy
 #Age 1 - Age of Traditions
 feudal_de_jure_law_advance: "$feudal_de_jure_law$"
 feudal_de_jure_law_advance_desc: "「#italic De Jure#!（法律上の）」とは、それが実際におこなわれているか否かに関わらず、法的に認められた慣習を説明する言葉である。封建社会の制度は、まさにこの概念に基づいている。"
 monarchy_reform_traditions_advance: "君主制による伝統の改革"
 monarchy_reform_traditions_advance_desc: "権力は、誰彼かまわず無責任に委ねられるものではない。統治者の手にすべての権力を集中させることで、強力な君主制のもと、秩序と安定が保たれるのだ。"
 monarchy_royal_court_advance: "$royal_court_customs_law$"
 monarchy_royal_court_advance_desc: "$royal_court_customs_law_desc$"
 noble_knights: "貴族騎士"
 noble_knights_desc: "騎兵隊を支えるには、大量の余剰馬を生産する経済システムが必要となる。貴族階級の特権を保証すれば、彼らはより満足するだけでなく、必要な馬を生産するための労働にさらに取り組むだろう。わが国の宮廷の道化師は、これを“高貴な農奴”と表現した。"
 partition_inheritance_advance: "相続の分割"
 partition_inheritance_advance_desc: "君主の息子たちは、それぞれが将来の君主になりたいと願うため、対立することも珍しくない。このような対立を避けるため、一部の君主は息子たちに平等に遺産を相続させ、すべての領土と称号を分割し、彼らの留飲を下げさせる。"
 salic_law_advance: "サリカ法典"
 salic_law_advance_desc: "世界の君主制国家では、女性の役割は必ずしも尊重されていない。それゆえに、これらの国家では男性の兄弟やいとこを優遇するために、女性が相続に参加することを直接的に禁止する法律があることも珍しくない。"
 semi_salic_law_advance: "$semi_salic_law$"
 semi_salic_law_advance_desc: "サリカ法では、王位を継承できるのは男性のみである。このような慣行は、男系が途絶えると致命的な問題を引き起こし、君主制は継承の危機に陥ることになる。こうした事態を避けるため、女性の権利を拡大し、適当な男子継承者がいない場合には、女性にも継承権を認めるべきである。"
 serfdom: "農奴"
 serfdom_desc: "軍隊の歩兵は[food|e]も乏しく、賃金も低く、医療もほとんど受けられないことから、自ら進んでなる者は少ない。しかし、農民を土地に縛りつけることで、新兵を探すべき場所がわかりやすくなるだろう。"
 #Age 2 - Age of Renaissance
 aristocracy: "貴族"
 aristocracy_desc: "貴族は君主制における重要な要素である。王朝を取り巻く貴族の一団こそが、君主にその正当性を与えるのだ。結局のところ、貴族の血筋という概念なしに王家の血筋は存在しえない。よって貴族は君主を支持するが、一般庶民と混同されてはならないため、つねになんらかの特権を望んでもいる。"
 local_nobility: "地方貴族"
 local_nobility_desc: "貴族は自分たちが優れた存在だと自覚しており、ふさわしい者に忠誠を誓う。我々が特権を認めてやれば、彼らはその厚遇を記憶し、外国勢力の誘惑に対してより抵抗するようになるだろう。"
 #Age 3 - Age of Discovery
 military_traditions: "軍事的伝統"
 military_traditions_desc: "軍事思想はつねに進化するものであり、我々もその進化に追随しなければならない。わが国の貴族にも奉仕の伝統を奨励し、戦場で己の地位を獲得させるのだ。勇敢さは確かに評価されるべきだが、戦場においては敵を打ち倒す功績に勝るものはない。"
 #Age 4 - Age of Reformation
 legitimization_of_power_law_advance: "$legitimization_of_power_law$"
 legitimization_of_power_law_advance_desc: "$legitimization_of_power_law_desc$"
 noble_officers: "貴族の将校"
 noble_officers_desc: "誰が部隊を率いるかは重要な選択だ。わが国の貴族は、自分たちに優先権が与えられるよう求めている。これは敵を剣で打ち倒して勇気を示す良い機会であり、我々はその機会を彼らに与えることとする。"
 #Age 5 - Age of Absolutism
 noble_resilience: "貴族の人脈"
 noble_resilience_desc: "この大陸にはさまざまな傭兵団がいるが、多くの場合、小貴族に率いられている。貴族と親交を深めることでその人脈を活用し、より大きな傭兵団を探し出しやすくなるだろう。"
 #Age 6 - Age of Revolutions
 international_nobility: "国際交渉と貴族"
 international_nobility_desc: "国際的な交渉というものは厄介な仕事だ。外国との取引に慣れている商人階級こそが、この仕事に最適だと言う者もいる。そうした意見は、わが国の貴族の一族が長年築いてきた血縁的なつながりを無視している。そのようなつながりを活用して、わが国は外交上の目的を果たすべきなのである。"
 #Republic
 #Age 1 - Age of Traditions
 banking_country_traditions: "銀行の伝統"
 banking_country_traditions_desc: "多くの国々が交易や商業に富を求める一方で、わが国は良心的な融資を提供することで収入を得ている。"
 bill_of_rights: "権利章典"
 bill_of_rights_desc: "市民に一定の基本的権利を与えることで、農民の反乱の可能性を減らすことができる。"
 republic_reform_traditions_advance: "共和国による伝統の改革"
 republic_reform_traditions_advance_desc: "権力の分散は、健全な共和国の礎となる信条である。くじによる選挙を定めた強固な法律によって、国家の安定と腐敗の抑制が実現するのだ。"
 republican_foundation_law_advance: "$republican_foundation_law$"
 republican_foundation_law_advance_desc: "$republican_foundation_law_desc$"
 #Age 2 - Age of Renaissance
 abolished_serfdom: "農奴制の廃止"
 abolished_serfdom_desc: "ローマ時代の記録によれば、自由な者たちからなる市民軍は、強制された市民軍よりも果敢に戦ったとされる。農民を自由にすることで、彼らはその自由を守るためによりよく戦ってくれるだろう。"
 plutocracy: "富の力"
 plutocracy_desc: "富と権力は同義ではないが、関連性があるのは間違いない。権力は人に富をもたらし、富は人に権力をもたらすからだ。我々はこのことを理解している——わが国では最も裕福な者たちが権力を握っているのだから。"
 republican_election_law_advance: "$republican_election_law$"
 republican_election_law_advance_desc: "$republican_election_law_desc$"
 republican_electorate_law_advance: "$republican_electorate_law$"
 republican_electorate_law_advance_desc: "$republican_electorate_law_desc$"
 #Age 3 - Age of Discovery
 free_merchants: "自由商人"
 free_merchants_desc: "保守的で時代遅れな社会では、交易に携わる人間は土地を所有する人間よりも劣るとみなされる。我々はそれとは異なり、富はその出どころによらず、力であるということを理解している。"
 republican_power_law_advance: "$republican_power_law$"
 republican_power_law_advance_desc: "$republican_power_law_desc$"
 tradition_of_payment: "報酬の伝統"
 tradition_of_payment_desc: "傭兵への報酬支払いを数日遅らせたい、という誘惑はつねに存在する。何しろ、急な出費は突然発生するものだ。しかし我々は、傭兵への支払いは期日通りにおこなう。傭兵隊長もこのことを承知し、忘れないはずだ。"
 #Age 4 - Age of Reformation
 free_cities: "自由都市"
 free_cities_desc: "わが国の各都市に、交易に関する自治権を与えることで、有益な交易路を新たに開拓できるだろう。"
 principle_of_administration_law_advance: "行政法の原則"
 principle_of_administration_law_advance_desc: "わが国の行政は、自然と複雑化している。これに応じて、新しい法律を制定する必要がある。"
 #Age 5 - Age of Absolutism
 free_subjects: "自由民"
 free_subjects_desc: "使用人を打ち据えるのは気分がいいものだが、彼らを働かせる上では最善の手段ではない。ある自然哲学者は、利益を人々の主な動機とするという考えに至った。金銭による地代の代わりに生産物を収めさせれば、農民が生産性を高める動機づけとなるだろう。"
 #Age 6 - Age of Revolutions
 emancipation: "制限撤廃"
 emancipation_desc: "長きにわたって、我々は土地の所有権を、十分に信頼できる者だけに与えてきた。この制限を解除すれば、土地の所有は拡大するだろう。そうなれば、軍隊に動員できる季節労働者の確保にもつながるはずだ。"
 #Steppe Horde
 #Age 1 - Age of Traditions
 beyond_the_sun: "太陽を越えて"
 beyond_the_sun_desc: "大オルダの時代はまだ終わっていない。我々は敵の過ちから学び、より賢く、より強く立ち上がるのだ。太陽が生まれ、そして死ぬ土地はすべて我々のものでなければならない。"
 borjigin_blood: "$Borjigin$の血"
 borjigin_blood_desc: "我々が受け継いでいるのは、$Borjigin$の血、$genghis_khan_name_no_tooltip$その人の血である。すべての国は我々の遺産にひれ伏し、ステップのすべての領土は我々を支配者と認めるだろう。"
 caravanserai_advance: "$caravanserai$"
 caravanserai_advance_desc: "前千年紀、中央アジアに交易路が生まれ、シルクロードと呼ばれるネットワークが形成された。その鍵となったのは、商人たちとその隊商が立ち寄り休息することのできる、$caravanserai$と呼ばれる場所の繁栄だ。"
 horse_lords: "草原地帯の馬王"
 horse_lords_desc: "唯一の真なる獣は人間の本性である。馬は我々の子供たちとともに生まれ育ち、我々と同じように気高く、そして獰猛であることを学んだ。我々は彼らの厳しい調教を最大の誇りと認識し、彼らは我々を最高の主と認識している。"
 kurultai_advance: "クリルタイ"
 kurultai_advance_desc: "各戦士団の団長を全員集め、我々の軍勢を勝利に導く$rank_empire_horde_ruler_suffix_male$を選出する。天幕の下で我らが民の運命が決定され、我らを率いる自信のある候補者たちのなかから指導者が選出されるのだ。"
 steppe_slave_raiding: "草原の奴隷略奪"
 steppe_slave_raiding_desc: "我々の襲撃部隊は風のように速く動き、誰も気づかないうちに襲撃を仕掛けて離脱する。襲撃した集落を略奪することだけが大金を稼ぐ方法ではない。虜囚を捕らえ、高値で売り払うことも金になるのだ。"
 turco_mongol_tradition: "トルコ・モンゴルの伝統"
 turco_mongol_tradition_desc: "$Borjigin$王朝は$mongolian_culture$に起源をもつが、$genghis_khan_name_no_tooltip$によって征服された$central_asia$の領土は、主に$turkic_group$住民の居住地であった。その結果、この2つの集団のあいだに独特の文化的融合が生まれた。"
 yams_of_the_great_khan: "大$rank_kingdom_horde_ruler_suffix_male$のジャム"
 yams_of_the_great_khan_desc: "伝令がモンゴル軍に遅れをとらずに移動できるようにするため、$genghis_khan_name_no_tooltip$は「ジャム」と呼ばれる中継所を30～60キロごとに設置し、伝令に食料、避難所、予備の馬を提供する制度を創出した。これにより、伝令は馬が駆け抜けるのと同じ速さで移動できるようになり、疲労によって移動速度が落ちることもなくなった。このような手段によって、わが帝国はパクス・モンゴリカの広大な規模がもたらした兵站の問題を、少なくとも一時的には克服することができたのである。"
 #Age 2 - Age of Renaissance
 mandate_of_the_khan: "$rank_kingdom_horde_ruler_suffix_male$の天命"
 mandate_of_the_khan_desc: "$rank_kingdom_horde_ruler_suffix_male$の指示は、神々の指示である。わが国民の団結は、偉大なる指導者への忠誠から生まれる。王冠にひれ伏す者の意志を曲げられる男だけが、我々の献身に値するのだ。"
 slavery_before_death: "殺す前に奴隷にせよ"
 slavery_before_death_desc: "都市の破壊や焼き討ちは戦争の一部である。かつてわが国の戦士は、目にするものはすべて破壊し、略奪し、立ちはだかる者はすべて殺していた。こうした行為は彼らの士気を高めたが、経済的とは言いがたかった。この新しい方針を採用すれば、血塗られた王位のためにむやみに首を切るのではなく、働ける者は少なくとも奴隷として使うことができる。"
 steppe_horde_tribal_religious_values_law_advance: "$tribal_religious_values_law$"
 steppe_horde_tribal_religious_values_law_advance_desc: "$tribal_religious_values_law_desc$"
 there_shall_be_no_grass: "草一本生えず"
 there_shall_be_no_grass_desc: "我々の軍勢が通り過ぎた場所では、草は二度と育たず、その土地はもはや我々の敵を育むことはない。昼夜が過ぎ去り、大地は静寂に包まれ、再び作物を収穫することもない。逃れることのできない飢えもあるのだ。"
 #Age 3 - Age of Discovery
 horde_loot_discovery_advance: "略奪の利益"
 horde_loot_discovery_advance_desc: "略奪はつねに我々のアイデンティティの一部だ。それは、わが民を訓練すると同時に、多くの富を得る方法でもある。略奪をさらに煽ることに害はない——少なくとも我々にとっては。"
 horde_loyalty: "遊牧民の忠誠"
 horde_loyalty_desc: "わが民の忠誠心に疑いの余地はない。$rank_kingdom_horde_ruler_suffix_male$の繁栄した支配のもとで生きてきた魂は、そこから離れようとは思わないだろう。"
 steppe_horde_tribal_cultural_identity_law_advance: "$tribal_cultural_identity_law$"
 steppe_horde_tribal_cultural_identity_law_advance_desc: "$tribal_cultural_identity_law_desc$"
 trampling_horde: "蹂躙する軍勢"
 trampling_horde_desc: "$genghis_khan_name_no_tooltip$はその征服によって世界を震え上がらせたが、我々も同じことを果たすつもりだ。世界は疾駆する我々の馬を恐れるようになるだろう。"
 #Age 4 - Age of Reformation
 logistics_of_khan: "$rank_kingdom_horde_ruler_suffix_male$の兵站"
 logistics_of_khan_desc: "大$rank_kingdom_horde_ruler_suffix_male$の征服は優れた軍事力の成果であると同時に、優れた兵站も不可欠だったことを人々は忘れている。我々は大$rank_kingdom_horde_ruler_suffix_male$の技術を模倣しつつ、それを現代流に改善しなければならない。そうすれば、より幅広い地域を征服できるだろう。"
 populating_the_steppes: "草原地帯の定住"
 populating_the_steppes_desc: "敵に破滅をもたらすだけでなく、国境内に住む多くの人々に平和をもたらさなければならない。内なる平和を維持し、帝国全土から才能ある男女が新たな大都市に居住するよう奨励することで、我々は草原を我がものにできるだろう。"
 steppe_horde_tribal_modernization_law_advance: "$tribal_modernization_law$"
 steppe_horde_tribal_modernization_law_advance_desc: "$tribal_modernization_law_desc$"
 watchers_of_the_silk_road: "シルクロードの監視者"
 watchers_of_the_silk_road_desc: "我々は建設も取引もしない。必要なもの、ときにはそれ以上のものを手に入れる。わが戦士たちは外国の商人とその技術を注意深く見張ってきた。そしていま、我らは物資を運ぶ最も安全な道を知っている。"
 #Age 5 - Age of Absolutism
 a_magnanimous_empire: "寛大な帝国"
 a_magnanimous_empire_desc: "大$rank_kingdom_horde_ruler_suffix_male$の繁栄した治世は、その恐るべき剣だけでなく、賢明にも彼に膝を屈した人々に対する義理堅さでも知られていた。この歓迎な帝国を歓迎する者は、その一員として扱われるだろう。"
 #Age 6 - Age of Revolutions
 horde_ardor: "遊牧民の熱情"
 horde_ardor_desc: "我々の馬は、敵にとって騎手と同じくらい獰猛で恐ろしい存在だ。わが騎兵隊が進軍する姿は、地獄から来た悪魔の止められぬ力のごとき様相だ。"
 #Theocracy
 #Age 1 - Age of Traditions
 by_the_grace_of_god: "神の恩寵によりて"
 by_the_grace_of_god_desc: "世界は炎によって創られ、炎とともに滅ぶ。我らが神は、我ら卑しき土くれに命の炎を授け、その過程で我らの魂を燃やし、炎の危うさを見せた。汝、恐るるなかれ。"
 servants_of_god: "神のしもべ"
 servants_of_god_desc: "天の機械の歯車となることは、人類が受けられる最大の栄誉のひとつである。我らが神を主なる神とすることで、国民の心臓を雷鳴のような歓呼で鼓動させよう。"
 state_of_clerics: "聖職者の国"
 state_of_clerics_desc: "神権政治の本質は、神との近似性にある。これを実現するため、わが国の統治は、宗教的儀式と官僚的職務を併せ持った聖職者によって遂行される。"
 theocracy_divine_cause_law_advance: "$divine_cause_law$"
 theocracy_divine_cause_law_advance_desc: "$divine_cause_law_desc$"
 #Age 2 - Age of Renaissance
 flesh_is_weak: "脆弱な肉体"
 flesh_is_weak_desc: "肉体は脆弱だが、魂はそうではない。わが軍隊は、あたかも同じ魂を共有するかのように戦いを学んだ。ゆえに、その士気が挫けることは決してない。"
 friends_in_high_places: "聖なる友人"
 friends_in_high_places_desc: "我々を不滅なる永遠の幸福へ導く道は、ただひとつしかない。神を知ることは、この地上で神の最も身近な代理人を知ることだ。彼らがその道を見つける手助けをしてくれるだろう。"
 #Age 3 - Age of Discovery
 alpha_and_omega: "アルファにしてオメガ"
 alpha_and_omega_desc: "我らが神は、万物の始まりにして終わりである。主の声は、敵が戦いの叫びのなかで聞く、唯一の音となるだろう。主の善なる性質は、彼らをその腕のなかへ迎え入れ、そうして彼らは真実を知るだろう。"
 #Age 4 - Age of Reformation
 conviction_of_sin: "罪の意識"
 conviction_of_sin_desc: "過ちを犯した者は跪くだろう。彼らの悪行の重荷は、永久に彼らを悩ますことになる。自らが引き起こした悪辣なる悪夢の償いを果たすまで、安らかに眠ることはできないのだ。"
 theocracy_nature_of_our_faith_law_advance: "$nature_of_our_faith_law$"
 theocracy_nature_of_our_faith_law_advance_desc: "$nature_of_our_faith_law_desc$"
 #Age 5 - Age of Absolutism
 martyrs: "殉教者"
 martyrs_desc: "殉教者とは、神のために死ぬことが最高の栄誉だと理解している者のことだ。わが国の人々は信仰を胸に秘め、我々の大義へと加わることをつねに切望する。"
 #Age 6 - Age of Revolutions
 divine_passion: "神聖なる情熱"
 divine_passion_desc: "時代は変わりつつある。信仰が何よりも大切だった時代は過ぎ去り、かつては異教とされた教えが庶民のあいだで広がっている。変わりゆく世界を前に、わが国の聖職者は、大義の実現に対する我々の揺るぎない姿勢に慰めを見出している。"
 #Tribe
 #Age 1 - Age of Traditions
 tribal_religious_values_law_advance: "$tribal_religious_values_law$"
 tribal_religious_values_law_advance_desc: "$tribal_religious_values_law_desc$"
 #Age 4 - Age of Reformation
 tribal_migration_law_advance: "$tribal_migration_law$"
 tribal_migration_law_advance_desc: "$tribal_migration_law_desc$"
 #Age 5 - Age of Absolutism
 tribal_cultural_identity_law_advance: "$tribal_cultural_identity_law$"
 tribal_cultural_identity_law_advance_desc: "$tribal_cultural_identity_law_desc$"
 #Age 6 - Age of Revolutions
 tribal_modernization_law_advance: "$tribal_modernization_law$"
 tribal_modernization_law_advance_desc: "$tribal_modernization_law_desc$"
 #Religions
 #Buddhism
 #Age 1 - Age of Traditions
 buddhist_syncretism: "$buddhist_ADJ$の習合"
 buddhist_syncretism_desc: "$buddhist$は広範囲に広まったが、その起源は$india$にあり、現在までさまざまな信仰との接触を繰り返してきた。このため、$buddhist$は源流である$hindu_ADJ$の伝統だけでなく、これまでに触れた多くの神々を取り入れている。"
 four_noble_truths: "四聖諦"
 four_noble_truths_desc: "仏陀の教えの起源にして基礎となる$four_noble_truths$は、我々人間の実相を説く4つの真理である。万物は無常であり、つかの間の存在への執着が魂に苦痛をもたらす。この苦しみは、悟りを開き、執着から解放されることでのみ和らぐ。そしてその指針となるのは、$noble_eightfold_path$である。"
 middle_way: "中道"
 middle_way_desc: "仏陀は、快楽に執着する者、あるいは極端な禁欲主義者は悟りを開くことができないため、両極端を避けるべきだと説く。"
 noble_eightfold_path: "八正道"
 noble_eightfold_path_desc: "輪廻から解放されて涅槃へ至るための道を示す$noble_eightfold_path$は、$buddhist_ADJ$徒のためのさまざまな実践徳目の集約である。$buddhist$徒たちに精神と肉体の両面で指南し、彼らの振る舞いを決定する。"
 three_jewels: "三宝"
 three_jewels_desc: "$three_jewels$は、$buddhist$徒が敬う3つの帰依の対象である。これらはそれぞれ、#italic 仏#!——悟りを開いた仏陀、#italic 法#!——仏陀の教え、#italic 僧#!——仏陀の教えを守る僧団を指す。"
 #Age 2 - Age of Renaissance
 buddhist_canon: "仏典"
 buddhist_canon_desc: "$buddhist_canon$は、宗派ごとに名称や内容の異なる$buddhist$の聖典集である。戒律や#italic 経#!、仏陀の教えなどのさまざまな内容が収められており、$buddhist$徒なら誰でもこれらに精通していなければならない。"
 buddhist_councils: "結集"
 buddhist_councils_desc: "ゴータマ・シッダールタ（仏陀）の入滅後、さまざまな経典に記された教義を整理するために、数えきれないほどの結集（会議）が開かれた。特定の結集に関する記録は宗派によって異なるが、こうした結集の結束力は否定できない。"
 buddhist_universities: "$buddhist_ADJ$大学"
 buddhist_universities_desc: "$buddhist_ADJ$の拠点は、古くから学びや知識の中心であり、多くの人々が世界中から集ってきた。ナーランダはかつての最大の中心地であり、それ以降数多くの大学が創設された。"
 pali_canon: "パーリ仏典"
 pali_canon_desc: "$buddhist$では宗派ごとに異なる経典集が存在するが、最も古く、権威ある経典集は$theravada_ADJ$の$pali_canon$である。ほかの宗派ではさまざまな出典から集めた経典によって構成されるが、$pali_canon$はアショーカ王の時代から変更されておらず、仏陀自身の言葉も含まれている。多くの宗派が基礎や参考文献としてこれを使用している。"
 sutra: "経"
 sutra_desc: "$dharmic_ADJ$と$buddhist_ADJ$における経典の一種。形式や内容はそれぞれ異なるが、どちらも知識の源として捉えられ、精神を鍛えるためにはこの内容を正しく理解する必要がある。"
 xuanzang_travels: "玄奘の巡礼"
 xuanzang_travels_desc: "玄奘という$chinese_group$の仏僧が、7世紀の唐代、$india$を目指して17年にわたる巡礼の旅に出た。旅の目的は、学問の中心地を訪れ、多くの仏典を集めることにあった。彼はさまざまな場所を訪れたが、なかでもナーランダでは卓越した学者たちから教えを受け、$china$への帰国時には1,000を超える書物を持ち帰って$mahayana$の発展に大いに貢献した。のちに彼の旅とその記録は『#italic 西遊記#!』となり、仏陀の命を受けた僧侶が孫悟空たち従者を従え、聖典を求めて$india$へ旅立つ物語として描かれた。"
 #Age 3 - Age of Discovery
 avalokitesvara: "観音菩薩"
 avalokitesvara_desc: "観世音菩薩や観音としても知られる$avalokitesvara$は、最も崇拝される菩薩のひとつで、宗派によって性別が異なり、なかには$avalokitesvara$を$hindu_ADJ$のすべての神の起源とする宗派もある。慈悲深い$bodhisattva$であり、「オム・マニ・ペメ・フム（六字大明呪）」は$avalokitesvara$のマントラ（真言）である。"
 bodhisattva: "菩薩"
 bodhisattva_desc: "宗派によって特徴や重要度が異なるものの、$bodhisattva$はつねに深い尊敬と称賛の対象であり、すべての宗派にとって重要な存在であることには変わりはない。"
 maitreya: "弥勒菩薩"
 maitreya_desc: "$maitreya$は現世に$bodhisattva$として存在しており、未来において最後の仏陀として現れると予言されている。$maitreya$の使命は、釈迦仏の教えが衰退した世界でゴータマ・シッダールタ（仏陀）の後継者となり、ダルマ（法）を再興することである。"
 mount_meru: "須弥山"
 mount_meru_desc: "$mount_meru$は、$hindu$や$buddhist$、$jain$における神聖な山で、この宇宙の物理的・精神的中心である。この山が回転する万物の中心であるように、わが国の万物も統治者を中心としている。"
 silk_road_transmission: "シルクロード伝播"
 silk_road_transmission_desc: "$buddhist$の普及はシルクロードなしに語ることはできない。海や陸のシルクロードを介した交易のおかげで、$buddhist$は起源である$india$から遠く離れた場所にまで広まった。"
 #Age 4 - Age of Reformation
 edicts_of_ashoka: "アショーカ王の勅令"
 edicts_of_ashoka_desc: "アショーカ王によって紀元前3世紀に発布された法令で、内容は$buddhist$の奨励などを含む。何世紀も前の法令だが、いまなお$buddhist_ADJ$徒たちの大きな尊敬を集めている。"
 five_precepts: "五戒"
 five_precepts_desc: "$five_precepts$は$buddhist_ADJ$倫理および道徳規範の指針。出家して僧団に属しているかどうかを問わず、$buddhist$徒が守るべき最も基本的な規範として殺生、盗み、性的不品行、嘘、飲酒を慎むよう指示している。"
 four_heavenly_kings: "四天王"
 four_heavenly_kings_desc: "$four_heavenly_kings$はそれぞれが各方角の守護神であり、阿修羅から天界を守るとともに、人間の美徳や道徳を監視する役割を担っている。"
 naraka: "那落迦"
 naraka_desc: "ニラヤとも呼ばれる$naraka$は、転生する前に悪しき業（カルマ）を清めるために苦しむ世界を指す。$naraka$には多くの領域が存在し、上位の世界に転生するために必要なカルマの量によって、そこに留まらなければならない期間とそこで受ける苦しみが決定される。"
 vegetarianism: "菜食主義"
 vegetarianism_desc: "宗派によって差異はあるが、ダルマ（法）には肉食を禁じる教えがいくつか存在する。その厳しさは宗派ごとに異なり、またその対象が僧団のみか、一般人も含むのかなどにも違いがある。"
 #Age 5 - Age of Absolutism
 ascetic_practices: "禁欲的慣行"
 ascetic_practices_desc: "仏陀は極端な苦行の危うさを指摘したが、一部の僧団はいまも苦行を実践している。苦行の例としては、身につける衣服、口にする食事、居住する場所を制限することなどが挙げられる。これらは功徳を積むために必要とされるものではないが、修行者にとっては独自の利点がある。"
 incense_burning: "香"
 incense_burning_desc: "香を焚くことはあらゆる$buddhist_ADJ$儀式や供物の基本となっている。形状や形式はさまざまだが、俗人も僧侶も儀式や瞑想の前には香を焚くのが一般的であり、あらゆる$buddhist_ADJ$寺院にはつねに香の薫りが漂っている。"
 monastic_communities: "僧団"
 monastic_communities_desc: "$buddhist_ADJ$生活の中心は、#italic 僧伽#!と呼ばれる僧侶や尼僧の共同体である。彼らは$buddhist_ADJ$僧団が遵守すべき規律や指針が示された#italic 戒律#!に従っている。"
 offerings: "供物"
 offerings_desc: "$buddhist$の戒律は、功徳を積むために$three_jewels$への供物をおこなうよう説いている。こうした供物には物質的なものと精神的なものとがあり、信徒から受け取る食糧に頼って生活している僧団もある。"
 prestigious_schools: "名門宗派"
 prestigious_schools_desc: "$buddhist$は多数の宗派へと発展したが、各宗派はそれぞれひとつの僧団を中心とし、特定の経典を支持している。宗派のなかには無名となったものがある一方で、一部の宗派は高い名声を集めている。こうした名門宗派とのつながりをもつことで、人々は彼らの評価から恩恵を受けることができる。"
 #Age 6 - Age of Revolutions
 ahimsa: "不殺生"
 ahimsa_desc: "$ahimsa$や非暴力という概念は、ダルマ（法）に従うすべての宗教において重要な徳である。あらゆる争いは、力ずくではなく対話によって平和的に解決することが奨励される。この概念をつねに守ることは難しいものの、暴力はつねに最終手段となるべきであり、その使用は正当でなければならない。"
 buddhist_meditation: "$buddhist_ADJ$の瞑想"
 buddhist_meditation_desc: "宗派を問わず、すべての$buddhist_ADJ$徒が瞑想を日常的におこなっている。その目的は、念、平穏、洞察を得るために思考や心を鍛え、最終的には悟りに達することである。"
 dana: "布施"
 dana_desc: "「寛大さ」を意味する$dana$は、見返りを求めずに他者に何かを与える行為で、ダルマ（法）に関連するすべての宗教において重要な徳である。また、無私の心で個人または共同で他者を助けることは、善業を積むための重要な方法のひとつである。"
 mindfulness: "念"
 mindfulness_desc: "$buddhist$において極めて重要な修行のひとつである$mindfulness$は、仏陀の教えを心に留めながら、身体と心両方の現象に意識を向ける行為である。これにより望ましくない思考や心の状態を避け、自身を望ましい状態へと導くことができる。"
 resistance_to_persecution: "迫害に対する抵抗"
 resistance_to_persecution_desc: "$buddhist$は広範囲に広まったものの、時代を超えて多くの迫害に直面してきた。寺院や象徴は幾度となく破壊され、信徒は虐殺されたり身を隠すことを余儀なくされたりしたが、それでも$buddhist$は力強く生き残った。"
 #Catholicism
 #Age 1 - Age of Traditions
 catholic_pilgrimages: "カトリック巡礼者"
 catholic_pilgrimages_desc: "我々の信仰における聖地は、すべての信者から配慮と関心を向けられるべきである。巡礼を奨励し、巡礼に取り組む人々を称賛することは、わが国の重要な務めである。"
 crusading_knights: "北方十字軍の経験値"
 crusading_knights_desc: "異教徒が巣食うバルト海、および地中海地方に向けて優秀な騎士と貴族を派遣することは、わが国の伝統である。未開人たちに信仰をもたらすというキリストの偉業を全うするだけでなく、わが軍のための経験豊富な指揮官をも獲得できる。"
 marian_devotion: "聖母マリア信仰"
 marian_devotion_desc: "我々の聖母マリアへの献身は、我々の信仰の支柱でありつづけるべきだ。"
 res_publica_christiana: "普遍的キリスト教"
 res_publica_christiana_desc: "キリスト教の同胞とは良好な関係を築かなければならない。たとえ彼らの慣習の一部が、異端とされる場合であってもだ。"
 roman_orthodoxy: "ローマ・カトリック教会の正統性"
 roman_orthodoxy_desc: "ローマ・カトリックの信仰とその教義の正しさは、人々にその権威を保証するためにも、疑問が差し挟まれることがあってはならない。"
 #Age 2 - Age of Renaissance
 beguins_and_beghards: "正しい献身のすすめ"
 beguins_and_beghards_desc: "信者の多くは、修道士や修道女の生活のような祈りと善行の生活に身を捧げている。しかし、彼らは正式な誓いを立てておらず、教皇の承認なしにそうした生活に勤しんでいる。それでも我々は、善行をおこない国民を助けるこれら民衆の取り組みを支持すべきだ。"
 denounce_heretics: "異端者の非難"
 denounce_heretics_desc: "我々には、真の信仰を維持し、異端的批判を口にするすべての者を非難する責務がある。"
 devotio_moderna: "デウォティオ・モデルナ"
 devotio_moderna_desc: "新たな献身のかたちを追及する運動が、信者たちに広がりつつある。我々もこの運動を宮廷に取り入れ、敬虔なキリスト教徒であることを示すべきである。"
 inquisition_advance: "異端審問"
 inquisition_advance_desc: "異端審問は、12世紀にカタリ派の異端に対抗する手段として創設されたものだ。だが、中世後期には、反体制的な教義の普及に対抗するカトリック教会の主な手段として、その範囲は著しく拡大された。"
 preaching_friars: "教え導く修道士"
 preaching_friars_desc: "修道士による説教が高い支持を集めるようになってきた。我々はこの修道士たちを称賛し、農民の信仰を確かなものにする彼らの取り組みを称えよう。"
 #Age 3 - Age of Discovery
 conquistador_advance: "コンキスタドール"
 conquistador_advance_desc: "新大陸の発見は、比類なき富、名声、権力が約束された不確かな遠征に財産と命を賭けることのできる、あらゆる冒険家を惹きつけるものだった。これらの遠征は、彼らのリーダーと王家との合意に基づくものであり、それは「征服の降伏文書」として法的に記されている。"
 frequent_councils: "頻繁な議会"
 frequent_councils_desc: "批判が長引くのを避けるために、我々の信仰に関する議会を頻繁に開くことが提案された。教皇庁に全面的な影響力を及ぼすことはできないものの、この提案を実現するため、集められるだけの権力を行使する必要がある。"
 grand_display_of_faith: "壮大な信仰表明"
 grand_display_of_faith_desc: "神を讃えるべく、神の御名のもとに素晴らしい記念碑を建設しなければ。これは唯一の真の神への信仰を示すだけでなく、わが国の熟練した建築家による技術を示す機会となるだろう。"
 mendicant_orders: "托鉢修道会"
 mendicant_orders_desc: "清貧と放浪の生活を誓った我々の修道会は、わが国の多くの地域に援助を提供してきた。我々は彼らの誓いを乱すことなく、可能なかぎり彼らの取り組みを支援すべきだ。"
 monastery_productions: "修道院の倹約"
 monastery_productions_desc: "わが国の修道院に住む修道士や修道女は、倹約の理想を守りつづけている。我々の聖職者は彼らを模範とすべきである。"
 reform_church_music: "典礼音楽の改革"
 reform_church_music_desc: "我々の典礼音楽に対する改革を実行しなければならない。現在使用されている音楽は本質を失い、もはや容認できるものではない。"
 #Age 4 - Age of Reformation
 baptism_books: "洗礼の手引き"
 baptism_books_desc: "我々はすべての信者のため、洗礼が信仰における重要な礎であることを認め、聖職者たちにこの儀式を実行する機会を与えなければならない。"
 confutatio_augustana: "虚偽の告白の否定"
 confutatio_augustana_desc: "このような激動の時代には、我々が異端な思想とみなすものは何か、そして真のキリスト教徒が従うべき教義は何かを、国民に明確に示さなければならない。"
 exsurge_domine: "エクススルゲ・ドミネ"
 exsurge_domine_desc: "悪しき異端を排除すべく神自らが立ち上がり、わが国から彼らを一掃してくれるだろう！"
 oversea_missions: "国外宣教"
 oversea_missions_desc: "わが国の聖職者は、自ら進んで国外に赴き、布教する準備が整っている。彼らの貢献により、新天地への入植はより容易かつ安上がりになるだろう。"
 roman_catechism: "ローマ教理問答"
 roman_catechism_desc: "聖職者は教会の正式な教義に従うべきである。これにより司祭の能率が向上し、彼らの養成も容易になる。"
 #Age 5 - Age of Absolutism
 catholic_cuius_regio_eius_religio: "領主の宗教が民の宗教"
 catholic_cuius_regio_eius_religio_desc: "#italic その地を収める者の宗教が、その地の宗教である。#!我々は、他国が異なる信仰をもつことを認めなければならない。そしてこれは、ときには外交において重要な役割を果たすだろう。"
 #Sunday Schools Generic
 sunday_schools_advance: "日曜学校"
 sunday_schools_advance_desc: "恵まれない人々に知識を授けることは、我々の重要な宗教的使命である。信者たちに基礎教育を施すために、礼拝と密接に結びついた学校を設立する必要がある。"
 catholic_sunday_schools: "$sunday_schools_advance$"
 catholic_sunday_schools_desc: "$sunday_schools_advance_desc$"
 embellish_baroque_art: "バロック作品の誇示"
 embellish_baroque_art_desc: "芸術を支援することは、わが信仰における偉大な伝統である。バロック様式の発展はわが国の神学をよく反映しており、我々はこうした芸術家たちの支援を継続していくべきだ。"
 index_librorum_prohibitorum: "禁書目録"
 index_librorum_prohibitorum_desc: "宗教改革という危険な思想が広まる原因は、国民がこうした愚かな教えを説く書物に触れる機会を放置するからである。"
 second_scholasticism: "第二$scholasticism$"
 second_scholasticism_desc: "中世スコラ学の哲学的運動を復活させ、さらなる改善を加える必要がある。"
 #Age 6 - Age of Revolutions
 catholic_enlightenment: "カトリック啓蒙"
 catholic_enlightenment_desc: "信仰が啓蒙の時代を乗り切るためには、我々は時代に適応し、教会に対する新たな視点を取り入れなければならない。"
 continue_missionary_works: "宣教活動"
 continue_missionary_works_desc: "我々の信仰を世界中に広める宣教活動に終わりはない。カトリックの教えを広めるために、さらに多くの宣教を支援する必要がある。"
 divine_church_music: "神聖な典礼音楽"
 divine_church_music_desc: "わが国の作曲家の多くは、信仰から着想を得て素晴らしい作品を生み出してきた。今後も卓越した芸術家を追い求め、雇用し、教会や大聖堂が劣悪な音楽に穢されないよう努めなければ。"
 entrenched_church: "確立された教会"
 entrenched_church_desc: "どのような民族を統治する際も、教会の存在は彼らに画一的な構造を与えてくれるだろう。"
 national_churches: "国家教会"
 national_churches_desc: "わが国の行政に対し、外国勢力が過剰な影響をもたらすことは許容できない。国家は国内の教会をより強く統制するべきである。"
 #Hellenism
 #Age 1 - Age of Traditions
 epic_poetry_advance: "叙事詩"
 epic_poetry_advance_desc: "数千年にわたり、わが国の民は叙事詩を通じて神々と英雄の伝説を守りつづけてきた。ホメロスの「イーリアス」や「オデュッセイア」、そしてヘシオドスの「神統記」は、我々の文化的遺産における最も偉大な作品として位置づけられている。これらの時代を超越した物語は、いまもなお我々のアイデンティティを形作り、世代を超えて人々を鼓舞しつづけている。"
 makaron_nisoi_advance: "「至福者の島」の物語"
 makaron_nisoi_advance_desc: "マカローン・ネーソイ（至福者の島）は、極めて徳の高い魂の最終的な行き先であると信じられている。信心深く、卓越した人生を送った者は、エーリュシオンの野で英雄の霊たちのあいだに席を得ることができる。この神聖な領域に関する物語は、社会全体において徳を積み、誉れを受け、道徳心を涵養することを促す。"
 #Age 2 - Age of Renaissance
 offerings_to_the_moirai_advance: "モイライへの供物"
 offerings_to_the_moirai_advance_desc: "我々は毎年、儀式の供物の一部を、運命そのものを司る三女神、モイライに捧げる。紡ぎ手クロートー、命の分配者ラケシス、そして不可避の終焉を司るアトロポスは、宇宙の秩序に従ってあらゆる限りある命の完遂を管理する。多くの神学的伝統において、彼女たちの権威は根源的なものとみなされており、時には神々の権威さえも凌駕するとされている。"
 on_hubris_and_morality_advance: "傲慢と道徳について"
 on_hubris_and_morality_advance_desc: "我々の信仰の原則は神々の意志に由来し、司祭、預言者、そして占術によって解釈される。預言と神聖な解釈を通じて、人間は宇宙の神聖なる秩序を理解しようと試みる。しかし、道徳的美徳に至る最も確かな道は、依然として信仰心、畏敬の念、そして破壊をもたらす傲慢を慎重に避けることにある。"
 religious_dialects_hellenic_faith_advance: "宗教的方言"
 religious_dialects_hellenic_faith_advance_desc: "我々の信仰は多くの共同体で共有されているが、儀式、伝統、そして地域の宗教的慣習には顕著な相違が見られる。時が経つにつれ、こうした差異は自然に生まれ、時には同じ州内でさえ生じることがある。言語が地域の方言へと進化するように、我々の宗教的慣習もまた、同一の神聖な伝統の枠組みのなかにありながら、徐々に独自の地域的な表現を形成していくのである。"
 #Age 3 - Age of Discovery
 mystai_advance: "密儀宗教"
 mystai_advance_desc: "仮面、象徴、そして神聖な儀式の陰に隠れて、力のある入信者たちが謎めいた密儀宗教に集う。こういった組織は、儀式の権威、富、そして慎重な同盟関係を通じて情勢を左右し、社会的・政治的に多大な影響力を行使している。賢明な統治者は、その影響力と策謀が国家に牙を向くことのないよう、これらのミュスタイ（密儀宗教の入信者）と良好な関係を維持している。"
 variety_in_divine_identity_advance: "神々の多様性"
 variety_in_divine_identity_advance_desc: "我々の神々には驚くべき多様性があり、さまざまな美徳、技芸、理想を体現している。この多様性により、誰もが自らの人生と天職に共鳴する守護神を見出すことができる。鍛冶屋がヘーパイストスに捧げる質素な祭壇も、ゼウスに捧げられる貴族の献身と同等の意味をもつのである。"
 #Age 4 - Age of Reformation
 preserve_theogony_advance: "神統記の教え"
 preserve_theogony_advance_desc: "ヘシオドスの「神統記」は、神々の起源と系譜を語り、神聖な秩序そのものの誕生を明らかにしている。その詩句を通じて、王笏や統治者の声といった権威の象徴は、神聖な責務として提示される。この作品は、真の権威は知恵、節度、そして理性をもって行使されなければならないのだと統治者に諭している。"
 unify_priestly_class_advance: "聖職者階級の統一"
 unify_priestly_class_advance_desc: "我々の歴史の大部分において、聖地や神殿収益を管理する聖職者は、分散化された形で機能してきた。しかし近年、諸外国の宗教機関における動向は、組織化や中央権威に関する新たな概念をもたらした。これらの影響は、いまや我々の聖職者階級の統一と協調を促している。"
 #Hinduism
 #Age 1 - Age of Traditions
 mahabarata: "マハーバーラタ"
 mahabarata_desc: "『$mahabarata$』は『$ramayana$』と並ぶ$smrti$の2大経典のひとつであり、古代$india$の叙事詩である。これは$greek_language$の『イーリアス』と『オデュッセイア』を合わせたものの10倍の文章量を誇り、歴史上最も長大な叙事詩とされる。古代$indian_group$のクル国の王位をめぐる王朝間の争いが描かれており、クルクシェートラの戦い（別名$mahabarata$の戦い）で最高潮に達する。そして、$krishna_avatar$の死と彼の王朝の滅亡によって物語は終わりを迎える。"
 ramayana: "ラーマーヤナ"
 ramayana_desc: "『$ramayana$』は『$mahabarata$』と並ぶ$smrti$の2大経典のひとつであり、古代$india$の叙事詩である。$vishnu_god$の化身、$rama_avatar$であるコーサラ国の王子の生涯が描かれており、人生のあらゆる面において徳が重要であることが強調されている。"
 smrti: "スムリティ"
 smrti_desc: "「記憶されたもの」を意味する$smrti$経典は、$vedah$に由来するか、または$vedah$から着想を得るかした経典であり、$sruti$よりも権威は劣ると考えられている。しかし、$sruti$とは違って$smrti$には著者がおり、写本を通じて伝承されている。"
 sruti: "シュルティ"
 sruti_desc: "「聞かれるもの」を意味する$sruti$（天啓聖典）は、$hindu$の最も古く、最も神聖な経典である。これは人間によって書かれたものではなく、神からもたらされた啓示とする説が一般的であり、そのため$sruti$の権威を認めながらも、神聖な起源を否定する者もいる。"
 vedah: "ヴェーダ"
 vedah_desc: "$vedah$は$sruti$の主要な経典であり、$sanskrit_language$で書かれた最古の経典である。この経典は『$mahabarata$』に登場するブラフマー（梵天）によって書かれたとされ、リグ・ヴェーダ、ヤジュル・ヴェーダ、サーマ・ヴェーダ、アタルヴァ・ヴェーダがある。"
 #Age 2 - Age of Renaissance
 astika_schools: "アスティカ学派"
 astika_schools_desc: "$hindu$の正統派と呼ばれるこの学派は、$vedah$の権威と$atman$の存在を肯定している。$astika_schools$は多くの異なる学派で構成されるものの、こうした肯定の姿勢により各々に多くの共通点がある。"
 atman: "アートマン"
 atman_desc: "個々の意識の本質であり、不滅かつ不変の「真我」を意味する。アスティカ学派によれば、この$atman$（我）とは精神や肉体を超えた存在とされ、転生を繰り返すジーヴァートマン（個々の魂）とも区別される。対照的に、ナスティカ学派はこの概念を異なる視点で解釈するか、完全に否定している。 "
 nastika_schools: "ナスティカ学派"
 nastika_schools_desc: "$hindu$の一部の学派は主流から逸脱し、$vedah$の権威と$atman$の存在を否定している。こうした学派には$jain$や$buddhist$が含まれ、これらは$hindu$の主要な教義の多くを共有しているものの異端とされる。"
 purana: "プラーナ"
 purana_desc: "$purana$は$smrti$の一部とみなされる文献群で、その内容は宇宙論、神々の系譜、天文学、文法、愛の物語など多岐にわたり、ほぼすべての分野が網羅されている。$sruti$とは区別されるものの、多様な地域信仰と伝統を$vedah$の共通の物語に組み合わせたこの文献群が$hindu_ADJ$信仰と社会にもたらした影響力は、決して否定できない。"
 #Age 3 - Age of Discovery
 bhakti_movement: "バクティ運動"
 bhakti_movement_desc: "6世紀に始まったこの宗教運動は、個人が崇拝する神や悟りを開いた個人（神の化身など）に対する愛と献身を奨励しており、大衆に彼らの言葉で直接語りかけることで人気を得ている。この運動の影響力は極めて大きく、大衆の宗教観や信仰に対する印象に変化をもたらしている。"
 diversity_of_beliefs: "信念の多様性"
 diversity_of_beliefs_desc: "$india$の人々の信仰はダルマ（法）の概念と$vedah$の経典を中心としているが、その形態と実践法はさまざまである。認識・崇拝する神々でさえ一様ではないものの、信仰内には一貫した概念が存在する。"
 ishvara: "イシュヴァラ"
 ishvara_desc: "$hindu$の学派や宗派によって解釈は異なるが、$ishvara$は「至高の存在」または「神」を意味する。そのため、$shaivism$では$shiva_god$を、$vaishnavism$では$vishnu_god$を指す場合があるほか、個人が崇拝する特定の神を指す場合もある。"
 sanskritization: "サンスクリット化"
 sanskritization_desc: "$hindu$はその起源である$india$を越えて遠方まで広がり、多くの文化と国々は自身のアイデンティティの定義に$sanskrit_language$概念や称号を取り入れるようになった。このため、$hindu$の概念はより容易に他国の信仰へと浸透し、取り入れられている。"
 #Age 4 - Age of Reformation
 diwali: "ディワリ"
 diwali_desc: "光の祭典である$diwali$では、ダルマ（法）の勝利——つまり悪に対する善の、闇に対する光の勝利を祝う。この勝利の象徴としてろうそくやランプに火を灯し、祖先を敬うのが習わしである。"
 holi: "ホーリー祭"
 holi_desc: "春の訪れを祝う$holi$は色彩と愛の祭りで、農業と豊作を祝い、春の鮮やかさ楽しむ。喜びのなかで過ごすと同時に、争いを終わらせ、感情の汚れを取り除く祭りでもある。"
 holy_rivers: "聖なる河"
 holy_rivers_desc: "河川とその崇拝は、つねに$hindu$の重要な要素だった。インダス川やガンジス川などの聖なる川が数多くあり、その川岸では多様な儀式がおこなわれる。これらの河川の水は神聖なものとされ、この水でおこなう清めの儀式は日常的に見られる。"
 yoga: "ヨーガ"
 yoga_desc: "$hindu_ADJ$宗派や哲学のひとつである$yoga$は、一連の身体的および精神的な実践を指し、心身の統一を目的としている。数千年前から実践されており、悟りに至る道とほぼ同義として捉えられている。"
 #Age 5 - Age of Absolutism
 advaita_vedanta: "アドヴァイタ・ヴェーダーンタ"
 advaita_vedanta_desc: "$advaita_vedanta$（不二一元論）は意識と物質の二元論を否定し、真の自己や意識——$atman$（我）は、宇宙の最高の現実や意識——ブラフマン（梵）と一体であり同一であると説く。この点においては、物質世界はブラフマンの究極的現実を隠す幻にすぎない。"
 hindu_architecture: "$hindu_ADJ$建築"
 hindu_architecture_desc: "シーカラ、ヴィマナ、プラングといった建築様式を問わず、$hindu_ADJ$寺院は装飾された高い尖塔が特徴的である。これらの尖塔は$mount_meru$を表現しており、その表現の程度は地方によって異なるが、力を象徴し誇示する役割を果たす。"
 hindu_muslim_relations: "$hindu_ADJ$と$muslim_ADJ$間の関係性"
 hindu_muslim_relations_desc: "$hindu$と$muslim$には過去に多くの交流があり、それは今後も変わらないだろう。民衆は平和的に共存することを学び、ふたつの信仰のあいだにはある程度の習合さえ起こっている。"
 hindu_unification: "$hindu_ADJ$の統一"
 hindu_unification_desc: "$hindu$には多様な崇拝と実践が存在するが、我々を隔てるものよりも結びつけるもののほうが多い。$hindu$に対する統一された見解が生まれはじめたことにより、民衆は強い一体感を得ることができる。"
 varna_system: "ヴァルナ制度"
 varna_system_desc: "$vedah$文献の時代から、個人のダルマ（法）は#italic バラモン#!（学者や僧侶）、#italic クシャトリヤ#!（統治者や戦士）、#italic ヴァイシャ#!（農民や商人）、#italic シュードラ#!（職人や召使い）のいずれかに分類されるという概念があった。この分類はそこまで厳格ではなく、個人の使命の理想を表すものだが、それでも$hindu_ADJ$社会に大きな影響力をもっている。"
 #Age 6 - Age of Revolutions
 extreme_pacifism: "極端な平和主義"
 extreme_pacifism_desc: "$ahimsa$の概念に基づき、$hindu$は平和主義と非暴力の立場を貫いてきた。しかし、敵には我々を挑発しないように注意してほしい。さもなくば、我々が戦争に駆り立てられた際、正反対の「極端な暴力主義」に陥ってしまわないとも言い切れない。"
 hindu_empires: "$hindu_ADJ$帝国"
 hindu_empires_desc: "$hindu$を信仰する帝国は、太古の昔から数多く存在してきた。$india$のマウリヤ朝やグプタ朝、$indonesia_region$のシュリーヴィジャヤ王国、そして長きにわたり繁栄したチョーラ朝に至るまで、$hindu$にはつねに強力な君主たちの背景にあった。"
 sacred_cattle: "神聖な牛"
 sacred_cattle_desc: "$ahimsa$の一環として、牛を殺すことは禁止されている。このため牛には敬意が払われ、母性的な存在として、また無私の奉仕や自己犠牲の象徴として崇敬されている。これは$vedah$の時代から続いており、牛たちは我々の尊敬と配慮に値する存在である。"
 #Islam
 #Age 1 - Age of Traditions
 holy_revelation: "神聖なる啓示"
 holy_revelation_desc: "$muslim_god_name$の啓示はその預言者であるムハンマド——彼に平安あれ——にもたらされ、聖なる$common_string_quran$に記録されている。この$common_string_quran$を通して$muslim_god_name$の御意志が信者へと継承されるとともに、$muslim_ADJ$信者はこの一節一節を深く理解する必要がある。"
 islamic_calligraphy: "イスラム書道"
 islamic_calligraphy_desc: "$muslim$は平和と調和の宗教であると同時に、芸術の宗教でもある。$common_string_quran$の節や預言者の名を何度も記した書は、聖典と芸術を融合した作品である。"
 islamic_prayer: "アス・サラート・ファルド"
 islamic_prayer_desc: "$muslim$の五行のひとつである「アス・サラート」は、$muslim_ADJ$信者に義務づけられた日常的な礼拝である。礼拝の回数や方法は宗派によって異なるが、日常的に祈りを捧げるという行為はすべての$muslim$に共通している。"
 people_of_allah: "$muslim_god_name$の信奉者"
 people_of_allah_desc: "我々は唯一にして絶対の神である$muslim_god_name$の信奉者であり、その御意志に従う者である。$muslim_god_name$の目には、自らを信仰する者はすべて兄弟であり姉妹として映る。"
 zakah: "アル・ザカート・ワージブ"
 zakah_desc: "$muslim$の五行のひとつである「アル・ザカート」は施しの一形態であり、$muslim_ADJ$信者の宗教的義務とされている。一定の財産をもつ者には、恵まれない者に財産を分け与える慈善行為が求められるが、これは税金に分類される。"
 #Age 2 - Age of Renaissance
 imamate: "イマーム制"
 imamate_desc: "$shia_ADJ$信仰はムハンマド——彼に平安あれ——を土台としており、後継者にはアリー・イブン・アビー・ターリブが任命されている。このためイマームとは、$muslim_ADJ$信者を導くためにムハンマド——彼に平安あれ——の系譜からもたらされる宗教指導者なのである。"
 islamic_golden_age: "イスラム黄金時代"
 islamic_golden_age_desc: "$muslim$が文化的な発展を遂げた輝かしい時代はすでに過去のことだが、$islamic_golden_age$が$muslim_ADJ$の国々のみならず世界へもたらした影響は否定できない。不信仰の国々は無知の時代に取り残されていたが、彼らのなかには我々の芸術と科学の素晴らしさに気づきはじめた者もいる。"
 muslim_caravans: "$muslim_ADJ$キャラバン"
 muslim_caravans_desc: "シルクロードの多数の交易路からサハラ砂漠の塩道にいたるまで、わが国のキャラバンは遥か遠い土地を目指して交易の旅に出るのが伝統であり、彼らは$muslim_ADJ$世界にさまざまな交易品をもたらしてくれている。"
 muslim_lineage: "$muslim_ADJ$の血統"
 muslim_lineage_desc: "ムハンマド——彼に平安あれ——の時代より、$muslim$は支配構造と本質的に結びついている。我々もまた、信仰そのものによって正当化されている血統である。"
 ramadan: "ラマダン"
 ramadan_desc: "預言者ムハンマド——彼に平安あれ——にもたらされた最初の啓示を記念する$ramadan$の月は、$muslim$において最も神聖な月である。この期間すべての$muslim_ADJ$信者は、日の出から日没まで断食と禁欲、そのほかにも礼拝や内省をおこなう。これはサウムと呼ばれ、五行のひとつである。"
 sunnah: "スンナ"
 sunnah_desc: "ムハンマド——彼に平安あれ——に由来する伝統と慣習から成る$sunnah$は、$muslim_ADJ$信者が行動の模範とすべきもので、「$sunni$」の名の由来となっている。法学派によって詳細は異なるものの、すべての法学派が$sunnah$を土台としている。"
 islamic_jurisprudence: "イスラム法学"
 islamic_jurisprudence_desc: "何世紀にもわたる学識の蓄積により、フィクフとウスール・アル＝フィクフの学問は、シャリーアによって領土を統治するための完全な枠組みへと成熟した。法体系がこれほどまでに整備されたおかげで、司法を担う法学者たちは正しく法を執行することができ、我々は政府機構を維持できるのである。"
 #Age 3 - Age of Discovery
 blend_of_influences: "影響の融合"
 blend_of_influences_desc: "$muslim$は$arabia_region$で誕生して以来、多くの土地に拡大してきた。そのなかで$muslim$は多種多様な人々や生活様式に触れ、互いに影響を与えあった。この過程で多くの影響の交換が起こり、本来$muslim$にない多くの特徴が取り入れられると同時に、$muslim$を受け入れた多くの文化もまた影響を受けた。"
 expansionist_faith: "信仰の拡大"
 expansionist_faith_desc: "かつて$muslim$は、その起源である$arabia_region$から急速に拡大した。ほんの数世代のうちに$iberia_region$から$india$にまで到達したその驚異的な拡大速度は、前例のないものだった。そしていま、我々の国境の向こうに新たな土地が広がっている。いまこそ第二の$muslim_ADJ$拡大を実行する時かもしれない。"
 indian_sea_trade: "インド洋交易"
 indian_sea_trade_desc: "$muslim_ADJ$商人は何世代にもわたって$indian_ocean_region$を航海し、大きな利益をもたらす製品を求めてはさらに遠くの地を目指した。$africa$東海岸から$india$、そして$indonesia_region$の香料諸島という遥か遠方の地まで、あらゆる海は$muslim_ADJ$の船によって切り拓かれている。"
 islamic_schoolars: "イスラム法学派"
 islamic_schoolars_desc: "$muslim$は聖典の思想とその研究をつねに奨励しており、聖典の解釈方法についてはさまざまな学派が出現した。したがって、$common_string_quran$やその他の聖典の学者は非常に博識であり、極めて深い議論をおこなうことができる。"
 muslim_trade_communities: "$muslim_ADJ$の交易コミュニティ"
 muslim_trade_communities_desc: "遠方を旅する$muslim_ADJ$商人は、さまざまな人々や信仰と触れる機会が多い。こうしたなかで交易コミュニティを形成することで、彼らの信仰を真の$muslim_god_name$の啓示と融合・習合することが可能となった。"
 #Age 4 - Age of Reformation
 distant_trade_ventures: "遠距離交易事業"
 distant_trade_ventures_desc: "遠い土地ほど、より利益の大きい商品を獲得することができる。$muslim_ADJ$商人たちは長きにわたり、利益性の高い交易商品を求めて海と陸の両方で長距離を移動してきた。"
 established_holy_sites: "聖地に関する定め"
 established_holy_sites_desc: "ほかの宗教では聖地の扱い方が厳格さと一貫性に欠けているが、$muslim$では聖地に対するルールが極めて明確である。そのため、正しい時期に我々が巡礼を忠実におこなうことは疑いようがない。"
 gunpowder_empires: "火薬の帝国"
 gunpowder_empires_desc: "火薬が発明されたのは極東だが、これを世界中に普及させ、広く使用されるようにしたのは$muslim$である。何世紀にもわたり火薬兵器はわが軍の主力であり、その生産と使用法は我々を定義する特徴のひとつである。"
 islamic_courts: "イスラムの宮廷"
 islamic_courts_desc: "$muslim_ADJ$諸国の宮廷は、世界中で最も高く称賛される宮廷である。洗練された文化や珍しい交易品に対する評価も高く、我々の宮廷の素晴らしさを伝える物語が各地に広がり、そのような壮麗な場所に治められることを国民は誇りに思っている。"
 schools_of_thought: "思想の学派"
 schools_of_thought_desc: "$muslim$はつねに知識や教育と結びついている。法学や神学のさまざまな学派から、多様な統治者によって形成された種々の知識の学派にいたるまで、$muslim_ADJ$学者たちの功績は$muslim_ADJ$世界だけでなく、異教徒からも称賛されている。"
 #Age 5 - Age of Absolutism
 comprehensive_land_survey: "包括的な土地調査"
 comprehensive_land_survey_desc: "納税者を把握するためには、まず土地の所有者を把握しなければならない。これには包括的な土地調査の実施と、土地情報を最新の状態に維持することが必要不可欠である。これにより、我々は支払期限どおりに税を徴収することができる。"
 cosmopolitan_court: "国際的な宮廷"
 cosmopolitan_court_desc: "人々は$muslim_ADJ$宮廷を拝むために、遠路はるばるこの地を訪れる。こうした壮大な宮廷の魅力はいまだ衰えず、我々のもとには多種多様な才能をもつ者が集っている。"
 counting_the_people: "人口統計"
 counting_the_people_desc: "国民の財産の多寡を把握したあとは、各人の居住地を特定すべきである。これにより我々は、軍隊の兵員を集める際にどこを探すべきかがわかる。"
 jewels_of_the_desert: "砂漠の宝石"
 jewels_of_the_desert_desc: "$muslim$は$arabia_region$の砂漠地帯から始まり、同様に乾燥したほかの多くの地域に拡大した。それでも、いくつかの$muslim_ADJ$都市は砂漠の只中にありながらも輝きを放ち、豊かな生活の中心地として称賛された。努力を惜しまずに取り組めば、どのような集落も彼らと同等の豊かさを手に入れられるはずだ。"
 resilient_merchants: "たくましい商人"
 resilient_merchants_desc: "$muslim_ADJ$商人は、遠征時に極めて過酷な環境に耐えなければならない。サハラ砂漠やゴビ砂漠の焼けつく砂丘を越え、モンスーンで荒れた$indian_ocean_region$を航海する彼らの忍耐強さは、交易の成功のために苦難を乗り越える粘り強さを何度も証明してきた。"
 #Age 6 - Age of Revolutions
 caliphate: "ハリーファ"
 caliphate_desc: "ハリーファまたはカリフ制は、$rank_empire_muslim_ruler_male$と呼ばれるムハンマド——彼に平安あれ——の後継者が、すべての$muslim_ADJ$信者を政治的かつ宗教的に統治する制度である。$rank_empire_muslim_ruler_male$となる資格の定義や解釈には意見の相違があるものの、すべての$muslim$徒が単一の旗のもとに団結するという考え方は、その誕生当初から存在している。"
 contacts_network: "交流網"
 contacts_network_desc: "$muslim$が広大な領域に拡がることにより、$muslim_ADJ$諸国は遠く離れた土地とつながりをもつようになった。こうした豊かなつながりや人脈を維持することは、つねに外交分野に役立つ。"
 harsh_environments: "過酷な環境"
 harsh_environments_desc: "$muslim$はその誕生以来、世界で最も過酷な環境へも拡大した。異教徒たちが我々の地に押し入ろうとも、つねにこの容赦のない環境に苦しむことだろう。"
 ibadi_imamate: "$ibadi_ADJ$イマーム制"
 ibadi_imamate_desc: "$caliphate$や神によって任命された$shia_ADJ$イマームとは異なり、$ibadi_ADJ$イマームの責務は$muslim_ADJ$世界全体の統治ではない。代わりに、すべての共同体はそれぞれのイマームによって個別に統治されるべきである。"
 infiltration_tactics: "潜入戦術"
 infiltration_tactics_desc: "古代の$nizari_school$のハッシャーシーン教団は、本来の活動よりも大いに神格化されているが、彼らの策略および暗殺の戦術が効果的だったことは明らかだ。こうした潜入戦術を我々も取り入れれば、同様の成果を得られるはずである。"
 unified_armies: "団結した軍隊"
 unified_armies_desc: "$muslim$は$arabia_region$に誕生して以来、さまざまな文化や人々へと拡がってきた。たとえ出自が異なっていても、その信奉者はみな偉大なる$muslim_god_name$の名のもとに戦えるはずである。"
 #Judaism
 #Age 1 - Age of Traditions
 judaism_talmudic_academies: "タルムード学院"
 judaism_talmudic_academies_desc: "我々の偉大なイェシーバーは、バビロニアの学問の伝統を受け継ぎ、各地の共同体において途切れることのない師弟の系譜を通じタルムードとその評釈を伝えている。"
 judaism_kabbalistic_tradition: "カバラの伝統"
 judaism_kabbalistic_tradition_desc: "カバラと呼ばれる神秘的・秘教的潮流は、神の流出を象徴する枠組みを通してトーラーを解釈し、律法的なハラハー研究と並んで閉ざされた師弟の系譜の中で伝えられてきた。"
 judaism_communal_autonomy: "共同体の自治"
 judaism_communal_autonomy_desc: "我らが共同体は #italic カハル #! を通じて自治を行う。ラビ長老会である同カハルは、内部の宗教法を裁き、共同体の税を徴収し、受け入れ国の王権に対して我らが宗教民を代表する。"
 judaism_court_patronage_finance: "宮廷金融"
 judaism_court_patronage_finance_desc: "宗教的少数者という立場は、我が金融業者たちをキリスト教徒の多数派を縛る高利貸し禁止から除外し、信用を必要とするあらゆる王宮において金貸しや造幣長官の地位への道を開く。"
 #Age 2 - Age of Renaissance
 judaism_tikkun_mysticism: "ティックーン神秘主義"
 judaism_tikkun_mysticism_desc: "我らが神秘主義の学派は#italicティクーン#!(世界修復)の教義を発展させ、$judaism_ADJ$の離散の境遇を、祈りと学問と倫理的行為を通じて砕かれた世界を繕う能動的な霊的使命として位置づける。"
 judaism_halakhic_codification: "ハラーハーの体系化"
 judaism_halakhic_codification_desc: "我々の法学者たちは、何世紀にもわたるハラーハー解釈の積み重ねを体系的な法典へとまとめ、写本と印刷本を通じて、統一された基準をすべての敬虔な共同体にもたらしている。"
 #Age 3 - Age of Discovery
 judaism_court_patronage_banking: "宮廷銀行"
 judaism_court_patronage_banking_desc: "我々の金融業者は、1つの王室への貸付だけでなく、複数の王室で同時に銀行業を営んでいる。離散した共同体のつながりを利用して国境を越えた信用網を築き、単一の宗教の銀行共同体には真似できない強みを得ているのだ。"
 judaism_rabbinic_council: "ラビ評議会"
 judaism_rabbinic_council_desc: "我らが共同体の指導的ラビたちは地方評議会を招集し、ハラハーの裁定を統一し、共同体間の商取引を規律し、交渉人を任命し紛争を解決しながら、我らが宗教民を王権の前で代表する。"
 judaism_diaspora_communal_institutions: "ディアスポラの共同体制度"
 judaism_diaspora_communal_institutions_desc: "我らが共同体は #italic ベート・ディン #! (ラビ裁判所)を制度化し、婚姻・離婚・相続・破門に関する法的管轄権を成文化することで、我らが宗教共同体を受け入れ先の法廷から独立した、一貫した法的・霊的秩序へと結びつける。"
 #Age 4 - Age of Reformation
 judaism_state_credit_apparatus: "国家信用制度"
 judaism_state_credit_apparatus_desc: "我らが宗教銀行家の家は国家信用の装置へと変貌し、戦争全体を賄い、和平協定を直接引き受けるようになる。受け入れ国家の財政軍事的能力は、我らが宗教共同体全体の信用力と不可分のものとなる。"
 judaism_hasidic_movement: "ハシディズム運動"
 judaism_hasidic_movement_desc: "The popular mystical movement of #italic Hasidism #! revolves around charismatic #italic tsaddikim #! who guide their communities through emotional and experiential piety, joyful song, and personal closeness to the divine, reaching the unlettered peasantry that pure textual scholarship cannot."
 judaism_rationalist_yeshiva: "合理主義的なイェシーバー"
 judaism_rationalist_yeshiva_desc: "我らが学識あるイェシヴァーは、タルムードの分析を精密な合理主義的方法(緻密な文献読解、体系的な法的推論、厳格な批判)へと磨き上げ、広く信心深い共同体のために注釈書や答責集を出版する。"
 #Age 5 - Age of Absolutism
 judaism_religious_emancipation: "宗教的解放"
 judaism_religious_emancipation_desc: "絶対主義国家および革命国家は我らが宗教共同体に市民的平等を認め、何世紀もの間宗教的理由で閉ざされていたギルド、専門職、兵役、選挙による官職への道を開く。我らが信徒は内なる宗教生活を続けながら、受け入れ国家の完全な臣民となっていく。"
 judaism_reform_movement: "改革運動"
 judaism_reform_movement_desc: "宗教改革者たちは、礼拝での現地語使用、儀礼の改革、神学の再解釈を導入することで信仰実践を近代化し、解放によって我々の宗教共同体が加わることになった中産階級の市民社会に適応させている。"
 judaism_international_banking_networks: "国際銀行網"
 judaism_international_banking_networks_desc: "我らが宗教銀行の諸家門(互いに連なる一族の銀行を通じて複数の王宮にまたがる)は、公然と交渉し得ない国家間の非公式な外交的経路となり、資金だけでなく、伝言や条件、そして静かな圧力をも伝える。"
 #Age 6 - Age of Revolutions
 judaism_mussar_movement: "ムーサール運動"
 judaism_mussar_movement_desc: "#italicムサール#!という倫理的・霊的運動は内面へと向かい、外面的な実践に代えて、意図的な自己修養、人格の陶冶、瞑想的な倫理的鍛錬を、近代化の圧力が伝統的信仰実践を蝕むことへの応答として据える。"
 judaism_modern_orthodoxy: "近代正統派"
 judaism_modern_orthodoxy_desc: "正統派の信仰実践は、世俗教育・市民参加・ブルジョワ的生活と折り合いをつけ、厳格な儀礼遵守を保ちながらも、近代性に抗うのではなく近代性の内側で宗教法の原則を形づくっていく。"
 judaism_positive_historical_movement: "実証史的運動"
 judaism_positive_historical_movement_desc: "実証主義的歴史学派の宗教的立場は、ハラハー法を歴史的条件に規定されたものとしながらも、なお永続的な権威を持つものとして扱い、宗教的典拠に対する学術的・歴史的分析を受け入れつつ、それらの法的拘束力を保持する。"
 #Miaphysitism
 #Age 1 - Age of Traditions
 beyond_the_borders: "国境を超えて"
 beyond_the_borders_desc: "$christian$の起源は、間違いなくローマ帝国の発祥地にあり、多くの分派はそのなかに留まることに満足している。しかし$miaphysite$は、カルケドン派からの糾弾を受け、帝国の辺境に身を置いている。そして国境を超え、遠い国々にも神の光をもたらしている。"
 monophysite_vs_miaphysite: "単性論派と$miaphysite_ADJ$"
 monophysite_vs_miaphysite_desc: "$miaphysite$もキリストは単一の性のみをもつと主張しているが、キリストの人間性が神性に吸収されたと主張するエウテュケスの単性説の見解とは本質的に異なっている。我々を単性説の信奉者呼ばわりする者もいるだろうが、それは言葉の一致に過ぎず、実際には我々の見解は明らかに異なっている。"
 original_christianity: "正統な$christian$"
 original_christianity_desc: "$christian_ADJ$世界ではこれまで多くの分裂や分派が生じたが、我々の信条は、第一ニカイア公会議以来形成されてきた、正統かつ真の$christian$に根ざしている。それ以降は、異端者だけが本流から分かれていった。"
 rejection_of_chalcedon: "カルケドン公会議を拒絶"
 rejection_of_chalcedon_desc: "カルケドン派は$second_council_of_ephesus$を認めず、レオ1世教皇の要請によりカルケドン公会議が招集された。レオ1世は$second_council_of_ephesus$を無効とすることを求めた。我々はこの偽りの公会議を拒絶し、本来の公会議で下された決定を支持する。"
 second_council_of_ephesus: "エフェソス強盗会議"
 second_council_of_ephesus_desc: "$second_council_of_ephesus$は、449年に$alexandria$の教皇ディオスクルスによって招集された。$catholic_ADJ$教会や$orthodox_ADJ$から非難を浴びたものの、正当な$christian_ADJ$公会議だった。この会議では、キリストは人間と神の両方の性質を備えた単一の性をもつという、アレクサンドリアの聖キュリロスの教義が受け入れられた。"
 #Age 2 - Age of Renaissance
 acceptance_of_old_testament: "旧約聖書の容認"
 acceptance_of_old_testament_desc: "$christian_ADJ$の一部の宗派は、イエスの到来が旧約聖書に完全に取って代わったとして、旧約聖書の重要性を低下させることを決定した。しかし我々は、旧約聖書はいまでも重要であり、そこに記された教えには依然有効なものがあると考えている。"
 independent_leaders: "独立した指導者たち"
 independent_leaders_desc: "$miaphysite$は孤立しているため、ほかの総主教区と連絡を取ることが困難なときもある。そのため我々の指導者たちは、独自の方法でほかの$christian$とのつながりをできるだけ保つと同時に、自立的に行動する術を身につけてきた。"
 isolated_reaches: "孤立した辺境"
 isolated_reaches_desc: "$miaphysite$は遠く離れた地にも広まっている。敵や異教徒に囲まれながらも、我々の信仰は揺らぐことがない。"
 jerusalem_focus: "$jerusalem$重視"
 jerusalem_focus_desc: "我々の心には、いつでも聖なる都市$jerusalem$がある。$jerusalem$はイエスが教えを説き、十字架にかけられた地であるだけでなく、再臨の地でもあるからだ。そのため我々は、どこにいても$jerusalem$に向かって祈りを捧げる。"
 #Age 3 - Age of Discovery
 double_patriarchate: "2つの総主教区"
 double_patriarchate_desc: "$alexandria$と$antioch$は、自分たちには$miaphysite$と$orthodox$の2つの総主区があると主張している。彼らは自分たちの系統の正当性を主張するかもしれないが、真の総主教区を維持しているのは$miaphysite$だけである。"
 preserving_of_local_languages: "地域言語の保護"
 preserving_of_local_languages_desc: "$greek_language$と$latin_language$は$christian$初期には重要な言語だったが、$miaphysite$はその儀式を$coptic_language$、$aramaic_language$、$armenian_language$といった地域言語で保持してきた。それらはどれも古く伝統ある言語であり、$miaphysite_ADJ$の分派はそれぞれに自分たちの歴史的な言語を保護している。"
 primacy_of_alexandria: "最高位たる$alexandria$"
 primacy_of_alexandria_desc: "$miaphysite$には多くの分派や独立した指導者が存在するが、我々は$alexandria$とその主教座を我々の宗教的指導者とみなしている。これは、そこに置かれた使徒座への敬意の現れや、それを称える方法であって、その地に特権を与えるものではない。"
 school_of_alexandria: "$alexandria$教校"
 school_of_alexandria_desc: "教理を問答によって教える$school_of_alexandria$は世界最古の公教要理学校であり、聖ヒエロニムスによれば使徒マルコ自身によって創設されたという。この学校では、$christian$初期から聖書学や神学の研究がおこなわれてきた。$rome$教皇が$alexandria$総主教よりも上位にあるとの宣言がなされた際に学校は廃止されたが、その伝統はいまも続いている。"
 #Age 4 - Age of Reformation
 eastern_christianity: "東方$christian$"
 eastern_christianity_desc: "我々はいわゆる$eastern_christianity$に属している。この分派は、さまざまな神学的伝統や典礼的伝統を持つ多くの異なる宗派を統合したものだが、多くの共通した文化的側面をもっている。"
 gradual_departure: "段階的な離脱"
 gradual_departure_desc: "彼らは我々をすぐに異端とみなしたが、$miaphysite$は$christian_ADJ$世界とのつながりを即座に断ち切ったわけではない。我々はほかの総主教区とのつながりを保ち、公会議にも出席していた。しかし、$miaphysite$は彼らの異端的な教義とは異なるものであることが、次第に明らかになったのだ。"
 life_among_infidels: "異教徒のなかでの生活"
 life_among_infidels_desc: "我々の信仰の地は、しばしば異教徒の存在によって穢されてきた。しかし、伝道者たちは未知の地へ勇敢に足を踏み入れ、遠き地をイエスの光で照らしてきた。つまり我々は、たとえ異教徒たちに信仰の誤りを気づかせることはできなくとも、想像以上に多様なかたちで彼らに影響を及ぼしているのだ。"
 #Age 5 - Age of Absolutism
 defense_against_heretics: "異端者に対する防衛"
 defense_against_heretics_desc: "我々が異端者たちから分裂して以来、彼らは幾度となく我々のもとを訪れては非難し糾弾してきた。彼らは自らを$christian_ADJ$と呼ぶが、その見解は明らかに異端に惑わされたものであり、我々の教えこそ、神の光に照らされた曇りのない教えである。"
 further_reaches: "さらに遠くの地へ"
 further_reaches_desc: "我らが信仰はしばしば異教徒に取り囲まれてきたが、それでもなお、遠く離れた地にまで広がり、さまざまな民族や文化に浸透した。"
 preserver_of_national_identity: "民族的アイデンティティの守護者"
 preserver_of_national_identity_desc: "まさに弾圧と迫害を受けてきたからこそ、我々の教会はアイデンティティの守護者を名乗ることができる。教会のなかでこそ、我々の言語や伝統は最も大切に守られ、我々の信仰は揺らぐことがない。"
 remote_patriarchates: "遠く離れた総主教区"
 remote_patriarchates_desc: "わが民が征服され迫害された結果、総主教座は幾度となく異教徒の手に落ち、その支配下に置かれてきた。そのため、総主教座を移転せざるを得なかったが、たとえ遠く離れた場所から運営されていたとしても、もとの総主教座はいまなお維持され、崇められている。"
 thrive_under_persecution: "迫害下での繁栄"
 thrive_under_persecution_desc: "我々の信徒は、何世紀にもわたり異端者や異教徒たちから迫害されてきたが、我々の信仰は耐え抜いてきた。彼らに何度打ち倒されようとも、我々は再び立ち上がる。"
 #Age 6 - Age of Revolutions
 cradle_of_monasticism: "修道制の発祥地"
 cradle_of_monasticism_desc: "$christian$における修道生活の伝統は$egypt_region$で生まれた。当時、この地の$christian_ADJ$信者たちは砂漠に赴き、神に祈りと人生を捧げていた。$miaphysite$はアレクサンドリアの伝統を通じ、この地を自分たちのものとして主張できる。"
 internal_communion: "内輪での親交"
 internal_communion_desc: "独立した総主教を擁するにもかかわらず、$miaphysite$の各分派は互いに交流がある。そのため互いに親密な関係を保つことができ、教会の一体性も守られている。"
 unique_architecture: "独特の建築様式"
 unique_architecture_desc: "我々の総主教区は比較的孤立しているため、聖地では独自の建築様式が発展した。ほかの$christian_ADJ$宗派のほうが著名かもしれないが、我々の独特な建築様式もまた、同じように信者の心を掴むことができる。"
 #Orthodoxy
 #Age 1 - Age of Traditions
 anagignoskomena: "アナギグノスコメナ"
 anagignoskomena_desc: "我々の聖書には、一部重要性の低い書物も存在するものの、基本的にはすべてが崇敬と研究に値する。$anagignoskomena$と呼ばれる書物などは、$hebrew_language$で記された聖書には収録されていないため重要性では劣るが、それでも読む価値があり、決して無視されるべきではない。"
 filioque_issue: "フィリオクェ問題"
 filioque_issue_desc: "西方の異端者たちによる#italic フィリオクェ#!条項の不正な追加は、適切な公会議を開かずにおこなわれたものであり、違法である。我々のみが正しき祈りの文言を守っており、異端者たちはその罪で永遠に地獄行きを免れない。"
 imperial_creed: "帝国の教義"
 imperial_creed_desc: "ローマ帝国は$christian$を採用して以来、つねに$orthodox$を公式の信仰としてきた。西方の異端者たちと、彼らの偽りの“皇帝”たちは、我々の正統性を否定することはできない。"
 septuagint: "七十人訳聖書"
 septuagint_desc: "我々の旧約聖書は$greek_language$で記されており、$septuagint$として知られる。これは紀元前3世紀に、72人の訳者によって$hebrew_language$から訳されたが、彼らは独立して作業しながら一言一句たがわぬ訳文を生み出した。ゆえに、これは明らかに神の啓示によるものであり、神の言葉そのものなのである。"
 the_pentarchy: "五総主教制"
 the_pentarchy_desc: "皇帝ユスティニアヌスによって定められた教会の旧体制は、$orthodox$ではいまなお完全に機能している。$rome$総主教は自らを$catholic$の最高位と考えているが、真の教会においては、$constantinople$、$alexandria$、$antioch$、$jerusalem$の各都市が依然として重要な地位を占めている。"
 #Age 2 - Age of Renaissance
 church_councils: "公会議"
 church_councils_desc: "教会が内部で分裂していてはならない。よって、一人の司教では解決できない重大な問題は、公会議の招集を要し、そこで司教たちは教会全体の意志を探ることになる。そのため、公会議の決定は教会全体の総意を反映するものとなる。"
 church_guidance: "教会による導き"
 church_guidance_desc: "聖書は神の言葉だが、その正しい意味を解釈し、信徒たちへ伝えられるのは教会だけである。教会の導きから外れて聖書を読み、独自に解釈することは、偽りの世界へと迷い込み、異端の道を歩むことにつながるだけだ。"
 greek_rite: "$greek_culture$の典礼"
 greek_rite_desc: "我々の典礼と、教会法に基づく慣習は、何世紀にもわたり$constantinople$の$greek_culture$の儀式に従って明確に定義されてきた。地域によって多少の差異はあるが、$orthodox$全体で典礼の均一性が保たれている。"
 religious_icon_power_advance: "宗教聖像"
 religious_icon_power_advance_desc: "聖像は我々の信仰心を物理的に表現したもので、それを見た者に畏敬の念と信仰心を起こさせるため、聖なる人物を象って作られる。"
 unchanging_tradition: "不変の伝統"
 unchanging_tradition_desc: "イエス・キリストと使徒から我々が受け継いだ伝統は、改変、追加、削除されることなく一貫している。これは信仰そのものが不変であり、万人があらゆる場所で実践しているからである。"
 #Age 3 - Age of Discovery
 heavenly_architecture: "天上の建築様式"
 heavenly_architecture_desc: "$orthodox_ADJ$の宗教施設は、つねに天国を模して設計されている。バシリカ様式に基づく西方の建築よりも中央集約的に造られ、屋根として機能する中央のドームは天国を象徴している。どこも内部は聖像やイコンで覆われており、その美しさは見る者を魅了する。"
 iconostasis: "イコノスタシス"
 iconostasis_desc: "$orthodox_ADJ$における重要な特徴のひとつは、聖堂本体と祭壇を隔てる聖像の壁、$iconostasis$（聖障）である。そこ飾られる聖像は、崇拝者と至聖所のつながり、つまり天国と人々のつながりを視覚化し、人々を天国へと導く役割を果たす。"
 physical_body_of_christ: "キリストの体現"
 physical_body_of_christ_desc: "我々の教会は、キリストの体が物理的に地上に現れたものであり、神の国のキリストとなんら違いはない。したがって教会は、人々のために遣わされた主なる救い主を体現する存在なのである。"
 sight_veneration: "視覚崇敬"
 sight_veneration_desc: "崇拝の最も重要な点は、信徒が自らの感覚を通じて想起することである。我々の教会がつねに鮮やかな聖像や色彩で飾られているのはこのためであり、誰もが即座に地上におけるキリストの存在を感じることができる。"
 theotokos: "神の母"
 theotokos_desc: "聖母マリアは我々にとって重要な存在であり、キリストの姿をとった「新しき契約」を自らの内に宿すことで、「古き契約」を成就させた。キリストは受肉した神であるため、彼女は文字どおり「神の母」となり、ほかのどの聖人よりも高い地位にある。"
 #Age 4 - Age of Reformation
 julian_calendar: "ユリウス暦"
 julian_calendar_desc: "何世紀にもわたり、わが国と教会の時間は$julian_calendar$に基づいている。これは紀元前46年にユリウス・カエサルが制定した暦で、東方のすべての$christian_ADJ$国家を統一するだけでなく、重要な祝祭日を開催する時期を定める基準ともなっている。"
 national_rites: "国別典礼"
 national_rites_desc: "我々の教会は各国に独立総主教区を置いているため、国ごとに一定の典礼の違いが認められている。しかし、その教えは統一されており、教会全体の一体性が損なわれることはない。"
 oktoechos: "オクトエーコス"
 oktoechos_desc: "$oktoechos$は、8つの「旋法」からなる音楽の記譜体系であり、何世紀にもわたり教会の聖歌や宗教音楽の記譜に用いられてきた。これは$orthodox_ADJ$の聖歌の基礎となっているが、文化ごとに若干の違いがある。"
 paschal_cycle: "復活祭周期"
 paschal_cycle_desc: "$orthodox$には、#italic 復活祭#!（イースター）を起点日とする移動祝祭日があり、これらは$paschal_cycle$に従って定められている。復活祭の10週間前は「トリオディオン（三歌斎経）」と呼ばれ、復活祭後の50日間は「ペンテコスタリオン（五旬経）」と呼ばれる。この周期は、教会暦で最も重要な祝祭日を示すものである。"
 prestigious_monasticism: "格式高い修道主義"
 prestigious_monasticism_desc: "$orthodox$では修道生活と禁欲主義が重んじられており、ほぼ必須とされている。すべての主教はまず修道士でなければならず、そうでない場合は叙聖前に修道士となる必要がある。このため、修道院や修道主義の中心地は、聖職者の生活に大きな影響を与えている。"
 #Age 5 - Age of Absolutism
 christianization_of_the_slavs: "スラヴ人のキリスト教化"
 christianization_of_the_slavs_desc: "キエフ・ルーシの民は、東方$slavic_group$人のなかでいち早くキリストの光を受け入れ、$orthodox$に改宗した民だった。彼らの改宗を契機に、この信仰は東方の民へと広く普及していったのである。"
 cyril_and_methodius: "キリルとメトディウス"
 cyril_and_methodius_desc: "ともに9世紀の$BYZ_ADJ$の神学者だった彼らは、スラヴ人への福音伝道に大きく貢献した。彼らは、$church_slavonic_language$を表記するために最初に用いられたグラゴル文字を開発したとされ、のちに弟子たちはこれを発展させると、キリルに敬意を表してキリル文字と名づけた。"
 heirs_of_rome: "ローマの後継者"
 heirs_of_rome_desc: "ローマやローマ帝国の後継者を名乗る者は、数多く存在する。しかし、かの古き帝国の真の信仰を受け継ぐのは我々だけであり、正統な継承者を名乗ることができるのは我々以外にいない。"
 interaction_between_church_and_state: "教会と国家の相互作用"
 interaction_between_church_and_state_desc: "総主教庁は、それぞれの総主教区とその民に対して絶対的な権限をもつ。この権限を統治者の権威と結びつけることで、教会の資源を活用し、国家の権威を強化することができる。"
 legacy_of_saint_andrew: "聖アンデレの遺産"
 legacy_of_saint_andrew_desc: "伝説によれば、聖アンデレはスキタイと$black_sea_area$の北岸を訪れ、のちに$kyiv$となる地に到達したとき、$christian$の大いなる発展を予言した。"
 #Age 6 - Age of Revolutions
 eastern_ecumenism: "東方エキュメニズム"
 eastern_ecumenism_desc: "信仰に通じていない者は東方$orthodox$を、非カルケドン派正教会の$christian_ADJ$宗派とよく混同する。彼らは多くの重要な点で異なるものの、同じ$christian_ADJ$であり、共通点を活かせば正しき信仰へと立ち返らせることができる。"
 justified_holy_wars: "正当なる聖戦"
 justified_holy_wars_desc: "我々の歩むべき道を決めるのは、異教徒や異端者ではない。地上に真の神の国を誕生させるため、穢れた彼らを一掃することが我々の聖なる使命である。"
 outwards_expansion: "外国への拡大"
 outwards_expansion_desc: "異教徒や不信心者たちにキリストの光をもたらすことは、教会の神聖な義務である。ゆえに、我々は国境を越えて彼らの魂に救いをもたらさなければならない。"
 resistance_to_the_infidels: "異教徒に対する抵抗"
 resistance_to_the_infidels_desc: "$orthodox_ADJ$の我々の同胞は、ときに異教徒の支配下に置かれることもあった。しかし、我々はそのような抑圧に耐える術を学び、さらには異教徒たちとともに生きることも学んだ。"
 structured_patriarchates: "体系的な総主教庁"
 structured_patriarchates_desc: "我々の総主教庁はつねに適切に組織化され、構造化されており、それぞれが固有の権限と管轄をもっている。これにより教会全体が円滑に機能し、結果として国家の安定にもつながる。"
 #Protestantism
 #Age 4 - Age of Reformation
 confessio_augustana: "新たな信仰告白"
 confessio_augustana_desc: "宗教改革は、国民のために新たな教義を定義する機会をもたらし、何よりも教義に対する批判を受け入れ、改変する機会をもたらした。"
 devotionalism: "献身主義"
 devotionalism_desc: "我々はアウグスティヌス神学を復興すべきであり、信者の感情と熱意に基づいて我々の信仰を築く必要がある。"
 protect_the_new_faith: "信仰の盾"
 protect_the_new_faith_desc: "我々の信仰はあらゆる面で敵に包囲されている。抑圧的なローマ・カトリック教徒どもから、信仰の権利を守り抜かなければ。"
 protestant_administration_tax: "有能な徴税人"
 protestant_administration_tax_desc: "かつては聖職者が適切な徴税の一端を担っていた。こうした構造の一部は宗教革命の余波により解体されたが、有能な人材は依然として存在しており、すぐさま我々に貢献してくれることだろう。"
 protestant_invite_persecuted: "弾圧される者の保護"
 protestant_invite_persecuted_desc: "我々が真の信仰に導かれる一方で、多くの同志たちが道を誤った者による圧政に苦しんでいる。彼らが弾圧を逃れて生活でき、何よりも我々の国庫に貢献できるよう、彼らをわが国に招いて定住させるべきである。"
 #Age 5 - Age of Absolutism
 expulsion_of_heretics: "異端者の追放"
 expulsion_of_heretics_desc: "国内の厄介な異端者どもは、統治者に対する反乱の中心となりうる。彼らを国外の植民地へ追放してしまえば、問題を起こしにくくなるだろう。"
 involved_laity: "信徒の関与"
 involved_laity_desc: "信者たちが教会の日常的な運営に関与することが多くなるにつれ、彼らは信仰との個人的なつながりを見出すようになった。"
 protestant_cuius_regio_eius_religio: "$catholic_cuius_regio_eius_religio$"
 protestant_cuius_regio_eius_religio_desc: "$catholic_cuius_regio_eius_religio_desc$"
 protestant_painters: "プロテスタント美術"
 protestant_painters_desc: "宗教改革により多くの芸術家が、神の栄光を主題としない新たな風景を描くようになった。こうした芸術家を雇うことは、芸術の偉大な後援者としての我々の評判を高めるだろう。"
 repurposed_monasteries: "修道院の転用"
 repurposed_monasteries_desc: "わが国が改宗した際、国家が接収した聖職者用地は、今後生産や行政の新たな拠点として使うことができる。"
 #Age 6 - Age of Revolutions
 embrace_romanticism: "ロマン主義の受容"
 embrace_romanticism_desc: "啓蒙時代の波にさらされても、我々はロマン主義の魅力を忘れてはならない。わが国のロマン主義の芸術家は、必ずや素晴らしい芸術作品を多数制作してくれるだろう。"
 protestant_innovation: "プロテスタントの革新"
 protestant_innovation_desc: "我々は、信仰の起源をはじめとする確立された教義や信念に疑問を投げかけることが、いかに価値ある姿勢かを学んだ。同様の学びを、ほかの研究分野にも応用できるはずだ。"
 protestant_sunday_schools: "$sunday_schools_advance$"
 protestant_sunday_schools_desc: "$sunday_schools_advance_desc$"
 protestant_work_ethic: "勤勉な労働者"
 protestant_work_ethic_desc: "清教徒や敬虔主義の説教者が宗教革命に与えた影響は明らかだ。勤勉や倹約といった美徳を重視する彼らの姿勢は、優れた労働力の育成に貢献してくれるだろう。"
 wary_of_heretic_preachers: "異端者に対する防衛"
 wary_of_heretic_preachers_desc: "国民たちを新たな信仰や、かつての信仰に改宗させようと目論む勢力に警戒しなければ。こうした説教者たちを悪意のある敵とみなすことによって、我々は国民に備えさせ、宗教的正統派の確立を支援できるようになる。"
 #Shinto
 #Age 1 - Age of Traditions
 heian_kyo: "平安京"
 heian_kyo_desc: "平安京は何世紀ものあいだ、天皇の住まいであり、芸術と文化の中心地だった。そこでは、時の権力者であった藤原氏の豪勢な宮廷が栄え、日本中の人々が畏敬の念を抱いていた。我々はその伝統を受け継ぎ、支援し、再び我らが首都の文化を栄えさせなければならない。"
 matsuri: "祭り"
 matsuri_desc: "地域の神社や寺には、それぞれ独自の祭りや祝い事があり、地域の住民は皆、いつでも参加を楽しみにしている。祭りはその地域を守る神に、祈りや感謝の気持ちを捧げる機会だからだ。"
 onmyodo: "陰陽道"
 onmyodo_desc: "陰と陽の思想は、何世紀も前に$china$から伝わったものであり、$japan_region$で$onmyodo$として発展した。陰陽道の専門家である陰陽師は、悪霊や怨霊の浄化や退治のほか、占い、占星術、自然研究なども職務とする。"
 sumo: "相撲"
 sumo_desc: "$sumo$は豊穣を祈願するための儀式的な踊りから始まり、宮廷や神社を超えて広まった。いまでは、庶民もおこなう人気の高い慣わしであり、武術訓練にも取り入れられている。"
 #Age 2 - Age of Renaissance
 honji_suijaku: "本地垂迹説"
 honji_suijaku_desc: "$shinbutsu_shuugou$の主軸となる概念のひとつは、神々は仏がさまざまな姿で現れたものであり、仏は神々が別の姿で現れたものとする考えである。つまり、神も仏も最終的には同じものであり、本来の姿である#italic 本地#!（ほんじ）が多様な姿、つまり#italic 垂迹#!（すいじゃく）として現れるのである。"
 nanto_rokushuu: "南都六宗"
 nanto_rokushuu_desc: "$nara$の寺院は、$buddhist$が$china$から伝わって以来大きな影響力を誇っている。これらの寺院から生まれた6つの宗派は、知識の宝庫である。仏陀の教えや悟りを開く方法についての知識だけでなく、僧院の適切な運営方法など、世俗的な事柄に関する知識も保有している。"
 shinbutsu_shuugou: "神仏習合"
 shinbutsu_shuugou_desc: "$buddhist$が日本に伝来して以来、その教えは地域の神々の信仰と混ざりあってきた。仏教と神道は、明確に異なる慣わしをもちながらも、ひとつの信仰体系へと融合されていった。"
 #Age 3 - Age of Discovery
 bodaiji: "菩提寺"
 bodaiji_desc: "わが国には、古来より先祖を崇める習慣がある。そのため、力のある統治者は寺を建立し、自らが死後にその寺に埋葬され、崇められるようにした。自らの生涯や功績が後世まで伝わり、記憶されるようにするためである。"
 gozan_jissetsu: "五山十刹"
 gozan_jissetsu_desc: "「五山制」は中国から伝わった、国家の保護下にある禅宗僧院の伝統的な制度である。僧院が聖なる山の頂上にあったことからこの名がついた。$japan_region$では、鎌倉時代にこの制度が続き、$kyoto$五山と$kamakura$五山の禅寺が保護下に置かれた。寺院を支援し、利用することで、わが国の統治の安定化を図ることができる。"
 hachiman_worship: "八幡信仰"
 hachiman_worship_desc: "八幡神は最も崇められている神のひとつである。本来は応神天皇を神として祀ったものだが、$buddhist$伝来後は菩薩と同一視されるようになった。八幡神は皇統の守護者であり、武家の守護神でもある。"
 #Age 4 - Age of Reformation
 kagura: "神楽"
 kagura_desc: "$kagura$はもともと、神に仕える未婚女性である#italic 巫女#!が宮中で舞った、神聖な儀式の舞である。$kagura$は、$japan_region$の各地の民衆の儀式的な踊りにも影響を与えた。こうした踊りは多様な形態に進化したが、どの踊りにも起源となった伝統や儀式が残っている。"
 neo_confucianism: "宋明理学"
 neo_confucianism_desc: "千年にわたる$SECT_CONFUCIANISM_NAME$の歴史の後期に発展した宋明理学は、すでに何世紀にもわたり$japan_region$に存在している。しかし、国家がその支援を強化すれば、幕府は国家を確実に支配できるだろう。"
 obon: "お盆"
 obon_desc: "最も重要な行事のひとつである$obon$は、死者や先祖を敬う期間である。この期間中は食べ物が供えられ、儀式的な踊りが捧げられる。また、$obon$のあいだ故郷に帰る死者の魂が、再び死者の国に戻れるよう、灯りや提灯が灯される。"
 #Age 5 - Age of Absolutism
 danka_system: "檀家制度"
 danka_system_desc: "何世紀にもわたり、$japan_region$の各家庭は地域の$buddhist_ADJ$寺と密接な関係にある。経済的な支援と引き換えに、彼らは寺から宗教面の支援を受けてきた。この制度をすべての民衆に浸透させることで、民衆の信仰を維持できるだろう。"
 harae: "祓"
 harae_desc: "わが国の信仰において、#italic $harae$#!の儀式は#italic 罪#!や#italic 穢れ#!を取り除くうえで重要な役割を果たしている。わが民に$harae$の儀式を適切かつ頻繁におこなわせれば、国全体を清浄に保つことができる。"
 jisha_bugyou: "寺社奉行"
 jisha_bugyou_desc: "$jisha_bugyou$とは、すべての寺社を管理・監督する役職であり、寺社のあらゆる活動を監督して、彼らの利害が幕府の利害と一致するように徹底する。"
 #Age 6 - Age of Revolutions
 fukko_shinto: "復古神道"
 fukko_shinto_desc: "民衆は、我々の文化における外国の影響と同様に、$buddhist_ADJ$と$SECT_CONFUCIANISM_NAME$の信仰が混ざることも拒絶している。これはつまり、$shinto$を復興する必要があるということである。"
 home_shrines: "神棚"
 home_shrines_desc: "祭礼や儀式の実施は、伝統的に神社や寺に委ねられてきた。しかし、神を祀る「神棚」と、先祖を祀る$buddhist_ADJ$由来の「仏壇」の両方を自宅に置く民衆が増えてきている。"
 kokugaku: "国学"
 kokugaku_desc: "$japan_region$が国家として成立して以来、$japan_region$と$shinto$は$china$や$buddhist$がもたらす外国の思想の影響を受けてきた。しかし、新たな思想が根づきつつある。わが国の精神は本来純粋であり、外国の影響はすべて排除すべきであるという考え方である。"
 #Unique Advances
 #Balkans Region Advances
 #Albanian Shared
 albanian_the_kanun: "カヌン"
 albanian_the_kanun_desc: "中央に君臨する王が不在のあいだ、我々の社会秩序は高度な慣習法体系であるカヌンによって維持されている。この法的枠組みは、財産権からベサ（神聖な誓約）に至るまで、あらゆるものを規定している。カヌンは、他国の統治者が決して完全に解体することのできない、安定と名誉の基盤を提供している。"
 albanian_prokletije: "ビェシュケト・エ・ナムナ"
 albanian_prokletije_desc: "わが国の中央にそびえる「呪われた山々」は、カヌンそのものと同じくわが民の一部である。最も貧しい村人でさえ、冬にどの峠が通れるか、どの尾根が待ち伏せからの避難所になるか、どの谷が行き止まりかを知っている。これらの山々に進軍した侵略者は、我々の戦士と遭遇するよりもはるか前に、地形という迷宮に閉じ込められることになる。"
 albanian_the_stradioti_tradition: "ストラディオットの伝統"
 albanian_the_stradioti_tradition_desc: "山岳地帯の貧しさは、わが国の男たちをキリスト教圏随一の軽騎兵、ストラディオットへと鍛え上げた。彼らは小競り合いや偵察における比類なき技量により、ヴェネツィアからフランスに至るまでのあらゆる大国から求められている。武力を他国に提供することで、我々は山岳地帯に富を持ち帰りつつ、兵士たちに経験を積ませ、ヨーロッパ屈指の熟練兵を養成することができる。"
 albanian_the_sacred_oath: "神聖な誓約"
 albanian_the_sacred_oath_desc: "ベサの概念は、信頼と歓待の国民的制度へと発展した。アルバニア人の言葉は絆そのものであり、この揺るぎない忠誠心への評判が、我々を地中海で厚く信頼される護衛や傭兵たらしめている。同盟関係が目まぐるしく変わる世界において、我々の言葉こそが最も価値のある通貨である。"
 albanian_the_transhumance_networks: "移牧網"
 albanian_the_transhumance_networks_desc: "家畜の季節移動（移牧）により、我が民は夏の高地牧草地と冬の温暖な沿岸平野の両方を活用できる。この移動的な生活様式のおかげで、我が民の所在を把握することは難しく、焦土作戦によっても容易には失われない強靭な食料供給が確保される。我らの富は四本の脚で歩き、常により安全な地へと移動する準備ができている。"
 albanian_the_fortified_kulla_houses: "要塞化されたクラ"
 albanian_the_fortified_kulla_houses_desc: "各地の農村では、貴族や富裕な農民たちが#italicクッラ#!と呼ばれる要塞化された石造りの塔屋を築いてきた。これらの建造物は小規模な城砦として機能し、血の復讐や敵の襲撃から家族を守る。これはまさに、恒常的に防衛態勢を敷いた社会のあり方を体現するものである。"
 albanian_the_albanian_alphabet_commission: "アルバニア語アルファベット委員会"
 albanian_the_albanian_alphabet_commission_desc: "学者や愛国者たちは、統一されたラテン文字を用いてアルバニア語を標準化すべく、たゆまぬ努力を続けている。国立学校を設立し、現地語で新聞を印刷することで、外国語による文化的覇権を打ち破りつつある。アルバニア語の識字能力は、真の独立に向けた第一歩である。"
 #Albanian Unique
 alb_the_arberian_principality: "アルベリア公国"
 alb_the_arberian_principality_desc: "敵の力が衰えゆく中、我らの名門諸家は国家存続のために結束した。カトリックの西方と正教の東方の狭間という立場を最大限に活かし、我らは海上外交と沿岸交易の達人となった。この戦略的自立性により、我らは隣国間の対立を自らの利益へと転じることができる。"
 alb_angevin_legitimacy: "アンジュー家の正統性"
 alb_angevin_legitimacy_desc: "我々の直近の君主たちは、カペー家直系のアンジュー家の血統を継いでいる。アンジュー家はナポリ王カルロ1世がビザンツ中枢への足がかりとして創始したもので、このつながりのおかげで我々は、分断されたバルカンの領主たちのなかで独自の西方的威信を獲得し、ヨーロッパの偉大なるカトリック君主たちと同じ席に着く資格を得ることができた。百合の紋章とその名誉を守り抜くことで、我々は単なる部族長たちの支配とは一線を画す主権を確立している。"
 ant_born_in_the_highlands: "高地の生まれ"
 ant_born_in_the_highlands_desc: "我々の先祖代々の故郷である高地は、切り立った峰々や狭い渓谷からなる天然の要塞であり、通常の軍隊が侵入することはほぼ不可能である。我々はさらに、あらゆる戦略的な峠や山頂を要塞化しており、侵略者がわが領土をわずかでも占領しようとすれば、莫大な血の代償を払わなければならない。"
 mtr_the_masters_of_the_karavasta: "カラヴァスタの主たち"
 mtr_the_masters_of_the_karavasta_desc: "我々の領土は迷宮のようなカラヴァスタ潟によって守られており、わが国の民はここの干潟や隠れた水路を熟知し、自在に航行することが可能である。この水に囲まれた地は、重装備の他国軍が地図を作ったり征服したりすることがほぼ不可能な天然の要塞として機能し、いかなる騎兵の突撃も届かない聖域となっている。"
 mzk_the_agricultural_wealth_of_the_devoll: "デヴォルの農業による富"
 mzk_the_agricultural_wealth_of_the_devoll_desc: "我が心臓部の肥沃な谷間は、高度な灌漑によって豪奢な宮廷と精強な騎兵隊の資金を支えている。デヴォルの実りは我らの政治的野心を養い、大規模な常備従士団の列を満たす。"
 thp_french_blood_claims: "フランス王家の血統主張"
 thp_french_blood_claims_desc: "我々は、議論の余地はあるものの、フランス王家の由緒ある血統を主張しており、これにより我々の外交官はヨーロッパの宮廷において独自の地位を確立している。この高貴とみなされる家系のおかげで、我々はイタリアの都市国家や教皇庁と対等に交渉でき、一般的なバルカンの軍閥には認められないような同盟関係を築くことができる。"
 alb_eastern_and_western_heritage: "東方と西方の遺産"
 alb_eastern_and_western_heritage_desc: "わが国の都市部は、ビザンツ法の洗練された原則と、西方の近代的な官僚制度のもとで運営されつづけている。この法的継続性は、契約、財産権、相続のための安定した枠組みを提供し、他国の商人や学者を我々の宮廷に惹きつけている。予測可能な法制度こそが、我々の行政力増大の基盤である。"
 alb_the_national_arsenal: "国立造船所"
 alb_the_national_arsenal_desc: "西方介入のための主要な港として、我々はドゥラスの造船所を近代化し、常備のガレー船隊を維持している。このインフラによりアドリア海全域への戦力投射が可能となり、ナポリとアルバニアを結ぶ航路は増援と交易のため開かれた状態に保たれる。港の支配権を握ることで、我々は西バルカン沿岸の紛れもない支配者となっている。"
 ant_the_iron_mines_of_the_interior: "内陸部の鉄鉱山"
 ant_the_iron_mines_of_the_interior_desc: "我々の支配下にあるアルバニア中部の険しい山々は、戦争の道具に不可欠な高品質の鉄鉱石が豊富である。国家が支援する製鉄所を設立し、氏族に優れた鋼の刃と装甲板を絶えず供給することで、拡大する軍隊の装備を確保するにあたって、他国からの輸入に依存することのない体制を確立した。"
 mtr_lagoon_fisheries: "潟湖の漁業"
 mtr_lagoon_fisheries_desc: "沿岸水域の豊かな生物資源は、地域的な飢饉に見舞われたときであっても、大規模な常備民兵を維持するための安定した食糧供給源となる。潟湖での漁獲を独占することで、我々は国民の健康と穀倉の充足を保証し、国家の存続を支えている。"
 mzk_the_despots_of_berat: "ベラトの専制君主"
 mzk_the_despots_of_berat_desc: "千の窓の街ベラトにある城を拠点として統治する我々は、アルバニアの都市文明の頂点であり、ビザンツ様式の行政の体現者である。わが国の宮廷は学者や職人を磁石のように惹きつけ、首都を東方の大都市に匹敵する文化の灯台へと変貌させている。"
 thp_the_lion_of_thopia: "トピアの獅子"
 thp_the_lion_of_thopia_desc: "我が家門は、諸氏族間の対立を巧みに利用することで抜きん出た地位に上り詰め、トピア家をアルバニア主権の調停者として位置づけるに至った。複雑な同盟網を織り成すことで、我らは東西双方から認められる初の真の#italicプリンケプス・アルバニアエ#!の称号を手にするだろう。沿岸の胸壁に我が紋章の獅子をはためかせながら、我らは競争者たちの原始的な封建制を凌駕する専門的な行政中枢を確立し、我が家門をアドリア海沿岸随一の勢力たらしめる。"
 alb_the_champion_of_christ: "キリストの闘士"
 alb_the_champion_of_christ_desc: "我々の共同体は信仰によって分断されているものの、わが国はキリストに献身しており、アトレータ・クリスティ（キリストの闘士）の称号を得ている。我々の揺るぎない信仰は教皇庁と総主教たちの目を引き、財政的支援と志願兵の確保につながっている。我々は単に土地のために戦うのではなく、「キリストの御言葉」そのものの存続のために戦っている。"
 alb_the_catholic_bulwark: "カトリックの防壁"
 alb_the_catholic_bulwark_desc: "ローマ教会の最東端の前哨として位置するこの地にあって、我らは正教分離派とトルコの異教徒双方に対する主たる盾となった。この神聖な使命は王国全土に内なる平安をもたらし、我らの戦いを魂のための十字軍へと変える。"
 ant_arianitis_defiance: "アリアニティの抵抗"
 ant_arianitis_defiance_desc: "我々の一族は指導者たちの英雄的な先例に倣い、敵に対して最初に立ち上がり、最後に降伏することで知られている。この不屈の抵抗の遺産により、わが民は闘争を負担ではなく神聖な義務とみなす戦士の国民へと鍛え上げられた。"
 mtr_marshland_guerillas: "湿地帯のゲリラ"
 mtr_marshland_guerillas_desc: "我々は召集兵を、重装甲が不利になる深い沼地へと敵部隊を誘い込むよう特別に訓練している。このような環境では、軽装で鎧を纏わない我々の軽歩兵が伏兵戦術を駆使して圧倒的な優位性を発揮し、大地そのものを武器へと変える。あらゆる地形に適応し、最悪の条件下でも迅速に移動する能力こそが、我々を危険な敵たらしめている。"
 mzk_the_muzaka_chronicle: "ムザカ年代記"
 mzk_the_muzaka_chronicle_desc: "わが一族は歴史と領有権に関する詳細かつ壮大な記録を厳格に保管し、古来からの主張が決して忘れ去られないようにしている。この文学的伝統は我々の高貴なビザンツの称号を存続させ、帝国の威厳と歴史の深さをもって地元の対立勢力を圧倒している。"
 thp_a_centralized_levy_system: "中央集権的な召集軍制度"
 thp_a_centralized_levy_system_desc: "我らは緩やかな氏族連合から脱し、中心都市を拠点とする半職業的な歩兵中核へと移行した。部族徴集兵が緩慢に集結する一方、我らの軍は脅威に対し迅速かつ整然と応じる。"
 alb_the_arbereshe_diaspora: "アルベルシュのディアスポラ"
 alb_the_arbereshe_diaspora_desc: "時を経て、わが民の多くが国外へ移住し、アルベルシュの共同体を形成した。これらの「海を渡ったアルバニア人」は、新しい土地で影響力を獲得しつつ、我々の言語と伝統を維持している。彼らは現地の恒久的な外交使節として活動し、故郷への支援をつねに働きかけている。"
 alb_diplomacy_of_the_two_shores: "両岸の外交"
 alb_diplomacy_of_the_two_shores_desc: "わが国の位置は、イタリアの都市国家と険しいバルカン内陸部をつなぐ重要な架け橋としての行動を可能にする。我々の外交官はヴェネツィア元老院と部族会議の両方で巧みに立ち回れるよう訓練されており、交易と戦争において我々の仲介は欠かせないものとなっている。"
 ant_patronage_of_the_faith: "信仰の庇護"
 ant_patronage_of_the_faith_desc: "修道院に多くの土地と資金を提供することで、我々は貴族と農民の精神的な忠誠心を維持している。これらの聖なる場所はわが公国の文化的中心地として機能し、我々の勝利が祝われる場所となっている。"
 mtr_the_trade_monopolies: "交易の独占"
 mtr_the_trade_monopolies_desc: "河口と海岸を支配し、内陸部からヴェネツィアのガレー船へと運ばれる木材と穀物の流れを管理する我々は、アドリア海貿易の不可欠な仲介者としての地位を確立しており、いかなる商人も我々の通行税を回避することはできない。"
 mzk_silk_road_waystations: "シルクロードの中継地"
 mzk_silk_road_waystations_desc: "わが領土は内陸部からの主要な交易路上に位置し、絹の隊商に課税することで、潤沢な国庫を維持している。この収入により我々は優れた書家やイコン画家を後援できるようになり、わが領土は南アルバニアの文化的首都へと変貌した。"
 thp_mecenas_of_the_arts: "芸術のメセナ"
 thp_mecenas_of_the_arts_desc: "我々はゴシック様式とビザンツ様式を融合させた壮麗な大聖堂や要塞の建設に資金を提供し、自らの富と信仰心を誇示してきた。この建築の輝きは、教会と国民の目に我々の統治を正当なものとして映らせ、都市を不変の象徴へと変貌させている。"
 alb_the_albanian_merchant_class: "アルバニアの商人階級"
 alb_the_albanian_merchant_class_desc: "沿岸の商人たちは、バルカンと西方を結ぶ貿易の主要な担い手となった。商業にはギリシャ語を、忠誠の表明にはアルバニア語を用いることで、彼らはヴェネツィアからコンスタンティノープルに至る市場を支配している。これらの海商は、近代化する我々の経済の生命線である。"
 alb_the_expansion_of_the_regnum: "王国の拡大"
 alb_the_expansion_of_the_regnum_desc: "古の王国の国境が最大版図、そしてそれ以上にまで回復されるまで、我らは休むことはない。バルカンの支配者としての地位を取り戻すのだ。この中央集権化の使命により、「正統なる」支配を回復する過程で、新たに征服した領土をほとんど抵抗なく統合することができる。"
 ant_the_eternal_resistance: "永遠の抵抗"
 ant_the_eternal_resistance_desc: "我々は、生きているかぎり反乱の灯を絶やさないという永遠の誓いを立てた。我らが軍は統治する一族への狂信的な忠誠心を叩き込まれており、圧倒的な帝国の兵力の前でも規律を保つことが保証されている。"
 mtr_reclamation_engineering: "干拓工学"
 mtr_reclamation_engineering_desc: "より肥沃な農地を創出するため、我々はミゼケ湿地の一部を干拓する作業に着手した。この工学的偉業は税基盤を拡大するだけでなく、かつては通行不能だった沼地を通る恒久的な街道の敷設を可能にする。"
 mzk_literary_patronage: "文学の後援"
 mzk_literary_patronage_desc: "我々は首都を文化の中心地へと変貌させ、後世のために東西の知識を継承している。この知的な威信により、我々の宮廷は正教世界とラテン世界の両方から最高の頭脳が集う場所となっている。"
 thp_princeps_albaniae: "プリンケプス・アルバニアエ"
 thp_princeps_albaniae_desc: "我々の名は国家そのものと同義となり、さまざまな民族を単一の旗のもとに統合することを可能にしている。出自を問わず優れた個人を登用することで、封建的な対立国を凌駕する実力主義の官僚制度を築き上げた。"
 alb_the_spirit_of_the_rilindja: "リリンドジャの精神"
 alb_the_spirit_of_the_rilindja_desc: "我々の「国家の再生」、すなわちリリンドジャは、北部山岳地帯からイタリアやエジプトのディアスポラに至るアルバニア人の心に火を灯した。この文化的・政治的運動は、すべてのアルバニア人を「アルバニア主義」という共通の旗のもとに団結させたのである。我々は生まれ変わった国家であり、ヨーロッパの主権国家の一員となる準備ができている。"
 alb_enlightened_albanian_absolutism: "啓蒙的なアルバニア絶対主義"
 alb_enlightened_albanian_absolutism_desc: "ヨーロッパの潮流に従い、我らが君主は権力を中央に集中させ、近代国家のために旧来の氏族から封建的特権を剥奪した。この措置により、普遍的な課税制度と国家的な司法制度の導入が可能となり、王国は合理化された戦争機械へと変貌を遂げた。"
 ant_the_professional_highland_grenadiers: "職業高地擲弾兵"
 ant_the_professional_highland_grenadiers_desc: "我々は伝統的な散兵を、重攻撃と包囲戦に特化した精鋭の精鋭の高地擲弾兵部隊へと発展させた。この部隊は、先祖伝来の山岳地帯での機敏さと近代的な爆薬による壊滅的な火力を兼ね備えており、いかなる要塞守備隊にとっても恐怖の対象となっている。"
 mtr_the_mataranga_port_authority: "マタランガ港湾局"
 mtr_the_mataranga_port_authority_desc: "我らはすべての沿岸港湾を単一の行政権の下に統一し、関税と通行料の徴収を効率化した。この中央集権化により、我らはアドリア海随一の有能な貿易管理者となり、異国商人たちの黄金を引き寄せている。"
 mzk_the_muzakan_industrialization: "ムザカの産業化"
 mzk_the_muzakan_industrialization_desc: "わが国のなかでも特に肥沃ないくつかの谷で商品作物の大規模栽培を導入し、新たな国内産業を育んだ。自国の原材料を高付加価値製品へと加工することで、裕福で忠実な都市住民を支える産業基盤を構築している。"
 thp_the_thopia_merchant_marine: "トピア商船隊"
 thp_the_thopia_merchant_marine_desc: "トピアの旗を掲げるすべての商船に国家からの保護を提供することで、商業的影響力を拡大した。この海軍による安全保障により、我々の港はレバント貿易の主要拠点となり、衰退しつつある対立諸国の港から富を吸い上げている。"
 #Bosnian Shared
 bos_cultural_customs: "$bosnia_area$のステチュツィ"
 bos_cultural_customs_desc: "わが国民は信仰の違いにかかわらず、多くの独自の風習を守っている。精緻に装飾された墓碑である「ステチュツィ」を建立することで、この地がボスニア独自のものであることを示せるだろう。"
 bos_katun_communities: "ヴラフ・カトゥン"
 bos_katun_communities_desc: "わが国民の一部は、自治的な牧畜共同体として暮らしている。中央政府の意向に無理に従わせるのではなく、彼らと協力し、辺境の地からより多くの資源を得ることを目指すべきである。"
 bos_defiant_terrain: "難攻の地形"
 bos_defiant_terrain_desc: "$bosnia_area$の地は、森に覆われた丘陵や山々、そして谷を縫う河川によって形成されている。この地形は侵略者の進軍を遅らせ、疲弊させるのに最適であり、我々はこれを巧みに利用すべきである。敵と交戦するのは有利な時のみとし、敵の補給や兵力をこの険しい地形に消耗させることで、わが軍の戦力を温存できるだろう。"
 bosnian_bosancica: "ボサンチツァ"
 bosnian_bosancica_desc: "ボスニアの民は#italicボサンチツァ#!という独自の筆記体キリル文字の下に団結してきた。これは外交条約から商人の私的な帳簿に至るまで、あらゆる用途に用いられる。この国民的文字体系は強力な文化的関門として機能する。外国人には読みづらい一方、その信仰の違いを問わず識字階級の間では共通のものとなっている。この独自の文字を保つことで、民は法的・歴史的記録を帝国の行政官にとって「閉ざされた書物」のままにし、財産法と血統にまつわる微妙な機微を、我らが独自のスラヴ的遺産を強化する形式のもとに秘匿し続けている。"
 bosnian_people_from_the_hills: "丘の民"
 bosnian_people_from_the_hills_desc: "ボスニアの心臓部の地形は、通常の地図作成を拒む石灰岩の尾根と谷が織りなす垂直の迷宮である。我が民はこの土地の論理に適応し、地下洞窟網の秘密とラバによる輸送の算段を会得した。"
 bosnian_susjedsvto_of_bosnia: "ボスニアのスシュジェドストヴォ"
 bosnian_susjedsvto_of_bosnia_desc: "古来の文化概念である #italic スシェドストヴォ #! （隣人を守り敬うという神聖な社会的義務）は、宗教の垣根を越える洗練された市民哲学へと発展した。外部からの圧力に直面する中で、この不文律は隣人の安全と財産を自らのそれと同様に神聖なものとして扱うことを定める。この慣行は、外国勢力が内紛を煽るためにしばしば用いる「分割統治」策を阻む。地域の連帯と「隣人の掟」を何よりも重んじることで、我らは社会的調和と内部の安定を維持し、我らが共有する祖国を解体しようとするいかなる試みに対しても、一致団結した不屈の戦線を示すことができるのだ。"
 #Bosnian Unique
 bos_land_of_many_churches: "ボスニアの多様な教会"
 bos_land_of_many_churches_desc: "ボスニアの地には複数の教会が存在する。わが国は正教会とカトリック教会が分かち合うだけでなく、クルステャニも暮らす地である。中央権威の監督が及ばないこの地では、安定を保つために各宗派間の理解と調和を育む必要がある。"
 bos_influence_of_the_stanak: "スタナク会議"
 bos_influence_of_the_stanak_desc: "わが国の貴族たちは定期的に集まり、国の最重要課題について議論する。これらの会議は、貴族たちの方針を統一させるとともに、議会における結束を示す役割を果たしている。"
 bos_kingly_ambitions: "王の野心"
 bos_kingly_ambitions_desc: "わが国民の功績と労苦は称賛され、守られるべきものである。そのためには、周辺国の統治者たちとの確固たる関係を築き、我々自身の権威ある称号を確立しなければならない。"
 bos_the_srebrenica_mint_office: "スレブレニツァ造幣所"
 bos_the_srebrenica_mint_office_desc: "$srebrenica$の鉱山がバルカンにおける地金の主要な供給源となるのに伴い、この領土は単なる粗鉱の輸出以外も担うようになった。我々は王立造幣所と品位検査所を設立し、ボスニア産銀の純度を規制することで、ヴェネツィアの硬貨に匹敵する信頼性をもつ硬貨を製造している。ラグーザやザクセンの鉱夫によって採掘された銀はすべて国が管理する精錬所で加工すると義務づけることで、我々は付加価値による利益の大部分を掌握している。この流動的な富により、ボスニアはディナル・アルプスで財政的に極めて安定した勢力となっている。"
 bos_bosnian_ljekaruse: "ボスニアのリェカルーシェ"
 bos_bosnian_ljekaruse_desc: "我が国の人里離れた谷間では、修道院の修道士たちが #italic リェカルシェ #! 、すなわち土着の #italic ボサンチツァ #! 文字で記された広範な医術写本を編纂してきた。古代ギリシア・ビザンツの理論とディナル・アルプスの高地薬草学とを融合させることで、これらの医術書は専門医が希少なこの時代において、洗練された共同体医療の体系を提供している。この民間医療と外科術の熟達は、低地を襲う疫病に対して我が民が強靭であり続けることを保証し、知的自立とスラヴの科学的知見の継承によって定義される文化的アイデンティティを育んでいる。"
 bos_the_filigree_guilds: "細金細工ギルド"
 bos_the_filigree_guilds_desc: "中央山岳地帯の尽きることなき銀鉱脈を活かし、我が都市の職人たちはフィリグランと呼ばれる精緻な銀線細工の技を極め、それはボスニアの贅沢の象徴となった。これらの職人組合は強力な経済的階層として機能し、儀礼用の短剣や上質な宝飾品をヴェネツィアやウィーンの市場へと輸出している。我らの原鉱資源を高付加価値の芸術的輸出品へと転じることで、王家に忠実な繁栄せる都市中産階級を生み出した。この産業的洗練は、あらゆる外国の宮廷における我が国の威信を高め、バルカンの「鉄の心臓」が西欧の大都市にも劣らぬ洗練された文化的優位を備えていることを証明している。"
 #Bulgarian Shared
 bulgarian_orthodox_patriarchate: "ブルガリア正教会総主教"
 bulgarian_orthodox_patriarchate_desc: "1235年、ランプサコス公会議によって承認されたブルガリア総主教座の復興は、タルノヴォをコンスタンティノープルとローマ双方に対抗する独立した精神的中心地として確立した。14世紀までに、総主教座はアセン朝およびシシュマン朝のイデオロギー的支柱として機能し、その独立教会としての地位を活かして、王国の政治的分裂を超越した神授の正当性を与えた。ツァレヴェツの丘にその座を置くこの教会は、アトス山のゾグラフ修道院をはじめとする教区や修道院からなる広大な行政網を統括し、それらはブルガリア版教会スラヴ語の典籍の保管庫として機能した。"
 reformation_of_the_bulgarian_patriarchate: "総主教座の再建"
 reformation_of_the_bulgarian_patriarchate_desc: "ブルガリア世界の精神的中心地は、我らが総主教の鉄の意志による指導のもと、厳格かつ深遠な変革を遂げることになる。国家の存続が信仰の純粋さと聖典の正確さに依存していると認識し、総主教座はタルノヴォの聖三位一体修道院を拠点として、広範な言語および典礼改革に着手する。数世紀にわたる筆写上の誤りや、歪められた地方的表現を教会スラヴ語の写本から一掃することで、我々は新たな標準正書法を確立する。そしてこれはドナウ川からヴォルガ川に至る正教スラヴ世界全体の絶対的規範となるだろう。"
 bulgarian_the_danubian_river_merchants: "ドナウ川の商人"
 bulgarian_the_danubian_river_merchants_desc: "下流ドナウ川の門番としての地位を活かし、ブルガリアの商人一族は黒海と中央ヨーロッパを結ぶ高度な貿易網を確立した。浅喫水の平底船と要塞化された河川港を利用することで、彼らは費用がかかる危険な陸路を回避できるようになり、バルカン全域における塩、穀物、木材の流れを掌握することに成功した。この河川交易に関する専門知識は、ドナウ川をブルガリアの富の動脈へと変え、新しい都市上流層の台頭を支えている。そして我々は、特権の維持と引き換えに彼らへ税を課すことができる。"
 fortress_of_the_balkans: "バルカンの要塞"
 fortress_of_the_balkans_desc: "我々は、精神的な純粋さだけでは世界に蔓延する狂気を食い止められないことを認識している。生存のため、国家は全土の要塞化という方針へと舵を切り、バルカン山脈を通行不可能な花崗岩の壁へと変貌させた。我らの領土を多層的な石造りの砦と常設守備隊で強化することにより、わが国は侵略者を壊滅的な消耗戦に追い込む戦略的縦深性を創出した。この政策により、ブルガリアの中心地は正教の安定が守られる聖域でありつづけ、我らが国民の心の炎は、いかなる嵐も容易には消し去ることのできない鉄と石の輪の背後に守られている。"
 bulgarian_the_bulgarian_cloth_industry: "ブルガリアの織物産業"
 bulgarian_the_bulgarian_cloth_industry_desc: "ブルガリアの都市は、#italicアバ#!(丈夫で厚手の毛織物)と#italicガイタン#!(装飾用の組紐)の専門生産を通じて、半島の産業的中枢へと変貌を遂げるであろう。地元の織工や羊飼いたちを強力な自治ギルドへと組織化することで、我が商人たちは地方軍の装備や、地中海沿岸で拡大しつつある都市中産階級向けの、国家規模の大型契約を獲得できるようになる。この経済的躍進は商人貴族階級を生み出し、ブルガリア人民が農村の農民層から、近隣諸国に条件を突きつけるだけの財力を備えた、洗練された前工業化社会へと移行することを示すものとなる。"
 bulgarian_the_bulgarian_national_awakening: "ブルガリアの民族覚醒"
 bulgarian_the_bulgarian_national_awakening_desc: "ヒランダルのパイシウスのような修道士の著作に触発され、ブルガリアの民は自らの帝国的歴史と言語的誇りを再発見し、大規模な教育的・政治的再生を引き起こした。この運動は単なる地域的な不満の発露に留まらず、ヨーロッパ列強の一角を占めることのできる中央集権的な近代国家の樹立を求めるものへと発展した。その結果、近代官僚機構や国民軍に奉仕する意欲にあふれ、高い識字力を備えた民衆が生まれた。彼らはツァーリの栄光は過去の記憶ではなく未来であるという強い信念に突き動かされている。"
 #Bulgarian Unique
 legacy_of_ivan_asen_ii: "イヴァン・アセン2世の遺産"
 legacy_of_ivan_asen_ii_desc: "イヴァン・アセン2世の治世により、ブルガリアの国力、外交、経済的発展はかつてない高みに達した。彼の遺産は、強力かつ中央集権的な国家の礎として、いまなお受け継がれている。"
 bul_the_bastion_of_tseverets: "ツァレヴェッツの要塞"
 bul_the_bastion_of_tseverets_desc: "ツァレヴェッツとトラペジツァの断崖にそびえるタルノヴォの首都は、バルカン半島でも屈指の堅固な要塞であり、アセン王朝の権力を象徴している。宮殿群、総主教座大聖堂、そして三重の城壁を絶えず拡張することで、我々は急襲や包囲にも動じない統治の中枢を築き上げた。この建築的威容は、帝国の安定を印象づけ、地元のボヤールを威圧し、「第三のローマ」が真にヤントラ川のほとりに移ったことを民衆に確信させている。"
 kvn_karvunan_maritime_heritage: "カルヴナの海洋遺産"
 kvn_karvunan_maritime_heritage_desc: "カルヴナは肥沃な平原ではなく海にその力の基盤を築き、ブルガリア人、ギリシャ人、イタリア人の船員を取り込んできた。沿岸の石灰岩の断崖を要塞化し、海軍基地を多数設置することで、ドナウ川の三角州地帯とコンスタンティノープルを結ぶ黒海交易路の支配が可能になる。この海洋重視の姿勢は、内陸部の伝統的な封建的関心よりも海上優勢と交易を重んじる、ブルガリア世界における我々独自のアイデンティティを形作るだろう。"
 vid_the_stronghold_of_baba_vida: "ババ・ヴィダの要塞"
 vid_the_stronghold_of_baba_vida_desc: "ドナウ川の戦略的な屈曲部に位置するヴィディンの要塞は、ブルガリアの領土、ハンガリーの平原、そしてセルビアの山岳地帯を結ぶ最重要の関門として機能している。シシュマン王朝のもと、ババ・ヴィダの城は長期にわたる包囲に耐えうる高度な河川要塞へと変貌を遂げ、精鋭の常駐守備隊を収容するようになった。こうした防衛設備への注力により、ブルガリアの中心地が脅かされる状況にあってもヴィディンは主権の砦として存続し、国家の「西方の盾」として機能しつづけることができる。"
 revival_of_the_literary_schools: "タルノヴォの芸術学校"
 revival_of_the_literary_schools_desc: "シシュマン朝の直接的な保護のもと、国家は目覚ましい文化的成長を遂げ、真の「第三のローマ」として、また正教の高尚な文化の主たる守護者としての地位を確立した。総主教座大聖堂とツァレヴェッツの王宮の再建に資金を投じたことで、わが国には伝統的なビザンツ様式の美学と、独特で情緒的なブルガリア的写実主義を融合させた、新しい世代の熟練したイコン画家、聖人伝作家、建築家が集まった。この思想的学派は単に宗教的イコンを制作するだけではなく、帝国の強力なプロパガンダとしての役割も担い、ブルガリア教会スラヴ語を体系化するとともに、ツァーリのビザンツ遺産に対する主張を正当化するための『マナセス年代記』を編纂した。"
 bul_the_chancery_of_the_asens: "アセン朝の書記局"
 bul_the_chancery_of_the_asens_desc: "最盛期のタルノヴォの書記局は、正教世界で最も洗練された外交拠点だった。セルビアやロシアの宮廷に影響を与えた複雑なスラヴ語の憲章を制定したのもこの書記局である。ロゴテテスや書記官の階級を専門職化することで、ツァーリはあらゆる土地付与や国際条約が綿密に記録され、法的拘束力をもつことを保証する。この厳格な行政体制により、国家はより効率的に税を徴収し、さらには中世後期においては稀なほどの中央統制をもって、複雑な臣従関係を管理することが可能となる。"
 kvn_looking_for_friends: "友好国を求めて"
 kvn_looking_for_friends_desc: "領土が狭いため、我々の統治者は強力な友好国や貿易相手の必要性をよく理解している。ヴァルナのような港での独占的貿易権をこれらの同盟国に与えることで、専制公国は近代的な西方の海軍技術や金融信用だけでなく、強力な海軍による敵からの保護を得られる可能性もある。この同盟はドブロジャを国際的な貿易拠点へと変え、シルクロードの富がここで北方の穀物や毛皮と交換されるようになるのだ。"
 vid_the_western_connection: "西方とのつながり"
 vid_the_western_connection_desc: "文化の交差点に位置するヴィディンのツァーリたちは、他のどのブルガリアの統治者よりもカトリック圏の西方と密接な関係を維持しており、しばしばハンガリーやワラキアの貴族と婚姻関係を結んできた。この外交的柔軟性により、ヴィディンは独立国家としての存続を可能にし、西方の軍事技術や宮廷の伝統を活用することで$BUL$の他の地域との差別化を図っている。正教世界とカトリックの世界のあいだの架け橋となることで、ヴィディンは貿易と知的交流の中心地となり、これによりもたらされる富は地方の財政と軍を潤してくれる。"
 bul_the_boyar_council: "ボヤール評議会"
 bul_the_boyar_council_desc: "14世紀にわが国を苦しめた内紛を防ぐため、我々は「諮問的独裁制」へと移行し、特に力のあるボヤールを恒久的な国家評議会に統合する。この機関は最高裁判所および軍事計画委員会として機能し、土地を有する貴族の利益が王権の利益と一致することを保証するものである。この政治的安定により、我々は大規模な常備軍を維持することが可能となり、かつてのように壊滅的な内戦で近隣諸国に対する帝国の守りが手薄になるという事態を回避することができる。"
 bul_the_hesychast_state_philosophy: "ヘシカズムの国家哲学"
 bul_the_hesychast_state_philosophy_desc: "グレゴリオス・シナイテスの霊的教えは、隠者の庵から権力の殿堂へと移った。内なる静寂と神の光を説くヘシュカズムを事実上の国家思想として採用することで、我々は深く敬虔かつ不屈の民を育む。この共有された霊的アイデンティティは敵の影響に対する強力な抑止力として働き、ブルガリアの臣民を外国からの改宗や切り崩しに対して免疫を持たせるのである。"
 kvn_the_condotta_of_varna: "ヴァルナのコンドッタ"
 kvn_the_condotta_of_varna_desc: "陸上の人口が比較的少ない海洋国家であるカルヴナは、イタリアの海洋勢力と恒常的なコンドッタ（傭兵契約）を公式に結ぶことで、「契約戦争」の技術を磨き上げてきた。この取り決めに基づき、我々は黒海の要塞化された倉庫や海軍基地を提供し、その見返りとしてイタリア側は専制公国の防衛のために重石弓兵と熟練した攻城技術者からなる職業軍団を提供する。この相互関係により、カルヴナは陸戦において自らの規模以上の戦力を発揮することができる。沿岸地帯の防衛には西方の戦術革新と職業的規律を活用し、制海権の掌握は地元のブルガリア人水兵が担うというように役割が分担されており、カルヴナの陸上防衛は事実上、地中海屈指の傭兵に委ねられている。"
 vid_the_order_of_the_danubian_dragon: "ドナウのドラゴン騎士団"
 vid_the_order_of_the_danubian_dragon_desc: "国境貴族の忠誠を確保し、職業的な将校団を形成するため、ヴィディンのツァーリたちは西方のドラゴン騎士団に倣った在地の騎士団を創設する。この騎士団の成員はつねに出動可能な態勢を維持し、ツァーリ国の防衛の中核となる重騎兵を提供する見返りに、ティモク川とドナウ川沿いの領地が与えられる。この制度は、旧来のブルガリアのボヤール的伝統と西方の騎士道規範のあいだの隔たりを埋め、厳格な軍事規律と王権への個人的忠誠心を育み、国内の分裂を防ぐことが期待されている。"
 bul_the_silk_and_rose_guilds: "絹と薔薇のギルド"
 bul_the_silk_and_rose_guilds_desc: "肥沃なトラキア平原とバラの谷特有の気候を活用し、我々は高級油脂と絹の生産のために国家保護下のギルドを設立した。これら高価値・軽量の品々は、欧州およびアジアの宮廷への陸路輸出に最適である。これらギルドが生み出す富により、国家は莫大な金準備を築くことができ、我が経済は地中海全域で最も安定し信用力ある経済の一つとなる。"
 bul_the_bulgarian_gunpowder_foundries: "ブルガリアの火薬製造所"
 bul_the_bulgarian_gunpowder_foundries_desc: "バルカン山脈の鉄鉱山とザクセン人鉱夫の専門知識を活用し、地域初となる大規模な国内火薬産業を興す。これらの製造所は重攻城砲や初期の火器を製造し、ブルガリア軍を封建的な騎兵主体の軍隊から、近代的な歩兵主体の軍隊へと移行させる。硝石と鉄の生産を掌握することで、バルカンにおいていかなる者が征服を試みようとも、我々の城壁は極めて危険な障害でありつづける。"
 kvn_the_cosmopolitan_code_of_karvuna: "カルヴナの国際法典"
 kvn_the_cosmopolitan_code_of_karvuna_desc: "黒海随一の交易拠点としての地位を維持すべく、我々は「カルヴナ法典」として知られる革新的な法体系を公布し、認定された商人国家に治外法権と信教の自由を与える。信仰や出自を問わず、我が港で活動する商人は、地元の封建領主ではなく、同業者による商事裁判所によって裁かれる。この法的予見可能性と寛容の雰囲気は莫大な資本と専門知識の流入を引き寄せ、カルヴナを巨大な拠点へと変貌させる。そこでは絹と香辛料の道がもたらす富が、国家の道路、兵器廠、そして軍隊へと再投資されるのである。"
 vid_the_mining_grants: "鉱山採掘権"
 vid_the_mining_grants_desc: "ヴィディンは鉱物に恵まれたティモク渓谷への影響力を拡大する必要があり、ザクセン人やラグーザ人の鉱夫に銀・鉛・銅の採掘権を与えた。この産業基盤は、近代的な通貨や高品質な火器の製造に必要な金属をツァーリ国にもたらし、ヴィディンは自給自足が可能な軍事力をもつことになる。これらの鉱山から得られる富により、ツァーリは常備軍を維持することも可能となる。"
 bul_the_grand_academy_of_the_yantra: "ヤントラ大学院"
 bul_the_grand_academy_of_the_yantra_desc: "14世紀のタルノヴォ文学派が遺した知的遺産は、17世紀に近代的な国立大学の創設を通じて復活した。この機関は民法、工学、そして西欧科学文献のブルガリア語訳に重点を置き、パリやウィーンに劣らぬ官僚階級を育成している。エリート層の近代化により、ブルガリアの中核を成す文化的純粋性を維持しつつ、複雑な多民族帝国を統治することが可能になる。"
 bul_the_standing_drilled_infantry: "常備訓練歩兵"
 bul_the_standing_drilled_infantry_desc: "季節ごとの徴兵制から脱却し、我々は初の常備軍である「獅子の連隊」を創設した。これらの歩兵は、年間を通じて火器の使用に関する訓練を受け、近隣諸国の成功例を参考にしつつも、バルカンの地形に合わせ手を加えられた厳しい教練に取り組む。この職業軍人からなる歩兵部隊は、近隣諸国の伝統的軍隊を凌駕する行軍力と射撃能力を備えており、攻勢戦において信頼のおける戦力となってくれる。"
 kvn_the_black_sea_admiralty: "黒海海軍本部"
 kvn_the_black_sea_admiralty_desc: "カルヴナは近代的な深水域軍艦の建造および専門的将校団の訓練を監督するため、常設の国営海軍府を設立し、小型のガレー船から脱却して、エーゲ海やアゾフ海に至るまで影響力を及ぼすことのできるフリゲートや小型戦列艦の建造を開始する。この海軍の近代化により、我々は主要な海洋勢力としての地位を維持し、敵から交易上の利益を守ることができるようになる。"
 vid_vidins_custom_houses: "ヴィディンの税関"
 vid_vidins_custom_houses_desc: "ドナウ川上流と黒海のあいだの交易が拡大するにつれ、ヴィディンはドナウ川下流において極めて重要な税関となり、バルカンへのヨーロッパ産贅沢品の流入を規制している。洗練された関税制度と倉庫法を導入することで、国家は自国の農民層に重い負担をかけることなく国庫を満たすことができる。この交易中心の経済により、ヴィディンはインフラを近代化し、ドナウ川とバルカン半島の内陸部を結ぶ舗装道路や石橋を建設することが可能になる。"
 bul_the_imperial_restoration_doctrine: "帝国復興の教義"
 bul_the_imperial_restoration_doctrine_desc: "我々はバルカン諸民族の天与の指導者という役割を全面的に受け入れ、かつてのブルガリア領土全域を再統一するための正式な教義を打ち出した。この使命は近代的な職業軍隊と、列強同士を対立させようと図る洗練された外交団によって支えられている。「大ブルガリア」への信念は国家の中核となり、シメオン大帝の帝国の復興を目指す攻勢的な拡張と文化的な同化政策を推進する。"
 bul_the_bulgarian_census_bureau: "ブルガリア国勢調査局"
 bul_the_bulgarian_census_bureau_desc: "知識は力である。我々は10年ごとの国勢調査を導入し、帝国内の全住民、家畜、そして世帯を記録している。この精密な記録により、バルカン屈指の効率的な課税および徴兵制度が可能になる。国家が提供しうる資源を正確に把握することで、軍隊がつねに十分な食糧を得られ、国庫は決して枯渇しないという、確固たる兵站体制のもとで長期的な軍事作戦を計画することができる。"
 kvn_the_free_port_of_varna: "ヴァルナ自由港"
 kvn_the_free_port_of_varna_desc: "バルカン随一の商業拠点としての地位を確固たるものにするため、我々はヴァルナを自由港と宣言し、一定の通行料と引き換えに国際的な商人を伝統的な諸税から免除する。この政策は商人、銀行家、保険業者といったディアスポラを大勢惹きつけ、ヴァルナを「黒海のヴェネツィア」かつブルガリア世界の金融首都とするだろう。こうして生み出される富により、職業軍人で構成された陸軍と世界水準の海軍を維持でき、大国がひしめく時代においてもこの沿岸国家が豊かで独立した勢力でありつづけることを保証する。"
 vid_the_codex_shishman: "シシュマン法典"
 vid_the_codex_shishman_desc: "中世封建国家から近代的な中央集権君主制への移行を完了させるため、ツァーリ国は「シシュマン法典」を公布する。これは西バルカンの多様な地方慣習を統一する包括的な法的改革である。この法典は、地方の地主から独立した専門的な司法制度を確立し、ヴィディンの交易網全体で使用される度量衡や通貨を標準化する。予測可能で公正な法的環境を提供することで、忠実な都市中産階級の成長と国家の税収の安定を確保する。この行政の近代化により、ヴィディンは法の支配がババ・ヴィダの壁そのもののように強固な、東方の「啓蒙専制」の模範となる。"
 #Croatian Shared
 croatian_the_glagolitic_lithurgy: "グラゴル語典礼"
 croatian_the_glagolitic_lithurgy_desc: "我が文化は、グラゴール文字典礼という唯一無二の特権によって定義される。これにより我が国はカトリック世界において唯一、ミサが母語たるスラヴ語で歌われる土地となっている。この伝統はラテン的な都市とスラヴの中心地との間の架け橋となり、統一された文化的アイデンティティを生み出す。この古代文字を守り続けることで、我が民は独自性を強化する秘められた言語を保持し、イタリアおよびゲルマンの文化圏双方による同化に抗う民族的誇りをもたらすのである。"
 cro_influx_of_foreign_knowledge: "他国からもたらされる知識"
 cro_influx_of_foreign_knowledge_desc: "沿岸都市はルネサンスの活気あふれる中心地となり、学者や芸術家たちはそこで古典的なイタリアの影響と独自のスラヴ的感性を融合させている。この知的運動はヨーロッパの科学、詩、哲学に貢献する偉大な思想家を生み出し、クロアチア文化が近代の最前線にあることを証明している。裕福な商人たちによる後援のおかげで、壮麗な大聖堂や宮殿の建設が可能となり、我らの海岸はこの時代の最高峰の頭脳を引き寄せる高尚な文化の灯台へと変貌を遂げた。"
 cro_trade_posts: "マルリッチの叙事詩の伝統"
 cro_trade_posts_desc: "クロアチアの文化的精髄は、「クロアチア文学の父」マルコ・マルリッチによる #italic ユディタ #! のような作品によって文学的頂点に達した。聖書の寓意を用いて同時代の我が国土防衛を描くことで、マルリッチは国家に生存のための高尚な文化的指針を与えた。この文学はルネサンスの都市民と辺境の兵士との間に架け橋を築き、あらゆる階層を共通の英雄的使命のもとに統一し、クロアチア語が高尚な芸術と神学論争の言語として保存されることを確かなものとした。"
 croatian_the_peasants_revolts: "農民反乱"
 croatian_the_peasants_revolts_desc: "絶え間ない戦争のなかで課せられた重圧的な封建的義務は、過去に農民の反乱を引き起こした。農民たちは我々に対してではなく、過度な十分の一税を要求しながら彼らを守れなかった「不当な」貴族に対して蜂起した。これらの反乱は大抵無慈悲に鎮圧されてきたが、社会意識という永続的な遺産を残し、階級間の関係を変容させた。最終的に、国家は内部の安定を維持するために増税を緩和せざるを得なくなったのだ。"
 croatian_the_cravats: "クラヴァット"
 croatian_the_cravats_desc: "この激動の時代、世界はクロアチア軍から現れた精鋭軽騎兵連隊の存在に注目するようになった。その伝説的な機動力と獰猛さに加え、これらの騎兵は衣装の斬新な工夫を持ち込んだ——首元に結ぶ布で、シャツの襟を留め、胸甲による擦れから首を守る機能的な布である。この #italic cravat#! (フランス語訛りで「 #italic Croate#! 」が訛った名である)は瞬く間に戦場を超え、パリおよび欧州流行の頂点にまで上り詰めた。無骨な軍事的必要品を流行の装いの象徴へと変貌させることで、我が文化は目立たぬながらも恒久的な勝利を収めたのである。この服飾面での優位は、クロアチア士官の姿が戦術的な殺傷力と比類なき騎士道精神を兼ね備えたものであるという印象を確たるものにする。"
 croatian_the_illyrian_movement: "イリュリア運動"
 croatian_the_illyrian_movement_desc: "ここ数年、わが国ではイリュリア運動が爆発的に広がっている。この運動は、すべてのクロアチア人をひとつの旗のもとに統一しようとする文化的・政治的革命で、わが国の分断された諸地域をひとつにまとまった政治的・文化的国家体へと統合することを目指している。文法と正書法を標準化することで、我らはこの中世国家を近代国家へと変貌させ、クロアチアの名、言語、そして国家としての地位が二度と忘れ去られたり抑圧されたりしないようにするのだ。"
 #Croatian Unique
 cro_maritime_connections: "パクタ・コンヴェンタ"
 cro_maritime_connections_desc: "この法的基盤は、クロアチアの十二貴族とハンガリー王冠との連合を正式に定めたものである。君主の選出権を残し、ズヴォニミール王冠を用いた独自の戴冠式を継続することで、我々は他国との連合に組み込まれた場合でも、クロアチアが独立した政治的実体でありつづけることを保証している。この契約に基づく主権は外国の行政機関への完全な吸収を防ぎ、我々の貴族が自らの古法のもとで国内の司法と防衛を管理することを可能にしている。"
 cro_the_bashka_tablet: "バシュカの石碑"
 cro_the_bashka_tablet_desc: "クロアチアの文化的精髄は「ズヴォニミル伝統」に根ざしており、そこでは我らの歴史が石に刻まれている。我々は叙事詩と史書を通じて独立した王たちの記憶を伝え、あらゆる農民と貴族に「王国意識」を植え付けてきた。たとえ外国の王のもとにあろうとも、クロアチア人は自らを古く主権ある国家の一部と見なしており、その誇りこそが我が文化を生き生きとさせ、外部からの衰退に抗う礎となっているのである。"
 svn_the_marturina_tax_system: "マルトゥリナ税制"
 svn_the_marturina_tax_system_desc: "我々は #italic マルトゥリナ #! (テン皮税、別名 #italic クノヴィナ #! )を制度化した。これは古来よりスラヴォニアに伝わる独自の貢納制度であり、バンに価値高く持ち運びやすい富の蓄えをもたらす。この毛皮の価値を王室マルクに対して標準化することで、我々は価値を保ち続ける安定した地域通貨を生み出した。この財政的信頼性により、バン国は専門の護衛部隊を維持し、脆弱なドラヴァ渡河地点沿いに広範な木造・石造の河川要塞を築くことができ、しかも農民に過重な穀物税を課す必要がないのである。"
 cro_legacy_of_the_trpimirovic: "トルピミロヴィッチ家の遺産"
 cro_legacy_of_the_trpimirovic_desc: "我々はトミスラヴやズヴォニミールのような在地の王たちの栄光の時代を振り返り、独立の宿命と国民の誇りを鼓舞している。これら主権的統治者に我々の血統と制度の源流を求めることで、ヨーロッパの諸宮廷における外交的地位を強化し、多くの隣国よりも由緒ある王冠への権利を主張する。この歴史的威信は教皇庁からの敬意を勝ち取り、単一の由緒あるロマンス・スラヴ系王権の旗の下、王国内の分断された諸地域を結集させる強力な統一神話として機能する。"
 cro_the_banovac_silver_denar: "バノヴァツ銀デナール"
 cro_the_banovac_silver_denar_desc: "我々はモネタリア（貨幣鋳造権）を行使し、バノヴァツ銀デナールを鋳造する独自の造幣局を設立した。近隣通貨よりも高い銀含有率を維持することで、我々の硬貨は北アドリア海とドラーヴァ川流域における主要な交換手段となった。この財政的独立により、外部からの補助金に頼ることなく行政資金を賄うことが可能になり、我々の宮廷はラグーザやヴェネツィアの資本を惹きつける地域金融の中心地となっている。"
 svn_the_slavonian_sabor: "スラヴォニア・サボル"
 svn_the_slavonian_sabor_desc: "わが国の民はスラヴォニアのサボル（議会）の監視のもとで統治されている。この立法上の独立により、スラヴォニア貴族は排水事業や穀物市場の規制など、河間平原特有の課題に対処することができる。専用の議会をもつことで、バン領は地域の危機に迅速に対応し、免税措置を直接交渉することが可能となる。これによりスラヴォニアの農業による富が、主にスラヴォニア自身の防衛と発展に確実に役立てられるようになる。"
 cro_antemurale_christianitatis: "キリスト教の防壁"
 cro_antemurale_christianitatis_desc: "我々の文化的アイデンティティは「殉教者の世紀」という試練の炎のなかで鍛え上げられてきた。我々はアンテムラーレ・クリスティアニターティス（キリスト教の防壁）という役割を自ら引き受け、軍事的闘争を神聖な宗教的使命へと昇華させた。この神話は国民に深く揺るぎない歴史的使命感を植えつけ、国家防衛を文明そのものの防衛とみなすよう導いている。この「英雄的気概」があるからこそ、最も暗い時代にあっても、国家の炎は絶えることなく燃えつづけるのだ。"
 cro_the_croatian_press: "クロアチア印刷所"
 cro_the_croatian_press_desc: "我々はスラヴ世界における先駆者として、極めて大胆な印刷所を設立した。技術的中枢を「通行不能」とされるコシニ渓谷に移すことで、沿岸部を悩ませる海上襲撃や国境紛争から神聖なグラゴル文字文献の製作を保護している。この印刷所は単なる識字能力のための道具ではなく、文化存続の拠点であり、母国語による最初の印刷ミサ典書を生み出す場所である。近代的な印刷技術によって我々の古代文字を標準化することで、王国のすべての教区に対し、統一され、改変が不可能な法と典礼の源を提供する。これにより、クロアチアのアイデンティティはその知性という面において強固に守られ、精神的な独立も保たれることとなる。典書は羊飼いから貴族に至るまであらゆる者の手に届き、国家の魂を揺るぎない在地の伝統へと結びつけるのだ。"
 svn_the_alluvial_grant_lands: "沖積地の土地付与"
 svn_the_alluvial_grant_lands_desc: "サヴァ川とドラヴァ川の間に広がる肥沃な沖積土こそ、我が最大の資産である。重い河畔の藪を切り開く代わりに免税地を与えることで、我々は氾濫原を北方随一の穀倉地帯へと変えつつある。これほどの収穫は大規模な常備軍を養うに足り、王国の守護者たちは最も過酷な冬の包囲の間でさえ十分な食事にありつけるのである。"
 cro_reliance_on_adriatic: "ウスコクの教訓"
 cro_reliance_on_adriatic_desc: "敵の進撃に対抗すべく、我々は沿岸の要塞群を、終わりなき戦いを続ける難民戦士ウスコクたちの聖域へと変えた。この軽歩兵部隊は小型の高速船を用いて敵の補給線に電撃的な急襲を仕掛け、正規軍が追えぬ険しいカルスト地形で生き延びる。この政策により我が沿岸は敵にとって致命的な「無人地帯」と化し、中央財政からの支援を一切必要とせぬ安価で猛烈に士気の高い国境警備を我々にもたらし、敵を常に守勢に追い込み続けるのである。"
 cro_the_jesuit_academy: "イエズス会アカデミー"
 cro_the_jesuit_academy_desc: "招請を受けたイエズス会によって創設されたこの学院は、地方の学寮から我が国の知的中枢へと発展を遂げた。アリストテレス哲学、数学、修辞学からなる厳格な教育課程を確立することで、この学院はウィーンの社交界にもサボル(議会)にも等しく馴染む「啓蒙されたクロアチア人」という自前のエリート層を生み出した。この改革により、我が行政は今世紀の複雑な法的・科学的変化を乗りこなせる教養ある人材によって率いられることが確かなものとなるのである。"
 svn_the_oak_staple_rights: "オーク材の専売権"
 svn_the_oak_staple_rights_desc: "スラヴォニアのオーク材は、鉄のような耐水性により地中海で最も需要の高い木材となっている。ヴェネツィアの造船所への成熟したオーク材の輸出を王室が独占することで、我々は対海洋共和国の戦略において利用できる経済的な“梃子”を手にした。この貿易は国庫を満たすだけでなく、ヴェネツィアの宮殿の基礎やガレー船の船体がクロアチアの大地に育まれたもので作られることを意味し、我々に「アドリア海の女王」に対する独自の外交的影響力をもたらす。"
 cro_baroque_pietas: "バロック様式のピエタス"
 cro_baroque_pietas_desc: "我々の文化は、大規模な宗教行列や壮大で華麗な教会の建設に象徴される、劇的で強烈なバロック様式のカトリック信仰を受容している。この「視覚的な信仰心」は強力な統合力として機能し、共通の儀礼や目を見張る景観を通じて都市貴族と農村農民の隔たりを埋めている。この強烈な宗教的アイデンティティは、プロテスタントや東方の影響に対する文化的盾となり、中央ヨーロッパの平原を守りながらも、クロアチアの魂がカトリック・地中海世界にしっかりと根ざしつづけることを保証する。"
 cro_the_national_garrison_system: "国立守備隊制度"
 cro_the_national_garrison_system_desc: "敵艦隊による突発的な上陸襲撃や国境侵犯に対抗するため、我々はヴェレビト山脈のなかでも特に高い岩峰の上に煙と火の信号を用いた高度な視覚信号網を確立する。この「山岳監視網」により、険しい地形にある要塞同士が数分で情報をやり取りできるようになり、時間のかかる山道を通っていく必要がなくなる。これらの信号を内陸の守備隊と連携させることで、敵の襲来に先んじて全土の兵を動員し防壁を強化することが可能となる。この高所からの監視は通行不能な峰々を中央指揮塔へと変え、どんな敵であっても近づこうとすれば我々にすぐさま捕捉される。"
 svn_swamp_drainage_projects: "湿地排水計画"
 svn_swamp_drainage_projects_desc: "河川地帯の広大な沼沢地を干拓する大規模な水利工事に投資することで、我々は数千エーカーもの新たな肥沃な農地を切り開く。これら干拓地はほどなく入植者で満たされ、州の人口と税収を押し上げる一方、疫病の温床を取り除いていく。この地形の変貌は経済を強化するだけでなく、より往来しやすく防衛しやすい地勢を生み出し、かつて我が国内の連絡を妨げていた自然の障壁を取り除くのである。"
 cro_the_royal_council_of_croatia: "クロアチア王立評議会"
 cro_the_royal_council_of_croatia_desc: "我々は首都に #italic コンシリウム・レギウム #! を設立し、クロアチア国家のための専従の執行政府を創設した。この機関は原型的な省庁として機能し、 #italic 三位一体王国 #! の経済、教育、内政治安を司る。この「評議会による統治」の時代は、国家を封建的特権の寄せ集めではなく、合理的で近代的な機構と見なす職業官僚階級を育むであろう。この権力の殿堂で培われた経験は、クロアチア人民が中世王国から近代欧州国民国家への移行を乗り越えるために必要な行政的専門知識をもたらすのである。"
 cro_uniting_the_coast_and_the_inner_lands: "沿岸と内陸の統合"
 cro_uniting_the_coast_and_the_inner_lands_desc: "沿岸部の孤立を打破するため、我々は内陸部と港湾を結ぶ多数の街道舗装という大規模事業を監督する。この人工の街道は、ヴェレビト山脈の石灰岩地帯を貫いて切り開かれ、重い荷馬車に対応するための高度な石橋と蛇行路を備える。この街道は沿岸部を荒廃した辺境から重要な経済の動脈へと変貌させ、内陸の木材や穀物を国際市場へと送り出すことを可能にする。山岳地帯の奥地をアドリア海へと物理的に結びつけることで、国家の領土統合を完遂し、ヴェレビト山脈を越える交易の新時代を切り拓くのだ。"
 svn_the_slavonian_grenadier_regiments: "スラヴォニア擲弾兵連隊"
 svn_the_slavonian_grenadier_regiments_desc: "我々の歩兵部隊は、その屈強な体格、厳格な規律、そして砲火のもとでも揺るがない勇敢さで大陸中に知られる精鋭擲弾兵連隊へと再編された。この特殊な突撃部隊は、苛烈を極める敵の砲火のなかへ先陣を切って突入するために訓練され、手榴弾と銃剣を用いていかなる強敵の戦列であっても打ち破る。戦場におけるこの「スラヴォニアの巨人」の存在は強力な心理的武器として機能し、味方の士気を高めると同時に、敵の心に恐怖を植えつける。"
 #Dalmatian Shared
 dalmatian_the_maritime_commune_spirit: "海洋コミューンの精神"
 dalmatian_the_maritime_commune_spirit_desc: "我々の文化はコミューンによって定義されており、そこではすべての市民の名誉が都市の威信に結びついている。この都市間の競争精神は、人々に近隣よりも美しい大聖堂やより速い船を建造させ、地域に対する極めて高い誇りと革新の文化を生み出している。この「都市国家」的精神は、わが国の民が地方統治と防衛に深く関与することを保証し、中央王権が遠く離れている、または弱っていたとしても、自らの事柄を管理できる非常に強靭で自立した国民を育んでいる。"
 dalmatian_the_cult_of_the_local_patron_saint: "地元の守護聖人信仰"
 dalmatian_the_cult_of_the_local_patron_saint_desc: "すべてのダルマチアの都市は、それぞれ固有の守護聖人への熱烈な崇敬によって支えられている——ザダルの聖クリソゴヌス、スプリトの聖ドムニウス、コトルの聖トリフォン。これらの聖人は単なる宗教的象徴ではなく、都市の「建国の主権者」である。その祝祭日は年間最大の社会的・政治的行事であり、あらゆる階層を共有の儀礼のもとに結束させ、都市の独立したアイデンティティを強化する。この強烈な地域主義により、ダルマチア文化は断固として独立した都市アイデンティティのモザイクとなり、いかなる外国勢力も沿岸全域を一度に文化的に支配することを不可能にするのである。"
 dalmatian_the_guild_of_the_stone_master: "石工ギルド"
 dalmatian_the_guild_of_the_stone_master_desc: "沿岸に豊富に産する骨のように白い石灰岩は、カルスト地形をキャンバスと見なす熟練石工たちの文化を育んだ。我が職人たちは、構造的革新性と繊細な彫刻技術で世界に名高い「ゴシック・ルネサンス」様式を発展させた。これは単なる芸術にとどまらず、我らの永続性を示す物理的な声明である。あらゆる教会、宮殿、市壁を地元産の石で築くことで、我が民は美しくも壊れることのない景観を作り上げ、いかなる海上帝国も真に消し去ることのできぬ、我らの技への永遠不滅の記念碑としてダルマチアの町を見る民族的誇りを育むのである。"
 dalmatian_the_high_chancery_style: "高等書記官体"
 dalmatian_the_high_chancery_style_desc: "ダルマチアの貴族階級は、イタリア半島の同胞に倣い、私信や外交記録に「高級ダルマチア語」という文語規範を採用した。中世ラテン語から洗練された俗語への転換は、沿岸都市をイタリア・ルネサンスの中心と結びつけるものである。共通の趣味は、ヴェネツィアの #italic Studio #! と途切れぬ知的架け橋を築き、我らが詩人や法律家がイタリア最も排他的な人文主義者の輪に加わることを可能にする。この「言語的洗練」により、我が国の外交官はあらゆる西欧の宮廷で文化的な同格者と見なされ、生の軍事力ではなく文明の共有に基づく外交的盾を提供するのである。"
 dalmatian_the_accademia_degli_oziosi: "アカデミア・デッリ・オツィオージ"
 dalmatian_the_accademia_degli_oziosi_desc: "イタリアの文芸アカデミーに倣い、我が都市の知識人たちは物理学、天文学、古典詩を論じる #italic アカデミア・デリ・オツィオージ #! のような団体を設立した。この「怠惰」な学者たちは決して怠惰ではなく、新しいバロック的合理主義を地図学や弾道学に応用し、海軍提督府の科学顧問として仕えている。この育まれた好奇心により、ダルマチアの都市中心部はアドリア海の「科学の物見櫓」であり続け、バルカン内陸部が旧弊な循環に囚われたままであっても、沿岸部は欧州啓蒙主義の拠点であり続けるのである。"
 dalmatian_mediterranean_cosmopolitanism: "地中海的コスモポリタニズム"
 dalmatian_mediterranean_cosmopolitanism_desc: "幾世紀にもわたる海上交易と多言語使用により、我が民は世界主義の文化を育み、ヴェネツィアからレヴァントに至るあらゆる港を我が家とするに至った。この文化的開放性により、世界中から最良の思想を吸収し適応させることができ、他に類を見ない柔軟で強靭な社会を作り上げている。我が民は「海の市民」であり、内陸の閉ざされた世界観よりもはるかに広い視野を持つ。この世界主義の精神により、ダルマチア文化は活気と商業的成功を保ち続け、バルカン半島全体にとっての「世界への窓」としての役割を果たすのである。"
 #Dalmatian Unique
 dal_comune_privileges: "コムーネの特権"
 dal_comune_privileges_desc: "ヴェネツィアの侵入に対して沿岸都市の忠誠を確保するため、我々はこれらのコムーネ（自治体）に内部自治とラテン法を保証する特権を付与する。これらの都市に自らのプリオール（執政官）を選出させ、地方税の管理を認めることで、我々を抑圧者ではなく守護者とみなす忠実な都市階級を創出する。この分散型の都市防衛体制は、沿岸を忠実で要塞化されたコムーネの集合体へと変貌させ、海上襲撃への対抗を可能にすると同時に、沿岸と内陸を結びつける。"
 rag_the_statute_of_1272: "1272年法令"
 rag_the_statute_of_1272_desc: "我が港で財産を賭ける商人たちを安心させるため、ラグーザは財産権と海事法を定めた包括的な法体系へと法律を成文化した。いかなる一人の貴族の権力をも制限し、#italicコンシリウム・ロガトルム#!を設立することで、地中海随一の富裕な商人たちを惹きつける秩序ある市場を築き上げている。この法的明瞭さにより、小さな都市国家でありながらその実力をはるかに超えた影響力を発揮し、岩だらけの岬をいかなる封建領主も容易に覆せず無視もできぬ#italicリベルタス#!の聖域へと変えたのである。"
 dal_the_union_of_the_two_souls: "2つの魂の結合"
 dal_the_union_of_the_two_souls_desc: "ダルマチア文化は、法の言語にはラテン語を、心の言語にはスラヴ語を用いる、真の二言語社会へと成熟した。この言語的柔軟性により、わが国の民はルネサンス期アドリア海の複雑な社会階層において容易にうまく立ち回ることができる。両言語を習得することで、わが国の商人と船乗りは、イタリアの都市国家とスラヴ内陸部とのあいだのあらゆる交易において不可欠な仲介者となる。この二言語主義は、国際交易と外交に独自に適応した「ダルマチアの架け橋」の文化を生み出し、わが国の民がつねに地中海商業の中心に位置することを保証している。"
 rag_the_lazzaretto_system: "ラザレット制"
 rag_the_lazzaretto_system_desc: "黒死病による度重なる壊滅的な被害に直面し、ラグーザはムルカン島とボバラ島において世界初の強制海上検疫制度を導入した。入港する乗組員と貨物を40日間（quaranta）隔離することで、他の地中海拠点が疫病で麻痺しているあいだも、港の機能を維持しつつ都市住民を保護する。公衆衛生に対するこの科学的手法により、共和国は信頼できる清潔な寄港地でありつづけ、ヨーロッパ史上最も危険な時期にあっても、人的資源と商業網を維持することができる。"
 dal_the_soldato_dalmantine: "ダルマチア兵団"
 dal_the_soldato_dalmantine_desc: "統治を強化するにあたり、我々は民衆を「国家の剣」へと変えた。わが国の男たちは精鋭のスキアヴォーニ（スラヴ人）連隊に徴募され、戦争では最前線の重装歩兵として従軍する。この兵役は人々に専門的な訓練と最新のヨーロッパ戦術に触れる機会を与え、職業軍人の文化を創出する。我々の都市は商業的な優位性を失うかもしれないが、わが国の民は地中海で最も尊敬される戦士となり、他国の管理下にあっても軍事的伝統が途絶えることはない。"
 rag_the_arsenal_expansion: "造船所の拡充"
 rag_the_arsenal_expansion_desc: "我が造船所は、大西洋やインド洋をも渡ることのできる巨大なカラック船、 #italic アルゴシー #! を建造することで名を馳せている。造船技術を標準化し、ボスニアの森から良質の樫材を確保することで、ラグーザの商船隊がアドリア海で最も技術的に進んだものであることを保証している。これらの船は莫大な積荷を運び、砲門を備え、我が商人たちが香辛料と絹の交易路を支配しつつ、ロンドンからゴアに至るあらゆる主要港で聖ブラシウスの旗を掲げることを可能にしている。"
 dal_adriatic_oak_galleys: "アドリア海のオーク・ガレー船"
 dal_adriatic_oak_galleys_desc: "地中海が火の海へと変わりつつある現状を認識し、我々は国内屈指の造船所に対し、重厚なオーク材で補強された新型の櫂船の建造を命じた。沿岸山脈の鉄のように硬い材木を利用するこれらの船は、より激しい片舷斉射に耐えることができ、大型のヴェネツィア・ガレー船が座礁するような浅くて岩だらけのカルスト地帯の入り江を航行できるように設計されている。この優位性により、我々は自国の海域を警備し、いかなる敵からも沿岸を守り抜くことができるようになる。"
 rag_the_collegium_ragusinum: "コレギウム・ラグーシヌム"
 rag_the_collegium_ragusinum_desc: "洗練の中心地としての地位を維持するため、我々はバルカンやイタリアの貴族の子息たちを惹きつける、イエズス会主導の高等教育機関コレギウム・ラグーシヌムを設立した。高度に教育された外交官、科学者、詩人の階級を育成することで、ヨーロッパの宮廷で決して引けを取らない人材をラグーザの指導層に据えるのだ。この知的投資により、我々の小さな都市は文化の中心地へと変貌を遂げ、ラテン的な論理とスラブ的な精神の融合が、アドリア海沿岸全域の文化的覚醒を牽引する学者たちを生み出している。"
 dal_morlach_frontier_levies: "モルラフ辺境召集軍"
 dal_morlach_frontier_levies_desc: "我々は内陸の勇猛なヴラフ人・スラヴ人の牧羊民、モルラック人を恒常的な軍事予備力へと組み込んだ。これらの非正規兵は常時即応を条件に土地権を与えられ、国家の目と耳として機能する。カルスト地形に精通した彼らの知識により、敵の兵站を麻痺させる奇襲や夜襲を深く敢行することができる。これにより、ダルマチア内陸部では民間人と兵士の境界が我らの防衛の名の下に完全に消え去る「武装せる国民」の文化が生まれるのである。"
 rag_the_ragusan_porto_franco: "ラグーザ・ポルト・フランコ"
 rag_the_ragusan_porto_franco_desc: "近隣諸国間の戦争が激化するなか、我々は自らの都市を厳格な中立を保つポルト・フランコ（自由港）と宣言した。外国軍艦の入港を拒否する一方で、すべての商船に高品質な修理と保管場所を提供することで、紛争が利益の増大にのみ寄与するようにしている。この「経済的非同盟」により、ラグーザは燃え盛る海における唯一の安全港となり、対立諸国が軍事的栄光を追い求めて放棄した交易路を掌握することができる。"
 dal_dalmatian_olive_pacts: "ダルマチアのオリーブ協定"
 dal_dalmatian_olive_pacts_desc: "我々は、ダルマチア沿岸の気候を活かし、経済を集約農業へと転換した。国家が監督する「農業協定」を確立することで、沿岸の丘陵地帯を大規模生産のために開拓し、起伏の多い土地を輸出品用の緑豊かな庭園へと変えた。この経済の多角化は海上交易への依存を低減させ、沿岸貴族に新たな収入源をもたらし、イタリア本土に匹敵する壮麗な夏用の別荘や都市劇場の建設を可能にしている。"
 rag_the_ragusan_maritime_insurance_code: "ラグーザ海上保険法"
 rag_the_ragusan_maritime_insurance_code_desc: "我々は世界でも先駆的な海事保険制度を確立することで、単なる海運の枠を超えた、高度な金融の世界へと進出した。モンテ・ディ・ピエタ（公益質庫）を通じ数々の商人一族が抱える不慮の危難を分散させることで、わが国の船長たちは個々の負担を最小限に抑えつつ、アメリカ大陸や極東への大胆な新航路に乗り出すことができる。この金融革新により、ラグーザの資本はつねに流動しつづけ、伝統的な地中海交易路の重要性が薄れつつあるなかでも、都市の繁栄と存在意義を維持する、自立した富の循環を生み出している。"
 #Frankokratia Shared
 frankokratia_frankokratia_advance: "フランコクラティア"
 frankokratia_frankokratia_advance_desc: "1204年におこなわれたビザンツ帝国の分割は、いまなお我らの法的基盤である。これにより我々はギリシャ世界の残存領域に対し、神に認められた恒久的な請求権を有しているのだ。我々は征服者ではなく、ラテン皇帝とヴェネツィアのドージェ（総督）によって我らの先祖に割り当てられた封土の正当なる後継者であると自認している。この法的正当性があるからこそ、我らの封建的主権を認めない地方領主たちに対し、容赦なき拡大と奪還の政策を推し進めることができるのである。"
 frankokratia_synthesized_levies_advance: "統合された召集軍"
 frankokratia_synthesized_levies_advance_desc: "圧倒的な劣勢の中で権力を維持するため、我々は現地のプロノイア制度(軍務と引き換えに土地を与える制度)を西欧の騎士保有制の伝統と統合した。これにより、ラテン王冠に忠誠を誓いながらも険しいギリシアの地形と東方の戦術に精通した#italicラティニコン#!という混成の武人階級が誕生した。これらの兵士は、フランク式突撃の重い衝撃力と、バルカンの辺境を保持するために必要な持久力・遊撃能力とを兼ね備えている。"
 frankokratia_union_of_the_soul_advance: "魂の結合"
 frankokratia_union_of_the_soul_advance_desc: "教皇の首位権を認めつつも、古来のギリシャ典礼やユリウス暦を尊重するラテン総主教を据えることで、我々は領内における「教会大分裂」の溝を埋める。この「帰一」的な妥協は、ギリシャの農民には先祖代々の儀礼を維持することを許し、都市のエリート層にはローマとの結びつきを保証することで、領内を安定させる。これにより宗教反乱の脅威は事実上無力化され、正教会の中心地を支配しつづけるための神学的正当性が得られるのである。"
 frankokratia_levantine_trades_advance: "レバント交易"
 frankokratia_levantine_trades_advance_desc: "東西が交わる地で数世紀を過ごしてきた我らの商人階級は、シルクロードからレバントの香辛料市場に至るまで、極めて複雑な交易網を渡り歩く術を学んできた。我々は、資源豊かな黒海と西ヨーロッパの手工業地帯を結ぶ不可欠な仲介者として、我らの港を経由するあらゆる取引から利益を得ている。わが国の商人たちは、エジプト人と交渉するのと同様にフランドルの織物工とも物怖じせず渡り合い、我らの港が空になることは決してない。"
 frankokratia_the_frankish_greek_symbiosis_advance: "フランクとギリシャの共生"
 frankokratia_the_frankish_greek_symbiosis_advance_desc: "我が国家の最終的な進化形は、騎士道と信仰においては文化的に #italic Latin #! 的でありながら、言語的・社会的にはギリシア住民と融合した支配階級の出現である。下級貴族の間での通婚や現地慣習の受容を促すことで、外国統治の時代を終わらせ、統一された国民的アイデンティティを築き上げた。この #italic Greco-Latin #! 文化は自らの土地に強く忠誠を誓い、西欧封建制の美点とギリシア精神の不屈さを融合させている。"
 frankokratia_the_latin_enlightenment_advance: "ラテンの啓蒙"
 frankokratia_the_latin_enlightenment_advance_desc: "数世紀にわたる闘争は、東ヨーロッパにおける独自の「啓蒙」として結実した。かつての十字軍精神は、合理主義に基づいた帝国主義的な秩序への渇望へと変わったのである。フランコクラティア諸国家はもはや単なる「十字軍の前哨拠点」ではなく、西方の技術と東方の奥深い戦略を融合させた、洗練された強力な統一勢力へと変貌したのだ。我々は文明間の確固たる架け橋——純然たる西欧でもビザンツでもない、全く新しい「第三の道」となったのである。"
 #Frankokratia Unique
 ach_assizes_of_romania_advance: "ロマニア法典"
 ach_assizes_of_romania_advance_desc: "フランク東方の封建法は、ギリシャ人農奴とフランス人領主から成る複雑な社会を管理するために体系化されており、カトリック世界において最も洗練されたものとなっている。これらの「法典」は土地紛争、相続、そして軍事的義務に対する明確な法的枠組みを与え、戦時下であっても社会秩序を揺るぎないものにしている。法を厳格に遵守することは、初期の十字軍国家を崩壊させた内部分裂を防ぎ、統治の盤石な礎となる。"
 arg_the_peloponnesian_diplomatic_hub_advance: "ペロポネソス外交拠点"
 arg_the_peloponnesian_diplomatic_hub_advance_desc: "アルゴスはペロポネソスで最も中立かつ安全な港であるため、ラテン諸国の大使たちが好んで会合する場となっている。我々はフランク領主と列強との間で条約が交渉され同盟が結ばれる恒久的な「外交地区」を設けた。列強の仲介者として、我々は大国の隣人に飲み込まれるには有用すぎる存在なのである。"
 ath_the_catalan_company_advance: "カタルーニャ大軍団"
 ath_the_catalan_company_advance_desc: "ビザンツ皇帝に雇われ、後に裏切られた獰猛な「カタルーニャ大軍団」は、かつての雇い主に反旗を翻した。1311年、キフィソスの戦いにおいてフランク人のアテネ公ゴーティエ5世・ド・ブリエンヌを打倒すると、アテネ公国の支配権を奪取し、カタルーニャによる統治時代を築き上げた。戦場で鍛え上げられたアルモガバルスの兵士たちは、より無慈悲な傭兵的気風をギリシャに持ち込み、重要拠点を要塞化し、農村部から貢納を絞り取った。彼らは恐怖による威圧と規律ある歩兵戦術を武器に、その支配を維持したが、最後には内紛とアラゴン連合の介入によって従来の封建体制へと権力が戻ることとなった。"
 bod_guardians_of_thermopylae_advance: "テルモピュライの守護者"
 bod_guardians_of_thermopylae_advance_desc: "我らが封土は史上最も名高き隘路に位置しており、我々はレオニダスの教訓を胸に、山の小道をフランク式の石造りで要塞化してきた。侵略者にとって狭隘な道は死の罠となり、断崖は我々の射手や偵察兵の絶好の見張り台となっている。ボドニツァを通過することは、鋼鉄の試練をくぐり抜けるに等しく、これによってギリシャの中心部は北方の脅威から守り抜かれているのである。"
 cep_cephalonian_raids_advance: "ケファロニアの襲撃"
 cep_cephalonian_raids_advance_desc: "ケファロニアとザキントスの統治者たちは、イオニア海の航路を無防備で航行する愚かな敵船を襲撃するという、長きにわたる略奪の伝統を築き上げてきた。島々を拠点としたこれらの襲撃は、略奪品や身代金によって莫大な富をもたらすと同時に、西エーゲ海における敵の海上兵站を弱体化させている。これにより、この小さな伯領は実力を遥かに超える影響力を発揮し、その独立を維持しつづけている。"
 crt_the_trapete_of_messara_advance: "メサラのトラペテ"
 crt_the_trapete_of_messara_advance_desc: "我々は肥沃なメッサラ平原でのサトウキビ栽培を拡大し、精製のための高度な水力製糖所(トラペテ)を建設した。クレタ産砂糖は今や欧州の宮廷が求める贅沢品となり、レヴァントの産物と直接競合している。これらの製糖所から得られる黄金が、王室の海上覇権を支えているのである。"
 lat_emperor_latins_advance: "ラテン人の皇帝"
 lat_emperor_latins_advance_desc: "我らが支配下に「フランコクラティア」が統一されたいま、わが国の宮廷はフランス・オック語圏の伝統が生んだ厳格で武骨な封建社会の階級制と、ギリシャの古く複雑な宮廷儀礼を巧みに融合させている。東方の紫の衣と威厳をまとうことで、我らはギリシャ臣民の宗教的敬意を得るとともに、西方騎士たちの騎士道精神に満ちた忠誠を維持している。この統合は、皇帝を単なる異邦の征服者から、教皇に認められ、敵に恐れられる「コンスタンティヌスの正当なる後継者」へと変貌させるのである。"
 nax_sanudos_isles_advance: "サヌードの諸島"
 nax_sanudos_isles_advance_desc: "第四回十字軍に参加したヴェネツィア貴族マルコ1世サヌードは、1207年にキクラデス諸島を征服してナクソス公国を建国し、島の要塞に拠った領主たちが交易、海賊討伐、そしてナクソス・パロス・サントリーニの肥沃な谷から収入を得る海上封建国家を築き上げた。イタリアの商業的気質とフランク式封建組織を融合させることで、サヌード家はラテン交易網の要として機能する半独立の公国を維持し、航路を守りつつ関税を徴収し、十字軍、ジェノヴァ、ヴェネツィアいずれの船にも安全な港を提供してきた。"
 neg_negropontine_navarchy_advance: "ネグロポンテの海洋統治"
 neg_negropontine_navarchy_advance_desc: "ネグロポンテの三頭領主たちは、この細長い島の領地を三家で分割しながらも、統一された海軍政策を維持することに成功している。彼らは狭いエウリポス海峡を支配し、エーゲ海と北方の港のあいだを往来するすべての船舶から通行税を徴収している。フランク人の騎士、ギリシャ人の水夫、そしてイタリア人の傭兵が乗り込む彼らのガレー船は、冷徹なまでの効率で海峡を巡回し、ネグロポンテをフランコクラティアで最も裕福かつ戦略的に重要な拠点たらしめている。"
 neo_neopatras_fortresses_advance: "ネオパトラスの要塞"
 neo_neopatras_fortresses_advance_desc: "テッサリア南部の山岳辺境において、最初はブリエンヌ家、後にアラゴン家のネオパトラス領主たちは、フランク領ギリシアで最も強固な城郭群の一つを築き上げ、繰り返し強化を加え、古代都市を敵の度重なる包囲にも屈しない実質的に難攻不落の要塞へと変えた。これらの高くそびえる城壁、深い堀、巧みに配された外郭防御施設はラテン人の不屈さの象徴となり、小さくとも意志堅固な守備隊がギリシア中央部深くまで影響力を及ぼし、敵対勢力の北進を幾世代にもわたって遅らせることを可能にした。"
 pat_the_church_state_of_saint_andrew_advance: "聖アンデレ教会公国"
 pat_the_church_state_of_saint_andrew_advance_desc: "フランコクラティアの精神的中心地であるパトラスは、神聖ローマ帝国の領主司教領にも似た、主権をもつ教会公国へと進化した。大司教は司教杖と剣の両方を手にし、宗教法と封建的な軍事義務を融合させた「防衛教会会議」を通じて自領を統治している。この独自の体制により、我らは宗教的熱狂をもって農民を動員し、あらゆる国境紛争を局地的な聖戦として正当化することができる。"
 sao_salonas_stance_advance: "サロナの姿勢"
 sao_salonas_stance_advance_desc: "サロナの山岳領主たちは、デルポイの古跡を囲むように居を構え、中央ギリシャへと続く戦略的要衝を掌握している。険しい地形、堅牢な要塞、そしてフランコクラティア全土から戦士を惹きつける武勇の伝統を武器に、猛烈な独立独歩の精神を貫いている。大国が崩壊するなかでさえ、サロナの領主たちは幾度となく敵の軍勢を撥ね退けてきた。彼らはこの高地の封土を、ギリシャにおけるラテン騎士道の安息の地へと変え、コリント湾からスペルヒオス川流域の支配を目論むあらゆる勢力にとってつねに厄介な存在でありつづけている。"
 the_the_thessalonican_crown_advance: "テッサロニキの王位"
 the_the_thessalonican_crown_advance_desc: "1204年にテッサロニキ王として戴冠したモンフェッラート侯ボニファティウスは、要衝のエグナティア街道とマケドニアの大部分を支配する北方のラテン王国を築き上げた。彼は富と戦略的重要性を兼ね備えた領土を形成し、その首都はフランク式の宮廷生活、イタリア式の通商、そしてラテン支配下における正教とカトリックの共存が華やかに交錯する中心地となった。周囲の敵から幾度となく脅かされながらも、王国の男爵たちは誇り高き武勇の伝統を堅持し、穀物やワイン、中継貿易に支えられた活気ある経済を維持した。これにより、テッサロニキはフランコクラティア随一の輝ける宝石のひとつでありつづけたのである。"
 ach_morean_silk_advance: "モレアの絹"
 ach_morean_silk_advance_desc: "ペロポネソス半島は依然としてヨーロッパ絹生産の中心地である。ビザンツの時代から継承した遺産を、フランク人諸侯が国家主導の桑園を通じて発展させたのだ。戦略的港湾を支配することで、ペルシアや中国からの高価な輸入品を価格で圧倒し、アカイア公国をフィレンツェやリヨンの衣服職人たちの主要な供給元に押し上げた。この独占のおかげで安定的に手に入る「柔らかな黄金」は、我々の傭兵の維持や山岳地帯の要塞化の資金源となっている。"
 arg_the_heraldry_of_the_brienne_advance: "ブリエンヌ家の紋章"
 arg_the_heraldry_of_the_brienne_advance_desc: "ブリエンヌ家がエルサレムとキプロスへの請求権を保持し続ける中、アルゴスは「騎士の系譜学」の中心地となった。西欧各地から騎士たちがここを訪れ、自らの家系を証明し、あるいは「十字軍辺境」における爵位を求める。高貴な生まれの冒険者たちの絶え間ない流入が、我が地方徴募兵に優秀な士官を供給し続けている。"
 ath_thebes_textiles_advance: "テーベの織物"
 ath_thebes_textiles_advance_desc: "ビザンツ時代より絹織物で名高かったテーベの工房は、フランク統治下で再び栄え、アテネ公たちはイタリア商人に織機、染色場、そしてブルージュからアレクサンドリアに至る市場へテーベ産のサミット織やビロードを運ぶ輸出網への投資を奨励している。この高級織物生産の復興は、原材料を供給するボイオティアの肥沃な平野と相まって莫大な富を生み出し、城郭建設、騎士の従者団、そしてアテネ宮廷の豪奢な暮らしを支え、この公国がフランク支配下全体で最も豊かで経済的に洗練された領土の一つであり続けることを保証している。"
 bod_the_curia_of_the_three_keys_advance: "三鍵評議会"
 bod_the_curia_of_the_three_keys_advance_desc: "北方交易路の復活によってもたらされた富を管理するため、侯国は「三鍵評議会」を設立した。国庫と法的文書はボドニツァの城砦内に封印され、開くためには侯爵、ラテン典礼の司教、そして地元ギリシャ人の市民代表がそれぞれ持つ3つの異なる鍵を使わなければならない。この原始的だが効果的な「抑制と均衡」の仕組みは、小封建国家をしばしば悩ませる横領を防ぎ、テルモピュライで徴収される重い通行税が確実に城壁のために費やされることを保証している。"
 cep_ionian_sea_wall_advance: "イオニアの海壁"
 cep_ionian_sea_wall_advance_desc: "ケファロニア、ザキントス、イタキの領主であり、アドリア海と地中海の交差点に位置する我々は、イタリア防衛の最前線としての役割を担っている。我々の海軍戦略は「接近阻止」戦に焦点を当てており、重装備の要塞と高速の偵察船を駆使して、敵がイオニア諸島の港湾を利用することを拒んでいる。我々は西方の門番であり、我々の黙認なしにアドリア海へ進入できる艦隊は存在しない。"
 crt_the_galley_assembly_line_of_suda_advance: "スダのガレー船組立体制"
 crt_the_galley_assembly_line_of_suda_advance_desc: "スーダ湾における軽ガレー船建造の部品を標準化することで、我々は互換部品による造船の先駆けとなった。これにより、他の地中海諸国よりもはるかに短い時間と費用で失われた船を補充することができる。カンディアで建造された船はその速さと、クレタ海の危険な海流を乗りこなす能力で知られている。"
 lat_hegemony_over_the_bosphorus_advance: "ボスポラス海峡の覇権"
 lat_hegemony_over_the_bosphorus_advance_desc: "黒海への狭き門を支配することで、かつて負債と海上封鎖を通じて我が運命を左右していたイタリアの商業共和国に重税を課すことが可能となった。ポントスの穀物交易とシルクロード北方終着点の富は、今やヴェネツィアやジェノヴァではなく、我が帝国の国庫に直接流れ込み、再興の資金となっている。我々は金角湾を外国商人の巣窟から、中央集権的で主権を持つ富裕な帝国の鼓動する心臓部へと変えたのである。"
 nax_archipelagic_vigil_advance: "多島海の監視"
 nax_archipelagic_vigil_advance_desc: "エーゲ海には島々が点在し、そのラテン人の統治者たちは絶え間なく警戒することを強いられている。彼らは小型ガレー船の艦隊を維持し、海賊や略奪者、そして敵であるイタリアの海洋国家を見張っている。ナクソス公とその封臣たちは、島々の守備隊、狼煙、そして迅速な連絡船による高度な体制を構築し、多島海全域の脅威に即応できるようにした。交易保護と港湾税から得られる富は、堅牢な沿岸要塞の建設を可能にし、そのためキクラデス諸島はフランコクラティアで最も安全な地域、すなわち海の防壁となっている。"
 neg_the_three_fold_defense_advance: "三重の防衛"
 neg_the_three_fold_defense_advance_desc: "エウボイア島は三つの#italicテルツィエリ#!(トリアルコス)に分割統治されており、競い合いながらも統一された防衛体制を築くことで、いずれの領主も弱体化しないようにしている。この三頭体制により、一つの要塞が陥落しても残る二つが即座に動員される、容易には崩せない軍事統治機構が成立している。トリアルコスの誰もが同輩に後れを取ることを望まぬため、この内部の競争心が我が守備隊を常に最高度の即応態勢に保っている。"
 neo_the_consulate_of_the_sea_advance: "海事領事館"
 neo_the_consulate_of_the_sea_advance_desc: "アラゴン連合王国とバルセロナの商人とのつながりを利用することで、ネオパトラスはイベリアの商品をレバントへと運び込む主要な入り口となった。我々は「海事領事館」を運営し、すべてのカタルーニャおよびスペインの商人に対し、法的保護と標準化された計量単位を提供している。この特別な関係により、ネオパトラスはギリシャの中心部にある西地中海で最も富裕な拠点となっている。"
 pat_the_pilgrimage_tolls_advance: "巡礼の通行税"
 pat_the_pilgrimage_tolls_advance_desc: "聖アンデレのものとされる遺物は、東方に安全を求める数千のカトリックの巡礼者を惹きつけており、我々は彼らを保護するべく、要塞化された「巡礼宿」の体系を構築した。通行と宿泊に対して適正な「保護料」を徴収することで、大司教区は十字軍修道士からなる常備軍の維持費を賄っている。これらの資金は都市の美化にも充てられ、そのためパトラスは「東方のローマ」とも呼ばれる、ラテン建築の象徴となっている。"
 sao_the_parnassus_mines_advance: "パルナッソスの鉱山"
 sao_the_parnassus_mines_advance_desc: "わが領内の険しい山々の懐には、デルポイの神託の時代以来忘れ去られていた金属鉱脈が眠っている。ザクセンから採掘の専門家を招き、西方の製錬技術を導入したことで、我々は「ムーサの山」を重工業の中心地へと変えた。サロナの領主たちがアテネ公にも比肩する優雅さと権勢を誇る宮廷を維持できているのは、ここの鉱山から掘り出される富のおかげなのだ。"
 the_the_fair_of_saint_demetrios: "聖デメトリオスの市"
 the_the_fair_of_saint_demetrios_desc: "我々は古代から続く宗教的定期市を、バルカン内陸部と地中海の海路を結ぶ大規模な国際交易博へと発展させた。商人たちに安全な通行を保証することで、テッサロニキは毛皮、穀物、そして西方の織物の主要な市場となった。この経済的活力により、国王は売上税や関税を通じて行政資金を賄うことができ、地方貴族を介さずとも統治することができる。"
 ach_knights_of_the_peloponnese_advance: "ペロポネソス半島の騎士"
 ach_knights_of_the_peloponnese_advance_desc: "我らの貴族は数世紀にわたり敵との国境紛争に明け暮れ、機動力に優れた騎兵隊という独自の伝統を築き上げた。これらの騎士は、フランスの先祖が用いた重苦しい馬鎧を捨て去り、険しく危険なギリシャの山岳地帯に適応した軽装鎧と戦術を採用している。これにより、従来の重騎兵を機動力で凌駕し、圧倒的な速度と精度で敵の側面を突くことが可能となった。"
 arg_the_gibraltar_of_the_levant_advance: "レバントのジブラルタル"
 arg_the_gibraltar_of_the_levant_advance_desc: "アルゴス湾のはるか高みにそびえるパラミディ要塞は、アルゴリス全域を支配下に置く7つの連結された要塞群へと拡張された。この「ジブラルタル」を支配することで、我々はモレアの軍隊に補給を試みるあらゆる艦隊の動きを意のままに制御し、この領地を陸海両面から難攻不落のものとしている。この戦略的優位性が、我々を近隣諸国におけるキングメーカーたらしめているのだ。"
 ath_the_parthenon_dukes_advance: "パルテノンの公爵"
 ath_the_parthenon_dukes_advance_desc: "アテネの初代公爵オットー・ド・ラ・ロッシュは、アクロポリスの廃墟に宮廷を構え、古代のパルテノンを聖母マリアに捧げるカトリック聖堂へと改築し、アッティカからボイオーティアに及ぶ公国を統治した。彼の後継者たちのもと、公国は意外にも文化交流の中心地となり、フランク人の騎士がギリシャ人の書記官を後援し、イタリア商人がピレウスで取引をおこない、学者が大理石の神殿を見ながら哲学を論じた。これらすべてが、騎士道の武徳と、西方の征服者たちに長らく無視されてきたギリシャの過去への理解を併せもつ、独特な貴族社会を生み出したのである。我々はこの宮廷を、かつての栄光ある姿に戻さねばならない。"
 bod_the_alpine_skirmishers_advance: "高地の散兵"
 bod_the_alpine_skirmishers_advance_desc: "カリドロモス山の岩壁に暮らすわが民は、垂直機動とクロスボウを駆使した軽歩兵戦術を発達させた。この「峠の山岳兵」たちは一斉射撃後に岩陰へと姿を消すため、伝統的な重歩兵が彼らに抗戦することは不可能だ。彼らは南方諸国の目と耳となり、北方からのあらゆる動きをいち早く知らせる役割を担っている。"
 cep_the_currant_trade_advance: "カラント貿易"
 cep_the_currant_trade_advance_desc: "イオニア諸島特有の気候は、ヨーロッパの食卓に欠かせない高級干し果物、ザンテ・カラント（小粒の干しぶどう）の大量栽培を可能にした。この独自の作物の生産と輸出を独占することで、我々は小規模な領土ながら莫大な富を生む特化型の経済基軸を構築した。ケファロニアの「カラント領主」たちは、ラテン東部において屈指の裕福な貴族に数えられている。"
 crt_the_malvasia_wine_export_advance: "マルヴァジアワインの輸出"
 crt_the_malvasia_wine_export_advance_desc: "陽光降り注ぐイダ山の斜面では、名高いマルヴァジアのブドウが栽培されており、そのブドウは北ヨーロッパの王宮で最も切望されるデザートワインへと姿を変える。輸出されるすべての樽の品質を厳格に管理し、「サン・マルコの印」を付けることで、海軍の防衛資金を賄う高価値の貿易独占体制を築き上げた。この「液体の黄金」により、カンディアは植民地でありながら、ヴェネツィア海洋帝国において最も収益性の高い宝玉でありつづけている。"
 lat_the_new_praetorian_guard_advance: "新親衛隊"
 lat_the_new_praetorian_guard_advance_desc: "古きヴァリャーグ親衛隊の伝統を継承する我らの近代的な親衛隊は、ヨーロッパ全土からのカトリック傭兵（主にフランスの退役軍人やスイスの槍兵）で構成されている。彼らが皇帝に忠誠を誓うのは、土地や称号ではなく、金と、十字軍としてのアイデンティティが理由であり、不忠な封建男爵を制圧する「鉄拳」としての役割を担っている。この常備軍は皇帝の意志を絶対のものとし、上級貴族の気まぐれに左右されない軍の中核を形成している。"
 nax_the_marble_trade_of_paros_advance: "パロス島の大理石貿易"
 nax_the_marble_trade_of_paros_advance_desc: "美術品の需要が高まるにつれ、高品質なパロス産大理石の需要はアウグストゥスの時代以来の水準にまで回復した。古代の採石場を再び開き、近代的な工学技術を導入することで、我々は一風変わった地質をエーゲ海の覇権を支える富の源泉へと変貌させた。ローマやパリの宮殿は、いまやわが領地から切り出された石材で築かれている。"
 neg_bridgehead_of_the_euripus_advance: "エウリポスの橋頭堡"
 neg_bridgehead_of_the_euripus_advance_desc: "我が島と本土を隔てる狭い海峡は中部ギリシャ最大の戦略的要衝であり、巨大な旋回橋と堅固な塔によって掌握されている。ボイオティアとエーゲ海を結ぶ物資の流れに課税することで、我らは地理上の奇異な一点を恒久的な通行税の源泉へと変えた。我らはバルカン半島における軍勢移動の鍵を握っており、その通行には高い代償を課している。"
 neo_the_great_companys_code_advance: "大軍団の規範"
 neo_the_great_companys_code_advance_desc: "この国は今なおカタルーニャ会社の民主的かつ軍事的伝統によって統治されており、士官は選挙で選ばれ、戦利品は分配される。この平等主義的な体制は、兵士一人一人が国家の存続に自らの利害を見出すことで、驚くほど高い士気を持つ軍隊を生み出している。欧州の大半が絶対主義へと向かう中、我らの『兵士の共和国』は忠誠心に厚く結束の固い戦闘集団であり続けている。"
 pat_uniate_liturgical_printing_advance: "帰一典礼の印刷"
 pat_uniate_liturgical_printing_advance_desc: "正教会の影響力に対抗するため、大司教はペロポネソス半島にギリシャ語のカトリック印刷所を初めて設立した。我々はギリシャ語を用いながらもラテン教義に準拠した聖書や礼拝式文を制作し、教養あるギリシャ人層で展開される「言葉の戦争」において、着実に勝利を収めつつある。この文化的攻勢は反乱の火種を抑え、ギリシャ人の言語的遺産を奪うことなく、彼らをラテン的社会階層へと統合している。"
 sao_the_asceticism_of_the_crissaean_crags_advance: "クリサの断崖の禁欲主義"
 sao_the_asceticism_of_the_crissaean_crags_advance_desc: "サロナの土壌は不毛で、山の影で暮らす者に山草以外の食糧をほとんど与えない。この険しい地形での生活は、飢えと辛苦に驚くほど無関心な農民と騎士階級を育んだ。我々の兵士はフランク人の重騎兵の半分の糧食で活動でき、その引き締まった体は狼のような忍耐力をもち、いかなる敵よりも速く行軍し、登攀することができる。フォキスの高い峠道において、腹を満たすものはなくとも、その決意は山そのもののように揺るぎない。"
 the_the_lombard_guard_advance: "ロンバルディア親衛隊"
 the_the_lombard_guard_advance_desc: "マケドニアの防波堤として再興された王国は、ロンバルディアや北イタリアの工兵を招き、防御施設を近代化することでその伝統を復活させた。これらの「ロンバルディア親衛隊」は軍の精鋭なる中核を担い、高度な長槍・銃兵の陣形を駆使して、迫り来る敵軍からヴァルダル渓谷を死守する。彼らの存在は、バルカンの中心部における西方軍事理論の砦という、わが国の立場を不動のものにしている。"
 ach_a_system_of_forts_advance: "要塞群体系"
 ach_a_system_of_forts_advance_desc: "他の追随を許さない我々の沿岸防衛は、イタリアの「トレース・イタリエンヌ」（星形要塞）の設計を取り入れており、敵の海上襲撃や主権領土への侵入を退けている。古い十字軍の城を近代的な砲兵要塞へと改築したことで、数ヵ月の包囲を耐え抜けるようになっており、その力はイオニア海とエーゲ海全域に及んでいる。我々の石の番人が岩だらけの岬と肥沃な谷を見守るかぎり、いかなる侵略者も海からモレアを奪うことはできない。"
 arg_the_artillery_school_of_argos_advance: "アルゴス砲術学校"
 arg_the_artillery_school_of_argos_advance_desc: "戦争の未来が「大砲」によって決まることを認識した我らは、高地の要塞を弾道学と砲術の研究室へと変貌させた。将校たちは超高高度からの射撃軌道を計算する訓練を受けており、敵艦を寸分違わぬ精度で狙い撃つことができる。「アルゴス砲術学校」の数学的精度と戦術的革新は、ヨーロッパ全土で高く評価されている。"
 ath_the_piraeus_arsenal_advance: "ピレウスの造船所"
 ath_the_piraeus_arsenal_advance_desc: "ヴェネツィアのアルセナーレを範としつつ、現代的な流れ作業の技術を取り入れた我がピレウスの新造船所は、数週間で武装を整えた軍用ガレー船を一隻産み出すことができる。この海軍戦力の工業化により、小さな公国でありながら体格以上の力を発揮し、サロニコス湾を支配する常備艦隊を維持している。ピレウスはもはや廃墟ではなく、東地中海で最も近代的な海軍基地となった。"
 bod_the_maritime_consulates_advance: "海事領事所"
 bod_the_maritime_consulates_advance_desc: "ヴェネツィアの伝統を反映し、我々はボドニツァ商人を代表してその利益を守るべく、エウボイアやアッティカの主要港に領事所を設立した。これらの事務所は情報拠点として機能し、艦隊の動向を侯爵へ直接報告する。我々は山岳国家かもしれないが、その眼差しはつねに水平線の彼方へと向けられているのだ。"
 cep_the_chancery_of_the_three_tongues_advance: "三言語の公文書局"
 cep_the_chancery_of_the_three_tongues_advance_desc: "我が行政機構は発展を遂げ、イオニア諸島の多様な商人・貴族階級を反映し、すべての布告をラテン語・ギリシャ語・イタリア語で発するようになった。この言語的包摂性は、多くの文化に開かれた安定した法秩序を求める本土やイタリア半島からの貴重な移民を引き寄せている。これにより、多様な人々が交わる海域における統治の摩擦を効果的に軽減している。"
 crt_the_cretan_labyrinth_of_fortifications_advance: "クレタの要塞迷宮"
 crt_the_cretan_labyrinth_of_fortifications_advance_desc: "新たな脅威が迫るなか、国家の技術者たちは島全体を「トレース・イタリエンヌ」（星形要塞）様式の海上要塞へと変貌させた。カンディア、レティムノ、ハニアの城壁は重砲に耐えうる土塁で補強され、ここを包囲して攻め落とそうとする侵略者は数十年にわたり苦戦を強いられることになる。この防衛施設を活用すれば、小規模の守備隊でも海からの救援を待つあいだ、数的に優勢な敵を食い止めつづけることができる。"
 lat_the_golden_gate_customs_house_advance: "黄金の門の税関"
 lat_the_golden_gate_customs_house_advance_desc: "ラテン皇帝たちは封建的な軍役賦課を超え、今や精巧な海上関税と通行税の制度に頼っている。ダーダネルス海峡やボスポラス海峡を通過する船はすべて帝国税関で停止を求められ、そこで『皇帝の十分の一税』が硬貨で徴収される。この莫大な収入により、帝国は貴族の気まぐれに頼らぬ常備の職業軍を維持することができる。"
 nax_naxian_sea_knights_advance: "ナクソスの海上騎士団"
 nax_naxian_sea_knights_advance_desc: "我らの貴族は西方世界において特異な存在である。彼らは馬をガレー船に、槍を接舷用の槍に持ち替えた騎士たちなのだ。この「海上騎士団」たちは公爵の旗印のもと東地中海をめぐり、力を以て「ラテンの平和」を現実のものにする。この攻撃的な姿勢が我らの水兵を鍛え、敵対勢力の交易を絶えず脅威に晒している。"
 neg_the_eubean_tidal_mills_advance: "エウボイアの潮汐水車"
 neg_the_eubean_tidal_mills_advance_desc: "エウリポス海峡特有の潮の満ち引きの逆転を、我が技術者たちが利用し、巨大な潮力水車の数々を動かす動力源とした。これらの機械は風の有無にかかわらず、穀物の製粉、船材の製材、鍛冶場のふいごの稼働に安定した動力を供給する。この技術的優位性により、エウボイアは地中海で最も産業の発達した島となり、海上の競争相手を生産力で凌駕できるようになった。"
 neo_the_neopatras_horse_breeding_program_advance: "ネオパトラスの軍馬育成計画"
 neo_the_neopatras_horse_breeding_program_advance_desc: "肥沃なスペルヒオス渓谷において、公爵たちはカタルーニャ種の種馬と地元のバルカン種の牝馬を交配させ、新たな軍馬の系統を育てるための王立厩舎を設立した。この結果誕生した「ネオパトラス・チャージャー」は、山岳地帯での耐久力と突撃時の衝撃力に定評がある。騎兵が有するこの優位性により、我らはテッサリアの広大な平原を支配し、敵対勢力に恐怖を植え付けることが可能となった。"
 pat_the_patrine_mint_advance: "パトラスの造幣所"
 pat_the_patrine_mint_advance_desc: "パトラスは独自の通貨「パトラス・ソルド」を鋳造する権利を獲得した。この通貨はエーゲ海全域で安定した価値を認められている。フランク人が治めるモレアの中央銀行として機能することで、大司教は俗世の諸侯に対して強大な経済的影響力を行使している。我々は銀の純度を通じて、貿易の鼓動を制御しているのだ。"
 sao_the_phocian_mule_chancery_advance: "フォキスのラバ公文書局"
 sao_the_phocian_mule_chancery_advance_desc: "わが領地の大半では車輪輸送はほぼ不可能である。そのため、山岳地帯の兵站を国有化する国営の公文書局を設立した。これにより、従来の帝国軍が岩場で飢え死にするほどの速度で、我らは補給部隊を移動させることが可能となった。"
 the_the_via_egnatia_restoration_advance: "エグナティア街道の修復"
 the_the_via_egnatia_restoration_advance_desc: "国王は、アドリア海とボスポラス海峡を結ぶ生命線である古代のエグナティア街道の全面的な再舗装と要塞化を命じた。この街道沿いに常駐の守備隊を配置することで、盗賊行為を根絶し、商人や軍隊双方の移動時間を劇的に短縮した。兵站を劇的に改善するこの妙案により、テッサロニキはラテン帝国と西欧諸国を結ぶ不可欠な架け橋としての地位を確固たるものとした。"
 ach_achaean_enlightenment_advance: "アカイアの啓蒙"
 ach_achaean_enlightenment_advance_desc: "崩壊しつつある東方の辺境から学者たちが逃れてくるなか、その多くが我々の宮廷に身を寄せており、その結果ラテン哲学とギリシャ古典の知識が独特な形で融合した。諸侯たちの庇護のもと、東方と西方双方の賢者の著作を並行して研究する学府が設立され、文化的再興が巻き起こっている。この知的開花に惹かれてヨーロッパの優秀な人材が集まり、わが国は行政および科学の進歩の最前線に立ちつづけられる。"
 arg_argive_maritime_insurance_advance: "アルゴスの海上保険"
 arg_argive_maritime_insurance_advance_desc: "安全な港としての地位を活かし、ナフプリオの商家たちはエーゲ海交易のための精巧な海上保険と危険分担の仕組みを発展させた。海賊や嵐からラテン勢の積荷の安全を保証することで、我が港はペロポネソスの金融上の避難港と化した。この初期の金融資本主義の形態は、イタリアの大諸共和国から資本を引き離し、我が地元の銀行へと集中させている。"
 ath_the_athenian_bureaucracy_advance: "アテネの官僚制度"
 ath_the_athenian_bureaucracy_advance_desc: "統治者が絶対的統治へと移行するにつれ、彼らは対立の絶えない封建領主を、都市のブルジョワジーから能力本位で選ばれた官僚に置き換えた。この中央集権的な行政機構により、税は効率的に徴収され、統治者の法はマラトンからメガラに至るまで均一に施行される。旧来の男爵家の権力を打破することで、わが国は迅速な動員が可能な合理化された近代国家へと変貌を遂げた。"
 bod_the_spercheios_civil_chancellery_advance: "スペルヒオス民政公文書局"
 bod_the_spercheios_civil_chancellery_advance_desc: "ボドニツァ侯領は単なる辺境の監視塔から中央ギリシャの行政中枢へと発展し、封建的な気まぐれから専門化された官僚制度への転換を余儀なくされた。スペルヒオス渓谷を見下ろす大公文書局の設立は、中央集権的な近代国家への移行を象徴している。そこでは旧来のフランク人男爵の特権が、フォキス中心地の複雑な通行税や土地登記を管理するため法律の教育を受けた「文官騎士」の幹部層に取って代わられることとなった。"
 cep_the_arsenal_of_argostoli_advance: "アルゴストリの造船所"
 cep_the_arsenal_of_argostoli_advance_desc: "我らはアルゴストリの天然の深水湾を一流の海軍修理拠点へと変貌させた。ヴェネツィアの巨大なアルセナーレとは異なり、我がものはエーゲ海での襲撃に用いられるブリガンティンやガレオットといった小型船の迅速な修理に特化している。この専門化された造船所のおかげで、我が艦隊は競争相手よりも長く洋上にとどまることができ、地域の海軍優勢を確かなものにしている。"
 crt_the_council_of_the_two_peoples_advance: "二民族評議会"
 crt_the_council_of_the_two_peoples_advance_desc: "外部からの侵入と内部の反乱という絶え間ない脅威により、カンディアのラテン王たちは征服初期の厳格な分離政策を放棄した。我々は「大評議会」を設立し、古代ヴェネツィア系貴族とギリシャ正教の地主上流階級である「アルコンテス」がともに議席を占める体制を確立した。この共同統治により統一された行政基盤が形成され、西方の軍事的伝統は現地ギリシャ官僚機構の深い基盤によって支えられることで、島はいかなる征服者にとっても安定した、難攻不落の要塞でありつづけている。"
 lat_codex_latinus_advance: "ラテン法典"
 lat_codex_latinus_advance_desc: "皇帝の命により法体系が全面的に見直された結果、ユスティニアヌス法典とフランク流のロマニア法典が統合され、単一の法体系となった。この「ラテン法典」はフランク人とギリシャ人の法的な区別を撤廃し、皇帝の法のもと単一の帝国市民階級を創出した。この法的な統一は旧来の封建秩序に終止符を打ち、真に中央集権化された絶対君主制への道を切り開くものであった。"
 nax_aegean_waystation_networks_advance: "エーゲ海の中継基地網"
 nax_aegean_waystation_networks_advance_desc: "世界貿易の時代において、我らの島々は地中海に不可欠な中継基地となり、長距離航行船に真水、造船材、塩漬け肉を供給している。20余りの島々の港湾施設を標準化することで、我々のもてなしを受けたい商船は対価を支払うという体制を整えた。この兵站網により、我らはエーゲ海内経済の絶対的な支配者となっている。"
 neg_the_triarchic_naval_academy_advance: "三頭制海軍学校"
 neg_the_triarchic_naval_academy_advance_desc: "艦隊の質を保証するため、島の三領主は海軍将校と航海士の養成学校を共同設立した。学生たちは最新の天文航海術と海事法を学び、エウボイアの全船長ははみな最高水準の専門家となる。この海軍教育への注力により、わが艦隊は海上戦闘と探検の最前線に立ちつづけることができる。"
 neo_the_ordinance_of_the_viles_noves_advance: "ヴィレス・ノヴェス条例"
 neo_the_ordinance_of_the_viles_noves_advance_desc: "この国家は、カタルーニャの計画的な要塞村落を範とした『新しい町』(カタルーニャ語でヴィレス・ノーヴェス)へと、散在する山岳住民を集住させる政策を進めてきた。これらの町の統治は『炉辺の執政官』に委ねられ、この官吏は厳しい冬に備えて共同の薪燃料と穀物貯蔵を管理する任務を負う。高地の熱源と糧を掌握することで、我が支配は独立した山岳領主の時代を事実上終わらせ、彼らを合理化された都市的官僚機構に置き換えている。"
 pat_the_seminary_of_diplomats_advance: "外交官養成神学校"
 pat_the_seminary_of_diplomats_advance_desc: "大司教は聖職者に国際交渉と秘密書簡の技術を教える学校を設立した。我が『黒衣の外交官』たちは欧州各国の宮廷に仕え、ラテン東方の耳目となっている。こうした書簡と密談を通じ、パトラスは近隣の王国さえ羨むほどの対外的影響力を手にしている。"
 sao_the_parnassian_wolf_pacts_advance: "パルナッソスの狼協定"
 sao_the_parnassian_wolf_pacts_advance_desc: "移ろいゆく力関係の中で、サロナは単純な封建誓約を超え、『狼の盟約』として知られる略奪的な法理論を採用するに至った。近隣諸国を、生き延びるためにサロナという『アルファ』の保護を必要とする『従属する獲物』と法的に定義することで、我らは介入と併合のための恒久的な外交的口実を作り出している。この略奪的外交により、『防衛的統合』の名目の下で小領主や辺境の封土を吸収することが可能となり、バルカン半島におけるラテン勢の存在が、散らばり脆弱な群れではなく、鋭い牙を持つ単一の勢力によって率いられることを確かなものにしている。"
 the_the_macedonian_fur_trade_advance: "マケドニアの毛皮交易"
 the_the_macedonian_fur_trade_advance_desc: "我が猟師たちは北方山岳地帯の広大な原野に進出し、イタリアやフランスの贅沢品市場向けに上質な毛皮の有利な交易を築き上げた。罠猟の季節を規制し、ドナウ川へ至る交易路を保護することで、王室財庫のための『毛皮の黄金』の安定した供給源を確保した。この産業が、彼方で台頭しつつある諸侯国に対抗する我が北方要塞の近代化を支えている。"
 ach_villehardouins_valor_advance: "ヴィルアルドゥアンの義勇"
 ach_villehardouins_valor_advance_desc: "シャンパーニュの元帥であり第4次十字軍の目撃者であるジョフロワ・ド・ヴィルアルドゥアンは、古フランス語による最古の俗語歴史書のひとつを執筆し、仲間たちの武勇とコンスタンティノープル陥落を、鮮烈で英雄的な散文によって不朽のものとし、その著作は西ヨーロッパの貴族階級に広く流布した。彼の年代記は単なる記録にとどまらず、プロパガンダとインスピレーションとしても役に立ち、苦境にあるラテン諸国を補強するために新たな騎士や巡礼者を呼び寄せると同時に、散り散りになったフランク人の領主たち——元々の軍勢が解散した後も長く、分裂派や異教徒に対抗し神の境界を守る十字軍の戦士だと自認しつづけた者たち——のあいだに、騎士道的な同胞意識を育んだのである。我らの軍が試練に直面するいまこそ、その精神を取り戻す時である。"
 arg_the_curia_of_the_two_benches_advance: "二座式法廷"
 arg_the_curia_of_the_two_benches_advance_desc: "社会の安定に向けた大胆な方策として、ナウプリア高等法院を「二座式法廷」へと改革した。この司法機関は、土地や相続に関するすべての民事事件を、フランク人判事1名とギリシャ人のデモゲロン（長老）1名からなる合議制で審理することを義務づけている。この「共有の正義」を制度化することで、ラテン人と正教徒のあいだで何世紀も続いた法的な摩擦を事実上解消した。この統治体制は、領主への忠誠心が極めて強く、ヨーロッパ各地を席巻する革命の熱狂から国家を守る、独特の「アルゴスのアイデンティティ」を生み出した。"
 ath_the_attican_gunpowder_mills_advance: "アッティカの火薬製造所"
 ath_the_attican_gunpowder_mills_advance_desc: "我が砲兵は今や世界随一であり、世界的に名高い名匠たちの冶金の秘伝と、我が地元の錬金術師たちの化学的革新の恩恵を受けている。『アテネの雷鳴』はバルカン半島全域に轟き、我が大砲はその射程と信頼性ゆえに高く評価されている。"
 bod_the_oeta_riflemen_advance: "イティのライフル連隊"
 bod_the_oeta_riflemen_advance_desc: "火薬の時代を迎え、オイタ山地の屈強な木こりたちは専門の軽歩兵部隊へと編成された。これらの銃兵は奇襲と離脱の戦術に長け、急峻な地形を利用して侵攻してくる縦隊を致命的な精度で苦しめる。彼らはギリシャ北部の峠を突破しようとするいかなる将軍にとっても悪夢である。"
 cep_the_ionian_merchant_experts_advance: "イオニアの商務専門家"
 cep_the_ionian_merchant_experts_advance_desc: "我々は地元の商人に広範な特権を与え、収益性が極めて高い輸出入を管理する自治的な交易会社を設立させた。この商業的自治は富裕な都市階級を育み、伯領の近代的な行政改革を支える資金源となっている。"
 crt_academy_of_the_stratioti_advance: "ストラディオットの学校"
 crt_academy_of_the_stratioti_advance_desc: "屈強なクレタの山岳民は、西方の規律とバルカン国境地帯の遊撃戦術を融合させた精鋭軽騎兵軍団へと統合された。我々は恒久的な訓練場を設置し、ここでサーベルとカービンの技法を学ぶ地元貴族の息子らとラテン人入植者は、島の内陸部を防衛する。これらの部隊はいまや精鋭傭兵として諸国に輸出され、軍事的威信と収益を安定的にもたらしている。"
 lat_the_order_of_the_star_of_the_east_advance: "東方星勲位"
 lat_the_order_of_the_star_of_the_east_advance_desc: "皇帝は、世襲爵位を功績に基づく貴族制に置き換える高等勲位を創立し、帝国の指導者がその才能によって選ばれることを保証した。この勲位への叙任は国内最高の栄誉であり、ラテンの玉座の栄光を広げた将軍、外交官、学者に授与される。この制度は皇帝の恩寵に完全に依存する忠誠派の上流階級を生み出し、君主による国家統制を確固たるものとしている。"
 nax_the_aegean_hydrographic_bureau_advance: "エーゲ海の水路局"
 nax_the_aegean_hydrographic_bureau_advance_desc: "世界的な探検のため正確さが求められる時代において、ナクソス公たちは地中海の海図作成と海洋科学の一大拠点を設立した。最高水準の天文学者と時計職人を雇い、キクラデス諸島のあらゆる岩礁、海流、風向を図文化することで、我々の航海図は世界で最も求められる道具となった。この科学的卓越性により、ナクソスの船長は夜間や嵐のなかでも危険なエーゲ海を航行でき、我らの商船隊と軍艦隊はいかなる外国の侵入者に対しても、速度と安全性の面で決定的な優位性を確保している。"
 neg_the_glassworks_of_chalkis_advance: "ハルキスのガラス工場"
 neg_the_glassworks_of_chalkis_advance_desc: "我が浜辺の良質な珪砂と沿岸の工場から得られるソーダ灰を用い、我らはムラーノに匹敵するガラス製造業を築き上げた。我が鏡とステンドグラスはラテン帝国や西方の大宮殿に輸出され、島に莫大な富をもたらしている。この贅沢品交易への課税が、火薬の時代における我が巨大な沿岸城壁の維持費を賄っている。"
 neo_the_academy_of_administration_advance: "行政学校"
 neo_the_academy_of_administration_advance_desc: "ネオパトラスは、世襲の「総督」たちを、専門の行政リュケイオンの卒業生に置き換える必要がある。候補者は我が国の民法と最新の統治技術についての知識を試され、国家の官吏が剣だけでなく羽根ペンにも精通していることを保証する。この「生まれより功績を」という転換は、ネオパトラスを中央ギリシャで最も効率的に統治される領域へと変え、正確な人口調査と迅速な徴税を可能にした。"
 pat_the_port_of_sanctuary_advance: "聖域港"
 pat_the_port_of_sanctuary_advance_desc: "我らの港は「中立の聖なる港」と宣言され、カトリック、正教、その他いずれの国の商人であっても安全に交易できる。この聖域としての地位により、我らの港は地中海交易における主要な中立地帯となった。たとえ全面戦争の最中であろうとも、大主教の禁令に守られ、パトラスの交易は途絶えることなく続く。"
 sao_the_legacy_of_the_alpha_protector_advance: "アルファ守護者の遺産"
 sao_the_legacy_of_the_alpha_protector_advance_desc: "「狼協定」は論理的な帰結に達した。この覇権体制は、東地中海における公認の「アルファ」である。我らはもはや侵略を正当化する必要はない。レバントを「監視」するという当然の使命を遂行するのみである。この戦力投射により、ギリシャ海域はこれからもサロナの商人たちの私有湖でありつづけるのだ。"
 the_the_university_of_thessalonica_advance: "テッサロニキ大学"
 the_the_university_of_thessalonica_advance_desc: "テッサロニキは、多様な学問分野の研究をおこなう王立大学を創設した。イタリアの理論とバルカン地方での現地経験を融合させたこの機関は、フランコクラティアにおいて屈指の優秀な学生を輩出し、驚異的な成果をあげている。卒業生はラテン世界全域で高い需要があり、王国は革新の知的中心地となっている。"
 #Greek Shared
 greek_group_the_spirit_of_resistance_advance: "抵抗の精神"
 greek_group_the_spirit_of_resistance_advance_desc: "十字軍によるコンスタンティノープルの陥落は、ローマの魂の終焉ではなく、その試練の場であった。分裂状態にあるテマ全域で、ラテンの「フランコクラティア」に屈することを拒む激しい「エスノス」が形成されはじめている。この反抗的姿勢は精神的・物理的な動員へと発展し、あらゆる村が十字軍領主に対する抵抗の拠点と化している。我々は独自の儀礼と言語に固執することで、局地的な小競り合いを正当な遺産回復のための聖戦へと昇華させるのだ。"
 greek_group_hesychast_traditions_advance: "ヘシカズムの伝統"
 greek_group_hesychast_traditions_advance_desc: "政治的衰退の時代において、グレゴリオス・パラマスが提唱したヘシカズム（静寂主義）の精神的運動は、深い内面的な強さを与えてくれる。沈黙の祈りを通じて「非造成の光」に集中することで、わが民は崩壊しつつある国境や帝国の陰謀を超越した結束を見出している。アトス山の修道院はギリシャ世界の精神的中枢となり、教皇の使節もスルタンのイェニチェリも、わが民の宗教的結束を乱すことはできない。"
 greek_group_stratioti_levies_advance: "ストラディオットの召集軍"
 greek_group_stratioti_levies_advance_desc: "バルカン半島の険しい地形は、ストラディオットという独自の戦士階級を生み出した。この軽騎兵はビザンツの鎧と現地の装束を組み合わせて着用していることが多く、より大規模で動きの鈍い西方やオスマン軍を撹乱するのに不可欠な奇襲戦術の達人である。その獰猛さと優れた偵察能力は広く知られ、重騎士が苦戦する山岳地帯の戦闘において戦局を逆転させることができる。彼らはギリシャ軍事復興の先駆者とも言える存在なのだ。"
 greek_group_the_phanariote_network_advance: "ファナリオットの通信網"
 greek_group_the_phanariote_network_advance_desc: "ファナール地区の狭い通りの中で、ギリシャ人商人外交官という新たな階層が台頭してきた。読み書きの能力と語学の才を活かし、これらの家門は地中海諸強国の行政機構に欠かせぬ存在となった。彼らは通訳、総督、金融家として仕え、ドナウ川からナイル川にまで及ぶ影の勢力圏を築き上げている。彼らの秘密の書簡は、我が国に比類なき情報と外交上の切り札をもたらしている。"
 greek_group_aegean_coastal_defence_advance: "エーゲ海沿岸の防衛"
 greek_group_aegean_coastal_defence_advance_desc: "エーゲ海の鋸状の海岸線と数千の島々は、わが国の天然の要塞である。我々は海洋文化を防衛戦略へと転換し、その結果すべての商船は武装し、あらゆる漁師は潜在的な海兵となった。狭い海峡や隠れた入り江を巡回することで、我々の海域を通過しようとする敵対艦隊はつねに妨害を受ける。この分散型の海軍力により、我々の海洋中枢を占領することはほぼ不可能である。"
 greek_group_the_modern_greek_enlightenment_advance: "近代ギリシャの啓蒙"
 greek_group_the_modern_greek_enlightenment_advance_desc: "「ディアフォティスモス」は、哲学が生まれた地に西方の科学的探求の炎を再びもたらした。ギリシャの知識人たちは数千冊の書物を故郷へ送り届け、大規模な教育改革を巻き起こしている。この運動は古い迷信を、自由、平等、そして再興されたギリシャ的アイデンティティという理想に置き換えた。その結果としてもたらされた民族覚醒は、わが臣民を近代的な啓蒙国家のために戦う市民へと変貌させた。"
 #Greek Unique
 epi_the_eagle_of_the_pindus_advance: "ピンドスの鷲"
 epi_the_eagle_of_the_pindus_advance_desc: "荒れ狂う雨に打たれるピンドス山脈の険峰において、エピロス専制君主たちはいかなるラテン軍も侵入できない聖域を築き上げた。我々は「山岳伏撃戦」の技術を極め、領土の垂直地形を利用して狭隘な峠道で数倍の軍隊を包囲殲滅する。この環境を支配する力により、わが国全体が侵略者にとっての死の罠と化しており、平野が陥落しようとも山々は永遠にギリシャのものでありつづけるのだ。"
 feo_gothic_hellenic_synthesis_advance: "ゴシック・ヘレニックの融合"
 feo_gothic_hellenic_synthesis_advance_desc: "クリミア山脈の孤立した地において、クリミアゴート族の残党と現地のギリシャ人住民が、ひとつの強靭なアイデンティティへと融合した。この文化は、北方の禁欲的で勇ましい伝統と、南方の行政・海運における卓越性が組み合さったものである。この「テオドロ」精神こそが我々の最大の防衛力であり、自らをローマ国境の最後の守護者とみなし、独自の生活様式を守るため最後の一人まで戦う民衆を生み出している。"
 gre_restoration_of_power_advance: "権力の回復"
 gre_restoration_of_power_advance_desc: "第4次十字軍の混乱を生き抜くため、散り散りになったギリシャの断片は、単一の絶対的なバシレウスという原則に立ち返らねばならない。我々がラテン人に少しずつ征服されていったのは、地方のアルコン間の対立が原因である。我々はこれを解消し、絶対的な忠誠を命じる中央宮廷を再建した。この権力の中央集権化により、国家はひとつの声で語り、一本の剣で行動し、かつて帝国を疲弊させた内部抗争は抑制される。"
 moe_the_court_of_mystras_advance: "ミストラの宮廷"
 moe_the_court_of_mystras_advance_desc: "コンスタンティノープルと同様に、丘の都市ミストラはヘレニズム文化の第一の中心地として台頭し、帝国随一の学者、芸術家、神学者たちをその陽光降り注ぐ斜面へと引き寄せている。カンタクゼノス家とパレオロゴス家の専制侯たちは、古典ギリシャ哲学の研究と正教神秘主義とを融合させる活気ある知的雰囲気を育んでいる。この #italic ミストラ・ルネサンス #! により、専制侯国はもはや単なる辺境の前哨地ではなく、それ自体が威信ある首都となり、地中海各地から外交官や思想家を引き寄せる求心力を持つに至った。"
 ths_the_wallachian_scutari_advance: "ワラキアのスクタリ"
 ths_the_wallachian_scutari_advance_desc: "第4回十字軍後の混乱期、テッサリアの統治者たちは減少した兵力を補うため、大ワラキアの半遊牧民であるヴラフ族に目を向けた。兵役と引き換えに、この勇猛な牧畜民たちの自治権と放牧権を認めることで、専制公国は険しいピンドス山脈で活躍する忠実な軽歩兵と散兵を確保した。機動力と強烈な突撃戦術で知られる彼らは、ラテン騎士とエピロスの敵勢力に対する主要な抑止力となり、山岳の峠道をあらゆる侵略者にとっての死の罠へと変えた。"
 epi_balkan_marriages_advance: "バルカンの婚姻"
 epi_balkan_marriages_advance_desc: "エピロスはギリシャ、スラヴ、ラテンの各世界が交わる要衝に位置し、我らは王家の娘たちを最も有能な外交官へと変えてきた。セルビア王、アルバニア族長、さらにはイタリアの伯爵たちとの複雑な戦略的婚姻網を通じて、我らはドゥーカス・コムネノス家をバルカン政治における不可欠な調停者とした。これらの血縁関係は、我らが戦に赴くとき、敵の側面を突いてくれる強力な同盟者を欠くことがないことを保証している。"
 feo_the_bastion_of_mangup_advance: "マングプの砦"
 feo_the_bastion_of_mangup_advance_desc: "我々の首都マングプ・カレは、山を削って築かれた要塞であり、包囲兵器を一切寄せ付けない断崖絶壁に囲まれている。我々はこれらの天然の防塞を、一連の精巧なトンネル、貯水槽、隠された出撃用門で拡張し、必要であれば都市が数年間持ちこたえられるようにした。この難攻不落の拠点のおかげで、たとえわが国がキプチャクに荒らされようとも、公国の心臓部は安全が保たれ、北方のすべてのキリスト教徒にとって希望の灯台としての役割を果たす。"
 gre_rebuilding_the_theme_system_advance: "テマ制の再建"
 gre_rebuilding_the_theme_system_advance_desc: "我々は兵力不足の解決策を、中期ビザンツ帝国の黄金時代に求めた。「アクリタイ」（辺境守備隊）に対し、永続的な兵役と引き換えに世襲の土地を与えることで、守る土地に深く根ざす自立した防衛軍を創出したのだ。この制度により、高額な傭兵への依存度が減り、各州が主力帝国軍到着まで防衛線を維持できる専属民兵の確保が可能となった。"
 moe_reclaiming_the_peloponnese_advance: "ペロポネソス半島の奪還"
 moe_reclaiming_the_peloponnese_advance_desc: "ビザンツ帝国がモネンバシア、マイナ、ミストラの要塞を奪還した後、モレア専制公国はフランク諸侯国を相手取り、長期にわたる半島の「再征服」に専念した。この戦役は単なる包囲戦ではなく、文化的な破壊工作でもあった。ギリシャ人行政官は現地住民に対し、ラテン人領主への反乱を促し、「正当な統治者」への帰順を働きかけた。戦略的な婚姻、執拗な小競り合い、封建領地の段階的吸収を組み合わせることで、モレアは断片化された土地を徐々に結束した州へと編み上げていく。"
 ths_meteora_sanctuaries_advance: "メテオラの聖域"
 ths_meteora_sanctuaries_advance_desc: "バルカン半島の不安定さが増すなか、テッサリアの専制君主は修道院群の建設を後援した。メテオラの険しい砂岩柱の上に建つ「空中の修道院」は二重の目的を果たすもので、正教信仰の精神的灯台になると同時に、国家の富や聖遺物を略奪する傭兵から守る高地の宝庫としての役割も果たすのだ。地域の精神的権威をこうした守りやすい位置に集中させることで、専制公国は中央政府が危機に瀕しても、現地のアイデンティティは正教に繋ぎ止められる。"
 epi_arvanite_communities_advance: "アアルヴァニティーの共同体"
 epi_arvanite_communities_advance_desc: "減少する人口を補うため、我らは勇猛なアルヴァニア人の諸氏族を招き、エピロスとアカルナニアの肥沃な谷間に定住させた。土地と自治を与える見返りに、これらの戦士たちは我らに、バルカン辺境の過酷な近接戦闘に秀でた、疲れを知らぬ軽歩兵戦力をもたらす。彼らの独特な尚武の文化は、我らローマの軍事伝統と融合し、極めて忠実でありながら、戦闘の衝撃において恐るべき攻撃性を発揮する混成部隊を生み出している。"
 feo_black_sea_fur_trade_advance: "黒海の毛皮交易"
 feo_black_sea_fur_trade_advance_desc: "我らは小国でありながら、ロシアの広大な毛皮産出林と地中海市場とを結ぶ要衝の港を掌握している。我らは現地のタタール・ハーンたちと交渉し、黒海を渡るこれら毛皮の唯一の輸送権を獲得した。この独占による利益は、ジェノヴァ人技師やビザンツ人学者を雇う費用を賄い、我が小さな公国を草原地帯における富と洗練の中心地たらしめている。"
 gre_greek_viticulture_advance: "ギリシャのブドウ栽培"
 gre_greek_viticulture_advance_desc: "我々はギリシャ農業に革命をもたらし、自給自足農業から、名高いマルヴァジアワインや天日干しカラントといった高付加価値の輸出作物へと転換した。近代的な灌漑と加工技術への投資により、我々の農産物はヨーロッパ高級品市場の主要交易品となった。この経済的繁栄により、職業軍人で構成される常備軍を設立し、西方の偉大な王たちに匹敵する華やかな宮廷を維持することが可能となった。"
 moe_plethons_vision_advance: "プレトンの構想"
 moe_plethons_vision_advance_desc: "哲学者ゲオルギオス・ゲミストス・プレトンのミストラ宮廷への赴任は、モレアのアイデンティティに根本的な転換をもたらした。彼は古代スパルタの法と社会構造への回帰を提唱したのである。プレトンは、頼りにならない傭兵の代わりとして、ギリシャ人による国家軍隊の創設を提唱し、キリスト教の信仰だけではなく、ヘレニズムの伝統に基づいた社会秩序を主張した。この原始的な国家主義の覚醒は、専制公国に強力なイデオロギーの武器を提供し、モレア防衛をギリシャ民族そのものの存続をかけた聖戦へと変貌させる。これにより、たとえキリスト教信仰を続けたとしても、我々の統治家の威信は高まるだろう。"
 ths_thessalian_horse_breeding_advance: "テッサリアの軍馬育成"
 ths_thessalian_horse_breeding_advance_desc: "ラリッサとトリカラを取り巻く広大で肥沃な平原は、山々に囲まれたこの地域において独自の地理的優位、すなわち大規模な馬の飼育を可能にする。古代テッサリア騎兵の遺産を受け継ぎ、専制侯たちは国営の種馬牧場を設立し、多様な地形を越えて武装騎手を乗せられる頑健で俊足な馬を生産している。この投資は専制侯国の軍事力を一変させ、敵の騎士とも渡り合える正規の騎兵隊を編成することを可能にし、国家に開戦場における決定的な攻勢の手段を与えるであろう。"
 epi_adriatic_gatekeepers_advance: "アドリア海の門番"
 epi_adriatic_gatekeepers_advance_desc: "ヴァロナとブトリントの港を確保することで、エピロスはアドリア海の番人として君臨している。我らはこの地位を活かし、レヴァントへ至るために我らの勢力圏を通らねばならぬヴェネツィアやイタリア諸都市国家と有利な通商条約を結んできた。的確な関税の徴収と海賊からの「保護」提供により、我らはかつて孤立していた専制侯国を、東西を結ぶ豊かな商業の要衝へと変貌させたのである。"
 feo_the_northern_star_of_greece_advance: "ギリシャの北極星"
 feo_the_northern_star_of_greece_advance_desc: "北方における主たるギリシャ語圏国家として、テオドロは宗教的抵抗と文化的存続の象徴となった。我らは我が公を #italic ポントス・ギリシャ人の保護者 #! と定め、遠方より移民や学者を引き寄せている。この威信は国境を越えた道義的権威を我らに与え、ギリシャ正教の #italic 北の星 #! として、壮大な宗教闘争における重要な一勢力たらしめている。"
 gre_the_new_stratikon_advance: "新ストラティコン"
 gre_the_new_stratikon_advance_desc: "火薬がヨーロッパの戦場を変革するなか、我々は西洋式マスケット銃の訓練法を伝統的戦術教範と融合させた。我々の歩兵部隊「新ストラティコン」は、古代ファランクス隊の伝説的な頑強さを模倣しつつ、現代の火縄銃と槍で武装し、砲火下でも厳格な規律を維持するよう訓練されている。この兵士の専門職化により、我々はもはや中世の遺物ではなく、いかなる帝国とも互角に戦える近代的な軍事大国となったのである。"
 moe_the_hexamilion_modernization_advance: "ヘキサミリオンの近代化"
 moe_the_hexamilion_modernization_advance_desc: "コリントス地峡が半島への玄関口であることを認識したモレア国家は、ヘキサミリオンの防壁の再建と近代化に多額の投資をおこなう。火薬を用いた新たな要塞技術を活用し、この古代の防壁を近代的な帝国の包囲に耐えうる洗練された要塞、砦、砲台群へと変貌させ、これをわが国の全土で再現する。この「ギリシャの万里の長城」は防衛戦略の礎となり、専制公国が突破不可能な防衛線の後方から安全に軍事力を投射することを可能にし、り侵略者は時間と費用がかかる海上封鎖を強いられることになる。"
 ths_raiders_of_the_pindus_advance: "ピンドスの襲撃者"
 ths_raiders_of_the_pindus_advance_desc: "北ギリシャで生き残るには、伝統的なビザンツ式野戦戦術からの脱却と、洗練された遊撃戦体系の採用が不可欠である。テッサリアの軍事教義は、ピンドス山脈の深い渓谷と密林を利用して、絶え間ない攪乱攻撃で敵の補給線を枯渇させるクレフテス（山賊）的戦術に重点を置く方向へ進化するのだ。このゲリラ的抵抗への文化的転換は、すべての羊飼いが偵察兵となり、あらゆる山道が伏撃地点となるということを意味しており、占領軍はこれに対処しなければならない。テッサリアの征服を企む帝国にとっては、兵站上の悪夢となるだろう。"
 epi_fortresses_of_ioannina_advance: "ヨアニナの要塞"
 epi_fortresses_of_ioannina_advance_desc: "ヨアニナの街は真の要塞へと変貌を遂げた。最新のイタリア軍事工学を駆使し、我らは首都とその湖を、数か月に及ぶ砲撃にも耐え得る連結式の稜堡と水上要塞の連なりで包囲した。この防衛網は我が国家戦略全体の要となり、戦況が開戦場で我らに不利に傾いたときはいつでも、難攻不落の中核へと退くことを可能にする。"
 feo_the_gothic_red_guard_advance: "ゴート赤衛隊"
 feo_the_gothic_red_guard_advance_desc: "我々はゴート族の祖先から伝わる古く厳しい伝統と、ローマの規律ある軍事教範を融合させ、「赤衛隊」を結成した。この精鋭突撃部隊はクリミアのなかでも特に標高の高い山岳村落からのみ選抜され、要塞の漆黒のトンネルや海岸の閉塞的な峡谷で戦うための訓練を受けている。重槍と火打石式の最新式拳銃を装備した彼らは、奇襲で不意をつき敵を壊滅させる達人である。捕虜を取らず、決して退却しないという評判から、ユークシン海（黒海）沿岸で最も恐れられる歩兵部隊としての地位を確立し、極限まで鍛え抜かれた連隊の士気さえも挫く力を有している。"
 gre_the_hellenic_admiralty_advance: "ギリシャ提督府"
 gre_the_hellenic_admiralty_advance_desc: "統一されたギリシャが東西の巨大勢力のあいだで生き残るためには、「内海」を支配しなければならない。我々はピレウスに中央集権的な海軍本部を設立し、造船の規格を統一して、最新の航海科学に基づき専門的な将校団を育成している。ガレー船の機動性とガレオン船の火力を融合させることで、エーゲ海の風の中でも機敏に動き、地中海の大海原では圧倒的な破壊力を発揮する艦隊を作り上げた。"
 moe_the_silk_road_of_morea_advance: "モレアのシルクロード"
 moe_the_silk_road_of_morea_advance_desc: "地元経済の長年の支柱であったペロポネソスの絹産業は、17世紀、専制侯国の拡大する軍事的野心を賄うため、国家主導による大規模な拡張を遂げた。ヴェネツィアの熟練織工やジェノヴァの染色職人を首都ミストラに招き入れることで、専制侯たちは高級織物加工における外国の独占を打破し、桑の栽培から完成した錦織に至るまで、価値連鎖全体をギリシャの国境内に留めることに成功した。この経済保護主義は、モレアを欧州啓蒙主義の奢侈需要と東方の原材料とを結ぶ重要な「絹の拠点」へと変えるであろう。その結果生じる関税と通行税の増収は、農民に過度の負担をかけることなく、近代的官僚機構と常備軍を維持するために必要な金を国庫にもたらすであろう。"
 ths_armatole_administration_advance: "アルマトロス行政"
 ths_armatole_administration_advance_desc: "辺境地帯の無法状態と盗賊の台頭に対抗するため、テッサリア国家は地方指導者に対し、特定区域における公式な軍事管轄権を付与する「アルマトロス」の制度を確立した。この行政層は中央の専制君主と農村農民のあいだの隔たりを埋める架け橋となり、徴税と国内治安維持を担う規律ある準軍事階級を形成する。かつての無法者を国家公認の治安維持部隊へと転化させることで、専制公国は国内の安定化を達成し、再び経済を成長させ、より中央集権的な統治形態を実現するだろう。"
 epi_the_sublime_diplomacy_advance: "卓越した外交"
 epi_the_sublime_diplomacy_advance_desc: "強大な敵国に囲まれながら数世紀を生き延びた結果、わが国の外交団は世界で最も洗練されたものへと鍛え上げられた。我々は「強さに基づく中立」の教義を確立し、列強をを巧みに対立させることで、彼らが我々の征服ではなく、我々の支持を競うように仕向けてきた。わが国の大使団は、紛争開始時よりも多くの領土と影響力をエピロスにもたらすような和平条約を編み出すことで名高い。"
 feo_the_iron_harvest_advance: "鉄の収穫"
 feo_the_iron_harvest_advance_desc: "テオドロのゴート・ギリシャの混合文化は、守りの殻を完全に脱ぎ捨て、「戦争機械」へと変貌した。もはや単なる崖上の生存だけでは満足せず、我々は山岳要塞を工業化して巨大な製鉄所と兵舎を作り、ステップでの戦争という過酷な環境で鍛え上げられた専門的な将校団と徴兵軍を生み出した。公国の全市民はいまや第一に兵士であり、周囲の平原を脅威ではなく、ゴート族の栄光とローマ領土回復のための収穫の場とみなしている。この「総力戦」体制により、我々は小国ながら圧倒的な軍事力を展開し、近隣の大国をもを恐怖させるほどの猛烈な攻勢を可能としている。"
 gre_megali_idea_realized_advance: "メガリ・イデアの実現"
 gre_megali_idea_realized_advance_desc: "イオニア海からアナトリア海岸まで広がるギリシャ世界の復興という夢が、我々の国家政策の指針となった。我々は先祖がかつて支配したすべての土地への拡張を正当化する法的・歴史的枠組みを構築し、征服を「解放」として位置づけている。このイデオロギー的熱狂は、未曾有の速さで新領土を統合する行政を推進し、人々はギリシャへの回帰を歓迎している。"
 moe_the_constitution_of_morea_advance: "モレア憲法"
 moe_the_constitution_of_morea_advance_desc: "啓蒙主義の波が地中海を席巻するなか、モレアの専制君主たちは、王座と民衆の関係を成文憲法として正式化するという急進的な措置を講じた。この文書は、ミストラ学派の社会理論の影響を強く受け、ビザンツ宮廷的恩顧政治の最後の痕跡を解体し、功績主義的な官僚制度を支持するとともに、台頭する商人階級の財産権を保護するものである。国民に国政への参画を認めることで、専制公国は国家に対する強固な忠誠心を育み、国民を外敵の扇動に対してはるかに抵抗力をもつ存在へと導く。この政治的近代化により、モレアは伝統的な専制政治から、国民の心理的・経済的資源を国家の栄光のために総動員できる洗練された「国民君主制」へと変貌するだろう。"
 ths_thessalian_grain_exchange_advance: "テッサリア穀物取引所"
 ths_thessalian_grain_exchange_advance_desc: "テッサリア平原を近代化された農業の穀倉地帯へと変貌させる事業は、テッサリア穀物取引所の設立によって完成されるであろう。中世的な小作制度から脱却し、国家は最新の農法の導入を奨励し、取引所は国際市場向けの価格と品質を標準化するであろう。穀物取引のこの集中化により、テッサリアは余剰食糧を外交の道具として行使し、紛争の最中にある欧州の飢えた軍勢に供給する見返りとして、政治的譲歩と近代技術を得ることができるであろう。この輸出によって生み出される富は、山間の鉱山を沿岸の港へと直結させる基盤整備に投じられ、国全体を単一の経済圏へと結びつけるであろう。"
 #Serbian Shared
 serbian_zaduzbina: "ザドゥジュビナ"
 serbian_zaduzbina_desc: "セルビアの貴賤を問わぬ人々は、「魂のための奉献」たる #italic ザドゥジュビナ #! の伝統によって結ばれている。石造りの教会や修道院を建てるこの文化的衝動は、バルカン全域に我らの存在を示す恒久的な物理的景観を作り出す。これらの建物は単なる宗教的中心地にとどまらず、セルビア人の「生活圏」を定義する歴史、芸術、識字の宝庫である。この建築への執念は、我らの文化がこの地に物理的に根を下ろしていることを保証し、人々がいかなる犠牲を払ってでもその「聖なる地」を守ろうとする、永続性と歴史的連続性の感覚を鼓舞するのである。"
 home_of_hussars: "ユサールの起源"
 home_of_hussars_desc: "軽騎兵の編成自体は古くからの概念であるが、最初のバルカン・フサル(あるいは#italicグサル#!)は、10世紀から11世紀にかけて$BYZ$の補助部隊として現れ、主に$BYZ_ADJ$が支配する$serbia_area$から徴募された。$BYZ_ADJ$の勢力が衰えた後も、この伝統は残り、後の数世紀を通じてさらに洗練されていった。"
 serbian_serbian_epic_poetry: "セルビアの叙事詩"
 serbian_serbian_epic_poetry_desc: "セルビアの人々は叙事詩を通じて「生きた歴史」を育んできた。放浪の吟遊詩人である #italic グスラル #! は、民族の魂を守る第一の番人である。 #italic グスラル #! は #italic グスレ #! の伴奏に合わせて幾千もの詩句を唱える。これらの歌は系譜、法的先例、道徳的規範を伝え残す。セルビアの文化は、最も無学な羊飼いでさえも祖先の権利と共有された同胞意識を理解していることを保証する。村の寄り合いのひとつひとつが、歴史を刻み込む場となるのである。"
 serbian_the_icon_of_saint_sava: "聖サワのイコン"
 serbian_the_icon_of_saint_sava_desc: "セルビア人の文化的基盤は、聖サヴァによって定められている。ビザンツの信仰心と土着のスラヴ的習俗を融合させ、典礼においてセルビア語を用いることに断固としてこだわることで、サヴァは民族の魂と切り離せない国民教会を作り上げた。この拠り所は我が民の間で幾度も甦り、貴族であろうと農民であろうと、すべてのセルビア人が自らを唯一無二の神聖な共同体の一員とみなすことを保証する。たとえ国境が揺らぎ、あるいは崩れ去ろうとも、この共同体は一つであり続け、外来の文化的同化に抗う内なる安定をもたらすのである。"
 serbian_seobe: "セオベ"
 serbian_seobe_desc: "セルビアの民は「移動する同一性」という技を極めた。それは、文化的結束を失うことなく、共同体をまるごと新たな土地へ移し得る力である。この移動性のおかげで、「セルビアの炉床」は固定された地理上の一点ではなく、持ち運び可能で破壊され得ない社会契約となる。セルビアの共同体がその杖を打ち立てる地であればどこであれ、古来の法と #italic Slava #! の伝統が直ちに再建される。かかる不屈さゆえに、我らが文化は首を刎ねることのできぬものとなる。焼け野原と化した谷を捨て去った民族が、新たな辺境において完全な姿を備えた軍事社会として再び立ち現れ、好機を待って祖先の地の中枢へと反撃するからである。"
 serbian_enlightenment: "セルビア啓蒙主義"
 serbian_enlightenment_desc: "ほかの啓蒙主義国家に触発され、ドシテイ・オブラードヴィッチのような国民的英雄は、セルビアの言語と文学を高めようとしてきた。平民が触れることのできる世俗的な作品が少ないことに衝撃を受けたドシテイ・オブラードヴィッチは、率先してセルビア語の書き言葉と話し言葉の溝を埋めようとした。文法書や辞書を熱心に作り、専門書を執筆し、外国作品を翻訳していったのだ。こうした先見の明をもつ人々の尽力によって、わが国の文学は復興しつつある。"
 #Serbian Unique
 hum_a_sheep_surrounded_by_wolves: "狼に囲まれた羊"
 hum_a_sheep_surrounded_by_wolves_desc: "我らは地理的に、より強大な敵たちのそびえ立つ野心に挟まれて存在している。この捕食者たちの包囲網を生き延びるため、我が領主たちは隣国同士を反目させる術を極めた。すなわち、戸口にいる狼を退けるため、遠方の狼へ絶えず臣従を申し出るのである。カトリックの西とオルトドクスの東とを、またボスニアのクルスチャニをその両方と対立させることで、いかなる単一の覇権国家も、競争相手の大規模な介入を招くことなく我が領土を完全に併呑することができぬよう図っている。この巧妙な政治的二枚舌の文化は、我らの脆弱さと見えるものを生存の手段へと変える。すなわち、現在我らの内政的自治を保証する勢力に対して、その都度、通商上の譲歩と軍事的通行権を与えるのである。こうして、より大きな狼たちを互いに牙を向け合わせたまま、我らはネレトヴァの揺るぎなき支配者であり続ける。"
 serbian_mining: "$saxon$の採掘特権"
 serbian_mining_desc: "$upper_saxony_area$やハルツ山脈からサシの鉱夫を意図的に招き入れたことで、我々の原始的な露天掘りは、洗練された産業の原動力へと根本的に変貌を遂げた。これらのゲルマン系専門家に独自の自治裁判所、独自の鉱山法に従う権利、および信教の自由を与えることで、我々は$brskovo$と$novo_brdo$に深く埋蔵された広大な銀と金の鉱脈を掘り起こすことに成功。この技術的専門知識の流入により、我々は西方の最高の傭兵を雇い、記念碑的な石造りの建造物を築き、バルカンの交易および地中海通商を支配するに至った高品質な銀のマタパン模倣貨幣を鋳造するために必要な、膨大な量の純銀地金を確保することができたのである。"
 mimic_the_phoenix: "不死鳥の模倣"
 mimic_the_phoenix_desc: "我々はビザンツ帝国の手法を積極的に取り入れ、その法律や全体的な様式を模倣することを目指している。ローマ帝国の影響を大きく受けたその文化から、わが国の行政や法制度にそのエッセンスを取り込み、国内においてビザンツ帝国の栄華と洗練を模倣しようとしているのだ。"
 tro_zupa_administrative_reform: "行政区画ジュパの改革"
 tro_zupa_administrative_reform_desc: "かつての統治者たちのもとで、トラヴニヤの伝統的なスラヴ式ジュパ（行政区画）は、ソイ（土地税）の徴収を円滑におこなうために再編された。統治者はケファレ（長官）を任命してトレビニィツァ川流域を監督させ、肥沃な平野からもたらされる富が確実に中央の国庫へと届くようにした。過去の統治者たちが自らの戦争の資金を確保できたのは、この原型的な官僚機構により、内陸部の豊かな農業生産から富を絞り出したからである。そして我々は、この伝統を継承する。"
 zta_maritime_fiefdoms_of_the_adriatic: "アドリア海の海洋封土"
 zta_maritime_fiefdoms_of_the_adriatic_desc: "我々のアイデンティティは、高くそびえる石灰岩の山と海の塩が激しく交わる地点で形成されている。沿岸の戦略的都市を掌握することで、ゼータの領主たちはセルビア内陸部全体にとって不可欠な海上玄関口の役割を担い、塩、絹、銀の流れを支配している。そして我々は地中海貿易と関税から生み出される莫大な富を、独立心の強い山岳氏族への資金提供や、海岸線を守る巨大な石造要塞の建設に充てている。これによりゼータは独自の海上勢力としての地位を確固たるものとし、内陸部の険しい断崖を越えてはるか遠くまで影響力を及ぼす。"
 hum_the_kosaca_iron_fist: "コサチャの鉄拳"
 hum_the_kosaca_iron_fist_desc: "コサチャ家に倣い、この公国は軍を単一の王朝の旗の下に集権化し始めた。国家は分散した封建的召集から脱し、重装歩兵と傭兵クロスボウ兵からなる専門化された中核軍へと移行した。この軍事的統合により、我らは敵に抗い、我が領土の険しい地形を南ディナル・アルプスにおける力の仲裁者へと変えることができる。"
 ser_vitestvo: "ヴィテシュトヴォ"
 ser_vitestvo_desc: "我らは #italic ヴィテシュトヴォ #! というセルビア独自の騎士道を奨励する。これは西方の重装甲の伝統と東方の禁欲的な戦士気質とを融合させたものである。この騎士の文化は最上位の貴族にとどまらず、自由民兵の下層階級にまで浸透していく。それは個人の勇気、真の信仰への忠誠、そして槍とサーベルの両方に通じた専門的な技量を重んじるものとなる。この軍事文化は、軍務を社会的・精神的達成の最高形態とみなし、生来戦に傾いた民を生み出すであろう。"
 rallying_the_troops: "部隊の集結"
 rallying_the_troops_desc: "わが国は、迅速に部隊を集結させる方法を発展させてきた。これにより、敵は我々の不意を突くことはできない。この強みが我々を恐れ知らずの戦士に仕立て、戦いに備えさせている。団結し、進軍し、目的を胸に秘め、我らが名誉と祖国を守るのだ。"
 tro_the_defensive_network_of_klobuk: "クロブクの防衛網"
 tro_the_defensive_network_of_klobuk_desc: "敵国の拡大に対抗するため、我々はクロブクの要塞を近代的な城塞へと再建する。さらに、ポポヴォ・ポリェ全域に「狼煙」による通報網を導入することで、トレビニェの守備隊が侵攻の発生を数時間以内に内陸部全体へ伝えられるようにする。こうして形成される支配権により、この地域を迂回することが不可能となる。"
 zta_the_italian_condottieri: "イタリアのコンドッティエーリ"
 zta_the_italian_condottieri_desc: "国際傭兵契約は利益だけでなく危険も伴うが、我々はうまく立ち回る術を熟知している。イタリア人のさまざまな海外戦線にゼータの精鋭山岳歩兵や熟練水兵を提供することで、我々は近代的な西欧兵器、火薬、そしてアドリア海における強力な海軍同盟者を確保しているのだ。この結びつきにより、わが国の領土の独立は強力な友によって守られ、それと同時に国内では古代からの戦士伝統を維持し、さらに磨きをかけることができる。そしてこれは、他のバルカン諸国は到底及ばない職業軍という優位性を我々にもたらす。"
 hum_the_viticulture_of_the_sunny_scree: "日当たりのよいガレ場のブドウ栽培"
 hum_the_viticulture_of_the_sunny_scree_desc: "石灰岩に富み、陽光に照らされたヘルツェゴヴィナの谷の斜面は、アドリア海随一と羨まれる独特の高糖度のブドウを産する。ジラフカとブラティナのワインの輸出に王室の専売を定めることで、穀物市場の変動を避けた贅沢な交易を築くことができる。この「液体の外交」により、我が宮廷はイタリアの都市国家に匹敵する暮らしを保ち、高級ワインの輸出を外交の潤滑油として、ヴェネツィア共和国やナポリ王国と有利な条約を結ぶのである。"
 ser_the_transcribers_of_resava: "レサヴァの写字生"
 ser_the_transcribers_of_resava_desc: "争乱の時代にあって、セルビアの民は剣では守れぬものを筆によって守ろうとする。 #italic レサヴァ学派 #! の正書法はセルビア教会スラヴ語を標準化し、文化的な「文芸共和国」を築き上げる。この言語の純正さと年代記の保存への執着により、我らの歴史が戦乱の霧に紛れて失われることは決してない。かくして高度な識字能力を備えたエリート層が国家の記憶として機能し、ドナウからアドリアに至るあらゆる修道院の写字室に、我らが諸王朝の記録を生かし続けるのである。"
 keepers_of_the_gate: "門番"
 keepers_of_the_gate_desc: "セルビアの起伏に富んだ地形は、堂々たるスメデロボ要塞に代表される強固な防衛網を生んだ。これらの不朽の要塞がわが国を守り、侵略を困難なものにしているのだ。広大な山脈から、戦略的な河川や渓谷まで、セルビアの防衛網はわが国の立ち上がる力と、不屈の精神の証なのだ。"
 tro_the_trebisnjica_bridges: "トレビニィツァの橋"
 tro_the_trebisnjica_bridges_desc: "ローマの土木技術の模範に従い、地元の領主たちは巨大な石橋に投資し、内陸部から伸びる「銀の道」が冬の洪水のあいだも決して閉ざされないようにする。このインフラへの投資により、山岳地帯と沿岸の都市とのあいだで、大型の交易隊商が一年中往来できるようになる。"
 zta_the_retreat_to_the_karst: "カルストへの撤退"
 zta_the_retreat_to_the_karst_desc: "海岸は帝国の権勢の移ろう流砂に一時的に奪われることもあろうが、カルスト山脈は我らの永遠にして難攻不落の砦であり続ける。ロヴチェン山中深く、空気薄く斜面険しい地に抱かれた修道院の牙城ツェティニェこそ、我らが国の中核である。この都市は「山岳孤立」という長期的な国家戦略を体現している。すなわち、港の富とその脆弱性とを捨て去り、高峰の絶対的な安全を選び取るのである。岩の中に身を固めることで、いかなる帝国の勢力をもってしても、ゼタの国家を完全に併合し統治することを不可能とするのである。"
 hum_the_humite_chancery_records: "フム大法官府記録庁"
 hum_the_humite_chancery_records_desc: "国家を治めるため、我らは行政を、移動性を保ちながらも高度に組織化された尚書局へと集権化した。戦時下においてさえ土地所有、氏族の血統、租税義務について正確な記録を維持することで、外国の占領によってしばしば引き起こされる社会の崩壊を防ぐ。この記録のおかげで、侵略者が撃退されたその瞬間から、国家は支配者の宮殿から高地カルストの最も小さな山村に至るまで、明確かつ途切れることのない指揮系統をもって、完全な統治機能を再開できるのである。"
 the_rebirth_of_the_patriarchate: "総主教の復活"
 the_rebirth_of_the_patriarchate_desc: "政治的駆け引きを巧みな手腕で制し、近隣諸国の複雑な帝国行政制度の網をかいくぐって、我々は交渉のすえ国家総主教座の復活を勝ち取った。この外交的勝利を通じ、我々がアドリア海沿岸からドナウ川中流域に至る全セルビア人住民に対する宗教的・法的管轄権を手に入れたことで、教会は実質的に「全セルビア人の守護者」の役割を担えるようになった。これにより、十分の一税を徴収し、地域の教育を管理し、唯一の強力な信仰によって団結しつづける住民のあいだで我々の伝統の灯を絶やさぬよう維持する、影の行政体制の維持が可能となる。"
 reform_the_ecclesiastical_authorities: "モラヴァ交易ギルド"
 reform_the_ecclesiastical_authorities_desc: "我らはモラヴァ渓谷のギルドに王の特許状を与え、川の往来の要所において、大規模な皮革加工、織物、金属仕上げの工房の発展を奨励する。これらのギルドに対し、王軍への規格化された装備(騎兵用の鞍具や歩兵用の制服など)の供給と引き換えに、特定の内国関税を免除することで、国家は自立した国内産業を築き上げる。この施策は、高価な外国からの輸入への王国の依存を減らし、貴族の地方権力に対する忠実な対抗勢力として機能する繁栄した都市中産階級を生み出し、国家の課税対象となる経済基盤を大きく広げるであろう。"
 tro_the_aqueducts_of_popovo_polje: "ポポヴォ・ポリェの導水路"
 tro_the_aqueducts_of_popovo_polje_desc: "トレビニィツァ川（世界最長の潜流川）の独特な水文特性を利用し、国家は一連の石造導水路と水車を建設する。これにより、乾燥した夏季であっても集約農業が可能となり、国家は穀物を自給自足できるようになり、長期にわたる海上封鎖にも耐えられるようになる。"
 zta_the_vladika_sovereignty: "ヴラディカの主権"
 zta_the_vladika_sovereignty_desc: "絶え間ない戦乱の重圧のもとで世俗的な貴族王朝が衰退していくなか、ツェティニェの主教公（ヴラディカ）たちが国家指導者という重責を引き継いだ。この独特な神権君主制は、精神的権威と世俗的権力を独身者が務める単一の職位に統合し、対立する封建的相続人たちのあいだでわが国の領土が危険なほど細分化されることを効果的に防いでいる。これにより、山岳の独立をめぐる闘争は、一族の誰もが宗教的義務として戦わなければならない、終わりのない聖戦へと変貌した。ヴラディカは単なる統治者ではない。彼は我々の抵抗の生ける象徴であり、「黒い山」（モンテネグロ）の防衛において十字架と剣が決して切り離されることのないようにする存在である。"
 hum_the_ponor_storage_system: "ポノールの貯蔵体系"
 hum_the_ponor_storage_system_desc: "我々は、世界最長の潜流河川であるトレビニィツァ川水系を利用し、温度と湿度を管理する術を編み出した。夏のあいだ、ポノール（陥没穴）の安定した気温と乾燥した上層空洞を利用することで、国家規模の地下穀倉網を構築したのだ。この「隠された備蓄庫」は、ヘルツェゴヴィナの灼熱の暑さから穀物を守ることができ、さらに重要なことに、侵略軍の徴発部隊の目にも留まらない。敵が焦土と化した谷間で飢えに苦しむあいだ、我々の軍は地底の涼しい深層から補給を得て十分な食糧を確保することが可能なため、わが国は数年に及ぶ封鎖下でも高い士気を保った常備軍を維持できる。"
 ser_serbian_national_militia: "セルビア国民軍"
 ser_serbian_national_militia_desc: "過去数十年にわたる精鋭部隊の苦闘から得た経験をもとに、我らは恒久的かつ職業的な常備国民軍を創設した。この部隊は、無秩序な農民徴募からの決定的な脱却を象徴し、厳格な西方式の訓練、統一された装備、近代的な指揮系統を採用しつつ、バルカンの先祖たちがもっていた猛々しく士気の高い戦闘様式を保持している。これにより、わが国の独立は脆弱な外交上の恩恵ではなく、いかなる帝国勢力の侵略からも国境を守り抜く、信頼に足る近代的な軍事機構に裏打ちされたものとなる。"
 foreign_relations_bureau: "対外関係局"
 foreign_relations_bureau_desc: "わが国は、近隣諸国と友好関係や同盟関係を育むことの重要性を認識している。これを促進するため、国外の問題に特化した専門局を設置する。外交に専念できる体制を整えることで、複雑な国際関係の網の目をかいくぐり、わが国に繁栄をもたらせるだろう。"
 tro_the_zudiosca_network: "ズディオスカの情報網"
 tro_the_zudiosca_network_desc: "地中海を巻き込む大戦が激しさを増す中、トラヴニャ国家はユダヤ人およびラグーザの商人一族(#italic ズディオスカ #!)との特別な関係を活かし、洗練された諜報網を築き上げる。これらの商人たちは山岳内陸部とアドリア海の港を自在に行き来するため、トラヴニャの指揮官たちに外国軍の動向をリアルタイムで伝えることができる。この「見えざる守り手」により、地元の軍は常に敵の最も弱い箇所を突くことができ、侵攻してくるいかなる勢力の兵力をも事実上無効化するのである。"
 zta_guerillas_of_the_scrub: "灌木地帯のゲリラ"
 zta_guerillas_of_the_scrub_desc: "カルスト地帯のゴラ・ブルダ（裸の丘）は、従来の侵攻軍にとってはまるで無防備な場所だが、我々の俊敏な戦士たちにとっては、無限の隠れ家と伏撃地点を提供してくれる場所である。我々は「夜襲」という洗練された戦術教義を作り上げた。氏族の戦士たちは闇に紛れて頂から音もなく降り立ち、敵陣を蹂躙し、大砲を破壊して、夜明けの光が差す前に霧のなかへと消え去る。この心を削る戦術により、低地の侵略軍は絶え間ない恐怖と肉体的疲弊で狂気の淵へと追い込まれ、わが国の領土は彼らにとって悪夢のような場所となり、やがて放棄せざるを得なくなるが、その一方で我々の軍はいかなる過酷な敵対地にも適応するよう鍛え上げられる。"
 hum_modernized_national_redoubt: "近代化された国家要塞"
 hum_modernized_national_redoubt_desc: "数百年にわたる山岳戦の経験を洗練させ、我々は国家要塞戦略を導入した。これはすべての主要都市と峠を、ひとつの統合防衛計画に組み込むものである。近代的な西欧弾道学と地図学を駆使し、砲台と物資を山中の隠し場所にあらかじめ配置した。この戦略により、たとえ谷が失われたとしても、国家は高き頂から主権をもつ軍事主体として機能しつづけることができる。不変かつ活発な抵抗活動によって占領者を嘲笑い、フムの地の保持をいかなる帝国にとっても法外な負担とするのだ。"
 military_modernization: "軍の近代化"
 military_modernization_desc: "わが国民は、この国が強力な大国に囲まれ、絶えず安全が脅かされるなかで誕生したことを覚えている。この消えることのない警戒心が揺るぎない即応態勢の文化を築き、わが軍隊は逆境に対する盾でありつづけられる。勇敢かつ敬意を集める兵士たちは、わが国を狩られるだけの獲物から強力な敵へと変貌させ、国家の主権を侵害しようとする者たちを阻んできたのだ。"
 ser_the_sumadija_agrarian_revolution: "シュマディヤの農業革命"
 ser_the_sumadija_agrarian_revolution_desc: "セルビアの農民たちは、西方から学んだ農耕技術を取り入れることで、独自の文化的・経済的変革を成し遂げた。これにより、$sumadija_province$ の深い森は高度に生産的な農業の中心地へと変貌した。この食糧の余剰は民を養うだけにとどまらず、人口爆発を引き起こす原動力ともなる。よく食べたセルビアの民は成長し、野心を抱く民となり、軍のために若く健康な新兵の巨大な供給源をもたらし、セルビアを中央バルカンの支配的な経済的原動力たらしめる強固な国内市場を生み出す。"
 tro_the_constitution_of_trebinje: "トレビニェ憲法"
 tro_the_constitution_of_trebinje_desc: "国家は統治者の権力を制限し、「領主と市民の議会」に権利を付与する成文憲法を導入する。バルカン半島における最初期の自由主義的な文書のひとつとなるこの憲法は、国内革命を未然に防ぎ、ヨーロッパの列強に対してトラヴニヤを「文明国家」として提示し、わが国の主権の継続を保証することを目的としている。"
 zta_the_code_of_the_black_mountain: "黒い山の法典"
 zta_the_code_of_the_black_mountain_desc: "緩やかな部族連合から近代的で中央集権的な国家へと遂に移行するため、我々は厳格かつ妥協のない新法典を導入した。これは破壊的な血讐の伝統を厳しく抑圧し、ヴラディカの権力を一元化させるものである。古来の部族法を統一的な国家司法制度と課税制度に置き換えることで、競合する諸氏族を単一の結束した国民的共同体へと統合する。この改革は、山岳地帯の分散的でしばしば混沌とした力を、規律ある国家的戦力へと変えることで、先祖代々の海岸線を奪還し、近代的なヨーロッパ列強並みの効率で国境を拡大することを可能にする。"
 #Slovene Shared
 slovene_the_freising_fragments: "フライジング写本"
 slovene_the_freising_fragments_desc: "フライジング写本の古来の伝統をもとに、スロベニアの農民と地元の聖職者たちは、神聖ローマ帝国の教会組織のなかで生き抜いた独自の言語的アイデンティティを維持してきた。この初期の土着伝統は、ヴェンド語の話者をゲルマン系やイタリア系の隣人から区別する、静かながらも強靭な文化的支柱として機能している。"
 slovene_the_dukes_chair_tradition: "公爵の椅子の伝統"
 slovene_the_dukes_chair_tradition_desc: "カリンティア公をスロベニア語を用いて即位させるという古代の儀式は、統治者と被統治者のあいだの独特な契約関係を象徴している。この慣習は、特定の法的権利をもつ自由農民という概念を強化し、農村人口の完全な権利剥奪を防いでいる。この社会契約が、我々の領地全域に安定した生産的な農業基盤を育んでいるのである。"
 slovene_the_tabor_defense_system: "ターボルの防衛体系"
 slovene_the_tabor_defense_system_desc: "辺境の国として、我らは常に敵に対して危険な立場に置かれてきた。それゆえ我が民は #italic タボル #!、すなわち村人が家畜や財産とともに逃げ込める要塞化された教会の囲い地を発展させてきた。この分散型の防衛体制は、あらゆる村を小さな砦へと変え、いかなる侵略者をも勝ち目のない消耗戦へと引きずり込む。"
 slovene_the_catechismus_and_abecedarium: "カテキズムとアベセダリウム"
 slovene_the_catechismus_and_abecedarium_desc: "わが国の民の魂は、印刷機を通じてその声を得た。プリモシュ・トルバルは、スロベニア語で印刷された史上初の書物「カテキズム」（教理問答）と「アベセダリウム」（初歩読本）を出版。これは単なる宗教的行為を遥かに超え、我々の多様な方言を単一の文学言語へと標準化する、政治的な大転換であった。庶民に母語で読み書きする力を身につけさせることで、我々は旧来の封建的公国の境界を超越する、統一された国民意識を形成した。この知的覚醒は近代的な行政制度の導入を加速させ、新たな思想の光を説教壇から農耕の現場へと急速に広めることを可能にした。"
 slovene_the_glory_of_carniola: "カルニオラの栄光"
 slovene_the_glory_of_carniola_desc: "ヤネス・ヴァイカルド・ヴァルヴァソルの先例に倣い、我らは我が領土の地理、歴史、風習を記録するという壮大な事業に着手した。この調査により、国家はかつてないほど自らの資源と民を知ることとなり、公平に課税し、新たな発明を迅速に活用することができる。"
 slovene_the_zois_circle: "ツォイス・サークル"
 slovene_the_zois_circle_desc: "富裕な鉱物学者であり芸術の後援者でもあるジーガ・ツォイス男爵は、スロベニア民族の覚醒（プレポロド）を先導する知識人の集団を組織しはじめた。この集団は、高尚な文化、科学、政治におけるスロベニア語の使用を促進し、「農民の言葉」を近代的国家の言語へと変貌させた。"
 #Slovene Unique
 cli_the_counts_ambition: "伯爵の野望"
 cli_the_counts_ambition_desc: "婚姻外交の見事な手腕と、神聖ローマ皇帝への揺るぎない忠誠を通じて、我らは地方領主から神聖ローマ帝国の諸侯へと昇り詰めた。隣国の王座との婚姻関係を確保することで、我らは「南の盾」として不可欠な地位を築き上げた。これほど目覚ましい台頭は、ヨーロッパ屈指の名門にすら敬意を求めることを可能にする。"
 cli_the_sanneck_condottieri: "サネックのコンドッティエーリ"
 cli_the_sanneck_condottieri_desc: "我々が帝国の諸侯となる前、ツィリ家はサネック騎士の鋭い刃によってその名を轟かせており、我々はダルマチアやイタリアの戦場において、ハンガリー王室や帝位のために精鋭の傭兵団を率いることで、「戦争契約」を王朝での地位向上のための道具へと変えた。この職業的軍事奉仕の伝統により、我々は極めてわずかな費用で優れた傭兵を戦場に送ることができる。"
 cli_the_last_counts_legacy: "最後の伯爵の遺産"
 cli_the_last_counts_legacy_desc: "近隣諸国の継承問題に深く関与したことで、我々は帝国の南辺境を統括する主要な守護者として、自らの法的権利を確立した。たとえ競合勢力がわが国の領土を併合しようと画策するなかでも、自らの行政構造と、我々が確保した「帝国直属」の地位により、我々の領地は地域統治における特権的な拠点でありつづける。"
 cli_the_windic_march_arsenal: "ヴィンディッシュ辺境の兵器廠"
 cli_the_windic_march_arsenal_desc: "南辺境の主要領主として、我々は自らの領地を恒久的な軍需供給網へと変貌させた。サヴィニャ渓谷の製鉄所を保護することで、重騎兵と国境警備兵が内オーストリアで鍛造された最良の鎧と火器を装備できるようにしている。この地域に根ざした軍事産業は、外国製兵器への依存を減らし、わが国の連隊をつねに戦闘可能な状態に保ってくれる。"
 cli_the_marble_palaces_of_celje: "ツェリェの大理石宮殿"
 cli_the_marble_palaces_of_celje_desc: "帝国の諸侯としての地位を象徴するため、我々はイタリアの建築家を招き、都市中心部を壮麗なバロック様式で再設計した。ここの広大な宮殿や公共広場は単なる見栄えのためのものではない。これらは国家の官僚機構を専門化させる、中央集権的な行政拠点としての役割を果たしている。我らが首都が放つ圧倒的な輝きは、他国の外交官や国内の競合勢力を圧倒し、我々の正当な統治権を確固たるものにするのだ。"
 cli_the_modernization_of_a_nation: "国家の近代化"
 cli_the_modernization_of_a_nation_desc: "我々の祖先の谷は、封建的放牧地からわが国の産業の心臓部へと変貌を遂げた。我々は、周囲の山々から産出される原木や地鉄を加工する近代的な蒸気動力工場とともに大規模な産業を確立することで、この勢いを掴み取った。この急速な近代化は、熟練労働者や技術者という新たな階級を生み出し、我らが首都を技術革新の中心地へと変え、国家全体を産業時代へと押し進める。"
 #Balkan Shared
 expansionist_ambitions: "拡張主義的野心"
 expansionist_ambitions_desc: "バルカン半島が分裂状態に陥るなか、多くの新興勢力は半島の外への進出を志向した。野心的な統治者たちは、ビザンツの弱体化を好機と見て、多様な地を強大なひとつの王権のもとに統合しようとしたのである。"
 poklisars: "ポクリサー"
 poklisars_desc: "建国以来、我々は一貫して国の外へと視線を向けてきた。有益な交易路を確立したり、強力な隣国をなだめて同盟を結んだり、共通の敵対国に対して強固な連携を築いたりと、その使命はさまざまだ。ポクリサーとは、わが国の名のもとにその使命を遂行する使節に与えられる尊称である。"
 balkan_hajduks: "ハイドゥク"
 balkan_hajduks_desc: "帝国拡大の重圧のもとで中世王国の中央権威が崩壊するなか、その社会的空白を埋めたのがハイドゥクだった。元々はハイトーと呼ばれる単なる牛追いや季節労働者であった彼らは、いまや半ば神話的なゲリラ兵士や山賊の一団へと変貌を遂げた。彼らはハランバシャに率いられたチェタという規律ある小規模な集団として活動し、忠誠心と地方の農民（ラジャ）の保護を重視する厳格な内部行動規範によって統制されている。我々から見れば単なる盗賊にすぎないが、庶民にとっては外国の徴税人や無法な侵略者の略奪から身を守る唯一の盾である。彼らを我々の軍事組織へと正式に組み入れることで、我々は辺境の無法状態そのものを糧とする強力な戦力を手に入れることになる。"
 cro_pandurs_recruitment: "パンデュール"
 cro_pandurs_recruitment_desc: "国家は辺境の猛々しさを、その混沌に呑まれることなく手なずけねばならない。かつては単なる夜警や地元の治安維持を担っていた $cro_pandurs_recruitment$ は、カリスマ的指導者たちの手によって、専門化された軽歩兵へと再編される。これらの兵士たちは、自らの軍楽隊を伴い、ヨーロッパの戦場において恐怖の的となる。彼らは小競り合いの達人であり、補給線への襲撃、本隊の護衛、そして心理戦を得意とする。その規律は定まらず、略奪を好むことも甚だしいが、統治者の手の内にあれば、彼らは威嚇のための柔軟な道具となるのである。"
 #Carpathia Region Advances
 #Hungarian Shared
 hun_composite_light_cavalry: "複合弓軽騎兵"
 hun_composite_light_cavalry_desc: "騎乗した射手であり、素早い騎馬兵でもあるわが国の軽騎兵は、軍隊の屋台骨となっている。彼らは1278年の壮大なマーチフェルドの戦いでその実力を発揮したが、再びわが軍を栄光へと導いてくれるだろう。"
 hun_multi_culturalism: "多文化の地"
 hun_multi_culturalism_desc: "カルパティア盆地の麓はハンガリー人だけのものではない。スロバキア人、ルテニア人、クマン人、ドイツ人、その他多くの少数民族がこの地を故郷としている。だからこそ、わが政府がさまざまな文化を取り入れることに長けているのも当然である。"
 hun_reformed_coinage: "貨幣制度の改革"
 hun_reformed_coinage_desc: "新たな職業軍隊の費用を賄うためには、安定した収入源が必要となる。貨幣を改革して重量に統一規格を設ければ、国民が支払う税金の額を把握しやすくなり、この問題は容易に解決できるだろう。"
 hun_hungarian_reformation_intro: "宗教改革の思想は、野火のごとくヨーロッパ中に広まっている。必ずやわが国にも伝播するはずだ。"
 hun_hungarian_reformation: "ハンガリー宗教改革"
 hun_hungarian_reformation_desc: "$hun_hungarian_reformation_intro$わが国の国土は長きにわたって、外部勢力によって脅かされてきた。宗教改革に同意し、愛玩犬のように教皇に従う義務を放棄すれば、我々を抑えつける戒めをひとつ、破ることができるだろう！"
 hun_the_catholic_shield: "カトリックの盾"
 hun_the_catholic_shield_desc: "$hun_hungarian_reformation_intro$だが、信心深き者たちは未だその心を強く保っている。神とその忠実なるしもべは、この異端の狂気にも抗うだろう。"
 hun_realm_of_many_religions: "多宗教の地"
 hun_realm_of_many_religions_desc: "$hun_hungarian_reformation_intro$残念ながら、宗教改革は家族を分断し、かつての友人を敵とし、多くの国家の安定を脅かすこととなった。だが、我々の土地は、神学戦争の犠牲になるよりはましだと知っている。いずれにせよ、わが国は多くの宗教をもつ民であり、土地なのだ。"
 hun_hungarian_hussars: "$a_hungarian_hussars$"
 hun_hungarian_hussars_desc: "$a_hungarian_hussars_desc$"
 hun_revolutionized_military_tactics: "軍事戦術の革命"
 hun_revolutionized_military_tactics_desc: "軍事技術が進歩するにつれ、戦場での戦術も進化している。革命的な陸戦の性質に対応しつづけることは、わが国の存続にとって不可欠なことである。"
 hun_strengthened_towns: "町への支援"
 hun_strengthened_towns_desc: "ハンガリーの成長と繁栄には富が必要であり、街はその鍵を握っている。貴族たちの手から街を適切に守ることができれば、彼らは交易に従事し、わが国に税収をもたらすだろう。"
 #Hungarian Unique
 hun_castle_warriors: "城郭戦士"
 hun_castle_warriors_desc: "城郭戦士とは、王家の城郭区域で現地の#italic 城主#!に軍事力を提供する任務を負う、わが国の選り抜きの階級である。王国の初期に誕生したこの特権的な土地所有者たちは、世襲の権利を維持しつつ自らの領国を護るという、独自の地位を築いている。"
 hun_renaissance_knowledge: "ルネサンス君主"
 hun_renaissance_knowledge_desc: "農民たちは、大貴族による過度な要求やその他の搾取から公的に保護されているため、自らの統治者を公正な君主だとみなしている。$HUN$ の支配者はまさしく真の $renaissance$ の君主である。すなわち、卓越した軍事指導者にして統治者であり、傑出した言語の達人であり、芸術の啓蒙的な庇護者でもある。"
 hun_found_the_black_army: "黒軍の設立"
 hun_found_the_black_army_desc: "ユリウス・カエサルの著書に触発され、ハンガリーは新たに軍隊の中心となる専門部隊を設立した。この部隊は非常に強力であるため、敵は彼らを「黒軍」と呼ぶようになるだろう。"
 hun_bulwark_of_christianity: "キリスト教徒の防波堤"
 hun_bulwark_of_christianity_desc: "オスマン帝国の勢力が南方で台頭しているいま、その脅威からキリスト教を守るのはハンガリー王国の人々の責務である。我々はその義務に、決してたじろぐことはないと知らしめるのだ。"
 hun_curtailed_peasantry: "農民の自由の制限"
 hun_curtailed_peasantry_desc: "ハンガリーは、防衛の基盤となるような自然の要衝に恵まれていない。我々の祖先がここへやってきたのは、西方への襲撃にあたってその平原が適していたからであって、防衛のためではなかった。ハンガリーを防衛するには、資源が必要だ。マグナートが農民たちを土地に縛りつけようとしているが、我々がこれを認めれば、農民たちはより懸命に働くようになるだろう。"
 hun_hungarian_unity: "ハンガリー人の団結"
 hun_hungarian_unity_desc: "わが民族はさまざまな外的脅威に直面してきたが、ハンガリー人の意思と精神は未だ砕かれてはいない。ハンガリー人の団結は、最後のひとりになっても祖国を守り抜かんとする誇り高き兵士たちを大きく鼓舞するものとなっている。"
 #Romanian Shared
 wallachian_tradition: "ヴラフ人の降臨"
 wallachian_tradition_desc: "歴史的伝承によれば、ラドゥ・ネグルはトランシルヴァニアからカルパティア山脈を越え、ワラキア公国を建国したとされ、他の公国の建国にも同様の物語が語られている。この「建国の降臨」、すなわち#italicデスカレカトゥル#!は、ルーマニア人エリート層の移住と、外国の覇権から独立した最初の主権国家ツァラ・ロムネアスカ（ルーマニアの地）の樹立を象徴する。この出来事は、周囲の帝国とは一線を画しながらも、正教とラテンの伝統に深く根ざした独自の国家の誕生を告げるものである。"
 romanian_the_foundation_of_the_voivodeship_tradition: "ヴォイヴォダ制の伝統の確立"
 romanian_the_foundation_of_the_voivodeship_tradition_desc: "部族的なクネズからヴォイヴォダによる中央集権的な官職への移行は、ルーマニアの政治文化が洗練された中世体系へと成熟したことを示している。この「ドゥクス」、すなわち軍事指導者は、スラヴとビザンツ両方の影響を受けつつも、選挙制の君主制と王朝の継続性を融合させた、ルーマニア独自の形式である。これにより共同体は、主権国家として近隣の王権と対等に交渉できる、明確な軍事序列を得ることになる。"
 romanian_the_letter_of_neacsu: "ネアクシュの手紙"
 romanian_the_letter_of_neacsu_desc: "カンプルンの「ネアクシュの手紙」は、現存する最古のルーマニア語文献である。私信や行政文書においてスラヴ語から現地語へと移行したことは、上流階級や商人のあいだで国家意識が高まっていることを示している。これは、将来的に我々の土地をつなぐことになる、統一されたルーマニア文学文化の基礎を築いた。"
 romanian_the_postelnic_bureaucracy: "ポステルニクの官僚制度"
 romanian_the_postelnic_bureaucracy_desc: "我々はポステルニク（大侍従）の役割を拡大し、外交や財務を担う専門的な書記官団を統括させることで、中央行政を近代化した。西欧式の官庁文書慣行を採用し、国家収益や外国との条約を厳格に記録することで、単純な封建統治から脱却したのだ。この官僚機構の効率的な運営により、ヴォイヴォダは敵国の首都に諜報網を維持しつつ、ドナウ貿易から最後の1ダカットまで搾り取ることが可能となった。"
 romanian_the_romanian_renaissance: "ルーマニアのルネサンス"
 romanian_the_romanian_renaissance_desc: "富裕な一族の影響により、この地ではブルンコヴェネスク様式として知られる文化の開花が見られるのだが、我々はこれを支援せねばならない。この上位文化の時代は、壮麗な宮殿の建設や、ルーマニア民族のローマ起源を強調する人文主義者たちへの後援へとつながっていくだろう。この知的運動は、スラヴやマジャールの影響が渦巻く海における「ラテンの島」としての我々のアイデンティティを固め、西欧における外交的地位を高めることになる。"
 romanian_the_scoala_ardeleana: "シュコアラ・アルデレアナ"
 romanian_the_scoala_ardeleana_desc: "トランシルヴァニアで誕生したこの知的運動は、啓蒙主義的な合理主義と激しい国家の誇りを巧みに結びつけ、厳格な文化・言語学的研究を通じて、わが民のラテン起源を証明した。近代的なルーマニア語の文法書や歴史書を初めて編纂することで、我々は真の民族主義的精神に不可欠な思想的基盤を作り上げた。この学派は、ルーマニア全土の人々に自分たちが主権獲得を運命づけられた、西欧由来の単一国家であることを確信させ、中世的な地方主義の時代を事実上終焉させた。"
 #Romanian Unique
 mol_the_moldavian_road: "モルダヴィアの街道"
 mol_the_moldavian_road_desc: "バルト海と黒海を結ぶ「モルダヴィアの道」を確保することで、我々の主要な集落を北欧の毛皮や蜜蝋貿易の重要な拠点とした。スラヴ商人やドイツ市民に広範な特権を与えて関税都市への定住を促し、バルト海から南方のジェノヴァ港へと向かうすべての隊商が国庫に多額の通行税を納めるようにした。この商業がもたらす富により、自由農民に過度の税を課して反乱を招くことなく、専門の人員による宮廷運営の維持と石造要塞の建設が可能となる。"
 rmn_the_descendants_of_trajan: "トラヤヌスの末裔"
 rmn_the_descendants_of_trajan_desc: "敵の勢力が後退するのに伴い、カルパティア山脈のラテン語話者たちは自分たちが共有するローマの遺産を再認識している。「ヴラフ」の口承史や法的伝統を体系化することで、断片化されたクネザート（クネズ領）やヴォイヴォダ領を超越した統一的な文化アイデンティティを構築する。このロマニタス（ローマ性）は、山岳部族を結束させて1つのまとまりある国家とするために必要な、思想的な接着剤となるのである。"
 tra_the_transylvanian_autonomy: "トランシルヴァニアの自治"
 tra_the_transylvanian_autonomy_desc: "トランシルヴァニアはハンガリー王国の一部でありつづけているが、現地のルーマニア人、ザクセン人、ハンガリー人の貴族はみな、それぞれのヴォイヴォダのもとで独自の地域自治を維持し、平和に暮らしてきた。この共同統治により、一見すると相容れないような違いがありながらも、各々が独自の信仰や慣習を保持することが可能となった。こうした内部での協力関係のおかげで、カルパティア内陸部ではある程度の平和と多文化主義が保たれてきたのだ。"
 wallachian_heritage: "ポサダの戦いの遺産"
 wallachian_heritage_desc: "1330年、バサラブ1世はハンガリー王カーロイ1世（カーロイ・ローベルト）を破り、優れた山岳戦術によってワラキアの独立を確固たるものにした。この勝利は、小規模な地域勢力であってもカルパティアの険しい峠道を利用すれば帝国軍を壊滅させられることを証明し、その後の5世紀にわたる軍事的先例となった。我らの軍は奇襲戦術に熟達しており、地形を巧みに利用して、侵略者がドナウ平原に到達するはるか以前から、その戦力を消耗させている。"
 mol_the_banner_of_the_golden_bull: "金印勅書の旗"
 mol_the_banner_of_the_golden_bull_desc: "わが国を象徴する金印勅書の旗の下、モルダヴィアは「東方の防壁」となり、敵の侵攻を食い止める。我々は、軍事的な勝利を収めるたびに修道院を建立するという伝統を打ち立て、宗教的景観を創り上げていく。この宗教的情熱と軍事規律の融合により、兵士たちは十字軍のような確固たる信念をもって戦うことになる。"
 rmn_the_foundation_of_the_metropolises: "府主教座の創設"
 rmn_the_foundation_of_the_metropolises_desc: "わが国に府主教座を確立することで、他国の教会勢力からの精神的・政治的独立を達成する。この宗教的自治により、ルーマニア王権は教会を行政の手段として利用でき、神の承認を通じてボヤールたちの忠誠を確固たるものにする。そして教会はルーマニアの識字と法の主要な担い手となる。"
 tra_unio_trium_nationum: "三民族同盟"
 tra_unio_trium_nationum_desc: "農民反乱の脅威に対応するため、我が国の上層階級は「三民族同盟」を結成した。この複雑かつ硬直的な法制度は平民の大多数を事実上排除するものだが、その一方で地域に極めて安定し、強固で忠実な行政の核を築き上げている。この結束から、王権は信頼できる都市および封建兵士の基盤を得るのである。"
 boyar_regime: "官房の確立"
 boyar_regime_desc: "公侯府の正式化により、土地の授与や外交条約が教会スラヴ語で、そしてそのあとにはルーマニア語で体系的に記録できるようになった。この行政機構の発展により、ヴォイヴォダは田園部の農民からより効率的に徴税し、ヨーロッパの宮廷に常駐する外交使節団を維持できるようになる。これは、部族軍事社会から洗練された中世国家への移行を示すものである。"
 mol_the_great_military_reforms: "大軍事改革"
 mol_the_great_military_reforms_desc: "敵の物量に対抗するため、我々は軍を再編し、#italic オアステア・マーレ #!（大いなる軍）を編成した。#italic ラゼシ #!（公に直接奉仕義務を負う自作農）に土地を与えることで、我々は自ら武装を整えた忠実な歩兵の核を生み出した。彼らは自らの土地を守る地主の猛々しさをもって戦う。この制度により、たとえボヤールたちが動揺しようとも、君主は戦い慣れた兵士たちの信頼できる大規模な供給源を確保できるのである。"
 rmn_the_byzantine_heirs: "ビザンツの後継者"
 rmn_the_byzantine_heirs_desc: "コンスタンティノープルの栄光に触発され、ルーマニアの君主たちはアトス山と東方正教世界の主要な後援者となることを誓った。自らをビザンツの文化遺産の継承者と位置づけることで、バルカン全土から学者や芸術家を惹きつけている。いまやルーマニアは「ビザンツを凌ぐビザンツ」であり、正教世界の信仰の都となっている。"
 tra_the_transylvanian_trade_guilds: "トランシルヴァニア交易ギルド"
 tra_the_transylvanian_trade_guilds_desc: "カルパティア山脈沿いの活気ある都市では、主要文化圏の商人が、互いに競合または協力しながらギルドや同業組合を結成しはじめている。これにより人口の一部が都市の文化に染まり、学校への資金提供や書籍の出版を担う中産階級が誕生している。この経済的発展により、わが国は村落の枠を超え、思想の市場や世界的な商業の舞台へと足を踏み入れることになる。"
 wal_the_order_of_the_dragon_influence: "ドラゴン騎士団の影響力"
 wal_the_order_of_the_dragon_influence_desc: "我々はワラキアに容赦ない心理戦、および絶対的な法と秩序の文化を導入する。腐敗したボヤールを粛清し、厳格な法典を施行することで、君主の権力を強化し、軍隊をヴォイヴォダにのみ忠実な中央集権的な軍へと変貌させる。無慈悲であるというこの評判が、敵軍に対する主要な抑止力として機能するのだ。"
 mol_the_chronicles_of_grigore_ureche: "グリゴレ・ウレケの年代記"
 mol_the_chronicles_of_grigore_ureche_desc: "知的な自己意識が芽生える変革の時代が到来した！ わが国の高位のボヤールたちは、初めて母国語であるルーマニア語でわが民の歴史を体系的に記録しはじめた。ルーマニアの同胞と共有するラテン語の起源と言語的伝統を学術的に記録することで、国家の基盤を純粋な宗教的アイデンティティから近代的な言語・歴史的アイデンティティへと移行させる。この文化的目覚めは、国内における君主の正統性を強固なものにし、ヨーロッパ諸国の宮廷においてわが国の主権を主張するために必要な歴史的論拠を外交官たちに提供する。かくして歴史は国家の武器となった。"
 rmn_cartea_romaneasca_de_invetatura: "ルーマニア語の教えの本"
 rmn_cartea_romaneasca_de_invetatura_desc: "我々は国内初の印刷された法典である「カルテ・ロマネアスカ・デ・インヴァトゥトゥル」（ルーマニア語の教えの本）を発行した。この記念碑的な著作は、わが国の法慣行を統一し、より広範なヨーロッパの法学の法体系と整合させることを目的としている。裁判所の専門化と刑罰の標準化により、地方ボヤールの恣意的な権力を抑制し、玉座の中央権威を強化した。これにより、わが国は東方正教会の律法主義と秩序の模範となった。"
 tra_the_edict_of_torda: "トルダの勅令"
 tra_the_edict_of_torda_desc: "血なまぐさく狂信的な宗教戦争によって引き裂かれつつあるヨーロッパにおいて、トランシルヴァニアは勇敢にもトルダ勅令を発し、西洋世界で初めて普遍的な信教の自由を定めた法を制定した。カトリック教徒、ルター派、カルヴァン派、ユニテリアンが一つの法的枠組みの下で共存することを認めることで、神聖ローマ帝国全土で見られたような内部の社会的崩壊と内紛を防いだのである。この前例なき平和は、我が公国を、流浪の学者、科学者、商人たちの安息の地とし、近代的な行政改革と多様な文化的影響の受容を急速に進めている。寛容こそが、我が国最大の戦略的資産となったのである。"
 cunning_diplomacy: "狡猾な外交"
 cunning_diplomacy_desc: "我らが統治者の先見の明ある指導のもと、我々は地政学的に不可能とみなされていたこと——すなわちすべてのルーマニア領土をひとつの旗のもとに統合することを成し遂げる。この「偉大なる理念」は、古来の封建的境界を超越する潜在的な国民意識に火をつけ、統一されたダキアがヨーロッパの列強として自立しうることを世界に証明する。この構想は、法的、軍事的、象徴的な先例となり、地域の覇権に対する恒久的かつ歴史的な主張と、最終的にはすべてのルーマニア人の結集を可能にするだろう。"
 mol_the_moldovan_enlightment: "モルダヴィアの啓蒙"
 mol_the_moldovan_enlightment_desc: "ディミトリエ・カンテミールがヨーロッパで名高い博学者として台頭し、初期啓蒙主義の急進的な理念を我々の宮廷に直接持ち込んだ。西ヨーロッパの聴衆に向けて、我々の地域の複雑な歴史、音楽、地理を体系的に提示することで、東ヨーロッパ政治の流動的な情勢において極めて重要な戦略的優位性を獲得した。こうして我々は中世の辺境領から、政治的・軍事的着想を西ヨーロッパの近代化改革に求める科学的管理国家へと移行した。知識はモルダヴィアの玉座における新たな通貨である。"
 rmn_the_bible_of_bucharest: "ブカレストの聖書"
 rmn_the_bible_of_bucharest_desc: "ルーマニア語による初の完全版聖書の刊行は、我々の文化的アイデンティティを、典礼用の教会スラヴ語から生きた口語へと根本的に転換させた。この記念碑的な著作は言語的統合の役割を果たし、ワラキア、モルダヴィア、トランシルヴァニアの方言を単一の文語へと標準化した。聖典を庶民にも手の届くものとしたことで、3つの分立した公国の政治的境界を超越する統一された国家意識の基盤を築いた。"
 tra_the_vauban_transylvanian_bastion_synthesis: "要塞の統合"
 tra_the_vauban_transylvanian_bastion_synthesis_desc: "火薬の時代が頂点を迎える中、我々は最新のイタリアおよびフランスの #italic トラース・イタリエンヌ #! 様式を、カルパティア内陸部の険しい石灰岩の地勢に適応させた独自の軍事建築の流派を取り入れた。主要な行政中心地は、重砲による包囲攻撃の猛火にも耐えうる、低姿勢で角度のついた稜堡によって再要塞化された。過去の巨大な石壁とは異なり、これら土と煉瓦による近代的構造物は積極防御のために設計されており、公国の拡大しつつある砲兵隊のための交差射撃域を備えている。この防御思想により、侵攻軍は国家の中枢を脅かす前に、長期にわたる高くつく包囲戦の連続で消耗し尽くすことになる。"
 wal_the_diplomat_schools: "外交官養成学校"
 wal_the_diplomat_schools_desc: "高官たちの後援のもと、我々は聖サバス王侯学院を設立し、イタリアやギリシャの教授を首都に招いた。この高等教育への投資は、ラテン語の修辞学を論じるのと同程度に、近隣諸国との秘密条約の交渉にも精通した「哲学者兼外交官」の世代を生み出した。首都を知の象徴とすることで、わが国の行政に携わる精鋭たちは、これからもバルカン半島で最も洗練された存在でありつづけ、いかなる局面においても誰よりも巧みに立ち回ることができる。"
 mol_the_cotnari_and_odobesti_wines: "コトナリとオドベシュティのワイン"
 mol_the_cotnari_and_odobesti_wines_desc: "ブドウ畑は依然としてモルダヴィア最大の宝であり、コトナリ産の甘口白ワインはヨーロッパの宮廷においてトカイワインに匹敵する評価を得ている。我々はすでに初のワイン格付けを法制化し、ペルル・ドゥ・ラ・モルダヴィ（モルダヴィアの真珠）の輸出に対する国家の関与を確立した。いまこそ行動に移す時だ。この贅沢品貿易は近隣市場から宮廷に多額の硬貨をもたらし、首都の豪華な宮殿の建設資金となる。"
 rmn_the_pandur_militias: "パンデュール民兵"
 rmn_the_pandur_militias_desc: "わが国では、自由農民や下級貴族からなる意欲の高い非正規歩兵部隊パンデュールが台頭した。これらの兵士はゲリラ戦術とドナウ川の湿地帯での迅速な移動に特化しており、在地の理念に基づく部隊が、敵軍とボヤールの随行兵団の両方に対抗できることを証明した。パンデュールの伝統は、初の専門的かつ近代的な土着のルーマニア国民軍のひな形となるだろう。"
 tra_the_national_mining_academy: "国立鉱業学院"
 tra_the_national_mining_academy_desc: "国内の複数の山脈から金、銀、塩を集中的に採掘するため、世界水準の科学機関を設立した。最新の鉱物学および化学技術を応用することで、トランシルヴァニアを地域の主要な財源へと変貌させた。この産業への注力は、科学的な精度をもって国家資源を管理する専門の技術者や技術官僚という新しい階級を生み出し、長期的な経済的安定を実現している。"
 wal_the_abolition_of_serfdom: "農奴制の廃止"
 wal_the_abolition_of_serfdom_desc: "我が国の改革派の下、我々は近隣諸国に先駆け、農奴制を法的に廃止するという急進的な一歩を踏み出した。農民を「動産」から「課税対象の臣民」へと転換することで、国家の財政権を中央集権化し、地方ボヤールの絶対的支配を打ち破った。この社会変革はヴォイヴォドを民衆に近づけ、近代化する中央行政を支えうる、より流動的で経済的に活発な人口を解き放つものである。"
 #Slovak Shared
 slovak_the_urban_syncretism: "都市社会・文化の融合"
 slovak_the_urban_syncretism_desc: "モンゴル侵略による壊滅的な被害を受けた後、国家は崩壊した経済を再建するため、ドイツ系入植者であるジプサーの受け入れを奨励した。ほかの多くの植民地化運動とは異なり、これらの入植者は現地のスラヴ系住民に深く溶け込み、その結果「ザクセン法」として知られる独自の文化的・法的な習合をもたらした。こうした伝統の調和は、スラヴ人の農業における強靭さと、ドイツ人の採掘および冶金における技術的専門知識を兼ね備えた、多言語を操り高度な技能をもつ都市中産階級を生み出した。この知識共有の環境は革新の文化を育み、異なる言語集団間の知恵の出し合いが新たな技術や行政慣行の普及を加速させ、スロバキアの街を地域でも有数の先進的な都市へと変貌させた。"
 slovak_the_slovensky_vernacular: "スロバキアの口語"
 slovak_the_slovensky_vernacular_desc: "チェコ語やポーランド語とは異なる地方のスラブ系俗語が、公式な町の記録や法的文書、とりわけジリナ書においてますます頻繁に見られるようになってきた。これを支援すれば、この動きは正式なスロヴァキア行政言語の誕生を告げるものとなり得る。地方政府は、ラテン語やドイツ語にのみ頼ることなく、農民や下級貴族とより効果的に意思疎通を図れるようになるだろう。地方の言葉を文書による行政様式へと成文化することで、国家は裁判をより公正かつ迅速なものとし、民衆と政府の結びつきを強めることができる。この早期の言語標準化は、我々に国民としての一体感をもたらし、外国人行政官が我々のやり方を覆すことをより困難にするだろう。"
 slovak_the_slovak_rome: "スロバキアのローマ"
 slovak_the_slovak_rome_desc: "トルナヴァの街は、スロバキアの知的・宗教的な聖地となった。これにより盛期バロック建築が隆盛を極め、街の景観は壮麗な教会や学術殿堂で埋め尽くされている。ここではスラヴ語の書籍の印刷が盛んにおこなわれており、トルナヴァは異端や異教徒に対する知的抵抗の主要な原動力となっている。この文化的集積を強化することで、極限の存亡の危機に直面する時代においても、スラヴ系住民が洗練され、教養豊かで、宗教的に統一されたアイデンティティに深く根ざしつづけるようにする。"
 slovak_the_slovak_sappers: "スロバキアの工兵"
 slovak_the_slovak_sappers_desc: "スロバキア鉱山地方における深部採掘の文化は、ヨーロッパ屈指の地下採掘技師を輩出してきた。国家はこの優れたスロバキア人鉱夫（バンスキー・フラピ）を特別編成の工兵・鉱夫連隊へと徴募しはじめている。その文化により、鉱夫たちは黒色火薬、坑道掘削、そして暗闇での構造補強について熟知しており、その知識は攻城戦において恐るべき効果を発揮するだろう。彼らは敵の要塞を下方から崩壊させることができ、さらには通常の作業員の半分の時間で強固な塹壕を構築できる。この「鉱夫兵士」というアイデンティティは、スロバキアの労働力を戦略的な軍事資産へと変え、17世紀の包囲戦術を極めようとするあらゆる帝国にとって、スロバキアの鉱山町の奪取が最優先事項となるだろう。"
 slovak_the_highland_architecture: "高地建築"
 slovak_the_highland_architecture_desc: "ドイツ人の洗練された石工技術と、古来のスラブの重厚な木造建築の伝統が出会う、独自の建築文化が生まれつつある。その結果生まれたのが「分節木造教会」である。文化的には、これは「抵抗の建築」とでも言うべきものだ。山中で迅速に建てられる一方、補強されたオーク材の鎧戸や高く設けられた入口など、隠された防御的特徴を備えて設計されている。この文化的美学は、絶え間ない不信の中で美を求める必要から生まれ、文化的優位の景観を作り出している。この教訓から学ぶことで、我々はこれらの技術を我が国の栄光のために活用できる。"
 slovak_the_slovak_romanticism: "スロバキアのロマン主義"
 slovak_the_slovak_romanticism_desc: "新世代のロマン主義知識人たちが、言語の基盤を中央スロバキア方言へと移行させ、標準語となりつつある新たな言語を生み出している。これは単なる文学的な転換ではなく、急進的な政治運動でもある。彼らは、詩、民謡、言論活動を通じて我々のアイデンティティを高めようとしているのだ。このロマン主義的な熱狂は、あらゆる文化的創作物を国家の偉大さを訴えるものへと変え、農民層と急成長する中産階級を、国家の誇りという共通の理想のもとに統一するだろう。"
 #Slovak Unique
 slo_the_law_of_the_seven_towns: "七都市法"
 slo_the_law_of_the_seven_towns_desc: "北部領土の計り知れない戦略的・財政的価値を認識したアンジュー家のカーロイ・ローベルト王は、御しがたい地方の男爵たちを飛び越え、バンスカー・シュティアヴニツァやクレムニツァといった主要な鉱山中心地に特別な「王室自由都市」の地位を与えた。これらの入植地は地方領主の管轄から外され、#italic タヴェルニクス #!（王室財務官）の直接の監督下に置かれ、山の鉱山と玉座との間に直接的な財政上のつながりが築かれた。この法的枠組みは、忠実で都市化された納税基盤と、封建的な土地権益から独立して活動するドイツ・スラブ商人階級を育んだ。この行政上の転換により、我が国は現金収入の確実な供給源を確保し、王国の安定と王室官僚機構の専門化に向けた中央政府の取り組みを支えることとなった。"
 slo_the_slovak_castle_system: "スロバキア城塞体制"
 slo_the_slovak_castle_system_desc: "四方からの脅威に直面し、我々はドナウ川とカルパティア山麓に沿って公式な軍事境界線を設ける。#italicゼマン#!（土地を所有する下級スラブ貴族）に権限を与え、恒久的かつ世襲の国境守備隊として機能させる。これらの戦士たちは#italicクリア#!（要塞化された荘園邸宅）に暮らし、常時動員態勢を維持する代償として一定の税を免除される。これにより、地元の地勢に精通した屈強な農民戦士の社会階層が生まれ、国家に安価で意欲的な防衛線を提供し、外国の侵略の衝撃が王国の中枢に到達する前にこれを吸収することができるようになる。"
 slo_the_universitas_istropolitana: "イストロポリターナ大学"
 slo_the_universitas_istropolitana_desc: "人文主義運動が全盛期を迎えたいま、ブラチスラヴァに大学（アカデミア・イストロポリターナ）を創設する絶好の機会が到来している。この大学は、イタリア、ポーランド、ドイツ諸邦からの学者をはじめ、現代における最高峰の知性を引きつける場所となるだろう。教育課程は天文学、数学、ローマ法といった新興科学に重点を置き、国家の外交・法制度を近代化させる。この知的隆盛により、支配階級のエリートたちはヨーロッパの最新の政治哲学を学び、国家は専門的な手腕をもってルネサンス期の複雑な国際関係を乗り切れるようになる。また、同大学は天文学研究の中心地としても機能し、大陸全土を席巻しつつある科学革命の最前線にスロバキアの地を押し上げることとなる。"
 slo_the_mining_captancy: "鉱山総監区"
 slo_the_mining_captancy_desc: "我が山々は鉱石に満ちている。そこで国家はバンスカー・シュティアヴニツァの #italic ベルクカンマー #! （鉱山局）を通じて「七つの町」の中央管理を制度化する。王室任命の #italic ベルクハウプトマン #! （鉱山長官）を置くことで、政府は銀と金の採掘・精錬を直接掌握し、地方封建領主から古来の鉱物権益を剥奪する。この産業の専門化により、高度な排水技術とより深い坑道採掘の導入が可能となり、王室造幣所への地金の絶え間ない供給が保証される。この安定した銀と金の流れは我が国庫を満たし、スロヴァキアの鉱山山地を我々にとって不可欠な存在とするだろう。"
 slo_the_social_banditry: "社会義賊"
 slo_the_social_banditry_desc: "何十年ものあいだ、ユライ・ヤーノシークに象徴されるズボイニク（高地の無法者）という文化的存在は、民衆にとって軍事的な理想像であった。これはいわば「森の文化」であり、若者たちが山へと逃れ、封建的な抑圧に対してゲリラ戦を挑むものである。我々は彼らを山賊とみなしてきたが、民衆は守護者だと考えている。この文化的模範は、スロバキア人の精神にパルチザン的な気質を育んだ。その結果、中央権力に不信感を抱くようにはなったものの、焦土戦術や山岳伏撃戦術に熟達しており、彼らを国家組織に取り込むことができれば、大いに役立つだろう。"
 slo_the_hron_valley_industries: "フロン川流域の諸産業"
 slo_the_hron_valley_industries_desc: "巨大な鉄鉱石鉱床の発見と蒸気技術の急速な発展により、フロン川とヴァフ川流域に最初の近代的工業地帯が誕生した。我が国は製鉄所や繊維工場の創設を強力に助成し、外国からの輸入への依存を減らさねばならない。この産業的自立を求める動きは、伝統的な農業景観を製造業の一大拠点へと変貌させ、他の列強と渡り合う手段を我々にもたらすだろう。労働力がこれらの新しい中心地に集中するにつれ、この地域の社会構造は変化し始め、次の世紀において新たな政治勢力となる都市労働者階級が生まれるであろう。"
 #Iberia Region Advances
 #Andalusi Shared
 gra_nasrid_art: "ナスル芸術"
 gra_nasrid_art_desc: "アル＝アンダルスの職人たちは、漆喰細工、タイル装飾、そして #italic ムカルナス #! 天井といった千年にわたるウマイヤ朝およびムワッヒド朝の洗練の伝統を受け継いでいる。アルハンブラ宮殿やユースフ1世のマドラサ・ユースフィーヤにおける彼らの作品は、フェズやカイロから巨匠たちをグラナダ様式の研究に引き寄せ、我々の陶器、絹織物、象嵌細工の武器は地中海各地で高値で取引されている。我が領土が縮小する中にあっても、職人たちは国庫を支え続けている。"
 gra_razzias: "ナスルの略奪"
 gra_razzias_desc: "#italic ガズワ #!（キリスト教徒領への家畜、捕虜、略奪品を狙った迅速な騎馬襲撃）は、ウマイヤ朝の時代以来、辺境の諸首長国の生命線であり続けてきた。我が襲撃隊は夜間に五十から二百騎の部隊でシエラ山脈を越え、守備の薄いベガ地方を席巻し、カスティーリャの #italic メスナーダ #! が対応を整える前に退却する。この略奪経済はキリスト教徒側の辺境を貧困化させ、我々の条件に従属させる一方で、奴隷、家畜、貢物をグラナダへともたらしている。"
 gra_expand_qanahs: "水路の拡張"
 gra_expand_qanahs_desc: "ウマイヤ朝のカリフたちを通じてペルシアから受け継がれた地下式の重力灌漑水路、#italicカナート#!は、乾いたベガの平原を果樹園や養蚕用の桑畑へと変える。我々はシエラ・ネバダの雪解け水から発する水路網を、アルバイシン、アルムニェカル、アルメリアへと延伸し、水利権は古来の#italicトリブナル・デ・ラス・アグアス#!（水利裁判所）によって守られている。これらの用水路に支えられ、我が農地はシエラ・モレーナより北の地よりも豊かな収穫をもたらし、アル＝アンダルスの他のどこにも見られぬ人口の密集を支えている。"
 gra_expand_the_frontier: "開拓地の拡大"
 gra_expand_the_frontier_desc: "わが王朝が創設されて以来、領土は縮小化の一途をたどってきた。しかし、我々はいま強力な立場にあるため、失われた領土を取り戻すだけでなく、拡張することすら夢ではないはずだ。"
 gra_modernized_economy: "経済の近代化"
 gra_modernized_economy_desc: "現代は、より競争の激しい世界で繁栄できる近代的な経済を必要としている。インフラを強化し、我々の手法とプロセスをより効率的なものにすることで、同じ資源でより多くのものを生産できるようになるだろう。"
 gra_ghazawat: "ナスル・ガザワート"
 gra_ghazawat_desc: "君主国が啓蒙された大臣や常備軍によって自らを計るこの時代にあって、我が国家は各遠征を #italic ガザワート #! 、すなわち統治者と臣民を一つの宗教的・軍事的事業に結びつける聖戦と定める。 #italic ウラマー #! は金曜礼拝のたびに動員を説き、アルバイシン、アンテケラ、ロハの民兵たちは、国境で倒れし者に楽園を約す首長の勅許のもと、毎週訓練に励む。聖戦への信仰はグラナダの民兵を、ヨーロッパの世俗君主国がめったに知ることのない熱狂で満たすのである。"
 #Andalusi Unique
 gra_banu_nasr: "ナスル朝"
 gra_banu_nasr_desc: "我々は、預言者ムハンマドの伴侶であったサード・イブン・ウバーダの血筋を引くハズラジュ族の末裔だ。我々の王朝の創始者であるムハンマド1世は、グラナダ、ハエン、アルメリア、マラガを含む領土を支配していたが、それらの土地の一部はキリスト教勢力の手に落ちた。それ以来、我々はその進撃に粘り強く抗ってきた。そしてこれからも、祖先の強さによって抗いつづけるだろう。"
 gra_skillful_envoys: "優秀な使節"
 gra_skillful_envoys_desc: "ナスル朝首長国がいかなるタイファよりも二世紀長く生き永らえてきたのは、軍勢ではなく、カスティーリャ、アラゴン、マリーン朝、ジェノヴァの宮廷における我が使節たちの機敏さによるものである。秘密の書記官たる#italicカーティブ・アル＝シッル#!は常設の暗号書簡網を維持し、チュニスからトゥールーズに至るまで、商人を装う情報提供者の網を張り巡らせている。この外交の妙技は、六度に及ぶカスティーリャの王位継承と三度のマリーン朝侵攻を通じてキリスト教諸王国を互いに争わせ、我が首長国に幾十年もの存続をもたらしてきたのである。"
 gra_muttavia_armies: "ムタヴィアの軍隊"
 gra_muttavia_armies_desc: "グラナダの人口には限りがあり、徴兵可能な男性は国を効果的に守れるほどの数ではない。だが、人手は足りなくとも、国外の戦力を雇い、わが国の旗のもとで戦わせるだけの金はいくらでもある。"
 gra_adaptative_trade: "適応交易"
 gra_adaptative_trade_desc: "$christian_ADJ$国家と$muslim_ADJ$国家の仲介者としての、わが国の特権的な立場が脅かされている。この脅威は我々の手法を近代化し、より遠方の市場とヨーロッパとを結ぶ架け橋としての地位を取り戻せる可能性がある。"
 gra_a_strong_rule: "強力な支配"
 gra_a_strong_rule_desc: "ムハンマド六世、ムハンマド八世、ムハンマド九世の廃位と、三代にわたるナスル朝の継承危機は、#italicバヌー・アッ＝サッラージュ#!（アベンセラヘス家）とバヌー・アル＝アジーズ家との党派抗争を宮廷政治の定めとしてきた。強き首長のもとでは、両派閥は儀礼的官職に封じ込められ、アルハンブラの衛兵は忠実なムデハルによって刷新され、大宰相の位は血統ではなく実証された力量を持つ者に委ねられる。この王朝の結束は、カスティーリャの遠征すべてを合わせたよりも多くの都市を我らから奪ってきた内なる出血を止めるものである。"
 gra_a_new_golden_era: "新たな黄金時代"
 gra_a_new_golden_era_desc: "かつてアル＝アンダルスはイスラーム世界の知の中心であり、イブン・ルシュドによるアリストテレス註解、アッ＝ザフラーウィーの外科大全、そしてイブン・トゥファイルの哲学小説 #italic ハイイ・イブン・ヤクザーン #! を生んだ。我らはグラナダに #italic マドラサ・ユースフィーヤ #! を再興し、フェズとトレムセンより学者を呼び戻し、新たなスペインやフランスの科学書をアラビア語に翻訳して、我が医師や天文学者の用に供するであろう。この知の復興は、アンダルスの学問の灯がただ薄れたのみで、決して消えてはいなかったことを証し、マグリブ全土の知性に対して、いかなるキリスト教の隣国も及び得ぬ影響力を我が国家に与えるのである。"
 #Aragonese Shared
 aragonese_montaneses: "モンタニェセス"
 aragonese_montaneses_desc: "ハカとソブラルベ周辺の高いピレネーの谷は、#italicモンタニェーセス#!として知られる屈強な山岳戦士たちを育んできた。彼らが麓へと長く下り続けたことが、我が王国にレコンキスタ初期の軍事的名声をもたらしたのである。若き頃より荒れた地での戦いに鍛えられ、厳しい冬の遠征にも慣れた我らが山岳民は、常にこれと対峙してきた平地の徴募兵よりも速く動き、強く打ち込む。これらの谷より、その忍耐力が我らの遠征のすべてを形づくる機動歩兵が生まれるのである。"
 aragonese_pyrenean_passes: "ピレネーの峠道"
 aragonese_pyrenean_passes_desc: "中央ピレネーの高い峠（ソンポール、ロンセスバーリェス、および低地の季節路）は、ベアルンの羊毛、ガスコーニュの葡萄酒、ラングドックの織物を積んだ荷車のすべてを我が市場へと注ぎ込み、ハカとカンフランクの関所は十一世紀以来、その流れから王室の取り分を徴収してきた。これら#italicカミノス・レアーレス#!に沿って道を改良し、物見の塔に守備兵を置き、関税査定を統一することで、我らは地理の偶然を商業上の独占へと変えるのである。このピレネー越えの通商路に対する支配は、山の両側から商人を我が市へと引き寄せ、王室の金庫を確かな通行料で満たし続ける。"
 aragonese_castillos_frontera: "カスティージョス・デ・ラ・フロンテラ"
 aragonese_castillos_frontera_desc: "我が王国とアル＝アンダルスとの国境には、#italic カスティーリョス・デ・ラ・フロンテーラ #!（国境の城砦）が点在する——ロアレ、モンソン、アルバラシン、そして防御に適したあらゆる尾根に据えられた数多の小城である。各要塞は地元自治体の負担で維持され、王室が供するのは城壁と城代のみにすぎぬが、それでも侵略者が多大な攻城戦なしには容易に破れぬ防衛網を生み出している。この仕組みは、我が領土への侵攻を法外に高くつくものとし、我らの野戦軍が戦うべき時に至る遥か前から、攻め寄せる軍勢を消耗させるのである。"
 aragonese_salinas_reales: "王立製塩所"
 aragonese_salinas_reales_desc: "我らが王室は古くから、塩の産地であるナバル、サリェント、レモリーノスを独占してきた。採塩は財務機関直属の王室役人に委ねられている。王立製塩所は、変動の大きい農業税を補う安定した収入源となり、不作の年を乗り切るための資金を国家にもたらしている。この鉱物資源からの収入のおかげで、わが政府は他国に比べて財政的に健全であり、緊急時にコルテスから資金を調達する必要もないのである。"
 aragonese_sociedad_economica: "アラゴン経済協会"
 aragonese_sociedad_economica_desc: "サラゴサに創設された #italic レアル・ソシエダ・エコノミカ・アラゴネサ・デ・アミーゴス・デル・パイス #! は、聖職者、貴族、そして市民を問わず我が啓蒙せる市民を集め、農業の改良、製造業、そして商業改革について議論を交わす。その会合は、小冊子、懸賞論文、そしてヨーロッパ各地の改革者との直接の書簡を通じて実用の知識を広めている。この愛国的改良者たちの網は、その会員が関わるあらゆる部門の生産性を高め、我が州をイベリアでも最も静かなる近代化の原動力の一つへと変えていく。"
 aragonese_foralism: "フエロ主義"
 aragonese_foralism_desc: "いくつもの勅令によって我が王国が中世以来の諸制度を奪われて以来、法学者、歴史家、地方貴族からなる根強い運動が、失われた #italic フエロス #! の記憶とその実効力を守らんと尽力してきた。#italic フォラリスタ #!（地方特権擁護）の大義は地域の同一性を拠り所とし、中央政府との交渉によって特権の回復、地方裁判所、そして独自の法慣習の承認を求める。我らのたゆまぬ圧力は、マドリードが我が州を均一な行政単位の一つとして扱うことを許さず、我が諸制度はブルボン家が試みるあらゆる再編を生き延びるのである。"
 #Aragonese Unique
 ara_conquest_of_the_ebro: "エブロの征服"
 ara_conquest_of_the_ebro_desc: "ピレネーの谷より #italic エブロ #! の平野へと下る歩みは、幾世代にも及ぶ国境の戦いの集大成である——ウエスカは1096年に陥落し、#italic アルフォンソ・エル・バタリャドール #! は1118年にサラゴサを攻略し、これを王国の座とした。南への長き行軍に鍛えられ、城壁を持つムーア人の町を攻略する術に長けた我が国境の軽装歩兵は、陥落させた拠点のそれぞれを次なる進撃の基地へと変えていく。我が兵は要塞を落とすために鍛えられており、海戦のためではない。"
 ara_desperta_ferro: "デスペラータ・フェッロ！"
 ara_desperta_ferro_desc: "#italicデスペルタ・フェロ！#!（鉄よ目覚めよ！）は$a_almogavars$の雄叫びであり、突撃の前に槍の柄や投げ槍を火打ち石に打ちつけて火花を散らす所作を伴う。この叫びは1229年、ジャウメ一世のもとでのマヨルカ征服の際、ロジェ・デ・フロルのカタルーニャ傭兵団によるボスポラス海峡の斜面にて、そして長きにわたる地中海の世紀を通じたアラゴンのあらゆる遠征にて響き渡った。この戦場の儀礼は、接敵の前に我が歩兵を一つの唱和する塊へと結びつけ、ビザンツ人、シチリア人、フランス人を等しく怯ませる衝撃効果を生み出すのである。"
 ara_a_mediterranean_trade_power: "地中海交易の力"
 ara_a_mediterranean_trade_power_desc: "1164年のアラゴンとバルセロナ伯領との王朝的合同以来、我が王室はバルセロナ、バレンシア、パルマを基軸とする地中海の商業体系を築き上げてきた。世界初の常設海事商事法廷たる#italicコンソラット・デ・マール#!は、ピサからファマグスタに至るまでの紛争をカタルーニャ法に基づいて裁き、我が領事はアレクサンドリアからブルッヘまで、あらゆる主要港に権限を有する。この商業・法制度は、アラゴン王室をイタリアの銀行、アフリカの金、そしてレヴァントの香辛料とを結ぶ、欠くべからざる仲介者たらしめている。"
 ara_dinero_jaques: "ディネロ・ハケス"
 ara_dinero_jaques_desc: "アラゴンの初期の王たちの時代からハカで鋳造されてきたディネロ・ハケスは、王国で信頼される硬貨となり、その銀含有量は、王が貨幣の価値を下げようとするたびにコルテスによって守られた。安定した通貨があれば、王室は低い利率で借り入れ、商人は公正に取引でき、財務当局も、削られた粗悪な硬貨に悩まされることなく、歳入を徴収できる。この通貨の安定性が、いかなる税よりも確実に王国の財政を支えているのだ。"
 ara_diputacion_del_general: "総代会"
 ara_diputacion_del_general_desc: "我が王国の常設執行機関たる #italic ディプタシオン・デル・ヘネラル #! は、モンソン議会より生まれた常設委員会であり、一般税を管理し、議会開会の合間にも王国のフエロスを守り、四身分を代表して王室との絶え間ない対話を担う。我らは王国の税収をディプタシオンの会計局を通じて流し、その委員会を通じて公共事業に資金を供し、その常設の間に貴族諸家の不満を訴えさせるであろう。ディプタシオンが決して休会せぬがゆえに、我が王国は議会の記憶と会計の秩序を保ち続ける一方、王室の他の諸領は会期ごとに一から始めねばならぬのである。"
 ara_overseas_realms: "海外の領土"
 ara_overseas_realms_desc: "海の彼方において、王室は数多の領土を星座の如く集めている——1282年に得たシチリア、1324年のサルデーニャ、そして #italic アルフォンソ・エル・マグナニモ #! のもとでのナポリ——これらはいずれも併合されることなく、副王のもとに独立した王国として保たれている。我らはこれらの領土を、確認された特権、現地の官職、そしてその自由への軽い統制によって王朝に結びつけ、その貴族たちをして反逆よりも忠誠にこそ利を見出させるのである。この海外諸王国の連合は、王朝に絶えざる貢納と、いかなる競争者も容易には断ち切り得ぬ地中海の拠点の連なりをもたらす。"
 ara_carinena_vineyards: "カリニェーナのブドウ畑"
 ara_carinena_vineyards_desc: "乾燥した内陸の太陽に焼かれ、シエルソの風にさらされるカリニェーナとカンポ・デ・ボルハの石だらけの段々畑では、王国のはるか遠くでも高く評価される濃厚で力強いワインが生産される。貯蔵庫を備える修道院や町の同業者組合がエブロ盆地一帯で栽培地を広げ、収穫されたワインは川とラバを使って王室の宮廷や守備隊へと運ばれる。盛んなブドウ栽培によって、やせた高地の土壌から、内陸の王国でもとりわけ価値が高く安定した輸出品が生み出されるのだ。"
 ara_stronger_united: "より強い団結"
 ara_stronger_united_desc: "1164年のバルセロナ伯領との王朝的合同以来、王室は複合君主国として機能してきた。その構成領土（アラゴン本国、カタルーニャ、バレンシア、マヨルカ、サルデーニャ）はそれぞれ独自の #italic コルツ #! 、フエロス、通貨を保持している。これらの自由を廃することなく中央行政を強化するため、我らは尚書局を合理化し、諸領にわたる王室徴税を統一し、王の不在時に統治を担う #italic ロクティネン・ヘネラル #! の職を強化するであろう。この行政上の統合により、王室はヨーロッパのいかなる他の複合君主国にも並び得ぬ速さで、戦争、徴税、そして外交を調整することが可能となる。"
 ara_basilica_del_pilar: "ピラール大聖堂"
 ara_basilica_del_pilar_desc: "サラゴサにそびえ立つ壮大なバロック様式のピラール大聖堂は、聖母が聖ヤコブの前に現れたという柱の上に建てられたと伝えられており、スペイン各地から巡礼者を集めている。王室は聖堂参事会を支援し、大祝祭日には塔の下で行列に参加し、半島で最も由緒ある聖母マリア信仰によって自らの正統性を支えている。この宗教的な威信は聖職者と平民を王朝に結びつけ、単なる法律では成し得ないほどに、王国の統治を神聖なものとしている。"
 ara_protection_of_the_little_folk: "戦災孤児の保護"
 ara_protection_of_the_little_folk_desc: "わが国の兵士たちは戦場で倒れたとき、残された愛する者が路頭に迷わないことを望むだろう。アラゴンはその責務を果たし、救護院を建て、戦争で孤児となった子供たちを保護しよう。"
 ara_mossos_esquadra: "モソス・デスクァドラ"
 ara_mossos_esquadra_desc: "ペレ・アントン・ベシアナによって組織された農民隊、すなわち #italic モッソス・デスクアドラ #! は、自らが守る地元共同体から募られた常設の農村警察隊である。正規の軍指揮系統の外で活動し、直接カタルーニャ総督に報告するこの者たちは、王室軍が効果的に巡回し得ぬ地勢をも越えて盗賊や密輸者を追う。この地元の治安維持部隊は、民衆の反感を買うことなく公国の交易路を守り、やがて他のイベリア諸国が倣うべき範を示すのである。"
 ara_zaragoza_industry: "サラゴサの産業"
 ara_zaragoza_industry_desc: "内陸の王国が産業化の時代を迎え、サラゴサとエブロ回廊の町々には、製糖所、製粉所、鋳造所、鉄道工場が次々と建設されている。帝国運河の水、サラゴサをカンタブリア海岸および地中海と結ぶ新たな鉄道路線、そして農村からの人々の流入は、成長する製造業を支える。この産業の発展によって、かつて農業中心だった中心地域は、古くからの沿岸拠点に匹敵する生産地域へと成長している。"
 #Basque Shared
 nav_transatlantic_whaling: "大西洋全域での捕鯨"
 nav_transatlantic_whaling_desc: "四世紀にわたり、サン・セバスティアン、ベルメオ、レケイティオの漁師たちはカンタブリア海でビスケー湾セミクジラを狩り、銛や試油鍋、小舟による追跡術を磨き上げてきた。近海での乱獲に追われ、我らの船団は今やニューファンドランドとベル・アイル海峡へと航海し、レッド・ベイに季節限定の#italicチャルパ#!解体場を築き、鯨油をイングランドやハンザ同盟へ売り渡している。この遠洋捕鯨者たちのおかげで、他のどの欧州艦隊が北米の海域へ定期的に乗り出すよりも数十年早く、バスク沿岸は大西洋にその存在を刻み続けている。"
 nav_fearless_seamen: "恐れ知らずの船乗り"
 nav_fearless_seamen_desc: "バスク沿岸はピレネー山脈と海の間にわずかな耕地しか持たず、我らの沿岸共同体は古くから漁業、交易、水先案内を通じてビスケー湾に生計を求めてきた。ビルバオ、パサイア、バイヨンヌの船乗りたちは欧州半分の商船団に乗り組み、フアン・デ・ラ・コサはコロンブスの #italic サンタ・マリア号 #! を導き、フアン・セバスティアン・エルカーノは世界初の周航を成し遂げ、アンドレス・デ・ウルダネタはマニラからアカプルコへの太平洋帰路を開拓した。これほどの航海の才が集まることで、バスク語圏の港は、イベリアの船乗り術にとって欠くことのできない訓練の場となっている。"
 nav_people_of_the_sea: "海の民"
 nav_people_of_the_sea_desc: "ビルバオ、パサイア、サン・セバスティアンの港から、バスク語を話す乗組員たちは、我らの小さな人口からは想像もつかぬほどの割合で、イベリアのあらゆる大航海の下甲板を占めてきた。我らの水先案内人はニューファンドランド浅堆の最初の海図を描き、甲板長はマニラ・ガレオン船の艤装を担い、砲手はスペイン無敵艦隊の大型船に不釣り合いなほど多く乗り組んでいる。バスクの港を手中に収める者は、我らの港だけで遠洋艦隊の乗組員を揃えることができる。"
 nav_an_industrious_folk: "勤勉な民"
 nav_an_industrious_folk_desc: "ビスカヤとギプスコアの山間の谷には西欧随一の鉄鉱床が眠り、ローマ時代から #italic フェレリア #! と呼ばれる小さな水力鍛冶場で採掘されてきた。我らの鍛冶師たちが作り出すビスカヤ鋼はあまりに硬く、トレドの剣も、テルシオの火縄銃も、スペイン・ガレオン船すべての錨も、バスクの製鉄師に頼っている。採掘から精錬、鍛造までを一つの連鎖の中で行うこの経済は、バスク地方にその人口に見合わぬ工業力を与えている。"
 nav_shipyards_ironworks: "造船と鉄工"
 nav_shipyards_ironworks_desc: "パサイア、オリオ、ムトリクの造船所と、デバ川およびカダグア川流域の製鉄所は、ピレネーの木炭とビスカヤの鉄鉱石によって何世紀も支えられてきた一つの工業地帯を形成している。我らはワロンやスウェーデンの鍛造技術で鍛冶場を近代化し、パサイアの #italic レアル・アスティリェロ #! でオランダ式設計の竜骨を敷き、マヌエル・デ・コシオに王室のための新たな三層甲板艦隊の設計を依頼している。この工業複合体は、鉱石から進水まで一地域内で一等戦列艦を建造し得る、イベリア唯一の場所であり続けている。"
 nav_royal_basque_society: "王立バスク協会"
 nav_royal_basque_society_desc: "ペニャフロリダ伯爵とバスク貴族の一団によってベルガラに設立された#italicレアル・バスコンガーダ愛国者協会#!は、イベリア半島初の近代的学術団体である。ベルガラの#italic愛国神学校#!は地方郷士の子弟に近代化学、数学、経済学を教え、史上初めてタングステンを単離したファウストとフアン・ホセ・エルウヤル兄弟を輩出した。これを通じて、バスク諸州はスペイン王国の啓蒙思想全体において、科学と経済の最前線に立っている。"
 #Basque Unique
 nav_shipbuiling_experts: "造船の専門家"
 nav_shipbuiling_experts_desc: "パサイア、ムトリク、レケイティオの船大工たちは、十三世紀以来、捕鯨用ケッチ船、ニシン漁船、大西洋横断貨物船を外国の顧客のために建造してきた。ナバラ王室は我らの造船所に特許を与え、地元産の樫材、ピレネーの鉄具、損傷船を迅速に代替できる建造法に基づく船体設計の標準化を命じている。これほど多くの造船所が稼働していることで、ナバラのみがイベリア諸王国の中で、予告からわずか一季節のうちに完全装備の艦隊を進水させることができる。"
 nav_memories_reconquista: "レコンキスタの記憶"
 nav_memories_reconquista_desc: "1212年のラス・ナバス・デ・トロサの戦いにおいて、ナバラの「強勇王」サンチョ7世は自ら騎士団を率いてアルモハド軍の中央を打ち破り、今やナバラ王家の紋章を飾るカリフの黄金の天幕の鎖を奪い取った。後にカスティーリャとアラゴンの台頭によって内陸に閉ざされたとはいえ、ナバラの騎士たちは代々サンチョの突撃の伝説の中で育てられ、半島のあらゆる主要なキリスト教遠征に身を投じる覚悟を持ち続けている。この十字軍の伝説は、ナバラ王国にその小さな国土だけでは決して得られなかったであろう神聖な地位をイベリア半島にもたらしている。"
 nav_a_renaissance_realm: "ルネサンス国家"
 nav_a_renaissance_realm_desc: "ピレネー山脈にまたがるナバラは、北からはボルドーとパリの大学、南からはサラマンカとアルカラの大学を通じて、ルネサンス人文主義を二つの経路から受け入れている。ジャン3世・ダルブレとカトリーヌ・ド・フォワの宮廷はエラスムスと文通し、ペドロ・デ・アタラビアの哲学講義を主催し、バスク語初の出版物であるベルナルト・エチェパレの#italicバスク語初歩#!を支援している。この知的な開放性は、フランスとカスティーリャの人文主義を仲介するにふさわしい、小さくも国際的なエリート層を生み出している。"
 nav_always_ready: "常時警戒"
 nav_always_ready_desc: "わが国は、四方を強力な敵に囲まれた小国として生まれた。このことは、わが国の特性の発展と、世界との関わり方のアプローチに大きな影響を与えた。その結果、我々はつねに警戒を怠らず、わずかな脅威の気配にも対応できる態勢を整えるようになった。"
 nav_chartered_councils: "公認議会"
 nav_chartered_councils_desc: "カスティーリャ語で#italicフエロス#!として知られ、各バスク州を治める慣習法の体系に相当する#italicフオラク#!は、ナバラ王家への忠誠と引き換えに地方自治を保障している。各歴史的領域はその総会である#italicフンタ・ヘネラル#!に対して責任を負う#italic県議会(ディプタシオン・フォラル)#!を選出しつつ、より広い王室統治のもとにとどまっている。これらの評議会を通じて、王室はフエロス擁護の激しい反乱を招くことなく、税と兵を徴することができ、こうした反乱は他のイベリア諸国の中央集権化計画を幾度も頓挫させてきた。"
 nav_basque_ferocity: "猛々しき$basque$"
 nav_basque_ferocity_desc: "$french$がいまだ涙するロンスヴォーの戦いや、ナバラ傭兵団の作戦以前から、わが国民はつねに獰猛な戦士とみなされてきた。我々は、敵にそれを忘れさせてはならない。"
 nav_mercantile_expansion: "商業の拡大"
 nav_mercantile_expansion_desc: "ナバラの商人たちは中世初期以来、カスティーリャ、アラゴン、フランス大西洋岸の港を結ぶピレネー羊毛交易路に沿って商業網を築いてきた。バイヨンヌとトゥデラの領事館を通じて、我らの商家は今やカスティーリャ産メリノ羊毛のフランドルへの輸出、イングランド布のイベリア内陸への輸入、そしてボルドー市での銀と香辛料の取引を扱っている。こうして、山に囲まれた内陸の王国でありながら、海峡からグラナダに至る大陸の主要な交易動脈すべてに利害を持つに至っている。"
 nav_navarrese_defense_force: "ナバラ防衛軍"
 nav_navarrese_defense_force_desc: "時を経るにつれて、近隣諸国はその力を増しつづけ、我々の国家としての存続は脅かされつづけている。これに対処するため、新兵の質を落とすことなく、兵士の数を増員することで戦力を強化することを目的とする軍事部門を創設しよう。"
 nav_adept_traders: "交易の達人"
 nav_adept_traders_desc: "我々の船の品質、商人の熟練度、そして手順の効率化によって、交易事業は驚くほどの利益をあげられるようになった。これはわが国に多くの富をもたらし、国を強化するのに役立つだろう。"
 nav_the_national_military_academy: "国立軍事アカデミー"
 nav_the_national_military_academy_desc: "わが軍の専門化に伴って、新兵のための教育施設が必要となっている。経験豊富な兵士たちに戦いの秘訣を新兵に教えさせ、軍の先鋒とするのだ。"
 nav_efficient_bureaucracy: "効率的な官僚制度"
 nav_efficient_bureaucracy_desc: "半島初の恒久的な王室財務院として設立されたパンプローナの #italic カマラ・デ・コントス・レアレス #! は、イベリアで最も長く続く財政記録を生み出してきた。我らはその手続きを啓蒙時代の複式簿記、フランス王室の慣行に倣った番号付き文書管理制度、そしてオニャティ大学出身の熟練法律家を上級会計職に任命することで近代化している。これらの方法のもとで、王室は王国から極めて精緻に歳入を集めている。"
 nav_riflemen_march: "ライフル兵の行進"
 nav_riflemen_march_desc: "施条マスケット銃と雷管の導入は、散開隊形での散兵戦という新たな戦術教義を要求するが、ピレネーの地形は幾世代にもわたりナバラ歩兵をまさにこの戦い方に鍛え上げてきた。パンプローナ王立士官学校は #italic 猟兵行進(マルチャ・デ・カサドーレス) #! を開発しつつあり、これは大隊全体が部隊の結束を保ちながら遮蔽下で前進できるようにする、速歩の行進律動と散開訓練である。この訓練により、ナバラ軽歩兵は施条兵器戦の現実に適応しようとするあらゆるイベリア軍の模範となっている。"
 #Castilian Shared
 cas_repoblaciones: "移民の誘致"
 cas_repoblaciones_desc: "我々の祖先がおこなった征服のおかげで、農地や居住に使える土地が人口を上回る国となった。その結果ほかの地域、特に1267年にイスラム教徒たちが追放されて以来、深刻な人口不足に陥っているアンダルシア南部から移民を呼び込む必要性が高まった。"
 cas_castilian_navy: "カスティーリャ海軍"
 cas_castilian_navy_desc: "半島の海岸線が荒々しいカンタブリア海と大西洋航路とに分かれる我が国において、海軍は長らく国家存続の柱であり、#italicカスティーリャ大提督#!の職によって統率されてきた。サンタンデルからセビーリャに至るまで、我らの造船所は中世後期のカンタブリア戦争を通じてイングランドやハンザの艦隊を凌ぐ艦隊を送り出し、ペロ・ニーニョのような提督はテムズ川にまで達する襲撃を行った。この海軍は、来るべき大洋帝国の時代が求める深海の航海に備えている。"
 cas_masters_of_the_orders: "修道会の主"
 cas_masters_of_the_orders_desc: "レコンキスタが完了した今、カスティーリャの三大軍事修道会(#italic Santiago #!、#italic Calatrava #!、#italic Alcántara #!)は広大な領地と私兵を擁しながら、もはや戦うべき敵を持たない。カトリック両王は静かな併合を開始しており、これにより王室は各修道会の総長職を掌握し、その領地、#italic encomiendas #!、そして金銀を王室の支配下に移す。この吸収により、カスティーリャ国内で王権に残された最後の有力な対抗勢力は排除され、王室の恒久的な資源に比類なき軍事力と宗教的権威が加わることとなる。"
 cas_marine_infantry: "カスティーリャ海軍歩兵"
 cas_marine_infantry_desc: "皇帝カール5世は、地中海のガレー船に乗り組むテルシオの要員を供給するため、世界初の常設海兵隊である #italic ナポリ海の古参中隊 #! を創設した。この #italic 海兵隊員(インファンテス・デ・マリーナ) #! は、接舷戦の混乱に対応し、オランからマニラに至る沿岸要塞の守備に備えて訓練されている。この常設の強襲部隊は、あらゆる旗艦の価値を倍加させ、二つの大洋にまたがる帝国の沿岸連絡を確固たるものにしている。"
 cas_pasos: "カスティーリャのパソス"
 cas_pasos_desc: "聖週間の #italic パソス #! (街路を行進する受難の巨大な彫像群)は、カスティーリャ・バロックを代表する民衆芸術となった。バリャドリッドのフアン・デ・フニやグレゴリオ・フェルナンデスらの彫刻家は、彩色木彫を用いてこの様式を17世紀初頭に頂点へと高め、行列を見る群衆が涙するほど解剖学的に生々しい像を生み出している。この行列の文化は都市の民衆、教区の信心会、そして王権を一つの信仰的見世物に結びつけるものであり、いかなるプロテスタント国家もこれに並ぶことはできない。"
 cas_canal_de_castilla: "カスティーリャ運河"
 cas_canal_de_castilla_desc: "ヨーロッパ各地から商業用・灌漑用双方の用水施設から着想を得た#italic カスティーリャ運河#!は、#italic メセタ#!北部の山々から、カスティーリャ旧市街の穀物畑へと水を運ぶ。この工学における偉業により、畑の収穫量が増し、交易できる余剰品が生み出され、運河そのものが輸出港へ輸送する手段ともなる。"
 #Castilian Unique
 cas_a_land_of_castles: "城塞の地"
 cas_a_land_of_castles_desc: "カスティーリャという名そのものが、ドゥエロ川、タホ川、グアディアナ川沿いの防御に適した尾根という尾根を戴いてきた #italic カスティーリョス #! (城、要塞、物見塔)の網に由来する。これは9世紀のメセタ再植民以来のことである。ブルゴス、ゴルマス、カラトラバ、そして #italic カスティーリョス・デ・ラ・フロンテーラ #! に連なる幾十もの主塔は、辺境の自治会議( #italic コンセホ #! )と、王の特許状のもとにあるサンティアゴ騎士団およびカラトラバ騎士団によって築かれ、守備され、維持されている。幾世紀にもわたる築城により、我が王権はあらゆる辺境に要塞の連なりを得てきた。"
 cas_camino_de_santiago: "サンティアゴの巡礼路"
 cas_camino_de_santiago_desc: "サンティアゴの巡礼路は、ピレネー山脈からブルゴス、カリオン、レオンを通って西へ進み、コンポステラへと至る。救護所や橋が整備されたこの街道には、巡礼者、修道士、外国の商人が絶え間なく行き交うため、沿道の町々は巡礼者相手の商売で栄え、そのフエロが入植者を呼び込み、巡礼路に沿ってメセタの再入植が進む。この信仰と交易の大動脈がわが国境の町々に人を集め、キリスト教徒が住む北方を信教に基づく1つの道へと結びつけているのだ。"
 crd_city_of_the_caliphs: "カリフの都"
 crd_city_of_the_caliphs_desc: "929年以来、ウマイヤ朝の #italic ヒラーファ #! は #italic マディーナト・クルトゥバ #! をラテン世界とイスラム世界西方で最大かつ最も学芸の栄えた都市とした。街路は舗装され灯火に照らされ、大モスクと宮殿都市 #italic マディーナト・アッ=ザフラー #! は時代の驚異であった。フェルナンド3世が1236年にこれをキリスト教支配下に取り戻したものの、その栄華の記憶は今も街のあらゆる区域にまとわりつき、大司教座とその領主たちに不相応なまでの重みを与えている。我々はかつてバグダードからアーヘンにまでその名が伝わった都の名声に頼り、現在の実力をはるかに超える学者、巡礼者、使節団を引き寄せているのだ。"
 jae_llave_de_castilla: "カスティーリャの番人"
 jae_llave_de_castilla_desc: "ハエンはその紋章に #italic グアルダ・イ・デフェンディミエント・デ・ロス・レイノス・デ・カスティーリャ #! (カスティーリャ諸王国の守護と防衛)の銘を掲げる。これはナスル朝グラナダに対し二世紀にわたり最前線を守り抜いて得たものだ。町を見下ろすサンタ・カタリーナから山地に連なる物見塔に至るまでの辺境の #italic カスティーリョス #! の環は、国境を越えるあらゆる襲撃と反撃を制御している。この城塞化された辺境の役割こそが、この王国を南方におけるカスティーリャの盾とし、絶え間ない戦いに鍛えられた住民を育んでいるのだ。"
 muc_huerta_acequias: "ウエルタ・デ・ムルシア"
 muc_huerta_acequias_desc: "#italicムルシアのウエルタ#!は#italicアセキア#!という稠密な網で潤されている。これはアンダルス人技師が設計した重力式水路であり、今も古来の#italicコンセホ・デ・オンブレス・ブエノス#!水利法廷によって管理され、セグラ川の水配分をめぐるあらゆる争いを裁いている。我が庭師たちは桑、柑橘、野菜をこれほど豊かに育てるがゆえに、川がなければステップにすぎぬ土地が年に幾度もの収穫をもたらすのだ。この灌漑網こそが、ムルシアの平野をイベリア全土でも屈指の集約的生産地たらしめている。"
 sev_guadalquivir_port: "グアダルキビル川の港"
 sev_guadalquivir_port_desc: "セビーリャは #italic グアダルキビル川 #! の航行可能な上限に位置する。これはイベリア唯一の大河港であり、外洋船が潮に乗って内陸50マイルを遡り、城壁の下に係留できる場所である。我が埠頭には #italic アルハラフェ #! の油と葡萄酒、内陸の羊毛が積み込まれ、広い海からの魚、布地、木材が荷揚げされる。この内陸深水港こそ、セビーリャを南方の自然な交易の中心地たらしめ、河川交易と海洋交易の出会う場所としているのだ。"
 tol_primate_see: "スペイン首座大司教座"
 tol_primate_see_desc: "トレド大司教は#italicプリマド・デ・ラス・エスパーニャス#!(全イスパニアの首座)であり、711年以前に同市で開かれた西ゴート公会議の権利によって、半島随一の高位聖職者とされる。我が司教座はスペイン随一の富裕な司教区を統べ、広大な属司教区の網を擁し、教会と王権いずれの事柄においても、いかなる王も軽んじることのできぬ発言力を持つ。教会における我らの首位権は、王国に大いなる宗教的権威と絶えぬ十分の一税および聖職推挙の恩恵をもたらしている。"
 cas_cronicas_reales: "王国年代記"
 cas_cronicas_reales_desc: "賢王アルフォンソ10世の #italic エストリア・デ・エスパーニャ #! の伝統に倣い、王室尚書局は長らく各治世の公式年代記を編纂させてきた。#italic アルフォンソ11世年代記 #! 、ペドロ・ロペス・デ・アヤラによるトラスタマラ内乱の記録、エルナンド・デル・プルガルの #italic カトリック両王年代記 #! などがそれである。これらを一つの王朝史へと編むことで、我々はあらゆるカスティーリャ王を、アストゥリアスのペラーヨにまで遡る西ゴートとレコンキスタの連続した血統に結びつけている。このように記されることで、我が王朝の正統性はペラーヨにまで途切れることなく続くのだ。"
 cas_santa_hermandad: "市議会同盟"
 cas_santa_hermandad_desc: "カスティーリャの諸都市が誓約した同盟、#italicエルマンダーデス#!は、互いの民兵を結集して街道を警備し、盗賊を追い詰め、王の官吏の手の届かぬ場所でも王の平和を守っている。弩と槍で武装し、自ら選んだ#italicアルカルデ#!に従うこれらの同盟は、不穏な貴族や追い剥ぎを同様に威圧する常設の地方警備組織を擁する。この同盟は自らの構成員の資金により運営され、王室財政を圧迫することなく王国の秩序を保っている。"
 crd_silver_filigree: "コルドバの銀細工"
 crd_silver_filigree_desc: "コルドバの金属細工師たちは、アンダルス伝来の #italic フィリグラーナ #! の技を受け継いでいる。これは銀や金を極めて細い線に引き延ばし、レース編みのような装飾、聖遺物箱、宝飾品へと仕立て上げる、北方の追随を許さぬ技術である。旧モスクのほとりに広がる銀細工師街から、我が職人たちはカスティーリャ、ジェノヴァ、マグリブの奢侈品市場へ、どこで売られようとも高値を呼ぶ品々を供給している。この精緻な職人技の集積が、熟練の手とその富をこの都市に根付かせ、工芸の中心地としての名声を磨き上げているのだ。"
 jae_olive_presses: "オリーブ圧搾"
 jae_olive_presses_desc: "ハエンの起伏豊かな大地は、一面の途切れぬ#italicマル・デ・オリボス#!(オリーブの海)であり、ローマ時代のバエティカ以来、あらゆる丘を銀灰色に装ってきたオリーブ林である。我が#italicアルマサラ#!は秋の収穫を搾って油とし、大きな陶製の#italicティナハ#!に蓄え、騾馬隊によって半島内外の市場へと運ぶ。このオリーブ単作こそが、この州を南方随一の油の産地たらしめ、その農村の富の原動力となっているのだ。"
 muc_silk_looms: "ムルシアの絹織機"
 muc_silk_looms_desc: "ウエルタの桑畑は盛んな #italic 養蚕業#! を支え、市内とその #italic モレリーア#! の機織り工房は、繰った生糸を王国中で珍重される繻子織や天鵞絨に織り上げる。アル=アンダルスから受け継いだこの養蚕と機織りは、春に蚕が孵る頃から冬に織物が売られる頃まで、この都市の家々の大半を占める仕事となっている。この絹産業こそがムルシア王国を代表する製造業であり、その都市の富の基盤である。"
 sev_merchant_fairs: "商人の市"
 sev_merchant_fairs_desc: "市に加え、そしてジェノヴァ、フィレンツェ、ブルゴスの居留地や商館が置かれていることから、セビリアはインディアスの時代が訪れるはるか前から半島で最も活気ある市場であった。ここの交易所は、地中海や大西洋を渡りやって来る商人のために為替手形、海上保険、貨物を取り扱っており、ほかの都市にはない洗練された商業基盤を備えている。この確立された商人社会が、これから築かれる都市の繁栄の金融基盤となるのである。"
 tol_school_of_translators: "翻訳者の学派"
 tol_school_of_translators_desc: "12世紀以降、トレド翻訳学派には大司教の（後には王室の）庇護のもとキリスト教徒、ユダヤ教徒、イスラム教徒の学者が集まり、アラブ世界の科学や哲学をラテン語とカスティーリャ語に訳している。クレモナのジェラルド、マイケル・スコット、ならびにアルフォンソ10世の後援のもと集まった翻訳者たちは、アリストテレス、プトレマイオス、ユークリッドの著作、そしてアヴィセンナ（イブン・スィーナー）の医学をキリスト教世界にもたらした。この翻訳活動によって、トレドはイスラム世界とラテン世界を結ぶ知の大きな窓口となり、学者たちを引きつけているのである。"
 cas_audiencias: "王立アウディエンシア"
 cas_audiencias_desc: "バリャドリッドに、後にはグラナダにも置かれた王室の #italic アウディエンシア #! と #italic チャンシリェリーア #! 、すなわち高等法院は、かつては強欲な領主の法廷で揉み消されていた上訴を、王の裁きとして王国の隅々にまで行き渡らせている。サラマンカでローマ法を学んだ法服の #italic オイドール #! たちは、貴族も平民も等しく単一の王権司法のもとに結びつける。この王権司法の仕組みこそが王国を一つに編み上げ、反乱の温床となる法的独立を大家門から奪い去るのだ。"
 cas_new_world: "新大陸"
 cas_new_world_desc: "コロンブスの上陸とサンタ・フェ協約により、大洋の彼方の土地と民はカスティーリャ王権のもとに置かれた。我々は #italic エンコミエンダ #! の型に則って征服者や許可を得た植民者に特許を与え、布教と引き換えに先住民の労働に対する権利を授け、新たな大地から鋳造されるあらゆる金属の五分の一、すなわち #italic キント・レアル #! を徴収する。ヨーロッパ列強の中でカスティーリャのみが、半球をも呑み込む用意のある統治の仕組みをすでに備えているのだ。"
 crd_cordwainer_guilds: "革細工職人のギルド"
 crd_cordwainer_guilds_desc: "コルドバはその名を #italic コルドバン #! 、すなわち柔らかな山羊革と、金箔と彩色を施した #italic グアダメシ #! の壁掛けに与えた。その鞣しと細工の技は、カリフ国の時代より同業組合によって磨き上げられてきた。グアダルキビル川沿いの我が #italic クルティドーレス #! と #italic グアダメシレーロス #! は、ヨーロッパのあらゆる宮廷で珍重される靴、製本革、馬具、革製品を供給している。この代表的な工芸こそが安定した輸出交易を支え、この都市の労働者の多くを組織する同業組合の仕組みを築いているのだ。"
 jae_linares_lead: "リナレスの鉛"
 jae_linares_lead_desc: "#italicリナーレス#!とシエラ・モレナの地は、カストゥロの鉱山がカルタゴとローマに供給して以来、鉛と銀を含む方鉛鉱を産出し続けてきた。我が精錬所は船体や屋根を覆う鉛板を鋳造し、王国の火薬庫を満たす弾丸を作り出す。今やハエンはオリーブ林とは全く異なる鉱物資源と、屈強な鉱夫たちの労働力を手にしている。"
 muc_consulado_de_la_seda: "絹商会"
 muc_consulado_de_la_seda_desc: "ムルシアは#italic絹商務院（コンスラード・デ・ラ・セダ）#!設立の勅許を得た。これは絹取引所と商人組合を兼ね、品質検査、商事紛争の裁定、そしてカルタヘナとアリカンテの港を通じた布地輸送の資金調達を担う権限を持つ。我が商人たちは王室と外国人買い手の前で自らを代表する公認法人を獲得し、独自の裁判権と準備金を備えることとなった。この機関は散漫な家内工業を、組織立った広範な商業の原動力へと変える。"
 sev_casa_de_contratacion: "通商院"
 sev_casa_de_contratacion_desc: "王室はセビリアに #italic Casa de Contratación #! を設立し、インディアスへ向かうあらゆる船舶、乗客、積荷に許可を与え、登録し、課税するとともに、その #italic 王室海図（パドロン・レアル） #! に新大陸の海の全図を保管する。我が都市は新世界貿易の唯一の合法的玄関口となり、水先案内人は試験を受け、帰還する地金は王室官吏の下で計量される。この独占は二つの大陸の銀を一つの河港に集め、セビリアをヨーロッパで最も富裕で垂涎の的となる都市に変える。"
 tol_toledan_steel: "トレドの鋼"
 tol_toledan_steel_desc: "トレドの刀鍛冶が鍛える鋭い切れ味の鋼は、古代からヨーロッパ中に名を知られている。その鋭さの秘密は、細かな砂で焼き入れした鋼をタホ川の水で冷やす技術と、職人組合が固く守る秘伝の技にある。刀剣職人は自身の銘を刃に入れ、当代随一の兵士に武器を提供するとともに、イタリアやインディアスなどの遠方の宮廷にまで剣を輸出している。この技術によって、トレドの名は最高品質の武器の代名詞となっているのだ。"
 cas_armada_real: "王立艦隊"
 cas_armada_real_desc: "#italic王立艦隊（アルマダ・レアル）#!はカンタブリア、アンダルシア、ナポリのガレオン船とガレー船を一つの王室艦隊に結集し、財宝船団を護衛し、海峡からレヴァントに至る海域を制する。我が国のサンタンデル造船所と南部の兵器廠は大型艦船を建造・改修し、熟練した乗組員たちがあらゆる作戦でこれを操る。常設の王立海軍は、分離独立した継承国家がどれほど努力しても及ばぬほど、歴史的な王権の手を外洋全域に広げる。"
 cas_reform_of_millones: "ミジョネスの改革"
 cas_reform_of_millones_desc: "#italicミリョネス税（セルビシオ・デ・ミリョネス）#!は、無敵艦隊の惨敗の後にカスティーリャ議会によって初めて承認された、王国内で販売される四大必需品（ワイン、油、酢、肉）への間接消費税である。投票権を持つ十八都市との交渉条件のもと六年ごとに更新され、財産ではなく消費に課すことで貴族や聖職者の免税特権を回避する。この一つの改革だけで、財政が最も逼迫した時期に通常の王室歳入をほぼ倍増させ、理想的にはハプスブルク家の戦争機構を次世紀まで支え続ける。"
 crd_andalusi_libraries: "アンダルスの図書館"
 crd_andalusi_libraries_desc: "カリフのハカム2世が築いた図書館には、ヨーロッパのほかの国々ではまだまだ蔵書が少なかった時代において、すでに40万冊もの蔵書があったとされており、その学問の名残が、復興したコルドバの学問を支えている。学者たちが集い、コルドバが暗黒の世紀を通じて守り伝えた数学、医学、哲学を写し、翻訳し、教えているのだ。この受け継がれた学問の厚みが半島各地から人材を引き寄せ、聖職者や法学者の識字率と地位を高めている。"
 jae_frontier_jinetes: "国境のヒネーテ"
 jae_frontier_jinetes_desc: "グラナダと対峙してきた幾世代もの経験が、#italic ヒネテ #! と呼ばれる軽騎兵の一群を育て上げた。彼らは #italic ア・ラ・ヒネタ #! と呼ばれる乗り方で短い鐙にまたがり、革製の #italic アダルガ #! 盾と投げ槍の束を携える——これはムーア人の敵から学び取った戦法である。我が騎兵たちは、北方の重槍騎士には真似のできない速さと持久力で奇襲、待ち伏せ、偵察を行う。我が軍は国境戦にうってつけの、俊敏で歴戦の、しかも安価な騎馬兵力を手にする。"
 muc_baroque_processions: "バロックの行列"
 muc_baroque_processions_desc: "ムルシアの聖週間は南部を代表する盛大な宗教行事の一つへと発展し、受難を象徴する山車を担ぎ、信者で埋め尽くされた街路を練り歩く兄弟団は、もっと生き生きとした彩色彫像を制作してもらおうと競い合い、貴族、職人、労働者を一つの宗教的な祝祭へと等しく巻き込んでいく。行列を作り行進するこの文化は、王室と教会の双方がそれを称え導くことのできる形で、市民としての一体感と民衆の信仰心を強めている。"
 sev_triana_ceramics: "トリアナの陶器"
 sev_triana_ceramics_desc: "川向こうのトリアナでは、代々の陶工たちが釉薬を施した彩色タイルや陶器を焼き上げ、王国とその植民地の建造物の床、外壁、祭壇を彩っている。その窯では、アンダルスから継承した幾何学的なムデハル様式の模様のほか、教会や宮殿が求める絵画パネルも焼かれている。陶芸は、半島各地から大西洋の向こうまで製品を送り出す、特徴的かつ収益性の高い産業なのだ。"
 tol_imperial_cortes: "帝国コルテス"
 tol_imperial_cortes_desc: "西ゴート王国と帝国の古都であり、かつてはカール5世の宮廷が置かれたトレドは、厳粛なコルテスが開かれる場所として選ばれている。国王、聖職者、大貴族、そして都市の代表者が集まり、特別税の承認や王位継承の決定、王位継承者への忠誠の宣誓などをおこなう。コルテスの開催地というこの役割により、王国は王政の儀礼および政治の中心として位置づけられている。"
 cas_consejo_de_castilla: "カスティーリャ評議会"
 cas_consejo_de_castilla_desc: "#italicカスティーリャ枢密院（コンセホ・デ・カスティーリャ）#!は王国統治の頂点に座し、#italic法学官僚（レトラード）#!から成る合議体として法を起草し、裁判所と財務を監督し、国王が外征や戦争で不在の際にはその名において統治を行う。その各委員会と#italicコレヒドール#!は都市や地方の隅々にまで及び、王意を行政上の現実へと変える。この枢密院を通じて王権は、王国内の他のいかなる機関にも匹敵しえぬ及ぶ範囲と継続性をもって統治する。"
 cas_real_academia_espanola: "スペイン王立アカデミー"
 cas_real_academia_espanola_desc: "ビジェーナ侯フアン・マヌエル・フェルナンデス・パチェコにより、 #italic アカデミー・フランセーズ #! を範として創設された #italic スペイン王立アカデミー（レアル・アカデミア・エスパニョーラ） #! は、「 #italic 清め、定め、輝きを与える #! 」（カスティーリャ語を浄化し、確立し、輝きを与える）を標語に掲げる。その最初の大事業である全六巻の #italic 権威辞典（ディクシオナリオ・デ・アウトリダデス） #! は、カディスからリマに至るあらゆるカスティーリャ語著作家を結びつける正書法、文法、語法の規範を定める。この機関は我が言語をヨーロッパの偉大な俗語の中で最も規律正しく、広く輸出可能なものとし、文芸の道具であると同時に帝国の道具ともする。"
 crd_andalusian_horse: "アンダルシア馬"
 crd_andalusian_horse_desc: "グアダルキビール川沿いの牧草地は #italic caballo andaluz #! を育む——コルドバの軍馬であり、その引き締まった力強さ、高い歩様、そして武装下での安定性ゆえにヨーロッパで最も珍重される乗馬である。我が種馬場は、後に王立 #italic 馬丁所（カバレリサス） #! として制度化され、この時代のあらゆる宮廷と騎兵隊が求める血統を洗練させる。我が繁殖事業は王国に貴重な輸出品をもたらすとともに、自らの騎兵隊にも優れた軽騎馬を供給する。"
 jae_royal_mines: "王室鉱山"
 jae_royal_mines_desc: "王室は、シエラ・モレナの銀鉱山と鉛鉱山を王室鉱山として直轄化して、給与制の監督官を任命し、木材や労働力を確保するとともに、最も豊かな鉱脈を国庫の管理下に置いている。これにより、南部で産出される銀や鉛は私人に渡ることなく、王室の財政を支えるようになる。王室の直接統治によって、鉱山は国家財政を支える安定した基盤となるのである。"
 muc_cartagena_arsenal: "カルタヘナ造船所"
 muc_cartagena_arsenal_desc: "丘の連なりに守られた #italic Cartagena #! の深い天然港は、乾ドック、綱工場、鋳造所、地中海艦隊用の船台を備えた王立海軍 #italic 工廠（アルセナル） #! として要塞化・整備される。我が基地は、レヴァント沿岸を守り、イタリアへ向かう船団を護衛する艦隊を建造し、修理し、糧食を供給する。この工廠により、ムルシア領は西地中海における王国の海上覇権を支える不可欠な柱となる。"
 sev_jabon_works: "石鹸工房"
 sev_jabon_works_desc: "#italic セビリア石鹸（ハボン・デ・セビリア） #! ——アルハラフェ産オリーブ油と沿岸の #italic バリージャ #! の灰から煮出された硬質の白石鹸——は、レコンキスタ以来の独占権のもと、トリアナの巨大な #italic アルモナ #! （石鹸工房）で王室の許可を得て製造される。我が石鹸工房は王国のあらゆる家庭で求められる必需品を供給し、大量にインディアスへも輸出する。この製造業は、この地方の豊富な油を、耐久性があり利益を生む輸出品へと変える。"
 tol_royal_armory: "王立兵器工場"
 tol_royal_armory_desc: "長らく組合として組織されてきたトレドの刀剣鍛冶たちは、王室により #italic 王立兵器工廠（レアル・ファブリカ・デ・アルマス） #! へと統合され、王立歩兵に単一の検定基準で武装させる任務を負う。我が工廠は剣を製造し、時代の要求に応じて銃剣や火器も生産し、その検定印はすべての支給武器の品質を保証する。この王立製造業は、この都市の古くからの技術を国家の軍事的必要に直結させる。"
 cas_royal_arsenals: "王立工廠"
 cas_royal_arsenals_desc: "王立工廠と王立兵器工場は、王国の銃器職人や鋳造職人を集め、統一された基準で検査済みの武器を連隊に供給している。鋳造所の大砲、工房のマスケット銃、王立火薬工場の火薬は、国営の兵器供給体制を通じて各地の駐屯地に届けられている。この軍需基盤によって、王室は後継国家には真似のできない規模と安定性で軍隊に装備を供給しつづけられるのだ。"
 cas_royal_factories: "王立工場"
 cas_royal_factories_desc: "アメリカ銀を王国から流出させる外国製品への依存を断ち切るため、ブルボン王家は重商主義の原則に基づき奢侈品を生産する国営製造所 #italic 王立工場（レアレス・ファブリカス）#! を次々と創設している。マドリードの #italic 王立綴織工場（レアル・ファブリカ・デ・タピセス）#! 、ラ・グランハの #italic 王立ガラス工場（レアル・ファブリカ・デ・クリスターレス）#! 、そしてグアダラハラの毛織物工場は、フランドル、ボヘミア、イングランドの技術を教えるため招かれた外国人親方の指導のもと、王室の庇護下で数千人を雇用している。この産業振興策は十八世紀の貿易赤字を逆転させ、後の産業革命が生まれ得る製造基盤の種を蒔く。"
 crd_sierra_morena_mining: "シエラ・モレナの鉱業"
 crd_sierra_morena_mining_desc: "都市の北に連なるシエラ・モレナの森深い尾根には、ローマ時代のコルドゥバ以来採掘されてきた銅、鉛、石炭が眠っており、今や特許会社と外国資本によって再び開発されている。何世紀もの間、牧草地と盗賊しか存在しなかった丘陵地帯に、鉱山集落、精錬所、そしてそれらを結ぶ道が立ち並ぶ。鉱物資源はこの旧カリフ国の首都を近代的な工業中心地へと変え、田畑や手工業を超えた収入源をもたらす。"
 jae_mining_boomtowns: "急成長する鉱山都市"
 jae_mining_boomtowns_desc: "外国資本と、深い坑道の排水を可能にする新式の蒸気ポンプに引き寄せられ、#italic リナーレス #! とラ・カロリーナは辺境の村から、櫓と精錬所が立ち並ぶ混雑した鉱山町へと膨れ上がる。一世紀前にはオリーブ摘みと盗賊しかいなかった丘陵地帯に、何万もの鉱夫、技師、そしてその家族が押し寄せる。この鉱業ブームは、旧グラナダ辺境地帯を南部でも屈指の人口稠密かつ生産的な地域へと変える。"
 muc_la_union_mining: "ラ・ウニオンの鉱業"
 muc_la_union_mining_desc: "#italicラ・ウニオン#!周辺のシエラ・デ・カルタヘナの丘陵地帯は、鉛、銀、亜鉛を求める坑道で蜂の巣のように穿たれ、十九世紀の熱狂的な採掘ブームへと何万もの人々を引き寄せ、手作業と蒸気機関の両方で採掘が進められる。我が精錬所とカルタヘナの埠頭は、精錬された金属を地中海の彼方へと輸出する。この鉱物ブームは王国に莫大な富をもたらし、南部沿岸を活気あふれる工業労働力で満たす。"
 sev_trade_emporium: "貿易都市"
 sev_trade_emporium_desc: "セビリアは南部の商業の中都として立ち、川沿いの#italicロンハ#!と商人たちの会計事務所が、グアダルキビル川流域全体とアンダルシア内陸部の交易を支配している。我らの市場では、この地方の油、ワイン、布、金属が集められ、川を下り海へと積み出されていく。インディアス独占の公式な地位が盛衰を繰り返す中にあっても、この商業的な優位こそがこの都市をアンダルシア交易の心臓たらしめている。"
 tol_fabrica_nacional: "国立兵器工場"
 tol_fabrica_nacional_desc: "トレドの王立兵器工廠は、やがて壮大な#italicフアブリカ・ナシオナル・デ・アルマス#!へと発展し、水力と蒸気の力で動く工房群が、近代徴兵軍の剣、銃剣、火器を工業規模で生み出していく。#italicエスパデロス#!の古き手仕事は、国家の兵器庫を支える規格化された生産ラインへと再編されていく。この工場によって、この都市は近代国家の武器庫となり、その鋼の伝統を工業の時代へと引き継いでいく。"
 #Catalan Shared
 ara_a_maritime_realm: "海洋国家"
 ara_a_maritime_realm_desc: "バルセロナ伯は、ローマのタラコとカロリング朝のマルカ・ヒスパニカの交易伝統に形作られた、地中海に面する領国を受け継いできた。タラゴナとバルセロナからサン・フェリウ、そしてアンプルダーの港々に至る長いカタルーニャ沿岸の我が商人たちは、交易の#italicプリビレジ#!と引き換えに王の遠征を資金援助し、草創期の王国の海洋経済を動かしている。この商業的・海洋的志向こそが、マヨルカからシチリアに至るアラゴンのあらゆる東方拡張の原動力となっている。"
 ara_fleet_ordinances: "船団法令"
 ara_fleet_ordinances_desc: "アラゴン連合王国の多様なガレー船団は、マルセイユからシチリアに至るまで乗組員を集めており、異国の海を行く多国籍の船の規律を、単一の都市法だけで統制することはできない。そこでベルナト・デ・カブレラは、礼儀王ペドロのもとで、ヨーロッパ最古級の海軍軍法の一つである#italicオルディナシオンス・ソブレ・ロ・フェト・デ・ラ・マール#!(海上の出来事に関する条令)を成文化した。この法典は、アラゴンのあらゆる領国から集められた提督、船長、乗組員の職務を一貫して定め、傭兵として金で雇われたときにしか戦わない都市国家の部隊に他国がなお頼る時代にあって、カタルーニャ・アラゴン艦隊を首尾一貫した戦闘組織へと変えている。"
 ara_valencian_golden_age: "バレンシアの黄金時代"
 ara_valencian_golden_age_desc: "1238年のハイメ1世によるバレンシア征服から、十五世紀の商業的繁栄に至るまで、この都市はアラゴン連合王国東部の文化的中枢となってきた。ジュアノト・マルトレイの騎士道小説 #italic ティラン・ロ・ブラン #! 、アウジアス・マルクの恋愛詩、そしてイザベル・デ・ビジェナの #italic ビタ・クリスティ #! は、バレンシア語をカスティーリャ語やトスカーナ語に並ぶ文学言語として確立させた。この文化的声望は、ナポリやキプロスに至るまでの宮廷で我が王国に威信をもたらし、アラゴン連合王国を単なる文化の消費者ではなく、ヨーロッパ文化の生産者たらしめている。"
 ara_chartered_merchant_companies: "勅許会社"
 ara_chartered_merchant_companies_desc: "わが国の商人たちは、他国と競い合うのではなく、国内で相争って資金を浪費している。我々はこのような無駄を廃し、他国から交易を奪うことに専心すべきである。そこで、商人たちの会社に特定地域との交易における一時的な独占権を与え、権利の更新に際しては、国王に適切な手数料の支払いを求めることとする。"
 ara_constellation_cities: "大都市"
 ara_constellation_cities_desc: "アラゴン連合王国は、常に単一の王国というより首都の連合体に近かった――アラゴン人にはサラゴサ、カタルーニャ人にはバルセロナ、バレンシア人にはバレンシア、マヨルカ人にはパルマ、サルデーニャ人にはカリアリ。それぞれの大都市は、独自の #italic ジェネラリタット #! あるいは #italic ディプタシオン・デル・レイノ #! 、独自の通貨、独自の商業取引所を保持し、国王の名目上の権威のもとで互いに領事や大使を交換し合っている。この張り巡らされた競合都市網によって、王国は打ち倒しがたいものとなっている――どの首都を失おうとも王国が麻痺することは決してなく、都市間の競争が交易を絶えず活気づけている。"
 ara_gunpowder_souls: "火薬の心"
 ara_gunpowder_souls_desc: "バレンシアの #italic ファジャス #! (聖ヨセフの祝日に木と張り子で作られた巨大な記念像を花火とともに燃やす、毎年恒例の地区祭)は、黒色火薬の扱い、導火線の調合、花火の点火時機に熟達した職人階級を丸ごと生み出した。壮麗な聖ヨセフの冠を作り上げるのと同じ工房が、今では射撃表、信管付き砲弾、そして王立兵器廠に採用された爆発性の散弾弾薬を生産している。祭りから生まれたこの専門技術は、中堅のヨーロッパ列強がドイツやフランスの専門家から買い求めねばならぬ、自前の火薬技術の伝統へと育っている。"
 #Catalan Unique
 anr_pau_dels_dos_coprinceps: "共同公の和平"
 anr_pau_dels_dos_coprinceps_desc: "1278年の分有協定によりウルヘル司教とフォワ伯の間で結ばれた永続的平和、#italicパウ・デルス・ドス・コプリンセプス#!は、アンドラを二重主権国家として確立し、いずれの公も他方の同意なくして我が谷々で行動することを許さない。我が外交官たちは、あらゆる対外関係が常にもう一人の公の目によって均衡を保たれねばならぬことを最初から学び、単一の君主にのみ従う宮廷にはまれな、慎重な起草と忍耐強い交渉の習慣を育んでいる。この二頭の主権は、我が使節たちに、我が使節団の規模だけでは到底正当化できぬほどの成果を、諸外国の宮廷から引き出す術を教えている。"
 cat_principatus_cathaloniae: "カタルーニャ君主国"
 cat_principatus_cathaloniae_desc: "アラゴン連合王国のもと、我々の領土が正式にカタルーニャ公国と称されることで、カタルーニャは単なる伯領や付属領ではなく、独自の法律、通貨、コルツを有する主権公国となっている。バルセロナ伯は諸制度がアラゴン王国そのものの制度と法的に対等であることを示すため、自らをプリンケプスと称している。この憲法上の尊厳によって、宮廷はキリスト教世界における地位を高め、貴族たちを単一の伯爵家を超えた大きな事業に結びつけている。"
 mll_carta_de_franquesa: "カルタ・デ・フランケサ"
 mll_carta_de_franquesa_desc: "マユールカ征服の翌年、1230年にジャウメ1世王が授けた #italic カルタ・デ・フランケーザ #! は、マヨルカの自由の礎を築いている――新たな入植者を隷属的な賦役から解放し、ウニベルシタットに自らのジュラットを選出する権利を与え、我が商人を最も過酷な王税から免除するものである。島中に散らばる農村共同体フォラネスの一つ一つが、パルマの市民と同じくこれらの特権を受け取り、封建的な寄せ集めではなく単一の特許状のもとで全再植民を結びつけている。この建国の特許状のもとで、マヨルカのあらゆる家庭が王権を守ることに直接の利害を持ち、我が使節は海外で、法のもとにある王国として、より楽に語ることができる。"
 val_llibre_repartiment: "分配の書"
 val_llibre_repartiment_desc: "1238年、ジャウメ1世によるバランシーヤ征服の後、キリスト教徒の再植民者に割り当てられた土地、果樹園、家屋を記した正式台帳、#italicリブレ・デル・レパルティメント#!は、カタルーニャ、アラゴン、ナバラ、そして南フランスから来た入植者たちに分配された区画の記録で、ページを埋め尽くしている。この書はこの先何世紀にもわたって決定的な権原文書であり続け、相続争いや王の下賜において引用され、キリスト教統治の最初の十年から王国全体の土地保有制度を確立している。この権威ある土地記録のおかげで、バレンシアのあらゆる所領は安んじて耕作され、我が農民は、測量の不行き届いた他国を悩ませる境界紛争から解放されている。"
 anr_sis_parroquies: "六教区"
 anr_sis_parroquies_desc: "#italic シス・パロキエス #!(カニーリョ、エンカンプ、オルディノ、ラ・マサナ、アンドラ・ラ・ベリャ、サン・ジュリア・デ・ローリア)はそれぞれ代表を #italic コンセイ・デ・ラ・テラ #! に送り、租税、公共事業、そして我が谷々を治める慣習法について審議する。評議会で下された決定はすべての教区を等しく拘束し、教区は共有地、灌漑、紛争解決を、日常の統治について共同君主に取り次ぐことなく自ら管理している。この教区レベルの自治は、我が国を統治する費用を際立って低く抑え、すべての家庭に、自らが生活する政策について直接の発言権を与えている。"
 cat_generalitat: "カタルーニャのジェネラリタート"
 cat_generalitat_desc: " #italic ジェネラリタット・デ・カタルーニャ #! は、旧来の #italic コルツ #! から生まれた新たな機関であり、 #italic ディプタシオ・デル・ジェネラル #! は、我が王国の一般税を徴収し、会期の合間に #italic コルツ #! を代表する常設の執行機関として設立されている。我らは公的歳入を #italic ジェネラリタット #! の会計制度を通じて流し、 #italic セン​サルス #! や #italic ビオラリス #! ――カタルーニャの税収を担保とする永久年金および終身年金を発行する。この利率は、古参のジェノヴァやフィレンツェの商館ですら、主権者への貸付において太刀打ちできぬものである。常設の公的銀行は、我が王国に安定した歳入と公債市場をもたらしており、これは半島のいかなる他国も持たぬものである。"
 mll_escola_cartografica: "マヨルカ地図製作学派"
 mll_escola_cartografica_desc: "我が #italic エスコラ・カルトグラフィカ・マヨルキナ #! は、パルマのクレスケス一族(アブラアムとその息子ジャフダー)を中心に、ユダヤ人とキリスト教徒の地図製作者を集め、アラゴン、フランス、カスティーリャの宮廷のために幾十もの実用的なポルトラノ海図を生み出している。彼らの工房は、コンパス・ローズ、航程線、港の表記といった慣例を標準化し、それは今後二世紀にわたり地中海と大西洋のあらゆる船長が頼ることになる。この地図学的学識の集積は、全キリスト教世界において我が王国の威信を高め、我が印刷所に印刷の伝統の種を蒔き、地図学のみにとどまらぬ学問の繁栄を育んでいる。"
 val_primera_impremta: "初の印刷所"
 val_primera_impremta_desc: "イベリア半島最初の印刷工房は、ドイツ人の親方ランベルト・パルマルトによってバレンシアに設けられ、文学賞のために編まれた聖母讃歌集、#italicオブラス・エ・トロベス・エン・ラオルス・デ・ラ・ベルジャ・マリア#!を、ヒスパニア活字印刷の最初の書物として刊行した。その工房から印刷業は急速に広まり、スピンデラー、ハーゲンバッハ、ローゼンバッハはいずれも二十年のうちにバレンシアに自らの工房を構え、聖書、法律大全、そして偉大な騎士道散文#italicティラン・ロ・ブラン#!を世に送り出した。我が印刷の先駆性は王国中に工房の種を蒔き、我が文化にテキスト普及の先手を与えており、他のスペイン諸国はそれを我らから買い求めねばならない。"
 anr_questia: "クエスティア"
 anr_questia_desc: "共同公への我が年貢、#italicクエスティア#!は、ウルヘル司教とフォワ伯に隔年で支払われるもので、我が谷々の経済が大いに成長した一方で、その額は何世紀にもわたり名目上固定されたままである。この額の慎ましさと、時の経過によるその実質価値の目減りとが相まって、我が教区の評議会は地元の歳入によって自らを賄うことができている。この有利な財政上の取り決めは、外部の権力に支払う貢納よりも、公共事業や統治儀礼の務めのために宮廷の支出を割くことを可能にしている。"
 cat_remenca: "レメンサ制度との戦い"
 cat_remenca_desc: "#italicレメンサ#!は、農奴が自らの自由を買い取るまで領地に縛り付ける六つの「悪習」、#italicマルス・ウゾス#!によって、カタルーニャの農民を土地に結び付けている。グアダルーペの裁定を通じて交渉された改革条件のもとで、農民は賦役を減額した上で支払いを続けながらも自らの区画に対する所有権を獲得し、公国全土にわたって農村の労働力と資本を解放している。この農地制度の取り決めは、他のいかなるヨーロッパの王国が領主と農民の問題を解決するよりも数十年早く、カタルーニャに生産的な自作農階級を確立している。"
 mll_corsaris_mallorquins: "マヨルカの私掠船"
 mll_corsaris_mallorquins_desc: "王室の私掠免許状により、船長たちは高速ガレーやブリガンティンを私費で武装し、こうした船でバルバリアやジェノヴァの船舶、その他の敵国の商船を襲撃することが許可される。パルマの私掠船団は、熟練の操舵手、砲手、甲板長の名簿を独自に管理しており、戦時には王立海軍がそこから人員を召集するため、私掠船員と海軍予備役を区別せず一つの海上要員として活用することが可能になっている。豊富な熟練乗組員を活用することで、我々は国家が徴募する海軍よりも早く艦隊を整え、地中海の他国艦隊に先んじて遠方へ出撃できるのである。"
 val_germanies_valencianes: "ヴァレンシアのゲルマニア"
 val_germanies_valencianes_desc: "ヴァレンシアの #italic ゲルマニア #! （我らが市壁の内に満ちる織工、染色師、鍛冶師、その他数十に及ぶ組合職人たちの誓約同胞団）は、その職能活動の枠を超え、相互扶助基金、民兵召集、宗教行列、そして教区福祉にまで及んでいる。 #italic ゲルマニア #! への加入は、教区・家族と並んで都市に住むヴァレンシア人にとって中心的な社会的アイデンティティであり、この同胞団こそが、王室があらゆる遠征で頼みとする訓練された徴募兵と即応補給網を提供している。これほど固く結びついた我らが町々は、人的資源を蓄え、街路に市民的規律を保ち続けるのである。"
 anr_sindic_procurador_general: "シンディク・プロクラドール・ジェネラル"
 anr_sindic_procurador_general_desc: "我らが #italic Síndic Procurador General #! はコンセイ・ダ・ラ・テラを統括し、二人の共同君主の前でアンドラを代表する執行役を務め、教区の名の下に交渉を行いながら、自領の統治における議会の最終的な主権を決して手放すことはない。総代官は教区代表者らの合意によって選ばれ、多くは尊敬される聖職者や名士であり、地域の利害と外部からの圧力との間に立つ恒常的な緩衝役を果たす。この中立的な調停者の役割こそが、聖職者と貴族の双方を議会の決定に従わせ、党派色の強い執行者が生みがちな派閥争いを抑えているのである。"
 cat_els_segadors: "収穫人たち"
 cat_els_segadors_desc: "刈入れ人戦争、すなわち#italic血の聖体祭（コルプス・デ・サング）#!に際してカタルーニャの刈入れ人らがカスティーリャ・テルシオの駐屯と我らが憲章の侵害に対して蜂起したあの戦いは、我が農民たちがヨーロッパ最大の軍勢に対しても二十年近く公国を守り抜く戦力を結集し得ることを証明した。民謡#italic刈入れ人たち（エルス・サガドルス）#!はその動員の記憶を今に伝え、カタルーニャの子らは揺りかごの頃からその詩句を学ぶ。農民兵の根深い伝統は、我が王室に専門の徴募官も外国の傭兵隊長も要しない人的資源の蓄えを与えている。"
 mll_torres_costaneres: "トーレス・コストネラ"
 mll_torres_costaneres_desc: "マレス石造りの低く丸みを帯びた物見塔、#italic沿岸の塔（トレス・コスタネレス）#!の網が、マヨルカ、メノルカ、イビサ、フォルメンテラを取り囲んでいる。これらの塔は互いに視認できる距離に配され、水平線にバルバリアの帆影が現れた瞬間に狼煙を上げる教区の徴募兵によって守られている。各塔は要塞化された教区教会と避難用の貯水槽と対になっており、沿岸のいかなる共同体も防御可能な城壁と貯えられた水から一時間以上離れることがない。この島全域に及ぶ防御網は、我らが海岸へのいかなる上陸作戦の費用をも押し上げ、より少ない守備隊で、いかなる同等国の体制も及ばぬほど長い防衛線を守らせるのである。"
 val_seda_valenciana: "バレンシアの絹織物"
 val_seda_valenciana_desc: "我らが絹産業、すなわち #italic ヴァレンシア絹（セダ・ヴァレンシアナ） #! は、ヴェリュテルス教区とアルブフェラ周辺に集積し、ヴァイ・ダルバイダとヴァイ・デ・カルセルに広がる桑畑を頼みに、毎春の蚕の孵化場を支えている。絹業大同業組合（コレジ・デ・ラルト・マジョール・デ・ラ・セダ）が織機を統制し、品質基準を定め、王国が決して完全には追放し得なかったモリスコ職人の系譜を引く親方のもとで新たな織工を見習わせている。果樹園から孵化場、糸繰り小屋、織機に至るあらゆる段階を押さえるこの絹の複合体こそが、我が王室に他のいかなるイベリアの地方も及ばぬ高級織物をもたらしているのである。"
 anr_via_dels_passos: "山岳街道"
 anr_via_dels_passos_desc: "我らが谷とフランスのアリエージュおよびカタルーニャのウルジェイを結ぶ高地の峠――#italicエンヴァリラ峠（ポルト・ダンヴァリラ）#!、#italicラ・ボテリャ峠（コイ・デ・ラ・ボテリャ）#!、そして#italicカブス峠（ポルト・デ・カブス）#!――は、落石を取り除き、雪標を立て、軍事と商業の往来を可能にする避難小屋を備える教区の賦役労働によって一年を通じて維持されている。幾世紀にもわたる山道普請は、低地の軍勢を打ち負かすほどの条件下でも高山地帯を越えて人員と物資を動かせる教区技術者の一団を生み出した。この高地の峠を支配する力によって、我が小勢はいかなる平地の軍勢よりも速く侵入者に対して戦力を集中させることができるのである。"
 cat_principat_constitucionalista: "立憲公国"
 cat_principat_constitucionalista_desc: "立憲公国の伝統は、法文書、都市の法令、そして法律家たちの地道な研究のなかに受け継がれている。どの世代も憲章を書き写し、大学でそれを論じ、こうした勅令を執行する者の目が届かないところでは、その原則を自治体の実務へと静かに広げていく。この根強い立憲主義の伝統は、宮廷への権力集中を抑え、後の反乱や改革が拠り所とできる自治の理念を、カタルーニャの各自治体に与えている。"
 mll_industria_lapidari: "石材産業"
 mll_industria_lapidari_desc: "マヨルカの淡い #italic マレス石 #! 灰岩とメノルカの暗い粘板岩が、パルマの大聖堂やカタルーニャ沿岸の要塞から、アメリカ植民地の教会に至るまで、イベリアの建設現場に資材を供給する組織的な #italic 石材業（インドゥストリア・ラピダリア） #! を支えている。サンタニーとフェラニッチの石工たちは王室造兵廠と季節契約を結んで働き、貨幣ではなく切り出した石塊で貢納を納め、その切石の精密さで名声を得ている。この組織化された石切り産業は、マヨルカのあらゆる工房の生産性を高め、我が王国全土の王室建築事業の進捗を速めている。"
 val_real_societat_economica: "王立経済協会"
 val_real_societat_economica_desc: "ヴァレンシアの #italic 国民友の会（レアル・ソシエタート・エコノミカ・ダミクス・デル・パイス）#! は、我が啓蒙貴族、教区聖職者、そして市民改革者たちを集め、王国全土における灌漑、牧畜、製造業、初等教育の着実な改善に取り組んでいる。この協会は織機や揚水装置の最良の設計を競う懸賞を財政支援し、外国の農学論文の翻訳を後援し、受け入れを望むあらゆる村へ専門の通信員を派遣している。この献身的な改革機関こそが、啓蒙的な庇護を我が王室の農地、工房、歳入における目に見える改善へと変えているのである。"
 anr_neutralitat_pirinenca: "ピレネー中立"
 anr_neutralitat_pirinenca_desc: "我らが#italicピレネーの中立（ネウトラリタート・ピリネンカ）#!の政策は、アンドラを、より大きな隣国を飲み込む大戦争から遠ざけ、我らが谷を、政治亡命者、密輸業者、通過中の王位継承権主張者、そして突然の人気によって故国の徴税人の目を不快なほど引きつけてしまった吟遊詩人らの避難所としている。両共同君主はこの取り決めを十分に好都合と見なし、我らを彼らのより大きな紛争への正式な加担から免除している。この中立という評判によって、我が使節は交戦国が排除される会議にも歓迎され、我が小さな軍勢には、いかなる侵略者もあえて攻めようとしない防御陣地を整える時間が与えられているのである。"
 cat_renaixenca_catalana: "ラナシェンサ・カタルーニャ"
 cat_renaixenca_catalana_desc: "我らが文芸・文化復興、すなわち #italic カタルーニャ・ルネサンス（レナシェンサ・カタラナ） #! は、我が言語が私的な書簡と民謡の中にのみ生き延びてきた幾世代を経て、カタルーニャ語を印刷出版、講堂、そして詩歌の舞台へと取り戻すものである。我らは復興された #italic 花の遊戯（ジョックス・フロラルス） #! 詩歌競技会を後援し、近代的な文語標準を成文化する辞書や文法書に資金を投じ、我が言葉を出版、学界、そして公的行政へと再び呼び戻す。この文化的再生は、我が臣民の母語における識字率を高め、カタルーニャ語を話すあらゆる共同体を、いかなる中央集権国家も容易に飲み込めぬ一つの共通文化のもとに結びつけるのである。"
 mll_escola_mallorquina: "マヨルカ学派"
 mll_escola_mallorquina_desc: "#italicマヨルカ派（エスコラ・マジョルキナ）#!を通じた我が島々の文芸的開花は、我が言葉が私的な信心と民謡の中にのみ生き延びてきた幾世代を経て、マヨルカの文芸をヨーロッパの本流へと取り戻すものである。我らは、ギリシア・ラテンの古典とセラ・デ・トラムンタナの険しい風景の双方に根ざした、明晰で古典主義的なカタルーニャ語を用いるポリェンサとパルマの詩人サークルを後援し、その機関誌と詩篇を島々と本土を結ぶあらゆる航路に乗せて運ぶ。この文芸復興は、島民の自らの言語への帰属意識を深め、学派の広く読まれた紙面を通じて現地の言い回しを吸収する本土からの移住者の同化を和らげるのである。"
 val_renaixenca_valenciana: "ラナシェンサ・バレンシア"
 val_renaixenca_valenciana_desc: "我らが文芸復興、すなわち #italic ヴァレンシア・ルネサンス（レナシェンサ・ヴァレンシアナ） #! は、ヴァレンシアにおいて復興された #italic 花の遊戯（ジョックス・フロラルス） #! 、そして我が王国の印刷所から再び姿を現す牧歌、風刺詩、そして史書を中心に結集している。我らは王室と自治体の庇護を、花の遊戯の賞牌と新しいヴァレンシア語の雑誌へと注ぎ込み、我が言葉を、王国各地の教養ある家庭の書架に値する文学の舞台へと取り戻す。この言語的再生は我が宮廷の威信を高め、散在する各コマルカを、いかなる外国の統治も容易には分断し得ない共通の文化共同体へと結びつけるのである。"
 #Galician Shared
 galician_rias_atlanticas: "大西洋岸のリアス"
 galician_rias_atlanticas_desc: "我が大西洋岸の深い入江――ビーゴ、ポンテベドラ、アローサ、ムロスの #italic 下のリアス（リアス・バイシャス） #! 、そしてア・コルーニャ、ベタンソス、フェロルの #italic 上のリアス（リアス・アルタス） #! ――は内陸へ何十キロも入り込み、ヨーロッパ屈指の豊かな漁場を生み出している。これらの入江沿いの村々はいずれも少年の頃から男たちを海へ送り出し、我が市場と内陸のスペイン経済をも支えるイワシ、タラ、貝類を水揚げしている。これらの天然の良港は我が艦隊を大西洋の嵐から守り、内陸の国がいかにしても持ち得ぬ熟練水夫の恒常的な中核を育てているのである。"
 galician_camino_pilgrimages: "サンティアゴの巡礼路"
 galician_camino_pilgrimages_desc: "サンティアゴ・デ・コンポステーラへの巡礼路には、ピカルディやケルン、ボローニャやウィーン、さらにはブリテン諸島やスカンジナビアに至るまで、キリスト教世界各地から毎年何万人もの敬虔な巡礼者が訪れる。道中にあるすべてのアルベルゲ（巡礼者を対象とした宿）、教区、道端の礼拝所はこうした訪問者から収入を得ており、内陸の町々もその往来によって直接潤っている。こうした巡礼経済は、信仰上の務めを安定した外国貨幣の収入へと変えてくれるが、これほどの収入を得られる国はほかにはない。"
 galician_foros: "フォロス"
 galician_foros_desc: "我らが長期借地契約、すなわち #italic フォロ #! は、その土地の本来の所有権を保持する領主、修道院、あるいは都市へ定額の地代を納める代わりに、農民家族にその地所に対する三世代以上にわたる相続可能な権利を与えている。この保有の安定は、短期の借地人であれば決して着手しないであろう開墾、排水、段々畑造成、果樹園の植栽への投資を小農たちに促している。この安定した保有制度は、我が細分化された地所の全域にわたって農業生産性を高め、農村人口の増加を最悪の封建的収奪から守っているのである。"
 galician_irmandinos_legacy: "イルマンディーニョス"
 galician_irmandinos_legacy_desc: "#italicイルマンディーニョス#!（ガリシア貴族の圧政に立ち向かって蜂起した大農民同胞団）は、我が村々と教区に共同組織の恒久的な遺産を残した。この反乱は最終的には鎮圧されたものの、その後の交渉の結果として、農民の保有権を守るフォロ改革と、今なお隣人同士を未来の圧政に備える相互扶助の結社へと結びつける#italicイルマンダーデ#!の伝統が生まれた。この共同組織の伝統は、王室が求める瞬間に備えた民兵、労働力、そして信用の網を我が国家に残しているのである。"
 galician_mountain_minerals: "鉱山"
 galician_mountain_minerals_desc: "ルーゴ、オウレンセ、そしてビエルソの内陸山岳地帯には、錫、タングステン鉱、粘板岩、そして銀の豊かな鉱床が眠っており、我らは今や体系的な採掘権を通じてこれを開発している。#italicガリシア鉱山（ミナス・デ・ガリシア）#!はアストゥリアスの製鉄炉を支える鉱石を産出し、フェロルにおける王室鋳貨を補う銀をもたらしている。この鉱物資源は我が地方経済を漁業と酪農の枠を超えて押し上げ、地質的に恵まれぬ他国が容易には真似できぬ製造業を我が町々にもたらしているのである。"
 galician_rexurdimento: "レシュルディメント"
 galician_rexurdimento_desc: "我らが文化的復興運動、すなわち #italic レシュルディメント #! は、叙情詩、英雄史譚、吟遊詩、そして過激な風刺とともに十九世紀に花開いた。文語としての衰退が幾世紀も続いた後、ガリシア語は再び印刷の世界に戻り、国境を越えて尊敬される文学表現の媒体となった。この言語復興は我が地方全体の識字率を高め、中央集権国家が容易には消し去れぬ地方的アイデンティティを、すべてのガリシア人に誇りとして与えている。"
 #Galician Unique
 glc_kingdom_of_garcia: "ガルシア王国"
 glc_kingdom_of_garcia_desc: "1065年、父王の遺言によりレオンとポルトガルから切り離されて成立した、ガルシア王のもとでの短命な独立王国は、ガリシア宮廷が独自の貨幣、特許状、そして軍役をもって主権国家として機能しうることを示した。1071年にガルシアが兄弟たちによって廃位・幽閉された後も、その #italic Regnum Gallaeciae #! の記憶は、幾世紀にもわたり貴族の主張や教会の権利要求のうちに生き続けた。この回復された王統の遺産により、我らは辺境の領土を、古き王冠にふさわしい自信をもって統治する。"
 glc_cathedral_santiago: "サンティアゴ大聖堂"
 glc_cathedral_santiago_desc: "我らがサンティアゴ大聖堂は使徒聖ヤコブの聖遺物を納め、ローマ、エルサレムと並ぶラテン・キリスト教世界三大巡礼地の一つとして立つ。#italic Pórtico de la Gloria#! と壮麗な行列の典礼は、年々王侯、高位聖職者、使節を我らの門前へと誘い、訪問の一つ一つが、交渉せずとも得られる外交交流の機会となる。この教会の権威の重みは、我が宮廷をヨーロッパ中のカトリック諸国の常なる盟友とし、外交文書のやり取りを容易にしている。"
 glc_armada_de_galicia: "ガリシアの艦隊"
 glc_armada_de_galicia_desc: "我が君主が大西洋の大艦隊を築くにあたり、我がガリシア艦隊は経験豊富な水夫、航海士、そして艦隊の骨格となるガレオン船体の大部分を供する。#italicガリシア艦隊#!はフェロルとビーゴに集結し、沿岸のあらゆる村落から乗組員を、花崗岩に富むガリシアの丘陵から船材と石の底荷を調達する。これらの造船所と乗組員があればこそ、我が王家は他の地方勢力にはまず叶わぬ規模で、兵を大西洋の彼方へ送ることができる。"
 glc_murallas_atlanticas: "大西洋岸の防壁"
 glc_murallas_atlanticas_desc: "イングランドとバルバリアによる度重なる沿岸襲撃は、我らにア・コルーニャ、バイオナ、ビーゴにおける大防壁と稜堡への投資を強いた。これが十七世紀の火器を携えた襲撃から港を守る #italic Murallas Atlánticas #! である。各要塞はそれを守る町々が専用の財源によって維持し、王家は工兵の技術と大砲を提供する。この防壁網により、我が大西洋沿岸は攻めるに不釣り合いなほど高くつく地となり、野戦軍を他の作戦のために解き放つことができる。"
 glc_junta_general: "ガリシア王国総評議会"
 glc_junta_general_desc: "我らが #italic ガリシア王国総会 #! は、ガリシアの七つの司教座（サンティアゴ、オウレンセ、ルーゴ、モンドニェード、ベタンソス、ア・コルーニャ、トゥイ）を招集し、王権の下で課税、司法、王国防衛について審議する。総会の決定は地方全域にわたる合意の重みを帯び、強大なガリシア貴族すら、個々には同意せぬ地方的決定に従わせる。王国が総会を通じて語ることで、我が王家は官吏のみによって統治される属州とは異なり、内陸を一つの相方とともに治めることができる。"
 glc_escuadra_atlantica: "大西洋艦隊"
 glc_escuadra_atlantica_desc: "フェロル王立造兵廠を拠点とする我が大西洋艦隊は、近代におけるイベリア海軍力の背骨となった。戦艦、巡洋艦、駆逐艦隊からなる常備兵力は、イベリアの海域を守り、両アメリカ大陸へと兵力を投射する備えを持つ。#italic大西洋艦隊#!はガリシア沿岸の守られた入江で一年を通じて訓練を重ね、より分散した艦隊には及びもつかぬ即応態勢を維持している。この集中した海軍ドクトリンにより、我が海軍はいかなる同格の大西洋勢力よりも迅速に、より統制の取れた火力をもって介入できる。"
 #Leonese Shared
 leonese_asturian_inheritance: "アストゥリアスの系譜"
 leonese_asturian_inheritance_desc: "我々の王国は、711年以降イベリアの国として唯一、征服を進めるウマイヤ朝に服属しなかったアストゥリアスのキリスト教王国から、政治的系譜を連綿と受け継いでいる。山中に逃れて過ごした2世紀のあいだに守り伝えた法典、修道院、貴族の家系とともに、レコンキスタの正統性を受け継いでいるのである。この王統の深い連続性は王室のあらゆる行為に正統性を与え、併合した住民もまた、容易には拒めない歴史を共有することになる。"
 leonese_gothic_art: "レオンのゴシック芸術"
 leonese_gothic_art_desc: "我らがレオン大聖堂、すなわち #italic プルクラ・レオニナ #! は、キリスト教イベリアにおいて最も壮大なステンドグラス計画をもって王国に冠を戴かせる。その熟練の石工とガラス職人は、シャルトルやランスを完成させた工房で技を磨いた者たちである。我らは同じ構成原理に基づき、新たな参事会教会、王立施設、シトー会修道院を後援し、この伝統を支える技術を受け継ぐ一族に安定した仕事を与え続ける。この建築と芸術の文化は我が文化的影響力を深め、王家が発注するあらゆる記念建築の費用を軽減する。"
 leonese_pendon_morado: "紫の旗"
 leonese_pendon_morado_desc: "#italic 紫の旗 #! ――銀の獅子を描いた紫の旗は、王国創設以来、レオンのあらゆる軍の召集の先頭に立ってきた――は、我が王国が経るいかなる王朝統合をも生き延びる、地方的アイデンティティの連続性を担っている。あらゆる #italic コンセホ #! の集会や教区の祭礼において儀礼的にこれを掲げることで、我らは町々、谷々、牧草の共有地を、いかなる中央集権的勅令にも消し去れぬ一つの目に見える紋章のもとに結び合わせる。この象徴的連続性は我が地方的アイデンティティの衰退を防ぎ、すべてのレオン人に、この旗が体現するものを守るという大義を与える。"
 leonese_textile_industry: "繊維産業"
 leonese_textile_industry_desc: "我がティエラ・デ・カンポスの羊から得られる羊毛――長繊維で、風雪に鍛えられ、豊富にある――は、レオン、アストルガ、サラマンカ、サモラの工房網を支え、我が農民と歩兵が頼る粗布を生産している。我らは織物同業組合に王家の保護を与え、高地の牧草地からメディナ・デル・カンポの春秋の大市へと至る #italic Paños de León #! 交易路に沿って度量衡を統一する。羊毛から仕上げの布に至るまで、全行程は我らの手中にあり、羊毛価格のいかなる変動をも乗り越える。"
 leonese_provincial_academies: "地方のアカデミー"
 leonese_provincial_academies_desc: "主要都市の啓蒙思想家はソシエダデス・エコノミカス（経済協会）や学術アカデミーを設立し、農業、製造業、博物学に関する論文を発表している。これらは王室の補助金に頼ることなく、聖職者や貴族、ブルジョワの会員からの会費で運営され、祖国の発展を自らの務めだと考える人々に支えられている。こうした地方の学術交流は地域全体の識字率を高め、国外にも及ぶ王室の事業を担う行政官を継続的に輩出している。"
 leonese_industrial_revival: "産業の復興"
 leonese_industrial_revival_desc: "アストゥリアスの石炭層とビエルソ、ベガ・デ・リオサの鉄鉱床が、幾世紀にわたり片隅に置かれてきた我が山岳地帯を、ヨーロッパ経済の主流へと呼び戻す地方的産業復興の原動力となっている。外国人技師が地元資本と手を組み、鉱石を銑鉄、レール、艦板へと変える#italic鉱山#!と#italic製錬所#!を開く。この産業基盤は我が経済を牧羊と酪農の域を超えて多様化させ、熟練労働者により良い賃金を与え、大西洋を渡る移民船から人々を呼び戻している。"
 #Leonese Unique
 atu_cradle_of_reconquista: "レコンキスタ発祥の地"
 atu_cradle_of_reconquista_desc: "アストゥリアスの山中、#italic コバドンガ #! において、高貴なるペラーヨが西暦722年頃ウマイヤ朝の一隊を打ち破ったことは、レコンキスタ最初のキリスト教徒の勝利として、またアストゥリアス王国、そしてそこから連なるすべてのイベリアの王冠が芽生えた火種として記憶されている。我らは征服されざる残滓、押し寄せる征服の波が砕け散った岩という名誉を担う。この建国の伝説は、我が王家にいかなる競合者よりも古く純粋な、正統性への道徳的権威を与えている。"
 lon_kingdom_from_oviedo: "オビエドからレオンへ"
 lon_kingdom_from_oviedo_desc: "910年頃、我々の宮廷はオビエドの山岳要塞から、レオンの平原へ都を移した。レコンキスタが十分に南へ進んだことで、我々は再び本格的な都市を拠点に王国を治められるようになったのだ。これに伴い、王室、大法官府、軍は山岳地帯ではなく平地に適した新たな兵站体制のもとに再編され、王国には後世まで続くレオン王国という名が与えられた。遷都により王室は拡大する領土をより効率よく統治できるようになり、山岳地帯を拠点とする競争相手よりも迅速に領土をまとめることが可能となった。"
 lon_order_of_santiago: "サンティアゴ騎士団"
 lon_order_of_santiago_desc: "1170年、レオン王家の庇護のもとに創設された #italic サンティアゴ #! 騎士修道会は、巡礼路を守り、レコンキスタの戦線を押し進めることを誓った戦う修道士の兄弟団を興した。その管区は広大な所領を有し、規律正しい重装歩兵と、ムーア人の要塞を攻め落とす工兵を動員するが、その命は口うるさい伯爵の誰にも従わず、総長にのみ従う。この騎士団は、いかなる世俗の臣下も及ばぬ、レオン王家常備の鎧の拳である。"
 atu_cantabrian_fisheries: "カンタブリアの漁業"
 atu_cantabrian_fisheries_desc: "険しいカンタブリア沿岸の港からは、メルルーサやイワシを求めて船団が出港し、ビスケー湾では無甲板船でセミクジラも捕らえる。漁村では北岸屈指の勇敢な船乗りが育ち、王立海軍と商船隊はこぞって彼らを引き抜こうとする。州の規模に見合わないほど多くの熟練船員がいるため、ここの屈強な海の男たちは、予備人員としていつでも頼りになるのだ。"
 lon_canada_leonesa: "レオンのカニャーダ"
 lon_canada_leonesa_desc: "レオンの牧畜路たる大いなる #italic カニャーダ #! は、カンタブリア山脈の夏の高地牧草地と平原の冬の牧草地との間を季節ごとに移動する、膨大な羊群と牛群を運ぶ。王家はこの移牧路に特許を与えて保護し、家畜に課税し、牧畜の町々を王の恩顧に結びつける。この牧畜経済は王国に肉という安定した富をもたらし、雨の乏しいメセタだけでは得られぬ食糧の余剰を生む。"
 lon_cortes_de_leon: "レオンのコルテス"
 lon_cortes_de_leon_desc: "1188年、我らが王のアルフォンソ9世は、ヨーロッパ史上初の議会であるコルテス・デ・レオンに、司教や大貴族だけでなく諸都市の選出代表も招集した。このコルテスは、王室の課税を審議し、戦争や王位継承について協議するとともに、王権がその民兵を頼りとする都市の特権を成文化する。こうした王権と都市民との制度的な協力関係により、行政の効率は向上し、戦争に必要な臨時税も臣民に受け入れられやすくなっている。"
 atu_mountain_fastness: "山岳の要塞"
 atu_mountain_fastness_desc: "岩の城壁のごとくアストゥリアスの南にそびえるピコス・デ・エウロパとカンタブリア山脈には、防衛に適した高い峠道がわずか数本だけ通っている。我らの山岳民兵は、祖先たちがムーア人やフランク人から守ったのと同じようにこれらの隘路を守っており、この地方はほぼ難攻不落となっている。この天然の要塞のおかげで、小さく貧しい国土でも、強大な勢力に立ち向かうことができるのである。"
 lon_frontier_expansion: "レオンの辺境拡大"
 lon_frontier_expansion_desc: "我が国家の建国以来、我が軍勢はタイファ諸王国に対し南への進軍を続け、アルフォンソ三世のもとでドゥエロ川に、アルフォンソ六世のもとでタホ川に、そしてアルフォンソ九世のもとでエストレマドゥーラに達した。新たな征服のたびに計画的な#italicレポブラシオン#!（移住者特許状、荘園税の免除、教区の設立）が実施され、征服地は他国より速やかにレオンの領土へと変わる。この実証された拡張の方法は、レコンキスタのあらゆる征服を、一時的な軍事占領ではなく永続的な統合州へと変えてきた。"
 lon_tierra_de_campos: "ティエラ・デ・カンポス"
 lon_tierra_de_campos_desc: "#italic ティエラ・デ・カンポス #!（セア川とピスエルガ川の間に広がる起伏ある粘土質の平野）はレオン王家の穀倉であり、その開けた小麦と大麦の畑は北方の都市を養っている。王家の恩賜と修道院領の労役が、地平線まで広がる荘園の鋤を休ませることなく動かし続ける。王国の穀倉として、ティエラ・デ・カンポスは周囲の山岳諸州の比ではない穀物の余剰と、町や都市の繁栄をもたらしている。"
 atu_cider_orchards: "リンゴ園"
 atu_cider_orchards_desc: "アストゥリアスの湿潤な緑の谷には林檎の果樹園が密に植えられ、その実を搾り発酵させて #italic シドラ #! を造る。これはどの村でも日々飲まれる酒であり、村の社交生活の中心でもある。我らの #italic ポマラーダ #! と #italic リャガール #! は、メセタの穀物取引から独立した小農民の地方経済を支えている。果樹園文化はアストゥリアスの田園に、豊かで独特な、そして長く続く生業をもたらす。"
 lon_adelantado_mayor_de_leon: "アデランタード・マヨール・デ・レオン"
 lon_adelantado_mayor_de_leon_desc: "十四世紀よりキニョネス家が世襲してきた #italic レオン大代官 #! の職は、レオン王国全域の司法・財政・地方外交の権限を王直属の単一の統治機構へと統合するものである。我らはレオンの大諸家との書簡、メリンダーデスの税査定、コレヒミエントからの上訴嘆願を、カスティーリャ中央評議会の鈍重な経路を経ずにこの役職を通じて処理する。地方の権限を一つの役職に集約することで、我らの行政の及ぶ範囲はカスティーリャ全土を管轄するいかなる役職よりも、レオン領内で広がるのである。"
 lon_maragato_arrieros: "マラガトの荷駄運送人"
 lon_maragato_arrieros_desc: "アストルガの丘陵に住む#italicマラガトス#!は、自らを王国随一の運搬人と成し、そのラバの隊列は塩漬け魚や植民地産の品々、王室の銀をカンタブリアの港と内陸の市場との間に運ぶ。結束固く信頼篤いこの#italicアリエロス#!は、レオンとカスティーリャのあらゆる市に及ぶ信用と運搬の網を運営している。この運送組合は、その質素な町々をはるかに超えて、王国の内陸商業と商人の及ぶ範囲を支えている。"
 atu_coal_basin: "アストゥリアス炭田"
 atu_coal_basin_desc: "アストゥリアス中央部の谷の下には半島随一の豊かな炭田が広がり、ミエレスやラングレオ、カウダル川とナロン川の谷では深い炭層が採掘されている。鉱山の町は周辺の丘陵地帯や山を越えた先から来た労働者であふれかえっており、新たに敷設された鉄道はその町々と沿岸部をつないでいる。この石炭によって、アストゥリアスは国家の工業化を支える燃料供給の要となっている。"
 lon_bierzo_vineyards: "ビエルソのブドウ畑"
 lon_bierzo_vineyards_desc: "レオン西端の山々に囲まれた#italicビエルソ#!の懐深い谷は、中世以来カミーノの修道士たちが世話をしてきたメンシーアの葡萄を熟させる。段々畑の粘板岩の斜面は、北方の市場で珍重され巡礼路を下って運ばれる銘酒を生み出す。我らの葡萄畑は、鋤を入れるには急すぎる土地を貴重な輸出品に変えるのである。"
 lon_real_casa_moneda: "レアル・カサ・デ・モネダ"
 lon_real_casa_moneda_desc: "我が王立造幣局は恒久的な王室機関として運営され、長期契約により銀と銅の供給を確保し、守備隊と徴税人への支払いに充てる貨幣を鋳造する。#italic王立造幣局#!は、鋳造する貨幣一枚ごとに国庫へ相当な利益をもたらし、同時に流通するすべての貨幣の銀含有量を王室の管理下に置く。この健全な貨幣制度により、我らはより有利な条件で借入を行うことができ、より無秩序な貨幣制度が干上がる場所でも、金の流れを絶やさずに済むのである。"
 atu_steel_works: "アストゥリアスの製鉄所"
 atu_steel_works_desc: "ラ・フェルゲラ、ミエレス、ナロン川の河口では、高炉と圧延工場が地元の石炭と輸入鉱石を結びつけ、近代経済を支える鉄と鋼を生み出している。我らの製鉄所は、国中が求める線路、機械、船体板、武器を供給する。この重工業は、レコンキスタの古き山岳の避難所を、近代スペインを代表する一大工房へと作り変えるのである。"
 lon_leonese_collieries: "レオンの炭鉱"
 lon_leonese_collieries_desc: "#italic ビエルソ #! の石炭と、ラシアナおよびナロンの深まりゆく坑道は、産業の時代の鍛冶場と鉄道とを支えている。鉱山町はレオンの山々一帯に広がり、メセタや海岸まで切り開かれた新たな鉄道路線によって結ばれている。この炭田は、レコンキスタの古き王国を近代経済の燃料庫へと変えるのである。"
 lon_modern_brigades: "近代的旅団"
 lon_modern_brigades_desc: "レオンとアストゥリアスから徴募された歩兵連隊は、常にスペイン軍の中でも最も堅実な部隊と目されてきたが、今や我らはこれを砲兵、軽騎兵の哨戒、諸兵科連合訓練を統合した近代的な旅団編成へと再編する。我らの #italic レオン砲兵旅団 #! と支援野戦砲兵隊は、産業時代の戦場における歩兵と砲の連携交戦のための最新の教義を採用する。この近代化により、我が旅団は王国が行ういかなる戦役においても、最も有能な部隊の一つとなるのである。"
 #Portuguese Shared
 por_establishment_portuguese_navy: "ポルトガル海軍の創設"
 por_establishment_portuguese_navy_desc: "1317年、ディニス王は$GEN_ADJ$商人マヌエル・ペサーニャを#italicポルトガル大提督#!に任命し、北アフリカの海賊から沿岸を守り、輸入した技術をもって国家艦隊を築くよう命じた。ペサーニャはジェノヴァ人の水先案内人や造船技師、会計術を伴って赴き、次の世紀にポルトガルの航海が飛び立つ礎を築いた。この王立海軍の創設により、大西洋沿岸の他国がそれに匹敵する組織を築くより二世紀近くも早く、ポルトガルに地中海水準の海事行政がもたらされるのである。"
 por_estimulate_rural_areas: "田園地域の活性化"
 por_estimulate_rural_areas_desc: "わが国の多くの土地、主に田園地域や遠隔地では、田畑や森林、鉱山が使われなくなり、過疎化が進んでいる。法制度の改革をおこなうことで地方の生産性を高め、そこに人々が定住するように促そう。"
 por_bombardeiros: "艦砲射撃"
 por_bombardeiros_desc: "喜望峰を回るポルトガルのカラベル船やナウ船は、より大型ながら武装の乏しいインド洋の艦隊と対峙する。この不利を決定的な優位に変えるべく、我が造船技師たちは新たなナウ船の上甲板と砲門を補強し、#italic砲術長#!ジョアン・アネスの指揮の下、リスボン工廠で鋳造された重青銅砲を搭載させる。この強化された砲台の教義は、ポルトガル艦隊にディウでマムルーク海軍を打ち破るだけの遠距離砲撃力を与え、香辛料航路を一世紀にわたって確保するのである。"
 por_the_bandeirantes: "バンデイランテスの奨励"
 por_the_bandeirantes_desc: "十六世紀末よりサンパウロやサン・ヴィセンテから出撃した武装遠征隊である #italic バンデイランテス #! は、先住民の捕虜、逃亡奴隷、噂の鉱山を求めて、未踏のブラジル内陸部へと分け入っていく。ドミンゴス・ジョルジェ・ヴェーリョ、アントニオ・ハポーゾ・タヴァレス、フェルナン・ディアス・パイス・レメは皆、何年にも及ぶ遠征を通じてトルデシリャス線を着実に西へと押し広げ、マットグロッソやゴイアスの高地を踏破してゆく。この大陸規模の植民は、ポルトガルの主権を当初の条約線をはるかに超えて拡張し、ブラジルの現代的な大陸的版図を確立するのである。"
 por_colonial_governors: "植民地総督"
 por_colonial_governors_desc: "十七世紀の植民地行政改革は、封建的な #italic ドナタリオ #! 領主制の寄せ集めを廃し、リスボンの #italic 海外評議会 #! に直属する王任命の総督や副王へと置き換える。ゴアのエスタード・ダ・インディア副王、アンゴラの総督代理、サルヴァドールのブラジル総督は、それぞれ俸給を受ける王室官吏、法官、国庫監査官からなる官僚機構を率いる。この統一された行政は遠隔地の領土に対する王権の統制を強め、植民地収入のうち本国国庫に届く割合を劇的に増大させるのである。"
 por_vinho_porto: "ヴィーニョ・ド・ポルト"
 por_vinho_porto_desc: "北部のドゥエロ川岸では、ブドウを栽培してワインが造られている。そのワインは、醸造過程で蒸留酒を加えることで酒精強化をおこなうもので、#italic ポートワイン#!の名で知られはじめている。ワインの輸出で大金を稼ぐチャンスを逃してはならない。"
 #Portuguese Unique
 alv_almadraba_fisheries: "アルマドラバ漁"
 alv_almadraba_fisheries_desc: "アルガルヴェ沿岸に設けられた網の巨大な迷宮、#italicアルマドラーバ#!は、春の回遊期にクロマグロを捕らえるもので、フェニキア人やムーア人の時代から莫大な季節の漁獲をもたらしてきた。ラゴスからタビラに至る我が漁村は、漁獲を塩漬けにし樽詰めにして半島全域に売り、閑散期には鍛え上げられた船乗りを育てる苗床ともなる船団を編成する。この海の経済は、王国の食卓と、その船と航海に必要な熟練の人手の両方を支えているのである。"
 por_battle_ourique: "オーリッケの戦い"
 por_battle_ourique_desc: "1139年、我らが勇敢なる軍隊は、ムーア人の5人の王を援助なしに打ち破った。この偉業は、わが兵士たちに不朽の記憶として刻まれ、どれほどに強大かつ重武装の敵であろうと、わが兵士たちは打ち破るに違いない。"
 por_cistercian_clearance: "シトー会による開墾"
 por_cistercian_clearance_desc: "アルコバサ、ボーロ、タロウカに拠る #italic シトー会 #! の白衣の修道士たちは、レコンキスタの後を追って沼地を干拓し、茂みを切り開き、エストレマドゥーラとアレンテージョに修道院領を築いていく。その修道助士と、修道院の #italic フォラル #! に惹かれて集まった入植者たちは、空ろな辺境の地を麦畑、葡萄畑、果樹園へと変えていく。このシトー会の開拓は若き王国を養い、ムーア人からようやく奪い取った土地にキリスト教徒の農民を根付かせるのである。"
 alv_sagres_school: "サグレスの航海学校"
 alv_sagres_school_desc: "風吹きすさぶ #italic サグレス #! 岬に、航海王エンリケの庇護のもと、水先案内人やジェノヴァ人の地図製作者、天文学者、造船技師たちが集い、アフリカの大西洋を渡るために必要な風・海流・星の知識を体系化する。我が船長たちは北極星と太陽によって緯度を測ることを学び、ラテン式帆装のカラベル船を操ることを覚え、他の者たちが常に引き返したボジャドール岬を越えて南へ進む。サグレスで培われたこの航海の学問により、アルガルヴェはいかなる競合する港よりも遠くまでアフリカ沿岸を進むのである。"
 por_lisbon_entrepot: "中継港リスボン"
 por_lisbon_entrepot_desc: "テージョ川の広い河口に位置するリスボンは、西岸最大の中継港へと成長し、いまでは内陸部の塩、ワイン、コルクと北方の織物や金属が行き交っている。ジェノヴァやフランドルの商人たちは川岸に商館を構え、2つの海の交易によって王室の関税収入も増えていく。この交易拠点により、キャラベル船が初めてボジャドール岬を越えて南下するはるか前から、首都は王国の商業的中心地としての地位を確立していた。"
 por_pursuing_waves: "海を追い求めて"
 por_pursuing_waves_desc: "航海王エンリケのもと、サグレスの航海学校はジェノヴァ人の水先案内人、カタルーニャ人の地図製作者、ポルトガル人の造船技師たちを集め、アフリカの大西洋航海術を体系化する。ジル・エアネスはボジャドール岬を回り、カラベル船はシエラレオネに至り、バルトロメウ・ディアスは喜望峰を越える。それぞれの航海は我らの海図をさらに百里南へと広げていく。この継続的な王室の探検への投資は、海の彼方の報酬を二世代にわたって待つ忍耐を持つ、ヨーロッパで唯一の王国としてポルトガルを位置づけるのである。"
 alv_lagos_emporium: "商業都市ラゴス"
 alv_lagos_emporium_desc: "アフリカ航海の最初の拠点にして帰港の地である #italic ラゴス #! 港は、ギニア海岸産の砂金、象牙、マラゲタ胡椒、そして奴隷とされた捕虜が初めて陸揚げされ、課税され、売買される商業都市へと成長する。税関と商人代理店が、この小王国を南方の実入りの良い新たな交易に直結させている。この中継交易地は、アルガルヴェにその規模に見合わぬ商業的広がりと収益の流れをもたらしている。"
 por_carreira_da_india: "インド航路"
 por_carreira_da_india_desc: "#italicカレイラ・ダ・インディア#!（リスボンからゴアへ、喜望峰を回って帰還する毎年の往復航海）は、世界最長の定期海上航路となり、その巨大な#italicナウ船#!はヴォルタ・ド・マールで南へ風をとらえ、胡椒と肉桂を満載して帰港する。我らの水先案内人はモンスーンの周期と、この航路が要求する外洋航海術を極めている。インド航路は王国の海上権益を広げ、その規模に見合わぬ香辛料収益で国庫を満たしている。"
 por_feitorias: "在外商館"
 por_feitorias_desc: "#italic フェイトリア #!（十五世紀末より、アフリカおよびアジア沿岸に設けられた要塞商館）は、倉庫、駐屯地、税関、礼拝堂を、王室の #italic フェイトール #! 一人の下に統合している。サン・ジョルジェ・ダ・ミナに始まり、ソファラ、ホルムズ、ゴア、マラッカ、マカオへと広がるこの網は、大規模な内陸征服を要することなく、香辛料交易路の要衝を独占している。この要塞商館の体制により、ポルトガルは驚くほど少ない駐留兵力で、世界商業の膨大な割合を支配し、それはひとえに海上覇権によって支えられている。"
 alv_dryland_orchards: "乾燥地帯の果樹園"
 alv_dryland_orchards_desc: "アルガルヴェ沿岸の背後に広がる乾燥した石灰岩の #italic バロカル #! には、いちじく、アーモンド、いなご豆が植えられている。いずれも乾燥に強い樹木で、その乾燥果実は何年も保存がきき、海路での輸送にも適している。幾世代にもわたる段々畑造り、接ぎ木、丹念な手入れにより、我らのいちじくとアーモンドは北ヨーロッパ市場向けの主要輸出品となった。この果樹園経済は、痩せて陽に焼かれた南方の土地を、信頼できる持続的な交易と農村定住の源に変えている。"
 por_monopolio_das_especiarias: "香辛料専売制"
 por_monopolio_das_especiarias_desc: "王室は[ROOT.GetCountry.GetAdjective]の港を経由するコショウ、シナモン、クローブの専売権を握り、これらを扱う商人に許可を与え、陸揚げされる積荷ごとに五分の一税を徴収する。こうして香辛料交易を個々の船長任せにせず、勅許制のもとに置くことで、国庫は不安定だった交易収入を安定して見込める歳入へと変える。"
 por_ordenancas: "オルデナンサス"
 por_ordenancas_desc: "セバスティアン王による #italic オルデナンサス #! 改革は、ポルトガルの全ての町を、選出された #italic カピタン＝モール #! が率いる武装市民の中隊へと組織する。市民は毎月訓練を受け、王の布告があれば武器を取って参集する義務を負う。フィリペ朝の改革は装備を統一し、徴兵名簿を整備し、十六歳から六十歳までの全ての男子に、所属教区の中隊への登録を義務付けた。この全国民的な民兵制度により、常備軍の費用をかけることなく、植民地遠征や国内防衛に動員できる訓練済み人員の恒常的な予備が確保されている。"
 alv_sotavento_salt: "ソタベントの塩田"
 alv_sotavento_salt_desc: "東部 #italic sotavento #! （タヴィラ、カストロ・マリン、ファーロ）の潟湖沿いでは、太陽と潮と忍耐強い労働が塩田を育て、長く乾燥した夏の間、船一杯分もの海塩を結晶させている。我らの塩は大西洋船団のマグロと鱈を塩漬けにし、それを北へ運ぶハンザやビスカヤの商人たちの船倉を満たしている。この製塩業は、目立たぬながらも絶えることのない、王国の古来よりの富の源である。"
 por_restoration_of_independence: "独立の回復"
 por_restoration_of_independence_desc: "王国は長きにわたるカスティーリャとの連合を解消し、自国の王朝を擁立して、アレンテージョ国境で1世代にわたる戦争へと突入する。新たな要塞が築かれ、各教区で新たな連隊が編成され、独立を守る同盟が結ばれる。独立を取り戻すことで、国民は正統な王家のもと、外国の王族や過去のいかなる王位請求者も成し得なかった形で団結するのである。"
 por_royal_absolutism: "絶対王政"
 por_royal_absolutism_desc: "あまりにも長いあいだ、王権は貴族の愚かな介入によって制限を受けてきた。貴族たちの狭い地域的利益が、王国のより大きな利益を脅かしているのだ。我々は議会を無視し、彼らの干渉を受けずに統治しなくてはならない。"
 alv_coastal_fisheries: "沿岸漁業"
 alv_coastal_fisheries_desc: "アルガルヴェの港々には #italic 缶詰工場（ファブリカ・デ・コンセルヴァス） #! が建ち並び、イワシとマグロを塩、油、塩水で加工して、ヨーロッパ全土と植民地の市場へ送り出している。拡大する沿岸の労働力と安定した需要が、かつては季節限定であった漁獲を、年間を通じた商いへと変えている。この沿岸漁業は、王国最古の生業である海の恵みの収穫を、新たな規模へと引き上げている。"
 por_administrative_reforms: "行政改革"
 por_administrative_reforms_desc: "王室は、専門的な行政機関、改革された財務機関、そして国王に直属する給与制の閣僚による内閣を導入し、政府機構を刷新する。旧来の封建的な管轄当局に代わって任命制の司法官が置かれ、海外からの収入は1つの評議会を通じて管理される。行政を近代化することで、王室は旧来の複雑な合議制では不可能だった速さで改革を進められるようになる。"
 por_royal_military_academy: "王立要塞・砲術・設計アカデミー"
 por_royal_military_academy_desc: "マリア一世女王は、リスボンのサン・ジョルジェ城に #italic 要塞・砲術・製図王立アカデミー #! を設立し、十七世紀のルイス・セラン・ピメンテルによる軍事教程の後を継がせる。その教程は、ヴォーバン式築城術、フレジエの画法幾何学、そしてフランスとプロイセンの技術者たちによって試された近代砲術理論を統合し、マヌエル・デ・ソウザ・ラモスと王立工兵隊によって教えられている。この統一軍事アカデミーは、ポルトガル陸軍の将校たちを大陸ヨーロッパ水準に鍛え上げ、来たる世紀の戦争を通じて王国の技術的信頼を保ち続ける。"
 #Iberian Formables
 #Al-'Andalus
 adu_khilafa_qurtuba_renewed: "コルドバ・カリフ国の復興"
 adu_khilafa_qurtuba_renewed_desc: "我らによる #italic キラーファト・クルトゥバ #! 、すなわちコルドバ・カリフ国の復興は、アブド・アッラフマーン三世の儀礼的称号を甦らせ、再建されたマディーナト・アッザフラーの玉座の間、カリフの治世年を金糸で縫い込んだ #italic ティラーズ #! の衣、そしてコルドバの大モスクで再び唱えられる金曜礼拝の説教を伴う。我らは西アフリカの金を用いて、復興されたカリフの名のもとに新たなディナール金貨を鋳造し、我らの宗主権を認めるマグリブの諸スルタンに叙任の旗を送り、カイロのマムルーク朝の使節を請願者としてではなく対等な相手として迎え入れる。このカリフとしての権威は、コルドバの数多きキリスト教徒とユダヤ教徒の臣民に対する #italic ズィンマ #! の契約を正式なものとし、半島の多様な住民を、いかなるマグリブの地方王朝も容易に争い得ぬ単一の事業へと結び付けている。"
 adu_yusufiyya_andalusiyya: "ユースフィーヤ・アンダルシーヤ"
 adu_yusufiyya_andalusiyya_desc: "#italic ユースフィーヤ・アンダルシーヤ #!（十四世紀グラナダのユースフ一世の制度に倣って築いた我らの王立マドラサ網）は、コルドバ、セビーリャ、トレド、バレンシア、サラゴサに寄進制の学院モスクを設立し、それぞれに図書館、施療院、そしてイスラム世界各地から招いた教員団を備えている。我らの学者たちは、アンダルスのマーリク派法学を、カイロのアシュアリー派神学、そしてペルシアから渡来したイブン・シーナー哲学の復興と統合している。この国家財政による学問は、文字を解する聖職者層と、復興国家への忠誠がその俸禄たる官職と直結した訓練された法学者層を生み出している。"
 adu_riba_al_andalus: "リバ・アル＝アンダルス"
 adu_riba_al_andalus_desc: "我らの遠隔地交易（西地中海の商業路たる #italic リバー・アル＝アンダルス #!、アンダルス商人の商館を通じて、ジェノヴァ、カタルーニャ、マグリブ、マムルークの各市場を一つに織り合わせている。我らの金ディナールで振り出された信用状はアレクサンドリアやブルッヘにまで流通し、アンダルスのユダヤ教徒やモサラベの金融業者たちは、旧来のキリスト教徒の銀行家が危険すぎて手を出さぬような交易事業にも融資を行っている。この信用と商業の網により、我らはより有利な条件で借款を得られ、イベリアの海を渡るあらゆる種の交易に課税できる。"
 adu_aman_ahl_al_dhimma: "アマーン・アフル・アッ＝ズィンマ"
 adu_aman_ahl_al_dhimma_desc: "我らが新たにした保護契約、#italic アマーン・アフル・アッズィンマ #! は、復興国家のキリスト教徒およびユダヤ教徒共同体に正式な保護を及ぼし、彼らの教会とシナゴーグ、内部裁判、そして兵役の代わりに納める #italic ジズヤ #! を規定している。ムデハルとモサラベの同業組合は、その技能を認める王室特許状を受け、偉大なセファルディムの金融家一族はスルタン国の保護の下、コルドバとグラナダに支店を再興している。この #italic コンビベンシア（共存） #! は、生産的な非ムスリム共同体を国家の営みに結び付け、我らの都市の多様性を反乱の種ではなく繁栄の源へと変えている。"
 adu_armada_andalusiyya: "アルマーダ・アンダルシーヤ"
 adu_armada_andalusiyya_desc: "我らの連合艦隊 #italic アルマーダ・アンダルシーヤ #! は、アルメリアとカディスの国家海軍を、サレ、テトゥアン、そしてアルジェを拠点とするアンダルス亡命船長たちの私掠艦隊と融合させ、西地中海において並ぶ者なきキリスト教列強にも対抗し得る単一の指揮系統を作り上げている。この艦隊の上陸作戦教義は、ガレー船と帆船の艦隊に、敵の海岸への急襲と砲火の下での迅速な再乗船を訓練された海兵部隊を組み合わせたものである。この統合された海軍力により、我が軍はジブラルタル海峡を越え、アフリカ沿岸に沿って、いかなる敵艦隊も迎撃し得ぬ速さで展開できる。"
 adu_nahda_andalusiyya: "ナフダ・アンダルシーヤ"
 adu_nahda_andalusiyya_desc: "我らの近代的復興、 #italic ナフダ・アンダルシーヤ #! は、イブン・ルシュドとアッザフラーウィーの発見された写本が、再建されたコルドバの印刷所で刊行されることに始まり、パスクアル・デ・ガヤンゴスやラインハルト・ドージーの系譜に連なる学者たちの下、新設のグラナダ王立アカデミーを中心に発展し、十九世紀末のアラビア語・カスティーリャ語二言語の文芸誌において花開く。我らは新たなヨーロッパの科学著作を現代アラビア語に翻訳し、エスコリアル、ボドリアン、そしてフェズとチュニスの図書館から、中世アンダルスの文献群を取り戻している。この知的復興は、我が国家の地中海学問の中心地としての地位を取り戻させ、他の君主国がその威信を改めて購わねばならぬ時代をはるかに越えて、我が宮廷の威信を保ち続けている。"
 #Spain
 spa_visigothic_inheritance: "西ゴート王国の継承"
 spa_visigothic_inheritance_desc: "イベリアのキリスト教諸王国は、711年のムスリム征服まで、トレドよりヒスパニアを統治した統一西ゴート王国との連続性を主張する。我らの年代記作家たちは、レオンとカスティーリャの全ての王を、ペラーヨを経てレカレドとトレドの王冠にまで遡らせ、レコンキスタを、複数の王国の征服ではなく、ただ一つの正統なるキリスト教王国の#italicレスタウラティオ（復興）#!として位置付けている。この新ゴート主義のイデオロギーは、スペイン王権に、ピレネーからジブラルタル海峡にまで及ぶ単一の半島王国を正当化する統一的な物語を与えている。"
 spa_idea_de_hispania: "イデア・デ・ヒスパニア"
 spa_idea_de_hispania_desc: "半島諸宮廷の年代記作家と法学者たちは、#italic イデア・デ・イスパニア #!、すなわちイベリアを、一つの歴史的運命と一つの法的継承を分かち合う単一のキリスト教諸王国共同体と見る西ゴート・ローマ的理念を復興させている。我らは、半島の諸王国を一つの政治的家族として認識させる系譜、公会議決議、そして十字軍教書を編纂し、我が宮廷はピレネー山脈の向こうにある単なる地方王朝とは一線を画す、ヒスパニア的正統性の様式を採用する。この共有された理念により、我が宮廷は共通の先例を拠り所として自らの立法を簡素化でき、この認められたキリスト教諸王国の家族の一員たる地位により、近隣諸宮廷は我らの行動を脅威としてではなく、同族の王国の行いとして受け止める。"
 spa_revival_of_ecclesiastical_discipline: "教会規律の復活"
 spa_revival_of_ecclesiastical_discipline_desc: "スペインの修道会は、カスティーリャのフランシスコ会やドミニコ会の諸院ですでに根付きつつある、より厳格な戒律を求める運動——#italic オブセルバンシア #!——の入口に立っている。我々は、あらゆる正規修道会の厳修派に王室の後ろ盾を与え、閉域生活を放棄した緩修派の諸院を廃止し、その所領を王室と異端審問の合同巡察下にある改革派のヒエロニムス会、アウグスティノ会、カルトジオ会、シトー会へと振り向ける。在俗聖職者の抜本的改革は、カトリック・ヨーロッパの他国がこの問題に直面するよりも一世代早く、スペイン教会に規律ある道徳秩序をもたらす。"
 spa_school_salamanca: "サラマンカ学派"
 spa_school_salamanca_desc: "十六世紀を通じてサラマンカ大学を中心とする神学者・法学者たちの学派、#italicサラマンカ学派#!は、帝国、征服、そして世界交易という前例なき問題にトマス主義のスコラ的方法を適用する。フランシスコ・デ・ビトリアによるアメリカ先住民の権利についての講義、ドミンゴ・デ・ソトの貨幣理論、ルイス・デ・モリナの自由意志論は、自然法、国際法、経済理論に関する最初の体系的なヨーロッパ思想を生み出す。この学派はスペイン君主政に、その帝国事業を正当化する思想体系を与え、いかなる競合国よりも一世代先んじさせる。"
 spa_siglo_de_oro: "スペイン黄金世紀"
 spa_siglo_de_oro_desc: "スペインは前例なき文化的開花の瀬戸際に立っている。それは #italic 黄金世紀 #! であり、アントニオ・デ・ネブリハのカスティーリャ語文法書やカトリック両王宮廷の芸術サークルに、すでにその最初の胎動が見られる。我々は #italic 王立機関 #! や修道会の各支部を通じて、詩人、劇作家、画家たちに王室の庇護を注ぎ込み、セルバンテス、ロペ・デ・ベガ、ベラスケス、カルデロンが傑作を生み出すのに必要な制度的支援を提供する。この継続的な文化投資は、スペインを二世紀にわたりカトリック世界の文学・芸術の首都たらしめる。"
 spa_spanish_enlightenment: "スペイン啓蒙主義"
 spa_spanish_enlightenment_desc: "カルロス三世とその大臣たち(フロリダブランカ、アランダ、カンポマネス)によるブルボン改革政策は、十八世紀後半にスペインをより広範なヨーロッパ啓蒙思想へと開く。ガスパル・メルチョル・デ・ホベリャーノスは農業改革の報告書を発表し、#italic Reales Sociedades Económicas de Amigos del País #! はあらゆる県都に広がり、サラマンカ、アルカラ、バレンシアの各大学は近代物理学、化学、政治経済学を課程に導入する。#italic Real Ordenanza de la Casa de la Moneda #! はセビリャからポトシに至るすべての王立造幣所にニュートン式の検定基準をもたらし、マドリードの新設 #italic Banco de San Carlos #! は商人資本と王室預金を集めて、いかなる民間銀行家も提示できぬ条件で公共事業に融資する。知的・財政的近代化は、新たな大陸秩序で競うために必要な有能な大臣たち、行政革新、国家並みの公信用、そして生産的な銀貨鋳造を、末期のスペイン君主政に備えさせる。"
 #Iberia Region
 cas_the_reconquista: "レコンキスタ"
 cas_the_reconquista_desc: "西ゴート王国が侵略され滅亡して以来、わが国は長きにわたってムーア人と戦争を繰り広げてきた。そのおかげで、我々は類まれなる強固な規律を身に着けた。カスティーリャの民よ、立ち上がれ。そして決意を世界に示すのだ！"
 lieutenancy_advance: "総督"
 lieutenancy_advance_desc: "王室の世襲財産が増大し、君主が諸王国を長期不在にすることで王室は弱体化し、臣下との関係も緊張をはらんでくる。これに対処するため、総督という、君主不在時の一時的な代理人として機能する役職が作られた。この役職は恒久的なものではないが、総督は王家の血筋の者だけでなく、王室とつながりのある身内から選ばれることもある。"
 spa_viceroyalties: "スペイン副王領"
 spa_viceroyalties_desc: "エルナン・コルテスがテノチティトランを、フランシスコ・ピサロがカハマルカを攻略した後に征服された広大なカスティーリャおよびポルトガルの領土は、いかなる中世的封建制度も提供し得ぬ水準の王室監督を必要とする。我々は #italic Virreinatos #! を設立する——まずアントニオ・デ・メンドーサ治下、メキシコ市を首都とするヌエバ・エスパーニャ副王領、次いでブラスコ・ヌニェス・ベラ治下、リマを首都とするペルー副王領——それぞれを、統治・司法・財政・防衛にわたり国王本人の全権を有する副王が統括する。副王制は、人類史上最大の連続した帝国を見事にまとめ上げる遠隔統治の模範である。"
 spa_naval_reforms: "スペイン海軍の改革"
 spa_naval_reforms_desc: "イベリア半島の海岸線はビスケー湾、大西洋沿岸、西地中海という三つの異なる海に広がり、それぞれにおいて異なるイベリア諸文化の艦隊が何世紀もかけて築き上げた独自の海事伝統がある。我々は、半島に歴史的に乱立する海軍指揮権を、中央集権的な大提督の権威のもとに統一された専門的 #italic アルマダ #! へと統合し、沿岸すべての造船所における徴募、信号規約、補給を標準化する。半島の艦隊をこうして統一することで、我が王室は、来るべき数世紀の世界帝国が要求する二つの大洋の艦隊を編成し、維持し、派遣することができる。"
 tercio: "テルシオ"
 tercio_desc: "#italicテルシオ#!歩兵は、イタリア戦争の最中、#italic偉大なる指揮官#!と呼ばれた不世出の名将ゴンサロ・フェルナンデス・デ・コルドバによって主に編み出された。これは槍兵と銃兵を組み合わせた混成歩兵編制である。この combined arms(諸兵科連合)方式により、重装歩兵の堅固さと銃兵の長射程火力を同時に発揮し、守りにも攻めにも理想的な部隊となる。"
 catalan_galley_desc: "古代ギリシャの船の自然な進化形である$n_catalan_galley$は、地中海で同様の船が開発される前に記録された、より大型の船だ。"
 catalan_galley: "カタルーニャのガレー船"
 early_iberian_caravel_desc: "もともとイベリアを起源とする最初のキャラベルは、小型だが非常に高速な船で、沖合での漁業や沿岸交易に用いられた。イベリア半島ではかなりの広範囲で使用されており、最も先進的なキャラベルも同地に存在する。"
 early_iberian_caravel: "イベリアの初期型キャラベル"
 early_iberian_galleon_desc: "強力な外洋航行船の初期型である$n_early_iberian_galleon$は、イベリア半島の独自の発明であり、低い船首楼と長い船体をもつおかげで特に安定性が高く、向かい風に強くなっている。"
 early_iberian_galleon: "イベリアの初期型ガレオン"
 iberian_caravel_desc: "より速く、より信頼性の高いキャラベルが必要とされるようになり、イベリア半島の港で新しく大きなものが設計された。キャラベルはヨーロッパ全土で一般的なものとなったが、イベリアのものは、その革新性と速度において群を抜いている。"
 iberian_caravel: "イベリアのキャラベル"
 iberian_galleon_desc: "$n_early_iberian_galleon$の進化形である$n_iberian_galleon$は、前身となる船をより定型化したものであり、海で敵を粉砕する非常に強力な船だ。"
 iberian_galleon: "イベリアのガレオン"
 square_rigged_caravel_desc: "$n_iberian_caravel$と$n_carrack$を組み合わせることで、新たな船が生まれた。高速かつ頑丈なこの船は、我々が海を支配するためにまさに必要としていたものだ。"
 square_rigged_caravel: "横帆式キャラベル"
 ara_almogavars: "$a_almogavars$"
 ara_almogavars_desc: "$a_almogavars_desc$"
 ara_catalan_crossbowmen: "$a_catalan_crossbowmen$"
 ara_catalan_crossbowmen_desc: "$a_catalan_crossbowmen_desc$"
 ara_late_almogavars: "$a_late_almogavars$"
 ara_late_almogavars_desc: "$a_late_almogavars_desc$"
 cas_lanzas_de_castilla: "$a_lanzas_de_castilla$"
 cas_lanzas_de_castilla_desc: "$a_lanzas_de_castilla_desc$"
 por_cacadores: "カサドリス"
 por_cacadores_desc: "#italic 戦う料理人#!の異名をもつカサドリスは、ポルトガル陸軍の精鋭軽歩兵である。通常の兵士と区別するため、茶色の軍服を身につけている。"
 #Italy Region Advances
 #Corsican Shared
 corsican_the_machja: "マキア"
 corsican_the_machja_desc: "コルシカの内陸部は、マキア（標準イタリア語ではマッキア）として知られる、密生した芳香性の常緑低木地帯に覆われており、これは人々の生存戦略の中核となっている。住民たちは無防備な沿岸部で優勢な海上侵略者と戦うのではなく、難攻不落の花崗岩の山々へと「戦略的撤退」をおこなう文化を発展させた。これにより、身を隠す術と急峻な地形をすばやく移動する術に長けた高地住民の社会が形成された。この文化的適応により、島の地理はわが国の文化にとって生きた要塞となり、いかなる侵略者の海軍も届かない安全な場所で、人々はその法と慣習を永続的に維持できるようになった。"
 corsican_the_vindetta: "ヴェンデッタ"
 corsican_the_vindetta_desc: "我が島のかつての占領者たちが厳格な法体系を押し付けようとするたび、コルシカの民はヴェンデッタに基づく独自の伝統的司法を強化することで応じてきた。外部の者からは無法と見なされようとも、これは名誉と自己規律に基づく洗練された社会機構である。これは、各人が自らとその血族の保護に責任を負う文化を生み、結果として民衆のほぼ全員が武装し、戦術に長けることとなる。この「長き記憶の文化」のもとでは、いかなる侮辱も代々続く血の抗争をもって報いられる。国家としては、これは外国軍による占領の代償を、金銭においても人命においても法外に高くつくものとすることを意味する。"
 corsican_the_castagniccia: "カスタニッチャ"
 corsican_the_castagniccia_desc: "かつてのジェノヴァ占領は、特に中央高地における栗の木の栽培を大いに奨励した。これにより、低労働力で安定した食料源を民に提供し、地中海市場の穀物価格の変動とは無縁な、栗をめぐる独特の文化が形成された。この豊かさは、コルシカの民に驚くべき戦略的自立をもたらす。彼らは山中に退いて栗粉だけで無期限に自活でき、かつてジェノヴァの海軍艦隊が用いた通常の海上封鎖や「飢餓による包囲」戦術に対して無敵となる。"
 corsican_the_corsican_baroque: "コルシカのバロック"
 corsican_the_corsican_baroque_desc: "帰還した傭兵や商人たちの富に支えられ、バロック様式の教会建築の波が島を襲っている。これらの教会は「禁欲的な壮麗さ」を特徴とし、民の荒々しくも敬虔な性質を映し出す。文化的には、これは文明的な気概の誇示であり、コルシカが壮大な記念建築を生み出せる、豊かで洗練された社会であることを近隣諸国に示す宣言である。これらの教会は共同体生活の中心として機能し、人々は集い、合唱ポリフォニーと演劇的な宗教儀礼を通じて自らの独自性を称える。"
 corsican_lamentu_and_voceru: "ラメントゥとヴォーヂェル"
 corsican_lamentu_and_voceru_desc: "コルシカの口承詩の文化、特に「ラメントゥ」（標準イタリア語ではラメント。「哀悼の歌」を意味する）と「ヴォーヂェル」（標準イタリア語ではヴォチェロ。「復讐の歌」を意味する）は、民族的記憶を継承していくための主要な媒体となっており、これらの歌は、人々の闘争と殉教者たちの名を伝える生きた記録としての役割を果たしている。文化的な見地から言えば、これによって抵抗の精神がすべての子供に生誕時から深く根付くこととなり、占領者による住民の「再教育」や同化が不可能となる。この口承伝統は強力な心理的武器として機能し、そのため外国軍による軍事占領という最も暗い時期であっても、士気は高いままでありつづけ、文化的反抗の姿勢は決して崩れることがない。"
 corsican_chjame_rispondi: "チャム・エ・リスポンディ"
 corsican_chjame_rispondi_desc: "長年にわたる外国からの軍事圧迫のなか、コルシカの口承伝統であるチャム・エ・リスポンディ（呼びかけと応答）は、社会的結束の洗練された手段へと発展した。この即興の詩の競演により、人々は街の広場で暗号化された比喩を用いて政治を議論し、倒れた英雄を称え、占領者を嘲笑することができた。これにより、啓蒙思想の原則と革命の記憶が、非識字者層でさえも理解できる形で受け継がれていったのだ。これを奨励することで、検閲に影響されない統一された文化的物語を創出し、いかなる状況下でもコルシカのアイデンティティの炎を明るく燃やしつづけることができる。"
 #Corsican Unique
 cor_the_pievi: "ピエヴィ"
 cor_the_pievi_desc: "本王国は伝統的に、母教会を中心とする伝統的地区 #italic Pievi #! に分割されてきた。これらは単なる宗教単位ではなく、民政の主要な拠点でもあった。国家は #italic Pievani #! (教区司祭)を王室の登記官・判事として活用し、極めて地域密着的かつ効率的な徴税網を築き上げてきた。これにより、最も辺鄙な山間の集落からさえも王国は資源を動員でき、険しい地形を構造化された行政網へと変える。"
 cor_the_milizia_di_u_riamu: "王国の民兵隊"
 cor_the_milizia_di_u_riamu_desc: "我らの指導のもと、敵の策動から生じる圧力に対抗するため、コルシカの各氏族は伝統的な徴兵制度を体系化された「王国の民兵隊」へと再編する過程にある。これには、氏族単位の小競り合いから国家的な軍事義務への文化的転換が求められる。すべての教区は標準化された武器庫を維持し、定期的な訓練をおこなうことが義務づけられる。この「剣の国有化」で、島において自らの家々の防衛に対し当事者意識を持つ市民からなる常備軍が確保されることとなる。これにより、北と南の古くからの隔たりが埋められ、近代的な国民国家の先駆けとなる統一された軍事的アイデンティティが築かれるだろう。"
 cor_capituli_di_corsica: "カピトゥリ・ディ・コルシカ"
 cor_capituli_di_corsica_desc: "我々は #italic カピトゥリ #! を正式に制度化する。これは中央王権と内陸の険しい山岳共同体との間で交わされる成文協定である。これらの特許状は、山岳民に特定の免税特権と地方自治権を認める代わりに、彼らの永続的な兵役と忠誠を求めるものである。これは内政外交の傑作であり、王権を絶対的忠誠と引き換えることで、島で最も困難な地形を、反逆的な封建領主ではなく、意欲ある国家寄りの民の手に委ねることを確実にする。"
 cor_guardia_corsa: "グアルディア・コルサ"
 cor_guardia_corsa_desc: "数十年来、コルシカの民は教皇庁やフランス国王などの精鋭護衛として奉仕を求め、揺るぎない忠誠と獰猛さで名声を得てきた。我々はこれを活用し、これらの古参兵に報奨を与えて帰還させ、地元の民兵を訓練させる。これにより「帰還した専門家」という文化が生まれ、国防は最新のヨーロッパ戦術を習得した者たちによって主導される。この専門知識の流入は、不正規な山岳遊撃兵の国を、規律ある近代的歩兵部隊へと変貌させる。"
 cor_u_ginnasiu_corsu: "コルシカ学院"
 cor_u_ginnasiu_corsu_desc: "他国で教育を受けた官僚への依存を減らすため、王国は初の世俗的なギムナジウムおよび大学を設立する。これにより、わが国の地理と慣習法に精通した、国内出身の国家法学者の階級が育成される。この知的な隆盛はコルシカ啓蒙思想の揺籃となり、古来の氏族の伝統よりも合理的な統治と「人民の権利」を優先する行政官を輩出し、近代的な立憲主義国家へと生まれ変わる土台を築く。"
 cor_the_corsican_constitution: "コルシカ憲法"
 cor_the_corsican_constitution_desc: "我らの統治者のもと、コルシカは世界初の近代的な成文憲法を採択し、すべての財産所有者に普通選挙権を付与する。これにより、「啓蒙された市民意識」という文化が育まれ、コルシカ人が自らをヨーロッパの自由の先駆者とみなすようになる。こうした政治的成熟は、国家が強力な国家機関を設立することを可能とする。コルシカ憲法は「自由の灯台」となり、来たるべき革命に影響を与え、地理的な規模を超越した、計り知れないほどの誇りと歴史的使命感を人々に与えることになるのだ。"
 #Emilian Shared
 emilian_al_po_doma: "ポー川の治水"
 emilian_al_po_doma_desc: "洪水に見舞われやすい平原に暮らすエミリアの民は、河川の運河化技術を極めている。運河は単なる排水目的だけでなく、絹織物工場や穀物製粉機の尽きることのない動力源としての役割も担っており、モデナやボローニャのような内陸都市が人工水路を通じてポー川やアドリア海へと交易品を輸送し、産業の拠点として機能できるようになっただけでなく、ポー川とその破壊的な洪水を制御することにも成功した。"
 emilian_the_via_emilia: "エミリア街道"
 emilian_the_via_emilia_desc: "エミリアの諸都市は、古代ローマの大動脈であるヴィア・エミリアの立地を活かし、国際的な見本市を開催する。我々はこれらの活動が完全な安全のもとで発展する手段を提供し、度量衡を標準化する。これにより国際商人たちの信頼を得て、アルプスと地中海からの商人たちが出会う場を作ることができる。この交易への献身は、エミリアの諸国家が絹や香辛料といった奢侈品貿易の不可欠な仲介者として繁栄することを可能にする。"
 emilian_dispenza_emigliana: "食の宝庫、エミリア"
 emilian_dispenza_emigliana_desc: "エミリアの宮廷は、すべての料理人が地域の親善大使としての役割を担う文化を育んできた。この地域の特産品（バルサミコ酢、生ハム、熟成チーズ）は、外国の君主を魅了するために用いられている。この「味覚を通じた征服」というこの戦略により、我々はつねにヨーロッパの宮廷において影響力を持ち、極上の高級食材の圧倒的な希少価値と品質によって同盟関係を確固たるものにする。"
 emilian_the_tera_cruda: "未焼成土"
 emilian_the_tera_cruda_desc: "敵の近代的な大砲に直面し、我々は煉瓦があまりに脆いことを悟った。我々は突き固め土と煉瓦張りの城壁の使用を先駆的に導入する。石材不足へのこの適応——多くの者から #italic トラース・イタリエンヌ #! として知られることになるもの——は、我が技術者たちを世界で最も引く手あまたの軍事顧問とし、我らの「泥と煉瓦」の防御科学を世界中に輸出させることとなる。"
 emilian_la_mzura_dal_sol: "土地の測量"
 emilian_la_mzura_dal_sol_desc: "ポー川流域を最大限に活用するため、国家はあらゆる排水溝と農地の科学的測量に着手する。この測量は、大地を巨大な台帳へと変える。これによりヨーロッパ随一の精密な徴税が可能となり、肥沃な沖積土の一エーカーに至るまで、国家の近代化を支える国庫へと正当な分を納めることが確実となる。"
 emilian_al_melodram: "歌劇"
 emilian_al_melodram_desc: "巨大な公立歌劇場の建設は国家の最優先事項となる。これらの劇場は「民衆の議会」となり、台頭するブルジョワジーが集い、音楽を通じて共通の国民的神話を共有する場となる。この文化により、エミリアの民衆はイタリアで最も政治的に活発な民となり、あらゆる試練に立ち向かう不屈の精神が養われる。"
 #Emilian Unique
 blg_la_dota: "ラ・ドータ"
 blg_la_dota_desc: "ボローニャは世界最古の組織的大学の興隆とともに、ヨーロッパの知の実験場となり、#italic ラ・ドータ #! (#italic ラ・ドッタ #! 標準イタリア語で「学識ある都市」)の異名を得た。文化的に見れば、これは社会を封建的な決闘裁判から、復興したローマ法に基づく文民法理へと移行させるものであった。これにより、複雑な都市行政を担いうる専門的な世俗公証人や法律家の階層が生まれ、ボローニャの行政は他に類を見ない熟練度を誇るようになった。"
 fer_the_curtesia: "宮廷の礼節"
 fer_the_curtesia_desc: "コムーネ（自由都市国家）がシニョーリア（僭主国）へと移行するのに伴い、フェラーラの宮廷は中世後期における騎士道精神の中心地となった。これはフランスのアーサー王伝説と、イタリアの人文主義的知性の文化的融合であった。そこから洗練された宮廷の礼儀作法が生まれ、ヨーロッパ貴族の絶対的基準となり、わが宮廷は洗練された会話と芸術後援を通じて「可能性の芸術」が実践される外交の拠点へと変貌を遂げた。"
 man_casa_gonzaga: "ゴンザーガ家"
 man_casa_gonzaga_desc: "一世紀以上にわたり、#italicゴンザーガ家#!は征服者としてではなく、臣民との相互利益の盟約に基づく領主としてマントヴァを統治してきた。それは単なる軍事力では買うことのできない正統性であり、我らは都市を搾取すべき資源として扱うことを決してしなかったことで、この地位を維持してきた。我らはこの立場を三つの相互に絡み合う経路によって支えている。すなわち、臣民を共通の信仰で結びつける教会庇護、他家が異議を唱え得ない法的基盤を我らの統治に与える正式な王朝称号、そしてマントヴァ市民が今なお自らの継承された権利と認める自治体の伝統への我らの意図的な尊重である。信仰、王朝、そして市民契約の上に立つ我らの国家は、臣民一人一人が日々の暮らしの中で感じる正統性を保持しており、我らの統治は武力のみに基づく体制よりも遥かに安定している。"
 mod_the_ancient_commune: "古のコムーネ"
 mod_the_ancient_commune_desc: "偉大な諸王朝の台頭以前、ポー平原の諸都市は選出されたコンスル（執政官）と市民の誓約同盟を通じて自治をおこない、いかなる領主も完全には取って代わることのできなかった市民組織の習慣を築き上げていた。我々はこの遺産を基に、王室と都市共同体との関係を正式に定め、国家を維持するための税と兵士と引き換えに、認められた権利を付与している。王室と都市のあいだのこの協定は、我らの権威を武力だけではなく合意にも根ざしたものにし、臣民を単なる被治者ではなく、統治の協働者とするものである。"
 par_commune_of_parma: "パルマ・コムーネ"
 par_commune_of_parma_desc: "パルマの自治の伝統は深く根づいており、その自由を帝国の野心から守るため、近隣諸都市とともに戦ったイタリアのコムーネ時代に鍛え上げられたものである。我々はこの遺産を基に、王室と都市共同体との関係を構築し、国家を維持するための税と兵士と引き換えに、保護と認められた権利を付与している。この協定は、我らの権威を武力だけではなく合意にも根ざしたものにし、わが統治をその支配下にあるすべての人々にとって、より安定的で協調的なものとする。"
 pcz_commune_of_piacenza: "ピアチェンツァ・コムーネ"
 pcz_commune_of_piacenza_desc: "ピアチェンツァは領主が領有権を主張してやって来るはるか以前から、コムーネとして自治をおこなっており、選出されたコンスル（執政官）、都市裁判所、市民によって執行される成文法の伝統を含むその自治機構は、抵抗するのではなく適応することで、幾度もの政権交代を乗り越えてきた。我々はこの深く根差した市民的伝統を基に、わが街の行政を合理化し、不文律の慣習がもたらす摩擦を軽減して、都市住民が正当に自らのものとして認識できる統治体制を提供する。このコムーネの諸制度の復活は、わが国家をより安定させ、臣民は多大な費用を要する強制措置なしに自らの義務を進んで果たす意欲を高めることになる。"
 blg_la_grasa: "ラ・グラサ"
 blg_la_grasa_desc: "ポー川流域の豊かな恵みとボローニャのギルドの卓越した技術を通じて、我らが首都は比類なき豊かさで名声を博し、第二の愛称「ラ・グラサ」（標準イタリア語ではラ・グラッサ。「肥満の都」を意味する）である。クアドリラテロ市場と上質な肉製品やパスタの生産に投資することで、必ずやすべての旅人が満ち足りた腹と軽くなった財布を抱えてこの街を後にするだろう。"
 fer_studio_di_ferrara: "フェラーラ大学"
 fer_studio_di_ferrara_desc: "エステ家によって創設され、その種の大学としては最も初期の部類に数えられるフェラーラ大学は、イタリア全土の人文主義者や法学者を我々の宮廷へと惹きつけてきた。高名な学者たちの指導のもと、我らが大学の教室は「新学」の工房となり、拡大するわが国家が必要とする教養ある官僚や外交官を養成している。この機関は、戦争のみに依存するいかなる王国よりも迅速に、知識と新たな制度をわが領土へと確実に普及させる。"
 man_gonzaga_patronage: "ゴンザーガ家による芸術の庇護"
 man_gonzaga_patronage_desc: "我が宮廷は、半島における芸術的才能を引き寄せる偉大な磁場の一つとなった。画家、彫刻家、建築家たちは、マントヴァが野心に報い、ここで生み出された作品が我らの門を叩くあらゆる使節の目に触れることを、はじめから知った上で訪れる。我らはこの庇護の伝統を、ひとつの意図的な政策として制度化し、複数の芸術家を同時に常駐させる俸禄と工房を維持し、彼らの作品が我らの目指す威信を反映するよう取り計らっている。この #italic メチェナティズモ #! の文化は、芸術家を抱える費用を抑えつつ、一度限りの仕事のために通り過ぎるのではなく、永住して定着する最高水準の才能を引き寄せている。"
 mod_este_textiles: "エステ家の織物工芸"
 mod_este_textiles_desc: "モデナの工房は、古くから高品質の絹織物や毛織物を生産しており、それらは北方の主要な見本市において高値で取引されている。我々の庇護のもと、織物の専門技術を城壁内に集約するギルドの慣行を守り、最も熟練した職人が確実に後継者を育成するようにすることで、我々はこの伝統を深化させる。この職人技への投資により、我らの商人はヨーロッパの諸宮廷から信頼される供給者となり、戦争の成否に左右されない安定した収益を我々の財源にもたらしてくれる。"
 par_the_bishop_of_parma: "パルマ司教"
 par_the_bishop_of_parma_desc: "パルマ司教は、この都市において世俗の権力に匹敵する権威を長きにわたり振るい、北イタリア屈指の傑出した宗教建築群を通じて、市民の信仰生活を導いてきた。我々はこれに抵抗するのではなく、この機関と連携することを選び、その影響力を市民の安定と信仰心のために活用している。王室と教会とのあいだのこの協力関係は、臣民の信仰を強化し、いかなる軍事力でも容易には代えがたい道徳的権威の源を我々の政府にもたらしている。"
 pcz_collegium_placentinum: "コレギウム・プラチェンツィヌム"
 pcz_collegium_placentinum_desc: "ピアチェンツァにおける法学の伝統は、この地方の偉大な大学群よりも古くから存在する。我らの都市からこそ、注釈学者や法学者たちが半島全土に広がり、ローマ法への深い知識をもたらし、それが何世紀にもわたりイタリアの統治の知的基盤となったのである。我らはこの伝統を復興させるべく、法学と市政を専門とする正式な学寮を設立し、市の有力市民の家々から学生を募り、近代国家の法制・財政機構を運営しうる訓練された官僚層を育成する。この #italic コレギウム・プラケンティヌム #! は、我らの統治階級の識字と能力を高め、我らの立法に明快で一貫した形を与える。"
 blg_la_rassa: "ラ・ラッサ"
 blg_la_rassa_desc: "ボローニャの別名である「ラ・ラッサ」（標準イタリア語ではラ・ロッサ。「赤の都」を意味する）は、その街並みに宿る深紅の魂を称えるものだ。アシネッリの塔から見渡せる古代のテラコッタのレンガ造りと、防壁のように広がる赤い屋根の海は、臣民に畏敬の念を抱かせ、敵に対しては反抗の意志を突きつける。赤は我らの都市と深く結びつきつつあるため、現在我々の好む色調にないあらゆる建築物が、可能なかぎり速やかに赤いテラコッタで再建されるよう、法律の制定に着手しなければならない。"
 fer_ladizion_erculea: "エルコレの都市拡張"
 fer_ladizion_erculea_desc: "フェラーラは「理想都市」という概念を生み出した地である。中世の自然発生的な都市拡大に代わって、国家は広い大通りと対称的な広場を含む、大規模で計画的な都市拡張を実施する。これは国家の秩序と威厳を反映すべく設計された、ヨーロッパにおける近代都市計画の最初の例となるだろう。これにより公衆衛生が改善され、軍隊の移動が容易になり、フェラーラは西方で最も近代的かつ威信ある国家になるのである。"
 man_studium_mantovano: "ストゥディウム・マントヴァーノ"
 man_studium_mantovano_desc: "我々はマントヴァに正式なストゥディウムを設立し、この地域の主要大学の数々から法学、哲学、芸術の教師を招聘して、これまでボローニャやパドヴァへと旅するだけの富を持つ者のみに開かれていた教育を、市民や下級貴族の子弟にも提供する。この機関はマントヴァを、大いなる学校を通じて流れるヨーロッパの学問の潮流へと結びつけ、司法、神学、自然哲学における最新の思想が、書簡を通じて何年も遅れて到来するのを待つのではなく、我らの街へと直接もたらされるようにする。この「ストゥディウム・マントヴァーノ」は統治階級の教養を高め、新しい思想がイタリアのどこへ広まるのとも変わらぬ速さでわが国にも根づくようにする。"
 mod_estense_library: "エステ家の図書館"
 mod_estense_library_desc: "イタリアの偉大な私設図書館の中でも、我らのものは際立っている。幾世代にもわたり蓄積されたその写本や彩飾本は、大陸全土から学者たちを我が宮廷へと引き寄せる。我らはこの蔵書を整理・拡充し、学識ある者たちが我らの庇護のもとで知の最前線を切り開く、実働する機関たらしめている。この知的生活への献身は、我が領内における新思想の普及を加速させ、我が宮廷が文明の花開く場所であることを世界に示すものである。"
 par_the_new_duchy: "新公国"
 par_the_new_duchy_desc: "我が都市が独立した国家の首都へと格上げされたことは、パルマにとって新たな章の始まりを告げるものである。もはや大国間を行き来する所有物ではなく、独自の伝統と野心を持つ、承認された領邦国家の座である。我らは迅速に主権の制度と儀礼を整え、臣民には明確な一体感を、隣国には明確な交渉相手を示す。この正統な権威の確立により、我が国家は吸収されにくく、統治しやすいものとなる。"
 pcz_piacentine_soldiery: "ピアチェンツァの軍勢"
 pcz_piacentine_soldiery_desc: "ピアチェンツァの農村地帯は長年にわたり、この街の控えめな規模からは想像できないほど質の高い兵士を輩出してきた。ポー川流域の農場やアペニン山脈の麓で育った彼らは、戦役の厳しさに耐えながらも気力を失わず、陣形を崩さずに持ちこたえられる。我々はこうした者たちの資質を専門的な規律へと変えるために投資し、訓練、給与、および将校を提供する。この「ソルダテスカ・ピアチェンティーナ」は、忠誠心の低い部隊なら瓦解するような状況でも結束を保ちつづける、経験豊富な歩兵で構成された強固な中核をわが軍にもたらすのである。"
 blg_lacademia_di_incamine: "アカデミア・ディ・インカミネ"
 blg_lacademia_di_incamine_desc: "ルネサンスの熱狂的な盛り上がりが落ち着きをみせるにつれ、教育は組織化されたアカデミアへと移行しつつある。これらは科学者、作家、画家のための国家主導の機関であり、マニエリスムから脱却し、自然主義や生体デッサンへと移行することによって芸術教育の改革を目指すものである。この改革により、国家は芸術や科学の成果を国家の威信向上へと導くことが可能となり、その結果、数十年にわたりヨーロッパの美意識を支配することになる絵画の「ボローニャ派」の誕生へとつながっていく。"
 fer_court_of_letters: "文芸の宮廷"
 fer_court_of_letters_desc: "我々の宮廷はイタリアで最も名高い文学の集いの場となり、大広間では詩人たちが朗読し、庭園では学者たちが哲学を論じている。彼らの活動は私的な娯楽であると同時に、国政の手段としても支援されている。わが国の名は俗語の伝統における卓越性と同義であり、半島各地から才能ある者たちが集まり、我らの寵愛と庇護を求めて競い合っている。この文化における名声は、我らの芸術的遺産をさらに深め、ここで生み出されるすべての偉大な作品を、わが国家の威信を宣伝する媒体へと変えるのである。"
 man_palazzo_te: "パラッツォ・テ"
 man_palazzo_te_desc: "フェデリーコ二世・ゴンザーガはジュリオ・ロマーノに、市の端の島に遊興のための宮殿を建てるよう命じ、そこから生まれたのが#italicパラッツォ・テ#!である。これはルネサンス期で最も独創的な建築物の一つであり、古典の伝統を実に巧妙な機知をもって引用する作品であるため、学者たちはその皮肉の数々をめぐって今なお論じ続けている。巨人たちが崩れ落ちる壁画の間から、フェデリーコの厩舎の馬が等身大で生き生きと描かれた部屋まで、北イタリアで最も大胆な装飾計画である。この並外れた功績は我らの文化的伝統を深め、我らの庇護のもとで生み出される作品に独自の性格を与え、競合者たちのありきたりな仕事を凌いで、収集家や宮廷に求められるものとしている。"
 mod_palazzo_ducale: "公爵宮殿"
 mod_palazzo_ducale_desc: "我らは、自らの野心にふさわしい宮殿を築く。それは前世代の即興的な壮麗さではなく、恒久性と力の宣言として世に向き合う石と漆喰の記念碑である。あらゆる広間と回廊は、訪れる使節を感嘆させ、臣民の畏敬の念を強めるよう設計され、建築そのものを我が王朝の主張へと変える。この目に見える壮麗さへの投資は、威信となって、また我が首都に引き寄せられる芸術的な委嘱となって報われる。"
 par_the_opera_obsession: "歌劇への熱狂"
 par_the_opera_obsession_desc: "パルマは演劇的驚異の実験場へと変貌し、ついには最初の恒久的なプロセニアム劇場の建設に至る。額縁舞台を確立することで、パルマは観客と演劇の神聖な人工性との間に、文字通りかつ象徴的な境界を作り出すだろう。複雑な水力装置と巧妙な滑車機構を取り入れたシェーナへの我らの執着は、オペラを学究的実験から国家権力の至高の見世物へと高めるだろう。この建築上の飛躍は、我らを舞台美術家にとって世界的な磁場に変え、近代オペラハウスの技術的規範を確立することになる。"
 pcz_the_citadel: "ピアチェンツァの城塞"
 pcz_the_citadel_desc: "ポー川の渡河点に位置する我が都市は、北イタリアで最も争奪の的となる戦略的要衝の一つとなっており、我らはそれにふさわしい要塞への投資をもって応えてきた。我らが築く城塞は、単なる守備隊の避難所ではなく、周囲の都市が独自に講和交渉を行う間も籠城を維持できる自給自足の砦であり、いかなる攻撃者にも単一の城壁ではなく重層的な防御に向き合うことを強いる設計である。この #italic チッタデッラ #! により、ピアチェンツァは攻め落とすにも、我らに逆らって保持するにも高くつく都市となり、より大きな列強が我が都市を単一の遠征で吸収できるものとみなす意欲を削ぐ。"
 blg_the_bolognese_school_of_music: "ボローニャ楽派"
 blg_the_bolognese_school_of_music_desc: "ボローニャは協奏曲（コンチェルト）の発展と、オーケストラの専門職化の中心地となるだろう。過去の予測不可能な移旋の伝統を捨て去ることで、我々は近代的な長調・短調に基づく厳格な音楽的法則を確立する。この統合は、ヴァイオリンを民俗楽器からバロック時代を代表する主奏楽器へと変貌させ、トリオ・ソナタやコンチェルト・グロッソを標準化していく。この一見単純に見える様式はやがて名声の指標となり、イタリアの大聖堂から遠く離れたヨーロッパの宮廷へと広がっていく。それはまた、実験的なルネサンスから、規律ある器楽的技巧の時代への最終的な移行を象徴するものとなるだろう。"
 fer_ferrarese_silk: "フェラーラの絹"
 fer_ferrarese_silk_desc: "熟練の織職人たちはこの地の蚕を用い、長きにわたって卓越した品質の織物を生産してきた。そして我々は、この工芸をわが国の経済の確固たる柱のひとつへと発展させた。交易を規制し、熟練の職人たちを保護することで、生糸は競合他国へ安価に輸出されるのではなく、ここ国内で完成品へと加工されるようになっている。この織物交易の掌握は、わが国の商人ギルドの繁栄を支え、ここで生産されるあらゆる反物が、わが名声の威光をヨーロッパの市場へと運ぶことを保証している。"
 man_monteverdi_orfeo: "モンテヴェルディのオルフェオ"
 man_monteverdi_orfeo_desc: "クラウディオ・モンテヴェルディが我がパラッツォ・ドゥカーレにてアッカデミア・デッリ・インヴァギーティのために #italic オルフェオ #! を上演したとき、彼は世界に初めて完全な形のオペラを与えた。声、楽器、そして劇が融合し、聴衆が即座にそれまで聞いたいかなるものとも異なると認識する形式となった作品である。この変革が起きた都市はマントヴァであり、それを可能にした機関こそ我が宮廷であった。モンテヴェルディに歌手、演奏家、そして稽古と楽譜の完成に欠かせぬ持続的な庇護を提供したのである。オペラ誕生におけるこの先駆性により、我が宮廷はヨーロッパの最も強力な新しい芸術形式の、誰もが認める発祥地となり、その陰で育った芸術家たちは、以後渡り歩くあらゆる舞台へと我らの名声を運んでいく。"
 mod_diplomazia_balsamica: "バルサミコ外交"
 mod_diplomazia_balsamica_desc: "我々はバルサミコ酢を、従来の家庭用品という位置づけから、国家が保護する高級品へと転換する。わが国のエリート家系のみによって生産されるこの酢は、友好国や競合国の宮廷において、同盟の締結や交易上の便宜を獲得するための外交用の贈答品となるだろう。このささやかな贅沢品により、モデナの名はこれからも極上の品質と希少性の代名詞でありつづけるのだ。"
 par_prosciutto_e_parmigiano: "プロシュットとパルミジャーノ"
 par_prosciutto_e_parmigiano_desc: "わが都市周辺の低地で生産される熟成ハムと長期熟成チーズは、大陸全土で取引される高級品となり、ポー平原が提供しうる最高級の産物の象徴として、宮廷や豪商の商館に届けられている。我々はこれらの製品の生産を保護および制度化し、その卓越した品質を維持するべく基準を定めるとともに、輸出が顧客を喜ばせるだけでなく、国庫を豊かにする仕組みを築いている。この卓越した食文化への評判は、ささやかな農業の伝統を、商業的・外交的な威信の永続的な源泉へと変えるのである。"
 pcz_administrative_reform: "ピアチェンツァの行政改革"
 pcz_administrative_reform_desc: "ピアチェンツァの統治者たちは、縁故主義によって成り立ち、統治者一族の軍事的な冷酷さと行政的な知性という特異な組み合わせによって維持された国家を治めてきたが、存続していくうえでより重要だったのは、後者の資質であった。我々は財政および行政機関の体系的な改革に取り組み、制度的な手続きではなく個人の権力に長く依存してきた領土に、最も効率的なイタリア諸国の手法を導入する。この「リフォルマ・アンミニストラティーヴァ」（行政改革）は、私的な関係ではなく能力に基づいて最も有能な臣民を昇進させ、市民階級に国家の効率性への利害関係をもたせるものである。これにより、税収は搾取する者ではなく、生産する者にようやく報いるようになる。"
 blg_galvanism: "ガルヴァニズム"
 blg_galvanism_desc: "ボローニャ大学は、啓蒙時代の最先端に立ちつづけている。ボローニャの実験室における動物電気の発見は、近代の生体電気学および物理学の基礎を築いた。この探究心こそが、この都市を初期の産業・科学の先駆者たちの拠点へと変え、古代のスコラ学と近代の実験室とのあいだの隔たりを埋めることになるだろう。"
 fer_po_delta_reclamation: "ポー川デルタの干拓事業"
 fer_po_delta_reclamation_desc: "ポー川の湿地帯は、長らく我が玄関先に広がる、淀んだ水とマラリアの霧に覆われた荒れ地であった。排水と堤防整備の体系的な事業を組織することで、我らはこの湿地を豊かな農地へと変え、税収を増やすと同時に、国境地帯の住民に及ぶ疫病の負担を軽減する。土地を秩序立った、利益を生むものへと変貌させるこの営みは、まさに我らの統治の姿勢を目に見える形にしたものであり、国家そのものが大地の技師となることにほかならない。"
 man_po_agriculture: "ポー川流域の農業"
 man_po_agriculture_desc: "マントヴァを三方から囲む低地平野は、イタリア屈指の肥沃な土地であり、我らはその管理への体系的な投資を国内経済の基盤としてきた。沼沢地の排水、灌漑水路の拡張、そして我が地理を特徴づける湖沼の縁における新たな土地の干拓の規制がそれである。その結果、世代を重ねるごとに着実に増大する農業生産力が生まれ、政治の力だけでは正当化し得ないほどの人口を支える食糧の余剰を我が都市にもたらしている。この #italic ピアヌーラ・パダーナ #! (標準イタリア語で #italic ピアヌーラ・パダーナ #! 「ポー平原」)への辛抱強い営みは、困難な年にも臣民が十分に食べられることを保証し、我が財庫が豊かな田園の税を徴収することを保証している。"
 mod_accademia_militare: "アカデミア・ミリターレ"
 mod_accademia_militare_desc: "我らは士官の正式な訓練のための専門学院を設立し、軍の精鋭の教育を、陣営での行き当たりばったりの徒弟修業から、教場における体系的な教育へと移す。幾何学、築城術、戦術、そして指揮の術は学問として教えられ、単に伝統に従うだけでなく、問題を論理的に考え抜く士官を育成する。この機関はヨーロッパ屈指の名門となり、その卒業生は我が国境を遥かに超えた軍隊からも求められるようになるだろう。"
 par_enlightened_duchy: "啓蒙公国"
 par_enlightened_duchy_desc: "一世代の改革者たちは、政府の旧来の機構(その特権、その免除、その緩慢な慣習的手続き)が臣民の福祉を守るどころか、むしろその障害となっていると我が宮廷を説得した。我らは慣習を体系化された法律へと組織的に置き換え、租税、教育、そして公務の運営に理性を適用する。この合理的統治への献身は、我が国家をより効率的にし、我が法をより予測可能なものとし、臣民をして政府が自らの利益のために働いていると、より信じやすくさせる。"
 pcz_new_industry: "ピアチェンツァの新産業"
 pcz_new_industry_desc: "輸送路としてポー川、木材と水力資源の源である丘陵地帯、そして長年交易に慣れ親しんできた市民階級の存在。これらが組み合わさったピアチェンツァは、多くの大都市が欠いている初期の産業発展のための条件を備えていた。我々はこうした条件のもと、大半の街が成し遂げられる限界であった散在的な手工業生産から脱却し、製造業の持続的な拡大を実現すべく、工房、信用機関、および労働市場改革に投資する。この「ヌォーヴァ・インドゥストリア」（新産業）への取り組みは、農村から労働者を呼び寄せ、都市人口と、わが国の歳入源となる所得基盤を増大させるのだ。"
 #Ligurian Shared
 ligurian_coastal_seafarers: "リグリア沿岸の船乗り"
 ligurian_coastal_seafarers_desc: "リグーリア海岸沿いのあらゆる共同体――ヴェンティミーリアの漁港からラ・スペツィア上方の丘陵の村々に至るまで――は、幾世紀にもわたり小さな沿岸船で男たちを海へと送り出し、地中海でも屈指の過酷な海岸線の潮流、危険、天候を熟知するようになった。この実務的な航海術の伝統は、我が都市群のいずれかが外洋船を建造するよりもはるか以前から、並外れた質の船乗りを生み出しており、彼らが支えた沿岸交易は、内陸の道では到底及ばぬ効率で港と港の間に物資を運んだ。この航海の遺産は、我が商人たちに沿岸・地域交易における自然な優位を与え、我らが海に出すいかなるガレー艦隊も、すでに海を知り尽くした男たちによって乗り組まれることになる。"
 ligurian_merchant_diaspora: "リグリア商人の離散"
 ligurian_merchant_diaspora_desc: "我らが沿岸の商人たちは、大貿易都市が招き入れてくれるのを待ったりはしなかった。黒海沿岸のカッファやペラの入植地から、セビリアやリスボンの両替商の店に至るまで、手の届くあらゆる港に植民地、代理店、商会を築いていったのである。これらの #italic コロニエ #! は信頼と血縁の網によって運営され、おかげでリグリアの信用はアレクサンドリアでも本国と同じほど確かなものとなった。そしてその網を伝って流れる情報は、我らが商人に参入するあらゆる市場で優位をもたらした。このディアスポラは地理的制約を資産へと変え、我らが艦隊の規模だけでは到底及ばぬほど遠くまで商業的な手を伸ばすことを可能にする。"
 ligurian_spirit_of_navigation: "リグリアの航海精神"
 ligurian_spirit_of_navigation_desc: "リグリアの沿岸は、その規模に不釣り合いなほど多くの航海者を生み出してきた。西大西洋をカスティーリャの野心に開いたクリストーフォロ・コロンボ、イングランド王室のために新大陸北岸を測量したジョヴァンニ・カボート、そしてヨーロッパ船が到達したあらゆる海へとその技術を運んだ数多の水先案内人たちである。不完全な海図を手に水平線の彼方へ漕ぎ出す覚悟を持つ者を輩出してきたこの伝統は、リグリアの船乗りの技量に評判をもたらし、本来なら我らの小さな沿岸地方など見向きもしない宮廷からも投資と庇護を引き寄せている。この航海の文化は異国の権力者たちの間での我らの地位を高め、遠方の地から熟練の入植者や一攫千金を狙う者たちを我らの港へと誘う。"
 ligurian_artisan_craft: "リグリアの職人技"
 ligurian_artisan_craft_desc: "リグリア沿岸の工房は、装飾工芸の伝統を発展させてきた。都市の金細工師が手掛ける銀の #italic フィリグラン＝ア #!（標準イタリア語では #italic フィリグラーナ #!、すなわち線条細工）、アルビソーラの窯で焼かれるマヨリカ陶器、そして我らが織工が十四世紀に完成させた精緻なビロード織。これらは裕福な後援者たちが並の市場では得られぬ上質な品を求める先々で買い手を見出した。この職人文化は、日々の商いで取引される地味な品々を生み出すのと同じ工房で花開き、我らが職人に純粋な奢侈品専門の同業組合には真似のできない柔軟性を与えた。この装飾的卓越の伝統は、当代きっての技量を持つ職人たちを我らのもとに定住させ、彼らの作る品がどこで売られようと高値で取引されることを約せる。"
 ligurian_communal_councils: "コムーネ評議会の改革"
 ligurian_communal_councils_desc: "幾世紀にもわたりリグリアの港湾生活を治めてきた自治コムーネは、次第に制度化・合理化され、非成文の慣習に代わって成文憲章、選出された委員会、そして地方行政の業務を円滑にする標準化された行政手続きが導入された。これら改革された評議会は、貴族の庇護にも遠方の司法権威にも頼ることなく共同体の事務を管理するための整然とした場を商人階級に与え、リグリアのあらゆる町の制度に市民としての能力を根づかせた。我らが行政の伝統は、政府に異例なほど厚みのある訓練された市民人材を与え、我らの制度を、商業を支える町人たちの声に一層応えやすいものとする。"
 ligurian_enlightenment: "リグリアの啓蒙"
 ligurian_enlightenment_desc: "リグリアの哲学者や法学者たちは、ヨーロッパのどの学派にも引けを取らないほど深く啓蒙思想と向き合い、理性と自然法の原則は、国家の統治や法律の制定方法の抜本的な見直しを要求していると論じてきた。我々はこの伝統を拠り所として制度を内側から改革し、慣習や特権を成文化された手続きに置き換え、時代を代表する優れた行政の才を公職に登用する。こうした合理的な統治への取り組みにより、法律はより明確になり、改革の負担は抑えられ、国家の安定はより強固なものとなる。"
 #Ligurian Unique
 genoese_maritime_diplomacy: "ラ・スペルバ"
 genoese_maritime_diplomacy_desc: "我々は商業と信用という2本の柱の上に共和国を築き、中世初期以来、レバントから黒海に至るまでの交易拠点を資金面で支える、債務および交換の手段を開拓してきた。地中海全域に広がるわが国の植民地や商館は、商業拠点であると同時に外交拠点でもあり、純粋な軍事力だけでは到底及ばない影響力をわが国にもたらしている。この金融と国家統治の連携によって、わが国の銀行家と使節は一体となって機能し、借入金利を低く抑え、より多くの大使をわが国の配下にとどめている。"
 bank_of_saint_george: "サン・ジョルジョ銀行"
 bank_of_saint_george_desc: "共和国の累積する債務を整理するために設立された#italicカーザ・ディ・サン・ジョルジョ#!は、キリスト教世界でも屈指の洗練された金融機関となった。民間の債権者と国家がその運営を分かち合い、$GEN_ADJ$の富を借入費用を低く抑えながら海外の事業へと注ぎ込んでいる。公と民の資本が一体となれば、我らの野心を壮大な規模で賄うことができる。"
 genoese_flexibility: "新たな共和国"
 genoese_flexibility_desc: "十六世紀初頭の激動の時代、#italic アンドレア・ドーリア #! は我らが共和国を立て直し、旧来の貴族派閥を二十八の大家門、すなわち #italic アベルギ #! （標準イタリア語では #italic アルベルギ #! 、大家門の意）にまとめ上げ、我らが長らく得られなかった政治的安定をもたらした。その同じ実利主義の精神が我らが艦隊をも作り変え、単一の戦略的姿勢に縛られることなく、我らが海軍の専門技術を地中海全域での奉仕へと振り向けた。この刷新により、我らは海軍を低い費用で維持し、必要とあらば戦列ガレー船をより軽快な船へと転用することができる。"
 the_age_of_the_genoese: "ジェノヴァの時代"
 the_age_of_the_genoese_desc: "ピアチェンツァで開催される大規模な金融定期市は、何世代にもわたって$GEN_ADJ$の金融業者たちをスペイン王室にとって不可欠な債権者、そしてヨーロッパにおける資本の流れの権威者たらしめてきた。我々の手を経て流れる莫大な富は、わが国の商人貴族の宮殿や別荘へと流れ込み、彼らは地中海世界で最も広範な商業網を構築した。ヨーロッパ金融におけるこの覇権は、我々の通商網をどのライバルよりも効率的なものにしており、$GEN$を通じておこなわれる交易は、ヨーロッパのあらゆる主要な商業回路から引き出される利益で我々の国庫を満たしている。"
 genoese_school: "ジェノヴァの学校"
 genoese_school_desc: "何世紀にもわたる交易の繁栄は、$GEN$を収集家と庇護者の都市へと変え、この環境から、劇的な光の表現と豊かな質感の妙技で称賛される$GEN_ADJ$派という独自の絵画様式が誕生した。我らの共和国で育まれた芸術家たちは、$GEN_ADJ$の美意識と威信をヨーロッパ全域の宮廷や収蔵先へと広めてきた。この芸術文化の隆盛は、わが国の伝統をさらに深め、政治だけでは到底達成できないほどに、その影響力を拡大している。"
 gen_free_port: "ポルト・フランコ"
 gen_free_port_desc: "大西洋の大交易路が地中海から商いを奪い去っていく中、我らはこれに応えて我らが港を #italic ポルト・フランコ #!、すなわち全ての国の商人に開かれ、競合相手を苦しめる関税や制限を免れた自由港と宣言した。かつてリグリアを素通りしていた船は今や我らが埠頭に入港し、都市は再び異国の代理商、倉庫、貨幣で満ち溢れている。この来る者を拒まぬ開放性が、我らが港を西地中海でも屈指の繁忙な中継港へと変え、商いと人とを等しく引き寄せる。"
 #Lombard Shared
 milanese_tradition: "都市の特権"
 milanese_tradition_desc: "ロンバルディアの都市は、ロンバルディア同盟の時代以来、選出された執政官と独立した裁判所を通じて自治をおこなっており、いかなる皇帝も完全に解体し得なかった市民法の伝統を築き上げてきた。我々はこの遺産を活かし、これらの都市の特権を正式な権利として成文化することで、税金と兵力の両面での忠順な貢献と引き換えに、各都市にある程度の自治権を認めている。王室と都市のあいだのこの協定は、都市住民の帰属意識と参画意欲を維持し、臣民に協力を要請するたび生じる摩擦を軽減し、他国のように国が疲弊してしまうのを防いでいる。"
 patron_of_music: "$lombard$の銀行家"
 patron_of_music_desc: "$lombard$の商人や銀行家たちは、何世代にもわたってヨーロッパの諸都市に拠点を築き、ほかではこれほど信頼できる資金源を見出せない宮廷や交易商館に対し融資をおこなってきた。規制された為替所や期限付きの信用状を通じてこの評判の源を制度化することにより、我々は自らの金融網を、散在する民間事業の寄せ集めではなく、国家の意図を反映する手段とする。外国の国庫へのこの影響力は、軍事力だけでは決して得られなかったヨーロッパの宮廷における発言権をわが国に与える。"
 age_of_condottieri: "ナヴィリ"
 age_of_condottieri_desc: "$lombard$平原を縫うように流れる運河網は、当初は単なる灌漑設備にすぎなかったが、現在では地域経済全体の動脈へと発展し、ミラノとポー川を結んで、穀物、木材、加工品を、陸上輸送のわずか数分の一の費用で運んでいる。我々はこれらの水路の拡幅と浚渫に投資し、季節ごとの水位に左右されることなく、より大型の平底船が一年中移動できるよう新しい閘門を建設した。この水路網は都市への物資供給や軍隊の移動にかかる費用を削減し、そのためロンバルディアはイタリアでも特に効率的な統治がおこなわれる地域となっている。"
 merchant_princes: "ロンバルディアのキアロスクーロ"
 merchant_princes_desc: "ベルガモ近郊の小さな街で生まれたミケランジェロ・メリージは、光と影を描く手法を確立した。その表現は極めて直接的で力強く、ほかのあらゆる画派の作品が不自然に見えるほどであった。彼の追随者たちは、このキアロスクーロ（明暗法）という技法をわが国の都市からローマ、ナポリ、マドリードへと広め、庇護者たちは「ロンバルディア様式」を明示して作品を依頼するようになった。この名声はわが国の都市を収集家や学者たちの巡礼地へと変え、我々が育成した芸術家たちは行く先々で高い需要を集めている。"
 lombard_silk_masters: "絹の支配者"
 lombard_silk_masters_desc: "コモ湖と$lombard$平原の桑園や絹織物工房は、ヨーロッパ中の宮廷に最高品質の絹織物を供給しており、わが国の織物職人たちは、外国の競合が容易には真似できないほどに、生産工程を洗練させてきた。我々は生糸の輸出や熟練織工の技術を規制することでこの優位性を守り、付加価値の高い仕事が安価な原材料として流出することなく、確実に国境の内側にとどまるようにしている。こうして生産の全工程を掌握することにより、絹は単なる地元の交易から、ほかの商品価格が下落したときでも価値を維持する安定した収入源へと変わるのだ。"
 lombard_the_manifattura: "ラ・マニファットゥーラ"
 lombard_the_manifattura_desc: "ベルガモやコモの山麓では、イングランド式の紡績機と力織機が旧来の家内工房に取って代わりつつあり、アルプスの流れを動力源とする工場は、どの手織り職人にも太刀打ちできぬ速さと安さで織物を生産し始めている。我らはこの転換に投資し、企業城下町を建設し、外国人技師を招いて労働者を訓練することで、散在していた家族経営の織機を近代産業へと変えた。この製造業の基盤はロンバルディアをイタリアの生産の中心たらしめ、そこから生まれる富は我らが領土の隅々にまで行き渡る。"
 #Lombard Unique
 milanese_heritage: "イル・ビショーネ"
 milanese_heritage_desc: "ヴィスコンティ家のとぐろを巻く蛇は、北イタリアで最も見紛うことなき権力の象徴となり、我らが貨幣、印章、そして我らに従うあらゆる都市の門に刻まれている。#italicビッショーネ#!を公国の公式の紋章とすることで、我らは地域の忠誠を特定の貴族派閥ではなく我らが王朝に結びつける。この視覚的権威により、対抗者が我らの支配に異を唱えることは一段と困難になり、我らが大使の信任状に描かれた蛇の紋章は、他のイタリア諸侯には閉ざされたままの扉を開く。"
 renaissance_prince: "ファッブリカ・デル・ドゥオーモ"
 renaissance_prince_desc: "ヴェネランダ・ファッブリカ・デル・ドゥオーモ（大聖堂造営局）は何世代にもわたり、石工、技術者、建築の名匠たちを絶えず雇用してきた。同機関は大聖堂を終わりのある事業としてではなく、仕事が必要とされるかぎり職人を育成し技術を磨きつづける機関として扱ってきた。我々は同機関の権限と資金を拡大し、そこで守りつづけられる知識が我らの領土内のあらゆる建設現場へと確実に波及するようにした。この機関はミラノを実践的な建築の学校へと変え、そこで訓練された職人たちは北イタリア全域で求められている。"
 lowered_power_of_barons: "ミラノの鎧職人"
 lowered_power_of_barons_desc: "我らが工房で作られる胸甲は、ケルンやトレドの職人にも太刀打ちできぬ値をつけ、我らが武具工房はポルトガルからポーランドに至るまでの宮廷や隊長たちに供給している。我らは武具師組合を公爵の監督下で制度化し、我らが名声を守る基準を定め、技術の知と利益の双方を我らが城壁の内に留め置く。この上質な軍装品の独占は我らに安定した収入をもたらし、よそから甲冑を輸入せねばならぬ敵よりも我らが軍勢を常によく装備させておくことを可能にする。"
 encouragement_of_philosophers: "ボッロメーオの改革"
 encouragement_of_philosophers_desc: "カルロ・ボッロメーオによる$MLO$統治は、この時代の制度改革における最も精緻に研究された模範となった。地方の階層秩序の厳格な再編、役人のための標準化された訓練、そして我らが領内のあらゆる村にまで及ぶ定期的な巡察である。我らは彼の模範を余すところなく取り入れ、手持ちのあらゆる制度を用いて我らが領内全体に教育と規律を広める。この改革は、より識字率が高く、かつ国家の制度により強く結びついた民を育て、公の秩序を格段に保ちやすいものとする。"
 rulership_of_enlightened_principals: "ベッカリーアの専門書"
 rulership_of_enlightened_principals_desc: "我らが都市はチェーザレ・ベッカリーアを輩出し、彼の犯罪と刑罰に関する論考はヨーロッパで最も読まれる法律書となり、法は残虐さではなく確実性によって犯罪を抑止すべきだと論じた。この路線に沿って我らが刑法を改革し（拷問や恣意的な量刑を比例した刑罰と公開の裁判に置き換え）、都市の民が収奪的ではなく公正だと見なす法制度を築く。これにより我らが都市は治めやすくなり、紛争が賄賂ではなく法によって解決されると知る商人や投資家にとって、より魅力的な場所となる。"
 milanese_ambition: "スカラ座"
 milanese_ambition_desc: "我々はサンタ・マリア・アッラ・スカラ教会の跡地に劇場を築いた。2,000人を収容できるほどの大きさを誇り、その舞台機構はヨーロッパでは比肩する劇場がない。初公演の夜にはミラノと繋がりがある大使や豪商、そして貴族がこぞって集まり、初演作品は一つの季節のあいだに、ロンドンからサンクトペテルブルクに至るまで話題を集めた。スカラ座の存在によってミラノはヨーロッパ大陸における文化的権威となり、この劇場で成功を収めた芸術家たちが行く先々に我らが街の名を広めてくれる。"
 #Maltese Shared
 maltese_the_rahal_watch: "ラハルによる監視"
 maltese_the_rahal_watch_desc: "マルタの風景は、要塞化された教区教会を中心とする #italic ラハル #! （村）によって特徴づけられるようになった。ヨーロッパの封建荘園とは異なり、マルタの村は、庶民が自ら地域の安全を管理する緊密な血縁の網である。これは「見張りの国家」とでも呼ぶべき文化を育み、村人の誰もが水平線上の帆を見分けるよう訓練され、 #italic デイマ #! （地元民兵）の拠点へと退く術を身につけており、島々を分散型の自己修復可能な防衛網へと変えている。"
 maltese_the_korsa: "コルサ"
 maltese_the_korsa_desc: "地中海における海賊行為の高まりとともに、マルタの庶民もその争いに加わりつつある。私掠免許を与えることで、我らは海を利益と信仰の両方のための戦場と見なす「船乗り商人」という階層を生み出し、国家に利することができる。これにより我らは「南のヴァイキング」、すなわち乗り込み戦闘と沿岸襲撃の達人へと変貌するだろう。この海上での攻勢は、あらゆる隠れた入江を知り尽くした、私財で賄われた攻撃的な沿岸警備船団によって海岸線が守られることを保証する。"
 maltese_the_bajada: "バハダ"
 maltese_the_bajada_desc: "我々の文化には、「夜走り」あるいはバハダと呼ばれる特別な階級の者たちが存在する。彼らは地域を熟知しており、真っ暗闇のなかでも、この島の岩がちなカルスト地形や切り立った崖を進むことができる。軍事においてはこの上ない密使であり、敵の前線をすり抜けたり、封鎖中に港湾要塞のあいだを泳いで移動することもできる。この隠密行動の文化を制度化すれば、いかなる敵にも見つからない諜報員の軍団を築けるだろう。"
 maltese_the_modernized_dejma: "デジュマの近代化"
 maltese_the_modernized_dejma_desc: "新たな脅威の登場により、デジュマと呼ばれる非公式の村落警備体制を近代化する必要がある。16歳から60歳までのすべての男に特定の持ち場を割り当てる、国家的な民兵制度を作ることで、「農兵」の文化が生まれ、農業上の周期と軍事教練が密接に結びつくことになる。多くの国民が兵士として戦えるようになれば、農村地帯全体が職業軍人を支援する準備が整った予備軍となり、奇襲上陸により島々が占領されるのを防げる。"
 maltese_the_festa_ritualism: "フェスタの儀式主義"
 maltese_the_festa_ritualism_desc: "我らのアイデンティティの中心となっているのが、軍事組織を思わせる規律正しさで運営されるフェスタと宗教的な行列だ。大規模な行列と豪華な通りの装飾、そして皆で楽しむ宴を特徴とするこの手が込んだ祝祭は、マルタ社会の絆を深める重要な役割を果たしている。この公共の宗教行事と共有された儀式主義は階級の垣根を超え、熱烈な宗教的献身という共通のアイデンティティのもと、都市部の市民と田園部の農民を結束させている。マルタ人は自分たちの資源を地域の共同体の芸術的・宗教的な営みに注ぐことで、驚くべき水準の結束と社会的調和を育んでいる。外部の圧力に晒されているなかでも、マルタ諸島はこうして結束を維持し、活気あふれる文化を誇る社会でありつづけているのだ。"
 maltese_center_of_the_mediterranean: "地中海の中心"
 maltese_center_of_the_mediterranean_desc: "我らが島が地中海の中央に位置することから、我らが海洋文化は産業的な船舶修理と世界規模の兵站へと向かいつつある。我らが大いなる港は、地元の職人たちが石工と木工の古来の技術を蒸気と鉄の時代に適応させるにつれ、世界有数の海軍造船所となるだろう。この産業化された船乗りの技術は、島々を世界規模の石炭補給基地にして修理拠点へと変え、我らが艦隊が競合相手に対して常に技術的優位を保つことを保証する。"
 #Median Shared
 median_lo_statuto_del_comune: "コムーネのスタチュト"
 median_lo_statuto_del_comune_desc: "ヨーロッパの大半の国が慣習の成文化を検討する以前から、わが国の領地の都市は法典を作り、議会を成立させ、全市民と行政官の義務をスタチュトに記していた。アンコーナからヴィテルボに至るまで、この文書は世代ごとに見直され、議論され、刷新されてきた。そうして築かれたのが、封建領主も一時的な征服者も完全には消し去れない、市民間の議論という生きた伝統である。この成文法の伝統によってわが国の制度は強固なものとなり、市民も自らが統治に関与することから、街に対し強い責任感を抱くようになっている。"
 median_studio_generale: "ストゥディオ・ゲネラーレ"
 median_studio_generale_desc: "1308年に創設されたペルージャ大学は、教会の権威ではなく市民の権威のもとに自らを置き、以降我らが地域各地に続いた学校は、イタリアのコムーネの事業を前進させた法律家、公証人、行政官を育てた。我らが都市は、半島各地から学識ある人々を引き寄せる図書館、庇護、そして論争の文化を提供し、法学と哲学の修練を中部イタリアのあらゆる工芸と同じくらい自然な産物とした。学識ある統治は、より純粋に封建的な地域の同業者がめったに備えていない法と論弁の素養を、我らが役人に備えさせる。"
 median_bastioni_e_rocche: "砦とロッケ"
 median_bastioni_e_rocche_desc: "イタリア戦争は、中世の城壁が砲撃に一朝しか耐えられないことを証明した。我らが丘陵都市はこれに応え、尾根、突端、渓谷といった最大の天然の利点を、角度をつけた稜堡と小型の #italic ロッカ #! の防御体系へと変え、各都市を独自の戦術的難題とした。建築家と軍事技師は我らの防衛施設を石と版築で再建し、攻城砲を最も恐れさせる角度に砲台を配置した。地形に適応したこの築城の伝統により、我が領土はより攻め落としにくく、どの侵略者にとっても保持する代償がはるかに大きくなる。"
 median_baroque_sacred_patronage: "バロック様式への宗教的後援"
 median_baroque_sacred_patronage_desc: "当代の宗教的大変動により、視覚表現の重要性が高まった。その結果、諸都市では礼拝堂、祭壇画、そして宗教的なファサードが大幅に増え、その景観はさながら信仰の劇場の様相を呈した。奉仕団体や市民議会、裕福な後援者は可能なかぎりの財力を駆使し、極上の像やこの上なく躍動感にあふれた彫刻、そして人々の信仰心を高める珠玉の絵画を作らせようと競い合ったのだ。そしてこの宗教的後援の伝統が、わが国の芸術家たちの生活を支え、通りを信仰芸術で満たし、訪問者のひとりひとりに対し、我々の文化は自信に満ち、豊かに表現される宗教的な営みの中心にあるのだということを知らしめている。"
 median_jubilee_economy: "聖年に基づく経済"
 median_jubilee_economy_desc: "ローマが25年ごとに宣言する聖年には、巡礼者たちがラテンキリスト教世界の隅々からこの地域の街道へと押し寄せた。またその後のグランドツアーが第二波となり、裕福で好奇心旺盛な北方の民が訪れ、快適な旅路や案内人、同行者に惜しみなく金を支払った。宿や市場、工房は国外からの客への対応方法を習得し、彼らの落とす金が、わが国の経済のあらゆる層に流れ込んだ。巡礼者と好奇心旺盛な旅人を受け入れてきたこの伝統により、わが国の諸都市は、地元経済だけでは到底維持できないほどの繫栄を実現している。"
 median_enlightenment_civic_reform: "啓蒙主義的な行政改革"
 median_enlightenment_civic_reform_desc: "十八世紀の合理主義の潮流は、我らコムーネの伝統という既に耕された土壌を見出した。都市は久しく自治を論じ、決定を記録し、文書によって役人の責任を問うことに慣れていたからである。改革志向の統治者と学識ある学会は、より明快な法典、より整然とした都市計画、そして我らが治める町と農村全体でより予測可能な行政を推し進めた。この合理的統治の受容により、我らの機構はより効率的となり、臣民は国家を市民生活の障害ではなく、その協力者と見なす傾向を強める。"
 #Median Unique
 pap_head_of_the_church: "教会の長"
 pap_head_of_the_church_desc: "ローマ司教は、キリスト教世界において他に類を見ない地位を占める。単に最高位の高位聖職者であるだけでなく、#italic ヴィカリウス・クリスティ #!（キリストの代理者）であり、信仰に関するその宣言はすべてのカトリック君主と王国を、望むと望まざるとにかかわらず拘束する。我らはこの権威を、制度的な力によってのみならず、精神的な結びつきを通じて育み、単なる教会上の上位者としてではなく、すべての信徒の父として自らを示す。これにより、ライバルたちはローマ教皇座との公然たる対立を選ぶ前に躊躇することになる。この制度上の首長かつ精神的父という二重の地位は、ヨーロッパ全土に絶え間ない宗教的影響力を生み出し、カトリック臣民の忠誠に依存するいかなる君主にとっても、我らを敵に回すことを高くつく行為とする。"
 pea_fontana_maggiore: "フォンタナ・マッジョーレ"
 pea_fontana_maggiore_desc: "我らが最大の絵画を描く前、最も名高い傭兵隊長を養成する前に、我らは既にその野心を水と石で宣言していた。それが#italicフォンターナ・マッジョーレ#!である。ニコラとジョヴァンニのピサーノ父子によって彫られ、コムーネ全体が費用を負担した新たな水道から水を引き、ペルージャの中心に聳え立つこの噴水は、中部イタリアにこれほど富裕で、誇り高く、集団的野心を実現し得る都市は他にないことの証であった。この噴水はあらゆる聖人、あらゆる交易品、あらゆる古典的美徳をひとつの記念碑に集め、いかなる憲章も語り得ぬことを大理石によって語った。この市民的な意思表示は巡礼者と商人を我らの中心地へと引き寄せ、彼らが満たす街路への我らの掌握を強める。"
 spl_duchy_of_spoleto: "スポレート公国"
 spl_duchy_of_spoleto_desc: "我らは偉大なる #italic スポレート公国 #! の継承者である。かつてウンブリアからメッツォジョルノの縁にまで及んだランゴバルドの支配領域であり、他のコムーネがその尚武の起源を忘れ去る中、我らは丘上の塔ひとつひとつ、領主の居城ひとつひとつに駐屯の伝統を生かし続けた。その広大な領域支配の記憶は、我らの貴族が防衛をどう考えるか、我らの農民が義務をどう考えるかを形作り、高所と石の守りを中心に組織された社会契約を生み出している。分散型の築城と尚武の文化という遺産は、我が軍に規律を、我が領土には、交易のみで築かれたいかなる都市国家にも勝る永続的な強さを与える。"
 pap_the_word_of_the_lord: "主の御言葉"
 pap_the_word_of_the_lord_desc: "教皇庁が信仰と統治の事柄について語るとき、その声はいかなる世俗の君主も主張し得ない権威を帯びる。すなわち #italic ブッラ・パパリス #! （教皇勅書）を通じて表される神授の権能であり、この正式な宣言はヨーロッパのあらゆるカトリック宮廷に聖書の重みをもって届く。我らはこれを、皇帝権の寄進そのものにまで遡る法的伝統によって補強し、神の代理者としての威信のみならず、現世の事柄に介入し、戦争を是認し、いかなる王の権威をも超える法廷の前に権力者を召喚する文書化された権利をも我らに与える。精神的な声であり法的な裁定者でもあるこの地位ゆえに、我らがある大義を正当と認めれば、同盟者は純粋に世俗的な権力のもとでより速く集まり、敵対者はより長く躊躇することになる。"
 pea_scuola_del_perugino: "ペルジーノ派"
 pea_scuola_del_perugino_desc: "ピエトロ・ヴァンヌッチ、すなわち#italicペルジーノ#!は、我らが城壁の内にウンブリアで最も称賛された工房を築き、その弟子たちはウンブリア様式の優美さを、依頼が導くところどこへでもイタリア中に広めた。ラファエロはローマがこの偉大な画家を our ものとする前に、ここで彼の足元に学んだ。ラファエロの師を教えた都市という名声は、我が地方のいかなる競争相手も容易に無視できるものではない。この工房教育と徹底した徒弟制度の伝統により、我らの都市は画家、後援者、そして熟練の手が集う場所に必ず従う絶え間ない依頼の流れを引き寄せる磁石となる。"
 spl_lippi_frescoes: "リッピのフレスコ画"
 spl_lippi_frescoes_desc: "我らはフィリッポ・リッピを招き、大聖堂の後陣を描かせた。彼が我らに遺したのは #italic 聖母物語 #!、十五世紀の最も光輝に満ち優美なフレスコ連作のひとつであり、彼の死によってのみ未完に終わったが、その死の地もまたこのスポレートであり、彼が変貌させた教会に栄誉とともに葬られた。我が大聖堂にある彼の墓は、単なる後援関係を、イタリア全土の教養人と好奇心あふれる人々が訪れる恒久的な巡礼地へと変えた。この芸術的遺産は我らの知的名声を深め、その存在が我が都市全体の探究の質を研ぎ澄ます学識ある訪問者を引き寄せる。"
 glory_of_rome: "ローマの栄光"
 glory_of_rome_desc: "我らが時代の偉大な教皇たちは、#italicローマ#!を中世の廃墟の都市から、キリスト教世界で最も壮麗な宮廷へと変貌させ、芸術家、建築家、学者たちに委嘱して、いかなる王朝よりも長く残る美をヴァチカンに満たし、ヨーロッパの目を使徒座へと向けさせた。我らは意図的に古代帝国の骨格の上に建設し、我が精神的権威を古典文明の威信で包み、我が都市に入るあらゆる大使に、自らが仕えるいかなる王国よりも古い根を持つ権力を訪れているのだと理解させる。この恒久的な壮麗さへの投資は、我が威信が個々の教皇の死去とともに衰えぬことを意味する。なぜなら、我らが築いたものは、それを委嘱した人物が世を去った後も、長くそれ自体で語り続けるからである。"
 pea_the_griffin_companies: "グリフィン隊"
 pea_the_griffin_companies_desc: "我が都市の紋章は#italicグリフィン#!であり、これほど遠くまで運ばれた紋章は他にない。半島の隅々まで剣を売り（そして戦に勝った）バリオーニ家の傭兵隊長たちの旗印として掲げられたのだ。ペルージャはフィレンツェが画家を生むように兵士を生む。量においても質においても、幾世紀にもわたる党派間の市街戦と季節ごとの略奪によって磨かれた指揮の本能とともに。この尚武の伝統は、忠誠を鼓舞する士官と、経験の浅い者たちが崩れる場面でも冷静さを保つ兵士を生み出す。"
 spl_ponte_delle_torri: "ポンテ・デッレ・トッリ"
 spl_ponte_delle_torri_desc: "古の #italic ポンテ・デッレ・トッリ #! （ローマの水道橋であり、同時に要塞化された橋でもある）は、十本の巨大な橋脚でテッシーノ峡谷を跨ぎ、ウンブリアとマルケを結ぶアペニン山脈の主要な通路を我らの掌握下に置いている。山を越えようとする商人は我らの橋を渡らねばならず、我らはその特権の価値を、通行税、情報、そして服従という形で徴収することに躊躇したことはない。この構造物は我が領土を自然の要衝とし、交易を内へと引き寄せ、いかなる侵略の意図を持つ者にも、進軍の前にその渡河の代償を計算させる。"
 centralize_the_states: "教皇領の中央集権化"
 centralize_the_states_desc: "トレント公会議は教義を改革し、教会の制度的境界を鋭く定めたが、教皇領そのものは依然として都市、領主領、従属領の寄せ集めであり、その地方の諸侯は久しく我らの権威を交渉可能なものとして扱ってきた。我らは今、その隔たりを埋めるべく行動し、地方の諸侯が幾世代にもわたって密かに蓄えてきた歳入、任命権、法的管轄を回収し、改革された#italicクーリア#!が求めるやり方で、ローマからの直接統治の下に置く。我が領土にわたって王権が統合されることで、教皇庁は対抗宗教改革の野心が必要とする財政的・行政的基盤を得る。"
 pea_guerra_del_sale: "塩戦争"
 pea_guerra_del_sale_desc: "教皇が塩の専売を課したとき、我が民は手近にある武器を何であれ手に取った。それゆえ教皇側の嘲りは我らの蜂起を#italicグエッラ・デッレ・フォルケ#!（熊手の戦争）と名付けた。我らはその戦に敗れ、屈辱を味わった（バリオーニ家は追放され、ロッカ・パオリーナが彼らの宮殿の真上に、軽蔑を示す石の宣言として建てられた）。しかしその敗北は、誇りよりも長く続く何かへと凝り固まった。外部の権威に対するこの骨身に染みた不信は、ペルージャのあらゆる丘を天然の要塞とし、あらゆる侵略者に、我らから奪うものは、いかなる戦略的利益も正当化できぬほど保持の代償が高くつくことを理解させる。"
 spl_cardinals_bulwark: "枢機卿の要塞"
 spl_cardinals_bulwark_desc: "アルボルノス枢機卿は #italic ロッカ・アルボルノツィアーナ #! を、単なる身振りではなく宣言として築いた。それはあまりに難攻不落な要塞であり、ローマとペルージャの間にいるあらゆる小領主に、中央の権力が本気で戻ってきたこと、そしてスポレートが中部イタリアにおけるその最も堅固な道具として立っていることを悟らせた。我らはその構造物と、それが体現する制度的役割の両方を受け継ぎ、時代のあらゆる激動を通じて、我が都市をこの地方で最も秩序立ち規律ある行政中心地として維持してきた。この軍事的堅固さと市民秩序の組み合わせは、我が民を一つにまとめ、我が市民階級に市民としての義務をわきまえさせ、我が城壁を、統治の行き届かぬ領土を悩ます反乱と騒擾の嵐に対して強くする。"
 ecclesiastical_primacy: "教会への優越"
 ecclesiastical_primacy_desc: "ウェストファリアの講和は我らを諸侯の外交から締め出したが、各カトリック王国内で誰がカトリック教会を代弁するのかという問題は未解決のままであり、教会を王権の一部門にしようとする者たちによって、今や危険なまでの切迫感をもって問われている。我らはフランス、ドイツ、オーストリアの司教たちに対する首位権を、単なる形式としてではなく、生きた教義上の現実として主張し、#italicガリカニスム#!の主張を断罪し、国家への忠誠へと傾いた聖職者たちに、ローマに対して負うべき権威の責を問う。教皇が教義を定める排他的権利を改めて主張することは、揺らいでいた諸教会を聖座の正統の下へ連れ戻し、各国の統治者たちが自らへと振り向け始めていた十分の一税と教会収入の流れを回復させる。"
 pea_umbrian_academies: "ウンブリアの学術団体"
 pea_umbrian_academies_desc: "我が政治的独立が教皇領に吸収された後も長く、#italic アッカデミア・デル・ディゼーニョ #! と、教皇の庇護のもとで我らが維持してきた学会は、我が知的・芸術的文化を生かし続け、我らの国境をはるかに超えた諸機関を支える官吏、理論家、芸術家を養成した。半島のあらゆる大国は、ペルージャの教育が信頼できる人材を生むことを知っており、我が卒業生への絶え間ない需要は、我が影響力が衰える中でさえ、我が学会を繁栄させた。この実践的で学識ある文化の伝統は、我らが行使するあらゆる統治の手段を研ぎ澄まし、我が都市が、重要な評議の場において、その政治的重みを超えた存在感を発揮することを保証する。"
 spl_the_spoletine_silk: "スポレートの絹"
 spl_the_spoletine_silk_desc: "この谷の桑畑は何世紀にもわたり教皇領随一の織物職人たちに絹糸を供給し続け、生まれた #italic スポレート産絹織物 #! はローマの祭壇を飾り、遠くフランスやハプスブルク家の宮廷の衣装箱にまで届いた。我が商人たちはこの交易を土台に豊かな市民階級を築き上げ、子弟を教育するに十分な余剰と、歴代の教皇代官の交代を通じてギルド網を維持し続けるだけの政治的分別とを兼ね備えるに至った。この贅沢品の製造伝統は海外需要によって国庫を潤し、我らの平和の最も確かな礎である中産商人層を支えている。"
 pap_the_concordat: "コンコルダート体制"
 pap_the_concordat_desc: "革命と戦争という政治的激震により、我らの世俗的権力の多くは失われた。しかし国家が宗教的正統性を必要とするという根本的事情は少しも薄れておらず、まさにこの必要性を我らは #italic 政教協約 #! と呼ばれる正式な条約の中で己が利に転じている。我らは各主権国家と個別に交渉し、行政面での一定の独立性と引き換えに、教会の権利の法的拘束力ある承認、神学校の安全、そしてカトリック聖職者の国内における正式な地位を獲得する。この二国間協定の体系は、あらゆるカトリック国家を潜在的な敵対者から条約で結ばれた盟友へと変える。これはいかなる軍隊も成し得なかった外交的影響力を我らにもたらすのである。"
 pea_the_old_university: "長い歴史を持つ大学"
 pea_the_old_university_desc: "革命がイタリア全土を席巻したとき、我らの古き大学は中世的特権に閉じこもるのではなく、新たな政治を担う商人や職人の子弟たちに門戸を開くことで応えた。#italicペルージャ大学#!の教授陣はウンブリアにおけるリソルジメントを可能にした法律家や檄文作者を輩出し、一つの学府を市民変革の原動力へと変貌させた。学問を組織力へと転じるこの才を持つ限り、我が政府が望むいかなる改革も、それを実行できる学識ある人材を欠くことはないであろう。"
 spl_vale_of_spoleto: "スポレートの谷"
 spl_vale_of_spoleto_desc: "我らの丘陵に抱かれたこの広大な農業渓谷は、古来より我が繁栄の物質的基盤であった。革命の時代を通じて我らはこれを改良してきた――排水路の整備、計画的な輪作、そして辺境地を生産的な保有地へと再分配することで、備えの乏しい国家を蝕む経済的衝撃にも耐えうる労働人口を支えてきたのである。#italicスポレート渓谷#!は今や我が都市を養い、市場に余剰を供給し、いかなる本格的な産業的野心にも礎として不可欠な農業資本を生み出している。この受け継がれた肥沃さは、丹念に手入れされ合理的に改良されることで、より脆弱な投資に資源を費やした隣国を苦しめる混乱に対する緩衝材へと、季節ごとに姿を変えるのである。"
 #Neapolitan Shared
 mercantile_spirit: "重商主義的精神"
 mercantile_spirit_desc: "有力な海洋国家であるアマルフィ共和国の影響を受けたナポリ王国は、活気あふれる交易を営んでいた。ナポリそのものを含む戦略的な港が重要な拠点となって王国と遠方の国々を結びつけ、商業交流や商品・思想の盛んな交換を通じて経済的繁栄を育んだ。"
 consolidate_the_royal_domain: "王家の領地"
 consolidate_the_royal_domain_desc: "我々は豊かな土地を受け継いだが、古風な法律や慣習によって繁栄が妨げられてしまっている。これまでの統治者たちは、王国の貴族の生まれと富を一致させることを保証してきた。だが、いまこそ我々が規制を改める時だ。男爵家の宮廷を強化し、王国内の領地を統合することで、より明確な法的階級構造を作り上げるのだ。王家と市民の土地では、権力の中心としての都市を強化し、交易と職人の成長を奨励しよう。"
 crush_the_barons: "男爵の権力打破"
 crush_the_barons_desc: "ナポリの地方では、いまだに現地の男爵たちが大きな権力を握っている。王国の中央集権化を進めるには、この男爵達の権力を打ち砕かなければならない。さもなくば、彼らはやがて我々に陰謀を企てるようになるだろう。"
 city_of_artists: "芸術家の都市"
 city_of_artists_desc: "世界で最も偉大な芸術家たちの後援によって、誰もがわが都市の栄光を目の当たりにすることになる。我々の画家、詩人、歌手、役者の偉大さに、誰もが驚嘆するだろう。ナポリ文化を、他の芸術の中心地を測る基準たらしめよう。"
 a_central_power: "地中海の中心的な力"
 a_central_power_desc: "地中海の中心というわが国の立地は、すべての海岸へと容易に赴くことができる利点をもたらしている。我々は、同盟関係を模索し、新たな友好関係を築き、国境を拡大していくことで、この資産を最大限活用すべきだ。海を玄関口として、より大きな影響力と安全確保を追い求めていく先に、成長と繁栄の機会が待っているのだ。"
 neapolitan_army_reforms: "ナポリ軍の改革"
 neapolitan_army_reforms_desc: "我が国は大規模な軍制改革を断行し、変化する戦場の課題に対応すべく軍を近代化する必要がある。この改革は戦術を鋭敏にし、指揮系統を簡素化し、訓練を向上させ、我らを地域における恐るべき軍事大国へと変えるであろう。"
 #Neapolitan Unique
 university_naples: "ナポリ大学"
 university_naples_desc: "1224年に皇帝フリードリヒ2世によって設立されたナポリ大学は、イタリア最古の公的機関のひとつだ。非宗教的な精神をもとに、何世代もの学生に総合的な教育をおこない、さまざまな分野の知的発展に貢献してきた。"
 academia_pontaniana: "アカデミア・ポンタニアーナ"
 academia_pontaniana_desc: "ナポリは長いこと、当代の優れた頭脳の持ち主たちを惹きつけ、ルネサンスの光を広めることで、近代的な学問の中心地となるべく尽力してきた。ジョヴァンニ・ポンターニの指揮のもと、このような学問的な集まりは構造化され組織化されてきた。このアカデミーに、その熱心な指導者にちなんだ名を与えることは当然のことだろう。"
 encouraged_city_living: "都市生活の奨励"
 encouraged_city_living_desc: "我々は、先人たちから美しい都市を受け継いできた。この地中海の大都市が成長と繁栄を続けられるよう、美化と改善を絶やしてはならない。もはや、港や建物の修理・維持で満足しているだけでは不十分である。水路を建設し、湿地の水を排水し、街道を舗装することで、より多くの人々が生活できるようにするのだ。"
 expanded_arsenale: "海軍工廠の拡大"
 expanded_arsenale_desc: "何世紀にもわたり、$NAP$の造船所（アルセナーレ）は我が造船業の中心であり、主たる海軍施設であり続けてきた。しかし地中海の敵対艦隊に対抗する実効力を保つには、これを拡張し近代化する必要がある。我が港の商業力と軍事力をともに拡大し、より大規模で強力な艦隊を維持するため、より大いなるアルセナーレを築こうではないか。"
 institutional_reorganization: "行政機関の再編"
 institutional_reorganization_desc: "付属評議会を廃止し、レアルカメラ・ディ・サンタ・キアラを設立することにより、ナポリ王国の重要な法改革を実施する。現在進行中の計画は、総合立法機関の再編、コディチェ・カロリーノへの法律の統合、税制改革のためのオンチャリオ・カダストレの実施を目指している。"
 neapolitan_industrialization: "ナポリの産業化"
 neapolitan_industrialization_desc: "18世紀以降、ナポリ王国では徐々に産業化が進んできた。織物、造船、鉄工などの重要部門は、投資と技術の進歩に後押しされて発展を遂げた。この産業化への推移は、ナポリを経済の中心地へと変貌させる重要な役割を果たすことになるだろう。"
 #Piedmontese Shared
 piedmontese_the_ricet: "リチェット"
 piedmontese_the_ricet_desc: "ピエモンテの農村と特に結びついた村々は、伝統的に #italic リチェット #! （標準イタリア語の呼称、ピエモンテ語ではリチェート）を発展させてきた。これは町の中に設けられた防御拠点で、共同体の穀物や葡萄酒を貯蔵し、襲撃の際には避難所ともなる施設である。これは領主の城ではなく、村人たち自身が管理する共同体の資産である。かくして農民たちはこの地方の諸国家間で頻発した戦争を生き延び、侵略下にあってすら国家の農場や工房は無傷のまま残されてきたのである。"
 piedmontese_le_fere_del_piemont: "ラ・フェレ・デル・ピエモンテ"
 piedmontese_le_fere_del_piemont_desc: "ピエモンテの諸都市は、地域全体で大規模な見本市を制度化している。国際的な商人に対し国家による保護と免税特権を与えることで、アルプスの交易路は富の通り道に変わる。そして、その富は我々のもとにも流れ込み、独立諸侯の忠誠を買うための資金となる。"
 piedmontese_the_piassafort: "ピアッサフォルト"
 piedmontese_the_piassafort_desc: "イタリアへの玄関口という自らの立場を踏まえ、我々は諸都市をピアッサフォルト、すなわち要塞都市へと変える取り組みに着手する。これにはつねに脅威に晒されていることを前提とする意識改革が必要で、都市計画は砲兵や守備隊の要求によって決定されることになる。工学的に優れた設計にすることで、ピエモンテはイタリア有数の難攻不落さを誇る土地となり、国外の勢力は侵略よりも交渉を選ばざるを得なくなる。"
 piedmontese_the_nebbiolo_vigne: "ネッビオーロのブドウ畑"
 piedmontese_the_nebbiolo_vigne_desc: "古来より栽培されてきたとはいえ、我らは我が地方の葡萄園に科学的な栽培手法を導入する。葡萄園の近代化と標準化を支援し、高級葡萄酒（ネッビオーロ）の生産を規制することで、国家は国庫を潤す贅沢な輸出品を確保する。これらの施策は、穀物市場の変動に左右されない安定した収入を国庫にもたらすであろう。"
 piedmontese_the_canal: "運河"
 piedmontese_the_canal_desc: "わが国の政府はポー川、ドーラ川、セージア川という主要河川の氾濫抑制を目指す大事業に取り組む。石造の運河と水門からなる複雑な水系を築くことで、しばしば洪水に襲われる平野や豊かな湿地帯を、南ヨーロッパ有数の米と穀物の生産地帯に変えられる。そうなれば、この地域で食料面の余裕を安定的かつ大量に確保できるようになり、人口増加や、穀物の輸入状況に影響されない常備軍の維持を実現できる。"
 piedmontese_the_setajoj: "セタジョイ"
 piedmontese_the_setajoj_desc: "ピエモンテは高度な水力機械を活用する大規模な製糸工場（フィラトイ）を特徴として、ヨーロッパの絹業の中心地となるであろう。これにより我が町々には初期産業文化が芽生え、新たな技術職人・商人階級が台頭するであろう。これらの投資は、近代的な道路や運河、そして軍備の改善に必要な資本を地方にもたらし、ピエモンテ経済を広く世界と直接結びつけるであろう。"
 #Piedmontese Unique
 mfa_the_paleologue_dynasty: "パレオロゴス王朝"
 mfa_the_paleologue_dynasty_desc: "パレオロゴスの血統の歴史は古く、そのことが我々の侯爵領に威光と正統性を与え、ヨーロッパ屈指の強大な国々から敬意を向けられる理由にもなっている。ほとんどの小国は儀礼と外交の世界に加われず、自分たちとは縁遠いものとして憧れることしかできないが、パレオロゴスの血統のおかげでわが国はそういった世界との繋がりを有している。我々はこの血統を活用して軍事力だけでは決して開けられない扉を開け、箔付けのためだけでなく、実際に国を守るためにも役立てている。"
 pie_ordinanza_piedmontese: "ピエモンテ法令"
 pie_ordinanza_piedmontese_desc: "何世代にもわたり、山岳地帯を治めるわが国の領主たちは慣習と季節に従って徴兵をおこなってきた。収穫期が終われば男たちを軍隊に召集し、初雪が降る前には家に帰らせるという具合である。我々はこの場当たり的な伝統を廃止し、代わりに歩兵の規模、装備、そして訓練基準を定める正式な法令を発し、さらに諸都市と地方領主たちにいつでも動員できる一貫した軍役を課した。このピエモンテ法令（標準イタリア語では#italic Ordinanza Piemontese#!、ピエモンテ語では#italic Ordinansa Piemontèisa#!）により、わが国の軍は遠征の合間も結束を保てる常備軍を中核に持ち、質の悪い徴収兵では決して維持できない規律と軍事的伝統を発展させられる。"
 mfa_casale_monferrato: "カサーレ・モンフェッラート"
 mfa_casale_monferrato_desc: "わが国の中心はカサーレ・モンフェッラートである。この都市は我々の統治の庇護のもと、商業と工芸によって発展している。カサーレ・モンフェッラートは列強を結ぶ道の途中に位置しているため、自然と人が集まる交易地点になり、その商人とギルドが通りには賑わいを、国庫には潤いをもたらしている。この都市はわが国の最も価値ある所有物であり、適切な統治の成果を示す好例である。"
 pie_cavalleria_piemontese: "ピエモンテの騎兵"
 pie_cavalleria_piemontese_desc: "我が領土に開けるポー平原は、古くから下級貴族の騎馬武者たちを支えてきた。彼らの富は馬の質と槍働きの評判にかかっていた。我らはこの散在する騎士たちを正式な騎兵隊として組織し、その装備を標準化し、旧時代に通用した個別突撃ではなく、連携した機動のための訓練を施した。この #italic ピエモンテ騎兵隊 #! は我が軍の側面を防護し、敗走する敵を追撃し、近代戦場が求める散開隊形での戦闘を可能にし、我が軍を歩兵の歩みから解き放つのである。"
 mfa_the_court_culture: "宮廷文化"
 mfa_the_court_culture_desc: "後援と洗練された感性に惹かれ、わが国の宮廷には芸術者や学者、そして音楽家が集まっている。我々は名声獲得の手段として宮廷芸術を重要視しており、宮廷の庇護のもと制作された作品は、どこに持ち込まれたとしてもわが国の名声を高める。こうして文化への投資にかけた金は、それに見合うだけの名声となって返ってくるのだ。"
 pie_via_delle_gallie: "ガリア人の街道"
 pie_via_delle_gallie_desc: "アルプスの峠からポー平原へと下るこの古道は、かつてローマ軍団を運んだ道であり、イタリアと北方を結ぶ最短経路たるピエモンテの回廊を通る商人、使節、軍勢を今なお絶え間なく運び続けている。我らはこれらの道の維持と警備に投資し、確実な収入をもたらす駅と関所を設け、我が領内を通過する物資が他のいかなる競合路よりも速く移動できるようにしている。この #italic ヴィア・ドゥレ・ガリエ #! （標準イタリア語では #italic ヴィア・デッレ・ガッリエ #! 、「ガリア人の道」の意）の支配は、我らをヨーロッパ商業の鎖に欠かせぬ結節点とし、我が市場を拡大し、我らが管理する街道に依存する宮廷への自然な外交の窓口を使節にもたらすのである。"
 mfa_the_casale_citadel: "カサーレ要塞"
 mfa_the_casale_citadel_desc: "我々はカサーレ・モンフェッラートを改良し、半島有数の強固な城壁と稜堡を持つ城塞都市に変えた。深い堀と角度を付けた壁は、包囲する者を消耗させ、一気に攻め落とそうとする者には例外なく多大な犠牲を強いる設計になっている。わが国の権力の中枢であるカサーレ・モンフェッラートは、この要塞化により、攻めるにはあまりにも代償が大きく、無視するには重要すぎるという、当代有数の軍事拠点となった。"
 pie_citadel_system: "城塞制度"
 pie_citadel_system_desc: "最新のイタリア築城論に学んだ一世代の技師たちが我が領内のあらゆる主要都市を測量し、旧来の城壁を角度をつけ、低く広い、砲を据えるに十分な――敵にいかなる接近路も許さぬ――近代的稜堡の網へと作り変える作業に着手した。我らはこれらの要塞を道路と信号で結び、ある谷で脅かされた守備隊が隣の谷からの援軍を期待できるようにしている。この #italic システム・デッレ・チッタデッレ #! はピエモンテを、一挙に制圧されることはなく要塞ひとつひとつを陥とさねば屈しない国へと変える。この見通しは、いかに決意の固い侵略者であろうと、我が国境を越える前に躊躇させるであろう。"
 mfa_the_marquisate_resilience: "侯爵領のしたたかさ"
 mfa_the_marquisate_resilience_desc: "我々は柔軟な対応力と慎重に築いた友好関係という長所を活かし、ひとつの同盟に依存することなく、格上の諸大国の板挟みの状況を生き抜いてきた。我々は合理的で誠実な国であるという名声を維持することで、単に併合してしまうこともできる大国にとって、そのままでいたほうが有用な存在となっている。このしたたかな外交こそ、わが国の最も古く、そして最も信頼できる戦略なのである。"
 pie_enlightened_court: "啓蒙の宮廷"
 pie_enlightened_court_desc: "宮廷を中心とした集団に加わった改革派世代の者たちは、政府が目指すべきは単なる現状維持ではなく、よりよい仕組みを見出し、古い制度を計画的に新しいものへと変えていくことだと説いた。説得を受けた我々はいま、現代的な学術組織や実験的団体で学んだ者たちを政府に受け入れ、農産物の生産量から司法手続きまで、あらゆる分野の調査を依頼し、外交と財政の両方に精通した行政官を養成する教育に資金援助をおこなっている。この「啓蒙の宮廷」（標準イタリア語では#italic Corte Illuminata#!、ピエモンテ語では#italic Còrt Ëluminà#!）により、わが国の国家機関は習慣に縛られて停滞するのではなく、継続的に改善されるようになり、政府の迅速化、研究の生産性向上、そして臣民の識字率向上に寄与している。"
 mfa_the_monferrato_agricoltura: "モンフェッラートの農業"
 mfa_the_monferrato_agricoltura_desc: "我々の侯爵領に広がるなだらかな丘陵地帯と肥沃な渓谷地帯は、わが国の民を養えるだけの食料を生産し、さらには増加する農民や農村の職人たちも支えている。また、我々は土地の慎重な管理と投資により、かつては未利用地だった斜面に農地を広げ、階段耕作地を築いてきた。この農業の変革は、農村には新たな入植者を、国家には新たな収入をもたらしている。"
 pie_industrial_base: "産業基盤"
 pie_industrial_base_desc: "わが国には山岳地帯の河川がもたらす水力、諸都市に増えつつある熟練の職人、そしてアルプス山麓の丘で採れる原材料が揃っている。これは初期の産業変革を実現するうえで、イタリアにあるほかのどの地域も及ばない絶好の条件だ。そこで我々は、こういった生産基盤を場当たり的ではなく計画的に拡大できるようにするべく、水力を利用した製粉所、工房の標準化、金融機関に投資をおこなう。この産業基盤により、これまで課税対象として把握できていなかった活動から税収を得られるようになり、さらに農村の労働者が都市へ引き寄せられることで、わが国の課税可能な富と都市人口の両方が同時に増大するのだ。"
 #Rhaetian Shared
 rhaetian_the_vicinanza: "ヴィチナンツァ"
 rhaetian_the_vicinanza_desc: "ラエティア・アルプスとドロミテ・アルプスの環境は厳しく、必要に迫られて「ヴィチナンツァ」が発展した。これは渓谷の住人たちが森や高地の牧草地帯を共同所有する制度で、この「山岳民主主義」によって封建制度の領主による山々の必須資源の独占が防がれているほか、強烈な地域主義が醸成されている。レト・ロマンス語群を使う各渓谷がより強大な国々の一部でありながらも自治権を持っているのは、この地域主義の影響である。"
 rhaetian_the_tobia: "トビア"
 rhaetian_the_tobia_desc: "レト・ロマンス人は古くから #italic トビア #! と呼ばれる専用の木造納屋を用いてきた。これは高地の気候において長期保存を可能にするよう設計された建物である。これらの建造物にはしばしば防御的な工夫が施され、共同体の食糧供給を守っている。この自給自足の文化は、長い冬の封鎖の間も我が民の生存を保証する。住民は高地の谷へと退き、貯蔵した蓄えで生き延びることができるのである。"
 rhaetian_the_mountain_warriors: "山岳地帯の戦士たち"
 rhaetian_the_mountain_warriors_desc: "レト・ロマンス語群を話す戦士たちは、我々の指導のもと、不整地におけるハルバードとパイクの扱いの巧みさで世界的に知られるようになるだろう。狭い峡谷での奇襲を得意とする彼らは、渓谷を死地に変えることができる。優れた軍事的文化を持つレト・ロマンス語群の傭兵たちは引く手あまたであり、彼らは各地で活躍したのち、故郷の山岳地帯に富と、現代的な戦術に関する知識を持ち帰っている。"
 rhaetian_the_chanzun: "チャンズン"
 rhaetian_the_chanzun_desc: "レト・ロマンス語群の人々のあいだで、チャンズンと呼ばれる壮大な歌と口承詩を活用し、独特の言語と歴史を保存していく必要性がかつてないほど高まっている。この状況が「言語的抵抗」という文化を生み出した。これは彼らのラテン語系言語を使うことで、ドイツでもイタリアでもない独自性を育むという運動だ。その文化に対する誇りは、外部からの行政改革に対し結束して反対しつづける原動力になっている。"
 rhaetian_the_alpine_diplomacy: "アルプスの外交術"
 rhaetian_the_alpine_diplomacy_desc: "わが国はアルプス越えに使われる、戦略上重要な山道を支配している。そのせいで山道の支配権を狙う他国から不要な関心を引き寄せがちだが、この混沌とした状況のなかから、「レト・ロマンス語群の外交官」という特別な階級が誕生するかもしれない。我々の支援のもと、彼らには複数言語を操る交渉人として、列強同士を対立させてこの地域の自治を守るための能力を身に付けてもらう。重大な局面でも通用する外交術があれば、他国の軍隊に渓谷を占領されたとしても、綿密に作られた条約を通じて共同体の法的・社会的主権を維持することができるだろう。"
 rhaetian_the_national_revival: "国家的な復興事業"
 rhaetian_the_national_revival_desc: "わが国の知識人たちが、あまりにも長いあいだほかのラテン系言語より“劣っている”とみなされてきた我々の言語を、公式な形で復興させる取り組みに着手した。我々の指導のもと、学者たちはさまざまな方言を体系化して書き言葉の基準を作り、国の歴史も出版する。これが我々の言語の確固たる基盤となり、レト・ロマンス語群の人々は対等で尊重される民族として現代国家の仲間入りを果たせるだろう。"
 #Rhaetian Unique
 aqu_patriarchate_of_aquileia: "アクイレイア総主教座"
 aqu_patriarchate_of_aquileia_desc: "かつてローマ帝国第四の都市だったアクイレイアにはその後、イタリアの北東全域とアルプス東部を管轄とする総主教座が置かれた。この教会の権威の伝統は、それを作り出した政治権力が消えてから長い時間が経っても我々の制度に残っていた。我々はこの遺産を活かし、ラテン西方世界と東方のスラヴ世界とゲルマン世界を結ぶ中心地として、この都市がかつて果たしていた役割を反映した教育機関を構築した。この「文化と書物の交差点」というアクイレイア総主教座の伝統は、類まれな水準の読み書きの能力と、儀礼が多様化したキリスト教徒を数世紀にわたって単一の教会組織として取りまとめてきた寛容さを、わが国にもたらしている。"
 aqu_amber_road: "琥珀街道"
 aqu_amber_road_desc: "ローマの軍団が正式な交易路とする以前から、北海地域のバルト諸国産琥珀を南のアドリア海に運ぶ経路はわが国の領土を通っており、アクイレイアは古代世界における重要な中継地点のひとつとなっていた。またこの経路がきっかけで確立した商習慣は、のちに当の道を舗装したローマ帝国よりも長く残った。我々はこの通廊を復興、強化し、アクレイアとアルプスの山道、そしてその向こうに広がる通商網をつなぐ街道と中継地点を改善することで、わが国の商人はあらゆる競合経路よりも効率よく北方の市場にたどり着けるようになった。琥珀街道を支配下に置いていることで、わが国の外交的影響力は大幅に増大し、アドリア海と中央ヨーロッパ間を往来する交易においては、我々の商業路が好まれるようになっている。"
 aqu_alpine_defense: "アルプスの防衛手段"
 aqu_alpine_defense_desc: "わが国の領土はジュリア・アルプスとカルスト台地の接点に位置している。この位置は、活用方法を知っている者にとっては天然の要塞だが、そうでない場合は致命的な弱点となる。我々は接近経路となる重要な山道と渓谷の要塞化に注力しつつ、守備隊には開けた場所での戦いではなく、局所防衛に特化した訓練を積ませ、さらには警告なく接近されることのないよう信号所網を整備している。この「ディフェーザ・アルピーナ」という制度により、わが国の領土は地域でも有数の難攻不落さを誇っており、険しい地形を味方に変え、敵勢力がわが軍と交戦する前に損害を与えることができる。"
 aqu_friulian_soldiery: "フリウリの兵士たち"
 aqu_friulian_soldiery_desc: "フリウリの農村は常に辺境であり続け、その農地や市場町で育った男たちは若い頃から兵士の習性を身に着けている。武器を扱うことに慣れ、地元の地形を知り尽くし、敵対勢力が幾度も越えてきた国境において自衛できぬ者の末路を幻想抜きに知っている。我らはこの尚武の伝統を、#italicフリウリ民兵#!を職業的な基盤の上に組織し、装備させ、訓練することで制度化し、これら経験豊かな男たちに、個々の頑健さを頼れる軍事力へと変える規律と統率を与える。我が軍はこうして、己の郷土のために戦い、傭兵にはめったに見られぬ粘り強さで陣地を守り抜く、堅実な歩兵の中核を得るのである。"
 aqu_patriarchal_legacy: "総主教の遺産"
 aqu_patriarchal_legacy_desc: "何世紀にもわたり、アクイレイアの総大司教はアドリア海沿岸からアルプスの峠に至る領域を統治し、教会法、民事紛争、世俗権力との外交関係を同時に処理してきた。その行政経験は、総大司教の世俗権力がヴェネツィアに吸収されて後も長く我が制度の中に蓄積され続けた。我らはこの遺産を活かして自らの統治機構を合理化し改善し、かつてはるかに広大で複雑な領域を治めた機関の手続き的知識を、現在のより扱いやすい規模の国家に応用している。この行政的洗練の#italic総大司教の遺産#!は我が内閣をより有能にし、我が立法をより一貫したものとし、我が領土の控えめな規模に似つかわしくない統治の強さを我らに与えるのである。"
 aqu_enlightened_patriarchate: "啓蒙の総主教座"
 aqu_enlightened_patriarchate_desc: "アクイレイアには、西方世界と東方世界、ローマ世界とスラヴ世界、ラテン世界とゲルマン世界が交わる場所としての記憶がある。この記憶があるからこそ、わが国の諸機関は外部からの意見を率直に受け入れており、これはより均質な国家では得がたい姿勢だ。我々は啓蒙主義が生んだ学者や行政官を統治機関に積極的に受け入れ、この伝統をさらに発展させており、その結果かつて総主教座が教会法におこなったのと同じ、理性と証拠の原則に基づいた法改革が実現した。この「啓蒙の総主教座」の精神のおかげで、我々は意見がきちんと受け止められ、統治機関が本気で改善に取り組んでいる国という評判を得ている。そしてその評判を聞いた学者や有能な行政官がこの地に集まり、彼らの存在によってわが国が推し進めるあらゆる改革が加速している。"
 #Romagnol Shared
 romagnol_al_teri_dlesarchet: "アル・テーリ・ドル・エザルケート"
 romagnol_al_teri_dlesarchet_desc: "ロマーニャには、ビザンツ帝国のラヴェンナ総督府から受け継がれた独特な法制度が残っている。ロンバルディアの影響を受けた北部と異なり、ロマーニャの文化には東ローマ帝国の行政法が深く根付いている。そのためこの地域では独特な文化が育まれており、どれほど小さな町であってもかの古代帝国時代の特権を有している。ロマーニャのあらゆる渓谷がローマ時代の免責特権や現地法が絡み合った“網”に守られており、こういった行政上の複雑さゆえに、この地域は効率的に中央集権化したい諸大国にとって悪夢のような場所となっている。"
 romagnol_mura_malatestiani: "ムラ・マラテスティアーニ"
 romagnol_mura_malatestiani_desc: "教皇領とヴェネツィアに挟まれた位置にあるロマーニャの町は、防衛設備の実験の場となってきた。この地域はロカ（標準イタリア語では#italic Rocca#!、ロマーニャ語では#italic Roca#!。要塞の意）と呼ばれる、旧式の大砲の砲弾をそらすことができる、丸みを帯びた塔を採用した要塞の先駆者となった。こういった要塞の存在により、あらゆる町が戦術的な防衛拠点と化しており、侵略者は時間をかけた消耗戦を強いられる。そのため、ロマーニャの小規模な国々であっても、地中海の勢力争いにおいて格上に対抗できるのだ。"
 romagnol_the_sangiovese_viticulture: "サンジョヴェーゼのブドウ栽培"
 romagnol_the_sangiovese_viticulture_desc: "ロマーニャの丘陵はサンジョヴェーゼ種の葡萄栽培に捧げられている。これは単なる農業ではなく、頑健で力強い「戦士の葡萄酒」である。国家は醸造に厳格な規則を定め、歩兵のための高カロリーで保存の利く製品を確保する。これはまた、険しいアペニンの農民たちを都市市場に結びつける、信頼できる貴重な交易品ともなり、経済的繁栄を通じて地方の忠誠を確かなものとするであろう。"
 romagnol_the_stampa_dpopul: "スタンパ・ド・ポプル"
 romagnol_the_stampa_dpopul_desc: "ロマーニャは、安価で地方の方言で書かれた大衆向け印刷物――いわゆる「大判刷り物」――の中心地となるだろう。これにより、ニュースや予言、民謡が農村の民衆にまで広まる公共の言論空間が生まれる。この識字に基づく動員は、国家が布告を迅速かつ効果的に伝達できることを保証し、高度に情報に通じ、政治的に活発な民衆を育てるだろう。"
 romagnol_the_agricultural_academies: "農業アカデミー"
 romagnol_the_agricultural_academies_desc: "後期バロックの流行にならい、ロマーニャの主要な町はこぞって農作物の生産量向上を目的とした「アカデミア」を設立する。こういった現地に根付いた学術団体が研究するのは、湿地の排水方法や、病害に強いブドウ品種の選別についてだ。この地域は農学実験の場となり、そこから生まれた農業手法は、収穫量の増加という成果を出す。そして収穫量に余裕ができると、地域の製造業が活発化し、アドリア海市場向けの高い価値を持つ交易品が国家にもたらされるのだ。"
 romagnol_la_streda_rumegna: "ラ・ストレーダ・ルメーニャ"
 romagnol_la_streda_rumegna_desc: "ロマーニャは各地のコムーネと手を組み、新しい石造りの橋と排水設備を共同で建設し、ヴィア・ロメアと呼ばれる古代からある沿岸街道の刷新に着手する。この事業により、ロマーニャの海岸は再びヴェネツィアや教皇領の市場と結ばれることになる。海岸沿いの村々は孤立した集落から重要な交易拠点に変わり、ロマーニャの農産物の輸送に役立つとともに、わが国の領土が脅かされた際に必要な戦略的機動力を提供してくれるだろう。"
 #Romagnol Unique
 rav_the_pineda_di_classe: "クラッセの松林"
 rav_the_pineda_di_classe_desc: "アドリア海の沿岸に広がる松林はピネディと呼ばれ、国家的な戦略資源として管理されている。わが国では林業と製塩業が発展しており、人々は造船用木材の伐採と、チェルヴィアの広大な塩田の管理を生業としている。この伝統を支援すれば、わが国は凶作の影響を受けない農業外の手段で富を蓄えやすくなる。木材や塩は、何らかの危機が訪れたときに必要な「換金しやすい資産」でもある。"
 urb_the_montefeltro_seignory: "領主たるモンテフェルトロ家"
 urb_the_montefeltro_seignory_desc: "我々は丘の上の町々や渓谷の領主である。権威の歴史は古く、統治者としての地位を追われたことは一度もない。国民はモンテフェルトロ家が自分たちの土地と慣習の庇護者でありつづけてきたことを知っており、彼らの忠誠は、どんな法律よりも固く領主と臣民を結びつけている。モンテフェルトロ家が領主の地位に就いているのは、単に一帯の有力者であるからではなく、双方が認めた一種の協定の結果なのだ。"
 rav_mosaics_of_ravenna: "ラヴェンナのモザイク画"
 rav_mosaics_of_ravenna_desc: "西方世界において、我らほど #italic モザイク #! 芸術を今に伝える都市は他にない。我らのバシリカや霊廟は、金と深い青に輝くテッセラで覆われ、幾世紀もの戦乱と忘却を経てなお、その輝きを失っていない。これらの作品は、失われる前の古代世界の姿を学ぼうとする学者や巡礼者、芸術家たちを引き寄せる。この卓越した工芸の伝統は我らの文化的遺産を深め、同時代のいかなる競争相手も容易には模倣できない威信を国家にもたらす。"
 urb_the_hill_fortresses: "丘陵要塞"
 urb_the_hill_fortresses_desc: "わが国の領土の丘陵地帯は、何世代にもわたって要塞化されてきた。高所に築かれた町はどれも、覚悟を決めた軍隊であっても攻略には数週間を要するだろう。また、我らが兵士たちは町へと続く急勾配の道で戦う術を習得し、小規模な守備隊で大軍をしのげる場所を防衛地点としている。この丘陵要塞網はわが国を守る盾であるとともに、軍事的伝統を身に付けさせる養成所でもあるのだ。"
 rav_battle_of_ravenna: "ラヴェンナの戦い"
 rav_battle_of_ravenna_desc: "ラヴェンナは古くから重要な都市で、それをめぐって古くから戦いが起こってきた。城壁の外に広がる平野では幾度も激しい戦いが繰り広げられ、我らが都市の名はイタリアにおいて激戦の代名詞となっている。我々は幾度となく血に染まったこの地だからこそ得られた教訓を生かし、都市の城壁を強化し、兵士たちを熾烈な会戦に備えて鍛え上げている。容易には倒せない軍と容易には陥落しない都市。それこそが我々の軍事的伝統の成果だ。"
 urb_the_ideal_court: "理想の宮廷"
 urb_the_ideal_court_desc: "我々の宮廷はイタリア全土で最も洗練されていると言われており、そこでの暮らしを体験するため、学者や熱意ある芸術家たちが遠路はるばるやって来る。交流、催し物、そして美術品といった、この宮廷での光景に刺激を受けた人々が「完璧なる宮廷」を描いた記録や作品を生み出し、それらが国外に伝わることで我々の名声を広めている。この統治と文化の洗練こそ、我々が築いてきた最大の偉業である。"
 rav_byzantine_legacy: "ビザンツの遺産"
 rav_byzantine_legacy_desc: "我が都市は、他のほぼすべての地で消え去った文明を今に伝える生きた記録庫である。金箔の後陣、精緻な石工、そして #italic ビザンティン #! 世界の図像伝統は、西方のどこにも見られぬ濃密さでここに生き続けている。これらの作品を学びに訪れる芸術家や後援者たちは、その影響を外へと運び、我らの工房で生み出されるあらゆるものの名声を高める。この唯一無二の遺産を守り続けることこそ、我らの過去を永続する文化的・商業的価値の源泉へと変えるのだ。"
 urb_the_mathematical_school: "数学学派"
 urb_the_mathematical_school_desc: "我らは数学と哲学の探究の伝統を育み、その思索の精緻さによって我が都市はヨーロッパ中にその名を知られるようになった。宮廷に設けられた #italic Mathematical School#! は、翻訳、注釈、そして独自の著作を生み出し、諸学を進展させ、最高の大学からの称賛を勝ち得ている。学問への献身は市民の心を開き、世界を理解し形作る我らの力を研ぎ澄ます。"
 rav_bonifiche_ravennati: "ラヴェンナの干拓事業"
 rav_bonifiche_ravennati_desc: "我が都市を取り巻く沼地と潟は、我らを守る盾であると同時に重荷でもある――それらは軍勢から我らを守る一方で、田畑を水浸しにし、疫病を育む。我らは排水と堤防築造の体系的な事業に着手し、水路を掘り、堤を築いて水を押し戻し、沼地から新たな農地を切り開く。この湿地の生産地への転換は、増え続ける人口を養い、国家の課税対象地を拡大する。"
 urb_the_ceramics_guilds: "陶器ギルド"
 urb_the_ceramics_guilds_desc: "ラヴェンナの陶工や絵付師たちは、錫釉を使った「マヨリカ焼き」の伝統を発展させてきた。鮮やかな色彩と精緻な物語画を特徴とするこの陶器に、大陸中の収集家や宮廷が夢中になっている。ラヴェンナの陶器ギルドはこの技術を何世代にもわたって守り伝えていくことで、我らの名声を築き上げたその品質を維持している。この工芸産業は、工房で生産されるあらゆる絵皿や装飾皿の輸出を通じ、我々の文化そのものを伝えているのだ。"
 rav_the_new_ravenna: "新たなラヴェンナ"
 rav_the_new_ravenna_desc: "幾世代にもわたる停滞を経て、我らは都市の刷新に投資する――旧市街を整理し、新たな道と市場広場を建設し、城壁内に定住する職人や商人に優遇策を与える。こうして生まれる都市は、より開かれ、より繁栄し、改革する国家とともに訪れる成長をより良く受け止められるようになる。この都市組織への再投資により、ラヴェンナは人々がただ留まるしかない場所ではなく、進んで訪れたい場所となる。"
 urb_the_enlightened_university: "啓蒙の大学"
 urb_the_enlightened_university_desc: "我々の大学は政治体制の変化や各時代の動乱を乗り越え、その教育の評判により生徒と学者を都市に惹きつけつづけている。我々が最も輝いていた遠い昔に築かれた学問の伝統は現在、その精神を新たな時代へと伝える生きた制度となっている。こうして学府としての精神や営みを連綿と受け継いでいくことは、我々から未来への贈り物であると同時に、我々が偉大な過去につながるための行為でもある。"
 #Sardinian Shared
 sardinian_the_barbagia: "バルバジア"
 sardinian_the_barbagia_desc: "中央山岳地帯(バルバージア)は、幾世紀にもわたり、あらゆる地中海の侵略者にとって「蛮族の地」であり続けてきた。この地の文化は #italic S'Ard #! (サルデーニャ人)としての同一性によって定義される――外部からのいかなる課税や徴兵も拒む、激しく孤立した牧畜民の精神である。これが、古のヌラーゲ的な独立の気風が今も保たれる文化的な牙城を生み出した。侵略する国家は沿岸の都市を制圧できようとも、島の心臓部は禁じられた領域であり続け、純然たる地理的・社会的抵抗によって我らの慣習の存続が保証される。"
 sardinian_the_artizanu: "職人"
 sardinian_the_artizanu_desc: "都市や町では、外来の美意識と土着の意匠を融合させた、独自のサルデーニャ職人・銀細工師の階層が台頭しつつある。これらの同業組合は自らの自由を激しく守り、しばしば外国商人の独占と衝突する。これにより、地中海的な視野とサルデーニャの魂を併せ持つ、活気ある都市文化が生まれ、海上貿易の複雑さを管理しうる、読み書きに長けた熟練の中産階級を国家にもたらす。"
 sardinian_the_ademprivio: "アデンプリーヴィオ"
 sardinian_the_ademprivio_desc: "サルデーニャ文化は #italic Ademprivio #! ――封建領地を放牧、伐採、水利に用いる民衆の権利――に深く根ざしている。土地の私有化の試みにもかかわらず、サルデーニャの農民たちは「聖なる共有地」の文化を守り続けてきた。これは農村階層の全面的な窮乏化を防ぎ、高い内部的安定を確保する。我らが領土の安定が、これら牧畜共同体の共有された繁栄の上に成り立つと知っているからである。"
 sardinian_the_turres_costeras: "トゥレス・コステラス"
 sardinian_the_turres_costeras_desc: "海賊の脅威に対抗するため、我が民は沿岸に一連の見張り塔を築くだろう。これにより「沿岸の見張り」の慣習が生まれ、家族ぐるみで海辺から丘へと移り住みながら、見張りの常時交代制を維持するようになる。この「水平線を見つめる」文化は島の全人口を国家の戦略的資産へと変え、地中海で最も重要な航路が、防衛を日々の務めと見なす民衆によって絶えず監視され続けることを保証する。"
 sardinian_the_hymnu_sardu: "サルデーニャ賛歌"
 sardinian_the_hymnu_sardu_desc: "近代的な国民意識が芽生え始めるにつれ、我らの文化は封建的忠誠から新たな「王国への愛国心」へと移りゆく。これはサルデーニャ文学の隆盛と、「サルデーニャ人のためのサルデーニャ」を求める政治的小冊子を通じて表現される。この運動から、古き封建法を近代的な主権憲法へと改めようとする、新たな近代化された統治階層が台頭する。"
 sardinian_the_industrial_transition: "産業の推移"
 sardinian_the_industrial_transition_desc: "新たな鉛と亜鉛の鉱脈の発見とともに、我らの伝統的な牧畜文化は産業の時代と融合し始めている。我らは最初の近代的な鉱山と鋳造所を設立し、そこには伝統的な「組合の規律」を現代にもたらすサルデーニャの労働者たちが従事するだろう。この鉱業文化は、近代戦争と公共事業に必要な原材料を我らに供給し、この島を興隆する我が国家の鍛冶場へと変えるのである。"
 #Sicilian Shared
 legacy_of_the_normans: "ノルマン人の遺産"
 legacy_of_the_normans_desc: "征服という試練のるつぼで鍛え上げられたシチリアのノルマン軍は、ノルマン騎士の圧倒的な突撃力と、ビザンツ、アラブ、ロンバルドの戦術的洗練を融合させていた。戦場の猛威と柔軟な戦術運用、その両方を極めた彼らは、文明の十字路に王国を築き上げたのだ。"
 sic_naval_vigilance: "海上警戒"
 sic_naval_vigilance_desc: "バルバリア海賊やオスマン帝国による度重なる襲撃により、シチリアは沿岸防衛の警戒をひと時も解くことができなかった。そして、彼らのガレー船と沿岸要塞は、南ヨーロッパを守るうえで欠かせない存在となったのだ。"
 sic_sicilian_silk: "シチリアの絹"
 sic_sicilian_silk_desc: "フリードリヒ2世の治世下、絹はシチリアの主要輸出品だった。中世以降、北イタリア諸国に後れを取るかたちでわが国の絹産業は衰退してきたが、復興の望みが断たれたわけではない。絹の生産に投資することで、織工や職人たちは再び活気を取り戻すことだろう。"
 sicilian_the_cult_of_the_santuzze: "サントゥッツェ信仰"
 sicilian_the_cult_of_the_santuzze_desc: "シチリアの宗教は長い間、都市を疫病や溶岩から守る力を持つとされる、女性守護聖人たちと結びついてきた。この聖人信仰と関連した大規模な行列（たとえば、パレルモのフェスティノ）は、社会的緊張を発散する場にして、同時に共同体の結束を示す場でもある。こうした儀式はシチリアの社会的結束を高めるものであり、人々の活力の源となっている。"
 sic_sicilian_enlightenment: "シチリア啓蒙主義"
 sic_sicilian_enlightenment_desc: "パリやウィーンの壮麗なサロンからは遠く離れていながらも、シチリアは独自の啓蒙主義を育んだ。知識人たちは封建的特権に異議を唱え、科学の振興と法制度の改革（多くはカトリック的人文主義の枠組みに基づくものだった）を推し進めた。こうした思想は、王政と伝統の影にあって、近代化への礎を築いていったのである。"
 sic_sicilian_reforms: "シチリア改革"
 sic_sicilian_reforms_desc: "時の流れとともに、わが国の諸制度は時代遅れまたは非効率なものとなってしまった。国家を繁栄させ、活力あるものとするためには、改革が不可欠である。無駄を排し、諸般の手続きが最大限に効率化されるよう、わが国の英知を結集させよう。"
 #Sicilian Unique
 sic_constitions_of_melfi: "メルフィ憲章"
 sic_constitions_of_melfi_desc: "$SIC$王であり、ホーエンシュタウフェン朝の皇帝でもあったフリードリヒ2世は、「メルフィ憲章」として知られる法典を制定した。公法、司法手続、封建法、私法、刑法を網羅的に規定したこの法典は、数世紀を経てもなお運用され、わが国の統治における確かな礎として機能している。"
 sic_studium_generale: "ストゥディウム・ゲネラーレ"
 sic_studium_generale_desc: "1434年、アラゴン王アルフォンソ5世によって創設されたカターニア大学は、シチリア最古の大学であり、南部において正式なストゥディウム・ゲネラーレの地位を授けられた数少ない学術機関のひとつだった。王の勅許により設立され、スコラ学と法学を融合した独自の教育で知られた同大学は、宗教的にも文化的にも多様なこの地において、教会と王権の双方に仕えた法学者、神学者、そして科学者を輩出した。"
 sic_the_court_of_the_royal_patrimony: "王室財産の管理機関"
 sic_the_court_of_the_royal_patrimony_desc: "我らは王領と #italic セクレツィエ #! (関税局)を管理するため、この専門裁判所を設立する。絹、マグロ、穀物の輸出税徴収を専門化することで、国家は地方の男爵たちへの腐敗と「漏れ」を大幅に減らすだろう。この行政的な厳格さは我らの領土を王室の最も信頼できる収入源へと変え、イタリアと地中海全域にわたる我らの戦争の資金を賄うことになる。"
 sic_licentia_populandi: "リセンティア・ポプランディ"
 sic_licentia_populandi_desc: "収穫と税収を増やすため、国家は貴族に #italic Licenses to Populate #! を与えた。これにより領主たちは島の荒涼とした内陸部に新たな町を建設できるようになり、土地と減税を約束して農民を引き寄せる。この内部植民事業はシチリアの景観を一変させ、荒れた奥地を利益を生む農業共同体のモザイクへと変えるだろう。"
 sic_sicilian_baroque: "シチリアのバロック"
 sic_sicilian_baroque_desc: "我らの島では地震が多く、これにより多くの建物が崩壊する。そういった古い建物を建て替えるべく、わが国は史上まれに見る大胆な再建築計画を実行する予定だ。単に古い建物を修理するのではなく、諸都市全体を豪華で地震に強いシチリア・バロック様式で設計しなおす。これは、わが国が大災害に見舞われた際に大量の労働力と富を動員できることを見せつける事業になる。"
 sic_the_marsala_wine_industry: "マルサラのワイン産業"
 sic_the_marsala_wine_industry_desc: "他国の投資家のおかげで、地元の農民の飲み物だったシチリアワインが、長い船上輸送に耐える高級な輸出品、すなわち酒精強化ワインに生まれ変わる。バリオと呼ばれるブドウ屋敷の文化は、シチリアの富と洗練の新たな象徴となるだろう。古くからあるシチリアの伝統が、全世界を取引の舞台とする現代的な産業界と結びつくのだ。"
 #Tuscan Shared
 birthplace_of_renaissance: "ルネサンス発祥の地"
 birthplace_of_renaissance_desc: "優れた芸術への献身、美術的才能の育成、革新的な思想により、我々は文化、哲学、そして科学的進歩を牽引する主要国家のひとつとみなされている。"
 a_land_of_banks: "銀行の地"
 a_land_of_banks_desc: "$tuscany_area$は$europe$の銀行業の中心地であり、主要都市には多くの大手金融機関の本部が置かれている。金融機関は広大な取引網や有力な取引先を通じ、そういった拠点から$italy_region$だけでなくヨーロッパ北部にも影響力を及ぼしている。"
 tuscan_merchant_houses: "トスカーナ商人の商館"
 tuscan_merchant_houses_desc: "大陸の大商業都市のいたるところ、為替手形が使われ商品が計量されるあらゆる場所で我々の商人たちの名は知られている。イングランドの羊毛市場からレバントの香辛料の交易路まで、国境のはるか遠くにも我々の商館は設置されており、どんな軍隊にも勝る影響力を生み出している。こうして取引関係と信頼関係を張りめぐらせているため、遠方の宮廷においても我々の意見が無視されることはない。"
 tuscan_the_mezzadria: "メッツァドリア"
 tuscan_the_mezzadria_desc: "我が領土の肥沃な丘陵と谷間一帯において、地主と小作人の間の古来の協定は、田畑が丹念に耕され、収穫が誠実に分かち合われることを保証してきた。#italicメッザドリーア#!は単なる農業上の取り決めにとどまらない――それは農民と、コンタードの産物に依存する商人階級の双方を支える社会的契約である。この都市と農村を結ぶ絆こそ、我らの繁栄が拠って立つ礎である。"
 tuscan_literary_academies: "トスカーナの文学アカデミー"
 tuscan_literary_academies_desc: "トスカーナの諸都市では、言語の洗練、知識の追求、そして市民の道徳観の向上に注力する学術団体がいくつも生まれている。文学研究者による文献調査から科学者による自然哲学の探求まで、こういったアカデミーには当代随一の学者たちが集まり、我々の行政官の知性を磨き上げている。この組織的探求はすでに成果を挙げており、統治の質が上がり、諸制度はさらなる展望を抱けるようになっている。"
 tuscan_enlightenment: "トスカーナの啓蒙"
 tuscan_enlightenment_desc: "トスカーナの諸都市には理性的な啓蒙主義の精神が深く根付いており、思想家と改革者が迷信を正し、法律を体系化し、統治制度を根本的に作り直そうとしている。新たな哲学を学んだ我々の統治者は、臣民に対する福祉の提供は道徳的な義務であり、同時に優れた統治手段と考えている。この理性と改革に対する熱意は、トスカーナの通りや宮廷、アカデミーを現代世界における模範に変えつつある。"
 #Tuscan Unique
 florino_d_oro: "フローリン金貨"
 florino_d_oro_desc: "1252年以来、我が造幣所で鋳造された金貨#italicフィオリーノ・ドーロ#!は、キリスト教世界で最も信頼される通貨であり続けている。ロンドンの銀行からアレクサンドリアの市場に至るまで、何人もの王の野心を経てもその重さと純度が決して揺らぐことがなかったため、何の疑いもなく受け入れられてきた。フィオリーノで取引する商人たちは、我らの信用そのものを取引しているのだ――我らの貨幣で行われるあらゆる交換は、$FLO_ADJ$統治の堅固さと、それを支える諸制度の信頼性を静かに物語る広告となる。この通貨への普遍的な信頼は、我らの宮廷で行われるあらゆる取引を円滑にし、真に信頼される交換媒体のみが絶えず生み出しうる税収を国庫に供給し続ける。"
 luc_the_silk_republic: "絹の共和国"
 luc_the_silk_republic_desc: "我々は長きにわたり、ルッカの絹を使ってイタリア最高級のブロケードを織りつづけてきた。我々の都市がその規模に見合わない繁栄を遂げているのは、このブロケードのおかげだ。織物ギルドは職人技の秘密を守りつつ、遠方の市場で高く売れる品質の維持に努めている。共和国が豊かでいられるのは、生糸から一流の絹織物を作るこの熟練の技術があってこそだ。"
 pis_maritimes_legacy: "海洋共和国の遺産"
 pis_maritimes_legacy_desc: "三世紀にわたり、$PIS$ は西地中海における有数の海洋強国として君臨し、そのガレー船はサルデーニャからレヴァントに至るあらゆる港へと到達し、サラセン人に対する数々の海戦勝利によって、弱小国には閉ざされた市場への特権的な出入りを勝ち取った。1284年のメローリアの敗北は我が艦隊を弱体化させたが、海上交易が築き上げた数世紀の成果まで消し去ることはできなかった。我らの船長たちはこの海域を知り尽くし、我らの商人はあらゆる港でその相手方と誼を通じている。我らを偉大にした航路は、今なお我らが航行しうる航路なのだ。この航海の遺産は、内陸にとどまるいかなる競争相手に対しても西方貿易における優位を我が商人にもたらし、かつての海上の栄光の記憶は、奪われたものを取り戻す原動力となっている。"
 sie_artists: "シエナ派絵画"
 sie_artists_desc: "絵画の技は$renaissance$の黎明期より$ITA$にて栄えてきたが、$SIE$で修行を積んだ者たちの優雅さに並ぶ画家はいない。$europe$でも屈指の古さを誇る大学、#italic Studium Senese#!が、画家と学者をともに同じ市民的庇護の伝統のもとで育んでいるのだ。$SIE_ADJ$の美術は現世離れした洗練を見せ、聖書の登場人物や聖人たちの起こした奇跡に重きを置く。この学問と芸術の融合こそが$SIE_ADJ$派を定義し、その名声を幾世紀にもわたって確固たるものにしている。"
 florentine_school: "フィレンツェ派"
 florentine_school_desc: "$FLO$ の工房群(ジョット、ブルネレスキ、マザッチョ、ボッティチェッリ、そしてレオナルド)は、絵画と彫刻が文明全体にとって何を意味するかを定義し直し、世代を重ねるごとに、石材、顔料、青銅において人の目と手が成し得る限界を押し広げてきた。真剣に受け止められたいと願う後援者で、まず $FLO_ADJ$ の巨匠に相談せずに作品を委嘱する者はいない。我が芸術家たちはどこに召されようともこの名声を携え、都市の名そのものを、いかなる一枚の絵画をも超えて生き続ける信用の証へと変えている。この途切れることなき芸術的指導力の伝統は、我が工房を $ITA$ 随一の才能で満たし、我らが生み出す作品がキリスト教世界で最も目の肥えた後援者たちの称賛と黄金を勝ち取ることを保証している。"
 luc_the_towers_of_lucca: "ルッカの塔"
 luc_the_towers_of_lucca_desc: "ルッカの貴族たちは、都市にいくつもの巨大な塔を建てた。ほかの建物の屋根よりはるかに高くそびえ立つ塔は、それぞれが共和国における名声と権力の宣言であった。トッレ・グイニージはとりわけ巨大な塔で、頂上に植えられた樫の木はこの街の象徴になっている。数多くある塔は、都市に入るすべての者に知らしめているのだ。我々の強さは、石を使い競い合うようになった市民たちの野心と切磋琢磨のなかにこそあるのだと。"
 pis_the_university_of_pisa: "ピサ大学"
 pis_the_university_of_pisa_desc: "1343年に皇帝勅許により設立され、$PIS$ を襲ったあらゆる政変のたびに再建されてきた我が大学は、法学者、医師、神学者を育て、その経歴は $PIS_ADJ$ の厳格な学問の伝統を $ITA$ はおろかそれを越えた地の法廷や教会にまで広めてきた。#italic Studio Pisano#! を際立たせるのは、その古さだけではなく、その方法論にもある。本学の教授陣は常に、答えよりも問いを好む学者たちを惹きつけ、受け継がれた教義を暗記するだけにとどまらぬ卒業生を生み出す、揺るぎない探究の気風を築き上げてきた。この能動的な学問の伝統は、我らが育てるあらゆる専門家の質を形作り、我が諸機関全体の学問水準を引き上げ、知識が形だけの儀式ではなく生きた実践であり続けることを保証している。"
 sie_council_priori: "プリオーリ評議会"
 sie_council_priori_desc: "我が共和国の九人の執政官は、専ら$SIE$の商業ギルドから選出され、派閥争いによって過去のあらゆる政府を破滅に導いてきた高位貴族の参画を阻まれている。彼らは、より貴族的な隣国には及びもつかぬ行政的な勤勉さをもって都市の統治を形作ってきた。その任期は短く、説明責任は公に問われるため、腐敗の持続は隠しにくく、派閥的な策謀を市民的美徳の言葉で糊塗することも難しい。商人による統治は、我が諸制度に実務的な有能さと、生まれの偶然ではなく商業と合意に根差した正統性をもたらしている。"
 florentine_citizen_militia: "フィレンツェ市民軍"
 florentine_citizen_militia_desc: "傭兵軍への反対を説くマキャヴェッリの主張は、何世代もの間、渋々ながらも聞き流されてきた(ギルドは自ら行軍するより傭兵隊長に金を払うことを好んだのだ)が、1494年と1512年の大惨事は、雇われ兵士が何のために死に、何のために死なないかを、破滅的な代償とともに示して見せた。我らはこれに応え、各地区の男たちを常備中隊へと組織し、公費で訓練・装備させる。彼らが $FLO$ の防衛に懸けるものは月々の給金ではなく、自らの家と生業そのものである。自国の市民を武装させることで、雇われ兵士ならば退却するところで踏みとどまる歩兵が生まれる。戦役の終わりに値段を交渉し直すことのできないもののために戦う、そうした核となる男たちである。"
 luc_the_city_walls: "市壁"
 luc_the_city_walls_desc: "我々は都市を囲む、壮大なルネサンス式の円形稜堡を築いた。これは当代有数の防衛施設で、数十年にわたる労働と市民による投資があってようやく完成したものである。上部に歩道を作れるよう、この城壁の基部は非常に広くしてあり、いかなる敵にも破られたことはない。この市壁があるからこそ、近隣の都市が陥落するなかでも我々は独立を保っていられる。"
 pis_marble_tradition: "ピサの大理石の伝統"
 pis_marble_tradition_desc: "この採石場は長きにわたり、$PIS$と周辺の沿岸地域に$ITA$でも最高級の白大理石を供給してきた。この大理石は、都市の景観を変えるような壮大な教会や市民の記念碑に使われている。この伝統のなかで養成された彫刻家や建築家は半島中で引く手あまたで、石材自体も、$PIS_ADJ$様式の作品を望むパトロンたちによって高値で取引されている。卓越した石工技術が我々の文化的地位を高め、あらゆる契約や出荷物に「世界に美をもたらす都市」としての威信を持たせているのだ。"
 sie_monte_dei_paschi: "モンテ・デイ・パスキ"
 sie_monte_dei_paschi_desc: "我が行政官たちは、#italic Monte dei Paschi#!(マレンマ牧草地の歳入を担保とする公的貸付機関)を設立し、商人にも貧者にも手頃な信用を提供するとともに、$SIE$ に拡大する交易の時代における商業の安定した基盤をもたらした。この公的金融における革新は、帝国の寿命すら超えて続く銀行の安定性の模範となり、より向こう見ずな競争相手を破産させた数々の危機を通じて我が商業生活を支え続けた。この機関は、我が領内における新しい経済慣行の普及を加速させると同時に、野心ある都市に必要な安定した財政収入を生み出している。"
 flo_florentine_bastions: "フィレンツェの稜堡"
 flo_florentine_bastions_desc: "我らの軍事技術者は、高さを抑えて角度を付けた現代的な稜堡を完璧に理解している。この稜堡の角度のついた壁は大砲の弾を逸らすことができ、さらには従来の円形の塔に存在した死角をなくすことができるため、簡単に陥落はしない。我々が建設する主要な要塞はすべて、建築家たちが改善したこの形状に基づいており、守備隊を置く費用が抑えられると同時に、襲撃者に対する防御力が圧倒的に高くなっている。トレース・イタリエンヌに習熟した我々が築いた市壁は、イタリアで最先端の様式を採用しており、また維持費についても、国庫への負担になるどころか運用上の優位点となっている。"
 luc_counter_reform_diplomacy: "対抗宗教改革時代の外交術"
 luc_counter_reform_diplomacy_desc: "我々はこの宗教的大変動の時代にあっても、熟慮を重ねた慎重な外交によって独自の立場を貫いてきた。自らの信仰に対する我々の姿勢は真剣そのものであったが、決して狂信的ではなかったため、敬虔な勢力と現実主義の勢力の両方と良好な関係を維持することが可能であった。敬虔さと慎重さの釣り合いが取れているからこそ、我々の共和国は存続できているのだ。"
 pis_natural_philosophy: "ピサの自然哲学"
 pis_natural_philosophy_desc: "$PIS$の学者たちは、既存の権威を鵜呑みにするのではなく、注意深い観察と測定を通じて理解を追い求めてきた。力学、天文学、そして自然の技にまで及ぶ我が#italic Studio Pisano#!における長い探究の伝統に基づくものである。この経験に基づく思考の習慣は、我が哲学者たちのみならず技師や指揮官たちをも形作り、彼らは天体の運行に学者たちが適用するのと同じ厳密さをもって諸問題に取り組んでいる。自然哲学は我が軍事的思考を鍛え、我が軍勢の戦術的な精密さを研ぎ澄ませている。"
 sie_santa_caterina: "聖カテリーナの遺産"
 sie_santa_caterina_desc: "カテリーナ・ディ・ジャコモ・ディ・ベニンカーサ(神秘家、神学者、そして教会博士)は、$SIE$ が生んだ最も名高き魂であり続けている。時代の大論争の後に訪れた宗教的動乱の時代において、彼女の記憶は、論争ではなく敬虔さをもって挑戦に応える、確信に満ちた信仰心の結集点となった。$SIE_ADJ$ の学者や説教者たちはこの霊的刷新の先頭に立ち、この聖女の著作を引きながら、改革はまず心において始まらねばならず、やがて法に至るのだと論じた。この聖性と確信の遺産は我が民の信仰を深め、宗教対立の圧力のもとで分裂しかねない共同体を結びつけている。"
 flo_camerata_fiorentina: "カメラータ・フィオレンティーナ"
 flo_camerata_fiorentina_desc: "ジョヴァンニ・デ・バルディ伯爵の邸宅では、音楽家、詩人、学者たちが集い、古代ギリシア悲劇の上演様式がいかなるものであったかを思い描きながらそれを再現しようとしている。その探求は、全く新しく、そして全く我らのものと言える何かを生み出すことになるだろう。これらの夜会から生まれる議論、実験、作曲は、他所でより高い報酬を得られたとしても、我が宮廷が与える創造の自由をこそ重んじる才能ある演奏家たちを引き寄せている。この芸術的革新者たちの集い、#italic Camerata Fiorentina#!は、我が都市を音楽革命の発祥の地とし、我らが生み出したものを耳にするあらゆる宮廷へと我らの影響力を広げていくだろう。"
 luc_the_musical_tradition: "音楽の伝統"
 luc_the_musical_tradition_desc: "我が都市は古くより音楽の技を育み、教会、サロン、そして公の祝祭の場へと作曲家や演奏家を惹きつけてきた。我が楽長や楽器職人たちはこれほどの名声を得たため、才能ある #italic 音楽家 #! たちはここでの任官を誉れとして求めている。この伝統は我が都市を一つの舞台へと変え、その街路を、我らが紛れもなく自らのものとした芸術で満たしている。"
 pis_medical_tradition: "ピサの医療の伝統"
 pis_medical_tradition_desc: "$PIS$大学の医学部の中心をなすのは#italic Orto Botanico#!であり、これは世界でも最古級の大学植物園で、学生たちは植物の治癒力を研究し、疫病をより効果的に治療する方法を編み出している。$PIS$で学んだ医師たちはこの経験主義の伝統を国中に広め、病人の予後を改善し、疫病や悪疫が我が民にもたらす犠牲を減らしている。医学研鑽への我らの取り組みは我が民をより頑健にし、診断と記録という緻密な技に通じた者たちに自ずと備わる識字の力をも広めている。"
 sie_the_palio: "$SIE$のパーリオ"
 sie_the_palio_desc: "年に二度、$SIE$の各コントラーダは#italicパリオ#!を競い合う。カンポ広場を巡る鞍なしの競馬であり、競技であると同時に、都市の近隣地区を競争心、アイデンティティ、そして激しい共同体的誇りという共有の劇へと結びつける市民的儀礼でもある。この催しの凝った祝祭絵巻は$ITA$各地から見物客を引き寄せ、それを目にする全ての者に$SIE_ADJ$文化的な活力を伝え、自らを祝う術を忘れていない都市としての我らの名声を再確認させる。この根強い伝統は地域一帯における我らの影響力を増幅させ、$SIE$のうちに市民文化の力を証す生きた証を見出す宮廷からの賞賛を我らにもたらしている。"
 flo_florentine_merchant_houses: "フィレンツェ商人の商館"
 flo_florentine_merchant_houses_desc: "我が都市の名家たちは大陸全土に広がる商業網を築き上げてきた(ロンドンの代理人、ブリュージュの仲買人、アレクサンドリアの通信員)ため、我らの名を冠した為替手形は、我らの城壁を一度も見たことのない都市においてさえ、硬貨と同じように自由に流通する。我らの立憲政体の庇護のもとでこれらの網を制度化し拡大することにより、いかなる君主率いる競争相手も容易に真似のできぬ安定と信用の立場から、我が商人たちが商いを行うことを確かなものにしている。この#italic商館#!の広がりは、我らが行うあらゆる取引の収益を押し上げ、我が工房が生み出す品々に最も遠く最も実入りの良い市場を開いている。"
 luc_the_lucchese_constitution: "ルッカ憲章"
 luc_the_lucchese_constitution_desc: "我が古き#italic共和制憲法#!は、慎重な統治と、暴政に抗おうとする我が市民の決意によって幾星霜を生き延びてきた。隣接する都市が君主や征服者の手に落ちる中にあっても、我らは成文法と評議会を絶えることなく維持してきた。この不断の秩序は、我が国家により大きく強大な隣国が羨むほどの安定をもたらしている。"
 pis_academic_prestige: "学問におけるピサの名声"
 pis_academic_prestige_desc: "何世紀にもわたり、学術面で他の追随を許さなかった$PIS$の名はいまや、$ITA$内外の教養ある宮廷人たちのあいだで学問や洗練された文化の代名詞として浸透しており、$PIS_ADJ$で教育を受けたとなれば、国外の学生や裕福な後援者にも一目置かれる存在となる。その高水準の文化と教養で培われた向上心が生み出す芸術作品は、目利きの収集家たちのあいだで高い値がつけられる。学術で築いた名声は、国外の宮廷における我々の立場を高めるだけでなく、高等教育の伝統に着想を得た芸術作品を生み出し、売る者たちに富をもたらしているのだ。"
 sie_civic_pride: "シエナ市民の誇り"
 sie_civic_pride_desc: "$SIE_ADJ$ 共和国の壮大な野心が外からの圧力とトスカーナ統合の前に屈してもなお、$SIE$ の市民たちは、その独自の方言、芸術、そして共同体自治の伝統といった固有の誇りを激しく保ち続け、挑発なしにこの都市を併呑することを困難にしてきた。$SIE$ を敵視し貶めようとする者たちは、幾世紀にもわたる共有の記憶と、$SIE_ADJ$ の生活は守るに値するものだという確信によって結ばれた、頑強な抵抗を見出すことになった。この根深い市民精神は我らへの侵略を思いとどまらせ、我が街を故郷と呼ぶ人々が真にその幸福に心を寄せることから生まれる繁栄を支えている。"
 #Venetian Shared
 ven_venetian_palaces: "共同体の伝統"
 ven_venetian_palaces_desc: "ヴェネトの諸都市は、単一の領主に委ねるのではなく、統治の義務を市民と貴族が分かち合う盟約である #italic コムン #! (#italic コムーネ #! 、標準イタリア語で「自治体」)の上に、その富と秩序を築き上げてきた。パドヴァからヴェローナ、そしてその先の山間の町々に至るまで、選挙によって選ばれる評議会、成文の法規、市民裁判所というこの伝統は、純然たる封建地域には及びもつかない安定と自信を都市生活にもたらした。この自治都市の遺産は我らの制度を強靭にし、市民たちに自らが治める都市の成功への強い関心を抱かせている。"
 ven_state_inquisition: "ヴェネツィアの人文主義"
 ven_state_inquisition_desc: "フィレンツェがルネサンスを我がものと誇る以前から、ヴェネトの学者たちはすでに古代の文献を発掘し、臣民ではなく市民として生きるとはいかなることかを問うていた。フランチェスコ・ペトラルカは晩年をわれらのもとで過ごし、この地方の図書館や宮廷は、古典の学問とキリスト教信仰との間に矛盾を見出さぬ文人たちを引き寄せた。この #italic ウマネージモ #! の伝統は、我らの統治者たちの思考を形づくり、単なる行政官としてではなく歴史と論理によって鍛えられた人物として、あらゆる交渉の質を高めている。"
 ven_venetian_painting: "ヴェネツィア派"
 ven_venetian_painting_desc: "我らの都市の画家たちは、フィレンツェ派の硬い輪郭線を捨て、#italicピットゥーラ・ヴェネツィアーナ#!にのみ可能な、色彩の温かな輝きと光の柔らかな混合を極めた、イタリアに類を見ない様式を生み出した。ジョヴァンニ・ベッリーニ、ジョルジョーネ、ティツィアーノ・ヴェチェッリオによって、我らの工房はキリスト教世界のあらゆる後援者の羨望の的となり、異国の君主たちはアルプスを越えて注文を送る――我らの顔料の豊かさと構図の自信に匹敵する画派が他にないからだ。この絵画は我らの文化に、軍勢よりも遠くまで届く感性の洗練という評判を与え、武力では決して到達し得ぬ宮廷からも後援者、富、賞賛を呼び込んでいる。"
 ven_mixed_naval_tactics: "パッラーディオ建築"
 ven_mixed_naval_tactics_desc: "アンドレア・パッラーディオは古代ローマの比例とヴェネトの建材を結びつけ、ブレンタ河畔の別荘にも、市場広場の公共ロッジアにも等しく似つかわしい、学識と実用を兼ね備えた様式を生み出した。その原則はヴィチェンツァからあらゆる #italic テッラフェルマ #! の都市へと広まり、我らの公共建築に流行ではなく数学に根ざした品格を与えている。この #italic オルディネ・パッラーディアーノ #! は我らの都市を美しくするだけでなく、読み解けるものにする――我らの町を訪れる者は、どの正面壁にも自信と繁栄と永続性を見て取るのだ。"
 ven_ship_mounted_gunpowder_weapons: "ヴェネトの別荘文化"
 ven_ship_mounted_gunpowder_weapons_desc: "ヴェネトの貴族たちは #italic テッラフェルマ #! を夏の領国と定め、農場としても、隠遁の場としても、また運河の上では営めぬ文化生活の舞台としても機能する別荘を築いてきた。ブレンタ河畔からヴィチェンツァやトレヴィーゾの丘陵にかけて、これらの邸宅はサロンや演奏会、哲学談義を催し、都市のアカデミーに引けを取らぬものとなっている。この #italic ヴィーラ #! (標準イタリア語で #italic ヴィッラ #! 、すなわち「田園荘」)の文化は、この地方全体から才能を引き寄せ、我らの統治階級を彼らが治める土地と結びつけ続け、支配する土地についての実践的な知識を彼らに授けている。"
 ven_venetian_thalassocracy: "カルネヴァーレ"
 ven_venetian_thalassocracy_desc: "四旬節を前にした数週間、我らの文化圏の都市は #italic バウタ #! を身にまとい、束の間すべての者が対等となる――仮面をつけた商人が元老院議員と肩を並べて歩いても見分けがつかず、服装や振る舞い、呼びかけの作法を定める規則は万人の合意によって一時停止される。この統制された無秩序の伝統は何世紀にもわたり我らの安全弁として機能し、欧州各地から訪れる者たちはこの見世物に驚嘆しつつ惜しみなく金を落としていく。この毎年の謝肉祭は、欧州の他のいかなる文化も真には模倣し得ぬ、統制された自由という我らの評判を支え続けている。"
 #Venetian Unique
 pad_carraresi_dynasty: "カッラーラ家のシニョリーア"
 pad_carraresi_dynasty_desc: "ダ・カッラーラ家は一世紀以上にわたりパドヴァを統治してきたが、その権威は個人的な威信、帝国からの法的認可、そして治める都市の繁栄への真摯な関心の組み合わせの上に成り立っている。我らの政庁はコムーネ時代に確立された市民制度を維持し、それを排除するのではなく領主統治の奉仕へと活かしてきた結果、都市は類まれな円滑さで機能している。受け継いだ市民組織を尊重するこの #italic シニョリーア #! の伝統は、我らの都市行政をより良く、より安上がりに機能させ、臣民を穏やかで忠実なままに保っている。"
 ven_stato_da_mar: "スタート・ダ・マール"
 ven_stato_da_mar_desc: "最初の#italicドージェ#!の時代以来、$VEN$は海の支配の上にその力を築いてきた。我らの商人たちはアドリア海を通じて東方の富を運び、海外の港と島々の網である#italicスタート・ダ・マール#!がその航路すべてを支えている。この海上秩序の中心に立つのが#italicアルセナーレ#!であり、これは中世世界最大の産業複合体であって、共和国が求めれば一日のうちに完全装備のガレー船を進水させることができる。この商業的覇権、国営造船所、海外帝国の組み合わせは、内陸に閉ざされたいかなる競争相手とも$VEN$を一線を画す存在にし、海そのものを我が国家の延長へと変えている。"
 perpetual_general_captain_of_the_people: "恒久の市民総隊長"
 perpetual_general_captain_of_the_people_desc: "スカリジェーリ家は #italic カピターノ・デル・ポポロ #! の称号を一時の役職としてではなく、コムーネ法に根ざした恒久の授与として主張し、あらゆる軍事行動を王朝的野心ではなく市民の権利の防衛として描き出すことで、競争相手が我らの戦争を単なる侵略と断じることを遥かに困難にしている。カングランデ・デッラ・スカーラはまさにこの正統性の上に名声を築き(ミラノ、ヴェネツィア、パドヴァに向けて出陣しながら、どの抗争も正当な大義として示した)、我らはその先例を、他の領主なら単独で下す決定に都市評議会を関与させ続けることで制度化している。この法的地位と公的負託の組み合わせは、競争相手に我らを公然と敵視することをためらわせる――なぜならヴェローナへの攻撃は、コムーネそのものへの攻撃と映るからだ。"
 pad_the_bo: "パドヴァ大学"
 pad_the_bo_desc: "1222年に創設された #italic ボー #! は、その最初の学生たちが集った宿屋にちなんで名付けられたが、欧州屈指の学問の中心地であり続けており、より慎重な大学が敬遠する学問をも教えるパドヴァの気風が、あらゆる世代の探究心ある知性を引き寄せる地としてきた。ヴェサリウスはここで解剖の実演を行い、ガリレオは数学の教授職から講義を行い、法学部は大陸各地の裁判官や行政官を育ってきた。この途切れることのない自由探究の伝統は、大学に依拠する市民階級の識字率と技能を高め、その存在が都市の知的生活を絶えず動かし続ける学者たちを惹きつけている。"
 ven_gothic_architecture: "ゴシック建築"
 ven_gothic_architecture_desc: "我らの運河沿いに立ち並ぶ壮大な宮殿は、ゴシック北方の尖頭アーチ、ビザンツ東方の開放的なロッジア、イスラム職人の繊細な透かし彫りを取り入れ、#italicゴーティコ・フィオリート#!と呼ぶ我ら独自の様式に融合させた、まったく独自の建築を体現している。商人の富がこれほど自信をもって石と彫刻大理石に刻まれる場所はイタリアの他のどこにもなく、ドゥカーレ宮殿とカ・ドーロは、我が共和国がいかなる王にも劣らぬ壮麗な建造物を築き得ることの証である。この建築の伝統は我らの貴族階級の地位を強化し、$VEN$の物理的な顔を、それを支える繁栄と市民の誇りと不可分のものとしている。"
 court_of_great_refugees: "偉大なる避難民たちの宮廷"
 court_of_great_refugees_desc: "ダンテ・アリギエーリは亡命生活の数年を我らの街を歩いて過ごし、その存在は他の人々――詩人、学者、そして棟梁たち――を引き寄せた。彼らはヴェローナのローマ遺跡と豊富な石材の中に、なお手を加える価値のある都市を見出したのである。我らはこの歓待の伝統を明確な政策へと発展させ、流浪の才人に庇護を与え、#italicマルモリーナ#!の古くからの工房へと卓越した職人たちを招き入れている。そこでは何世代にもわたる石工の技と、イタリア各地から新参者がもたらす最新の技法とが出会う。我らの厚遇の評判は並外れた質の芸術家を引き寄せ、我らの野心的な建設事業に、石材と才能がともに手の届くところにある、豊かな熟練労働をもたらしている。"
 pad_medical_school: "医術の学び舎"
 pad_medical_school_desc: "パドヴァの医学部は、大学創設以来、体系的な解剖学研究と臨床観察とを結び合わせる点で、欧州で最も厳格な医師養成の場として認められてきた――これは偉大なアラブの編纂書だけでは決して成し得なかったことである。この解剖劇場を経た学生たちは、キリスト教世界の他のいかなる学校も提供し得ぬほど詳細かつ精密な人体の理解を身につけ、やがて医師となった彼らはその後赴くすべての都市で、病の理解と治療のあり方を変えてきた。我らの医師たちが観察を信頼するがゆえに、疫病は迷信に頼る人々よりも我らの民の間を軽く通り過ぎ、この大学はそれが触れるあらゆる教養階級の識字をも深めている。"
 ven_printing_industry: "印刷産業"
 ven_printing_industry_desc: "アルド・マヌーツィオが1494年に $VEN$ にて #italic アルド出版社 #! を設立すると、我らはほぼ一夜にして世界の印刷の都となった。それを資金面で支える金を商人たちが持ち、ギリシア語とラテン語で校訂する学識を学者たちが持ち、完成した書物をあらゆる欧州の宮廷へ運ぶ交易路を我らが持っていたからである。アルドの生み出したイタリック体の活字、手頃な価格の携帯用八つ折り本、そしてプラトン、アリストテレス、ウェルギリウスの権威ある校訂版は、大陸のどの印刷所もいまだ及ばぬ水準を打ち立てた。この出版業の掌握は、我らのガレー船が運びうる範囲を遥かに超えて $VEN$ の影響力を広げ、我らの印刷所から流れ出る思想は、我らの倉庫に眠る香辛料にも等しい価値を持つようになる。"
 the_adige: "アディジェ川"
 the_adige_desc: "アディジェ川はアルプスから我が都市の中心を貫いてアドリア海へと注ぎ、ローマ時代以来利益をもたらし続けてきた航路に沿って穀物、木材、完成品を運んでいる。我らは河岸荷揚げ場の改良、浅瀬の浚渫、下流のコムーネとの通航権交渉に投資を行い、天与の利点を管理された商業体系へと変えている。この河川交易は山地からの産物で我らの市場を満たし、競争相手が容易には断ち切れぬ安定した繁栄を都市にもたらしている。"
 pad_paduan_philosophy: "パドヴァ流哲学"
 pad_paduan_philosophy_desc: "パドヴァの哲学科では、アリストテレスのように思考することを前提とし、自然界に対し理性的な疑問を投げかける伝統があるが、これがために自由な神学の講義を実施するよりも、遥かに教会を悩ませる結論に行き着くことが常だ。パドヴァでは、魂はいずれ滅びるものである、知識は個人ではなく共通の資産である、あるいは他所では神の介入と決めつけられる自然現象にも説明がつくなどと議論をすることが法的に許されている。こうした宗教に基づかない世俗的思考を重んじる文化によって、簡単に権威を受け入れるよりも分析するよう訓練され、並外れた知的主体性を持つ弁護士、医師、行政官などが輩出されるのだ。このパドヴァ流の思考が築いた評判は、より慎重な統治を実現しようとする人材を国家に集結させ、街の知識層を豊かにする学者を惹きつけている。"
 ven_venetian_school_of_music: "ヴェネツィア音楽学校"
 ven_venetian_school_of_music_desc: "黄金の身廊を挟んで向かい合うサン・マルコ寺院の二つの聖歌隊席から、#italic コーリ・スペザーイ #! (#italic コーリ・スペッツァーティ #! 標準イタリア語で、すなわち「分割合唱」)の技法が生まれた。二つの合唱団が応答し重なり合うその統制された音の戯れは、大聖堂の類まれな音響によってのみ完全に実現される。アドリアン・ヴィラールト、ガブリエーリ一族、クラウディオ・モンテヴェルディは皆この伝統の中で活動し、彼らの育てた音楽家たちは $VEN_ADJ$ ポリフォニーの様式をマドリードからウィーンに至る宮廷へと伝えた。この音楽の流派は $VEN$ を欧州の音の都として認めさせ、我らの都市が生み出す作曲家や歌手たちの流れは、我らのガレー船が決して届かぬ地にまで $VEN_ADJ$ の名声を運んでいる。"
 scaligers_military_ambitions: "アレーナでの催し物"
 scaligers_military_ambitions_desc: "ヴェローナの円形闘技場は、イタリアに現存する最も優れたローマ時代の建造物のひとつであり、我々はこれを北イタリア最大の公共 #italic スペッタコリ #! ――闘牛、祭礼行列、市民競技――の舞台としてきた。それらはヴェネツィアや #italic テラフェルマ #! 各地から数日がかりで人々を引き寄せる。古代ローマの石造建築の中でこれほどの規模の見世物を提供できる都市は他になく、この伝統はヴェローナの自己認識そのものと分かち難いものとなった。二千年前に築かれた空間で、何千もの観衆の前で自らの姿を演じ続ける共和国なのである。この公的な壮麗さへの評判は北イタリア全土に我らが名を広め、訪れる者たちの散財と故郷への手紙は、いかなる使節を送るよりも我らの名声に寄与している。"
 pad_the_accademia: "アカデミア・パタヴィーナ"
 pad_the_accademia_desc: "我々は #italic パドヴァ科学文芸アカデミー #! を設立し、この都市の有力な学者、医師、文人たちを国家の正式な後ろ盾を得た単一の機関にまとめる。これにより、大学教授陣それぞれの才気が、一人の教授では到底成し得ない事業を担う持続的な集団事業へと変わる。アカデミーは大学の研究成果が行政・商業の実務的な需要と出会う場を提供し、学識ある専門知識を、別個の諮問機関を維持するよりもはるかに低い費用で国家の利用に供する。組織立った学問は我が宮廷に類まれな技術的・行政的助言の厚みを与え、さもなくば大国の華やかな舞台を求めて去っていたであろう有能な人材を、我らの奉仕に留め置く。"
 ven_ridotto: "イル・リドット"
 ven_ridotto_desc: "1638年、$VEN$大評議会はダンドロ宮殿に常設の公共賭博場を認可するという前例のない措置を取り、ここに欧州初の国家監督下のカジノ、#italicリドット#!が誕生した。入場には仮面と貴族の帽子が求められ、これにより施設は平等の体裁を保ちつつ、収益が確実に国庫へと流れ、貴族たちの振る舞いが国家の目に見える状態を保つことができた。この管理された施設は、共和国が抑え込めなかった悪徳を、確実な歳入源へ、そして都市の最も権勢ある者たちを監視下に置き続ける仕組みへと変えたのである。"
 consolidate_italian_holdings: "アルプスの玄関口"
 consolidate_italian_holdings_desc: "スカラ家が統治していたのはヴェローナだけではない。彼らは北イタリアの諸都市にまで、その支配力の網を拡大していた。そして、都市群をまとめあげるには、巧みな外交、賢明な権限委譲、潤沢な報酬を受け取る職業軍隊の存在が不可欠だった。諸都市を統合してこそ、ヴェローナは本当の意味で半島の列強となれるのだ。"
 pad_paduan_commune: "パドヴァ・コムーネ"
 pad_paduan_commune_desc: "我が都市最古の自治機構――選挙による評議会、成文化された法令、公共の決定に市民が参加する伝統――は、単一の家門がその上に君臨した領主統治の数十年を経てもなお、完全に絶えることはなかった。我々はこれらの自治的な制度を復興し、正式なものとして定め、商人や市民に都市統治における公認の役割を与え、都市が支配者のみならず全市民に属するという意識を取り戻す。この #italic コムン・パドヴァン #! (#italic コムーネ・パドヴァーノ #! 、「パドヴァ自治都市」)は、最も活発な市民たちの力を国家に奉仕する機構へと導き、自らが納めるものの正当性を信じる民から上がる税収を増やす。"
 ven_la_fenice: "ラ・フェニーチェ"
 ven_la_fenice_desc: "#italicテアトロ・ラ・フェニーチェ#!(不死鳥座)は1792年、$ITA$随一の壮麗な歌劇場として開場した。これは火災で失われた劇場に代わって建てられ、自らの灰からよみがえる鳥にちなんで名付けられたが、この名はのちに幾度となく不吉な予言となる。黄金に輝く内装、身分ごとに配された桟敷席、そして上演される新作の数々は、オペラを貴族の私的な娯楽から、軍事的勝利こそ尽きたが美を失わぬ都市を象徴する文化的大事件へと変えた。毎夜この劇場は、貴族、旅人、批評家たちの前で共和国の趣味、富、野心を示し、その称賛はいかなる外交文書よりも遠くまで伝わっていく。"
 marmorina: "巡遊旅行"
 marmorina_desc: "ヴェローナは、ヨーロッパの教養ある貴族たちが旅程を完結させるには必ず訪れねばならぬ土地となった。英国の貴族、フランスの学者、ドイツの諸侯たちが円形闘技場、ローマ劇場、スカリジェリ家のゴシック様式の墓廟を訪ね歩き、惜しみなく散財し、大陸中の宮廷への書簡にこの都市のことを書き記す。彼らの記述はヴェローナを、イタリアの幾重にも重なる遺産の代名詞へと変えた。ローマ、中世、ルネサンスの文明が、どの世紀にも属さぬ通りを一度の午後の散策で読み取れる都市なのである。この絶えざる富裕で影響力ある訪問者たちの流れは我が国庫を潤し、我が国の規模だけでは決して開かれなかったであろう外交の対話を開き、我が軍勢よりも遥か先を行く文明の名声を築き上げている。"
 #Vivaro-Alpine Shared
 vivaro_alpine_drailles: "ドレイユ"
 vivaro_alpine_drailles_desc: "羊飼いたちが夏の高地牧草地と冬の低地放牧地との間で群れを移動させるために用いる古来の季節路、 #italic ドライユ #! は、この地方で最も入念に維持された道の一つであり、幾世紀にもわたって洗練された経路で峠と谷を横切る。これらの道沿いの共同体は、共同放牧権、中継の避難小屋、紛争仲裁の仕組みを発達させ、移牧という季節的な危険を確実な生産の循環へと変えてきた。季節をこれほど緻密に管理することで、我が高地は一所に留まる農耕よりも遥かによく民を養っている。"
 vivaro_alpine_infantry: "アルプスの歩兵"
 vivaro_alpine_infantry_desc: "山岳地形は、騎兵や重装甲が役に立たぬ条件下でも戦える、軽快で機動力に富んだ歩兵の伝統を育んできた。道も、平坦な地面も、自らの背で運べる以上の補給線も必要としない者たちである。我が文化の谷々は、寒さ、高度、不意の待ち伏せに慣れ、自分たちを遥かに上回る兵力に対しても狭い峠を守り抜ける兵士を生み出す。険しい地形において、我が軍は開けた低地の戦場で訓練された敵と相まみえるが、彼らは決まって我らに対する備えを欠いている。"
 vivaro_alpine_passes: "アルプスの山道"
 vivaro_alpine_passes_desc: "モン・スニ峠、モンジュネーヴル峠、ラルシュ峠――地中海世界と北欧を結ぶ大アルプス越えの街道はすべて我が領内を通り、ささやかな領主たちさえも国際的な往来の欠くべからざる門番たらしめている。商人、軍勢、教皇使節、巡礼者はみな我らの地を通るために対価を払い、我らの手を通過する往来は、純然たる内陸の国々には決して蓄積し得ない情報、人脈、そして影響力を我らにもたらす。このアルプス越え交易の要衝たる地位が、我が外交を並外れて情報通にし、我が商人たちを並外れて人脈豊かにしている。"
 vivaro_alpine_herbes_des_alpes: "エルブ・デ・アルプ"
 vivaro_alpine_herbes_des_alpes_desc: "我が地方のアルプス植物相は、リンドウ、アルニカ、ワレモコウなど幾十種もの驚くべき薬草の宝庫を我々に与えており、ここの共同体は薬草の調合と植物学の知識の伝統を育み、これら孤立した谷の住民を低地の人々よりも健康に保ってきた。これは民間呪術の産物ではなく、組織立った観察の結果であり、世代から世代へと、実用的な処方と、何が効き何が効かなかったかの蓄積された記憶という形で伝えられてきたものである。この #italic Herbes des Alpes #! は、輸入薬に頼る大都市の医師たちが容易には真似できない手段を、我が治療者たちに与えている。"
 vivaro_alpine_valley_councils: "渓谷評議会"
 vivaro_alpine_valley_councils_desc: "我が山岳共同体の孤立は、大国がそれらを組織しようと考えるよりずっと以前から、機能的な自治を発達させることを彼らに強いてきた。共同牧草地を管理する村落評議会、紛争を仲裁する地方裁判所、冬を越すために谷を支え続ける資源を調整する選出役人たちである。これらの制度は、外から送られてきた知事には到底再現できない地元事情の知識によって動いており、幾世代にもわたって審議と記録の伝統を積み重ね、我が共同体にその規模に不釣り合いなほどの行政的な深みを与えてきた。この #italic コンセーユ・ド・ヴァラ #! の伝統は、我が統治を並外れて有能なものにし、我が臣民を自らの事柄の管理に並外れて主体的に関わらせている。"
 vivaro_alpine_nature: "アルプスの大自然"
 vivaro_alpine_nature_desc: "ルソーによる山岳の素朴さの理想化、それに続くロマン主義運動の詩人や画家たちは、アルプスを越えるべき障壁から、目指すべき目的地へと一変させた。我が谷々、峰々、そして古くからの共同体は、教養あるヨーロッパが失われたと感じていたあらゆるものを映す鏡となり、峠がかつて他の理由では見たことのないほどの数の旅行者、博物学者、芸術家を呼び寄せた。穢れなき真実性を体現するという我が評判は、我が文化の影響力を、政治的な力だけでは到底及びえぬ遠くまで運ぶ。人々は自分自身を理解するために我らのもとを訪れ、いかなる条約よりも長く残る記憶を故郷へ持ち帰るのである。"
 #Vivaro-Alpine Unique
 sal_the_alpine_passages: "アルプスの通り道"
 sal_the_alpine_passages_desc: "我々の住む土地を通る山道は、いずれもイタリア各地の平原とその向こうに広がる高地を結んでいる。このため我々はいつしか、そうした道を通らざるを得ない旅人や商人から利益を得る術を思いついた。アルプスの山道を管理下に置くことで、どんな軍隊でも決して独力では築くことのできない影響力を持つこととなったのである。そして我々は、それを山の両側にある各共同体との友好関係を維持するために行使している。この地形こそ、先人たちから我々に受け継がれた最大の財産だ。"
 sal_the_mountain_routes: "山岳の経路"
 sal_the_mountain_routes_desc: "わが国の山々を縫うように伸びる道は、我々にとっては慣れ親しんだものだが、よそ者は右も左もわからない。そしてこれらの山道を把握していることが、そのまま我々の軍隊の動かし方や補給の仕方に直結している。他所の軍隊が疲弊し、方向感覚を失ってしまうこれらの道も、我々の兵たちなら消耗することなく余裕で行進することが可能だ。どんな要塞を建てたところで、アルプスの地形を細部まで熟知していることで得られる強さには代えられない。"
 sal_the_saluzzo_chronicles: "サルッツォ年代記"
 sal_the_saluzzo_chronicles_desc: "我々の宮廷では、山の両側で使用されている言語と人々の声を紡ぎ合わせた独特の文芸の伝統が育まれてきたことから、驚くほど豊かな年代記や詩が生み出されている。これらはいずれも、人々がオック語とイタリア語が混在した話し言葉を用いるのと同様に、両言語が混ざった文章からなるため、どちらかの文化のみに属するとは言えない書物ばかりだ。こうして、我々が何者かを定義する年代記にしたためられた文字は、石に刻まれたそれよりも長く、我々独自のあり方を語り継いでいく。"
 sal_the_alpine_strongholds: "アルプスの要塞"
 sal_the_alpine_strongholds_desc: "我々はこの地の山々のなかにある自然の要衝を、防壁や塔で要塞化することで、武力での制圧を目論む侵略者たちに地獄を見せる準備を整えた。どの渓谷から攻めてこようと、その先には防衛体制の敷かれた道が待ち受けており、またその道を上がってこれたとしても、丘の頂上には砦が待ち構えている。この砦を落とさないかぎり、それ以上の進軍は不可能であり、招かれざる軍隊は必ずやこの山々を敵に回すこととなる。"
 sal_the_alpine_regiments: "アルプス連隊"
 sal_the_alpine_regiments_desc: "我々の兵士たちは山での戦いを想定した厳しい訓練によって鍛えられており、人数よりも忍耐力と規律が重要であること、そして戦友の大切さを誰もが心得ている。その甲斐あって、我らが侯爵領の高地連隊の堅実さは、平時でさえも追い求められるほどの高い評判を築き上げた。この軍事的伝統こそが、我々を今日まで守りつづけてきた盾なのだ。"
 sal_the_alpine_crafts: "アルプスの工芸品"
 sal_the_alpine_crafts_desc: "我らが侯爵領の高地の村々には、古くから熟練した職人技術で生計を立ててきた歴史があり、その高品質の品々は麓の平地の市場に並べられてきた。こうした職人たちの知識は一族やギルド内で受け継がれ、各世代がアルプスの工芸品の伝統を、そっくりそのまま次世代へと継承させることのできる仕組みができている。この産業によって、地域の共同体の繁栄が支えられており、どんな政変が起こっても揺らぐことのない、高品質な品を生み出す高地の町という評判が確立されている。"
 #Italian Formables
 #Sardinia
 sar_the_giudicati: "ジュディカーティ"
 sar_the_giudicati_desc: "我が島はかつて、それぞれ独自の法廷、法律、そして内発的に築かれた統治の伝統を持つ、四つの自治的な裁判侯国、#italicジュディカーティ#!に分かれていた。その時代は過ぎ去ったが、そこで培われた自主行政の習慣は、我らの制度と民の中に深く根付いている。我らの主権的自治の伝統は、上から宣言されるのではなく、すべての臣民が肌で感じる正統性を我が国家に与えている。"
 sar_the_stamenti: "スタメンティ"
 sar_the_stamenti_desc: "「スタメンティ」と呼ばれる我々の議会は、地中海世界においても特に歴史の長い代議員会であり、教会内、軍人貴族、王都の三つの異なる院に分かれて立法審議をおこなっている。この構造によって、主たるすべての有権者層が島の統治方法について発言権を持つことができ、対立が生じてもそれらを紛争に発展させず、所定の手続きを踏んで処理できる体制が整っている。このような構造化された代議制度のおかげで、今日においてもなお、商人や市民階級の者たちでも国家の安定に貢献できる環境が維持されている。"
 sar_university_of_cagliari: "カリアリ大学"
 sar_university_of_cagliari_desc: "我が首都に大学を創設することで、本土で長らく享受されてきた学問の機構を、我が島の人々にもたらす。ここで養成された法律家、医師、行政官はもはや海外で教育を求める必要がなく、彼らの才能は遠方の宮廷を富ませることなく我らの奉仕に留まる。この教育への献身は、我が統治階級の識字率と能力を高め、我が島をより複雑化する世界の要求に備えさせる。"
 sar_sardinian_tercios: "サルデーニャの歩兵部隊"
 sar_sardinian_tercios_desc: "我が歩兵は、崩すのに途方もない犠牲を要する粘り強さで、この時代の戦場において名声を得てきた。彼らは他の者ならば放棄するであろう陣地を守り、他の者ならば敢えてしないであろう攻撃を押し進める。我々はこの伝統を、槍と銃で訓練された規律ある隊形へと歩兵を組織することで制度化し、我が兵たちを常に際立たせてきた戦闘資質の上に築き上げる。この軍事的気風は、我らが行ういかなる作戦の背骨ともなる、類まれな士気を備えた軍を生み出している。"
 sar_enlightened_reforms: "見識者が勧める改革"
 sar_enlightened_reforms_desc: "一世代にわたる行政官たちは、我が潜在力が時代遅れの法律、不均等な課税、そしてあまりに多くの臣民を国家の生活に参加できぬままにしている識字率の格差によって制約されてきたという結論に達した。我々はこれらの制度を体系的に改革し、租税台帳を整備し、教育を拡充し、免税特権をより明快で公正な法体系へと置き換えることを約束する。この行政の近代化は我が歳入を増大させ、我が民を変容する世界の要求に備えさせる。"
 sar_the_cavalcadores: "軽騎兵部隊"
 sar_the_cavalcadores_desc: "サルデーニャの内陸部、とりわけカンピダーノ平野では、世界と競えるほどの騎馬文化が育まれている。「サルティリア」をはじめとする馬術試合は、単なる娯楽ではなく、傑出した馬術と出兵体制が整っていることを示すために催されるものだ。こうした文化があることで、我々は機動力に長け、不安定なカルスト地形を移動できる能力を備えているとして有名な、精鋭の軽騎兵部隊にして、わが軍における最高の偵察部隊である「カヴァレッジェリ・デ・サルデーニャ」を持つに至った。"
 #Tuscany
 tus_il_contado: "コンタード"
 tus_il_contado_desc: "#italic コンタード #!(各都市を取り囲む農村地帯)は、長らくトスカーナの富と権力の基盤であり、その村々、城、農地は法と慣習によって城壁内の都市領主に従うものとされてきた。農村部に対する我らの統治権を制度化することで、散在する封建的義務を、農業余剰、軍事人員、直接収入からなる一貫した体制へと変えるのである。このコンタードの掌握こそが地主階級の間での我らの正統性を支え、我らが統治を主張する土地の隅々にまでその手を伸ばす礎となる。"
 tus_il_catasto: "カタスト・フィオレンティーノ"
 tus_il_catasto_desc: "我らは #italic カタスト #! の編纂を命じる。これは中世ヨーロッパのいかなる政府も成し得なかった、最も包括的な富と財産の調査であり、最も裕福な商人から最も貧しい職人に至るまで、すべての市民と家計の課税対象資産を記録するものである。我らの財政基盤の全容を明らかにすることで、カタストはかつてない公平さをもって課税の負担を分配することを可能にし、旧来の派閥的な操作を、透明で強制力ある査定に置き換える。この改革は臣民の信頼を勝ち得て統治の費用を軽減し、後のトスカーナ統治者たちが拠り所とする行政の精密さの基準を打ち立てるのである。"
 porto_franco: "ポルト・フランコ"
 porto_franco_desc: "我らは主要な港をあらゆる信仰と民族の商人に開放する。アルメニア人、ユダヤ人、ギリシア人、フランドル人――他の地中海諸港が課すような宗教的条件なしに、すべてを歓迎するのだ。この自由さは熟練した商人や金融業者を引き寄せ、彼らの定住は我らの都市を富ませ、より閉鎖的な港では扱いきれぬ品々で交易路を満たす。こうして我らの国際色豊かな港は、ささやかな沿岸の港から西地中海で最も活気ある商業中心地の一つへと成長し、人口と資本を我らの岸辺へと呼び寄せるのである。"
 tuscan_uffizi: "ウフィツィ美術館"
 tuscan_uffizi_desc: "我らが新たなる大公国の行政の中枢として #italic ウフィツィ #! の建設を命じたことは、単なる政庁の設立にとどまらず、我らの権勢を示す舞台の創出でもある。その長い回廊はやがて古代の遺物、彫像、絵画で埋め尽くされ、統治者の王朝が政治と美の双方に長けていることを示すであろう。同時に市内では、ヴェッキオ宮殿に秘密の工房を設け、錬金術師と職人たちが欧州初となる軟質磁器を完成させ、中国から多大な費用をかけて輸入される貴重な品々に対抗せんとしている。この行政と職人技の両野心の双璧こそが我らの後援の頂点を成し、大公たちの下でのトスカーナが権勢のみならず洗練の中心でもあることを、キリスト教世界のあらゆる宮廷に知らしめるのである。"
 accademia_cimento: "アカデミア・デル・チメント"
 accademia_cimento_desc: "我らが大公は #italic アッカデーミア・デル・チメント #! 、すなわち実験アカデミーを創設し、時代随一の科学の俊英たちを実証的探求のために一堂に集めた。その会員たちは「#italic プロヴァンド・エ・リプロヴァンド #!」(試み、そして試み直す)という標語に結ばれ、知の探求における新たな基準を打ち立てている。同時に大公国は、トスカーナの諸自治体を改革し、地方特権の寄せ集めを、あらゆる町や谷にまで国家の権威を行き渡らせる画一的な行政手続きへと置き換えつつある。この科学的野心と行政的厳格さの結合こそが、我らが公国を、思想と統治がともに同じ厳しい実証の基準に従う国家として定義づけるのである。"
 tuscan_physiocratic_reforms: "トスカーナの重農主義的改革"
 tuscan_physiocratic_reforms_desc: "トスカーナの統治者は、土地と農業こそがあらゆる富の真の源であるとする重農主義的な方針に基づいてこの地を治めている。これから農奴制やギルドの独占権が廃止されるほか、穀物取引を国家の管理対象から外し、商人や貴族の特権ではなく土壌の生産性を基準とした税収制度が再編されることとなる。合理的な統治体制を敷こうとするこの精神のもと、国の商業文化の改革も進んでいることから、商品の移動を制限していた内部的な障壁が解体され、ギルドの特許状で除外されてきた交易にも市場が開放されるようになった。土地と商業における総合的な改革によって、トスカーナは見識ある行政の手本を提示する国にして、合理的統治の実験場となり、ヨーロッパ各地からトスカーナに学び、模倣しようとする者たちが集まるようになっている。"
 #Two Sicilies
 tws_unified_legal_code: "統一された法典"
 tws_unified_legal_code_desc: "わが国を構成する領土は、法の不当な適用によりたびたび反乱に見舞われてきた。今後このような事態を防ぐためにも、法典を統一し、わが国の法を公正に運用しなければならない。そうすれば、いかなる蜂起も大きな混乱を呼ぶ前に食い止められるだろう。"
 tws_ensure_loyal_families: "貴族一門の忠誠"
 tws_ensure_loyal_families_desc: "両シチリアの諸貴族は、我々に代わって大きな権力を振るっている。彼らに名誉こそ高いが実権を伴わない宮廷職を与えることで、その忠誠心を確保し、地方支配の安定を保証できるだろう。"
 tws_revitalize_the_lands: "新たな人材の誘致"
 tws_revitalize_the_lands_desc: "これまでの統治者たちは、わが国のごく一部の地域にばかり目を向けていた。我々が両シチリアの支配を維持したければ、両方の地域に等しく公正な投資をしなくてはならない。その第一歩として、これまで顧みられなかった土地に人々を呼び込み定住させ、活力を取り戻させる必要がある。"
 tws_capable_vicars: "有能な司教代理"
 tws_capable_vicars_desc: "統一されたわが国にとって、とりわけ厄介なのはメッシーナ海峡の両岸の統治である。統治者は両側の土地に身を置くことはできないため、片側は我々の名のもとに統治する司教代理に委ねるしかない。この重要な地位には特に有能で信頼できる者のみを任命し、腐敗を防がなくては。"
 tws_oversea_ambitions: "外国への領土拡大"
 tws_oversea_ambitions_desc: "イタリア本土での領土拡大は困難な課題である。複雑な同盟関係を処理しなければならず、教皇その人の怒りを買うおそれもあるからだ。よって、わが国は海の彼方に目を向けるべきだ。北アフリカやギリシャの土地は、莫大な富を生む可能性がある。"
 tws_protect_the_coastline: "海洋巡回の強化"
 tws_protect_the_coastline_desc: "わが国の海岸線は広大で、奴隷を狙う海賊の襲撃に対してあまりにも無防備である。沿岸を哨戒し、民を守り、いずれはこの忌まわしい海賊を打ち砕くことのできる、新たな海軍を創設しなくてはならない。"
 #Italy Formable Advances
 ita_connect_the_interior: "内陸部との連結"
 ita_connect_the_interior_desc: "わが国の地形は海岸線沿いの迅速な輸送と移動を可能にする一方で、イタリア半島の内陸部にある多くの場所は行き来がはるかに困難である。内陸の各拠点だけでなく、海岸同士を結ぶことで、商業活動円滑化や軍の機動力向上が期待できる。"
 ita_increased_recruitment: "貴重な領土"
 ita_increased_recruitment_desc: "$italy_region$は、数多くの他国の統治者が欲する土地だ。わが国を守るためには、陸海両軍の兵力を増強しなければならない。アルプス越えや広大な海岸線からの侵攻に脆弱なこの地では、半島の平和を乱そうとするいかなる征服者にも立ち向かえるよう、陸海軍の万全の備えが不可欠だ。"
 ita_flourishing_urban_centers: "栄える都市"
 ita_flourishing_urban_centers_desc: "わが国には高度に都市化した地域が数多くあり、交易品の製造にうってつけであるというだけでなく、交易網を通じて製品を外国市場へと運ぶことも可能になっている。これらの産業の拡大を阻むあらゆる障害を取り除けば、継続的な発展を保証できるだろう。"
 ita_influence_over_the_clergy: "影響力のある聖職者"
 ita_influence_over_the_clergy_desc: "$papacy_reform$に近接する$italy_region$では、信仰に身をささげる有力で才覚ある聖職者の長きにわたる伝統がある。宗教に関する事柄が我々をどういう状況へと導くにせよ、聖職者とは良好な関係を維持すべきだ。"
 ita_enduring_hardship: "戦争の苦難"
 ita_enduring_hardship_desc: "$italy_region$の外国勢力は、幾度となく我らの地を強国の戦いの舞台としてきた。このような困難な時期に民を支えることは容易ではない。戦乱時に民を守れる安全な拠点を確保すれば、極めて悲惨な戦争のあいだであっても民の支持を得られるだろう。"
 ita_attractive_migration: "魅力ある風土"
 ita_attractive_migration_desc: "わが半島の肥沃で温暖な地は、周辺諸国から人々が富を求めて集まる人気の場所である。都市の多くはすでに季節労働者に依存しているが、我々はこういった人々を恒久的に定住させる取り組みをさらに強化すべきである。"
 #Italy Region
 italy_great_families: "イタリアの名門家"
 italy_great_families_desc: "単一のイタリア国家を建国したあと、我々は多くの名門貴族の家系をわが国に取り込んだ。彼らの名声と威信を利用して我らの権威を高めるとともに、有能な人材を適切な役割に就かせるべきである。"
 italian_condottieri: "コンドッティエーリの偉大なる指揮官"
 italian_condottieri_desc: "わが国の卓越した指揮官たちは、己の利益や、高い報酬を払う者のために栄光ある軍隊を率いてきた。こうした人材がまず第一に我々に仕えるよう、つねに備えを怠ってはならない。"
 genoese_crossbowmen: "$a_genoese_crossbowmen$"
 genoese_crossbowmen_desc: "$a_genoese_crossbowmen_desc$"
 genoese_galley: "$n_genoese_galley$"
 genoese_galley_desc: "$n_genoese_galley_desc$"
 italian_galleass: "$n_italian_galleass$"
 italian_galleass_desc: "$n_italian_galleass_desc$"
 #Maghreb Region Advances
 #Algerian Shared
 algerian_hilali_settlement: "ヒラル族の定住"
 algerian_hilali_settlement_desc: "バヌー・ヒラールとバヌー・スライムのアラブ諸氏族は、数世代をかけてエジプトから西へと進み、中央マグリブのサンハージャ族やザナータ族のベルベル人の間に定住し、吸収した住民に自らの方言と部族系譜を押し付けた。我らのシャイフたちはヒラーリーの血縁構造を取り入れ、我らの谷々は牧地と村落をめぐる交渉による取り決めによって分割され、古いベルベル語は牧歌と地名にのみ残る基層言語へと退いていった。このようにアラブとベルベルを融合させることで、中央マグリブのテルには部族的・系譜的秩序がもたらされ、我らの文化を、より内陸のゼナティやカビールの高地的アイデンティティから際立たせているのである。"
 algerian_tell_wheatlands: "テル地方の小麦地帯"
 algerian_tell_wheatlands_desc: "ミティジャ、シェリフ渓谷、スンマーム、そしてコンスタンティーヌ南方のなだらかな大地に広がるテル地方の平野は、我らの沿岸都市を養い、国家公認の輸出を通じて中央財庫を支える小麦の収穫を生み出す。フェラーヒンたちは世襲の土地保有の下で灌漑された低地を耕す。収穫期の終わりには協同の脱穀場が収穫物を集め、国家公認の穀物倉庫が、雨水頼みのテルが時に見舞われる不作の年を埋め合わせる。輸出用の小麦は、より牧畜的なマグリブの地が決して満たし得なかったほどに我らの都市の国庫を潤すのである。"
 algerian_carpet_weaving: "絨毯織り"
 algerian_carpet_weaving_desc: "カラア・ベニ・ラシェドの絨毯織り職人やムザブ渓谷のベニ・ミザブから、アルジェとコンスタンティーヌの都市同業組合に至るまで、我らのベルベル人とアラブ人の織工たちは、地中海と サハラ越え交易の両市場が独特のマグリブ的性格ゆえに特に注文する幾何学模様の毛織物を生産する。テルの群れから得られる羊毛を我らの紡ぎ手が加工し、我らの染色職人はインディゴ、アカネ、ヘナを調合して、この地方特有の美意識を定義する鮮やかな赤と青を作り出す。結び職人たちは、師から弟子へと代々伝えられてきた文様を織り上げていく。我らの絨毯はその文様の多様さと色の堅牢さゆえに地中海一帯で珍重され、都市の同業組合はその輸出によって富を築くのである。"
 algerian_makhzen_tribes: "マフゼンの部族"
 algerian_makhzen_tribes_desc: "我らと同盟関係にある諸部族――バヌー・ヒラールの末裔たるベドウィン諸連合は、歴史的に牧地の権利と穀物供給を確保し得るアルジェリアの政体に味方してきたが、これらが我が中央軍の軽騎兵と、純然たる都市行政では決して築き得ない部族間連絡網を提供する。最高位のシャイフたちは正式な宮廷称号を保持し、毎年の俸給が部族の軍勢を国家に結びつける。有力な部族家系との婚姻同盟が、テル一帯にわたる徴募圏を確保する。このマフザン体制こそが我が軍勢を騎手で満たし、より中央集権的なマグリブの競争相手には成し得ぬ形で辺境の部族を我らに結びつけるのである。"
 algerian_qadiriyya_expansion: "カーディリー教団の拡大"
 algerian_qadiriyya_expansion_desc: "我らが二大スーフィー教団のうち古参である #italic カーディリーヤ #! 教団は、バグダード系統を通じてアブドゥル・カーディル・ジーラーニーにまで遡り、テルと草原辺境地帯における農村の宗教的・司法的権威を支えている。我らのザーウィヤは辺鄙な村のモスクでコーラン学者を育成し、我らのシャイフたちは都市のカーディーが法の力だけでは解決し得ない部族間の紛争を調停し、我らの道場は辺境の部族を庇護教団に結びつける忠誠の誓いの網を提供する。この農村への根付きこそが、純然たる都市の法廷が手の届かぬ教義と法の事柄において、この教団が調停を行うことを可能にしているのである。"
 algerian_tijaniyya_birth: "ティジャーニーヤの誕生"
 algerian_tijaniyya_birth_desc: "中央アルジェリアの草原地帯アイン・マディーでアフマド・アッ=ティジャーニーによって創設された #italic ティジャーニーヤ #! 教団は、光の #italic シルシラ #! (系譜)という独自の教義と、マグリブ全域に急速に広がる支部ザーウィヤの網を持つ、アルジェリアの地に固有に生まれたスーフィー教団として台頭する。我らの開祖はアルジェリアの砂漠で啓示の幻視を受け、教団が西へと広がるにつれフェズとトレムセンに最初の姉妹道場が開かれ、我らの学者たちは教団独自の実践を定める教義書を著す。ティジャーニーヤによって、我らの文化は自らの地に生まれたスーフィー教団を誇ることができる。これは同時代の他のいかなるマグリブ文化も主張し得ない栄誉である。"
 #Algerian Unique
 alg_kasbah_citadel: "カスバの要塞"
 alg_kasbah_citadel_desc: "港を見下ろす丘の上に、迷路のような細い路地と密集した家々からなる我らが要塞地区、アルジェの #italic カスバ #! は、あらゆるアルジェリア政権が統治を行う防衛の拠点を提供する。我らの常駐守備隊は陸海いずれからの攻撃に対しても城塞を保持し、我らの貯水槽は長期の包囲に耐えるだけの水と穀物を蓄え、我らの門番たちは下の港が敵の手に落ちた場合でも上の町への出入りを統制する。このカスバから我が国家は、より開放的なマグリブの沿岸都市とは異なり、敵が容易には奪えぬ堅固な拠点から統治を行うのである。"
 alg_thaalibid_descent: "サアーリビー家の血統"
 alg_thaalibid_descent_desc: "我が王朝、バヌー・サアーリビーは、シーディ・アブドゥッラフマーン・アッ=サアーリビーとその祖先を通じ、モロッコのイドリース二世、そして預言者の孫ハサンにまで遡る家系であり、いかなるベルベル王朝も預言者的・系譜的権威において及ばぬ #italic シャリーフ #! の血統を中央マグリブに打ち立てている。我が宮廷の系図学者は即位のたびにその血統を認証し、あらゆる #italic バイア #! の儀式でのその系譜の唱和が聖職階級を統治一族に結びつけ、シャリーフの主張をめぐる我が貴族とウラマーの合意は、あらゆる内紛の継承争いを乗り越えて存続する。原初の $ALG$ の家系が持つシャリーフの血統は、系譜という事実に根ざした神聖な正統性を与えるが、単なる一国家としてアルジェを統治する後継者はこれを決して主張し得ない。"
 zab_sidi_okba_shrine: "シディ・オクバ廟"
 zab_sidi_okba_shrine_desc: "カイラワーンの創建者であり、マグリブへ最初のアラブ軍を率い、我らの南部の村シーディ・ウクバに葬られている #italic ウクバ・イブン・ナーフィウ #! の墓は、マグリブのいかなる王朝よりも古い宗教的権威を持つ聖なる巡礼地の中心をなしている。我らの常駐の廟守がこの墓を守り、毎年の巡礼は西イスラーム世界全域からザーウィヤの学者や名士たちを引き寄せ、我らのウラマーは、我らの実際の政治的支配を遥かに超えて人々を拘束する法学的見解において、この開祖の権威を引き合いに出す。この開祖の聖廟は、我が国家に、古く、かつ預言者的な征服者その人に結びついた神聖な正統性への主張を与えるのである。"
 alg_algiers_emporium: "商業都市アルジェ"
 alg_algiers_emporium_desc: "アルジェは中央マグリブの中心的な沿岸交易拠点として台頭する。ピサ、ジェノヴァ、アラゴン、プロヴァンスの商人たちは我らの港に駐在代理人を置き、キリスト教徒との交易から得られる関税収入は内陸の貢納収入に匹敵する。港の前庭では我らの造船工たちが沿岸交易船と、我らの船長たちが乗り組む初期の軍船ガレー船の両方を建造する。我らの商人組合は、テルの後背地と地中海市場の間を流れる羊毛、蝋、皮革、珊瑚、そして奴隷を仲介し、我らの領事と条約の制度は、訪れる外国人代理人に正式な居住権と司法上の保護を与える。この商業的台頭から、後のコルセア国家の礎となる港湾収入と船乗りたちが生まれるのである。"
 alg_thaalibid_emirate: "サアーリビー首長国"
 alg_thaalibid_emirate_desc: "アルジェを治めたサアーリビー朝は、バヌー・サアーリビー一族の宗教的・政治的権威の下で宣言され、シェルシェルからデリスに至る中央マグリブ沿岸全域に国家の権力を及ぼし、アラゴン、ジェノヴァ、ハフス朝の近隣勢力との継続的な外交・通商関係を保った。これは後の摂政国が王朝的な連続性においてではなく、形式において受け継ぐものである。我が宮廷の尚書局は正式な #italic capitulations#! の下でキリスト教諸勢力と封印状を取り交わし、我が港は交渉された居住権の下で外国人代理人を受け入れる。我が貨幣に刻まれたシャリーフの称号は、我が統治をザイヤーン朝のトレムセンやハフス朝のチュニスと一線を画するものとしている。摂政以前の首長国として、原初の $ALG$ の家系は真の国家として統治する永続的な権利を保持するが、この主張を同じ王朝的な意味で回復する後継政府は存在しない。"
 zab_zibane_palmery: "ジバンのナツメヤシ園"
 zab_zibane_palmery_desc: "我々のオアシス地帯、ビスクラとトルガからシディ・オクバ、ブー・サアダを経てウレド・ジェラルまで広がる#italicジバーン#!のナツメヤシ園は、マグリブおよびサハラ越え市場がその大きさと甘さ、保存性の良さゆえに特に求める実を産する。果樹園主らは個々のヤシ区画を代々の借地として保持し、灌漑組合の者たちは古来の分配表に従って井戸水を割り当て、隊商頭たちは産地の果樹園と収穫年によって各荷の値を定める。ジバーンのヤシ地帯は、マグリブの他のいかなる果樹栽培地域も奪い得ぬ高級ナツメヤシ交易を支えている。"
 alg_corsair_emergence: "海賊の台頭"
 alg_corsair_emergence_desc: "コルセア(私掠船)の伝統がアルジェに根付く。地中海各地の船長たちが国の認可を得て我々の港に居を構える。我々の造船工は外洋での襲撃戦に求められる快速のガレー船やガリオット船の建造を専らとし、船長組合は私的な略奪を国家組織の産業へと変える戦利品分配の規則を定める。改宗したキリスト教徒、ギリシャ人、イタリア人の船長たちは現地のライースと肩を並べて仕え、我々の市場は奪った積荷や身代金目当ての捕虜を再輸出し、我が王室はあらゆる成功した戦利品からその取り分を得る。コルセアの台頭とともに、アルジェは独自の海上戦争経済を築き上げるが、より農業に根ざしたマグリブの競合国にはこれに類するものがない。"
 alg_thaalibid_resistance: "サアーリビー家の抵抗"
 alg_thaalibid_resistance_desc: "我が首長国は、中世末期にアルジェへと迫る幾重もの外圧に抗している。スペインの沿岸襲撃とシスネロス枢機卿の遠征、宗教的連帯を口実に拠点を求める外国のコルセア船長たち、そして我々を朝貢網に組み込もうとする折々のハフス朝・ザイヤーン朝の隣国である。我々は財庫が維持を学んだ練達の傭兵団とコルセア団を抱え、我が沿岸に築かれたあらゆる外国の拠点、とりわけスペイン占領下の #italic ペニョン #! に対して攻囲を続け、我が外交官は次々と押し寄せる波を越えて自治領を保つ一時休戦を交渉する。この尚武の伝統から、本来の $ALG$ の家系は海外遠征の遺産を受け継ぎ、後の摂政(デイ政権)が皮肉にもそれを受け継いで同じ列強へと差し向けることになる。"
 zab_saharan_terminus: "サハラ交易の終着点"
 zab_saharan_terminus_desc: "我がオアシスは西サハラ隊商路の北の終着点に位置する。トゥアト、トゥグルト、中央サハラからの隊商はビスクラに集結した後、北はコンスタンティーヌとチュニスへ、東はハフス朝領へと向かう。その間、我が商家は南行きの行程に、テルからの穀物、布、塩、陶器を供給する。我が隊商宿はサハラ以南、ベルベル、マグリブの商人たちを分け隔てなく迎え入れ、税関吏は通行する荷に手頃な率で課税し交易路の利益を保ち、我が外交文書は隊商路に関わる諸部族を我が評議会の仲裁に縛り付ける。砂漠の道の果てに位置するこの地によって、我がオアシスは純粋な農業オアシスには決してなり得ない、商人と使節の都市となる。"
 alg_corsair_state_economy: "私掠国家の経済"
 alg_corsair_state_economy_desc: "コルセア国家経済はその成熟した形に至る。王室はあらゆる戦利品狩りの船長に認可を与え、あらゆる成功した襲撃から一定の取り分を得る。我が造船所は、船長たちが国家から戦利品分配の条件で借り受ける標準のガレー船、ガリオット船、ゼベック船の各型を生産する。我が徴募員は次の戦利品周期を見込んだ国庫出資の前払金によって外国人船長と乗組員を我が港へ引き寄せ、海軍行政庁は地中海諸強国すべての戦争状態を把握して襲撃の方針を定め、我が中央財庫は関税と貢納の流れと同じほど戦利品収入の周期に依存する。この国家組織によるコルセア経済は、地中海のより伝統的な通商国家には成し得ぬ安定ぶりで、我が国庫を戦利品で満たす。"
 alg_native_restoration: "旧王朝の復活"
 alg_native_restoration_desc: "外国人士官による空位期とそれに続く動乱の後に王座へ復した我が王朝は、本来のタアーリビー家が滅びる前に有していた固有のアルジェリア主権を再び確立する。我が宮廷は摂政政権の尚書局が途絶えさせていた外交網を再建し、我が使節は復興したシャリーフ正統性のもとで地中海およびサハラ越えの諸強国と再び交わる。学者史家たちは、この復興を途切れぬ正統の系譜として正当化する年代記を著す。この復興は本来の $ALG$ の家系の外交的影響力を新たにし、単なる国家権力に拠る後継者たちには決して集め得ぬ権威をもたらす。"
 zab_foggara_irrigation: "フォガラ灌漑"
 zab_foggara_irrigation_desc: "砂漠の砂の下に掘られ、高地の地下水位からオアシスの庭園へ水を導く地下水路網、すなわち #italic フォガーラ #! は、我がオアシス評議会の調整のもとで拡張・更新され、従来の地表灌漑の範囲を超えて新たな耕作地を切り開く。フォガーラ掘削人の組合は、水路建設の技術を世襲の徒弟制によって伝え、定住する村々は清掃の輪番のために賦役を提供し、オアシス評議会は新たな水路が必然的に引き起こす分水をめぐる争いを仲裁する。フォガーラが広がるにつれ、我がオアシスは地表灌漑に頼る競合オアシスよりも多くの耕作地と人口を得る。"
 alg_consolidated_deylik: "デイ領の統合"
 alg_consolidated_deylik_desc: "デイ政権は安定した政治秩序に落ち着く。#italicデイ#!はジャニナ宮殿より統治し、地方の#italicベイ#!たちは貢納と兵を納め、イェニチェリ軍団が軍隊として立ち、コルセア船長組合はデイの選出において発言権を保つ。幾世代にもわたるクーデターと交代制の士官支配を経て、財庫、戦利品認可局、外交局はついに単一のバルド宮殿の官僚機構のもとに統一される。安定したデイ政権は、旧来の交代制士官統治では到底維持し得なかった秩序をもって我が国を治める。"
 alg_thaalibid_sultanate: "サアーリビー・スルタン国"
 alg_thaalibid_sultanate_desc: "復興されたアルジェリア王国が完全な主権国家へと成熟するにつれ、我が王朝はスルタン位へと高められ、ハフス朝やマリーン朝の君主たちが帯びたのと同じ称号と儀礼作法を主張する。それはいかなる交代制士官政権も及び得ぬ、途切れぬ王朝的・血統的連続性によってイェニチェリ推戴のデイ政権の形態とは一線を画す。バルド宮殿に相当する我が宮廷では正式な即位式が執り行われ、我が学者たちはこのスルタン位の主権主張を法学注釈にまとめる。貴族たちの合意は軍団選出ではなく王朝への忠誠によってこの国家を結びつける。かくして本来の $ALG$ の家系は、イェニチェリ推戴に根ざしたデイ摂政には決して成し得なかった形で、そのシャリーフ正統性の主張にふさわしい統治を行う。"
 zab_biskra_fair: "ビスクラの大市"
 zab_biskra_fair_desc: "トゥアトからのサハラ隊商、コンスタンティーヌからのサヘル商人、ニジェール川湾曲部からのサハラ以南の奴隷商人、そして草原辺境のベドウィン牧畜民を一堂に集める毎年恒例のビスクラ秋市は、秋の数週間、我がオアシスの首邑を地域商業の中心地へと変える。天幕が交渉の場となる。税関はあらゆる取引を計量し記録し、商人組合はすべての参加者が従うべき標準の秤と検定分銅を定める。ビスクラの市は定められた時季に隊商を集め、彼らの自然な会合の地を国家が管理し課税する市場へと変える。"
 alg_consular_relations: "領事外交"
 alg_consular_relations_desc: "地中海と大西洋の主要な強国すべてが正式な領事館をアルジェに置き、それぞれと条約を定期的に更新し、それに伴う贈り物と支払いの慣例を伴う我が領事関係の体制は、いかなる一度の敗北によっても御しきれぬほど強大な競争相手との関係を取り仕切る。デイは定められた礼法のもとで領事団を謁見する。我が尚書局は複数の言語にわたる継続的な文書を保管し、税関は条約を結ぶ各国の商人が享受する差別関税を管理する。領事と条約をもって、アルジェは近代の多くの外国勢力と柔軟に渡り合うが、より孤立した北アフリカ諸国は独りで立たねばならない。"
 alg_thaalibid_revival: "サアーリビー家の復興"
 alg_thaalibid_revival_desc: "我が改革派の人々は、タアーリビーの遺産を近代アルジェリア国家の思想的・文化的支柱として復興させ、イェニチェリの空位期以前、固有のシャリーフ王朝が中央アルジェリアを治め、地中海世界と絶えず外交・通商の関わりを持っていた幾世紀を呼び起こす。パンフレット著者たちはタアーリビーの年代記を現代アラビア語版として出版し、教師たちは初期近代のアルジェリア史をマグリブ全体の正統的な物語と並べて教える。アルジェのシーディー・アブドゥッラフマーン廟の周りでは、学者の集いが、いかなる政治的断絶も完全には消し得なかった途切れぬ宗教的・文化的権威を保っている。タアーリビーの復興は、本来の $ALG$ の家系に、国家権力のみに拠る近代化運動には欠ける独自の遺産と思想を与える。"
 zab_rahmaniyya_expansion: "ラーマニヤの拡大"
 zab_rahmaniyya_expansion_desc: "シーディー・ムハンマド・イブン・アブドゥッラフマーン・アル=アズハリーによって中央カビリー地方で創始され、オーレス山麓を経て南へと広がった#italicラフマーニーヤ#!教団は、幾世代もの間に我がオアシス地帯全域に支部のザーウィヤを築く。我が地の定住シャイフたちはラフマーニーヤの入信を受け入れ、我が学者一族はカビリーおよびアルジェリアの中心地から弟子を迎え、我が巡礼商人たちは諸地方を結ぶ文通を保ち、教団の散在する修道場を一つの宗教網へと結びつける。ラフマーニーヤの修道場を通じて、学生とシャイフたちは我がオアシスと中央アルジェリア高地との間を自由に行き来する。"
 #Amazigh Shared
 tamazight: "タマジクト"
 tamazight_desc: "東はジェルバ島とマトマタ高地から、高原地帯の #italic Zenata #! 諸部族連合を経て、大西洋のカナリア諸島の #italic menceyatos #! に至るまで、アマズィグ語を話す諸共同体は、この広域へのアラブおよびカスティーリャの征服よりはるかに古くから続くタマズィグト語族、慣習法、牧畜による羊毛経済を守り続けている。我が織工たちは本土と島の群れから得た長い繊維を、いかなる都市の産業も及ばぬ頑丈な織物、天幕の布地、ブルヌースへと仕立て上げる。一方、我が部族評議会と #italic menceys #! たちは、いかなる外部の法体系からも独立した慣習裁判の体系を並行して維持している。サハラのオアシスから大西洋の島々に至るベルベル系の諸共同体にとって、言語・家畜・織物という二重の文化的・経済的遺産は、都市化したマグリブおよびイベリアの主流社会と並行しつつも、それとは独立して存続している。"
 amazigh_group_agraw_council: "アグラウ評議会"
 amazigh_group_agraw_council_desc: "我が村落の会議──カビリー高地の #italic agraw #!、マグリブ全域の #italic ジュマーア #!、サハラの諸部族連合の #italic タグラルト #!、カナリアのメンセヤートの #italic タゴロル #!──は、各戸の長を集め、水利権、家畜の移動、血の償い金の取り決め、そして我が門前に現れるいかなる外部権力への対応についても協議する。会議で下された決定は参加したすべての氏族を拘束し、王権による押収の恐れのある文書台帳にではなく、集った #italic イムガッセン #! 長老たちの口承の記憶に記録される。この合議の慣行は、あらゆる些細な争いを鎮圧する費用を我が王権から免れさせ、農村に暮らす我が民の大多数を、彼ら自身が導き出した決定に結びつける。"
 amazigh_group_igherman: "イゲルマン"
 amazigh_group_igherman_desc: "我らの集落は #italic igherman #! の形を取り、我々が暮らす各地の風土に合わせた石造りの要塞村である。すなわち、ハイアトラスの版築造りの #italic qasbah #! 、南部オアシスの幾重にも重なる #italic ksar #! 、カビリー山地の塔状住居 #italic taddart #! 、カナリア高地の城壁を巡らせた #italic tagoror #! である。各集落は、そこに住む家族たちの共同作業によって築かれ、共有の穀倉、望楼、避難用貯水槽が、攻め手が我が全領土にわたって一つ一つ攻囲するには割に合わぬ城壁の内に集められている。この分散した防御建築により、我が中枢地域への侵攻は法外に高くつくものとなり、いかなる帝国の遠征も、その主力が何事かを成し遂げる遥か前に消耗させられる。"
 amazigh_group_taqbilt_solidarity: "タクビルトの結束"
 amazigh_group_taqbilt_solidarity_desc: "#italic taqbilt#!、すなわち共通の始祖から血脈を分かつ父系氏族の網は、あらゆるアマジグ連合における政治生活の基礎単位である。海外へ移住した氏族も本国連合における地位を保ち、使節や情報、そしてセネガンビアからアナトリアに至るまで我らが同胞を結びつける歓待の網をもって報いる。この血縁の絆により、我が王室の使節と盟友はマグリブ、サヘル、地中海の各地に及び、いかなる個々の君主の権威をも超え、どのような王朝の危機を経ても持続する広がりを得るのである。"
 amazigh_group_levy_traditions: "部族徴募の伝統"
 amazigh_group_levy_traditions_desc: "アマジグの各世帯は、集会が動員を宣言した際には武装した戦士一名を村の召集に供する義務を負い、村の鍛冶師が武具を調え、女たちは干し肉と煎った穀物の糧食を用意し、長老たちが行軍の順を定める。この徴募は給与制の常備軍が要する数週間ではなく数日のうちに応じ、隊長には己が氏族の者のみを受け入れ、遠征が終われば速やかに解散し、常備軍のような恒常的な費えを生むことがない。慣習に基づく動員は、中央集権化を進める隣国の規律正しい連隊よりも、召集への応答が速く、費用もはるかに少なくて済むのである。"
 amazigh_group_tifinagh_revival: "ティフィナグ文字の復興"
 amazigh_group_tifinagh_revival_desc: "シ・アマール・ブリファに率いられたカビール人学者、ホッガルのトゥアレグ写字生、ムザブの学校教師ら、我らが十九世紀の知識人たちは、サハラの岩面刻画、トゥアレグのヴェール護符、陶器の刻印から祖先伝来の#italicティフィナグ#!文字を復興し、幾何学的な字形を近代印刷のために標準化した。我らは、あらゆるアマジグ連合の子らがアラビア文字もラテン文字も主張し得ぬ独自の文字で己がタマジグト方言を綴ることを学ぶ、文字の学び舎を開く。この言語的・文化的な復興は、カナリア諸島から中央サハラに至るまで散らばったベルベル世界を、中央集権化を進める欧州列強が引き裂こうとしても容易には果たせぬ、共通の近代的アイデンティティへと結びつけるのである。"
 #Amazigh Unique
 ahg_hoggar_massif: "ホガール山地"
 ahg_hoggar_massif_desc: "ホッガル火山山塊（タハト、アセクレム、アタコル）は、我が中央サハラの避難所であり、我が最高連合がここに集い、周囲の塩と砂の平原に権威を及ぼす拠点となっている。我が部族の牧草地は山塊を取り巻き、夏の高地と冬の低地を結ぶ移動経路もここを確実に通る。峰々に築かれた監視塔は、開けた砂漠の数百キロメートル先まで見渡す視界を支配する。この山岳の中心地こそ、$AHG$ 連合の守るべき中枢であり、いかなる純粋に平原出身のトゥアレグの敵対勢力も及ばない場所である。"
 ait_beni_abbas_confederation: "アッバース氏族連合"
 ait_beni_abbas_confederation_desc: "下カビリアのバヌー・アッバース氏族連合は、ビバン山地の高地諸村を単一の世襲首長の下に統合し、集まった #italic タジュマーアート #! を、婚姻同盟、儀礼的誓約、そしてマラブー派シャイフによる宗教的・司法的調停を通じて、創設家に結びつけている。我が首長たちは単一のシャリーフ系始祖の末裔を称し、戦争と和平を協議するため連合の長老たちを中央の要塞化された城塞に召集する。王朝的・宗教的基盤により、我が高地連合は西方の緩やかなカビール系連合とは異なり、政治的な連続性を保っているのである。"
 ajj_tassili_rock_art: "タッシリの岩絵"
 ajj_tassili_rock_art_desc: "タッシリ・ナジェール高原は、サハラ新石器時代の牛群、狩人、儀礼の場面を描いた先史時代の岩絵で飾られ、我が連合にマグリブのいかなる王朝よりも古い、深い文化的・考古学的遺産をもたらしている。我がウラマーは現存する刻文を解釈し、口承伝統はあらゆる主要な岩絵遺跡の名と由来を伝え続けている。学者の家系はイスラームの聖典と並んで、より古いサハラの過去の写本記録を保持している。この岩絵は $AJJ$ に、他のいかなるトゥアレグ連合も主張し得ぬ、己が土に根ざした文化的・歴史的な深みを与えているのである。"
 btl_atlas_pastoralism: "テルアトラス山脈の牧畜"
 btl_atlas_pastoralism_desc: "我が連合は、テル・アトラスの移牧生活によって栄えている。羊、山羊、ラクダは季節ごとにオーレスの高地夏営地とコンスタンティーヌ平原の冬の低地との間を移動し、純粋な農業国家には模倣し得ぬ血縁の経済によって支えられている。我が部族の首長たちは、構成諸氏族の間で交渉した季節的な放牧権を通じてその権威を保ち、我が牧畜の富は、家畜の群れを富とも糧食ともする部族戦士階級を支えている。牧畜は部族民を国家に忠実にとどめ、雨水頼みの収穫とは無縁の繁栄をもたらすのである。"
 cnr_tagoror_councils: "タグオロル評議会"
 cnr_tagoror_councils_desc: "タグオロルが開かれると、各メンセヤトの集会所に各家の長、貴族、各氏族の長老が集まり、水利権、家畜の移動、沿岸に上陸する船への対応を話し合う。この評議会で決めたことは参加したすべての氏族を拘束し、その内容は外部勢力に奪取されるおそれのある文書ではなく、長老たちの記憶によって伝えられる。この伝統により、メンセヤトは細かな争いにいちいち介入する必要がなくなり、農村住民も自ら決めたことに従うようになるのである。"
 dje_ibadi_refuge: "イバード派の避難地"
 dje_ibadi_refuge_desc: "我がオアシス群（トズール、ネフタ、ドゥーズ、エル・ハンマ、そしてショットの小集落）は、東マグリブにおける #italic イバード派 #! 伝統の最後の避難所の一つとして、初期イスラーム数世紀の教義対立を生き延びたハワーリジュ派・イバード派の末裔を庇護している。我が聖職者層は、周囲のマーリク派多数派と並んで独自のイバード派 #italic フィクフ #! を維持し、スンナ派優勢の地域では稀な寛容と宗教的自律を保ち続けている。イバード派の寛容さと確立された聖職者層が、我がオアシスに揺るぎなき信仰生活を与えているのである。"
 fez_qarawiyyin_school: "カラウィーイーン大学"
 fez_qarawiyyin_school_desc: "859年にファーティマ・アル＝フィフリーによって創設され、以来絶えることなく続く #italic カラウィーイーン #! 大学は、西地中海のあらゆる地から訪れる学者たちに、スンナ派四法学派、アリストテレス論理学、天文学、医学を教えている。イブン・ハルドゥーン、マイモニデス、そして歴代マリーン朝スルタンの宰相たちは、我が学堂が世に送り出した経歴ある卒業生の一部に過ぎぬ。途切れることなき学問の伝統が我が宮廷における学びを活気づけ、いかなる若きマグリブの学府にも及ばぬほどの識字階級を育て上げているのである。"
 gbs_coastal_oasis: "沿岸のオアシス"
 gbs_coastal_oasis_desc: "ガベス湾の地中海岸を望む椰子林に象徴される、海とオアシスが織りなす我が独自の地理は、ナツメヤシの生産、柑橘の果樹園、ヘンナの庭、そして海の漁業という、稀な組み合わせを同じ農業単位のうちに支えている。我が農民たちは秋にナツメヤシを収穫し、春にはマグロを求めて船を出し、オアシスの後背地を一歩も離れることなく、サハラと地中海双方の交易圏にまたがって商いを行う。海とオアシスが出会うこの地にあって、我が国は純粋な内陸のオアシスには望み得ぬ、豊かな収穫と安定した繁栄を享受しているのである。"
 iwl_sahel_pastoral_economy: "サヘルの牧畜経済"
 iwl_sahel_pastoral_economy_desc: "我が連合は、中央サハラの砂丘とニジェール川流域の湿地との間に広がる季節的な草原、サヘル・トゥアレグの地を占め、我が牧畜経済は牛、羊、そして周辺の小さなオアシスのナツメヤシ園とを組み合わせている。我が移動経路は、年ごとの周期で雨を追って南北へと向かう。周囲の定住民との慣習的な協定が我が部族連合の牧草地を画定し、ニジェール川流域の農耕共同体との季節的な穀物交易が我が食糧を補っている。サヘルと牧畜の生活を融合させることで、 $IWL$ は純粋なサハラ的経済とも純粋なサヘル定住的経済とも異なる、家畜と穀物の経済基盤を得ているのである。"
 kah_adrar_ifoghas: "イフォガス山地の避難所"
 kah_adrar_ifoghas_desc: "マリ・アルジェリア国境のサハラに聳えるアドラール・デ・イフォガスの花崗岩山塊は、我が連合に、洞窟、狭隘な隘路、そして高地の牧草地からなる要塞のごとき地形をもたらし、いかなる侵略者の正規軍も幾月と幾多の戦いを失わずしては踏破し得ぬ。土地に根ざした聖廟の守人たちは山塊に点在するスーフィー・マラブートの道場を維持し、我が洞窟は侵攻の際には難民の牧草地となり、平時にはクルアーン学校となる。この守り難き中心地から、最高指導者は連合全体にわたる忠誠を得る。アドラールは我らが砦であると同時に聖域であり、連合が常に退いて祈り、力を回復できる場所なのである。"
 kay_air_massif: "アイル山地"
 kay_air_massif_desc: "ホッガルの南、ニジェール川の湾曲部の北に位置する中央サハラの花崗岩の峰々、アイール火山山塊は、我が連合に、周囲の諸氏族が南へ移動する季節に定住民を支える高地の牧草地と水に恵まれた谷の中心地をもたらしている。我が最高指導者は、この牙城から連合全体にわたる忠誠を得る。村落は高地の谷間に集まり、一方で周辺の天幕を張る氏族は慣習の暦に従って山塊の牧草地を巡る。この山の避難所は$KAY$に、より遊牧的なトゥアレグ系連合には開けた砂漠の地が決して供し得ぬ、守り難き戦士の中心地と揺るぎなき守備隊をもたらしているのである。"
 kgs_agropastoral_economy: "農牧経済"
 kgs_agropastoral_economy_desc: "我が連合は、サハラ・トゥアレグの牧畜が雨水に頼るハウサの農耕平原と出会う、トゥアレグ領土最南端の農牧の辺境を占め、キビの栽培、牛の放牧、そして近隣のハウサ共同体との季節的な労働交換を組み合わせた独自の農牧経済を営んでいる。我が牧畜民は一年の一部を我が農民と共に定住して過ごし、婚姻同盟はトゥアレグとハウサの境界を日常的に越えている。経済的な危険の分担は牧畜部門と農業部門の双方に及ぶ。農耕と牧畜を融合させることで、$KGS$ は中央サハラの遊牧的・牧畜的連合とは異なる、トゥアレグの中でも独特な経済基盤を得ているのである。"
 kuk_djurjura_strongholds: "ジュルジュラの要塞"
 kuk_djurjura_strongholds_desc: "ジュルジュラ山脈の高き城塞群――クークーの中央要塞村、ベニ・イェニの武具職人街、そして大カビリア一帯の尾根筋に連なる要塞の鎖――は、平地の軍勢がまともに到達し得ぬ地形に我が王国を据えている。我が守備隊の技師たちは、世襲の夫役義務を通じて、城壁、貯水槽、火薬庫を維持しており、すべての村を中央の座に結びつけている。これら集中した山岳要塞群により、我が国は純粋な低地の王国がこの高度では成し得ぬ、籠城への耐久と守備隊の増強とを可能にしているのである。"
 mrk_almoravid_ribat_tradition: "ムラービト朝のリバートの伝統"
 mrk_almoravid_ribat_tradition_desc: "我が王室は、十一世紀に聖戦と禁欲的信仰の双方の拠点として$MRK$を築いた、ユースフ・イブン・ターシュフィーンの戦う修道士たち、すなわち要塞化された#italicリバート#!共同体を営んだ#italicアル＝ムラービトゥーン#!の規律を受け継いでいる。ムラービト朝のウラマーは、我が大モスクとマドラサに、いかなる古参の王朝も及ばぬほどの存在感を保ち続け、我がスルタンに単なる世俗の統治者ではなく、創設者たちの正統な後継者としての道徳的権威を与えている。この受け継がれた宗教的・軍事的アイデンティティは、他のいかなるマグリブの首都も主張し得ぬ、共通の建国譚を通じて、我が聖職者層と戦士貴族を王座に結びつけているのである。"
 mzb_pentapolis_foundation: "ムザブの五都市連合"
 mzb_pentapolis_foundation_desc: "ムザブ渓谷に築かれた五つのイバード派城塞都市（ガルダーイヤ、ベニ・イズゲン、ブー・ヌーラ、メリーカ、エル・アトゥフ）は、909年にタアハルトで滅ぼされたルスタム朝の生き残りたちの避難所として、ワーディー・ムザブの上に聳え立つ。各都市は堅固な #italic クサル #! として築かれ、モスクの塔はミナレットと見張り台を兼ね、創設一族たちの合意によって統治され、通婚と共有の #italic ハルカ・アル＝アッザーバ #! 宗教評議会によって姉妹都市同士が結びついている。このペンタポリスは、他のいかなるサハラの集落も誇り得ぬ城壁と塔の都市遺産を、我らイバード派の共同体に残している。"
 ogl_saharan_terminus: "サハラ交易の終着点"
 ogl_saharan_terminus_desc: "我らのオアシスは、ガオ、トンブクトゥ、ニジェール川湾曲部から上ってくる大サハラ交易路の北の終着点に位置する。南からやって来るソニンケ、ソンガイ、トゥアレグの商人は皆、地中海へ向かう前に我らの門で通関せねばならない。我らのキャラバンサライ（シディ・ラクダル、シディ・ブーメンディル、中央市場の #italic ファナーディク #! ）は、遠征の合間の数か月間、隊商の人馬を受け入れ、我らの仲買人はアルジェ、チュニス、トリポリへの先送りを手配する。終着点に位置する我らの国家は、いかなる海洋国家も異を唱え得ぬほど、サハラ交易の収益の大半を手にしている。"
 qalat_al_mashwar_advance: "$qalat_al_mashwar$"
 qalat_al_mashwar_advance_desc: "$TLE$の中心に建つ#italicカラト・アル＝マシュワル#!は、堅固な王宮であると同時にザイヤーン朝宮廷儀礼の座としても聳え、シジルマサやワルグラからのサハラ隊商、オランからの地中海海運、そしてフェスとチュニスを結ぶ陸路通行に課税する#italicディーワーン#!を擁している。三重の城壁に囲まれたこの一画には、行政の諸室、造幣局、メシュアール地区の市場、そしてスルタン直属の親衛隊が一つの防備された敷地内に集約されている。宮殿にして財庫でもあるこの要塞は、単なる領土国家を超えた財政的重みをザイヤーン朝の首都に与え、国家のあらゆる機関を同じ城壁の内に収めることで生まれる強さをもたらしている。"
 sos_taroudant_garrison_seat: "タルーダント守備隊の拠点"
 sos_taroudant_garrison_seat_desc: "スース渓谷で最も長く常備守備を保ち続けてきた城塞線である #italic タルーダント #! の赤い城壁は、我らの兵舎、弾薬庫地区、武器庫、そして騎兵厩舎を一つの防備された敷地内に囲い込み、アルモラビド朝の時代以来、これを試みたあらゆる攻囲者を退けてきた。我らの守備隊技師たちは、租税免除と引き換えに世襲の職務として技能を受け継ぐ石工たちの常設賦役によって、城壁、稜堡、火薬貯蔵室を維持している。この集中した防備のおかげで、我が王室は散在する辺境守備隊が必要とするであろう維持費のごくわずかな部分で、スース全域の防備を保つことができる。"
 tat_date_palmery: "トゥアトのナツメヤシ園"
 tat_date_palmery_desc: "砂漠の砂の下を数十キロメートルにわたって走る #italic フォッガーラ #! 灌漑網によって支えられたトゥアト・オアシス一帯の数百万本のナツメヤシは、我が民、我が隊商、そして我が輸出交易を等しく養っている。我らの栽培者たちは、地中海とサヘル各地の高級市場向けに、名高いデグレット・ヌールとアグラスの品種を選び抜いてきた。深いオアシス農業は、我が王室に豊かな果実の輸出と、マグリブ沿岸の天水農業には決して及ばぬ安定した繁栄をもたらしている。"
 tfl_sijilmasa_gold_terminus: "交易の終着点シジルマサ"
 tfl_sijilmasa_gold_terminus_desc: "サヘルから来るすべての隊商は、$TFL$の中心に位置する大サハラ交易の宿駅、#italicシジルマサ#!でその旅を終える。ここでは、ワンガラの砂金、スーダン地方のコラの実、サハラの捕虜たちが、板塩、マグリブの織物、イベリア地中海の銀と交換される。我らの商人一族は、オアシス全体の繁栄を保証する世襲の特許状によって、検金場、砂金秤、保税倉庫を運営している。我らの途切れることなき商業的優位は、南方の隊商の富をタフィラルトに満たし、砂漠の終着点から遠く離れた内陸のマグリブ諸都市には及び得ぬ繁栄をもたらしている。"
 tgt_saharan_crossroads: "サハラ交易路の交差点"
 tgt_saharan_crossroads_desc: "我らのオアシスは三つの大サハラ隊商路（タフィラルトとシジルマサへ向かう西路、ワルグラとニジェール川へ向かう中央路、ガダーミスとトリポリへ向かう東路）の合流点に位置し、あらゆるマグリブ諸国の隊商が自然と集う場所となっている。我らの中央市場には、毎季チュニス、アルジェ、フェス、トリポリ、そして深いサハラから商人たちが集まり、隊商に従う移住民の家族たちは拡大する我らの市街地区に根を下ろす。この交差点に立つ我が国家は、サハラの交易網全体に手を伸ばし、単一の路線しか持たぬオアシスには決して成し得ぬほど、絶え間ない移住者の流れを町々に呼び込んでいる。"
 trg_tin_hinan_legacy: "ヒナンの遺産"
 trg_tin_hinan_legacy_desc: "アバレッサに今なお守られるその王墓を持つケル・アハガルの始祖、伝説の #italic ティン・ヒナーン #! は、高貴な身分、家畜群の所有権、そして儀礼的地位を女系を通じて伝える母系相続の慣習を根付かせている。我らのアメノカルたちは皆、母方の氏族を通じてティン・ヒナーンその人からの血統を主張し、我らの継承争いは彼女の宇宙的権威によって裁定される。この母系的正統性は、いかなる父系のマグリブ隣国も崩し得ず、模倣し得ぬ相続制度によって、我が貴族たちを王座に結びつけている。"
 ahg_abalessa_seat: "アバレッサの拠点"
 ahg_abalessa_seat_desc: "祖先の女王ティン・ヒナーンが眠るアバレッサの要塞は、我が最高首長家系の政治的・宗教的権威を根付かせている。我らのアメノカル即位の儀式はこの要塞の城壁で行われ、我らのウラマーは定められた季節にその墓所へ巡礼する。歴代の最高首長継承の宮廷記録はすべて、アバレッサの儀式を正式な即位として記している。この聖なる政治的座は、より緩やかに組織されたサハラの競合勢力には成し得ぬほど、我が連合の権威を長期にわたって支えている。"
 ait_kabyle_marabouts: "カビールのマラブーの権威"
 ait_kabyle_marabouts_desc: "放浪のスーフィー導師とその定住した子孫である地元の #italic マラブー #! は、氏族間の紛争を仲裁し、婚姻を認証し、共有の #italic バラカ #! によって散在する村々を中央の首長権に結びつけることで、我が連合の宗教的・司法的生活を支えている。我が王室はシディ・アフマド・ベル・カシム派の道場や、より古いカーディリー派の一族を庇護しており、純粋に部族的な山岳連合がめったに到達し得ぬ深みを我が宗教機構にもたらしている。マラブーの権威は、純粋に世俗的な首長権を超えて、信仰と法における我が国家の及ぶ範囲を全領土に広げている。"
 ajj_ghat_oasis: "ガートのオアシス"
 ajj_ghat_oasis_desc: "アカクス山脈近く、ホガール山地東麓のガートのオアシスは、ナツメヤシ、オアシス庭園、そしてサハラ隊商交易を仲介する定住商人一族を支える、我が隊商と移住民の主要な町として機能している。灌漑された庭園区画は、周囲のいかなる砂漠も供給し得ぬ果物と野菜を産する。我らのキャラバンサライは季節ごとの大サハラ交易の往来を受け入れ、関税収入は連合の中央財庫を支える。このオアシスの町は、より純粋に牧畜に依存するトゥアレグの競合勢力には欠けている農業的・商業的基盤によって $AJJ$ を根付かせている。"
 btl_constantine_hinterland: "コンスタンティーヌの後背地"
 btl_constantine_hinterland_desc: "我が連合は、大要塞都市コンスタンティーヌの直接の後背地を占め、その都市を支配する勢力が誰であれ、隊商保護と通行税免除の条約を交渉しつつ、都市の穀物、羊毛、皮革、家畜市場に物資を供給している。我が商家は絶え間ないコンスタンティーヌ市場の交易に乗り、我が使節はアルジェリアとチュニジアの双方の中央宮廷と交渉する経験を積む。大都市の後背地に立つことは、都市から遠く離れた純粋な山岳連合には知り得ぬ、商人としての広がりと外交的経験を我が国家にもたらしている。"
 cnr_silbo_signal_tongue: "伝達言語シルボ"
 cnr_silbo_signal_tongue_desc: "我が羊飼いと見張り番は、$CNR$の深い渓谷に響き渡り、いかなる話し声も届かぬ場所まで達する純粋な音調に我らのグアンチェ語を置き換えた、口笛の#italicシルボ#!を使いこなす。ある尾根の頂に立つ見張りは、近づく異邦人、水平線上の艦隊、あるいは招集の報せを、使者が要するであろう数時間ではなく、瞬く間に次の尾根へと伝える。我らの口笛信号は我が宮廷にいち早く警告をもたらし、いかなる外国の諜報機関も解読も傍受もし得ぬ秘密の伝言を運んでいる。"
 dje_djerid_marabouts: "ジェリドのマラブー"
 dje_djerid_marabouts_desc: "イバード派の宗教的正統性と、オアシスの水利権、ナツメヤシ園の相続、隊商保護儀礼における実践的な知恵とを兼ね備えたジェリドの地元スーフィー・マラブーたちは、その常設の道場と季節ごとの巡礼祭を通じて、我がオアシス都市群の宗教的・司法的生活を支えている。我が王室は偉大な開祖導師たちの聖廟に寄進を行い、その存命の後継者たちの教授集団を庇護している。イバード派とスーフィーの伝統が融合することで、我が聖職者層は、単に外から持ち込まれた教団を超えて、南方のオアシス全域にわたる深みと道徳的権威を得ている。"
 entrepot_connections: "交易拠点の連結"
 entrepot_connections_desc: "我らの道は $TLE$ を、地中海に面した外港ホネインへ、サハラの中継拠点シジルマサへ、そして王の護衛の下で我が領土を横切る大マグリブ幹線路へと結びつけている。我らは、この路線に沿った租税免除と土地下賜と引き換えに、馬車道と #italic フンドゥク #! の宿駅を維持するよう貴族の家々に特許を与えている。この商隊護送の仕組みは、 $fez$ や $tunis$ で党派抗争が交易を乱すときでさえ、中央マグリブの交易を確実に流れ続けさせている。"
 fez_brassworkers_guild: "真鍮職人ギルド"
 fez_brassworkers_guild_desc: "セファリーン地区に集まるフェスの真鍮・銅細工ギルドは、地中海の市でジェノヴァ、ピサ、ヴェネツィアの買い手から高値を呼ぶ象嵌細工のランプ、盆、アストロラーベ、そして打ち出しの皿を生み出している。師弟相伝の訓練の連鎖は、彫金、打ち出し、銀象嵌の技法をフェスの家々の幾世代にもわたって伝えている。この統制された金属工芸は、内陸マグリブの羊毛・皮革生産者には持ち得ぬ、銅製品の交易と一群の職人たちを我が王室にもたらしている。"
 gbs_gulf_anchorage: "ガベス湾の停泊地"
 gbs_gulf_anchorage_desc: "ケルケナ諸島に守られ、地中海ガレー船が航行できるほど水深があり、オアシス自体から真水の供給を受けるガベス湾の天然の良港は、沿岸ガレー船団を支え、オアシスの住民と沿岸の住民から等しく集められた船員の供給源となっている。我らが造船工は、東地中海のガレー船建造技術と、我らが後背地が必要とするサハラ隊商のラクダ飼育技術の双方を習得する。湾のこの錨地は絶えず船員を呼び寄せ、純粋な内陸オアシスには知られぬ海の伝統を築き上げている。"
 iwl_niger_valley_rights: "ニジェール川流域の権益"
 iwl_niger_valley_rights_desc: "我らが連合は、ニジェール川流域の氾濫原牧草地への正式な利用権を、現地のソンガイ、フラニ、ソニンケの住民と交渉し、武力によってではなく、我らが首長と彼らの長たちとの外交合意を通じて、我らが家畜に欠かせぬ乾季の放牧地を確保する。我らが使節はニジェール湾曲部の市場町に常駐の地位を保ち、我らが移動の時期はニジェール川の増水と減水の周期に合わせて調整される。双方で大きな代替わりがあるたびに、首長は牧草地利用の盟約を更新する。ニジェール川沿いのこの牧草地協定こそが我らが家畜を生かしており、純粋にサハラのみに拠るトゥアレグ連合には、砂漠の資源だけでは到底成し得ぬことである。"
 kah_niger_pasture_rights: "ニジェール川流域の放牧権"
 kah_niger_pasture_rights_desc: "我らが連合は、ニジェール湾曲部沿いのソンガイおよびポスト・ソンガイの定住民と季節ごとの牧草地・水利権を交渉し、乾季には我らが家畜を南の氾濫原牧草地へ、雨季には北のアドラール高地へと移す。首長はニジェール湾曲部の長たちと正式な使節関係を保ち、我らが移動の取り決めは双方の慣習法に記録されている。我らが牧畜経済はこの年ごとの周期に依っている。ニジェール湾曲部の牧草地への接近は、 $KAH$ の経済的・領土的な及ぶ範囲を、純粋にサハラのみに拠るトゥアレグ連合よりも広げている。"
 kay_agadez_sultanate: "アガデス・スルタン国"
 kay_agadez_sultanate_desc: "トゥアレグにより選ばれた首長によって建てられ、周辺の貴族によって承認されたアガデス・スルタン国は、我らが連合を部族首長制ではなく正式な王国として確立する。我らがスルタンは中央モスクにて叙任を受け、継承の手続きは慣習法に明文化されている。我らが宮廷は、ソンガイ、ハウサ、マグリブ諸国からの使節を対等な主権国家として迎える。スルタン国として、$KAY$ は真の国家として認められており、この時代、他のいかなるトゥアレグ連合も主張し得ぬ地位である。"
 kgs_hausa_synthesis: "トゥアレグとハウサの文化融合"
 kgs_hausa_synthesis_desc: "我らが連合の独自性は、トゥアレグとハウサの長き文化的・言語的接触から生まれている――タマシェク語とハウサ語が共存する二言語家庭、トゥアレグの慣習法とハウサのイスラーム法学を融合させた混成の宗教実践、そしてニジェール・ハウサの境界をまたぐ共有の親族網である。我らがウラマーと隣人のハウサ系マラブーたちは、弟子と文書を交換し合う。婚姻の慣習は言語の垣根を越え、トゥアレグとハウサ双方の観察者が我らが独自の文化形態を第三の文化として認めている。二つの民を融合させることで、$KGS$ は純粋なトゥアレグにも純粋なハウサにもあり得ぬ、両世界にまたぐ独自性を得ている。"
 kuk_belkadi_dynasty: "ベルカディ王朝"
 kuk_belkadi_dynasty_desc: "クク王国のベルカディ家は、散在するカビール諸連合を単一の王統のもとに統合し、シャリーフ出自の主張、建国式典におけるマラブーの承認、そして構成する各村落から集まった #italic タジュマーアト #! から正統性を得ている。我らが官房は王令と税帳簿を記録し、宮廷儀礼はマリーン朝の統治実践とカビールの慣習の双方に依拠しており、我らが王朝は、合議制で統治される周辺のカビール諸連合が決して成し得ぬ中央集権的な君主制を打ち立てている。この王家の創建は、我らが国家に優れた統治を行う宮廷と、純粋な部族首長制を超える宗教的・王朝的正統性をもたらしている。"
 mrk_atlas_caravan_terminus: "アトラス山脈を越える隊商の終着地"
 mrk_atlas_caravan_terminus_desc: "ドラア、スース、あるいはシジルマサのサハラの終着点から高アトラス山脈を越えるすべての隊商は、$MRK$で旅を区切る。#italicバーブ・アグマート#!と我らが都の南の城壁は、積荷の一つ一つが登録され課税されるフンドゥク(宿駅)、給水池、そして税関を抱えている。我らが商家はサハラの通貨で砂漠の商人に信用を与え、我らが門で荷降ろしされた品々で返済を受け取り、トランスサハラと地中海の両経済を一冊の帳簿で結び合わせている。終着点として、マラケシュは絶え間ない通過収入で国庫を満たし、我らが商人市民に、山越えの道から遠い内陸マグリブ諸都市を凌ぐ永続的な商業上の優位を与えている。"
 mzb_ibadi_seclusion: "イバード派の閉鎖性"
 mzb_ibadi_seclusion_desc: "我らが共同体は、スンニ派が多数を占める隣人と接する際に、#italic タキーヤ #!(用心のための信仰隠し)の教義を実践し、五市の城壁内では厳格なイバード派正統信仰を守りつつ、公の場では一般的なスンニ派の形式を装う。我らが女性は覆いをまとい家の中庭に留まり、我らが市場は訪問者を内奥の聖域から隔て、我らが法学者はアルジェとチュニスのマーリク派 #italic ファトワー #! に表向きは従いながら、内々では自らの #italic ワフビー学派 #! の路線に従う。この宗教的・文化的隠遁の教義こそが、他のあらゆるハワーリジュ共同体を消し去ってきた数世紀にわたるスンニ派の政治的圧力の中で、我らが独自のイバード派の独自性を守り抜いている。"
 ogl_in_salah_route: "イン・サラーへの交易路"
 ogl_in_salah_route_desc: "我らが隊商頭たちは、ワルグラからニジェール湾曲部へと至る路を中央サハラの支配的な交易路として確立し、シジルマサから西サハラを経る古い路に代わる我らが商人の優先路とする。我らはイン・サラーの中継拠点をトゥアレグ諸連合と共同で維持し、双方が護衛、水利権の保証、倉庫の空間を提供し合い、我らが法学者は各中継拠点ごとの関税と通行料の規定を正式に定める。護衛、井戸、定められた通行料を備えたこの秩序だった路は、他のいかなるオアシス国家も及ばぬ遠くまで、我らが商人をサハラ越しに運んでいる。"
 sos_jazuli_sufi_movement: "ジャズーリーのスーフィー運動"
 sos_jazuli_sufi_movement_desc: "我らが南の後背地にて、ムハンマド・ブン・スライマーン・アル=ジャズーリー(その『ダラーイル・アル=ハイラート』は中世末期のマグリブで最も多く書き写された信心書となる)によって創始された #italic タリーカ・ジャズーリーヤ #! は、$SOS$、ドラア、スースのザーウィヤを通じて広まり、やがてその宣教師たちはマグリブのあらゆる首都へこれを運ぶ。我らが宮廷はアフーガルの道場にてジャズーリー派のシャイフたちを庇護し、その教師たちに寄進を行い、代替わりの式典のたびに彼らの祝福を受ける。このスーフィー復興は、我らが都の聖職者と地方のマラブーを単一の復興運動を通じて王座へと結びつけ、我らがスルタン国に、既存の古い教団が対抗しがたい宗教的正統性を与えている。"
 tat_maghili_jurisprudence: "アル＝マーギリーの法学"
 tat_maghili_jurisprudence_desc: "トゥアト出身のムハンマド・アル＝マギーリーは、『アフカーム・アフル・アッ＝ズィンマ』の著者であり、ソンガイのアスキヤ家の顧問を務めた人物である。彼はマーリク派法学を西サハラ、ハウサ諸都市、さらにその先のサヘル諸王国へと広めており、ズィンミーの身分、課税、統治者と臣民の義務に関する彼の法解釈により、ソンガイ、カノ、カツィナの裁判所はトゥアトの法的権威と結びついている。このように学問的権威を一手に担うことで、我々はオアシスの境界をはるかに越えて文化的影響力を広げ、南マグリブからサヘルにかけての宗教指導者たちを我々のシャイフと結びつけている。"
 tfl_oasis_levy_horsemen: "オアシスの召集軍騎兵"
 tfl_oasis_levy_horsemen_desc: "$TFL$の各クサル(集落)は、幼少より砂丘を越えて襲撃者を追い、隊商を奇襲し、歩兵の到達し得ぬ地形を越えていかなる追跡勢力をも引き離すべく訓練された、サハラ流の軽騎兵たる季節ごとの馬と#italicメハリ#!ラクダ騎手の召集にその分担を供する。我らがオアシスの厩舎は、我らが庭園のナツメヤシの飼料と、奥オアシスの塩気を含んだ井戸水とで黒毛のベルベル馬を育て、サハラの気候下ではいかなる地中海産の軍馬も及ばぬ持久力を備えた馬を生み出している。我らがオアシス騎兵の伝統は、中央集権化を進める北方の宮廷の常備軍が対抗に苦しむであろう、持久力と速さを兼ね備えた機動部隊を展開している。"
 tgt_caravan_levies: "隊商税"
 tgt_caravan_levies_desc: "我らが王権は、隊商税の歳入によって常備の軍駐屯地を築いている。入荷品にかかる #italic ザカート・アル=ウシュール #! は、常設のオアシス守備隊と、周辺のベルベル諸連合から集められた部族騎兵の予備隊の資金となる。我らが部族民は輪番で城壁の守りと隊商中継の水場に当たり、定期の俸給の代わりに隊商税の分配を受け、我らが王権の常設軍組織は、アルジェ中央またはチュニスの朝貢要求のいずれからも独立して成長していく。隊商によって賄われるこの徴発制度は、通常の農業経済に何ら負担をかけずに、我らが国家に常備駐屯軍をもたらしている。"
 trg_caravan_protection_levies: "隊商保護税"
 trg_caravan_protection_levies_desc: "我らがサハラ領土を横切るすべての隊商は、深い砂漠の襲撃氏族を避けて安全な通行を得る代わりに、アメノカルの使者たちが各水場で公示する料率にて、トゥアレグの#italicテッガマ#!保護税を支払う。我らが護衛隊は、諸連合すべてから恒常的な氏族の誓約を通じて集められ、その関税収入は、騎手を供出した天幕への再分配として、同じ親族網を通じて還流する。公開され、公示されたこの保護税は、我らが王権に隊商からの安定した収入をもたらし、氏族たちを結びつけ続けており、いかなる定住国家も我らが移動の道からこれを引き出すことはできぬものである。"
 ahg_tamanrasset_caravan: "隊商終着地としてのタマンラセット"
 ahg_tamanrasset_caravan_desc: "ホガール山地南麓のタマンラセット・オアシスは、マグリブ北部とアイル=ニジェール南部を結ぶ主要な隊商の終着点として機能している。我らが商家は南行きの旅程に穀物と布を供給し、我らが税関吏は通過する往来に定率の課税を行う。ホガールの採石場は、この回廊を採算の取れるものにしている塩と雑穀の交換を支えている。隊商の終着点として、タマンラセットは、より孤立したサハラのオアシスには単なる通過往来からは得られぬ交易収入を得ている。"
 ait_andalusi_smiths: "アンダルスの職人"
 ait_andalusi_smiths_desc: "トレド、グラナダ、コルドバからの亡命アンダルシア人職人たち(銃匠、銅細工師、革仕上げ職人、技師)は、我らがカラア・デ・ベニ・アッバスに避難先を見出し、失われた半島の金属加工と火薬製造の技を我らが山間の工房にもたらしている。我らが高地の兵器廠は今や、他のいかなるカビール連合も及ばぬ品質で、アルケバス銃身、銅器、彫刻を施した火器を生産している。アンダルシア人の職人技の流入は、我らが王権に、火器を携えた軽歩兵の部隊と、純粋に牧畜のみに拠る隣人には到底整え得ぬ銅細工の技とを備えさせている。"
 ajj_libyan_caravan_route: "リビアの隊商交易路"
 ajj_libyan_caravan_route_desc: "サハラ以南アフリカとオスマン領リビア沿岸とを結ぶ東サハラの回廊たる、ガート=ムルズーク=トリポリを結ぶ隊商路は、我らが領土を通過し、主要な中継地のすべてで通行料と保護料を我らに支払う。我らが隊商頭たちは通過する往来を導き、我らが井戸番たちは一定の間隔で給水地点を維持する。北の終着点にて、首長はトリポリとフェザーンの当局と通行料率を交渉する。この東の路は、西の回廊(ホガール=アイル)の交易体系とは異なる、独自の商業的・外交的な道へと $AJJ$ を導いている。"
 btl_mountain_raiding: "山岳騎兵による襲撃の伝統"
 btl_mountain_raiding_desc: "我が軽騎兵(各氏族の末子より選ばれ、我が牧畜経済が育てる俊足のベルベル馬に跨る者たち)は、我が連合の係争地帯を巡回し、敵対する略奪者を打ち倒し、通行する隊商から貢納を徴収し、季節市で催される氏族間の競技で名声を集める。我が騎兵の伝統は、戦士の家系内での世襲的な徒弟制度を通じて戦術知識を伝えている。我が略奪の伝統は、国を俊足の騎手と、挫折から素早く立ち直る兵士で満たすが、これは定住傾向の強いマグリブ諸国が正式な訓練では再現し得ないものである。"
 cnr_dragon_tree_groves: "ドラゴンツリー園"
 cnr_dragon_tree_groves_desc: "我が島々に広がる #italic Dracaena draco #!、すなわち地中海の薬種商が #italic sanguis draconis #! として珍重する深紅の樹脂を滴らせる古代の竜血樹の森は、薬や漆、祭壇用顔料の原料となる贅沢な輸出品を生み、本土の生産者には及ばぬ強みをもたらす。中世後期の大西洋を往来したジェノヴァの積荷目録は、我が樹脂をレヴァントとインド諸地域の間で最も信頼できる産地として記しており、我が商人たちはメンセヤートが治めるすべての島のすべての森を支配下に置いている。この樹脂の独占は、王室に豊かな染料交易と、純農業国をはるかに超えるヨーロッパ市場での地位をもたらしている。"
 dje_tozeur_madrasa: "トズールのマドラサ"
 dje_tozeur_madrasa_desc: "トズールにある我が中央マドラサ(集まったナツメヤシ園地主家系の資金によって支えられ、イバード派とマーリク派の教師を同数抱える)は、二つの #italic マズハブ #! とより広いサハラの学問伝統を橋渡しする教育課程を通じて、我がオアシスの書記、裁判官、宣教師を育てている。我が卒業生はジェリドの各地で #italic カーディー #! を務め、我が学生たちはさらなる研鑽のためチュニスやカイロへ赴き、我が学派横断的な学識への評価は領域外からも巡礼学生を引き寄せている。集中した学問は、純然たる田舎のイバード派共同体には得られぬ、より識字率の高い聖職者層と南部オアシスへの広い影響力を我が国にもたらす。"
 fez_old_city_refortified: "旧市街の再要塞化"
 fez_old_city_refortified_desc: "ワッタース朝のスルタンたちはフェズ・アル=バーリーの城壁を再建し、フェズ・アル=ジュディードに稜堡を加え、一世代にわたる周到な築城作業を通じて南からのサアド朝の進撃に備えている。我が守備隊の技師たちは #italic バーブ・ブー・ジュルード #! の城門、セブー平野を見下ろす胸壁、カスバの城塞を維持管理し、それらを守る常備中隊はフェズ市民の家々から交代制で徴募されている。これらの城壁に軍事力を集中させることで、我が守備隊は着実に増強され、散在する辺境砦では決して得られぬ攻城戦の技術が培われる。"
 gbs_henna_export: "ヘナと染料の輸出"
 gbs_henna_export_desc: "我が沿岸オアシスのヘナ園、藍畑、サフラン畑は、欧州の布仕上げ職人やマグリブの鞣革業者が最上級品として求める染料を産し、アンダルス風タイル工芸、地中海の羊毛染色、そして我が沿岸の綿織物業向けの色材を供給している。我が商家はガルフ沿岸の保税倉庫を支配し、我が仲買人たちは染料園の所有者に信用を供与している。輸送業者はチュニス、ラ・グレット、その他の小さなチュニジアの港を経由して輸出を手配する。我が染料輸出は贅沢交易の利益で王室の金庫を満たし、我が商人たちを繁栄させ続けている。"
 iwl_hausa_trade_interface: "ハウサ交易網"
 iwl_hausa_trade_interface_desc: "我が南方辺境は、我々をハウサの都市国家群(カノ、カツィナ、ザリア)との商業的接触へと導く。彼らの市場には砂漠の塩と我が隊商が南方へ運ぶマグリブの布を供給し、代わりにスーダンの金、奴隷、そして我が牧畜連合が産しえぬ農産物の主食を得ている。我が隊商長たちはハウサ辺境路線を専門とし、我が首長はハウサの首長たちと正式な儀礼を保っている。南方ハウサ諸都市との通行税取り決めは、我が牧畜収入を大きく補っている。南方との交易は、北方のみを見るトゥアレグ諸連合を超えて $IWL$ の商業を広げている。"
 kah_songhai_borderlands: "ソンガイの国境地帯"
 kah_songhai_borderlands_desc: "ソンガイ帝国の辺境(トンブクトゥ、ガオ、そして帝国東部一帯)において、我が連合はサハラ辺境の主要勢力として位置づけられ、マグリブの塩を南へ運びスーダンの金と交換する越サハラ隊商交易を管理している。我が首長は我が交渉拠点でソンガイの使節を迎える。ニジェール湾曲部の当局との隊商通行税の取り決めは代替わりごとに更新され、トゥアレグとソンガイの正式な協力関係が交易路の安全を保っている。帝国の縁に立つことは、純然たるサハラ内陸の連合には果たし得ぬ商業的・外交的役割を $KAH$ に与えている。"
 kay_salt_caravan_hub: "塩交易の隊商拠点"
 kay_salt_caravan_hub_desc: "アガデスは中央サハラ回廊の主要な隊商拠点として機能し、東方からのビルマ塩隊商、北方からの布と火器のマグリブ隊商、南方からの穀物と布のハウサ隊商という三つの路線が一つの市場に集う結節点となっている。この通過交易からの関税収入は我が国家財政の中心を占めている。我がキャラバンサライは季節ごとの到着を受け入れ、我が商家は三つの路線の間を仲介する。砂漠交易の結節点として、$KAY$は純然たる牧畜連合には支ええぬ交易によって成り立っている。"
 kgs_madaoua_settlements: "マダウアの集落"
 kgs_madaoua_settlements_desc: "マダウア地方(我が農牧経済が定住人口を集中させる南ニジェールの市場町地帯)は、我が連合の主要な都市中心地を擁し、トゥアレグの名家とハウサ商人・職人の定住民を独特な混成都市文化の中に混在させている。市の立つ日には周辺サヘルの牧畜民の売り手が集まり、我が工房は純然たる牧畜経済では支ええぬ皮革、金属加工、織物の生産を専門とする。我が名家は都市マダウアと周辺の牧畜キャンプの両方に邸宅を構えている。マダウアとその定住都市は、より純然たる遊牧的なトゥアレグ諸連合には持ち得ぬ恒久的な統治の座を $KGS$ に与えている。"
 kuk_mountain_warfare_doctrine: "山岳戦の戦術"
 kuk_mountain_warfare_doctrine_desc: "我が高地戦の教義は、ジュルジュラの険しい斜面、鬱蒼たるオーク林、そして王国中央部の入り組んだ尾根道で幾世代にもわたり戦ってきたカビール族の戦士たちによって磨き上げられ、あらゆる村の徴募兵に待ち伏せと退却の戦術、平地の歩兵には通れぬ地形での潜行移動、そして指揮官の直接統率なしに分散した各中隊を連携させる尾根上の合図を教え込む。我が士官たちは、この教義を戦士の家系内での世襲的な徒弟制度を通じて伝えている。あらゆる村の徴募兵は己の尾根を知悉しており、それを登る侵略者は一つ一つに代償を払うことになる。"
 mrk_almoravid_dinar_mint: "ムラービト朝のディナール鋳造所"
 mrk_almoravid_dinar_mint_desc: "$MRK$の中心にある我が偉大なる#italicダール・アッ=シッカ#!は、名高いムラービト・ディナール――越サハラ隊商によって我が門に届くワンガラ産の金を精錬所で鋳直した、極めて高純度の金貨――を鋳造するアルモラビド朝の慣行を今に継いでいる。マラケシュ・ディナールの名声はマグリブを越えてジェノヴァ、ピサ、イベリアの市場にまで及び、他の劣った貨幣がどの計算台でも目方を量られ割引かれる中、我が貨幣は額面通りに流通する。この貨幣の信用は、我が税吏に王国全土で額面通りの徴収を可能にし、我が商人に、他の造幣所には及ばぬ貨幣で帳簿を維持することを可能にしている。"
 mzb_ibadi_codification: "イバード法学の体系化"
 mzb_ibadi_codification_desc: "ベニ・イスゲンとガルダイアの我が学者たちは、イバード・ワフビー派法学の大成たる、シェイフ・アブドゥルアズィーズ・アッ=サミーニーの #italic キターブ・アン=ニール #! 、アトファイヤシュとバーブーの法学注釈を編纂し、幾世紀にわたる #italic フィクフ・アル=イバーディーヤ #! を成文化して一つの参照法典とした。我々は各ペンタポリス都市の見込みある若い学生たちを他都市へ送り、年長の #italic アッザーバ #! 評議会のもとで学ばせ、我が学識ある卒業生たちはオマンからザンジバルに至る広きイバード派世界で裁判官、書記、宣教師として仕えている。成文化は、スンナ派マグリブのマドラサの伝統には提供し得ぬ深みと一貫性を、我が宗派内の宗教制度にもたらしている。"
 ogl_camel_caravan_corps: "ラクダ隊商の護衛部隊"
 ogl_camel_caravan_corps_desc: "我が隊商護衛補助部隊、すなわちバヌー・ワルグラと砂漠辺境のベルベル部族から徴募された騎乗ラクダ兵の#italicメハリスト#!中隊は、我がオアシスへの南方への接近路を巡回し、トゥアレグの略奪者が最も活発なタシリとタデマイト高原を抜けて到着する隊商を護衛する。彼らは我が王室のもとで契約に基づき奉仕し、中央財務ではなく隊商通行税の歳入から給与を受け、我が士官たちは国家間の遠征の際、彼らを正規のオアシス守備隊への補助部隊として組み込む。ラクダ部隊は柔軟なサハラの機動打撃力であり、定住騎兵ならば行き詰まるような長距離の砂漠を駆け抜けることができる。"
 sos_draa_warrior_emergence: "ドラア川戦士の台頭"
 sos_draa_warrior_emergence_desc: "ドラア渓谷とタグマダルトの諸氏族(幾世代にもわたり沿岸からの異国の侵入と小競り合いを続けてきた、古くから定住するシャリーフ系の家々)は、前サハラ盆地全域から兵を募る南部軍事連邦として、$SOS$の旗のもとに結集する。我がタグマダルト、タルーダント、マッサの集結地は、山岳歩兵、オアシス騎兵、そして沿岸要塞から得た新技術を訓練された火縄銃兵で満ち、すべては南部のマラブーの#italicバラカ#!のもとで誓われた誓約によって結ばれている。この戦士の勃興は、より古く確立されたマグリブの首都都市には及ばぬ速さと軍紀をもって、各遠征の後に我が人的資源を再建する。"
 tat_caravan_escort_corps: "隊商の護衛部隊"
 tat_caravan_escort_corps_desc: "トゥアト護衛中隊は、オアシス産ラクダとサハラ馬に武装して騎乗し、シジルマーサとニジェール湾曲部の間の我が領域を通過するあらゆる主要隊商にその役務を提供している。我が騎手たちは、二千キロメートルに及ぶ砂漠の全域にわたり、あらゆる水場、あらゆる信頼できる飼料路、そしてあらゆる略奪者の待ち伏せの可能性ある地点を熟知している。我が軽騎兵は隊商を迅速に護衛し、我が遠征を素早く増援する。いかなる内陸マグリブの勢力も、我々ほど砂漠の地勢に通じてはいないからである。"
 tfl_caravan_protection_tariffs: "隊商保護関税"
 tfl_caravan_protection_tariffs_desc: "$TFL$のカーイドたちは、オアシスを出入りするあらゆる荷に対し、シジルマサ、リサニ、砂漠の関門にある我が税関の公示料率に従って、規定の#italicサダカ・アル=カーフィラ#!(隊商保護税)を課し、その見返りに前サハラ辺境を越える武装護衛を提供する。徴収はカーイド家の保証された会計係を通じて行われ、定められた取り分は直接中央宮廷へ送られ、残りは砂漠護衛の維持と水場の管理に充てられる。この公示料率による関税制度は、隊商の通行と国家の保護との交換を安定させ、収益を地方の仲介者による無駄を省いて直接スルタンの宮廷へと送る。"
 tgt_beni_djellab_dynasty: "ベニ・ジェラブ朝"
 tgt_beni_djellab_dynasty_desc: "ベニ・ジェラブ家はトゥグルトのスルタンを自称し、スーフとワーディー・リーグのオアシス群に対する支配を単一の王朝系統の下に統合した。その王統の持続性は、周辺のいかなるオアシス連合も及ばぬほど長く続く。彼らはトゥグルト中央に #italic qaṣr #! を築き、これを儀礼的居所にして行政の中心とし、財務記録のために #italic makhzen #! 式の官房を組織し、婚姻同盟と軍役を通じて周辺の #italic ksūr #! にまで権威を及ぼす。このスルタン国はスーフのオアシス地域に中央集権的な政治形態をもたらすが、それは合議制で統治される近隣のオアシスには決して成し得ぬことである。"
 tle_tlemcen_carpets: "トレムセンの絨毯"
 tle_tlemcen_carpets_desc: "我が都市の織機は、#italic バーブ・アル＝アカバ #! と #italic バーブ・シーディー・ブー・マドヤン #! の両地区に集まり、幾何学的な円形紋様が他のいかなるマグリブ絨毯の伝統とも一線を画す、高密度の結び目を持つ名高い #italic サッジャーダト・ティリムサーン #! を織り上げる。我が都市に定住したアンダルスの熟練織工たちは新たな植物紋様と藍・朱の色調を加え、オランの市でジェノヴァ、マルセイユ、ヴェネツィアの商人たちから高値を引き出している。我らの統制された絨毯産業は、我が王家に高級織物の交易と都市の職人階級をもたらすが、それは内陸部族の羊毛・天幕生産者には及びもつかぬものである。"
 trg_imuhagh_warrior_caste: "イムーハグの戦士階級"
 trg_imuhagh_warrior_caste_desc: "#italic イムーハグ#!は、最良のメハリに跨り、幼少の頃より槍、十字柄の#italic タクーバ#!剣、鉄先の投げ槍を仕込まれた高貴なる戦士であり、我らの打撃部隊を形成する。その戦場における規律には、いかなるサヘルの軍勢も太刀打ちできぬ。アハガルの井戸場とアイルの高地にある彼らの訓練陣営は、世代を超えて伝えられる武芸の熟達を育む。この高貴な戦士の伝統から生まれる軽騎兵の打撃力は、定住国家が築くには幾世紀を要するものである。"
 ahg_amenokal_paramount: "アメノカルの最高権威"
 ahg_amenokal_paramount_desc: "#italic アメノカル#!（最高首長）は、イマシャゲン貴族の評議会、職位の太鼓その他の宝器、そしてトゥアレグ独自の形式を持つ儀礼的称号を通じて、集結した連合体に対する個人的権威を行使する。これに匹敵するマグリブのスルタンはいない。我らの最高首長の言葉は集結した氏族を結束させ、使節は連合のあらゆる交渉にアメノカルの印璽を携え、行政の伝令は中央ホガルから周縁の氏族陣営へ数日のうちに決定を伝える。一人の最高首長の下、$AHG$は、純然たる部族連合にすぎぬトゥアレグの競合勢力には滅多にできぬ、果断な行動を取ることができる。"
 ait_independence_from_lowland: "低地からの独立"
 ait_independence_from_lowland_desc: "我らの高地の地形、マラブートによる正統性、そして堅固な城塞網により、カビリアを直接支配下に置こうとするあらゆる中央集権的宮廷に対して、我らは政治的自治を保ち続けることができる。我らは山岳の要害という安全の中から対等な立場で交渉し、都合の良い時には貢納を払い、都合が悪ければそれを差し控える一方で、中央の宮廷はその地形とマラブートによって手を阻まれる。かかる独立は我が国家を容易には崩れぬものとし、低地の宮廷からの敵意の多くを免れさせる。"
 ajj_ahaggar_diplomacy: "連合間の外交"
 ajj_ahaggar_diplomacy_desc: "我が連合体は、西方のより大なる $AHG$ との間で慎重な外交的均衡を保ち、婚姻同盟を取り交わし、牧地と水利の権利を交渉し、拡大するホガル勢力であれば武力で解決したであろう連合間の紛争を調停する。我らの使節はタマンラセットの宮廷に常駐の地位を占め、我らの最高首長はホガルの儀礼の一部において儀礼上の優位を認める一方、実質的な事柄については独立を保つ。婚姻関係により両連合体は血縁の絆で結ばれ続ける。この慎重な外交により、$AJJ$ はより大なるサハラの強国の傍らにあってなお独立を保つことができるが、それは孤立した小さな氏族集団には到底成し得ぬことである。"
 btl_aures_marabouts: "オーレスのマラブーたちの権威"
 btl_aures_marabouts_desc: "我らの最高の巡礼地を支える中世初期の聖者たちの子孫である、オーレスのマラブート的シャイフたちは、散在する我らの村々と遊牧する牧畜氏族とを、純然たる世俗の首長支配には及びもつかぬ権威を持つ単一の宗教・司法網に結びつける。我が王家は修道場の聖廟に寄進を行い、我が首長たちはオーレスのシャイフたちより #italic イジャーザ #! を授かり、我が宗教機構は世襲の学統継承がもたらす深みを得る。オーレスに根を下ろしたこの精神的権威は、聖職者たちを満足させ、平地の宮廷が築きあぐねる正統性を我が政府に与える。"
 cnr_aboriginal_shipwrights: "先住民の船大工"
 cnr_aboriginal_shipwrights_desc: "イベリアを逃れたアンダルスの大工たちと捕虜となったイベリアの船大工たちが、我が先住社会がかつて持たなかったカラベル船体の技術を沿岸の村々に伝え、我がメンセヤートの艦隊は、その輸入された技術と、島々の海岸のあらゆる岩礁・潮流・渓谷河口を知り尽くした途切れることなきグアンチェの知識とを結び合わせる。一世代のうちに、土着の船乗りたちが初の主権を持つ大西洋諸島海軍の乗組員となり、我が歴史上初めて波打ち際を越えて力を及ぼす。土着の海軍を得て、我が宮廷は海を越えて交易に手を伸ばし、我が民自身から水夫を集めるが、それは我らの祖先が決して持ち得なかったものである。"
 dje_hafsid_autonomy: "ハフスの自治権"
 dje_hafsid_autonomy_desc: "我がオアシス連合体は、中央のチュニス宮廷に対して慎重な自治を交渉し、名目上はハフス朝の宗主権を認め、名ばかりの年々のデーツ貢納を納め、定期的な視察の受け入れには応じつつも、内政の全権、水利権の司法、独立した宗教機構を保持する。我が外交使節はチュニス宮廷にて対等な立場で交渉を行い、我が商館は沿岸都市に代理人との関係を保つ。我がオアシスは、平地の辺境連合体が被るような高くつく直接統合を免れる。この交渉による自治は中央宮廷の敵意を和らげ、我が国庫には、直轄統治下のオアシスであれば差し出さねばならぬ歳入を保持させる。"
 fez_morisco_gunsmiths: "モリスコの銃工"
 fez_morisco_gunsmiths_desc: "イベリアを逃れたモリスコの亡命者たちが火縄銃製造の技術をフェズにもたらし、今や銃身も、火皿部品も、銃床も、トレド、グラナダ、コルドバの工房で鍛えられた手によって作られている。#italic フンドゥク・アン＝ナッジャリーン#!に新設された鍛冶職人街はファースの守備隊に火器を供給し、イベリアのテルシオ戦法を仕込まれたモリスコの古参兵たちは、都市郊外の召集場にて我が新兵にその訓練を伝授する。これらの職人と教練師の到来は、我が王家に火器を持つ軽歩兵部隊と、年々育っていく軍事伝統とをもたらす。"
 gbs_date_coastal_industry: "沿岸のナツメヤシ産業"
 gbs_date_coastal_industry_desc: "我が王家は湾岸沿いのデーツ輸出経済を発展させ、新たな掘抜き井戸を穿ち、沿岸平野に沿ってナツメヤシ林を広げ、ガベス、ジェルバ、小規模な沿岸市場を中央のオアシスへと結ぶ舗装路を敷く。拡張のたびに、共有の普請はオアシス後背地一帯での土地利用の費用を引き下げる。沿岸においては、我が田畑と道路は、海から断たれた内陸のオアシスがついに及びえぬ広がりを見せる。"
 iwl_confederation_founding: "連合の設立"
 iwl_confederation_founding_desc: "$IWL$ 連合体は、一連の氏族間同盟、正式な継承協定、儀礼化された叙任式を経て、最高首長を頂く一大トゥアレグ国家として結晶し、ニジェール・サヘル地域全体で最大のトゥアレグ連合体として台頭する。我が最高首長の血統は継続的な継承をもって正式に確立され、連合体全体の集会は毎年定まった時期に開かれる。従属氏族の承認は、周辺の定住民が拘束力あるものとして受け入れる慣習法に記録される。この建国により、$IWL$ は、いかなる小規模なトゥアレグ連合にも勝る威容を備えた、サハラの大国としての地位を占める。"
 kah_post_songhai_resurgence: "ソンガイ崩壊後の復興"
 kah_post_songhai_resurgence_desc: "モロッコの侵攻によるソンガイの崩壊を受け、我が連合体はその政治的空白地帯へと拡大し、トンブクトゥの塩と金の交易を実質的に掌握し、我が若き戦士たちをニジェール屈曲部地域における主要な武力として展開し、生き残った定住民との間に貢納関係を築く。我が最高首長の血統は、ニジェール屈曲部に点在する複数のパシャリク配下の服属を受け、ソンガイの仲介に代わる直接のトゥアレグ支配が成ったことで、我が隊商の収入は急騰する。タガザ・トンブクトゥ塩街道の掌握は、我が経済的地位を大きく押し上げる。ソンガイの後を受け、 $KAH$ は当時の他のいかなるトゥアレグ連合体をも凌ぎ、サハラにおける富の第一位にまで昇る。"
 kay_air_zawiya: "アイールのザーウィヤ網"
 kay_air_zawiya_desc: "高地の谷間に点在する我がアイル地方のザーウィヤ、すなわちスーフィーの修道場とマーリク派のマドラサは、外部のいかなる連合体にも取って代わられぬ宗教的・司法的権威の礎となる。我が常駐のシャイフたちはサハラ・サヘル地域全土からクルアーン学者を育成し、我が慣習法の法廷はマーリク派の先例を既存の部族仲裁の慣行と統合する。巡礼路は近隣の連合体から我が中心の聖廟へと信徒を引き寄せる。これらの修道場はアイルにおける宗教的権威を一手に集めるが、それはより世俗的なトゥアレグ連合体には決して成し得ぬことである。"
 kgs_settled_tuareg_identity: "定住型トゥアレグという在り方"
 kgs_settled_tuareg_identity_desc: "我が連合体は、永続的な居住形態を採り入れ、周辺のハウサの政治経済と統合し、より遊牧的な連合体が敬意と見下しの入り混じった目で見る、トゥアレグと定住民が混ざり合った独自の在り方を育むことで、北方の遊牧トゥアレグ連合体からますます一線を画していく。我が最高首長の宮廷はより定住的な行政形態を採り、我が有力な家々は恒久的な屋敷群を築く。我らが語る自らの物語は、純粋な牧畜的トゥアレグの理想ではなく、農耕と牧畜の融合をはっきりと肯定するものである。定住化したトゥアレグとしての在り方により、 $KGS$ は、開けた砂漠のトゥアレグ連合体よりも、近代サヘルの中央集権勢力が扱いやすい相手となる。"
 kuk_central_court_autonomy: "中央集権国家に対する自治権"
 kuk_central_court_autonomy_desc: "我が王国の地形と、マラブートに支えられた正統性により、アルジェリアの低地を支配するいずれの中央集権的宮廷とも、我らは主権国家として対等に交渉することができる。都合の良い時には貢納を払い、都合が悪ければそれを差し控え、中央宮廷の野心が折につけカビリアに向けて起こす懲罰遠征も、日常的に撃退する。我が外交使節はクッコーの要害という安全の中から外国勢力との取引を行い、我が商人たちは内なる主権を失うことなく低地の港を通じて交易を行う。我が政治的な強さは、平地の連合体ならば崩壊させる挫折をも吸収する。この永続する自治は、さもなければ我らが招くであろう敵意の多くを免れさせ、あらゆる危機を通じて我らを揺るぎなく保つ。"
 mrk_el_badi_palace: "アル・バディーと呼ばれる宮殿"
 mrk_el_badi_palace_desc: "我らがスルタンは$MRK$に#italicバディーウ#!宮殿(「比類なき宮殿」の意)の造営を命じた。その中庭にはイタリア産大理石が敷き詰められ、ワンガラ産の金箔で飾られ、三つの海を越えて運ばれたオニキスが象嵌され、その費用は一世代分の貢納を使い尽くすほどである。歓楽の亭、大浴池、玉座の間は、キリスト教世界の帝宮すら容易に及ばぬ様式で、欧州、オスマン、アフリカ各地からの使節を迎える。この壮大な儀礼複合施設は地中海全域における我が宮廷の地位を高め、いかなる競合する首都も崩し得ぬ絶えざる威信の流れをもたらす。"
 mzb_diaspora_emergence: "ムザブのディアスポラ"
 mzb_diaspora_emergence_desc: "最初のムザブ商人諸家(バイユード家、アトファイヤシュ家、バー・ハック家)が、アルジェ、コンスタンティーヌ、チュニス、そしてアルジェリア沿岸の小都市に商館を構え始め、息子たちを北へ送って商売を学ばせる一方、娘たちは五都市圏に留まる。我が離散商人たちは、本国のイバード派共同体のための金融情報網として機能し、イバード派の信用を広げ、凶作の年には穀物を調達し、利益を五都市圏の寄進財産へと還元する。我らが勃興する離散共同体は、マグリブ全域に我が財力の及ぶ範囲を広げ、同規模のいかなるサハラ共同体も成し得なかった域に達している。"
 ogl_southern_market: "南部の市場"
 ogl_southern_market_desc: "我が中央市場は、マグリブに達する金と奴隷のサハラ越え交易における最大の清算拠点となる。バンバラ、ソンガイ、ハウサの捕虜たちはここで地中海の買い手に売られ、バンブクとブレ産のワンガラの金は鑑定された上で我が印章のもと、アルジェとチュニスの鋳造所へ送られる。我が商館は季節を待つ隊商頭に信用を供与し、我が聖廟は隊商の生還者からの奉納品を受け取り、我が貯水槽は標準化された水税を支払うすべての通行商人に水を供する。交易における我らの優位は、一大陸全体の商いから国庫を満たし、純粋な農業オアシス経済には望めぬ緩衝をもたらす。"
 sos_southern_transsaharan_reach: "サハラ越えの南部遠征"
 sos_southern_transsaharan_reach_desc: "我が南方徴募は、統一指揮のもとアンダルシアの #italic マスケット銃兵 #! 四千を擁する一大サハラ越え遠征を組織し、砂漠を越えてニジェール川大湾曲部にまで力を及ぼし、サハラ越え隊商経済の中心を我がスース徴募地へと据え直す。スーダン地方の金、岩塩採掘の利権、サヘルの貢納は、今や我が銃兵たちが最も深き砂漠を越えて護衛する隊商によってタルーダントへと北上する。サハラ全域に力を及ぼすことで、我が王権は首都から離れた地をも統治でき、独自のマスケット銃兵団を持たぬ内陸マグリブ諸国には望めぬ軽歩兵の火力を備える。"
 tat_ibadi_maliki_coexistence: "イバード学派とマーリク学派の共存"
 tat_ibadi_maliki_coexistence_desc: "マーリク派多数派と #italic イバード派 #! 少数派は、トゥアトのオアシス群においてフォッガーラ水利権、隊商護衛団、クサル評議会を共有しており、この宗教的共存は、自らの法学者の裁定のみに頼るいかなるマグリブの都市首都も及ばぬものである。両派のシャイフたちは同じ連邦会議に列席し、同じ商事仲裁法廷に座し、互いの婚姻・相続契約を承認し合う。この多元的な体制は、我が宮廷に広い寛容と、単一学派の国家には保ち難い幅広い宗教的正統性をもたらす。"
 tfl_mulay_ali_emirate: "ムーレイ・アリ・アッシャリーフの首長国"
 tfl_mulay_ali_emirate_desc: "$TFL$において長い歴史を持つシャリーフの一族であるアラウィー家の最年長者、ムーレイ・アリ・アッシャリーフは、集まったオアシスのカーイド、マラブー、そして部族長たちからバイア（忠誠の誓い）を受け、自治権を持つ南部の小国初の首長として認められた。わが国の宰相で構成される行政機関、刷新された財務体制、そして宮廷儀礼は、我々の先祖であるサハラのイドリース朝の伝統と、マリーン朝の官僚組織の慣行を等しく取り入れており、そうして築かれた首長国は、周囲の反抗的な諸地域が簡単には真似できないほどに内政の整合性が取れている。タフィラルトを単一のシャリーフ王朝のもとに統合したことで、わが国の宮廷は広く行き届く行政力、宗派の垣根を越えた正統性、そして王朝の継続性を備えるに至った。これらはマグリブのより長い歴史を持つスルタン国ですら、同様のものを築き上げるのに何十年も要するほどのものだ。"
 tgt_sultanate_autonomy: "スルタン国の自治"
 tgt_sultanate_autonomy_desc: "我がスルタンは、アルジェのオスマン摂政国との間で、崇高なる門の名目上の宗主権を認め、控えめな年貢を納め、アルジェからの常駐イェニチェリ分遣隊を駐屯補助として受け入れる一方、内政の全権と独立した国庫を保持するという、慎重な自治を取り決める。我が宮廷は、ベルベル部族徴募兵に加え、キリスト教徒からの改宗者、アンダルシア亡命者、オスマン・イェニチェリを契約に基づき雇い入れ、純粋な部族制スルタン国には望めぬ国際色豊かな将校団を我が軍にもたらす。この交渉によって得た自治は、アルジェ摂政国の政治的動乱が続く幾世紀を通じ、我が独立を守り抜く。"
 tle_maliki_high_council: "マーリク学派の高等会議"
 tle_maliki_high_council_desc: "我が都市の #italic マーリク派 #! 法学者たちは、トレムセンの偉大な #italic カーディー #! イブン・マルズークと、 #italic ヤアクービーヤ #! 学院における長きにわたる師の系譜を受け継ぎ、西マグリブ全域にとって正統法学の公認せる会議体として集う。 #italic マジュリス・マーリキー・ティリムサーン #! の裁定は #italic カーディリー #! 教団と #italic シャーズィリー #! 教団のスーフィー網を通じて広まり、 $fez$ や $MRK$ 、そしてサハラ越えの諸首長国の法廷でも引用され、自前の法的権威を望むスルタンたちさえも拘束する。この集約された法学的・学術的権威は、我が文化的影響力を政治的国境のはるか先にまで広げ、西マグリブの聖職者層を我が宮廷に結びつける。"
 trg_inadan_silversmith_caste: "イナダンの銀細工カースト"
 trg_inadan_silversmith_caste_desc: "#italicイナデン#!は、あらゆるトゥアレグ連合に互恵的な庇護契約のもとで仕える、鍛冶師と宝飾師からなる内婚的カーストであり、アガデスの銀十字架、タクーバ剣の刀身、象嵌細工の革製護符箱、そしてサハラ全域で高値を呼ぶ鉄鍛造の槍と刃物を作る。我が名匠たちは、その技をカースト内の世襲徒弟制を通じて伝え、鉄の鍛造技術と銀細工の技能は幾世代にもわたり同じ一族に集中している。かくも集中した金属加工は、いかなる定住型サハラ勢力も再現し得ぬ銀細工と鉄細工とで我が工房を満たす。"
 ahg_imashaghen_caste: "イマシャゲンと呼ばれる貴族階級"
 ahg_imashaghen_caste_desc: "#italicイマシャゲン#!は$AHG$の戦士貴族カーストであり、連合の外交、戦闘襲撃、部族間の調停を担う騎馬の精鋭を供する。我が貴族たちは輸入のバルブ馬にメハリ(ラクダ)とともに跨り、近隣の貴族諸家との婚姻同盟は広くサハラ・トゥアレグ世界を結びつける。我らが首長は、最も近しい顧問たちをイマシャゲンの血筋から選ぶ。戦士貴族のカーストは、より平等主義的な他のトゥアレグ連合とは異なり、我が外交と騎兵に個人的かつ高貴な基盤を与える。"
 ait_rahmaniyya_zawaya: "ラーマニヤ教団のザーウィヤ"
 ait_rahmaniyya_zawaya_desc: "#italic ターリカ・ラフマーニーヤ #! は、シーディー・ムハンマド・ベン・アブド・アッラフマーンによりジュルジュラの入口にて創設され、カビリー全域に広がる #italic ザーウィヤ #! 網を通じて布教されたもので、我が宗教制度、村の名士たち、季節徴募兵を単一のスーフィー潮流のもとに結びつける。我が王権は道場付属のモスクを寄進し、我が首長たちはラフマーニーヤの師たちから #italic イジャーザ #! を授かり、教団の宣教師たちは中部マグリブ全域に我が宗教的・文化的影響力を広める。このスーフィー網の庇護は、より局地的な聖者崇拝網が届き得ぬ遠くまで我が信仰と名声を広げる。"
 ajj_islamic_absorption: "イスラム教の受容"
 ajj_islamic_absorption_desc: "ガート在のウラマー、マグリブから訪れるマーリク派法学者、そしてカイロやフェズから最新の宗教的・法学的見解を携え戻るタッシリ地方の巡礼学者たちを通じたイスラーム教義の吸収は、我らが独自の歩調と語法でトゥアレグの改宗を完成させる。我がオアシスのモスクは、地元のタマシェク方言でクルアーンの課程を教える。慣習法の実践はマーリク派の判例を前イスラーム期のトゥアレグの伝統と統合し、我が学者一族は遊牧・牧畜の条件に特化して法の注釈書を著す。かくして適応したイスラームは、 $AJJ$ に我が連合の独特な性格にふさわしい宗教的・法的生活をもたらす。"
 btl_dialect_distinction: "テル地方の名高い方言"
 btl_dialect_distinction_desc: "周囲のアラブ・ベルベル混淆により他所では消え去った古いゼナータ語の特徴を保つ我が独自のテリ・ベルベル方言は、我がオーレスの#italicカーディー#!たちの手稿や、我がマラブーの宗教詩を通じて学問の伝統を支える。我が識字聖職者層は、より多くアラブ化した近隣の連合が失ってしまった方言辞典、宗教詩の手稿、部族史年代記を保存している。この独自の言語は聖職者層の識字を保ち、より中央集権的な低地の宮廷には欠ける精神的・文化的自信を我が国家に満たす。"
 cnr_islander_militias: "島民たちの民兵"
 cnr_islander_militias_desc: "先住民の #italic バノット #! と #italic マガド #! の民兵伝統は、火器を伴って近代化する。各メンセイヤートは、数日のうちに招集され、いかなる上陸に対しても洞窟の要害と尾根道を守り抜き、脅威が去れば同じ速さで解散する、訓練された島民からなる独自の #italic コンパニーア #! を擁する。これ以前の大西洋からの襲撃者たちは、まさにこの防御的地勢に阻まれて砕かれており、我らの改革された招集制度は、以後の襲撃者たちにも先人を上回る成功を許さない。我らの徴募伝統は、中央集権化を進める大陸諸国の常備軍をもってしても容易には枯らし得ぬ、王権の召集に応じる軽歩兵の深い予備力を保つ。"
 dje_oasis_assembly: "オアシスの合議制政府"
 dje_oasis_assembly_desc: "我がオアシス都市は、それぞれが独自の #italic マジュリス・アル=ジャマーア #! (ナツメヤシ園を所有する家長、宗教的シャイフ、商人組合代表からなる会議体)によって治められ、中央モスクの中庭に集い、公共の事柄を論じ、相続や水利権の争いを裁き、儀礼年ごとの首席判事を選出する。この会議体による統治には世襲の王職が存在せず、権威は合意と、宗教的・学術的権威の正統性から生まれる。この合意による統治は、いかなる専制的宮廷も容易には及ばぬ信仰と共同体の結束のおかげで、我がオアシス連合がよく自治を行い、安定を保つことを可能にする。"
 fez_marocain_leather: "モロッコの革"
 fez_marocain_leather_desc: "上質なフェス革(フランス人は #italic マロカン #! と呼び、英国人は #italic モロッコ革 #! と呼ぶ)は、十七世紀から十八世紀にかけて、あらゆる欧州市場における製本用革、鞍具、高級靴の交易を席巻する。我がシュアラ鞣革場とセファリーヌ工房は、いかなる大陸の鞣革場も及ばぬ柔らかさに山羊皮を仕上げ、我が商人たちはその束をマルセイユ、ジェノヴァ、リヴォルノ、ロンドンへと船で送る。我が上質な皮革は、規模こそ大きいが質で劣る他のマグリブの鞣革場には及ばぬ遠方にまで我が名を運ぶ、価値ある輸出品である。"
 gbs_chott_salt_works: "塩湖での製塩"
 gbs_chott_salt_works_desc: "ガベス湾から内陸へと広がる大規模な季節性塩原、ショット・エル・ジェリドの縁にある我が塩田は、粗い工業用塩から我が沿岸の蒸発池が産する精製食卓塩まで、地中海とサハラの塩交易にあらゆる等級を供給する。我が塩倉庫、計量所、関税詰所は、あらゆる荷を保税会計のもとに通し、中央国庫は塩交易の両端から歳入を得る。この塩交易は、王権の金庫を大きく安定した歳入で満たす。"
 iwl_kel_dinnik_ataram: "ケル・ディンニクとケル・アタラム"
 iwl_kel_dinnik_ataram_desc: "我が連合は、ニジェールを中心とする東方のケル・ディニク支族と、マリを中心とする西方のケル・アタラム支族とに正式に分裂するが、これは公然たる抗争に崩壊するのではなく、両支族の首長間の外交によって管理される。両支族は対外外交において足並みを揃え、首長家系は一定の間隔で使節を交換する。地理的な分裂を越えて共通の文化的アイデンティティが保たれ、分裂しかねなかった王国を連邦として存続させている。この分裂を管理することで、 $IWL$ は分裂することなく新たな領土にわたって自らの一体性を保つ。これはより小規模なトゥアレグ王国には成し得ないことである。"
 kah_kidal_tessalit: "行政中心地としてのキダルとテッサリト"
 kah_kidal_tessalit_desc: "アドラル山塊の門口に位置する小さな市場町、キダルとテッサリトという定住の行政中心地は、我が連合の恒久的な政庁として機能し、首長の官房、慣習法の法廷、そしてサハラ縦断隊商に課税する税関を擁している。有力な家系はいずれの町にも邸宅を構える。我が司法会議は四半期ごとの定期開催とされ、首長は年に一度の主要な会合の折にキダルで法廷を開く。常設の政庁を持つことで、 $KAH$ は移動する野営地では得られない安定をもって統治を行う。これは純粋に遊牧的なトゥアレグ連合にはできないことである。"
 kay_inter_confederation_diplomacy: "連合間の外交"
 kay_inter_confederation_diplomacy_desc: "北のケル・アハガルと南西のイウェレメデンの間に位置する我が領地は、トゥアレグ諸連合間の外交の中心地たる地位を占めている。牧草地と水利権をめぐる紛争の調停、首長位継承の相互承認の仲介、そして中央のアガデス宮廷における多連合会議の招集を担う。我が使節はホガルおよびイウェレメデンの首長宮廷に常駐の地位を有する。我が首長は中央サハラのトゥアレグ世界における最上位の外交調停者として認められ、慣習法の法廷は純粋に内部の権威だけでは裁けない連合間の紛争を裁定する。調停者として、$KAY$ はトゥアレグ世界の中心に立ち、より周縁の勢力には届かぬ地位にある。"
 kgs_sahel_sudan_trade: "サヘル・スーダン交易との一体化"
 kgs_sahel_sudan_trade_desc: "我が連合は、セネガルからハウサランドを経てボルヌーへと至る東西の商業路、より広大なサヘル・スーダン交易網に組み込まれており、我が立地によってこれをサハラ縦断隊商交易からの南北の支線として活用できる。税関はいずれの路でも通行料を徴収する。我が商人一族はハウサおよびサヘルの主要商業都市に支店を構え、牧畜と農業が混在する経済が、隊商が双方向に取引する物資を生み出している。南北・東西の二つの路に沿って交易することで、$KGS$ は北方のみを見据えるトゥアレグ諸連合よりも豊かな収入を得ている。"
 kuk_rahmaniyya_lodges: "ラーマニヤ教団の修道所"
 kuk_rahmaniyya_lodges_desc: "ジュルジュラの地に創設され、幾世代にもわたり数十のカビール #italic ザーウィヤ #! を通じて広められた #italic ラフマーニーヤ教団 #! のロッジ網は、我が宗教界、村落の名士たち、そして季節ごとの徴兵を一つのスーフィー潮流のもとに結びつけている。我が王家はロッジのモスクに寄進を行い、我が首長たちはラフマーニーヤ派の導師から #italic イジャーザ #! を授けられ、教団の宣教師たちは我が宗教的・文化的影響力を中央マグレブ全域に広める。このスーフィー網への庇護は我が聖職者層を刷新し、より局地的なマラブー網をも凌いで、我が信仰をより広いカビリア全土に広める。"
 mrk_atlas_tribal_levies: "アトラスの部族兵"
 mrk_atlas_tribal_levies_desc: "高アトラスおよび中アトラスのベルベル諸氏族は、$MRK$の王位に対する世襲の動員契約によって結ばれており、アルモラヴィド朝の創始者たちが初めて制度化した重装歩兵の伝統に鍛えられた、規律ある#italicアスカル・アル=ジバール#!（山岳歩兵）を我が常備軍に供給している。それぞれの氏族連合は独自の召集地、独自の武器師範、そして祖先より受け継いだ神聖な信託として徴兵義務を担う首長のもとでの独自の指揮系統を維持している。アトラスの徴募兵は、我が正規軍に山岳での耐久力と王朝への忠誠を備えた重装歩兵団をもたらし、敗北後も速やかに立て直す。"
 mzb_djemaa_governance: "ジャマによる統治"
 mzb_djemaa_governance_desc: "ムザブの各都市はそれぞれ独自の #italic ジェマー #! （各家長の代表による議会）によって統治され、市のモスクの中庭に集って市政を議論し、紛争を解決し、究極の道徳的権威を行使する #italic アッザーバ #! 評議会を選出する。ジェマー制度には世襲の官職も貴族の特権も存在せず、創設家系の成人男子は一人一票の平等な権利を有し、評議会の合議による裁定は最も裕福な商家すら拘束する。原初的共和制的な合意統治は我が五都市連合を安定させ、専制的なスルタン国には決して得られない宗教的・共同体的連帯の上に成り立っている。"
 ogl_caravan_dominance: "隊商の支配"
 ogl_caravan_dominance_desc: "我らは中央サハラ交易において並ぶ者なき支配を確立した。アルジェ摂政府の隊商、チュニジア・ハフス朝の商団、タフィラルト行きの西方交易、そして深部サハラのトゥアレグ路、そのいずれもが我が門にて通行料を納める。我が隊商官吏は通過するすべての家畜の台帳を保ち、書記官は商品とその価値を記録し、我が王家はより分権的なオアシス連合には及びもつかぬ取引ごとの取り分を得ている。交易路を支配することで安定した収入の流れが生まれ、他のサハラ諸勢力は盗賊行為によってしかこれに対抗しようがない。"
 sos_bilad_al_siba_warriors: "ビラード・アス・スィーバの戦士"
 sos_bilad_al_siba_warriors_desc: "いかなるマフザンの確実な支配も及ばぬ反抗の地、#italicビラード・アッ＝シーバ#!の山岳部族は、遠方の$fez$や$marrakesh$にいるいかなるスルタンよりも、地元のカーイドへの忠誠を貫く、規律ある重装歩兵を我が南方の軍に供給している。我が管轄のサハラにまで及ぶ広がりゆえに、我が出納官は部族の地元にまで赴き、集会の天幕にてその季節の徴兵を交渉し、平地の都市が布告によっては決して強いえぬ内部規律を備えた連隊を伴って引き上げる。我が分権的な戦士の伝統は、王家の召集に応じる山岳重装歩兵の深い予備兵力を保持し、その士気はいかなる統制された常備軍よりも速く敗北から立ち直る。"
 tat_caravan_oligopoly: "隊商業の寡占"
 tat_caravan_oligopoly_desc: "トゥアト商隊の諸家（カワースィム家、ブー・バクル家、クンティー家）は、各中継地の保税倉庫、オアシスの門に掲げられた固定関税、そして競合者が真似のできぬ独占護送契約を通じて、サハラ縦断交易の独占を制度として確立している。ワラータ、ティンブクトゥ、シジルマーサ、トゥッグールトにいる我が代理人たちは、すべての積荷を同一の帳簿を通して処理する。固く握られたこの独占は、我が王家に大いなる商業力と安定した関税収入をもたらす一方、より広いサハラの無秩序な隊商仲買の町々はそれを持たぬままである。"
 tfl_oasis_tax_resilience: "オアシスの税制の安定性"
 tfl_oasis_tax_resilience_desc: "タフィラルトの灌漑台帳、すなわちすべての #italic セギア #! 水路、すべてのナツメヤシの区画、そしてすべての世帯の水利権をカーイド会議が綿密に記録したものによって、我が財務官はマフザンの巡回検察官が他では真似のできぬ正確さと公平さをもって課税の査定と徴収を行うことができる。タフィラルティの商隊諸家も同じ台帳のもとで会計を保ち、内陸のいかなる宮廷も自国の商人からは引き出せぬほど控えめな手数料で国家の契約を締結する。深く根付いたオアシスの財政慣行は、我が国庫に安定した税収と、マフザンの中央諸州がなかなか及ばぬ商人統制における倹約の規律とをもたらす。"
 tgt_sultanate_administration: "スルタン国の統治"
 tgt_sultanate_administration_desc: "我がベニ・ジェラーブ家のスルタンたちは、 #italic マフザン #! 行政を真の財政機構へと洗練させ、ナツメヤシ林とその収穫を登録し、隊商の取引を記録し、中央国庫から俸給を支払う書記や裁判官を雇い、村の #italic カーディー #! からスルタン自身の #italic ディーワーン #! に至る階層的な法廷制度を通じて正義を行う。我らはチュニス、アルジェ、さらにはカイロからも訓練された行政官を顧問として招き、我が宮廷の正式アラビア語による書簡はオスマン世界全域へと流れ、我が公文書館はスルタン国のあらゆる財政記録を保存している。我が行政の洗練は、他のいかなるサハラのオアシス国家にも及ばぬほど財政・司法の分野に深く行き渡っている。"
 tle_tijaniyya_origins: "ティジャーニー教団の起源"
 tle_tijaniyya_origins_desc: "#italic マーリク派のファキーフ #! アフマド・アッ＝ティジャーニーは、我が領土南端のアイン・マーディーのオアシスに、自らの名を冠した #italic タリーカ・ティジャーニーヤ #! を創設し、預言者との独占的な霊的契約と、先行するあらゆるスーフィー教団を飛び越える権威の系譜を主張する。ティジャーニー派の宣教師たちは我が国から西方および南方サハラ全域に広がり、$fez$、セネガルの辺境、さらにはスーダン諸首長国にまで及び、教団とともにそのトレムセンの発祥地の外交的威信をも広める。この新たなスーフィー網は、大西洋沿岸からサハラ縦断世界に至るあらゆるムスリム宮廷にまで我が宗教的影響力を広げる。"
 trg_mehari_corps: "メハリ部隊"
 trg_mehari_corps_desc: "荷運び用の鈍重な品種ではなく、俊足のレース用ラクダに乗る#italicメハリ#!部隊は、アイル、アハガル、タッシリの砂丘地帯において、いかなる騎馬軍も及ばぬ耐久力を備えた砂漠深部の精鋭打撃部隊を支えている。我が騎兵は行軍中のあらゆるオアシスの井戸で新たな乗騎を調達し、各連合の野営地ごとに負傷した騎手を新たなイムーハグおよびイムガド戦士と交代させ、定住軍であれば耐えがたいはずの損失にも士気を崩さず野営に戻る。我が精鋭騎馬の伝統は、敗北後も速やかに立て直し、連隊を迅速に増強する。これはサヘルやマグレブの定住軍には成し得ぬことである。"
 ahg_pastoral_persistence: "牧畜型文化の粘り強さ"
 ahg_pastoral_persistence_desc: "我が連合は、オスマン、シャリーフ朝、そして近代の中央集権的行政に至るまで、歴代の外部権力による中央集権化の圧力を耐え抜いてきた。それは我らのアイデンティティを、いかなる固定の行政都市にではなく、ホガルの牧草地に根ざしているからである。我が移動経路は政治的圧力に応じて変化する。我が首長の家系はクーデターや妥協を経てもなお王朝の連続性を保ち、牧畜経済は定住国家の課税網から独立を保っている。我が牧畜連合の持続力は、より定住的なマグレブ諸国家が外部の支配下に落ちる時でさえ、 $AHG$ をその地に存続させる。"
 ait_diaspora_emigration: "カビールのディアスポラ"
 ait_diaspora_emigration_desc: "我が山岳連合の狭隘な農業の余地は、次男以下の息子たちを移住へと駆り立てる。カビール人の商人、石工、カフェの店主、季節労働者たちは、地中海沿岸のあらゆる都市にネットワークを築き、信頼する同族の手を通じて送金を故郷に送り、婚姻や相続のために村へと戻る。我が離散民の世帯は我が政治的境界をはるかに超えて商業の手を広げ、都市の移民共同体は年々故郷の村から新来者を引き寄せる。我が移民たちは我が交易を遠方にまで運び、純粋に農業に頼る山岳連合には決してできぬ仕方で、我が町々を新来者で満たしている。"
 ajj_late_caravan_resilience: "隊商の衰退への適応力"
 ajj_late_caravan_resilience_desc: "外国の海運競争と北部沿岸鉄道の拡張によりサハラの隊商交易が衰退する中、我が連合は適応し、定住諸家族をオアシス農業、通行税徴収、そして生き残った隊商がなお利益を上げる小規模ながら高級な商品交易へと多角化させている。ガートの税関は徴税手法を洗練させ、隊商頭は利幅の大きい特殊な路線に特化し、大首長は我が領内を通る残存交易の流れを保つべく通行料率を調整する。この適応力により、サハラ縦断回廊が収縮する中で路線依存度の高いトゥアレグ諸連合が衰えゆく一方、$AJJ$ は繁栄を保つ。"
 btl_berber_arabic_press: "ベルベル語とアラビア語による出版"
 btl_berber_arabic_press_desc: "オーレス山地の市場町にある我が後期の印刷業者や石版印刷業者は、ベルベル語とアラビア語の二言語新聞、宗教小冊子、部族史年代記を刊行し、識字層のマグリブ読者を通じて我らの独自の文化的アイデンティティを広めている。我らは広範なアラブ・イスラーム改革運動と対話を続けながら、我が連合に固有の言語的・儀礼的遺産を守り続ける。この二言語出版の復興は、散在する我が連合を共有の近代的アイデンティティへと結びつけ、テル地方一帯をも我らの言語と信仰へと引き寄せる。"
 cnr_guanche_renaissance: "グアンチェ語の復興"
 cnr_guanche_renaissance_desc: "仮想のグアンチェ #italic ナフダ #! が根付く。先住の学者たちはメンセイアート記録に残る祖先のタマジグト・グアンチェ文字を復興させ、接触以前の口承年代記を印刷物として蘇らせ、グアンチェ語とカスティーリャ語の二言語新聞を発行し、全島の子供たちが継承した言語をヨーロッパの言語と並んで学べる学校を開く。セファルディム、アンダルシア系、先住民の学者が勤める我が学術院は、どの大陸の天文台にも真似できぬ火山の頂から天空を観測し、天文学、航海術、自然哲学を一体となって進展させる。この復興は我が宮廷の学問を活気づけ、より古くから確立された大陸の首都に匹敵する識字階級を育て上げる。"
 dje_ibadi_revival: "イバード派の名著の再出版"
 dje_ibadi_revival_desc: "我が後期の知識人たちは、イバード・ワフビー派の偉大な古典(アッ=サミーニーの法学注釈、ジェリドの神秘主義者たちの霊的詩、南チュニジアのオアシス年代記)の出版を復興させ、ムザブからオマン、ザンジバルに至る広大なイバード世界と我らの共同体を結ぶ改革派アラビア語新聞をあわせて刊行する。我らの二言語新聞はトズールからガベスを経てチュニスまで流通し、我が学者たちはカイロやダマスカスの改革派出版界と対等の立場で文通する。このイバード遺産の復興は、散在する我がオアシスの伝統を共有の近代的アイデンティティへと結びつけ、我が国に広範な読者層と、他の小規模イバード共同体の間での地位をもたらす。"
 fez_guild_chambers: "ギルドの会議所"
 fez_guild_chambers_desc: "都市文書館における #italic ヒスバ #! 監督官、ギルド長名簿、徒弟契約によって制度化されたフェス式ギルド制度は、我が都市にマグリブのいかなる首都にも勝る最も規制の行き届いた職人経済をもたらしている。織工、染物師、書家、真鍮職人、皮なめし職人、調香師など各業種はそれぞれの組合、試験基準、紛争仲裁、そしてスルタンのディーワーンへの代表権を維持している。これら規制されたギルドは我が経済全体における新たな工房の設立を速め、秩序ある商業規律を通じて都市民階級を王座に結びつける。"
 gbs_djerba_link: "ジェルバとの商業的結びつき"
 gbs_djerba_link_desc: "ガベス湾の狭い水路を挟んだ漁業と交易の日々の往来によって支えられる、ジェルバ島との緊密な商業的結びつきは、ジェルバ在住のセファルディム、ジェノヴァ、マルタの商館を通じて我が商人網を地中海全域に広げている。我が代理商はジェルバの仲介者を通じてあらゆる地中海の港で商いを行い、我が海運業者はジェルバの水先案内業者と連携する。関税所は島と本土双方の交易から歳入を得る。ジェルバを経由することで我が国は海上交易をより確実に掌握し、我が商人たちは純粋な内陸沿岸都市の商人よりも遠くまで手を伸ばす。"
 iwl_paramount_century: "最盛の世紀"
 iwl_paramount_century_desc: "我が連合は十九世紀、ニジェール・サヘル地域最大のトゥアレグ大首長国としてその最盛期を迎え、大首長はソコト・カリフ国、マシナ帝国、トゥクロール帝国、そしてマグリブ沿岸の諸侯国と直接の関係を結ぶ。我が領域を取り囲むあらゆる定住諸国は、我が大首長家をトゥアレグ最高の権威として認める。我が使節網はこの時代のサハラ諸勢力の中で最も広い外交的到達範囲を維持し、我らの文化的連合アイデンティティはこの時最も明確に、そして自覚的に表現される。十九世紀随一のトゥアレグ勢力として、$IWL$ はサハラ諸国の中で対等な一員として立ち、この時代に他のいかなるトゥアレグ連合も主張し得ぬ地位を占める。"
 kah_ifoghas_paramountcy: "イフォガスの最高首長"
 kah_ifoghas_paramountcy_desc: "$KAH$ の筆頭貴族である我が大首長イフォガス家は、十九世紀に大首長の地位を再び確立し、アドラールおよびニジェール湾曲部の広範な地域にわたり氏族の忠誠を固め、マグリブ沿岸から押し寄せる近代化の圧力に直面しつつ連合全体に及ぶ権威を主張する。我が大首長家の系譜は主要な継承の度に再確認される。北部沿岸の諸権力とサヘル地域の諸勢力双方との外交的関与は連合の自治を維持し、我らの文化的連合アイデンティティは外圧によって解体されるどころか、むしろ研ぎ澄まされる。このイフォガスの大首長統治は、十九世紀の中央集権化の潮流を純粋な伝統的トゥアレグ集団が乗り切れなかった中で、 $KAH$ という連合の地位を新たにする。"
 kay_tijaniyya_air: "ティジャーニー教団の受容"
 kay_tijaniyya_air_desc: "アルジェリアの発祥地からサハラ・サヘルのスーフィー道場網を通じて西へと広まったティジャーニー教団は、我がアイル地方のザーウィヤにおいて早くから熱烈に受け入れられ、我が在住のシャイフたちはティジャーニー入信を受け入れ、既存の学問網を通じて下位の氏族共同体へと教義を広める。我が宗教機構はこの新教団をより古いカーディリー教団の伝統と並んで統合し、我が大首長宮廷は両教団を同時に庇護する。説教師たちはティジャーニーの教義を我が国境を越え南方のハウサおよびソコト地域の人々へと運ぶ。ティジャーニー教団を取り込むことで、$KAY$ はその宗教網を純粋な北部トゥアレグ連合の及ばぬサヘルにまで広げる。"
 kgs_modern_synthesis: "トゥアレグとハウサの現代的融合"
 kgs_modern_synthesis_desc: "我が連合は、ハウサとトゥアレグが融合した独自のアイデンティティを保ったまま近代を迎え、遊牧的孤立へと退くのではなく周辺のハウサ諸国との農牧統合に傾くことで、前植民地期後期の中央集権化圧力を乗り切っている。我が大首長家は南のソコト・カリフ国、北のトゥアレグ諸連合双方と正式な関係を維持する。我らの独自の文化形態は認められた混成の第三の道として存続し、我らの経済的・政治的生活は変化する地域情勢に対し純粋な遊牧トゥアレグ連合よりも適応力を示す。柔軟で混成的なアイデンティティにより、より保守的なトゥアレグが挫折する中でも $KGS$ は変化を生き抜く。"
 kuk_diaspora_networks: "カビール人ディアスポラたちのつながり"
 kuk_diaspora_networks_desc: "地中海沿岸のあらゆる都市に網を張る、我が後期のカビール人商人、カフェ経営者、石工、季節労働者からなる移民・出稼ぎ共同体は、送金、都市移民共同体、そして村落や要塞の改修資金となる帰還移民資本の絶え間ない流入を通じて我が王国の繁栄を支えている。我が離散共同体の各家は故郷の村との世襲的なつながりを維持し、娘たちを嫁がせるために送り返し、純粋な農業国には得られぬ条件で外国資本を我が山岳経済にもたらす。王国の息子が居を構えたあらゆる港から金銭と知らせが故郷へと流れ込み、我が町々はそれによってより富む。"
 mrk_southern_makhzen_axis: "南部のマフゼンの独自性"
 mrk_southern_makhzen_axis_desc: "$MRK$の我が宮廷は、宰相、カーイド、財務官から成る独自の#italicディーワーン#!を通じてモロッコ・マフザンの南半分を統治しており、これは$fez$にある北の宮廷と並立する機関であって、サハラ外交、アトラス山地の部族仲裁、そして南部全域の大西洋岸港湾関税を取り仕切る。我が使節はスースのカーイドたち、ドラアのシャリーフ諸家、そしてサハラの首長たちと、北への照会なしに交渉し、他の行政機関が二つの首都の間で書簡を取り次ぐのに費やす時間のうちに国事を処理する。この南部行政により、マラケシュの王座は北の宮廷を介さずに外交的・財政的に行動することができ、他のいかなるマグリブの首都もこれを容易に抑えることはできない。"
 mzb_ibadi_modernism: "イバード法学の現代主義"
 mzb_ibadi_modernism_desc: "十九世紀後半の我が知識人たち(ワフビーヤ派の柱たるシェイフ・ムハンマド・ベン・ユースフ・アトファイヤーシュ、シェイフ・イブラーヒーム・バイユード、そして若い世代の #italic サラフィーヤ #! 改革者たち)は、ムザブをカイロ、ダマスカス、インド洋世界の広範なイスラーム改革運動との対話へと開く。我らは学生をチュニスとカイロへ送り、ガルダイアから発行される我が機関誌はアルジェとコンスタンティーヌのサラフィー派出版界と関わりを持ち、我がペンタポリスの学術伝統はザンジバルとオマンの広大なイバード世界と対等な立場で出会う。この近代主義的知的復興は、散在するイバード世界を中央集権化を図る外国行政が解体しがたい共有の近代的共同体へと結びつける。"
 ogl_sharif_resistance: "ワルグラのシャリーフ"
 ogl_sharif_resistance_desc: "イドリース朝の預言者的血統を主張する地元の #italic シャリーフ #! 、スィーディー・ムハンマド・ベン・アブドゥッラーは、王朝的かつ宗教的抵抗の単一の旗の下に統一されたサハラ蜂起を宣言し、砂漠の諸部族、 #italic ティジャーニー #! 教団、そして不満を抱くオアシスの名士たちを己の旗下に集める。彼の遠征は、深いサハラの諸連合、ティジャーニーの道場、タフィラルトの隊商家を武装連合へとまとめ上げ、直接支配下に置こうとする中央集権的な宮廷に対し、長年にわたり南アルジェリア国境を守り抜く。この長期にわたるサハラ蜂起は、より迅速に鎮圧された北部のオアシスには決して得られなかった、武装抵抗の威信と一度に多くの連合を結集させる力を我が国にもたらす。"
 sos_soussi_grocer_diaspora: "サスの食料品店ディアスポラ"
 sos_soussi_grocer_diaspora_desc: "スースから地中海沿岸に至るあらゆる市場町にまたがる共有の#italicタクビルト#!親族契約によって結ばれた$SOS$の商家は、若い息子たちを我が政治的境界をはるかに越えた都市へと送り出し、食料品店、搾油所、香辛料店を開かせる。スースのアルガンの林を所有する一家が、タンジールの香辛料店、$fez$の染物屋、そしてサレの穀物倉庫をも営み、故郷の村の長老たちの下で息子たちが戻る年次の集まりで帳簿を精算する。この商業上の離散は、兵士や外交官を一人も動員することなく、我が商人たちの手の届く範囲と移住者への我らの引力とを、正式な国境をはるかに越えて広げている。"
 tat_steamship_era_pivot: "蒸気船時代に合わせた変化"
 tat_steamship_era_pivot_desc: "十九世紀後半、大西洋の蒸気船が金と奴隷の交易を砂漠路から逸らす中、トゥアト諸家はナツメヤシ、塩、そしてサハラ観光の輸送へと転換し、我が町々を蒸気革命を生き延びるより小さいが持続的な商業的隙間に適応させている。我がオアシスは今や訪問する外国人学者、商人代理、好奇心旺盛な旅行者を迎え入れ、彼らの支払いや贈り物が残存する隊商収入を補い、アルジェとオランの我が代理商は地中海沿岸の汽船路線への接続を開いている。この転換は海路による一定の交易を開き、入植者を我が町々へと引き寄せる。これは交易量のみに依存して生きるサハラの町々には決して為し得なかったことである。"
 tfl_trans_saharan_outposts: "サハラ交易の拠点"
 tfl_trans_saharan_outposts_desc: "$TFL$のカーイドたちは、ティンドゥフ、イン・サラー、ワディ・サウラ、そしてその間に点在する砂漠の水場に駐屯拠点網を維持し、これを通じて我が商家、書記、外交使節はサハラ奥地を越えてアドラール、ワラタ、さらにその先のサヘルの諸首長国にまで影響力を及ぼしている。各#italicフンドゥク#!に常駐する我が守備隊は、水利権、武装護衛、保税倉庫を一体として運用し、遠方の宮廷の指令ではなく、タフィラルト本国の資本とタフィラルトの関税にこそ、サハラ縦断商業網を固定している。この拠点網は我がオアシスの商業的到達範囲を正式な国境をはるかに超えて拡大し、内陸マグレブ諸国が容易には築けぬ中継地の連鎖を我が商家に与えている。"
 tgt_qadiriyya_zawiyas: "カーディリー教団のザーウィヤ網"
 tgt_qadiriyya_zawiyas_desc: "我が中央オアシスは、トルガ、シディ・ハレド、そしてその間に連なる修道場の数々からなる、アルジェリア南部サハラ最大の #italic カーディリー #! 派スーフィーの #italic ザーウィヤ #! 群を擁し、オーレス山脈からサヘルに至るあらゆるオアシスから巡礼者を引き寄せ、共有の儀礼と寄進地を通じて南部の宗教権威を我が宮廷に結びつけている。我がスルタンは修道場付属モスクの維持費、カーディリー派シャイフたちの教学サークル、そして幾千もの巡礼者を我が都市に呼び込む季節の #italic マウリド #! 祭の費用を賄っている。このスーフィー教団への庇護は、純粋な世俗スルタン国には成し得ぬほど、我が王権の宗教的・文化的影響力を南方全域に広げている。"
 tle_tlemcen_nahda: "トレムセンのナフダ"
 tle_tlemcen_nahda_desc: "我が文化復興、トレムセンの#italicナフダ#!は、学者ムハンマド・アッ＝サイーディー、イブン・フージャ、そして旧メシュアールのサロンを中心に展開し、先の介入によって途絶えかけていたザイヤーン朝・アンダルス遺産を取り戻すものである。我らは大マドラサを修復し、$fez$とエスコリアルの図書館に伝わる中世トレムセンの写本を再版し、ヨーロッパ思想を西マグレブの言論に取り入れる二言語雑誌を発行している。この言語的・知的刷新は、散逸したザイヤーン朝の遺産を、いかなる外国統治も容易には分断し得ない共有の近代的アイデンティティへと結び合わせている。"
 trg_blue_robes_identity: "青いローブのアイデンティティ"
 trg_blue_robes_identity_desc: "我が貴族の #italic リサーム #! （ヴェール）、男たちの肌を藍に染め上げる藍染めの衣、女たちのティフィナグ文字による詩、そして近隣いずこの民も保たぬ母系の慣習——これらトゥアレグのアイデンティティの標章は、他の多くのサハラ諸民族を解体してきた外圧のもとでも存続している。我が学校、牧歌、婚姻契約は、この遺産を世代を越えて絶えることなく伝えている。文化の連続性は、サハラの広大な距離を越えて我が王権の権威を連合全体に行き渡らせ、いかなる中央集権帝国による同化にも抗している。"
 #Hassaniya Shared
 hassaniya_maqil_migrations: "ハッサン族の移住"
 hassaniya_maqil_migrations_desc: "バヌー・ハッサーンおよびより広範なバヌー・マアキルのアラブ諸氏族は、幾世代にもわたって上エジプトから西へと進み、西サハラのサンハージャ・ベルベル人と混淆しつつ、我らの #italic ḥassāniyya #! たるアラビア方言を征服下の陣営に押し広めた。我がシャイフたちは到来したアラブ人の系譜を取り入れ、我が学者たちはあらゆる支配家系の血筋をバヌー・ハッサーンの始祖にまで遡らせ、より古いベルベル語は牧歌や地名にのみ保たれる語彙の基層へと後退していった。このアラブとベルベルの融合は、ビダーンに部族的・系譜的秩序を与え、西サハラを近隣いずこの民とも共有せぬ単一の文化圏へとまとめ上げている。"
 hassaniya_azalai_salt_caravans: "アザライと呼ばれる塩隊商"
 hassaniya_azalai_salt_caravans_desc: "年に二度の大#italicアザライ#!隊商は、ワダンの集結地に集い、南はワラタとニジェール川屈曲部へと向かい、西サハラのイジル採掘地やイジルのサブハから切り出された岩塩の板を、マリとソンガイの金と穀物の市場へと運び下ろす。我が隊商頭たちは各塩田の世襲的な採掘権を保持し、我が駄用ラクダは南行の隊列のために幾百頭と編成され、帰路の隊商はスーダンの砂金、ハウサの布、コラの実を北方の集散地へと持ち帰る。西サハラの産地に根ざしたこの塩と金の交換循環は、ビダーンの国庫に、近隣いずこの経済も地元の岩石から代替しえぬ鉱物収入をもたらしている。"
 hassaniya_mehari_warbands: "メハリの戦士団"
 hassaniya_mehari_warbands_desc: "#italic メハリ #!（サハラの背高い白い乗用ラクダ）は、いかなる騎馬部隊も越え得ぬ地形を、我がハッサーン戦士団に三日で四百キロメートルを踏破させ、報復が組織される前に隊商、定住する敵、そして競合部族を急襲させる。我が若き戦士たちは少年の頃からこれらの獣を馴らし、砂漠の突撃のために隊列を組んで騎乗し、鞍上から弓を射り、追手が現れれば砂丘の中へ散開する術を学ぶ。我らの本拠地たる地形においては、ラクダに乗った襲撃者は、マグレブであれスーダンであれサハラであれ、近隣いずれの軍事体系よりも迅速に動く。"
 hassaniya_sharr_bubba: "シャル・ブッバ"
 hassaniya_sharr_bubba_desc: "#italic シャッル・ブッバ #!、すなわちハッサーン戦士部族とザワーヤ学者部族をついに分かつに至った長き闘争は、殺戮の終結の代償として双方が受け入れる拘束力ある身分境界の休戦をもって幕を閉じた。ハッサーンは武器携行と貢納徴収の独占を保持し、ザワーヤはクルアーン教育、司法仲裁、氏族間外交の独占を保持し、貢納民たるラフマと解放民たるハラティーンは両者の下で定住の地位を受け入れる。この正式な身分制の取り決めは、明確な分業をもって我がビダーン社会を安定させ、氏族間の抗争は再燃しがたくなっている。"
 hassaniya_qadiriyya_tariqa: "カーディリー教団"
 hassaniya_qadiriyya_tariqa_desc: "#italicカーディリー#!教団——クンタ学者系譜とワダン、シンキート、ワラタの大ザワーヤを通じて伝わる西サハラ最古参のスーフィー教団——は、大西洋岸からニジェール川屈曲部に至るまで、ビダーン宗教階層の道徳的・司法的権威を支えている。その入信のシルシラは部族の境を越えてクルアーン学者を結びつけ、その修道場は戦士の力では解決し得ぬ氏族間紛争を仲裁し、その忠誠の誓いは従属部族をそれぞれの庇護ザワーヤへと結びつける。深く根を張ったこのスーフィー教団網は、ビダーン諸首長国に、後発のいかなる教団も容易には取って代われぬ宗教的正当性と個人的忠誠の網を与えている。"
 hassaniya_shinqit_libraries: "シンキートの写本図書館"
 hassaniya_shinqit_libraries_desc: "シンキート、ワダン、ティシート、ワラタの写本図書館群は、西サハラの大学者一族によって守り伝えられ、マーリク派法学、マグレブ文法学、古典アラビア詩、スーフィー神秘主義注釈、そしてビダーン各氏族の系譜に関する幾万冊もの蔵書を擁している。我が写本筆写人たちは新たな世代にサハラの草書体を教え込み、製本師たちは古い写本を細工革で保存している。学者商人たちは複本をカイロ、フェズ、チュニスの図書館へと船積みする。この書物文化の集積は、西サハラに#italicビラード・シンキート#!という文書・学術上の名声をもたらしており、これは輸入書籍のみでは、大西洋の入植者社会がついに得られぬものである。"
 #Moroccan Shared
 moroccan_sharifian_descent: "シャリーフの血統"
 moroccan_sharifian_descent_desc: "我々の王朝は、預言者ムハンマドの直系であるハサン・イブン・アリーの子孫であると主張している。このシャリーフの血統は、8世紀にイドリース朝の始祖たちによってエジプト以西へともたらされ、現在では我らの君主権の神聖な根拠として掲げられている。ムラービト朝、ムワッヒド朝、マリーン朝、ワッタース朝といったベルベル人王朝には、我々の宮廷の譜学者たちが公表し、承認し、バイアの儀式のたびに読み上げる、かの預言者に連なる系譜に匹敵する者はいない。このシャリーフの血統はウラマーの忠誠を確かなものにし、イスラム世界におけるあらゆる同格の君主たちから見た我々の宮廷の格を高めている。"
 moroccan_bay_a: "バイア"
 moroccan_bay_a_desc: "#italicバイア#!とは、$fez$のウラマー、都市の名士たち、そして部族の#italicカーイド#!たちが新たに推戴されたスルタンへの忠誠を誓う正式な宣誓であり、継承のたびに、また重大な政治的危機のたびに更新される盟約である。この行為は統治者と臣民とを相互の義務で結びつける。すなわちスルタンは信仰と慣習法を守ることを誓い、集まった代表者たちは徴兵と納税をもって国家を支えることを誓う。この合意に基づく正当性は我が継承を安定させ、協議の不在があれば解き放たれたであろう遠心的圧力を抑え込んでいる。"
 moroccan_andalusi_refuge: "アンダルス難民"
 moroccan_andalusi_refuge_desc: "アンダルスからの亡命者たちは幾波にもわたって我が沿岸の都市に居を定めた。マンザリー家によって再建されたテトゥアン、#italic アンダルス地区#! of $fez$、サレのオルナチェロス海賊植民地、そしてシェフシャウエンの絹織工たちである。彼らは失われた半島の火薬技術、銀行業の知識、都市建築、そして料理をもたらし、我が古参の商家はこれをただちに吸収した。この避難民の流入は我が諸都市に活力を与え、王権に、彼らを庇護した国家に忠実な熟練市民階層をもたらしている。"
 atlantic_trade_routes: "大西洋交易路"
 atlantic_trade_routes_desc: "ポルトガルとカスティーリャによるボハドール岬の周航は、タンジールからサレ、ラルシュを経てモガドールとアガディールに至る我が全海岸線を貫く新たな大西洋航路網を切り開いた。我らは大西洋沿岸の諸港にある#italicフンドゥク・アン＝ナサーラー#!に欧州商館員を迎え入れ、給水や修理のために寄港するすべての船舶から関税を徴し、物資を内陸のサハラ隊商市場へと再輸出している。この西岸は、我が国家に、専ら地中海に拠る東方のマグレブ諸国に対する恒久的な商業上の優位をもたらしている。"
 moroccan_malhun_poetry: "歌唱詩、マルフーン"
 moroccan_malhun_poetry_desc: "$fez$、メクネス、$marrakesh$、そしてサレの#italicシュユーフ・アル＝マルフーン#!（都市の詩人たち）は、モロッコ・アラブ文化を他のいかなるアラブ詩学派とも異ならしめる歌唱詩の伝統を作り、演じている。#italicカスィーダ#!と#italicグリーハ#!の形式は、口語の#italicダリジャ#!詩をアンダルス・マグレブ音楽の律動に乗せ、愛、風刺、神秘主義、王朝政治といった主題を、都市のあらゆる家庭に親しみやすい調子で扱う。この大衆的な文学伝統は我が諸都市とオアシスの隊商路の双方に広まり、我が農民と市民に、個々の統治者が記憶から薄れてもなお続く、モロッコ・アラブのアイデンティティの威信を支える文化的媒体を与えている。"
 moroccan_nahda_maghribiyya: "ナフダ・マグリビーヤ"
 moroccan_nahda_maghribiyya_desc: "我がモロッコにおける #italic ナフダ #! の支流は、アッラール・アル＝ファースィーとアブー・シュアイブ・アッ＝ドゥッカーリーを中心とする $fez$ の #italic サラフィーヤ #! サークルに、タンジールを拠点とするアラビア語新聞 #italic リサーン・アル＝マグリブ #! に、そしてヨーロッパ思想を西マグレブの言論に取り入れるテトゥアン・フェズ両都市の二言語雑誌に集っている。我らはイブン・ハルドゥーン、マッカリー、マリーン朝年代記作者たちの中世写本を異国の図書館から取り戻し、校訂版として再刊し、学校や公文書における外国の行政用語の中央集権的圧力に抗して、モロッコの古典アラビア語を標準化している。この知的刷新は、我が散らばった知識人層を、中央集権的な外国統治も容易には分断し得ない共有の近代的アイデンティティへと結び合わせている。"
 #Moroccan Unique
 mor_atlas_strongholds: "アトラスの要塞"
 mor_atlas_strongholds_desc: "わが国の大部分を占める山脈——アトラスやリフの諸山脈——こそが、いかなる帝国も$MOR$を真に征服できなかった理由である。我らがアマジグの山岳諸氏族は、ローマ軍が初めてこれらの峠を越えて進軍した時代から、この険しい道を守りつづけており、あらゆる山道と避難所を知り尽くした我らの知識は、いまなお比類がない。山々は我々を妨げるものではなく、我々を守るものなのだ。"
 first_fleet_of_the_med: "地中海の最初の艦隊"
 first_fleet_of_the_med_desc: "$marrakesh$に拠った#italicムワッヒドゥーン#!朝カリフたちの艦隊は、ヤアクーブ・アル＝マンスールの下でイタリア海洋諸共和国からの貢納金によって支えられ、帝都から一元的に指揮され、二世紀にわたり西地中海におけるモロッコの海上覇権を打ち立てた。我が歴代スルタンはサレ、アシーラ、ラルシュの造船施設のみならず、戦略的中央集権の教義をも受け継いでいる。すなわち、いかなる沿岸の私掠船長も単独で起こし得る分散的な私掠行為ではなく、$marrakesh$の号令のもとで単一の目標に向けて派遣される艦隊である。この帝国的な指揮の伝統は、我が海軍を、分裂した沿岸私掠艦隊には決してなり得ぬ、一貫した戦略的道具として機能させている。"
 mor_marinid_takeover: "マリーン朝による支配権の奪取"
 mor_marinid_takeover_desc: "東方高原出身のゼナータ系ベルベル人、バヌー・マリーンは、マラケシュで衰退するムワッヒド朝に取って代わり、フェズ・ジャディードに再編された #italic マフザン #! 庁、州総督からなる簡素化された #italic ディーワーン #! 、そしてムワッヒド朝的な宗教・教義上の行き過ぎを排した宮廷儀礼を中心に、帝国国家を再建する。この王朝交代により、かつての広大なカリフ国に代わって、より引き締まった、統治機構として一貫性のある帝国の玉座が確立される。マリーン朝による再編は、ムワッヒド朝の遺産だけでは成し得なかった、機能する中央集権政府を我が宮廷にもたらす。"
 sle_idrisi_atlantic_port: "イドリースィーが記した大西洋港"
 sle_idrisi_atlantic_port_desc: "パレルモのノルマン宮廷のために筆を執った十二世紀の地理学者アル゠イドリースィーは、サレを西マグリブの主要な大西洋沿岸停泊地のひとつに数え、その埠頭、穀倉、税関を、重要な都市にふさわしい丁寧さで記述している。我が商人たちは、ムラービト朝・ムワッヒド朝の先人たちが築いた埠頭と城壁を、後の中世末期の船舶もなお用いる港として受け継いでいる。中世における卓越性は、我が王冠に、他の劣るマグリブの港の及ばぬ発展した大西洋交易拠点を残した。"
 tet_strait_lookout: "海峡の監視"
 tet_strait_lookout_desc: "テトゥアン上空にそびえる我が沿岸の見張り塔と烽火は、地中海と大西洋を隔てる最も狭い自然の門戸、ジブラルタル海峡の東の入り口を守っている。ムワッヒド朝とマリーン朝の守備隊は、幾世代にもわたりこの高地に駐屯し、イベリアの岸辺と、あらゆる地中海諸国のガレー船の往来を見張ってきた。この海峡における我が監視は、いずれの海から我が沿岸に近づく艦隊についても、宮廷に知らせる。"
 mor_marrakesh_fez_axis: "国家の軸たるマラケシュとフェズ"
 mor_marrakesh_fez_axis_desc: "我が帝国の玉座は二つの首都の上に成り立っている。マラケシュはムワッヒド朝カリフ位の主張から受け継いだ儀礼上の威信を保持し、フェズ・ジャディードは王国の行政と宗教の中心を担う。各首都はそれぞれ独自の #italic ディーワーン #! と軍の指揮を通じて領土の半分を統治し、スルタンは年ごとの儀礼巡幸によって両都を往来し、王国全土にわたる中央権威を主張する。この二都体制は、単一の都を置くいかなるマグリブ国家も及ばぬほど、我が領土の隅々にまで我が支配を行き渡らせる。"
 mor_marinid_madrasas: "マリーン朝のマドラサ"
 mor_marinid_madrasas_desc: "マリーン朝のスルタンたちは、フェズとその周辺都市にまたがる帝国マドラサの網を整備する(#italic ブー・イナーニーヤ #!、#italic アッタリーン #!、メクネスの #italic ブー・イナーニーヤ #!、#italic サフリージュ #!、そして #italic ミスバーヒーヤ #!)。各マドラサにはモスク、図書館、救済院、教師陣が備わり、学生への給費はスルタンの国庫から支払われる。卒業生たちは王国の #italic カーディー #! 職、書記局の書記、説教師の座を占め、共通の教育を通じて宗教界を帝国の玉座と結びつける。このスルタンが財を投じた学問奨励は、我が国をより学識深いものとし、イスラム世界各地から改革派の学者たちを我が宮廷に引き寄せる。"
 sle_early_privateer_charters: "初期の私掠船免許"
 sle_early_privateer_charters_desc: "マリーン朝末期のスルタンたちは、我が港から最初の正式な拿捕免許状を発行し、サレの船長たちに王の許可のもとアラゴン、カスティーリャ、ジェノヴァの船舶を拿捕する権限を与える。我が船長たちは、アンダルス難民の船長たちから地中海における獲物狩りの技を学び、我が沿岸ガレー船は捕獲した積荷と身代金で解放し得る捕虜を伴って帰港し始める。この国家公認の初期私掠行為は、後の私掠共和国の憲法が明文化する基礎を築く。"
 tet_riffian_levies: "リーフ人の召集軍"
 tet_riffian_levies_desc: "テトゥアンの上に村々を戴くジュバーラおよびリーフの山岳諸部族は、伏兵、襲撃、荒れた地形での迅速な退却に長けた軽装の非正規兵を我が守備隊に供給する。各部族連合はそれぞれ独自の徴募慣行、武器の伝統、そして指揮系統を保ち、首長たちは徴兵の義務を都市との世襲契約として扱う。リーフの徴募兵は、低地のマグリブ諸都市が容易には編成し得ない、我が常備軍のための柔軟な補助部隊を成す。"
 mor_sadi_sharifian_emergence: "サーディ族とそのシャリーフの台頭"
 mor_sadi_sharifian_emergence_desc: "サーディ族は、預言者ムハンマドに連なるハサン・イブン・アリーの血を引く部族である。シャリーフに属する地方の有力部族として、長くドラア渓谷に定住していたが、16世紀初頭になると、衰退するワッタース朝からスルタン位を奪わんとする勢力として台頭した。彼らはシャリーフのもとでモロッコとアラブを統一し、権威ある帝国を復興するという目的を掲げ、フェズやマラケシュのウラマー、サハラ交易の隊商主、都市部のアンダルス難民の共同体からたちまち支持を集めた。サーディ朝の台頭によって我々の使節は、地中海のイスラム系勢力の宮廷やサハラ交易圏において、預言者の血筋であることを威信として主張できるようになった。"
 mor_chichaoua_sugar: "チチャウアの砂糖"
 mor_chichaoua_sugar_desc: "シシャウア、スース渓谷、タドラ平原における我が砂糖プランテーションと精製工場は、モロッコ農業をあらゆる段階を一手に握る産業的輸出複合体へと変える。すなわち、スルタンの勅許がサトウキビ農園に免税の地位を与え、王立工場がサトウキビを精製糖へと加工し、帝国の国庫がすべての段階で分け前を取る。我が #italic スッカル・アル=マグリビー #! は大西洋の港を通じて欧州の帳簿係、薬種商、菓子職人のもとへ届き、マデイラやブラジルの競合品を上回る高値で取引される。このサトウキビから精製糖まで王家の手に握られた砂糖産業は、我が中央国庫が直接引き出せる歳入を生み出し、モロッコの王冠に他のいかなるマグリブ国家も及ばぬ高級輸出品の優位を与える。"
 sle_atlantic_corsair_charters: "大西洋の私掠免許状"
 sle_atlantic_corsair_charters_desc: "我が船長たちは、乗組員を通常の海軍規律から免除する一方で、すべての拿捕品の一定の分け前を国庫に納めさせる正式な国家特許のもとで活動しており、この契約に基づく私掠制度は、地中海と大西洋の両世界から野心ある船乗りたちを引き寄せる。サレの私掠組合は、幾世代もの船長たちに、迅速な船の迎撃、信号旗による欺瞞、拿捕審判所での訴訟の技を教え継いでいる。この組織立った私掠の伝統は、折々の国家艦隊の遠征では成し得ぬほど、我が艦隊を幾年も海上にとどめ続ける。"
 tet_andalusi_quarter: "アンダルス人街区"
 tet_andalusi_quarter_desc: "アリー・アル゠マンザリーがアル゠アンダルスから到来した最初の難民の波をもってテトゥアンを再興して以来、市の #italic アンダルス人街 #! は移植されたナスル朝風の街区として立ち現れ、そのタイル張りの泉、中庭を持つ邸宅、鉄細工のバルコニー、絹織物の工房は、失われたアル゠アンダルスの意匠をマグリブの石造りの中に伝えている。グラナダからの亡命者一族は、読み書き、銀行業、そして宗教界を独占し、彼らの学校は都市行政のための書記・筆記者を育成する。この移植された文化によって、テトゥアンは他のいかなるマグリブの港も及ばぬほど、読み書きの行き届いた都市となっている。"
 foreign_politics: "外交政策"
 foreign_politics_desc: "西地中海の玄関口と大西洋補給路を押さえる$MOR$の戦略的位置は、我らを、互いに優位を争う欧州列強いずれにとっても欠くことのできない外交上の均衡役たらしめている。他国の宮廷における我が使節は対等な立場で交渉し、$marrakesh$の#italic崇高なる門#!は大使を迎え、通商条約に署名し、他のいかなるムスリム君主の仲裁も受け入れぬであろうキリスト教諸侯の間の紛争を裁定する。この比類なき外交的地位は、他のいかなるマグリブもサハラ以南の国家も及ばぬ、欧州情勢への影響力をモロッコの玉座に与えている。"
 mor_dhahabi_golden_age: "ダハビー"
 mor_dhahabi_golden_age_desc: "後世が #italic ザハビー #! 、すなわち黄金時代と呼ぶ帝国最盛期の偉大なスルタンたちの治下、我が宮廷は後のいかなるマグリブ国家も並び得ぬほどの規模で富を蓄える。黄金はシジルマーサ、ワラータ、トンブクトゥといったサハラの終着地から流れ込み、精製された砂糖は大西洋の港から欧州の菓子職人のもとへと送られ、キリスト教世界各地の宮廷や崇高なる門からは同盟や通商を求める使節が到来する。絶えることなき繁栄が国庫を満たし、後の治世はそこから軍事遠征、宗教寄進、そして劣る国家には到底支えきれぬ王朝儀礼のための資金を引き出す。"
 sle_bou_regreg_republic: "ブー・レグレグ共和国"
 sle_bou_regreg_republic_desc: "サレとラバトの私掠船長たちは、サアド朝による自分たちの利害の失政に疲れ果て、十七世紀初頭、自前の #italic ディーワーン #! によって選ばれた #italic カーイド #! たちと、条約を結ぶ独自の権能とに縛られた主権的共同体、ブー・レグレグ自治共和国を宣言する。我が共和国はオランダ連邦議会、イングランド、フランス、そしてイタリアの商業諸共和国と、いかなるマグリブの君主国も及ばぬ条件で直接通商協定を結ぶ。主権を有する私掠共同体として、サレは大西洋と西地中海の各地で認められる憲政上の地位を保持している。"
 tet_andalusi_banking_houses: "アンダルスの銀行諸家"
 tet_andalusi_banking_houses_desc: "テトゥアンの我がユダヤ・アンダルス系商業銀行家たち(トレドの商業手形の慣行を亡命先へ持ち込んだカゼス、パリエンテ、ナホン、ベンデラク、トレダノの各家系)は、私掠艦隊と通常の地中海交易の双方に資金を供給している。彼らはリヴォルノ、ジェノヴァ、マルセイユ、アムステルダム、そしてあらゆる地中海の港のセファルディム共同体と取引関係を保っている。この銀行家たちの人脈網を通じて、我が国庫はムスリム商人資本だけでは得られぬ条件で借り入れを行う。"
 jaysh_armies_advance: "ジャイシュ部隊"
 jaysh_armies_advance_desc: "戦争の新時代が幕を開けた。これからは、我々に忠実な地元部族で構成された新たな部隊が必要である。彼らを通じて、広大な領土の資源を活用するのだ。"
 mor_sherifian_inviolability: "シャリーフの不可侵性"
 mor_sherifian_inviolability_desc: "#italic シャリーフの不可侵性 #! という国制上の教義は、預言者の血筋をハサン・イブン・アリーを通じて引くわが君主が、単なる総督や #italic カーイド #! と同列に挑戦され得ぬことを定める。州の反乱は個々の #italic ウンマール #! を打倒し、都市の蜂起は憎まれた徴税人を追い落とし、部族連合は特定の王命に抗うことがあろうとも、シャリーフの王冠そのものは、ウラマーと #italic バイア #! に拘束された名士たちの目には、国制上なお不可侵のままである。この根深い王朝的正統性は、純粋に世俗的権威に依存する君主国を揺るがすであろう地方の騒乱に、我が国が耐え抜くことを可能にする。"
 sle_christian_captive_market: "キリスト教徒の捕虜市場"
 sle_christian_captive_market_desc: "サレとラバトの波止場にある我が捕虜市場は、我が私掠艦隊が捕らえた欧州人捕虜を受け入れ、ジェノヴァの信用状と銀の箱を携えて到来する三位一体修道会とメルセダリオ修道会の修道士たちを通じて身代金と引き換えに返還する。競売人、身代金仲介人、牢番、そして通訳を兼ねる司祭が、緊密に組織された交易を形作り、我が私掠事業全体を支えている。この捕虜交易は、国庫が発注するあらゆる私掠遠征の費用を引き下げている。"
 tet_naqib_al_ashraf: "ナキーブ・アル＝アシュラーフ"
 tet_naqib_al_ashraf_desc: "我が町テトゥアンの預言者家系シャリーフ諸家の長である#italicナキーブ・アル・アシュラーフ#!は、都市の預言者血統の名士たちを召集し、その系譜を認証し、相続争議を調停し、王座に対して彼らの共同利益を代弁する。この評議会は免税特権、都市祭礼における儀礼上の上席権、そして#italicカーディー#!と#italicマフザン#!任命の総督との間の紛争で諮問を受ける権利を有する。この常設シャリーフ評議会の伝統は、預言者の血統という正統な経路を通じて我が都市統治を安定させている。"
 mor_imperial_modernization: "帝国の近代化"
 mor_imperial_modernization_desc: "19世紀の歴代スルタンたちは、行政・財政・軍事にわたる絶え間ない近代化計画を推し進めた。外国人技術顧問を招き、#italicマフザン#!官房を再編し、帝国の兵器廠を近代化し、全国の徴税を標準化した。それぞれの改革は根強い部族勢力やウラマーの抵抗に直面したが、改革と調整を繰り返す緩やかな慣行が徐々に根付き、スルタンが代替わりしても持続した。この継続的な適応により、我が王室は技術者や近代的な行政官を国家権力の要職へと登用でき、あらゆる歳入源からより多くを国庫に収めることができる。"
 mor_makhzen_taxation_reform: "マフゼンの税制改革"
 mor_makhzen_taxation_reform_desc: "#italic ハラージュ #! 、 #italic ウシュール #! 、 #italic ザカート #! 、そして都市同業組合の #italic ガラーマ #! といった伝統的に入り組んだ諸税は、より効率的な統合形態へと繰り返し再編された。農村平野部の一律人頭税である #italic タルティーブ #! 、標準化された都市税、そして規格化された大西洋岸諸港の関税査定である。我が商人たちは自らの負担額を把握するようになり、テトゥアンとモガドールのユダヤ系アンダルシア系銀行家たちはそれに応じて貸付条件を洗練させ、我が国庫は従来重複する免税の隙間から漏れていた歳入を捕捉するようになった。継続的な財政近代化は、純粋に伝統的な税制では到底支えきれない近代軍と公共事業の資金を我が王室にもたらす。"
 sle_atlantic_legal_commerce: "大西洋の合法事業"
 sle_atlantic_legal_commerce_desc: "海賊行為に不利に傾いた海軍力の均衡は、サレを合法的な大西洋貿易へと転換させる。ガルブ平野の小麦、革製品、蜜蝋、サハラ隊商の物産を、大西洋盆岸の外国商館との正式契約を通じて輸出するのである。我が銀行業務は身代金仲介の方式から商業割引貸付へと切り替わり、我が造船所は平和な貨物船の建造を始める。港湾長は標準化された関税査定を採用する。この商業的転換により、私掠船時代の終焉にあたっても我が国庫は歳入基盤を維持できる。"
 tet_andalusi_press_revival: "アンダルスの出版文化の復興"
 tet_andalusi_press_revival_desc: "テトゥアンの後期印刷工・石版工たちは、グラナダ・アンダルシアの古典作品（イブン・ザイドゥーンの #italic ディーワーン #!、リサーン・アッディーン・イブン・アル・ハティーブの散文、イブン・サフルのチュニジア・アンダルシア #italic ムワッシャハート #!）の出版を復興させ、それとともに西マグリブをより広範な #italic ナフダ #! 潮流に結びつける改革派アラビア語新聞を発行する。読み書きのできる農民たちはテトゥアンの印刷街へ移り住み、植字工、製本工、彫版工として修行し、我が市民階級を膨らませ、刷り上がる号ごとに農村の後背地から新たな家族を引き寄せる。この印刷業の復興は、農村から都市への着実な昇進の梯子を開き、純粋に農村に根差した他のマグリブ諸国家には及ばぬ都市への移住の吸引力を我が都市中心部に与える。"
 #Tunisian Shared
 tunisian_maliki_heartland: "マーリク学派の中心地"
 tunisian_maliki_heartland_desc: "カイロより西で最も古いモスク都市であり、7世紀にウクバ・イブン・ナーフィウによって建設されたカイルアン、そしてチュニスのザイトゥーナ・モスク大学は、共にマーリク学派の西方首都の中心をなし、七百年にわたりマグリブ諸国のカーディーとムフティーを養成してきた。我が学者たちはサフヌーンの基本典籍たる #italic ムダウワナ #! を書写し伝承し、我がクルアーン学校はアンダルシアとサハラのウラマーが自らの学統を遡るのと同じ権威の連鎖を教え、我が法学裁定は大西洋からニジェール川屈曲部まで信徒を拘束する。信仰と学問を兼ね備えたこの双子の中心地は、フェズ、トレムセン、マラケシュのいずれよりも古く、比類ない古さと連続性を持つ法学・学術の伝統を担っている。"
 tunisian_sahel_ribats: "サヘルのリバト"
 tunisian_sahel_ribats_desc: "アグラブ朝とファーティマ朝統治初期に沿岸の修道院兼要塞として築かれたスース、モナスティル、マフディアの要塞化された #italic ribāṭ #! 群は、サヘル地方をキリスト教徒の襲撃と内陸ベルベル人の圧力から守る常駐の宗教戦士階級を養成する。各リバートは常設の守備隊と、見張り任務とクルアーン学習、部族間調停を交互に行う敬虔な志願兵の共同体、すなわち #italic ムラービトゥーン #! をともに抱えている。沿岸防衛と宗教教育が合わさり、チュニジアのサヘル地方には他のいかなるマグリブ沿岸にも見られぬ規模の、国境地帯を守る要塞修道院の連なりが生まれる。"
 tunisian_andalusi_refuge: "アンダルス難民"
 tunisian_andalusi_refuge_desc: "グラナダの陥落は、次々とアンダルシア難民の波を我がサヘル地方の港、スファックス、スース、ビゼルトへ、そして内陸のテストゥールとソリマンへと引き寄せ、彼らはアル・アンダルスの工芸、方言、農業技術、建築の記憶を携えてくる。我が商人組合は彼らの工房を取り込み、我が果樹園は彼らの灌漑技術を採り入れる。我が学者たちはイベリアの図書館から救い出された写本を書写する。二つの岸辺の融合は、我が都市文化に独特の性格を与える。"
 tunisian_shadhili_tariqa: "シャージリー教団"
 tunisian_shadhili_tariqa_desc: "アブー・アル・ハサン・アッシャーズィリー（エジプトに定住する前、その形成期の精神修養をチュニジアで過ごした）が創設した #italic シャーズィリー教団 #! は、我がザウィーヤを通じて波のようにマグリブ全域に広がり、我がウラマーが独自に支持するスーフィズムと正統教義の融合を根付かせる。我が学者階級はマーリク法学とシャーズィリーの神秘修行を矛盾なく両立させ、我がシャイフたちはカーディーであると同時にシルシラの継承者でもある。周縁の宗教的諸集団（南部のベルベル部族、草原のヒラール族ベドウィン）は、この教団の修道場網と忠誠の誓約へと取り込まれる。スーフィズムと法学を結びつけることで、我が宗教文化は純粋に法学的な立場に立つマグリブの競合勢力の及ばぬ教義上の柔軟性を得る。"
 tunisian_maliki_hanafi_synthesis: "マーリク学派とハナフィ学派の共存"
 tunisian_maliki_hanafi_synthesis_desc: "我がベイ国の法廷は、マーリク派とハナフィー派の裁判官を並立させている。古くからのマグリブの #italic マズハブ #! は在地住民に仕え、新しいハナフィー学派はオスマン帝国から流入した守備隊とその家族に仕え、民事訴訟においては両者に等しい手続き上の重みが与えられる。我がムフティーたちは互いの裁定を相互参照し、我が隊商商人はそれぞれの契約に最も適した法廷を選び、我がシャリーア文書庫は両学派の判例を並べて保存する。二つの法廷の並立は、純粋にマーリク派のマグリブ西方にも、純粋にハナフィー派のオスマン東方にも知られぬ法的柔軟性を我が都市文化に与える。"
 tunisian_nahda_circle: "チュニジアのナフダ"
 tunisian_nahda_circle_desc: "ハイル・アッディーン・パシャ、イブン・アビー・アッディヤーフ、そしてザイトゥーナの近代主義者たちを中心に集う我が改革派集団は、エジプトやレヴァントのアラブ中枢に同等の運動が根付くより一世代早く、チュニジアの行政・教育・法制を変革する #italic ナフダ #! を推し進める。我々はヨーロッパの政治論文をアラビア語に翻訳し、二言語教育課程を備えたサディーキー学院を創設し、「アフド・アル・アマーン」基本協定がベイ国の慣行に明文化することになる諸規則を起草する。我が国の早期で自生的なアラブ改革運動は、後のエジプトおよびレヴァントのナフダがその礎として認めるに至る近代主義的な知的伝統を築き上げる。"
 #Tunisian Unique
 gfs_capsa_aqueduct: "カプサの水道"
 gfs_capsa_aqueduct_desc: "2世紀に建設され、ジェベル・オルバタの泉から軍団駐屯地と周辺のオリーブ農園に水を供給していた #italic カプサ #! のローマ水道は、ローマ人が敷設したのと同じ石造の水路を通して今なお我がオアシスに水を導いており、千年の間クサルの住民たちによって維持されてきた。我がハンマーム浴場、果樹園の貯水槽、市場の水桶はすべて、この一つの受け継がれた土木技術から水を得ている。我が石工たちは、水路の一部が崩落した際にこれを修復し清掃する技術を保ち続けている。このローマの水利施設は、純粋に中世の工法ではゼロから再現し得ぬ水量をガフサにもたらしている。"
 tun_caliphal_claim: "カリフとしての主張"
 tun_caliphal_claim_desc: "モンゴルによるバグダード陥落がアッバース朝の血統を断った後、我がハフス朝のスルタンたちは#italicヒラーファ#!（ムスリム共同体に対する普遍的な主権）を主張し、ムワッヒド朝のシャイフの血統と、マーリク派正統教義の守護者としての役割を根拠とする。我が金曜礼拝の説教は我がスルタンを信徒たちの長と呼び、我が貨幣はカリフの称号を刻み、マムルーク朝、マリーン朝、イルハン朝との外交文書は対等な主権儀礼を主張する。このカリフ位への主張は、マリーン朝にもザイヤーン朝にもワッタース朝にも匹敵し得ない宗教的・政治的権威を、本来の$TUN$に与える。"
 tunisian_corsairs: "トゥニスの私掠船団"
 tunisian_corsairs_desc: "$TUN$とラ・グレットの私掠船船長たちは、後期ハフス朝時代から地中海中央部でキリスト教徒の船を狩ってきた。国家の特許状のもと、キリスト教徒からの改宗者、ムスリムに改宗したギリシア人船長、そして地中海のあらゆる港から我が勢力下で避難と仕事を見出した冒険者たちとともに活動している。ビゼルトとポルト・ファリーナの我が造船所は、現地出身と外国出身を問わず船長たちが用いる俊足の#italicシュキーラ#!ガレー船を維持し、$TUN$の奴隷市場は捕虜を$maghreb_region$各地からオスマン世界へと再輸出する。チュニジア生まれの人材とレネガードの人材双方を活かしたこの国家後援の私掠行為は、$TUN$に、他のいかなるマグリブの国庫もおよそ維持し得ない数の実戦的な軍船団と船乗りの供給源を与える。"
 connections_with_the_christian_world: "キリスト教世界との絆"
 connections_with_the_christian_world_desc: "ハフス朝のスルタンたちは13世紀以来、ピサ、ジェノヴァ、ヴェネツィア、アラゴン、プロヴァンスと絶え間なく通商・外交関係を維持し、ヨーロッパ商人の駐在代理人を$TUN$とラ・グレットに置くことを認める#italicカピチュレーション#!を相次いで締結してきた。我が宮廷は同胞たるムスリム君主に対してと同じ儀礼をもってキリスト教徒の使節を迎え、イタリア貿易からの関税収入だけで中央国庫の三分の一を賄っている。キリスト教世界のヨーロッパとの実利的な関わりは、より孤立主義的なマグリブ諸国家にはない商業的・外交的柔軟性を$TUN$にもたらしている。"
 gfs_pomegranates_dates: "ザクロとナツメヤシ"
 gfs_pomegranates_dates_desc: "イブン・ハルドゥーンの時代よりマグリブ全域にその大きさ、甘さ、保存性で名高いガフサのザクロ園、そして我がオアシス地帯のナツメヤシは、チュニス、トリポリ、シジルマサの隊商商人が代替品を受け入れず名指しで注文する果実を産する。我が果樹園主たちはナツメヤシとザクロの各区画に世襲の賃借権を保持している。灌漑組合員たちは古来の配分表に従って井戸水を分配し、我が隊商長たちは各荷を嵩ではなく原産の果樹園によって値付けする。この果実輸出への特化は、地中海の高級市場からいかなる広範な果実産地のオアシスにも奪われぬ、ニッチな高級貿易を我がオアシスに与える。"
 tun_khaldunid_circle: "イブン・ハルドゥーンと彼を取り巻く知識人たち"
 tun_khaldunid_circle_desc: "我がスルタンの宮廷は、チュニスにて若き日のイブン・ハルドゥーンを庇護した。彼は#italic『歴史序説(ムカッディマ)』#!にて、欧州に先駆けること一世紀、社会分析と歴史分析の礎を築いた哲学者・歴史家である。加えて、アンダルス系亡命学者、北アフリカのカーディー兼歴史家、そして首都を訪れる東方のウラマーら、広範な学者の輪が集う。宮廷の書記官は系譜を編纂し、行政文書館は後世の歴史家が依拠する官房記録を保存し、イブン・ハルドゥーンと同時代の学者への庇護により、チュニスはイスラム世界全域からの学術書簡の磁場となった。ハルドゥーン学派の知的開花は、他のマグリブ諸宮廷がこの時代に誇りえぬ文化的遺産を、本来の$TUN$という家系に残した。"
 export_monopolies: "輸出の独占"
 export_monopolies_desc: "ベイは#italicオリーブ油#!、スファックス産毛織物、ヘンナと$dyes$、そしてチュニジア浅瀬の干し魚という、地中海のいかなる市場も他で完全には代替しえない主要産品の輸出について、王室専売権を保持する。国の倉庫はこれらの品を外国商人の手に渡る前に集積し、価格委員会が定める相場をイタリアやプロヴァンスの買い手は受け入れるほかない。王室輸出専売は、変動の激しい隊商収入よりも安定した外国通貨の収入を国庫にもたらす。"
 gfs_saharan_corridor: "サハラの回廊地帯"
 gfs_saharan_corridor_desc: "我がオアシスは、西サハラ回廊の地中海側の末端に位置する。トゥアト、タフィラルト、サハラ中央部からの隊商はガフサに集結し、北はサヘル沿岸へ、東はハフス朝の中枢へと向かう。我が商家は南行の行程に穀物、布、陶器を供給する。我がキャラバンサライにはサハラ以南、ベルベル、アンダルスの商人が肩を並べて逗留し、関税役人は通過交易に手頃な率で課税して回廊の採算を保ち、我がオアシス経済は定住果樹園と同じほど季節の往来に依存している。砂漠の街道に立つガフサは、純粋な農業オアシスには成しえぬほど、交易と外交において強勢を誇る。"
 tun_imperial_axis: "ハフス朝の支配軸"
 tun_imperial_axis_desc: "我が覇権はイフリーキヤ全域——チュニス、ブジー、コンスタンティーヌ、トリポリ——に及び、総督を務める一族、貢納するバヌー・ヒラール系臣属、そして関税収入が中央国庫を支えるキリスト教徒商人の在留商館の網を通じて統治される。遠隔統治は沿岸の狼煙台、内陸路の有給飛脚、そして貢納の迅速な納付と引き換えに地方総督に広範な裁量を与える慣習法に支えられている。チュニスからトリポリに至る総督の連鎖は、本来の $TUN$ という家系の帝国的版図をイフリーキヤ全土に行き渡らせており、いかなる後継政権もこれを完全には取り戻せない。"
 gfs_berber_substratum: "ベルベル人の文化の名残り"
 gfs_berber_substratum_desc: "我がオアシスは独自のベルベル的基層を保持している。ガフサ方言、旧家に伝わる母系相続の慣習、ジェベル・オルバタ各地に散在する前イスラム期の墓所、そしてヒラール侵入以前のゼナータ族にまで遡る多くの名家の系譜である。アラビア語話者とベルベル語話者は同じ家々で共生し、司法慣習法はマーリク派シャリーアと並んでベルベル部族の先例を保持している。口承伝承はカプサ文化やローマ以前の文化的記憶を今に伝えており、アラビア語のみの南部オアシスには持ちえぬものである。この二重の文化的遺産により、サヘル沿岸の町々ほど徹底的にアラブ化されてはいない、混成的な都市文化が我が町に生まれている。"
 tun_admiralty_reform: "海軍の改革"
 tun_admiralty_reform_desc: "ビゼルトとポルト・ファリーナの国営造船所は、正式にベイの海軍提督府の指揮下に置かれる。個人契約の私掠船長は俸給制の艦隊士官に置き換えられ、サヘル沿岸の町々からの水夫徴募は登録制の乗船名簿を通じて組織化され、前世紀が頼みとした軽量の略奪船に代わり、より重装のガレー船とガレオン船の艦級が導入される。ラ・グレットの海軍学校は、地中海の戦争が今や要求する砲術と航海術を士官団に教え込み、会計官は分捕り品の分配ではなく中央国庫から艦隊給与を支給する。国家により組織された海軍行政は、個人契約の私掠船の伝統では火薬時代を生き延びられなかったであろう艦隊を、後継政権に残す。"
 tun_la_goulette_defense: "ラ・グレットの防衛"
 tun_la_goulette_defense_desc: "我が国営海軍とラ・グレットの守備隊は、火薬の時代の地中海がもたらす相次ぐハプスブルク・オスマンの侵入——ハイレディン・バルバロッサによる最初の占領、カール五世皇帝による我がスルタンの復位、そしてそれに続く長い消耗戦——に抗する。提督たちとチュニスのカスバを守る指揮官たちは、港の海側の接近路を要塞化する。宮廷の外交官は王朝の自立を保つために両帝国を互いに競わせ、在留するアンダルス系技師は我が砲台を最新の規格に改修する。ハフス朝の反帝国防衛は、本来の$TUN$という家系に、後継政権が頼りうる防衛上の軍事的遺産を残す。"
 gfs_oasis_chamber: "オアシスの会議"
 gfs_oasis_chamber_desc: "ハンマーマ族、フラシーシュ族、アウラード・ブーヤヒーヤ族、そして在住の都市名士たちの代表が集う我が部族間 #italic マジュリス #! は、中央のカスバにて四半期ごとに会合し、灌漑権を配分し、隊商路をめぐる紛争を仲裁し、その代の北方の支配者に対して負うべき地元の貢納分を承認する。この会議は世襲でありながら諮問的であり、名士たちは俸給なしに奉仕するが、もてなしと慣習的な贈り物は受ける。その決議は、強制力ではなく慣習法によって参加諸部族を拘束する。常設の部族間評議会は、純粋な部族制でも純粋な都市制の統治でも成しえぬほど、我が辺境オアシスの政治的連続性を保っている。"
 tun_husaynid_dynasty: "フサイン朝"
 tun_husaynid_dynasty_desc: "フサイン・イブン・アリー(デイ階層を通じて昇進したクレタ・アナトリア系の士官)が興した我が王朝は、ベイの権威をイェニチェリ軍団、デイ、パシャの上に確立し、先の世代の交代制の士官統治を世襲の血統に置き換える。歴代のベイはバルドー宮殿で幼少より教育を受けたマムルーク顧問を任命する。行政改革は徴税請負を直接ベイの統制下に集中させ、イスタンブールとの外交文書は形式上オスマンの宗主権を認めつつ、実質的には自立した権力を行使する。王朝の確立は、交代制の士官の継承では到底供給しえなかった、世代を超えた一貫し継続的な統治を我が国家にもたらす。"
 tun_hafsid_continuity: "ハフス朝の系譜"
 tun_hafsid_continuity_desc: "我がフサイン朝のベイたちは、宮廷学者が編纂した系譜の連鎖、オスマン摂政時代の空白期を通じて保たれた儀礼上の称号、そしてバルドー行政官がデイを経て最後のハフス朝スルタンにまで遡ると辿る宮廷の職位の正式な連続性を根拠として、本来のハフス朝の血統からの直接的な王朝的正統性の継承を主張する。叙任の儀式、外交上の信任状、そして宮廷史家たちの年代記はいずれも、このハフス・フサイン両朝の連続性を我らが正統性の基盤として確認している。ハフス朝諸王の系譜は我らを通じて途切れることなく続いており、いかなる対抗摂政もこれより古い王朝を示すことはできない。"
 gfs_southern_intellectuals: "南部の知識人"
 gfs_southern_intellectuals_desc: "ガフサ生まれでザイトゥーナ学院に学んだ、我が世代の改革派知識人たちは、首都のチュニジア・ナフダ圏に通信員、随筆家、近代主義法学者を送り込み、南部オアシス内陸の視点をもって都市中心部の声を補っている。我が論客は新たなアラビア語報道を通じてベイの財政政策を論じ、我が法学者はハイレディンの改革法令に注釈を公刊する。サディキ学院の卒業生がチュニスに開く新たな官庁には、若い行政官たちが配属される。我が南部の知識人たちは、純粋に首都中心の改革運動には捉えられなかった、辺境からの改革的かつ近代化の声を我がオアシスに与えている。"
 tun_fundamental_pact: "基本協定"
 tun_fundamental_pact_desc: "改革派の圧力の下でベイが公布した安全協定、#italic「アフド・アル=アマーン」#!は、ムスリム・キリスト教徒・ユダヤ教徒に法の下の平等を保障し、司法手続きの下での身体と財産の不可侵を定め、先の諸政権が裁量的な慣行に任せていた課税と徴兵の手続きを正式に成文化する。タンジマートや欧州の先例に依拠しつつも、この文書を古典アラビア語・イスラム法の用語で構成した我が改革派の起草者たちは、ザイトゥーナのウラマーとバルドー宮廷の双方からその承認を取り付ける。我がベイは今や成文法によって統治するが、周囲のマグリブやオスマンの宮廷はなお慣習と勅令によって統治している。"
 tun_caliphal_revival: "カリフの復興"
 tun_caliphal_revival_desc: "我が改革派の人々は、チュニスが西方カリフの首都であった時代、我が先人がコンスタンティーヌからトリポリまで維持したイフリーキヤの覇権、そして同時代のいかなるマグリブ諸王朝とも我が祖先を区別した普遍的主権の主張を引きながら、ハフス朝カリフの記憶を思想的資源として復興させる。我が論客はこの先例を、侵食してくる外国の権威の中心に対抗して援用し、公式の歴史はその間の幾世紀を差し置いてハフス朝カリフ時代を前面に押し出す。我が近代主義のウラマーは、この復興されたカリフ系譜を通じて我らが改革計画の正統性を辿る。王朝の記憶の復興は、本来の $TUN$ という家系に、他の地の純粋な近代主義改革運動には欠けている思想的遺産を与える。"
 #Maghrebi Formables
 #Carthage
 cth_merchant_legacy: "商人の遺産"
 cth_merchant_legacy_desc: "ティルス、シドン、カルタゴの#italicフェニキア#!交易船団は、半千年の間、地中海を単一の商業体系へと織り上げ、カルタヘナの銀シェケル貨は、ハミルカルとハンニバルの下で我らの戦を戦ったイベリア、ヌミディア、バレアレスの傭兵隊長たちに支払われた。我が海事法はポエニの提督たちの慣行を受け継ぎ、我が徴募官は同じ隊長たちの西地中海における足跡をたどり、我が会計官はポエニ市民を戦場から遠ざけた、現金で兵役を購う同じ方式に倣う。商業と傭兵の両遺産が合わさり、復興された$CTH$の商人に広範な版図と、新興の交易国家が一から築くことなど到底できぬ、軍を養いうる経済力を与える。"
 cth_cothons: "コトン"
 cth_cothons_desc: "古代カルタゴの#italicコトン#!は、二百二十の避難係留地と乾ドック、そして提督の指揮所となる中央の島を備えた円形の軍港であり、全艦隊を数日で装備し終えながら、外洋からは見えぬように設計されていた。我が造船工はこの同じ工法を港底に再現しつつあり、ガディル、リクスス、モガドール、タルロスに散ったフェニキア人の末裔を、船殻が船台を離れる際に乗組員として母市へと呼び戻している。これら復興されたコトンは、長方形の欧州の兵器廠には到底及ばぬ、迅速な造船力と豊富な船乗りの人材を$CTH$に与える。"
 cth_legacy_of_hannon: "ハンノの遺産"
 cth_legacy_of_hannon_desc: "航海者ハンノは紀元前五世紀、ヘラクレスの柱を越えて航海し、西アフリカ大西洋岸に七つの交易拠点を築き、その後のいかなる古典期の航海の限界をも越えて南へ進んだ。彼の #italic 『周航記』 #! はギリシア語訳として今に伝わり、我が船長たちが南への航海のたびに確かめることのできる港、河口、沖合の目印を今なお記している。この記録された外洋航海の伝統は、いかなる欧州国家も古代から受け継いだとは言えぬ、航路の記録と兵站の型を我が $CTH_ADJ$ 探検家に授けている。"
 cth_punic_global_trade: "カルタゴの国際交易"
 cth_punic_global_trade_desc: "ガディル、リクサス、モガドールに栄えた古代ポエニの植民市は、我らの版図をヘラクレスの柱の彼方千マイルにまで広げた。そして現代における我ら$CTH_ADJ$の商業は、偉大な航海時代が切り開いたあらゆる海へと及んでいる。我らの代理人はアジアと南北アメリカの#italic商館#!に常駐し、船団は油、葡萄酒、製品をあらゆる寄港可能な港へと運び、仲買人はロンドンからゴアに至るあらゆる主要な取引所で手形を決済する。この地球規模の商業的版図は$CTH$を植民地の海の彼方まで押し広げ、フェニキアの祖先たちには想像もつかなかったであろう輸出網を築き上げている。"
 cth_sufet_rule: "スーフェースの統治"
 cth_sufet_rule_desc: "古代カルタゴは、大商人の家系から毎年選出される二人の#italicシュフェト#!(スフェテス)によって統治され、三百人からなる元老院と民会に対して責任を負っていた。我らがこの二頭政官制を復興させたことで、ポエニ式の実証された安定性と近代共和政の法的刷新とを融合させている。かくも深き共和政の血統は、$CTH$にどの新興のイタリアやオランダの共和国よりも古き憲政上の正統性を与えている。"
 cth_breadbasket_of_rome: "ローマの穀倉地帯"
 cth_breadbasket_of_rome_desc: "何世紀も前、灌漑とオリーブ栽培技術の発展により、カルタゴは「ローマの穀倉地帯」と呼ばれた。我々はいまこそ古の知識を結集させ、再び砂漠を制しオリーブの樹を育て、かつての栄光を取り戻すのだ。"
 #Kingdom of Africa
 koa_norman_heritage: "ノルマンの遺産"
 koa_norman_heritage_desc: "我らの行政・軍事の範型は、十二世紀にシチリアのルッジェーロ二世が樹立したノルマン・アフリカ王国に由来する。それはマフディーヤからトリポリにまで及びながらも、一世代の後に崩壊した短命のラテン・キリスト教国であった。我が宮廷の尚書局は当時の特許様式を保持し、騎士の封土制度はノルマン・シチリアの封建制度を北アフリカの地に適応させた形で受け継いでいる。我が城郭建築家たちは、ノルマン人技師がマグリブ沿岸にもたらした方形の塔楼を築いている。このノルマン・シチリアの遺産は、我らが復興したアフリカ王国に、純粋なマグリブ系の後継国家が一から築くことなどできぬ、確立された統治の型をもたらしている。"
 koa_latin_episcopate: "ラテン教会の司教職"
 koa_latin_episcopate_desc: "かつてヒッポのアウグスティヌスの時代よりほぼ七百に及ぶ司教区を擁し、ドナトゥス派論争や基礎的なラテン神学を生み出した北アフリカの古代ラテン教会は、我らの庇護のもと、周辺住民を積極的に改宗させる現役の教会として復興された。我がカルタゴ大司教は属州教会会議を招集し、宣教師たちは適応させたベルベル語とアラビア語の俗語を用いて地方を巡回する。あらゆる主要都市における大聖堂再建事業は、ムスリムおよび異教徒ベルベル人共同体のラテン典礼への着実な改宗を支えている。復興したラテン司教制は、我らのカトリック・マグリブに成長し改宗者を得る教会を打ち立て、我らを西方キリスト教世界の礎の時代に直接結びつけている。"
 koa_papal_endorsement: "教皇の承認"
 koa_papal_endorsement_desc: "我が王国は正式な教皇の承認を得ている。すなわち、我らをマグリブの正当なキリスト教君主と確認する教書、聖座による叙任の権利、そして王国の防衛を支える全臣民に及ぶ贖宥である。我が宮廷は定められた儀礼をもって教皇使節を迎える。カトリック諸侯への外交書簡には教皇の正統性の印璽が付され、我が王冠はあらゆる公式儀式において教皇の委任を援用する。教皇の承認は、我らがラテン・キリスト教国に、いかなるムスリムの後継国家もその教義の内側からは覆しえぬ外交的・宗教的正統性を与えている。"
 koa_military_orders: "宗教騎士団"
 koa_military_orders_desc: "聖ヨハネ騎士団、マルタ騎士団、そしてテンプル騎士団の後継諸団は、我が王国の防衛機構に組み込まれている。沿岸と内陸の防衛を支える堅固な司令館の網、海洋カトリック諸国が絶え間ない増援として送り込む常設の修道戦士団、そして拿捕したムスリム船を逆に海賊国家に向ける艦隊と要塞の統合体系である。我が団長や指揮官たちは王室評議会に名を連ね、駐留騎士たちはあらゆる主要要塞を守備している。教皇の寄進は諸騎士団の恒久的施設を支えている。軍事修道会の統合は、純粋な封建的徴兵制だけでは到底成し得ぬ防衛力を我が王国に与えている。"
 koa_feudal_estates: "封建制度の荘園"
 koa_feudal_estates_desc: "我らの封建的土地保有制度、すなわち王冠に忠実な貴族に授けられた特許封土、従属農民を伴う荘園組織、そして王冠から大貴族、地方領主へと至る指揮系統は、従来のマグリブ諸政権が用いていた旧来の部族制と貢納体制に代わって、適応された形で我が北アフリカ領に課されている。我が尚書局は荘園を測量し各封土の境界を確認し、大貴族の法廷は荘園間の紛争を調停する。我が小作農層は、穀物と葡萄の冷涼期経済の農事暦が定める荘園の慣行に組み込まれている。この封建的・行政的制度は、周囲の不安定な部族社会とは異なり、我が王国に土地保有と忠誠の構造を与えている。"
 koa_catholic_mission: "カトリックの布教"
 koa_catholic_mission_desc: "我らが成熟した宣教網、すなわちフランシスコ会とドミニコ会の説教修道会、地方の俗語と並んでラテン語を教える宣教学校、そして沿岸から内陸にかけて布教拠点を支える使徒座代理区の邸宅は、幾世代にもわたる改宗事業の積み重ねが生んだ深みを備えている。我が神学校は改宗者の家系からラテン典礼の現地聖職者を養成している。寄進は新改宗者の司法上の地位を保証する改宗者保護特許を支え、俗語による教理問答書は我が王国のあらゆる教区学校に広まっている。この宣教網は、訓練された聖職者を我が王国に供給し、前世紀来の宗教的・文化的事業を確たるものとしている。"
 #Maghreb Region
 city_of_scholars: "学者の都"
 city_of_scholars_desc: "我らマグリブのマドラサ、すなわち #italic Qarawiyyīn #! の $fez$、 #italic Zaytūna #! の $tunis$、 #italic Tashfīniyya #! の $tlemcen$ は、十三世紀以来 $maghreb_region$ の隅々から学生と教師を引き寄せてきた。我らの法学者たちは $cordoba$ にまで連なる師承の鎖を持つ師のもとで #italic Mālikī fiqh #! を学び、天文学者、医師、文法学者たちは $cairo$ から $fez$ に至る同業者と文通を交わしている。この持続する知的営みは、我が宮廷を中西部マグリブの知の都たらしめている。"
 slave_raid_advance: "沿岸襲撃"
 slave_raid_advance_desc: "我らマグリブの港は #italic ライース #!、すなわち我が旗の下で西地中海と大西洋沿岸を巡り、キリスト教徒の船舶を拿捕して賞金を得、キリスト教徒の乗組員を我が奴隷市場に供する私掠船長たちに免許を与えている。我らは港にゼベック船やガレー船の軽快な船隊を武装させ、得た分け前の一部を王室金庫へ流し込み、トリニタリオ会とメルセード会の修道士たちに捕虜の身代金交渉を委ねる。この私掠経済は、沿岸諸州の通常の課税では到底及ばぬ規模で、拿捕金と身代金の収入によって我が国家を支えている。"
 hispano_moresque_style: "ヒスパノ＝ムーア様式"
 hispano_moresque_style_desc: "キリスト教徒の境界線から逃れてきたアンダルシアの職人たちは、二世紀にわたって我がマグリブの都市に定住し、タイル細工、木彫、漆喰細工をモスクやマドラサ、宮殿にもたらしてきた。我が大モスクのアルモラビド朝様式の説教壇、我が宮廷のレース模様のアーチ、我が聖廟の葬送用円蓋は、いずれも紛れもなき #italic イスパノ・モレスク #! 様式の刻印を帯びている。アンダルシアの芸術の流入は、マグリブの宮廷に $granada$ そのものに比肩する美意識を与え、$maghreb_region$ の高度な文化の規範を定めている。"
 mor_marabouts: "スーフィーのマラブー"
 mor_marabouts_desc: "#italicカーディリーヤ#!、#italicシャーズィリーヤ#!、#italicティジャーニーヤ#!各教団のスーフィー導師たる#italicマラブー#!たちは、マグリブの農村各地に#italicザーウィヤ#!を設け、そこで教えを説き、紛争を裁き、民衆の宗教心を導いている。彼らの墓は巡礼地となり、その後継者たちは都市の法学者にも匹敵する道徳的権威を保持し、彼らが君主を是認すれば、その君主は部族の地方において正統性を得る。このスーフィーの権威による農村の網は、直接の行政的浸透を要せずとも、あらゆる$maghreb_region_ADJ$国家に村々への宗教的影響力を与えている。"
 slave_soldiers: "奴隷兵"
 slave_soldiers_desc: "$tunis$のハフス朝スルタンや$tlemcen$のザイヤーン朝アミールは、十四世紀以来、黒アフリカの市場から購入され、あるいはキリスト教徒のイベリアへの襲撃で捕らえられ、あるいは先代の奴隷兵士の子として制度の内に生まれた#italicグラーム#!や#italicマムルーク#!風の従者たちの軍団を築き上げてきた。これらの兵士たちは部族や地域にではなく、君主個人に忠誠を誓うため、継承争いにおいてマグリブのスルタンが完全には信頼し得ない不安定な#italicバヌー・ヒラール#!の徴兵に対する頼もしい対抗勢力となっている。この軍事奴隷制度は、純粋な部族軍には成し得ぬ政治的信頼性を備えた歩兵・騎兵を我が国家にもたらしている。"
 trans_saharan_trade: "サハラ交易"
 trans_saharan_trade_desc: "シジルマサ、ワルグラ、トレムセン、ガダーミス、トリポリといった、サハラ越え#italic隊商#!路の北の終着点は我が領内にあり、スーダンのバンブークやブレの砂金、$slaves_goods$、象牙を我が市場へと集めている。我が#italicジャッラーバ#!商人たちは砂漠越えの資金を融通し、我が造幣局は王室専売のもとで流入した金から金貨#italicディーナール#!を鋳造し、我が中継貿易はスーダンの品々を地中海と大西洋の買い手へと再分配している。サハラ経済の北半分を支配するこの優位な地位は、純粋に地中海に依拠する王国には到底及ばぬ、通商路収入と鋳造の威信とをあらゆるマグリブ国家にもたらしている。"
 rais_of_the_navy: "海軍のライース"
 rais_of_the_navy_desc: "我が私掠船長、すなわち #italic ライース #! たちは単なる海賊ではない。彼らは歴戦の海軍指揮官であり、その海上での経験は深く根付いた海洋の伝統を育み、我が海軍の誇り高き伝統を強めている。我が海軍省は、有望な若き船長をいずれも歴戦の #italic ライース #! の指揮のもとで鍛え上げ、いかなる正規の海軍兵学校も再現し得ぬ実践的な航海術の体系を受け継がせている。この職業的船長の集積は、内陸の国庫が正規の訓練だけでは到底賄い得ぬ海軍士官団をマグリブ諸国に与えている。"
