 unlock_archipelago_frigate_desc: "$n_archipelago_frigate_desc$"
 #Sweden
 swedish_tradition: "常時攻撃"
 swedish_tradition_desc: "スヴィンフィルキングの陣形を組んで突撃すれば、敵はたちまち砕け散るだろう！ 馬は戦いに向かうために騎乗するためのものであり、戦場に馬の居場所はないのだ。"
 swedish_heritage: "自由農民"
 swedish_heritage_desc: "スウェーデンの農民は歴史的に国の主要な部分を占める存在であり、貴族と自由農民の差はそれほど大きなものではなかった。"
 kung_och_riksdag: "王と議会"
 kung_och_riksdag_desc: "スウェーデン国王は、貴族との均衡を保つために、しばしば諸階級、特に大規模な農民階級に協力を求めることが多かった。しかし、グスタフ2世の治世には、貴族とのあいだに歴史的な和解がなされた。これにより、貴族は新たな特権と引き換えに、自分たちの資源を国家に供出することを約束したのだ。"
 swedish_steel: "スウェーデン鋼"
 swedish_steel_desc: "他国の軍隊が敵に向かって不正確な一斉射撃をおこなうのに対して、我々は整然と隊列を組んで進軍する。そして至近距離から斉射を加え、敵に斬り込んでいく。"
 hakkapelitta: "ハッカペリッタ"
 hakkapelitta_desc: "フィンランドは非常に貧しく後進的な地域だ。それゆえに、スウェーデン軍への従軍は略奪によって富を得る絶好の機会を与える。フィンランド人たちは馬術に秀で、馬の質も高いため、彼らは戦場では恐ろしいほどの強さを発揮する。敵はそれを、魔術によるものだと主張している。"
 indelningsverket: "割当制"
 indelningsverket_desc: "スウェーデンの割当制とは、農民を10人ずつのグループに分け、徴兵するものだ。この制度によって、軍隊に召集し、部隊に編制する人員を探し出しやすくなった。"
 swedish_absolutism: "スウェーデン絶対王政"
 swedish_absolutism_desc: "絶対王政とは、ただひとりの人間がすべての権力を握る体制である。その人間とは国王であり、貴族たちに妨げられることなく国家を運営する能力を必要とした。"
 produktplakatet: "スウェーデン航海法"
 produktplakatet_desc: "この法令は、スウェーデンに入港する外国船が自国または植民地以外の国から商品を持ち込むことを禁じている。"
 mulltimmer_masugn: "マルティンメールの溶鉱炉"
 mulltimmer_masugn_desc: "スウェーデンの鉄はその純度と強度で重宝され、国内需要だけでなく大陸各国の鋳造所や兵器庫にも供給されていた。マルティンメールの溶鉱炉は、石材に加えて砂利や土砂で断熱された木材も用いて築かれた。"
 swedish_royal_post_office: "クングリーガ・ポストヴェルケット"
 swedish_royal_post_office_desc: "クングリーガ・ポストヴェルケット（王立郵便局）は、クリスティーナ女王の治世下で設立された。広大なスウェーデン帝国の統治と行政の効率化を目的として創設され、信頼性の高い急使と中継所のネットワークを築いた。この制度はスウェーデンが列強として君臨していた時代に、軍事の調整、外交、行政運営で不可欠な存在となった。"
 polhem_machina_nova: "マキナ・ノヴァ"
 polhem_machina_nova_desc: "「スウェーデン工学の父」と呼ばれるクリストフェル・プールヘムは、生産性を高める革新的な機械群「マキナ・ノヴァ（新しい機械）」によって、スウェーデンの産業を変革した。歯車やカム、水力を巧みに組み合わせた複雑な機構により、彼は鉱山での鉱石破砕から織物の製織や製材に至るまで、これまで手作業でおこなわれていた工程の機械化に成功した。彼のラボラトリウム・メカニクム（機械研究所）は、工房であると同時に教育機関としても機能し、王国全土に機械工学の知識を広めた。"
 swedish_copper_coins: "スウェーデン銅貨"
 swedish_copper_coins_desc: "$SWE$では、ファルンのストラ・コッパベリエ鉱山を中心に銅が豊富に産出されることから、その銅を主原料として、新たな国家通貨であるダーレルを鋳造するようになった。この通貨はプラートミントと呼ばれる大型の板状貨幣として発行され、重さは最大で20キログラムにも達する。一部には、これはあまり実用的ではなく、流通する貨幣量が銅の埋蔵量を上回るおそれがあると主張する者もいるが、そうした見方は視野が狭いように思える。"
 #South America Region Advances
 #South America
 adapted_incan_army: "順応するインカ軍"
 adapted_incan_army_desc: "見知らぬ土地からの侵略者が我々の土地に足を踏み入れ、我々の存在そのものを脅かしている。だが、わが軍隊には順応性がある。新たな敵の戦術に適応し、対抗するための独自の武器の使い方を学び、断固たる決意をもって敵と戦うのだ。"
 chasqui: "チャスキ"
 chasqui_desc: "チャスキはわが国の伝令である。彼らはわが国で最も健康で持久力のある走り手から選ばれており、キープ（結縄）、メッセージ、贈り物、その他のさまざまな情報を受取人に届ける。思想の普及と外交の大部分は彼らの肩にかかっている。"
 drafted_hatun_runas: "選抜されたハトゥン・ルナス"
 drafted_hatun_runas_desc: "ハトゥン・ルナスとは帝国の平民のことだ。50人に1人が選ばれ、25歳の誕生日から7年間軍務に就く。これにより、敵国よりも規律正しく、大規模かつ専門的な軍隊を作り上げられる。"
 inc_tambo: "タンボの改善"
 inc_tambo_desc: "街道網はわが帝国の基幹だ。軍と行政のさらなる便益のために、我々はすべての主要街道沿いにタンボを建設する。これらの宿駅は1日で行軍できる間隔で建設され、宿泊所となると同時に、旅のための物資も保存できる。"
 inc_vertical_economy: "垂直経済"
 inc_vertical_economy_desc: "アンデスの高地にこれほど適応した帝国はほかに存在しない。最も低い谷から最も高い高原に至るまで、あらゆる標高に集落と貯蔵庫を維持することで、我々は他の国家なら挫折するような極めて困難な地形で人員と物資を移動させる術を極めた。リャマの隊商、切り立った崖に刻まれた道、そして高地の共同体は、アンデス山脈を障壁ではなく、我々独自の街道へと変えている。"
 incamisana_advance: "$incamisana$"
 incamisana_advance_desc: "$incamisana_desc$"
 llama_michis: "リャマ・ミチス"
 llama_michis_desc: "リャマは我々の社会で多くの役割を果たしている。重荷を運ぶ役畜や生贄として使われたり、肉や獣毛を利用したり、糞を肥料として利用したりする。政府のミチスや羊飼いを通じてリャマの繁殖と利用を管理することで、その生息数を厳しく監視することができる。これによって、リャマの個体数を増やすことができるだろう。"
 military_mita: "軍事的ミタ制"
 military_mita_desc: "ミタ制とは、インカ社会で義務づけられている兵役のことである。この制度は国家の共同体的な側面をカバーするだけでなく、軍務の柱でもある。国内のすべてのアイリュは、高地での戦闘に適応した優秀な人材を軍隊に提供しなければならないのだ。"
 mitma: "ミトマの義務"
 mitma_desc: "かつては大規模な建設計画をおこなうために、統治者は帝国中の小勢力の酋長を都に招き、贈り物や豪華な宴会を催すなどの、古くからの伝統を果たさなければならなかった。しかし、国家が成長するにつれ、こういった手法は理想的ではなくなってきた。建設に必要な労働力と資材を提供することは、わが国の各酋長の義務であるべきだ。"
 pukara_advance: "$pukara_building$"
 pukara_advance_desc: "$pukara_building_desc$"
 quipu: "キープ"
 quipu_desc: "糸の結び目を用いて情報を記録する手法。結び目は0から9までの数字を表し、数量の記録や会計に使用できる。結び目は、同じ糸上の表語文字を参照するために用いることもできる。結び目がどの音節を使うかを示し、さらに文字列を組み合わせることで文章を作ることができる。"
 tambo_advance: "$tambo$"
 tambo_advance_desc: "$tambo_desc$"
 terraces_advance: "$terraces$"
 terraces_advance_desc: "$terraces_desc$"
 warachikuy: "ワラチクイ"
 warachikuy_desc: "ワラチクイは、若者の技術、武勇、知恵、そして競争、射撃、戦闘、長時間の睡眠不足に対する耐久性などの身体能力が試される神聖な儀式である。これらの試練で優秀な成績をおさめて合格した者は、拡大を続けるわが軍の将校へと昇進することができる。"
 #South German Region Advances
 #Austria
 austrian_tradition: "栄光の一族"
 austrian_tradition_desc: "わが一族の台頭は多くの嫉妬を生み出した。帝国内で我々と対立する家門は、南東の国境の守護者としての我々の地位を狙っている。しかし、我々の外交手腕に敵う者はどこにもいない。"
 austrian_heritage: "ルドルフ1世の遺産"
 austrian_heritage_desc: "ルドルフ1世が対抗勢力を倒したことで、我々は帝国の有力貴族となった。彼の勝利は多くの物語や歌の主題にもなっている。マルヒフェルトの戦いにおけるルドルフ1世と騎士たちの勇猛さは、何世紀にもわたりわが軍を鼓舞するだろう。"
 hab_expert_mountaineers: "山と川の国"
 hab_expert_mountaineers_desc: "わが民は、高峰や峠から谷川まで、わが国のさまざまな険しい地形を乗り越える術に長けている。"
 austrian_marriage_policy: "幸いなるオーストリアよ、結婚せよ"
 austrian_marriage_policy_desc: "戦争は他のものに任せよ。幸いなるオーストリアよ、結婚せよ！ マールスが他のものに与えし国は、ウェヌスによりて授けられん。"
 habsburg_dominance: "オーストリアの外交手腕"
 habsburg_dominance_desc: "わが国はヨーロッパの中心に位置するため、外交においては柔軟な立場をとる必要がある。同盟国やライバル国はたやすく立場を翻すからだ。わが国の外交官は、あらゆる状況に対応できるよう修練を積む必要がある。"
 austrian_military_flexibility: "ランツクネヒトの戦術"
 austrian_military_flexibility_desc: "砲撃、騎兵隊の突撃、ランツクネヒトの屈強な歩兵を組み合わせた、包括的でよく練られた戦術のみが勝利をもたらす。"
 edict_of_restitution: "復旧令"
 edict_of_restitution_desc: "簡単な取り決めをしておけば、わが領地に宗教上の紛争が降りかかっても乗り切ることができるはずだ。この無害な勅令が、さらに紛争を引き起こすことはないだろう。"
 austrian_court: "オーストリアの宮廷"
 austrian_court_desc: "外交関係の維持には時間と労力がかかる。多くの人員を外交任務にあたらせると、我々の効率と評判に悪影響をもたらすおそれもある。宮廷を合理化すれば、緊急事態に陥っても、それを鎮めるのに必要な情報を確実に入手できるだろう。"
 geheimrat: "枢密顧問院"
 geheimrat_desc: "枢密顧問院は高位の貴族や役人で構成されるエリート諮問機関である。オーストリアの政治、軍事、行政に関する意志決定において中心的役割を果たしている。"
 hofkriegsrat: "宮廷軍事局"
 hofkriegsrat_desc: "わが国の軍事会議は、適切な官僚機構なくして機能しない。わが国の軍隊と兵站に関する情報をすべて把握しなければ、侵略者から国家を守ることはできない。"
 military_border: "軍事的国境"
 military_border_desc: "わが国の国境の防衛には深刻な問題があり、特に国の財政への影響が懸念される。そこで我々が考えた解決策は、国境地帯で土地の交付をおこない、これを専門の軍人階級とすることだ。これによって兵士の規律が向上し、国内の過疎地域への移住が促進されるだろう。"
 austrian_ambition: "教育による啓発"
 austrian_ambition_desc: "わが国の統治者は、賢明な君主となるため最高の教育を受けなければならない。"
 austrian_state_industrialization: "国の産業化"
 austrian_state_industrialization_desc: "産業の近代化は、つねにわが国の最優先事項でなければならない。近代的な工場があってこそ、世界を舞台に他国と競うことができる。"
 wiener_klassik: "ウィーン古典主義"
 wiener_klassik_desc: "ウィーン古典主義は、音楽史における変革の時代である。わが国の優れた作曲家たちの作品は、その革新的な交響曲、オペラ、室内楽を通じて西洋音楽に革命をもたらすだろう。"
 multicultural_empire: "多文化帝国"
 multicultural_empire_desc: "オーストリアは多様かつ多文化的な国家だ。民族主義の緊張が高まるなか、さまざまな少数民族を受け入れて融和を図ることで、統一と安定性を維持している。"
 imperial_artillery: "帝国砲兵隊"
 imperial_artillery_desc: "戦争の性質が急速に変化するなか、我々は軍隊とや戦術の近代化を迫られている。敵よりも有利な立場を保つために、砲兵隊を帝国陸軍の至宝たる存在に高める必要がある。"
 #Bavarian
 bavarian_brewing_expertise: "熟練の醸造家"
 bavarian_brewing_expertise_desc: "我々の土地はビール醸造に必要な材料が豊かであり、民もこれを活かして積極的にビールを醸造している。小さなビール醸造所の多くは、適切な支援があれば大きな事業に成長する可能性を秘めている。"
 bavarian_coinage: "バイエルン硬貨"
 bavarian_coinage_desc: "バイエルン国民の統一通貨として、わが王国には新たな標準化された硬貨が必要である。首都に国営貨幣鋳造所を設立すれば、この新しい通貨を完全に管理することができる。"
 bavarian_culture_buildings: "バイエルン文化施設"
 bavarian_culture_buildings_desc: "美しいアルプスの麓にある我々の故郷は、ヨーロッパじゅうの芸術家たちがインスピレーションを得る場所だ。我々が文化施設を建設し、支援することができれば、我らの宮廷を文化の中心地へと洗練させ、ヨーロッパの権威ある国の一角となることができるだろう。"
 bavarian_flexible_diplomats: "実践的外交"
 bavarian_flexible_diplomats_desc: "対応する相手が帝国の大君主であろうと、同盟国となりうる外国であろうと、外交官はあらゆる事態に備えなければならない。バイエルンの利益を慎重に考慮し、それを最優先してこそ、我々は成功できるのだ。"
 bavarian_hofkriegsrat: "バイエルン宮廷軍事局"
 bavarian_hofkriegsrat_desc: "紛争時に統治者に助言を与えることを唯一の職務とする評議会を設置すれば、バイエルンはより有能な軍隊を創設できるだろう。"
 bavarian_imperial_knights: "バイエルン帝国騎士"
 bavarian_imperial_knights_desc: "わが貴族は神聖ローマ帝国に仕える強力な騎士としてその名を馳せてきた。公爵家の存続のためには、このような部隊を育成する必要がある。"
 bavarian_legitimacy: "バイエルン公"
 bavarian_legitimacy_desc: "我々は皇帝よりバイエルン公爵の称号を与えられている。我々がバイエルン公国の真の守護者であると誇示することで、その正統性を疑問視されないようにしよう。"
 bavarian_purity_law: "ビール純粋令"
 bavarian_purity_law_desc: "わが国のビールの品質は何世紀にもわたって認められてきたが、真の名声を得るためには、その名誉ある地位を永遠に確保しなくてはならない。過去の統治者たちは、この素晴らしい物質の醸造に一定の規制を設けようとしてきた。この事実を、わが国の醸造品の品質の証として活用することができるだろう。"
 bavarian_stem_duchy: "統一の夢"
 bavarian_stem_duchy_desc: "バイエルンの人々とその文化は、かつてバイエルン王国によってひとつの旗のもとに統治されていた。我々は、同じく強力な国家を樹立し、バイエルン人の故郷を確立することを目指すべきだ。"
 bavarian_zelousness: "バイエルンのひとつの信仰"
 bavarian_zelousness_desc: "我々は国民の信仰が団結し、異端の思想によって分裂しないようにしなければならない。"
 exploit_the_alpine_trade: "バイエルンの交易拠点"
 exploit_the_alpine_trade_desc: "わが国には、南の豊かな土地に向けて塩や銀、家畜を交易する商人が頻繁にやってくる。彼らの存在を利用しても、わが国の都市集落に豊かな利益をもたらせないとすれば、我々は愚者以外の何ものでもない。"
 foundation_of_bavarian_army: "バイエルンの軍隊"
 foundation_of_bavarian_army_desc: "強大な常備軍があってこそ、我々は自らの野心を主張することができる。重視すべき点を適切に見極めれば、国家の財政に壊滅的な影響を与えることなく、軍を拡大することができるだろう。"
 #Bohemia
 bohemian_thaler: "ボヘミアンターラー"
 bohemian_thaler_desc: "長年にわたって、わが国の標準通貨は神聖ローマ帝国全土で使用されてきたグロッシェン銀貨だった。銀の新たな供給源が発見されたことで、我々は別種のより大きな硬貨、ターラーを作れるようになった。トーレルまたはダーレルとも呼ばれるこの硬貨はすべての交易を支配し、新たな標準となるのに十分な強さと影響力を誇るようになるだろう。"
 fortified_towns: "要塞都市"
 fortified_towns_desc: "$hussite_wars$の惨禍を乗り越え、信仰と民を守るため、我々は多くの要塞都市を建設した。以来、我々は要塞の建造や突破不可能な防御施設の構築において多くの専門知識を蓄積してきた。"
 hussite_traditions: "$hussite_ADJ$の伝統"
 hussite_traditions_desc: "苦闘と同胞の絆によって、我々の信仰の信奉者は改宗を迫るあらゆる外的圧力に耐えている。古い教義に裏打ちされた我々の揺るぎない信仰は、信念を守り、$christian_ADJ$信者の同志とともに平穏に生きようとするすべての者の心に響く。"
 kutnohorian_deal: "クトナー・ホラ協定"
 kutnohorian_deal_desc: "貴族とは、自分たちの特権につねに敏感なものだ。だからこそ、彼らの特権が永遠に保証されることを約束しなくてはならない。"
 wagenburg: "ウォーワゴン"
 wagenburg_desc: "フス戦争中、わが軍はウォーワゴンに頼ることで、不利な戦いに勝利することができた。つねにウォーワゴンを用いるとはかぎらないが、防衛に向いた場所から歩兵の狙撃手を活用することが、我らが常勝のチェコ軍の戦術の選択肢となるだろう。"
 #Semi generic Advances for german countries
 swabian_league_of_cities: "都市同盟"
 swabian_league_of_cities_desc: "シュヴァーベンには裕福な都市が数多く存在しており、他国の野心や侵略の的となっている。我々の土地を守るために、戦時には力を合わせ、外敵の干渉に立ち向かわなければならない。"
 swabian_frugal_people: "倹約の精神"
 swabian_frugal_people_desc: "わが国民は「けち」だと揶揄され、消費に慎重であれという美徳は笑いものにされてきた。だが健全な国庫と、我々自身の野望に投じられる潤沢なダカットがあれば、そんな嘲笑など容易に無視できる。"
 franconian_proud_knights: "帝国騎士"
 franconian_proud_knights_desc: "わが国民は、帝国に仕える誇り高き騎士を数多く輩出してきた。彼らが体現する騎士道精神はいまでこそ廃れてしまったものの、我々が目指す姿のまさに根幹をなすものである。その歴史は古く、騎士的な振る舞いと、軍事面の両方において多くの教訓を現代に伝えている。そしてこれは当然、名誉ある戦いで栄光を掴みたいと願う貴族たちの、召集に応じる意欲にも大きな影響を与えているのだ。"
 franconian_wine_bottles: "シルヴァーナーとボックスボイテル"
 franconian_wine_bottles_desc: "ボックスボイテルは、わが国が誇る力強いワインの伝統を象徴している。手に取りやすく、ひと目でそれとわかる形状のボトルは、わが国で造られる美酒の伝道者ともいえる存在である。「シルヴァーナー」や「リースリング」といった銘醸をこのボトルに詰めること——それはガラス職人と醸造家が、我々に経済的繁栄をもたらすことを意味するのだ。"
 westphalian_monastic_traditions: "修道院の地"
 westphalian_monastic_traditions_desc: "ドイツ北部には、ミュンスターやパーダーボルンの司教領に代表されるカトリックの拠点が多数存在する。この地方に根づく修道生活と宗教的伝統は、聖職者の識字率と教育水準に概ね良い影響を与えており、学びを深める機会と場には事欠かない。このことは、聖母教会に仕えたいと願う聖職者たちに、多様な選択肢を与えている。"
 north_german_hanseatic_traditions: "ハンザの商人"
 north_german_hanseatic_traditions_desc: "ドイツ北部に暮らす我らの民は、バルト海への接続の良さから長年にわたり恩恵を得てきた。南方の隣国の多くが河川を利用した交易に頼るなか、バルト海を渡って財を成す商人たちは、伝統的にわが国に富と繁栄を届けているのである。"
 german_baltic_sailors: "バルト海の水兵"
 german_baltic_sailors_desc: "厳しい気候は人をたくましくする。冷たいバルト海の過酷な環境は、わが国の水兵たちの腕を磨き上げ、彼らの精神を鍛え上げた。やはり、海は気性の荒い愛人に喩えられるだけある。"
 german_populating_the_countryside: "農民の誘致"
 german_populating_the_countryside_desc: "田園地域への再定住を促し、民に耕すべき土地を与えることは、人口がまばらな土地の富と生産性をゆっくりとだが確実に増進する、素晴らしい取り組みとなるだろう。"
 german_fair_towns: "帝国見本市都市"
 german_fair_towns_desc: "帝国見本市は、選ばれた一握りの都市にのみ与えられる稀少な特権であり、それによって$europe$最大級の市場が形成され、それらの都市は$hre$の商業の中心地となる。こうした市場の集約的な性質により、商人は自由を享受し、多種多様な交易品が集まる環境のなかで、効率的な計画や交渉をおこなうことができる。"
 german_imperial_roads: "帝国街道網"
 german_imperial_roads_desc: "ヨーロッパの中心部では、幾世紀にもわたり街道が築かれ、拡張され、改良されてきた。ローマ時代から現代に至るまで、ドイツ各地を結ぶ多くの帝国街道は、万人のために交易と移動の利便性を高めてきたのである。またこれらの街道は、陸軍の移動に代表される兵站上のニーズを満たすうえでも大いに貢献した。"
 landsknechte: "ランツクネヒト"
 landsknechte_desc: "ドイツ国内、およびその国境地帯の戦火から生まれた新たな編制の部隊、それが$landsknechte$である。この混成部隊は革新的な槍兵の方陣を主軸に、側面から支援する火縄銃兵、そして両手剣を携え前衛を務める悪名高き「ドッペルゾルドナー（二倍報酬の傭兵）」で構成される。この編制により、近接戦と中距離戦を組み合わせた戦術が可能となった。"
 german_biedermeier: "ビーダーマイヤー"
 german_biedermeier_desc: "ビーダーマイヤー時代は、上流階級が過ぎ去りし時代への郷愁を募らせたことで保守的な風潮が広がった時代である。このような風潮のもと、自由な思考や創造的な活動は人目を避けて私的な空間でおこなわれるようになっていった。こうした傾向は、皮肉にも市民階級のあいだに独自の文化的アイデンティティを育み、その一方で活動を継続するために国外に移住する自由思想家も多数現れた。"
 custom_union_of_the_rhine: "ライン貨幣同盟"
 custom_union_of_the_rhine_desc: "さまざまな地域で構成される帝国に繁栄をもたらすには、近隣諸国と経済的に協力する必要がある。我々はラインの関税同盟に加盟し、「グルデン硬貨」を採用して、商人の活動や他国との外交を容易にしなければならない。"
 lub_hanseatic_coins: "ヴェンド貨幣同盟"
 lub_hanseatic_coins_desc: "ハンザ同盟の影響力が強い諸都市のあいだで、新たな組織が設立された。ヴェンド貨幣条約は、わが国の領内における交易と商業を円滑化するための強固な基盤を提供する。"
 hamburg_port_cities: "港湾ネットワーク"
 hamburg_port_cities_desc: "わが国は、海上交易との強固な結びつきと、絶え間ない交易品の往来によって成り立っている。秩序ある港を維持するためには、浚渫により新たな航路を造成し、さらに多くのドックや倉庫を建設して、新たな商人や彼らの船を呼び込まねばならない。"
 saiger_process: "サイガー製錬法"
 saiger_process_desc: "銀を含む銅に鉛を加えて精錬する、新しく革命的な製錬技術により、我々の採掘作業の生産性を向上させることが可能になる。"
 german_river_toll_castle_advance: "$german_river_toll_castle$"
 german_river_toll_castle_advance_desc: "$german_river_toll_castle_desc$"
 german_mountain_toll_castle_advance: "$german_mountain_toll_castle$"
 german_mountain_toll_castle_advance_desc: "$german_mountain_toll_castle_desc$"
 #Steppes Region Advances
 #Steppe Hordes
 nomadic_legacy: "遊牧民の後継"
 nomadic_legacy_desc: "我らが民は鞍上で生まれ、定住する必要もなく世界を自由に放浪している。"
 #Tibet Region Advances
 #Tibet
 sakya_hegemony: "サキャ派の覇権"
 sakya_hegemony_desc: "過去1世紀にわたりチベットの実権を握ったサキャ派は、モンゴルの庇護のもとで精神的・政治的支配者となっており、その間、統治の中央集権化と学問的統合が進んだ。サキャ派の支配力は衰えつつあるが、我々の権威と秩序の在り方にいまだに影響を及ぼしている。"
 monastic_dominance: "寺院を通した支配"
 monastic_dominance_desc: "チベットの政治情勢の特徴は、宗教と世俗の支配が融合している点である。ごく小さな村からサキャ派の権力の中枢に至るまで、寺院などの宗教施設が生活の中心となっている。忠誠心と団結、そして文化が維持されている背景には、こうした道徳的権威と組織力がある。"
 the_yak: "ヤク"
 the_yak_desc: "家畜として何世紀も活用されてきたヤクは、チベットの牧畜生活を支える存在だ。この動物は肉、乳、獣毛の供給源となるだけでなく輸送手段ともなり、さらには燃料までも提供してくれる——高原地帯には木が生えておらず、乾燥させた糞は貴重な燃料となるからだ。苦難の時も祝いの時も、ヤクはランプと器の両方を満たしてくれる存在である。"
 drokpa: "ドロクパ"
 drokpa_desc: "遊牧民であるドロクパは牧畜に行商、荷運びを手がけ、しばしば遠く離れた集落同士を繋ぐ役割を果たす。現地の地形に関する伝統と、卓越した知識をもつドロクパの人々は、チベット、ブータン、ラダック、そしてネパールを繋ぐ高地の道のりを踏破できる。季節ごとに移動する隊商は塩、獣毛、干し肉を運び、穀物や工芸品と交換しており、こうした山々を隔てる交易網が、商業と外交の両面において活気ある繋がりを構築しているのだ。"
 tibetan_monastic_education: "寺院を通じた教育制度"
 tibetan_monastic_education_desc: "わが国の寺院は長きにわたり学問と討論、そして精神修養の中心となってきた。厳格な修行と体系的な教育を通じて、聖職者たちの卓越した知性と道徳観が維持されている。こういった土台が、今後もわが国の賢明な統治と文化的繁栄を支えるだろう。"
 tanye_guanxi: "檀越関係"
 tanye_guanxi_desc: "数世紀にわたり、中国における我々の精神的影響力が外交関係の礎となってきた。皇帝による後援、朝貢を通じた交流、そして「檀越」（寺や僧への寄進）のような神聖な儀式が、敬意と物質的利益の両方をもたらすのだ。"
 great_three: "三大僧院"
 great_three_desc: "セラ寺、ガンデン寺、デプン寺の雄大な修行場は、チベットにおける学問の中心となっており、寺の僧たちが各世代の僧、外交官、そして統治者を育成している。こうした寺の隆盛により、わが国は信仰を守る砦となっただけでなく、厳格な思索と高度な組織の両方が育まれる土地ともなっている。"
 #Asia
 arduous_terrain: "険しい地形"
 arduous_terrain_desc: "高峰が続くヒマラヤ山脈、乾燥したゴビ砂漠、$india$や$south_east_asia$の密林など、$asia$には極めて過酷な環境が多く存在している。さらにこの地にはモンスーンや台風の季節、頻発する地震があり、過酷な条件を挙げればきりがない。この地に住む人々はこうした環境で生き抜く方法を学んできたが、侵略者にとってはそう簡単ではないだろう。"
 baghlah_advance: "$n_baghlah$"
 baghlah_advance_desc: "$n_baghlah_desc$"
 crossroads_of_religions: "宗教の交差点"
 crossroads_of_religions_desc: "$hindu$や$buddhist$、$muslim$、さらには$tengri$に至るまで、これらの宗教は起源から遠く離れた地域にまで広まった。$asia$ではこれらの信仰同士の交わりが幾度となく起こり、しばしば融合や習合が生じている。"
 cultural_melting_pot: "文化のるつぼ"
 cultural_melting_pot_desc: "$asia$では多種多様な文化が共存している。この多様性と絶え間ない交流こそが、さまざまな思想や影響の交換を生み、$asia$諸国に何世紀にもわたる繁栄をもたらした。"
 exchange_of_ideas: "思想の交流"
 exchange_of_ideas_desc: "$silk_road$を行き来してきたのは、金銭や交易による利益だけではない。この交易路を行き交う商人の流れとともに、さまざまな思想や知識も移動し、交換されている。"
 fertile_lands: "肥沃な大地"
 fertile_lands_desc: "$asia$の大地は雨に恵まれており、降水量の少ない地域にも豊かな河川が多く流れている。極めて乾燥した砂漠地帯などを除き、大地は住民に十分な食糧を提供し、たとえ食料に乏しい地域であっても生活に困ることは稀である。"
 hand_cannon_guild_advance: "$hand_cannon_guild$"
 hand_cannon_guild_advance_desc: "これは原始的な金属製の筒で、より進歩した後世の銃器には遠く及ばない。中国で最初に開発された初期のハンドキャノンは、1270年に朝鮮半島と日本に広まった。"
 incense_preeminence: "香の重要性"
 incense_preeminence_desc: "$asia$において、香は何世紀にもわたり生活の必需品であり、その歴史は世界中のどこよりも長いだろう。香を儀式に取り入れている宗教は無数にあるが、特に$hindu_ADJ$や$buddhist_ADJ$の儀式、また$muslim$徒の日常生活でほぼ普遍的に使用されているため、$asia$ではごくありふれた品となっている。"
 incense_trade_route: "香の交易路"
 incense_trade_route_desc: "香は$asia$はもとより世界中で求められているため、香の取引専用の交易路が多数必要である。あの有名な$silk_road$のように、香の交易も東洋と西洋を結んでくれるだろう。"
 legacy_of_great_empires: "大帝国の遺産"
 legacy_of_great_empires_desc: "龍の玉座を抱く$china$、$persia_region$の諸帝国、$india$や$south_east_asia$の強力な$hindu_ADJ$および$buddhist_ADJ$王朝など、$asia$はこの地で栄華を誇った多くの大帝国による、長い歴史をもつ。"
 religious_syncretism: "習合"
 religious_syncretism_desc: "ときには異なる信仰や宗教的実践の交差は、互いの教義や実践を拒絶しあうのではなく、自らのものへと融合し、取り入れる結果となることがある。そのため、他国の思想や信仰は敵視すべき対象ではなく、学びの対象とみなせるかもしれない。"
 riches_of_asia: "$asia$の富"
 riches_of_asia_desc: "$asia$はその土地の豊かさで世界的に知られている。$persia_region$や$india$にある豊かな都市から、$china$で生産された極めて需要の高い贅沢品、ほぼ神秘的な存在である$indonesia_region$の香料諸島に至るまで、$asia$の商品と富は世界中で高く評価されている。"
 rise_of_great_individuals: "偉人の台頭"
 rise_of_great_individuals_desc: "卓越した人物は必ず台頭し、偉業を成し遂げることを歴史は証明している。これまでに幾度となく、たった一人の統治者の手によって帝国が築かれ、また破壊されてきた。こうした偉業は敬われ、賞賛されるべきである。"
 saquiyah: "サキア"
 saquiyah_desc: "$saquiyah$は、高所への水の運搬を容易にするために設計された機械装置である。別名#italic ペルシア車輪#!、#italic タブリア#!、#italic レハト#!、#italic ティンパヌム#!とも呼ばれるこの車輪は、水の流れがほとんどない地域の灌漑システムにおいて極めて重要なものだ。"
 sepak_takraw: "セパタクロー"
 sepak_takraw_desc: "古代$chinese_group$の「蹴鞠」から発展し、東南アジア各地で長くおこなわれてきたスポーツであり、国によって「セパ・ラガ」、「タクロー」、「チンロン」、「シパ」などとも呼ばれる。$sepak_takraw$は単なるスポーツではない。選手から選手へとボールを蹴ってパスし、地面に落とさないようにすることが目標だが、定期的な運動としてもおこなわれ、娯楽だけでなく軍隊の訓練にも使われている。"
 silk_road: "シルクロード"
 silk_road_desc: "ゴビ砂漠と$persia_region$地域を横断する陸路であろうと、$indian_ocean_region$と$indonesia_region$地域を通る海路であろうと、名高いシルクロードの利益を追い求める商人たちは、何世紀にもわたり$asia$の土地を行き来してきた。"
 source_of_knowledge: "知識の源"
 source_of_knowledge_desc: "自らを知識と発展の先駆者だと思い込んでいる国があるようだが、彼らが「発明」と呼ぶものの一部は、$asia$では何世紀も前から知られていた。$china$の高度な技術力から$india$の古代文学に至るまで、東洋が西洋を羨むようなものは何ひとつない。"
 structured_society: "体系化された社会"
 structured_society_desc: "$asia$の社会は一般的に非常に構造化されており、各個人はそのなかでの自分の役割を理解している。$hindu$や$SECT_CONFUCIANISM_NAME$の哲学的な社会観の影響を受け、$asia$では社会の歯車が円滑に機能する傾向がある。"
 three_teachings: "三教"
 three_teachings_desc: "$three_teachings$は、$CHI$を起源とする哲学であり$SECT_CONFUCIANISM_NAME$、$SECT_DAOISM_NAME$、$buddhist$の教えを、調和のとれた単一の教えに統合したものである。$SECT_CONFUCIANISM_NAME$は法の理念であり、$SECT_DAOISM_NAME$は急進的な知識人の世界観を表している。この対極的な2つの哲学が、$buddhist$の哲学によって結びつけられている。"
 trade_caravans: "交易隊商"
 trade_caravans_desc: "古来より、我々の領地には有益な交易路が通っていた。わが国民は遠方の土地より物資を運び、交易する隊商と交流することに慣れ親しんでいる。"
 wake_of_the_mongol_horde: "$mongolian_group$遊牧民の侵略の余波"
 wake_of_the_mongol_horde_desc: "$asia$において、$mongolian_group$人による侵略の影響を受けなかった地域はほぼない。$genghis_khan_name_no_tooltip$によって築かれた偉大な帝国が滅亡し、騎馬兵たちに踏み荒らされた土地はようやく回復しつつある。"
 #Israelite Diaspora Advances
 #Jewish Shared
 jewish_group_diaspora_firms: "ディアスポラの交易会社"
 jewish_group_diaspora_firms_desc: "我が商人一族は、離散の地にまたがる商業的な結びつきを維持している。フスタート、アデン、マフディーヤ、ルセナの支店は、信用状、代理契約、一族の会社資本をやり取りしており、その範囲は非ユダヤ系商人がほとんど足を踏み入れることのない地域にまで及ぶ。信頼は血縁、婚姻、そして共有される商慣習法に根差しており、遠方の都市にいる我らの取引相手は互いの署名や印章を見分けることができる。血縁に基づくこの交易網は、正式な契約だけでは、また雨水頼みの農業経済だけでは決して届き得ぬ場所にまで、我が王家の影響力を運ぶのである。"
 jewish_group_court_physicians: "宮廷付き医師"
 jewish_group_court_physicians_desc: "我が医師たちは、イベリアからイエメン、マラバールに至るまで、各地の宮廷に仕えている――ユダヤの学統で育った医術の専門家たちは、スルタン、国王、皇帝の侍医として宮廷の認可状を保持しているのだ。彼らの地位には外交使節の任務、宮廷の儀礼、そして純然たる商業的少数派では到底手に入れられぬような王位継承危機への影響力までが伴う。我が医師たちは異国の宮廷の中枢に近く身を置き、我が王家に最高位の圏内からの絶え間ない情報の経路をもたらしている。"
 jewish_group_hidden_communities: "秘匿された共同体"
 jewish_group_hidden_communities_desc: "我が共同体は、表向きは寄留先の国家の宗教をまとい、内では家族の絆、職業上の人脈、慣習的な営みを守り抜くすべを身につけてきた――イベリアのコンベルソ、ペルシアのマシュハド系の家族、マヨルカのチュエタ、そして同化したカイフォンの家々は、本来宗教によって隔てられているはずの境界を越えて、家族間の血縁と商会の関係を保ち続けている。異端審問の圧力がこれらの共同体の結びつきを断ち切ることに成功することは稀である。なぜならそれらは婚姻、提携、そして口伝の記憶に根差しており、国家が解体し得るいかなる制度にも依っていないからだ。我が共同体の間に結ばれたこの秘められた絆は、外部から容易く揺るがされることのない民を形作っており、それは純然たる公然の少数派よりもなお強固なものである。"
 jewish_group_maritime_diaspora: "海のディアスポラ"
 jewish_group_maritime_diaspora_desc: "我が商会は、ユダヤ文化の及ぶあらゆる地の海路をたどっている――大西洋沿岸の回廊を行くセファルディム、レヴァントの港々を巡るムスタアラビー、マラバールの香辛料航路を行くコチン系ユダヤ人、紅海を渡るテイマニー、アドリア海を行くサロニカの家族たちである。我が船の船長はどの寄留先の文化に属していてもよいが、為替手形、海運契約、そしてあらゆる主要港の倉庫番は、我が一族の商会網に連なる者たちである。海上交易網における我らの専門性は、いかなる一地域限定の商業勢力の及ぶ範囲をも超えて、我が王家の交易路を航行可能なあらゆる海域に運ぶのである。"
 jewish_group_court_financiers: "宮廷の資本家"
 jewish_group_court_financiers_desc: "我が一族の商会は、複数の帝国における絶対主義王権の宮廷に仕えている。ハプスブルク家の #italic Hofjuden #! は帝国軍に資金を融通し、オスマン宮廷の代理人はスルタンのために借款を取り持ち、マラバールの商人は地方のラージャに資金を供給し、ペルシア系の金融業者は王室造幣契約を管理する。これらの地位は危うくもあるが、同時に途方もなく実入りが良い。ある者は一回の遠征期間を通じて穀物と火薬を供給し、別の者はただ一人の仲介者を通じて王室財庫を扱う。宮廷における高等金融での我らの役割は、純粋な商業一族の商会には持ち得ぬ、受け入れ国行政の中枢における影響力を我らが王冠にもたらす。"
 jewish_group_civic_emancipation: "市民としての解放"
 jewish_group_civic_emancipation_desc: "受け入れ国がユダヤ人住民に市民権を広げるにつれ、我らの共同体の地位は近代を通じて変容する。フランス革命による解放令、ハプスブルク家の寛容令、オスマン帝国の #italic タンジマート #! 改革、そして英露両体制の漸進的な自由化がそれである。旧来の団体的少数者身分――特許された居住区、ゲットーの壁、制限された職業、共同体課税――は、個人としての市民権と、教育、法曹界、医学校、官吏職への門戸開放に取って代わられる。この市民的変革により、我らのユダヤ人住民は歴史的な職業的隙間に縛られることなく、近代的な専門職階層へと組み込まれていく。"
