l_japanese:
 lutheranism_movement: "ルター派"
 lutheranism_movement_desc: "プロテスタントの宗教改革がキリスト教世界を席巻している。マルティン・ルターの教えは、カトリック教会の権威に挑む宗教的な激動に火をつけ、不満を抱く人々のあいだで急速に広がっている。"
 lutheranism_movement_location_modifier: "$lutheranism_movement$補正"
 calvinism_movement: "カルヴァン派"
 calvinism_movement_desc: "ジャン・カルヴァンの改革派神学に触発されたこの運動は、より厳格で体系的なプロテスタントの教義を広め、特にヨーロッパの商人階級や都市の住民のあいだで支持されている。"
 calvinism_movement_location_modifier: "$calvinism_movement$補正"
 roman_culture_movement: "ラテン文化の復興"
 hellenism_religion_movement: "プラトン主義復興"
 hellenism_religion_movement_allow_tt: "[GetCountry('BYZ').GetName]は、アクション「[ShowGenericActionName('reestablish_hellenism')]」、またはゲミストス・プレトンの[events|e]を通じてこれをおこなわなければならない。"
 roman_culture_movement_allow_tt: "[GetCountry('BYZ').GetName]が[ShowSocietyDirectionName('latinization')]の傾向にあり、かつ[average_satisfaction|e]が50%を超え、[dominant_language|e]が[ShowLanguageFamilyName('romance_language_family')]である[urban_location|e]を領有している必要がある。"
 hellenism_religion_movement_desc: "ギリシア系およびローマ系のキリスト教徒のあいだで、ひとつの運動が起こりつつある。古代の祖先が残した古き習わしと知恵を取り戻そうとする願いである。"
 hellenism_religion_movement_location_modifier: "$hellenism_religion_movement$補正"
 roman_culture_movement_desc: "復興したローマ帝国におけるラテンの風習の再興。"
 roman_culture_movement_location_modifier: "$roman_culture_movement$補正"
 MOVEMENT_SPREAD: "運動の拡大"
 MOVEMENT_SPREAD_CULTURE: "$MOVEMENT$は、わが国に$CULTURE$文化を広める運動である。現在、わが国の人口のうち$AMOUNT$人がこの文化に同化しており、これは全人口の$PERCENTAGE|%2$にあたる。"
 MOVEMENT_SPREAD_RELIGION: "$MOVEMENT$は、わが国に$RELIGION$を広める運動である。現在、わが国の人口のうち$AMOUNT$人がこの宗教に改宗しており、これは全人口の$PERCENTAGE|%2$にあたる。"
 MOVEMENT_SUBJECT_RELIGION: "[religion|e]：$NAME$"
 MOVEMENT_SUBJECT_CULTURE: "[culture|e]：$NAME$"
 MOVEMENT_SPREADER_TT_TITLE: "広がり方は[pops|e]によって異なる："
 MOVEMENT_R0_FACTORS_TITLE: "$MOVEMENT$の伝播速度に影響する要素"
