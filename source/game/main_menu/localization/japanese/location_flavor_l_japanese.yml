l_japanese:
 stockholm_desc: "この街は1252年、メーラレン湖とバルト海が接する戦略的な立地に、ビルイェル・ヤールによって建設された。これによりストックホルムは、メーラレン湖へのアクセスを支配する要塞となると同時に、スウェーデン内陸部とハンザ同盟およびバルト海の交易網を結ぶ交易拠点となった。"
 paris_desc: "セーヌ川のほとりで、パリは小さな集落からフランスの至宝へと発展した。大聖堂、市場、学校を擁するパリは、ヨーロッパ有数の権力と文化の中心地となったのだ。"
 london_desc: "テムズ川に面したロンドンは、ローマ時代のロンディニウムからイングランド随一の都市へと発展した。繁栄する貿易と王宮によって、この街は王国の政治と経済の中心地となったのだ。"
 rome_desc: "テベレ川沿いの永遠の都ローマは、大陸にまたがる帝国を支配した。ローマ帝国が崩壊したあとも、ローマは教皇庁の本拠地、信仰と権威の標として存続した。"
 jerusalem_desc: "信仰と闘争が交錯する土地エルサレムは、ユダヤ教徒、キリスト教徒、イスラム教徒の崇敬の対象となっている。この地の神聖にして激動の歴史は、絶えることのない巡礼者と征服者により刻まれてきた。"
 alexandria_desc: "かつて地中海の標だったアレクサンドリアは、貿易と学問の交差点として繁栄した。その灯台と図書館は、かつてこの都市が文化と帝国の融合した地であることを告げていた。"
 constantinople_desc: "アヤ・ソフィアを戴き、強大な城壁に囲まれたコンスタンティノープルは、東ローマ帝国の中心として君臨した。1000年ものあいだ、その富と壮大さは世界の羨望の的だった。"
 sitges_desc: "中世には、現在市庁舎が建っている丘の上に城が築かれていた。その最初の所有者はバルセロナの大司教区だったが、12世紀にはその名に由来する一族の所有となった。"
 valladolid_desc: "11世紀末、ペドロ・アンスーレス伯爵とエイロ・アルフォンソ伯爵によってピスエルガ川に架かる橋の近くに建設されたバリャドリッドは、北部メセタの中心に位置する商業都市として発展した。14世紀にはブルゴスと並んでこの地方で最も重要な都市となり、女王マリア・デ・モリーナ、そして彼女の孫アルフォンソ11世の治世のあいだ、主要な行政の中心地となった。"
 penafiel_desc: "ペニャフィエルは「#italic Penna Fidelis#!（忠実な丘）」ともいい、10世紀にドウロ川流域の中流部の戦略的な要地である丘の上に築かれ、コルドバ・カリフ国に対する国境紛争の中心地となった。カスティーリャのサンチョ・ガルシア伯爵は、1013年ごろにこの地を堅固な要塞と化し、「フエロ」を与えた。その後ワイン産業が盛んになり、有力なドン・フアン・マヌエルの家系が支配する豊かな街へと発展していった。"
 toro_desc: "トロは10世紀にドウロ川流域の国境の守りを固めるために、レオン王がコルドバ・カリフ国との戦いで築いた街である。その戦略的な立地と豊かな農地とブドウ畑により、その後重要な街に発展した。"
 thessaloniki_desc: "コンスタンティノープルに次ぐビザンツ帝国第二の都市とされてきたテッサロニキの富と名声は、商業における戦略的な位置によって生み出された。その活気あふれる港は、イタリアとローマの中心地にまたがって貴重な物資を運び、東西をつなぐ重要な架け橋となっている。"
 malmo_desc: "マルメは、バルト海と北海を結ぶエーレスンド海峡の要衝となる重要な拠点である。要塞化された城壁と警戒を怠らない守備隊がマルメを権力の中心地に押し上げ、この都市は戦略と野心によって形作られていった。"
 bilbao_desc: "1300年、ビスカヤ領主ディエゴ・ロペス・デ・アロにより正式に設立されたこの街は、すぐに北スペインの重要な拠点となった。ネルビオン川河口の狭い谷間に位置する城壁に囲まれた集落は、強力な造船業を発展させ、貴重なカスティーリャ産メリノ種の羊毛や地元の良質の鉄鉱石をイギリスやフランドルの港に輸出する主要港となった。"
 radom_desc: "ピャスト朝最後の王、カジミェシュ3世大王よって拡張されたこの都市は、中世後期からルネサンス期を通じて重要な政治的拠点でありつづけた。1401年にはヴィリニュス・ラドム合同が調印され、1505年には王城での議会で「ニヒル・ノヴィ」の法令が承認された。"
 krakow_desc: "ヴァヴェルの丘の小村から始まったこの地は、965年に初めて、その名が当時の注目すべき商業の中心地として記された。1038年にはピャスト朝の君主の居城となり、その後ポーランド王国の行政、経済、文化の中心地となった。"
 megara_desc: "古代に築かれて以来人々が暮らしてきたメガラは、ニソスやビザスといった伝説的な王が治めた。この都市はギリシャ半島の重要な権力の要地となり、その海軍力と盛んな貿易で名を馳せた。入植者たちは地中海全域にビュザンティオン、ケルソネソス、セリヌスなどの重要な入植地を築いた。しかし、時が経つにつれてメガラは次第に色褪せていき、やがてはかつての隆盛の痕跡を残すだけの土地となった。"
 grojec_desc: "12世紀までは、この地方の城主とポズナン大司教座の所在地だったが、隣接するチェルスクに押され、次第にその重要性を失っていった。"
 gdansk_desc: "997年に初めて記録にその名が登場したグダニスクは、バルト海沿岸に存在した集落から生まれた。主要な造船と貿易港となり、東ヨーロッパで最も裕福で影響力のある都市のひとつとしての地位を確固たるものにした。"
 athens_desc: "古代ギリシャの文化の中心地とされたアテネは、当時最も強大な都市国家のひとつに成長した。スパルタ、テーベなどの古代国家と対立しながらも、徐々にエーゲ海を支配する海洋国家へと成長していった。その後、マケドニア帝国やローマ帝国、ビザンツ帝国に征服され、大きく衰退し、1204年以降は主たる十字軍国家の一角となった。"
 wieliczka_desc: "ヴィエリチカの街は1290年、ポーランド王プシェミスウ2世によって岩塩坑の採掘のために築かれた。主要な鉱山都市として多くの特権が与えられ、当地の塩鉱山はすぐに有名になった。ヴィエリチカ岩塩坑とその姉妹坑であるボフニャ岩塩坑は、鉱山会社#italic Żupy Krakowskie#!（ズピー・クラコウスキー）の一部となった。正式な文書ではこの街は「#italic Wielka Sól#!（ヴィエルカ・ソル）」、つまり「大いなる塩」と記されている。"
 leksand_desc: "シリヤン湖の南岸にあるこの村には数千年前から人が住んでおり、その教会は12世紀初頭に建てられた。この村のルター派初の牧師は、ヨハンの祖先であることで有名である。"
 leipzig_desc: "ライプツィヒは1165年、インペリイ街道（#italic Via Imperii#!）とレギア街道（#italic Via Regia#!）の交差点に設立され、裕福な貿易の中心地として発展した。その後、帝国から重要な特権を与えられたライプツィヒは、毛皮貿易と発展する書籍産業の重要な中心地となった。"
 augsburg_desc: "かつてはトラヤヌス帝の時代に「#italic Augusta Videlicum#!（アウグスタ・ヴィデリカム）」として知られた帝国自由都市アウクスブルクは、神聖ローマ帝国で最も古い都市のひとつである。中世初期、アウクスブルクは、955年にハンガリーの侵攻に対する防衛に成功したことで重要性を増した。1276年、アウクスブルクはルドルフ1世から自由帝国都市の権利を得たことでさらに重要性を増し、繁栄への道が拓かれた。"
 warsaw_desc: "マゾフシェの小さな漁師町として誕生したワルシャワは、1596年にジグムント3世によって首都がクラクフから移されてからその名を知られるようになった。それ以来この街は発展を続け、18世紀にはポーランド最大の都市となった。同世紀には、ポーランドの建築や職人の技術へ貢献する大規模な発展が見られた。"
 tunis_desc: "紀元前814年、伝説の女王ディードーによってカルタゴとして最初に建設され、同名のポエニ国家の首都となったが、3度の大きな流血を伴う戦争のすえにローマ人に破壊され、のちに再建される。現在のチュニスは、698年にアラブ人によってこの古代の廃墟の郊外に建設された。12世紀のムワッヒド朝の征服によりチュニスは地域の首都に昇格し、その地位はハフス朝の治世下でさらに強化された。"
 heidelberg_desc: "12世紀後半、ハイデルベルクはライン宮中伯の居城となり、名高い城が築かれた。ハイデルベルクはドイツ初の大学が置かれたことで知られ、それゆえに古くから学問の中心地だった。プファルツはやがてプロテスタント同盟の指導者となり、この地も改革と寛容の中心地となった。その後、ハイデルベルク城とその象徴的な外観が多くの詩人を惹きつけたことで、この都市はロマン主義の象徴となり、「ロマン主義の都市」と呼ばれるようになった。"
 aviles_desc: "その起源を10世紀にまでさかのぼるアビレスは、港としての戦略的重要性から河口沿いに発展してきた街である。近くのガウソン城では、アストゥリアス王アルフォンソ3世が金と宝石で覆われた勝利の十字架の製作を命じ、現在では王国全体のシンボルとなっている。11世紀以降、アビレスは王に特権を授けられた街となり、海上貿易と塩の貯蔵・流通で知られるようになった。"
 pingjin_desc: "道教寺院の晋祠がある太原は、紀元前5世紀以来、山西省および中国北部で最も重要な都のひとつ。979年、宋の皇帝太宗は北漢征伐の際、古城だった晋陽を水攻めにして破壊するよう命じ、「平晋」と改名した。この災厄から都が復興するには長い時間を要した。"
 dunstable_desc: "ローマの都市から修道院の街へ。ヘンリー1世の居城（1109年）、女王エレノアの十字架（1290年）、ヘンリー8世の離婚（1533年）、クロムウェルの募兵地（1642年）で有名。"
 paderborn_desc: "800年ごろに設立された司教区で、カール大帝と教皇レオ3世が初めて会談した地である。三十年戦争で16回包囲され、1646年にスウェーデン軍により破壊される。"
 porto_desc: "「#italic Cidade Invicta#!（不敗の都）」と呼ばれたこの都市は、ポルトガルの名の由来となり、ドウロのポートワインを広く国外に知らしめた。"
 jiaxing_desc: "嘉興は呉と越の境界となる地域である。「嘉」は美しさとめでたいことを意味し、「興」は隆盛と繁栄を表している。"
 torgau_desc: "1452年、選帝侯フリードリヒ2世はトルガウに最初の熊飼育場を設置し、これは1624年まで着実に拡張されていった。ここには最大39頭の熊を飼育することができた。"
 changsha_desc: "長沙の中心街は創設以来、2000年もの時を越えて変わることなく残っている。"
 ningxiang_desc: "ここでは殷王朝（3000年前の王朝）の最も大きな青銅器、「尊（酒器）」が発掘された。"
 wurzburg_desc: "ヴュルツブルクはフランケン地方の拠点として栄え、741年に司教座が置かれた。中世初期には要塞とマイン川の交易路を中心に栄えた。"
 hanover_desc: "ハノーファーは中世の集落から神聖ローマ帝国の重要都市へと発展し、ヴェルフ家によって統治され、貿易、権力、文化の中心地として繁栄した。"
 osnabruck_desc: "オスナブリュックは中世の神聖ローマ帝国の交易拠点で、司教座都市として、またヴェストファーレン条約締結の地として名を知られた。"
 glasgow_desc: "グレスカ（グラスゴー）は、中世の司教区として設立された都市である。大聖堂を中心に栄えて自由都市の地位を獲得し、スコットランドの教育を支えた大学も設立された。"
 neva_desc: "かつてヴァリャーグとギリシャの交易路の一部だったネヴァ川の湿地帯は、1703年にサンクトペテルブルクとなり、200年以上にわたってロシアの首都となった。"
 dubno_desc: "ドゥブノは1100年に初めて着目されるようになり、見本市と、1492年の城で著名なヴォルィーニ貿易の拠点へと成長した。のちにゴーゴリの『タラス・ブーリバ』にも登場する。"
 baden_desc: "ローマ人によって設立され、当初は「#italic Civitas Aurelia Aquensis#!（シヴィタス・アウレリア・アクエンシス）」として知られていたが、中世初期にバーデン辺境伯にちなんで「バーデン＝バーデン」と呼ばれるようになった。"
 erbach_desc: "18世紀後半、エアバッハ伯フランツ1世が古代美術への情熱を抱き、現地の象牙彫刻ギルドに資金を提供したことから、エアバッハは象牙彫刻の一大中心地へと発展した。"
 manhattan_desc: "原住民族のレナペ族に「マンハッタ」と呼ばれていたこの島は、オランダ人入植者が60ギルダー相当の交易品で購入した。彼らはここに砦を築き、ニューアムステルダムの権力の座とした。"
 doncaster_desc: "ローマ帝国時代のダヌム砦に端を発するドンカスターは、1337年までには放浪者や商人たちがロンドンと北部のあいだで商品を運ぶ、グレートノースロードに面したヨークシャーの交易都市となっていた。"
 kitchissippi_desc: "キチシビ川にちなんで名づけられたこの地は、イギリスの入植によって木材取引が拡大するまで、アニシナアベ族の人々が狩猟と交易を営んでいた。この地はのちに植民地行政の拠点となった。"
 saint_marceilin_desc: "11世紀に創設されたサン＝マルセランは、1337年から1340年のあいだドーファンの議会が置かれていた。1461年にルイ11世に献上された、表皮が膨らんだ柔らかいチーズで有名になった。"
 caerphilly_desc: "ヨーロッパで最高品質の石炭を産出するウェールズ渓谷は、18世紀後半には製鉄の中心地となった。"
 grenoble_desc: "グルノーブルはフランスアルプスに抱かれた小さくも戦略的な街で、ドーフィネの州都でもある。川と山に囲まれたこの街は城壁に守られ、北の丘陵にはバスティーユ要塞もそびえ立っている。街の生活は大聖堂と、商人や職人、周辺の渓谷から物資を運ぶ農民たちで賑わう、曲がりくねった通りを中心に営まれている。"
 kinsale_desc: "キンセールは、アイルランドの南海岸にある小さいながらも活気のある港町で、天然の入り組んだ港に守られている。漁業と沿岸貿易が人口の多くを支え、商人たちは塩漬けの魚、皮革、羊毛をワイン、塩、イベリアやフランスからの高級品と交換していた。狭い通りが岸壁の周りに集まっており、現地の船員や時折外国人商人たちが行き交っていた。キンセールの港は規模こそ小さいものの、アイルランドとヨーロッパ大陸を結ぶ玄関口として戦略的価値を有している。"
 stockton_desc: "ストックトンはティーズ川の北岸に位置するアングロ・サクソン時代の集落で、司教が自治区の農奴を解放したことで職人たちが移住してくるようになった。羊毛の輸出とワインの輸入で重要な市場となったが、人口が大きく増えるのは産業革命が起こってからのことだった。"
 kunow_desc: "クラクフ大司教区の重要な一部であり、1281年から小教区が存在する。その名前は、おそらくこの地域の森林に多く生息していたテン（貂、ポーランド語で「kuna」）に由来する。"
 lublin_desc: "ルブリンは12世紀と13世紀の変わり目に入植地として設立され、1317年に短身王ヴワディスワフ1世から商業特権を与えられた。その後の数世紀でルブリンは重要な交易拠点となり、16世紀には黄金時代を迎え、ルブリン合同と特に東方ととの広範な交易により繁栄した。"
 kendal_desc: "ケンダルは、1世紀にケント川岸にローマ時代の砦が築かれたのが始まりである。ノルマン人の支配下で発展したこの街は、1189年にリチャード1世から十字軍遠征の資金と引き換えに市場権を獲得したことで、さらなる繁栄を享受した。中世の羊毛貿易の中心地となり、その主要な城はヘンリー8世の妃キャサリン・パーが最も有名なパー家が所有していた。"
 cairo_desc: "969年、ファーティマ朝の将軍ジャウハル・アッ＝シィキッリーによって、古代ローマのバビロン要塞の傍らに築かれたアル＝カーヒラ（勝利の都）は、瞬く間にアレクサンドリアに代わってエジプトの中心地となった。アイユーブ朝とマムルーク朝のもとでイスラム世界最大の人口を擁する都市へと成長し、その市場とモスクは3つの大陸から商人、学者、巡礼者を引き寄せた。1258年にモンゴルがバグダードを破壊したとき、カイロはイスラム文明の誰もが認める首都として君臨していた。並外れた壮麗さを誇る都市であり、そのミナレットは黎明期から人類を支えてきた河谷の上にそびえ立っていた。"
 dadu_desc: "クビライ・カーンは1267年、太行（タイハン）山脈の南の平原に、元朝の都として大都（偉大なる首都の意）を築いた。そこは、かつて金王朝の中都があった場所であった。マルコ・ポーロはその壮大さに驚嘆し、広い大通り、広大な宮殿、そして中国全土の富であふれ返る倉庫群を備えた都市として描写している。モンゴルの勢力が衰退したときでさえ、草原地帯と中国内陸部を結ぶ北の玄関口というこの都市の立地は、帝国の中心地としての存続を確かなものにした。"
 venice_desc: "アドリア海のラグーンの干潟から隆盛したヴェネツィアは、必要に迫られた民の野心によって形作られていった。ロンバルド人の侵略から逃れてきた難民が最初にその諸島に身を寄せ、9世紀までに都市は選出されたドージェ（総督）によって統治される海洋共和国へと発展。その造船所と会計所を拠点に、ヴェネツィアの商人たちは黒海からレバントにまで及ぶ交易路を掌握し、ヴェネツィアをキリスト教世界一の富を誇る都市、そして地中海交易の誰もが認める支配者へと押し上げた。"
 moscow_desc: "1147年、ユーリー・ドルゴルーキーによってモスクワ川の岸辺に小さな木造の砦として築かれたモスクワは、長らく古いルーシの都市の影に隠れていた。しかし、モンゴルの支配下において、生存と拡大に長けるモスクワの諸侯たちはキプチャクのために貢納を集める一方で、静かに隣接する諸公国を吸収していった。北方の河川路の交差点というその立地は、着実な成長をもたらす商業的足がかりとなり、14世紀初頭までにその大公はルーシのほかのどの統治者よりも大きな権力を振るうようになった。"
 tenochtitlan_desc: "1325年頃、彼らの神ウィツィロポチトリが「サボテンに鷲が止まる島」を約束したという伝説に従い、メシカの人々はテスココ湖の沼沢地に覆われた島にテノチティトランを創建した。天然の要害であり、周囲の湖岸の豊かな資源を享受できるこの場所に建てられた若い入植地は、驚くべき速度で成長していった。その土手道、浮き庭、および戦士の伝統は、いつしかこの地をアメリカ大陸最大の都市、そして強大な帝国の中心地へと変貌させることになる。"
 delhi_desc: "ヤムナー川の西岸に位置するデリーは、古代より歴代王朝の権力の中枢を担ってきた。奴隷王朝が1206年にこの地でデリー・スルタン朝を樹立し、イルトゥトゥミシュやアラウディン・カルジのような統治者のもと、この都市は南アジアにおけるイスラムの主要首都へと発展した。その壮大なモスク、市場、要塞はイスラム世界全域から学者や商人を引き寄せ、亜大陸の大部分を統治する玄関口としてのデリーの地位を確固たるものにした。"
 prague_desc: "ヴルタヴァ川の湾曲部の高台に位置するプラハは、スラヴ人の渡河集落から中世ヨーロッパの偉大な主要都市のひとつへと発展した。プシェミスル朝がフラッチャニの岩だらけの切り立った高台に城と大聖堂を築き、その麓には活気ある商人街が根づいた。ボヘミア王の居城であり、東西ヨーロッパを結ぶ自然の交差点であったプラハは、ドイツ人やユダヤ人の商人、職人、学者を引き寄せ、14世紀初頭までにアルプス以北でも特に人口が多く、繁栄した都市のひとつとなった。"
 vienna_desc: "ローマ人がウィンドボナと呼んだこの地は、帝国の北方国境を守るべく、ドナウ川沿いに軍団の要塞が築かれた場所であった。民族大移動がローマの秩序を押し流した後、この地はバーベンベルク家の辺境伯の居城として再興し、彼らは同じ戦略的要地に自らの野心にふわさしい都市を築いた。1278年、ハプスブルク家がバーベンベルク家に取って代わると、ウィーンは世襲帝国の要となり、ドナウ川流域の交差点というその立地から、神聖ローマ帝国において戦略の面から特に渇望される都市のひとつへと変貌した。"
 baghdad_desc: "762年、アッバース朝のカリフ、アル＝マンスールによってチグリス川の西岸に築かれたバグダードは、当初から世界の中心となるように設計されていた。その伝説的な「円形都市」は、カリフの宮殿と壮大なモスクをその中心に配置し、外側に向かって放射状に市場と住宅が広がる構造となっていた。アッバース朝の権力の絶頂期には100万人以上の人々が暮らし、その「知恵の館（バイト・アル＝ヒクマ）」は、既知の世界の全域から翻訳、討論、新たな発見を目的とした学者を引き寄せた。1258年のモンゴルによる略奪はこの黄金時代を打ち砕いたが、都市は存続し、いまなおチグリス・ユーフラテス川流域の中心地における最大都市でありつづけている。"
 florence_desc: "トスカーナ地方の中心でアルノ川の両岸に広がるフィレンツェは、ローマの植民都市から、ヨーロッパの商業を再形成した商人や銀行家の都市へと成長した。バルディ家、ペルッツィ家、ストロッツィ家といった名門銀行家一族はその信用を諸王国へと広げ、彼らが鋳造したフローリン金貨は国際貿易の標準通貨となった。グエルフィ（ゲルフ、教皇派）とギベッリーニ（ギベリン、皇帝派）の争いに翻弄され、強力なギルドによって統治されていたフィレンツェは、熱烈な市民の誇りと並外れた富を併せ持ち、やがて世界中の羨望の的となる芸術的・知的開花の礎を築いた。"
 samarkand_desc: "中央アジアでも特に歴史の長い都市であるサマルカンドは、絹、香辛料、思想を運ぶ隊商が中国と地中海を行き交うシルクロード沿いに位置していた。サーマーン朝とカラハン朝のもと、学問と職人技の中心たるイスラムの主要な中心地として繁栄し、その職人たちが作る精巧な金属細工や紙は既知の世界全域で名声を博した。1220年、チンギス・カンの軍隊によって壊滅的な打撃を受けたものの、大交易路に位置するその立地が都市を再興させ、そのバザールや工房は再び世界の半分の商取引を引き寄せた。"
 novgorod_desc: "市民が誇りをもって「偉大なるわが主ノヴゴロド」と呼んだこの都市は、ヴォルホフ川沿いのヴァイキングの交易拠点から、北ヨーロッパで最も強力な商人共和国へと成長した。その選出された民会であるヴェーチェは、封建世界では滅多に聞かれない民主的な声をもって統治をおこない、ハンザ同盟の交易相手はノヴゴロドの毛皮、蜜蝋、琥珀をロンドンからリューベックにいたる市場へと運んだ。他のルーシの都市が1230年代のモンゴルによる破壊に屈した一方で、ノヴゴロドはその北方の立地ゆえに難を逃れ、ルーシ全土で最も豊かで独立した都市としての地位を保ちつづけた。"
 lisbon_desc: "テージョ川が大西洋と交わる天然の良港を抱えるリスボンは、フェニキア人の時代から船乗りや商人たちを庇護してきた。ローマ人はこの地をオリシポとして要塞化し、8世紀にはムーア人の統治者たちが、モスクや宮殿の立ち並ぶ繁栄した都市へと変貌させた。1147年、アルフォンソ1世が十字軍の助けを借りてこの地を攻略すると、リスボンは誕生したばかりのポルトガル王国の首都となり、大西洋の重要な港となった。西を向いたその深い港は、すでにその先に広がる未開の海を見据えていた。"
 sevilla_desc: "アンダルシアの肥沃な平原において、グアダルキビル川をまたぐように築かれたセビリアは、ムーア人支配下のスペインにおける珠玉の都市のひとつであった。ウマイヤ朝、そして後のアルモハド朝のもとで、セビリアは文化、科学、交易の中心地として繁栄し、川沿いにそびえる大モスクは、イベリア半島におけるイスラム文明の広がりを物語る証となった。1248年にカスティーリャ王フェルナンド3世によって奪還されたこの都市は、その後も国際的な街でありつづけ、キリスト教スペインで最も豊かな都市へと成長し、その河港はアンダルシアの富を世界へと送り出した。"
 hangzhou_desc: "全盛期には「キンサイ」、すなわち「仮の都」として知られた杭州は、1127年に北方が女真族の金朝に陥落した後、南宋王朝の都となった。13世紀後半にこの地を訪れたマルコ・ポーロは、運河や絹市場、あらゆる品物が取引される広大な広場に感嘆し、「世界で最も華やかな都市」と称した。1279年のモンゴルによる征服後も、大運河の起点という立地と、絹および磁器の交易における圧倒的な強さにより、中国屈指の商業都市として存続しつづけた。"
 bruges_desc: "中世の商業が最盛期を迎えたころ、ブルッヘは北ヨーロッパの主要市場として機能し、ヴェネツィアのガレー船、ハンザのコグ船、イベリア半島のキャラベル船がこぞって積み荷を卸していた。北海へと通じる潮流口に築かれたこの都市の織物会館や、世界初の取引所とされた交換所は、ここを北方の金融首都たらしめた。イングランド産の羊毛からレバント産の香辛料に至るまで、既知の世界の富がその運河と商館を通じて流れ込んだのだ。"
 cologne_desc: "西暦50年にローマ人によって「コロニア・クラウディア・アラ・アグリッピネンシウム」として創建されたケルンは、中世ドイツ最大の都市へと成長し、神聖ローマ帝国において特に強力な大司教区のひとつとなった。1248年に三賢者の聖遺物を安置するべく着工された壮麗なゴシック様式の大聖堂は、この都市の野心と信仰の象徴としてそびえ立った。帝国自由都市であり、ハンザ同盟の創設メンバーでもあったケルンは、重要なライン川交易路を支配し、北海と帝国の中心部を結ぶ玄関口としての役割を果たした。"
 bursa_desc: "ビテュニアのオリンポス山の麓に位置するブルサは、ビザンツ帝国の都市として繁栄していたが、10年間に及ぶ包囲戦のすえ、1326年にオスマン族の首長オルハンによって攻略された。オルハンはここをオスマン国家の最初の真の首都とし、モスクや隊商宿、そして何世紀にもわたってこの都市の特色を決定づけることになる屋根つきバザールを建設した。東方から来るシルクロード隊商の西の終着点であり、世界最高峰の絹織物の生産地でもあったブルサは、並外れた富を誇る都市へと成長し、後にオスマン帝国が花開くための種となった。"
 kyoto_desc: "794年、桓武天皇が朝廷をここに移し、「平安京」と名づけたことで、京都はその後何世紀にもわたって日本の文明の中心地となった。大通りが碁盤の目のように張りめぐらされ、貴族の邸宅や仏教寺院が立ち並ぶこの都市には、世界で最も洗練された宮廷文化が息づき、平安時代の詩歌、絵画、文学はここで生まれた。内戦や火災、そして武士の台頭によってその防壁は幾度となく揺さぶられたものの、この都市は天皇の在所として、また日本文化の魂として存続しつづけた。"
 timbuktu_desc: "サハラ砂漠の縁、ニジェール川の湾曲部に位置するトンブクトゥは、トゥアレグ族の季節的な野営地から、中世アフリカの大都市のひとつへと発展した。マリ帝国のもと、トンブクトゥはサハラ横断交易の要衝となり、北から塩を運ぶ隊商と、南から金や象牙を運ぶ隊商が出会う場所となった。そのモスクやマドラサは大陸全土からイスラム学者を引き寄せ、神学、数学、天文学に関する数万冊の写本が所蔵された図書館を有する学問の都となった。"
 barcelona_desc: "紀元前1世紀にローマの植民都市バルキノとして創設されたバルセロナは、カタルーニャ伯領の首都へと発展し、12世紀にはアラゴン王国の海洋経済の原動力となった。その商船隊と領事館はバレアレス諸島からシチリア、サルデーニャからギリシャの十字軍拠点に至るまで広がり、西地中海の圧倒的な海上勢力となった。大聖堂と古代ローマの防壁のもとに広がる斜面で、街は富と運命を海に求めた海上大国の商業で活気づいていた。"
 cordoba_desc: "全盛期のコルドバは西ヨーロッパ最大の都市であり、50万人の人口を擁し、石畳の通りや公衆浴場、キリスト教世界のいかなる施設をも凌駕する図書館を備えた都市であった。929年に自らをカリフと宣言したアブド・アッラフマーン3世のもと、この街はバグダードのアッバース朝や北方のカロリング朝に挑むカリフ国の首都となった。アヴェロエスやマイモニデスといった学者たちがその通りを歩き、大モスク「メスキータ」は、イベリア半島の地に根づいた非凡な文明の記念碑としてそびえ立った。1236年、カスティーリャ王フェルナンド3世によって都市が攻略されたことでこの時代は幕を閉じたが、その遺産は、この街が守り抜き広く世界へと伝えた知識のなかに生きつづけた。"
 damascus_desc: "はるか昔から人が住みつづけている都市であるダマスカスは、アンチレバノン山脈の麓にある肥沃なオアシスを支配し、その市場はバラダ川の水によって潤されていた。7世紀から8世紀にかけてウマイヤ朝の首都であったこの都市は、当時世界最大規模の帝国の中心に位置し、その大モスクはイスラム建築の傑作のひとつとしてそびえ立った。アッバース朝が権力をバグダードに移した後も、ダマスカスはレバント地方随一の商業・文化都市としての地位を維持し、バザールでは絹、優れた刀剣、そしてこの街の名産品である香り高い薔薇が取引された。"
 angkor_desc: "東南アジア本土の深い森のなかに、アンコールのクメール王たちは他に類を見ない都を築いた。12世紀初頭、スーリヤヴァルマン2世の治世下で建設が始まったアンコール・ワットの広大な寺院群は、ヴィシュヌ神に捧げられ、宇宙を地上に表現するものとして設計された。その堀は宇宙の海を、塔はメール山（須弥山）の峰々を表している。最盛期には、アンコール地域全体が貯水池と灌漑用水路からなる精巧な水利網によって支えられており、産業革命以前の世界のなかでも特に広大な都市複合体のひとつであった。"
 vijayanagar_desc: "1336年、トゥンガバドラ川の南岸にハリハラ・ラーヤとその弟ブッカが築いた「勝利の都」ヴィジャヤナガルは、勢力を拡大するデリー・スルタン朝に対するヒンドゥー文明の防壁として築かれた。トゥンガバドラ川と、巨大な花崗岩や岩だらけの峡谷からなる険しい地形に守られたこの新興の首都は、すでにデカン高原中央部の肥沃な平原を支配下に置いていた。この岩だらけの要塞から、2世紀以上にわたって存続する帝国が生まれ、その市場にはインド洋世界全域から商人や交易品が集まった。"
 naples_desc: "紀元前600年頃、その壮観な湾岸にギリシャの植民都市ネアポリスとして創設されたこの都市は、ローマ、ビザンツ、ノルマン、ホーエンシュタウフェンの支配を経て、1266年にアンジュー朝がナポリ王国の首都とした。アンジュー家の統治のもと、ナポリは中世ヨーロッパの主要な王宮のひとつとなり、イタリアで最も人口の多い都市へと成長し、その港はメッツォジョールノ（イタリア南部）の富を世界へと送り出す要所となった。ナポリの宮廷は学者、芸術家、神学者たちを惹きつけ、そのなかにはこの地で教鞭を執り、没したトマス・アクィナスも含まれていた。こうしてナポリは王朝の権力の座であると同時に、知的活動の中心地ともなった。"
 milano_desc: "ポー平原の中心に位置するミラノは、もともとケルト人の集落として始まったのだが、ローマ人がここを「メディオラヌム」と名づけたことでその起源は一掃され、一時は西ローマ帝国の事実上の首都となった。民族大移動によってその栄華が衰えた後、この都市は自由都市として復活し、1176年のレニャーノの戦いでフリードリヒ・バルバロッサと帝国軍を撃退した。13世紀後半にシニョーリの権力を掌握したヴィスコンティ家のもと、ミラノはロンバルディア周辺の都市を次々と吸収する領国の首府となり、北イタリアにおける支配的な勢力となった。"
 genoa_desc: "リグリア・アペニン山脈の弧状の地形に守られたジェノヴァは、その偉大なる街のすべてを海の上に築き上げた。その商人や提督たちは、黒海から大西洋にまで及ぶ交易拠点と植民地からなる海上帝国を切り拓き、その艦隊は地中海貿易の覇権をめぐり、ヴェネツィアの艦隊と幾度も激突した。ドーリア家、グリマルディ家、スピノラ家といった名門一族の飽くなき野心に駆り立てられ、この共和国は「ラ・スペルバ」（誇り高き都市）という異名を獲得し、後背地をほとんどもたない都市であっても、キリスト教世界においてとりわけ豊かな強国のひとつとなりうることを証明した。"
 bologna_desc: "エトルリア時代の都市「フェルシナ」、後にローマ時代の植民都市「ボノニア」として創建されたボローニャは、アペニン山脈の麓、エミリア街道とポー川流域へと続く北への街道が交わる地点に位置している。この都市は何よりも、1088年に設立された世界最古の大学で知られており、その講堂や中世の双塔の陰には、ヨーロッパ各地から法学、医学、哲学を学ぶ学生たちが集まった。商人たちの富、司教たちの権威、そしてコムーネの独立性により、ボローニャは中世イタリアの政治において極めて争奪の激しい地であった。"
 palermo_desc: "シチリア島北岸のふたつの岬に抱かれるような位置にあるパレルモは、フェニキアの商人によって築かれ、カルタゴ、次いでビザンツ帝国の支配下で大都市へと発展したのち、9世紀のアラブの征服によって、モスク、庭園、バザールが立ち並ぶイスラムの大都市へと変貌を遂げた。1072年にアラブ人の手からこの地を奪還したノルマン王たちは、この街の国際色豊かな遺産を基盤として驚くべき成果を挙げ、アラブ、ビザンツ、ラテン各々の伝統を融合させ、キリスト教世界において他に類を見ない文明を誇示するきらびやかな王室礼拝堂や宮殿を作り上げた。ノルマン・シチリア王国の首都、そして後にホーエンシュタウフェン帝国の首都として、パレルモは中世世界でも特に教養豊かで強力な王宮となった。"
 verona_desc: "アルプスの南端、アディジェ川を挟むように築かれたヴェローナは、古代から交通の要所であり、世界最大級かつ極めて保存状態のよいローマ時代の円形劇場が、かつて軍団や商人が同じように行き交った通りにいまなおそびえ立っている。13世紀後半に権力を掌握したスカラ家のもと、ヴェローナは北イタリア屈指の強力なシニョーリア（僭主国）となり、その領主たちはヴェネト地方を支配し、その勢力をアドリア海へと拡大していった。スカラ家の宮廷に庇護を求めた人々のなかにはダンテ・アリギエーリもおり、彼はフィレンツェからの長きにわたる亡命生活のなかで、カングランデ・デッラ・スカラの後援のもと『神曲』を完成させた。"
 siena_desc: "トスカーナ地方の中心部にある3つの丘の上に築かれたシエナは、中世イタリアの列強のひとつであり、その富は銀行業と羊毛交易に支えられ、シエナの商人一族は王や教皇さえも債務者とするほどであった。わずか50キロメートルほど北に位置するフィレンツェとの激しい対立は、何世代にもわたり両都市の歴史を形作り、中心部の広大な広場「カンポ」は、イタリアで最も誇り高きコムーネのひとつであるシエナの市民生活と政治劇の舞台として機能した。ドゥッチョ・ディ・ブオニンセーニャやロレンツェッティ兄弟の絵画は、シエナをヨーロッパにおけるゴシック芸術の主要な中心地へと押し上げた。"
 pisa_desc: "アルノ川の河口に位置するピサは、中世地中海で有数の海上帝国を築き上げ、その艦隊は1063年にパレルモを襲撃し、ティレニア海でサラセンの海賊を撃破し、サルデーニャからアンティオキアに至るまで交易植民地を確立した。この商業によって富を蓄えたピサの人々は、カンポ・デイ・ミラーコリ（奇跡の広場）に大聖堂、洗礼堂、鐘楼からなる卓抜した建築群を建設。これらは12世紀の全盛期において、その富と自信にはかぎりがないかのように思われた、当時のこの都市を象徴する記念碑である。1284年のメロリアの海戦でジェノヴァに壊滅的な敗北を喫したことでピサの海軍力は失われたものの、都市とその見事な記念碑は存続した。"
 padova_desc: "トロイアの英雄アンテノールによって建都されたという伝説があり、ローマ領イタリアでもとりわけ豊かな都市として栄えたパドヴァは、中世にはヴェネト地方の中心に位置する繁栄したコムーネへと成長した。1222年にボローニャから離れた学者たちが設立した同都市の大学は、瞬く間に法学と医学におけるヨーロッパ屈指の中心地となり、大陸各地から学生を集めた。14世紀初頭には、絵画の巨匠ジョットがアレーナ礼拝堂（スクロヴェーニ礼拝堂）内の絵を手掛け、西洋美術史における金字塔を打ち立てる一方、都市自体もカッラーラ家による統治のもと、学問と野心の中心地として栄えた。"
 ferrara_desc: "ポー川デルタの湿地帯の端に位置するフェラーラは、ささやかな川渡しの場から発展し、13世紀にこの地の領主として地位を確立したエステ家の野心によって形作られていった。彼らの長きにわたる庇護のもと、この都市は騎士道文化と洗練された宮廷生活の中心地となり、領主たちは詩人を呼び寄せたり、馬上槍大会や学問的な討論を主催したりする一方で、ミラノ、ヴェネツィア、教皇領との対立を巧みに乗り切っていた。フェラーラの特徴を形作った広くてまっすぐな通りと、威風堂々としたエステ城は、城壁や兵士と同じくらい秩序と優雅さが重要視されたこの都市の象徴であった。"
 parma_desc: "紀元前183年、エミリア街道沿いにローマ人が築いたパルマは、ロンバルディア平原の主要都市のひとつとなった。ミラノとボローニャを結ぶ大街道上に位置し、周囲には肥沃な農地が広がっていたことで、この街はつねに繁栄を続け、争奪の対象となっていた。自由都市のパルマは、フリードリヒ・バルバロッサに対抗するロンバルディア同盟のなかでも特に活発なメンバーであり、教皇派と皇帝派の一族による長年の激しい派閥闘争ののち、歴代のシニョーリ（領主）の手を渡り歩いた。12世紀のロマネスク様式で建てられた大聖堂と洗礼堂は、コムーネ時代の政治的混乱を生き抜いた市民の信仰心と富を象徴するものである。"
 mantova_desc: "緩やかに流れるミンチョ川によって形成された湖が三方を囲むマントヴァは、北イタリアのなかでもとりわけ防衛に適した地形を有しており、青銅器時代から人が定住してきた。ローマ人はこの街を、ローマで最も偉大な詩人ウェルギリウスの生誕地として称え、この都市の運命は長いあいだ統治者たちの芸術的・文学的な野心によって形作られてきた。14世紀初頭には、ゴンザーガ家がこの地で台頭し、その長きにわたる後援のもと、マントヴァはイタリア内で特に洗練され、風雅を極めた宮廷の地へと成長していった。"
 lucca_desc: "古代ローマ時代の街路網に囲まれ、絹の産地であるガルファニャーナの豊かな田園地帯に抱かれたルッカは、中世イタリアでとりわけ裕福な都市のひとつであった。その商人たちはヨーロッパ全域へと進出し、彼らの銀行や絹交易により、ルッカ産を意味する「ルッケーゼ」の名はパリ、ロンドン、ブルッヘの市場において上質な織物の代名詞となった。そうしてこの都市は、トスカーナ地方でも屈指の美しさを誇るロマネスク様式の教会群を築き上げるのに十分な富を蓄えるに至ったのだ。ピサやフィレンツェからの脅威に幾度もさらされながらも、ルッカは驚異的な粘り強さで独立を守り抜き、その堅固な防壁と熱烈な市民の誇りによって、対立都市が次々と領主支配に屈した後も、長く自由を保ちつづけた。"
 messina_desc: "シチリア島とイタリア本土を隔てる狭い海峡を支配するメッシーナは、鎌のように曲がった湾の形からここを「ザンクレ」と呼んだギリシャの入植者たちによって建設され、その立地から当初より地中海有数の戦略的要港となった。1061年、ノルマン人がシチリア征服を開始したのもこのメッシーナからであり、その港を経て、アンジュー家、ホーエンシュタウフェン家、そして聖地を目指す十字軍など、後に続くあらゆる時代の軍勢が東西を行き交った。度重なる地震や政治的動乱に見舞われながらも、類まれな天然の良港のおかげで街はつねに復興を果たし、商業と紛争を等しく引き寄せつづけた。"
 brescia_desc: "アルプス山脈の麓、プレアルプスがロンバルディア平原へと下っていく地点に位置するブレシアは、中世イタリアを代表する工業都市のひとつであり、その鍛冶場が作り出す武器と鎧の品質は名高く、ヨーロッパ全土で取引された。自由都市であるブレシアはロンバルディア同盟のなかでも特に勇ましく、市民による帝国軍への抵抗は、北イタリアのコムーネ伝統の礎となった。ミラノとヴェネツィアの巨大な野心に挟まれたブレシアは、アルプス山脈の峠口という戦略的立地と、職人たちの優れた技量ゆえに、どちらの強国も容易には手放そうとしない重要な拠点となった。"
 cremona_desc: "紀元前218年、ローマ人によってポー川南岸に辺境の植民都市として築かれたクレモナは、ロンバルディア平原の主要都市のひとつへと成長し、川に面した立地によって東西を結ぶ陸路・水路交易の天然の要衝となった。皇帝と教皇のあいだの激しい争いにおいて、この都市は皇帝派への忠誠の代名詞となり、その忠誠ゆえに苦難を味わうこともあったものの、帝国からは格別の寵愛を受け、莫大な富を手にした。イタリアで最も高い中世の鐘楼であるトッラッツォと、競い合うように建てられた有力一族の塔の数々が形作る都市の全景は、権力の行使も誇示も等しく激烈だったこの街の、競争心に満ちた市民の誇りを象徴していた。"
 pavia_desc: "ローマ崩壊後2世紀にわたり、パヴィアはイタリアのランゴバルド王国の首都を担った。この都市はその戦士たる王たちの本拠地であり、彼らの「鉄の王冠」の守護者でもあった。カロリング朝の皇帝たちもここをイタリアにおける居城として維持し、ランゴバルド王国がフランク帝国に吸収された後も、パヴィアは王都および戴冠の地としての威信を長く保ちつづけた。イタリアでも特に歴史の長いパヴィア大学は、9世紀にはすでに繁栄しており、ポー川流域の西側の要衝であるティチーノ川沿いの立地は、イタリア北部の支配を目論むあらゆる勢力がパヴィアを争奪の対象としつづける要因となった。"
 perugia_desc: "テベレ川上流の谷を見下ろす丘の上に位置するペルージャは、古代エトルリアの12都市のひとつであり、後にローマの自治都市となって繁栄し、中世には中部イタリアでとりわけ強大かつ動乱に満ちた独立コムーネのひとつとして台頭した。壮麗なパラッツォ・デイ・プリオーリ（プリオリ宮殿）や、ニコラ・ピサーノとその息子ジョヴァンニが彫刻を手掛け1278年に完成させたフォンタナ・マッジョーレ（マッジョーレの泉）は、トスカーナのどの都市にも引けを取らない市民の誇りと芸術的野心を体現していた。1308年にこの地に設立された大学は、自らの軍事的・政治的権力に匹敵する学問的名声を築こうとするペルージャの決意の表れであった。"
 ancona_desc: "シラクサからの亡命者たちがアドリア海沿岸にギリシャ植民都市として築いたアンコーナの名は、ギリシャ語の「肘」に由来しており、北からの風波から港を守るように湾曲した岬を形容している。中世には、アドリア海中部の最重要港へと発展し、その商人たちはビザンツ帝国のコンスタンティノープルやレバントの港と交易をおこなった。教皇や皇帝が何度もこの街を服従させようと試みたが、アンコーナは不屈の精神でコムーネの独立を維持。その港と艦隊は、何世紀にもわたり自由を固く守り抜くための礎であった。"
 aquila_desc: "中世イタリアの主要都市のなかでも特に新しいラクイラは、1254年頃、アブルッツォ高地の100近くの村々が合併し誕生した。その際、各村は新たな都市に教会、泉、地区、そして鐘をひとつずつ提供したと伝えられている。山岳王国の中心、アペニン山脈の高地に位置するこの都市は、驚くべき速度でアブルッツォの首府へと成長し、その立地と防壁は、対立する領主たちや遠く離れたナポリ宮廷の野心から都市を守り抜いた。100近い共同体がそれぞれ市民としてのアイデンティティを分かち合い維持するという、その特異な建都の経緯は、ラクイラに独特の複雑さと、イタリア南部のどの都市とも異なる熱烈な郷土愛をもたらした。"
 ravenna_desc: "短くも非凡な1世紀のあいだ、ラヴェンナは西ローマ帝国最後の首都としての役割を果たした。476年にローマが滅亡した際も、オドアケルの宮廷、次いで東ゴート王テオドリックの宮廷がローマ的統治の形式と伝統を維持したのはここであった。6世紀のビザンツ帝国による再征服により、ラヴェンナはコンスタンティノープルの西の拠点、すなわちラヴェンナ総督府の所在地となり、このギリシャ帝国統治の時代には、地元の職人たちが教会や霊廟を埋め尽くす驚異的なモザイク連作を生み出した。ボローニャやポー川流域の成長著しい都市群の陰に長らく隠れてはいたものの、ラヴェンナはその類まれな芸術のなかに、ラテン西方世界のほかのどこにも見られない帝国の栄光の記憶を留めつづけた。"
 salerno_desc: "アマルフィ海岸の海と山々に囲まれた、波静かな湾内に位置するサレルノは、1076年にこの地を制圧したノルマン人の征服者ロベルト・グイスカルドによって首都に選ばれ、王宮がパレルモへ移るまで、南イタリアにおけるノルマン勢力の最初の拠点として機能した。この都市で最も有名なのは、ヨーロッパ最古の医学学校であるサレルノ医学校で、同校は9世紀以降、この国際色豊かな南部の海岸に集結したギリシャ、アラブ、ラテン各派の医学的伝統を融合させることで繁栄した。サレルノで学んだ医師たちは大陸全土に広がり、同校の解剖学、外科学、薬草学に関する文献は、中世世界全体の医術を形作った。"
 syracuse_desc: "紀元前734年、コリントスの入植者たちが巨大な港の口にある小さな島に設立したシラクサは、西地中海で最も強大なギリシャ都市へと成長し、その力は紀元前415年から413年にかけてアテネ遠征軍を壊滅的な敗北に追い込んだことで裏付けられた。アルキメデスが伝説的な兵器を考案し、それを使い都市がローマ軍の侵攻を食い止めたのもこの地であり、カルタゴ、ローマ、ビザンツ、アラブ、ノルマンといった歴代の征服者たちが、放置するにはあまりに価値ある港だと認めたのもまたこの地であった。パレルモの陰に隠れて久しいものの、シラクサはシチリア南東部最大の都市として存続し、その古代の港と、切り石を敷き詰めた通りは、古代地中海世界全体を形作った輝かしい文明の証としていまなお残っている。"
 trebizond_desc: "ポントス山脈と黒海のあいだに位置する狭い海岸段丘の上に築かれたトレビゾンドは、中世世界においてとりわけ劇的な立地を誇る都市のひとつであった。1204年、コンスタンティノープルが第4回十字軍によって陥落した際、コムネノス朝の成員たちはここに逃れてトレビゾンド帝国を建国。この帝国はラテン帝国が崩壊した後も、独立したギリシャ系キリスト教国家として長く存続した。黒海交易路の東端と、アルメニアやペルシアへと通じる山道を支配下に置いたこの都市は、ジェノヴァの商人たちを惹きつけ、シルクロードの西の終着点として繁栄し、その市場には中央アジアやさらに遠方からの交易品が集まった。"
 smyrna_desc: "エーゲ海沿岸の古代都市のひとつであるスミルナは、ホメロスの生誕地を自称する都市のひとつであり、後に『ヨハネの黙示録』に登場する小アジアの7つの教会のひとつとなった。ビザンツ帝国の支配下では、アナトリアの豊かな内陸部とエーゲ海の商業を結ぶ主要な港湾として機能し、その港にはヴェネツィアやジェノヴァの商人たちが頻繁に訪れ、埠頭沿いに交易拠点を築いた。13世紀末から14世紀初頭にかけ、この都市はビザンツ、ジェノヴァ、トルコ系のアイドゥン朝のあいだで次々と支配が移り変わり、その類まれな立地ゆえに、エーゲ海地域のいかなる勢力も無視できない重要な拠点となった。"
 konya_desc: "中央アナトリアの高原に位置するコンヤは、12世紀から13世紀の大部分にわたりアナトリアを支配したトルコ系国家、ルーム・セルジューク朝の首都を担った。セルジューク朝のスルタンの統治下で、この都市はイスラム美術、建築、学問の中心地として繁栄し、タイル張りの霊廟やマドラサ（イスラム学校）は、古代の高原都市を中世イスラム世界における偉大な文化の中心地のひとつへと変貌させた。神秘主義詩人ジャラール・ウッディーン・ルーミーが定住し、その生涯を閉じたのもこの地であり、彼の弟子たちが創設した「メヴレヴィー教団」（旋舞教団）の音楽と儀式は、この都市の名をアナトリア高原のはるか彼方へと広めた。"
 sivas_desc: "アナトリアとペルシアを結ぶ主要な交易路が交差する高地に位置するスィヴァスは、中世近東における交通の要衝のひとつであった。ルーム・セルジューク朝のもと、並外れた建築的野心を有する主要な州都へと発展し、13世紀に建てられた偉大なマドラサ群——なかでも名高いギョク・メドレセとチフテ・ミナレリ——は、アナトリアにおけるセルジューク朝石造建築の最高傑作に数えられている。モンゴルによる征服後、この都市はイルハン朝のアナトリア諸州における重要な行政中心地として機能し、その市場や隊商宿は、中央アジアと地中海のあいだを往来する長距離交易の要所となった。"
 kayseri_desc: "ローマ人には「カエサレア・マザカ」として知られ、古代カッパドキアの主要都市であったカイセリは、幾世紀にもわたり、アナトリア高原と、アルメニアやメソポタミアへと続く東方の交易路を結ぶ玄関口としての役割を果たした。小アジアにおける最初期のキリスト教中心地のひとつであり、大バシレイオスの故郷でもあった。彼の神学の著作と修道院規則は東方教会を形作り、今日に至るまでキリスト教の信仰の実践に影響を与えつづけている。セルジューク朝およびその後継者たちのもとで、この都市はモスク、マドラサ、隊商宿によって豊かになり、アナトリア交易の十字路という不変の地位ゆえに、それぞれの支配者がその価値を認め、ビザンツ、ダニシュメンド朝、セルジューク朝、そしてモンゴルの手へと次々に渡っていった。"
 izmit_desc: "紀元前3世紀にビテュニア王ニコメデス1世が築き、ローマ人には「ニコメディア」として知られていたこの都市は、ディオクレティアヌスのもとでローマ帝国の東の首都として機能した。同帝はここを自身の居城とし、東方諸州の行政の中心地としたのである。303年、ディオクレティアヌスはニコメディアを拠点としてキリスト教徒に対する「大迫害」を開始し、宮殿から見える場所にあった主要な教会を破壊し、信仰に対するローマ最後にして最も過酷な弾圧を主導した。対岸にコンスタンティノープルが創建されると、この都市は次第にその偉大な隣都の陰に隠れるようになったが、ビザンツ帝国の全世紀を通じて、主要な港および司教座所在地としての重要性を維持した。"
 ankara_desc: "アナトリア高原の中心にある岩だらけの丘の上に位置するアンカラは、ローマ人がここを属州ガラティアの首府とするはるか以前から、古代ガラティアの都市として存在していた。コンスタンティノープル、黒海、レバント、ペルシアからの街道がすべて交わるその戦略的立地は、この都市に永続的な軍事的・商業的意義をもたらし、市民がアウグストゥスを称えて建立した大神殿には、ローマ史において現存する最も重要な記録のひとつに数えられる碑文が保存されている。その後、ダニシュメンド朝、ルーム・セルジューク朝、そしてモンゴルの統治下でも、アンカラはアナトリア高原の要衝でありつづけた。この都市を掌握するということはすなわち、そこを通る街道すべてを支配下に置くということを意味していたのだ。"
 amasya_desc: "イェシルウルマク川がポントス山脈を切り開いてできた深い峡谷に位置するアマスィヤは、古代ポンティス王国の王都であり、地理学者ストラボンの生誕地でもあった。ストラボンは、世界地理に関するその大著のなかで、この地を愛情深く詳細に描写している。川を見下ろす断崖絶壁に彫られた王墓群という劇的な景観は、最盛期に小アジアの大部分を支配下に置いたヘレニズム王国の威容を物語っている。ビザンツ、ダニシュメンド朝、セルジューク朝、そしてモンゴルの統治下においても、この都市はポントス山麓の中心地という重要な地位を維持し、その深い峡谷と山岳地帯という立地により、北アナトリアでも特に優れた天然の要害のひとつでありつづけた。"
 rodos_desc: "古代の長い期間にわたり、ロードスは東地中海で最も富裕で国際色豊かな港湾都市であった。港の入り口にはかつて、古代世界の七不思議のひとつである伝説の「コロッソス」（巨像）がそびえ立ち、その海事法であるロード海法は、当時知られていた海全域の商取引を統括していた。数世紀にわたるローマ、ビザンツ、アラブの影響を経て、1309年に島が聖ヨハネ騎士団の手に渡ると、彼らはこの地を要塞化し、東地中海屈指の強固さを誇るキリスト教の拠点へと変えた。その巨大な防壁の内側で、騎士団はロードスを十字軍権力の中心地へと変貌させ、そのガレー船団はキリスト教世界とイスラム教徒の東方世界を結ぶ航路を巡回した。"
 corinth_desc: "ギリシャ本土とペロポネソス半島を結ぶ狭い陸路と、地峡を横断する古代の陸路の両方を支配していたコリントスは、古代ギリシャ世界においてとりわけ豊かで、戦略的に極めて重要な都市のひとつであった。全盛期にはエーゲ海とアドリア海間の交易を掌握し、陸路で運ばれ2つの港のあいだを行き来する貨物に通行税を課していた。また、その青銅器や装飾陶器は地中海の隅々まで輸出された。紀元前146年、ローマの将軍ルキウス・ムンミウスによって壊滅的な打撃を受けたものの、ユリウス・カエサルによってローマの植民都市として再建され、主要都市として存続した。その後、ビザンツ、ラテン、フランク各勢力がその要衝としての価値を認識し、相次いで支配権を握った。"
 candia_desc: "1204年、第4回十字軍がビザンツ帝国を崩壊させると、ヴェネツィアはクレタ島を獲得してカンディアを首都とし、その後の1世紀で、同地は東地中海において戦略的に極めて重要なヴェネツィアの前哨基地のひとつへと変貌を遂げた。島の肥沃な平野はヴェネツィアの艦隊と植民地の双方を支え、カンディアの港はヴェネツィアとレバントを結ぶ海路における重要な補給拠点として機能した。クレタ島の住民はヴェネツィアの支配者に対して幾度も反乱を起こしたが、都市自体は着実に要塞化されて豊かになり、その防壁と倉庫は、クレタ島を永久に保持せんとする植民地支配の意志を誇示していた。"
 edirne_desc: "ローマ皇帝ハドリアヌスによってマリツァ川のほとりに建設され、その名にちなんで「ハドリアノポリス」と名付けられたアドリアノープルは、コンスタンティノープルとドナウ川国境を結ぶ主要路を守り、トラキア防衛のための重要な軍事・行政の中心地として機能した。378年に西ゴート族の騎兵隊がウァレンス帝の軍団を打ち破ったのもこの地である。これは古代史において特に重大な影響をもたらした戦いのひとつであり、この敗北は帝国内にゲルマン諸民族の受け入れる契機となり、西ローマ帝国の最終的な崩壊の一因となった。ビザンツ帝国下においても、アドリアノープルはトラキア随一の都市でありつづけ、西からの脅威に対するコンスタンティノープルの伝統的な第一防衛線という役割を引き続き担った。"
 ioannina_desc: "パンボティス湖に突き出た岩だらけの半島に位置するイオアニナは、1204年に第4回十字軍がビザンツ帝国の権力を崩壊させた後、ギリシャ北西部に誕生した後継国家であるエピロス専制公国の主要都市であった。エピロス専制公たちの統治下で、イオアニナはささやかな地方都市から、ギリシャ文化と抵抗運動の重要な中心地へと発展。天然の要害は堅固な防壁によってさらに強化され、湖は食糧確保と防御の両面において重要な役割を果たした。エピロスの山岳地帯は、安全と孤立を等しくもたらし、イオアニナは旧帝国領の激動を極める北西部において、ギリシャ系キリスト教文明を支える重要な要塞としての役割を果たした。"
 tarnovo_desc: "ヤントラ川の湾曲部を見下ろす3つの丘の上に位置するタルノヴォは、1185年にアセンとペタルという兄弟がビザンツの支配に対して大規模な反乱を起こした際、第二ブルガリア帝国の首都として選ばれた。アセン朝のもと、タルノヴォはバルカン半島屈指の堅固な要塞都市へと発展。ツァレヴェッツの丘にそびえ立つ王宮と総主教座大聖堂は、13世紀の全盛期にはドナウ川からエーゲ海に至るまでその勢力を広げた国家の象徴であった。モンゴルの圧力により帝国が弱体化した後も、タルノヴォは縮小しながらも誇り高きブルガリアの首都として存続し、その防壁と帝国の記憶は、14世紀までこの都市のアイデンティティを形作りつづけた。"
 dubrovnik_desc: "ダルマチア海岸の石灰岩の崖に守られたドゥブロヴニクは、ビザンツ帝国によって設立された避難所から、中世地中海において著しい繁栄を遂げた、外交的に巧みな小国家のひとつへと成長した。ラグーザ共和国として、ヴェネツィア、ハンガリー、セルビア、そしてその先で台頭しつつあった競合する諸勢力の圧力のなかを並外れた手腕で渡り歩き、必要に応じて貢ぎ物を捧げつつ、フランドルからレバントにまで及ぶ各地の商館網を維持した。その商人たちは、既知の世界全体に交易品と信用を運び、巨大な防壁の背後にそびえる優美な石造りの都市は、代償を伴う戦争よりも、商業と慎重な外交を選んだ文明の姿を誇示していた。"
 sredets_desc: "ローマの時代にはダキア・メディテラネア属州の首府として「セルディカ」と呼ばれ、後にソフィアとなるこの都市は、ブルガリア帝国が地方の中心地としたその時、すでに何世紀もの歴史を目撃していた。コンスタンティヌス帝が343年に初期キリスト教の主要な公会議のひとつである大評議会を招集したのもセルディカであり、ボスポラス海峡沿いの地を選定する前に、彼が新たな帝都の建設を最初に検討したのもまたこの地であったと伝えられている。ビザンツ帝国およびブルガリア帝国のもと、セルディカはバルカン半島の主要な交通路が交わる重要な要衝として機能し、ヴィトシャ山の麓というその立地ゆえに、この都市はあらゆる征服を生き延び、保持する価値のある貴重な拠点として存続した。"
 ohrid_desc: "同じ名の古代の湖のほとりに位置するオフリドは、宣教師キリルとメトディウスの弟子である聖クリメントが、9世紀後半にこの地でスラヴ学問の偉大な学校を設立し、何千人もの聖職者や学者を育成して新たなスラヴ語の文芸と言語の素養を授けたことで、その名声を高めた。ブルガリアの改宗後、オフリドはブルガリア総主教座の所在地となり、後に正教会世界において極めて重要な宗教的中心地のひとつであるオフリド自治大主教区となった。丘陵地帯には教会や修道院がひしめき合っていたため、この街は「バルカンのエルサレム」という名で知られるようになり、その宗教的権威は数世紀にわたり南スラヴ諸民族のキリスト教信仰のあり方を形作った。"
 nis_desc: "ローマ人に「ナイスス」として知られていたニシュは、モラヴァ川とニシャヴァ川の渓谷が交わる地点に位置し、ドナウ川沿いの国境とコンスタンティノープルを結ぶ主要街道を支配していたため、古代バルカン半島において戦略的に重要な都市のひとつであった。西暦272年頃、コンスタンティヌス帝が誕生したのもこの地である。西バルカン半島出身の彼は、ローマ帝国と西洋文明全体の歩みを再構築することとなる人物であった。フン族のアッティラらによって幾度も破壊されたものの、交通の要衝という立地のおかげで復興することができ、ビザンツ、ブルガリア、セルビアの支配下においても、ニシュは中央バルカン半島の重要な結節点でありつづけた。"
 durres_desc: "ヨーロッパ屈指の歴史を誇る都市ドゥラスは、紀元前627年頃、コリントスやコルフからの入植者によってギリシャの植民都市エピダムノスとして創設され、アドリア海東岸に位置するその優れた天然の港湾により、すぐさま商業的に重要な都市となった。ローマ人はこの地を「ディラキウム」と呼び、バルカン半島を横断してビザンツへと至る大軍事街道「エグナティア街道」の西端の終点としたため、数世紀にわたり、ローマから東方へ進軍するすべての軍隊が、この街の門を通過することとなった。イタリアとバルカン半島を結ぶ玄関口というその位置ゆえに、この地域でもとりわけ激しい争奪戦が繰り広げられた都市のひとつとなり、その港と城壁の支配は中世の数世紀にわたり、ビザンツ帝国、ノルマン人、ヴェネツィア共和国、アンジュー家の領主たちのあいだで次々に入れ替わった。"
 prizren_desc: "シャール山脈の麓の肥沃な谷間に位置するプリズレンは、古代に築かれた都市であったが、13世紀以降、中世のセルビア国家によって主要な拠点のひとつへと変貌を遂げた。ネマニッチ朝のもとでプリズレンは主要な行政・商業都市へと発展し、その正教会の教会や修道院は、自らをビザンツ文明の継承者とみなしたセルビアの統治者たちの敬虔さと野心を体現していた。14世紀初頭にはセルビア領内でも特に重要な都市のひとつとなり、その市場にはドゥブロヴニクやヴェネツィア、そしてレバント各地から商人たちが集まり、周辺の山々で採掘された貴金属の取引がおこなわれていた。"
 belgrad_desc: "サヴァ川とドナウ川の合流点に位置し、中央ヨーロッパからバルカン半島へと続く大街道が通るこの地において、ベオグラードは古代より要塞化された玄関口であり、当時ローマ人はこの地を「シンギドゥヌム」と呼び、ドナウ川の国境部を守るため軍団を駐屯させていた。中世において、この都市はブルガリア人、ビザンツ人、ハンガリー人のあいだで支配が移り変わり、河川の合流点を見下ろす丘の上の要塞は、バルカン半島で特に激しく争われる拠点のひとつとなった。14世紀初頭には、ハンガリー王国と台頭しつつあったセルビア国家との争いにおいて、この都市は重要な争奪対象となり、その城壁は西方教会と東方正教会の世界を分かつ川を見守っていた。"
