l_japanese:
 stockholm_desc: "この街は1252年、メーラレン湖とバルト海が接する戦略的な立地に、ビルイェル・ヤールによって建設された。これによりストックホルムは、メーラレン湖へのアクセスを支配する要塞となると同時に、スウェーデン内陸部とハンザ同盟およびバルト海の交易網を結ぶ交易拠点となった。"
 paris_desc: "セーヌ川のほとりで、パリは小さな集落からフランスの至宝へと発展した。大聖堂、市場、学校を擁するパリは、ヨーロッパ有数の権力と文化の中心地となったのだ。"
 london_desc: "テムズ川に面したロンドンは、ローマ時代のロンディニウムからイングランド随一の都市へと発展した。繁栄する貿易と王宮によって、この街は王国の政治と経済の中心地となったのだ。"
 rome_desc: "テベレ川沿いの永遠の都ローマは、大陸にまたがる帝国を支配した。ローマ帝国が崩壊したあとも、ローマは教皇庁の本拠地、信仰と権威の標として存続した。"
 jerusalem_desc: "信仰と闘争が交錯する土地エルサレムは、ユダヤ教徒、キリスト教徒、イスラム教徒の崇敬の対象となっている。この地の神聖にして激動の歴史は、絶えることのない巡礼者と征服者により刻まれてきた。"
 alexandria_desc: "かつて地中海の標だったアレクサンドリアは、貿易と学問の交差点として繁栄した。その灯台と図書館は、かつてこの都市が文化と帝国の融合した地であることを告げていた。"
 constantinople_desc: "アヤ・ソフィアを戴き、強大な城壁に囲まれたコンスタンティノープルは、東ローマ帝国の中心として君臨した。1000年ものあいだ、その富と壮大さは世界の羨望の的だった。"
 sitges_desc: "中世には、現在市庁舎が建っている丘の上に城が築かれていた。その最初の所有者はバルセロナの大司教区だったが、12世紀にはその名に由来する一族の所有となった。"
 valladolid_desc: "11世紀末、ペドロ・アンスーレス伯爵とエイロ・アルフォンソ伯爵によってピスエルガ川に架かる橋の近くに建設されたバリャドリッドは、北部メセタの中心に位置する商業都市として発展した。14世紀にはブルゴスと並んでこの地方で最も重要な都市となり、女王マリア・デ・モリーナ、そして彼女の孫アルフォンソ11世の治世のあいだ、主要な行政の中心地となった。"
 penafiel_desc: "ペニャフィエルは「#italic Penna Fidelis#!（忠実な丘）」ともいい、10世紀にドウロ川流域の中流部の戦略的な要地である丘の上に築かれ、コルドバ・カリフ国に対する国境紛争の中心地となった。カスティーリャのサンチョ・ガルシア伯爵は、1013年ごろにこの地を堅固な要塞と化し、「フエロ」を与えた。その後ワイン産業が盛んになり、有力なドン・フアン・マヌエルの家系が支配する豊かな街へと発展していった。"
 toro_desc: "トロは10世紀にドウロ川流域の国境の守りを固めるために、レオン王がコルドバ・カリフ国との戦いで築いた街である。その戦略的な立地と豊かな農地とブドウ畑により、その後重要な街に発展した。"
 thessaloniki_desc: "コンスタンティノープルに次ぐビザンツ帝国第二の都市とされてきたテッサロニキの富と名声は、商業における戦略的な位置によって生み出された。その活気あふれる港は、イタリアとローマの中心地にまたがって貴重な物資を運び、東西をつなぐ重要な架け橋となっている。"
 malmo_desc: "マルメは、バルト海と北海を結ぶエーレスンド海峡の要衝となる重要な拠点である。要塞化された城壁と警戒を怠らない守備隊がマルメを権力の中心地に押し上げ、この都市は戦略と野心によって形作られていった。"
 bilbao_desc: "1300年、ビスカヤ領主ディエゴ・ロペス・デ・アロにより正式に設立されたこの街は、すぐに北スペインの重要な拠点となった。ネルビオン川河口の狭い谷間に位置する城壁に囲まれた集落は、強力な造船業を発展させ、貴重なカスティーリャ産メリノ種の羊毛や地元の良質の鉄鉱石をイギリスやフランドルの港に輸出する主要港となった。"
 radom_desc: "ピャスト朝最後の王、カジミェシュ3世大王よって拡張されたこの都市は、中世後期からルネサンス期を通じて重要な政治的拠点でありつづけた。1401年にはヴィリニュス・ラドム合同が調印され、1505年には王城での議会で「ニヒル・ノヴィ」の法令が承認された。"
 krakow_desc: "ヴァヴェルの丘の小村から始まったこの地は、965年に初めて、その名が当時の注目すべき商業の中心地として記された。1038年にはピャスト朝の君主の居城となり、その後ポーランド王国の行政、経済、文化の中心地となった。"
 megara_desc: "古代に築かれて以来人々が暮らしてきたメガラは、ニソスやビザスといった伝説的な王が治めた。この都市はギリシャ半島の重要な権力の要地となり、その海軍力と盛んな貿易で名を馳せた。入植者たちは地中海全域にビュザンティオン、ケルソネソス、セリヌスなどの重要な入植地を築いた。しかし、時が経つにつれてメガラは次第に色褪せていき、やがてはかつての隆盛の痕跡を残すだけの土地となった。"
 grojec_desc: "12世紀までは、この地方の城主とポズナン大司教座の所在地だったが、隣接するチェルスクに押され、次第にその重要性を失っていった。"
 gdansk_desc: "997年に初めて記録にその名が登場したグダニスクは、バルト海沿岸に存在した集落から生まれた。主要な造船と貿易港となり、東ヨーロッパで最も裕福で影響力のある都市のひとつとしての地位を確固たるものにした。"
 athens_desc: "古代ギリシャの文化の中心地とされたアテネは、当時最も強大な都市国家のひとつに成長した。スパルタ、テーベなどの古代国家と対立しながらも、徐々にエーゲ海を支配する海洋国家へと成長していった。その後、マケドニア帝国やローマ帝国、ビザンツ帝国に征服され、大きく衰退し、1204年以降は主たる十字軍国家の一角となった。"
 wieliczka_desc: "ヴィエリチカの街は1290年、ポーランド王プシェミスウ2世によって岩塩坑の採掘のために築かれた。主要な鉱山都市として多くの特権が与えられ、当地の塩鉱山はすぐに有名になった。ヴィエリチカ岩塩坑とその姉妹坑であるボフニャ岩塩坑は、鉱山会社#italic Żupy Krakowskie#!（ズピー・クラコウスキー）の一部となった。正式な文書ではこの街は「#italic Wielka Sól#!（ヴィエルカ・ソル）」、つまり「大いなる塩」と記されている。"
 leksand_desc: "シリヤン湖の南岸にあるこの村には数千年前から人が住んでおり、その教会は12世紀初頭に建てられた。この村のルター派初の牧師は、ヨハンの祖先であることで有名である。"
 leipzig_desc: "ライプツィヒは1165年、インペリイ街道（#italic Via Imperii#!）とレギア街道（#italic Via Regia#!）の交差点に設立され、裕福な貿易の中心地として発展した。その後、帝国から重要な特権を与えられたライプツィヒは、毛皮貿易と発展する書籍産業の重要な中心地となった。"
 augsburg_desc: "かつてはトラヤヌス帝の時代に「#italic Augusta Videlicum#!（アウグスタ・ヴィデリカム）」として知られた帝国自由都市アウクスブルクは、神聖ローマ帝国で最も古い都市のひとつである。中世初期、アウクスブルクは、955年にハンガリーの侵攻に対する防衛に成功したことで重要性を増した。1276年、アウクスブルクはルドルフ1世から自由帝国都市の権利を得たことでさらに重要性を増し、繁栄への道が拓かれた。"
 warsaw_desc: "マゾフシェの小さな漁師町として誕生したワルシャワは、1596年にジグムント3世によって首都がクラクフから移されてからその名を知られるようになった。それ以来この街は発展を続け、18世紀にはポーランド最大の都市となった。同世紀には、ポーランドの建築や職人の技術へ貢献する大規模な発展が見られた。"
 tunis_desc: "紀元前814年、伝説の女王ディードーによってカルタゴとして最初に建設され、同名のポエニ国家の首都となったが、3度の大きな流血を伴う戦争のすえにローマ人に破壊され、のちに再建される。現在のチュニスは、698年にアラブ人によってこの古代の廃墟の郊外に建設された。12世紀のムワッヒド朝の征服によりチュニスは地域の首都に昇格し、その地位はハフス朝の治世下でさらに強化された。"
 heidelberg_desc: "12世紀後半、ハイデルベルクはライン宮中伯の居城となり、名高い城が築かれた。ハイデルベルクはドイツ初の大学が置かれたことで知られ、それゆえに古くから学問の中心地だった。プファルツはやがてプロテスタント同盟の指導者となり、この地も改革と寛容の中心地となった。その後、ハイデルベルク城とその象徴的な外観が多くの詩人を惹きつけたことで、この都市はロマン主義の象徴となり、「ロマン主義の都市」と呼ばれるようになった。"
 aviles_desc: "その起源を10世紀にまでさかのぼるアビレスは、港としての戦略的重要性から河口沿いに発展してきた街である。近くのガウソン城では、アストゥリアス王アルフォンソ3世が金と宝石で覆われた勝利の十字架の製作を命じ、現在では王国全体のシンボルとなっている。11世紀以降、アビレスは王に特権を授けられた街となり、海上貿易と塩の貯蔵・流通で知られるようになった。"
 pingjin_desc: "道教寺院の晋祠がある太原は、紀元前5世紀以来、山西省および中国北部で最も重要な都のひとつ。979年、宋の皇帝太宗は北漢征伐の際、古城だった晋陽を水攻めにして破壊するよう命じ、「平晋」と改名した。この災厄から都が復興するには長い時間を要した。"
 dunstable_desc: "ローマの都市から修道院の街へ。ヘンリー1世の居城（1109年）、女王エレノアの十字架（1290年）、ヘンリー8世の離婚（1533年）、クロムウェルの募兵地（1642年）で有名。"
 paderborn_desc: "800年ごろに設立された司教区で、カール大帝と教皇レオ3世が初めて会談した地である。三十年戦争で16回包囲され、1646年にスウェーデン軍により破壊される。"
 porto_desc: "「#italic Cidade Invicta#!（不敗の都）」と呼ばれたこの都市は、ポルトガルの名の由来となり、ドウロのポートワインを広く国外に知らしめた。"
 jiaxing_desc: "嘉興は呉と越の境界となる地域である。「嘉」は美しさとめでたいことを意味し、「興」は隆盛と繁栄を表している。"
 torgau_desc: "1452年、選帝侯フリードリヒ2世はトルガウに最初の熊飼育場を設置し、これは1624年まで着実に拡張されていった。ここには最大39頭の熊を飼育することができた。"
 changsha_desc: "長沙の中心街は創設以来、2000年もの時を越えて変わることなく残っている。"
 ningxiang_desc: "ここでは殷王朝（3000年前の王朝）の最も大きな青銅器、「尊（酒器）」が発掘された。"
 wurzburg_desc: "ヴュルツブルクはフランケン地方の拠点として栄え、741年に司教座が置かれた。中世初期には要塞とマイン川の交易路を中心に栄えた。"
 hanover_desc: "ハノーファーは中世の集落から神聖ローマ帝国の重要都市へと発展し、ヴェルフ家によって統治され、貿易、権力、文化の中心地として繁栄した。"
 osnabruck_desc: "オスナブリュックは中世の神聖ローマ帝国の交易拠点で、司教座都市として、またヴェストファーレン条約締結の地として名を知られた。"
 glasgow_desc: "グレスカ（グラスゴー）は、中世の司教区として設立された都市である。大聖堂を中心に栄えて自由都市の地位を獲得し、スコットランドの教育を支えた大学も設立された。"
 neva_desc: "かつてヴァリャーグとギリシャの交易路の一部だったネヴァ川の湿地帯は、1703年にサンクトペテルブルクとなり、200年以上にわたってロシアの首都となった。"
 dubno_desc: "ドゥブノは1100年に初めて着目されるようになり、見本市と、1492年の城で著名なヴォルィーニ貿易の拠点へと成長した。のちにゴーゴリの『タラス・ブーリバ』にも登場する。"
 baden_desc: "ローマ人によって設立され、当初は「#italic Civitas Aurelia Aquensis#!（シヴィタス・アウレリア・アクエンシス）」として知られていたが、中世初期にバーデン辺境伯にちなんで「バーデン＝バーデン」と呼ばれるようになった。"
 erbach_desc: "18世紀後半、エアバッハ伯フランツ1世が古代美術への情熱を抱き、現地の象牙彫刻ギルドに資金を提供したことから、エアバッハは象牙彫刻の一大中心地へと発展した。"
 manhattan_desc: "原住民族のレナペ族に「マンハッタ」と呼ばれていたこの島は、オランダ人入植者が60ギルダー相当の交易品で購入した。彼らはここに砦を築き、ニューアムステルダムの権力の座とした。"
 doncaster_desc: "ローマ帝国時代のダヌム砦に端を発するドンカスターは、1337年までには放浪者や商人たちがロンドンと北部のあいだで商品を運ぶ、グレートノースロードに面したヨークシャーの交易都市となっていた。"
 kitchissippi_desc: "キチシビ川にちなんで名づけられたこの地は、イギリスの入植によって木材取引が拡大するまで、アニシナアベ族の人々が狩猟と交易を営んでいた。この地はのちに植民地行政の拠点となった。"
 saint_marceilin_desc: "11世紀に創設されたサン＝マルセランは、1337年から1340年のあいだドーファンの議会が置かれていた。1461年にルイ11世に献上された、表皮が膨らんだ柔らかいチーズで有名になった。"
 caerphilly_desc: "ヨーロッパで最高品質の石炭を産出するウェールズ渓谷は、18世紀後半には製鉄の中心地となった。"
 grenoble_desc: "グルノーブルはフランスアルプスに抱かれた小さくも戦略的な街で、ドーフィネの州都でもある。川と山に囲まれたこの街は城壁に守られ、北の丘陵にはバスティーユ要塞もそびえ立っている。街の生活は大聖堂と、商人や職人、周辺の渓谷から物資を運ぶ農民たちで賑わう、曲がりくねった通りを中心に営まれている。"
 kinsale_desc: "キンセールは、アイルランドの南海岸にある小さいながらも活気のある港町で、天然の入り組んだ港に守られている。漁業と沿岸貿易が人口の多くを支え、商人たちは塩漬けの魚、皮革、羊毛をワイン、塩、イベリアやフランスからの高級品と交換していた。狭い通りが岸壁の周りに集まっており、現地の船員や時折外国人商人たちが行き交っていた。キンセールの港は規模こそ小さいものの、アイルランドとヨーロッパ大陸を結ぶ玄関口として戦略的価値を有している。"
 stockton_desc: "ストックトンはティーズ川の北岸に位置するアングロ・サクソン時代の集落で、司教が自治区の農奴を解放したことで職人たちが移住してくるようになった。羊毛の輸出とワインの輸入で重要な市場となったが、人口が大きく増えるのは産業革命が起こってからのことだった。"
 kunow_desc: "クラクフ大司教区の重要な一部であり、1281年から小教区が存在する。その名前は、おそらくこの地域の森林に多く生息していたテン（貂、ポーランド語で「kuna」）に由来する。"
 lublin_desc: "ルブリンは12世紀と13世紀の変わり目に入植地として設立され、1317年に短身王ヴワディスワフ1世から商業特権を与えられた。その後の数世紀でルブリンは重要な交易拠点となり、16世紀には黄金時代を迎え、ルブリン合同と特に東方ととの広範な交易により繁栄した。"
 kendal_desc: "ケンダルは、1世紀にケント川岸にローマ時代の砦が築かれたのが始まりである。ノルマン人の支配下で発展したこの街は、1189年にリチャード1世から十字軍遠征の資金と引き換えに市場権を獲得したことで、さらなる繁栄を享受した。中世の羊毛貿易の中心地となり、その主要な城はヘンリー8世の妃キャサリン・パーが最も有名なパー家が所有していた。"
 cairo_desc: "969年、ファーティマ朝の将軍ジャウハル・アッ＝シィキッリーによって、古代ローマのバビロン要塞の傍らに築かれたアル＝カーヒラ（勝利の都）は、瞬く間にアレクサンドリアに代わってエジプトの中心地となった。アイユーブ朝とマムルーク朝のもとでイスラム世界最大の人口を擁する都市へと成長し、その市場とモスクは3つの大陸から商人、学者、巡礼者を引き寄せた。1258年にモンゴルがバグダードを破壊したとき、カイロはイスラム文明の誰もが認める首都として君臨していた。並外れた壮麗さを誇る都市であり、そのミナレットは黎明期から人類を支えてきた河谷の上にそびえ立っていた。"
 dadu_desc: "クビライ・カーンは1267年、太行（タイハン）山脈の南の平原に、元朝の都として大都（偉大なる首都の意）を築いた。そこは、かつて金王朝の中都があった場所であった。マルコ・ポーロはその壮大さに驚嘆し、広い大通り、広大な宮殿、そして中国全土の富であふれ返る倉庫群を備えた都市として描写している。モンゴルの勢力が衰退したときでさえ、草原地帯と中国内陸部を結ぶ北の玄関口というこの都市の立地は、帝国の中心地としての存続を確かなものにした。"
 venice_desc: "アドリア海のラグーンの干潟から隆盛したヴェネツィアは、必要に迫られた民の野心によって形作られていった。ロンバルド人の侵略から逃れてきた難民が最初にその諸島に身を寄せ、9世紀までに都市は選出されたドージェ（総督）によって統治される海洋共和国へと発展。その造船所と会計所を拠点に、ヴェネツィアの商人たちは黒海からレバントにまで及ぶ交易路を掌握し、ヴェネツィアをキリスト教世界一の富を誇る都市、そして地中海交易の誰もが認める支配者へと押し上げた。"
 moscow_desc: "1147年、ユーリー・ドルゴルーキーによってモスクワ川の岸辺に小さな木造の砦として築かれたモスクワは、長らく古いルーシの都市の影に隠れていた。しかし、モンゴルの支配下において、生存と拡大に長けるモスクワの諸侯たちはキプチャクのために貢納を集める一方で、静かに隣接する諸公国を吸収していった。北方の河川路の交差点というその立地は、着実な成長をもたらす商業的足がかりとなり、14世紀初頭までにその大公はルーシのほかのどの統治者よりも大きな権力を振るうようになった。"
 tenochtitlan_desc: "1325年頃、彼らの神ウィツィロポチトリが「サボテンに鷲が止まる島」を約束したという伝説に従い、メシカの人々はテスココ湖の沼沢地に覆われた島にテノチティトランを創建した。天然の要害であり、周囲の湖岸の豊かな資源を享受できるこの場所に建てられた若い入植地は、驚くべき速度で成長していった。その土手道、浮き庭、および戦士の伝統は、いつしかこの地をアメリカ大陸最大の都市、そして強大な帝国の中心地へと変貌させることになる。"
 delhi_desc: "ヤムナー川の西岸に位置するデリーは、古代より歴代王朝の権力の中枢を担ってきた。奴隷王朝が1206年にこの地でデリー・スルタン朝を樹立し、イルトゥトゥミシュやアラウディン・カルジのような統治者のもと、この都市は南アジアにおけるイスラムの主要首都へと発展した。その壮大なモスク、市場、要塞はイスラム世界全域から学者や商人を引き寄せ、亜大陸の大部分を統治する玄関口としてのデリーの地位を確固たるものにした。"
 prague_desc: "ヴルタヴァ川の湾曲部の高台に位置するプラハは、スラヴ人の渡河集落から中世ヨーロッパの偉大な主要都市のひとつへと発展した。プシェミスル朝がフラッチャニの岩だらけの切り立った高台に城と大聖堂を築き、その麓には活気ある商人街が根づいた。ボヘミア王の居城であり、東西ヨーロッパを結ぶ自然の交差点であったプラハは、ドイツ人やユダヤ人の商人、職人、学者を引き寄せ、14世紀初頭までにアルプス以北でも特に人口が多く、繁栄した都市のひとつとなった。"
 vienna_desc: "ローマ人がウィンドボナと呼んだこの地は、帝国の北方国境を守るべく、ドナウ川沿いに軍団の要塞が築かれた場所であった。民族大移動がローマの秩序を押し流した後、この地はバーベンベルク家の辺境伯の居城として再興し、彼らは同じ戦略的要地に自らの野心にふわさしい都市を築いた。1278年、ハプスブルク家がバーベンベルク家に取って代わると、ウィーンは世襲帝国の要となり、ドナウ川流域の交差点というその立地から、神聖ローマ帝国において戦略の面から特に渇望される都市のひとつへと変貌した。"
 baghdad_desc: "762年、アッバース朝のカリフ、アル＝マンスールによってチグリス川の西岸に築かれたバグダードは、当初から世界の中心となるように設計されていた。その伝説的な「円形都市」は、カリフの宮殿と壮大なモスクをその中心に配置し、外側に向かって放射状に市場と住宅が広がる構造となっていた。アッバース朝の権力の絶頂期には100万人以上の人々が暮らし、その「知恵の館（バイト・アル＝ヒクマ）」は、既知の世界の全域から翻訳、討論、新たな発見を目的とした学者を引き寄せた。1258年のモンゴルによる略奪はこの黄金時代を打ち砕いたが、都市は存続し、いまなおチグリス・ユーフラテス川流域の中心地における最大都市でありつづけている。"
 florence_desc: "トスカーナ地方の中心でアルノ川の両岸に広がるフィレンツェは、ローマの植民都市から、ヨーロッパの商業を再形成した商人や銀行家の都市へと成長した。バルディ家、ペルッツィ家、ストロッツィ家といった名門銀行家一族はその信用を諸王国へと広げ、彼らが鋳造したフローリン金貨は国際貿易の標準通貨となった。グエルフィ（ゲルフ、教皇派）とギベッリーニ（ギベリン、皇帝派）の争いに翻弄され、強力なギルドによって統治されていたフィレンツェは、熱烈な市民の誇りと並外れた富を併せ持ち、やがて世界中の羨望の的となる芸術的・知的開花の礎を築いた。"
 samarkand_desc: "中央アジアでも特に歴史の長い都市であるサマルカンドは、絹、香辛料、思想を運ぶ隊商が中国と地中海を行き交うシルクロード沿いに位置していた。サーマーン朝とカラハン朝のもと、学問と職人技の中心たるイスラムの主要な中心地として繁栄し、その職人たちが作る精巧な金属細工や紙は既知の世界全域で名声を博した。1220年、チンギス・カンの軍隊によって壊滅的な打撃を受けたものの、大交易路に位置するその立地が都市を再興させ、そのバザールや工房は再び世界の半分の商取引を引き寄せた。"
 novgorod_desc: "市民が誇りをもって「偉大なるわが主ノヴゴロド」と呼んだこの都市は、ヴォルホフ川沿いのヴァイキングの交易拠点から、北ヨーロッパで最も強力な商人共和国へと成長した。その選出された民会であるヴェーチェは、封建世界では滅多に聞かれない民主的な声をもって統治をおこない、ハンザ同盟の交易相手はノヴゴロドの毛皮、蜜蝋、琥珀をロンドンからリューベックにいたる市場へと運んだ。他のルーシの都市が1230年代のモンゴルによる破壊に屈した一方で、ノヴゴロドはその北方の立地ゆえに難を逃れ、ルーシ全土で最も豊かで独立した都市としての地位を保ちつづけた。"
 lisbon_desc: "テージョ川が大西洋と交わる天然の良港を抱えるリスボンは、フェニキア人の時代から船乗りや商人たちを庇護してきた。ローマ人はこの地をオリシポとして要塞化し、8世紀にはムーア人の統治者たちが、モスクや宮殿の立ち並ぶ繁栄した都市へと変貌させた。1147年、アルフォンソ1世が十字軍の助けを借りてこの地を攻略すると、リスボンは誕生したばかりのポルトガル王国の首都となり、大西洋の重要な港となった。西を向いたその深い港は、すでにその先に広がる未開の海を見据えていた。"
 sevilla_desc: "アンダルシアの肥沃な平原において、グアダルキビル川をまたぐように築かれたセビリアは、ムーア人支配下のスペインにおける珠玉の都市のひとつであった。ウマイヤ朝、そして後のアルモハド朝のもとで、セビリアは文化、科学、交易の中心地として繁栄し、川沿いにそびえる大モスクは、イベリア半島におけるイスラム文明の広がりを物語る証となった。1248年にカスティーリャ王フェルナンド3世によって奪還されたこの都市は、その後も国際的な街でありつづけ、キリスト教スペインで最も豊かな都市へと成長し、その河港はアンダルシアの富を世界へと送り出した。"
 hangzhou_desc: "全盛期には「キンサイ」、すなわち「仮の都」として知られた杭州は、1127年に北方が女真族の金朝に陥落した後、南宋王朝の都となった。13世紀後半にこの地を訪れたマルコ・ポーロは、運河や絹市場、あらゆる品物が取引される広大な広場に感嘆し、「世界で最も華やかな都市」と称した。1279年のモンゴルによる征服後も、大運河の起点という立地と、絹および磁器の交易における圧倒的な強さにより、中国屈指の商業都市として存続しつづけた。"
 bruges_desc: "中世の商業が最盛期を迎えたころ、ブルッヘは北ヨーロッパの主要市場として機能し、ヴェネツィアのガレー船、ハンザのコグ船、イベリア半島のキャラベル船がこぞって積み荷を卸していた。北海へと通じる潮流口に築かれたこの都市の織物会館や、世界初の取引所とされた交換所は、ここを北方の金融首都たらしめた。イングランド産の羊毛からレバント産の香辛料に至るまで、既知の世界の富がその運河と商館を通じて流れ込んだのだ。"
 cologne_desc: "西暦50年にローマ人によって「コロニア・クラウディア・アラ・アグリッピネンシウム」として創建されたケルンは、中世ドイツ最大の都市へと成長し、神聖ローマ帝国において特に強力な大司教区のひとつとなった。1248年に三賢者の聖遺物を安置するべく着工された壮麗なゴシック様式の大聖堂は、この都市の野心と信仰の象徴としてそびえ立った。帝国自由都市であり、ハンザ同盟の創設メンバーでもあったケルンは、重要なライン川交易路を支配し、北海と帝国の中心部を結ぶ玄関口としての役割を果たした。"
 bursa_desc: "ビテュニアのオリンポス山の麓に位置するブルサは、ビザンツ帝国の都市として繁栄していたが、10年間に及ぶ包囲戦のすえ、1326年にオスマン族の首長オルハンによって攻略された。オルハンはここをオスマン国家の最初の真の首都とし、モスクや隊商宿、そして何世紀にもわたってこの都市の特色を決定づけることになる屋根つきバザールを建設した。東方から来るシルクロード隊商の西の終着点であり、世界最高峰の絹織物の生産地でもあったブルサは、並外れた富を誇る都市へと成長し、後にオスマン帝国が花開くための種となった。"
 kyoto_desc: "794年、桓武天皇が朝廷をここに移し、「平安京」と名づけたことで、京都はその後何世紀にもわたって日本の文明の中心地となった。大通りが碁盤の目のように張りめぐらされ、貴族の邸宅や仏教寺院が立ち並ぶこの都市には、世界で最も洗練された宮廷文化が息づき、平安時代の詩歌、絵画、文学はここで生まれた。内戦や火災、そして武士の台頭によってその防壁は幾度となく揺さぶられたものの、この都市は天皇の在所として、また日本文化の魂として存続しつづけた。"
 timbuktu_desc: "サハラ砂漠の縁、ニジェール川の湾曲部に位置するトンブクトゥは、トゥアレグ族の季節的な野営地から、中世アフリカの大都市のひとつへと発展した。マリ帝国のもと、トンブクトゥはサハラ横断交易の要衝となり、北から塩を運ぶ隊商と、南から金や象牙を運ぶ隊商が出会う場所となった。そのモスクやマドラサは大陸全土からイスラム学者を引き寄せ、神学、数学、天文学に関する数万冊の写本が所蔵された図書館を有する学問の都となった。"
 barcelona_desc: "紀元前1世紀にローマの植民都市バルキノとして創設されたバルセロナは、カタルーニャ伯領の首都へと発展し、12世紀にはアラゴン王国の海洋経済の原動力となった。その商船隊と領事館はバレアレス諸島からシチリア、サルデーニャからギリシャの十字軍拠点に至るまで広がり、西地中海の圧倒的な海上勢力となった。大聖堂と古代ローマの防壁のもとに広がる斜面で、街は富と運命を海に求めた海上大国の商業で活気づいていた。"
 cordoba_desc: "全盛期のコルドバは西ヨーロッパ最大の都市であり、50万人の人口を擁し、石畳の通りや公衆浴場、キリスト教世界のいかなる施設をも凌駕する図書館を備えた都市であった。929年に自らをカリフと宣言したアブド・アッラフマーン3世のもと、この街はバグダードのアッバース朝や北方のカロリング朝に挑むカリフ国の首都となった。アヴェロエスやマイモニデスといった学者たちがその通りを歩き、大モスク「メスキータ」は、イベリア半島の地に根づいた非凡な文明の記念碑としてそびえ立った。1236年、カスティーリャ王フェルナンド3世によって都市が攻略されたことでこの時代は幕を閉じたが、その遺産は、この街が守り抜き広く世界へと伝えた知識のなかに生きつづけた。"
 damascus_desc: "はるか昔から人が住みつづけている都市であるダマスカスは、アンチレバノン山脈の麓にある肥沃なオアシスを支配し、その市場はバラダ川の水によって潤されていた。7世紀から8世紀にかけてウマイヤ朝の首都であったこの都市は、当時世界最大規模の帝国の中心に位置し、その大モスクはイスラム建築の傑作のひとつとしてそびえ立った。アッバース朝が権力をバグダードに移した後も、ダマスカスはレバント地方随一の商業・文化都市としての地位を維持し、バザールでは絹、優れた刀剣、そしてこの街の名産品である香り高い薔薇が取引された。"
 angkor_desc: "東南アジア本土の深い森のなかに、アンコールのクメール王たちは他に類を見ない都を築いた。12世紀初頭、スーリヤヴァルマン2世の治世下で建設が始まったアンコール・ワットの広大な寺院群は、ヴィシュヌ神に捧げられ、宇宙を地上に表現するものとして設計された。その堀は宇宙の海を、塔はメール山（須弥山）の峰々を表している。最盛期には、アンコール地域全体が貯水池と灌漑用水路からなる精巧な水利網によって支えられており、産業革命以前の世界のなかでも特に広大な都市複合体のひとつであった。"
 vijayanagar_desc: "1336年、トゥンガバドラ川の南岸にハリハラ・ラーヤとその弟ブッカが築いた「勝利の都」ヴィジャヤナガルは、勢力を拡大するデリー・スルタン朝に対するヒンドゥー文明の防壁として築かれた。トゥンガバドラ川と、巨大な花崗岩や岩だらけの峡谷からなる険しい地形に守られたこの新興の首都は、すでにデカン高原中央部の肥沃な平原を支配下に置いていた。この岩だらけの要塞から、2世紀以上にわたって存続する帝国が生まれ、その市場にはインド洋世界全域から商人や交易品が集まった。"
 naples_desc: "紀元前600年頃、その壮観な湾岸にギリシャの植民都市ネアポリスとして創設されたこの都市は、ローマ、ビザンツ、ノルマン、ホーエンシュタウフェンの支配を経て、1266年にアンジュー朝がナポリ王国の首都とした。アンジュー家の統治のもと、ナポリは中世ヨーロッパの主要な王宮のひとつとなり、イタリアで最も人口の多い都市へと成長し、その港はメッツォジョールノ（イタリア南部）の富を世界へと送り出す要所となった。ナポリの宮廷は学者、芸術家、神学者たちを惹きつけ、そのなかにはこの地で教鞭を執り、没したトマス・アクィナスも含まれていた。こうしてナポリは王朝の権力の座であると同時に、知的活動の中心地ともなった。"
 milano_desc: "ポー平原の中心に位置するミラノは、もともとケルト人の集落として始まったのだが、ローマ人がここを「メディオラヌム」と名づけたことでその起源は一掃され、一時は西ローマ帝国の事実上の首都となった。民族大移動によってその栄華が衰えた後、この都市は自由都市として復活し、1176年のレニャーノの戦いでフリードリヒ・バルバロッサと帝国軍を撃退した。13世紀後半にシニョーリの権力を掌握したヴィスコンティ家のもと、ミラノはロンバルディア周辺の都市を次々と吸収する領国の首府となり、北イタリアにおける支配的な勢力となった。"
 genoa_desc: "リグリア・アペニン山脈の弧状の地形に守られたジェノヴァは、その偉大なる街のすべてを海の上に築き上げた。その商人や提督たちは、黒海から大西洋にまで及ぶ交易拠点と植民地からなる海上帝国を切り拓き、その艦隊は地中海貿易の覇権をめぐり、ヴェネツィアの艦隊と幾度も激突した。ドーリア家、グリマルディ家、スピノラ家といった名門一族の飽くなき野心に駆り立てられ、この共和国は「ラ・スペルバ」（誇り高き都市）という異名を獲得し、後背地をほとんどもたない都市であっても、キリスト教世界においてとりわけ豊かな強国のひとつとなりうることを証明した。"
 bologna_desc: "エトルリア時代の都市「フェルシナ」、後にローマ時代の植民都市「ボノニア」として創建されたボローニャは、アペニン山脈の麓、エミリア街道とポー川流域へと続く北への街道が交わる地点に位置している。この都市は何よりも、1088年に設立された世界最古の大学で知られており、その講堂や中世の双塔の陰には、ヨーロッパ各地から法学、医学、哲学を学ぶ学生たちが集まった。商人たちの富、司教たちの権威、そしてコムーネの独立性により、ボローニャは中世イタリアの政治において極めて争奪の激しい地であった。"
 palermo_desc: "シチリア島北岸のふたつの岬に抱かれるような位置にあるパレルモは、フェニキアの商人によって築かれ、カルタゴ、次いでビザンツ帝国の支配下で大都市へと発展したのち、9世紀のアラブの征服によって、モスク、庭園、バザールが立ち並ぶイスラムの大都市へと変貌を遂げた。1072年にアラブ人の手からこの地を奪還したノルマン王たちは、この街の国際色豊かな遺産を基盤として驚くべき成果を挙げ、アラブ、ビザンツ、ラテン各々の伝統を融合させ、キリスト教世界において他に類を見ない文明を誇示するきらびやかな王室礼拝堂や宮殿を作り上げた。ノルマン・シチリア王国の首都、そして後にホーエンシュタウフェン帝国の首都として、パレルモは中世世界でも特に教養豊かで強力な王宮となった。"
 verona_desc: "アルプスの南端、アディジェ川を挟むように築かれたヴェローナは、古代から交通の要所であり、世界最大級かつ極めて保存状態のよいローマ時代の円形劇場が、かつて軍団や商人が同じように行き交った通りにいまなおそびえ立っている。13世紀後半に権力を掌握したスカラ家のもと、ヴェローナは北イタリア屈指の強力なシニョーリア（僭主国）となり、その領主たちはヴェネト地方を支配し、その勢力をアドリア海へと拡大していった。スカラ家の宮廷に庇護を求めた人々のなかにはダンテ・アリギエーリもおり、彼はフィレンツェからの長きにわたる亡命生活のなかで、カングランデ・デッラ・スカラの後援のもと『神曲』を完成させた。"
 siena_desc: "トスカーナ地方の中心部にある3つの丘の上に築かれたシエナは、中世イタリアの列強のひとつであり、その富は銀行業と羊毛交易に支えられ、シエナの商人一族は王や教皇さえも債務者とするほどであった。わずか50キロメートルほど北に位置するフィレンツェとの激しい対立は、何世代にもわたり両都市の歴史を形作り、中心部の広大な広場「カンポ」は、イタリアで最も誇り高きコムーネのひとつであるシエナの市民生活と政治劇の舞台として機能した。ドゥッチョ・ディ・ブオニンセーニャやロレンツェッティ兄弟の絵画は、シエナをヨーロッパにおけるゴシック芸術の主要な中心地へと押し上げた。"
 pisa_desc: "アルノ川の河口に位置するピサは、中世地中海で有数の海上帝国を築き上げ、その艦隊は1063年にパレルモを襲撃し、ティレニア海でサラセンの海賊を撃破し、サルデーニャからアンティオキアに至るまで交易植民地を確立した。この商業によって富を蓄えたピサの人々は、カンポ・デイ・ミラーコリ（奇跡の広場）に大聖堂、洗礼堂、鐘楼からなる卓抜した建築群を建設。これらは12世紀の全盛期において、その富と自信にはかぎりがないかのように思われた、当時のこの都市を象徴する記念碑である。1284年のメロリアの海戦でジェノヴァに壊滅的な敗北を喫したことでピサの海軍力は失われたものの、都市とその見事な記念碑は存続した。"
 padova_desc: "トロイアの英雄アンテノールによって建都されたという伝説があり、ローマ領イタリアでもとりわけ豊かな都市として栄えたパドヴァは、中世にはヴェネト地方の中心に位置する繁栄したコムーネへと成長した。1222年にボローニャから離れた学者たちが設立した同都市の大学は、瞬く間に法学と医学におけるヨーロッパ屈指の中心地となり、大陸各地から学生を集めた。14世紀初頭には、絵画の巨匠ジョットがアレーナ礼拝堂（スクロヴェーニ礼拝堂）内の絵を手掛け、西洋美術史における金字塔を打ち立てる一方、都市自体もカッラーラ家による統治のもと、学問と野心の中心地として栄えた。"
 ferrara_desc: "ポー川デルタの湿地帯の端に位置するフェラーラは、ささやかな川渡しの場から発展し、13世紀にこの地の領主として地位を確立したエステ家の野心によって形作られていった。彼らの長きにわたる庇護のもと、この都市は騎士道文化と洗練された宮廷生活の中心地となり、領主たちは詩人を呼び寄せたり、馬上槍大会や学問的な討論を主催したりする一方で、ミラノ、ヴェネツィア、教皇領との対立を巧みに乗り切っていた。フェラーラの特徴を形作った広くてまっすぐな通りと、威風堂々としたエステ城は、城壁や兵士と同じくらい秩序と優雅さが重要視されたこの都市の象徴であった。"
 parma_desc: "紀元前183年、エミリア街道沿いにローマ人が築いたパルマは、ロンバルディア平原の主要都市のひとつとなった。ミラノとボローニャを結ぶ大街道上に位置し、周囲には肥沃な農地が広がっていたことで、この街はつねに繁栄を続け、争奪の対象となっていた。自由都市のパルマは、フリードリヒ・バルバロッサに対抗するロンバルディア同盟のなかでも特に活発なメンバーであり、教皇派と皇帝派の一族による長年の激しい派閥闘争ののち、歴代のシニョーリ（領主）の手を渡り歩いた。12世紀のロマネスク様式で建てられた大聖堂と洗礼堂は、コムーネ時代の政治的混乱を生き抜いた市民の信仰心と富を象徴するものである。"
 mantova_desc: "緩やかに流れるミンチョ川によって形成された湖が三方を囲むマントヴァは、北イタリアのなかでもとりわけ防衛に適した地形を有しており、青銅器時代から人が定住してきた。ローマ人はこの街を、ローマで最も偉大な詩人ウェルギリウスの生誕地として称え、この都市の運命は長いあいだ統治者たちの芸術的・文学的な野心によって形作られてきた。14世紀初頭には、ゴンザーガ家がこの地で台頭し、その長きにわたる後援のもと、マントヴァはイタリア内で特に洗練され、風雅を極めた宮廷の地へと成長していった。"
 lucca_desc: "古代ローマ時代の街路網に囲まれ、絹の産地であるガルファニャーナの豊かな田園地帯に抱かれたルッカは、中世イタリアでとりわけ裕福な都市のひとつであった。その商人たちはヨーロッパ全域へと進出し、彼らの銀行や絹交易により、ルッカ産を意味する「ルッケーゼ」の名はパリ、ロンドン、ブルッヘの市場において上質な織物の代名詞となった。そうしてこの都市は、トスカーナ地方でも屈指の美しさを誇るロマネスク様式の教会群を築き上げるのに十分な富を蓄えるに至ったのだ。ピサやフィレンツェからの脅威に幾度もさらされながらも、ルッカは驚異的な粘り強さで独立を守り抜き、その堅固な防壁と熱烈な市民の誇りによって、対立都市が次々と領主支配に屈した後も、長く自由を保ちつづけた。"
 messina_desc: "シチリア島とイタリア本土を隔てる狭い海峡を支配するメッシーナは、鎌のように曲がった湾の形からここを「ザンクレ」と呼んだギリシャの入植者たちによって建設され、その立地から当初より地中海有数の戦略的要港となった。1061年、ノルマン人がシチリア征服を開始したのもこのメッシーナからであり、その港を経て、アンジュー家、ホーエンシュタウフェン家、そして聖地を目指す十字軍など、後に続くあらゆる時代の軍勢が東西を行き交った。度重なる地震や政治的動乱に見舞われながらも、類まれな天然の良港のおかげで街はつねに復興を果たし、商業と紛争を等しく引き寄せつづけた。"
 brescia_desc: "アルプス山脈の麓、プレアルプスがロンバルディア平原へと下っていく地点に位置するブレシアは、中世イタリアを代表する工業都市のひとつであり、その鍛冶場が作り出す武器と鎧の品質は名高く、ヨーロッパ全土で取引された。自由都市であるブレシアはロンバルディア同盟のなかでも特に勇ましく、市民による帝国軍への抵抗は、北イタリアのコムーネ伝統の礎となった。ミラノとヴェネツィアの巨大な野心に挟まれたブレシアは、アルプス山脈の峠口という戦略的立地と、職人たちの優れた技量ゆえに、どちらの強国も容易には手放そうとしない重要な拠点となった。"
 cremona_desc: "紀元前218年、ローマ人によってポー川南岸に辺境の植民都市として築かれたクレモナは、ロンバルディア平原の主要都市のひとつへと成長し、川に面した立地によって東西を結ぶ陸路・水路交易の天然の要衝となった。皇帝と教皇のあいだの激しい争いにおいて、この都市は皇帝派への忠誠の代名詞となり、その忠誠ゆえに苦難を味わうこともあったものの、帝国からは格別の寵愛を受け、莫大な富を手にした。イタリアで最も高い中世の鐘楼であるトッラッツォと、競い合うように建てられた有力一族の塔の数々が形作る都市の全景は、権力の行使も誇示も等しく激烈だったこの街の、競争心に満ちた市民の誇りを象徴していた。"
 pavia_desc: "ローマ崩壊後2世紀にわたり、パヴィアはイタリアのランゴバルド王国の首都を担った。この都市はその戦士たる王たちの本拠地であり、彼らの「鉄の王冠」の守護者でもあった。カロリング朝の皇帝たちもここをイタリアにおける居城として維持し、ランゴバルド王国がフランク帝国に吸収された後も、パヴィアは王都および戴冠の地としての威信を長く保ちつづけた。イタリアでも特に歴史の長いパヴィア大学は、9世紀にはすでに繁栄しており、ポー川流域の西側の要衝であるティチーノ川沿いの立地は、イタリア北部の支配を目論むあらゆる勢力がパヴィアを争奪の対象としつづける要因となった。"
 perugia_desc: "テベレ川上流の谷を見下ろす丘の上に位置するペルージャは、古代エトルリアの12都市のひとつであり、後にローマの自治都市となって繁栄し、中世には中部イタリアでとりわけ強大かつ動乱に満ちた独立コムーネのひとつとして台頭した。壮麗なパラッツォ・デイ・プリオーリ（プリオリ宮殿）や、ニコラ・ピサーノとその息子ジョヴァンニが彫刻を手掛け1278年に完成させたフォンタナ・マッジョーレ（マッジョーレの泉）は、トスカーナのどの都市にも引けを取らない市民の誇りと芸術的野心を体現していた。1308年にこの地に設立された大学は、自らの軍事的・政治的権力に匹敵する学問的名声を築こうとするペルージャの決意の表れであった。"
 ancona_desc: "シラクサからの亡命者たちがアドリア海沿岸にギリシャ植民都市として築いたアンコーナの名は、ギリシャ語の「肘」に由来しており、北からの風波から港を守るように湾曲した岬を形容している。中世には、アドリア海中部の最重要港へと発展し、その商人たちはビザンツ帝国のコンスタンティノープルやレバントの港と交易をおこなった。教皇や皇帝が何度もこの街を服従させようと試みたが、アンコーナは不屈の精神でコムーネの独立を維持。その港と艦隊は、何世紀にもわたり自由を固く守り抜くための礎であった。"
 aquila_desc: "中世イタリアの主要都市のなかでも特に新しいラクイラは、1254年頃、アブルッツォ高地の100近くの村々が合併し誕生した。その際、各村は新たな都市に教会、泉、地区、そして鐘をひとつずつ提供したと伝えられている。山岳王国の中心、アペニン山脈の高地に位置するこの都市は、驚くべき速度でアブルッツォの首府へと成長し、その立地と防壁は、対立する領主たちや遠く離れたナポリ宮廷の野心から都市を守り抜いた。100近い共同体がそれぞれ市民としてのアイデンティティを分かち合い維持するという、その特異な建都の経緯は、ラクイラに独特の複雑さと、イタリア南部のどの都市とも異なる熱烈な郷土愛をもたらした。"
 ravenna_desc: "短くも非凡な1世紀のあいだ、ラヴェンナは西ローマ帝国最後の首都としての役割を果たした。476年にローマが滅亡した際も、オドアケルの宮廷、次いで東ゴート王テオドリックの宮廷がローマ的統治の形式と伝統を維持したのはここであった。6世紀のビザンツ帝国による再征服により、ラヴェンナはコンスタンティノープルの西の拠点、すなわちラヴェンナ総督府の所在地となり、このギリシャ帝国統治の時代には、地元の職人たちが教会や霊廟を埋め尽くす驚異的なモザイク連作を生み出した。ボローニャやポー川流域の成長著しい都市群の陰に長らく隠れてはいたものの、ラヴェンナはその類まれな芸術のなかに、ラテン西方世界のほかのどこにも見られない帝国の栄光の記憶を留めつづけた。"
 salerno_desc: "アマルフィ海岸の海と山々に囲まれた、波静かな湾内に位置するサレルノは、1076年にこの地を制圧したノルマン人の征服者ロベルト・グイスカルドによって首都に選ばれ、王宮がパレルモへ移るまで、南イタリアにおけるノルマン勢力の最初の拠点として機能した。この都市で最も有名なのは、ヨーロッパ最古の医学学校であるサレルノ医学校で、同校は9世紀以降、この国際色豊かな南部の海岸に集結したギリシャ、アラブ、ラテン各派の医学的伝統を融合させることで繁栄した。サレルノで学んだ医師たちは大陸全土に広がり、同校の解剖学、外科学、薬草学に関する文献は、中世世界全体の医術を形作った。"
 syracuse_desc: "紀元前734年、コリントスの入植者たちが巨大な港の口にある小さな島に設立したシラクサは、西地中海で最も強大なギリシャ都市へと成長し、その力は紀元前415年から413年にかけてアテネ遠征軍を壊滅的な敗北に追い込んだことで裏付けられた。アルキメデスが伝説的な兵器を考案し、それを使い都市がローマ軍の侵攻を食い止めたのもこの地であり、カルタゴ、ローマ、ビザンツ、アラブ、ノルマンといった歴代の征服者たちが、放置するにはあまりに価値ある港だと認めたのもまたこの地であった。パレルモの陰に隠れて久しいものの、シラクサはシチリア南東部最大の都市として存続し、その古代の港と、切り石を敷き詰めた通りは、古代地中海世界全体を形作った輝かしい文明の証としていまなお残っている。"
 trebizond_desc: "ポントス山脈と黒海のあいだに位置する狭い海岸段丘の上に築かれたトレビゾンドは、中世世界においてとりわけ劇的な立地を誇る都市のひとつであった。1204年、コンスタンティノープルが第4回十字軍によって陥落した際、コムネノス朝の成員たちはここに逃れてトレビゾンド帝国を建国。この帝国はラテン帝国が崩壊した後も、独立したギリシャ系キリスト教国家として長く存続した。黒海交易路の東端と、アルメニアやペルシアへと通じる山道を支配下に置いたこの都市は、ジェノヴァの商人たちを惹きつけ、シルクロードの西の終着点として繁栄し、その市場には中央アジアやさらに遠方からの交易品が集まった。"
 smyrna_desc: "エーゲ海沿岸の古代都市のひとつであるスミルナは、ホメロスの生誕地を自称する都市のひとつであり、後に『ヨハネの黙示録』に登場する小アジアの7つの教会のひとつとなった。ビザンツ帝国の支配下では、アナトリアの豊かな内陸部とエーゲ海の商業を結ぶ主要な港湾として機能し、その港にはヴェネツィアやジェノヴァの商人たちが頻繁に訪れ、埠頭沿いに交易拠点を築いた。13世紀末から14世紀初頭にかけ、この都市はビザンツ、ジェノヴァ、トルコ系のアイドゥン朝のあいだで次々と支配が移り変わり、その類まれな立地ゆえに、エーゲ海地域のいかなる勢力も無視できない重要な拠点となった。"
 konya_desc: "中央アナトリアの高原に位置するコンヤは、12世紀から13世紀の大部分にわたりアナトリアを支配したトルコ系国家、ルーム・セルジューク朝の首都を担った。セルジューク朝のスルタンの統治下で、この都市はイスラム美術、建築、学問の中心地として繁栄し、タイル張りの霊廟やマドラサ（イスラム学校）は、古代の高原都市を中世イスラム世界における偉大な文化の中心地のひとつへと変貌させた。神秘主義詩人ジャラール・ウッディーン・ルーミーが定住し、その生涯を閉じたのもこの地であり、彼の弟子たちが創設した「メヴレヴィー教団」（旋舞教団）の音楽と儀式は、この都市の名をアナトリア高原のはるか彼方へと広めた。"
 sivas_desc: "アナトリアとペルシアを結ぶ主要な交易路が交差する高地に位置するスィヴァスは、中世近東における交通の要衝のひとつであった。ルーム・セルジューク朝のもと、並外れた建築的野心を有する主要な州都へと発展し、13世紀に建てられた偉大なマドラサ群——なかでも名高いギョク・メドレセとチフテ・ミナレリ——は、アナトリアにおけるセルジューク朝石造建築の最高傑作に数えられている。モンゴルによる征服後、この都市はイルハン朝のアナトリア諸州における重要な行政中心地として機能し、その市場や隊商宿は、中央アジアと地中海のあいだを往来する長距離交易の要所となった。"
 kayseri_desc: "ローマ人には「カエサレア・マザカ」として知られ、古代カッパドキアの主要都市であったカイセリは、幾世紀にもわたり、アナトリア高原と、アルメニアやメソポタミアへと続く東方の交易路を結ぶ玄関口としての役割を果たした。小アジアにおける最初期のキリスト教中心地のひとつであり、大バシレイオスの故郷でもあった。彼の神学の著作と修道院規則は東方教会を形作り、今日に至るまでキリスト教の信仰の実践に影響を与えつづけている。セルジューク朝およびその後継者たちのもとで、この都市はモスク、マドラサ、隊商宿によって豊かになり、アナトリア交易の十字路という不変の地位ゆえに、それぞれの支配者がその価値を認め、ビザンツ、ダニシュメンド朝、セルジューク朝、そしてモンゴルの手へと次々に渡っていった。"
 izmit_desc: "紀元前3世紀にビテュニア王ニコメデス1世が築き、ローマ人には「ニコメディア」として知られていたこの都市は、ディオクレティアヌスのもとでローマ帝国の東の首都として機能した。同帝はここを自身の居城とし、東方諸州の行政の中心地としたのである。303年、ディオクレティアヌスはニコメディアを拠点としてキリスト教徒に対する「大迫害」を開始し、宮殿から見える場所にあった主要な教会を破壊し、信仰に対するローマ最後にして最も過酷な弾圧を主導した。対岸にコンスタンティノープルが創建されると、この都市は次第にその偉大な隣都の陰に隠れるようになったが、ビザンツ帝国の全世紀を通じて、主要な港および司教座所在地としての重要性を維持した。"
 ankara_desc: "アナトリア高原の中心にある岩だらけの丘の上に位置するアンカラは、ローマ人がここを属州ガラティアの首府とするはるか以前から、古代ガラティアの都市として存在していた。コンスタンティノープル、黒海、レバント、ペルシアからの街道がすべて交わるその戦略的立地は、この都市に永続的な軍事的・商業的意義をもたらし、市民がアウグストゥスを称えて建立した大神殿には、ローマ史において現存する最も重要な記録のひとつに数えられる碑文が保存されている。その後、ダニシュメンド朝、ルーム・セルジューク朝、そしてモンゴルの統治下でも、アンカラはアナトリア高原の要衝でありつづけた。この都市を掌握するということはすなわち、そこを通る街道すべてを支配下に置くということを意味していたのだ。"
 amasya_desc: "イェシルウルマク川がポントス山脈を切り開いてできた深い峡谷に位置するアマスィヤは、古代ポンティス王国の王都であり、地理学者ストラボンの生誕地でもあった。ストラボンは、世界地理に関するその大著のなかで、この地を愛情深く詳細に描写している。川を見下ろす断崖絶壁に彫られた王墓群という劇的な景観は、最盛期に小アジアの大部分を支配下に置いたヘレニズム王国の威容を物語っている。ビザンツ、ダニシュメンド朝、セルジューク朝、そしてモンゴルの統治下においても、この都市はポントス山麓の中心地という重要な地位を維持し、その深い峡谷と山岳地帯という立地により、北アナトリアでも特に優れた天然の要害のひとつでありつづけた。"
 rodos_desc: "古代の長い期間にわたり、ロードスは東地中海で最も富裕で国際色豊かな港湾都市であった。港の入り口にはかつて、古代世界の七不思議のひとつである伝説の「コロッソス」（巨像）がそびえ立ち、その海事法であるロード海法は、当時知られていた海全域の商取引を統括していた。数世紀にわたるローマ、ビザンツ、アラブの影響を経て、1309年に島が聖ヨハネ騎士団の手に渡ると、彼らはこの地を要塞化し、東地中海屈指の強固さを誇るキリスト教の拠点へと変えた。その巨大な防壁の内側で、騎士団はロードスを十字軍権力の中心地へと変貌させ、そのガレー船団はキリスト教世界とイスラム教徒の東方世界を結ぶ航路を巡回した。"
 corinth_desc: "ギリシャ本土とペロポネソス半島を結ぶ狭い陸路と、地峡を横断する古代の陸路の両方を支配していたコリントスは、古代ギリシャ世界においてとりわけ豊かで、戦略的に極めて重要な都市のひとつであった。全盛期にはエーゲ海とアドリア海間の交易を掌握し、陸路で運ばれ2つの港のあいだを行き来する貨物に通行税を課していた。また、その青銅器や装飾陶器は地中海の隅々まで輸出された。紀元前146年、ローマの将軍ルキウス・ムンミウスによって壊滅的な打撃を受けたものの、ユリウス・カエサルによってローマの植民都市として再建され、主要都市として存続した。その後、ビザンツ、ラテン、フランク各勢力がその要衝としての価値を認識し、相次いで支配権を握った。"
 candia_desc: "1204年、第4回十字軍がビザンツ帝国を崩壊させると、ヴェネツィアはクレタ島を獲得してカンディアを首都とし、その後の1世紀で、同地は東地中海において戦略的に極めて重要なヴェネツィアの前哨基地のひとつへと変貌を遂げた。島の肥沃な平野はヴェネツィアの艦隊と植民地の双方を支え、カンディアの港はヴェネツィアとレバントを結ぶ海路における重要な補給拠点として機能した。クレタ島の住民はヴェネツィアの支配者に対して幾度も反乱を起こしたが、都市自体は着実に要塞化されて豊かになり、その防壁と倉庫は、クレタ島を永久に保持せんとする植民地支配の意志を誇示していた。"
 edirne_desc: "ローマ皇帝ハドリアヌスによってマリツァ川のほとりに建設され、その名にちなんで「ハドリアノポリス」と名付けられたアドリアノープルは、コンスタンティノープルとドナウ川国境を結ぶ主要路を守り、トラキア防衛のための重要な軍事・行政の中心地として機能した。378年に西ゴート族の騎兵隊がウァレンス帝の軍団を打ち破ったのもこの地である。これは古代史において特に重大な影響をもたらした戦いのひとつであり、この敗北は帝国内にゲルマン諸民族の受け入れる契機となり、西ローマ帝国の最終的な崩壊の一因となった。ビザンツ帝国下においても、アドリアノープルはトラキア随一の都市でありつづけ、西からの脅威に対するコンスタンティノープルの伝統的な第一防衛線という役割を引き続き担った。"
 ioannina_desc: "パンボティス湖に突き出た岩だらけの半島に位置するイオアニナは、1204年に第4回十字軍がビザンツ帝国の権力を崩壊させた後、ギリシャ北西部に誕生した後継国家であるエピロス専制公国の主要都市であった。エピロス専制公たちの統治下で、イオアニナはささやかな地方都市から、ギリシャ文化と抵抗運動の重要な中心地へと発展。天然の要害は堅固な防壁によってさらに強化され、湖は食糧確保と防御の両面において重要な役割を果たした。エピロスの山岳地帯は、安全と孤立を等しくもたらし、イオアニナは旧帝国領の激動を極める北西部において、ギリシャ系キリスト教文明を支える重要な要塞としての役割を果たした。"
 tarnovo_desc: "ヤントラ川の湾曲部を見下ろす3つの丘の上に位置するタルノヴォは、1185年にアセンとペタルという兄弟がビザンツの支配に対して大規模な反乱を起こした際、第二ブルガリア帝国の首都として選ばれた。アセン朝のもと、タルノヴォはバルカン半島屈指の堅固な要塞都市へと発展。ツァレヴェッツの丘にそびえ立つ王宮と総主教座大聖堂は、13世紀の全盛期にはドナウ川からエーゲ海に至るまでその勢力を広げた国家の象徴であった。モンゴルの圧力により帝国が弱体化した後も、タルノヴォは縮小しながらも誇り高きブルガリアの首都として存続し、その防壁と帝国の記憶は、14世紀までこの都市のアイデンティティを形作りつづけた。"
 dubrovnik_desc: "ダルマチア海岸の石灰岩の崖に守られたドゥブロヴニクは、ビザンツ帝国によって設立された避難所から、中世地中海において著しい繁栄を遂げた、外交的に巧みな小国家のひとつへと成長した。ラグーザ共和国として、ヴェネツィア、ハンガリー、セルビア、そしてその先で台頭しつつあった競合する諸勢力の圧力のなかを並外れた手腕で渡り歩き、必要に応じて貢ぎ物を捧げつつ、フランドルからレバントにまで及ぶ各地の商館網を維持した。その商人たちは、既知の世界全体に交易品と信用を運び、巨大な防壁の背後にそびえる優美な石造りの都市は、代償を伴う戦争よりも、商業と慎重な外交を選んだ文明の姿を誇示していた。"
 sredets_desc: "ローマの時代にはダキア・メディテラネア属州の首府として「セルディカ」と呼ばれ、後にソフィアとなるこの都市は、ブルガリア帝国が地方の中心地としたその時、すでに何世紀もの歴史を目撃していた。コンスタンティヌス帝が343年に初期キリスト教の主要な公会議のひとつである大評議会を招集したのもセルディカであり、ボスポラス海峡沿いの地を選定する前に、彼が新たな帝都の建設を最初に検討したのもまたこの地であったと伝えられている。ビザンツ帝国およびブルガリア帝国のもと、セルディカはバルカン半島の主要な交通路が交わる重要な要衝として機能し、ヴィトシャ山の麓というその立地ゆえに、この都市はあらゆる征服を生き延び、保持する価値のある貴重な拠点として存続した。"
 ohrid_desc: "同じ名の古代の湖のほとりに位置するオフリドは、宣教師キリルとメトディウスの弟子である聖クリメントが、9世紀後半にこの地でスラヴ学問の偉大な学校を設立し、何千人もの聖職者や学者を育成して新たなスラヴ語の文芸と言語の素養を授けたことで、その名声を高めた。ブルガリアの改宗後、オフリドはブルガリア総主教座の所在地となり、後に正教会世界において極めて重要な宗教的中心地のひとつであるオフリド自治大主教区となった。丘陵地帯には教会や修道院がひしめき合っていたため、この街は「バルカンのエルサレム」という名で知られるようになり、その宗教的権威は数世紀にわたり南スラヴ諸民族のキリスト教信仰のあり方を形作った。"
 nis_desc: "ローマ人に「ナイスス」として知られていたニシュは、モラヴァ川とニシャヴァ川の渓谷が交わる地点に位置し、ドナウ川沿いの国境とコンスタンティノープルを結ぶ主要街道を支配していたため、古代バルカン半島において戦略的に重要な都市のひとつであった。西暦272年頃、コンスタンティヌス帝が誕生したのもこの地である。西バルカン半島出身の彼は、ローマ帝国と西洋文明全体の歩みを再構築することとなる人物であった。フン族のアッティラらによって幾度も破壊されたものの、交通の要衝という立地のおかげで復興することができ、ビザンツ、ブルガリア、セルビアの支配下においても、ニシュは中央バルカン半島の重要な結節点でありつづけた。"
 durres_desc: "ヨーロッパ屈指の歴史を誇る都市ドゥラスは、紀元前627年頃、コリントスやコルフからの入植者によってギリシャの植民都市エピダムノスとして創設され、アドリア海東岸に位置するその優れた天然の港湾により、すぐさま商業的に重要な都市となった。ローマ人はこの地を「ディラキウム」と呼び、バルカン半島を横断してビザンツへと至る大軍事街道「エグナティア街道」の西端の終点としたため、数世紀にわたり、ローマから東方へ進軍するすべての軍隊が、この街の門を通過することとなった。イタリアとバルカン半島を結ぶ玄関口というその位置ゆえに、この地域でもとりわけ激しい争奪戦が繰り広げられた都市のひとつとなり、その港と城壁の支配は中世の数世紀にわたり、ビザンツ帝国、ノルマン人、ヴェネツィア共和国、アンジュー家の領主たちのあいだで次々に入れ替わった。"
 prizren_desc: "シャール山脈の麓の肥沃な谷間に位置するプリズレンは、古代に築かれた都市であったが、13世紀以降、中世のセルビア国家によって主要な拠点のひとつへと変貌を遂げた。ネマニッチ朝のもとでプリズレンは主要な行政・商業都市へと発展し、その正教会の教会や修道院は、自らをビザンツ文明の継承者とみなしたセルビアの統治者たちの敬虔さと野心を体現していた。14世紀初頭にはセルビア領内でも特に重要な都市のひとつとなり、その市場にはドゥブロヴニクやヴェネツィア、そしてレバント各地から商人たちが集まり、周辺の山々で採掘された貴金属の取引がおこなわれていた。"
 belgrad_desc: "サヴァ川とドナウ川の合流点に位置し、中央ヨーロッパからバルカン半島へと続く大街道が通るこの地において、ベオグラードは古代より要塞化された玄関口であり、当時ローマ人はこの地を「シンギドゥヌム」と呼び、ドナウ川の国境部を守るため軍団を駐屯させていた。中世において、この都市はブルガリア人、ビザンツ人、ハンガリー人のあいだで支配が移り変わり、河川の合流点を見下ろす丘の上の要塞は、バルカン半島で特に激しく争われる拠点のひとつとなった。14世紀初頭には、ハンガリー王国と台頭しつつあったセルビア国家との争いにおいて、この都市は重要な争奪対象となり、その城壁は西方教会と東方正教会の世界を分かつ川を見守っていた。"
 mecca_desc: "アラビアの中心部には石造りのカーバ神殿がそびえ立ち、預言者の登場よりもはるか昔から半島の諸部族が毎年ここに巡礼してきた。570年にムハンマドがその境内で生まれ、ここで啓示を受けたことで、メッカは3つの大陸を席巻した信仰の精神的中心地となる。諸カリフ国が興亡したのちも、街は預言者の子孫であるシャリーフたちの統治下に留まったが、彼ら自身はその時代の最も強力なイスラムの統治者に服従していた。1269年以降は、エジプトのマムルーク朝が神殿の保護者を務め、神殿を真新しい「キスワ」で覆うため、毎年彼らのキャラバンがその黒の絹布を載せて砂漠を渡る。"
 aleppo_desc: "世界でも特に歴史の長い都市の一つであるアレッポは、北レバントの十字路として、すでにヒッタイトやアッカドの人々に知られていた。10世紀にはハムダーン朝の首長サイフ・アル＝ダウラのもとで詩人と戦士が集う華やかなアラブの宮廷となり、国境を接するビザンツ帝国と、眩いばかりの詩歌と鋼鉄の両方で競い合った。ザンギー朝のヌール・アル＝ディンと、サラディンの息子であるアイユーブ朝の王子アル＝ザーヒル・ガーズィーは、その壮大な城塞をイスラム教世界屈指の難攻不落な要塞へと再建した。1260年、アレッポはフラグ率いるモンゴル軍によって略奪されるが、マムルーク朝が奪回すると、シリア領土における第2の都市として復興され、そのキャラバン市場を通じてイラクと地中海のあいだで絹や香辛料が交易された。"
 adan_desc: "死火山の火口に抱かれたアデンは、古代より紅海とインド洋を結んだ港であり、ギリシャの船乗りたちはその交易の富からここを「ユダイモン・アラビア」、幸福のアラビアと呼んだ。11世紀にはスライフ朝の女王アルワがジブラから統治し、その後はアイユーブ朝の台頭を経て、1229年以降はイエメンのラスーリド朝スルタンたちの手に渡り、その海洋活動の原動力となった。アデンの港にはインドを目指すエジプトの商人たちや、コショウ、綿花、磁器を西へ運ぶインドの船団が集まり、埠頭にあるラスーリド朝の税関はイスラム教世界でもとりわけ裕福な税関の一つであった。"
 hormuz_desc: "ホルムズ王国は何世紀ものあいだペルシア湾の本土側に位置していたが、1300年頃にモンゴル軍が襲来すると、当時の統治者は旧都を捨てて小さなジャルン島へと移った。そこで新ホルムズの商人たちは石造りの家々と巨大な倉庫群からなる都市を築き上げ、水のないその岩山は貯水池の水で潤い、真珠、馬、そしてインドの香辛料の交易によって繁栄した。ケルマーンの領主に従属しつつも独自の王に統治されたこの島は、湾の一大交易拠点となり、季節ごとにアラブのダウ船、ペルシアのキャラック船、インドのジャンク船が集まって2つの大洋の品々を取引した。"
 tabriz_desc: "サハンド山脈の北の肥沃な谷に位置するタブリーズは、ササン朝の時代から繁栄した町であったが、ペルシアのイルハン朝が首都に選んだことで第一級の都市に躍り出た。1295年にイスラム教へと改宗したガザン・カーンと、その跡を継いだオルジェイトゥの治下において、タブリーズはオクサス川からユーフラテス川にまで広がる帝国の中心に成長。中国の絹織物などが、ジャムチという駅伝制度のもと整備された帝国の街道を通り、タブリーズのバザールに山のように積み上げられるようになった。博学者兼歴史家の宰相ラーシド・アル＝ディンはタブリーズの郊外に、マドラサ、図書館、写字室の大規模な複合施設「ラベ・ラシディ」を建設し、ユーラシア各地から学者を集めた。イルハン朝のアブ・サイードが没するころには、タブリーズは世界でも特に人口が多く、国際色豊かな都市の一つとなっていた。"
 isfahan_desc: "ザーヤンデルード川の豊かな水に恵まれ、イラン高原の中心部に位置するイスファハンは、ササン朝の時代からペルシア屈指の偉大な都市であり、当時はジャイという集落と、ユダヤ人居住区であるヤフディーヤの双子都市であった。11世紀には、セルジューク朝のスルタン、マリク・シャーとその宰相ニザム・アル＝ムルクのもとで、アナトリアから中央アジアに及ぶ帝国の首都となり、その中心にはイスラム建築の最高峰の一つである偉大な金曜モスクがそびえ立っていた。1241年にモンゴル軍による苛烈な略奪を受けたが、イルハン朝の支配下で都市の庭園、橋梁、工芸品は徐々に復興し、その織物職人や金属細工師はいまなおイラン世界の市場に品物を供給しつづけている。"
 mosul_desc: "古代ニネヴェの遺跡からチグリス川を挟んだ対岸に位置するモースルは、イスラム初期の時代からシリアとバグダードを結ぶ街道上の渡河点を守りつづけてきた。ハムダーン朝、そしてのちのザンギー朝の諸アタベクのもとでモースルは強力な国境の首都となり、そこからイマド・アル＝ディン・ザンギーは十字軍への反攻を開始して1144年にエデッサを奪還し、レバントにおけるイスラムの長い復興の端緒を開いた。モースルは織物職人で名高く、その名はヨーロッパ全域で「モスリン」として知られる上質な綿織物の由来となっており、また鉄工職人や銀細工職人たちはジャジーラ北部の市場に製品を供給している。モンゴルの惨禍も早くに降伏したことで最悪の事態を免れたモースルは、チグリス川上流域におけるイルハン朝の重要な中心地でありつづけている。"
 samarra_desc: "バグダードの北、チグリス川の岸辺に、アッバース朝のカリフであるアル＝ムウタスィムが836年にサマッラーを創立した。問題を引き起こすトルコ人親衛連隊を広大な新都に駐屯させることで、以前の都市の民衆から遠ざけたのだ。世界最大の帝国はおよそ60年のあいだ、サマッラーの広い大通り、壮大な宮殿、そしてイスラム世界最大で、螺旋ミナレットが特徴の大モスクを擁するこの地から統治された。892年にカリフたちがバグダードに戻ると、廷臣や兵士たちもこの大都市から去っていったが、第10代および第11代のイマームの廟があることで、サマッラーはシーア派の巡礼の中心地として存続し、帝国時代の遺跡はいまなお河平野の上にそびえ立っている。"
 bukhara_desc: "千年以上ものあいだ、ブハラは中央アジア最大級の都市の一つでありつづけている。ソグド人の交易拠点であったこの地は、9～10世紀のサーマーン朝の首長たちによりイスラム・イランの輝かしい首都へと変貌した。イスマイル・サマニの焼成レンガ造りの霊廟は初期イスラム建築の傑作としていまなお健在であり、カラハン朝が1127年に建てたカラーン・ミナレットも、景観のなかで圧倒的な存在感を放っている。1220年には、チンギス・カーンがこの街を急襲した際、金曜モスクに馬で乗り込んでクルアーンを踏みにじるよう要求し、完膚なきまでに破壊し尽くしたと言われている。しかしチャガタイ・カーン朝のもとで街は徐々に復興し、そのマドラサはかつての二つ名「ブハライ・シャリーフ」（気高きブハラ）の姿を取り戻し、再び学者たちを集めるようになった。"
 herat_desc: "アケメネス朝の古き調べを伝えるヘラートは、ペルシア、ホラーサーン、インドからの道が交わるハリールード川の肥沃な谷を治めている。ガズナ朝のもとでは詩人や商人が集う輝かしい辺境の都市であり、12世紀に近郊で台頭したゴール朝の諸スルタンはモスクやマドラサなどで街を豊かにし、やがて南方のヒンドゥスターンに進出していった。1221年、ヘラートはトルイ率いるモンゴルの騎馬隊によって徹底的に略奪されるが、1245年にクルト朝マリクたちが台頭すると、それ以降イルハン朝の従属国として着実に再建され、東西の大街道に位置するその地理的条件により繁栄しつづけた。"
 kashgar_desc: "トランスオクシアナ、フェルガナ、チベットからの街道が合流するタリム盆地の西端に位置するカシュガルは、古代からシルクロードのオアシスであった。10～11世紀のカラハン朝のもと、テュルク系イスラム教文明の主要な中心地となったこの都市は、アッバース朝のためにテュルク諸族の言語を編纂した『ディーワーン・ルガート・アッ＝トゥルク』の著者である大学者マフムード・アル＝カシュガリの故郷でもあった。モンゴル帝国の征服後、都市はチャガタイ・カーン朝の支配下に入り、その遊牧の宮廷は天山山脈とパミール高原のあいだの草原を往来し、カシュガルのバザールはタリムのオアシスに永続的な富をもたらしたヒスイ、馬、絹の貿易の中継所でありつづけた。"
 lahore_desc: "ヒンドゥー教シャーヒー朝の古都ラホールは1021年にガズナ朝のマフムードによって征服され、その広大な帝国の東方首都となり、イスラム教文明がインド平野へと入り込む際の玄関口となった。ガズナ朝のもと、この地はモスクやマドラサが立ち並ぶ、きらびやかな辺境都市へと発展。ペルシアの詩人マスード・サーディ・サルマーンや学者アリー・フジュウィーリーの故郷であり、スーフィーであるアリー・フジュウィーリーの廟「ダーター・ダルバール」は今日に至るまで巡礼者を引きつけている。デリーのマルムーク朝の台頭後、ラホールはインダス川を渡って繰り返し押し寄せたモンゴルの騎馬軍に対するイスラム世界の主要な防波堤となり、バルバンなどのスルタンのもと、草原からの脅威に立ち向かうべく要塞が再建された。"
 varanasi_desc: "ヴァーラーナシーは、世界でもとりわけ古くから人が居住しつづけている都市の一つで、信奉者からは光の都を意味する「カシ」と親しまれており、ヒンドゥー教の最も神聖な聖地であるガンジス川の西岸に位置している。有史以前から巡礼者たちがこの地を訪れ、輪廻からの解脱を求めて川の聖水に浸かってきた。ガンジス川へと下るガートは寺院と苦行者でごった返しており、死を迎えここに運ばれてきた人々を葬送する炎があちこちに立ち上っている。1194年には、クトゥブッディーン・アイバク率いるゴール朝の軍勢がヴァーラーナシーを略奪し多くの寺院を破壊したが、何度でも立ち上がってきたこの都市は、またしても見事に復興を遂げた。絹織物職人、真鍮細工師、サンスクリット語の学者たちが支えつづけるこの都市の文明は、いかなる征服者も消し去ることができなかったのだ。"
 madurai_desc: "マドゥライは千年以上にわたってタミル南部を治めるパーンディヤ朝の首都であり、女神ミーナクシの壮大な寺院が詩人、学者、戦士貴族たちの文明を彩ってきた。タミルの文学アカデミー「サンガム」が古代にこの都市で栄え、南部宮廷の吟遊詩人たちが集まって言語について議論を交わし、その表現を洗練させたと言われている。1311年には、デリーのアラー・ウッディーン・ハルジーに仕えた大将軍マリク・カーフールがマドゥライを急襲して蓄えられた宝物を持ち去り、そして1335年にはトゥフルク朝の総督ジャラル・アル＝ディン・ハッサンがマドゥライ・スルタン朝の独立を宣言。こうして、古代タミルの中心地にか弱いイスラム教勢力が根を下ろした。"
 patna_desc: "はるか昔、ガンジス南岸にはマウリヤ朝アショーカ王の首都パータリプトラがあった。このインド初の帝国は、パータリプトラの宮殿から、アフガニスタンからベンガル湾までを統治した。ギリシャの使節メガステネスはその木製の防壁と宮廷の壮麗さに驚嘆し、中国の巡礼者である法顕は5世紀に、グプタ朝のもとでなお繁栄しているその姿を目にしている。しかしこの大首都はデリー・スルタン朝の時代にもなると、パトナという名のささやかな町へと衰退。もはやトゥフルク朝ビハールの質素な地方拠点に過ぎず、古代における指折りの都市の一つは、学者たちの記憶と川岸の廃墟にその遺産が残されるだけとなった。"
 chittagong_desc: "東ベンガルの川がベンガル湾へと注ぎ込む広大な河口に位置するチッタゴンは、古代からインドと東南アジアを結ぶ港であった。アラブの地理学者たちのあいだでは、中国まで船で交易をおこなった商人の街「サマンダル」として知られ、10世紀にはチベットの巡礼者ダンマパーラがその修道院について記述している。ベンガル国王、アラカンの統治者、トリプラ丘陵の首長らのあいだで争奪が繰り広げられ、何度も支配者が変わり、デリー・スルタン朝によるベンガル征服の際にはイスラム教徒の統治下に入ることとなったが、その港はガンジス・デルタの米と綿花を東方へと送り出す主要な輸出拠点でありつづけた。"
 jinjiang_desc: "アラブ人からは「ザイトゥーン」と呼ばれ、マルコ・ポーロからは世界の2大港のひとつと評された泉州は、宋朝および元朝期にインド洋へとつながる中国の主要な玄関口として極めて重要な地位を築いた。その港は香料諸島、インド、ペルシア湾へ向かうジャンク船で混み合い、街のなかにはアラブ、ペルシア、タミル、アルメニアの商人たちの居住区が置かれ、そこでは仏教寺院やマニ教の祠堂の横にモスク、ヒンドゥー教寺院、キリスト教の教会が建ち並ぶ。1290年代にこの地を訪れたマルコ・ポーロは、ザイトゥーンには香辛料を満載した船がアレクサンドリアの100倍もやって来ると記しており、その大交易の関税収入は元朝の財政的な柱のひとつとなっている。"
 shangyuan_desc: "長江が海に向かって北に曲がるその南岸に位置し、現在集慶と呼ばれるこの都市は、千年以上にわたり首都および要塞でありつづけている。古代の呉や東晋の王たち、そして後漢滅亡後の南朝が、「建業」や「建康」といった名のもと、ここの城壁の内側から統治をおこなっていたことから、この都市は何世紀ものあいだ中国南部の文化の中心地であった。12世紀に女真が北方を征服した際、宋朝は一時ここを新たな首都とすることを検討していた。モンゴルが帝国全土を席巻したあとは、集慶路の治所として都市が再建され、長江下流域におけるその戦略的地位により、南部諸都市のなかで重要性を保ちつづけた。"
 wuxian_desc: "長江デルタの中心地に位置し、古くは「姑蘇」、宋の時代には「平江」と呼ばれた蘇州は、紀元前6世紀に呉王朝の首都として建設された。複雑な運河網で知られ、杭州と並び「上に天国あり、下に蘇州と杭州あり」という慣用句で称えられる。蘇州は古くから、絹織物職人、文人たちの庭園邸宅、そして洗練された料理や戯曲で名高く、南宋の治下では南部でも特に裕福な都市の一つに成長した。1276年のモンゴルによる征服は傷跡を残したものの、14世紀初頭までには、蘇州の庭園、塔、運河沿いの市場が再び中国全土の商人や学者を引き寄せるようになっていた。"
 guangzhou_desc: "珠江の河口に位置する広州は、漢代より外国船を迎え入れており、その商人たちはすでに南海の国々と交易をおこなっていた。唐代までには、アラブやペルシアのダウ船が季節ごとに数多く寄港するようになっていたため、市内にはイスラム教徒の商人長老が治める独立した外国人居留地が置かれた。しかし、879年には反乱軍の指導者、黄巣が10万人以上の外国人居住者を一度に虐殺したと伝えられている。その後のモンゴルの征服は、広州に新たな繁栄をもたらした。元代の海上交易の隆盛の恩恵を受け、その港から嶺南の交易品が世界へと送り出されるようになり、インドやアラブの商人が再びその宿屋や倉庫に集まっている。"
 lhasa_desc: "ラサは7世紀に、チベット皇帝のソンツェン・ガンポによって創建された。皇帝は、ネパール人と中国人の王妃たちから贈られた仏陀の聖なる尊像を安置するため、ジョカン寺を建立。ラサはその後2世紀にわたり唐と並び称され、パミールからベンガル湾までを支配したチベット帝国の中心として栄えた。9世紀に帝国が崩壊するとラサは衰退したが、ジョカン寺とラモチェ寺はチベット仏教の精神的中心でありつづけた。1240年、モンゴルは高原全域を席巻すると、サキャ寺の座主を総督に任命。サキャは依然として行政の中心地であるものの、ラサは聖都として存続し、バルコルを訪れ釈迦牟尼仏像の前で五体投地する巡礼者たちを引き寄せつづけた。"
 kamakura_desc: "武家棟梁の源頼朝が1185年に朝廷から権力を奪い、海沿いの町である鎌倉に武家政権の幕府を成立させた。それ以来、幕府が天皇の名のもとに日本を統治している。北条氏の執権のもと、鎌倉は山と海に囲まれた厳格な武士文化の要塞都市に成長。1252年には大仏が作られ、武士たちが帰依した新興の禅宗仏教の象徴として、いまなおその境内で瞑想しつづけている。1274年と1281年の元寇では鎌倉から迎撃の指揮が執られたが、九州の諸武家と、のちに「神風」と呼ばれた嵐により、いずれも撃退された。"
 hakata_desc: "何世紀ものあいだ、博多は日本における大陸への窓口としての役割を果たし、唐や宋の使節、朝鮮の諸王国、南方海域の商人たちを迎え入れた。宋代には商人や僧侶が博多に石造りの倉庫や仏寺を建立して中華街を形成し、その波止場を流れる富により博多は九州随一の豊かさを誇った。1274年と1281年の元寇でモンゴルの艦隊が上陸したのは博多湾の長い砂浜で、鎌倉幕府の武士たちは巨大な石垣（元寇防塁）を築いて防衛にあたった。その遺構はいまも海岸に残っており、日本史に残る危機的な防衛戦の記憶を伝えている。"
 namgyeong_desc: "漢江が黄海に向かって蛇行し、山々が盆地を取り囲む漢陽の地には、先史時代から人々が定住しており、古代には百済と高句麗のあいだで争奪戦が繰り広げられた。高麗の時代には、開京を補う3つの陪都の1つ「南京」として重要性を増し、その地が風水上の吉地とされたことから、歴代の王は風水師の進言を受けて宮廷の移転をたびたび検討した。14世紀初頭までには、宗主である元の緩やかな支配のもと、漢陽は高麗の主要都市へと成長。漢江沿いの戦略的な立地により、朝鮮半島と外の世界を結ぶ玄関口としての役割を担っていた。"
 pagan_desc: "11世紀、イラワジ川が荒涼とした丘陵を過ぎて蛇行する、上ビルマの乾燥した平原で、国王アナウラタがパガン王国を創設。国王はビルマ系諸民族を統合し、高僧シン・アラハンが伝えた上座部仏教を受け入れた。その後2世紀にわたり、歴代の王たちが首都周辺の平原に数千ものストゥーパ、塔、寺院を建立したことで、パガンは仏教世界において比類のない広大な聖地となり、ビルマの壮大な穀倉地帯の富は、インドやスリランカから訪れた学者や職人たちを支えた。1287年、クビライ・カーンのモンゴル軍によって王国は崩壊し、14世紀初頭までには、実質的な権力はミンサインおよびピニャのシャン＝ビルマ系の首長たちに移った。古代の都は聖なる廃墟として残り、いまもなお巡礼者たちが1万基もの崩れゆく寺院を訪れている。"
 sukhothai_desc: "13世紀初頭、チャオプラヤー川上流のタイ族の首長たちはクメール王朝の支配を退け、「幸福の夜明け」を意味するスコータイ王国を建国した。1279年から1298年まで統治したラームカムヘーン王のもと、王国はスリランカから僧侶や職人を引き入れる輝かしい上座部仏教国家として繁栄。王が自らの改革を記念して1292年に建てた碑文は、王自身が考案したとされるタイ文字による現存最古の文書である。チャオプラヤー川下流で台頭したタイ族の諸侯により、14世紀初頭にはすでにスコータイの権力が脅かされるようになっていたものの、都市の金色の仏塔と穏やかな仏像はその後のタイ文明の基準となった。"
 thang_long_desc: "1010年、ベトナム国王の李公蘊はホアルーの狭い城塞から紅河のほとりの新しい都市へと首都を遷し、到着時に見た幻にちなんで昇龍を意味する「タンロン」と名付けた。この都は李朝および陳朝のもとで大越の中心地となり、塔、試験場、王宮が立ち並ぶなかで、ベトナム文明は中国、チャム、クメールの影響から独自のアイデンティティを育んでいった。クビライ・カーン率いるモンゴル軍が3度にわたって北方の国境を越えて大越に攻め込んだが、名将陳興道率いる陳朝の軍勢はそのたびにこれを退け、その武勇はベトナムにおいて長く語り継がれることになる。なかでも最も有名なのは1288年の戦いで、この戦は杭が打ち込まれた白藤江の上で繰り広げられた。"
 trowulan_desc: "1293年、モンゴル軍がジャワに侵攻。しかしシンガサリ王国の巧みな謀略により、モンゴル軍の矛先は王国の簒奪者に向けられることになる。その後、ジャワのラデン・ヴィジャヤ王子はマジャパヒトという新たな王国を建国し、ブランタス川下流のトロウランに首都を築いた。東ジャワの豊かな米どころの平原に位置するこの都市は、レンガ壁の区画、広大な貯水池、そして新王朝の勝利を称えるテラコッタのレリーフが施された大門を備えている。1320年代に権力を握った宰相ガジャ・マダのもと、マジャパヒト王国は覇権をインドネシア諸島全域に拡大するための遠征を開始しており、トロウランは偉大なインディアス帝国の中心地として、黄金時代を迎えようとしている。"
 palembang_desc: "7世紀から13世紀の後半に至るまで、パレンバンはシュリーヴィジャヤ海洋王国の首都であった。その艦隊はマラッカ海峡を支配し、僧侶たちはこの都市をインディアスにおける仏教学問の一大中心地へと押し上げた。670年代、中国の巡礼者である義浄は同僚たちに、インドへ赴く前にパレンバンで学ぶことを強く勧めており、この都市の寺院群には翻訳や注釈作業に従事する何千人もの僧侶たちが暮らしていた。1025年、チョーラ朝による襲撃でシュリーヴィジャヤ王国の海峡の独占体制は崩壊し、パレンバンは数世紀を経てジャワの諸王国の朝貢都市へと衰退していったが、ムシ川沿いという立地により、いまなお南スマトラの領主たちにとって重要な港でありつづけている。"
 pegu_desc: "シッタウン川とバゴー川が海へと注ぐ広大な低地の三角州に位置するペグーは、1287年のモンゴル軍の侵攻によってパガンが崩壊した混乱のなかで台頭した。モン族の王ワレルがこの時、下ビルマに新たな上座部仏教王国を建国したのである。モン族に「ハンタワディ」として知られるペグーは、ワレルの後継者たちの治世のもとでベンガル湾北部随一の港へと成長し、ベンガル、スリランカ、コロマンデル海岸からの商人を惹きつけ、チーク材、ルビー、そしてモンの職人による名高い漆器の交易で栄えた。仏陀の聖遺物を祀ると伝えられる壮麗なシュエモードー・パゴダは、パガンの廃墟から蘇ったモン族文明の新たな精神的中心地として、この街を象徴している。"
 chiang_mai_desc: "1296年、上メーピン渓谷出身のタイの王マングライは、「チェン・マイ」（新都）という名の新しい首都を設立し、北部シャムの山岳渓谷におけるラーンナー（百万の田んぼの地）の統一を成し遂げた。スコータイとパヤオの王たちとともに選ばれたこの新首都には、モン、タイ、クメールの伝統を融合させた神聖な都市計画に従い、中央の広場を囲むように首都の城壁と堀が配置された。マングライとその後継者のもと、チェン・マイは上座部仏教と工芸の中心地として栄え、特にその寺院群は、仏教世界で人気のラーンナー仏像を作る青銅鋳造職人を多く抱えた。"
 vijaya_desc: "南シナ海を望む砂丘の背後にそびえるヴィジャヤの城塞から、チャンパ王国は4世紀ものあいだ、ベトナム中部の海岸線一帯を支配してきた。その細長い領土の至る場所に建てられたレンガ造りの塔は、南海の商人と絹や香木を交易したインド・ヒンドゥー文明の有り様を物語っているが、その一方で、王国にはクメールのアンコールとベトナムの大越という2大勢力に幾度も打ちのめされてきた歴史もある。首都ヴィジャヤは1145年にクメールに、1283年と1326年には大越の手に落ち、その都度独立を取り戻しはしたが、その勢力は次第に衰えていった。かつての王たちが建てたレンガ造りの塔は、海岸に沿って南へ後退しはじめていた文明の物言わぬ証人として、いまもそびえ立っている。"
 lubeck_desc: "ホルシュタイン伯アドルフ2世により1143年に創設され、火災ののち1159年にハインリヒ獅子公によって再建されたリューベックは、北海とバルト海の玄関口に発展していき、トラーヴェ川沿いの港にはザクセン、スラヴの地、そしてスカンジナビアから商人たちが集まった。1226年にフリードリヒ2世が帝国自由都市の地位を与えると、リューベックの商人たちは赤レンガの塔のもとで自治ギルドを形成し、バルト海の商人都市を結びつける条約網を築き上げていった。リューベック法は14世紀までにバルト海や北海の100を超える町で模倣・採用され、北方の商人社会が共同生活を築くための法的枠組みを確立した。"
 visby_desc: "ゴットランド島の西海岸にそびえる堅固な石壁の背後で、ヴィスビューは12世紀から13世紀にかけてバルト海でも指折りの裕福な都市へと成長した。その港はノヴゴロドの毛皮商人、フランドルの織物商人、ドイツ・ハンザ同盟の鉄とニシンの船積み業者が集う場所であった。何世紀にもわたって島を統治してきたゴットランド農民共和国は、特権を有するドイツ人商人居留地と都市を共有し、この2つの共同体の並立する支配が特異な富と複雑さをもたらしている。1300年までにその防壁内で石灰岩の教会が20棟余り建てられたという事実は、一世代にわたりバルト海交易の最も重要な拠点たらしめてきた繁栄の度合いを物語っている。"
 tallinn_desc: "1219年、デンマーク王ヴァルデマール2世はレヴァル湾を見下ろすトームペアの険しい石灰岩の崖の上に要塞を築いた。伝説によると、その年の遠征の最中にダンネブロ旗が天から舞い降り、動揺する軍を鼓舞したという。城の足元で発展したこの街にはドイツの商人や職人が定住し、彼らはリューベック法をもたらして、この地をハンザ同盟の港へと成長させていった。町の波止場では、ノヴゴロドへと通じるロシアの河川交易路と、偉大なバルト海の海運路を通じて交易が営まれた。デンマーク王室の緩やかな統治のもと、下町の市民はニシンと琥珀の交易で繁栄する一方、司教とチュートン騎士団の臣下が崖の上で影響力を競い合う。デンマーク王国の立脚地とドイツ人の商人共和国という二面性は、東バルト海の港のなかでも類を見ない活力をこの街に与えている。"
 riga_desc: "1201年、アルベルト・フォン・ブックスホーフェン司教は、ダウガヴァ川の対岸の森に住む異教のリヴォニア人とレット人に対する十字軍の拠点として、リガを創設。さらに彼は、教皇の祝福のもとリヴォニア帯剣騎士団を設立し、この武闘派の騎士団は半世紀にわたる血みどろの戦いで異教の諸部族を従属させていくことになる。こうしてリガは当初の布教拠点という枠を超えて急速に成長し、東部バルト海におけるハンザ同盟の主要な港となった。その埠頭からはドイツのコグ船がロシアの毛皮、蜜蝋、琥珀をリューベックやその先へと運ぶ。一方でリガの商人たちはドイツの大ギルドに組織され、ロシアの諸公国へと向かう川沿いに交易拠点を確立している。リガの市民、大司教、そして新しいリヴォニア騎士団のあいだの長い闘争は、この都市の政治の特徴となっている。"
 bergen_desc: "ノルウェー西海岸のフィヨルドと山々に囲まれたベルゲンは、1070年ごろに国王オーラヴ3世によって創設され、中世ノルウェーの主要都市、そして王都へと発展した。そのブリッゲン港は北部漁場の干し魚の主要な輸出拠点となっている。13世紀の終わりごろにはハンザ同盟の諸都市出身のドイツ人商人たちが波止場に数多く定住して、やがてノルウェーの対外貿易を次第に支配するようになるコントールという商館を設立した。王の戴冠式やノルウェーサガの執筆がおこなわれ、王室、教会、外国商人間の争いが絶えないベルゲンは、13世紀の最盛期にはフェロー諸島からグリーンランドにまで及んだノルウェー王国の政治および文化の中心地となっている。"
 hamburg_desc: "9世紀にカール大帝とその後継者たちがザクセン人を改宗させ、抑え込むためにエルベ川に築いた要塞を起源とするハンブルクは、やがて大司教座の所在地へと発展し、北方のスカンジナビアへキリスト教を広める拠点となった。バイキング、スラブ人、さらにはポーランド王ボレスワフ1世により繰り返し略奪を受けながらも、ハンブルクは着実に再建していき、1189年にフリードリヒ・バルバロッサが交易特権と関税免除の帝国特許状を与えると、商業が発展。13世紀にはバルト海の海賊行為に対抗するためリューベックと同盟を結び、これがハンザ同盟の台頭の礎となる。そしてハンブルクの醸造業者、ロープ職人、船積み業者によって、この都市は北ドイツ交易におけるエルベ川の一大終着点となった。"
 kyiv_desc: "9世紀以降、ルーシのヴァリャーグの統治者たちはキーウをドニエプル川中域におけるスラブとノース人の大連合の首都とした。11世紀のウラジーミル1世およびその息子ヤロスラフ1世の治世には、東ヨーロッパ屈指の豊かで輝かしい都市の一つとなり、聖ソフィア大聖堂や黄金の門などの建造物を誇る文明に発展。コンスタンティノープルともバルト海とも活発に交易をおこなった。ルーシが競合する諸公国へと分裂したことで、キーウはモンゴルの大侵攻を待たずして徐々に衰退していった。そして1240年、バトゥ・カーンの軍勢が都市を急襲。その破壊は徹底的で、一世代が過ぎた後も街路に草が生い茂り、野原に頭蓋骨が散らばっていたという。モンゴルの緩やかな統治のもとでキーウは徐々に復興しつつあったが、1320年代には台頭するリトアニア大公国の勢力圏に組み込まれることとなった。古代から続くリューリク朝の血統も、新たな政治秩序の現実の前には何の意味もなさなかったのだ。"
 pskov_desc: "ヴェリカヤ川とプスコワ川の合流点を見下ろす岩の丘に位置するプスコフは、ルーシ黎明期以来のノヴゴロドの姉妹都市であり、自由市民が集まって国家の諸事を議論する民会「ヴェーチェ」の伝統を共有していた。プスコフは1136年にノヴゴロドからの独立を主張しはじめ、13世紀以降はチュートン騎士団の容赦ない圧力に対し、リトアニアからの亡命者であるダウマンタス公などといった戦士に率いられた民兵が、ルーシ西方の国境を守り抜いてきた。隔絶された地理的条件のおかげでモンゴル侵略において多大な被害を免れたプスコフは、商人と戦士の共和国として繁栄を謳歌しており、その巨大な石造りのクレムリンや商人たちの教会群は、ロシア随一の都市としての市民の自信を表している。"
 avignon_desc: "プロヴァンスとラングドックを隔てるローヌ川の自然の渡河点で、巨大な岸壁の上に位置するアヴィニョンは、古代ローマの植民地であり、伯爵の座所でもあった。ローマに安全に戻ることができずフランス王室の保護を求めた教皇クレメンス5世が、1309年に教皇庁をアヴィニョンに移転すると決めたことで、この都市の運命が大きく変わることになる。ラテン・キリスト教会の新しい中心として新たな教皇庁が設置されることになったのだが、続く教皇たちのもとで、その建設はいまなお続いているのだ。教皇庁の宮殿周囲には枢機卿の宮殿、ヨーロッパ各国の大使館、写字室、両替商がひしめき合う。アヴィニョンは普遍教会の都という途方もない使命を受け、その人口は倍増に倍増を重ねている。"
 toledo_desc: "テージョ川を見下ろす馬蹄形の岩の上に位置するトレドは、711年のイスラム教徒による征服以前は西ゴート王国の首都であり、ムーア人の支配下でもアル＝アンダルスの主要都市の一つでありつづけた。その狭い街路にはシナゴーグ、教会、モスクがひしめき合っており、異なる宗教が共存する珍しい都市であった。レオンおよびカスティーリャの王アルフォンソ6世が1085年にトレドを奪還すると、王国の首都がここに置かれる。トレドではラテン語、アラビア語、ヘブライ語の学問が集い、13世紀には大司教ライムンドと賢王アルフォンソ10世の後援を受けた翻訳学派により、ギリシャおよびアラビアの哲学、科学、医学の多くがここからラテン西方世界に伝わり、ヨーロッパの思想が根本から変容することとなった。"
 granada_desc: "1230年、キリスト教諸国の軍勢がアル＝アンダルスへ進撃してムワッヒド朝が崩壊するなか、ムハンマド1世はシエラ・ネバダのグラナダに新たな首長国を創設し、ここがイベリア半島におけるイスラム教の最後の砦となった。彼が創始したナスル朝のもと、グラナダ王国はカスティーリャの朝貢国となったが、アンダルス文明の継承者として繁栄の道を模索している。グラナダは山岳地帯に位置し、肥沃な農業地帯であるベガに支えられているため、攻略の難しい標的となっている。ナスル朝の諸スルタンは、都市の上にそびえるサビカの丘にアルハンブラ宮殿の建設を始め、その中庭や居室はすでにアンダルス文明最高峰の建築となりつつある。"
 dublin_desc: "9世紀、ヴァイキングの略奪者たちがリフィー川の河口に要塞化された船着き場（ロングフォート）を築いた。黒い水たまりを意味する「ドゥブ・リン」と呼ばれたその地を起源とするダブリンはその後、アイルランドにおけるヒベルノ・ノース人の最重要都市へと成長し、アイルランド海を越えて奴隷、皮、銀を交易した。ダブリンの王たちはアイルランド上王と幾度となく衝突したが、1014年のクロンターフの戦いでブライアン・ボルに敗北。ストロングボウが率いた1170年のアングロ＝ノルマン人の侵攻を経て、ダブリンはヘンリー2世の手によってイングランド王の支配下に置かれた。そしてダブリンはアイルランド卿領の首都となり、その城壁は拡張され、大聖堂が建てられ、イングランド法による統治は周囲のペイル地域へと不安定ながらも広がっていった。"
 antwerp_desc: "スヘルデ川の広大な河口域に位置するアントワープは、10世紀から神聖ローマ帝国の要塞化された方伯領であり、スティーンにあるその城塞はヴァイキングの襲撃から渡河点を守ってきた。12世紀から13世紀にかけ、ブラバント公国はアントワープをフランドルのブルージュやゲントに対抗する都市として発展させ、1296年にはハンザ同盟商館が設置され、北欧交易の重要な港として台頭。14世紀初頭においてもブルージュの陰に隠れていたものの、港がより深く、外海へのアクセスも容易であるため、イタリアのガレー船やイベリアのキャラック船の利用が増え、着実に成長を続けている。"
 lyon_desc: "ローヌ川とソーヌ川の合流点にローマの植民地「ルグドゥヌム」として創設されたリヨンは、ガリアの3属州の首府であり、帝国鋳造所の所在地としてローマに銀貨を供給した。ローマ崩壊後、ガリア全域の首位権を主張した大司教の管区座となり、リヨンの双子の谷は中世を通じ、西ヨーロッパ交易の大きな十字路の一つへと成長していった。1312年にフランス王直轄領となるまで、名目上は神聖ローマ帝国の都市であったが、リヨンはすでにイタリア、低地諸国、地中海の商人が絹、香辛料、銀の取引のために集まる交易都市として発展していた。"
 york_desc: "西暦71年にローマ軍団の要塞「エボラクム」として創設されたヨークは、北部属州の州都へと成長し、306年には、コンスタンティヌスがこの地で軍隊に擁立されて皇帝に即位する。その後の数世紀はアングロ人のノーサンブリア王国の首都として、また学者アルクィンのもとでキリスト教の一大中心地として発展する。866年に大異教軍によって征服されると、名を「ヨールヴィーク」に変え、交易網がサマルカンドにまで及んだヴァイキング王国の首都となった。ノルマン・コンクエストを経て、ヨークには大聖堂と2つの城が建設され、中世を通じてカンタベリーと教会首位権を争う大主教の座所在地として、また規模、富、歴史の長さにおいてイングランド第2の都市として栄えつづけた。"
 canterbury_desc: "597年、ローマ出身のアウグスティヌスがアングロ・サクソン人を改宗させるべくケント王国に上陸し、カンタベリーを布教の中心地とした。イングランド教会最初の大司教座に定めたこの地は、その後も権威を維持しつづけている。アウグスティヌスが創設した大聖堂は何度も再建されたが、最も運命的なのは1170年、大聖堂においてトマス・ベケット大司教が殺害された後だった。イングランド王による冒涜行為により、カンタベリーは中世キリスト教世界最大の巡礼地のひとつになった。ロンドンからカンタベリーへ続く街道はベケットの墓を目指す巡礼者で賑わっており、都市の繁栄はその古代からの宗教的重要性、そして巡礼者のための宿泊施設、食事、土産物によって築かれている。"
 edinburgh_desc: "周囲から孤立して切り立つキャッスル・ロックの岩頸の上に君臨するエディンバラは、ブリトン人に「ディン・エイディン」と呼ばれた時代から要塞であり、12世紀初頭にデイヴィッド1世のもと、スコットランドの主要な王室勅許自治都市となる。デイヴィッド1世はキャッスル・ロックの麓にホリールード修道院を設立し、エディンバラに都市特許状を与えて市場にフランドルやイングランドの商人を引き付けた。14世紀初頭の独立戦争では、エディンバラ城の支配権がスコットランド軍とイングランド軍のあいだを幾度も行き来した。そして1314年、トマス・ランドルフがエディンバラ城に大胆な奇襲を仕掛け、ロバート1世のもとへと奪還。スコットランド戦争における伝説的な偉業の一つとなった。"
 kilwa_kisiwani_desc: "11世紀、シラーズィ系スワヒリ人が東アフリカ沖の環礁島に定住する。キルワ・キシワニと呼ばれたこの島は、13世紀から14世紀初頭にかけてスワヒリ海岸で最も裕福な都市国家へと発展。キルワのサルタンたちは1277年に成立したマハダリ朝のもとで、南部の港ソファラを経由する金交易の主導権をグレート・ジンバブエから奪取。その交易がもたらした富により建設された、壮大なサンゴ造りの宮殿「フスニ・クブワ」は、八角形の浴槽やテラス付きの中庭を備えたサブサハラアフリカ最大の前近代的建築であった。1331年にイブン・バットゥータがキルワを訪れた際には、自身の旅で目にしたなかで最も美しく、優れた都市の一つと評した。"
 mogadishu_desc: "10世紀ごろ、バナディール海岸のソマリ族と通婚したアラブ系およびペルシア系の入植者たちにより、スワヒリ海岸北端にモガディシュが創設され、12世紀までには石造りの家屋、モスク、岸壁の倉庫が立ち並ぶ、繁栄したイスラム都市となっていた。モガディシュの織工たちが生産する名高い「マクディシャウィ布」はエジプトからインドに及ぶインド洋全域で取引され、商人たちは西インド洋の隅々にまで商業圏を広げている。1331年にはイブン・バットゥータが、ベルベル系の血を引くスルタン、アブ・バクル・イブン・サイード・ウマルの統治下にあったこの都市を訪れた。このスルタンの庇護のもと、大モスクでの金曜礼拝にはイスラム世界各地から商人、法学者、スーフィーの神秘主義者たちが集まっている。"
 mombasa_desc: "モンバサは東アフリカ沖に位置する環礁島である。地理学者アル＝イドリシが訪れた12世紀までには、このスワヒリの港町にかなりの規模のイスラム教徒が住むようになっており、西インド洋の商人に停泊所として利用されていた。シラーズィの血を引くスルタンの統治下で、モンバサはスワヒリ海岸における主要な交易地のひとつへと発展。海岸沿いに長く連なる都市国家群の南部においてキルワに次ぐ規模であり、モンバサの埠頭には北部からのアラブのダウ船や、その先の香料諸島を目指すインド船団が迎え入れられていた。そのマングローブに囲まれた港やサンゴ造りのモスクは、アフリカ、アラブ、ペルシアの伝統を融合させ、モンスーンの地ならではの独特で国際色豊かな文化を築き上げた、スワヒリ文明の象徴とも言える存在である。"
 sofala_desc: "スワヒリ海岸の南端、ザンベジ地方がインド洋へと開ける場所に位置するソファラは10世紀以来、アフリカ内陸部の金の主要な搬出港として機能してきた。グレート・ジンバブエ王国で採れた金は長い隊商路を通じてソファラへ運ばれ、キルワなどからモンスーンに乗ってダウ船が運んできた中国の絹、ペルシアの陶磁器、インドの綿花と交換されていた。10世紀にはアラブの地理学者アル＝マスウーディーがこの地を訪れている。その後、キルワのマハダリ朝スルタンの統治下に入ると、ソファラは北方の強力なスワヒリ都市に従属する前哨地となったが、その繁栄はすべて、金交易とモンスーンの風向きに依存していた。"
 gao_desc: "ニジェール川北東の大湾曲部に位置するガオは、8世紀までにはソンガイ王国の首都となっており、そのイスラム化した統治者たちはマリの台頭よりもはるか前から北アフリカと交易をおこなっていた。マンサ・ムーサの征服軍によって14世紀初頭にマリ帝国へと組み込まれて以来、ガオはアフリカの大帝国の主要な朝貢都市の一つとなり、そのダウ船はいまもニジェール川を行き交い、サハラの塩と南部森林の金をトンブクトゥの市場へと集めている。マリの支配下にあってもソンガイの王家は存続しており、未来の帝国復活の種はすでにガオのモスクや交易地区で蒔かれている。"
 djenne_desc: "ニジェール川の内陸デルタの頭頂に位置するジェンネは、紀元前から大規模な集落であり、その近くの前身の都市、ジェンネ＝ジェンノはサブサハラアフリカ最初期の都市文明の一つであった。ジェンネは13世紀後半までに、コンボロ王のもとでイスラム教を受容。トンブクトゥと比肩するサハラ交易都市として栄えた内陸デルタの街の中心には、その王が建設した壮大な泥レンガ造りの金曜モスクがそびえ立っていた。ジェンネの商人はバンプクやブレの金と内陸デルタの綿花を集め、砂漠の塩と交換する。そして、この都市の「バンコ建築」の突き出した木材と土の塔は、サヘル・スーダン地域において一目でそれとわかる特徴を確立した。"
 great_zimbabwe_desc: "グレート・ジンバブエはザンベジ川の南、セヴェ川の上の高い花崗岩の台地に位置する。11世紀から12世紀にかけて、ショナ語を話す人々がモルタルを使わない石造りの建築で、並外れた都市をここに築いた。王国の名は「石の家々」を意味する「ジンバ・ジェマブウェ」から来ており、曲線の壁と円錐形の塔の建築がその由来である。14世紀の最盛期には数百エーカーに及ぶ規模を誇り、1万8000人が暮らしていたとも言われている。統治者たちはスワヒリ海岸に沿ってソファラへ、そこからキルワやインド洋へと向かう金交易を支配していた。ヨーロッパはまだその存在すら知らないものの、市場には石鹸石の鳥の彫刻、中国の磁器の破片、ペルシアやインドのビーズが並べられ、世界的な広がりを持つ文明であることがわかる。"
 kano_desc: "ハウサの伝承によれば、広大なサハラ砂漠の南に広がるサバンナに位置するカノは伝説的英雄バヤジダの子孫たちによって創設されたのだという。井戸を守る大蛇を退治したことで英雄になったバヤジダは、息子たちをハウサの七都市国家の王に据えたが、14世紀までにはカノがこれらの国家のなかで最も強力になっていた。ダラの岩丘は、カノの政治体の発祥地として知られる。泥の城壁に囲まれたカノの染色場ではハウサの職人たちが得意の藍染めの布を生産し、革細工とともにサハラの塩や銅と交易されている。カノの王たちは依然として古いハウサの宗教の儀礼に従って統治をおこなっているが、サハラ交易路に沿ってイスラム教の宣教師や商人たちが王国に進出しつつある。"
 axum_desc: "アフリカでもとりわけ歴史の長い都市の一つであるアクスムは、1世紀から栄えたアクスム王国の首都で、紅海の港アデュリスを通じてローマやインドと交易をおこなった。4世紀にはエザナ王のもと、サブサハラアフリカで初めてキリスト教を国教とした。アクスム人が王墓の上に建てた巨大な花崗岩の石碑はいまも都市の廃墟の上にそびえ立っており、そのなかで最も高いものは500トンの重さがあり、多層階の宮殿が彫り込まれている。1270年にイエクノ・アムラクのもとで新しいソロモン朝が復活すると、14世紀までに実権はアクスムの南へ移ったが、アクスムはいまでもエチオピア・キリスト教の信仰の中心地であり、エチオピア皇帝が戴冠式を挙げる場所である。言い伝えによれば、シオンの聖マリア教会に契約の箱そのものが密かに置かれているという。"
 mayapan_desc: "北ユカタンの乾燥した平原にある堅固な城壁の内に築かれたマヤパンは、マヤの古都チチェン・イッツァの後継として13世紀後半に台頭した。マヤの年代記によれば、古い都市の統治者の血統であると主張するココム一族によって創設されたのだという。ココム家の統治者たちは新しい首都からユカタン全域から集まった同盟諸侯の連合を率い、従属する家系の長たちに対し王の監視下で首都に居住することを義務付け、その忠誠を確実なものにした。チチェン・イッツァの神殿を模した小さな建造物群は、この地の文明がより古く壮大な伝統の継承者であることを物語っているが、ユカタンの小王たちを一つの連合にまとめあげたマヤパン同盟の政治的偉業は、紛れもなく独自の成果である。"
 chan_chan_desc: "アンデス山脈が太平洋へ急激に落ち込み、何年も雨が降らないことがあるペルー北部の海岸砂漠において、12世紀から14世紀にかけて歴代のチムー王が先コロンブス期における南米最大の都市チャン・チャンを築き上げた。その城壁内には、壮麗な王宮「シウダデラ」が数多くそびえ立っている。そのひとつひとつが一人の統治者のために建てられ、その死とともに封印される独立した宮殿施設である。それぞれの施設の泥れんがの壁は波や海鳥のリズミカルなレリーフ模様で覆われ、チムーの人々の海洋的起源を物語っている。首都チャン・チャンからチムー王たちはアンデス史上最も長い海岸帝国の統治をおこない、千キロに及ぶ灌漑や漁業、金属加工の共同体が、その中心にある砂漠都市へと貢ぎ物を納めている。"
 cholollan_desc: "広大なメキシコ中央高原にそびえるポポカテペトル火山の麓の街、チョロランには、先コロンブス期最大の建造物で、人工の山を意味する「トラチウアルテペトル」という壮大なピラミッドがある。紀元前数世紀に建設が始まり、トルテカやその後の文明によって次々と拡張されたこの建造物には広大な基盤があり、その上にはチョロランの神聖なる神で羽毛の生えた蛇のケツァルコアトルを祀る神殿がいまなお立っている。この都市はトルテカからオルメカ・シカランカ、そして現在の統治者であるトルテカ・チチメカ族の手に渡ってきたが、いまなお中央高地で最も重要な巡礼地であり、盆地の新しい統治者たちがケツァルコアトルの神官たちに権威を承認してもらうために訪れる場所でありつづけている。"
 qusqu_desc: "アンデスの高地の谷間、現地の人々が四方の地と呼ぶ土地の中心に、小さな都市クスコが位置する。はるか昔、世界のヘソを意味する「クスク」と呼ばれたこの都市は、伝説によると、姉妹であり妻でもある女性とともにチチカカ湖から現れたマンコ・カパックが金の杖を突き立てた地に築かれたのだという。13世紀から14世紀初頭にかけ、この都市はチャンカ族、ケチュア族、アヤルマカ族などの近隣勢力と南部アンデスの優位を争う、小さな地域勢力だった。のちに「サパ・インカ」の称号を冠するクスコの統治者たちは、次の世代がはるかに大きな野望を打ち立てて南部アンデス全域へと進出できるよう同盟関係や戦士たちを集めている。"
 roskilde_desc: "シェラン島北岸の深いフィヨルドのほとりに位置するロスキレは10世紀、デンマークを統一したイェリング朝の王たちの本拠地としてその名を知らしめた。ロスキレ初の石造りの教会は、その敷地内に眠るハーラル1世自身によって建てられたものである。デンマーク王室の霊廟があり、強力な司教座の所在地であるロスキレは、12世紀から13世紀にかけてデンマーク王国第一の都市に成長し、その壮大な赤レンガの大聖堂は北部ヨーロッパにおける煉瓦ゴシック建築の最初期の例の一つである。14世紀初頭には、エーレスンド海峡の港町コペンハーゲンが発展し、商人が離れつつあったが、国王たちが3世紀以上にわたって戴冠し埋葬されてきたロスキレはデンマークの精神的な中心地でありつづけている。"
 kobenhavn_desc: "狭いエーレスンド海峡を挟んでスコーネを望むシェラン島東岸のハウンは、国王ヴァルデマール1世が養兄弟のアブサロン司教に下賜した小さな漁村だった。1167年ごろ、アブサロン司教がバルト海のヴェンド人の海賊を鎮圧するべくスロッツホルメン島に要塞化された城を築くと、この要塞は後継者たちによって、商人の港を意味する「ケブマンスハウン」へと発展。夏には魚の大群が集まるエーレスンド海峡にて、豊かなニシンの漁場を支配した。デンマーク国王とロスキレ大司教が所有権を激しく争うこの都市は、エーレスンド海峡における要衝としての立地により、バルト海の交易を着実に引き寄せている。"
 lund_desc: "10世紀末、スヴェン1世によってスコーネの領地の中心に創設されたルンドは、1103年にローマ教皇パスカリス2世が全スカンジナビアの大司教座へと昇格させ、北部教会をハンブルク・ブレーメン大司教区から切り離したこと、極めて重要な地位を占めるようになった。アセル大司教のもとで着工された偉大なロマネスク様式の大聖堂は1145年に聖別され、現在も街で大きな存在感を示しており、その地下祭室には、名高い天文時計と巨人フィンの像が安置されている。1152年にはニダロスも大司教区に昇格し、1164年にはウプサラがそれに続くが、ルンドはデンマーク教会およびスコーネに対する首位権を維持し、その大司教はデンマーク王国における最高位の聖職者のなかに名を連ねている。"
 oslo_desc: "伝承によると、オスロは1049年ごろ、ハーラル3世により広大なオスロ・フィヨルドの奥に創設されたのだという。1070年には司教座が置かれ、中世の数世紀のあいだにノルウェー王国の主要な町のひとつへと発展。ホーコン5世マグヌソンは、スカンジナビア本土の政治的中心に近づくために王宮をベルゲンからオスロに移し、1299年に王国の首都に定めた。1300年ごろに着工された壮大なアーケシュフース要塞は、王の新たな野望の象徴として港の上にそびえ立っている。アーケシュフースの岩壁と司教地区のあいだには木造家屋がひしめき合い、商人たちはノルウェー内陸部の木材や毛皮を、バルト海沿岸港の穀物や布と交易している。"
 nidaros_desc: "ニデルヴァ川がトロンデラーグの大フィヨルドに注ぎ込む河畔に位置するニダロスは、国王のオーラヴ・トリグヴァソンによって997年ごろに創設された。キリスト教化を進めた後継者のオーラヴ・ハラルズソンは、1030年のスティクレスタズの戦いで戦死し殉教聖人として崇敬され、この地に埋葬された。彼の聖廟の上に建てられた大聖堂は北方世界で最も神聖な巡礼地となり、アイスランド、グリーンランド、ブリテン諸島から信徒を引き寄せた。1152年には、ノルウェー本土から西の海の植民地にまで及ぶ大司教座に昇格。王国の首都が南のベルゲン、そしてオスロへと移ったあとも、ニダロスはノルウェーの精神的な中心地であり、歴代の国王が戴冠し、永遠の王である聖オーラヴが王国を見守る場所でありつづけている。"
 abo_desc: "オーボはフィン人をキリスト教の支配下に置いた、1240年代の第2次スウェーデン十字軍を契機に創設された。アウラ川の河口に位置し、フィン人にトゥルクと呼ばれたこの町は、フィンランド南西沿岸におけるスウェーデンの主要な拠点へと発展。1300年には司教区に昇格し、新たに聖別された大聖堂はフィンランド教会の精神的中心地となった。そして町の波止場はフィンランド内陸部とストックホルム、さらにその先のハンザ同盟都市を結ぶバルト海交易を引き寄せるようになった。バルト海南部の巨大なハンザ同盟の港湾都市と比べればまだまだ小規模ではあるものの、オーボはスウェーデン王国領フィンランドの行政および信仰の中心地としての役割を担っており、その司教はスウェーデン教会において最高位の聖職者たちと肩を並べている。"
 kalmar_desc: "スウェーデン本土と細長いエーランド島のあいだの海峡が狭まる南東沿岸に位置するカルマルは、12世紀を通じて壮大な石造りの城を中心に発展。この城は、スウェーデン王国でもとりわけ強固で歴史が長い王室要塞の一つであった。カルマルの港はスウェーデン南部の主要な玄関口で、鉄、銅、バターをリューベックのハンザ商人や、さらにその先の地へと送り出していた。1276年には、国王マグヌス3世から特権を授与され、この街は王国有数の都市としての地位を確立。デンマークとスウェーデンの国境というその戦略的な立地と堅固な城壁により、重要な交易港であると同時に軍事的な要衝でもあったカルマルは、14世紀初頭にはデンマークの野望に対抗するスウェーデン王室の南の防壁としての役割を担っていた。"
 falun_desc: "ダーラナ地方の巨大な赤いティスカショーベリエット山の斜面には、中世ヨーロッパ最大かつ最も生産量の多いストラ・コッパベリエ銅山がある。この銅山は遅くとも9世紀にはスウェーデン産業の要となっており、1288年には採掘所を運営していた鉱山会社「ストーラ・コッパルベリ・ベルグスラッグ」に対し国王マグヌス3世が正式な特権を与えたことで、世界最古級の共同商業企業の一つとなった。湖畔に位置する鉱夫の集落ファルンは巨大な採掘所を中心に発展し、生じる煙と赤い酸化粉塵は何キロにもわたって家々や土壌を染め上げ、溶鉱炉から流れる銅はスウェーデン領内のみならず北ヨーロッパ全土の市場へと供給されている。"
 uppsala_desc: "質素な大聖堂の町から数キロ離れた場所に位置する、古代のガムラ・ウプサラはかつて、ブレーメンのアダムが黄金の大神殿について記述した異教の中心地であり、そこではトール、オーディン、フレイの3柱の偶像が祀られ、9年ごとに人間や獣が生贄として捧げられたという。ここの平原には、いまもユングリングの王たちの墳丘墓がそびえ立っている。スウェーデンのキリスト教への改宗により祭祀場は接収され、1164年には教皇アレクサンデル3世がウプサラを全スウェーデン大司教座に昇格させたことで、スウェーデン教会はルンドのデンマーク首位権から分離された。そして1287年、教座は数キロ南の新しい町エストラ・アロスへと移された。そこでは壮大なレンガ造りのゴシック大聖堂の建設が始まっており、完成すればスカンジナビア最大のものとなり、その祭壇ではスウェーデン王たちが国内最高位の聖職者によって戴冠されることになる。"
 skara_desc: "ヴェーネルン湖とベッテルン湖という2つの大湖に挟まれた、ヴェステルイェートランドの平原に位置するスカーラは、スウェーデン初の司教区として1014年にオーロフ・シェートコヌング王により創設された。ドイツ人宣教師のトゥルゴットがその初代司教に着任した。キリスト教信仰は、この質素な平原の町からまだ異教徒が半数を占めたスウェーデン王国へと広まっていったのだ。1150年に「善良」の尊称で知られるベント司教が壮麗なロマネスク様式の大聖堂を奉献すると、スカーラは何世紀にもわたってヴェステルイェートランドの精神的中心地となる。影響力においてはウプサラやリンシェーピンの影に隠れて久しいものの、スカーラ司教はいまもスウェーデン王国屈指の高位聖職者としての威厳を保ち、その大聖堂参事会とスカーラ年代記は、王国における初期キリスト教時代の記憶を伝えつづけている。"
 linkoping_desc: "ストックホルムから南部諸王国に続く街道とストーング川が交差する、エステルイェートランドの内陸平野に位置するリンシェーピンは、12世紀初頭に司教座へと昇格し、それ以来長きにわたりスウェーデン王国の最も重要なキリスト教信仰の中心地の一つとなっている。12世紀に建設が始まった、地元の石灰岩で淡灰色に輝く荘厳な大聖堂は、着実な拡張を経てスウェーデンでもとりわけ野心的なゴシック建築の一つとなった。いまやリンシェーピン司教の位は、王国の高位聖職者のなかでウプサラ大司教の次に位置する。1248年、近くのスケニンゲで教皇特使モデナのウィリアムによって招集された大教会会議では、スウェーデン教会に聖職者の独身制が課され、広いキリスト教世界のラテン教会法体制への組み込みが決定的となった。"
 soderkoping_desc: "ストロー川がバルト海へと注ぐ、波風から守られた河口に位置するセーデルシェーピングは、12世紀から13世紀にかけてスウェーデン王国屈指の重要な港へと発展した。その埠頭は、スウェーデン内陸部の鉄や銅を積み込んで南方の市場へと運ぶリューベックやヴィスビューのコグ船で混雑している。大規模なドイツ人市民共同体がリューベック法由来の特権のもとで統治する王立直轄の市場町であり、国王戴冠式や条約交渉、そして毎年夏にバルト海全域から商人者を集める大市を開催してきた。水路の緩やかな堆積が港湾を脅かしはじめているものの、14世紀初頭のセーデルシェーピングは依然としてスウェーデン東海岸における主要な交易拠点の一つである。"
 lodose_desc: "ヴェーネルン湖から海へと流れる大河、イェータ川のほとりに位置するロドセは、水辺と険しい西の丘陵地に挟まれた狭い土地にある木造の河港で、大西洋や北海交易に向けたスウェーデン唯一の出口となっている。その埠頭からはスウェーデンの船がノルウェー、イングランド、そして低地諸国の都市へと出航し、鉄や皮革を西方の市場の織物やワインと交易している。また、ここに設置された王立造幣所は、遅くとも12世紀からスウェーデン王国の硬貨を造ってきた。イェータ川下流域をめぐるデンマーク、ノルウェー、スウェーデンの領土拡大の企みが交錯するなか、その所有権がつねに外交上の争点でありつづけたロドセは、スウェーデン唯一の大西洋への出口として、王国随一の戦略的価値があった。"
 jonkoping_desc: "スモーランド高地とエステルイェートランド平野が隣り合うベッテルン湖の南端の街ヨンショーピングは、1284年に国王マグヌス3世から都市特権を授かった。その特許状は、長らく北と南の王国間の重要な会合・交易の場であったこの街の歴史を公式なものにしたにすぎなかった。中央諸州とデンマーク勢力下のスコーネ辺境地域を結ぶ主要街道に臨むその立地により、ヨンショーピングは賑わう市場町、そして国境の要塞になった。港を見下ろす王城は、境界を北へ押し上げようとするデンマークの執拗な野心に備え、着実に強化されていく。ヨンショーピングは14世紀初頭までに、スモーランド経由でスウェーデン中心部に入り込むための政治的・軍事的な要衝になっていた。"
 ribe_desc: "ヴァイキング時代の700年ごろに市場として創設されたリベは、ユトランド西海岸の湿地帯にありながら、潮汐水路により外洋船を引き上げることが可能だった。スカンジナビア最古の町であり、ヴァイキングがブリテン諸島に到達する1世紀以上も前から、リベの商人たちはフリジアやイングランドの沿岸部と交易をおこなっていた。ブレーメンのアダムはここをデンマークの主要な市場と記述しており、9世紀初頭には宣教師アンスガルが教会を設立したことで、スカンジナビア北部におけるキリスト教最初期の拠点のひとつとなった。12世紀にはリベ大聖堂の建設が開始。北海を越えてフリジアやフランドルの港と交易し、デンマーク西海岸の塩や穀物を南方の布やワインと交換している商人の町には、ラインラントのトゥファを用いた壮大なロマネスク建築の大聖堂がいまもそびえ立っている。"
 viborg_desc: "広大な荒野と湖に挟まれたユトランドの中央高原に位置するヴィボーは、異教の時代からユトランドの「ランスティング」の開催地であった。この地方議会では、半島の族長たちが集い、法を論議して王の擁立を宣言する。デンマークの新王は中世を通じ、南のルンドで大司教に戴冠される前に、まずこのヴィボーで承認を受けていたのだ。ヴィボーには司教座と古い王室教会の2つの大聖堂があり、これはその城内に教会と王室の権威が異様なほど集中していたことの証しである。コペンハーゲンが台頭し、デンマークの権力が東に移行したことにより、ヴィボーの日常的な重要性は低下したものの、ランスティングはいまもデンマーク王誕生に不可欠な儀式であり、この町に象徴的な優位性を持たせているのである。"
 odense_desc: "フュン島の中心にあるオーデンセの名は、キリスト教到来のはるか昔にこの地の聖所が奉げられた北欧の神オーディンに由来する。1086年、十分の一税と十字軍の召集に反発した貴族により聖王クヌーズ4世がサン・アルバン教会の祭壇前で殺害されたことで、この町は大きな変貌を遂げる。王の殉教をめぐって信仰が急速に広まり、1101年にはローマ教皇が聖王の列聖を認めると、オーデンセはスカンジナビア屈指の大巡礼地となった。イブシャム出身のイングランド人修道士が聖王の遺骨を安置するベネディクト会の修道院を設立すると、オーデンセは学問の中心地に発展。14世紀初頭までには、シェラン島以西のデンマーク諸島において最も重要な町となった。"
 aarhus_desc: "ユトランド東海岸の、オーフス川がカテガット海峡へと注ぎ込む地にあるオーフスは、ヴァイキング時代の集落として設立された。国王ハーラル1世のキリスト教化に伴いドイツ人宣教師の影響下で設置されたデンマークの4司教区の一つとして、948年にこの街が記録に登場する。波風を防ぐ自然の地形のおかげで、中世を通じてユトランド東部の主要な港となり、ユトランド平原の家畜や穀物をリューベックやハンブルクの市場へ送り出した。また、13世紀にはレンガ造りの大聖堂の建設が始まり、それはいまも商人や漁民の町を見下ろすようにそびえ立っている。政治的な重要性ではヴィボーの、商業的な重みではリベの影に長らく隠れていたものの、オーフスは14世紀初頭までにユトランド半島のカテガット海峡沿岸における最重要の港として揺るぎない地位を確立していた。"
 aalborg_desc: "ユトランド北部を北海からカテガット海峡へと横断するリムフィヨルドの南岸にある街オールボーは海峡の主要な渡航点で、2つの海のあいだを行き交う東西交易を支配しており、オールボー城は木造だった初期の時代も含め、遅くとも11世紀からこの渡航点を守りつづけている。フィヨルドでのニシン漁業は街の商人に富をもたらし、リューベックやヴェンドの港町との活発なハンザ交易を維持している。国王の特権、荘厳なレンガ造りの教会、そして増加する市民層により、オールボーは14世紀初頭までにデンマーク北部の主要都市の一つとなった。ユトランド半島を横断するリムフィヨルドにおけるその立地は、この地域随一の戦略的価値がある。"
 tonsberg_desc: "スノッリ・ストゥルルソンのサガによれば、美髪王ハーラル1世がノルウェーを統一した872年のハフルスフィヨルドの戦いよりも前に、トンスベリは存在していたという。ノルウェー最古の町として知られるトンスベリはオスロフィヨルドに面し、9世紀から10世紀にかけてヴァイキングの艦隊が利用していた波風から守られた港であり、王廷の所在地でもあった。港を見下ろす高台に建つテンスバル城塞は中世ノルウェーにおける主要な王城の一つとなり、12世紀後半に建設されたプレモントレ修道会の壮大な聖オラフ修道院は、この街を学問の中心地とした。ノルウェー国王と僭称者の条約締結、王室による貨幣鋳造、内戦や十字軍の召集など、トンスベリを舞台にした出来事は、ノルウェー史上において不可欠な場所であることを示しており、王国の町においてはベルゲン、ニダロス、オスロに次ぐ重要性を持っている。"
 stavanger_desc: "ライフィルケの大フィヨルド群が北海へと開けるノルウェー南西海岸。その静かな入り江に位置するスタヴァンゲルは、1125年に十字軍王シグル1世によって司教座へと昇格した。さらに王はウィンチェスターの司教であったレイナルドをイングランドから招き、新たな司教座を創設させた。レイナルドのもとで着工され、イングランドのアングロ・ノーマン様式の影響を直接受けたロマネスク建築の大聖堂は、スカンジナビアでも特にイングランドの影響が色濃い聖堂の一つとして、いまも港を見下ろしている。スタヴァンゲル司教区のこの都市はノルウェー王国の主要な宗教的中心地の一つであり、その司教はロガランとアグデルの両教区にまたがる広大な領地を支配している。一方で、その港はノルウェーの西端にあるささやかな漁港のままである。"
 hamar_desc: "ノルウェー内陸の中心部、ミョーサ湖西岸に位置するハマルは、ニコラス・ブレイクスピア枢機卿（後の教皇ハドリアヌス4世）がノルウェー教会の再編とニダロス大司教区の設立を目指す大きな任務のさなか、1152年に司教座へと昇格した。その直後に湖畔で建設が始まった大聖堂は12世紀から13世紀にかけて発展し、ノルウェー内陸部有数の野心的なロマネスク建築の教会となった。山間の谷や湖畔の小教区からなる教区を治めるハマル司教は、王国屈指の高位聖職者に数えられる。14世紀初頭までに、この素朴な大聖堂の町はノルウェー内陸諸州の主要な宗教的中心地となり、その司教区は湖沼地帯やノルウェー東部の山地の精神的な拠点となっている。"
 vyborg_desc: "1293年、カレリア人に対する第3次スウェーデン十字軍遠征のさなかスウェーデン元帥トルケル・クヌットソンによって創設されたヴィボルグは、カレリア沖の岩礁に築き上げられた巨大な石造りの城で、スウェーデン王国最東端の前哨基地にして、ノヴゴロドとの新たな国境を守護する主要な要塞であった。スウェーデンの総督たちは30年間、この城壁からカレリア人やロシア人の襲撃に対する防衛を指揮し、1323年のノーテボリ条約によってスウェーデンとノヴゴロド間の国境が画定されると、ヴィボルグはスウェーデン王国東部の確固たる防壁となった。城の周囲には商業都市が発展を続け、バルト海航路の東の終着点としてカレリアの毛皮、ロシアの蝋、フィンランドの交易品をその波止場へと引き寄せている。"
 burgos_desc: "884年、ディエゴ・ロドリゲス・ポルセロス伯がアルランソン川とヴェナ川の合流点に創設したブルゴスは、9世紀から10世紀にかけてカスティーリャ伯国随一の要塞として発展し、1037年からは大王フェルナンド1世のもとで統合されたカスティーリャ＝レオン王国の主要な王都となった。ブルゴスは「エル・シッド・カンペアドール」と呼ばれたロドリーゴ・ディアス・デ・ビバールの故郷であり、彼の遺骨は近くのサン・ペドロ・デ・カルデーニャ修道院に眠っている。また、キリスト教世界全域からの巡礼者をサンティアゴ・デ・コンポステーラへと導く偉大な巡礼路「カミノ・フランセス」の起点でもある。1187年にアルフォンソ8世が設立したラス・ウエルガス王立修道院には、カスティーリャ国王たちの墓が収められており、1221年に国王フェルナンド3世のもとで着工された壮大なゴシック建築の大聖堂は、中世スペインにおける最高峰の建築的偉業の一つに数えられる。"
 leon_desc: "ローマの#italic Legio VII Gemina#!（第7軍団ゲミナ）がその地に陣営を設立したことがその名の由来となったレオンは、10世紀にカンタブリア山脈の麓からメセタへとレコンキスタを南進させたキリスト教国、アストゥリアス＝レオン王国の首都として隆盛を極め、レオンの王宮とサン・イシドロ大聖堂（11世紀に建立された王室霊廟には20人以上のレオン王の墓が収められている）により、一時期は名声・領土のいずれにおいてもカスティーリャをも凌駕する、王国の精神的・政治的中心地となった。1230年にはフェルナンド3世のもとでカスティーリャと統合され、政治の中心はトレドやバリャドリッドといった南方に移行したものの、レオンはその古代からの王権という象徴的な尊厳を保持しつづけ、1205年に起工され、フランス北部の聖堂を模して建てられた壮麗なゴシック建築の大聖堂は、衰えぬ誇りの輝く象徴としてそびえ立っている。"
 salamanca_desc: "西メセタのトルメス川を見下ろす岩の丘に位置するサラマンカははるか昔、ケルティベリアやローマの町であった。ドウロ川とテージョ川に挟まれた地域への大規模な再入植を進めたアルフォンソ6世のもと、1085年にキリスト教諸王国が再び定住するようになる。決定的な転機は1218年に訪れた。レオン王アルフォンソ9世がここに、高等教育機関「ストゥディウム・ゲネラーレ」を設立したのだ。この大学は驚異的な早さで成長を遂げ、ボローニャ、パリ、オックスフォードと並ぶキリスト教世界の4大大学の1つとなった。1255年には教皇アレクサンデル4世によって「万国教授免許」が認められ、ここで教会法や神学を学ぶ学者たちはすでにヨーロッパのより歴史ある大学の学者たちと肩を並べるようになり、14世紀初頭までには、サラマンカはカスティーリャ王国における知性の中心地になっていた。"
 segovia_desc: "グアダラマ山脈の麓にあるセゴビアでは、花崗岩造りの2層アーチの巨大なローマ水道橋が圧倒的な存在感を放っている。モルタルを使わず1200年以上もフリオ川の水を山々から街へと運んでいるこの水道橋は、スペインに現存する古代土木建築の最高傑作のひとつである。アルフォンソ6世が1085年にトレドを征服するとセゴビアは辺境の町として再入植され、中世の数百年を通じて、王族お気に入りの所在地、そして重要な王立造幣局が置かれる場所へと成長した。カスティーリャの国王たちは川の上の岩山に立つアルカサルに滞在し、裁判をおこない国政を指揮した。メリノ羊が冬はエストレマドゥーラの牧草地に、夏はカスティーリャの高地に毎年移動し、セゴビアの羊毛はフランドルの市場ですでに名を馳せている。"
 avila_desc: "システマ・セントラル山脈の西端、風吹きすさぶ花崗岩の露頭に位置するアビラでは、1090年にライムンド・デ・ボルゴーニャのもとで再入植が進められると、そこから10年足らずのあいだに、レオンとブルゴスの石工たちの手でイベリアにおいて最も完全で堅固な中世の環状城壁が築かれた。88個の半円形の塔と9つの門が岩の台地を縁取り、この城壁に守られた街は再入植が進むカスティーリャの辺境における重要な拠点へと発展。後陣が城壁東部に組み込まれたサン・サルバドール大聖堂をはじめとする市内の聖堂群は、軍事要塞であったアビラを宗教の中心地にもした。14世紀初頭に至っても、都市の城壁はカスティーリャの再入植の比類なき象徴であり、メセタの台地を静かに見守りつづけている。"
 madrid_desc: "9世紀後半にイスラム教徒の前哨基地として建設されたマドリードの名は、周囲の荒野を潤す豊富な泉を意味する「マジュリート」という言葉を由来としている。カリフ領の北方国境に位置する要塞化された農村集落だったが、レオン＝カスティーリャ王アルフォンソ6世がトレドへ向けて進軍した際、1083年にマドリードは無抵抗で占領される。カスティーリャ統治下では王領の質素な町だったが、アルフォンソ8世治下の1202年に「フエロ」が授与され、カスティーリャの巡回宮廷のなかでマドリードの荒野の狩猟場はお気に入りの立ち寄り先となる。そして1309年には、国王フェルナンド4世がマドリードで初めてカスティーリャ議会を招集。これは、近くの帝国都市トレドの長い影に隠れた質素な集落でありながらも、マドリードの行政における重要性が増していることを示す兆候であった。"
 santiago_compostela_desc: "9世紀初頭、隠者ペラヨはガリシアの荒涼とした丘陵にある樫の木立の上に出現した奇妙な星に導かれ、ローマの墓へと足を踏み入れた。イリア・フラヴィアの司教デオデミロはその墓を、使徒ヨハネの兄弟で、エルサレムでの殉教ののち弟子たちによってこの地へ運ばれたと伝えられる使徒ヤコブの埋葬地であると同定した。アストゥリアス王アルフォンソ2世は再発見された墓の上に最初の教会を建立し、11世紀から12世紀にかけて、サンティアゴ・デ・コンポステーラはローマやエルサレムに次ぐキリスト教世界の第3の巡礼地へと成長。使徒ヤコブのホタテ貝は、ヨーロッパのあらゆる場所から訪れた懺悔者の帽子に飾られるようになった。サンティアゴ・デ・コンポステーラ大聖堂は1075年に司教ディエゴ・ペラエスが起工し、多力な司教のディエゴ・ヘルミレスによって継続された壮大なロマネスク建築で、中世ヨーロッパで最も多くの人が行き交った「カミノ・フランセス」の終着点に立っている。コンポステーラ大司教座はラテン・キリスト教世界においてとりわけ強力な領地のひとつで、絶えず争いの火種となっている。"
 zaragoza_desc: "皇帝アウグストゥスによってエブロ川沿いの広大な平野の中心に「カエサルアウグスタ」として創設されたサラゴサは、エブロ川上流の渓谷屈指のローマ都市だった。その後は西ゴート、そして714年にイスラムの支配下に入り、11世紀にはフード朝のタイファ諸王のもと、アンダルス後継国家のなかでもとりわけ文化的に洗練された国の首都となった。サラゴサ郊外にあるアルハフェリア宮殿は、後期イスラム宮廷建築の至宝としていまなお立っている。1118年、アラゴンの武人王アルフォンソ1世がレコンキスタにおいて偉大な勝利を収め征服すると、サラゴサは新生アラゴン王国の首都へと昇格。壮大なムデハル建築の教会群や王立造幣所、アラゴン議会を備え、アラゴン王冠領の政治および宗教の中心地となった。"
 valencia_desc: "トゥリア川沿岸の広大な平野にローマの植民地「ヴァレンティア・エデタノロム」として建設されたヴァレンシアは、西ゴートやムーアによる支配を経て、「エル・シッド」ことロドリーゴ・ディアス・デ・ビバールが1094年から死去する1099年まで統治した。彼の死後にキリスト教徒の軍が撤退すると、都市は再びイスラムの統治下に戻り、ムラービト朝とムワッヒド朝のもとでアル＝アンダルス有数の大都市として繁栄し、その灌漑農地「ウエルタ」と柑橘類の果樹園は、地中海全域でその名を馳せていた。アラゴンの征服王ハイメ1世は、東部レコンキスタ最長の包囲戦を展開し、1238年10月9日に凱旋入城を果たす。アラゴン王国のもとに征服王が創設した新しいヴァレンシア王国は、灌漑農業やウエルタの「水裁判所」、そして都市の繁栄の多くを引き継いだ。"
 palma_desc: "ローマがバレアレスと呼んだ諸島の一つ、波静かな湾にローマの植民地「パルマリア」として建設されたパルマは、ヴァンダル王国とビザンツ帝国の支配を経て902年にコルドバ・カリフ国により占領され、繁栄するイスラム都市「マディナ・マユルカ」へと発展した。その後、アラゴンの征服王ハイメ1世が1229年に大規模の十字軍の船隊を率い、一気にこの島を攻略。そして1276年、息子のハイメ2世にバレアレス諸島、ルシヨン、モンペリエからなる小規模ながら豊かな領土のマヨルカ王国が与えられた。14世紀初頭、ハイメ3世治下のマヨルカ王国はアラゴン王国の独立した属国として存続しており、その首都は西地中海有数の商業港として成長し、金色の砂岩造りのパルマ大聖堂「ラ・セウ」が港を見下ろすようにそびえ立っている。"
 girona_desc: "ピレネー山脈東部の4つの川の合流点に位置するジローナは、アウグスタ街道沿いに置かれたローマの都市「ゲルンダ」を起源としており、古代より要塞都市であった。9世紀以降はカロリング朝の伯爵たちが領主となり、イスラム教のアル＝アンダルスに対抗するスペイン辺境領の先鋒としてこの地を統治した。13世紀までには、ジローナはカタルーニャ君主国の主要都市の一つへと発展し、その司教区はアラゴン連合王国でも屈指の地位を占め、そのユダヤ人街「カル」は多くの学者や医師が活動し繁栄していた。1285年には、シチリアの晩祷に端を発するアラゴン十字軍のさなか、フランス王フィリップ3世による包囲を受けたものの、ジローナは防衛戦に勝利。フォルミゲス諸島でフランス艦隊を撃破したということもあり、この勝利はカタルーニャ市民が誇りとする記憶の一つとなった。"
 pamplona_desc: "紀元前75年、セルトリウス討伐の遠征において、ローマ将軍ポンペイウスが「ポンパエロ」として創設したパンプローナは、824年にイニゴ・アリスタが初代国王に即位して以来、バスク・ロマンス系のナバラ王国の首都である。パンプローナは元々のバスク系住民のナバレリア、フランク人商人のサン・セルニン、そしてのちのフランス系移民のサン・ニコラスという3つの地区に分かれるが、対立が絶えず抗争も起こるためそれぞれが壁で区切られた異様な都市構造をしており、この都市の政治の悪名高き御し難さを表している。1328年以来カペー家の支家であるエヴルー家の支配下にあり、パンプローナを首都とするナバラ王国は、カスティーリャとアラゴンの両大国が台頭するなか、ピレネーの諸王国で唯一独立を維持しており、この都市の司教と商人はバスク、ロマンス、フランクの流れを組む独自のアイデンティティを築いている。"
 malaga_desc: "紀元前8世紀にティルスから来たフェニキア人によって「マラカ」として創設されたマラガは、いまも経済の支柱である魚の塩漬け産業をその名の由来としている。マラガは約3000年にわたりイベリア半島南部沿岸の主要な港の一つであり、コルドバ・カリフ国、そしてグラナダのナスル朝首長のもとでアル＝アンダルスの海の玄関口として発展した。マラガの港にはマグリブ交易で絹、奴隷、香辛料が入り、アクサルキアの肥沃な後背地で生産された有名な甘口ワインとアーモンドが地中海全域へと出荷される。港の丘には、11世紀にハンマード朝の首長たちによって築かれ、少しずつ拡張されていった城塞がそびえ立っている。マラガのジェノヴァ商人の居留地、なめし加工地区、そして豊かな市場農園は、経済の中心地としてナスル朝を支えている。"
 almeria_desc: "10世紀初頭にアブド・アッラフマーン3世によってコルドバ・カリフ国の巨大な海軍基地として創設されたアルメリアは、11世紀のタイファ諸王のもとアル＝アンダルス屈指の富裕な都市として目覚ましい発展を遂げた。絹織物職人や青銅細工師はレバントやマグリブへ高級品を輸出し、造船所からはピサやジェノヴァと西地中海の制海権を一時競り合ったガレー船が出航した。黄金時代にあったアルメリアは、第2次十字軍さなかの1147年、キリスト教勢力であるカスティーリャ、アラゴン、ジェノヴァ、ピサの連合艦隊により征服されたことで破滅的な打撃を受けた。その10年後にはムワッヒドの軍勢によって奪還されたものの、都市が完全に立ち直ることはなく、14世紀初頭までに、アルメリアはナスル朝グラナダ王国に第2の都市として組み込まれた。その工房からいまも生み出される絹織物は、往時の繁栄を物語っている。"
 coimbra_desc: "モンデゴ川が大西洋に向かって北へと折り曲がる地点には、急勾配の丘がある。そこに位置するコインブラは、ローマ時代には「アエミニウム」と呼ばれており、のちに近くの古い廃墟の町「コニンブリガ」から取った名を与えられた。1064年にレオンの大王フェルナンド1世がムーア人から奪還すると、キリスト教領となったポルトガル伯領の主要都市に発展し、アフォンソ1世と後継者たちのもとで1139年から1255年にかけ、新たに独立したポルトガル王国の首都を務めた。初期のポルトガル年代記や王国の騎士道物語が執筆されたのもこの地である。アフォンソ3世が宮廷をリスボンに移したあとも、コインブラは文化・宗教において強力な役割を維持し、1290年にディニス1世によって設置され、リスボンとのあいだを何度も移転した高等教育機関「ストゥディウム・ゲネラーレ」は、この都市をイベリア半島有数の学問の中心地へと発展させた。"
 braga_desc: "ローマ皇帝アウグストゥスが「ブルカラ・アウグスタ」として創設したブラガは、ガラエキア州の州都であった。イベリア半島でも特に歴史の長いキリスト教都市の一つであり、3世紀にはすでに司教区が設置されていた。その全ヒスパニアの首座大司教座に対する権利の主張は、使徒の時代から続く伝統に裏打ちされた重みを持っている。西ゴート、スエビ、ムーアの歴代の統治者はいずれもブラガの教会における卓越した地位を承認し、レコンキスタのあとの1070年に復興されたブラガ大司教区は、イベリア教会の首座権をめぐってトレドと数世紀にわたる争いを繰り広げた。壮大なロマネスク建築のブラガ大聖堂は1070年に着工され、中世の数世紀を通じて着実に拡張されていった。その大司教座はポルトガル北部の宗教に関する諸事を管轄するだけでなく、政治的状況が好ましいときにはガリシアやアストゥリアスの教会に対しても首都大司教の権威を振るっている。"
 evora_desc: "はるか昔、アレンテージョ南部の広大な波打つ平原の低い丘の上にケルト系ルシタニア人が築いたエヴォラは、ローマの「エボラ・リベラリタス・イウリア」となり、そのディアナ神殿の遺構はいまも旧市街の中心にそびえている。1166年には、「恐れ知らず」の異名を取った伝説のジェラルド・ジェラルデスが大胆な夜襲を敢行し、ムーア人からエヴォラを奪還した。そして12世紀から13世紀にかけ、この都市はキリスト教圏のアレンテージョにおける中心都市となり、司教座の所在地、そしてポルトガルのアヴィス騎士団やカラトラバ騎士団の拠点へと成長し、14世紀初頭までにポルトガル王国有数の都市となった。12世紀後半に着工されたその壮大なロマネスク建築の大聖堂は、いまやアヴィス朝贔屓の所在地となったこの街を見下ろしている。"
 merida_desc: "紀元前25年、カンタブリア戦争の退役軍人のための植民地としてアウグストゥスにより創設され、ローマのルシタニア州の州都となったメリダは、西ローマ帝国屈指の華麗なる大都市へと発展した。メリダの劇場、円形劇場、競技場、水道橋、そしてグアディアナ川の大橋は、11世紀にわたる衰退に耐え、いまもこの地の景観を彩っている。西ゴート王国の支配下でも極めて重要な司教座でありつづけ、イスラム教徒による征服後はカリフ国の西部辺境における主要都市のひとつとなった。1230年のレオン王アルフォンソ9世による奪還後、メリダを与えられたサンティアゴ騎士団はここに本部を設置した。ローマ時代の遺跡がいま見下ろすのは小さな国境の町だが、メリダは依然としてキリスト教のエストレマドゥーラ進出における重要な要衝であり、現在もカスティーリャの強力な騎士団の重要な拠点である。"
 tarragona_desc: "第2次ポエニ戦争後、ローマがカタルーニャ沿岸の岬にタッラコの州都として創建したタラゴナは、ヒスパニア・キテリオルを統治した地方総督の所在地となり、西ローマ帝国屈指の都市、そしてイベリア半島における最初期のキリスト教共同体のひとつへと発展した。しかし714年、イスラムの侵略者による略奪で破壊され、1118年に正式に復興されるまでの4世紀のあいだ、住む者がほぼいない状態にあった。その後、タラゴナ大司教区がカタルーニャ教会の大司教座、そしてアラゴン連合王国の最高位聖職領として再建し、アラゴン、カタルーニャ、ヴァレンシアの各教会と管轄権を精力的に争った。14世紀初頭までには、その建設の過程でロマネスク様式からゴシック様式へと移り変わった壮大な大聖堂が古代ローマの城壁の上にそびえ立ち、古からの尊厳を徐々に取り戻しつつある都市の象徴となっている。"
 murcia_desc: "ウマイヤ朝の首長アブド・アッラフマーン2世が825年に「ムルシヤ」として創設したムルシアは、広大な灌漑農地「ウエルタ」が沿岸平野へと開くセグラ川の湾曲部に位置し、11世紀にはタイファ諸王のもとでアル＝アンダルス南東部における中心都市へと発展。ムルシアでは絹織物、陶器製造が繁栄し、イブン・アル＝バンナの学派がもたらしたアラビアの数学および天文学の学問が花開いた。ムルシア王国は1243年にアルカラズ条約のもとでカスティーリャ王国の宗主権を受け入れ、1266年にアラゴン王ハイメ1世によって反乱が鎮圧された後、賢王アルフォンソ10世によってカスティーリャ王冠領へと完全に組み込まれた。カタルーニャ人やアラゴン人の再入植が進み、ムルシアは14世紀初頭までに、南のグラナダのナスル朝に対するカスティーリャの主要な国境都市となった。"
 cadiz_desc: "紀元前1100年ごろ、イベリア半島南部の海岸から大西洋へと突き出た細長い砂州に、ティルスから来たフェニキア人が要塞を意味する「ガディール」、いまのカディスを創設した。カディスは西ヨーロッパでも特に古くから人が住んでいる都市の一つであり、港には3000年にわたりフェニキア、カルタゴ、ローマ、西ゴート、そしてムーアの船が停泊してきた。ローマはこの地を「ガデス」と呼び、詩人や元老院議員、そして名高い踊り子たちが暮らす、帝国西部で最も富裕な都市の一つへと発展させたが、帝国の緩やかな衰退と歩調を合わせるかのように、ムーアの支配下では慎ましい漁村に縮。1262年に賢王アルフォンソ10世がカディスを奪還すると、カスティーリャの国境港として再入植が進められた。14世紀初頭のカディスは、カスティーリャ王国南部の主要な玄関口の一つまでに復活し、大西洋に面したその港は、その先の大海原を見据えている。"
 jaca_desc: "アラゴン川上流のピレネー山脈の谷間、フランスからの巡礼路がソンポール峠から下ってくる場所に位置するハカは、11世紀初頭に誕生したアラゴン王国のラミロ1世によって最初の首都に定められた。1063年、ハカの大教会会議でハカの司教座が承認され、1077年ごろには、国王サンチョ1世がイベリア半島でも特に古く、影響力の大きい都市特許状の一つである、名高き「フエロ」を授けた。この特許状はフランク人の商人や職人をサンティアゴへと続く街道沿いに引き寄せ、アラゴンやナバラの町々で広く模倣された。同時期に着工された壮大なロマネスク建築のサン・ペドロ大聖堂は、スペイン最古級の大聖堂の一つである。レコンキスタの進展に伴い、アラゴンの宮廷は南方のウエスカ、そしてサラゴサへと移ったが、14世紀初頭におけるハカは、いまもアラゴンとフランスを結ぶ誇り高き北の玄関口であり、巡礼路の重要な中継地である。"
 san_sebastian_desc: "木々に覆われたモンテ・ウルグルの麓、ビスケー湾の狭い入り江に位置するサン・セバスティアンは、殉教者の聖セバスティアンを祀る修道院を中心に発展。1180年ごろにナバラの賢王サンチョ6世が特許状を授与すると、内陸国ナバラ待望の海への玄関口となる。1200年にカスティーリャのアルフォンソ8世がギプスコアを併合すると、サン・セバスティアンはカスティーリャ王国の支配下となるが、王国は町の特権を引き継ぎ、漁業と海運業においてガスコーニュ語を話す市民を優遇した。遠洋でのクジラ漁が盛んで、港から出る船はカスティーリャ産の鉄と羊毛をボルドーやその先へと運び、ワインを満載して戻ってきた。海とともに生きる城壁の町サン・セバスティアンは14世紀初頭までに、バスク沿岸で最重要の港の一つとなった。"
 perpignan_desc: "ピレネー山脈と地中海に挟まれたテート川の平野の街ペルピニャンは、10世紀に初めて歴史に登場する。ルシヨン伯の首府として台頭し、1172年には伯領とともにアラゴン連合王国の支配下に入った。そしてアラゴン王ハイメ1世の死に伴い、後継者たちに領土が分け与えられると、ペルピニャンは1276年、ハイメ2世のもとで新しいマヨルカ王国の本土における首都となった。ハイメ2世は町を見下ろす高台に見事なマヨルカ王宮を建設。織物職人が紡ぐ有名なルシヨンの織物、そしてカタルーニャとフランスを行き交う交易によって富を得たペルピニャンは、服飾業やなめし加工の中心地として繁栄した。14世紀初頭のペルピニャンはマヨルカ王国の本土における拠点であり、繁栄した市場町で、名産の織物は西地中海の多くの人々の衣類として愛用されている。"
 alicante_desc: "古代より峻険なベナカンティル山の麓に位置し、ギリシャ人からは白い岬を意味する「アクラ・レウケ」、ローマ人からは「ルケントゥム」、イスラム教徒からは「マディーナト・ラカント」と呼ばれたアリカンテは、山の上の要塞に守られた地中海沿岸の小さな港だった。1248年に後のカスティーリャ王アルフォンソ10世が征服するも、カスティーリャが継承問題で揺れていた1296年にアラゴン王ハイメ2世が奪取。トレリャスで画定した占領地分割を経て、1308年にヴァレンシア王国へと編入される。ベナカンティル山の城塞に守られたアリカンテは14世紀初頭までに、アラゴン連合王国の南の交易港としての役割を担うようになり、太陽に恵まれた後背地で産出されるワイン、アーモンド、エスパルト草を輸出している。"
 cartagena_desc: "カルタヘナは紀元前227年ごろ、地中海有数の天然港にカルタゴの将軍ハスドルバルが創設し「カルト・ハダシュト」と名付けたことを起源とする。ローマが「カルタゴ・ノヴァ」に改称すると、後背地の銀山で富を築き、大規模な海軍基地となった。カルタヘナは紀元前209年に、カルタゴとの戦争中にスキピオ・アフリカヌスが奇襲したことで有名である。カルタヘナの司教区はヒスパニアでも特に歴史の長いものの一つであったが、長年の衰退とイスラム教徒の征服により、かつての偉大な港は古代の面影もないほどに零落。その後1245年にカスティーリャのアルフォンソ王子が奪還し、司教座を再建した。14世紀初頭のカルタヘナはカスティーリャ王国の国境に位置する戦略的に不可欠な港であり、慎ましくも壮麗な湾は南海岸を往来する艦隊をいまも庇護している。"
 algeciras_desc: "アルヘシラスは711年、ベルベル人指揮官のターリク・イブン・ズィヤードによって、イスラム教の征服者たちがイベリア半島へと初めて足を踏み入れた地に創設された。緑の島を意味する「アル＝ジャジーラ・アル＝ハドラー」は、海峡西岸の港を守る小島がその由来である。6世紀にわたってマグリブからの軍勢や商人にとっての主要な上陸地であり、アル＝アンダルスと北アフリカを結ぶ不可欠な足がかりだった。ウマイヤ朝、アルヘシラスのタイファ、ムラービト朝、ムワッヒド朝と、統治者が変遷してきたこの都市は14世紀初頭において、紛争地であるイベリア半島におけるマリーン朝の要衝であり、その堅固な二重構造の港は、アフリカの兵士や黄金が海峡周辺の紛争地帯へと流れ込む主要な玄関口であった。"
 gibraltar_desc: "711年、ターリク・イブン・ズィヤードがイベリア半島征服のため軍とともに上陸した地点に因み、その地の巨大な石灰岩に「ジャバル・ターリク」（ターリクの山）という名が付けられた。何世紀ものあいだ、海峡を監視する見張り所にすぎなかったが、1160年にムワッヒド朝のカリフ、アブドゥルムウミンがこの岩山を要塞化し、海峡を掌握するべく城壁に囲まれた町と城塞を築くと、勝利の都市を意味する「マディーナト・アルファス」と名付けた。1309年にカスティーリャ王国が短期間占領するが、直後にイスラム勢力が奪還。14世紀初頭のジブラルタルはマリーン朝の統治下にある係争地で、その切り立つ巨岩は、2つの海と2つの大陸を結ぶ要衝を見下ろすかのごとくそびえている。"
 marbella_desc: "セラニア・デ・ロンダ山脈の麓の肥沃な沿岸平野に位置するマルベージャは、ローマの入植地からイスラム教の都市「マルバッリャ」へと発展。その城壁に囲まれたアルカサバは、ブドウやイチジク、そして穏やかな気候がもたらす恵みに富んだ海岸を守っていた。南部沿岸の小規模ながらも栄えた港として、後背地の果物や絹の輸出と、温暖な地中海の漁業を生活の基盤としていたこの都市は、14世紀初頭までにグラナダのナスル朝の一部となり、要塞化された沿岸都市群の一角としてイベリア半島における最後のイスラム領土の海岸線を防衛している。"
 fez_desc: "フェズは800年頃、その名の由来となった川の両岸に、イドリース朝によって設立された。コルドバからのアンダルス難民とカイラワーンからのアラブ系の入植により急速に発展し、その2つの地区がこの都市の不変の気風を形作った。859年にファティマ・アル・フィフリによって寄進されたカラウィーイーンの大モスクと大学は、フェズをイスラム教世界における屈指の学術の中心地へと押し上げ、地中海全域から法学、神学、科学の学者を引き寄せた。マリーン朝がムワッヒド朝に取って代わると、フェズを首都に定め、1276年には旧市街の傍らに宮殿、庭園、集団礼拝用のモスクを備えた王立地区「フェス・アル・ジャディード」を建設した。14世紀初頭、フェズはマリーン朝スルタン国の政治と知の中心地として、その栄華の絶頂にあった。"
 marrakesh_desc: "雪を戴く大アトラス山脈の麓の広大なホウズ平原の端に、ムラービト軍の司令官アブ・バクル・イブン・ウマルが砂漠の野営地として1070年に創建したマラケシュは、驚異的な早さでセネガルからエブロ川に及ぶ帝国の首都へと発展。その後ムラービト朝、そして1147年の征服後はムワッヒド朝のもとで、マラケシュは宮殿や庭園、クトゥビーヤ・モスクの高いミナレットで彩られた都市となり、その水は独創的な地下水路「ケタラ」によって山々から運ばれていた。マラケシュの名はヨーロッパの旅行者が口にするうちに変わっていき、最後には国そのものを指す言葉「モロッコ」となった。マリーン朝が首都を北方のフェズに移したものの、14世紀初頭のマラケシュは依然として南部の偉大な首都であり、アトラス、スース、そして砂漠へのキャラバン交易路を結ぶ玄関口である。"
 sijilmasa_desc: "757年、サハラ砂漠北端にあるタフィラルト地方の、ナツメヤシが生い茂るオアシスに創建されたシジルマサは、サハラ交易の北の終着点として大きく発展した。ベルベル人のラクダのキャラバンが砂漠を越えてガーナやマリの金を運び、ここで地中海の塩や布、生産品と交換されたのだ。そして何世紀にもわたり、シジルマサの造幣所で製造されたディナール金貨が西イスラム世界全域の商業の潤滑油となり、その商人たちは2大陸を行き来し、途方もない富を築いた。独立した王朝のもとで繁栄していたシジルマサは、その後近郊で台頭したムラービト朝に屈したものの、14世紀初頭においてもなお、マリーン朝にとって欠かすことのできない砂漠の玄関口であった。ただ、キャラバン交易路が緩やかに変化しており、シジルマサの古代からの繁栄を脅かしつつある。"
 rabat_desc: "12世紀半ば、ムワッヒド朝のカリフ、アブドゥルムウミンによって、ブー・レグレグ川の河口を守る要塞化された「リバト」としてラバトは創設された。その孫のヤアクーブ・マンスールのもと、この野営地は壮大な野望の象徴となった。1195年のアラルコスの戦いに勝利すると、ヤアクーブ・マンスールはこの地を「勝利の陣営」を意味するリバト・アルファスと名付け、広大な帝国の首都とすることを決意。集団礼拝用の大規模なモスクの建設に着手したが、巨大なミナレットであるハッサンの塔は彼の死によって未完のままとなり、潰えた夢の記念碑として立ちつづけている。壮大な都市だったラバトはムワッヒド朝とともに衰退し、14世紀初頭には巨大な未完成の城壁に囲まれた小さな町となり、ブー・レグレグ川対岸のより古い都市サレとともに大西洋を望んでいる。"
 sale_desc: "ブー・レグレグ川が大西洋に注ぐ北岸に位置するサレは、中世モロッコ有数の港町へと発展し、サレの商人たちは内陸産の穀物、羊毛、皮革、蝋をイベリア半島やイタリアのキリスト教都市や地中海の市場へと運んだ。1260年にはカスティーリャ艦隊による凄惨な略奪に見舞われたが、その後マリーン朝のスルタンたちが街を再建・要塞化し、立派な集団礼拝用のモスクや有名なマドラサで飾った。14世紀初頭のサレは富と文化に満ちた交易都市であり、その港には2つの海を行き交う船で混雑する。そして学者や法学者により、この街の学問は内陸の大都市にも匹敵するとの評判がもたらされている。"
 ceuta_desc: "2つの海と2つの大陸を分ける海峡に臨む、アフリカ沿岸の都市セウタ（アラビア語では「サブタ」）は、古代より数多くの国が西地中海において渇望した港の一つであり、その穏やかな停泊地はマグリブとアル＝アンダルスを結ぶ自然の渡航点であった。精巧な真鍮製品や美しい写本で知られるセウタは交易の一大集散地として、アフリカとヨーロッパを行き来する金や交易品を扱っていた。商人貴族であるバヌ・アル＝アザフィ家のもとで自治を長く維持し、羨望の的であった。マリーン朝とグラナダのナスル朝が領有権を争ったセウタはその繁栄と立地が相まって、14世紀初頭においても海峡の輝ける至宝でありつづけている。"
 tangier_desc: "地中海が大西洋へと開ける海峡の西口を守るタンジールは、モロッコでもとりわけ古い都市の一つで、フェニキアの交易拠点でもあり、マウレタニア・ティンギタナという州の名の由来となったローマの「ティンギス」でもあった。タンジールは戦略的価値の高い港を有していたため、何世紀ものあいだヴァンダル、ビザンツ、ウマイヤ、ムラービト、ムワッヒドの支配を受け、いずれもアフリカとヨーロッパを繋ぐ玄関口としてこの都市を重要視した。14世紀初頭のタンジールは慎ましくも普遍的な重要性を持つマリーン朝の港であり、海峡の支配権を争ういかなる勢力も、大陸の隅にあるこの地を無視することはできない。"
 taza_desc: "エル・リーフ山脈と中アトラスのあいだの狭い峠にあるターザは、東西モロッコを容易に行き交うことができる唯一の経路を古代から守る、戦略上最重要の要塞都市である。1130年代にムワッヒド朝の指導者アブドゥルムウミンがここでその権力を確立し、マラケシュ攻略への足がかりとした。また、大モスクが建築されたのもこの時代である。マリーン朝も初期にこの街を征服し、フェズへと続く街道を守る重要拠点とした。城壁に囲まれたターザは14世紀初頭までに、マリーン朝の重要な東の玄関口を抑え、長くモロッコ全土を統治するための要衝となっている。"
 meknes_desc: "メクネスは、その名の由来となったメクナサ・ベルベル人が10世紀に創設した都市で、中アトラスの北に広がる肥沃な平野の拠点としてムラービト朝が要塞化した。長らく近隣のフェズの影に隠れていたものの、果樹園やオリーブ畑、穀物畑に囲まれたメクネスは市場町へと発展。マリーン朝はこの地を優遇してモスクや優れたマドラサを建てた。農業が盛んで水も豊富なことから王国の穀倉地帯と発展したメクネスは、14世紀初頭には庭園と市場が広がる繁栄した地方都市となり、その戦略的立地と豊かな後背地は輝かしい未来を予感させている。"
 taroudant_desc: "大アトラス山脈とアンティアトラス山脈のあいだ、スースの肥沃な渓谷にあるタローダンは、川の恵みを受けて南部の豊かな農業地帯の中心都市として長らく栄え、その穀物やオリーブ、サトウキビ、そして果樹園からの恵みで名を馳せた。城壁都市のタローダンはムラービト朝が覇権を握る途上の1056年、最初に攻略した街のひとつとなった。それ以降、スース全域の中心地および市場としての役割を担うようになり、渓谷の産物や砂漠のオアシスから運ばれてくる品々がここに集まった。14世紀初頭のタローダンは、山岳、平原、砂漠の十字路に位置し、果樹園と市場を擁する城塞都市として、南部の繁栄を支えつづけている。"
 aghmat_desc: "大アトラス山脈の麓に位置するアグマトは、マラケシュが存在するはるか昔からホウズ地方の中心都市であり、山々や平野の産物とサハラ交易の品々が行き交う繁栄した市場であった。ムラービト朝がすぐ近くに新たな首都を創設する前、アグマトは彼らの初期の拠点として利用された。王座を失ったセビリアの詩人王アル＝ムータミドが追放され、1095年の死までの最期の日々を過ごしたのもこの地で、彼の墓は哀愁漂う巡礼の地となった。マラケシュの台頭によって影が薄くなったアグマトは、14世紀初頭には小さな町へと衰退し、かつての栄光は客死した王の詩のなかで忍ばれるだけとなった。"
 tinmel_desc: "大アトラス山脈の辺境の谷間にあるティンメルの山塞は、ムワッヒド運動の発祥の地である。12世紀初頭、神の一体性の教義を説くマフディー、イブン・トゥーマルトはベルベル人の信奉者たちを集め、ムラービト朝を打倒しマグリブ全域とアル＝アンダルスを征服することとなる革命の火蓋を切った。彼の墓とその傍らに建てられた巨大な城塞モスクにより、ティンメルはムワッヒド朝のカリフたちの信仰の中心地、そして王朝の聖域となり、峰々に抱かれた聖地として守られた。ムワッヒド朝が倒れて久しい14世紀初頭には、ティンメルは崇敬されつつも閉ざされた聖地となり、そのモスクは山々で生まれた帝国の記念碑として佇んでいる。"
 volubilis_desc: "丘陵地帯の肥沃な高原にあり、後のメクネスの近郊に位置するヴォルビリスは、ローマでは「ワリーリー」と呼ばれたマウレタニア・ティンギタナ州西部の首都であり、ローマ帝国の最果てにありながら凱旋門、大聖堂、搾油所、そして見事なモザイク画を誇る裕福な辺境都市であった。古代末期にローマ軍は撤退したものの、町はベルベル人のもとで存続。788年には、この町の近郊にイドリース1世が身を寄せ、モロッコ初のイスラム王朝の創始者となった。14世紀初頭のヴォルビリスは、古代ローマ遺跡と小さな集落が隣り合う野原で、倒れた円柱が興亡を繰り返した帝国の名残りを留めている。"
 anfa_desc: "大西洋沿岸の広い湾を見下ろす緩やかな丘に位置するアンファは、漁業、後背地の肥沃なシャウイア平野での農業、そして西海岸の海上交易を生活の基盤としていたベルベル人の港町であった。内陸の大王朝からの独立を長年守ってきたこの町は、沿岸を航海する船を狙う大胆不敵な航海者や海賊の巣窟として近隣で悪名を馳せた。14世紀初頭のアンファはマリーン朝の辺境に位置する小規模ながらも活気あふれる大西洋の港であり、その船乗りたちは魚や掠奪品を求めて海洋沿岸を航行している。"
 azemmour_desc: "大西洋へと注ぎ込む雄大なウム・エル＝ルビア川の河口を見下ろす断崖に位置するアゼンムールは、海と川とともに生きる古くからの港町であり、何よりも毎年春に大群れをなして川を遡上するシャッドで知られている。その港は後背地の肥沃なドゥカラ平原の穀物や羊毛を扱い、イベリア半島や地中海の商人たちと取引をおこなった。14世紀初頭のアゼンムールはモロッコの大西洋岸で城壁に囲まれ、漁業と交易で繁栄する港町であり、町に生命をもたらす川とともにその盛衰を重ねている。"
 asfi_desc: "大西洋沿岸の低い崖の下にある湾に抱かれたアスフィは、後背地のアブダ平原の穀物や羊毛、農産物を集め、西の海へと輸出する古い漁業・交易港である。その港は、モロッコ南部の交易品を求めるジェノヴァ、カタルーニャ、ポルトガルの商人たちを引き寄せ、漁師たちは大西洋の豊かな海で操業した。14世紀初頭のアスフィはマリーン朝南部の主要な大西洋の玄関口の一つとなっており、内陸部の産物とキリスト教都市の交易船が出会うその港は、小規模ながらも賑わっている。"
 asilah_desc: "海峡の少し南、大西洋沿岸に位置するアシラは、モロッコでも特に歴史の長い港の一つである。古代人には「ジリス」と呼ばれたフェニキアとカルタゴの交易拠点で、ローマ人にはマウレタニア・ティンギタナ州の港の一つに数えられた。数世紀のあいだで、その城壁と埠頭の統治者は何度も移り変わり、海峡の玄関口に近い大西洋岸という立地から、交易と争奪がつねにおこなわれていた。14世紀初頭のアシラはマリーン朝の小規模な要塞港で、大西洋沿岸の交易を担っており、その城壁は紛争多き海域を航海する艦隊から街を防衛している。"
 larache_desc: "ルーコス川が大西洋へと流れ込む場所に位置するララシュは、古代フェニキアの植民地であるリクスの遺跡の近くで発展した。リクスは大西洋沿岸でもとりわけ古い交易拠点の一つで、伝説ではヘスペリデスの園があった場所とされている。この町は川や海での漁業、湿地の塩、そして港を通過する穀物や商品の交易によって成り立っていた。14世紀初頭のララシュはマリーン朝の小さくも有用な大西洋の港であり、波風を遮る地形の河口は、荒れる大西洋に臨む沿岸における避難港となっている。"
 tetouan_desc: "地中海から内陸へ少し入ったエル・リーフ山脈の麓の肥沃な谷にあるテトゥアンは、近隣のセウタの攻略を進める軍事拠点として、1286年ごろにマリーン朝のアブ・サービト王子によって再建・要塞化された。河口がもたらす天然の要害に位置し、背後に山々、前面に海というその立地は天然の要塞であると同時に、リーフ地方と沿岸部を結ぶ交易の集散地ともなった。14世紀初頭のテトゥアンは、地中海交易路やモロッコ北部の山道を守るマリーン朝の城壁都市として、さらに重要性が増している。"
