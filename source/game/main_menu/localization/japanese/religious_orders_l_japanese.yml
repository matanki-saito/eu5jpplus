 # Types
 iberian_military_order_type: "イベリア宗教騎士団"
 iberian_military_order_type_desc: "レコンキスタから生まれたこの騎士団は、騎士の剣と修道士の誓いを一つにしている。騎士団は[holdings|E]を拠点として、ムーア人から国境地帯を守り、領地から兵を徴集して、王権の及ばない地域に守備隊を置いている。"
 RELIGIOUS_ORDER_TYPE_ACTIVE_ORDERS_TITLE: "活動中の騎士団"
 RELIGIOUS_ORDER_TYPE_CALLINGS_TITLE: "利用可能な[callings|E]"
 monastic_order_type: "修道会"
 monastic_order_type_desc: "観想的なカトリック修道士の共同体。その[holdings|E]は祈りと学問、土地の耕作に充てられている。"
 mendicant_order_type: "托鉢修道会"
 mendicant_order_type_desc: "清貧を誓ったカトリック修道士の共同体。領地を持たず、施しを乞うことを選ぶ。町や都市で説教や教育をおこない、貧者を助けている。"
