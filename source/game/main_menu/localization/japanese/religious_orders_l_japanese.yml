 crusaders_calling: "十字軍騎士"
 crusaders_calling_desc: "十字軍の戦線において、異教徒と戦うことを認可された騎士団。"
 wardens_calling: "監視官"
 wardens_calling_desc: "長く維持されてきた国境の守備を認可された辺境の騎士団。"
 confidants_calling: "腹心"
 confidants_calling_desc: "王朝とその統治を支える、王家に忠実な騎士団。"
 mariners_calling: "航海士"
 mariners_calling_desc: "海上で戦い、キリスト教圏の外を探索することを認可された海洋十字軍騎士団。"
 contemplatives_calling: "観想修道士"
 contemplatives_calling_desc: "祈りと典礼に専念し、世俗から離れて禁欲的な生活を送る修道会。"
 scholars_calling: "学者"
 scholars_calling_desc: "写本の複製、聖職者の教育、芸術と科学の発展に貢献する教育的宗教団体。"
 cultivators_calling: "開墾者"
 cultivators_calling_desc: "荒れ地を開墾し、修道院領として耕作する修道士と助修士で構成された改革派の宗教団体。"
 preachers_calling: "説教師"
 preachers_calling_desc: "説教、異教徒の改宗、教義の擁護に身を捧げる宗教団体。"
 almoners_calling: "施し手"
 almoners_calling_desc: "清貧を誓い、施しで得た糧を人々に分け与え、貧者や病人を支える宗教団体。"
 confessors_calling: "聴罪師"
 confessors_calling_desc: "共同生活を送り、告解を聞き、優しく人々の魂を導く宗教団体。"
