 # Iberian military orders
 order_of_calatrava_religious_order: "カラトラバ騎士団"
 order_of_calatrava_religious_order_desc: "1158年、テンプル騎士団が放棄したカラトラバ要塞を守るため、シトー会修道院長フィテロのレイモンドによって創設された。カスティーリャで生まれた最初の軍事騎士団である。"
 order_of_santiago_religious_order: "サンティアゴ騎士団"
 order_of_santiago_religious_order_desc: "1170年頃、サンティアゴ・デ・コンポステーラへの道を行く巡礼者を守り、ムーア人に対し聖戦をおこなうために設立された。"
 order_of_alcantara_religious_order: "アルカンタラ騎士団"
 order_of_alcantara_religious_order_desc: "1166年頃にサン・フリアン・デル・ペレイロ騎士団として誕生し、1218年にアルカンタラの町を与えられたことで、その名を冠することとなった。"
 order_of_christ_religious_order: "キリスト騎士団"
 order_of_christ_religious_order_desc: "1319年、ポルトガル王ディニスにより、解散したテンプル騎士団の後継として認可された。テンプル騎士団のポルトガルの領地を受け継ぎ、トマールに修道院を置いた。"
 order_of_avis_religious_order: "アヴィス騎士団"
 order_of_avis_religious_order_desc: "聖ベネディクトゥス戒律に従うポルトガルの騎士団。1211年頃に与えられたアヴィスの町にちなんで名付けられた。"
 order_of_montesa_religious_order: "モンテサ騎士団"
 order_of_montesa_religious_order_desc: "1317年、アラゴン王ハイメ2世によって、アラゴン連合王国内の解散したテンプル騎士団と聖ヨハネ騎士団の所領を引き継ぐため創設された。本拠地はヴァレンシアのモンテサ城に置かれた。"
 benedictine_order_religious_order: "ベネディクト会"
 benedictine_order_religious_order_desc: "6世紀にヌルシアのベネディクトゥスが著した戒律を守る黒衣の修道会。西方修道院制度の礎を築いた。修道院長は教会の大領主の一員に数えられる。"
 cistercian_order_religious_order: "シトー会"
 cistercian_order_religious_order_desc: "1098年に創設された、シトー修道院を発祥とする改革派の修道会。原点に立ち返り、聖ベネディクトゥス戒律を厳格に守ることを目指した。白衣の修道士と平修士は、土地の開墾と修道院領の耕作に長けている。"
 augustine_order_religious_order: "アウグスティヌス会"
 augustine_order_religious_order_desc: "聖アウグスティヌスの戒律に従って共同生活を送る、修道士とも世俗司祭とも言い切れない司祭たちの共同体。修道院は大聖堂に奉仕し、学校や病院を運営して、教区を司牧する。"
 dominican_order_religious_order: "ドミニコ会"
 dominican_order_religious_order_desc: "ドミニコ・デ・グスマンによって、学問と言葉で異端に対抗するべく設立された説教者修道会。修道士たちは大学で教鞭を執り、キリスト教世界の主要な教会で教義を説いている。"
 franciscan_order_religious_order: "フランチェスコ会"
 franciscan_order_religious_order_desc: "アッシジのフランチェスコが設立した「小さき兄弟団」で、キリストに倣って絶対的な清貧を誓った。町の貧者とともに暮らし、施しを受けながら、自らの生き方をもって教えを説いている。"
