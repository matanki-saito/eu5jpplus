 TRADE_ORDER_MIN_PROFIT_TT: "この注文では、この基準を下回る[trades]は実行されず、最低限の利益が確保される。\n\n最低利益を負の値に設定するか、無効にした場合、[trade_order]は赤字となる[trades]も実行でき、実質的に[trade]を助成することになる。\n\n交易品の最高の[trade]利益が、設定した最低利益の基準に近いほど、その商品に割り当てられる交易許容量の増加速度は遅くなり、増加量も小さくなる。また、交易品の価格急落を避けるため、交易許容量をすべて使用しない場合もある。交易品の最高の[trade]利益が最低利益の基準を大きく上回るほど、その交易品に割り当てられる交易許容量はより速く増加する。"
