 TRADE_ORDER_MODE_FOOD: "食糧重視"
 TRADE_ORDER_MODE_NEEDS: "不足重視"
 TRADE_ORDER_MODE_PROFIT_WITH_ICON: "@gold!$TRADE_ORDER_MODE_PROFIT$"
 TRADE_ORDER_MODE_FOOD_WITH_ICON: "@food! $TRADE_ORDER_MODE_FOOD$"
 TRADE_ORDER_MODE_NEEDS_WITH_ICON: "@shortage! $TRADE_ORDER_MODE_NEEDS$"
 TRADE_ORDER_MODE_PROFIT_TT: "この注文は、選択した交易品と市場のなかで最も利益の高い[trades|e]に[merchant_capacity|e]を割り当てる"
 TRADE_ORDER_MODE_FOOD_TT: "この注文は、食糧が不足していて、[food_stockpile|e]が[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]未満の市場へ最も多くの[food|e]を届ける[trades|e]に[merchant_capacity|e]を割り当てる"
 TRADE_ORDER_MODE_NEEDS_TT: "この注文は、対象市場の[goods|e]不足を項目ごとに順番に補うべく、[merchant_capacity|e]を割り当てる。[stockpile|e]が[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]未満の交易品のみが供給される"
 TRADE_ORDER_MODE_PROFIT_INFO: "この注文は利益優先：選択した交易品と市場のなかで最も利益の高い[trades|e]に[merchant_capacity|e]を割り当てる。"
 TRADE_ORDER_MODE_FOOD_INFO: "この注文は食糧優先：食糧が不足している市場へ最も多くの[food|e]を届ける[trades|e]に[merchant_capacity|e]を割り当てる。\n\n支援対象は、この注文がなければ食糧が減少し、[food_stockpile|e]が[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]未満である市場に限定される。[food_stockpile|e]が[GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%]未満の場合、この注文はさらに最大量の[GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%]を毎月補充する。[food_stockpile|e]が[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]を超える場合、市場は供給済みとみなされ、何も受け取らない。\n\n注文元の市場の[food_stockpile]が[GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%]未満の場合、輸出は一時停止され、[GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]未満になるとキャンセルされる。"
 TRADE_ORDER_MODE_NEEDS_INFO: "この注文は需要を優先：リスト内の交易品を指定した順番で補うために[merchant_capacity|e]を割り当てる。\n\n交易品が供給されるのは、対象市場で現地生産量を上回る消費があり、その[stockpile|e]が[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]未満の場合に限られる。この注文は、他国からすでに届いている支援も考慮したうえで、不足を解消するのに必要な量だけ輸送し、輸出だけが原因の不足は無視する。\n\n交易品の[stockpile|e]が[GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%]未満の場合、この注文はさらに最大量の[GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%]を毎月補充する。[GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%]以上[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]未満の場合は、不足分のみを補う。"
 TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "[TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!を割り当てる新しい[trade_order|e]。適用すると、AIがこの注文の[trades|e]を作成する"
