l_japanese:
 mos_prikazi_decision.title: "$prikazi_reform$省庁の設置"
 mos_prikazi_decision.desc: "効率的な行政機構の不在は、[ROOT.GetCountry.GetName]がほかの大国に並ぶ際の障害とみなされる。我々は政府業務のさまざまな分野を監督する省庁を設置することで、行政を改善できるだろう。その結果、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]による各政令の実施を迅速化し、権力の集中化の一助ともなるはずだ。"
 mos_prikazi_decision.desc.entry: "君主が勅令に署名しても、その内容が地方まで伝わるとは限らず、まして実際に従われる保証はない。政務の各分野を受け持つ常設の省庁を設ければ、君主個人の威光に頼るよりも、その意思をはるか遠くまで伝えることができる。"
 mos_prikazi_decision.a: "設置しない選択肢はない。"
 mos_prikazi_decision.b: "手綱を握らないことが成功の秘訣だ。"
 mos_prikazi_decision.tt1: "いくつかの事務局が設置され、[cabinet_members|e]の[cabinet_action|e]によって監督できるようになる"
 enable_prikazi_reform: "[government_reform|e]「[ShowGovernmentReformName('prikazi_reform')]」が利用可能になる"
 mos_prikazi_decision.historical_info: "プリカースは、ロシア・ツァーリ国と初期ロシア帝国の行政機関。彼らはツァーリの政策や決定を実行するために不可欠だったが、国家業務に関連する日常的な機能も備えていた。大きな機関のなかには外交問題を扱うものもあり、ロシアが敵に囲まれ、キプチャクからの独立を主張するのに苦労した時代には、重要な役割を果たした。"
 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
 mos_razriadnyi_decision.desc: "わが国には人口、財産、課税に関する記録がほとんどないため、支出を管理し、行政の拡大に資金を供給することが難しくなっている。新たに設けられた[ShowGovernmentReformName('razriadnyi_reform')]のもとで定期的に国勢調査をおこなうことで、[ROOT.GetCountry.GetName]全体の個人と世帯の詳細な記録を作り、国民の資源と負担を評価することができるだろう。"
 mos_razriadnyi_decision.desc.entry: "臣民の数を把握できていなければ、適切に課税することもできない。わが国も長年、推測に頼ってきた。常設の国勢調査局を設ければ、どれだけの兵員と資金を動員できるのかが明らかになる。戦役を始める前からその規模を知っておくことには、十分な価値がある。"
 mos_razriadnyi_decision.a: "隅々まで調べよ。"
 mos_razriadnyi_decision.b: "プライバシーと完全性の侵害だ。"
 enable_razriadnyi_reform: "[government_reform|e]「[ShowGovernmentReformName('razriadnyi_reform')]」が利用可能になる"
 mos_razriadnyi_decision.historical_info: "#italic Razriadnyi Prikaz#!（ラズリアードニ・プリカース）または軍務府は、新たに国勢調査を導入し、富、財産、社会的地位に基づいて住民の納税義務を決定する手段とした。また、各領地に義務に従って必要な量の兵士や戦争資材を確実に提供させるための手段でもあった。この記録は、広大で多様な領土を統治するために役立った。"
 mos_build_kremlin_decision.title: "クレムリンの建設"
 mos_build_kremlin_decision.desc: "ロシアの大地は幾度となく襲撃されており、困難な時代に国民を守る備えが不可欠である。[target_location.GetName]周辺の要塞網はその役割を十分に果たしておらず、侵攻されれば地域の大国になるという我々の歩みが後退するだろう。\n\n周辺地域のあらゆる城壁に匹敵するような防壁をもつ、堅固な城塞を我々は建設すべきである。"
 mos_build_kremlin_decision.desc.entry: "襲撃者たちが壁の完成まで待ってくれるはずがなく、攻撃を受ければまず持ちこたえられないだろう。[ShowLocationName('moscow')]の防衛を再構築するには莫大な金がかかる。できれば払いたくはないが、街を1つ失うことはそれよりも遥かに大きな痛手となる。"
 mos_build_kremlin_decision.a: "最高級の[ShowGoodsNameWithNoTooltip('lumber')]を用意しろ。"
 mos_build_kremlin_decision.b: "隣国を刺激することは望んでいない。"
 mos_build_kremlin_decision.c: "従属国の[ShowBuildingTypeNameWithNoTooltip('castle')]を資源として接収する。"
 threatened_by_military_expansion: "軍事的拡張による脅威"
 safe_haven_during_raids: "襲撃時に安全な避難場所を提供"
 mos_build_kremlin_decision.tt1: "ライバル関係にある近隣諸国が、堅固な[ShowBuildingTypeNameWithNoTooltip('kremlin')]の建設を敵対的行為とみなす"
 mos_build_kremlin_decision.tt2: "近隣の従属国が、堅固な[ShowBuildingTypeNameWithNoTooltip('kremlin')]を襲撃時の安全な避難所とみなす"
 mos_build_kremlin_decision.a.custom1: "すべての近隣諸国のわが国に対する[opinion|e]が、それぞれ[ShowBiasValue('threatened_by_military_expansion')|+=0]減少する"
 mos_build_kremlin_decision.a.custom2: "すべての近隣[subject|e]のわが国に対する[opinion|e]が、それぞれ[ShowBiasValue('safe_haven_during_raids')|+=0]増加する"
 mos_build_kremlin_decision.b.custom1: "すべての近隣諸国のわが国に対する[trust|e]が、それぞれ#G 3#!増加する"
 mos_build_kremlin_decision.b.custom2: "すべての近隣[subject|e]のわが国に対する[opinion|e]が、それぞれ[ShowBiasValue('lack_of_protection')|+=0]減少する"
 lack_of_protection: "保護の欠如"
 mos_kremlin_construction: "クレムリンの建設"
 mos_build_kremlin_decision.tt3: "必要な[ShowGoodsName('clay')]と[ShowGoodsName('lumber')]のほぼすべてを、従属国のロケーションにある[ShowBuildingTypeNameWithNoTooltip('castle')]を強引に取り壊すことで手に入れる"
 mos_build_kremlin_decision.historical_info: "完成当初のクレムリンは主に木で作られており、その後城壁や塔だけでなく、行政部門なども建てられていった。当時使用されていた簡素な木製の城壁では、度重なるタタール人奴隷の襲撃や敵の包囲に対して効果がなかったため、クレムリンの建設は費用は高くとも必要不可欠な建築プロジェクトだった。"
 mos_vestiarium_decision.title: "宝物目録"
 mos_vestiarium_decision.desc: "王室の国庫は文書化されておらず、目録もないため、蓄積された資産の全体的な価値を把握するのは難しい。富をよりよく管理する手段を構築することが急務である。なぜなら、富は外交目標を推進し、国全体の統治を強化するのに役立つからだ。"
 mos_vestiarium_decision.a: "効率的な管理こそ成功の鍵だ。"
 mos_vestiarium_decision.b: "外交網を張らなければ。"
 mos_vestiarium_decision.custom: "[law|e]「[ShowLawName('vestiarium')]」が利用可能になる"
 mos_vestiarium_decision.historical_info: "ヴァシーリー1世の#italic 宝物目録#!は、王室の宝物庫にある貴重品の目録。貴金属、宝石、織物、衣服、国家的儀式や外交上の贈答品に使用できるものなど、あらゆるものの財政的・目録的記録を作成するために導入された。"
 mos_byzantine_court_ceremonies_decision.title: "旧$BYZ_ADJ$王朝とのつながり"
 mos_byzantine_court_ceremonies_decision.desc: "[ShowLocationName('constantinople')]の没落は、[GetCountry('BYZ').GetName]の旧支配階級に嫁ぐという選択肢を我々に提示した。[sophia_palaiologina.GetName]との結婚は[ROOT.GetCountry.GetGovernment.GetCourtTitle]に[GetCountry('BYZ').GetAdjectiveWithNoTooltip]文化の影響を持ち込むことになり、我々がローマ帝国の自然な後継者であり、[ShowReligionAdjective('orthodox')]信仰の篝火であるという主張を強化できるだろう。そして[ROOT.GetCountry.GetGovernment.GetRulerTitle]の子孫は、没落した帝国の皇帝の子孫であると主張できるようになるはずだ。"
 mos_byzantine_court_ceremonies_decision.desc.entry: "征服によって得た王座は、力ずくで王座を手に入れたことと同義だが、婚姻によって王座に就いた場合はより「継承」に近い印象を与える。[ShowLocationName('constantinople')]の血統をわが一族に取り込むことで、2つの血を受け継ぐ子であれば、単なる征服者ではなく、かつての皇帝たちの子孫であることをいつか名乗れるようになる。"
 mos_byzantine_court_ceremonies_decision.a: "運命的な結婚だ。"
 mos_byzantine_court_ceremonies_decision.a_tt: "わが国の統治者が、ビザンツの支配下にある王朝の子と結婚する。必要であれば現在の伴侶と離婚する"
 mos_byzantine_court_ceremonies_decision.b: "利点はほとんどない。"
 mos_byzantine_court_ceremonies_decision.tt1: "ビザンツの統治王朝の子孫が[character|e]として追加される"
 enable_byzantine_court_ceremonies_reform: "[government_reform|e]「[ShowGovernmentReformName('byzantine_court_ceremonies_reform')]」が利用可能になる"
 mos_byzantine_court_ceremonies_decision.tt2: "一部の外交官に向けられた彼女の憤りが、わが国と近隣の[heathen|e]諸国との外交関係を悪化させる"
 STATIC_MODIFIER_NAME_mongol_intolerance: "モンゴルの不寛容"
 mos_byzantine_court_ceremonies_decision.historical_info: "イヴァン3世とゾイ・パレオロギナの結婚は、モスクワ宮廷に複雑な宮廷儀式と礼儀作法を持ち込み、第三のローマとしての主張をさらに強めることになった。ゾイは11人の子供を生み、悪名高いイヴァン雷帝の祖母となった。モンゴルの支配に対する彼女の不寛容さはいくつかの外交事件を引き起こし、1480年にモスクワ大公国がキプチャクから離反するのを加速させる一因となった。"
 mos_monastic_reformation_decision.title: "ニル・ソルスキーの教えの成文化"
 mos_monastic_reformation_decision.desc: "精神的な先駆者であるニル・ソルスキーは、一部の[ROOT.GetCountry.GetAdjective]修道院に浸透した富と物質主義への対応として、教会内の改革運動を展開している。非所有派として知られる彼の運動は、清貧と謙遜の原則への回帰を提案し、キリストの教えに専念する簡素な生活様式に重点を置くものだ。このような試みは、ある程度の物質的な富を保持することが教会機能の遂行において不可欠であると考えている、既存の教会の抵抗に遭う可能性が高いだろう。"
 mos_monastic_reformation_decision.desc.entry: "ニル・ソルスキーは、土地を所有する修道士が「他に何も所有しない」と主張したところで、その言葉にはすでに説得力がないと説いた。そして教会が神経を尖らせる程度には、これに同意する聖職者がいる。非所有派を支持すれば、裕福な修道院との友好関係を失うことになるが、逆にそうしたものを一度も望んだことのない修道士は、漏れなく忠誠を捧げるようになる。"
 mos_monastic_reformation_decision.a: "非所有派を支持しよう。"
 mos_monastic_reformation_decision.b: "所有派を支持しよう。"
 mos_monastic_reformation_decision.custom1: "[law|e]「[ShowLawName('monastic_reformation_movement')]」が利用可能になる"
 mos_monastic_reformation_decision.custom2: "[law|e]「[ShowLawName('monastic_reformation_movement')]」のもとでの[policy|e]は、10年に一度しか変更できない"
 mos_monastic_reformation_decision.historical_info: "ニル・ソルスキーはロシア正教会の修道士で、非所有派として知られる運動の形成に貢献した。この運動は、修道院が土地や富を所有することを批判し、修道院の清貧を厳格に守ろうとする修道士が主体となった。この教えは変化を拒む教会内の一部勢力からの反対を浴びた。それでも、彼の教えはロシアの精神性に恒久的な足跡を残し、現在ニル・ソルスキーは東方正教会の聖人とみなされている。"
 mos_stroganov_school_decision.title: "ストロガノフ派の地位の確立"
 mos_stroganov_school_decision.desc: "裕福な商家である[ShowDynastyName('stroganov_dynasty')]家は芸術の強力な支援者であり、[ROOT.GetCountry.GetFlavorRank]各地にある彼らの宮殿を飾る聖像画を制作させるため、現地の工房の後援を検討している。この一派によって制作される芸術作品は、私的使用のために特別にデザインされるものであり、国全体の利益にはなりそうにない。だが、権力者の一族の支持を確固たるものにし、[ROOT.GetCountry.GetName]の精神的な幸福に貢献するだろう。"
 mos_stroganov_school_decision.desc.entry: "[ShowDynastyName('stroganov_dynasty')]が求めているのは、一族の礼拝堂に飾るイコンであり、国の各所に建立される聖人像ではない。そして彼らには、その特権を行使するための金を支払う用意もある。その金で地位を確立した流派が国庫の足しになるはずもなく、ただ我々への恩義が一層薄れ、期待だけを高める一族を増長させるのみだ。"
 mos_stroganov_school_decision.a: "お互いに支え合おう。"
 mos_stroganov_school_decision.b: "代わりに彼らの事業を宣伝しよう。"
 mos_stroganov_school_decision.c: "宮廷で影響力を行使させよう。"
 enable_stroganov_influences_cabinet_action: "[ShowDynastyNameWithNoTooltip('stroganov_dynasty')]家の一員が[cabinet_action|e]「[ShowCabinetActionName('stroganov_influences')]」を利用できるようになる"
 mos_stroganov_school_decision.historical_info: "聖像画のストロガノフ派は、ロシアで中世絵画が繁栄していた時代に創始され、のちに東ヨーロッパにまで広がった西洋美術の始まりに先立つものだった。制作された作品は、最終的にはツァーリを含む王侯貴族のパトロンの好みを反映した。この一派はサンクトペテルブルクが設立されるまで人気を博したが、西洋の影響が徐々に定着するにつれて衰退していった。"
 mos_novodevichy_convent_decision.title: "ノヴォデヴィチ女子修道院"
 mos_novodevichy_convent_decision.desc: "[ShowAreaName('smolensk_area')]征服の勝利に続いて、[ShowLocationName('moscow')]の南方の防衛線を強化し[ROOT.GetCountry.GetName]の安全を確保することで、この勝利を記念する機会が訪れた。要塞化された修道院を建設するという案は戦略的な必要性から生まれたものだが、修道院に入ることを余儀なくされた多くの[ShowPopTypeName('nobles')]階級の女性を収容することが可能で、これによって[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の好意も確保できるだろう。"
 mos_novodevichy_convent_decision.desc.entry: "石でできた不朽の証がなんらかの形で残されることになれば、勝利の価値はさらに高まる。[ShowLocationName('moscow')]の南に位置する要塞化された女子修道院は、[ShowAreaName('smolensk_area')]で勝ち取った進入路を守りながら、結婚相手の見つからない[ShowPopTypeName('nobles')]の娘たちを静かに収容していくことだろう。$nobles_estate$が公にその需要を認めることはないだろうが、彼らに取っても都合のいい施設となることは間違いない。"
 mos_novodevichy_convent_decision.a: "支出に見合う価値はある。"
 mos_novodevichy_convent_decision.b: "[ShowLocationNameWithNoTooltip('moscow')]の防備はすでに十分だ。"
 mos_novodevichy_convent_decision.c: "虐げられた女性たちに給金を出そう。"
 mos_novodevichy_convent_decision.historical_info: "ノヴォデヴィチ女子修道院は、スモレンスク地域の征服を記念してヴァシーリー3世によって設立された。この修道院は、都市への西方進入路を守るため、要塞兼宗教施設としての役割も与えられていた。修道院はまた、修道生活を余儀なくされたロシア王家の女性たちに住居を提供した。"
 mos_limit_namestnik_decision.title: "ナメストニクの官職"
 mos_limit_namestnik_decision.desc: "[ROOT.GetCountry.GetName]の遠隔地も統治できるように、ナメストニクには多くの権力が与えられている。この官職は、発生した収入の多くを独占したり、我々に対する忠誠心の維持が困難であったりなど、さまざまな問題をはらんでいる。我々は地域の直接支配を確立し、行政を中央集権化することに取り組むべきである。"
 mos_limit_namestnik_decision.desc.entry: "監督者のいない州を統治する副王はやがて、それが初めから自分の領土であったかのように振る舞い出す。中央から直接統治するようにすれば、ナメストニクたちが現在懐に入れている歳入が返還されるようにはなるが、これまで彼らが築き上げてきた地方の忠誠をすべて失うことになる。"
 mos_limit_namestnik_decision.a: "もはや過去のことだ。"
 mos_limit_namestnik_decision.b: "我々は関与しない。"
 disable_namestnik_policy: "[policy|e]「[ShowPolicyName('namestnik_policy')]」が利用できなくなる"
 mos_limit_namestnik_decision.historical_info: "ナメストニクはロシアにおいて大きな行政権・執行権をもち、遠方の領土で君主の代理人として活動した。その権限はイヴァン4世の治世にいくぶん縮小されたものの、ピョートル大帝がロシアの行政構造全般の改革の一環としてさまざまな改革を実施するまで、その影響力は存続した。"
 mos_posolsky_prikaz_decision.title: "ポソルスキー・プリカース"
 mos_posolsky_prikaz_decision.desc: "[ivan_viskovatiy.GetName]の勤勉な仕事ぶりが実を結び、外交問題のより効率的な処理と官僚制の合理化が実現した。現在、政府のほかの部門に適用されるものと同じ基準を確立するため、外交関連事項などを扱う別の局を設置することが提案されている。"
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$・$Viskovatiy$が外交を担当するようになって久しいが、彼は未だその効率に見合った執務室を与えられていない。彼の才能がこれまで秘かにもたらしつづけてくれた功績を思えば、恒久的にそうした場を提供する約束をしたところで、なんの痛手もない。"
 mos_posolsky_prikaz_decision.a: "賢明な選択だ。"
 mos_posolsky_prikaz_decision.b: "国際的な損害のもとだ。"
 enable_posolsky_cabinet_action: "[cabinet_action|e]「[ShowCabinetActionName('posolsky')]」が利用可能になる"
 mos_posolsky_prikaz_decision.historical_info: "「#italic Posolsky Prikaz#!」（ポソルスキー・プリカース）は、国外業務と外交事務を監督する政府局。外交関係の管理、大使の派遣、国際情勢の管理において重要な役割を果たした。"
 mos_moscow_artillery_yard_decision.title: "[ShowLocationNameWithNoTooltip('moscow')]大砲工廠"
 mos_moscow_artillery_yard_decision.desc: "戦場における大砲技術の進歩に伴い、軍に戦争遂行のための豊富な軍需品を供給することが重要になっている。我々は技術者たちに、大砲の生産に特化した専用施設の設立を課し、[ShowLocationName('moscow')]を技術革新の中心地、そして信頼できる供給元へと変貌させるべきである。"
 mos_moscow_artillery_yard_decision.a: "爆発的な発想だ。"
 mos_moscow_artillery_yard_decision.b: "手間は軍事訓練に費やしたほうがいい。"
 mos_moscow_artillery_yard_decision.historical_info: "モスクワ大砲工廠はイヴァン4世の時代に建設され、ロシアの軍事力強化において大きな役割を果たした。大砲と迫撃砲の生産は、ロシアの軍事的影響力の拡大にとって極めて重要であり、いくつもの紛争におけるロシアの軍事的成功に貢献した。"
 mos_ban_oprichniki_decision.title: "オプリーチニキの襲撃"
 mos_ban_oprichniki_decision.desc: "オプリーチニキは、不忠であるとされた人物の処刑を続けている。最近、農村部にあるいくつかの[ShowPopTypeName('nobles')]の領地が標的となったが、当地に割り当てられた[ShowPopTypeName('peasants')]が、その世帯から出ることを禁じられていたため移住を余儀なくされた。この状況に早急に対処しなければ、食糧不足が蔓延するおそれがある。"
 mos_ban_oprichniki_decision.a: "オプリーチニキは終わりにしよう。"
 mos_ban_oprichniki_decision.b: "我々が関わることではない。"
 STATIC_MODIFIER_NAME_displaced_farmers: "農民の離散"
 disable_oprichnik_policy: "[policy|e]「[ShowPolicyName('oprichnik_policy')]」が利用できなくなる"
 mos_ban_oprichniki_decision.historical_info: "オプリーチニキは、国家の敵とみなされた人々の財産没収に携わった。この政策は、皇帝とその忠実な支持者たちの経済力をさらに強化したが、農民の主人が殺害されるか捕らえられると、彼らは住む場所を失い追い出されるという悪影響をもたらした。これにより、農地は管理されずに放置され、食糧生産に壊滅的な打撃を与えた。"
 mos_aptekarsky_prikaz_decision.title: "アプテカルスキー・プリカース"
 mos_aptekarsky_prikaz_decision.desc: "[ShowGovernmentReformName('prikazi_reform')]改革に従って設置された各政府局は、それぞれ政府機構のなかで適切な役割を果たしている。だが、近年の疫病の流行は、臣民の健康と福祉に関する事柄に改めて焦点を当てる必要性を浮き彫りにしている。我々は、次なる天罰や致命的な疫病が発生したときのために、必要な対応をよりよく調整するための独立した事務局を設立しなければならない。さもなくば、土地を耕し、我らが偉大なる[ROOT.GetCountry.GetFlavorRank]を守るための有能な労働者が不足する危険に見舞われるだろう。"
 mos_aptekarsky_prikaz_decision.desc.entry: "現行のプリカースにはいずれも、感染症の発生に対処したり、疫病に見舞われた地域のための相応しい政策を実施できる充分な設備が備わっていない。既存の省とは別の新しい局を創設し、再び民の間で疫病が流行った際に必要な支援を提供できるようにしておくべきだ。"
 mos_aptekarsky_prikaz_decision.a: "ヒル療法と瀉血を広めよう。"
 mos_aptekarsky_prikaz_decision.b: "必要なのは祈りだけだ。"
 mos_aptekarsky_prikaz_decision.tt1: "アプテカルスキー・プリカースによる社会上層部への医療の優先を、宮廷が喜ぶ"
 enable_aptekarsky_cabinet_action: "[cabinet_action|e]「[ShowCabinetActionName('aptekarsky')]」が利用可能になる"
 mos_aptekarsky_prikaz_decision.historical_info: "アプテカルスキー・プリカースは、医薬品の製造および流通の監督、薬局の規制、公衆衛生に関する問題への対処など、幅広い業務をおこなう政府機関。また、ツァーリとその宮廷の健康管理も担当した。アプテカルスキー・プリカースは、1917年の革命後に解散するまで、帝政ロシアの重要な行政の一部でありつづけた。"
 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
 mos_bolshogo_dvortsa_prikaz_decision.desc: "[ShowLocationName('nizhny_novgorod')]の総督[alexey_lvov.GetName]は最近、オコルニチの任務に就くため宮廷に戻った。この役職は、彼にさらなる管理責任を負わせる上級官吏である。この役割を拡大し、[ShowGovernmentReformName('prikazi_reform')]改革に従って、宮殿の事務と修道院の監督を取り扱う新たな事務局を設立することもできるだろう。この局は宮廷の支出をよりよく管理し、[ShowPolicyName('non_possessors')]の政策が完全に実施されるように努めることになる。"
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$はすでにオコルニチの地位に相応しい信頼を得ており、後はそれに見合った執務室を手に入れるのみだ。宮殿の敷地と修道院を1人の忠臣に任せることができれば、これまでこの2つを別々かつ拙く管理することしかできなかった行政の合理化にもつながるだろう。"
 mos_bolshogo_dvortsa_prikaz_decision.a: "同意できる解決策だ。"
 mos_bolshogo_dvortsa_prikaz_decision.b: "追加の監督者は必要ない。"
 enable_bolshogo_dvortsa_cabinet_action: "[cabinet_action|e]「[ShowCabinetActionName('bolshogo_dvortsa')]」が利用可能になる"
 enable_bolshogo_dvortsa_cabinet_action.tt2: "自分たちに寄せられた信頼に[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]が喜ぶ"
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "アレクセイ・ミハイロヴィチ・リヴォフ皇子は副総督だったが、ツァーリの宮宰に任命されたあと、外交使節団を率いて大使を務めるなど、政府内で急速に出世した。彼は宮殿事務を司る事務局の長を務め、最終的に引退するまでその役割を果たした。"
 mos_greek_latin_academy_decision.title: "$greek_latin_academy$の創設"
 mos_greek_latin_academy_decision.desc: "[ShowLocationName('polotsk')]出身の敬虔な学者が、主に政府高官を対象とした外交言語、すなわち[latin.GetName]語の教育を目的とした言語アカデミーの設立を提案した。[simon_sitnianowicz.GetName]は、しばしば議論の的となるような構想を提案する人物であり、文法、詩学、修辞学を庶民に教授する役割も申し出ている。このような取り組みは、実現のための資金を割り当てることで称賛されるべきである。"
 mos_greek_latin_academy_decision.desc.entry: "わが国の外交官たちは[ShowLanguageName('latin_language')]に堪能ではなく、外交において極めて大きな損失を生んでいる。そこで$name_simeon.east_slavic_language$・$Sitnianowicz$は適切な教育を提案し、[ShowLanguageName('latin_language')]の理解がさらに深まるようにと、庶民的な言葉遣いの講義も申し出た。"
 mos_greek_latin_academy_decision.a: "意思の疎通は重要だ。"
 mos_greek_latin_academy_decision.b: "手間は説教と伝道に費やしたほうがいい。"
 mos_greek_latin_academy_decision.c: "家庭教師として彼を雇おう。"
 mos_greek_latin_academy_decision.d: "民は啓蒙されるべきではない。"
 mos_greek_latin_academy_decision.tt1: "$name_simeon.east_slavic_language$・$Sitnianowicz$が[character|e]として追加される"
 mos_greek_latin_academy_decision.tt2: "[simon_sitnianowicz.GetNameWithNoTooltip]は啓蒙思想の普及と詩作に専念する"
 mos_greek_latin_academy_decision.tt3: "異端思想をもつ人物の追放を見届けることに[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]が満足する"
 mos_greek_latin_academy_decision.historical_info: "シメオン・ポロツキーは、ベラルーシ正教会の修道士、詩人、翻訳家であり、正教会の伝統の確立に貢献したとされる文学的貢献で記憶されている。彼はロシアにギリシャ語とラテン語の教育を導入し、生涯を通じて西洋の神学者たちの著作の翻訳にも携わり、正教会への知識の普及を促進した。"
 mos_collegium_decision.title: "コレギウム"
 mos_collegium_decision.desc: "最近の政府機関の大改革では、省庁の業務重複を防ぐため、より効率的な行政管理が必要とされている。既存の[ShowGovernmentReformName('prikazi_reform')]制度を廃止し、コレギウムに置き換えよう。それぞれのコレギウムは職務と権限がはっきりと区別されており、未解決の案件について助言を求められた場合、それを提供するという業務も加わる。"
 mos_collegium_decision.a: "古きを捨て、新しきを取り入れよう。"
 mos_collegium_decision.b: "行政は繊細なものだ。軽視してはならない。"
 variable_prikazi_tt: "プリカースが国家を統治する"
 enable_collegium_reform: "[government_reform|e]「[ShowGovernmentReformName('collegium_reform')]」が利用可能になる"
 mos_collegium_decision.tt1: "[government_reform|e]「[ShowGovernmentReformNameWithNoTooltip('prikazi_reform')]」とすべての関連する[cabinet_action|e]が利用できなくなる"
 mos_collegium_decision.tt2: "[policy|e]「[ShowPolicyName('dop_law_governing_senate')]」に沿って、[ShowLocationName('neva')]の管理を強化する措置がとられる"
 mos_collegium_decision.historical_info: "元老院の設立後、ピョートル大帝は教会会議や海軍委員会など、統治のさまざまな側面を担当する行政機関として、多様なコレギウムを設置した。これは、隣国スウェーデンで実施された同様の改革からヒントを得たものだった。改革の緊急性は、ロシア帝国の領土数が増加するにつれて高まっていった。"
 mos_sukharev_tower_decision.title: "スハレフ塔"
 mos_sukharev_tower_decision.desc: "海軍は有能な船乗りの安定した供給と、世代間の知識の伝達に依存している。我々の航海への野心に応えるため、技術教育を提供する学校を設立し、軍隊の継続的な拡張のための基礎を築くべきである。最近提出された荘厳な塔の設計図は、そのような施設を収容し、同時に[ShowLocationName('moscow')]の街並みを美しくするだろう。"
 mos_sukharev_tower_decision.a: "野心にふさわしいものだ。"
 mos_sukharev_tower_decision.b: "そのような贅沢は不要だ。"
 mos_sukharev_tower_decision.tt1: "最上階はジェームズ・ブルースのために設計され、星空を望む天文台が設置される"
 mos_sukharev_tower_decision.tt2: "2階には[ShowLocationName('moscow')]のための最先端の給水システムが設置される"
 mos_sukharev_tower_decision.historical_info: "スハレフ塔は、ピョートル大帝がその前年に反旗を翻したストレリツィに勝利したことを記念して、17世紀後半に建設された。塔は1934年にソ連当局に取り壊されるまで、兵舎、教育施設、インフラ、商人の倉庫など、長年にわたってさまざまな用途に使用された。"
 mos_chosen_rada_decision.title: "選抜会議"
 mos_chosen_rada_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の権力は、迅速な意志決定に必要な権力の集中化を妨げている。政府の手続きを迅速化し、貴族の影響力を抑制し、さまざまな問題に取り組み、必要な改革を実施する機会を作り出すために、選ばれた個人からなる評議会を創設することが提案されている。[alexi_adashev.GetName]と[sylvestr_the_priest.GetName]は[ROOT.GetCountry.GetGovernment.GetRulerTitle]の親しい友人であり、評議会に加わることが期待されている。"
 mos_chosen_rada_decision.desc.entry: "寵臣からなる評議会が統治者に仕える立場にある一方、$nobles_estate$は誰の命令も聞かない。これこそが問題だ。アレクセイ・$adashev$と$name_silvester.east_slavic_language$を政府の中心に置けば、決定権を特定の集団に持たせるのではなく、我々の支配下にある室内で物事を決められるようになるだろう。"
 mos_chosen_rada_decision.a: "確かな実力者たちだ。"
 mos_chosen_rada_decision.a_tt: "アレクセイ・$adashev$と$name_silvester.east_slavic_language$が[court|e]に加わる"
 mos_chosen_rada_decision.b: "こんな評議会にはなんの力もない。"
 mos_chosen_rada_decision.tt3: "アレクセイ・$adashev$と$name_silvester.east_slavic_language$が追い詰められ、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]を喜ばせるために処刑される"
 enable_chosen_rada_reform: "[government_reform|e]「[ShowGovernmentReformName('chosen_rada_reform')]」が利用可能になる"
 mos_chosen_rada_decision.historical_info: "選抜会議とは、イヴァン4世の治世初期に重要な役割を果たした顧問団。この会議はアレクセイ・アダシェフやシルベストル司祭のような、大公イヴァン4世にとって信頼できる相談役となる人物で構成されており、権力の集中化、法制度の改革、国家に影響を及ぼすさまざまな問題への対処など、イヴァンの活動にとって欠かせない存在だった。"
 rus_russian_absolutism_decision.title: "行政の完全整備"
 rus_russian_absolutism_decision.desc: "古臭い伝統や非効率的な統治手法を撤廃し、[ROOT.GetCountry.GetName]の統治を近代化する時が来た。[ROOT.GetCountry.GetGovernment.GetRulerTitle]の立法権を強化し、[ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer]の政令が調整・中央集権化された政府機関によって迅速に実施されるようにすることで、我々は進歩し、腐敗や時間を浪費するばかりの訴えから、あらゆる改革の成功を守れるだろう。"
 rus_russian_absolutism_decision.desc.entry: "現実に施行されたときの妥当性を問われる前に、評議会を通過することにすら苦戦するような法令は、すでに半分死んでいるも同然だ。統治者や協力的な単一の省に権力を集中させれば、これまでの試みを悉く頓挫させてきた異議申し立てや遅延に煩わされることなく、改革を推し進めることができる。"
 rus_russian_absolutism_decision.a: "新たな始まりだ。"
 rus_russian_absolutism_decision.b: "古い手法こそ至高だ！"
 enable_russian_absolutism_reform: "[government_reform|e]「[ShowGovernmentReformName('russian_absolutism')]」が利用可能になる"
 rus_russian_absolutism_decision.tt1: "特権や権利をあからさまに無視された[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が激怒する"
 rus_russian_absolutism_decision.historical_info: "ピョートル大帝はその治世において、中世的で時代遅れの政治形態を効果的な独裁政治に置き換えた。1711年、彼は貴族会議を廃止し、元老院を国家の最高機関として設置。ピョートルはこの元老院に中央と地方の行動の調整、歳入の監督、法律の起草をおこなわせた。元老院には衛兵が配置され、民間組織には軍律が適用された。"
 rus_state_controlled_church_decision.title: "政府による後見"
 rus_state_controlled_church_decision.desc: "総主教は相当の権力と影響力を保持しているが、伝統と教会権力の蓄えを優先し、進歩や革新を妨害しつづけている。我々はこの総主教を廃止し、教会に対する政府の統制を強化して、国家への服従を保証する新たな制度を導入しなければならない。"
 rus_state_controlled_church_decision.a: "総主教を廃止する。"
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
 rus_state_controlled_church_decision.c: "総主教を維持する。"
 rus_state_controlled_church_decision.tt1: "聖務会院はすべての出版物に厳しい検閲を課す"
 rus_state_controlled_church_decision.historical_info: "1721年、ピョートル大帝は正教会を国家に従属させるため、モスクワ総主教を廃止した。総主教に代わって、ツァーリの意志を代表する精神的組織である聖務会院が設立された。聖務会院を監督するためにオーベル・プロクロール（宗務総監）が任命され、異教徒を激しく迫害し、出版物に検閲を課した。"
 rus_academy_of_sciences_decision.title: "科学アカデミー"
 rus_academy_of_sciences_decision.desc: "[ROOT.GetCountry.GetName]が国際的な舞台でつねに先頭を走りつづけるためには、知識と科学的探求を培うことが重要である。我々の新たな啓蒙の都に科学アカデミーの設立を提案し、数学、天文学、物理学、化学などの分野における革新の砦としよう。"
 rus_academy_of_sciences_decision.desc.entry: "数学や物理を他所から教わらなければならないような大国は、自国でこれらの学問の功績を上げている国にいつまでも後れを取ることとなる。わが国の最先端の都市に科学アカデミーを創設することができれば、$RUS$もまた後者に属する国であることを、どんな勝利を収めるよりも声高に知らしめることができるだろう。"
 rus_academy_of_sciences_decision.a: "知的能力は軍事力に匹敵しなければ。"
 rus_academy_of_sciences_decision.b: "対話によって進めよう。"
 rus_academy_of_sciences_decision.tt1: "アカデミーと[ShowLocationName('neva')]に対する$name_basil.east_slavic_language$・$tatishchev$の貢献が、アカデミーの設立を大幅に早める"
 rus_academy_of_sciences_decision.tt2: "$name_james$・$Bruce$の文学作品がアカデミーのコレクションに加えられ、学術的資源が充実する"
 rus_academy_of_sciences_decision.tt3: "わが国の優れた頭脳たちが、ヨーロッパじゅうの教育機関と積極的に幅広く意見交換をおこない、外交の道を好む"
 rus_academy_of_sciences_decision.historical_info: "サンクトペテルブルク科学アカデミーは、ピョートル大帝が「大使節団」の一員としてヨーロッパ各地を長く旅したあとに設立された。このアカデミーは、パリ科学アカデミーやロンドン王立学会から着想を得たもので、科学的・学術的研究の促進という同じ目標を共有していた。本アカデミーは、ロシアにおける科学的知識の向上と文化の発展に重要な役割を果たした。"
 rus_manifesto_of_freedom_decision.title: "自由宣言"
 rus_manifesto_of_freedom_decision.desc: "統治能力を発揮するには、強い統治者がしっかりと手綱を握る安定した国が必要である。現時点では、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の決断に対する不満が噴出しており、状況が改善されるまで、少なくとも[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の継続的な支持を確保するのが賢明だろう。[ShowPopTypeName('nobles')]の人権はそのままに国家奉仕から免除する譲歩をおこない、我々が現在の絶対主義的な支配の脆弱性を安定させられるようにしよう。"
 rus_manifesto_of_freedom_decision.desc.entry: "不満を抱える$nobles_estate$を抱える専制統治者は、実のところ専制的ではない。$nobles_estate$を奉仕の義務から解放すれば、国家はその恩恵を享受できなくなるが、王が足場を固めようとする間、陰謀を企てる動機がほとんどないような$nobles_estate$を味方につけることができる。"
 rus_manifesto_of_freedom_decision.a: "必要悪だ。"
 rus_manifesto_of_freedom_decision.b: "妥協点を見つけよう。"
 rus_manifesto_of_freedom_decision.c: "攻撃的に行け。"
 rus_manifesto_of_freedom_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]に与えられた多くの特権は、現統治者の統治期間中は取り消せない"
 revoke_manifesto_of_freedom: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]に与えられた多くの特権は、それを与えた統治者の統治期間中は取り消せない"
 rus_manifesto_of_freedom_decision.tt2: "国の惨憺たる状況を利用した[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が、[target_root_country.GetGovernment.GetRuler.GetName]の統治を妨害しようと積極的に行動する"
 rus_manifesto_of_freedom_decision.historical_info: "「貴族の自由に関するマニフェスト」は、皇帝ピョートル3世の短い治世に発布された。これが出された背景にはいくつかの要因があった。すなわち、地政学的な同盟関係が変化したことによって、ロシアがプロイセンに対して大きな軍事的勝利を収められなかったため、ピョートル3世はほとんどの貴族から敬遠されることになった。統治を安定させるため、ピョートルは貴族の負担を軽減し、その費用を賄うために教会の土地を接収したが、それが却って聖職者を怒らせた。さらにプロイセンの軍事教練を軍に実施させようとして反乱寸前にまで至ったことで、ピョートルは最終的に妻のエカチェリーナによってクーデターで退位させられた。"
 rus_speransky_liberalization_decision.title: "変革の火花"
 rus_speransky_liberalization_decision.desc: "新憲法制度の導入は、進歩的な開拓者であり、適切な変革を指揮するために内閣に留まっている[mikhail_speransky.GetName]の最優先課題である。我々は変化の風を受け入れ、自由の羅針盤だけを頼りに未知の海へと航海するのだ。"
 rus_speransky_liberalization_decision.desc.entry: "生み出す、$name_michael.east_slavic_language$・$Speransky$は何年にもわたり憲法の草案を練り上げているが、未だ誰一人として制定する勇気を持てずにいる。いま彼を支持するということは、まだ完全にはその形を予測できない改革の実施を確約することになる。だからこそ、我々以前の統治者たちは待ちの姿勢を貫いていたのだ。"
 rus_speransky_liberalization_decision.a: "出航だ！"
 rus_speransky_liberalization_decision.b: "論争を巻き起こす危険なものだ。"
 enable_speransky_liberalization_reform: "[government_reform|e]「[ShowGovernmentReformName('speransky_liberalization_reform')]」が利用可能になる"
 rus_speransky_liberalization_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の反対にもかかわらず、[target_root_country.GetName]の管理を近代化するために進歩的な措置がとられる"
 rus_speransky_liberalization_decision.historical_info: "アレクサンドル1世は、改革のビジョンに導かれ、統治期間中に大幅な改革をおこなった。1802年、彼は効率的な統治への取り組みの証として8つの行政機関を設立し、より組織的な行政を導入した。この時代には、ツァーリの重要な相談役かつ近代化の提唱者だったミハイル・スペランスキーの影響が見られた。"
 rus_free_economic_society_decision.title: "自由経済協会"
 rus_free_economic_society_decision.desc: "農業が社会にとって不可欠であることに変わりはないが、それでも[ShowPopTypeName('peasants')]が用いる耕作手法や農業技術は、競合する大国と比較して停滞しており、収穫量も少ない。ある建築家がわずかな費用で、農業と商業の知識を深めるための経済組織の設立を提案し、その運営において主導的な役割を担うことも申し出た。\n\nこの組織が成功を収めれば、次は農民の教育改善や熟練労働者の訓練の推進が必要となり、実用的な助言やこれらを題材とした学術誌や論文の発表が求められるようになるだろう。"
 rus_free_economic_society_decision.desc.entry: "祖父の代と同じやり方で耕作をしている農民が、祖父より多くの人間を養うことは決してない。グリゴリー・$Orlov$は安価かつ自発的に、より良い耕作技術を教授する団体の設立を申し出ている。しかしながら、学術誌への掲載や農民の教育など、依頼の範疇を超えている側面もある。"
 rus_free_economic_society_decision.a: "やはり食物は自分たちで育てなくてはな。"
 rus_free_economic_society_decision.b: "この方法は採らない。"
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "じゃがいもの新品種導入"
 rus_free_economic_society_decision.tt1: "[ShowGoodsName('potato')]の新品種や画期的な栽培方法が導入され、収穫量の増加に貢献する"
 rus_free_economic_society_decision.tt2: "[ShowPopTypeName('peasants')]に対する権力の優位を維持しようとする取り組みを[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が称賛する"
 rus_free_economic_society_decision.historical_info: "自由経済協会は、グリゴリー・オルロフがエカチェリーナ2世の支援を受けて設立した。エカチェリーナは、ロシアの農業慣行が時代遅れであり、イギリスをはじめとする大国に後れを取っていると感じていた。同協会は、新しい農業技術に関する論文を発表し、農作物を紹介し、農民がより効率的に土地を耕し、より多くの食料を生産できるよう教育活動を組織した。"
 rus_imperial_academy_arts_decision.title: "ロシア帝国芸術アカデミー"
 rus_imperial_academy_arts_decision.desc: "先進的な改革者である[ivan_shuvalov.GetName]は、教育制度に対する絶え間ない改革を実施しつづけ、芸術の継続的な支援を貫き通している。[ivan_shuvalov.GetSheHe|U]は、芸術と建築の分野で最高水準を達成するアカデミーを設立しようとしているのだ。このアカデミーは、[ROOT.GetCountry.GetAdjective]の芸術的才能を育成し、特に有望な学生をヨーロッパ各地の革新的な都市に派遣し、さらに経験を積ませることができる。我々はこの構想を受け入れ、[ShowLocationName('neva')]を古典主義の標に変えるために、文化的進歩の拠点を築き上げよう。"
 rus_imperial_academy_arts_decision.desc.entry: "すでに教育機関の改革を済ませた$name_john.east_slavic_language$・$Shuvalov$が次に目指すのは、とりわけ有望な画家や建築家たちを国外に留学させるためのアカデミーの創設だ。そうした芸術家たちが力をつけて戻ってくれば、[ShowLocationName('neva')]にこれ以上ヨーロッパ的嗜好を取り入れる必要もなくなる。"
 rus_imperial_academy_arts_decision.a: "寛大な提案だ。"
 rus_imperial_academy_arts_decision.b: "内閣の業務が優先だ。"
 rus_imperial_academy_arts_decision.c: "余計なことはするな。"
 rus_imperial_academy_arts_decision.tt1: "敬意を集める$name_gregory.east_slavic_language$・$Orlov$が、彼の芸術コレクションの大部分を新設されたアカデミーに寄贈する"
 rus_imperial_academy_arts_decision.tt2: "$name_john.east_slavic_language$・$Shuvalov$が[cabinet|e]の業務に専念して優秀な働きを見せ、公共サービスの水準を引き上げる"
 rus_imperial_academy_arts_decision.tt3: "現在の建築様式が強化され、第二のルネサンスを享受する"
 rus_imperial_academy_arts_decision.historical_info: "ロシア帝国芸術アカデミーは、サンクトペテルブルクのネヴァ川沿いにあった芸術学校。1757年、政治家であり美術愛好家でもあったイヴァン・シュヴァーロフによって設立され、新古典主義の様式と技法を奨励した。当アカデミーは、ヨーロッパの芸術アカデミーの模倣を目指すとともに、外国人芸術家を招いてロシアの学生の指導をおこなわせた。"
 mos_moscow_orphanage_decision.title: "善意の孤児院"
 mos_moscow_orphanage_decision.desc: "新生児の遺棄という、現在問題視されている惨事のひとつに取り組むための注目すべき案が、閣僚の[ivan_betskoy.GetName]から提示された。恵まれない子供たちのために安全な避難所を設け、彼らが社会の生産的な一員に成長するよう、栄養と教育を提供しようというのである。資金の問題は未解決のままだが、この構想を維持するために、いくつかの実行可能な選択肢が検討されている。"
 mos_moscow_orphanage_decision.desc.entry: "誕生時に遺棄された子供がすぐに国の負担になることはないものの、20年後にはなんらかの形で高くつくようになる。$name_john.east_slavic_language$・$Betskoy$がそうした子供たちを有用な臣民に育て上げる避難所の設立を提案しているが、その資金を出してくれる者を見つけないことには話が始まらない。"
 mos_moscow_orphanage_decision.a: "有益な投資だ。"
 mos_moscow_orphanage_decision.b: "価値ある大義だ。"
 mos_moscow_orphanage_decision.c: "我々が介入することではない。"
 mos_moscow_orphanage_decision.tt1: "孤児院が運営資金調達のため、貸付金や貯蓄を管理する複数の民間銀行の口座を開設する"
 mos_moscow_orphanage_decision.tt2: "国庫から資金が惜しみなく提供される"
 mos_moscow_orphanage_decision.historical_info: "モスクワ孤児院は、1763年にエカチェリーナ2世とその政府の大臣で教育改革の偉大な提唱者だったイヴァン・ベツコイの指導のもとに設立された。この施設は、啓蒙思想がロシアやヨーロッパ全土で支持を集めていたころに構想された。資金は豊富にあったにもかかわらず、乳児死亡率は高く、遺棄された子供たちの生活改善の成果は限られていた。とはいえ、一部の子供はこの教育の恩恵を受け、結果として若者の雇用を確保することにもつながった。"
 rus_institute_of_noble_maidens_decision.title: "高潔女学院"
 rus_institute_of_noble_maidens_decision.desc: "女性の教育は依然として活発な議論が交わされているが、このテーマの熱心な提唱者であり、淑女の教育を専門とする教育機関創設のために内閣に加えられた[ivan_betskoy.GetName]が、それを強く推し進めている。教育を受けた女性たちは、家庭と社会の両方に貢献することが期待される。我々は進歩的なアイデアと包括性を重視した適切な組織を作り出し、無知な子育てによる有害な影響から解放された新しい世代の形成を始めよう。"
 rus_institute_of_noble_maidens_decision.desc.entry: "家庭を持つためだけに育てられた女児が、それ以上のことを成し遂げることは決してない。$name_john.east_slavic_language$・$Betskoy$が望むのは、若い娘たちに家庭に入る以上のことを教える施設の設立であり、教育を受けた母親のほうが、無知な母親よりも優秀な次世代を育てられると主張している。"
 rus_institute_of_noble_maidens_decision.a: "建設に取りかかれ。"
 rus_institute_of_noble_maidens_decision.b: "そうした施設を置くなら[ShowLocationNameWithNoTooltip('moscow')]が相応しい。"
 rus_institute_of_noble_maidens_decision.b.tt: "すでに[ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]を設立済みの場合は、これを転用する。設立されていない場合は、[ShowLocationNameWithNoTooltip('moscow')]に[ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')]を建設する。"
 rus_institute_of_noble_maidens_decision.c: "既存の秩序に対する脅威だ。"
 rus_institute_of_noble_maidens_decision.tt1: "設立趣意書が印刷され、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]のすべての少女に送られる"
 rus_printed_charters: "印刷された設立趣意書"
 rus_institute_of_noble_maidens_decision.historical_info: "イヴァン・ベツコイがエカチェリーナ2世の強力な支援を受けて設立した高潔女学院の目的は、女性たちがヴォルテールやロックといった当時の思想家の考えに触れられるようにすることであった。子供たちは幼くして学院に入り、6年間親元を離れることになる。この学院は、社会的地位の低い者の入学を制限するために、何度か移転されるとともに学費を年額で支払わせていた。"
 rus_nakaz_decision.title: "訓令"
 rus_nakaz_decision.desc: "[ROOT.GetCountry.GetName]を啓蒙と進歩の新時代へと推し進めることが、ますます重要になってきている。ヨーロッパ全土に広がりつつある原則に沿った法規範の見直しには、理性、正義、人道主義などの理想を網羅した法典こそが合致するだろう。このような価値観を取り入れることで、社会の発展を妨げている時代遅れの法慣行をようやく脱却することができるのだ。改革の道を歩みはじめ、法のもとでのすべての市民の平等を実現しようではないか。"
 rus_nakaz_decision.desc.entry: "新たな法典を導入する必要性がますます明白になってきているいま、見識ある多くの学者たちが統治者に法の改革を嘆願している。一方で、そうした改革を強制的に実行すれば、政府内の特定組織からの深刻な反発を招く可能性もある。"
 rus_nakaz_decision.a: "進歩は痛みを伴うものだ。"
 rus_nakaz_decision.b: "刑法の改革だけにしておこう。"
 rus_nakaz_decision.c: "気が進まない。"
 enable_nakaz_reform: "[government_reform|e]「[ShowGovernmentReformName('nakaz_reform')]」が利用可能になる"
 rus_nakaz_decision.tt1: "権力の座を脅かされたことに[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]が激怒する"
 rus_nakaz_decision.tt3: "保守勢力への屈服は、彼らの計略が強化されることを意味する"
 rus_nakaz_decision.historical_info: "#italic Nakaz Pravilnosti#!（ナカース・プラヴィルノスチ、法に関する訓令）は、法制度の近代化と改革の試みとしてエカチェリーナ2世によって導入された法規範である。啓蒙思想の影響を受け、当時の進歩的な哲学に沿った法体系を構築するとともに、法律を簡素化・明確化しようとした。より人道的な刑罰を導入し、拷問の使用を制限し、法の前での全市民の平等を強調した。訓令は、それに反対する保守的な勢力が多かったことから完全には実施されず、エカチェリーナ2世は最終的にほかの優先事項に重点を移すこととなった。"
 rus_intellectual_movements_decision.title: "国家主義の始まり"
 rus_intellectual_movements_decision.desc: "[ShowCultureGroupName('slavic_group')]文化の定義とその優位性は、学者たちの熱い議論を呼んでいる。学者たちは、[ROOT.GetCountry.GetName]が伝統の無限の循環のなかで停滞しないよう、より親西欧的なスタンスを追求すべきであるという意見と、継続するということの重要性が軽視されており、[ROOT.GetCountry.GetAdjectiveWithNoTooltip]のアイデンティティを保つためにも中核部分を保つべきであるとの意見で割れている。この分断は、2つの異なる知的運動の創造を推し進めており、これらはわが国を正反対の方向へ導くことになるだろう。そして我々は、未来を見据えてどの道を進むかを決断しなければならない。"
 rus_intellectual_movements_decision.desc.entry: "[ShowCultureGroupName('slavic_group')]のアイデンティティをこのまま受け継いでいくべきか、西欧の進歩と引き換えに明け渡すべきかで学者たちの意見が割れ、同時には$RUS$の将来を形作ることのできない2つの陣営の間での激しい論争へと発展した。選ばれなかった側が黙って引き下がることはないので、どちらを選んだとしても決着はつかないことが予想される。"
 rus_intellectual_movements_decision.a: "スラヴ主義を支持しよう。"
 rus_intellectual_movements_decision.b: "西欧主義者を支持しよう。"
 rus_intellectual_movements_decision.custom1: "[law|e]「[ShowLawName('intellectual_movements')]」が利用可能になる"
 rus_intellectual_movements_decision.custom2: "[law|e]「[ShowLawName('intellectual_movements')]」のもとでの[policy|e]は、10年に一度しか変更できない"
 rus_intellectual_movements_decision.historical_info: "西欧主義およびスラヴ主義は、19世紀のロシアにおける2つの異なる知的・思想的運動で、ロシアの発展の道筋、西欧との関係、ロシアの文化的アイデンティティの保持について、それぞれ異なる見解をもっていた。西欧主義者は西欧の思想、制度、技術を取り入れることによる近代化を支持したのに対し、スラヴ主義者は伝統的なロシアの価値観、精神性、共同体構造の維持を強調した。"
 rus_secretnoye_byuro_decision.title: "秘密捜査執行室"
 rus_secretnoye_byuro_decision.desc: "エリート層による[ROOT.GetCountry.GetName]政府への反対を抑制する[current_policy.GetName]の能力に対し、疑念が提起されている。帝国評議会の外国人有力者は、力による抑止手段を用いる適切な専門機関の設立を提案した。むち打ち刑を復活させ、秘密警察を再編成して新たな権威意識を植えつけ、我々の至高の統治を頓挫させようとする試みを阻止するのだ。"
 rus_secretnoye_byuro_decision.desc.entry: "A current policy that merely discourages sedition is not the same as one that prevents it, and foreign agents in the bureaucracy have noticed the difference. Reviving the knout and a dedicated secret police answers the complaint, at the cost of every pretense that $RUS$ governs by anything gentler than fear."
 rus_secretnoye_byuro_decision.a: "従順はときに犠牲を要求するものだ。"
 rus_secretnoye_byuro_decision.b: "我々はそのようなものには頼らない。"
 enable_secretnoye_byuro_policy: "[policy|e]「[ShowPolicyName('secretnoye_byuro_policy')]」が利用可能になる"
 rus_secretnoye_byuro_decision.tt1: "これは[cabinet_member|e]が[cabinet_action|e]「[ShowCabinetActionName('bironovshchina')]」を実行中のみ選択可能"
 rus_secretnoye_byuro_decision.historical_info: "女帝アンナ・イヴァノヴナは、権威主義的な支配を確立する手段として、政敵を牽制するために「秘密捜査執行室」を利用した。刑罰には、鼻を切り裂かれたり、木製の柄に生皮の紐やロープをつけた鞭で撲殺されたりなどがあった。約2万人の貴族が政治的粛清の犠牲になったと推定されている。"
 rus_proclaim_tsardom_decision.title: "Proclaim the $tsardom$"
 rus_proclaim_tsardom_decision.desc: "The gathering of the Rus' lands is complete, and the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken. Our [GetCountry('RUS').GetFlavorRank] now stands supreme among the principalities, and our [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] urge us to claim a dignity to match: our sovereign should be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], heir to the emperors of old and guardian of the [ShowReligionAdjective('orthodox')] faith.\n\nSuch a coronation would proclaim to every court in Europe and every khanate of the steppe that [GetCountry('RUS').GetName] bow to no foreign crown."
 rus_proclaim_tsardom_decision.desc.entry: "The Rus' lands are gathered, the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken, and a ruler who has already achieved an empire's work now merely lacks an empire's title. Claiming one costs nothing but presumption, and tells every court in Europe exactly how we expect to be addressed from now on."
 rus_proclaim_tsardom_decision.a: "Let our sovereign be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')] of All Russia."
 rus_proclaim_tsardom_decision.historical_info: "On 16 January 1547, Ivan IV of Moscow was crowned in the Cathedral of the Dormition within the Kremlin, the first Muscovite ruler to be formally invested with the title of Tsar. Metropolitan Macarius, who had championed the new dignity, placed upon him the Cap of Monomakh, a jeweled fur-trimmed crown that court tradition held to be a gift from the Byzantine emperor Constantine IX to Grand Prince Vladimir Monomakh centuries earlier.\n\nThe new title marked a deliberate break from the older style of Grand Prince, asserting a rank equal to that of an emperor and heir to the fallen Christian empires of the East. Foreign courts were slow to recognize it: it took decades of diplomacy before the Holy Roman Empire and the Papacy accepted Tsar as the equivalent of King, rather than a mere translation of Grand Prince."
