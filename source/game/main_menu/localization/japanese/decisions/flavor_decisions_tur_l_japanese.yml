l_japanese:
 tur_enderun_academy_decision.title: "エンデルーン・アカデミー"
 tur_enderun_academy_decision.desc: "拡大を続けるわが国の行政官や将軍を育成するため、宮廷の関係者が運営する学校を設立し、学生たちを統治者の近くに置くという選択が考えられる。これは我々に深い洞察を与えるだけでなく、学生たちの強い忠誠を培うと同時に、国家のあらゆる問題において[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]王朝の重要性を引き続き確保することもできるだろう。\n\nだが、入学は貴族に限定するべきではない。才能のある若者であれば、どのような出自でも構わないのだ。"
 tur_enderun_academy_decision.desc.entry: "宮殿で育てられた使用人の地位は、王朝に与えられたものであり、その者の父の名は関係ない。中庭に学び舎を設ければ、職業生命の始まりから終わりまで我々の意のままになる行政官や指揮官を確保できる。これらの座を良家の子女のために温存しておく理由など、ひとつとしてない。"
 tur_enderun_academy_decision.a: "これこそが未来なのだ！"
 tur_enderun_academy_decision.historical_info: "メフメト2世は、新たに建設されたトプカプ宮殿の中庭に学校を設立した。学生は有望なデヴシルメ徴兵（キリスト教徒の若者から徴兵された者たち）から選ばれた。そして彼らはイスラムの信仰、科学、軍事技術、さらにはさまざまな言語の教育を受けた。この宮殿学校で訓練を受け、スルタンに忠誠を誓ったデヴシルメ出身者が政府の役職に任命されることによって、15世紀から16世紀にかけてのオスマン帝国の家産制統治制度の基盤が形成された。"
 tur_expanded_timariot_decision.title: "ティマール制度の拡張"
 tur_expanded_timariot_decision.desc: "ティマール制拡張の財源のため、聡明な相談役たちは貧困者や孤児の救済を支援してきた、モスクを基盤とした財団であるワクフから一部の収益を転用することを提案した。これは間違いなくわが軍を強化できるうえに、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]階級の力を削ぐことにもつながるだろう。だが、敬虔な者たちにこのことが広まれば、大きな不満を招く可能性もある。"
 tur_expanded_timariot_decision.desc.entry: "騎兵に与えた土地からは、それに見合う見返りが得られるが、慈善による寄進はまったくもって進軍の足しにはならない。ワクフの資金を流用すれば、さらなる騎兵を戦場に送り込むと同時に、$clergy_estate$の勢力を削ぐこともできるが、信心深い者たちがその金の行方を見逃すはずもない。"
 tur_expanded_timariot_decision.a: "我々にはその財源が必要だ。"
 tur_expanded_timariot_decision.b: "ワクフに手を出してはならん！"
 tur_expanded_timariot_decision.historical_info: "メフメト2世はオスマン帝国における自身の権威を、いかなる対価を払ってでも拡大しようとした。治世の晩年には、彼はウラマーの権力を削ぐべく、彼らを支えていたワクフ（寄進）の収入をティマール制へと振り分け、オスマン帝国軍の強化を図った。しかし、この動きはのちに大きく物議を醸すこととなる……"
 tur_enderun_service_decision.title: "内廷"
 tur_enderun_service_decision.desc: "優秀な宦官奴隷たちは長きにわたり、わが国の政府で限定的な役割しか果たしてこなかったが、家柄や一時的な権力への野心をもたないこの去勢された男たちには、依然として大きな可能性がある。それは、宮廷の有能な若い奴隷少年たちも同様だ。このような有能な廷臣に、わが政府での正式な役職を与えることで、[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]王朝との結びつきをより強めることができるだろう。ただし、これまでそうした地位を争っていたおべっか使いの老[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちを犠牲にすることになる。"
 tur_enderun_service_decision.desc.entry: "自身の王朝を築くことのできない男が、我々を犠牲にしてまでそれを実現する理由はほとんどない。そうした宮殿内の宦官たちのために要職を設けてやれば、彼らのなかでも特に優秀な者たちが、自分たちを長らく財産として扱ってきた$nobles_estate$を超えるようになるだろう。"
 tur_enderun_service_decision.a: "宮廷の改革は遅すぎるくらいだ。"
 tur_enderun_service_decision.b: "いいや、我々は引き続き[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]に頼らなければ。"
 tur_enderun_service_decision.b.entry: "いいや、我々は引き続き$nobles_estate$に頼らなければ。"
 tur_enderun_service_decision.historical_info: "「エンデルーン（#italic Enderûn#!）」はペルシア語で「内側」を意味する言葉に由来し、オスマン帝国のスルタンの腹心を指す。これは帝国の官僚機構である外廷の「ビルン（#italic Birûn#!）」と対を成す言葉である。エンデルーンは主に宦官と若いキリシタン奴隷で構成され、彼らの仕事は皇族の侍従や教育を中心としていた。しかし時が経つにつれて、なかには大きな政治的権力を得る者も現れるようになった。"
 tur_imperial_harem_decision.title: "ハーレムの形成"
 tur_imperial_harem_decision.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]の宮廷はこれまで、さまざまな宮殿や拠点に分散していた。だが、わが国が真に偉大となることを望むならば、その権力と威光を[capital_location.GetName]へ集中させるべきかもしれない。そのためには、王室のカリエの側室たちをすべてそこに移し、絢爛豪華だが閉ざされた場所に住まわせる必要があるだろう。\n\nしかし[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]たちは、これを彼らに対する攻撃的な動きとみなすだろう。なぜなら、彼らの多くが長年享受してきた[target_ruler.GetName]への個人的な接触の機会を奪うことになるからだ。"
 tur_imperial_harem_decision.desc.entry: "権力は統治者に近い者へと流れるものだ。そして現在では、一番近くに宮殿を設けている人物がそれに当てはまる。一族を首都に集め、警備の行き届いた1つの屋敷に住まわせれば、この問題を恒久的に解決することができる。一方、それがゆえに$nobles_estate$の不興を買うことにもなるだろう。"
 tur_imperial_harem_decision.a: "帝国のハーレムを作り出すのだ。"
 tur_imperial_harem_decision.b: "宮廷組織はすでに十分機能している。"
 tur_imperial_harem_decision.historical_info: "16世紀、オスマン王朝の権力はコンスタンティノープルのトプカプ宮殿に集約され、王族の多く、特に女性は生涯をそこで過ごした。これにより、ハーレムは組織立った階層的な制度へと変貌し、王族の生活を世俗から隔離することが重視されるようになった。その結果、統治者に直接接触できることが大きな特権となり、それが統治者の権力を高めることにもつながった。"
 tur_eunuch_viziers_decision.title: "キスラー・アガシの創設"
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName]は[ROOT.GetCountry.GetGovernment.GetCourtTitle]の優秀な宦官であり、[ROOT.GetCountry.GetGovernment.GetAdjective]のハーレムの守護者のひとりである。[ROOT.GetCountry.GetGovernment.GetCourtTitle]のいくつかの派閥は彼のための新たな役職、「キスラー・アガシ（娘たちの守護者）」の創設を求めている。彼がこの役職につけば、[ROOT.GetCountry.GetGovernment.GetRulerTitle]の私的空間を監督し、ハーレムと最高評議会の仲介役を務めることとなる。また、[ROOT.GetCountry.GetGovernment.GetCourtTitle]での少年従者を管轄する立場でありながらも、信頼に値しない白人宦官長、「カピ・アガシ」の上位に立つことにもなるだろう。"
 tur_eunuch_viziers_decision.desc.entry: "統治者の私的空間への出入りを管理する者は、単なる扉以上のものを管理下に置くこととなる。$name_muhammad.turkish_language$はそうした役職に相応しい分別の持ち主であり、彼を「キスラー・アガシ」に昇格させれば、長らく持ち越されていた白人宦官長の忠誠をめぐる問題にも決着がつくだろう。"
 tur_eunuch_viziers_decision.a: "キスラー・アガシに昇格させよ。"
 mehmed_agha_tt: "有能な[character|e]が宮廷に加わり、「[ShowModifier('kizlar_agha_modifier')]」の[modifier|e]が付与される"
 tur_eunuch_viziers_decision.b: "代わりにカピ・アガシの権力を増やせ。"
 valide_sultan_objects.tt: "ヴァリデ・スルタンはこれを受け入れない"
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip]が[ROOT.GetCountry.GetGovernment.GetCourtTitle]を去る"
 tur_eunuch_viziers_decision.historical_info: "オスマン帝国宮廷における宦官の数は着実に増えていった。1574年、メフメト・アーガーのためにキスラー・アガシという役職が設けられ、宦官たちはかつてない権力を得た。アフリカ出身の宦官たちは、祖国が遠く離れていたためより信頼できるとみなされ、やがて白人宦官よりもはるかに大きな影響力をもつようになった。キスラー・アガシが有力なヴァリデ・スルタンと密接なつながりを築いたこともあり、この地位はまもなく第一級の宰相にまで上り詰め、大宰相と$common_string_shaikh_al_islam$に次ぐ地位となった。"
 tur_sekban_system_decision.title: "[ShowAdvanceNameWithNoTooltip('timariots')]の終焉"
 tur_sekban_system_decision.desc: "長らくわが国を支えてきた[ShowAdvanceName('timariots')]制度が、いまや深刻な問題に直面している。騎兵に与えてきた土地は代を重ねるごとに細分化され、貧しくなっており、マスケットで武装した敵の出現により、騎兵の戦場における優位も過去のものとなりつつある。これ以上のティマールの分配をやめれば、現在の所有者たちの高齢化と死により、それらの土地を国が直接恩恵を受ける徴税用の農場に変えることができるだろう。また、陸軍を近代化し、火器で武装した歩兵に重点を置くことも可能だ。"
 tur_sekban_system_decision.a: "我々は時代とともに変化すべきだ。"
 timars_unavailable.tt: "[reforms|e]「ティマール制」が恒久的に利用できなくなる"
 tur_sekban_system_decision.historical_info: "スィパーヒー騎兵に対する土地授与制度であるティマール制は、やがて持続不可能となった。かつての大規模なオスマン帝国の征服が過去のものになると、新たに分与する土地が不足するようになったのだ。加えて、陸軍内のほかの派閥、特にイェニチェリも土地を求めた。改革の必要性に気づいたオスマン帝国はこの制度を廃止し、代わりに農民出身のセクバン兵の徴用を重視するようになった。"
 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
 tur_kanum_i_osmani_decision.desc: "[ROOT.GetCountry.GetFlavorRank]の発展により、領内にはさまざまな人が暮らすようになっている。多くはすでに古くからの[ROOT.GetCountry.GetAdjective]の法に従い、わが国の一部として定着しているが、その法だけでは十分ではないようだ。改革の先駆者として知られる[target_character.GetName]は、征服による国境の拡張よりも、国内の安定を追い求め、[ROOT.GetCountry.GetNameWithNoTooltip]の法典全体を書き換えることを提案している。"
 tur_kanum_i_osmani_decision.desc.entry: "国境付近の公国に合わせて書かれた法律では、多くの民を抱える帝国を統治することはできない。帝国民全員に対して拘束力を持つ単一の法体系を我らの名のもとに発布すれば、さらなる遠征では実現できないような国内秩序をもたらすだろう。我々はもう、ひとつの時代に十分すぎる征服行為をおこなったのだ。"
 tur_kanum_i_osmani_decision.a: "この法がわが国を新時代へ導くのだ。"
 tur_kanum_i_osmani_decision.b: "念頭には置いておこう。"
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "[policy|e]「[ShowPolicyName('tur_kanum_i_osmani')]」による[modifiers|e]が#Y 50%#!増加するが、そのエフェクトは[GetEstateName('crown_estate')]の[estate_power|e]で変動するようになる"
 tur_autonomous_kadiluks_decision.title: "カーディーに権限を付与"
 tur_autonomous_kadiluks_decision.desc: "[ShowReligionGroupAdjective('muslim')]徒の民にとって重要なすべての物事を判じるカーディーは、国家の柱であり、多くの学者の憧れでもあった。しかし、近年の統治と徴税制度の発展に伴い、カーディーは自らの統治するカディルクに対してより大きな自治権を求めるようになっている。これを与えれば、わが国の[ShowReligionGroupNameWithNoTooltip('muslim')]徒全体に対する優位性を主張するわが国にとって利益となり、彼らとオスマン宮廷のあいだに永遠の絆が結ばれるだろうとカーディーは主張している。"
 tur_autonomous_kadiluks_decision.a: "彼らは信頼に値する。"
 tur_autonomous_kadiluks_decision.b: "彼らにはすでに十分な権力がある。"
 has_enabled_kadiluks_privilege: "[decision|e]「$tur_autonomous_kadiluks_decision.title$」によってこの[estate_privilege|e]が有効になった"
 tur_autonomous_kadiluks_decision.historical_info: "17世紀のオスマン帝国では、スルタンの権力は徐々に弱体化し、イェニチェリやカーディーといった組織がますます影響力を強めていった。カディルクはカーディーに与えられた管轄区域で、そのなかで彼らは課税と徴兵の両方を監督していた。カーディーはカディルクを通じて、特に王権の中心地以外の地方で大きな影響力を行使することができた。そして1703年のエディルネ事件でスルタンのムスタファ2世が退位させられたことで、その地位はかつてない高みに達した。"
 tur_malikane_decision.title: "$ottoman_tax_farming$の再編"
 tur_malikane_decision.desc: "[grand_vizier.GetName]はわが国の経済について熟慮し、「マリカーネ」と呼ばれる新たな税徴収制度を考案した。これは、村や地区は競売にかけられ、最高額で落札した者に生涯の課税権を与えるという制度である。[grand_vizier.GetSheHe]によれば、この制度は徴税請負人に土地の繁栄のための一層の投資をおこなわせ、任期満了前に土地を食いつぶす傾向を減らすことで、旧制度の改善につながるという。また、かつては一般的だった1年契約の管理という、官僚的な手間を省くこともできるとのことだ。とはいえ、以前の制度が非常に利益を上げていたことも事実だ。"
 tur_malikane_decision.desc.entry: "1年間だけ村の徴税請負人を務める者は骨までしゃぶるが、一生涯にわたって徴税を請け負う者は、受け持つ村を大切に扱うものである。「マリカーネ」は、最高入札者にその一生の権利を売る制度であり、過去の大規模な年次競売に代わって、今後10年は税を課す価値のある地区を授けてくれるものだ。"
 tur_malikane_decision.a: "この改革を実施しよう。"
 malikane_available.tt: "[government_reform|e]「[ShowGovernmentReformName('ottoman_malikane_tax_reform')]」が利用可能になる"
 tur_malikane_decision.historical_info: "マリカーネ制度は1695年、悲運の大宰相エルマス・メフメト・パシャによって導入された。彼には長期的な経済利益を改善しようという前向きな意図があったものの、この制度は部分的に失敗に終わった。旧来の徴税請負人たちからの激しい抵抗に遭い、新しい種類の終身徴税権に対する国家の監督も不十分だった。改革にもかかわらず、国家はすぐに軍事的敗北を喫し、兵士たちへの給与の支払いに苦しむようになった。エルマスは1697年に部下によって殺害され、1703年には給料を支払われなかったイェニチェリがムスタファ2世を打倒した。"
 tur_coffee_house_espionage_decision.title: "コーヒーハウスへの潜入"
 tur_coffee_house_espionage_decision.desc: "多くの[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]が集まるコーヒーハウスは、裏切り者の交流の巣窟となり、特に$janissaries_advance$のあいだで反乱の計画さえ立てられる場となっている。濃いコーヒーと甘美なデザートを囲んで繰り広げられる活発な議論は、商業や地域社会にとっては有益なものだが、秘密のやり取りを聞き逃すことのないよう我々は諜報網を拡大すべきである。"
 tur_coffee_house_espionage_decision.desc.entry: "人は尋問されているときよりも、コーヒーを飲んでいるときにこそ自由に語れるもので、$burghers_estate$が集うコーヒーハウスでは、$janissaries_advance$が決して我々の耳に入れたくない類のさまざまな噂が飛び交う。そんな場所を閉鎖すれば、取引の機会ばかりか、こうした噂話を聞く機会まで失われるが、我々の息がかかった「耳」を大量に送り込めばどちらも失わずに済む。"
 tur_coffee_house_espionage_decision.a: "情報は力だ。"
 tur_coffee_house_espionage_decision.b: "コーヒーハウスを取り締まれ。"
 tur_coffee_house_espionage_decision.c: "コーヒーの流通が制限されてはならない。"
 coffee_house_espionage_available.tt: "[government_reform|e]「[ShowGovernmentReformName('ottoman_coffee_house_espionage')]」が利用可能になる"
 tur_coffee_house_espionage_decision.historical_info: "オスマン帝国のコーヒーハウスは、さまざまな職業、民族、宗教をもつ人々が集う活気あふれる場所で、トルコ人職人がロシア人放浪者やヴェネツィア商人と交流することもあった。そのためコーヒーハウスは公共の議論、斬新な思想や芸術、そして反乱の温床ともなった。なかでもイェニチェリのコーヒーハウスは、暗殺、情報、資源を求めて秘密組織と繋がる手段を提供した。政府はこうしたコーヒーハウスや類似の公共施設に多くの諜報員を送り込み、民衆の感情や犯罪、反乱に関わるあらゆる会話を探っていた。"
 tur_new_order_army_decision.title: "新秩序の軍隊"
 tur_new_order_army_decision.desc: "対立国の力、変わりゆく世界の危険、そして何より無法かつ堕落した$janissaries_advance$による絶え間ない反乱の脅威を憂慮するなか、[target_ruler.GetName]は新たな構想を抱いている。[target_ruler.GetNameWithNoTooltip]は[ShowContinentName('europe')]から招聘した指導官たちの力を借りて、軍隊を近代的かつ高度に職業化されたものへと改革し、新たな制服、伝統、訓練を取り入れようとしているのだ。しかしこの試みは、$janissaries_advance$や$bashi_bazouks$、$sekban_system$など、現状から利益を得ているすべての者から怒りを買う危険がある。"
 tur_new_order_army_decision.desc.entry: "近代的な軍隊をつくる上で障害となるのは、金銭や指導官の問題ではなく、すでにある軍隊だ。$janissaries_advance$と並行して規律ある軍隊を編制するということは、いずれ既存の軍を解散させるよう命じられる者たちに武器を与えることにほかならず、$bashi_bazouks$や$sekban_system$も我々同様にそうした意図を読み取っている。"
 tur_new_order_army_decision.a: "わが国にはこの変革が必要だ。"
 tur_new_order_army_decision.b: "古いやり方で十分だ。"
 new_order_army_available.tt: "[government_reform|e]「[ShowGovernmentReformName('ottoman_new_order_army')]」が利用可能になる"
 tur_new_order_army: "[ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]をアンロックした"
 tur_new_order_army_decision.historical_info: "「新秩序の軍隊」を意味する「#italic Niẓām-i Jedīd#!（ニザーム＝ジェディット）」は1797年に創設された。これはセリム3世の改革計画の中核をなすもので、このヨーロッパの軍隊を手本とした近代的な歩兵部隊を徐々にイェニチェリと置き換えることで、帝国の地方分権化を逆転させ、イェニチェリの強大な権力を抑制しようとした。"
