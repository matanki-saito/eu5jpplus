l_japanese:
 charter_manila_galleon.title: "マニラ・ガレオンの就航"
 charter_manila_galleon.desc: "太平洋を横断する復航路が海図に記され、航行可能であることも実証されたいま、海はもはや障壁ではなく道となった。西岸で大型ガレオン船の装備を整え、船倉に銀を積み込み、北回りの航路でアジアへ送り出して帰還させようではないか。送り出すのは銀、持ち帰るのは絹と香辛料だ。出費は莫大で航海も長いが、ガレオン船が1隻でも無事に帰還すれば、その費用の何倍もの利益をもたらす。1年以内に帰還することはなく、海に呑み込まれる可能性もある。だが無事に帰れば、富もともに持ち帰るだろう。"
 charter_manila_galleon.a: "ガレオン船の装備を整え、今季の銀を積み込もう。"
