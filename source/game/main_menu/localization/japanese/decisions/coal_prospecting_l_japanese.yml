l_japanese:
 prospect_for_coal.title: "石炭の探鉱"
 prospect_for_coal.desc: "蒸気と鉄の時代を支えるのは石炭であり、わが国の地中にも、産業が切望する資源が眠っているかもしれない。政治的資本を投じ、地質学者や鉱山技師からなる調査隊を石炭が埋まっていると見られる地域へ送ろう。地質を調べ、有望な炭層を試掘し、採掘に最も適した場所に新たな炭鉱を開くのだ。調査はまず、農村部のなかでも生産性の低い土地から始める。そうした土地なら、農地を炭鉱用地に転用しても農業への影響は小さい。新たな炭鉱は小規模な操業から始まり、やがてわが国の炉を支えるだけの石炭を産出するようになるだろう。"
 prospect_for_coal.a: "調査を命じよ。"
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName]が今後、[coal_prospect_location.GetRawMaterial.GetName]ではなく[ShowGoodsName('coal')]を産出する"
 prospect_for_coal.historical_info: "ルール地方、上シレジア、南ウェールズの大炭田は産業革命を支え、石炭の探鉱が組織的に進められるにつれて、それまで静かな農村だった地域は世界有数の工業地帯へと姿を変えていった。18世紀後半から19世紀初頭にかけて、地質調査は専門分野として発展し、国家や起業家は機械化の時代を支える石炭を求めて競い合った。"
