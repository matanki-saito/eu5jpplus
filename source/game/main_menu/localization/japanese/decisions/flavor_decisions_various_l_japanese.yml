l_japanese:
 ser_novo_brdo_mine_decision.title: "[ShowLocationNameWithNoTooltip('novo_brdo')]法"
 ser_novo_brdo_mine_decision.desc: "賑やかな鉱山の街[ShowLocationName('novo_brdo')]は、その有益な産業に関連する複雑な業務と権利を管理するために、独自の規則と慣行を発展させてきた。最近になって、その原則に基づいた包括的かつ全国におよぶ採掘法を採用しようという声が高まっている。提案されたこの「[ShowPolicyName('novo_brdo_mining_law')]」は、採掘都市の組織を標準化し、鉱夫の権利と責任を明確にし、[ROOT.GetCountry.GetName]全体で公正な慣行と安全対策を確保するものである。"
 ser_novo_brdo_mine_decision.desc.entry: "One mining town has worked out, through trial and dispute, rules that keep its shafts profitable and its miners from killing each other over them. Making [ShowLocationName('novo_brdo')]'s customs the law for every mine in $SER$ costs the other towns their local practice, but saves them from inventing the same rules badly."
 ser_novo_brdo_mine_decision.a: "新たな法律を制定しよう。"
 ser_novo_brdo_mine_decision.b: "現在の採掘規定を維持しよう。"
 has_unlocked_novo_brdo_tt: "[decision|e]「#Y [ShowLocationNameWithNoTooltip('novo_brdo')]法#!」で法律がアンロックされた"
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "ノヴォ・ブルド法"
 ser_novo_brdo_mine_decision.historical_info: "1412年にステファン・ラザレビッチが制定したノヴォ・ブルドの採掘法は、中世セルビアにおける採掘作業、労働者の権利、採掘都市の組織について定めた包括的な規則である。財産権、安全対策、経済慣行に関する詳細な指針を示し、鉱山社会の発展と繁栄に大きな影響を与えた。"
 chi_grand_pronouncements_decision.title: "大明律"
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U]の考えでは、前王朝の滅亡はすべて政府閣僚の腐敗と権力の乱用が原因である。これに基づいて、[target_character.GetNameWithNoTooltip]は[ROOT.GetCountry.GetName]が同じ運命に見舞われるのを防ぐために、より厳格かつ律法主義的な法規範を制定すべきだと主張している。"
 chi_grand_pronouncements_decision.desc.entry: "Dynasties do not fall to invasion nearly so often as they fall to the ministers meant to be serving them. The court intends to write a code strict enough that no minister mistakes the palace for his own, whatever the cost to the flexibility such men usually enjoy."
 chi_grand_pronouncements_decision.a: "腐敗を根絶せよ。"
 chi_grand_pronouncements_decision.b: "腐敗？ わが国の政府内で？ ありえん。"
 chi_ming_dynasty_code_will_be_changed: "[ShowPolicyName('chi_ming_dynasty_code_policy')]が[ShowModifier('chi_grand_pronouncements')]の補正を含むように変更される。"
 integrated_grand_prounouncements: "[ShowModifier('chi_grand_pronouncements')]が[ShowPolicyName('chi_ming_dynasty_code_policy')]に統合された。"
 cas_right_of_possession_decision.title: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]"
 cas_right_of_possession_decision.desc: "[ShowLawName('mesta_council_law')]の堅実な指導のもと、我々の[ShowGoodsName('wool')]は繁栄し、[ROOT.GetCountry.GetAdjective]各地に影響力を拡大してきた。組織の繁栄と統制を維持するためには、牧草地の利用を規制し、賃貸料に合理的な制限を課す法律である「[ShowPolicyName('right_of_possesion')]」を導入することが有益だろう。"
 cas_right_of_possession_decision.desc.entry: "A guild left to police itself eventually polices only its own interests. The [ShowLawName('mesta_council_law')] has grown [ShowGoodsName('wool')] into a fortune, and a fixed limit on pasture rents would keep that fortune from being extracted entirely from the farmers who lease the land beneath it."
 cas_right_of_possession_decision.a: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]を制定せよ。"
 cas_right_of_possession_decision.b: "現状で満足している。"
 cas_right_of_possession_decision.c: "[ShowLawNameWithNoTooltip('mesta_council_law')]を廃止せよ！"
 cas_right_of_possession_decision.c.tt: "わが国が[ShowRegionName('iberia_region')]に所有するすべての[ShowGoodsNameWithNoTooltip('wool')]産地のロケーションは、補正「[ShowModifier('merino_wool')]」を恒久的に失う"
 cas_altered_nueva_recopilacion_decision.title: "スペイン大法典"
 cas_altered_nueva_recopilacion_decision.desc: "[ShowAdvanceName('enlightenment_advance')]が[ROOT.GetCountry.GetName]に浸透しつつあるが、わが国の法律の多くはいまも時代遅れであり、[ShowPolicyName('nueva_recopilacion_policy')]はその最たるものである。この状況を鑑み、[target_character.GetName]は伝統主義的な考えを排除して、ローマ法典から脱却するように法律を書き換えようとしている。そうすることで、わが国の法体系を支配してきた[ROOT.GetCountry.GetReligion.GetAdjective]信仰以上のものを、大衆に教えることができるはずだ。"
 cas_altered_nueva_recopilacion_decision.desc.entry: "A legal code drafted before the [ShowAdvanceName('enlightenment_advance')] still governs us as though it had not happened. Rewriting the [ShowPolicyName('nueva_recopilacion_policy')] away from Roman canon law would teach the people something besides the faith the courts have leaned on for a century."
 cas_altered_nueva_recopilacion_decision.a: "こうした進歩的思想を広げていかなくては。"
 cas_altered_nueva_recopilacion_decision.b: "伝統から逸脱してはならない。"
 cas_altered_nueva_recopilacion_decision.historical_info: "新法令集の改良版であるスペイン大法典は、従来のローマ法典的性質から脱却し、カスティーリャとアラゴンのスペイン統一への足がかりとなった。1805年に施行されたこの法典は、スペイン国内のあらゆる訴訟で参照されたが、当時台頭しつつあったナポレオン法典ほど近代的なものではなかった。"
 spa_alter_nueva_recopilacion_policy_tt: "[policy|e]「[ShowPolicyName('nueva_recopilacion_policy')]」のボーナスが[research|e]に集中するようになる。ボーナスは[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の[estate_power|e]で変動する"
 cas_spanish_cloth_industry_decision.title: "高品質なメリノ[ShowGoodsNameWithNoTooltip('wool')]"
 cas_spanish_cloth_industry_decision.desc: "わが国の[ShowGoodsName('wool')]の品質が向上したことで、ヨーロッパの各市場での評価も高まり、海外からの需要も増加した。これを踏まえると、[ShowLawName('mesta_council_law')]が主導する産業は、我々が支援すれば非常に収益性が高くなる可能性がある。また、[ShowLawNameWithNoTooltip('mesta_council_law')]の構成員のなかには、この高品質の[ShowGoodsNameWithNoTooltip('wool')]を基礎に[ROOT.GetCountry.GetAdjective][ShowGoodsName('fine_cloth')]産業を創設し、強力な[ROOT.GetCountry.GetCulture.GetName]の繊維産業を営むべきだと主張する者もいる。"
 cas_spanish_cloth_industry_decision.desc.entry: "Raw [ShowGoodsName('wool')] sold abroad enriches foreign weavers more than it enriches us. Building a [ShowGoodsName('fine_cloth')] trade on the back of the [ShowLawName('mesta_council_law')] would let us sell the finished article instead, if the council can be persuaded the extra step is worth the investment."
 cas_spanish_cloth_industry_decision.a: "輸出に集中しよう！"
 cas_spanish_cloth_industry_decision.a.tt: "わが国が[ShowRegionName('iberia_region')]に所有するすべての[ShowGoodsNameWithNoTooltip('wool')]産地のロケーションは、補正「[ShowModifier('quality_merino_wool')]」を50年間得る"
 cas_spanish_cloth_industry_decision.b: "国内産業を支援しろ。"
 cas_spanish_cloth_industry_decision.b.tt: "[ShowBuildingTypeNameWithNoTooltip('fine_cloth_guild')]のスペイン衣服の生産方法をアンロックする"
 has_unlocked_spanish_cloth_industry: "イベントでスペインの繊維産業を支持した"
 STATIC_MODIFIER_NAME_quality_merino_wool: "良質なメリノ羊毛"
 por_casa_de_india_decision.title: "インド商務院"
 por_casa_de_india_decision.desc: "[ROOT.GetCountry.GetAdjective]が$india$と[ShowContinentName('africa')]にもつ権益と資産を、効率的に監督・管理する必要がある。これを達成する最善の方法は、[ROOT.GetCountry.GetGovernment.GetAdjective]の財務担当官直属の機関を設立し、関連するすべての交易路と交易品に対して独占権を与えることだとの提言がなされた。"
 por_casa_de_india_decision.desc.entry: "Trade scattered across $india$ and [ShowContinentName('africa')] is trade nobody is properly accounting for. One institution under the Treasurer, holding monopoly on the goods that matter most, would answer for all of it in a single ledger."
 por_casa_de_india_decision.a: "素晴らしい計画だ。"
 por_casa_de_india_decision.a.tt: "[government_reform|e]「[ShowGovernmentReformName('por_casa_de_india')]」をアンロックする"
 hol_ned_shipbuilding_decision.title: "フリュート船"
 hol_ned_shipbuilding_decision.desc: "[ROOT.GetCountry.GetCulture.GetName]経済の拡大は、商船に大きな需要をもたらしている。だが、[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]の海域は非常に浅いため、キャラベル船のような一般的な商船は[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の多くの港に近づくことができない。これまでのところ、小型の船を用いることでこの問題に対処してきたが、[ShowLocationName('hoorn')]の商人である[target_character.GetName]の支援のもとで、新しい船が開発された。\nこのフリュート船は、より長い、非常に特徴的な洋梨型の船尾を持ち、少人数の乗組員で効率よく操船できるように造られている。水深の浅いオランダ海域でも大きな貨物を運ぶことができ、外洋での航行にも優れることから、この船はわが国の商人にとって天の恵みともいえるだろう。"
 hol_ned_shipbuilding_decision.desc.entry: "A boeier can reach the shallows our ports demand but carries too little to be worth the voyage. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ has funded a longer, pear-sterned design that manages both, carrying a real cargo through water barely deep enough for a rowboat."
 hol_ned_shipbuilding_decision.a: "間違いなく名案だ！"
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$・$name_john.dutch_dialect$・$Liorne$が[court|e]に加わる"
 hol_ned_shipbuilding_decision.b: "面白い案だが、いまはその時ではない。時間を置いても構わないだろうか？"
 nov_ivan_hundred_strong_decision.title: "商人組合、「[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]」"
 nov_ivan_hundred_strong_decision.desc: "交易の主要な中心地のひとつとして、[ROOT.GetCountry.GetName]には多くの有力な商人組合が存在している。しかし、これらの組合のなかでも「[ShowEstatePrivilegeName('novgorod_ivans_hundred')]」は特に影響力が強く、[ShowGoodsName('beeswax')]交易を掌握している。組合の高位役員たちはその権力をさらに拡大するため、さらなる支援を得ようと[our_ruler.GetName]およびヴェーチェに接触した。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちのなかには、組合が[ROOT.GetCountry.GetNameWithNoTooltip]の交易に対して過大な影響力をもつことを懸念し、力を与えすぎないよう[our_ruler.GetNameWithNoTooltip]に密かに進言する者もいる。"
 nov_ivan_hundred_strong_decision.desc.entry: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] already controls the [ShowGoodsName('beeswax')] trade more thoroughly than any single guild ought to, and its officials want more support still. The $nobles_estate$ are quietly asking us to refuse them, fearing a merchant body too powerful to answer to the Veche at all."
 nov_ivan_hundred_strong_decision.a: "ヴェーチェからの強力な支援を与えよう。"
 empower_ivan_hundred_privilege: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が今後25年間、以下を得る：\n[ShowModifierTypeName('global_crown_estate_power')]#R -5.00%#!、[ShowModifierTypeName('global_merchant_capacity_modifier')]#G +20.00%#!"
 ivan_hundred_strengthened_requirement: "[decision|e]「$nov_ivan_hundred_strong_decision.title$」から以下のボーナスを獲得可能："
 variable_ivan_hundred_strengthened_tt: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が強化された"
 ivan_hundred_strengthened: "イヴァン百人組の権力を強化"
 nov_ivan_hundred_beeswax_decision.title: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]の[ShowGoodsNameWithNoTooltip('beeswax')]独占要求"
 nov_ivan_hundred_beeswax_decision.desc: "ヴェーチェからの追加の支援を受け、その地位をさらに高めた[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が、さらに権益を拡大しようとノヴゴロドにおける[ShowGoodsName('beeswax')]の生産の独占権を要求してきた。組合はこれまでも交易に大きな影響力をもっていたが、独占権を得れば彼らの支配は揺るぎないものとなるだろう。"
 nov_ivan_hundred_beeswax_decision.a: "[ShowGoodsNameWithNoTooltip('beeswax')]交易に対する影響力拡大の要求を認めよう。"
 nov_ivan_hundred_beeswax_decision.b: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]の勢力拡大を阻止する。"
 ivan_hundred_beeswax_increase: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が今後25年間、以下を得る：\n[ShowModifierTypeName('selling_efficiency')]#G +10.00%#!、[ShowModifierTypeName('global_beeswax_output_modifier')]#G +25.00%#!"
 ivan_hundred_beeswax_increase_requirement: "[decision|e]「$nov_ivan_hundred_beeswax_decision.title$」から以下のボーナスを獲得可能："
 ivan_hundred_beeswax: "蜜蝋交易での影響力拡大"
 kbo_serfdom_reform_decision.title: "Continuation of Slave Raids"
 kbo_serfdom_reform_decision.desc: "この大陸の各地で見られるように、わが国の経済もまた、強制労働力の流入とその活用に大きく依存している。わが軍や地元の軍閥の協力のもとでおこなわれる奴隷狩りは、社会が求める新たな労働力を供給している。しかし、近年のわが国の進展とこれらの活動への投資により、我々は膨大な数の奴隷を抱えることとなった。このまま奴隷狩りを続け、労働力の流入をさらに拡大させるべきなのだろうか。それとも、奴隷に社会での地位を与え、ともに繁栄させるべきなのだろうか。"
 kbo_serfdom_reform_decision.a: "奴隷貿易は国家経済を潤すだろう。"
 kbo_serfdom_reform_decision.b: "みなが社会の一員になれるよう尽力すべきだ。"
 kbo_pop_promotion_more_potent_tt: "固有の[cabinet|e]アクション「[ShowCabinetActionName('kbo_pop_promote_action')]」を使用できるようになる"
 kbo_amenokal_salt_traders_decision.title: "アザライとタグラムト"
 kbo_amenokal_salt_traders_decision.desc: "西アフリカおよび中央アフリカでラクダが家畜化されて以来、何世紀にもわたり、多くの商人たちが富と商機を求めて、アザライやタグラムトなどの交易路を使い、過酷な環境を旅をしてきた。アメノカルと呼ばれる有力者たちは、オアシスからオアシスへと移動し、遠隔地を結びつけて貴重な[ShowGoodsName('salt')]を取引している。市場では塩は塊で売られ、食料や家畜、そのほかの生活必需品と交換される。果たして、このような特権的な監督の地位を彼らに与えるべきなのだろうか？ 信頼できる相談役による慎重な対応が求められる。"
 kbo_amenokal_salt_traders_decision.a: "取引は各隊商のアメノカルに監督させよう。"
 kbo_sharia_courts_decision.title: "$KBO$における$sharia$"
 kbo_sharia_courts_decision.desc: "わが偉大なる国は、[ShowReligionAdjective('sunni')]をいち早く受け入れた、最古の[ShowReligionAdjective('sunni')]国家といえる。真なる信仰に対する活力を新たにする我々は、尽きることのない英気を胸に、宗教的価値を堅固に守り、民を異教徒から守るために尽力してきた。しかし、わが信仰において、$sharia$はいまだ十分に根づいていない。この法体系は、行政効率を左右し、民に与える影響をも規定しかねない。多くの相談役はシャリーアの導入に賛成する一方で、宗教と行政を結びつけることに慎重な立場を取る者もいる。"
 kbo_sharia_courts_decision.a: "$sharia$を施行することは、理に適っている。"
 kbo_enable_sharia_courts_cabinet_action_tt: "固有の[cabinet|e]アクション「[ShowCabinetActionName('kbo_sharia_courts')]」を使用できるようになる"
 teu_kulm_law_revised_decision.title: "$kulm_law$の改定"
 teu_kulm_law_revised_decision.desc: "[ShowSituationName('black_death')]が[ShowContinentName('europe')]全土を襲い、多くの街を壊滅させ、集落を荒廃させた。[ROOT.GetCountry.GetLongName]への経済的打撃も甚大だが、さらに深刻なのは、ドイツにおける人口減少により移住圧力が低下し、[ShowAreaName('prussia_area')]の人口増加が鈍化していることである。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の領地への移住を促すためのさらなる施策を講じなければ、我らのキリスト教化の使命に不可欠な移民がいなくなってしまうだろう。"
 teu_kulm_law_revised_decision.desc.entry: "The [ShowSituationName('black_death')] has thinned Germany enough that fewer migrants remain to send east, and our order in [ShowAreaName('prussia_area')] depends on a steady stream of them. Sweetening the terms of settlement costs concessions we would rather keep, but an empty frontier converts no one."
 teu_kulm_law_revised_decision.a: "移民にさらなる恩恵を与えよう。"
 teu_kulm_law_revised_decision.b: "耐え忍ぶしかない。"
 teu_impact_on_kulm_law: "[ShowEstatePrivilegeName('kulm_law')]は以下の補正を受ける：\n[ShowModifierTypeName('rural_migration_attraction')]#g +0.1#!\n[ShowModifierTypeName('burghers_estate_max_tax')]#r -10.0%#!"
 teu_impact_on_kulm_law_not_revised: "[ShowEstatePrivilegeName('kulm_law')]は以下の補正を受ける：\n[ShowModifierTypeName('german_migration_attraction_modifier')]#r -50.0%#!\n[ShowModifierTypeName('global_pop_assimilation_speed_modifier')]#g +10.0%#!"
 kulm_law_revised_tooltip: "[event|e]「$teu_kulm_law_revised_decision.title$」で[ShowEstatePrivilegeName('kulm_law')]を改正した。"
 kulm_law_not_revised_tooltip: "[event|e]「$teu_kulm_law_revised_decision.title$」で[ShowEstatePrivilegeName('kulm_law')]を改正しないことを選んだ。"
 bra_kreditwerk_reformed_decision.title: "$bra_kreditwerk$の改革"
 bra_kreditwerk_reformed_decision.desc: "信用組合は、与えられた権限にもかかわらず財政管理を大きく誤り、多額の負債を抱えることになった。我々はいま、信用組合の即時破産に直面しており、その未来について決断を迫られている。我々の相談役のなかでも、さまざまな意見があげられている。信用組合を改革し、王室の直接管理下に置くことを提案する者もいれば、信用組合の全廃を提案する者もいる。"
 bra_kreditwerk_reformed_decision.a: "王室のもとで信用組合を改革しよう。"
 bra_kreditwerk_reformed_decision.b: "この厄介なものを排除しろ。"
 bra_kreditwerk_reformed_decision.c: "救済し、存続させよう。"
 boh_unity_brethren_decision.title: "同胞の結束の支持"
 boh_unity_brethren_decision.desc: "[ShowReligionAdjective('hussite')]の典礼を実践したこの数年間で、我々の信仰の木は多くの枝を伸ばし、国中で栄え成長してきた。多くの信者が、道を踏み外した異端者の手から自由となった教会の儀式に参加するために、集会をおこなっている。\n\nしかし、このような敬虔と神の崇拝を示す環境のなかで、[ShowReligionNameWithNoTooltip('hussite')]の極端な解釈に傾倒し、貴族や商人を教会の代表から排除するとともに、典礼は簡素で質素な儀式でおこない、使徒継承の拒否を説く[ShowEstateTypeName('clergy_estate')]が増えている。"
 boh_unity_brethren_decision.desc.entry: "A faith that keeps growing eventually grows past what its founders intended, and ours has. Some of the $clergy_estate$ now preach that nobles and merchants have no place in the Church at all, which is a purer doctrine than the one we started with and a considerably more disruptive one."
 boh_unity_brethren_decision.a: "彼らに説教を続けさせよう。その言葉には真理がある。"
 unity_brethren_privilege: "同胞の結束"
 unity_brethren_privilege_desc: "急進的な[ShowReligionName('hussite')]運動は、説教と崇拝のありのままの優美さに焦点を当て、[ShowEstateTypeName('burghers_estate')]と[ShowEstateTypeName('nobles_estate')]出身の有力者を排除すると同時に、母語の普及と聖体拝領の儀式の簡略化を重視した。"
 ara_sindicat_remenca_decision.title: "農民組合"
 ara_sindicat_remenca_decision.desc: "[ROOT.GetCountry.GetLongName]の貴族階級が、農民を土地に縛りつける規則の施行を厳格化しはじめている。これは一般的な土地所有権のさらなる厳格化と相まって、農民たちのあいだに騒動を引き起こした。最貧困層の農民が公然たる反乱を強く扇動する一方で、裕福な農民は改革と領地乱用の終結を我々に訴えている。\n\n貴族との権力闘争が絶えない我々にとって、これは農民の支持を得る絶好の機会となるだろう。これを受け、[ShowEstatePrivilegeName('ara_sindicat_remenca')]、すなわち農民によるギルドや原始的な労働組合の結成を農民に許可し、より多くの自由を与えるという提案がなされている。"
 ara_sindicat_remenca_decision.desc.entry: "A peasant bound absolutely to the land has no lawful way to resist his lord, only an unlawful one, and unlawful resistance is what the poorest among them are now choosing. A chartered guild gives the better-off peasants a legal outlet instead, and buys us their loyalty against the nobility at very little cost to the crown."
 ara_sindicat_remenca_decision.a: "農民に農民組合の結成を許可しよう。"
 ara_sindicat_remenca_decision.b: "農民のたわごとは無視しろ。"
 ara_sindicat_remenca: "農民組合"
 ara_sindicat_remenca_desc: "農民組合は、原始的な農民のギルドである。これは1448年にカタルーニャで初めて導入された。"
 nov_tysiatskii_influential_decision.title: "老トィシャツキー"
 nov_tysiatskii_influential_decision.desc: "[ShowEstatePrivilegeName('tysiatskii_privilege')]は依然として選挙で選ばれる[ROOT.GetCountry.GetName]の官職だが、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]階級が強く掌握してきた歴史もあり、多くの選出者は[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の家系出身であることが多い。しかし近年では、この官職を退いた元トィシャツキーであっても、次の選挙において大きな影響力を保持し、しばしば息子を後任として推すこともある。このような人物は「老トィシャツキー」と呼ばれ、ヴェーチェ内でも無視できない存在となっている。"
 nov_tysiatskii_influential_decision.desc.entry: "An elected office is not much of a check on power if the same families keep winning the election. The #italic Old Tysiatskii#! now steer the vote toward their own sons even after leaving office, and the $nobles_estate$ have quietly made the post theirs in all but name."
 nov_tysiatskii_influential_decision.a: "彼らの影響力を利用すべきだ。"
 nov_tysiatskii_influential_decision.b: "トィシャツキーに対する[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の力を抑えよ。"
 nov_tysiatskii_influential_decision.b.entry: "トィシャツキーに対する$nobles_estate$の力を抑えよ。"
 nov_tysiatskii_influence_weakened: "トィシャツキーの影響力を弱体化"
 nov_influential_tysiatskii: "影響力のあるトィシャツキー"
 nov_tysiatskii_influence_weakened_benefits: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が今後30年間、以下を得る：\n[ShowModifierTypeName('global_nobles_estate_power')]#R -25.00%#!、[ShowModifierTypeName('stability_investment')]#G +0.10#!"
 nov_tysiatskii_influence_event_happened: "トィシャツキーの影響力が増大！"
 nov_tysiatskii_influence_event_happened_possible_event: "トィシャツキーは今後、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]に対して自らの権威を行使する可能性がある！"
 nov_influential_tysiatskii_benefits: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]が今後30年間、以下を得る：\n[ShowModifierTypeName('global_nobles_estate_power')]#G +25.00%#!、[ShowModifierTypeName('army_heavy_infantry_power')]#G +15.00%#!"
 nov_influential_tysiatskii_requirement: "[decision|e]「$nov_tysiatskii_influential_decision.title$」から以下のボーナスを獲得可能："
 nov_tysiatskii_influence_weakened_requirement: "[decision|e]「$nov_tysiatskii_influential_decision.title$」から以下のボーナスを獲得可能："
 boh_district_paving_decision.title: "[ShowLocationNameWithNoTooltip('prague')]地区の課税権"
 boh_district_paving_decision.desc: "[ShowLocationName('prague')]の都の境界線が拡がるにつれて、マラー・ストラナ区をはじめとする各区の長を務める多くの著名人が、その境界内に住む市民に課税する権利を要求するようになった。\n\nこの動きは、財務の影響力の多くを[ShowEstateTypeName('nobles_estate')]の手に委ねることになるため、細心の注意を払って検討する必要がある。"
 boh_district_paving_decision.a: "いいだろう。望むものを渡してやれ。"
 boh_joint_assembly_decrees_decision.title: "帝国議会"
 boh_joint_assembly_decrees_decision.desc: "我々が[GetUniqueInternationalOrganization('hre').GetName]の長に就任したことで、帝国とわが国の司法手続きのあいだに明確な違いがあることが明らかとなった。我々の支配を守り、正当化しようと尽力するなかで、文化的・伝統的な違いによってその差はさらに拡がっている。\n\nわが国の地位を強固なものにし、国民を帝国に親しませるために、[target_character.GetName]の多くの相談役が帝国議会を提案した。この議会には[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちや、我々と並ぶすべての帝国の諸侯の長が参加し、彼らの特権に関連する既存のローマ法の多くを確認することになる。"
 boh_joint_assembly_decrees_decision.desc.entry: "Ruling the $hre$ and ruling our own lands are, in practice, two different jobs with two different sets of law, and the gap between them grows more awkward every year we hold both crowns. A joint assembly seating our $nobles_estate$ alongside the imperial princes would confirm the Roman laws they value, at the cost of treating them as something closer to equals."
 boh_joint_assembly_decrees_decision.a: "我々の支配を正当化するための重要かつ必要な段取りだ。"
 every_elector_25_opinion_tt: "すべての選帝侯のわが国に対する評価が、それぞれ[ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0]上昇する"
 ven_doges_palace_decision.title: "[ShowBuildingTypeNameWithNoTooltip('doges_palace')]の拡張"
 ven_doges_palace_decision.desc: "[ShowLocationName('venice')]にある[ShowBuildingTypeName('doges_palace')]の建設は9世紀に始まり、その後何世紀も続いた。当初は要塞のような建物として構想されたこの宮殿は、時を経てゴシック建築の壮麗な姿へと進化した。この驚異の建築物は、[GetCountry('VEN').GetLongNameWithNoTooltip]の卓越した政治指導者である[ROOT.GetCountry.GetGovernment.GetRulerTitle]の住居であると同時に、さまざまな政府機関や裁判所を収める、二重の役割を果たしている。\n\nしかし、時代が進んだことで[ShowBuildingTypeNameWithNoTooltip('doges_palace')]は目に見えて老朽化しており、改修の必要が生じている。いっそのこと、西欧諸国の王宮をも凌ぐ宮殿へと変えるべきではないだろうか。"
 ven_doges_palace_decision.desc.entry: "A palace begun as a fortress in the 9th century has grown grand by accident rather than by design, and it shows. Rebuilding the [ShowBuildingTypeName('doges_palace')] into something that outshines the residences of western kings would cost a fortune we would otherwise spend on ships."
 ven_doges_palace_decision.a: "いい考えだ！"
 ven_doges_palace_decision.historical_info: "16世紀までに、ドゥカーレ宮殿は大幅な改修と拡張がおこなわれた結果、その壮麗さを大いに増した。特に注目すべき発展のひとつが、大運河に面した象徴的なファサードの完成であり、これは水上から訪れる者すべてに宮殿の建築美を印象づけた。改修と拡張の時代は、宮殿をヴェネツィアの権力と権威を象徴する永続的な立場として確立するものとなった。複雑なデザインと豪華な装飾が特徴的なその広間や議場は、何世紀にもわたる政治活動の舞台となっただけでなく、この都市の豊かな歴史と世界的な舞台における重要性を示す不朽の証でもある。"
 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
 ven_piazza_san_marco_decision.desc: "[ROOT.GetCountry.GetFlavorRank]の増大する力と富は、我らの繁栄が[ShowLocationName('venice')]の壮麗さとして反映されるよう、都の開発への投資を求めている。中央広場の[ShowBuildingTypeName('piazza_san_marco')]を壮麗なアーチと大理石で一新し、我らが海洋帝国の栄光を際立たせるという改修案が提案された。この改修は都の美しさを強化するとともに、わが国の不朽の力と文化的繁栄の証ともなるだろう。"
 ven_piazza_san_marco_decision.desc.entry: "A maritime empire that looks poor at home will not be believed rich abroad. Rebuilding the square before [ShowLocationName('venice')]'s palace in marble and arches spends coin on nothing anyone can eat, and buys a reputation that opens doors coin alone cannot."
 ven_piazza_san_marco_decision.a: "この改修に出資しよう。"
 unlocked_piazza_san_marco_tt: "フレーバーの[decision|e]を通じ、[building|e]「$piazza_san_marco$」をアンロックした"
 ven_piazza_san_marco_decision.historical_info: "サン・マルコ広場は、イタリアはヴェネツィアにある主要な公共広場であり、市内で最も有名なランドマークのひとつ。この広場は9世紀ごろに整備され、12世紀に現在の規模へと拡張されて、継続的に改修や新たなランドマークの追加がおこなわれた。広場はサン・マルコ寺院、ドゥカーレ宮殿、サン・マルコ時計塔などの象徴的な建物に囲まれ、ヴェネツィアにおける中心的な集会所として、政治・宗教・社会活動の場となってきた。"
 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
 ven_teatro_san_cassiano_decision.desc: "すでに[ShowRegionName('italy_region')]文化圏のきらめく至宝となっていた[ShowLocationName('venice')]は、長らく芸術家や演者たちの盛んなコミュニティの本拠地だった。その芸術的卓越性をさらに確固たるものにし、わが国の才能ある市民たちに華やかな舞台を提供するため、壮大な劇場にしてオペラハウスの建設を求める声が高まっている。提案された「[ShowBuildingTypeName('teatro_san_cassiano')]」は、[ShowLocationNameWithNoTooltip('venice')]の華やかさと富の証となり、その芸術の輝きで彼方から称賛者を引き寄せるだろう。"
 ven_teatro_san_cassiano_decision.desc.entry: "すでに芸術でその名を知られている街であれば、そこ以外に最高の芸術作品を飾るべき舞台はない。提案通りに[ShowBuildingTypeName('teatro_san_cassiano')]を建設すれば、[ShowLocationName('venice')]の評判に相応しい舞台が整い、競合する港がまた一つ我々を羨む理由が増えることになるだろう。"
 ven_teatro_san_cassiano_decision.a: "建設を命じよ！"
 unlocked_teatro_san_cassiano_tt: "フレーバーの[decision|e]を通じ、[building|e]「$teatro_san_cassiano$」をアンロックした"
 ven_teatro_san_cassiano_decision.historical_info: "1637年、ヴェネツィアに建設されたサン・カッシアーノ劇場は、世界初の公共のオペラ劇場。舞台芸術の歴史に大きな節目を刻み、文化の中心地としてのヴェネツィアの役割を揺るぎないものにした。"
 ven_walls_of_ston_decision.title: "[ShowLocationNameWithNoTooltip('dubrovnik')]の要塞化"
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')]は主要な交易[target_location.GetRank.GetName]であり、わが海洋帝国の最も貴重な資産のひとつだ。その重要性にもかかわらず、[ShowLocationNameWithNoTooltip('dubrovnik')]の防衛はかなり時代遅れで、陸と海のどちらからの敵に対しても格好の餌食になってしまう。適切な要塞建設に金を投入し、既存の防壁の近代化を行うことは決して無駄ではないはずだ。"
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')]は交易が盛んな季節には、わが国のほとんどの州が年間を通して出せるよりも多くの収益を上げてくれるものの、まともな包囲戦を仕掛けられずとも、襲撃部隊によって奪われる危険性を孕む場所でもある。きちんとした壁を建てようとすれば、他に充てられたはずの資金をそこに費やすことになるが、逆に壁を建てずに街が陥落させられた日には後悔することになるだろう。"
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')]はしっかりと守らなければ。"
 ven_walls_of_ston_decision.b: "現在の要塞で防衛力は十分だ。"
 ven_walls_of_ston_decision.historical_info: "14世紀に築かれたストンの壁は、クロアチアのペリェシャツ半島に位置する防御用の石壁群。これらの壁は貴重な塩田とストンの街を守るために作られた。全長約7キロとヨーロッパ最長の要塞のひとつであり、その驚くべき長さと中世における戦略的重要性で有名である。"
 zan_husuni_kubwa_decision.title: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName]は当初、[target_location.GetName]の中心に極めて壮麗な宮殿を建設するよう命じていた。しかし、不運や資金の流用、本人の病によって計画は頓挫しかけた。問題は山積していたが、わが国の建築家たちはこの計画を刷新した。この宮殿計画では、倉庫や商人たちの取引専用の応接室が用意され、華麗な謁見室も併設される。唯一の障害は、目下のところ資金である。"
 zan_husuni_kubwa_decision.desc.entry: "我々以前の統治者の誰もがこの宮殿の完成を望んだが、漏れなくその全員が、やがて断念する理由を見い出す結果に終わった。わが国の貿易規模に見合う倉庫や、客人を迎えるに相応しい玉座の間がある[ShowLocationName('kilwa_kisiwani')]を建設する新たな試みは、先人たちの試みにおいて不足していた資金さえ確保できれば、いつでも作業を開始することができる。"
 zan_husuni_kubwa_decision.a: "建設を命じよう。"
 zan_husuni_kubwa_decision.b: "いまは金がかかりすぎる……"
 zan_husuni_kubwa_decision.historical_info: "フスニ・クブワは、14世紀のキルワ・スルタン国の全盛期に建築的・政治的手腕でその名を馳せた。スルタンのアル＝ハサン・イブン・スライマーンの治世下にキルワ・キシワニに建てられたこの広大な宮殿複合施設は、広さが約1.6ヘクタールあり、主にサンゴ石で築かれ、スワヒリ、イスラム、ペルシアの要素が融合した建築様式が用いられている。豪奢な私室、大きな中庭、洗練された浴場、貯蔵庫などを備えていたことから、王族の住居、商業の中心地、そして要塞という多面的な役割を果たしていたことがわかる。"
 construct_the_building_at_another_time_tt: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]はまた別の機会に建てることもできる……"
 unlocked_husuni_kubwa_tt: "フレーバー[event|e]を通じ、わが国が[building|e]「$husuni_kubwa$」をアンロックした"
 pap_quirinal_palace_decision.title: "教皇の夏の離宮"
 pap_quirinal_palace_decision.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle]は、[ShowLocationName('rome')]中心のにぎやかな雑踏を離れ、夏の離宮を建設することに関心を示した。[ShowLocationNameWithNoTooltip('rome')]の有名な七丘のひとつであるクイリナーレの丘は、涼風と広がる景色が楽しめる静かな場所であり、離宮の建設地として理想的である。この計画を進めるのであれば、著名な建築家[fontana.GetName]が宮殿の設計と建設を監督できるだろう。"
 pap_quirinal_palace_decision.desc.entry: "中央[ShowLocationName('rome')]の賑わいは、どんな教皇でも避けたがるもので、クイリナーレの丘にはそよ風や大衆のいない景色がある。必ずしも必要ではない離宮のために、出資をする準備が教皇庁があるのなら、その建設を任せられる建築家として挙げられるのは$name_dominic$・$Fontana$だ。"
 pap_quirinal_palace_decision.a: "クイリナーレの丘に夏の離宮を建設する。"
 pap_quirinal_palace_decision.b: "贅沢な離宮を建てている場合ではない。それより、芸術家たちの技能を向上させることに集中するべきだ。"
 pap_quirinal_palace_decision.historical_info: "クイリナーレ宮殿は1583年、教皇グレゴリウス13世の夏の離宮として建設が命じられた。ドメニコ・フォンターナを含む著名な建築家たちの意見を取り入れて設計されたこの宮殿は、ローマ中心部の暑さと喧騒からの避暑地となった。新しく成立したイタリア王国が教皇領の大部分を併合した際、クイリナーレ宮殿はイタリア国王の居城となった。"
 nav_camara_comptos_decision.title: "カマラ・デ・コンプトス"
 nav_camara_comptos_decision.desc: "王国の財政は非常に重要な問題であり、我らが[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は、この問題を扱う恒久的な機関を設立することで、[ROOT.GetCountry.GetLongName]が大きな恩恵を受けられると考えている。\n\n[GetCountry('FRA').GetLongName]の同様の機関から着想を得て、我々は国家の経済的自立性を高め、わが国の繊細な状況により直面する可能性のある財政難に、うまく対処できるようになる。"
 nav_camara_comptos_decision.desc.entry: "気まぐれで運営される国庫は、運の良い年にはうまく乗り切れても、運の悪い年には大きく失敗する。そして$FRA$の例を見れば、固定された機関があったほうが、即興で得られるどんな結果より良い成果を上げることは明白だ。わが国でも同様の機関を設立すれば、君主の財政に対する個人的な裁量権の一部と引き換えに、いかなる君主の関心よりも長く存続する役所が得られるだろう。"
 nav_camara_comptos_decision.a: "恒久的な監査院を作ろう。"
 nav_camara_comptos_decision.historical_info: "カマラ・デ・コンプトスの起源は、少なくとも1258年の最初の「コンプトス記録簿」に記された、王室の財政を管理・監督していた役人である「#italic oidores#!（オイドール、「聞く」という動詞#italic oir#!が語源）」にある。この機関は、フランスの同様の機関（パリの会計検査局）の影響を強く受け、カルロス2世によって恒久的な機関となり、王国の経費を管理し、財政問題について統治者に助言する義務を担った。\n\nこれはスペイン最古の会計監査院とされ、現在でもナバラの特権議会で使用されている。"
 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
 hun_bibliotheca_corviniana_decision.desc: "[ShowInstitutionName('renaissance')]が野火のように大陸全土に広がり、知識と文化の再興をもたらすなか、わが[ROOT.GetCountry.GetGovernment.GetCourtTitle]もその無限の可能性に沸き立っている。[ShowContinentName('europe')]全土を席巻する新たな思想の波に触発された学者、芸術家、そして思想家たちが、次々とわが都市に集まりつつある。そんななか、ひとつの提案が持ち上がった。諸国の学者たちを惹きつける、壮麗な図書館を[ROOT.GetCountry.GetCapital.GetName]に建設し、[GetCountry('HUN').GetName]を[ShowInstitutionNameWithNoTooltip('renaissance')]の拠点とする構想だ。しかし、このような大掛かりな計画を実現するには、莫大な資金が必要となる。[ShowBuildingTypeName('bibliotheca_corviniana')]の建設に、果たして我々は投資すべきだろうか？"
 hun_bibliotheca_corviniana_decision.desc.entry: "[ShowInstitutionName('renaissance')]を牽引していると主張する都市なら、どこであれ、すでにそれを証明するものを何かしら築いているが、$HUN$は例外だ。首都に大規模な図書館を建設すれば、今わが国を素通りしている学者たちを惹きつけられるようになり、かかる費用についても後になるほど正当化しやすくなるだろう。"
 hun_bibliotheca_corviniana_decision.a: "素晴らしい！"
 hun_bibliotheca_corviniana_decision.b: "それよりも教育機関の改善に努めたほうが、我々にとって有益だ。"
 unlocked_bibliotheca_corviniana_tt: "フレーバーの[decision|e]を通じ、[building|e]「$bibliotheca_corviniana$」をアンロックした"
 hun_bibliotheca_corviniana_decision.historical_info: "「ルネサンスの王」の異名をもつマティアス・コルヴィヌスは、芸術と科学を大いに奨励した人物だった。その治世のもと、ハンガリーはイタリア以外で初めてルネサンスを受け入れ、コルヴィナ文庫はハンガリーの文化復興に大きく貢献した。この図書館は学術交流の中心地として、知識の普及において重要な役割を果たし、大陸中から集まった学者たちによって、ルネサンス特有の知的な活気に満ちていた。図書館はハンガリーにおけるルネサンスの知的熱狂と、知識と革新を育む後援の力の象徴となったのである。"
 mam_ablaq_palace_decision.title: "[ShowLocationNameWithNoTooltip('cairo')]の城塞"
 mam_ablaq_palace_decision.desc: "知識と啓蒙、そして[ShowContinentName('africa')]と地中海を結ぶ交易の拠点である[target_location.GetName]は、成長しつづけるわが[ROOT.GetCountry.GetFlavorRank]の核である。この城塞は何世紀にもわたって名高い統治者たちによって使われてきた。最近、現[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]に対して、城塞の拡張を目的とする野心的な計画案が提出された。計画には、新たなモスク＝マドラサ、拡張された大広間、そしてキスワを製作する施設が含まれている。"
 mam_ablaq_palace_decision.desc.entry: "何世代にもわたってその時々の統治者が滞在していた城塞も、優秀な一握りだけを迎え入れているように見せることは今からでも可能だ。新しいモスク＝マドラサ、拡張された大広間、そしてキスワの工房を増設することができれば、軍事作戦を決行したのと同じくらい、わが国の現治世のあり方を示すことができるだろう。しかも、これなら流れる血の量をだいぶ抑えることができる。"
 mam_ablaq_palace_decision.a: "いいだろう。"
 mam_ablaq_palace_decision.b: "いや、支出は節約せよ。"
 unlocked_ablaq_palace_tt: "[decision|e]「$mam_ablaq_palace_decision.title$」でこの[building|e]をアンロックした"
 son_trans_saharan_decision.title: "サハラ越え交易の繁栄"
 son_trans_saharan_decision.desc: "我々が交易路を支配して以来、サハラ越え交易は新たな繁栄を迎えている。ただ傍観するのではなく、我々は隊商が到着する目的地で前哨基地の拡張を図ることができる。[ShowLocationName('alexandria')]、[ShowLocationName('tunis')]、そして[ShowLocationName('fez')]などは特に重要な主要目的地であり、支援を優先すべき場所だ。"
 son_trans_saharan_decision.a: "これらの隊商逗留地を繁栄させよ。"
 son_trans_saharan_decision.b: "場所ではなく、交易全体を強化しよう。"
 son_trans_saharan_decision.c: "これに資金を投じる価値はない。"
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "[ShowLocationName('fez')]、[ShowLocationName('tunis')]、[ShowLocationName('alexandria')]での[ShowBuildingTypeName('trans_saharan_trade_outposts')]の建設をアンロックする"
 son_conversion_west_africa_decision.title: "[ShowReligionGroupAdjectiveWithNoTooltip('folk_african_group')]諸国の改宗"
 son_conversion_west_africa_decision.desc: "我々は[ShowRegionName('guinea_region')]で最強の勢力であるものの、依然として[ShowReligionGroupName('muslim')]に従わない国家が存在する。武力を用いて彼らを改宗させることもできるが、[target_character.GetName]はより平和的な戦略を追求したいと考えている。[target_character.GetSheHe|U]は、剣を使ってさらなる混乱を引き起こすのではなく、外交を通じて[ShowReligionGroupNameWithNoTooltip('muslim')]を広めることを望んでいる。"
 son_conversion_west_africa_decision.desc.entry: "剣を振るったところで、強制的な改宗を生き延びた者が信仰を変えるはずもなく、ただ異論を唱えた者を沈黙させるためにしか使えない。統治者は、[ShowRegionName('guinea_region')]に兵士ではなく宣教師を送り込む考えで、後に煙の上がった村が残るよりも、ゆっくりと信仰が広まるほうを選ぶつもりでいる。"
 son_conversion_west_africa_decision.a: "それはいい考えだ。"
 son_conversion_west_africa_decision.b: "武力を使うほうがいい。"
 son_unlock_diplo_action_to_demand_conversion_tt: "[ShowRegionName('guinea_region')]の不信心者に対する[country_interaction|E]「[ShowCountryInteractionName('demand_conversion_to_islam')]」をアンロックする"
 ori_elephant_hunting_grounds_decision.title: "[ShowGoodsNameWithNoTooltip('elephants')]狩り"
 ori_elephant_hunting_grounds_decision.desc: "[ROOT.GetCountry.GetName]で[ShowGoodsName('elephants')]が余っていることから、この強大な獣を利用する連隊を増やそうという声があがった。しかし、現在の[ShowBuildingTypeName('elephant_hunting_grounds')]には、狩猟活動を適切に拡大し、装備を供給するための資源が不足している。よって、彼らが必要とする支援を提供するべきかもしれない。特に[target_character.GetName]と[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、これを実現するために自らの資金の一部を投入するつもりのようだ。"
 ori_elephant_hunting_grounds_decision.desc.entry: "象はまず誰かが捕獲したのちに訓練をし、その上でさらに装備を施さなければ、とても軍隊で活躍できる動物とは言えず、今現在の[ShowBuildingTypeName('elephant_hunting_grounds')]ではそれがほとんどできていない。宮廷から直接出資をする用意があるため、もはや金銭的な問題というより、今の我々の目標にこれ以上の戦象が必要かどうかの問題となっている。"
 ori_elephant_hunting_grounds_decision.a: "狩猟場を支援しよう。"
 ori_elephant_hunting_grounds_decision.b: "こんなことに金を浪費する必要はない。"
 ori_double_elephant_hunting_ground_level_tt: "[ShowBuildingTypeName('elephant_hunting_grounds')]の最大レベルが#G 2#!増加する"
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "[events|e]により最大レベルが増加"
 jap_rangaku_decision.title: "蘭学"
 jap_rangaku_decision.desc: "[target_country.GetAdjective]の商人たちが[target_location.GetName]の出島に留め置かれて久しく、国民がその居留地を訪れることは厳しく規制されている。にもかかわらず、ふたつの文化は互いに惹かれ合っている。[target_country.GetAdjectiveWithNoTooltip]人たちは、医学をはじめ、科学、製造、機械工学などの分野において、我々がまだ知らない知識をもっているらしい。裕福な市民のなかには、町医者に頼らず、出島にいる[target_country.GetAdjectiveWithNoTooltip]の外科医を利用する者もいる。\n\nこれら西洋の来訪者たちとの交流を深めることで、多くのことを学べるだろう。そのためには、制限をいくらか緩める必要があるが……"
 jap_rangaku_decision.desc.entry: "絶えず監視下に置かれているはずの交易拠点からは、依然として囲いの中に収めておきたい知識が、わずかながら外に漏れてしまうもので、$NED_ADJ$の出島からはもう何年にもわたって医学、機械工学、科学の知識が流出されている。監視を緩めれば、そうした知識がさらに入ってくるだろうが、こうして見張ることで隔離を維持しようとしていた意味が代わりに失われることになる。"
 jap_rangaku_decision.a: "門戸を開き、[target_country.GetAdjectiveWithNoTooltip]の知識を取り入れるのだ。"
 jap_rangaku_decision.a.entry: "門戸を開き、$NED_ADJ$の知識を取り入れるのだ。"
 jap_rangaku_decision.a.tt: "[government_reform|e]「[ShowGovernmentReformName('jap_rangaku')]」をアンロックする"
 jap_rangaku_decision.b: "交流するつもりなどない。"
 mch_mandarin_language_reforms_decision.title: "旧制度の採用"
 mch_mandarin_language_reforms_decision.desc: "我々は$china$の神聖なる皇帝に連なる系譜の、ひとつの王朝にすぎない。我々以前のさまざまな王朝は、巨大な[GetInternationalOrganization('middle_kingdom').GetName]をまとめあげるために効率的な官僚機構を確立してきた。ならば、我々もそのような政策を採用しない理由はない。このような行動は、我々をさらに[ShowSocietyDirectionName('sinicized')]の道へと進ませるだろうが、継続性を保ち、庶民の目から見た我々の権威を強化することにつながるだろう。"
 mch_mandarin_language_reforms_decision.a: "その政策を採用しよう。"
 mch_mandarin_language_reforms_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]に配慮しよう。"
 mch_mandarin_language_reforms_decision.b.entry: "$tribes_estate$に配慮しよう。"
 unlock_chinese_language_reforms: "この選択により、[government_reform|e]「[ShowGovernmentReformName('three_departments_system')]」がアンロックされる"
 MCH_conditional_benefit: "わが国が[government_reforms|e]「[ShowGovernmentReformName('three_departments_system')]」を採用しない場合、「[ShowEstatePrivilegeName('mch_tribal_favor')]」が追加の恩恵をもたらす"
 pru_unified_legal_system_decision.title: "法改革"
 pru_unified_legal_system_decision.desc: "我々のような国家は、つねに変化に適応する必要がある。現在、わが国の法改革において先陣を切れるような有望な人物が、わが国の法制度のなかで頭角を現してきている。この[target_character.GetName]は、「カンマーゲリヒト（高等裁判所）」の裁判長を務めており、[ROOT.GetCountry.GetName]全体の法制度を改革する計画を立案した。彼の取り組みを支援すれば、わが国の迅速かつ抜本的な改革につながるかもしれない。"
 pru_unified_legal_system_decision.desc.entry: "いくつもの異なる時代から受け継がれた法制度は、結局誰にもきれいに当てはまることなく、それがゆえに刷新されないまま、次の世代へと持ち越されがちだ。カンマーゲリヒトの裁判長が改正の草案をいくつか起こしているため、彼を支持することで未だ全貌の見えない改革案の策定に我々も貢献できる。"
 pru_unified_legal_system_decision.a: "彼の改革を支援しよう！"
 pru_unified_legal_system_decision.a_tt: "改革案を提案している[character|e]が[court|e]に現れる"
 pru_unified_legal_system_decision.a.tt: "改革の進捗が大幅に速まる"
 pru_unified_legal_system_decision.b: "彼の野心を抑制しろ。"
 pru_unified_legal_system_decision.b.tt: "改革の進捗が大幅に遅れる"
 boh_bohemian_commonwealth_decision.title: "連邦の設立"
 boh_bohemian_commonwealth_decision.desc: "我々の歴史は、[ROOT.GetCountry.GetName]が小国から帝国となり、数多の地域と国家を支配する世界的な大国へと昇り詰めていく道のりだった。しかし、そのような国家を統治するには堅実な手腕が必要である。[ROOT.GetCountry.GetFlavorRank]の国民間の分離主義と緊張を恐れ、新たな憲法を採択することを提案する者もいる。彼らは、伝統的に[ROOT.GetCountry.GetNameWithNoTooltip]とみなされてきたものを超えて、より大きな連邦を確立しなければならないと主張している。そうすることで、我らが帝国は[ShowContinentName('europe')]の広大な地域に拡大し、世界の諸大国に並び立つことになるのだと。"
 boh_bohemian_commonwealth_decision.desc.entry: "小国から帝国へと成り上がった国は、数多の国家を一つの国として扱うことでそうなったわけではない。今そうした国々をまとめ上げるとなると、この期に及んで、それらが一つの国でないことを認めざるを得なくなるだろう。これまで我々が治めていた領土よりも広大な連邦を新たに築くとなれば、元々「継ぎ目」から国が分裂してしまわないよう、帝国を作り上げたはずのそもそもの基本概念が脅かされることになる。"
 boh_bohemian_commonwealth_decision.a: "新たな憲法を採用しよう。"
 ned_unified_dutch_admiralties_decision.title: "5つの提督府の設立"
 ned_unified_dutch_admiralties_decision.desc: "わが国は[target_character.GetName]によって統治されているが、地方ごとの違いが我々の[ShowBuildingTypeName('admiralty')]を分裂させてしまっている。[ShowLocationName('groningen')]、[ShowLocationName('hoorn')]、[ShowLocationName('rotterdam')]、[ShowLocationName('middelburg')]、そして[ShowLocationName('amsterdam')]のあいだでの派閥争いが、わが海軍の統一を妨げているのだ。しかし、それぞれに己の利益を追求させることで、より高い成果が得られる可能性もある。"
 ned_unified_dutch_admiralties_decision.desc.entry: "5つの提督府で5つの港を管轄するということは、5つの海軍が同じ船を巡って争うということでもある。[ShowLocationName('groningen')]、[ShowLocationName('hoorn')]、[ShowLocationName('rotterdam')]、[ShowLocationName('middelburg')]、[ShowLocationName('amsterdam')]を一つの指揮系統の下に統一すればこうした競合関係に終止符を打てる一方、もうしばらく各々の利益の追求を認めることで、強制的な合併からは決して得ることのできない高い成果を全提督府が上げられる可能性もある。"
 ned_unified_dutch_admiralties_decision.a: "これら提督府が独自に存在することを許そう。"
 ned_unified_dutch_admiralties_decision.b: "ひとつに統合せよ。"
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "[government_reform|e]「[ShowGovernmentReformName('unified_admiralty_reform')]」をアンロックする"
 ned_unified_dutch_admiralties_decision.historical_info: "ハプスブルク家に対する八十年戦争の際、オランダ国民は各州が独自の権益を保持できるような連邦を作った。しかし、この連邦も派閥争いに悩まされ、スタティステンとオラニエ派が多数の州の支配権をめぐって争った。ナポレオン時代とバタヴィア共和国になって初めて、この制度は廃止され、現在のオランダ王国の誕生につながった。"
 hol_ned_seven_provinces_decision.title: "ネーデルラント連邦共和国"
 hol_ned_seven_provinces_decision.desc: "低地諸国は共通の大義を掲げて統一されたとはいえ、法律上の権利や文化の違いによっていまなお分断されている。しかし、我々はこの分裂を活用することができる。各々に法律と権利をもたせつつ、同時に中央政府に従うような連合体を各州に創設することで、各州が保護され独自に繁栄できるようになるはずだ。これにより、我々は国外に目を向ける機会が得られる。"
 hol_ned_seven_provinces_decision.a: "この連邦を作ろう。"
 hol_ned_seven_provinces_decision.b: "地方分権は解決策にならない。"
 swe_age_of_freedom_decision.title: "絶対王政の再評価"
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U]は崩壊の瀬戸際にある。現在の[ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]に対する国内の評価は支持者と反対者で二分され、別の者に交代させよと主張する集団が毎日のように現れている。また[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の統治に対する他国からの干渉も激しく、独立国ではなく傀儡国家であるかのように感じられるほどで、国民は階級を問わず絶対王政への不満を公言している。\n\n完全な支配に固執すれば、[ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]にとって致命的な失策となりうる。どちらの道を選ぶのであれ、激しい反対に直面することを覚悟しなくてはならない。"
 swe_age_of_freedom_decision.desc.entry: "国内の至る所に競合相手がいるような摂政は、その実、本当の意味での統治などできておらず、ただ単に仲裁を行っているだけにすぎない。そして外国の宮廷もまた、わが国の臣民同様にその違いを明確に把握している。絶対的な支配を敷くことはもはや、どちらの道を選んだとしても、この国の誰一人として勝利を確信できない戦いを招く危険性を孕んでいる。"
 swe_age_of_freedom_decision.a: "絶対王政を放棄する。"
 swe_age_of_freedom_decision.b: "支配権を保持する……"
 swe_age_of_freedom_always: "この改革はロックされており、任意に取り除けない。"
 swe_age_of_freedom_decision.historical_info: "子供のいなかったカール12世の死後、彼の妹ウルリカ・エレオノーラが女王として即位した。強硬な議会派だった宰相アルヴィド・ホルンは、この機会を捉えて絶対王政を倒し、議会の権限を強化しようとした。その民主的傾向は一部で評価されたものの、彼の政策はスウェーデンを著しく不安定にさせ、その後50年間にわたり他国の傀儡と化すことになった。このいわゆる「自由の時代」には、貴族も失っていた権力の一部を取り戻した。しかし若い女王には、戦争で疲弊した国民を過度に動揺させない明確な代案を見出せなかった。"
 iro_iroquois_interactions_decision.title: "グレート・ピースメーカーの遺産"
 iro_iroquois_interactions_decision.desc: "かつてその地の人々は分裂し、互いに反目していた。だが、“グレート・ピースメーカー”として知られるデガナウィダの尽力により、互いに争っていた部族の数々は、血縁のような結びつきをもつ「[ShowCultureGroupName('haudenosaunee_group')]連邦」へと統一された。この連邦の創設以来、[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]の部族たちは団結を保ち共存してきたが、ここへ来てある部族が台頭し、主導権を握るべきだという声が囁かれはじめている。しかしそのような試みは、デガナウィダが[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]連邦を築くにあたって掲げた根本原則を揺るがすおそれがある。"
 iro_iroquois_interactions_decision.a: "時代は移りゆくものだ。"
 may_unify_haudenosaunee_confederation: "[ShowCultureGroupName('haudenosaunee_group')]に属する国家に対して、アクション「[ShowCountryInteractionName('form_closer_bond_iroquois')]」と「[ShowCountryInteractionName('merge_tribe_iroquois')]」がアンロックされる。[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]の領土を統一すれば、わが国を「[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]連邦」として再編することが可能になる。"
