l_japanese:
 build_suez_canal.title: "スエズ運河の建設"
 build_suez_canal.desc: "技術者たちの報告によれば、スエズ地峡を貫く運河の建設は、すでにわが国の技術力で可能だという。途方もない大事業となるが、東方交易を掌握できるとなれば、それだけの価値は十分にある。"
 build_suez_canal.a: "運河の建設に着手せよ。"
 build_suez_canal.b: "いまはその時ではない。"
 build_panama_canal.title: "パナマ運河の建設"
 build_panama_canal.desc: "技術者たちは新世界の狭い地峡を測量し、2つの大洋を結ぶ運河の建設が可能だと判断した。費用は莫大だが、その見返りは計り知れない。"
 build_panama_canal.a: "運河の建設に着手せよ。"
 build_panama_canal.b: "いまはその時ではない。"
 close_suez_canal_to_enemies.title: "スエズ運河を同盟国以外に封鎖する"
 close_suez_canal_to_enemies.desc: "戦争継続中、スエズ運河の通行を我が同盟国および属国に限定する。敵国は自動的に通行を禁じられるが、これにより中立国や対立国の通行もさらに排除される。"
 close_suez_canal_to_enemies.a: "同盟国以外の通行を禁じる。"
 close_suez_canal_to_enemies.b: "いまはその時ではない。"
 open_suez_canal_to_all.title: "スエズ運河を全ての国に開放する"
 open_suez_canal_to_all.desc: "スエズ運河への通行制限を解除し、現在交戦していない全ての国に通行を再び開放する。"
 open_suez_canal_to_all.a: "制限を解除する。"
 open_suez_canal_to_all.b: "いまはその時ではない。"
 close_panama_canal_to_enemies.title: "パナマ運河を同盟国以外に封鎖する"
 close_panama_canal_to_enemies.desc: "戦争継続中、パナマ運河の通行を我が同盟国および属国に限定する。敵国は自動的に通行を禁じられるが、これにより中立国や対立国の通行もさらに排除される。"
 close_panama_canal_to_enemies.a: "同盟国以外の通行を禁じる。"
 close_panama_canal_to_enemies.b: "いまはその時ではない。"
 open_panama_canal_to_all.title: "パナマ運河を全ての国に開放する"
 open_panama_canal_to_all.desc: "パナマ運河への通行制限を解除し、現在交戦していない全ての国に通行を再び開放する。"
 open_panama_canal_to_all.a: "制限を解除する。"
 open_panama_canal_to_all.b: "いまはその時ではない。"
