l_japanese:
 hab_monastery_reform_melk_decision.title: "[ShowLocationNameWithNoTooltip('melk')]の改革運動"
 hab_monastery_reform_melk_decision.desc: "わが国の[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]数名が[ShowLocationName('melk')]地域で会合を開き、[ROOT.GetCountry.GetName]の修道院文化が着実に衰退していることについて話し合った。不満の声が高まっていくなか、わが国の修道院が改革を切に必要としていることは明白だ。我々が迅速に行動すれば、[ROOT.GetCountry.GetReligion.GetAdjective]改革の輝かしい模範とみなされるかもしれない。"
 hab_monastery_reform_melk_decision.desc.entry: "戒律を忘れた修道院など、わが国にとっては何もない土地にも劣る。わが国の修道院は長年にわたって規律が緩みつづけている。[ShowLocationName('melk')]での集会は、[ShowReligionAdjective('catholic')]世界が注目するなかで改革に乗り出す絶好の機会だ。他国に追随するのではなく、我々こそが改革を主導する姿勢を示せるだろう。"
 hab_monastery_reform_melk_decision.a: "改革をおこなおう。"
 hab_monastery_reform_melk_decision.b: "現在のやり方で十分だ。"
 hab_vienna_concordat_decision.title: "[ShowLocationNameWithNoTooltip('vienna')]協約"
 hab_vienna_concordat_decision.desc: "教皇庁代表団との長時間の協議のすえ、[ROOT.GetCountry.GetName]と[GetCountry('PAP').GetName]は双方の利益を尊重する合意点にたどりついた。何世紀にもわたる[GetUniqueInternationalOrganization('hre').GetName]と[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]のあいだの敵対関係と疑念の果てに結ばれたこの協約は、両者の関係の転換点となり、友好的な基盤を築いていくこととなるだろう。"
 hab_vienna_concordat_decision.desc.entry: "皇帝と教皇は、聖職者の任命権をめぐって何世紀にもわたり争ってきたが、その争いは結局、どちらの益にもならなかった。教皇と正式な取り決めを結べば、任命権の一部を譲ることにはなるが、その代わり、教皇庁が$hre$を対抗勢力とみなさない関係を築けるだろう。"
 hab_vienna_concordat_decision.a: "条約に調印せよ！"
 hab_vienna_concordat_decision.b: "[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]の助けは必要ない。"
 hab_monastery_reform_accepted_decision.title: "[ROOT.GetCountry.GetNameWithNoTooltip]の[ShowBuildingTypeNameWithNoTooltip('monastery')]評議会"
 hab_monastery_reform_accepted_decision.title.entry: "$HAB$の[ShowBuildingTypeNameWithNoTooltip('monastery')]評議会"
 hab_monastery_reform_accepted_decision.desc: "宗教改革はわが国にも及び、[ShowBuildingTypeName('monastery')]に悲惨な結果をもたらした。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]たちは、[ShowBuildingTypeNameWithNoTooltip('monastery')]の人員が一向に増えないことや、絶望的な財政状態に不満を漏らしている。我々はこの問題を解決するために、[ShowBuildingTypeNameWithNoTooltip('monastery')]の運営を一任する評議会を設置することができる。"
 hab_monastery_reform_accepted_decision.desc.entry: "修練者もおらず、金庫も空になった修道院は、信仰の問題以前に、運営上の問題を抱えている。わが領内のすべての[ShowBuildingTypeName('monastery')]の財政を一元管理する評議会を設ければ、$clergy_estate$だけに任せるよりも、はるかに早く修道院を立て直せるだろう。"
 hab_monastery_reform_accepted_decision.a: "[ShowBuildingTypeNameWithNoTooltip('monastery')]の構造改革を実施せよ。"
 hab_monastery_reform_accepted_decision.a.tt: "わが国のすべての[ShowBuildingTypeNameWithNoTooltip('monastery')]で[ShowProductionMethodName('hab_reformed_monastery_maintenance')]をアンロックする"
 hab_monastery_reform_accepted_decision.b: "修道院は適応するしかない。"
 hab_tractatus_incorporalibus_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]の苦闘"
 hab_tractatus_incorporalibus_decision.title.entry: "$peasants_estate$の苦闘"
 hab_tractatus_incorporalibus_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]の代表団が、続く戦争により弱い立場にあることを訴えるため、[target_ruler.GetName]に接触してきた。我々はこうした農民の意見をほとんど顧みないものの、徴税と軍事的支援には農民の協力が欠かせないことも確かだ。土地所有者に対する義務を規定する法律を彼らに与えることで、両者の関係を規制し、法的協力を確保でき、そして今後の紛争を解決しやすくもなるだろう。"
 hab_tractatus_incorporalibus_decision.desc.entry: "慣習のみに基づく負担は、不作になるたび、その内容をめぐって揉め事になる。しかも戦争が続くいまでは、毎年が不作同然だ。$peasants_estate$の負担を書面で明確に定めれば、農民だけでなく領主もその取り決めに従わなければならない。何をどれだけ納めるべきかがはっきりしていれば、農民もきちんと納めるだろう。"
 hab_tractatus_incorporalibus_decision.a: "特権を与えよう。"
 hab_tractatus_incorporalibus_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]風情が我々に要求を？"
 hab_tractatus_incorporalibus_decision.b.entry: "$peasants_estate$風情が我々に要求を？"
 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.desc: "諜報活動は、特に個人との直接的なつながりに頼らざるを得ない場合、信頼性に欠ける手段となりかねない。他国ではすでにこうした必要性に応える機関を設立しており、我々も自国の機密情報機関を作るべきだ。郵便局を装った諜報機関である「[ShowGovernmentReformName('geheime_kabinettskanzlei')]」は、わが国を通過する郵便物をたやすく調べることが可能である。"
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
 hab_geheime_kabinettskanzlei_decision.a_tt: "[government_reform|e]「[ShowGovernmentReformName('geheime_kabinettskanzlei')]」をアンロックする"
 hab_geheime_kabinettskanzlei_decision.b: "諜報機関など無用の長物だ。"
 hab_geheimer_rat_decision.title: "[ShowAdvanceNameWithNoTooltip('geheimrat')]の制度化"
 hab_geheimer_rat_decision.desc: "最近の[ShowAdvanceName('geheimrat')]の設置は広く歓迎されたものの、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部では、この機関が非公式なままでよいのか疑問の声がある。彼らが主張するには、この機関を[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の政策に不可欠な一部として制度化し、最も信頼される有能な人物だけが[ROOT.GetCountry.GetFlavorRank]の運営に影響を与えられるようにすべきだという。"
 hab_geheimer_rat_decision.desc.entry: "非公式な顧問団は、それを組織した統治者の代限りで終わる。だが、[ShowAdvanceName('geheimrat')]を$crown_estate$の正式な機関として定めれば、統治者が代替わりしても存続し、国政を限られた適任者の手に委ねつづけることができる。"
 hab_geheimer_rat_decision.a: "制度化せよ！"
 hab_geheimer_rat_decision.a.tt: "[ShowGovernmentReformName('hab_geheimer_rat')]に属する重要人物に関するイベントをアンロックする"
 hab_geheimer_rat_decision.b: "現状で目的を十分に果たしている。"
 hab_privilegium_maius_decision.title: "掌中の大特許状"
 hab_privilegium_maius_decision.desc: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle]の地位に選出されたいま、ようやく前任者たちが犯した重大な過ちを正すことができる。[GetUniqueInternationalOrganization('hre').GetName]のリーダーとして、我々は[target_ruler.GetDynasty.GetName]王朝にふさわしい特権を与えることができるようになったのだ。"
 hab_privilegium_maius_decision.desc.entry: "歴代の皇帝は、わが国が本来有する特権のすべてを認めようとはしなかった。我々が帝冠を戴いているいまこそ、これまでの不当な扱いを正す時だ。"
 hab_privilegium_maius_decision.a: "この過ちを正す時だ。"
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "大特許状がまだ完全には与えられていない"
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "1370年以降であり、大特許状がまだ提案されていない"
