l_japanese:
 sponsor_a_cathedral_decision.title: "大聖堂への資金援助"
 sponsor_a_cathedral_decision.desc: "わが国には未だ信仰を捧げ、実践する場所が不足している。新しい[ShowBuildingTypeName('cathedral')]の建設に出資し、民の需要に応えるべきだ。"
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_cooldown_tt: "現在の統治者の治世中に、この[decision|e]を用いていない"
 sponsor_a_cathedral_cost_estimate_tt: "[ShowBuildingTypeName('cathedral')]の基本価格は400@gold!です。これは$royal_sponsorship$により割引され、建設される[location|e]によって変動します。"
 sponsor_a_great_madrasa_decision.title: "大マドラサへの資金援助"
 sponsor_a_great_madrasa_decision.desc: "わが国はすでに多くの礼拝所を擁するが、普通の[ShowBuildingTypeName('temple')]や[ShowBuildingTypeName('madrasa')]では、優秀な頭脳を持つこの国の学者たちをとてもではないが満足させることができない。彼らの学び舎として相応しい、新たな[ShowBuildingTypeName('great_madrasa')]の建設に投資し、そこから方々に知識を広めてもらえるようにするべきだ。"
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 sponsor_a_great_madrasa_cost_estimate_tt: "[ShowBuildingTypeName('great_madrasa')]の基本価格は[ShowNamedValue('expensive_build_price_age_of_tradition')|0]@gold!です。これは$royal_sponsorship$により割引され、建設される[location|e]によって変動します。"
 construct_a_grand_palace_decision.title: "新たな宮殿建設の依頼"
 construct_a_grand_palace_decision.desc: "わが国では宮廷も統治者の一族も、その威信に相応しい家を所有してない。[ShowArtistTypeName('architect')]を雇って、新しい[ShowBuildingTypeName('grand_palace')]の建設計画を練るべきだ。"
 construct_a_grand_palace_decision.a: "きっと良き住まいとなるだろう。"
 construct_a_grand_palace_decision.a_tt: "雇用した[ShowArtistTypeName('architect')]が[court|e]に加わる"
 strive_towards_thalassocracy_decision.title: "タラソクラシーの確立"
 strive_towards_thalassocracy_decision.desc: "我々の領土と接する海岸を適切に支配することさえできれば、広大な海はわが国とその経済圏の拡大において、極めて重要な役割を果たせる可能性がある。海軍の拡張のために多くの人員や物資を注げば、海の向こうへ進出するという新たな目標に合わせて、各種基盤の調整が可能になるだろう。"
 strive_towards_thalassocracy_decision.a: "海を味方につけるとしよう。"
 strive_towards_thalassocracy_decision.a.tt: "我々が強い海軍を確立するために与えられた猶予は20年となる"
 strive_thalassocracy_coastal_markets_tt: "沿岸部の[market_center|e]が最低でも1つある"
 abandon_thalassocracy_decision.title: "タラソクラシーの放棄"
 abandon_thalassocracy_decision.desc: "海上の支配圏からの統治は、もはや今の我々の野望にそぐわないものとなった。我々が暮らしている陸を軸としたやり方に方向転換するべきだ。"
 abandon_thalassocracy_decision.a: "より確かな足場を再び踏みしめるとしよう。"
 found_trade_company_india_decision.title: "アジア交易路の支援"
 found_trade_company_india_decision.desc: "[ShowSubContinentName('south_asia')]や[ShowSubContinentName('south_east_asia')]の豊かな海岸は、我々に大いなる富を約束してくれる。目下行われている商いは、個々の商人によるものがほとんどだが、わが国の地位を考えると明らかに不充分な状況にあると言える。国として講じられるあらゆる手段を活用し、外国市場とわが国の市場を結ぶ、より大規模な貿易使節団を行き来させるべきだ。"
 found_trade_company_india_decision.a: "インド貿易会社に投資しよう。"
 invite_foreign_advisor_decision.title: "外国の技術革新への金銭の支払い"
 invite_foreign_advisor_decision.desc: "わが国は世界の他の列強と比べて、著しく後れを取っている。他国が技術や革新の分野でわが国を追い抜いていくのを、何もせずに黙って見ているわけにはいかない。こうした列強に住まう個人に手厚い報酬を提示すれば、他の国々に追いつく努力につながりつつ、近代化の追求においてこれ以上の遅れが生じないようにすることができるかもしれない。"
 invite_foreign_advisor_decision.a: "外国の学者を歓迎しよう。"
 invite_foreign_advisor_decision.a.tt: "外国からやってきた学者がわが国の[court|e]に加わる"
 invite_foreign_advisor_decision.b: "わが国の顧問たちだけで十分だ。"
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision.title: "議会の権限への異議"
 disempower_the_parliament_decision.desc: "この何世紀かのあいだに、議会は政府の自由を制限するほどの権限を獲得するに至った。今こそ議席を占める者たちに目を向け、その権限を無効にするべきときだ！"
 disempower_the_parliament_decision.a: "議会の権限を制限する必要がある。"
 disempower_the_parliament_decision.a_building_tt: "[locations|e]の1つから、[ShowBuildingTypeName('urban_parliament_seat')]を1つ削減する。"
 disempower_the_parliament_decision.a_tt: "[location|e]の全[pop|e]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]減少する"
 disempower_the_parliament_decision.b: "今は議会の権限に異議を唱えるべきときではない。"
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 abolish_serfdom_decision.title: "農奴制の廃止"
 abolish_serfdom_decision.desc: "農奴制は古くからわが国にあった慣習だが、今や経済を追求する上での障害になってしまった。現代の不安定な政治情勢を考えると、成長しつつある中流階級との折り合いをつけつつ、酷使されている人々の苦しみを和らげるためにも、この習慣を法令によって廃止するのが賢明かもしれない。"
 abolish_serfdom_decision.a: "法令に調印しよう。"
 abolish_serfdom_decision.b: "あまりにも国の不安定化を招く危険性が高い。"
 abandon_absolutism_decision.title: "絶対主義の放棄"
 abandon_absolutism_decision.desc: "我らが統治者による絶対主義的政府は、日増しに国内の安定を脅かす要因となっている。反乱の噂も頻繁に聞こえてくるようになったが、こうした反体制勢力の鎮圧は決して簡単なことではない。そろそろ、旧時代の絶対主義的な理想に背を向け、より自由主義的な政府の形を受け入れることにしたほうが、この国のためになるのではないだろうか。"
 abandon_absolutism_decision.a: "絶対主義はもはや我々のやり方にそぐわない思想となった。"
 abandon_absolutism_decision.b: "この至高の権力を手放してなるものか！"
 jewish_expulsion_threat.title: "追放による脅迫"
 jewish_expulsion_threat.desc: "王室は正式な最後通牒を突きつける。ユダヤ人共同体は臨時税を支払わなければ、追放される。脅迫によって怯えた共同体から即座に臨時収入を得られるが、後々まで不安が残り、ユダヤ人仲介者が長年支えてきた交易網に混乱をもたらす。"
 jewish_expulsion_threat.a: "最後通牒を突きつける。"
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "追放による脅迫"
 jews_may_choose_to_leave_tt: "わが国の[ShowReligionAdjective('judaism')][pops|e]のほとんどが、近隣の[countries|e]に移住する\n\n彼らが去った[location|e]は[ShowModifier('jewish_expulsion_threat')]に晒され、その規模は[ShowReligionAdjectiveWithNoTooltip('judaism')][pops]の割合によって変動する"
