l_japanese:
 fra_taille_tax_decision.title: "恒久的税制の誕生"
 fra_taille_tax_decision.desc: "大規模な取り組みのすえに、[ruler_fra.GetName]は[ROOT.GetCountry.GetName]の財政の改造を完了した。[ROOT.GetCountry.GetNameWithNoTooltip]は、戦争時にのみ徴収される[ShowPolicyName('exceptional_only')]税の政策を維持してきたが、[ruler_fra.GetShortNameWithNoTooltip]は恒久的な税制の枠組みを作り上げたのだ。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]階級と[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]階級の譲歩によって、この税制は実現した。[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]たちと[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]たちからは承認は得られていないものの、この新しい政策を施行することは可能だ。"
 fra_taille_tax_decision.desc.entry: "戦時に限って認められる税では、戦役のたびに改めて承認を得なければならない。これを恒久化すれば、そうした手間はなくなる。$nobles_estate$と$clergy_estate$も、自分たちではなく$burghers_estate$と$peasants_estate$が負担するのであれば、同意するだろう。"
 fra_taille_tax_decision.a: "発令しよう。"
 fra_taille_tax_decision.b: "従来どおりでいこう……"
 enables_taille_laws: "[ROOT.GetCountry.GetName]が[ShowLawName('fra_taille')]法を利用できるようになる"
 fra_taille_tax_decision.historical_info: "シャルル7世の治世下、フランスにおける恒久的な税制の誕生へとつながる「タイユ税」が制定され、フランスの財政が刷新された。タイユ税は直接土地税であり、貴族と聖職者はこの税は免除されたが、百年戦争終結後の国家財政を大いに助けた。"
 fra_5_percent_tax_decision.title: "[target_character.GetLastNameWithNoTooltip]の二十分の一税"
 fra_5_percent_tax_decision.title.entry: "$de_machault$の二十分の一税"
 fra_5_percent_tax_decision.desc: "[ShowLawName('fra_taille')]はもともと、[ROOT.GetCountry.GetLongName]で使われていた封建的な税制に代わって制定されたものだ。しかし、時が経つにつれて、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちに付与された古い特権は、より大きな国家の税制において非効率となってきた。\n\n[ROOT.GetCountry.GetAdjectiveWithNoTooltip]政府の一員である[target_character.GetName]は、[ShowLawNameWithNoTooltip('fra_taille')]を再定義し、一般土地税に#italic 二十分の一税#!を含めるという提案をおこなった。これにより、税が[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]に拡大されるのだ。この提案は国家財政にとって有益だが、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]はすでに激しい反対の声を上げている。"
 fra_5_percent_tax_decision.desc.entry: "何世紀も前の功労に対する褒賞として認められた免税特権が、いまなお毎年国庫の歳入を減らしている。$name_john.french_language.alternative$＝バティスト・ド・$de_machault$は、すべての土地所有者から土地の収益の一定割合を徴収するよう提案している。負担そのものはさほど大きくないが、例外なく課税されるという原則に、$clergy_estate$と$nobles_estate$はすでに猛反発している。"
 fra_5_percent_tax_decision.a: "強引にでも制定せよ！"
 fra_5_percent_tax_decision_tt: "$name_john.french_language.alternative$＝バティスト・ド・$de_machault$が[court|e]に加わる"
 fra_5_percent_tax_decision.b: "彼らを怒らせるわけにはいかない。"
 unlocks_machault_tax_reforms: "[ROOT.GetCountry.GetName]が[ShowLawName('fra_taille')]を拡大する[ShowLawName('fra_5_percent_tax')]法を利用できるようになる"
 fra_5_percent_tax_decision.historical_info: "ジャン＝バティスト・ド・マショーが1745年12月にフランスの財政総監に就任したとき、貴族も聖職者も一般土地税であるタイユを支払っていなかったため、フランスは破産寸前だった。マショーは1749年、聖職者や貴族の多くが収めていなかった従来の十分の一税を、例外なく二十分の一税に切り替えることを提案し、制度の改革を試みた。この提案は大反対に遭い、マショーは改革を諦めざるを得なかった。"
 fra_fouage_tax_decision.title: "暖炉税"
 fra_fouage_tax_decision.desc: "その治世を通じて、[scope_ruler.GetName]は[ROOT.GetCountry.GetGovernment.GetRulerTitle]として非常に贅沢な生活を送ってきた。[GetCountry('FRA').GetName]全土の領地をめぐる贅を尽くした旅行から、[ROOT.GetCountry.GetCapital.GetName]にある王宮の維持管理まで、散財の数々は[ROOT.GetCountry.GetGovernment.GetAdjective]の国庫にとって莫大な負担となっている。閣僚たちは[scope_ruler.GetShortNameWithNoTooltip]の贅沢な生活様式への対抗策として、[GetCountry('FRA').GetNameWithNoTooltip]全国の家庭に新たに「暖炉税（#italic Fouage#!）」を課す考えを打ち出した。この税金は[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]に相当な負担を強いるものの、[ROOT.GetCountry.GetGovernment.GetAdjective]の国庫を回復させ、同時に[scope_ruler.GetShortNameWithNoTooltip]が贅沢な生活を維持することを可能にする。"
 fra_fouage_tax_decision.desc.entry: "宮殿の維持や巡幸、華やかな宮廷の移動には多額の費用がかかり、君主の私財だけで賄えるものではない。暖炉税なら$FRA$の全世帯から徴収でき、国庫もたちまち潤うだろう。内閣にとっては好都合だが、課税される民にとってはそうではない。"
 fra_fouage_tax_decision.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]のためだ。徴収せよ。"
 fra_fouage_tax_decision.a.entry: "$crown_estate$のためだ。徴収せよ。"
 fra_fouage_tax_decision.b: "いまは導入すべきではない。"
 fra_fouage_tax_decision.c: "国家は[scope_ruler.GetShortNameWithNoTooltip]の贅沢を支えるためのものではない。"
 fra_fouage_tax_decision.c.entry: "国家は統治者の贅沢を支えるためのものではない。"
 variable_tt_enabled_fouage_tax: "フアージュが有効になった"
 fra_fouage_tax_decision.historical_info: "黒死病と百年戦争の財政的影響と並んで、王室の支出を賄うためにフィリップ6世の治世に徴収された暖炉税（フアージュ）は、フランス君主の国庫を維持するために徴収された、注目すべき税金のひとつ。この税が課されたのは[GetCountry('FRA').GetAdjectiveWithNoTooltip]の特定地域だったが、14世紀後半にはフランス全土に広まった。"
 fra_edict_of_toleration_decision.title: "フォンテーヌブローの勅令"
 fra_edict_of_toleration_decision.desc: "宗教改革の広がりは[ShowContinentName('europe')]全土に衝撃を与え、[ShowReligionAdjective('catholic')]教会の教えに不信感を募らせた人々の多くが、新たに創設された[ShowReligionAdjective('lutheran')]信仰を公言している。[GetCountry('FRA').GetName]の大多数の人々は依然として[ShowReligionAdjectiveWithNoTooltip('catholic')]信仰に忠実だが、[ShowReligionAdjectiveWithNoTooltip('lutheran')]信者の影響力の増大により、[ROOT.GetCountry.GetGovernment.GetCourtTitle]はなんらかの行動を求められる事態となっている。\n\n[ruler_fra.GetName]は、[ShowPolicyName('edict_of_fontainebleau')]を制定するよう求められた。これは[GetCountry('FRA').GetNameWithNoTooltip]に大きな不安をもたらす前に、増大しつつある[ShowReligionAdjectiveWithNoTooltip('lutheran')]の影響力を打ち砕くことを目的としている。"
 fra_edict_of_toleration_decision.desc.entry: "商人や印刷業者のあいだに広まった信仰は、農民が信奉するものより抑え込みにくい。[ShowReligionAdjective('lutheran')]の会衆はまだ数が少ない。いまのうちに[ShowPolicyName('edict_of_fontainebleau')]によって弾圧するか、それとも共存を受け入れるか、わが宮廷は選ばなければならない。"
 fra_edict_of_toleration_decision.a: "異端の拡大と戦うため、行動を起こさなくては。"
 fra_edict_of_toleration_decision.b: "我々は[ShowReligionAdjectiveWithNoTooltip('lutheran')]の信者とともに、人文主義の展望を維持すべきだ。"
 fra_colonial_ambitions_decision.title: "植民地設立への再挑戦"
 fra_colonial_ambitions_decision.desc: "宗教的混乱が数十年にわたって[GetCountry('FRA').GetName]を包んできたものの、[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]はいまこそ新大陸に再び植民地を設立すべきだと提案した。以前の探検家たちの航海も、新大陸についての素晴らしい情報を[GetCountry('FRA').GetNameWithNoTooltip]にもたらしたが、宗教改革の発生によって[ROOT.GetCountry.GetGovernment.GetCourtTitle]はそれ以上の植民地設立の野望を断念せざるを得なくなったのだ。しかし、[ShowContinentName('europe')]の各植民地大国はすでに新大陸に独自の入植地を築いており、[GetCountry('FRA').GetAdjectiveWithNoTooltip]の参入は彼らとの外交破綻を招くかもしれない。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]の別の見解では、新たなインド貿易航路を独占することを重視し、[ShowContinentName('asia')]に貿易会社を設立することを提案している。"
 fra_colonial_ambitions_decision.desc.entry: "西への航路はすでに知っていた。だが国内が落ち着かず、その知識を活かせないまま10年が過ぎた。そのあいだに競争国は次々と植民地を築いたため、いまから入植地を築けば、他国の植民地と隣り合うことになる。ならば、西方への進出ではなく、[ShowContinentName('asia')]との交易に目を向ける手もある。"
 fra_colonial_ambitions_decision.a: "新大陸の土地こそ、わが国が重視すべきものだ。"
 fra_colonial_ambitions_decision.b: "インド貿易の独占を追い求めるべきだ。"
 fra_centralize_monarchy_decision.title: "アパナージュ領地の統一"
 fra_centralize_monarchy_decision.desc: "何世紀にもわたる分断を経て、王室はついにアパナージュの多くを取り戻し、再び王家の領地として統合した。カペー家の多くの分家が有能な臣民であることが証明された一方で、その存在によって中央集権化は阻まれてもいたのだ。これらの土地が統合されたことで、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]とその宮廷は、[GetCountry('FRA').GetName]をより近代的な国家に改革するための一歩を踏み出すことができる。"
 fra_centralize_monarchy_decision.desc.entry: "代々、アパナージュは王家の親族が治めてきた。都合のよい仕組みではあったが、そのため改革を進めることもできなかった。ようやくこれらの土地も王権の直轄下に入り、国全体をひとつにまとめて治められるようになった。"
 fra_centralize_monarchy_decision.a: "[GetCountry('FRA').GetNameWithNoTooltip]の近代化への大きな一歩だ。"
 fra_code_louis_decision.title: "ルイ法典の起草"
 fra_code_louis_decision.desc: "[fra_ruler.GetName]はこの国の統一された法を作り上げようと、[ROOT.GetCountry.GetGovernment.GetCourtTitle]の側近たちとともに、[ROOT.GetCountry.GetName]全体で初の統一された法規範である「ルイ法典」の作成を決定した。[ROOT.GetCountry.GetNameWithNoTooltip]は何世紀にもわたり、2つの恒久的な法体系を併存させてきた。北部地方は古い慣習法に支配され、南部ではローマ民法が主要な法体系として機能していたのだ。\n\nこのルイ法典によって[ROOT.GetCountry.GetNameWithNoTooltip]の法規範が統一されることになるものの、相談役のなかには一部の地方、特にこれまでローマ法に支配されていた南部地域では、新たな法規範を採用するうえで障害に直面する可能性があり、その実施を急ぐべきではないと警告する者もいる。"
 fra_code_louis_decision.desc.entry: "商人は州境を越えるたび、馬を替えるように、適用される法まで変わる。$FRA$全土に共通の法典を定めれば、こうした法の不統一も解消されるだろう。だが南部諸州では、王国が成立する以前からローマ法が守られており、簡単には手放そうとしない。"
 fra_code_louis_decision.a: "[ROOT.GetCountry.GetNameWithNoTooltip]全土が、統一されたひとつの法に従う時が来た。"
 fra_code_louis_decision.a.entry: "いまこそ、皆が同じ法に従う時だ。"
 fra_code_louis_decision.b: "ひとまず、[ROOT.GetCountry.GetNameWithNoTooltip]の北部地方にのみこの法を適用しよう。"
 fra_code_louis_decision.b.entry: "ひとまず、$FRA$の北部地方にのみこの法を適用しよう。"
 fra_versailles_residence_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]とヴェルサイユ宮殿"
 fra_versailles_residence_decision.title.entry: "$nobles_estate$とヴェルサイユ宮殿"
 fra_versailles_residence_decision.desc: "ヴェルサイユ宮殿は建設以来、[fra_ruler.GetName]と[ROOT.GetCountry.GetGovernment.GetAdjective]の一族が、[ROOT.GetCountry.GetName]の政治に携わる著名人たちを集める場として、急速に人気を博していった。この宮殿は[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetRulerTitle]の「神授王権」の象徴として建設されたものだが、時を経て、居住を許された者たちの政治的厚遇と地位の象徴ともなった。\n\n[fra_ruler.GetName]の側近たちは、古い封建的なやり方に固執する有力一族をヴェルサイユ宮殿に居住させるため、招待状を出すよう[fra_ruler.GetShortNameWithNoTooltip]に促している。こうした古い一族を取り込むことによって、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]を中心に権力をさらに集めることができるのだ。"
 fra_versailles_residence_decision.desc.entry: "大勢の客を迎える大邸宅は、それだけ多くの人質を抱えることにもなる。旧来の封建的な慣習を捨てきれない諸家をヴェルサイユに招き、厚遇してそのまま宮廷に引き留めればよい。そこに留まる期間が長いほど、彼らは$crown_estate$にとって脅威ではなくなっていくだろう。"
 fra_versailles_residence_decision.a: "ヴェルサイユ宮殿に住まわせるため、著名な一族へ送る招待状を増やそう。"
 fra_versailles_residence_decision.b: "この宮殿は、[ROOT.GetCountry.GetGovernment.GetAdjective]の一族のために作られたのだ。"
 fra_versailles_residence_decision.b.entry: "この宮殿は王家のために作られたのだ。"
 this_may_lead_to_permanent_weakening_of_the_nobility: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]たちをヴェルサイユ宮殿に住まわせると、彼らの影響力が恒久的に弱まる可能性がある。"
 fra_versailles_permanent_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の宮廷定住"
 fra_versailles_permanent_decision.title.entry: "$nobles_estate$の宮廷定住"
 fra_versailles_permanent_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]の忠誠心と政治的影響力を確保するために、彼らをヴェルサイユ宮殿に住まわせる取り組みは非常に効果があった。いまや政治に携わるさまざまな一族が、自分の領地ではなく宮殿に住むことを選ぶようになってきている。ヴェルサイユ宮殿で[ROOT.GetCountry.GetGovernment.GetAdjective]の舞踏会が開催されるたびに、彼らは宮殿の豪華さに魅了され、[fra_ruler.GetName]の寵愛を受けられる関係を保とうとする。\n\nかつては[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetRulerTitle]の悩みの種だったヴェルサイユは、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]階級に属する多くの者の大半を惹きつける場所となった。そうしてついに、[fra_ruler.GetShortNameWithNoTooltip]は絶対的かつ、逆らうもののいない[ROOT.GetCountry.GetGovernment.GetRulerTitle]となったのだ。"
 fra_versailles_permanent_decision.desc.entry: "罠は、誰もが予想したよりも穏やかに彼らを絡め取った。いまや$nobles_estate$は、自らの領地で権力を争う代わりに、わが宮廷で部屋や席次をめぐり競い合っている。こうして競争相手に悩まされなくなった統治者に、もはや挑む者はいない。"
 fra_versailles_permanent_decision.a: "ヴェルサイユ宮殿の輝きを前に、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]たちが輝くことは永遠にない。"
 fra_versailles_permanent_decision.a.entry: "ヴェルサイユ宮殿の輝きを前に、$nobles_estate$たちが輝くことは永遠にない。"
 fra_versailles_permanent_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の歴史的な権力は、依然として尊重すべきだ。"
 fra_versailles_permanent_decision.b_tt: "今後、「$permanent_residence_in_versailles$」を選択できるようになる"
 fra_versailles_permanent_decision.b.entry: "$nobles_estate$の歴史的な権力は、依然として尊重すべきだ。"
 fra_marcel_great_ordinance_decision.title: "大勅令"
 fra_marcel_great_ordinance_decision.desc: "最近の紛争により、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の財政は大きく逼迫しており、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]のために資金と軍隊を徴収するべく、新たな支援を三部会に求めざるを得なくなった。しかし、ここ数十年で三部会全体に不満が広がっており、特に第三身分では、直近の紛争が始まって以来の財政政策の転換をめぐり、戦争への支持に懐疑的な声が上がっている。この反対運動の指導者的存在となっているのが、影響力のある[etienne_marcel.GetName]であり、三部会の膠着状態を打開し、王室に新たな資金を確保するための対案に大きな支持を集めている。[etienne_marcel.GetNameWithNoTooltip]は「大勅令」のなかで、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]にその権限を制限するよう要求し、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]主導の改革への道を開こうとしている。"
 fra_marcel_great_ordinance_decision.desc.entry: "戦費の調達をめぐり、三部会での議論は膠着状態に陥っている。有力な商人たちが率いる第三身分は、戦費調達への協力と引き換えに、自らの特権と権限の拡大を求める「大勅令」を提案した。この提案を受け入れるか、それとも三部会から別の手段で資金を確保するか、決断しなければならない。"
 fra_marcel_great_ordinance_decision.a: "窮地においては、決死の手段が求められる。"
 fra_marcel_great_ordinance_decision.b: "ならば、貴族に頼ろう！"
 fra_marcel_great_ordinance_decision.c: "マルセルと妥協点を探ろう。"
 fra_marcel_great_ordinance_decision_cooldown: "最近、マルセルへの協力を拒否した"
 fra_marcel_great_ordinance_decision.historical_info: "ポワティエの戦いで国王ジョン2世が捕らえられたあと、摂政となった王太子シャルルは、この戦いの影響に対処するため三部会の招集を余儀なくされた。その際、第三身分で強い影響力をもつエティエンヌ・マルセルの猛反対を受けた。マルセルはシャルルに対し、大勅令への調印をはじめとするいくつかの要求を受け入れるよう迫るとともに、マルセルが政治的に連携していたナバラ王国の“邪悪王”カルロス2世の釈放など、政治的な妥協も要求した。シャルルは当初マルセルの要求に抵抗していたが、最終的にはこれを受け入れ、大勅令に調印した。しかし、ジョン2世は1357年にこれを禁止し、大勅令の完全な発効を阻止した。"
 fra_marcel_compromise_decision.title: "大勅令をめぐる妥協"
 fra_marcel_compromise_decision.desc: "[ROOT.GetCountry.GetLongName]はいまなお戦争のさなかにあり、[etienne_marcel.GetName]があの提案をおこなうに至った国内の苦境も、いまだ改善していない。かつて我々はその提案を退けたが、いまや三部会の支持なしに[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]がこの難局を乗り切るのは難しいと認めざるを得ない。そろそろ[etienne_marcel.GetNameWithNoTooltip]に歩み寄り、以前の提案を改めて検討して、妥協の道を探るべきかもしれない。権限の一部を譲ることにはなるが、その見返りとして三部会から財政支援を得られるだろう。"
 fra_marcel_compromise_decision.desc.entry: "我々は大勅令の条件を受け入れなかったが、戦争はいまだ続いており、三部会もこの状況を利用して優位に事を進めようとしている。こちらから交渉を持ちかければ、妥協の余地はあるかもしれない。"
 fra_marcel_compromise_decision.a: "マルセルと妥協点を探ろう。"
 fra_marcel_compromise_decision.a.tt: "$Marcel$が今後、我々に反対しなくなる"
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"
 fra_formalized_relations_decision.title: "[ShowRegionNameWithNoTooltip('italy_region')]の問題"
 fra_formalized_relations_decision.desc: "最近、アルプス山脈に沿った南部国境への関心が再び高まっている。[ROOT.GetCountry.GetGovernment.GetAdjective]の[ROOT.GetCountry.GetGovernment.GetCourtTitle]は、過去にいくつかの[ShowCultureGroupName('italian_group')]国家や[ShowRegionName('italy_region')]の名家と接触してきたが、この地域との安定した関係を維持することは困難であった。さまざまな相談役や廷臣が[fra_ruler.GetName]に対し、[ShowRegionNameWithNoTooltip('italy_region')]には多くの国家が存在するものの、強力な政治的同盟国となる可能性を秘めているとして、[ROOT.GetCountry.GetName]はこの地域での影響力を拡大すべきだと進言している。また、[ROOT.GetCountry.GetGovernment.GetCourtTitle]のなかには、より強硬な方針をとり、[ShowCultureGroupNameWithNoTooltip('italian_group')]諸国を力で[ROOT.GetCountry.GetNameWithNoTooltip]の傘下に組み込むべきだと主張する者もいる。"
 fra_formalized_relations_decision.desc.entry: "近年、アルプスの峠は辺境というより、むしろ新たな好機へ通じる道のように見えてきた。[ShowRegionName('italy_region')]の[ShowCultureGroupName('italian_group')]諸国は豊かでありながらも分裂しており、どの進言を採るかによって、同盟を結ぶ相手にも、従属させる相手にもなり得る。"
 fra_formalized_relations_decision.a: "有益な国家と友好的な関係を築くよう努めよ。"
 fra_formalized_relations_decision.b: "いまは政治的中立を維持すべきだ。"
 fra_formalized_relations_decision.c: "[ShowCultureGroupNameWithNoTooltip('italian_group')]諸国は我々の支配下でこそ輝く。"
