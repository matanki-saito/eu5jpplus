l_japanese:
 eng_yorkist_tradition_decision.title: "中産階級からの官僚登用"
 eng_yorkist_tradition_decision.desc: "政府の役職に就く優秀な男性を確保するのはますます難しくなっており、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]の者たちに加え、拡大する中産階級、特に法律家も選択の対象とするべきだという声が上がっている。両党は、我々が変化を求める声に耳を傾け、そのような政策を採択することを待ちわびている。"
 eng_yorkist_tradition_decision.desc.entry: "中産階級の拡大に伴い、そこからも官吏を登用すべきだという声が上がっている。登用の対象を中産階級にまで広げれば、より多くの優秀な人材を見つけ出せるだろう。"
 eng_yorkist_tradition_decision.a: "彼らを支持しよう。"
 eng_yorkist_tradition_decision.b: "彼らに政務を担わせるべきではない。"
 enable_yorkist_tradition_policy: "[policy|e]「[ShowPolicyName('yorkist_tradition_policy')]」が利用可能になる"
 eng_yorkist_tradition_decision.historical_info: "主に聖職者や法律家といった中産階級から政府の役人を登用することは、イングランドで長年受け継がれてきたヨークの伝統だった。貴族や聖職者たちは、政府高官を社会的地位の高い者、あるいは神に任命された者の特権とみなし、これに強く反対した。"
 eng_court_of_the_star_chamber_decision.title: "星室庁"
 eng_court_of_the_star_chamber_decision.desc: "司法は現在、[ShowPolicyName('common_law_policy')]の能力を最大限に活用しておこなわれている。しかし、判例と裁判官の判断に頼っているため、裁判の手続きは恐ろしく時間がかかり、判決が出るまでに数週間、場合によっては数ヵ月かかる場合もあった。手続きにある程度の柔軟性をもたせ、通常の裁判所では扱いにくい、または複雑すぎる問題も扱えるような第二の司法裁判所を求める声もある。ただし、潜在的かつ控えめな効果として、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]の権限が拡大されることで反対意見が抑圧され、処罰される可能性もある。"
 eng_court_of_the_star_chamber_decision.desc.entry: "判例に基づいて裁きを下すのがわが国の伝統だが、そのため手続きは遅くなり、判決にも時間がかかる。独自の手続きで審理できる別の法廷を設ければ、こうした案件も迅速に処理できるだろう。それが新たな慣例として定着すれば、$crown_estate$にとっても大いに役立つはずだ。"
 eng_court_of_the_star_chamber_decision.a: "わが国に必須のものだ。"
 eng_court_of_the_star_chamber_decision.b: "[ShowPolicyNameWithNoTooltip('common_law_policy')]で十分だ。"
 enable_court_of_the_star_chamber_reform: "[government_reform|e]「[ShowGovernmentReformName('court_of_the_star_chamber_reform')]」が利用可能になる"
 eng_court_of_the_star_chamber_decision.historical_info: "星室庁とは、王政庁の集まりから生まれたもので、ヘンリー7世の治世に徐々に重要性を増していった。その名称は、法廷が開かれたウェストミンスター宮殿の天井に描かれた星の模様に由来している。1487年、星室庁は、救済を求める申し立てへの対応を職務とする、評議会とは異なる司法機関として確立された。"
 eng_benevolence_tax_decision.title: "徳税の導入"
 eng_benevolence_tax_decision.desc: "優れた国政運営により、[ROOT.GetCountry.GetGovernment.GetRuler.GetName]は[ShowDisasterName('war_of_the_roses')]後の[ROOT.GetCountry.GetAdjective]の君主制の権力と安定を見事に回復させた。細部にまで目を配り、贅沢な支出を嫌うその姿勢は高く評価されている。そしていま、その関心は、非情なまでに効率的な徴税の仕組みを導入し、新たな歳入を確保することへと向けられている。"
 eng_benevolence_tax_decision.desc.entry: "倹約を心がけ、勘定にも細かい統治者なら、やがて周囲の者たちの出費にも敏感になる。[ShowDisasterName('war_of_the_roses')]後に勝ち取った平和によって国庫は安定し、統治者にも新たな財源を探る余裕が生まれた。いまやその関心は富裕層の懐にまで及んでいる。"
 eng_benevolence_tax_decision.a: "平穏と経済的繁栄が肝要だ。"
 eng_benevolence_tax_decision.b: "我々が築き上げた安定を謳歌しよう。"
 eng_benevolence_tax_decision.a.custom: "[policy|e]「[ShowGovernmentReformName('benevolence_tax_reform')]」が利用可能になる"
 eng_benevolence_tax_decision.historical_info: "ヘンリー7世の治世は王国の財政を安定させ、君主制を強化し、大法官ジョン・モートンの助けを借りて「徳税」を導入した。慎ましい暮らしを送る者たちは蓄財があり、贅沢な暮らしを送る者は言うまでもなく裕福である。ゆえに、どちらも徳税を払う余裕はあるはずだとして、この税金は導入された。"
 eng_council_of_the_north_decision.title: "北部評議会"
 eng_council_of_the_north_decision.desc: "[ROOT.GetCountry.GetCapital.GetName]までの距離があまりに遠いため、北部において法を執行する者の欠如が深刻化している。こうした問題に対処するべく[target_location.GetName]に独立評議会を設置し、ある程度の権利を委任して秩序を守らせるのもいいだろう。"
 eng_council_of_the_north_decision.desc.entry: "馬を飛ばして3週間もかかるようでは、正義は果たされない。[ShowLocationName('york')]に独自の権限を持つ評議会を置けば、北部諸州からの請願をわざわざ国中に運ばせることなく、現地で対応できる。ただし、そのためにはもはや我々自身では十分に行使できない権限を評議会に委ねなければならない。"
 eng_council_of_the_north_decision.a: "設置に同意しよう。"
 eng_council_of_the_north_decision.b: "組織ばかり増えても意味がない。"
 eng_council_of_the_north_decision.b_tt: "[ShowAreaName('northumbria_area')]の全ロケーションが[modifier|e]「[ShowModifier('lack_of_conciliar_justice')]」を得る"
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "調停機関の欠如"
 eng_council_of_the_north_decision.historical_info: "北部評議会は、北イングランドをより直接的に支配することを目的に設置された行政機関である。評議会の主な機能は、法と秩序を維持し、最北部の国民の王室への忠誠を確保することだった。最終的にはイングランド内戦中の1641年に廃止された。"
 eng_austere_monastic_life_decision.title: "修道院の改革"
 eng_austere_monastic_life_decision.desc: "[ROOT.GetCountry.GetName]の修道会の過剰な富は、長く改革派の悩みの種だった。強力な教会組織に対する[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]の不満も、変革を求める一因となっている。\n\n我々はこうした慣習を改革し、修道会の厳格で隠遁的な理想への回帰を試みるべきかもしれない。\n\n現在、合計で#Y [ROOT.GetVariable('num_of_monasteries').GetValue]#!ヵ所の修道院が国内に存在する。"
 eng_austere_monastic_life_decision.desc.entry: "裕福な隠修士ほど、貧しい者たちの反感を買うものはない。改革派は長年、こうした修道会のあり方を批判してきたが、いまでは$peasants_estate$もその考えに賛同しはじめている。修道会を本来の誓願に立ち返らせる改革に反対するのは、当の修道会くらいだろう。"
 eng_austere_monastic_life_decision.a: "改革せよ。"
 eng_austere_monastic_life_decision.a.custom: "修道会から聖職者が大量に流出し、[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]となる"
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
 eng_austere_monastic_life_decision.b.custom: "修道会の[ShowPopTypeName('clergy')]の[pop_satisfaction|e]が[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]増加する"
 eng_austere_monastic_life_decision.tt: "この[privilege|e]が剥奪されないかぎり、修道院を解散させることはできない"
 eng_austere_monastic_life_decision.historical_info: "宗教改革または修道院解散は、イングランドが宗教改革を受け入れたあとの16世紀に起こった大きな出来事である。国王の側近だったトマス・クロムウェルは当初、ローマ・カトリック教会の延長にあるものとみなされていた修道院制度を解体しようとした。この出来事は、イングランドじゅうの修道院、大修道院、女子修道院を含む宗教施設の閉鎖というかたちで完結した。"
 eng_navy_board_decision.title: "海軍委員会"
 eng_navy_board_decision.desc: "わが国の国境が国外からの侵略に対して脆弱であることは周知の事実だ。[ROOT.GetCountry.GetName]の未来を守るため、我らが島を取り巻く海域を掌握し、わが領土への侵攻を未然に防がなければならない。\n\n兵站能力を拡充し、艦隊の運用を効率化することで、わが国は造船力を増強するとともに、経費を抑えながらより大規模な海軍を維持できるようになるだろう。"
 eng_navy_board_decision.desc.entry: "島国を守るには、まず周囲の海を守らなければならない。だが、その海を見張るのは外国の艦隊だ。造船、物資管理、糧食補給を一元化すれば、同じ費用でより多くの艦船を運用できる。現状の財政で海軍を拡張するには、こうした効率化に頼るしかない。"
 eng_navy_board_decision.a: "必要な改革をおこなう。"
 eng_navy_board_decision.b: "重要なのは軍隊だ。"
 enable_navy_board_reform: "[government_reform|e]「[ShowGovernmentReformName('navy_board_reform')]」が利用可能になる"
 eng_navy_board_decision.historical_info: "16世紀、ヘンリー8世の時代に、造船や物流管理などの海軍業務を監督する海軍委員会が設立された。ヘンリーの指導のもと、海軍委員会はイングランド艦隊の拡張を促進していった。これは、艦隊を無視できない戦力へと変貌させ、外国の侵略からイングランドの安全を確保することが目的だった。"
 eng_grand_remonstrance_decision.title: "大抗議書"
 eng_grand_remonstrance_decision.desc: "議会の代表者が、腐敗や宗教勢力による国政への影響を正すため、いくつもの要求を提出した。[ROOT.GetCountry.GetGovernment.GetRuler.GetName]が長らく議会を召集しないまま統治してきたことを問題視し、議会の権利と特権を守るため、王権の制限を求めている。\n\nさらに、[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]のなかに国王の相談役がいることは、国政における教会の影響力の表れとみなされている。聖職者の内閣への参加を禁止する提案もあり、その実現の見返りとして、議会は今後の立法により協力的になるだろう。"
 eng_grand_remonstrance_decision.desc.entry: "議会は不満と要求を書面にまとめた。書面にした以上、ただ話を聞いてもらうだけではなく、明確な返答を迫っているのだ。その内容は、王権を抑え、$clergy_estate$を内閣から外すというものだ。これに応じれば、長らく得られなかった議会の協力が期待できるという。"
 eng_grand_remonstrance_decision.a: "慎重に言葉を選んで拒否せよ。"
 eng_grand_remonstrance_decision.b: "提案に同意しよう。"
 eng_grand_remonstrance_decision.c: "妥協点を探れ。"
 eng_grand_remonstrance_decision.tt1: "議会は敵意をもって反発し、あらゆる手段で王室の権限を抑制しようとする可能性がある"
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "大抗議書の拒否"
 eng_grand_remonstrance_decision.b.custom: "[government_reform|e]「[ShowGovernmentReformName('grand_remonstrance_reform')]」が実行される"
 eng_grand_remonstrance_decision.c.custom1: "わが国の統治者の外交能力が低いため、成功する可能性は低い"
 eng_grand_remonstrance_decision.c.custom2: "わが国の統治者の外交能力によって、十分な議員を味方につけられる"
 eng_grand_remonstrance_decision.tt2: "妥協案は有利な結果をもたらさない可能性がある"
 eng_grand_remonstrance_decision.historical_info: "大抗議書は、1641年に議会がイングランド国王チャールズ1世に提出した政治文書である。この文書では、国王に対する不満が強調され、国王が議会の手続きに干渉することを制限するための抜本的な改革が提案された。また、カトリック主義への恐怖に関する訴えとともに、国王の相談役の影響力に対する懸念も表明されている。大抗議書が手渡された直後、議会と国王の緊張は高まり、イングランド内戦が勃発することとなる。"
 eng_overhauled_admiralty_decision.title: "海軍本部委員会の刷新"
 eng_overhauled_admiralty_decision.desc: "ある海軍行政官が、海事の経験がないにもかかわらず、大きな可能性を示している。[samuel_pepys.GetName]の影響力、勤勉さ、才能は、海軍本部の改革を助け、王立海軍の専門化に貢献するだろう。"
 eng_overhauled_admiralty_decision.desc.entry: "海軍は勇敢な艦長には事欠かない。だが、物資をきちんと管理できる者となると話は別だ。サミュエル・ピープスには船を指揮した経験がないが、だからこそ、この役目には適任なのかもしれない。"
 eng_overhauled_admiralty_decision.a: "彼を海軍本部書記官に任命しよう。"
 eng_overhauled_admiralty_decision.b: "彼の継続的な労働に期待しよう。"
 enable_overhauled_admiralty_reform: "[government_reform|e]「[ShowGovernmentReformName('overhauled_admiralty_reform')]」が利用可能になる"
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "勤勉なるサミュエル・ピープス"
 eng_overhauled_admiralty_decision.tt3: "彼の海軍委員会での仕事が、海軍の運用能力を効率化する"
 eng_overhauled_admiralty_decision.historical_info: "サミュエル・ピープスの功績は、歴史上重要な時期における、海軍の近代化と改革に不可欠なものとなった。その改革のなかには、海軍の補給と食糧供給の改善、船員と将校の定期給与制度の確立などが含まれる。現在では、10年間にわたり生活の細部まで記録され、ロンドン大火や大疫病などの歴史的な出来事を記録した彼の膨大な日記が有名である。"
 eng_taxation_law_decision.title: "所得税"
 eng_taxation_law_decision.desc: "国の財政状況は依然として問題を抱えており、改革の必要性が議論されている。現在の税制は富裕層に過剰な利益をもたらす一方で、政府の歳入にはほとんど貢献していないとみられている。閣僚の[william_pitt_the_younger.GetName]は、国の財政を補強し、富を再分配するために一時的な所得課税を提唱している。だが、この提案は[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]と[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]には不利益なものとなるだろう。"
 eng_taxation_law_decision.desc.entry: "富裕層を課税対象から外すようでは、十分な歳入は得られず、誰も満足しない。$name_william$・$Pitt$は、一定の期間に限って所得に直接課税し、免税措置もほとんど設けない税制を提案している。だからこそ、$nobles_estate$と$clergy_estate$は最後まで反対を貫くだろう。"
 eng_taxation_law_decision.a: "公正かつ進歩的な税だ。"
 eng_taxation_law_decision.b: "関税と物品税が我々の支えとなるだろう。"
 eng_taxation_law_decision.c: "厄介な政治問題だ。"
 eng_taxation_law_decision.custom: "[law|e]「[ShowLawName('eng_taxation_law')]」が利用可能になる"
 eng_taxation_law_decision.tt: "[target_root_country.GetNameWithNoTooltip]の財政安定性の問題が軽視されていることに、議会が不満を示す"
 STATIC_MODIFIER_NAME_temporary_income_tax: "一時的な所得税"
 eng_taxation_law_decision.historical_info: "所得税は、ナポレオン戦争による財政逼迫に対処するため、イギリスの首相であるウィリアム・ピットによって導入された。ピットの所得税は累進課税として設計され、所得の高い者ほど所得に占める税金の割合が高くなる仕組みだった。この税制は高所得者からの反対に遭い、最終的に戦争終結後に撤回された。"
 eng_factory_working_conditions_decision.title: "工場法"
 eng_factory_working_conditions_decision.desc: "改革派は、絶えず続く搾取、不十分な保護、低賃金での労働を強いられがちな工場労働者の労働権の改善を唱えている。現状を変えようとする試みはすべて反対され、経済成長と生産性に悪影響を及ぼす可能性もあると予想される。ただし、この状況が改善されなければ、労働力が流出していく危険性もはらんでいる。"
 eng_factory_working_conditions_decision.a: "哀れな人々が救済を必要としている。"
 eng_factory_working_conditions_decision.b: "労働力は経済の推進力だ。"
 eng_factory_working_conditions_decision.c: "恩知らずな連中が感謝などするものか。"
 eng_factory_working_conditions_decision.custom: "[law|e]「[ShowLawName('factory_working_conditions_law')]」が利用可能になる"
 eng_factory_working_conditions_decision.historical_info: "工場法はイギリスの主要な法律であり、労働条件を改善し、工場労働者、特に1日の大半を低賃金で働くことになる子供たちの権利を守る上での転換点となるものだった。この法律は、年齢制限、教育要件、工場検査を導入し、工場の所有者に全体的な安全性の向上と雇用記録の保管を義務づけた。"
 eng_coke_smelting_decision.title: "ダービーの事業への投資"
 eng_coke_smelting_decision.desc: "先駆的な製鉄業者である[abraham_darby.GetName]は、溶鉱炉で使用される新しい燃料源を開発した。「コークス」と呼ばれるこの燃料は、業界が主に用いている木炭に比べて揮発性が低く、より高い熱を継続的に発生させることができるとされる。[abraham_darby.GetNameWithNoTooltip]は現在、彼の一族が所有する[ShowBuildingTypeName('iron_foundry')]で試験導入を実施しており、その結果に期待が寄せられている。"
 eng_coke_smelting_decision.desc.entry: "木炭は鍛冶には十分だが、製鉄炉を動かすには熱が足りない。$name_abraham$・$Darby$は石炭を焼き、より安定して燃える燃料を作る試みを続けている。[ShowBuildingTypeName('iron_foundry')]での最初の試験では、森林資源に頼る従来の製鉄では到底望めなかった規模の生産が、近いうちに可能になる兆しが見えている。"
 eng_coke_smelting_decision.a: "これを業界の標準としよう。"
 eng_coke_smelting_decision.tt2: "新たな加工燃料は、大量の[ShowGoodsName('coal')]を必要とする"
 enable_coke_smelting_advance: "[advance|e]「[ShowAdvanceName('coke_smelting')]」が利用可能になる"
 unlocked_advance_coke_smelting_tt: "[decision|e]「$eng_coke_smelting_decision.title$」を実行した"
 eng_coke_smelting_decision.historical_info: "エイブラハム・ダービー1世が発明したコークス製錬プロセスは、産業革命を大きく前進させた主要因であるとみなされている。その直接的な効果は、製鉄技術の根本的な変革であり、これによりさまざまな産業で鉄や鋼が広く採用されるようになった。またこれにより、産業革命に不可欠だった鋳鉄の大量生産の基盤も築かれた。"
 eng_royal_society_decision.title: "王立学会"
 eng_royal_society_decision.desc: "わが国の最も偉大な科学的知性の集まりは、我々の社会における偉大な発明をいくつも生み出してきた。我々は科学とその恩恵を促進し、優れた科学を認め、支援するために、[ROOT.GetCountry.GetCapital.GetName]に本部を置く、独自の評議員によって管理される独立した組織を設立する用意がある。また、この組織は研究努力に焦点を当てた政策や教育のための、科学的助言を提供する役割も果たすだろう。"
 eng_royal_society_decision.desc.entry: "学者たちは国の支援がなくとも集まり、書簡を交わし、論争を重ねている。彼らに欠けているのは、拠点と勅許だけだ。その両方を与えれば、わが国の自然哲学者たちは、自らの探究だけでなく、こちらが抱える問いにも応えてくれるだろう。"
 eng_royal_society_decision.a: "素晴らしい案だ。"
 eng_royal_society_decision.b: "代わりに大学に投資しよう。"
 eng_royal_society_decision.historical_info: "王立学会は1660年、イングランド国王チャールズ2世の治世下に設立された。王立学会を組織したのは科学界を代表する人々であり、彼らは科学的理解の境界を広げ、科学の進歩を確実なものとすることに尽力してきた。その目的は、科学者、学者、知識人が一堂に会して研究成果を交換し、アイデアを具体的な成果へと発展させるための基盤を作ることにあった。"
 eng_royal_society_decision.tt1: "わが国の統治者がこの新たに結成された学会の後援者となる"
 eng_royal_academy_of_arts_decision.title: "王立芸術アカデミー"
 eng_royal_academy_of_arts_decision.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]の資金提供によって、創造性を促進し、芸術を発展させることを目的とする機関の設立が提案されている。この機関は、芸術を学ぶ学生のためのデザイン学校またはアカデミーの役割を果たし、同時にすべての芸術家に開かれた現代美術の展覧会を毎年開催する場所となる。"
 eng_royal_academy_of_arts_decision.desc.entry: "海外で学んだ画家たちは、技法だけでなく、そこで触れた美意識まで持ち帰ってくる。わが国にも美術院を設け、学校を置き、誰でも出品できる年次展を開こう。統治者がその運営を資金面で支えれば、次の世代の画家たちは国内で腕を磨けるようになるだろう。"
 eng_royal_academy_of_arts_decision.a: "承認しよう！"
 eng_royal_academy_of_arts_decision.b: "資金は貧しい人々の教育に使うべきだ。"
 STATIC_MODIFIER_NAME_increased_educational_spending: "教育支出の増加"
 eng_royal_academy_of_arts_decision.historical_info: "王立芸術アカデミーは、視覚的な芸術と建築の振興を目的とする、個人による出資で設立された機関。1768年、サー・ジョシュア・レイノルズやサー・ウィリアム・チェンバーズを含む芸術家グループによって設立され、ジョージ3世が最初の王室後援者となった。この王立アカデミーの会員資格は非常に権威あるもので、各分野に多大な貢献をした芸術家や建築家に授与される。"
 eng_enclosure_act_decision.title: "囲い込み法"
 eng_enclosure_act_decision.desc: "工場や土地の所有者は、地方から都市部への労働力の移動を促進するため、公有地のさらなる私有化を認めるよう議会に請願している。大きな社会的変動を引き起こす可能性は高いが、労働力の確保と全体的な農業生産力の向上にもつながるだろう。"
 eng_enclosure_act_decision.a: "移転する者は生産的な労働者となるだろう。"
 eng_enclosure_act_decision.a.custom: "怒りを抱いた[ShowPopTypeName('peasants')]の暴動により、10個の田園[locations|e]の[prosperity|e]が[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]減少する"
 eng_enclosure_act_decision.tt: "この法案は、[ShowEstateTypeName('peasants_estate')]の犠牲のもとに都市化のプロセスを加速させ、さらなる産業化を促す"
 enable_enclosure_act_policy: "[policy|e]「[ShowPolicyName('enclosure_act')]」が利用可能になる"
 enclosure_riots: "囲い込み暴動"
 eng_enclosure_act_decision.historical_info: "囲い込み法はイングランドで制定された一連の法律で、共有地や空き地のさらなる囲い込み、つまり私有化を可能にしたものだ。これらは農業の商業化が進むと同時に、工業化の発展を支えるために必要とされた、より幅広い経済的・農業的変革の一環だった。この法律は社会的不平等を助長し、何千人もの農村労働者が追い出され、都市に職を求めることを余儀なくするものでもあった。やがて、伝統的な権利の喪失に抵抗する、土地を奪われた農民や労働者による暴動に発展した。"
 sco_witchcraft_act_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]の魔術禁止法"
 sco_witchcraft_act_decision.title.entry: "魔術禁止法"
 sco_witchcraft_act_decision.desc: "近ごろの魔女と魔術に対する世間の嫌悪感の高まりが、宮廷の注意を引くようになってきた。[ROOT.GetCountry.GetGovernment.GetRuler.GetName]のもとには魔女の活動に関する報告が山積みになり、早急な解決が求められている。報告の内容は多岐にわたり、一見無害な地元の治療師が薬を調合したという告発から、悪魔憑きの疑いまでさまざまである。なかには、姿をイモリに変えられたが回復したとする農夫さえいる。\n\n魔女を弾圧する新しい法律の提案が増えており、[ROOT.GetCountry.GetGovernment.GetRulerTitle]もこの問題について自身の意見を表明しはじめている。"
 sco_witchcraft_act_decision.desc.entry: "いまや法廷に持ち込まれる魔術の告発は、窃盗の訴えを上回っている。どの告発を裁判にかけるべきか、見極めなければならない。法令を定めれば、少なくともこうした案件を扱う基準は明確になるだろう。もっとも、魔女を取り締まる法律を設ければ、皮肉にも魔女はかえって増えてしまう。"
 sco_witchcraft_act_decision.a: "魔術禁止法を擁護する。"
 sco_witchcraft_act_decision.b: "魔術禁止法を非難する。"
 sco_witchcraft_act_decision.historical_info: "1563年に制定されたスコットランドの魔術禁止法は、魔術の行使だけでなく、魔女への相談も死罪に値する重罪と定めた。ジェームズ6世は、この新法に基づく最初の大規模な裁判となった「ノース・バーウィックの魔女裁判」において重要な役割を果たした。国王は1597年に『デモノジー（悪魔学）』を出版し魔女狩りを擁護したが、のちに懐疑的な見方を強め、起訴を制限する措置を講じた。スコットランドでは推定6,000人が魔術の容疑で裁かれ、そのうち75%が女性であり、1,500人以上が処刑された。"
 sco_preserve_clan_autonomy_decision.title: "アイオナ法令"
 sco_preserve_clan_autonomy_decision.desc: "[ROOT.GetCountry.GetAdjective]低地に住む多くの[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、後継者を地元の学校で教育しているが、残る多くの[ShowCultureName('highland')]の氏族は依然として伝統的な教育に従っている。\n\n時が経つにつれて、これは[ROOT.GetCountry.GetNameWithNoTooltip]にとって不利益とみなされるようになった。[ROOT.GetCountry.GetGovernment.GetCourtTitle]の一部はこれら氏族の構成員に対し、跡継ぎを[ROOT.GetCountry.GetNameWithNoTooltip]の低地地帯にある学校のいずれかに入学させることを義務づける新政策の導入を提案した。\n\nこの政策により、以前よりも教養のある次代の氏族指導者を育成できるが、[ShowCultureNameWithNoTooltip('highland')]の氏族が低地の者たちと同化してしまうのではないかと懸念する声もある。"
 sco_preserve_clan_autonomy_decision.desc.entry: "後継者を地元で学ばせれば、氏族への忠誠が育つ。だが、南方へ送り出せば、今度はそこで教えを授けた者に忠誠を寄せるようになる。[ShowCultureName('highland')]の族長たちにも後継者を南方へ送らせれば、次の世代の領主たちは我々にとってより扱いやすくなり、高地の気風も薄れるだろう。"
 sco_preserve_clan_autonomy_decision.a: "この法令を施行せよ。"
 sco_preserve_clan_autonomy_decision.b: "彼らの旧来の権利をさらに保障しよう。"
 eng_east_india_company_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]東インド会社"
 eng_east_india_company_decision.title.entry: "東インド会社"
 eng_east_india_company_decision.desc: "この時代の、海岸線を有する多くの国と同様に、[ROOT.GetCountry.GetLongName]もまた海外進出の努力を重ね、東インドへの航路を発見するに至った。その豊かな資源を開発するための会社を設立することは、間違いなく我々の利益となるだろう。"
 eng_east_india_company_decision.desc.entry: "東方への航路は、もはや隠しておく価値もない。港を持つ競争国は、すでに皆そこへ船を出している。勅許会社を設立すれば、航海に伴う危険は民間資本に負わせ、王室は無事に持ち帰られた積荷から取り分を得ることができる。"
 eng_east_india_company_decision.a: "この好機を活かせ！"
 eng_east_india_company_decision.b: "国内に注力すべきだ。"
 sco_company_of_scotland_decision.title: "[ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]の設立"
 sco_company_of_scotland_decision.desc: "海外交易が盛んになるにつれ、大陸間の交易路を十分に監督できていないことへの懸念も高まっている。適任者に交易の独占権を与え、船舶の運用を取りまとめるとともに、わが国の投資を守らせるべきだ。"
 sco_company_of_scotland_decision.a: "きっとわが国に繁栄をもたらすだろう！"
 sco_company_of_scotland_decision.b: "少々危険な賭けに思える。"
