l_japanese:
 pol_shooting_societies_decision.title: "射撃協会"
 pol_shooting_societies_decision.desc: "人生はしばしば危険に満ちたものであり、繁栄した土地を簒奪しようとする外国の侵略者が現れるものだ。自国の防衛のため、多くの[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]たちにより[ShowLocationName('krakow')]に射撃協会が設立された。この協会は我々の繁栄を維持し、射撃の名手となる民兵を育てることを目的としている。\n\nわが国の領土と人口が拡大するにつれて、新しい街や都市が独自の射撃協会を設立しようとしている。そのため多くの代表者が、各地にそれらの協会を設立するための支援を正式に要請するようになった。"
 pol_shooting_societies_decision.desc.entry: "火薬と弾薬を自前で用意して訓練する市民なら、国庫に負担をかけず、召集にも応じてくれる。[ShowLocationName('krakow')]で始まった射撃協会を手本に、費用を自前で賄える都市には、同じような団体を設ける勅許を与えてもよいだろう。ただし、そうすれば$burghers_estate$に武器を持たせることになる。"
 pol_shooting_societies_decision.a: "射手は「ヒヨッコ」であってはならない。精度と技術が求められるのだ！"
 pol_shooting_societies_decision.b: "[ShowLocationNameWithNoTooltip('krakow')]にあるもので十分だ。"
 pol_shooting_societies_decision.historical_info: "「雄鶏友の会」として知られる協会の名前の由来は、初期の射撃大会にまで遡る。当初は生きた雄鶏を的として使っていたが、やがて#italic kurs#!と呼ばれる木製の雄鶏像へと変化した。この変化により、「雄鶏友の会（#italic Kur's Fraternity#!）」という名前が定着したのである（#italic kur#!はポーランド語で雄鶏の意）。\n\n銃器の出現により、ハンマーロックと雄鶏の頭が類似している点が注目を浴びるようになった。射手がハンマーロックを引いて発射に備える動作を「コッキング（cockは雄鶏）」と表現するのも、協会の名前との関連を強く想起させた。"
 pol_privilege_of_koszyce_decision.title: "コシツェの特権"
 pol_privilege_of_koszyce_decision.desc: "[ruler_scope.GetName]は[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]に、男子の子孫がいない状態で死亡した場合、娘による王位継承を可能にするよう提案した。[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]にとって、これは[ROOT.GetCountry.GetGovernment.GetRulerTitle]からさらなる特権を手に入れる機会であり、彼ら全員が同意できるものだった。これだけの恩を売れば、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の税金は軽減され、彼らの同意なしにさらなる税が課されることもなくなるだろう。さらに、将来[ROOT.GetCountry.GetGovernment.GetRulerTitle]が外遊する際には身銭を切らなければならず、これは[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]にとっても屈辱的なはずだ。"
 pol_privilege_of_koszyce_decision.desc.entry: "王位を娘に継がせるには同意が必要だが、この国ではそのために見返りを求められる。$nobles_estate$が求めるのは、金銭と免除特権だ。しかも、ここで一度認めた譲歩は、将来の$crown_estate$でも覆せない前例となる。"
 pol_privilege_of_koszyce_decision.a: "この道を貫き通そう。"
 POL_may_form_union_with_lit_at_later_date: "[ShowEstatePrivilegeName('privilege_of_koszyce')]の制定によって、[ROOT.GetCountry.GetName]は[GetCountry('LIT').GetName]と$flavor_pol.55.title$イベントで同君連合を形成できるようになる。"
 pol_privilege_of_koszyce_decision.historical_info: "コシツェの特権は、ハンガリーとポーランドを同君連合として統治していた君主ルドヴィク1世によってシュラフタに与えられた。この特権のおかげで、彼は娘の1人を後継者に据えられたものの、その代償として貴族には多くの特権が与えられ、以後のポーランドは「貴族民主主義」の道を歩むこととなった。娘のヤドヴィガがリトアニアのヨガイラ大公と結婚したことで、ポーランドとリトアニアの同君連合が結ばれ、のちにポーランド・リトアニア共和国の成立に至った。"
 pol_nihil_novi_decision.title: "ニヒル・ノヴィ"
 pol_nihil_novi_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は、最近の[ROOT.GetCountry.GetGovernment.GetParliament.GetName]で最も馬鹿げた提案を持ち出した。[ROOT.GetCountry.GetGovernment.GetAdjective]の適切さに対する妄想のせいか、彼らは自分たちの同意なしに、自らに関する法律が制定されない権利があると考えているのだ。なんという思い上がりだろうか！ とはいえ、彼らの支援なしには今後の軍事作戦費用を捻出できないため、馬鹿馬鹿しくともその提案を考慮しなければならない。さらに、彼らは町民の権利を制限し、農奴の移動の自由を禁じようとしている。我々は、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の請願を受け入れざるを得ないのだろうか？"
 pol_nihil_novi_decision.desc.entry: "$nobles_estate$には自らが認めた法だけを受け入れさせ、その一方で都市民と農奴への締めつけをさらに強めるよう求める請願が議会に出されている。これは請願というより、侮辱に等しい。だが、これを拒めば、戦費を賄う別の方法を探さなければならない。"
 pol_nihil_novi_decision.a: "つまらぬ権利をくれてやれ。"
 pol_nihil_novi_decision.b: "この件は、ひとまず心に留めておこう。"
 pol_nihil_novi_decision.b_tt: "今後、$nihil_novi$を選択できるようになる"
 pol_nihil_novi_decision.historical_info: "「ニヒル・ノヴィ・ニスィ・コッムーネ・コンセンス」は、1505年にポーランドのセイムで制定された法律で、貴族の同意なしには新しい法律を制定しないことを定めたもの。この法はポーランドにおける貴族民主主義の始まりとされ、のちの「黄金の自由」の礎石のひとつとなった。"
 pol_rule_of_the_sejm_decision.title: "ポーランドの選挙君主制"
 pol_rule_of_the_sejm_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]は自分たちの特権に自信をもち、旧き主張を再び持ち出すようになってきた。歴史的な先例を引き合いに出し、[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]のもとで[ROOT.GetCountry.GetFlavorRank]の後継者を選ぶ不可侵の権利を主張する者が増えているのだ。このような馬鹿げた物言いには反対したいものの、[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]を犠牲に[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]の権威が強まっていることは認めざるを得ない。好むと好まざるとにかかわらず、今後の君主の選出については、彼らへの信頼を明言しなければならないだろう。"
 pol_rule_of_the_sejm_decision.desc.entry: "君主を選ぶ権利を握る者が、王権をも左右する。$nobles_estate$はいまや、それを堂々と主張できるほど力をつけた。一方、$crown_estate$にはもはや、それに逆らうだけの力も残っていない。"
 pol_rule_of_the_sejm_decision.a: "我々はセイムを信じる！"
 pol_rule_of_the_sejm_decision.historical_info: "14世紀から15世紀にかけて、ポーランドの統治者を選出する権利は、ポーランドの貴族に拡大された。当初、ヤギェウォ朝の後継者に異論が挟まれる余地はなく、この選挙は単なる形式的なものだった。しかし、ヤギェウォ朝が終焉を迎えると、その状況は一変する。シュラフタをさまざまな外国貴族から選ばなければならない初の選挙がおこなわれたのだ。1573年、ヘンリク・ヴァレジの選挙で真の王の選挙が始まり、その後の君主は18世紀にコモンウェルスが終わるまで外国人候補から選ばれることになる。"
