l_japanese:
 ach_greek_populace_decision.title: "[ShowCultureNameWithNoTooltip('greek_culture')]系有力者の懐柔"
 ach_greek_populace_decision.desc: "[ShowScriptedGeographyName('greece_geography')]における[GetCountry('LAT').GetAdjective]の支配は、かつての[ShowCultureName('greek_culture')]系有力者層の衰退を招いた。だが、国内の一部地域では、旧来の[ShowCultureNameWithNoTooltip('greek_culture')]系名家が、ラテン系[GetEstateName('nobles_estate')]と妥協を重ねることで、なお権勢を保っている。しかし、[GetCountry('LAT').GetLongNameWithNoTooltip]の滅亡以降、[ShowCultureNameWithNoTooltip('greek_culture')]系住民のあいだでは、ラテン系支配への反発が強まっている。\n\n支配の安定を図る君主は、国内に残る[ShowCultureNameWithNoTooltip('greek_culture')]系名家の者たちを宮廷に招き、妥協点を探ろうとしている。しかし一部のラテン系[GetEstateNameWithNoTooltip('nobles_estate')]は、むしろ[ShowCultureNameWithNoTooltip('greek_culture')]系住民に対する自らの諸権利をさらに拡大すべきだと主張している。ラテン系有力者層により大きな力を与えれば、[ShowCultureNameWithNoTooltip('greek_culture')]系住民の不穏な動きを抑え込めるというのである。"
 ach_greek_populace_decision.desc.entry: "いまやこの地では、2つの有力者層が互いを警戒しながら力を保っており、どちらも見返りなしに相手の要求を受け入れる気はない。[ShowCultureName('greek_culture')]系名家を取り込めば民衆の不満を鎮められる一方、ラテン系$nobles_estate$を優遇すれば、すでに武力を握る者たちを味方につけられる。"
 ach_greek_populace_decision.a: "現状を維持しよう。"
 ach_greek_populace_decision.b: "ラテン系[GetEstateNameWithNoTooltip('nobles_estate')]側につく。"
 ach_greek_populace_decision.b.entry: "ラテン系$nobles_estate$側につく。"
 ach_greek_populace_decision.c: "[ShowCultureNameWithNoTooltip('greek_culture')]系諸家との妥協を図ろう。"
 ach_pope_proposes_latin_restoration.title: "ラテン帝国復興への教皇の支持"
 ach_pope_proposes_latin_restoration.desc: "[ShowScriptedGeographyName('greece_geography')]におけるわが国の遠征と勢力の拡大は、教皇庁の関心を引いている。\n\n教皇は、わが国が[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]を掲げる正統性を認めたうえで、[ShowReligionAdjective('catholic')]教会と[ShowReligionAdjective('orthodox')]の関係修復に向けた取り組みに協力するなら、[GetCountry('PAP').GetNameWithNoTooltip]の財政的・政治的支援を与えると申し出ている。\n\nさらに教皇は、たとえ[ShowLocationName('constantinople')]を奪還することがあっても、第4回十字軍が[ShowLocationNameWithNoTooltip('constantinople')]にもたらした悲劇を繰り返してはならないと訴えている。"
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')]は短命に終わったが、わが国の請求権はいまなお残っている。$PAP_ADJ$の支援と引き換えに、我々は[ShowLocationName('constantinople')]を首都とする真の[ShowReligionAdjective('catholic')]帝国を東方に築く。今度こそ、かつての帝国よりも長く続く国にするのだ。"
 ach_pope_proposes_latin_restoration.a: "$PAP_ADJ$の使節の要求を受け入れ、その支援を得よう。"
 ach_pope_proposes_latin_restoration.b: "[ShowLocationNameWithNoTooltip('constantinople')]を奪還するのに、教皇の支援は不要だ。"
 lat_aggressive_conversion_policies_tt: "[GetCountry('LAT').GetLongName]を樹立した場合、教皇の支持を得る見返りとして、強硬な改宗政策の採用を求められる可能性がある"
 lat_frankokratia_pope_proposes_latin_restoration.title: "ラテン帝国復興への支援を教皇に要請"
 lat_frankokratia_pope_proposes_latin_restoration.desc: "[ShowScriptedGeographyName('greece_geography')]におけるわが国の影響力の拡大により、我々はこの地域の有力国となり、その台頭に教皇が注目している。[GetCountry('BYZ').GetName]の影響力が衰えるなか、教皇はいまや我々を、[ShowLocationName('constantinople')]で[GetCountry('LAT').GetLongName]を復興しうる最有力の候補とみなしているのだ。\n\n[GetCountry('PAP').GetAdjectiveWithNoTooltip]の要求の一部に同意し、[ShowLocationNameWithNoTooltip('constantinople')]を奪還すれば、教皇は[GetCountry('PAP').GetLongNameWithNoTooltip]の全面的な支援を提供し、わが国の君主を[GetCountry('LAT').GetLongNameWithNoTooltip]の正統な支配者として認めるだろう。"
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "衰退する帝国と台頭する帝国。その両方を見てきたローマは、ついにどちらを支持するか決めた。[ShowLocationName('constantinople')]を奪還したとしても、その支配の正統性を得るには教皇の承認が必要だ。あちらの要求をある程度受け入れれば、その承認は得られるだろう。"
 lat_frankokratia_pope_proposes_latin_restoration.a: "教皇の求めに応じ、[GetCountry('LAT').GetLongNameWithNoTooltip]を復興させよう。"
 lat_frankokratia_pope_proposes_latin_restoration.b: "教皇の野望に従うつもりはない。"
 lat_greater_claims_of_the_latin_empire.title: "ラテン帝国のさらなる主張"
 lat_greater_claims_of_the_latin_empire.desc: "1204年に[ShowLocationName('constantinople')]が陥落したあと、旧ラテン系有力者層は、[ShowScriptedGeographyName('greece_geography')]各地に残る[GetCountry('BYZ').GetAdjective]領の支配を固め、さらに[ShowRegionName('balkan_region')]への宗主権を主張すべく、ただちに動いた。しかし当時、[GetCountry('SER').GetName]と[GetCountry('BUL').GetName]はラテン勢力にとって大きな対抗勢力となった。なかでも[GetCountry('BUL').GetNameWithNoTooltip]は、ラテン領への度重なる軍事遠征によって、かつての帝国の崩壊において大きな役割を果たした。\n\nラテン帝国が再興されたいま、わが国はこれらの地への支配権を主張し、かつての帝国が成し得なかったことを果たせるかもしれない。"
 lat_greater_claims_of_the_latin_empire.desc.entry: "最初のラテン帝国を滅ぼしたのは、$BYZ_ADJ$の復讐ではなく、最後まで従わせることのできなかった周辺諸国だった。[ShowRegionName('balkan_region')]では、1204年に宗主権を主張した勢力と、のちにそれを退けた勢力のことがいまも忘れられてはいない。復興した帝国がかつての対抗勢力を軽視すれば、再び同じ結末を迎えかねない。"
 lat_greater_claims_of_the_latin_empire.a: "かつての対抗勢力の地へ、わが国の版図を広げよう。"
 lat_greater_claims_of_the_latin_empire.b: "過去の過ちを繰り返してはならない。"
 lat_restore_the_holy_patriarchate.title: "[ShowLocationNameWithNoTooltip('qom')]聖総主教座の復興"
 lat_restore_the_holy_patriarchate.desc: "1204年の[ShowLocationName('constantinople')]略奪は教皇の反対を受けたものの、[ShowLocationNameWithNoTooltip('constantinople')]が[ShowReligionAdjective('catholic')]の十字軍に占領されたことで、総主教座を再興する道が開かれ、[GetCountry('PAP').GetAdjective]の権威を高めることとなった。しかし1261年、[GetCharacter('byz_michael_viii_palaiologos').GetName]が[ShowLocationNameWithNoTooltip('constantinople')]を奪還すると、総主教座は再び廃止された。\n\nいまや[ShowLocationNameWithNoTooltip('constantinople')]においてラテン支配が再び確立されたことで、[GetEstateNameWithNoTooltip('clergy_estate')]の多くが総主教座の再興を求めている。"
 lat_restore_the_holy_patriarchate.desc.entry: "[ShowLocationName('constantinople')]にわが国の庇護を受ける総主教を置けば、この都市の教会を東方の影響から切り離し、わが国のもとに置くことができる。わが国の$clergy_estate$も、かつてこの地に総主教座があったことを忘れておらず、その復活を望んでいる。"
 lat_restore_the_holy_patriarchate.a: "総主教座の再興を認めよ。"
 lat_restore_the_holy_patriarchate.b: "再興された総主教座を必ず守ると誓え！"
 lat_restore_the_holy_patriarchate.c: "再興された総主教座を利用し、わが国の影響力を広げよ。"
 lat_restore_the_holy_patriarchate.d: "総主教座の再興を拒否する。"
 latin_patriarchate_of_constantinople: "[ShowLocationNameWithNoTooltip('constantinople')]の総主教座"
