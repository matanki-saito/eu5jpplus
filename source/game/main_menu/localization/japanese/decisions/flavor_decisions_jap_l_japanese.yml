l_japanese:
 jap_adopt_japan_identity_decision.title: "$JAP$ の名を名乗る"
 jap_adopt_japan_identity_decision.desc: "諸氏族は互いに戦い尽くし、ついに動くに動けぬ膠着に至った。そして一つの家がその他すべてを超えて立ち上がった。それでも世は、我らが治めるこの地の名ではなく、未だかの家の名をもって我らを呼ぶ。\n\n$JAP$ の名を名乗ろうではないか。さすればあらゆる宮廷、あらゆる国が、この国が一つであり、それが我らのものであると知るであろう。"
 jap_adopt_japan_identity_decision.a: "我らは $JAP$ である。"
 jap_adopt_japan_identity_decision.color_tt: "我が国の色として#Y赤色#!を採用する"
 jap_adopt_japan_identity_decision.historical_info: "1603年までに、徳川家康は百年以上に及んだ内乱を終わらせ、将軍の称号を得て、江戸より統一された日本を治めた。彼以前には、織田信長と豊臣秀吉が敵対する大名たちの力を打ち砕いていた。当時のヨーロッパの商人や使節は、概して将軍を日本全土の支配者と見なしていた。"
