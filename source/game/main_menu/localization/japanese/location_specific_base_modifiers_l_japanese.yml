l_japanese:
 STATIC_MODIFIER_NAME_freiberg_base: "フライベルクの銀鉱山"
 STATIC_MODIFIER_DESC_freiberg_base: "この鉱山は12世紀に開発が始まり、やがて中央ヨーロッパにおける主な銀産出地のひとつとなった。"
 STATIC_MODIFIER_NAME_falun_base: "ストラ・コッパベリエ"
 STATIC_MODIFIER_DESC_falun_base: "この鉱山は、ヨーロッパの銅の大部分を供給している。"
 STATIC_MODIFIER_NAME_golconda_base: "ゴールコンダ・ダイヤモンド採掘"
 STATIC_MODIFIER_DESC_golconda_base: "この鉱山からは、全世界でも有数の高品質かつ希少なダイヤモンドが産出される。"
 STATIC_MODIFIER_NAME_skane_herring_market: "スコーネのニシン市場"
 STATIC_MODIFIER_DESC_skane_herring_market: "スカンジナビア全域のニシンが持ち込まれ販売される、1200年に設立された大規模な市場。"
 STATIC_MODIFIER_NAME_almaden_base: "アルマデン水銀鉱山"
 STATIC_MODIFIER_DESC_almaden_base: "この鉱山は、世界で使用される水銀の1/3を供給する。"
 STATIC_MODIFIER_NAME_huancavelica_base: "ワンカベリカ水銀鉱山"
 STATIC_MODIFIER_DESC_huancavelica_base: "この鉱山は、膨大な量の水銀を産出することから、アメリカのスペイン領で最も重要な水銀鉱山となっている。"
 STATIC_MODIFIER_NAME_idrija_base: "イドリヤ水銀鉱山"
 STATIC_MODIFIER_DESC_idrija_base: "この鉱山は、液体と個体（辰砂）の両方の豊かな水銀鉱床を有している。"
 STATIC_MODIFIER_NAME_lanmuchang_base: "ランムーチャン水銀鉱山"
 STATIC_MODIFIER_DESC_lanmuchang_base: "古来より中国で最も重要な水銀鉱山。"
 STATIC_MODIFIER_NAME_potosi_base: "セロ・リコ・デ・ポトシ"
 STATIC_MODIFIER_DESC_potosi_base: "ポトシ山の地下に広がる世界有数の銀鉱山。"
 STATIC_MODIFIER_NAME_zacatecas_base: "サカテカスの銀鉱山"
 STATIC_MODIFIER_DESC_zacatecas_base: "サカテカスの銀鉱山はメソアメリカでも有数の豊かさを誇る。"
 STATIC_MODIFIER_NAME_guanajuato_base: "グアナフアトの銀鉱山"
 STATIC_MODIFIER_DESC_guanajuato_base: "グアナフアトの銀鉱山はメキシコ中央部でも有数の豊かさを誇る。"
 STATIC_MODIFIER_NAME_spice_islands_base: "香料諸島のクローブ"
 STATIC_MODIFIER_DESC_spice_islands_base: "この島では非常に需要の高い香辛料、クローブが大量に生育している。"
 STATIC_MODIFIER_NAME_nile_delta_rice_base: "肥沃な三日月地帯"
 STATIC_MODIFIER_DESC_nile_delta_rice_base: "ナイル川の氾濫原は、あらゆる作物を育てるのに最適な土地だ。"
 STATIC_MODIFIER_NAME_nile_delta_wheat_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
