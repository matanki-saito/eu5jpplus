 STATIC_MODIFIER_DESC_nile_delta_fruit_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
 STATIC_MODIFIER_NAME_coffee_yemen_base: "アラビカコーヒー"
 STATIC_MODIFIER_DESC_coffee_yemen_base: "イエメンの土は大量のコーヒー豆の生産に適している。"
 STATIC_MODIFIER_NAME_sahara_salt_mines_base: "サハラの塩鉱山"
 STATIC_MODIFIER_DESC_sahara_salt_mines_base: "サハラの塩鉱山では、サハラ越え交易で流通する塩の大半が生産される。"
 STATIC_MODIFIER_NAME_sikar_copper_mines_base: "ケトリの銅鉱山"
 STATIC_MODIFIER_DESC_sikar_copper_mines_base: "ケトリの銅鉱床では大量の銅が産出される。"
 STATIC_MODIFIER_NAME_nishapur_gems_mines_base: "ニーシャープールのターコイズ鉱山"
 STATIC_MODIFIER_DESC_nishapur_gems_mines_base: "ニーシャープールのターコイズ鉱山には、この魅力的な宝石を豊富に含む鉱床が広がっている。"
 STATIC_MODIFIER_NAME_panjshir_valley_silver_mines_base: "パンジシール渓谷の銀"
 STATIC_MODIFIER_DESC_panjshir_valley_silver_mines_base: "パンジシール渓谷沿いの銀鉱山には豊かな鉱床が眠っており、採掘されるのを待っている。"
 STATIC_MODIFIER_NAME_turda_salt_mines_base: "トゥルダの塩鉱山"
 STATIC_MODIFIER_DESC_turda_salt_mines_base: "トゥルダの塩鉱山はカルパティア地域有数の豊かさを誇っている。"
 STATIC_MODIFIER_NAME_kutna_hora_silver_mines_base: "クトナー・ホラの銀鉱山"
 STATIC_MODIFIER_DESC_kutna_hora_silver_mines_base: "クトナー・ホラの銀鉱山はボヘミアでも有数の豊かさを誇っている。"
 STATIC_MODIFIER_NAME_rammelsberg_silver_mines_base: "ランメルスベルクの銀鉱山"
 STATIC_MODIFIER_DESC_rammelsberg_silver_mines_base: "ランメルスベルクの地下にある鉱山には、豊富な銀鉱床が眠っている。"
 STATIC_MODIFIER_NAME_mali_gold_mines_base: "マリの金鉱山"
 STATIC_MODIFIER_DESC_mali_gold_mines_base: "ブーレの金鉱山はマンサ・ムーサの伝説的な富の源となっている。"
 STATIC_MODIFIER_NAME_kremnica_gold_mines: "クレムニカの金鉱山"
 STATIC_MODIFIER_DESC_kremnica_gold_mines: "クレムニカの金鉱山はカルパティア地域有数の豊かさを誇っている。"
 STATIC_MODIFIER_NAME_srebrenica_silver_mines_base: "スレブレニツァの銀鉱山"
 STATIC_MODIFIER_DESC_srebrenica_silver_mines_base: "スレブレニツァの銀鉱山はバルカン地域有数の豊かさを誇っている。"
 STATIC_MODIFIER_NAME_newfoundland_fishing_grounds_base: "ニューファンドランドの漁場"
 STATIC_MODIFIER_DESC_newfoundland_fishing_grounds_base: "ニューファンドランド諸島周辺の海域は、全世界でも有数の豊かな漁場である。"
 STATIC_MODIFIER_NAME_amber_coast_base: "琥珀海岸"
 STATIC_MODIFIER_DESC_amber_coast_base: "この海岸では琥珀が豊富に産出される。"
 STATIC_MODIFIER_NAME_sicily_sulfur_mines: "シチリアの硫黄鉱山"
 STATIC_MODIFIER_DESC_sicily_sulfur_mines: "このシチリアの硫黄鉱山には、火薬の生産に必要な資源が大量に眠っている。"
 STATIC_MODIFIER_NAME_damascus_base: "ダマスカス刀鍛冶の伝統"
 STATIC_MODIFIER_DESC_damascus_base: "ダマスカスは、その刀剣の卓越した品質で何世紀にもわたり名高く、この伝統工芸の技が、同地の鍛冶職人たちに武器製造において他を圧倒する優位性をもたらしている。"
 STATIC_MODIFIER_NAME_flanders_fine_cloth_base: "フランドル織物の伝統"
 STATIC_MODIFIER_DESC_flanders_fine_cloth_base: "フランドルの織工たちは、代々受け継がれた技を磨き上げ、ヨーロッパ各地で高値で取引される極上の布を生み出してきた。"
 STATIC_MODIFIER_NAME_tuscany_fine_cloth_base: "トスカーナの繊維産業の伝統"
 STATIC_MODIFIER_DESC_tuscany_fine_cloth_base: "フィレンツェとルッカは長らくイタリアにおける高級布生産の中心地であり、そのギルドの技術はヨーロッパ中の羨望を集めている。"
 STATIC_MODIFIER_NAME_venice_glass_base: "ムラーノのガラス工芸の伝統"
 STATIC_MODIFIER_DESC_venice_glass_base: "ムラーノのガラス職人たちは代々受け継がれてきた技を磨き上げ、他に並ぶもののないガラス製品を作り上げている。"
 STATIC_MODIFIER_NAME_toledo_weaponry_base: "トレドの刀鍛冶の伝統"
 STATIC_MODIFIER_DESC_toledo_weaponry_base: "トレドは古くから刀剣の名産地として知られ、この地域の鉄が多く含まれる鉱石を使って、比類なき鋭さを持つ武器を作りつづけてきた。"
 STATIC_MODIFIER_NAME_bilbao_iron_base: "バスクの鉄鉱床"
 STATIC_MODIFIER_DESC_bilbao_iron_base: "ビスカヤの鉄鉱床はイベリアでも屈指の豊かさと品質を誇り、ビルバオは半島中の鍛冶職人に鉄鉱石を供給する主要な産地となっている。"
 STATIC_MODIFIER_NAME_milan_weaponry_base: "ミラノ式武具製造の伝統"
 STATIC_MODIFIER_DESC_milan_weaponry_base: "ミラノとブレシアはヨーロッパ随一の武具生産地として知られ、比類なき品質の板金鎧や武器を生み出してきた。"
 STATIC_MODIFIER_NAME_yorkshire_cloth_base: "ヨークシャーの織物産業"
 STATIC_MODIFIER_DESC_yorkshire_cloth_base: "ヨークシャーとイースト・ミッドランズの町々では織物産業が栄え、織工たちは質の高い毛織物づくりに熟達している。"
 STATIC_MODIFIER_NAME_england_wool_base: "イングランドにおける羊毛の産地"
 STATIC_MODIFIER_DESC_england_wool_base: "この地方では世界でも屈指の良質な羊毛が産出され、ヨーロッパ中の布商人に重宝されている。"
 STATIC_MODIFIER_NAME_bengal_cotton_base: "ベンガルの綿花栽培"
 STATIC_MODIFIER_DESC_bengal_cotton_base: "ベンガルの温暖で湿潤な気候は良質な綿花の栽培に最適で、この地域は世界でも有数の綿花生産地として知られている。"
 STATIC_MODIFIER_NAME_gujarat_cotton_base: "グジャラートの綿花栽培"
 STATIC_MODIFIER_DESC_gujarat_cotton_base: "グジャラートの肥沃な平野では綿花が豊かに育ち、この地の織物交易を支える重要な基盤となっている。"
