l_japanese:
 expedition_category_exploration: "探検"
 expedition_category_commercial: "商業"
 expedition_category_military: "Military"
 expedition_category_religious: "宗教"
 expedition_category_diplomatic: "外交"
 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "毎月[MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2]変動する。理由："
 EXPEDITION_VARIABLES_TT_TITLE: "遠征変数"
 pilgrimage_expedition: "大巡礼"
 pilgrimage_expedition_desc: "わが国の統治者が[ShowReligionAdjective('catholic')]信仰の聖地をめぐる神聖な巡礼の旅に出る。"
 pilgrimage_expedition_historical_info: "エルサレムは、コンスタンティヌス帝がキリストの埋葬と復活の地に聖墳墓教会の建立を命じた4世紀以来、キリスト教徒の巡礼者を引きつけてきた。十字軍の時代、この都市は幾度も支配者を変えた。1099年には第1回十字軍に占領され、1187年にはサラディンに奪われ、1229年にはフリードリヒ2世のもとで条約によって一時奪還されたものの、最終的にマムルーク朝の支配下に入った。キリスト教徒の支配が失われたあとも、外交上の取り決めによって巡礼者は聖地を訪れつづけることができたため、エルサレムは中世世界におけるカトリック信徒の最高の巡礼地となった。"
 pilgrimage_expedition_outcome_overview: "$BULLET$我らの[ruler|e]が到達する[holy_site|e]はそれぞれ、到着時に独自の報酬をもたらす。さらなる[legitimacy|e]、[prestige|e]、あるいは[ShowEstateTypeName('clergy_estate')]からの感謝などである。\n$BULLET$巡礼を完遂すれば、その敬虔さに応じて以下が与えられる：\n$BULLET_WITH_TAB$最大#G +20#! [legitimacy]。\n$BULLET_WITH_TAB$[ShowEstateTypeName('clergy_estate')]の[estate_satisfaction|e]。\n$BULLET_WITH_TAB$[GetCountry('PAP').GetName]からの[opinion|e]の改善。"
 piety: "信仰心"
 piety_desc: "巡礼がどれほどの熱意をもって実施されているかを表す。移動中徐々に衰えていき、道中に世俗的な選択をすることでも消費される。完全に底を突いてしまうと巡礼が不名誉のうちに失敗となる一方、高く維持できれば巡礼の最後に得られる報酬がよりよいものになる。"
 retinue: "随行員"
 retinue_desc: "巡礼する統治者の護衛。自然に減少することはなく、道中不運に遭遇した場合のみ減少する。護衛を完全に失う事態となった場合、統治者は危険に晒された状態に陥り、巡礼の旅は失敗に終わる。"
 pilgrimage_expedition_cooldown: "大巡礼"
 pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] は [pilgrimage_ruler.GetCourtCountry.GetName] に住んでいる"
 holy_site_pilgrimage_expedition: "聖地への巡礼"
 holy_site_pilgrimage_expedition_desc: "わが国の統治者は、祈りを捧げ、祈る姿を人々に示し、旅がもたらす威信と宗教上の恩恵を携えて帰還するため、選択したひとつの聖地へと旅立つ。遠征アウトライナーではなく、巡礼アクションから開始する。"
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$選んだ[holy_site|e]への到着は、我らの[religion|e]に応じた報酬をもたらす：\n$BULLET_WITH_TAB$#G +10#! [religious_influence|e]、[purity|e]、あるいは[karma|e]。首都からの距離に応じて増大し、最大で#G +100#!に達する。\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]の宗教の場合は、代わりに[holy_site]の[god|e]の性質に応じて[yanantin|e]が#Y 20#!変動する。\n$BULLET_WITH_TAB$該当する[ShowReligionGroupAdjective('muslim')]の学派は、さらに[ShowSocietyDirectionName('mysticism')]または[ShowSocietyDirectionName('jurisprudence')]の方向へ#Y 10#!変動する。"
 holy_site_pilgrimage_expedition_order_zeal_tt: "今後何年にもわたり、この所領における巡礼者の献身が、所有者である教団の信仰への熱意をかき立てつづける"
 holy_site_pilgrimage_cooldown: "聖地への巡礼"
 treasure_fleet_expedition: "宝船船団"
 treasure_fleet_expedition_desc: "国家事業として、皇帝の宝船船団を選択した地域へ派遣する。船団は沿岸航路を通って目的地まで往復し、道中で外国の港に寄港する。この航海は宮廷の外交的影響力を広げ、南海諸国の統治者に贈答品や[ShowGoodsName('silk')]を配り、朝貢品を受け取る。そして希少な品々や使節、中国船の帆の音を耳にした王たちの名を携えて帰還する。"
 treasure_fleet_expedition_outcome_overview: "$BULLET$船団はわが国の国庫から支払われた贈答品を積んで出航する。\n$BULLET$無事に帰還すると、使われずに残った分は[gold|e]となり、さらに[prestige|e]が#G +10#!される。\n$BULLET$外国の宮廷ごとに反応も異なる：\n$BULLET_WITH_TAB$わが使節を好意的に迎えた宮廷からは、さらに[prestige]を#G 5#!獲得する。その国はわが国の朝貢国として[GetUniqueInternationalOrganization('middle_kingdom').GetName]に加盟する場合があり、わが国の[market|e]を潤す朝貢品や珍しい贈り物も送ってくる。\n$BULLET_WITH_TAB$朝貢国となることを拒んだ宮廷は、代わりにわが国への[opinion|e]に#R -50#!の補正がかかり、「[ShowModifier('chi_resisting_subjugation')]」を得る。"
 treasure_fleet_cooldown: "宝船船団"
 western_ocean_voyage_expedition: "西方の海へ"
 western_ocean_voyage_expedition_desc: "東インドへの海路を求め、船団を大西洋の外洋へ派遣して西進させる。[ShowAreaName('canary_islands_area')]の先に何が待つのかを示す海図はない。あるのは風と水、そして大洋は学者たちが考えるほど広くはないという希望だけだ。"
 western_ocean_voyage_expedition_historical_info: "西へ航海してアジアに到達するという発想は、そのような航海が初めて試みられる何十年も前から、ヨーロッパの学者たちのあいだで議論されていた。最大の障害は地球の形ではなく、その大きさだった。教養ある人々は地球が球体であると理解していたのだ。大半の学者は、大洋は横断するにはあまりに広いと正しく見積もっていた。のちにその見方を覆すことになった遠征も、海の広さについての見積もりが誤っていたと証明したわけではない。予想外の陸地が、その航路の途中にあったのである。"
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$航海しながら外洋の海図を作成し、到達した沿岸の情報を明らかにする。\n$BULLET$上陸すると以下を獲得する：\n$BULLET_WITH_TAB$[prestige|e]#G +10#!。\n$BULLET_WITH_TAB$[legitimacy|e]#G +10#!。\n$BULLET_WITH_TAB$アメリカ大陸を発見し、新大陸で将来の植民地建設を可能にすると、さらに[prestige]が#G +20#!される。"
 western_ocean_voyage_cooldown: "西方の海へ"
 western_ocean_voyage_expedition_columbus_tt: "クリストファー・コロンブスが我が麾下にある"
 hajj_caravan_expedition: "王室のハッジ"
 hajj_caravan_expedition_desc: "わが国の統治者を[ShowLocationName('mecca')]への巡礼に派遣し、イスラムの五行のひとつを果たさせる。道のりは長く、旅には多大な費用がかかるが、聖都から帰還した統治者は、軍事力では決して得られない権威を帯びる。"
 hajj_caravan_expedition_historical_info: "アッバース朝のカリフ、ハールーン・アッ＝ラシードは、786～809年の在位期間中に、バグダードから9回ハッジに赴いた。信仰心の表れとして道程の一部を徒歩で進むことさえあり、その篤い信仰は以後数世紀にわたって、敬虔な統治者たちが見習おうと努める模範となった。"
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$[religious_influence|e]#G +20#!。\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$[ShowLocationNameWithNoTooltip('mecca')]への到達は、そこでの隊商の威光に応じた報酬をもたらす。最大で：\n$BULLET_WITH_TAB$#G +20#! [prestige|e]。\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$帰国すればさらに以下が与えられる：\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e]。\n$BULLET_WITH_TAB$5年間続く[ShowModifier('hajj_pious_return')] [modifier|e]。\n$BULLET_WITH_TAB$永続する[ShowModifier('hajji_pilgrim')]の栄誉、[ruler|e]にとって最初のハッジに限る。\n$BULLET$隊商は出発した同じ年の内に[ShowLocationNameWithNoTooltip('mecca')]へ到達せねばならず、さもなくば巡礼は完全に失われる。"
 guards: "護衛"
 guards_desc: "旅行隊を守る武装した護衛。道中に傭兵を雇ったり、「マフマル」を担ぐことで数が増え、襲撃や困難によって減少する。守りが堅い旅行隊ほど、襲われても生き延びられる確率が高い。"
 splendor: "威容"
 splendor_desc: "旅行隊がどれほど贅沢に食糧を積み、どれほど豪華に飾り立てられているかを表す。贅沢な支出と富の誇示によって数値が上がり、道中嵐や困難に遭うと低下する。[ShowLocationNameWithNoTooltip('mecca')]到着時の旅行隊の報酬は、この数値で決まる。"
 hajj_caravan_cooldown: "王室のハッジ"
 circumnavigation_expedition: "世界周航"
 circumnavigation_expedition_desc: "世界周航を成し遂げるため、船団を西へ派遣する。[ShowRegionName('la_plata_region')]を越えて南下し、世界の最南端にある海峡を抜け、まだ名もない大洋を横断して香料諸島へ向かい、[ShowLocationName('good_hope_cape')]を回って帰国する。これを成し遂げた船団はまだ存在しない。そもそも実現できるかどうかも定かではない。"
 circumnavigation_expedition_historical_info: "1519年9月、フェルディナンド・マゼランは香料諸島への西回り航路を発見するため、スペイン王室との契約のもと、サンルーカル・デ・バラメダを出航した。遠征船団はトリニダード号、サン・アントニオ号、コンセプシオン号、ヴィクトリア号、サンティアゴ号の5隻で構成されていた。マゼランはポルトガル人航海士で、ポルトガルに仕えてインドとモルッカ諸島へ航海した経験があったが、ポルトガル王マヌエル1世に俸給の増額を拒否されたのち、スペイン王室に忠誠を移した。この航海は史上初の世界周航となるが、マゼラン自身はその完遂を見ることなく没した。"
 circumnavigation_expedition_outcome_overview: "$BULLET$世界で初めて世界周航を成し遂げた国は、以下を獲得する：\n$BULLET_WITH_TAB$[prestige|e]#G +100#!\n$BULLET_WITH_TAB$[legitimacy|e]#G +10#!\n$BULLET_WITH_TAB$[modifier|e]「[ShowModifier('first_circumnavigation')]」\n$BULLET$世界周航を完遂した国は、いずれも以下を獲得する：\n$BULLET_WITH_TAB$[prestige]#G +10#!\n$BULLET_WITH_TAB$3隻以上の船を帰還させた場合、さらに#G +10#!\n$BULLET_WITH_TAB$乗組員の士気が高い場合、さらに#G +5#!\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')]を[ShowAreaName('moluccas_area')]で集め、市場価格で売却して得た[gold|e]"
 circumnavigation_expedition_low_morale_prestige_tt: "乗組員の士気が低いと、威信の獲得量が減少する"
 circumnavigation_expedition_high_morale_prestige_tt: "乗組員の士気が高いと、威信の獲得量が増加する"
 morale: "乗組員の士気"
 morale_desc: "乗組員の気力。士気が低いと反乱の危険が生じる。"
 provisions: "食料"
 provisions_desc: "旅に必要な食べ物と水。道中絶えず消費され、底を突くと一行が危険に晒される。"
 num_ships: "船"
 num_ships_desc: "艦隊に残っている船。1隻も残っていない場合、その遠征隊は失われる。"
 cargo: "積み荷"
 cargo_desc: "船旅のあいだ、船に積まれている貴重品。艦隊が帰還した際に市場で売られる。"
 cape_route_to_india_expedition: "喜望峰を経由するインド航路"
 cape_route_to_india_expedition_desc: "艦隊をアフリカ沿岸に沿って南下させ、南端の大岬を回らせる。オスマンの通行税もヴェネツィアの仲介商人もすべて迂回し、香料諸島へ至る海路を切り開くのだ。その航路は過酷を極める。2年にわたって外洋と未知の沿岸を進み、船を散り散りにする嵐にも耐えなければならない。だが、最初にこの航路を開いた国は、世界の香辛料貿易を掌握するだろう。"
 cape_route_to_india_expedition_historical_info: "$india$への海路を探すポルトガルの遠征は、1世紀近くにわたって段階的にアフリカ沿岸を南下してきた探検の集大成だった。バルトロメウ・ディアスは1488年に喜望峰を回り、この航路が実現可能であることを証明していた。ヴァスコ・ダ・ガマは1497～99年の航海で使命を果たし、遠征費の60倍に相当するコショウと香辛料を持ち帰った。この航海は世界の香辛料貿易を根本から変え、陸上交易路におけるヴェネツィアとオスマンの独占を打ち破った。"
 cape_route_to_india_expedition_outcome_overview: "$BULLET$アフリカ沿岸の各寄港地には[ShowBuildingTypeName('por_feitoria')]を設立できる。領有者のいない港では、[ShowBuildingTypeName('por_trading_post')]を設立して[location|e]を直接領有することもでき、いずれの場合もそれぞれ長期間持続する交易[modifier|e]を得る。\n$BULLET$[ShowLocationName('kozhikode')]に到達すると、[ShowModifier('calicut_trade_rights')]と船倉一杯の[ShowGoodsName('pepper')]を獲得し、後者は市場価格で売却されて[gold|e]となる。\n$BULLET$航路を完成させると以下を獲得する：\n$BULLET_WITH_TAB$[prestige|e]#G +20#!。\n$BULLET_WITH_TAB$[legitimacy|e]#G +10#!。\n$BULLET_WITH_TAB$恒久的な[modifier]「[ShowModifier('cape_route_pioneer')]」。ただし、フェイトリアを3ヵ所設立した場合は「[ShowModifier('portuguese_african_network')]」、5ヵ所設立した場合は「[ShowModifier('east_africa_trade_dominance')]」を代わりに得る。"
 cape_route_to_india_expedition_low_morale_prestige_tt: "乗組員の士気が低いと、威信の獲得量が減少する"
 cape_route_to_india_expedition_high_morale_prestige_tt: "乗組員の士気が高いと、威信の獲得量が増加する"
 grand_tour_expedition: "グランドツアー"
 grand_tour_expedition_desc: "わが国の後継者は、[ShowRegionName('italy_region')]の大都市、すなわち[ShowLocationName('florence')]、[ShowLocationName('rome')]、[ShowLocationName('venice')]、[ShowLocationName('naples')]をめぐる長旅に出て、[ShowInstitutionName('renaissance')]の本場で学ぶ。帰還した後継者は、旅立ったときとは別人になっている。何を、誰から学んだか、そのすべてが王位を継ぐ者の人格を形作るのだ。"
 grand_tour_expedition_historical_info: "グランドツアーは、ヨーロッパの若い貴族をイタリア各地に長期の教育旅行へ送り出す慣行である。15世紀から16世紀にかけて徐々に成立し、17世紀には北ヨーロッパの貴族社会で正式な制度となった。フィレンツェ、ローマ、ヴェネツィア、ナポリが定番の巡遊路を形成し、それぞれが北方の宮廷にはないものを提供した。人文主義の学問、古典古代、ルネサンス期の芸術庇護、そしてヨーロッパ最古の王室宮廷における儀礼である。参加者には、国内の家庭教師のもとでは得られない国政と外交の素養を身につけ、別人のようになって帰国することが期待された。"
 grand_tour_expedition_outcome_overview: "$BULLET$訪れた都市はそれぞれ、選んだ行動に応じて知識、人脈、経験のいずれかを積み重ね、学問に費やした時間には[research_progress|e]を、宮廷で過ごした時間には[legitimacy|e]をもたらす。\n$BULLET$[ShowRegionNameWithNoTooltip('italy_region')]の偉大な都市のうち少なくとも三つに到達すれば、以下が与えられる：\n$BULLET_WITH_TAB$最も高くなった値に応じて、[ShowTraitName('free_thinker')]、[ShowTraitName('well_connected')]、あるいは[ShowTraitName('worldly')]のいずれか。\n$BULLET_WITH_TAB$永続する[ShowModifier('returned_from_grand_tour')]の[modifier|e]。\n$BULLET_WITH_TAB$#G +10#! [prestige|e]。\n$BULLET$より短い巡遊では#G +5#! [prestige]のみが得られ、[trait|e]は得られない。"
 grand_tour_expedition_heir_completed_tt: "後継者がまだグランドツアーを完了していない"
 grand_tour_expedition_stalled_status: "滞在中"
 gt_diligence: "勤勉さ"
 gt_diligence_desc: "後継者が巡遊からどれだけの学びを得られるかを表す。出発時の[ability|e]スコアをもとに設定される。後継者が勤勉であるほど、旅から多くのことを学び取れる。"
 knowledge: "知識"
 knowledge_desc: "巡遊中に図書館、講義、学者との交流などを通じて得た理論的な学び。知識の蓄積を何よりも重視して巡遊を終えた後継者は、[ShowTraitName('free_thinker')]となって帰ってくる。"
 connections: "人脈"
 connections_desc: "巡遊中に訪れた宮廷で構築した人間関係。人脈づくりを何よりも重視して巡遊を終えた後継者は、[ShowTraitName('well_connected')]のある人物となって帰ってくる。"
 experience: "経験"
 experience_desc: "巡遊中に工房、港、商館での体験から得た実践的な学び。多様な経験を積むことを何よりも重視して巡遊を終えた後継者は、世知に長けた人物となって帰ってくる。"
 grand_tour_cooldown: "グランドツアー"
 grand_embassy_expedition: "大使節団"
 grand_embassy_expedition_desc: "統治者を仮名で西欧諸国の宮廷へと送り出し、すでに近代化を済ませている各国の制度や陸海軍のあり方を学ぶ。王族として紹介された使節団は、盛大な宴と形だけの礼遇を受けられるが、真の身分を明かさずにおけば造船所や製図室にも入り込める。とはいえ、噂はすぐに広まるもので、あまりにも早い段階から統治者の正体を知られてしまうと、どこにも受け入れてもらえなくなる。"
 grand_embassy_expedition_outcome_overview: "$BULLET$旅のあいだ、使節団がいかに慎重に行動できるかで、各受け入れ先に真の目的を隠し通せる長さや、それが判明した際の宮廷の反応が変わる。\n$BULLET$どの宮廷を訪れても学びを得る機会が複数設けられ、そうした好機を通じて統治者自身の能力を向上させたり、近代化を深化させたり、あるいは「隠密度」を徐々に消耗させていくこととなる。\n$BULLET$使節団の任務が終了すると、蓄積された「近代化」の値によって、わが国が所有するあらゆるロケーションにおいて、[institutions|e]や[army_tradition|e]の進歩が促進され（首都はほかより進歩の度合いが大きい）、1ヵ所でも港を訪れていた場合は[navy_tradition|e]も同様に進歩する。\n$BULLET$使節団が宮廷に追い返された場合は[prestige|e]を消費するが、招き入れられた場合やさらなる使節の訪問を乞われた場合には[prestige|e]を獲得し、さらなる学びの機会も与えられる。"
 grand_embassy_expedition_institution_spread_tt: "所有するすべてのロケーションの内、目標値に達していない場所において、選択した制度を[GetVariable('grand_embassy_institution_progress_amount')|V0]進歩させる。首都では[GetVariable('grand_embassy_institution_progress_capital_amount')|V0]進歩する"
 grand_embassy_expedition_stalled_status: "学習中"
 discretion: "隠密度"
 discretion_desc: "使節団の真の目的や統治者の正体が広く知られることを、どれくらい防げているかを表す。90を超えている場合は、宮廷側が使節団をごく普通の使者とみなしているため、何一つ疑われずに済む。90以下になると、受け入れ先に何かしらの疑念を抱かれたか、あるいは独自の諜報網を通じて得た情報によって、「旅人」に扮している使節たちの正体を突き止められてしまう。"
 modernization: "近代化"
 modernization_desc: "西側のやり方を吸収することで、使節団のなかに蓄積された進歩の知識を表す。学習した内容ごとに数値が上がり、統治者が多くの学びを持ち帰るほどに、使節の目的を果たした際の報酬も大きくなる。"
 opportunities: "機会"
 opportunities_desc: "特定の宮廷から使節団に与えられた学習の機会を表す。新たに訪れた先で毎回リセットされ、そこで統治者がどれほど堂々と振る舞っていたかに応じ変動する。"
 pacific_crossing_expedition: "トルナビアヘを探して"
 pacific_crossing_expedition_desc: "アメリカ大陸の太平洋側の岸から艦隊を派遣して「トルナビアヘ」（世界最大の海を経由した安定的な復航路）を探す。貿易風によって船はいとも容易く西にあるアジアに向かって運ばれてしまうため、これに逆らって故郷に帰還しようとするあらゆる試みが失敗に終わっている。帰りの航路を海図に記すまでは、各植民地にも香料諸島にも手が届かないままだ。故郷への道を最初に見つけた国家は、アメリカ大陸とアジアをつなぎ、太平洋を横断する交易路を切り拓いて、ガレオン船を走らせることが可能になる。"
 pacific_crossing_expedition_historical_info: "東に戻るための復航路「トルナビアヘ」は、太平洋航海時代の初期において、答えの見つからない大きな問題だった。ヌエバ・エスパーニャからやってきたアルバロ・デ・サアベドラは、貿易風によって二度（1528年と1529年）船が押し戻され、突破口を見つけられないままこの世を去っており、またルイ・ロペス・デ・ビリャロボスも1542年にアジアに到達したものの、故郷に戻る道をついぞ見つけることができなかった。1565年になってようやく安定した復航路が発見されたが、それまでは艦隊がアジアにたどり着けても、積み荷を持ち帰ることは決してなかったのである。"
 pacific_crossing_expedition_outcome_overview: "$BULLET$[ShowContinentName('pacific_ocean_continent')]を越える帰路の開拓は以下をもたらす：\n$BULLET_WITH_TAB$#G +100#! [prestige|e]。\n$BULLET_WITH_TAB$#G +15#! [legitimacy|e]。\n$BULLET_WITH_TAB$永続する交易路の[modifier|e]。\n$BULLET_WITH_TAB$[ShowAreaName('moluccas_area')]で集めた[ShowGoodsName('cloves')]を、市場価格で[gold|e]に換金。\n$BULLET_WITH_TAB$永続的な[ShowDecisionName('charter_manila_galleon')]の[decision|e]への権利。五年ごとに再度行使でき、多大な[gold]の見返りを得られる。\n$BULLET$帰路を見出せなかった艦隊には何も得られない。"
 pacific_crossing_expedition_low_morale_prestige_tt: "乗組員の士気が低いと、威信の獲得量が減少する"
 pacific_crossing_expedition_high_morale_prestige_tt: "乗組員の士気が高いと、威信の獲得量が増加する"
 cartographic_survey_expedition: "沿岸調査"
 cartographic_survey_expedition_desc: "自国の沿岸に測量船を派遣して各地の港を地図に記し、浅瀬の水深の測定と危険個所の確認をおこなう。地味な作業ではあるが、そうしてできた地図は何世代も受け継がれていき、さらには今後の遠征の準備をより安く、より早く済ませられるようになる。"
 cartographic_survey_expedition_historical_info: "組織的な海岸調査が本格的に始まったのは、海上貿易の頻度が高まり、正確な海図が国家的な関心事となった16世紀からである。セビリアの通商院とポルトガルの「アルマゼム・ダ・ギネ・エ・インディア」（ギニアおよびインド倉庫）では、いずれも海図の作成と更新を担う公認の地図製作者を常駐させており、17世紀に入ってからは、オランダの海軍本部もそのあとに続いた。"
 cartographic_survey_expedition_outcome_overview: "$BULLET$調査が完了した[port|e]ごとに10～20年持続する[location_modifier|e]が1つ得られ、[ShowGoodsName('fish')]、[ShowGoodsName('pearls')]、[ShowGoodsName('amber')]などのうち、1品の生産量が増えたり、港そのものが拡充されたりするほか、[prestige|e]も獲得できる。\n$BULLET$また、3つ以上の港を調査すると以下を得られる：\n$BULLET_WITH_TAB$[modifier|e]「[ShowModifier('accurate_charts')]」（期間は15年）\n$BULLET_WITH_TAB$[prestige]#G +10#!\n$BULLET$調査した港が3つに満たない場合、[prestige]の増加量は#G +5#!となる。"
 cartographic_survey_cooldown: "沿岸調査"
 mining_survey_expedition: "高地の探鉱調査"
 mining_survey_expedition_desc: "高地にある自国領に探鉱者と試金者の隊を派遣して、川床を歩いて露頭をハンマーで打ち、貴金属が含まれる岩かを見極めてもらう。この丘陵地帯は以前に富をもたらしたことがあり、熟年の探鉱作業員が苦労して身につけた知識は、宮廷で1年推論を交わすよりも価値がある。"
 mining_survey_expedition_historical_info: "組織的な探鉱調査は、中世および近代前期のヨーロッパで盛んにおこなわれた。なかでも最も有名なのが、ザクセンとボヘミアにまたがるエルツ山地で実施されたもので、12世紀に銀の鉱脈が見つかったことをきっかけとして、フライベルク、ヤーヒモフ、シュネーベルクなどの新興都市が誕生した。また探査棒の使い方、小さな坩堝を使った鉱石標本の評価方法、鉱区の申請に関する法的慣行などを詳細に説明したゲオルク・アグリーコラの『デ・レ・メタリカ』（1556年出版）は探鉱の標準的な教本となった。"
 mining_survey_expedition_outcome_overview: "$BULLET$調査ごとに20年持続する「[ShowModifier('thorough_survey')]」の[modifier|e]が付与され、国内における原材料の生産量が上がる。\n$BULLET$当たりを引くごとに[ShowModifier('rich_silver_vein')]や[ShowModifier('rich_gold_strike')]などの豊かな鉱床が利用できるようになり、公然と作業をおこなえば[prestige|e]を、水面下で作業を進めた場合は[gold|e]を獲得できる。\n$BULLET$以下も獲得可能：\n$BULLET_WITH_TAB$2つ以上の当たりを引いたとき、[prestige]#G +10#!\n$BULLET_WITH_TAB$調査を実施した高地ごとに#G +5#!"
 mining_survey_cooldown: "高地の探鉱調査"
 relic_expedition: "遺物の探求"
 relic_expedition_desc: "[ShowLocationName('jerusalem')]に遠征隊を派遣し、さらにその先にある聖地を横断して、より広い[ShowRegionName('crescent_region')]へと出て行く。そうして訪れる先々で遺物の噂を追いかけることになるが、これらを手に入れるには忍耐と運が必要となる。"
 relic_expedition_historical_info: "中世および近代前期において、遺物の取引はかなり規模の大きい商取引であった。カトリックおよび正教社会が、いずれも権威ある遺物を手中に収めようと競い合っていたことから、各遺物は売却や交換、あからさまな窃盗行為を経て、何世紀ものあいだキリスト教世界のなかを移動しつづけてきた。十字軍国家が所有していた遺物は、とりわけこうした「取引」の対象となっており、1187年にヒッティーンで奪われた真の十字架はその後一度も回収に至っておらず、また1098年にアンティオキアで発見された聖槍も第1回十字軍のあと、ほどなくして歴史的記録からその名を消している。どちらも失われてから何百年ものあいだ、その所在に関する噂だけが流れつづけた。"
 relic_expedition_outcome_overview: "$BULLET$実際に発見される聖遺物は、運と探索の進み具合によって決まる。長らく失われていた真の十字架や聖槍そのものである場合もあれば、釘や骨、あるいは断片といったより控えめな聖遺物である場合もある。\n$BULLET$何が発見されるにせよ、それは我が国の首都へと持ち帰られる物理的な [work_of_art|e] となる。"
 clues: "手がかり"
 clues_desc: "遠征隊が遺物へと確実につながる情報までどれだけ近づいているのかを示す。単発の噂から始まり、追跡した手がかりごとに増減する。完全に行き詰った場合は、探索が打ち切られることもある。"
 hunt_retinue: "随行員"
 hunt_retinue_desc: "遠征隊の護衛、通訳、学術官など。自然に減少することはないものの、1人もいなくなってしまった場合は遠征隊が解散され、探求の旅は失敗に終わる。"
