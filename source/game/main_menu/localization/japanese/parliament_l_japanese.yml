 ### New Generic Parliament Issues – 1.2 Expansion ###
 ## Crown
 royal_monopoly_on_trade: "王室による交易独占"
 royal_monopoly_on_trade_desc: "わが国の商人たちは、長きにわたり商業の利益で私腹を肥やしてきた。主要品目に対する王室の独占権を確立することで、その収益を王冠の手に収め、王国全体の利益に資するようにする。"
 charter_subject_governors: "従属国総督の特許化"
 charter_subject_governors_desc: "遠隔地の従属国たちは、王室が到底対応しきれないほどの関心を求めている。王権を付与した正式な総督を任命することで、これらの土地に対する支配を強化し、その収益が確実に国庫に流れ込むようにする。"
 establish_colonial_administration: "植民地行政の確立"
 establish_colonial_administration_desc: "我々が国外に築いた植民地は、一攫千金を狙う者たちの気まぐれに任せるのではなく、わが国の正当な延長として統治されなければならない。これを実現するためには、適切な行政機構を確立する必要がある。"
 reform_the_royal_treasury: "王室財務の改革"
 reform_the_royal_treasury_desc: "無秩序な貨幣鋳造の拡大は物価を押し上げ、わが国の通貨価値を弱めている。王室財政の徹底的な監査と財務慣行の改革により、王国に健全な通貨を取り戻すことができる。"
 issue_royal_censure: "王室による問責状の発出"
 issue_royal_censure_desc: "わが国の競合勢力たちは、正式な非難なしには看過できない行動をとっている。この議会の権威に裏打ちされた王室による問責状は、我々がそのような行為を黙って容認することはないということを、万民に明らかにするだろう。"
 mandate_emergency_levies: "緊急徴収の義務化"
 mandate_emergency_levies_desc: "我々の戦争遂行には、国内の隅々からさらなる支援が必要である。王冠はこの試練を乗り越えるため、あらゆる階級と臣民に対し、可能な限りの貢献を求めるべきである。"
 fund_royal_art_patronage: "王室芸術保護への出資"
 fund_royal_art_patronage_desc: "わが国の偉大さは、軍隊や金銀だけでなく、生み出す芸術や文化によっても測られる。わが国の栄光を不朽のものとする芸術家や職人の後援に投資すべきだ。"
 ## Nobles
 institute_feudal_levies: "封建軍隊の制度化"
 institute_feudal_levies_desc: "あらゆる偉大な軍隊の背骨となるのは騎乗貴族である。貴族諸家の軍事的義務、とりわけ重騎兵を供出する義務を法的に定めることで、我々は戦場における戦力を強化する。"
 establish_military_exercises: "軍事演習の実施"
 establish_military_exercises_desc: "平時において、貴族の従者たちは軟弱になりがちである。定期的な野外演習や試合を義務付けることで、戦士たちの鋭さを維持し、戦いの呼び声に備え万全の態勢の軍隊を保つことができる。"
 establish_heralds_college: "紋章院の設立"
 establish_heralds_college_desc: "称号の優先順位、紋章の使用権、貴族の階級序列は、極めて重要な事項である。紋章院はこれらの事柄に秩序をもたらし、諸外国におけるわが国の威信を高めるだろう。"
 promote_chivalric_orders: "騎士団の振興"
 promote_chivalric_orders_desc: "わが騎士団は、高貴な武勇の美徳そのものである。王室による公認と資金援助を与えることで、王冠と最精鋭の戦士たちとの絆を強固なものとする。"
 license_noble_privateers: "貴族私掠船の認可"
 license_noble_privateers_desc: "海は勇気ある者に富をもたらし、貴族諸家は利益を得るために軍艦を装備するのに適した立場にある。私掠免許状を発行することで、彼らの事業に形態と正当性を与えると同時に、王冠は交易攪乱による利益を得ることができる。"
 monopolize_land_trade_routes: "陸上交易路の独占"
 monopolize_land_trade_routes_desc: "わが国の貴族たちは、あらゆる陸上交易が通過する街道、峠、橋を掌握している。彼らに陸路の商人への正式な通行料徴収権を認めることで、その利益を最も忠誠厚き臣下の手へともたらすのである。"
 fund_noble_colonization: "貴族植民事業への支援"
 fund_noble_colonization_desc: "わが国の名門貴族諸家には、植民地遠征に資金を提供するだけの資源と野心がある。我々は、これらの事業を特許状で認め、奨励することで、地平線の彼方までわが国の影響力を拡大すべきである。"
 grant_exclusive_hunting_rights: "狩猟独占権の付与"
 grant_exclusive_hunting_rights_desc: "わが国の森林と狩猟動物は、貴族の当然の領分である。これらを狩猟・管理する独占権を貴族に与えることで、領地との結びつきと王冠への忠誠心を強固なものとする。"
 establish_noble_garrison_law: "貴族駐屯地法の制定"
 establish_noble_garrison_law_desc: "社会不安がわが国を脅かしており、強力な地方駐屯軍なしにはこれを鎮圧することはできない。貴族諸家に対し、自らの領地内に要塞拠点を維持することを法で義務付け、王冠と国家を守る備えとさせる。"
 ## Clergy
 establish_clergy_charity: "聖職者による慈善事業の確立"
 establish_clergy_charity_desc: "有力な貴族の穀倉は満たされている一方で、わが民は飢えている。貧者や飢えた者たちへの救済することは教会の義務である。我々はいま、この義務を正式に定め、資金を拠出しなければならない。"
 launch_religious_missions: "宣教活動の開始"
 launch_religious_missions_desc: "わが国の多くの地域は、いまだ真の信仰の光に照らされていない。教会は宣教師を組織し派遣して、迷える魂を信仰のもとへ導かねばならず、我々はその成功に必要な支援を与えるべきである。"
 institute_canonical_law: "教会法の制定"
 institute_canonical_law_desc: "信仰において分裂した国家は、精神においても分裂した国家である。教会法を成文化し、諸州においてその統一的な適用を徹底することで、わが民を結びつける信仰の絆を強固なものとする。"
 establish_inquisition_courts: "異端審問所の設置"
 establish_inquisition_courts_desc: "異端の種はすでに根を下ろしており、教会裁判所による組織的な取り組みによってのみ、これを根絶することができる。感染がさらに広がる前に、迅速に行動しなければならない。"
 promote_religious_tolerance: "宗教的寛容の推進"
 promote_religious_tolerance_desc: "わが国には信仰をともにしてしない者も多く住んでおり、彼らの不満は不穏な情勢を招いている。絶え間ない対立よりも寛容によってこそ平和がもたらされることを認めるのが、教会の英知である。"
 fund_monastery_network: "修道院網への資金援助"
 fund_monastery_network_desc: "わが国の修道院は、学問、慈善、秩序の中心である。その善行が国の隅々まで届くよう、この修道院網を拡大し、適切な資金を拠出すべきである。"
 establish_pilgrimage_routes: "巡礼路の整備"
 establish_pilgrimage_routes_desc: "我々の信仰の聖地は、遠近問わず信徒を惹きつける。聖地へ続くこれらの道を正式に保護・維持することで、我々の敬虔さを示し、わが国に名声と威信をもたらすことができる。"
 regulate_tithe_collection: "十分の一税徴収の規制"
 regulate_tithe_collection_desc: "十分の一税の徴収は、不規則かつ争いの種となっている。わが国全土で教会の取り分を標準化することで、聖職者への公平かつ確実な収入を確保すると同時に、民衆からは不透明な負担の不安を取り除くことができる。"
 sponsor_theological_seminaries: "神学校への後援"
 sponsor_theological_seminaries_desc: "教養ある聖職者は、精神的に健全な国家の礎である。我々は、新世代の学識ある聖職者を育成するため、神学校の設立と拡大に資金を投じなければならない。"
 ## Burghers
 promote_export_trade: "輸出交易の振興"
 promote_export_trade_desc: "わが国の商人たちは、交易品を世界の果てまで運ぶ準備が整っているが、交易網拡大には議会の後押しが必要である。輸出交易への注力はわが国を豊かにし、国外における我々の立場を強固なものにするだろう。"
 establish_import_controls: "輸入規制の確立"
 establish_import_controls_desc: "他国製品の氾濫によって、わが国の生産者が脅かされることを許してはならない。市場に流入する品目に対して正式な規制を設けることで、わが国の産業を保護し、商人の競争力を維持する。"
 fund_trade_expeditions: "交易遠征への資金提供"
 fund_trade_expeditions_desc: "商人ギルドは、長距離の商業航海のために資本を集める準備ができているが、そのような事業には法の後ろ盾と、議会の支援による確信が必要である。"
 establish_commodity_exchange: "商品取引所の設立"
 establish_commodity_exchange_desc: "わが国の市場中心地は活気に満ちているが、大量の交易品を秩序立てて取引できる正式な取引所を欠いている。適切に設立された商品取引所があれば、我々の市場は近隣諸国の羨望の的となるだろう。"
 promote_maritime_trade: "海上交易の推進"
 promote_maritime_trade_desc: "海路は、それを利用する勇気ある者にとって富への街道である。我々は海上交易を支えるインフラと制度に投資し、わが国の商人が海を支配できるようにすべきである。"
 license_trading_companies: "交易会社の認可"
 license_trading_companies_desc: "遠距離交易のリスクと報酬は、一人の商人が背負うにはあまりに大きい。我々は正式な交易会社を認可し、資源を結集して集約しリスクを分散させ、国全体に利益をもたらすべきである。"
 establish_customs_houses: "税関の設置"
 establish_customs_houses_desc: "わが国の国境は管理が甘く、他国の商人たちは適切な申告なしに持ち込まれる交易品から利益を得ている。税関を建設することで、輸入品に秩序をもたらし、王冠とわが国の商人が正当な分け前を得られるようにする。"
 fund_artisan_guilds: "職人ギルドへの資金援助"
 fund_artisan_guilds_desc: "わが国の熟練した職人は並外れた品質の品々を生み出しているが、その潜在能力を最大限に発揮するための組織や支援が不足している。彼らを代表するギルドに対して資金援助をおこない、保護すべきである。"
 establish_trade_insurance: "交易保険の確立"
 establish_trade_insurance_desc: "難破、海賊、戦争といった交易のリスクは、わが国を豊かにするはずの事業から多くの商人を遠ざけている。正式な保険制度を整備することで、商人たちがより安心して交易をおこなえるようにする。"
 expand_postal_relay_network: "郵便中継網の拡大"
 expand_postal_relay_network_desc: "確実な通信は商業の生命線である。わが国の商家は、知らせや物資をかつてない速さで運ぶ中継網に資金を投じる用意がある。この投資は何倍もの利益となって返ってくるだろう。"
 ## Peasants
 establish_common_food_stores: "共同食糧備蓄庫の設立"
 establish_common_food_stores_desc: "わが民は、不作という残酷な運命に脆弱であり、飢えは絶望を生む。共同の食糧備蓄庫を設立することで、いかに厳しい飢饉が訪れようとも、民がなす術もなく放置されることがないようにする。"
 promote_farming_innovation: "農業革新の推進"
 promote_farming_innovation_desc: "輪作や耕作の新しい手法は、他国で目覚ましい成果を上げている。わが国全体でその導入を支援し、畑の収穫量を増やし、民が飢えに苦しむことを減らすべきである。"
 sponsor_irrigation_projects: "灌漑事業への後援"
 sponsor_irrigation_projects_desc: "わが国の土地の多くは、水さえ引ければより多くの収穫をもたらすことができる。水路や灌漑施設の建設に資金を投じ、乾いた土地を生産的な農地へと変貌させるべきである。"
 reduce_serfdom: "農奴制の緩和"
 reduce_serfdom_desc: "農奴制の束縛は庶民に重くのしかかり、彼らを土地に縛りつけ、我々すべてを支える労働そのものを阻害している。この負担を軽減し、移動の自由を拡大することで、わが民の忠誠心と生産性を高めることができる。"
 establish_village_councils: "村議会の設立"
 establish_village_councils_desc: "わが国の農村地域は、地元の実情を知りも顧みもしない遠方の領主によって統治されている。地方事務を管理する権限をもつ村議会を設立することで、わが民に発言の場を与え、秩序をより身近なものとできる。"
 charter_artisan_guilds: "職人ギルドの認可"
 charter_artisan_guilds_desc: "工房の親方や職人たちは、王室からの正式な承認を得ぬまま働いている。王国の職人組合にギルド特許状を与えることで、その取引を法的な秩序下に置き、我々の繁栄を支える彼らの好意を勝ち取ることができる。"
 subsidize_grain_imports: "穀物輸入の助成"
 subsidize_grain_imports_desc: "わが国の市場には民を養う手段があるが、それは穀物の価格が庶民の手の届く範囲に留まっている場合に限られる。穀物輸入に助成金を支給することで、食糧不足や飢餓が民を絶望へと追いやる事態を防ぐことができる。"
 rural_crafts_charter: "農村工芸憲章"
 rural_crafts_charter_desc: "都市のギルドによる独占は、農閑期の農家を支える家内工業を圧迫している。我々はこうした干渉から農村の職人を保護する憲章を定め、庶民に相応の経済的自由を与えるべきである。"
 prevent_noble_enclosure: "貴族による囲い込みの防止"
 prevent_noble_enclosure_desc: "この国の有力な貴族たちは、農民の生存の糧である共有地を、あまりにも長いあいだ奪いつづけてきた。その不満がより危険な事態に発展する前に、彼らに残されたわずかな土地を守るべく行動しなければならない。"
 ## Wartime
 declare_war_taxes: "戦時税の布告"
 declare_war_taxes_desc: "我々の戦争遂行には、通常の歳入では賄いきれないほどの資源を必要としている。議会は、すべての身分に対する非常徴税を承認しなければならない。これは王国の存続と栄光のために、すべての人々が分かち合うべき負担である。"
 wartime_cavalry_reserve: "戦時騎兵予備軍"
 wartime_cavalry_reserve_desc: "決定的な交戦はいつ起こってもおかしくない。我々は重騎兵をつねに万全の態勢に置かなければならない。戦争に勝利するまで、貴族諸家に対し、その精鋭たる騎馬戦士たちを常時警戒態勢に置くよう命じよ。"
 fortify_frontier_passes: "国境の峠の要塞化"
 fortify_frontier_passes_desc: "わが国の国境の強さは、敵が侵攻のために越えなければならない峠の堅牢さに左右される。我々は、あらゆる脆弱な峠の防御強化に資金を投じ、この地の自然の防壁を、侵攻を企てる者にとっての死地へと変えるべきである。"
 military_chaplaincy: "従軍司祭制度"
 military_chaplaincy_desc: "わが軍は王冠と祖国のためだけでなく、信仰と義務のために戦っている。聖職者を従軍司祭として配置することで、過酷な遠征下においても兵士の精神を支えることができる。"
 establish_field_hospitals: "野戦病院の設立"
 establish_field_hospitals_desc: "あまりにも多くの兵士が、敵の刃によってではなく、治療可能な負傷や予防可能な病によって命を落としている。教会に軍に随伴する移動式病院を組織させ、我々のために戦う者たちの命を救わせよう。"
 naval_supply_contracts: "海軍補給契約"
 naval_supply_contracts_desc: "わが艦隊は確実な補給なしに海に留まることはできず、商人ギルドはそれを提供する交易網を有している。艦隊への物資供給を彼らと正式に契約を結ぶことで、わが艦船が物資不足を恐れることなく戦えるようにする。"
 fund_siege_engineers: "攻城技術者への資金提供"
 fund_siege_engineers_desc: "敵の城壁は、それを崩す専門技術なくして陥落しない。市民ギルドは、いかに強固な要塞さえも攻略するために必要な専門技術者や攻城兵器への資金提供をおこなうことができる。"
 wartime_harvest_pooling: "戦時収穫物の集約"
 wartime_harvest_pooling_desc: "軍隊は食糧を糧として進軍するものであり、飢えた軍隊は満足に戦うことはできない。収穫の余剰分を地域の備蓄庫に集約する体制を整えることで、わが民は自分たちを守る軍隊を直接支えることができる。"
 supply_line_labor_draft: "補給路の労働徴発制度"
 supply_line_labor_draft_desc: "前線へ物資を運ぶ道は維持され、物資の輸送は絶え間なくおこなわれなければならない。わが民を補給路の労働に従事させることで、戦力に貢献させる。これは、剣を振るうことと同じくらい不可欠な貢献である。"
 ## Proximity
 royal_road_commission: "王立街道委員会"
 royal_road_commission_desc: "わが国を結ぶ街道は、権威と商業が流れる大動脈である。適切に維持された王立街道網を整備することで、我々の支配が領土の隅々まで迅速に届くようにする。"
 mountain_pass_charters: "山岳峠の特許状"
 mountain_pass_charters_desc: "わが国の貴族たちは、国を分断する山岳峠を支配している。これらの峠の維持と守備を彼らに特許状で義務づけることで、距離や地形によって諸州が王冠から孤立するのを防ぐことができる。"
 establish_parish_waypoints: "教区中継所の設置"
 establish_parish_waypoints_desc: "わが国内の街道は長く、その距離は使者にとっても旅人にとっても骨の折れるものである。主要街道沿いに教区中継所を設置することで、教会は領土を往来するすべての人々に休息、案内、そして支援を提供できる。"
 coastal_trading_post_network: "沿岸交易拠点網"
 coastal_trading_post_network_desc: "わが国の沿岸には天然の港や寄港地が存在するが、適切な施設が欠如しているため活用されていない。商人出資による沿岸交易拠点網は、海上交易の費用とリスクを低減し、遠方の諸州を首都に近づけるだろう。"
 rural_road_upkeep_corvee: "農村街道維持の賦役"
 rural_road_upkeep_corvee_desc: "わが国の農村の街道は組織的な維持管理が欠けているために荒廃している。地元の道を通行可能な状態に保つために農民世帯に対して適度な労役を課すことで、国内のいかなる地域も中心部から切り離されないようにする。"
