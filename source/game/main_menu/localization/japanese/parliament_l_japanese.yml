 ACCEPT_AGENDA_EFFECT: "[parliament|e]で$VAL|2+=%$の支持を得る。"
 IO_PARLIAMENT_TITLE: "[InternationalOrganizationsView.GetInternationalOrganization.GetNameWithNoTooltip]の議会"
 IO_PARLIAMENT_TOOLTIP: "[InternationalOrganizationsView.GetInternationalOrganization.GetName]の政治的決定の一部は、[parliament|e]で決定される必要がある。この[parliament_issues|e]はリーダー国が選ぶ場合もあるが、[international_organization|e]の過半数が賛成して初めて効力をもつ。"
 IO_PARLIAMENT_NON_VOTERS: "まだ投票していない"
 IO_PARLIAMENT_OPPOSERS: "反対者"
 IO_PARLIAMENT_VOTERS: "支持者"
 IO_PARLIAMENT_VOTED: "投票済み"
 IO_PARLIAMENT_VOTES_LEFT: "残り投票数："
