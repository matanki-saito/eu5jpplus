 ### New Generic Parliament Issues – 1.2 Expansion ###
 ## Crown
 royal_monopoly_on_trade: "Royal Monopoly on Trade"
 royal_monopoly_on_trade_desc: "The merchants of our realm have grown fat on the profits of commerce for long enough. By asserting a royal monopoly on key goods, we bring those revenues into the crown's hands, where they can serve the whole of the realm."
 charter_subject_governors: "Charter Subject Governors"
 charter_subject_governors_desc: "Our distant subjects demand attention that the crown can ill afford. By chartering formal governors with royal authority, we tighten our grip on these lands and ensure their revenues flow properly to our coffers."
 establish_colonial_administration: "Establish Colonial Administration"
 establish_colonial_administration_desc: "The colonies we have planted abroad must be governed as proper extensions of our realm, not left to the whims of fortune-seekers. We must establish proper administrative structures to make this so."
 reform_the_royal_treasury: "Reform the Royal Treasury"
 reform_the_royal_treasury_desc: "The unchecked expansion of minting has driven prices upward and weakened the value of our coin. A thorough audit of crown finances and reform of our treasury practices would restore sound money to the realm."
 issue_royal_censure: "Issue Royal Censure"
 issue_royal_censure_desc: "Our rivals have taken actions that cannot go without formal rebuke. A royal censure, backed by the authority of this parliament, would make plain to all that we will not suffer such conduct without response."
 mandate_emergency_levies: "Mandate Emergency Levies"
 mandate_emergency_levies_desc: "Our war effort stands in need of greater support from every corner of the realm. The crown must call upon all estates and subjects to contribute what they can to see us through this trial."
 fund_royal_art_patronage: "Fund Royal Art Patronage"
 fund_royal_art_patronage_desc: "The greatness of a realm is measured not only in armies and gold, but in the works of art and culture it produces. We should invest in the patronage of artists and craftsmen who will immortalize our dynasty's glory."
 ## Nobles
 institute_feudal_levies: "Institute Feudal Levies"
 institute_feudal_levies_desc: "The backbone of any great army is the mounted nobility. By formalizing the military obligations of our noble houses — particularly their obligation to furnish heavy cavalry — we strengthen our forces in the field."
 establish_military_exercises: "Establish Military Exercises"
 establish_military_exercises_desc: "Our noble retinues grow soft in times of peace. By mandating regular field exercises and tournaments, we ensure that our warriors remain sharp and our armies ready when the call to battle comes."
 establish_heralds_college: "Establish a Heralds' College"
 establish_heralds_college_desc: "The precedence of titles, the rights of coats of arms, and the order of noble rank are matters of great consequence. A heralds' college would bring order to these affairs and lend greater prestige to our realm abroad."
 promote_chivalric_orders: "Promote Chivalric Orders"
 promote_chivalric_orders_desc: "Our chivalric orders are the embodiment of noble martial virtue. By granting them royal recognition and funding, we strengthen the bonds between the crown and its finest warriors."
 license_noble_privateers: "License Noble Privateers"
 license_noble_privateers_desc: "The seas offer riches to the bold, and noble houses are well placed to outfit vessels of war for profit. By issuing letters of marque, we give form and legitimacy to their ventures while the crown benefits from the resulting trade disruption."
 monopolize_land_trade_routes: "Monopolize Land Trade Routes"
 monopolize_land_trade_routes_desc: "Our nobility controls the roads, the passes, and the bridges through which all land trade must flow. By granting them formal tolling rights over overland merchants, we channel those profits into the hands of our most loyal subjects."
 fund_noble_colonization: "Fund Noble Colonization"
 fund_noble_colonization_desc: "The great noble houses of our realm have the resources and the ambition to finance colonial expeditions. We should charter and encourage these ventures to extend our reach beyond the horizon."
 grant_exclusive_hunting_rights: "Grant Exclusive Hunting Rights"
 grant_exclusive_hunting_rights_desc: "The forests and game of the realm are the natural domain of the nobility. By granting them exclusive rights to hunt and manage these lands, we strengthen their bond to their estates and their loyalty to the crown."
 establish_noble_garrison_law: "Establish Noble Garrison Law"
 establish_noble_garrison_law_desc: "Unrest threatens our realm, and we cannot suppress it without strong local garrisons. Let the noble houses be required by law to maintain fortified positions in their domains, ready to defend crown and country."
 ## Clergy
 establish_clergy_charity: "Establish Clergy Charity"
 establish_clergy_charity_desc: "Our people go hungry while the granaries of great lords stand full. It is the duty of the Church to organize the relief of the poor and the hungry — a duty we must now formalize and fund."
 launch_religious_missions: "Launch Religious Missions"
 launch_religious_missions_desc: "Much of our realm yet lies outside the light of the true faith. The Church must organize and dispatch missionaries to bring those lost souls into the fold, and we shall give them the backing they need to succeed."
 institute_canonical_law: "Institute Canonical Law"
 institute_canonical_law_desc: "A realm divided in faith is a realm divided in spirit. By codifying church law and enforcing its uniform application across our provinces, we strengthen the bonds of faith that hold our people together."
 establish_inquisition_courts: "Establish Inquisition Courts"
 establish_inquisition_courts_desc: "The seeds of heresy have taken root, and only a systematic effort of Church courts can root them out. We must act swiftly before the contagion spreads further."
 promote_religious_tolerance: "Promote Religious Tolerance"
 promote_religious_tolerance_desc: "Our realm is home to many who do not share our faith, and their discontent breeds unrest. It is the wisdom of the Church to acknowledge that peace is better served by tolerance than by perpetual conflict."
 fund_monastery_network: "Fund a Monastery Network"
 fund_monastery_network_desc: "The monasteries of our realm are centers of learning, charity, and order. We should expand their network and endow them properly, that their good works may reach every corner of the realm."
 establish_pilgrimage_routes: "Establish Pilgrimage Routes"
 establish_pilgrimage_routes_desc: "The sacred sites of our faith draw the faithful from near and far. By formally protecting and maintaining the routes to these holy places, we show our piety and draw distinction and prestige to our realm."
 regulate_tithe_collection: "Regulate Tithe Collection"
 regulate_tithe_collection_desc: "The collection of tithes has grown irregular and contentious. By standardizing the church's share of income across the realm, we ensure fair and reliable revenue for the clergy while relieving the burden of uncertainty from our people."
 sponsor_theological_seminaries: "Sponsor Theological Seminaries"
 sponsor_theological_seminaries_desc: "A learned clergy is the foundation of a spiritually healthy realm. We must fund the establishment and expansion of seminaries to train a new generation of learned churchmen."
 ## Burghers
 promote_export_trade: "Promote Export Trade"
 promote_export_trade_desc: "Our merchants stand ready to carry our goods to the furthest corners of the world, but they need the backing of this parliament to expand their networks. A commitment to export trade will enrich the realm and strengthen our hand abroad."
 establish_import_controls: "Establish Import Controls"
 establish_import_controls_desc: "We must not allow the flood of foreign goods to undermine our own producers. By establishing formal controls on what enters our markets, we protect our industries and ensure our merchants remain competitive."
 fund_trade_expeditions: "Fund Trade Expeditions"
 fund_trade_expeditions_desc: "The merchant guilds stand ready to pool their capital for long-range commercial voyages, but such ventures require the backing of law and the confidence that comes from parliamentary support."
 establish_commodity_exchange: "Establish a Commodity Exchange"
 establish_commodity_exchange_desc: "Our market centers bustle with activity, but lack a formal exchange where bulk goods can be traded in an orderly fashion. A properly established commodity exchange would make our markets the envy of our neighbors."
 promote_maritime_trade: "Promote Maritime Trade"
 promote_maritime_trade_desc: "The sea lanes are highways of wealth for those bold enough to use them. We should invest in the infrastructure and institutions that support maritime commerce, and ensure our merchants command the waters."
 license_trading_companies: "License Trading Companies"
 license_trading_companies_desc: "The risks and rewards of long-distance trade are too great for any single merchant to bear alone. We should license formal trading companies to pool resources and share those risks, to the benefit of the realm as a whole."
 establish_customs_houses: "Establish Customs Houses"
 establish_customs_houses_desc: "Our borders are porous, and foreign merchants profit from goods that enter our realm without proper accounting. By building customs houses, we impose order on our imports and ensure the crown and our merchants take their proper share."
 fund_artisan_guilds: "Fund Artisan Guilds"
 fund_artisan_guilds_desc: "The skilled craftsmen of our realm produce goods of extraordinary quality, but they lack the organisation and support to reach their full potential. We should fund and protect the guilds that represent them."
 establish_trade_insurance: "Establish Trade Insurance"
 establish_trade_insurance_desc: "The risks of trade — shipwreck, banditry, war — deter many a merchant from the ventures that would enrich the realm. By creating formal insurance schemes, we allow our merchants to trade with greater confidence."
 expand_postal_relay_network: "Expand the Postal Relay Network"
 expand_postal_relay_network_desc: "Reliable communication is the lifeblood of commerce. Our merchant houses are willing to finance a network of relay stations that would carry messages and goods faster than ever before — an investment that would repay itself many times over."
 ## Peasants
 establish_common_food_stores: "Establish Common Food Stores"
 establish_common_food_stores_desc: "Our people are vulnerable to the cruel turns of bad harvests, and hunger breeds desperation. By establishing community grain stores, we ensure that no famine, however harsh, can leave our people without recourse."
 promote_farming_innovation: "Promote Farming Innovation"
 promote_farming_innovation_desc: "New methods of crop rotation and cultivation have shown remarkable results in other lands. We should support their adoption across our realm, that our fields may yield more abundantly and our people suffer less from want."
 sponsor_irrigation_projects: "Sponsor Irrigation Projects"
 sponsor_irrigation_projects_desc: "Much of our realm's land could yield far greater harvests if only water could be brought to it. We should fund the construction of waterways and irrigation works that will transform dry land into productive farmland."
 reduce_serfdom: "Reduce Serfdom"
 reduce_serfdom_desc: "The bonds of serfdom weigh heavily on the common folk, binding them to the land and stifling the very labor that sustains us all. By easing these burdens and granting greater freedom of movement, we strengthen the loyalty and productivity of our people."
 establish_village_councils: "Establish Village Councils"
 establish_village_councils_desc: "Our rural communities are governed by distant lords who neither know nor care for local needs. By establishing village councils with the authority to manage local affairs, we give our people a voice and bring order closer to home."
 charter_artisan_guilds: "Charter Artisan Guilds"
 charter_artisan_guilds_desc: "The masters and journeymen of our workshops toil without formal recognition from the crown. By granting guild charters to the craft brotherhoods of the realm, we bring their trades under lawful order and earn the goodwill of those whose hands sustain our prosperity."
 subsidize_grain_imports: "Subsidize Grain Imports"
 subsidize_grain_imports_desc: "Our markets hold the means to feed our people, but only if the price of grain remains within reach of ordinary folk. By subsidizing grain imports, we ensure that shortage and want do not drive our people to desperation."
 rural_crafts_charter: "Rural Crafts Charter"
 rural_crafts_charter_desc: "The guild monopolies of our towns crush the cottage industries that sustain rural families through lean seasons. We should charter and protect rural craftsmen from such interference, giving the common folk the economic freedom they deserve."
 prevent_noble_enclosure: "Prevent Noble Enclosure"
 prevent_noble_enclosure_desc: "The great lords of the realm have for too long seized the common lands that our peasants depend upon for their survival. We must act to protect what little they have left, before that unrest becomes something far more dangerous."
 ## Wartime
 declare_war_taxes: "Declare War Taxes"
 declare_war_taxes_desc: "Our war effort demands resources beyond what ordinary revenue can provide. Parliament must authorise emergency levies on all estates — a burden shared by all for the survival and glory of the realm."
 wartime_cavalry_reserve: "Wartime Cavalry Reserve"
 wartime_cavalry_reserve_desc: "The decisive engagement may come at any moment, and we must ensure our heavy cavalry are in a state of full readiness. Let the noble houses commit their finest mounted warriors to a state of constant alert until the war is won."
 fortify_frontier_passes: "Fortify Frontier Passes"
 fortify_frontier_passes_desc: "Our borders are only as strong as the passes our enemies must cross to reach us. We should fund the hardening of every vulnerable crossing — turning the natural defenses of the land into killing grounds for any who dare invade."
 military_chaplaincy: "Military Chaplaincy"
 military_chaplaincy_desc: "Our armies fight not only for crown and country, but for faith and duty. By embedding clergy as chaplains within our forces, we sustain the spirit of our soldiers under the hardships of campaign."
 establish_field_hospitals: "Establish Field Hospitals"
 establish_field_hospitals_desc: "Too many of our soldiers die not from enemy blades but from wounds that could be treated, and sickness that could be prevented. Let the Church organize mobile hospitals to follow our armies and save the lives of those who fight for us."
 naval_supply_contracts: "Naval Supply Contracts"
 naval_supply_contracts_desc: "Our fleet cannot remain at sea without reliable supply, and the merchant guilds have the networks to provide it. By contracting them formally to keep the fleet provisioned, we ensure our ships can fight without fear of running short."
 fund_siege_engineers: "Fund Siege Engineers"
 fund_siege_engineers_desc: "The walls of our enemies will not fall without the expertise to bring them down. Our burgher guilds can finance specialist engineers and the siege equipment needed to reduce even the strongest fortifications."
 wartime_harvest_pooling: "Wartime Harvest Pooling"
 wartime_harvest_pooling_desc: "Our armies march on their stomachs, and a hungry army does not fight well. By organizing the pooling of harvest surpluses into regional magazines, our people can directly sustain the forces that defend them."
 supply_line_labor_draft: "Supply Line Labor Draft"
 supply_line_labor_draft_desc: "The roads that carry our supplies to the front must be maintained and our materiel moved without cease. Our people can serve the war effort through labor on the supply lines — a contribution as vital as any sword arm."
 ## Proximity
 royal_road_commission: "Royal Road Commission"
 royal_road_commission_desc: "The roads that connect our realm are the arteries through which authority and commerce flow. By commissioning a proper network of maintained royal roads, we ensure that our control reaches swiftly to every corner of our lands."
 mountain_pass_charters: "Mountain Pass Charters"
 mountain_pass_charters_desc: "Our noble houses stand astride the mountain passes that divide our realm. By chartering them to maintain and garrison these crossings, we ensure that distance and terrain no longer isolate our provinces from the crown."
 establish_parish_waypoints: "Establish Parish Waypoints"
 establish_parish_waypoints_desc: "The roads of our realm are long and the distances wearying for courier and traveler alike. By establishing parish stations along key routes, the Church can provide rest, guidance, and support to all who move through our lands."
 coastal_trading_post_network: "Coastal Trading Post Network"
 coastal_trading_post_network_desc: "Our coasts offer natural harbors and stopping points that go unused for lack of proper facilities. A merchant-funded network of coastal trading posts would reduce the costs and risks of maritime commerce and bring distant provinces closer to the capital."
 rural_road_upkeep_corvee: "Rural Road Upkeep Corvée"
 rural_road_upkeep_corvee_desc: "Our rural roads fall into disrepair for want of organized maintenance. By requiring a modest corvée of labor from peasant households to keep local roads passable, we ensure that no part of the realm is cut off from the center."
