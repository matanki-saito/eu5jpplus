 BASE_SPECIAL_STATUS_SUPPORT: "支持状況"
 EXTRA_SUPPORT_INFO_FOR_IO_ISSUE: "#T [PARLIAMENT_ISSUE.GetSpecialStatus.GetNameWithNoTooltip]の議題#!\n[PARLIAMENT_ISSUE.GetSpecialStatus.GetName]をもつメンバーがこの議題を支持しているため、この議題を選択すると議会の支持が$VAL|2+=%$増加する。"
 PARLIAMENT_START: "議論の#Y 開始#!："
 PARLIAMENT_IF_SUCCESS: "議題が#G 可決#!された場合："
