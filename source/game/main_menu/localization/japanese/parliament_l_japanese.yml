 ACTIVE_PARLIAMENT_SUPPORT_POWER: "基本[estate_power|e]は$VAL|2G$で、以下の補正を受ける："
 ACTIVE_PARLIAMENT_SUPPORT_IMPORTANCE: "協議事項の重要度：$VAL|2+=%$"
