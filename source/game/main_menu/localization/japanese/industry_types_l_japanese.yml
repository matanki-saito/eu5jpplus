l_japanese:
 textiles: "織物"
 textiles_desc: "一般的な毛織物から上質な高級生地までを生産する製織作業。織物産業を支援することで、国全体の生地の需要が増え、指定地域における織工の地位の確立や工房設立の速度が速まる。"
 crafts: "工芸"
 crafts_desc: "職人やギルドによる道具、加工鋼、革製品、石細工の制作。町の手工業の基盤となるもの。"
 arms: "武器"
 arms_desc: "兵器の製造。時が経過すると銃器や大砲も生産されるようになる。支援を受けた軍需産業は、国内の鍛冶場から軍隊に武器を提供しつづけることができる。"
 luxury: "高級品"
 luxury_desc: "ガラス、宝石、磁器、漆器などの高価な工芸品。これらを製造する技能を究めた市民に富をもたらす、名誉ある産業。"
 paper_goods: "紙製品"
 paper_goods_desc: "製紙所や書物の印刷など。商業を発展させるだけでなく、識字率や行政の質も高めることができる。"
 furnishings: "家具"
 furnishings_desc: "あらゆる階級の世帯で用いられる家具や陶器。"
 naval: "海軍用品"
 naval_desc: "海軍の物資やタールなど、艦隊の編成と維持に必要な材料。"
 beverages: "飲料"
 beverages_desc: "ワイン、酒、ビールなど。供給できる地域を潤してくれる、需要の絶えない市場。"
 game_industry_type_struct: "$KEY_LOC$"
 game_industry_promotion_struct: "$KEY_LOC$"
 game_concept_industry_promotion: "産業の振興"
 game_concept_industry_promotions: "産業の振興"
 game_concept_promote_industry: "産業を振興"
 game_concept_industry_promotion_desc: "産業の振興は、ひとつの[area|e]を単一の産業部門に割り当てるものです。各産業は一連の[goods|e]を対象とし、これを振興すると、その[area]でそれらの[goods]を生産するすべての[building|e]の[output|e]が上昇し、さらに[country|e]全体で[pops|e]がそれらに対して持つ需要も高まります。\n\n産業の振興を行うには、[advance_icon][ShowAdvanceName('industry_promotion_advance')]の[advance|e]が必要です。同時に振興できる産業の数は$MODIFIER_TYPE_NAME_possible_industry_promotions$によって決まり、これは[country]の階級や[government_reforms|e]、そして後には[advances]によって増加します。振興はいつでも取り消して、その枠を空けることができます。"
 industry_promotion: "産業の振興"
 PROMOTE_INDUSTRY_HEADER: "振興中の産業"
 BROWSE_INDUSTRIES: "産業を閲覧"
 BROWSE_INDUSTRIES_DESC: "振興可能なすべての産業を確認し、工業化する [area|e] を選びましょう。"
 INDUSTRY_STAT_AREA_TT_TITLE: "[Area.GetNameWithNoTooltip] におけるこの産業"
 INDUSTRY_STAT_BUILDINGS_TT_TEXT: "@area![Area.GetName]にある[GetAreaIndustryLevels(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|W0]の[buildings_with_icon|e]は、現在[GetAreaIndustryTaxBase(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2]の[tax_base_with_icon|e]と[GetAreaIndustryIncome(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2]の[income_with_icon|e]を生産しています。"
 INDUSTRY_SLOT_STATS_TT_TEXT: "この産業の[goods|e]から[IndustryPromotionSlot.GetAreaName]で生産するもの："
 BEST_CANDIDATE: "最も生産性の高いエリアは [Area.GetNameWithNoTooltip] です"
 BEST_CANDIDATE_DESC: "この区分において現在最も生産性の高い [area_with_icon|e] は [Area.GetName] で、総計 [GetAreaIndustryLevels(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|0W] の [buildings_with_icon|e] から [GetAreaIndustryTaxBase(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] の [tax_base_with_icon|e] と [GetAreaIndustryIncome(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] の [income_with_icon|e] を産出しています。"
