 #######################################
 #   Non-production Rights    ##########
 #######################################
 staple_port: "指定商港"
 staple_port_desc: "この[location|e]には法的特権が与えられており、[ShowEstateTypeName('burghers_estate')]は当地の[trade|e]に対しより大きな権利を持つ。"
 granary_town: "穀倉町"
 granary_town_desc: "この[location|e]には、[food|e]の生産と備蓄を増やすため、法的特権と規定を与えられている。"
 #######################################
 #   Production Rights    ##############
 #######################################
 royal_tooling_rights: "工具特権"
 royal_tooling_rights_desc: "この[location|e]には、[ShowGoodsName('tools')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_jewelry_rights: "宝飾特権"
 royal_jewelry_rights_desc: "この[location|e]には、[ShowGoodsName('jewelry')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_weaponry_rights: "兵器特権"
 royal_weaponry_rights_desc: "この[location|e]には、[ShowGoodsName('weaponry')]、[ShowGoodsName('firearms')]、[ShowGoodsName('cannons')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_book_rights: "印刷特権"
 royal_book_rights_desc: "この[location|e]には、[ShowGoodsName('paper')]、[ShowGoodsName('books')]、[ShowGoodsName('dyes')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_artisan_rights: "工芸特権"
 royal_artisan_rights_desc: "この[location|e]には、[ShowGoodsName('leather')]、[ShowGoodsName('pottery')]、[ShowGoodsName('furniture')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_brewing_rights: "酒類特権"
 royal_brewing_rights_desc: "この[location|e]には、[ShowGoodsName('liquor')]、[ShowGoodsName('beer')]、[ShowGoodsName('wine')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_textile_rights: "織物特権"
 royal_textile_rights_desc: "この[location|e]には、[ShowGoodsName('cloth')]および[ShowGoodsName('fine_cloth')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 royal_naval_rights: "海軍需品特権"
 royal_naval_rights_desc: "この[location|e]には、[ShowGoodsName('naval_supplies')]および[ShowGoodsName('tar')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 not_forcefully_revoked_last_10_years_tt: "過去10年間、都市特権が強制的に取り消されたことがない。"
 royal_masonry_rights: "石工特権"
 royal_masonry_rights_desc: "この[location|e]には、[ShowGoodsName('masonry')]と[ShowGoodsName('glass')]の生産と流通に関する法的特権が与えられており、競争上大きく優位な立場にある。"
 #######################################
 #   Historic Rights    ################
 #######################################
 magdeburg_rights_town_rights: "$magdeburg_rights$"
 magdeburg_rights_town_rights_desc: "$magdeburg_rights_desc$"
 unlock_mageburg_town_rights_tt: "[town_rights]「[ShowTownRightsName('magdeburg_rights_town_rights')]」と「[ShowTownRightsName('nuremberg_rights_town_rights')] 」をアンロックする"
 lubeck_town_rights: "[ShowLocationNameWithNoTooltip('lubeck')]の権利"
 lubeck_town_rights_desc: "わが国の都市部の法律と特権を[ShowLocationName('lubeck')]にならって調整すれば、商人たちはさらなる力を得られる。交易をおこなう商人たちにとっては有利に働くが、その一方で都市のギルドの構成員たちはこの優遇を不満に思い、なんらかの形で妨害してくるだろう。"
 town_rights_marketplace: "市場に関する都市特権"
 nuremberg_rights_town_rights: "[ShowLocationNameWithNoTooltip('nuremberg')]の権利"
 nuremberg_rights_town_rights_desc: "$magdeburg_rights_town_rights_desc$"
 upper_bergregal: "上位鉱業特権"
 upper_bergregal_desc: "鉱山の採掘権を都市政府に譲渡すれば、新たな鉱物を探すための資金が増え、新しく移住を考える者への魅力も高まる。ただ残念ながら、地元の平民に対する規制が厳しくなり、平民が鉱山から直接利益を得る機会は減ってしまう。"
 unlock_bergregal_rights_tt: "[town_rights]「[ShowTownRightsName ('upper_bergregal')]」と「[ShowTownRightsName('lower_bergregal')]」をアンロックする"
 lower_bergregal: "下位鉱業特権"
 lower_bergregal_desc: "$upper_bergregal_desc$"
 stapelrecht_town_rights: "[ShowSpecialStatusNameWithNoTooltip('free_city')]の互市強制権"
 stapelrecht_town_rights_desc: "[ShowSpecialStatusName('emperor')]から与えられた[ShowSpecialStatusName('free_city')]の地位により、都市内で一定の特権を行使できるようになる。これにより地元商人は利益を得られるほか、より多くの他国の商人に我々の領地を通じた交易を強いることができる。"
 kulm_town_rights: "クルム権"
 kulm_town_rights_desc: "$kulm_law_desc$"
 unlock_kulm_town_rights_tt: "[town_rights]「[ShowTownRightsName('kulm_town_rights')] [town_rights]」をアンロックする"
 novi_fori_town_rights: "$novi_fori$権"
 novi_fori_town_rights_desc: "$novi_fori_desc$"
 unlock_novi_fori_rights_tt: "[town_rights]「[ShowTownRightsName('novi_fori_town_rights')]」をアンロックする"
 royal_free_cities_town_rights: "王領自由都市の特権"
 royal_free_cities_town_rights_desc: "わが国の都市部を王領自由都市と宣言することで、都市内の[ShowEstateTypeName('nobles_estate')]が力を付けるのを防げる。"
 bohemian_royal_cities_town_rights: "王領都市の特権"
 bohemian_royal_cities_town_rights_desc: "自らは統治者の直轄財産であると宣言できる権利を都市に与えることで、[ShowEstateTypeName('nobles_estate')]を弱体化させつつ、国家が都市から直接より多くの富を得られるようになる。"
 swedish_city_rights: "スタッズレッティゲーターの権利"
 swedish_city_rights_desc: "このロケーションの商人は広範な特権を得て、他国との競争に晒されることなく交易をおこなえるようになる。"
 norwegian_city_rights: "ショープスタッドの権利"
 norwegian_city_rights_desc: "このロケーションの商人に特権を与えて交易路を活発化させつつ、他国の商人は冷遇する。"
 borough_customals: "自治区の慣習法集"
 borough_customals_desc: "この権利を与えられたロケーションは自律的に発展できるようになり、貴族の圧政を受けない自由な場所となる。"
 manorial_customals: "荘園の慣習法集"
 manorial_customals_desc: "このロケーションの荘園領主により強い行政権を与えることで、土地の活用を進めつつ、従順でない農民たちを抑制できるようになる。"
 foros_extensos_town_rights: "フォロス・エクステンソス"
 foros_extensos_town_rights_desc: "成立以来、$POR$は辺境の地であり、ジェラルド・セン・パヴォルのような名高い人物を輩出してきた。その支配者たちは、この勇敢さと不屈の精神を奨励するため、一般に$foros_extensos_town_rights$と呼ばれる幅広い特権を付与している。"
 fuero_juzgo_town_rights: "フエロ・フスゴ"
 fuero_juzgo_town_rights_desc: "$fuero_juzgo_town_rights$は、古代西ゴート法典である『リベル・イウディキオルム』に基づいている。そのため、日常生活の多くの側面を規定しており、新たに開拓された土地に特に適している。"
 fuero_real_town_rights: "フエロ・レアル"
 fuero_real_town_rights_desc: "$fuero_real_town_rights$は、カスティーリャ王アルフォンソ10世によって制定された法典であり、$CAS$の諸都市に王権を広く及ぼすことを目的としている。"
 fuero_general_town_rights: "フエロ・ヘネラル"
 fuero_general_town_rights_desc: "$NAV$の$fuero_general_town_rights$は、その統治者との合意のもとで、領土内の各階級を統治する慣習および法をまとめたものである。"
 fuero_de_aragon_town_rights: "フエロス・デ・アラゴン"
 fuero_de_aragon_town_rights_desc: "$fuero_de_aragon_town_rights$は、$aragon_area$が拡大するとともに広がった各種の地方特権をまとめたものである。そのため、これらは$nobles_estate$と$peasants_estate$の両方から強く擁護されている。"
 usatges_de_barcelona_town_rights: "ウサッジェス・デ・バルセロナ"
 usatges_de_barcelona_town_rights_desc: "$usatges_de_barcelona_town_rights$は、$barcelona$の伯爵たちによって最初に制定および付与された、$catalan$の領土を統治する慣習と伝統である。"
 furs_de_valencia_town_rights: "フールス・デ・ヴァレンシア"
 furs_de_valencia_town_rights_desc: "$furs_de_valencia_town_rights$は、アラゴン王ハイメ1世によるヴァレンシア王国征服後、同国に与えられた。$aragon_area$や$catalonia_area$の古い慣習との主な違いは、一部地域で多数を占める$muslim_ADJ$住民との共存を規定する点にある。"
 flemish_cloth_industries_right: "フランドル織物業"
 flemish_cloth_industries_right_desc: "中世後期、低地諸国で一大織物産業が生まれた。$ENG_ADJ$や$CAS_ADJ$から輸入された羊毛を原料として、最高級の毛織物が生産され、$europe$全土へ輸出された。"
 ville_franche_town_rights: "ヴィルフランシュ権"
 ville_franche_town_rights_desc: "$villes_franches_desc$"
 unlock_ville_franche_town_rights_tt: "[town_rights]「[ShowTownRightsName('ville_franche_town_rights')]」をアンロックする"
 borgo_franco_town_rights: "ボルゴ・フランコ権"
 borgo_franco_town_rights_desc: "$italy_region$全体にコムーネが広がっていることは事実であり、それが地域の基盤を形成している。これらはしばしば「ボルゴ・フランコ」（自由都市）とみなされ、農村部よりも多くの特権を享受している。"
 #######################################
 #   Scandinavian Rights    ############
 #######################################
 scandinavian_fishing_privileges: "漁業特権"
 scandinavian_fishing_privileges_desc: "この[location|e]には、近隣の漁場と干魚・塩漬け魚の取引に関する独占権が与えられている。こうした特権のもとで発展したノルウェー沿岸の町々は、北ヨーロッパ各地に[ShowGoodsName('fish')]を供給した。"
 scandinavian_bergslag_privileges: "鉱山共同体特権"
 scandinavian_bergslag_privileges_desc: "国王はこの[location|e]を鉱山共同体として認め、当地の鉱石採掘に関する共同の権利、独自の法廷、兵役徴集の免除を与えている。鉱山の[ShowEstateTypeName('peasants_estate')]は、一般の町の[ShowEstateTypeName('peasants_estate')]より高い法的地位にある。"
 scandinavian_tar_privileges: "タール特権"
 scandinavian_tar_privileges_desc: "この[location|e]には、王領林から[ShowGoodsName('tar')]と[ShowGoodsName('naval_supplies')]を採取し、輸出する権利が与えられている。これらの林産業は、バルト海の造船を支える供給網の基盤である。"
 scandinavian_thing_rights: "議会開催権"
 scandinavian_thing_rights_desc: "この[location|e]には、正式な議会開催権が与えられている。これにより、住民は統治と裁きのための公認の場を持つ。王権はその分制限されるが、住民はより忠実で規律正しくなる。"
 #Byzantine / Greek / Roman
 imperial_breadbasket_rights: "帝国のパン籠"
 imperial_breadbasket_rights_granary_tt: "Has a [ShowBuildingTypeName('granary')] at maximum level."
 imperial_breadbasket_rights_desc: "この[location|e]は広範な領土への食糧供給の役目を負っており、我々の野心的な計画に対応するためその穀物倉は拡張されている。穀物は帝国の監督のもとで内外へと流通し、市民と軍の双方を豊かに支えている。"
 constantinopolitan_silk_monopoly_rights: "[ShowLocationNameWithNoTooltip('constantinople')]による絹の独占"
 constantinopolitan_silk_monopoly_rights_desc: "[ShowLocationName('constantinople')]には、高品質の[ShowGoodsName('silk')]を何世代にもわたり生産してきた長い歴史がある。工房は帝国の監督のもとで繁栄しているが、その生産はすべて独占の体制に従っておこなわれている。"
 scholai_literacy_rights: "スコライの特権"
 scholai_literacy_rights_desc: "この[location|e]は学問の中心地として認められており、公的な庇護のもとで学芸が育まれている。知識は迅速に広まるが、こうした営みが国庫を潤すことはほとんどない。それでも何かに打ち込ませるほうがよいのだ。暇を持て余した精神は悪魔の遊び場なのだから。"
 municipia_privilegia: "ムニキピウムの特権"
 municipia_privilegia_desc: "この[location|e]はムニキピウムの地位に昇格しており、その市民は我々の法のもとで権利を与えられている。地方のエリート層はより大きな影響力を持ち、その地を[ShowSocietyDirectionName('latinization')]の伝統へと一層結びつけている。"
