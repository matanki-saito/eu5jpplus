name: test

on:
  repository_dispatch:
    types: [ test ]
  workflow_dispatch:
    inputs:
      name:
        description: 'Description'
        required: false

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ 3.10.8 ]
    steps:
      - uses: actions/checkout@v3

      - name: Open TCP ports 27015-27050
        shell: powershell
        run: netsh advfirewall firewall add rule name="Open27015-27050TCP" dir=in action=allow protocol=TCP localport=27015-27050

      - name: Open UDP ports 27000-27100
        shell: powershell
        run: netsh advfirewall firewall add rule name="Open27000-27100UDP" dir=in action=allow protocol=UDP localport=27000-27100

      - name: Open UDP ports 4380
        shell: powershell
        run: netsh advfirewall firewall add rule name="Open4380UDP" dir=in action=allow protocol=UDP localport=4380


      - name: Get steamcmd
        run: |
          curl https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip --output steamcmd.zip
          Expand-Archive -Path steamcmd.zip

      - name: run
        run: |
          cd steamcmd
          steamcmd.exe commandline +quit
        shell: cmd
        continue-on-error: true

      - name: run
        run: |
          cd steamcmd
          ls
          cd public
          ls -l
          cd ..          
          cd logs
          ls -l
          echo "console"
          cat console_log.txt
          echo "connection"
          cat connection_log.txt
          echo "configstore"
          cat configstore_log.txt
          echo "bootstrap"
          cat bootstrap_log.txt
          netstat -ano
        shell: cmd
        continue-on-error: true