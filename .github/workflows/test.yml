name: test

on:
  repository_dispatch:
    types: [ test ]
  workflow_dispatch:
    inputs:
      name:
        description: 'Description'
        required: false

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ 3.10.8 ]
    permissions:
      actions: write
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Update pip
        run: |
          python -m pip install --upgrade pip

      - name: Install boto3
        run: |
          pip install boto3

      - name: Install requests
        run: |
          pip install requests

      - name: Get steamcmd
        run: |
          curl https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip --output steamcmd.zip
          Expand-Archive -Path steamcmd.zip

      - name: Set credentials
        run: |
          python download_credentials.py
        env:
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}

      - name: login steam
        run: python extract_localization_files.py

        env:
          STEAM_LOGIN_NAME: ${{ secrets.STEAM_LOGIN_NAME }}
          STEAM_LOGIN_PASSWORD: ${{ secrets.STEAM_LOGIN_PASSWORD }}
          STEAMCMD_PATH: ${{ secrets.STEAMCMD_PATH }}
          APPID: ${{ secrets.APPID }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          STEAM_GAME_DIR: ${{ secrets.STEAM_GAME_DIR }}
          SOURCE_DIR: ${{ secrets.SOURCE_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        continue-on-error: true
        shell: cmd